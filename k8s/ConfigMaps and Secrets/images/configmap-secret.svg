<svg xmlns="http://www.w3.org/2000/svg" width="960" height="471" viewBox="0 0 960 471" role="img" aria-labelledby="title desc">
<title id="title">Separate ordinary settings from sensitive values</title>
<desc id="desc">A ConfigMap supplies a log level and a Secret supplies a password to the same application Pod. Secrets still require encryption and access controls.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 18px; fill: #52677b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .small { font-size: 16px; fill: #52677b; } .connector { fill: none; stroke: #52677b; stroke-width: 2.5; stroke-linejoin: round; }</style></defs>
<!-- Canvas and lesson heading. -->
<rect width="960" height="471" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">Separate ordinary settings from sensitive values</text>
<text x="32" y="75" class="subtitle" text-anchor="start">Both objects supply configuration independently of the container image.</text>
<!-- Configuration sources: colors reinforce explicit text labels. -->
<rect id="configmap" x="32" y="110" width="350" height="144" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="207.0" y="141" class="heading" text-anchor="middle">ConfigMap</text>
<text x="207.0" y="170" class="body" text-anchor="middle">Non-confidential settings</text>
<text x="207.0" y="195" class="body" text-anchor="middle">Example: LOG_LEVEL=info</text>
<rect id="secret" x="578" y="110" width="350" height="144" rx="12" fill="#fff7ed" stroke="#e4b78a" stroke-width="1.5"/>
<text x="753.0" y="141" class="heading" text-anchor="middle">Secret</text>
<text x="753.0" y="170" class="body" text-anchor="middle">Sensitive values</text>
<text x="753.0" y="195" class="body" text-anchor="middle">Example: database password</text>
<!-- Each configuration source feeds the Pod; arrows avoid the central caption. -->
<rect id="application-pod" x="319" y="304" width="322" height="79" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
<text x="480.0" y="335" class="heading" text-anchor="middle">Application Pod</text>
<text x="480.0" y="364" class="body" text-anchor="middle">Reads environment or files</text>
<path id="configmap-to-pod-shaft" class="connector" data-connector="true" d="M 207 254 L 207 344 L 311 344"/>
<polygon id="configmap-to-pod-head" points="319,344 309,349 309,339" fill="#52677b"/>
<path id="secret-to-pod-shaft" class="connector" data-connector="true" d="M 753 254 L 753 344 L 649 344"/>
<polygon id="secret-to-pod-head" points="641,344 651,339 651,349" fill="#52677b"/>
<text x="480" y="427" class="body" text-anchor="middle">Secret data in base64 is readable by anyone who can retrieve it.</text>
<text x="480" y="455" class="small" text-anchor="middle">Configure encryption at rest and restrict access; base64 is not encryption.</text>
</svg>
