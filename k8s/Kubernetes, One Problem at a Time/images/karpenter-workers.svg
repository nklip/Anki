<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">Karpenter changes the number of worker machines</title><desc id="desc">Before: three worker nodes have no spare requested capacity and a new Pod is unschedulable. Karpenter launches a fourth suitable node within configured rules. The Kubernetes scheduler assigns the Pod after the node is ready. Later consolidation can remove or replace unneeded nodes when policy allows.</desc>
<!-- Shared definitions for the article's resource and scaling diagrams. -->
<defs><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 18px; fill: #52677b; }
.heading { font-size: 21px; font-weight: 700; }
.body { font-size: 18px; }
.small { font-size: 16px; fill: #52677b; }
.bold { font-size: 18px; font-weight: 700; }
.connector { fill: none; stroke: #52677b; stroke-width: 2.5; }
</style></defs>
<!-- Lesson and canvas. -->
<rect width="960" height="510" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">Karpenter changes the number of worker machines</text>
<text x="32" y="77" class="subtitle" text-anchor="start">Example: HPA requested more Pods, but the existing nodes cannot fit them.</text>
<!-- Before: all three worker nodes lack room for a new Pod request. -->
<rect id="before" x="32" y="110" width="320" height="274" rx="12" fill="#fff7ed" stroke="#d9ab72" stroke-width="1.5"/><text x="52" y="145" class="heading" text-anchor="start">Before: 3 worker nodes</text><rect id="old-node-1" x="52" y="177" width="84" height="67" rx="7" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="94" y="204" class="bold" text-anchor="middle">Node 1</text><text x="94" y="229" class="small" text-anchor="middle">Full</text><rect id="old-node-2" x="150" y="177" width="84" height="67" rx="7" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="192" y="204" class="bold" text-anchor="middle">Node 2</text><text x="192" y="229" class="small" text-anchor="middle">Full</text><rect id="old-node-3" x="248" y="177" width="84" height="67" rx="7" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="290" y="204" class="bold" text-anchor="middle">Node 3</text><text x="290" y="229" class="small" text-anchor="middle">Full</text><text x="52" y="269" class="small" text-anchor="start">Requested capacity is full.</text><rect id="waiting" x="52" y="291" width="280" height="69" rx="7" fill="#fff7ed" stroke="#d9ab72" stroke-width="1.5"/><text x="72" y="320" class="bold" text-anchor="start">New Pod waits</text><text x="72" y="345" class="small" text-anchor="start">No existing node can fit it.</text><!-- Provisioning selects capacity within the NodePool rules. -->
<rect id="karpenter" x="392" y="170" width="176" height="150" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/><text x="480" y="206" class="heading" text-anchor="middle">Karpenter</text><text x="480" y="239" class="body" text-anchor="middle">Checks rules;</text><text x="480" y="266" class="body" text-anchor="middle">launches a</text><text x="480" y="293" class="body" text-anchor="middle">suitable node.</text><!-- After: existing worker count increases by one in this illustrative case. -->
<rect id="after" x="608" y="110" width="320" height="274" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="628" y="145" class="heading" text-anchor="start">After: 4 worker nodes</text><rect id="kept-node-1" x="628" y="177" width="84" height="67" rx="7" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="670" y="204" class="bold" text-anchor="middle">Node 1</text><text x="670" y="229" class="small" text-anchor="middle">Kept</text><rect id="kept-node-2" x="726" y="177" width="84" height="67" rx="7" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="768" y="204" class="bold" text-anchor="middle">Node 2</text><text x="768" y="229" class="small" text-anchor="middle">Kept</text><rect id="kept-node-3" x="824" y="177" width="84" height="67" rx="7" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="866" y="204" class="bold" text-anchor="middle">Node 3</text><text x="866" y="229" class="small" text-anchor="middle">Kept</text><rect id="added-node" x="628" y="266" width="280" height="94" rx="7" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="648" y="297" class="bold" text-anchor="start">Node 4 · new worker</text><text x="648" y="326" class="body" text-anchor="start">Scheduler assigns the Pod</text><text x="648" y="348" class="small" text-anchor="start">after the node is ready.</text><!-- waiting-to-karpenter: shaft ends inside the separate triangle base. --><path id="waiting-to-karpenter-shaft" class="connector" data-connector="true" d="M352 245 L384 245"/><polygon id="waiting-to-karpenter-head" points="392,245 382,239 382,251" fill="#52677b"/><!-- karpenter-to-new-node: shaft ends inside the separate triangle base. --><path id="karpenter-to-new-node-shaft" class="connector" data-connector="true" d="M568 245 L600 245"/><polygon id="karpenter-to-new-node-head" points="608,245 598,239 598,251" fill="#52677b"/><!-- Scale-down is conditional, not an immediate inverse of every scale-up. -->
<rect id="consolidation" x="32" y="412" width="896" height="78" rx="12" fill="#faf5ff" stroke="#bda7d6" stroke-width="1.5"/><text x="52" y="444" class="heading" text-anchor="start">Later: consolidation may remove or replace unneeded nodes.</text><text x="52" y="470" class="small" text-anchor="start">NodePool rules, available cloud capacity, and disruption controls still apply.</text>
</svg>
