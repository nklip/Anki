<svg xmlns="http://www.w3.org/2000/svg" width="960" height="458" viewBox="0 0 960 458" role="img" aria-labelledby="title desc">
<title id="title">HPA adjusts how many application Pods you want</title><desc id="desc">Three Pods each request 500 millicpu and use an average of 700 millicpu, giving 140 percent utilization. With an HPA target of 70 percent, the simplified desired replica count is six. HPA updates the Deployment replica count and the ReplicaSet creates additional Pods.</desc>
<!-- Shared definitions for the article's resource and scaling diagrams. -->
<defs><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 18px; fill: #52677b; }
.heading { font-size: 21px; font-weight: 700; }
.body { font-size: 18px; }
.small { font-size: 16px; fill: #52677b; }
.bold { font-size: 18px; font-weight: 700; }
.connector { fill: none; stroke: #52677b; stroke-width: 2.5; }
</style></defs>
<!-- Lesson and canvas. -->
<rect width="960" height="458" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">HPA adjusts how many application Pods you want</text>
<text x="32" y="77" class="subtitle" text-anchor="start">CPU utilization is measured against requests. 500m means half of one CPU.</text>
<!-- Measured use is divided by the request, not by the CPU limit. -->
<rect id="metrics" x="32" y="110" width="272" height="202" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/><text x="52" y="145" class="heading" text-anchor="start">1  Observe 3 Pods</text><text x="52" y="184" class="body" text-anchor="start">Each requests 500m CPU.</text><text x="52" y="211" class="body" text-anchor="start">Average usage: 700m.</text><text x="52" y="253" class="bold" text-anchor="start">Utilization = 140%</text><text x="52" y="286" class="small" text-anchor="start">700 ÷ 500 × 100</text><!-- HPA chooses a desired replica count; it does not add machines. -->
<rect id="hpa" x="354" y="110" width="252" height="202" rx="12" fill="#faf5ff" stroke="#bda7d6" stroke-width="1.5"/><text x="374" y="145" class="heading" text-anchor="start">2  HPA compares</text><text x="374" y="184" class="body" text-anchor="start">Target: 70% of request</text><text x="374" y="223" class="bold" text-anchor="start">140% ÷ 70% = 2</text><text x="374" y="261" class="body" text-anchor="start">Desired count doubles.</text><text x="374" y="288" class="small" text-anchor="start">Example with valid metrics.</text><!-- Deployment and ReplicaSet create the extra Pods after the desired count changes. -->
<rect id="replicas" x="656" y="110" width="272" height="202" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="676" y="145" class="heading" text-anchor="start">3  Request 6 Pods</text><text x="676" y="184" class="body" text-anchor="start">HPA updates Deployment;</text><text x="676" y="211" class="body" text-anchor="start">ReplicaSet creates Pods.</text><rect id="pod-1" x="676" y="232" width="66" height="26" rx="5" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="709" y="251" class="small" text-anchor="middle">Pod 1</text><rect id="pod-2" x="754" y="232" width="66" height="26" rx="5" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="787" y="251" class="small" text-anchor="middle">Pod 2</text><rect id="pod-3" x="832" y="232" width="66" height="26" rx="5" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="865" y="251" class="small" text-anchor="middle">Pod 3</text><rect id="pod-4" x="676" y="266" width="66" height="26" rx="5" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="709" y="285" class="small" text-anchor="middle">Pod 4</text><rect id="pod-5" x="754" y="266" width="66" height="26" rx="5" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="787" y="285" class="small" text-anchor="middle">Pod 5</text><rect id="pod-6" x="832" y="266" width="66" height="26" rx="5" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/><text x="865" y="285" class="small" text-anchor="middle">Pod 6</text><!-- metrics-to-hpa: shaft ends inside the separate triangle base. --><path id="metrics-to-hpa-shaft" class="connector" data-connector="true" d="M304 218 L346 218"/><polygon id="metrics-to-hpa-head" points="354,218 344,212 344,224" fill="#52677b"/><!-- hpa-to-replicas: shaft ends inside the separate triangle base. --><path id="hpa-to-replicas-shaft" class="connector" data-connector="true" d="M606 218 L648 218"/><polygon id="hpa-to-replicas-head" points="656,218 646,212 646,224" fill="#52677b"/><!-- Equation and scope qualify the otherwise simplified controller decision. -->
<rect id="calculation" x="32" y="344" width="896" height="94" rx="12" fill="#ffffff" stroke="#a5b4c2" stroke-width="1.5"/><text x="52" y="380" class="heading" text-anchor="start">Simplified rule: desired replicas = ceil(3 × 140 / 70) = 6</text><text x="52" y="412" class="small" text-anchor="start">HPA = Horizontal Pod Autoscaler. Real decisions also use bounds, readiness, and stabilization.</text>
</svg>
