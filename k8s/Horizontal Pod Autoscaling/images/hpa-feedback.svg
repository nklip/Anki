<svg xmlns="http://www.w3.org/2000/svg" width="960" height="459" viewBox="0 0 960 459" role="img" aria-labelledby="title desc">
<title id="title">HPA adjusts the desired number of Pods</title>
<desc id="desc">Three Pods average 80 percent CPU utilization against a 60 percent target. The simplified formula requests four replicas, then the loop measures again.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 18px; fill: #52677b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .small { font-size: 16px; fill: #52677b; } .connector { fill: none; stroke: #52677b; stroke-width: 2.5; stroke-linejoin: round; }</style></defs>
<!-- Canvas and lesson heading. -->
<rect width="960" height="459" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">HPA adjusts the desired number of Pods</text>
<text x="32" y="75" class="subtitle" text-anchor="start">Horizontal Pod Autoscaler example with complete, valid CPU metrics.</text>
<!-- Observation, decision, and requested outcome form one feedback loop. -->
<rect id="observed-metrics" x="32" y="112" width="272" height="113" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="168.0" y="143" class="heading" text-anchor="middle">Observe</text>
<text x="168.0" y="172" class="body" text-anchor="middle">3 Pods</text>
<text x="168.0" y="197" class="body" text-anchor="middle">Average utilization: 80%</text>
<rect id="hpa-controller" x="344" y="112" width="272" height="113" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="480.0" y="143" class="heading" text-anchor="middle">HPA compares</text>
<text x="480.0" y="172" class="body" text-anchor="middle">Target: 60%</text>
<text x="480.0" y="197" class="body" text-anchor="middle">ceil(3 × 80 / 60) = 4</text>
<rect id="desired-replicas" x="656" y="112" width="272" height="113" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
<text x="792.0" y="143" class="heading" text-anchor="middle">Request</text>
<text x="792.0" y="172" class="body" text-anchor="middle">4 replicas</text>
<text x="792.0" y="197" class="body" text-anchor="middle">Workload creates a Pod</text>
<path id="metrics-shaft" class="connector" data-connector="true" d="M 304 170 L 336 170"/>
<polygon id="metrics-head" points="344,170 334,175 334,165" fill="#52677b"/>
<path id="scale-request-shaft" class="connector" data-connector="true" d="M 616 170 L 648 170"/>
<polygon id="scale-request-head" points="656,170 646,175 646,165" fill="#52677b"/>
<!-- Return path uses a lower corridor; the arrow ends below the observation box. -->
<path id="feedback-shaft" class="connector" data-connector="true" d="M 792 225 L 792 328 L 168 328 L 168 233"/>
<polygon id="feedback-head" points="168,225 173,235 163,235" fill="#52677b"/>
<text x="480" y="283" class="body" text-anchor="middle">CPU utilization = usage ÷ CPU request</text>
<text x="480" y="365" class="body" text-anchor="middle">Measure again as the new Pods start and the workload changes.</text>
<text x="480" y="408" class="small" text-anchor="middle">Real decisions also apply tolerance, readiness, stabilization, and scaling policies.</text>
<text x="480" y="438" class="small" text-anchor="middle">ceil = round up. HPA does not add nodes; new Pods still need available capacity.</text>
</svg>
