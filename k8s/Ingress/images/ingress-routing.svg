<svg xmlns="http://www.w3.org/2000/svg" width="800" height="667" viewBox="0 0 800 667"
     role="img" aria-labelledby="title desc">
  <title id="title">Routing a web request with Ingress</title>
  <desc id="desc">A browser requests either example.com/users or example.com/orders.
    The Ingress controller configures a proxy or load balancer to route requests for
    example.com. Its rules map /users to users-service and /orders to orders-service.
    A Pod running the matching application answers the request.</desc>

  <!-- Use dashed violet for configuration and solid blue for requests. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .title { font-size: 35px; font-weight: 700; }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 23px; }
      .config-text { font-size: 23px; fill: #654387; }
      .request-text { font-size: 23px; fill: #214f82; }
      .panel { stroke-width: 2; }
      .traffic { fill: none; stroke: #315e8e; stroke-width: 3; }
      .config { fill: none; stroke: #76558e; stroke-width: 3; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <!-- The browser and the rule declaration have separate inputs to the proxy. -->
  <rect width="800" height="667" fill="#fff"/>
  <text x="28" y="48" text-anchor="start" class="title">Routing a web request with Ingress</text>
  <g id="browser">
    <rect x="28" y="80" width="354" height="158" rx="12" fill="#eff6ff" stroke="#94b3d8" class="panel"/>
    <text x="50" y="122" text-anchor="start" class="heading">Browser</text>
    <text x="50" y="157" text-anchor="start" class="body">Sends one request to</text>
    <text x="50" y="189" text-anchor="start" class="body">example.com/users</text>
    <text x="50" y="221" text-anchor="start" class="body">or example.com/orders</text>
  </g>
  <g id="ingress-rules">
    <rect x="402" y="80" width="370" height="158" rx="12" fill="#faf5ff" stroke="#b9a2cf" class="panel"/>
    <text x="424" y="122" text-anchor="start" class="heading">Ingress rules</text>
    <text x="424" y="157" text-anchor="start" class="body">For the host example.com</text>
    <text x="424" y="189" text-anchor="start" class="config-text">/users → users-service</text>
    <text x="424" y="221" text-anchor="start" class="config-text">/orders → orders-service</text>
  </g>

  <!-- Both tips meet the proxy border. The shafts stop inside their triangle bases. -->
  <g id="proxy-inputs">
    <path id="browser-request-shaft" class="traffic" d="M104 239 V333"/>
    <polygon points="104,343 97,330 111,330" fill="#315e8e"/>
    <text x="122" y="296" text-anchor="start" class="request-text">Web request</text>
    <path id="controller-configuration-shaft" class="config" d="M461 239 V333"/>
    <polygon points="461,343 454,330 468,330" fill="#76558e"/>
    <text x="480" y="281" text-anchor="start" class="config-text">Ingress controller</text>
    <text x="480" y="312" text-anchor="start" class="config-text">applies the rules</text>
  </g>
  <g id="proxy">
    <rect x="48" y="344" width="704" height="90" rx="12" fill="#eaf2fc" stroke="#6f95c2" class="panel"/>
    <text x="400" y="382" text-anchor="middle" class="heading">Proxy / load balancer</text>
    <text x="400" y="415" text-anchor="middle" class="body">Matches the request’s host and path to one Service.</text>
  </g>

  <!-- Each branch is an alternative for example.com. Grouping the Service with
       its Pod avoids implying a mandatory hop through a Service IP address. -->
  <g id="route-choices">
    <path id="users-route-shaft" class="traffic" d="M111 435 V513"/>
    <polygon points="111,523 104,510 118,510" fill="#315e8e"/>
    <text x="130" y="487" text-anchor="start" class="request-text">Path /users</text>
    <path id="orders-route-shaft" class="traffic" d="M485 435 V513"/>
    <polygon points="485,523 478,510 492,510" fill="#315e8e"/>
    <text x="504" y="487" text-anchor="start" class="request-text">Path /orders</text>
  </g>
  <g id="users-backend">
    <rect x="28" y="524" width="354" height="119" rx="12" fill="#effaf3" stroke="#8db69c" class="panel"/>
    <text x="50" y="560" text-anchor="start" class="heading">users-service</text>
    <text x="50" y="596" text-anchor="start" class="body">A Pod running the users app</text>
    <text x="50" y="626" text-anchor="start" class="body">answers the request.</text>
  </g>
  <g id="orders-backend">
    <rect x="402" y="524" width="370" height="119" rx="12" fill="#effaf3" stroke="#8db69c" class="panel"/>
    <text x="424" y="560" text-anchor="start" class="heading">orders-service</text>
    <text x="424" y="596" text-anchor="start" class="body">A Pod running the orders app</text>
    <text x="424" y="626" text-anchor="start" class="body">answers the request.</text>
  </g>
</svg>
