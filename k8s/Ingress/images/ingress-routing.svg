<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title desc">
<title id="title">Ingress rules need a controller to become routing</title>
<desc id="desc">An Ingress object provides rules to an Ingress controller. It configures a proxy or load balancer. Client requests pass through that proxy to the backend represented by a Service.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 18px; fill: #52677b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .small { font-size: 16px; fill: #52677b; } .connector { fill: none; stroke: #52677b; stroke-width: 2.5; stroke-linejoin: round; }</style></defs>
<!-- Canvas and lesson heading. -->
<rect width="960" height="475" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">Ingress rules need a controller to become routing</text>
<text x="32" y="75" class="subtitle" text-anchor="start">Example route: shop.example.com/catalog → catalog Service.</text>
<!-- Configuration lane; the API object does not carry request traffic. -->
<rect id="ingress-object" x="130" y="106" width="285" height="80" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="272.5" y="137" class="heading" text-anchor="middle">Ingress object</text>
<text x="272.5" y="166" class="body" text-anchor="middle">Host and path rules</text>
<rect id="ingress-controller" x="545" y="106" width="285" height="80" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="687.5" y="137" class="heading" text-anchor="middle">Ingress controller</text>
<text x="687.5" y="166" class="body" text-anchor="middle">Reads the routing rules</text>
<path id="read-configuration-shaft" class="connector" data-connector="true" d="M 415 146 L 537 146"/>
<polygon id="read-configuration-head" points="545,146 535,151 535,141" fill="#52677b"/>
<!-- Traffic lane; controller-managed proxy implements the declared rules. -->
<rect id="http-client" x="32" y="304" width="208" height="78" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="136.0" y="335" class="heading" text-anchor="middle">Client</text>
<text x="136.0" y="364" class="body" text-anchor="middle">Web request</text>
<rect id="ingress-proxy" x="340" y="282" width="305" height="122" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
<text x="492.5" y="313" class="heading" text-anchor="middle">Proxy / load balancer</text>
<text x="492.5" y="342" class="body" text-anchor="middle">Applies host/path rules</text>
<text x="492.5" y="367" class="body" text-anchor="middle">Routes matching requests</text>
<rect id="backend-service" x="736" y="304" width="192" height="78" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="832.0" y="335" class="heading" text-anchor="middle">Service</text>
<text x="832.0" y="364" class="body" text-anchor="middle">catalog</text>
<path id="configure-proxy-shaft" class="connector" data-connector="true" d="M 688 186 L 688 234 L 493 234 L 493 274"/>
<polygon id="configure-proxy-head" points="493,282 488,272 498,272" fill="#52677b"/>
<text x="710" y="224" class="small" text-anchor="start">configures</text>
<path id="incoming-request-shaft" class="connector" data-connector="true" d="M 240 343 L 332 343"/>
<polygon id="incoming-request-head" points="340,343 330,348 330,338" fill="#52677b"/>
<path id="backend-request-shaft" class="connector" data-connector="true" d="M 645 343 L 728 343"/>
<polygon id="backend-request-head" points="736,343 726,348 726,338" fill="#52677b"/>
<text x="480" y="448" class="small" text-anchor="middle">Logical path to the Service backend; forwarding details depend on the controller.</text>
</svg>
