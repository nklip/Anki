<svg xmlns="http://www.w3.org/2000/svg" width="960" height="443" viewBox="0 0 960 443" role="img" aria-labelledby="title desc">
<title id="title">A Service identity stays stable while Pods change</title>
<desc id="desc">A client reaches a stable Service name and IP. The network routes to ready matching Pods. EndpointSlices record current backend membership.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 18px; fill: #52677b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .small { font-size: 16px; fill: #52677b; } .connector { fill: none; stroke: #52677b; stroke-width: 2.5; stroke-linejoin: round; }</style></defs>
<!-- Canvas and lesson heading. -->
<rect width="960" height="443" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">A Service identity stays stable while Pods change</text>
<text x="32" y="75" class="subtitle" text-anchor="start">Typical selector-based Service: only eligible ready backends receive normal traffic.</text>
<!-- Logical client-to-backend path, separate from Pod creation. -->
<rect id="client" x="32" y="163" width="208" height="102" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="136.0" y="194" class="heading" text-anchor="middle">Client</text>
<text x="136.0" y="223" class="body" text-anchor="middle">Uses Service name</text>
<rect id="service" x="302" y="163" width="278" height="102" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="441.0" y="194" class="heading" text-anchor="middle">Service</text>
<text x="441.0" y="223" class="body" text-anchor="middle">Stable name and IP</text>
<rect id="backends" x="670" y="108" width="258" height="228" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
<text x="799" y="143" class="heading" text-anchor="middle">Matching Pods</text>
<rect x="695" y="167" width="208" height="54" rx="12" fill="#ffffff" stroke="#86b89a" stroke-width="1.5"/>
<text x="799" y="202" class="body" text-anchor="middle">Pod A · ready</text>
<rect x="695" y="251" width="208" height="54" rx="12" fill="#ffffff" stroke="#86b89a" stroke-width="1.5"/>
<text x="799" y="286" class="body" text-anchor="middle">New Pod · ready</text>
<!-- Network routing fans out; triangles touch only destination boundaries. -->
<path id="client-service-shaft" class="connector" data-connector="true" d="M 240 214 L 294 214"/>
<polygon id="client-service-head" points="302,214 292,219 292,209" fill="#52677b"/>
<path id="route-a-shaft" class="connector" data-connector="true" d="M 580 214 L 630 214 L 630 194 L 687 194"/>
<polygon id="route-a-head" points="695,194 685,199 685,189" fill="#52677b"/>
<path id="route-new-shaft" class="connector" data-connector="true" d="M 580 214 L 630 214 L 630 278 L 687 278"/>
<polygon id="route-new-head" points="695,278 685,283 685,273" fill="#52677b"/>
<text x="799" y="237" class="small" text-anchor="middle">app: web</text>
<rect id="endpoint-note" x="32" y="365" width="896" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480" y="398" class="body" text-anchor="middle">EndpointSlices track backend addresses and readiness as Pods appear or disappear.</text>
</svg>
