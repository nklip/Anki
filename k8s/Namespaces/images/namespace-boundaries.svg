<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488" role="img" aria-labelledby="title desc">
<title id="title">Namespaces separate object scope within one cluster</title>
<desc id="desc">Namespaces dev and prod each contain a distinct Deployment named web. Nodes and PersistentVolumes remain cluster-scoped.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 18px; fill: #52677b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 18px; } .small { font-size: 16px; fill: #52677b; } .connector { fill: none; stroke: #52677b; stroke-width: 2.5; stroke-linejoin: round; }</style></defs>
<!-- Canvas and lesson heading. -->
<rect width="960" height="488" fill="#ffffff"/>
<text x="32" y="43" class="title" text-anchor="start">Namespaces separate object scope within one cluster</text>
<text x="32" y="75" class="subtitle" text-anchor="start">A namespace is an organizational boundary, not a firewall or a separate machine.</text>
<!-- Distinct namespaced objects may use the same name. -->
<rect x="32" y="109" width="420" height="204" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="242" y="146" class="heading" text-anchor="middle">Namespace: dev</text>
<rect x="64" y="178" width="356" height="82" rx="12" fill="#ffffff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="242.0" y="209" class="heading" text-anchor="middle">Deployment: web</text>
<text x="242.0" y="238" class="body" text-anchor="middle">Scoped to this namespace</text>
<text x="242" y="291" class="small" text-anchor="middle">Permissions and quotas can differ</text>
<rect x="508" y="109" width="420" height="204" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="718" y="146" class="heading" text-anchor="middle">Namespace: prod</text>
<rect x="540" y="178" width="356" height="82" rx="12" fill="#ffffff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="718.0" y="209" class="heading" text-anchor="middle">Deployment: web</text>
<text x="718.0" y="238" class="body" text-anchor="middle">Scoped to this namespace</text>
<text x="718" y="291" class="small" text-anchor="middle">Permissions and quotas can differ</text>
<!-- Shared cluster scope; do not imply physical isolation. -->
<rect id="cluster-scoped" x="32" y="350" width="896" height="79" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="381" class="heading" text-anchor="middle">Cluster-scoped resources</text>
<text x="480.0" y="410" class="body" text-anchor="middle">Nodes · PersistentVolumes · StorageClasses</text>
<text x="480" y="466" class="small" text-anchor="middle">NetworkPolicy controls Pod traffic only when the network implementation enforces it.</text>
</svg>
