<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">Argo CD compares Git configuration with live Kubernetes resources</title>
  <desc id="desc">An Application connects a Git repository, revision, and path to a target cluster and namespace. Git requests Deployment image shop:v2, but the live Deployment declares shop:v1. Argo CD reads Git and observes the cluster, detecting OutOfSync. A manual sync, or automatic sync when enabled, applies the desired configuration. When the live configuration matches, the application is Synced. Resource health is assessed separately.</desc>

  <!-- Shared typography and palette follow the neighboring Helm and CloudNativePG diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52677b; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #52677b; }
      .code { font-family: monospace; font-size: 18px; }
      .connector { fill: none; stroke: #52677b; stroke-width: 2.5; stroke-linejoin: round; }
      .sync { fill: none; stroke: #397c5a; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- The opening statement defines GitOps before introducing the resource model. -->
  <rect width="960" height="630" fill="#ffffff"/>
  <text x="32" y="43" class="title" text-anchor="start">Argo CD: compare Git with the cluster</text>
  <text x="32" y="75" class="subtitle" text-anchor="start">GitOps: Git describes the desired configuration; Argo CD synchronizes resources.</text>

  <!-- Application configuration binds the desired source to the deployment destination. -->
  <g id="application-binding">
    <rect x="32" y="112" width="896" height="66" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="480" y="140" class="body" font-weight="700" text-anchor="middle">Application connects a Git source to a destination</text>
    <text x="480" y="165" class="small" text-anchor="middle">Repository + revision + path → Kubernetes cluster + namespace</text>
  </g>

  <!-- Desired and live Deployment image references intentionally differ before sync. -->
  <g id="git-source">
    <rect x="32" y="214" width="220" height="214" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
    <text x="142" y="247" class="heading" text-anchor="middle">Git repository</text>
    <text x="142" y="275" class="small" text-anchor="middle">Desired configuration</text>
    <text x="142" y="314" class="body" text-anchor="middle">Deployment</text>
    <text x="142" y="346" class="code" text-anchor="middle">image: shop:v2</text>
    <text x="142" y="395" class="small" text-anchor="middle">Version to deploy</text>
  </g>

  <g id="argo-controller">
    <rect x="370" y="214" width="220" height="214" rx="12" fill="#f5f3ff" stroke="#b7a4de" stroke-width="1.5"/>
    <text x="480" y="247" class="heading" text-anchor="middle">Argo CD</text>
    <text x="480" y="280" class="body" text-anchor="middle">Compare desired</text>
    <text x="480" y="307" class="body" text-anchor="middle">with live state</text>
    <rect id="out-of-sync-status" x="389" y="340" width="182" height="65" rx="9" fill="#fff7ed" stroke="#d8ad77" stroke-width="1.5"/>
    <text x="480" y="366" class="code" font-weight="700" text-anchor="middle">OutOfSync</text>
    <text x="480" y="392" class="small" text-anchor="middle">v2 differs from v1</text>
  </g>

  <g id="target-cluster">
    <rect x="708" y="214" width="220" height="214" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
    <text x="818" y="247" class="heading" text-anchor="middle">Target cluster</text>
    <text x="818" y="275" class="small" text-anchor="middle">Live Deployment</text>
    <text x="818" y="314" class="code" text-anchor="middle">image: shop:v1</text>
    <text x="818" y="395" class="small" text-anchor="middle">State before sync</text>
  </g>

  <!-- All connector shafts end inside separate heads; tips meet panel boundaries. -->
  <g id="comparison-and-sync">
    <text x="311" y="300" class="small" text-anchor="middle">read Git</text>
    <path id="git-read-shaft" class="connector" data-connector="true" d="M252 326 H361"/>
    <polygon id="git-read-head" points="370,326 359,320 359,332" fill="#52677b"/>

    <text x="649" y="280" class="small" text-anchor="middle">sync</text>
    <path id="sync-shaft" class="sync" data-connector="true" d="M590 300 H699"/>
    <polygon id="sync-head" points="708,300 697,294 697,306" fill="#397c5a"/>

    <text x="649" y="350" class="small" text-anchor="middle">observe</text>
    <path id="observe-shaft" class="connector" data-connector="true" d="M708 372 H599"/>
    <polygon id="observe-head" points="590,372 601,366 601,378" fill="#52677b"/>
  </g>

  <!-- A short outcome connector separates the before state from the state after sync. -->
  <path id="sync-outcome-shaft" class="sync" data-connector="true" d="M818 428 V455"/>
  <polygon id="sync-outcome-head" points="818,464 812,453 824,453" fill="#397c5a"/>
  <g id="sync-outcome">
    <rect x="32" y="464" width="896" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="480" y="495" class="heading" text-anchor="middle">After a successful sync</text>
    <text x="480" y="526" class="body" text-anchor="middle">Live Deployment image: shop:v2 → configuration matches → Synced</text>
    <text x="480" y="554" class="small" text-anchor="middle">Application health is assessed separately.</text>
  </g>

  <!-- The sync policy qualifies the forward arrow; observation alone does not apply changes. -->
  <text x="480" y="608" class="small" text-anchor="middle">Sync: a manual action, or automatic when enabled for the Application.</text>
</svg>
