<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1540" viewBox="0 0 1100 1540" role="img" aria-labelledby="title desc">
  <title id="title">Where Karpenter fits in Kubernetes</title>
  <desc id="desc">The existing worker node runs a Karpenter Pod alongside an application Pod and another system Pod. Each Pod contains containers; the Karpenter Pod contains the container running the Karpenter controller. This installed controller runs outside the core control plane. It observes Pods that the scheduler cannot place through the Kubernetes API and requests suitable machines from a cloud provider. A new machine joins the cluster when its kubelet registers with the API server. The Kubernetes scheduler assigns application Pods to the ready node; its kubelet and container runtime run their containers. Purple arrows show Kubernetes API communication. The lower arrows show a capacity request and its outcome, not application traffic.</desc>
  <!-- Shared palette and typography; matches the Kubernetes cluster overview in the neighboring card. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 24px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #52677b; }
      .light { fill: #ffffff; }
      .api-connector { fill: none; stroke: #6554a4; stroke-width: 2.5; stroke-linejoin: round; }
      .runtime-connector { fill: none; stroke: #386a7d; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Canvas and reading guide. -->
  <rect id="canvas" width="1100" height="1540" fill="#ffffff"/>
  <text x="40" y="44" class="title">Where Karpenter fits in Kubernetes</text>
  <text x="40" y="76" class="body">Karpenter runs as a Pod and asks the cloud provider for worker-node capacity.</text>
  <!-- Clients are outside the control-plane group. An admin UI is optional. -->
  <rect id="api-clients" x="290" y="102" width="520" height="140" rx="14" fill="#f1f5f9" stroke="#b6c3d2" stroke-width="1.5"/>
  <text x="550" y="133" class="heading" text-anchor="middle">API clients</text>
  <rect x="314" y="150" width="216" height="68" rx="9" fill="#ffffff" stroke="#b6c3d2"/>
  <text x="422" y="178" class="heading" text-anchor="middle">Admin UI</text>
  <text x="422" y="202" class="small" text-anchor="middle">Web interface (optional)</text>
  <rect x="570" y="150" width="216" height="68" rx="9" fill="#ffffff" stroke="#b6c3d2"/>
  <text x="678" y="178" class="heading" text-anchor="middle">CLI: kubectl</text>
  <text x="678" y="202" class="small" text-anchor="middle">Command-line client</text>
  <!-- Cluster membership is distinct from the external provider API below. -->
  <rect id="cluster-boundary" x="4" y="258" width="1092" height="980" rx="16" fill="#ffffff" stroke="#b6c3d2" stroke-width="1.5"/>
  <text x="32" y="290" class="section">Kubernetes cluster</text>
  <!-- Control-plane boundary contains the API server and its peer components. -->
  <rect id="control-plane" x="160" y="308" width="780" height="355" rx="14" fill="#f3f0ff" stroke="#ad9cce" stroke-width="2"/>
  <text x="186" y="344" class="section">Control plane</text>
  <rect id="api-server" x="380" y="380" width="340" height="92" rx="12" fill="#6554a4"/>
  <text x="550" y="419" class="section light" text-anchor="middle">API server</text>
  <text x="550" y="449" class="body light" text-anchor="middle">Exposes the Kubernetes API</text>
  <rect id="controller-manager" x="186" y="554" width="240" height="78" rx="10" fill="#e5ddfa" stroke="#ad9cce"/>
  <text x="306" y="586" class="heading" text-anchor="middle">Controller manager</text>
  <text x="306" y="613" class="small" text-anchor="middle">Reconciles state</text>
  <rect id="scheduler" x="458" y="554" width="188" height="78" rx="10" fill="#e5ddfa" stroke="#ad9cce"/>
  <text x="552" y="586" class="heading" text-anchor="middle">Scheduler</text>
  <text x="552" y="613" class="small" text-anchor="middle">Assigns Pods to nodes</text>
  <rect id="etcd" x="678" y="554" width="236" height="78" rx="10" fill="#e5ddfa" stroke="#ad9cce"/>
  <text x="796" y="586" class="heading" text-anchor="middle">etcd</text>
  <text x="796" y="613" class="small" text-anchor="middle">Stores API server data</text>
  <!-- Worker boundaries are painted before connectors so incoming arrows remain visible. -->
  <rect id="worker-node-1" x="32" y="750" width="500" height="460" rx="14" fill="#eef6ff" stroke="#8faeca" stroke-width="2"/>
  <rect id="worker-node-2" x="568" y="750" width="500" height="460" rx="14" fill="#eef6ff" stroke="#8faeca" stroke-width="2"/>
  <!-- API communication is bidirectional. Separate heads meet box edges; shafts stop inside their bases. -->
  <path id="client-api-shaft" class="api-connector" d="M550 250 V372"/>
  <polygon points="550,242 544,253 556,253" fill="#6554a4"/>
  <polygon points="550,380 544,369 556,369" fill="#6554a4"/>
  <text x="574" y="283" class="small">Requests / responses</text>
  <path id="controller-api-shaft" class="api-connector" d="M306 546 V510 H435 V480"/>
  <polygon points="306,554 300,543 312,543" fill="#6554a4"/>
  <polygon points="435,472 429,483 441,483" fill="#6554a4"/>
  <path id="scheduler-api-shaft" class="api-connector" d="M552 546 V480"/>
  <polygon points="552,554 546,543 558,543" fill="#6554a4"/>
  <polygon points="552,472 546,483 558,483" fill="#6554a4"/>
  <path id="etcd-api-shaft" class="api-connector" d="M796 546 V510 H665 V480"/>
  <polygon points="796,554 790,543 802,543" fill="#6554a4"/>
  <polygon points="665,472 659,483 671,483" fill="#6554a4"/>
  <!-- These routes cross group borders, but avoid all component boxes and worker headings. -->
  <!-- The left API trunk branches to the kubelet and Karpenter. Its kubelet branch stays left of the worker heading. -->
  <path id="worker-1-api-shaft" class="api-connector" d="M372 426 H16 V704 H124 V804"/>
  <path id="karpenter-api-shaft" class="api-connector" d="M16 704 V1102 H48"/>
  <circle id="api-branch-junction" cx="16" cy="704" r="4" fill="#6554a4"/>
  <polygon id="karpenter-api-head" points="56,1102 45,1096 45,1108" fill="#6554a4"/>
  <polygon points="380,426 369,420 369,432" fill="#6554a4"/>
  <polygon points="124,812 118,801 130,801" fill="#6554a4"/>
  <path id="worker-2-api-shaft" class="api-connector" d="M728 426 H990 V704 H702 V804"/>
  <polygon points="720,426 731,420 731,432" fill="#6554a4"/>
  <polygon points="702,812 696,801 708,801" fill="#6554a4"/>
  <text x="550" y="690" class="small" text-anchor="middle">Kubelets read assigned Pods and report status through the API.</text>
  <!-- Worker 1: kubelet controls the runtime; the runtime runs containers within Pods. -->
  <text x="282" y="784" class="section" text-anchor="middle">Existing worker node</text>
  <rect id="worker-1-kubelet" x="56" y="812" width="220" height="70" rx="10" fill="#dbeafe" stroke="#8faeca"/>
  <text x="166" y="841" class="heading" text-anchor="middle">kubelet</text>
  <text x="166" y="865" class="small" text-anchor="middle">Local Pod agent</text>
  <rect id="worker-1-proxy" x="300" y="812" width="208" height="70" rx="10" fill="#ffffff" stroke="#b6c3d2"/>
  <text x="404" y="841" class="heading" text-anchor="middle">kube-proxy</text>
  <text x="404" y="865" class="small" text-anchor="middle">Service network rules*</text>
  <path id="worker-1-runtime-shaft" class="runtime-connector" d="M166 882 V914"/>
  <polygon points="166,922 160,911 172,911" fill="#386a7d"/>
  <text x="184" y="907" class="small" text-anchor="start">Controls</text>
  <rect id="worker-1-runtime" x="56" y="922" width="452" height="66" rx="10" fill="#cce5ed" stroke="#84adbc"/>
  <text x="282" y="950" class="heading" text-anchor="middle">Container runtime</text>
  <text x="282" y="975" class="small" text-anchor="middle">For example, containerd or CRI-O</text>
  <!-- Karpenter contains a controller container; application and system Pods are its siblings on the node. -->
  <path id="worker-1-karpenter-runtime-shaft" class="runtime-connector" d="M189 988 V1010"/>
  <polygon points="189,1018 183,1007 195,1007" fill="#386a7d"/>
  <rect id="karpenter-pod" x="56" y="1018" width="266" height="168" rx="10" fill="#fff5e7" stroke="#c88939" stroke-width="2"/>
  <text x="189" y="1049" class="heading" text-anchor="middle">Karpenter Pod</text>
  <rect id="karpenter-controller" x="72" y="1067" width="234" height="97" rx="6" fill="#f3d1a0" stroke="#d8b991"/>
  <text x="189" y="1095" class="heading" text-anchor="middle">Container</text>
  <text x="189" y="1122" class="body" text-anchor="middle">Karpenter controller</text>
  <text x="189" y="1149" class="small" text-anchor="middle">Watches waiting Pods</text>
  <!-- Each sibling Pod has its own container. Runtime arrows reach all three Pods independently. -->
  <path id="worker-1-app-runtime-shaft" class="runtime-connector" d="M427 988 V1010"/>
  <polygon points="427,1018 421,1007 433,1007" fill="#386a7d"/>
  <rect id="worker-1-app-pod" x="346" y="1018" width="162" height="74" rx="10" fill="#fff5e7" stroke="#d8b991"/>
  <text x="427" y="1044" class="body" text-anchor="middle">App Pod</text>
  <rect id="worker-1-app-container" x="362" y="1056" width="130" height="24" rx="6" fill="#f3d1a0" stroke="#d8b991"/>
  <text x="427" y="1073" class="small" text-anchor="middle">Container</text>
  <!-- The lower Pod's runtime route uses the right gutter to avoid crossing the upper Pod. -->
  <path id="worker-1-system-runtime-shaft" class="runtime-connector" d="M496 988 V1002 H520 V1149 H516"/>
  <polygon points="508,1149 519,1143 519,1155" fill="#386a7d"/>
  <rect id="worker-1-system-pod" x="346" y="1112" width="162" height="74" rx="10" fill="#fff5e7" stroke="#d8b991"/>
  <text x="427" y="1138" class="body" text-anchor="middle">System Pod</text>
  <rect id="worker-1-system-container" x="362" y="1150" width="130" height="24" rx="6" fill="#f3d1a0" stroke="#d8b991"/>
  <text x="427" y="1167" class="small" text-anchor="middle">Container</text>
  <!-- Worker 2: kubelet controls the runtime; the runtime runs containers within Pods. -->
  <text x="818" y="784" class="section" text-anchor="middle">New worker node</text>
  <rect id="worker-2-kubelet" x="592" y="812" width="220" height="70" rx="10" fill="#dbeafe" stroke="#8faeca"/>
  <text x="702" y="841" class="heading" text-anchor="middle">kubelet</text>
  <text x="702" y="865" class="small" text-anchor="middle">Local Pod agent</text>
  <rect id="worker-2-proxy" x="836" y="812" width="208" height="70" rx="10" fill="#ffffff" stroke="#b6c3d2"/>
  <text x="940" y="841" class="heading" text-anchor="middle">kube-proxy</text>
  <text x="940" y="865" class="small" text-anchor="middle">Service network rules*</text>
  <path id="worker-2-runtime-shaft" class="runtime-connector" d="M702 882 V914"/>
  <polygon points="702,922 696,911 708,911" fill="#386a7d"/>
  <text x="720" y="907" class="small" text-anchor="start">Controls</text>
  <rect id="worker-2-runtime" x="592" y="922" width="452" height="66" rx="10" fill="#cce5ed" stroke="#84adbc"/>
  <text x="818" y="950" class="heading" text-anchor="middle">Container runtime</text>
  <text x="818" y="975" class="small" text-anchor="middle">For example, containerd or CRI-O</text>
  <path id="worker-2-pod-1-shaft" class="runtime-connector" d="M698 988 V1010"/>
  <polygon points="698,1018 692,1007 704,1007" fill="#386a7d"/>
  <rect id="worker-2-pod-1" x="592" y="1018" width="212" height="168" rx="10" fill="#fff5e7" stroke="#d8b991"/>
  <text x="698" y="1049" class="heading" text-anchor="middle">App Pod 1</text>
  <rect id="worker-2-pod-1-container-1" x="612" y="1093" width="172" height="43" rx="6" fill="#f3d1a0" stroke="#d8b991"/>
  <text x="698" y="1121" class="body" text-anchor="middle">Container 1</text>
  <path id="worker-2-pod-2-shaft" class="runtime-connector" d="M938 988 V1010"/>
  <polygon points="938,1018 932,1007 944,1007" fill="#386a7d"/>
  <rect id="worker-2-pod-2" x="832" y="1018" width="212" height="168" rx="10" fill="#fff5e7" stroke="#d8b991"/>
  <text x="938" y="1049" class="heading" text-anchor="middle">App Pod 2</text>
  <rect id="worker-2-pod-2-container-1" x="852" y="1067" width="172" height="43" rx="6" fill="#f3d1a0" stroke="#d8b991"/>
  <text x="938" y="1095" class="body" text-anchor="middle">Container 1</text>
  <rect id="worker-2-pod-2-container-2" x="852" y="1120" width="172" height="43" rx="6" fill="#f3d1a0" stroke="#d8b991"/>
  <text x="938" y="1148" class="body" text-anchor="middle">Container 2</text>
  <!-- Provider API is outside the cluster. Launch points to the node boundary, not to an application Pod. -->
  <rect id="cloud-provider-api" x="320" y="1300" width="460" height="122" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
  <text x="550" y="1335" class="section" text-anchor="middle">Cloud provider API</text>
  <text x="550" y="1366" class="body" text-anchor="middle">Starts the machine that becomes a node</text>
  <text x="550" y="1396" class="small" text-anchor="middle">For example, Amazon EC2</text>
  <!-- Manual shafts end inside their triangle bases; tips meet the target boundary. -->
  <path id="capacity-request-shaft" d="M282 1186 V1360 H312" fill="none" stroke="#b77928" stroke-width="2.5"/>
  <polygon id="capacity-request-head" points="320,1360 309,1354 309,1366" fill="#b77928"/>
  <text x="48" y="1272" class="body">Requests a</text>
  <text x="48" y="1298" class="body">suitable machine</text>
  <path id="machine-launch-shaft" d="M780 1360 H938 V1218" fill="none" stroke="#397f58" stroke-width="2.5"/>
  <polygon id="machine-launch-head" points="938,1210 932,1221 944,1221" fill="#397f58"/>
  <text x="648" y="1264" class="body">Machine starts; kubelet</text>
  <text x="648" y="1290" class="body">registers it with the API.</text>
  <!-- Reading key separates provisioning, scheduling, and execution. -->
  <text x="550" y="1460" class="body" text-anchor="middle">Karpenter adds nodes. The scheduler assigns Pods. Kubelets run the assigned Pods.</text>
  <text x="550" y="1489" class="small" text-anchor="middle">API = application programming interface. Purple lines show Kubernetes API communication.</text>
  <text x="550" y="1516" class="small" text-anchor="middle">* A network plugin may replace kube-proxy. Selected control paths are shown, not application traffic.</text>
</svg>
