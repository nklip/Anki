<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">Karpenter adds nodes when Pods cannot fit</title>
  <desc id="desc">Read left to right, then down. Two application Pods wait because existing nodes lack capacity. Karpenter checks their requests and NodePool rules, then asks the cloud provider to launch a suitable machine. The new node joins the cluster. Once it is ready, the Kubernetes scheduler assigns the waiting Pods to it. NodePool means the configuration defining which nodes Karpenter may create.</desc>
  <!-- Shared typography and semantic colors follow nearby Kubernetes diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52677b; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #52677b; }
      .pod { font-size: 18px; font-weight: 700; }
      .connector { fill: none; stroke: #52677b; stroke-width: 2.5; }
    </style>
  </defs>
  <!-- Canvas and reading order; this example shows a shortage of requested resources. -->
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="32" y="43" class="title" text-anchor="start">Karpenter adds nodes when Pods cannot fit</text>
  <text x="32" y="77" class="subtitle" text-anchor="start">Dynamic provisioning: waiting Pods lead to new node capacity.</text>

  <!-- Step 1: the same two Pod labels reappear in the scheduled outcome below. -->
  <rect id="waiting-pods" x="32" y="110" width="272" height="214" rx="12" fill="#fff7ed" stroke="#d9ab72" stroke-width="1.5"/>
  <text x="52" y="146" class="heading" text-anchor="start">1  Pods cannot fit</text>
  <text x="52" y="180" class="body" text-anchor="start">Existing nodes lack room</text>
  <text x="52" y="206" class="body" text-anchor="start">for their resource requests.</text>
  <rect x="52" y="234" width="100" height="40" rx="7" fill="#ffffff" stroke="#d9ab72" stroke-width="1.5"/>
  <rect x="170" y="234" width="100" height="40" rx="7" fill="#ffffff" stroke="#d9ab72" stroke-width="1.5"/>
  <text x="102" y="260" class="pod" text-anchor="middle">Pod A</text>
  <text x="220" y="260" class="pod" text-anchor="middle">Pod B</text>
  <text x="52" y="303" class="small" text-anchor="start">Unschedulable = cannot fit.</text>

  <!-- Step 2: capacity selection is distinct from assigning Pods to nodes. -->
  <rect id="karpenter" x="354" y="110" width="252" height="214" rx="12" fill="#eff6ff" stroke="#93b4e9" stroke-width="1.5"/>
  <text x="374" y="146" class="heading" text-anchor="start">2  Karpenter</text>
  <text x="374" y="180" class="body" text-anchor="start">Checks Pod requests</text>
  <text x="374" y="206" class="body" text-anchor="start">and NodePool rules.</text>
  <text x="374" y="248" class="body" text-anchor="start">Asks the cloud provider</text>
  <text x="374" y="274" class="body" text-anchor="start">for a suitable machine.</text>
  <text x="374" y="303" class="small" text-anchor="start">NodePool = allowed nodes.</text>

  <!-- Step 3: readiness precedes the scheduler's placement of workload Pods. -->
  <rect id="new-node" x="656" y="110" width="272" height="214" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
  <text x="676" y="146" class="heading" text-anchor="start">3  New node joins</text>
  <text x="676" y="180" class="body" text-anchor="start">The machine registers</text>
  <text x="676" y="206" class="body" text-anchor="start">with the cluster.</text>
  <rect id="ready-capacity" x="676" y="231" width="232" height="73" rx="8" fill="#ffffff" stroke="#86b89a" stroke-width="1.5"/>
  <text x="792" y="261" class="heading" text-anchor="middle">Ready capacity</text>
  <text x="792" y="287" class="small" text-anchor="middle">Room to run the Pods</text>

  <!-- Shafts stop inside triangle bases; arrow tips meet only the target border. -->
  <path id="observe-pods-shaft" class="connector" data-connector="true" d="M304 217 L346 217"/>
  <polygon id="observe-pods-head" points="354,217 344,211 344,223" fill="#52677b"/>
  <path id="provision-node-shaft" class="connector" data-connector="true" d="M606 217 L648 217"/>
  <polygon id="provision-node-head" points="656,217 646,211 646,223" fill="#52677b"/>
  <path id="ready-to-schedule-shaft" class="connector" data-connector="true" d="M792 324 L792 368"/>
  <polygon id="ready-to-schedule-head" points="792,376 786,366 798,366" fill="#52677b"/>

  <!-- Outcome: explicit scheduler ownership prevents confusing provisioning with binding. -->
  <rect id="scheduled-outcome" x="32" y="376" width="896" height="94" rx="12" fill="#f0fdf4" stroke="#86b89a" stroke-width="1.5"/>
  <text x="52" y="410" class="heading" text-anchor="start">4  Kubernetes scheduler</text>
  <text x="52" y="444" class="body" text-anchor="start">Assigns the waiting Pods to the ready node.</text>
  <rect x="676" y="404" width="102" height="40" rx="7" fill="#d9f3e2" stroke="#86b89a" stroke-width="1.5"/>
  <rect x="802" y="404" width="102" height="40" rx="7" fill="#d9f3e2" stroke="#86b89a" stroke-width="1.5"/>
  <text x="727" y="430" class="pod" text-anchor="middle">Pod A</text>
  <text x="853" y="430" class="pod" text-anchor="middle">Pod B</text>
</svg>
