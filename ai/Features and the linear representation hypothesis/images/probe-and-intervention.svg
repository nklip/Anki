<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">An intervention changes the activation the model uses</title>
  <desc id="desc">Where: researchers edit working values during a run; model weights stay fixed.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="28" y="42" class="t">An intervention changes the activation the model uses</text>
  <text x="28" y="76" class="s">Where: researchers edit working values during a run; model weights stay fixed.</text>
  <!-- Separate lanes distinguish an unedited baseline from an additive steering intervention. -->
  <text x="28" y="186" class="h">Baseline</text>
  <rect x="180" y="150" width="180" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="182" class="s" text-anchor="middle">activation</text>
  <text x="270" y="211" class="m" text-anchor="middle" style="fill:#2563eb">[2, 1]</text>
  <path data-connector="true" d="M360 188 L419.0 188.0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <polygon points="430,188 418.0,193.0 418.0,183.0" fill="#2563eb"/>
  <rect x="430" y="150" width="240" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="183" class="h" text-anchor="middle">Remaining model</text>
  <text x="550" y="211" class="s" text-anchor="middle">same weights</text>
  <path data-connector="true" d="M670 188 L729.0 188.0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <polygon points="740,188 728.0,193.0 728.0,183.0" fill="#2563eb"/>
  <rect x="740" y="150" width="232" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="856" y="183" class="h" text-anchor="middle">Next-token scores</text>
  <text x="856" y="211" class="s" text-anchor="middle">compare outcomes</text>
  <text x="28" y="336" class="h">Steering</text>
  <rect x="180" y="300" width="180" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="332" class="s" text-anchor="middle">activation</text>
  <text x="270" y="361" class="m" text-anchor="middle" style="fill:#7c3aed">[2, 2]</text>
  <path data-connector="true" d="M360 338 L419.0 338.0" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
  <polygon points="430,338 418.0,343.0 418.0,333.0" fill="#7c3aed"/>
  <rect x="430" y="300" width="240" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="333" class="h" text-anchor="middle">Remaining model</text>
  <text x="550" y="361" class="s" text-anchor="middle">same weights</text>
  <path data-connector="true" d="M670 338 L729.0 338.0" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
  <polygon points="740,338 728.0,343.0 728.0,333.0" fill="#7c3aed"/>
  <rect x="740" y="300" width="232" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="856" y="333" class="h" text-anchor="middle">Next-token scores</text>
  <text x="856" y="361" class="s" text-anchor="middle">compare outcomes</text>
  <text x="280" y="274" class="b" text-anchor="middle" style="fill:#7c3aed">Add direction [0, 1]</text>
  <text x="500" y="435" class="b" text-anchor="middle">Steering = an additive edit. A predicted change supports causal influence.</text>
  <text x="500" y="464" class="s" text-anchor="middle">Test side effects too; a probe direction need not be a good steering direction.</text>
</svg>
