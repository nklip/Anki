<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">A linear probe learns a boundary from labeled activations</title>
  <desc id="desc">Where: an external readout of copied vectors; the language model stays fixed.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="28" y="42" class="t">A linear probe learns a boundary from labeled activations</text>
  <text x="28" y="76" class="s">Where: an external readout of copied vectors; the language model stays fixed.</text>
  <!-- Scatter positions are invented; filled circles and open squares distinguish labels without color alone. -->
  <rect x="28" y="105" width="460" height="342" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="143" class="h">Train on saved vectors</text>
  <line x1="88" y1="390" x2="440" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <line x1="88" y1="390" x2="88" y2="177" stroke="#94a3b8" stroke-width="2"/>
  <line x1="265" y1="180" x2="265" y2="390" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="130" cy="350" r="7" fill="#2563eb"/>
  <circle cx="180" cy="310" r="7" fill="#2563eb"/>
  <circle cx="145" cy="250" r="7" fill="#2563eb"/>
  <circle cx="220" cy="270" r="7" fill="#2563eb"/>
  <rect x="308" y="323" width="14" height="14" rx="0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="353" y="273" width="14" height="14" rx="0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="398" y="208" width="14" height="14" rx="0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="313" y="218" width="14" height="14" rx="0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="114" y="422" class="s" style="fill:#2563eb">present tense</text>
  <text x="314" y="422" class="s" style="fill:#7c3aed">past tense</text>
  <text x="275" y="177" class="s">learned cutoff</text>
  <rect x="538" y="105" width="434" height="342" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="562" y="143" class="h">Test on new sentences</text>
  <text x="562" y="189" class="b">Keep the boundary fixed.</text>
  <text x="562" y="228" class="b">Do held-out labels match predictions?</text>
  <text x="562" y="285" class="s">real labels</text>
  <rect x="720" y="262" width="206" height="27" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="720" y="262" width="170" height="27" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="562" y="348" class="s">random labels</text>
  <rect x="720" y="325" width="206" height="27" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="720" y="325" width="75" height="27" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="562" y="411" class="s">Illustrative bars; no measured accuracy.</text>
  <text x="500" y="486" class="b" text-anchor="middle">A successful probe shows recoverable information, not causal use.</text>
</svg>
