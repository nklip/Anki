<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">A feature is a property; a neuron is one slot</title>
  <desc id="desc">Where: researchers inspect activations inside a transformer block.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="28" y="42" class="t">A feature is a property; a neuron is one slot</text>
  <text x="28" y="76" class="s">Where: researchers inspect activations inside a transformer block.</text>
  <!-- Two separate panels prevent a property from being equated with a numbered slot. -->
  <rect x="28" y="106" width="454" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="518" y="106" width="454" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="144" class="h">Feature</text>
  <text x="52" y="176" class="b">A property the model represents.</text>
  <rect x="52" y="199" width="270" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="228" class="b">She walked home.</text>
  <rect x="346" y="199" width="108" height="44" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="228" class="s" text-anchor="middle" style="fill:#7c3aed">present</text>
  <rect x="52" y="263" width="270" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="292" class="b">She walks home.</text>
  <rect x="346" y="263" width="108" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="292" class="s" text-anchor="middle" style="fill:#64748b">absent</text>
  <text x="52" y="363" class="h">Example feature: past tense</text>
  <text x="52" y="398" class="s">A concept need not have a human name.</text>
  <text x="542" y="144" class="h">Neuron</text>
  <text x="542" y="176" class="b">One slot in the MLP’s expanded vector.</text>
  <rect x="550" y="222" width="82" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="591" y="260" class="m" text-anchor="middle">0.2</text>
  <text x="591" y="315" class="s" text-anchor="middle">1</text>
  <rect x="650" y="222" width="82" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="691" y="260" class="m" text-anchor="middle">1.4</text>
  <text x="691" y="315" class="s" text-anchor="middle">2</text>
  <rect x="750" y="222" width="82" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="791" y="260" class="m" text-anchor="middle">0</text>
  <text x="791" y="315" class="s" text-anchor="middle">3</text>
  <rect x="850" y="222" width="82" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="891" y="260" class="m" text-anchor="middle">0.8</text>
  <text x="891" y="315" class="s" text-anchor="middle">4</text>
  <text x="542" y="363" class="h">Highlighted: neuron 2</text>
  <text x="542" y="398" class="s">One feature may use many slots.</text>
  <text x="500" y="474" class="b" text-anchor="middle">A neuron can also respond to more than one feature.</text>
</svg>
