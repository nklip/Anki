<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">The linear hypothesis: scale directions, then add</title>
  <desc id="desc">Where: a proposed description of an internal activation, not an extra model layer.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="28" y="42" class="t">The linear hypothesis: scale directions, then add</text>
  <text x="28" y="76" class="s">Where: a proposed description of an internal activation, not an extra model layer.</text>
  <!-- All three plots share a 90-pixel-per-unit grid; the toy directions are orthogonal. -->
  <text x="80" y="133" class="h">Feature A</text>
  <line x1="80" y1="320" x2="80" y2="170" stroke="#cbd5e1" stroke-width="2"/>
  <path data-connector="true" d="M80 320 L249.0 320.0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <polygon points="260,320 248.0,325.0 248.0,315.0" fill="#2563eb"/>
  <text x="180" y="365" class="m" text-anchor="middle" style="fill:#2563eb">[2, 0]</text>
  <text x="400" y="133" class="h">Feature B</text>
  <line x1="400" y1="320" x2="615" y2="320" stroke="#cbd5e1" stroke-width="2"/>
  <path data-connector="true" d="M400 320 L400.0 241.0" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
  <polygon points="400,230 405.0,242.0 395.0,242.0" fill="#7c3aed"/>
  <text x="500" y="365" class="m" text-anchor="middle" style="fill:#7c3aed">[0, 1]</text>
  <text x="720" y="133" class="h">Both features</text>
  <line x1="720" y1="320" x2="935" y2="320" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="720" y1="320" x2="720" y2="170" stroke="#cbd5e1" stroke-width="2"/>
  <path data-connector="true" d="M720 320 L890.1613008990008 234.91934955049953" stroke="#059669" stroke-width="2.5" fill="none"/>
  <polygon points="900,230 891.5029416855008,239.83869910099907 887.0308057305011,230.89442719099992" fill="#059669"/>
  <line x1="900" y1="320" x2="900" y2="244" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="720" y1="230" x2="882" y2="230" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="820" y="365" class="m" text-anchor="middle" style="fill:#059669">[2, 1]</text>
  <text x="335" y="255" class="m">+</text>
  <text x="655" y="255" class="m">=</text>
  <text x="500" y="421" class="m" text-anchor="middle">Toy example: 2 × [1, 0] + 1 × [0, 1] = [2, 1]</text>
</svg>
