<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="804.545455" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">Verification directs completion or continued work</title>
<desc id="desc">A new file read verifies the saved time. Seeing 11:00 supports completion; seeing 10:00 means the task is unfinished and calls for investigation if limits permit.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="590" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Verify: inspect the saved result before claiming success</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Verification compares evidence from the actual outcome with the user’s requested goal.</text>
<!-- Verification read; preserve reading order and text clearance. -->
<g id="verification-read">
<rect x="30" y="153" width="300" height="220" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="50" y="191" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Read notes.txt again</text>
<text x="50" y="232" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The edit returned “Saved.”</text>
<text x="50" y="264" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A new read asks what is</text>
<text x="50" y="296" font-size="20" font-weight="400" text-anchor="start" fill="#172033">stored now, not what the</text>
<text x="50" y="328" font-size="20" font-weight="400" text-anchor="start" fill="#172033">model intended to write.</text>
</g>
<!-- Verification success; preserve reading order and text clearance. -->
<g id="verification-success">
<rect x="450" y="123" width="290" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470" y="161" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Observed: 11:00</text>
<text x="470" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Matches requested time.</text>
<text x="470" y="234" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The file check is complete.</text>
<rect x="830" y="123" width="240" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="850" y="161" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Finish</text>
<text x="850" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Report the checked</text>
<text x="850" y="234" font-size="20" font-weight="400" text-anchor="start" fill="#172033">change to the user.</text>
</g>
<!-- Verification failure; preserve reading order and text clearance. -->
<g id="verification-failure">
<rect x="450" y="343" width="290" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470" y="381" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Observed: 10:00</text>
<text x="470" y="422" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The saved result is wrong.</text>
<text x="470" y="454" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The task is unfinished.</text>
<rect x="830" y="343" width="240" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="850" y="381" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Continue or stop</text>
<text x="850" y="422" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Investigate if allowed.</text>
<text x="850" y="454" font-size="20" font-weight="400" text-anchor="start" fill="#172033">If limited, report failure.</text>
</g>
<!-- Verification branches; preserve reading order and text clearance. -->
<g id="verification-branches">
<path data-connector="true" d="M 330,214 L 390,214 L 390,196 L 439,196" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="450,196 438,202 438,190" fill="#64748b"/>
<path data-connector="true" d="M 330,318 L 390,318 L 390,416 L 439,416" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="450,416 438,422 438,410" fill="#64748b"/>
<path data-connector="true" d="M 740,196 L 819,196" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,196 818,202 818,190" fill="#64748b"/>
<path data-connector="true" d="M 740,416 L 819,416" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,416 818,422 818,410" fill="#64748b"/>
</g>
<text x="30" y="556" font-size="22" font-weight="700" text-anchor="start" fill="#172033">The next action follows the observation. A limit can end a run without a successful result.</text>
</svg>
