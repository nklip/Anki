<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
  <title id="title">Read before choosing the edit</title>
  <desc id="desc">The model requests read_file for notes.txt. After permission checks, the runtime reads the file and returns Meeting starts at 10:00. The next model input includes that text. The read changes the information available to the model but leaves the file unchanged.</desc>
  <!-- Shared typography and colors match neighboring AI articles. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="370" fill="#ffffff"/>
  <!-- Heading states the primary lesson and the reading order. -->
  <text class="title" x="28" y="43" text-anchor="start">Read before choosing the edit</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">The model requests read_file(&quot;notes.txt&quot;). Read the result flow from left to right.</text>
  <!-- File before read; keep labels clear of panel borders. -->
  <g id="file-before-read">
    <rect x="28" y="112" width="310" height="154" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="183.0" y="148" text-anchor="middle">File on disk</text>
  <text class="body" x="183.0" y="192" text-anchor="middle">notes.txt</text>
  <text class="body" x="183.0" y="231" text-anchor="middle">Meeting starts at 10:00.</text>
  </g>
  <!-- Runtime read; keep labels clear of panel borders. -->
  <g id="runtime-read">
    <rect x="395" y="112" width="310" height="154" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="550.0" y="148" text-anchor="middle">Runtime runs read_file</text>
  <text class="body" x="550.0" y="192" text-anchor="middle">checks permission,</text>
  <text class="body" x="550.0" y="231" text-anchor="middle">then reads the file</text>
  </g>
  <!-- Observed contents; keep labels clear of panel borders. -->
  <g id="observed-contents">
    <rect x="762" y="112" width="310" height="154" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="label" x="917.0" y="148" text-anchor="middle">Next model input</text>
  <text class="body" x="917.0" y="192" text-anchor="middle">includes returned text:</text>
  <text class="body" x="917.0" y="231" text-anchor="middle">Meeting starts at 10:00.</text>
  </g>
  <!-- file-to-tool-arrow: shaft ends inside its head; the nose meets the target boundary. -->
  <g id="file-to-tool-arrow">
    <path class="connector" d="M339 189 L383 189"/>
    <polygon class="head" points="395,189 382,183 382,195"/>
  </g>
  <!-- tool-to-context-arrow: shaft ends inside its head; the nose meets the target boundary. -->
  <g id="tool-to-context-arrow">
    <path class="connector" d="M706 189 L750 189"/>
    <polygon class="head" points="762,189 749,183 749,195"/>
  </g>
  <text class="body" x="550" y="310" text-anchor="middle">Before: file contents unseen. After: the original time is observed.</text>
  <text class="note" x="550" y="343" text-anchor="middle">Reading changed the available information; the file itself is unchanged.</text>
</svg>
