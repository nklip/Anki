<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="784.090909" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc">
<title id="title">Reading creates evidence about the current file</title>
<desc id="desc">The first read transitions the run from unknown file contents to an observation that the meeting starts at 10:00. The read does not change the file.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="575" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Read: turn an unknown file into an observation</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Goal: change the meeting time from 10:00 to 11:00 in notes.txt, then check the saved file.</text>
<rect x="30" y="130" width="280" height="226" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Before</text>
<text x="50" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Goal is known.</text>
<text x="50" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Contents not yet known.</text>
<rect x="410" y="130" width="280" height="226" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="430" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Allowed action</text>
<text x="430" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Model requests read_file</text>
<text x="430" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#172033">with path notes.txt.</text>
<text x="430" y="273" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Runtime checks and runs it.</text>
<rect x="790" y="130" width="280" height="226" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="810" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Observation</text>
<text x="810" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tool returns:</text>
<text x="810" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“Meeting starts at 10:00.”</text>
<text x="810" y="273" font-size="20" font-weight="400" text-anchor="start" fill="#172033">File has not changed.</text>
<!-- Read flow; preserve reading order and text clearance. -->
<g id="read-flow">
<path data-connector="true" d="M 310,245 L 399,245" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="410,245 398,251 398,239" fill="#64748b"/>
<path data-connector="true" d="M 690,245 L 779,245" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="790,245 778,251 778,239" fill="#64748b"/>
</g>
<!-- Observation definition; preserve reading order and text clearance. -->
<g id="observation-definition">
<rect x="30" y="408" width="1040" height="133" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="448" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Observation = information returned from the environment</text>
<text x="50" y="489" font-size="21" font-weight="400" text-anchor="start" fill="#172033">The runtime records the read result and includes it in the next context.</text>
<text x="50" y="520" font-size="21" font-weight="400" text-anchor="start" fill="#172033">The next decision can use actual contents instead of guessing from a filename.</text>
</g>
</svg>
