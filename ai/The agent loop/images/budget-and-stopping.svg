<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="859.090909" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">Budgets and different stop outcomes</title>
<desc id="desc">Four allowed attempts minus read, edit, and verify leaves one unused attempt. Separate outcomes distinguish verified completion, a need for input, and stopping with unfinished work.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="630" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Budgets cap work; stopping explains why the run ended</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A budget limits a resource such as tool attempts or elapsed time. The runtime enforces it.</text>
<!-- Attempt budget; preserve reading order and text clearance. -->
<g id="attempt-budget">
<rect x="30" y="119" width="1040" height="199" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="158" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Toy budget: four tool attempts</text>
</g>
<rect x="50" y="190" width="225" height="95" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="162.5" y="226" font-size="23" font-weight="700" text-anchor="middle" fill="#172033">Read</text>
<text x="162.5" y="261" font-size="20" font-weight="400" text-anchor="middle" fill="#172033">spent</text>
<rect x="305" y="190" width="225" height="95" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="417.5" y="226" font-size="23" font-weight="700" text-anchor="middle" fill="#172033">Edit</text>
<text x="417.5" y="261" font-size="20" font-weight="400" text-anchor="middle" fill="#172033">spent</text>
<rect x="560" y="190" width="225" height="95" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="672.5" y="226" font-size="23" font-weight="700" text-anchor="middle" fill="#172033">Verify</text>
<text x="672.5" y="261" font-size="20" font-weight="400" text-anchor="middle" fill="#172033">spent</text>
<rect x="815" y="190" width="225" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="927.5" y="226" font-size="23" font-weight="700" text-anchor="middle" fill="#172033">Unused</text>
<text x="927.5" y="261" font-size="20" font-weight="400" text-anchor="middle" fill="#172033">1 remains</text>
<text x="30" y="364" font-size="23" font-weight="700" text-anchor="start" fill="#172033">4 allowed − 3 used = 1 remaining. An unused attempt does not require another call.</text>
<rect x="30" y="412" width="320" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="450" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Completed</text>
<text x="50" y="491" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Goal checked</text>
<text x="50" y="523" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Report the evidence.</text>
<rect x="390" y="412" width="320" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410" y="450" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Needs input</text>
<text x="410" y="491" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Missing information / permission</text>
<text x="410" y="523" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Ask; do not guess.</text>
<rect x="750" y="412" width="320" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770" y="450" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Stopped unfinished</text>
<text x="770" y="491" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Limit, failure, or cancellation</text>
<text x="770" y="523" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Report what remains.</text>
<text x="30" y="597" font-size="21" font-weight="400" text-anchor="start" fill="#172033">This toy budget counts failed attempts too. Stopping does not undo changes already made.</text>
</svg>
