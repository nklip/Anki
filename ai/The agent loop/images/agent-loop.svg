<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="845.454545" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Runtime state and per-call context in an agent loop</title>
<desc id="desc">The runtime retains the goal, observed file content, edit receipt, unfinished check, and limits. It selects relevant input for the next model call, whose result updates the working state.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="620" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">The runtime keeps state and selects the next context</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">State is the run’s working record. Context is the information supplied to one model call.</text>
<!-- Run state; preserve reading order and text clearance. -->
<g id="run-state">
<rect x="30" y="124" width="400" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="162" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Runtime state</text>
<text x="50" y="203" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Goal: change time; check saved file</text>
<text x="50" y="235" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Observed: notes.txt says 10:00</text>
<text x="50" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Latest result: edit reported Saved</text>
<text x="50" y="299" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Pending: verify stored contents</text>
<text x="50" y="331" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Remaining tool attempts: 2</text>
</g>
<!-- Selected context; preserve reading order and text clearance. -->
<g id="selected-context">
<rect x="520" y="124" width="550" height="260" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="540" y="162" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Next model input = selected context</text>
<text x="540" y="203" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Instructions + the user’s goal</text>
<text x="540" y="235" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Relevant call history and matching results</text>
<text x="540" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Available tools and their input rules</text>
<text x="540" y="299" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Model can now request a verification read.</text>
</g>
<!-- State context exchange; preserve reading order and text clearance. -->
<g id="state-context-exchange">
<path data-connector="true" d="M 430,258 L 509,258" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="520,258 508,264 508,252" fill="#64748b"/>
<text x="449" y="233" font-size="18" font-weight="400" text-anchor="start" fill="#172033">select</text>
<path data-connector="true" d="M 800,384 L 800,435 L 240,435 L 240,395" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="240,384 246,396 234,396" fill="#64748b"/>
<text x="300" y="422" font-size="20" font-weight="400" text-anchor="start" fill="#172033">New calls and results update the run’s state.</text>
</g>
<!-- Visible state boundary; preserve reading order and text clearance. -->
<g id="visible-state-boundary">
<rect x="30" y="476" width="1040" height="113" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="515" font-size="23" font-weight="700" text-anchor="start" fill="#172033">A note or result in storage helps only after relevant information reaches the input.</text>
<text x="50" y="552" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The runtime also tracks limits and pending work. The model’s learned weights stay fixed in this loop.</text>
</g>
</svg>
