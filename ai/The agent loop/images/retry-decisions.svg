<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="865.909091" viewBox="0 0 1100 635" role="img" aria-labelledby="title desc">
<title id="title">Retry decisions depend on the failure and possible effects</title>
<desc id="desc">A transient read failure may be retried after a wait. A wrong path needs correction. A lost edit reply requires checking the current state because the edit may have succeeded.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="635" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">A retry repeats an operation; first identify the failure</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Repeating the same request can help a temporary error, but cannot repair every cause.</text>
<!-- Temporary read failure; preserve reading order and text clearance. -->
<g id="temporary-read-failure">
<rect x="30" y="122" width="450" height="123" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="160" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Temporary read failure</text>
<text x="50" y="201" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Network unavailable briefly</text>
<rect x="620" y="122" width="450" height="123" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="640" y="169" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Wait, then retry if allowed.</text>
<text x="640" y="204" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Keep attempts bounded.</text>
<path data-connector="true" d="M 480,184 L 609,184" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="620,184 608,190 608,178" fill="#64748b"/>
</g>
<!-- Wrong file path; preserve reading order and text clearance. -->
<g id="wrong-file-path">
<rect x="30" y="277" width="450" height="123" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="315" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Wrong file path</text>
<text x="50" y="356" font-size="20" font-weight="400" text-anchor="start" fill="#172033">notes.tx does not exist</text>
<rect x="620" y="277" width="450" height="123" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="640" y="324" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Correct the path or search.</text>
<text x="640" y="359" font-size="21" font-weight="400" text-anchor="start" fill="#172033">An unchanged retry repeats the error.</text>
<path data-connector="true" d="M 480,339 L 609,339" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="620,339 608,345 608,333" fill="#64748b"/>
</g>
<!-- Edit reply is lost; preserve reading order and text clearance. -->
<g id="edit-reply-is-lost">
<rect x="30" y="432" width="450" height="123" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="470" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Edit reply is lost</text>
<text x="50" y="511" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The file may already be changed</text>
<rect x="620" y="432" width="450" height="123" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="640" y="479" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Read the current file first.</text>
<text x="640" y="514" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Do not assume the edit failed.</text>
<path data-connector="true" d="M 480,494 L 609,494" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="620,494 608,500 608,488" fill="#64748b"/>
</g>
<text x="30" y="602" font-size="22" font-weight="700" text-anchor="start" fill="#172033">A timeout means waiting ended. It does not prove the remote operation had no effect.</text>
</svg>
