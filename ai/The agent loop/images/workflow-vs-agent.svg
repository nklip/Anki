<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="879.545455" viewBox="0 0 1100 645" role="img" aria-labelledby="title desc">
<title id="title">Fixed workflows and model-directed agents</title>
<desc id="desc">A workflow selects predefined code paths, which may include conditions and retries. An agent lets the model choose the next useful action from observations within runtime limits.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="645" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Workflows follow code; agents choose their next action</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Both can use models, tools, conditions, and retries. The difference is who selects the next action.</text>
<!-- Fixed workflow; preserve reading order and text clearance. -->
<g id="fixed-workflow">
<rect x="30" y="122" width="1040" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="160" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Fixed workflow · paths specified in code</text>
</g>
<rect x="50" y="195" width="280" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190" y="239" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Read known path</text>
<rect x="410" y="195" width="280" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="550" y="239" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Apply specified edit</text>
<rect x="770" y="195" width="280" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="910" y="239" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Read and compare</text>
<path data-connector="true" d="M 330,231 L 399,231" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="410,231 398,237 398,225" fill="#64748b"/>
<path data-connector="true" d="M 690,231 L 759,231" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="770,231 758,237 758,225" fill="#64748b"/>
<text x="50" y="293" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Code can also define a branch: if the file is missing, use a known fallback path.</text>
<!-- Model directed agent; preserve reading order and text clearance. -->
<g id="model-directed-agent">
<rect x="30" y="354" width="1040" height="213" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="393" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Agent · next action selected from observations</text>
</g>
<rect x="50" y="425" width="280" height="103" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="190" y="463" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Read result</text>
<text x="190" y="502" font-size="18" font-weight="400" text-anchor="middle" fill="#172033">File not found</text>
<rect x="410" y="425" width="280" height="103" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="550" y="463" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Model chooses next</text>
<text x="550" y="502" font-size="18" font-weight="400" text-anchor="middle" fill="#172033">Search for the file</text>
<rect x="770" y="425" width="280" height="103" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="910" y="463" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">New observation</text>
<text x="910" y="502" font-size="18" font-weight="400" text-anchor="middle" fill="#172033">File found: notes.txt</text>
<path data-connector="true" d="M 330,477 L 399,477" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="410,477 398,483 398,471" fill="#64748b"/>
<path data-connector="true" d="M 690,477 L 759,477" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="770,477 758,483 758,471" fill="#64748b"/>
<text x="30" y="610" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The runtime enforces permissions and limits in either design. A predictable task may need only a workflow.</text>
</svg>
