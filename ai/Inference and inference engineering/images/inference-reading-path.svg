<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090.909091" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
<title id="title">Four articles, four scopes: zoom out from one token</title>
<desc id="desc">Four rows, read from top to bottom, each widening the view of the same request. Each row gives a scope, its article, what happens, and what an inference engineer asks. One token, From logits to text with decoding and sampling: scores for the next token become one chosen token; which settings fit the task, and when does the reply stop? One reply, Prefill, decoding, and the KV cache: the model reads the prompt once, then runs once per new token; how long until the first token, and how fast do later tokens arrive? Many requests, Prompt caching across requests: a later request reuses work for an unchanged start of the prompt; how much of the input is reused, and what does that save? The application, In-context learning, context windows, and memory: the application chooses each input and keeps memory outside the model; what fits in the context window, and what must be saved and found again? Also part of inference engineering, but outside these articles: choosing hardware, making the model itself cheaper to run, and scaling across many servers.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="800" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Four articles, four scopes: zoom out from one token</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Read the rows from top to bottom. Each row widens the view of the same request.</text>

<!-- Column headings; the three columns share x positions in every row. -->
<g id="column-headings">
<text x="50" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#64748b">SCOPE AND ARTICLE</text>
<text x="400" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#64748b">WHAT HAPPENS</text>
<text x="745" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#64748b">AN INFERENCE ENGINEER ASKS</text>
</g>

<!-- Row 1: one token. -->
<g id="scope-one-token">
<rect x="30" y="132" width="1040" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="380" y1="148" x2="380" y2="228" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="725" y1="148" x2="725" y2="228" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="168" font-size="23" font-weight="700" text-anchor="start" fill="#172033">One token</text>
<text x="50" y="198" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">From logits to text with</text>
<text x="50" y="222" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">decoding and sampling</text>
<text x="400" y="182" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Scores for the next token</text>
<text x="400" y="208" font-size="18" font-weight="400" text-anchor="start" fill="#172033">become one chosen token.</text>
<text x="745" y="182" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Which settings fit the task?</text>
<text x="745" y="208" font-size="18" font-weight="400" text-anchor="start" fill="#172033">When does the reply stop?</text>
</g>

<!-- Row 2: one reply. -->
<g id="scope-one-reply">
<rect x="30" y="278" width="1040" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="380" y1="294" x2="380" y2="374" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="725" y1="294" x2="725" y2="374" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="314" font-size="23" font-weight="700" text-anchor="start" fill="#172033">One reply</text>
<text x="50" y="344" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">Prefill, decoding, and</text>
<text x="50" y="368" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">the KV cache</text>
<text x="400" y="328" font-size="18" font-weight="400" text-anchor="start" fill="#172033">The model reads the prompt once,</text>
<text x="400" y="354" font-size="18" font-weight="400" text-anchor="start" fill="#172033">then runs once per new token.</text>
<text x="745" y="328" font-size="18" font-weight="400" text-anchor="start" fill="#172033">How long until the first token?</text>
<text x="745" y="354" font-size="18" font-weight="400" text-anchor="start" fill="#172033">How fast do later tokens arrive?</text>
</g>

<!-- Row 3: many requests. -->
<g id="scope-many-requests">
<rect x="30" y="424" width="1040" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="380" y1="440" x2="380" y2="520" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="725" y1="440" x2="725" y2="520" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="460" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Many requests</text>
<text x="50" y="490" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">Prompt caching</text>
<text x="50" y="514" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">across requests</text>
<text x="400" y="474" font-size="18" font-weight="400" text-anchor="start" fill="#172033">A later request reuses work for an</text>
<text x="400" y="500" font-size="18" font-weight="400" text-anchor="start" fill="#172033">unchanged start of the prompt.</text>
<text x="745" y="474" font-size="18" font-weight="400" text-anchor="start" fill="#172033">How much of the input is reused?</text>
<text x="745" y="500" font-size="18" font-weight="400" text-anchor="start" fill="#172033">What does that save?</text>
</g>

<!-- Row 4: the application. -->
<g id="scope-application">
<rect x="30" y="570" width="1040" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="380" y1="586" x2="380" y2="666" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="725" y1="586" x2="725" y2="666" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="606" font-size="23" font-weight="700" text-anchor="start" fill="#172033">The application</text>
<text x="50" y="636" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">In-context learning, context</text>
<text x="50" y="660" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">windows, and memory</text>
<text x="400" y="620" font-size="18" font-weight="400" text-anchor="start" fill="#172033">The application chooses each input</text>
<text x="400" y="646" font-size="18" font-weight="400" text-anchor="start" fill="#172033">and keeps memory outside the model.</text>
<text x="745" y="620" font-size="18" font-weight="400" text-anchor="start" fill="#172033">What fits in the context window?</text>
<text x="745" y="646" font-size="18" font-weight="400" text-anchor="start" fill="#172033">What must be saved and found again?</text>
</g>

<!-- Zoom-out arrows in the gaps between rows; labels sit to the right of each arrow, clear of it. -->
<g id="zoom-out-arrows">
<path data-connector="true" d="M 120,244 L 120,267" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="120,278 114,266 126,266" fill="#64748b"/>
<text x="140" y="267" font-size="17" font-weight="400" text-anchor="start" fill="#64748b">zoom out</text>
<path data-connector="true" d="M 120,390 L 120,413" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="120,424 114,412 126,412" fill="#64748b"/>
<text x="140" y="413" font-size="17" font-weight="400" text-anchor="start" fill="#64748b">zoom out</text>
<path data-connector="true" d="M 120,536 L 120,559" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="120,570 114,558 126,558" fill="#64748b"/>
<text x="140" y="559" font-size="17" font-weight="400" text-anchor="start" fill="#64748b">zoom out</text>
</g>

<!-- Scope limit of the series. -->
<g id="outside-this-series">
<rect x="30" y="704" width="1040" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="735" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Also part of inference engineering, but outside these articles:</text>
<text x="50" y="763" font-size="19" font-weight="400" text-anchor="start" fill="#172033">choosing hardware, making the model itself cheaper to run, and scaling across many servers.</text>
</g>
</svg>
