<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="753" viewBox="0 0 1000 502" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU: multiply content by a learned gate</title>
  <desc id="desc">SwiGLU: multiply content by a learned gate. Where: a gated MLP → two expanded branches → multiply → project back</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="502" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">SwiGLU: multiply content by a learned gate</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: a gated MLP → two expanded branches → multiply → project back</text>
  <!-- Gate examples are outputs after SiLU, not its inputs; the gate can exceed one. -->
  <rect x="28" y="209" width="174" height="78" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="240" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Same input</text>
  <text x="115" y="269" font-size="21" text-anchor="middle" fill="#172033">vector</text>
  <rect x="294" y="112" width="300" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="444" y="146" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Content projection</text>
  <rect x="387" y="167" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="414.5" y="196" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="445" y="167" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="472.5" y="196" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">4</text>
  <path class="connector" d="M202 248 H245 V172 H282" style="stroke:#64748b"/>
  <line class="connector" x1="282" y1="172" x2="285.0" y2="172.0" style="stroke:#64748b"/>
  <polygon points="294,172 284.0,177.0 284.0,167.0" fill="#64748b"/>
  <rect x="294" y="324" width="300" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="444" y="358" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Gate projection + SiLU</text>
  <rect x="387" y="379" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="414.5" y="408" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">0.5</text>
  <rect x="445" y="379" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="472.5" y="408" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <path class="connector" d="M202 248 H245 V384 H282" style="stroke:#64748b"/>
  <line class="connector" x1="282" y1="384" x2="285.0" y2="384.0" style="stroke:#64748b"/>
  <polygon points="294,384 284.0,389.0 284.0,379.0" fill="#64748b"/>
  <path class="connector" d="M594 172 H640 V248" style="stroke:#64748b"/>
  <path class="connector" d="M594 384 H640 V248" style="stroke:#64748b"/>
  <line class="connector" x1="640" y1="248" x2="683.0" y2="248.0" style="stroke:#64748b"/>
  <polygon points="692,248 682.0,253.0 682.0,243.0" fill="#64748b"/>
  <rect x="692" y="148" width="280" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="832" y="183" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">Multiply each slot</text>
  <text x="832" y="223" font-size="25" text-anchor="middle" fill="#172033">2 × 0.5 = 1</text>
  <text x="832" y="261" font-size="25" text-anchor="middle" fill="#172033">4 × 2 = 8</text>
  <text x="832" y="309" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Result [1, 8]</text>
  <line class="connector" x1="832" y1="348" x2="832.0" y2="363.0" style="stroke:#64748b"/>
  <polygon points="832,372 827.0,362.0 837.0,362.0" fill="#64748b"/>
  <rect x="692" y="372" width="280" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="832" y="407" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">Project back → update</text>
  <text x="500" y="477" font-size="18" text-anchor="middle" fill="#64748b">SwiGLU uses SiLU on the gate branch. Its gates can weaken, strengthen, or reverse values.</text>
</svg>
