<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Dense MLP: reuse one set of weights at every position</title>
  <desc id="desc">Dense MLP: reuse one set of weights at every position. Where: one transformer block → its MLP, before residual addition</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Dense MLP: reuse one set of weights at every position</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: one transformer block → its MLP, before residual addition</text>
  <!-- Separate lanes show that a dense MLP does not exchange information between token positions. -->
  <rect x="28" y="122" width="220" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="150" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">The</text>
  <text x="138" y="179" font-size="21" text-anchor="middle" fill="#172033">[2, 1]</text>
  <line class="connector" x1="248" y1="158" x2="361.0" y2="158.0" style="stroke:#64748b"/>
  <polygon points="370,158 360.0,163.0 360.0,153.0" fill="#64748b"/>
  <rect x="370" y="122" width="270" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="150" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Same dense MLP</text>
  <text x="505" y="179" font-size="19" text-anchor="middle" fill="#172033">same learned weights</text>
  <line class="connector" x1="640" y1="158" x2="743.0" y2="158.0" style="stroke:#64748b"/>
  <polygon points="752,158 742.0,163.0 742.0,153.0" fill="#64748b"/>
  <rect x="752" y="122" width="220" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="862" y="150" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Update for The</text>
  <text x="862" y="179" font-size="21" text-anchor="middle" fill="#172033">[5, 3]</text>
  <rect x="28" y="226" width="220" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="254" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">cat</text>
  <text x="138" y="283" font-size="21" text-anchor="middle" fill="#172033">[1, 0]</text>
  <line class="connector" x1="248" y1="262" x2="361.0" y2="262.0" style="stroke:#64748b"/>
  <polygon points="370,262 360.0,267.0 360.0,257.0" fill="#64748b"/>
  <rect x="370" y="226" width="270" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="254" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Same dense MLP</text>
  <text x="505" y="283" font-size="19" text-anchor="middle" fill="#172033">same learned weights</text>
  <line class="connector" x1="640" y1="262" x2="743.0" y2="262.0" style="stroke:#64748b"/>
  <polygon points="752,262 742.0,267.0 742.0,257.0" fill="#64748b"/>
  <rect x="752" y="226" width="220" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="862" y="254" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Update for cat</text>
  <text x="862" y="283" font-size="21" text-anchor="middle" fill="#172033">[2, 1]</text>
  <text x="500" y="335" font-size="19" text-anchor="middle" fill="#64748b">Every token runs the full MLP. Its output changes because its input vector changes.</text>
</svg>
