<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="744" viewBox="0 0 1000 496" role="img" aria-labelledby="title desc">
  <title id="title">Nonlinear activations bend the input–output relationship</title>
  <desc id="desc">Nonlinear activations bend the input–output relationship. Where: inside the MLP → after expansion, before projection back</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="496" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Nonlinear activations bend the input–output relationship</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: inside the MLP → after expansion, before projection back</text>
  <!-- Two graphs share identical scales. Curves are function plots, not data connectors. -->
  <rect x="28" y="112" width="458" height="292" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="147" font-size="22" text-anchor="start" fill="#172033" font-weight="700">ReLU: rectified linear unit</text>
  <line x1="76" y1="310" x2="426" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <line x1="203" y1="183" x2="203" y2="367" stroke="#64748b" stroke-width="1.5"/>
  <text x="426" y="337" font-size="18" text-anchor="end" fill="#64748b">input</text>
  <text x="215" y="188" font-size="18" text-anchor="start" fill="#64748b">output</text>
  <path d="M98 310 H203 L308 205" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="257" y="384" font-size="19" text-anchor="middle" fill="#172033">−2 → 0  •  0 → 0  •  2 → 2</text>
  <rect x="514" y="112" width="458" height="292" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="534" y="147" font-size="22" text-anchor="start" fill="#172033" font-weight="700">SiLU: sigmoid linear unit (Swish)</text>
  <line x1="562" y1="310" x2="912" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <line x1="689" y1="183" x2="689" y2="367" stroke="#64748b" stroke-width="1.5"/>
  <text x="912" y="337" font-size="18" text-anchor="end" fill="#64748b">input</text>
  <text x="701" y="188" font-size="18" text-anchor="start" fill="#64748b">output</text>
  <path d="M584.0 315.0 L587.5 315.3 L591.0 315.6 L594.5 316.0 L598.0 316.3 L601.5 316.6 L605.0 317.0 L608.5 317.3 L612.0 317.7 L615.5 318.0 L619.0 318.3 L622.5 318.7 L626.0 318.9 L629.5 319.2 L633.0 319.4 L636.5 319.6 L640.0 319.7 L643.5 319.7 L647.0 319.7 L650.5 319.6 L654.0 319.4 L657.5 319.1 L661.0 318.7 L664.5 318.1 L668.0 317.4 L671.5 316.6 L675.0 315.6 L678.5 314.5 L682.0 313.2 L685.5 311.7 L689.0 310.0 L692.5 308.2 L696.0 306.2 L699.5 304.0 L703.0 301.6 L706.5 299.1 L710.0 296.4 L713.5 293.6 L717.0 290.7 L720.5 287.6 L724.0 284.4 L727.5 281.1 L731.0 277.7 L734.5 274.2 L738.0 270.7 L741.5 267.1 L745.0 263.4 L748.5 259.7 L752.0 255.9 L755.5 252.2 L759.0 248.3 L762.5 244.5 L766.0 240.7 L769.5 236.8 L773.0 233.0 L776.5 229.1 L780.0 225.3 L783.5 221.5 L787.0 217.6 L790.5 213.8 L794.0 210.0" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="743" y="384" font-size="19" text-anchor="middle" fill="#172033">−2 → −0.24  •  0 → 0  •  2 → 1.76</text>
  <text x="500" y="444" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Without a nonlinear rule: ×2 followed by ×3 is just ×6.</text>
  <text x="500" y="478" font-size="18" text-anchor="middle" fill="#64748b">A bend lets stacked layers express functions that one multiply-and-add step cannot.</text>
</svg>
