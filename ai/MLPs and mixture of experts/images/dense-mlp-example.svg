<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="735" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
  <title id="title">An MLP transforms each position separately</title>
  <desc id="desc">An MLP transforms each position separately. Where: repeated block → MLP → update added to the residual stream</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="490" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">An MLP transforms each position separately</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: repeated block → MLP → update added to the residual stream</text>
  <!-- A tiny dense MLP gives an explicit vector at each stage and identifies a neuron as one intermediate coordinate. -->
  <rect x="28" y="135" width="182" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="119" y="170" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Input</text>
  <circle cx="70" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <circle cx="117" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="117" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <text x="119" y="282" font-size="21" text-anchor="middle" fill="#172033">2 slots</text>
  <rect x="270" y="135" width="182" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="361" y="170" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Expand</text>
  <circle cx="312" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="312" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <circle cx="359" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="359" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">−1</text>
  <circle cx="406" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="406" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <text x="361" y="282" font-size="21" text-anchor="middle" fill="#172033">3 slots</text>
  <rect x="530" y="135" width="182" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="621" y="170" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">ReLU</text>
  <circle cx="572" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="572" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <circle cx="619" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="619" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">0</text>
  <circle cx="666" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="666" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <text x="621" y="282" font-size="21" text-anchor="middle" fill="#172033">3 slots</text>
  <rect x="790" y="135" width="182" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="881" y="170" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Project back</text>
  <circle cx="832" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="832" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">5</text>
  <circle cx="879" cy="222" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="879" y="229" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <text x="881" y="282" font-size="21" text-anchor="middle" fill="#172033">2 slots</text>
  <line class="connector" x1="210" y1="222" x2="261.0" y2="222.0" style="stroke:#64748b"/>
  <polygon points="270,222 260.0,227.0 260.0,217.0" fill="#64748b"/>
  <line class="connector" x1="452" y1="222" x2="521.0" y2="222.0" style="stroke:#64748b"/>
  <polygon points="530,222 520.0,227.0 520.0,217.0" fill="#64748b"/>
  <line class="connector" x1="712" y1="222" x2="781.0" y2="222.0" style="stroke:#64748b"/>
  <polygon points="790,222 780.0,227.0 780.0,217.0" fill="#64748b"/>
  <text x="500" y="345" font-size="20" text-anchor="middle" fill="#172033">Expansion: more slots, not more tokens. A neuron is one intermediate slot.</text>
  <rect x="28" y="373" width="944" height="85" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="405" font-size="22" text-anchor="start" fill="#172033" font-weight="700">Dense = every position uses the same full MLP in this block.</text>
  <text x="50" y="437" font-size="18" text-anchor="start" fill="#172033">Projection = learned weighted sums that change the vector width. Toy weights are illustrative.</text>
</svg>
