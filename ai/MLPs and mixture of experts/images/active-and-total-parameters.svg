<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="525" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Total parameters are stored; active parameters do work</title>
  <desc id="desc">Total parameters are stored; active parameters do work. Where: the model → all stored weights versus one token’s chosen route</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="350" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Total parameters are stored; active parameters do work</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: the model → all stored weights versus one token’s chosen route</text>
  <!-- Mixtral numbers are model-wide totals including shared components, not just expert weights. -->
  <rect x="28" y="112" width="944" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="146" font-size="23" text-anchor="start" fill="#172033" font-weight="700">Mixtral 8×7B: one token selects 2 of 8 experts per layer</text>
  <rect x="52" y="171" width="92" height="52" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="98" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="164" y="171" width="92" height="52" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="276" y="171" width="92" height="52" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="322" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <rect x="388" y="171" width="92" height="52" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="434" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">4</text>
  <rect x="500" y="171" width="92" height="52" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="546" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">5</text>
  <rect x="612" y="171" width="92" height="52" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="658" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">6</text>
  <rect x="724" y="171" width="92" height="52" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="770" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">7</text>
  <rect x="836" y="171" width="92" height="52" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="882" y="205" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">8</text>
  <text x="500" y="260" font-size="19" text-anchor="middle" fill="#172033">Blue = selected for this token; gray = stored but unused by this token.</text>
  <text x="500" y="322" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">Whole model: 46.7 billion stored parameters • about 12.9 billion active per token</text>
</svg>
