<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="765" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">Sparse mixture of experts: route each token to a few MLPs</title>
  <desc id="desc">Sparse mixture of experts: route each token to a few MLPs. Where: repeated block → an alternative to the single dense MLP</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="510" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Sparse mixture of experts: route each token to a few MLPs</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: repeated block → an alternative to the single dense MLP</text>
  <!-- Four experts are stored but only two execute for this token. Unselected routes are absent. -->
  <rect x="28" y="211" width="180" height="108" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="245" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">Router</text>
  <text x="118" y="275" font-size="18" text-anchor="middle" fill="#172033">learned selector</text>
  <text x="118" y="302" font-size="18" text-anchor="middle" fill="#172033">for this token</text>
  <rect x="318" y="128" width="140" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="388" y="163" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Expert 1</text>
  <text x="388" y="196" font-size="20" text-anchor="middle" fill="#172033">an MLP</text>
  <text x="388" y="231" font-size="22" text-anchor="middle" fill="#2563eb" font-weight="700">RUN</text>
  <rect x="478" y="128" width="140" height="130" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="548" y="163" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Expert 2</text>
  <text x="548" y="196" font-size="20" text-anchor="middle" fill="#172033">an MLP</text>
  <text x="548" y="231" font-size="22" text-anchor="middle" fill="#64748b" font-weight="700">skip</text>
  <rect x="638" y="128" width="140" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="708" y="163" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Expert 3</text>
  <text x="708" y="196" font-size="20" text-anchor="middle" fill="#172033">an MLP</text>
  <text x="708" y="231" font-size="22" text-anchor="middle" fill="#2563eb" font-weight="700">RUN</text>
  <rect x="798" y="128" width="140" height="130" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="868" y="163" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Expert 4</text>
  <text x="868" y="196" font-size="20" text-anchor="middle" fill="#172033">an MLP</text>
  <text x="868" y="231" font-size="22" text-anchor="middle" fill="#64748b" font-weight="700">skip</text>
  <path class="connector" d="M208 265 H270 V94 H708" style="stroke:#64748b"/>
  <line class="connector" x1="388" y1="94" x2="388.0" y2="119.0" style="stroke:#64748b"/>
  <polygon points="388,128 383.0,118.0 393.0,118.0" fill="#64748b"/>
  <line class="connector" x1="708" y1="94" x2="708.0" y2="119.0" style="stroke:#64748b"/>
  <polygon points="708,128 703.0,118.0 713.0,118.0" fill="#64748b"/>
  <text x="430" y="293" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">75%</text>
  <text x="750" y="293" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">25%</text>
  <path class="connector" d="M388 258 V324 H455" style="stroke:#64748b"/>
  <line class="connector" x1="455" y1="324" x2="455.0" y2="343.0" style="stroke:#64748b"/>
  <polygon points="455,352 450.0,342.0 460.0,342.0" fill="#64748b"/>
  <path class="connector" d="M708 258 V324 H665" style="stroke:#64748b"/>
  <line class="connector" x1="665" y1="324" x2="665.0" y2="343.0" style="stroke:#64748b"/>
  <polygon points="665,352 660.0,342.0 670.0,342.0" fill="#64748b"/>
  <rect x="318" y="352" width="620" height="101" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="628" y="388" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">Weighted blend of selected outputs</text>
  <text x="628" y="428" font-size="23" text-anchor="middle" fill="#172033">0.75 × expert 1 + 0.25 × expert 3</text>
  <text x="500" y="486" font-size="18" text-anchor="middle" fill="#64748b">Sparse = only some experts run per token. Another token may choose a different pair.</text>
</svg>
