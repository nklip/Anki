<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="818.75" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">Save, retrieve, and refresh external progress notes</title>
<desc id="desc">A runtime writes progress to storage and later reads it into context. A second row shows why a file change makes an old verification note stale and why current state must be checked again.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="655" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Saved notes help only after they are read back</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Saved notes live in external storage; they do not automatically appear in the next model input.</text>
<!-- Write a progress note; keep labels clear of connector corridors. -->
<g id="write-a-progress-note">
<rect x="30" y="130" width="340" height="203" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="50" y="170" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Write a progress note</text>
<text x="50" y="216" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Homepage: 11:00, checked.</text>
<text x="50" y="250" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Contact edit still pending.</text>
<text x="50" y="284" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Save to progress.md.</text>
</g>
<!-- Store outside the call; keep labels clear of connector corridors. -->
<g id="store-outside-the-call">
<rect x="430" y="130" width="340" height="203" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="450" y="170" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Store outside the call</text>
<text x="450" y="216" font-size="21" font-weight="400" text-anchor="start" fill="#172033">The note can outlive</text>
<text x="450" y="250" font-size="21" font-weight="400" text-anchor="start" fill="#172033">this conversation window.</text>
<text x="450" y="284" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Storage preserves the text.</text>
</g>
<!-- Read into next input; keep labels clear of connector corridors. -->
<g id="read-into-next-input">
<rect x="830" y="130" width="340" height="203" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="850" y="170" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Read into next input</text>
<text x="850" y="216" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Runtime reads relevant text.</text>
<text x="850" y="250" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Next call receives that text</text>
<text x="850" y="284" font-size="21" font-weight="400" text-anchor="start" fill="#172033">with the current goal.</text>
</g>
<!-- Save read flow; keep labels clear of connector corridors. -->
<g id="save-read-flow">
<path data-connector="true" d="M 370,239 L 419,239" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="430,239 418,245 418,233" fill="#64748b"/>
<path data-connector="true" d="M 770,239 L 819,239" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,239 818,245 818,233" fill="#64748b"/>
</g>
<!-- Stale note; keep labels clear of connector corridors. -->
<g id="stale-note">
<rect x="30" y="389" width="340" height="182" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="430" font-size="23" font-weight="700" text-anchor="start" fill="#172033">A note can become stale</text>
<text x="50" y="471" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Someone edits homepage</text>
<text x="50" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#172033">after the earlier check.</text>
<text x="50" y="535" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“Verified” is now old evidence.</text>
</g>
<!-- Fresh check; keep labels clear of connector corridors. -->
<g id="fresh-check">
<rect x="430" y="389" width="340" height="182" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="450" y="430" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Reread and check</text>
<text x="450" y="471" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Inspect the current file.</text>
<text x="450" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Compare it with the goal.</text>
<text x="450" y="535" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Do not trust the old note alone.</text>
</g>
<!-- Updated note; keep labels clear of connector corridors. -->
<g id="updated-note">
<rect x="830" y="389" width="340" height="182" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="850" y="430" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Update the task state</text>
<text x="850" y="471" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Record the new observation</text>
<text x="850" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#172033">and any remaining work.</text>
<text x="850" y="535" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Use it in the next call.</text>
</g>
<!-- Freshness flow; keep labels clear of connector corridors. -->
<g id="freshness-flow">
<path data-connector="true" d="M 370,485 L 419,485" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="430,485 418,491 418,479" fill="#64748b"/>
<path data-connector="true" d="M 770,485 L 819,485" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,485 818,491 818,479" fill="#64748b"/>
</g>
<text x="30" y="618" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Stale means no longer current. A saved claim records an earlier observation; it is not a fresh check.</text>
</svg>
