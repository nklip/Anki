<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="981.25" viewBox="0 0 1200 785" role="img" aria-labelledby="title desc">
<title id="title">Select context for the next agent decision</title>
<desc id="desc">A runtime selects instructions, tool descriptions, progress, and retrieved evidence from a larger information pool. A website-hours task keeps weekend constraints and contact-page evidence in the current input.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="785" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Select information for the next decision</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Context engineering = choosing and maintaining useful input as a task progresses.</text>
<!-- Available pool; keep labels clear of connector corridors. -->
<g id="available-pool">
<rect x="30" y="180" width="250" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="222" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Available pool</text>
<text x="50" y="270" font-size="20" font-weight="400" text-anchor="start" fill="#172033">All website files</text>
<text x="50" y="315" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Conversation history</text>
<text x="50" y="360" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Saved notes</text>
<text x="50" y="405" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tool definitions</text>
<text x="50" y="450" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Old search results</text>
</g>
<!-- Selected context; keep labels clear of connector corridors. -->
<g id="selected-context">
<rect x="360" y="113" width="810" height="458" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="380" y="153" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Runtime selects this call’s input</text>
</g>
<!-- Instructions; keep labels clear of connector corridors. -->
<g id="instructions">
<rect x="380" y="180" width="370" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="400" y="221" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Instructions</text>
<text x="400" y="267" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Goal: weekdays open at 11:00.</text>
<text x="400" y="302" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Constraint: keep weekends unchanged.</text>
</g>
<!-- Tool descriptions; keep labels clear of connector corridors. -->
<g id="tool-descriptions">
<rect x="780" y="180" width="370" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="800" y="221" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tool descriptions</text>
<text x="800" y="267" font-size="18" font-weight="400" text-anchor="start" fill="#172033">What read_file / edit_file can do</text>
<text x="800" y="302" font-size="18" font-weight="400" text-anchor="start" fill="#172033">and which inputs they accept.</text>
</g>
<!-- Progress; keep labels clear of connector corridors. -->
<g id="progress">
<rect x="380" y="374" width="370" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="400" y="415" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Progress</text>
<text x="400" y="461" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Homepage: checked.</text>
<text x="400" y="496" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Contact page: still needs work.</text>
</g>
<!-- Retrieved evidence; keep labels clear of connector corridors. -->
<g id="retrieved-evidence">
<rect x="780" y="374" width="370" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="800" y="415" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Retrieved evidence</text>
<text x="800" y="461" font-size="18" font-weight="400" text-anchor="start" fill="#172033">contact.html, opening-hours section</text>
<text x="800" y="496" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Weekdays 10:00; weekends 09:00.</text>
</g>
<!-- Selection flow; keep labels clear of connector corridors. -->
<g id="selection-flow">
<path data-connector="true" d="M 280,350 L 349,350" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="360,350 348,356 348,344" fill="#64748b"/>
<text x="291" y="326" font-size="18" font-weight="400" text-anchor="start" fill="#172033">select</text>
</g>
<!-- Next choice; keep labels clear of connector corridors. -->
<g id="next-choice">
<rect x="30" y="616" width="1140" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="653" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Possible next request: edit weekday hours in contact.html; preserve weekend hours.</text>
<text x="50" y="689" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A filename gives a location. The file contents supply evidence. Each new result can change the next input.</text>
</g>
<text x="30" y="752" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">The runtime is the application coordinating the calls. It does not have to send every old message or file.</text>
</svg>
