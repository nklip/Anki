<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
  <title id="title">Select useful context for the next decision</title>
  <desc id="desc">Read left to right. From a larger pool of page files, messages, notes, tool definitions, and rules, the runtime selects information for one model call. This input preserves the goal of weekdays at 11:00 with weekends unchanged, available tools, progress on three pages, and fresh contact-page evidence. The model can request an edit to contact.html, changing weekdays from 10:00 to 11:00 while keeping weekends at 09:00. After each tool result the runtime selects context again.</desc>
  <!-- Original simplified diagram inspired by Anthropic's context-curation overview; not an exact recreation.
       Source: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
       Figure: https://www-cdn.anthropic.com/images/4zrzovbb/website/faa261102e46c7f090a2402a49000ffae18c5dd6-2292x1290.png -->
  <!-- Shared series typography; each panel states its own role. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="690" fill="#ffffff"/>
  <!-- The same concrete task continues across the three stages. -->
  <text class="title" x="28" y="43" text-anchor="start">Select useful context for the next decision</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Example: update weekday opening hours across a website; preserve weekend hours.</text>
  <!-- A larger pool stays outside this call until the runtime selects useful information. -->
  <g id="available-pool">
    <rect x="28" y="196" width="220" height="280" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="138" y="231" text-anchor="middle">Available pool</text>
    <text class="body" x="138" y="275" text-anchor="middle">All page files</text>
    <text class="body" x="138" y="314" text-anchor="middle">Past messages</text>
    <text class="body" x="138" y="353" text-anchor="middle">Saved notes</text>
    <text class="body" x="138" y="392" text-anchor="middle">Tools and rules</text>
    <text class="body" x="138" y="431" text-anchor="middle">Old search logs</text>
  </g>
  <text class="note" x="138" y="520" text-anchor="middle">Not every file or</text>
  <text class="note" x="138" y="547" text-anchor="middle">old message is sent.</text>
  <!-- Selection label stays above its arrow and clear of the adjacent panels. -->
  <text class="note" x="301" y="304" text-anchor="middle">Runtime</text>
  <text class="note" x="301" y="330" text-anchor="middle">selects</text>
  <g id="pool-to-selected-input">
    <line class="connector" x1="249" y1="359" x2="341" y2="359"/>
    <polygon class="head" points="353,359 340,353 340,365"/>
  </g>
  <!-- This boundary contains only the assembled input for the next model call. -->
  <rect id="input-boundary" x="354" y="112" width="430" height="514" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text class="label" x="569" y="143" text-anchor="middle">Selected for this call</text>
  <!-- Goal and constraints remain present even when older details are omitted. -->
  <g id="instructions">
    <rect x="370" y="160" width="398" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="569" y="187" text-anchor="middle">Goal and rules</text>
    <text class="body" x="569" y="214" text-anchor="middle">Weekdays: 11:00</text>
    <text class="body" x="569" y="239" text-anchor="middle">Keep weekends unchanged.</text>
  </g>
  <!-- These are tool definitions, not already executed actions. -->
  <g id="tool-definitions">
    <rect x="370" y="262" width="398" height="90" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="569" y="289" text-anchor="middle">Available tools</text>
    <text class="body" x="569" y="316" text-anchor="middle">Find, read, edit</text>
    <text class="body" x="569" y="341" text-anchor="middle">Descriptions + input rules</text>
  </g>
  <!-- Checked progress and unfinished work remain separate facts. -->
  <g id="selected-progress">
    <rect x="370" y="364" width="398" height="118" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="569" y="391" text-anchor="middle">Selected progress</text>
    <text class="body" x="569" y="418" text-anchor="middle">home.html: updated and checked</text>
    <text class="body" x="569" y="444" text-anchor="middle">contact.html: pending</text>
    <text class="body" x="569" y="470" text-anchor="middle">mobile.html: unchecked</text>
  </g>
  <!-- Fresh evidence grounds the next action in the current page contents. -->
  <g id="fresh-evidence">
    <rect x="370" y="494" width="398" height="116" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="label" x="569" y="521" text-anchor="middle">Fresh file evidence</text>
    <text class="body" x="569" y="549" text-anchor="middle">contact.html:</text>
    <text class="body" x="569" y="576" text-anchor="middle">weekdays 10:00; weekends 09:00</text>
  </g>
  <!-- The model requests an action; the runtime is responsible for running it. -->
  <g id="next-model-call">
    <rect x="856" y="254" width="216" height="228" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="964" y="287" text-anchor="middle">Next model call</text>
    <text class="body" x="964" y="326" text-anchor="middle">Request an edit:</text>
    <text class="body" x="964" y="359" text-anchor="middle">contact.html</text>
    <text class="body" x="964" y="393" text-anchor="middle">weekdays → 11:00</text>
    <text class="note" x="964" y="433" text-anchor="middle">Keep weekends</text>
    <text class="note" x="964" y="459" text-anchor="middle">at 09:00.</text>
  </g>
  <!-- Shafts end inside their triangles; tips meet the outer edges of target strokes. -->
  <g id="assembled-input-to-model">
    <line class="connector" x1="785" y1="369" x2="843" y2="369"/>
    <polygon class="head" points="855,369 842,363 842,375"/>
  </g>
  <text class="note" x="964" y="520" text-anchor="middle">The runtime</text>
  <text class="note" x="964" y="547" text-anchor="middle">runs the edit.</text>
  <!-- Context selection repeats as new evidence becomes available. -->
  <text class="note" x="550" y="663" text-anchor="middle">After each tool result, the runtime selects context again.</text>
</svg>
