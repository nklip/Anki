<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="875" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Stable prefixes and changing context state</title>
<desc id="desc">Three calls preserve identical instructions and tool definitions while progress, tool results, or summaries change later. Eligible exact prefix computation may be reused; summary changes still need fresh work.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Keep stable instructions before changing task state</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Prefix = the beginning of the input. Prompt caching can reuse computation for an eligible exact match.</text>
<!-- Earlier call; keep labels clear of connector corridors. -->
<g id="earlier-call">
<text x="30" y="178" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Earlier</text>
<rect x="170" y="140" width="550" height="77" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="445" y="187" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Same instructions + tool definitions</text>
<rect x="760" y="140" width="410" height="77" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="965" y="187" font-size="21" font-weight="700" text-anchor="middle" fill="#172033">Earlier progress + older results</text>
</g>
<!-- Later call; keep labels clear of connector corridors. -->
<g id="later-call">
<text x="30" y="303" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Later</text>
<rect x="170" y="265" width="550" height="77" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="445" y="312" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Same instructions + tool definitions</text>
<rect x="760" y="265" width="410" height="77" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="965" y="312" font-size="21" font-weight="700" text-anchor="middle" fill="#172033">New progress + fresh results</text>
</g>
<!-- After compaction; keep labels clear of connector corridors. -->
<g id="after-compaction">
<text x="30" y="428" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Compacted</text>
<rect x="170" y="390" width="550" height="77" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="445" y="437" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Same instructions + tool definitions</text>
<rect x="760" y="390" width="410" height="77" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="965" y="437" font-size="21" font-weight="700" text-anchor="middle" fill="#172033">Compacted summary + recent results</text>
</g>
<!-- Prefix reuse rule; keep labels clear of connector corridors. -->
<g id="prefix-reuse-rule">
<rect x="30" y="514" width="1140" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="554" font-size="23" font-weight="700" text-anchor="start" fill="#172033">The unchanged eligible prefix may be reused; changed text needs fresh processing.</text>
<text x="50" y="594" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Similar meaning is not exact matching. Update stale or wrong content even when that reduces reuse.</text>
</g>
<text x="30" y="668" font-size="21" font-weight="400" text-anchor="start" fill="#64748b">Caching saves computation. It does not restore omitted facts, add context capacity, or verify a saved note.</text>
</svg>
