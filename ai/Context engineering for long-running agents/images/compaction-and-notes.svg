<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="818.75" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">Compaction preserves useful task state in a shorter summary</title>
<desc id="desc">Older website-editing history becomes a compact summary retaining the goal, weekend constraint, verified homepage, unfinished contact page, and evidence location. A vague summary would lose important task state.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="655" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Compaction replaces older history with a summary</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Compaction makes room inside the same context window; summaries can omit useful details.</text>
<!-- History before; keep labels clear of connector corridors. -->
<g id="history-before">
<rect x="30" y="132" width="470" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="175" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Older conversation</text>
<text x="50" y="224" font-size="20" font-weight="400" text-anchor="start" fill="#172033">User: weekdays should be 11:00.</text>
<text x="50" y="261" font-size="20" font-weight="400" text-anchor="start" fill="#172033">User: keep weekends unchanged.</text>
<text x="50" y="298" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Read homepage; changed and checked.</text>
<text x="50" y="335" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Read contact page: weekdays 10:00.</text>
<text x="50" y="372" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Contact edit is still pending.</text>
</g>
<!-- Summary after; keep labels clear of connector corridors. -->
<g id="summary-after">
<rect x="640" y="132" width="530" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="660" y="175" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Useful compact summary</text>
<text x="660" y="224" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Goal: weekdays 11:00; preserve weekends.</text>
<text x="660" y="261" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Homepage change verified.</text>
<text x="660" y="298" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Contact page still needs editing.</text>
<text x="660" y="335" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Evidence: contact.html, hours section.</text>
<text x="660" y="372" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Reread if the file has changed.</text>
</g>
<!-- Compaction flow; keep labels clear of connector corridors. -->
<g id="compaction-flow">
<path data-connector="true" d="M 500,277 L 629,277" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="640,277 628,283 628,271" fill="#64748b"/>
<text x="516" y="253" font-size="19" font-weight="400" text-anchor="start" fill="#172033">summarize</text>
</g>
<!-- Loss warning; keep labels clear of connector corridors. -->
<g id="loss-warning">
<rect x="30" y="468" width="1140" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="507" font-size="24" font-weight="700" text-anchor="start" fill="#172033">“Hours updated” loses the distinction between checked work and unfinished work.</text>
<text x="50" y="549" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Keep constraints, evidence locations, decisions and remaining work. Retrieve omitted details when needed.</text>
</g>
<text x="30" y="622" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A shorter summary is useful only if the next call still has the information needed for its decision.</text>
</svg>
