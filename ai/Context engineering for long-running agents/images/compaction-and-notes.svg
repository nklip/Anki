<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Shorter history and durable notes do different jobs</title>
  <desc id="desc">Top: compaction replaces older conversation history with a summary that preserves the weekday goal, weekend constraint, checked homepage, unfinished contact-page edit, unchecked mobile page, and evidence locations. Bottom: separately, the runtime can save a progress note outside active context and read it into a later input. Compaction can lose details, and saved notes can become stale.</desc>
  <!-- Shared series typography; each panel states its own role. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="610" fill="#ffffff"/>
  <!-- Heading states the lesson before the body introduces its parts. -->
  <text class="title" x="28" y="43" text-anchor="start">Shorter history and durable notes do different jobs</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">A useful record preserves the goal, checked outcomes, unfinished work, and evidence locations.</text>
  <!-- Older history; labels explain the color and role. -->
  <g id="older-history">
    <rect x="28" y="112" width="400" height="256" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="label" x="228.0" y="147" text-anchor="middle">Older conversation history</text>
  <text class="body" x="228.0" y="190" text-anchor="middle">Original request + many turns</text>
  <text class="body" x="228.0" y="228" text-anchor="middle">Read and edited home.html</text>
  <text class="body" x="228.0" y="266" text-anchor="middle">Checked homepage hours</text>
  <text class="body" x="228.0" y="304" text-anchor="middle">Read contact.html</text>
  <text class="body" x="228.0" y="342" text-anchor="middle">Search logs and tool results</text>
  </g>
  <!-- Compact summary; labels explain the color and role. -->
  <g id="compact-summary">
    <rect x="550" y="112" width="522" height="256" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="811.0" y="147" text-anchor="middle">Useful compact summary</text>
  <text class="body" x="811.0" y="189" text-anchor="middle">Goal: weekdays 11:00; preserve weekends</text>
  <text class="body" x="811.0" y="227" text-anchor="middle">home.html: updated and checked</text>
  <text class="body" x="811.0" y="265" text-anchor="middle">contact.html: still 10:00; edit pending</text>
  <text class="body" x="811.0" y="303" text-anchor="middle">mobile.html: not checked</text>
  <text class="body" x="811.0" y="341" text-anchor="middle">Evidence: page files; reread as needed</text>
  </g>
  <text class="note" x="489" y="222" text-anchor="middle">compact</text>
  <!-- history-to-summary: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="history-to-summary">
    <line class="connector" x1="429" y1="250" x2="538" y2="250"/>
    <polygon class="head" points="550,250 537,244 537,256"/>
  </g>
  <text class="label" x="28" y="415" text-anchor="start">Persistence is a separate step: save useful state, then reload it when needed.</text>
  <!-- Saved note file; labels explain the color and role. -->
  <g id="saved-note-file">
    <rect x="28" y="449" width="400" height="100" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="label" x="228.0" y="486" text-anchor="middle">Progress file outside context</text>
  <text class="body" x="228.0" y="521" text-anchor="middle">The runtime saves the note.</text>
  </g>
  <!-- Later model input; labels explain the color and role. -->
  <g id="later-model-input">
    <rect x="550" y="449" width="522" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="811.0" y="486" text-anchor="middle">A later model input</text>
  <text class="body" x="811.0" y="521" text-anchor="middle">The runtime reads the needed note.</text>
  </g>
  <text class="note" x="489" y="475" text-anchor="middle">reload</text>
  <!-- saved-note-to-later-input: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="saved-note-to-later-input">
    <line class="connector" x1="429" y1="505" x2="538" y2="505"/>
    <polygon class="head" points="550,505 537,499 537,511"/>
  </g>
  <text class="note" x="550" y="586" text-anchor="middle">A summary can omit details. A saved note can become stale. Keep evidence locations.</text>
</svg>
