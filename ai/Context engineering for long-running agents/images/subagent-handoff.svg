<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="806.25" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc">
<title id="title">Subagent brief, separate context, and evidence report</title>
<desc id="desc">A lead sends a search-only website-hours assignment. A worker with separate context inspects files and returns paths, observations, and explicit unchecked work. The lead retains responsibility for the next decision.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="645" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">A subagent handoff transfers a focused task and its evidence</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A subagent is another agent assigned part of the work; this example uses separate contexts.</text>
<!-- Lead brief; keep labels clear of connector corridors. -->
<g id="lead-brief">
<rect x="30" y="132" width="340" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="50" y="174" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Lead sends a brief</text>
<text x="50" y="222" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Task: find pages with hours.</text>
<text x="50" y="258" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Constraint: search only; do not edit.</text>
<text x="50" y="294" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Return paths and observed times.</text>
<text x="50" y="330" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Goal: weekdays should be 11:00.</text>
<text x="50" y="366" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Keep weekends unchanged.</text>
</g>
<!-- Worker context; keep labels clear of connector corridors. -->
<g id="worker-context">
<rect x="430" y="132" width="340" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="450" y="174" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Worker’s own context</text>
<text x="450" y="222" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Receives the brief.</text>
<text x="450" y="258" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Uses tools to inspect pages.</text>
<text x="450" y="294" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tracks its own observations.</text>
<text x="450" y="330" font-size="20" font-weight="400" text-anchor="start" fill="#172033">It need not see the lead’s</text>
<text x="450" y="366" font-size="20" font-weight="400" text-anchor="start" fill="#172033">whole conversation.</text>
</g>
<!-- Worker report; keep labels clear of connector corridors. -->
<g id="worker-report">
<rect x="830" y="132" width="340" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="850" y="174" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Report returned</text>
<text x="850" y="222" font-size="19" font-weight="400" text-anchor="start" fill="#172033">contact.html: weekdays 10:00</text>
<text x="850" y="258" font-size="19" font-weight="400" text-anchor="start" fill="#172033">footer.html: not checked</text>
<text x="850" y="294" font-size="19" font-weight="400" text-anchor="start" fill="#172033">No files changed.</text>
<text x="850" y="330" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Evidence: paths + excerpts</text>
<text x="850" y="366" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Uncertainty stays explicit.</text>
</g>
<!-- Handoff flow; keep labels clear of connector corridors. -->
<g id="handoff-flow">
<path data-connector="true" d="M 370,273 L 419,273" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="430,273 418,279 418,267" fill="#64748b"/>
<path data-connector="true" d="M 770,273 L 819,273" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,273 818,279 818,267" fill="#64748b"/>
</g>
<!-- Lead responsibility; keep labels clear of connector corridors. -->
<g id="lead-responsibility">
<rect x="30" y="464" width="1140" height="105" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="505" font-size="25" font-weight="700" text-anchor="start" fill="#172033">The lead uses the report to decide what to inspect or do next.</text>
<text x="50" y="545" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A compact report can replace noisy intermediate logs, but a bare “all done” hides evidence and omissions.</text>
</g>
<text x="30" y="611" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Handoff = transferring the assignment and relevant information; returned claims may still need checking.</text>
</svg>
