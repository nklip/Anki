<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="482" viewBox="0 0 1100 482" role="img" aria-labelledby="title desc">
  <title id="title">A handoff sends a task out and brings evidence back</title>
  <desc id="desc">The lead agent sends a focused task to a worker with a separate context: find other pages with opening hours and preserve weekends. The worker searches files and returns a report identifying contact-page weekday hours of 10:00 and an unchecked mobile page. The lead uses these findings to choose what to inspect next. The report need not contain every search result.</desc>
  <!-- Shared series typography; each panel states its own role. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="482" fill="#ffffff"/>
  <!-- Heading states the lesson before the body introduces its parts. -->
  <text class="title" x="28" y="43" text-anchor="start">A handoff sends a task out and brings evidence back</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Separate contexts: the worker receives the information supplied for its task.</text>
  <!-- Lead agent; labels explain the color and role. -->
  <g id="lead-agent">
    <rect x="28" y="120" width="350" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="203.0" y="160" text-anchor="middle">Lead agent</text>
  <text class="body" x="203.0" y="216" text-anchor="middle">Holds the overall task</text>
  <text class="body" x="203.0" y="263" text-anchor="middle">Sends relevant constraints</text>
  <text class="body" x="203.0" y="319" text-anchor="middle">Reads the worker’s report</text>
  <text class="body" x="203.0" y="366" text-anchor="middle">Chooses what to check next</text>
  </g>
  <!-- Focused worker; labels explain the color and role. -->
  <g id="focused-worker">
    <rect x="722" y="120" width="350" height="290" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="label" x="897.0" y="160" text-anchor="middle">Focused worker</text>
  <text class="body" x="897.0" y="216" text-anchor="middle">Searches page files</text>
  <text class="body" x="897.0" y="263" text-anchor="middle">Uses its own context</text>
  <text class="body" x="897.0" y="319" text-anchor="middle">Keeps search details locally</text>
  <text class="body" x="897.0" y="366" text-anchor="middle">Returns findings and gaps</text>
  </g>
  <text class="body" x="550" y="153" text-anchor="middle">Find other hours pages</text>
  <text class="note" x="550" y="181" text-anchor="middle">Keep weekends unchanged</text>
  <!-- task-out: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="task-out">
    <line class="connector" x1="379" y1="210" x2="710" y2="210"/>
    <polygon class="head" points="722,210 709,204 709,216"/>
  </g>
  <text class="body" x="550" y="286" text-anchor="middle">contact: weekdays 10:00</text>
  <text class="note" x="550" y="314" text-anchor="middle">mobile: not checked</text>
  <!-- report-back: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="report-back">
    <line class="connector" x1="721" y1="345" x2="390" y2="345"/>
    <polygon class="head" points="378,345 391,339 391,351"/>
  </g>
  <text class="note" x="550" y="454" text-anchor="middle">A report helps the lead decide what to inspect; it does not replace checking.</text>
</svg>
