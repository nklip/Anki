<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="452" viewBox="0 0 1100 452" role="img" aria-labelledby="title desc">
  <title id="title">A model can use only what is in its context</title>
  <desc id="desc">Saved storage outside the model holds chats, notes, and files. The application selects what to include and puts it into the context window, the focus of this article: what this call can see, counted in tokens. The model, whose weights stay fixed, reads the context and writes the reply. A second row lists where information can live: model weights are learned in training and fixed while answering; the context window holds information for this call only and has limited space; saved storage is kept between calls but helps only once it is added to the context. Saving or retrieving is the application's job; the model does not remember by itself.</desc>
  <!-- Shared typography and connector colors match the series' where-this-fits diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="452" fill="#ffffff"/>
  <!-- Heading states the lesson and the reading order. -->
  <text class="title" x="28" y="43" text-anchor="start">A model can use only what is in its context</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Read left to right. This article covers the context window and what feeds it.</text>
  <!-- Route from storage to reply; the context window box is this article's focus. -->
  <g id="information-route">
    <rect x="28" y="108" width="230" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="143" y="144" text-anchor="middle">Saved storage</text>
    <text class="note" x="143" y="174" text-anchor="middle">chats, notes, files</text>
    <text class="note" x="143" y="198" text-anchor="middle">outside the model</text>
    <rect x="299" y="108" width="180" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="389" y="144" text-anchor="middle">Application</text>
    <text class="note" x="389" y="174" text-anchor="middle">selects what</text>
    <text class="note" x="389" y="198" text-anchor="middle">to include</text>
    <rect x="520" y="108" width="320" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="680" y="144" text-anchor="middle">Context window</text>
    <text class="note" x="680" y="174" text-anchor="middle">this article: what this call</text>
    <text class="note" x="680" y="198" text-anchor="middle">can see, counted in tokens</text>
    <rect x="882" y="108" width="190" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="977" y="144" text-anchor="middle">Model</text>
    <text class="note" x="977" y="174" text-anchor="middle">weights stay fixed;</text>
    <text class="note" x="977" y="198" text-anchor="middle">writes the reply</text>
  </g>
  <!-- Each shaft ends inside its triangular head; tips meet the next box boundary. -->
  <g id="route-connectors">
    <line class="connector" x1="259" y1="160" x2="287" y2="160"/><polygon class="head" points="299,160 286,154 286,166"/>
    <line class="connector" x1="480" y1="160" x2="508" y2="160"/><polygon class="head" points="520,160 507,154 507,166"/>
    <line class="connector" x1="841" y1="160" x2="870" y2="160"/><polygon class="head" points="882,160 869,154 869,166"/>
  </g>
  <!-- Summary row of the three places information can live; the middle box matches the focus above. -->
  <g id="where-information-lives">
    <text class="label" x="28" y="256" text-anchor="start">Where information can live</text>
    <rect x="28" y="274" width="328" height="116" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="192" y="308" text-anchor="middle">Model weights</text>
    <text class="body" x="192" y="338" text-anchor="middle">learned in training</text>
    <text class="body" x="192" y="364" text-anchor="middle">fixed while answering</text>
    <rect x="386" y="274" width="328" height="116" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="550" y="308" text-anchor="middle">Context window</text>
    <text class="body" x="550" y="338" text-anchor="middle">this call only</text>
    <text class="body" x="550" y="364" text-anchor="middle">limited space</text>
    <rect x="744" y="274" width="328" height="116" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="908" y="308" text-anchor="middle">Saved storage</text>
    <text class="body" x="908" y="338" text-anchor="middle">kept between calls</text>
    <text class="body" x="908" y="364" text-anchor="middle">helps only once added</text>
  </g>
  <!-- Note prevents the belief that the model itself remembers earlier chats. -->
  <text class="note" x="550" y="428" text-anchor="middle">Saving and retrieving are the application's job; the model does not remember by itself.</text>
</svg>
