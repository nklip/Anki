<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="872.727272727272727" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">External memory requires writing and selecting information</title>
<desc id="desc">A separate write action stores a project note. On a later call the application selects it and supplies it with the question. Information shown in a chat interface need not be present in the current model input.</desc>
<!-- Shared typography; all teaching content remains editable SVG text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Saved memory needs a write and a later read</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">The application is the program around the model. It manages storage and constructs each input.</text>
<!-- Write to memory. -->
<g id="write-to-memory">
<text x="30" y="125" font-size="25" font-weight="700" text-anchor="start" fill="#172033">SAVE · a separate storage action</text>
<rect x="30" y="151" width="410" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="187" font-size="24" font-weight="700" text-anchor="start" fill="#172033">New information</text>
<text x="50" y="227" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“This project uses Maven.”</text>
<text x="50" y="257" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Mentioning it is not a storage operation.</text>
<rect x="590" y="151" width="480" height="140" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="610" y="187" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Persistent storage</text>
<text x="610" y="227" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Application writes a project note.</text>
<text x="610" y="257" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The note can survive beyond this call.</text>
<path data-connector="true" d="M 440,215 L 579,215" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="590,215 578,221 578,209" fill="#64748b"/>
<text x="472" y="195" font-size="20" font-weight="400" text-anchor="start" fill="#172033">write</text>
</g>
<!-- Read from memory. -->
<g id="read-from-memory">
<text x="30" y="344" font-size="25" font-weight="700" text-anchor="start" fill="#172033">USE · select saved information for a new call</text>
<rect x="30" y="375" width="290" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="412" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Stored notes / chats</text>
<text x="50" y="453" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Project: uses Maven</text>
<text x="50" y="486" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Old chat: many messages</text>
<text x="50" y="519" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Other project: uses Gradle</text>
<rect x="410" y="375" width="290" height="183" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="430" y="412" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Selected input</text>
<text x="430" y="453" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Question: how to build?</text>
<text x="430" y="486" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Note: project uses Maven</text>
<text x="430" y="519" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Other notes stay outside.</text>
<rect x="790" y="375" width="280" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="810" y="412" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Model reply</text>
<text x="810" y="453" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Possible answer:</text>
<text x="810" y="486" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“Run mvn package.”</text>
<text x="810" y="519" font-size="20" font-weight="400" text-anchor="start" fill="#172033">No training update.</text>
<path data-connector="true" d="M 320,475 L 399,475" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="410,475 398,481 398,469" fill="#64748b"/>
<path data-connector="true" d="M 700,475 L 779,475" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="790,475 778,481 778,469" fill="#64748b"/>
</g>
<text x="30" y="607" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Saved history, visible chat history, and the current model input can contain different information.</text>
</svg>
