<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="927.272727272727273" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">RAG retrieves source material into the model input</title>
<desc id="desc">A question and searchable documents feed a retriever. The selected passage joins the question in the input. The model then generates an answer. Retrieval does not update weights or guarantee a correct answer.</desc>
<!-- Shared typography; all teaching content remains editable SVG text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="680" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Retrieval-augmented generation (RAG)</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Retrieve relevant source material, add it to the input, then generate an answer using that material.</text>
<!-- Source store. -->
<g id="source-store">
<rect x="330" y="113" width="440" height="125" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="350" y="150" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Searchable documents or notes</text>
<text x="350" y="188" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Build guide: “Package with mvn package.”</text>
<text x="350" y="216" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Release notes, setup guide, project notes…</text>
</g>
<!-- Rag flow. -->
<g id="rag-flow">
<rect x="30" y="314" width="220" height="177" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="352" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Question</text>
<text x="50" y="394" font-size="22" font-weight="400" text-anchor="start" fill="#172033">“How do I build</text>
<text x="50" y="428" font-size="22" font-weight="400" text-anchor="start" fill="#172033">this project?”</text>
<rect x="310" y="314" width="220" height="177" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="330" y="352" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Retriever</text>
<text x="330" y="394" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Search for useful</text>
<text x="330" y="428" font-size="21" font-weight="400" text-anchor="start" fill="#172033">source passages.</text>
<rect x="590" y="314" width="220" height="177" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="610" y="352" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model input</text>
<text x="610" y="394" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Question + selected</text>
<text x="610" y="428" font-size="20" font-weight="400" text-anchor="start" fill="#172033">build-guide excerpt</text>
<rect x="870" y="314" width="200" height="177" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="890" y="352" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Answer</text>
<text x="890" y="394" font-size="21" font-weight="400" text-anchor="start" fill="#172033">“Run</text>
<text x="890" y="428" font-size="21" font-weight="400" text-anchor="start" fill="#172033">mvn package.”</text>
<path data-connector="true" d="M 250,407 L 299,407" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="310,407 298,413 298,401" fill="#64748b"/>
<path data-connector="true" d="M 530,407 L 579,407" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="590,407 578,413 578,401" fill="#64748b"/>
<path data-connector="true" d="M 810,407 L 859,407" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="870,407 858,413 858,401" fill="#64748b"/>
<path data-connector="true" d="M 420,238 L 420,303" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="420,314 414,302 426,302" fill="#64748b"/>
</g>
<!-- Retrieval limitations. -->
<g id="retrieval-limitations">
<rect x="30" y="539" width="1040" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="576" font-size="23" font-weight="700" text-anchor="start" fill="#172033">The source must be found, selected, and supplied before it can support the answer.</text>
<text x="50" y="614" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A search can miss the right passage or return an outdated one. The model can still misread a good source.</text>
</g>
</svg>
