<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="852.272727272727273" viewBox="0 0 1100 625" role="img" aria-labelledby="title desc">
<title id="title">In-context learning and demonstrations</title>
<desc id="desc">Two demonstrations guide a new response while model weights stay fixed. Separate panels define zero-shot, one-shot, and few-shot prompting.</desc>
<!-- Shared typography; all teaching content remains editable SVG text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="625" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">In-context learning: examples guide this answer</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A demonstration is an example input paired with its desired output.</text>
<!-- Demonstrations. -->
<g id="demonstrations">
<rect x="30" y="120" width="350" height="220" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="50" y="157" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Examples in the input</text>
<text x="50" y="200" font-size="22" font-weight="400" text-anchor="start" fill="#172033">red ball → ball, red</text>
<text x="50" y="248" font-size="22" font-weight="400" text-anchor="start" fill="#172033">blue car → car, blue</text>
<text x="50" y="296" font-size="22" font-weight="400" text-anchor="start" fill="#172033">New item: green bike → ?</text>
</g>
<!-- Fixed model. -->
<g id="fixed-model">
<rect x="440" y="120" width="270" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="460" y="157" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model computation</text>
<text x="460" y="202" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Uses learned abilities</text>
<text x="460" y="246" font-size="21" font-weight="400" text-anchor="start" fill="#172033">to infer a pattern.</text>
<text x="460" y="290" font-size="21" font-weight="400" text-anchor="start" fill="#172033">No weight update.</text>
</g>
<!-- Intended answer. -->
<g id="intended-answer">
<rect x="770" y="120" width="300" height="220" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="790" y="157" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Intended answer</text>
<text x="790" y="209" font-size="28" font-weight="700" text-anchor="start" fill="#172033">bike, green</text>
<text x="790" y="255" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Reverse the word pair;</text>
<text x="790" y="287" font-size="20" font-weight="400" text-anchor="start" fill="#172033">separate with a comma.</text>
</g>
<!-- Learning flow. -->
<g id="learning-flow">
<path data-connector="true" d="M 380,230 L 429,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="440,230 428,236 428,224" fill="#64748b"/>
<path data-connector="true" d="M 710,230 L 759,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="770,230 758,236 758,224" fill="#64748b"/>
</g>
<text x="30" y="389" font-size="25" font-weight="700" text-anchor="start" fill="#172033">How many demonstrations are supplied?</text>
<!-- Zero shot. -->
<g id="zero-shot">
<rect x="30" y="419" width="320" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="454" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Zero-shot</text>
<text x="50" y="493" font-size="20" font-weight="400" text-anchor="start" fill="#172033">No examples</text>
<text x="50" y="523" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“Reverse these two words.”</text>
</g>
<!-- One shot. -->
<g id="one-shot">
<rect x="390" y="419" width="320" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="410" y="454" font-size="24" font-weight="700" text-anchor="start" fill="#172033">One-shot</text>
<text x="410" y="493" font-size="20" font-weight="400" text-anchor="start" fill="#172033">One example</text>
<text x="410" y="523" font-size="20" font-weight="400" text-anchor="start" fill="#172033">red ball → ball, red</text>
</g>
<!-- Few shot. -->
<g id="few-shot">
<rect x="750" y="419" width="320" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="770" y="454" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Few-shot</text>
<text x="770" y="493" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Several examples</text>
<text x="770" y="523" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Both example pairs above</text>
</g>
<text x="30" y="592" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Toy example: multiple rules can fit a few examples, so the intended answer is not guaranteed.</text>
</svg>
