<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1117.5" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc">
  <title id="title">A circuit hypothesis needs causal tests</title>
  <desc id="desc">Where: researchers test paths from internal information to next-token scores.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="745" fill="#ffffff"/>
  <text x="28" y="42" class="t">A circuit hypothesis needs causal tests</text>
  <text x="28" y="76" class="s">Where: researchers test paths from internal information to next-token scores.</text>
  <!-- The top path is a simplified circuit hypothesis; lower lanes are separate toy interventions. -->
  <text x="28" y="127" class="h">Circuit = connected components implementing a computation</text>
  <rect x="28" y="152" width="264" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="191" class="h" text-anchor="middle">Read names</text>
  <rect x="368" y="152" width="264" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="191" class="h" text-anchor="middle">Track recipient</text>
  <rect x="708" y="152" width="264" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="840" y="191" class="h" text-anchor="middle">Favor a name</text>
  <path data-connector="true" d="M292 185 L357.0 185.0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <polygon points="368,185 356.0,190.0 356.0,180.0" fill="#2563eb"/>
  <path data-connector="true" d="M632 185 L697.0 185.0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <polygon points="708,185 696.0,190.0 696.0,180.0" fill="#2563eb"/>
  <text x="500" y="252" class="b" text-anchor="middle">Prompt: “Anna and Ben arrived. Ben gave the map to ___.”</text>
  <rect x="28" y="287" width="300" height="352" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="325" class="h">Baseline</text>
  <rect x="52" y="376" width="252" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="178" y="411" class="m" text-anchor="middle" style="fill:#7c3aed">[2, 1]</text>
  <path data-connector="true" d="M178 428 L178.0 453.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="178,464 173.0,452.0 183.0,452.0" fill="#64748b"/>
  <rect x="52" y="464" width="252" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="178" y="495" class="b" text-anchor="middle">Remaining model</text>
  <path data-connector="true" d="M178 512 L178.0 541.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="178,552 173.0,540.0 183.0,540.0" fill="#64748b"/>
  <rect x="52" y="552" width="252" height="50" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="178" y="584" class="b" text-anchor="middle">Anna / Ben scores</text>
  <rect x="350" y="287" width="300" height="352" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="368" y="325" class="h">Ablation</text>
  <rect x="374" y="376" width="252" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="411" class="m" text-anchor="middle" style="fill:#7c3aed">[2, 0]</text>
  <path data-connector="true" d="M500 428 L500.0 453.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="500,464 495.0,452.0 505.0,452.0" fill="#64748b"/>
  <rect x="374" y="464" width="252" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="495" class="b" text-anchor="middle">Remaining model</text>
  <path data-connector="true" d="M500 512 L500.0 541.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="500,552 495.0,540.0 505.0,540.0" fill="#64748b"/>
  <rect x="374" y="552" width="252" height="50" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="584" class="b" text-anchor="middle">Anna / Ben scores</text>
  <rect x="672" y="287" width="300" height="352" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="325" class="h">Activation patching</text>
  <rect x="696" y="376" width="252" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="822" y="411" class="m" text-anchor="middle" style="fill:#7c3aed">[5, 1]</text>
  <path data-connector="true" d="M822 428 L822.0 453.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="822,464 817.0,452.0 827.0,452.0" fill="#64748b"/>
  <rect x="696" y="464" width="252" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="822" y="495" class="b" text-anchor="middle">Remaining model</text>
  <path data-connector="true" d="M822 512 L822.0 541.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="822,552 817.0,540.0 827.0,540.0" fill="#64748b"/>
  <rect x="696" y="552" width="252" height="50" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="822" y="584" class="b" text-anchor="middle">Anna / Ben scores</text>
  <text x="178" y="359" class="s" text-anchor="middle">Keep original</text>
  <text x="500" y="359" class="s" text-anchor="middle">Zero one contribution</text>
  <text x="822" y="359" class="s" text-anchor="middle">Copy donor-run state</text>
  <text x="500" y="677" class="b" text-anchor="middle">Compare the scores with the unchanged baseline; test the predicted change.</text>
  <text x="500" y="711" class="s" text-anchor="middle">Toy values only. Patching requires a specified donor input and target location.</text>
</svg>
