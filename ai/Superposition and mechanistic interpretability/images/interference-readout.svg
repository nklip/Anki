<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="630" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Interference: an unrelated feature leaks into a readout</title>
  <desc id="desc">Where: measuring one feature direction in a shared activation space.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="28" y="42" class="t">Interference: an unrelated feature leaks into a readout</text>
  <text x="28" y="76" class="s">Where: measuring one feature direction in a shared activation space.</text>
  <!-- Bars show the arithmetic exactly: C readout averages the two coordinates. -->
  <text x="28" y="127" class="h">Readout for C: (slot 1 + slot 2) ÷ 2</text>
  <text x="28" y="205" class="h">C active</text>
  <text x="280" y="205" class="m">[1, 1]</text>
  <rect x="430" y="177" width="420" height="46" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="430" y="177" width="420" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="898" y="208" class="m" text-anchor="middle" style="fill:#7c3aed">1</text>
  <text x="28" y="294" class="h">A active; C absent</text>
  <text x="280" y="294" class="m">[1, 0]</text>
  <rect x="430" y="266" width="420" height="46" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="430" y="266" width="210.0" height="46" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="898" y="297" class="m" text-anchor="middle" style="fill:#2563eb">0.5</text>
  <text x="500" y="365" class="b" text-anchor="middle">A produces half of C’s signal even while C is absent.</text>
  <text x="500" y="400" class="s" text-anchor="middle">A threshold may reject a small leak, but cannot recover information lost in an exact tie.</text>
</svg>
