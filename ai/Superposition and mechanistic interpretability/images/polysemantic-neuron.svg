<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="630" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Polysemantic: one neuron responds to several properties</title>
  <desc id="desc">Where: one coordinate of an MLP’s expanded activation, across different inputs.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="28" y="42" class="t">Polysemantic: one neuron responds to several properties</text>
  <text x="28" y="76" class="s">Where: one coordinate of an MLP’s expanded activation, across different inputs.</text>
  <!-- The artificial heatmap demonstrates the definition, not a measured neuron. -->
  <text x="28" y="127" class="h">Toy input groups</text>
  <text x="550" y="127" class="h">Same neuron’s response</text>
  <text x="28" y="196" class="b">French sentences</text>
  <rect x="550" y="174" width="360" height="30" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="550" y="174" width="324.0" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="940" y="198" class="s" text-anchor="middle">0.9</text>
  <text x="28" y="258" class="b">Computer code</text>
  <rect x="550" y="236" width="360" height="30" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="550" y="236" width="288.0" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="940" y="260" class="s" text-anchor="middle">0.8</text>
  <text x="28" y="320" class="b">Ordinary English prose</text>
  <rect x="550" y="298" width="360" height="30" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="550" y="298" width="54.0" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="940" y="322" class="s" text-anchor="middle">0.15</text>
  <text x="500" y="369" class="b" text-anchor="middle">A large response does not uniquely identify “French.”</text>
  <text x="500" y="405" class="s" text-anchor="middle">Superposition can cause polysemanticity; a mixed response alone does not prove it.</text>
</svg>
