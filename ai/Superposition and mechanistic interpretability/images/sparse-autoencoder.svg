<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1065" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
  <title id="title">A sparse autoencoder explains a vector with a few candidates</title>
  <desc id="desc">Where: an external analysis model trained on saved activations.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="710" fill="#ffffff"/>
  <text x="28" y="42" class="t">A sparse autoencoder explains a vector with a few candidates</text>
  <text x="28" y="76" class="s">Where: an external analysis model trained on saved activations.</text>
  <!-- Top lane shows SAE data flow. Panels below define each component with the same toy values. -->
  <rect x="28" y="126" width="192" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="124.0" y="160" class="h" text-anchor="middle">Saved activation</text>
  <text x="124.0" y="203" class="m" text-anchor="middle" style="fill:#2563eb">[1, 1]</text>
  <rect x="398" y="126" width="204" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500.0" y="160" class="h" text-anchor="middle">Sparse code</text>
  <text x="500.0" y="203" class="m" text-anchor="middle" style="fill:#7c3aed">[0, 0, 1]</text>
  <rect x="780" y="126" width="192" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="876.0" y="160" class="h" text-anchor="middle">Reconstruction</text>
  <text x="876.0" y="203" class="m" text-anchor="middle" style="fill:#2563eb">[1, 1]</text>
  <path data-connector="true" d="M220 181 L387.0 181.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="398,181 386.0,186.0 386.0,176.0" fill="#64748b"/>
  <text x="309" y="144" class="s" text-anchor="middle">1. Encoder</text>
  <path data-connector="true" d="M602 181 L769.0 181.0" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="780,181 768.0,186.0 768.0,176.0" fill="#64748b"/>
  <text x="691" y="144" class="s" text-anchor="middle">3. Decoder</text>
  <rect x="28" y="270" width="454" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="308" class="h">1. Encoder</text>
  <rect x="518" y="270" width="454" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="542" y="308" class="h">2. Sparse code</text>
  <rect x="28" y="444" width="454" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="482" class="h">3. Decoder + dictionary</text>
  <rect x="518" y="444" width="454" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="542" y="482" class="h">4. Reconstruction error</text>
  <text x="52" y="342" class="b">[1, 1] → learned map → [0, 0, 1]</text>
  <text x="52" y="375" class="b">Two input slots → three candidate slots.</text>
  <text x="542" y="342" class="m" style="fill:#7c3aed">A = 0 · B = 0 · C = 1</text>
  <text x="542" y="375" class="s">Few active slots in a longer candidate list.</text>
  <text x="52" y="515" class="b">A: [1, 0] · B: [0, 1] · C: [1, 1]</text>
  <text x="52" y="550" class="b">0 × A + 0 × B + 1 × C = [1, 1]</text>
  <text x="52" y="585" class="s">Dictionary = learned candidate directions.</text>
  <text x="542" y="515" class="b">Original − reconstruction</text>
  <text x="542" y="550" class="m">[1, 1] − [1, 1] = [0, 0]</text>
  <text x="542" y="585" class="s">Zero in this toy; usually nonzero in practice.</text>
  <text x="500" y="654" class="b" text-anchor="middle">Only the SAE learns here; the language model stays fixed.</text>
  <text x="500" y="689" class="s" text-anchor="middle">A good reconstruction is not proof of the true cause: A + B also gives [1, 1].</text>
</svg>
