<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="486" viewBox="0 0 1100 486" role="img" aria-labelledby="title desc">
  <title id="title">Interpretability studies representations and the computations that use them</title>
  <desc id="desc">The normal model route goes from text through token IDs, starting vectors, and transformer blocks to next-token scores. A separate research branch studies the blocks. Superposition research asks whether many features can share the same vector slots. Mechanistic interpretability asks which internal components and connections cause a particular output. Researchers inspect vectors and intervene in model runs to test their explanations; these are research activities rather than extra stages required to generate text.</desc>
  <!-- Gray shows normal computation; purple marks the subject and the separate research view. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 20px; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
      .research-connector { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>
  <rect width="1100" height="486" fill="#ffffff"/>

  <!-- The normal route uses the same map as the feature-directions article. -->
  <text class="title" x="28" y="44">Where interpretability studies the model</text>
  <text class="subtitle" x="28" y="77">Read left to right. The purple branch is a separate research view.</text>
  <g id="normal-model-route">
    <rect x="28" y="112" width="140" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="98" y="154">Text</text>
    <text class="note" x="98" y="185">your prompt</text>
    <rect x="208" y="112" width="150" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="283" y="154">Token IDs</text>
    <text class="note" x="283" y="185">piece numbers</text>
    <rect x="398" y="112" width="178" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="487" y="143">Starting</text>
    <text class="label" x="487" y="169">vectors</text>
    <text class="note" x="487" y="197">one per token</text>
    <rect x="616" y="112" width="210" height="104" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="721" y="143">Transformer</text>
    <text class="label" x="721" y="169">blocks</text>
    <text class="note" x="721" y="197">update vectors</text>
    <rect x="866" y="112" width="206" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="969" y="143">Next-token</text>
    <text class="label" x="969" y="169">scores</text>
    <text class="note" x="969" y="197">one per choice</text>
  </g>

  <!-- Shafts end beneath triangle bases, and each visible tip meets its target outline. -->
  <g id="normal-flow-arrows">
    <line class="connector" x1="169" y1="164" x2="195" y2="164"/>
    <polygon class="head" points="208,164 194,157 194,171"/>
    <line class="connector" x1="359" y1="164" x2="385" y2="164"/>
    <polygon class="head" points="398,164 384,157 384,171"/>
    <line class="connector" x1="577" y1="164" x2="603" y2="164"/>
    <polygon class="head" points="616,164 602,157 602,171"/>
    <line class="connector" x1="827" y1="164" x2="853" y2="164"/>
    <polygon class="head" points="866,164 852,157 852,171"/>
  </g>

  <!-- The branch denotes studying model computation; two questions share one research panel. -->
  <g id="research-view-branch">
    <line class="research-connector" x1="721" y1="217" x2="721" y2="274"/>
    <polygon fill="#9333ea" points="721,287 714,273 728,273"/>
    <text class="subtitle" x="741" y="253">study the computation</text>
    <rect x="28" y="287" width="1044" height="156" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="550" y="319">Research view: explain the model's internal computation</text>
    <line x1="550" y1="340" x2="550" y2="426" stroke="#d8b4fe" stroke-width="2"/>
    <text class="label" x="289" y="359">Superposition</text>
    <text class="body" x="289" y="389">Can many features share</text>
    <text class="body" x="289" y="417">the same vector slots?</text>
    <text class="label" x="811" y="359">Mechanistic interpretability</text>
    <text class="body" x="811" y="389">Which components and connections</text>
    <text class="body" x="811" y="417">cause a particular output?</text>
  </g>

  <!-- Observation and deliberate interventions belong to the research workflow. -->
  <text class="note" x="550" y="474">Researchers inspect vectors and test explanations by changing internal values during runs.</text>
</svg>
