<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Superposition: three features share two dimensions</title>
  <desc id="desc">Where: the representation inside a residual or neuron activation vector.</desc>
  <!-- Shared typography and palette; all graphics are editable vectors. -->
  <defs>
    <style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .t {font-size:28px;font-weight:700} .h {font-size:22px;font-weight:700} .b {font-size:20px} .s {font-size:18px;fill:#64748b} .m {font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="28" y="42" class="t">Superposition: three features share two dimensions</text>
  <text x="28" y="76" class="s">Where: the representation inside a residual or neuron activation vector.</text>
  <!-- Equal scales make C exactly A+B in this deliberately ambiguous toy example. -->
  <text x="28" y="132" class="h">Dimensions = numerical slots</text>
  <path data-connector="true" d="M90 350 L259.0 350.0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <polygon points="270,350 258.0,355.0 258.0,345.0" fill="#2563eb"/>
  <path data-connector="true" d="M90 350 L90.0 181.0" stroke="#c2410c" stroke-width="2.5" fill="none"/>
  <polygon points="90,170 95.0,182.0 85.0,182.0" fill="#c2410c"/>
  <path data-connector="true" d="M90 350 L262.22182540694797 177.77817459305203" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
  <polygon points="270,170 265.0502525316941,182.02081528017132 257.9791847198287,174.94974746830584" fill="#7c3aed"/>
  <text x="280" y="357" class="h" style="fill:#2563eb">A [1, 0]</text>
  <text x="28" y="156" class="h" style="fill:#c2410c">B [0, 1]</text>
  <text x="280" y="177" class="h" style="fill:#7c3aed">C [1, 1]</text>
  <text x="90" y="390" class="s">Two independent axes</text>
  <rect x="520" y="112" width="452" height="294" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="544" y="151" class="h">Same two-slot result</text>
  <text x="544" y="206" class="b">A and B active:</text>
  <text x="544" y="244" class="m" style="fill:#2563eb">[1, 0] + [0, 1] = [1, 1]</text>
  <text x="544" y="306" class="b">Only C active:</text>
  <text x="544" y="344" class="m" style="fill:#7c3aed">[1, 1]</text>
  <text x="500" y="452" class="b" text-anchor="middle">Two different feature states can give the same activation.</text>
  <text x="500" y="489" class="s" text-anchor="middle">This exact tie is a toy case; real feature overlaps are often partial.</text>
</svg>
