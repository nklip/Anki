<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">A model is one part of the assistant</title>
  <desc id="desc">The assistant application contains an interface and a runtime. The runtime coordinates the model, tools, and saved state. The model generates responses, tools perform operations, and saved state holds messages, notes, and files outside the model. An agent uses these parts in an action-and-feedback loop.</desc>
  <!-- Shared typography and semantic colors; labels explain every component. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 23px; font-weight: 700; }
      .copy { font-size: 19px; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Main lesson and reading direction. -->
  <g id="heading">
    <text class="title" x="28" y="45">A model is one part of the assistant</text>
    <text class="subtitle" x="28" y="77">You use the interface. The runtime coordinates the parts below.</text>
  </g>

  <!-- Logical application boundary; components need not share one machine. -->
  <rect id="application-boundary" x="24" y="104" width="852" height="464" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="label" x="48" y="141">Assistant application</text>

  <!-- Interface presents the user's request and the application's answer. -->
  <g id="interface">
    <rect x="48" y="164" width="804" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="450" y="195" text-anchor="middle">Interface</text>
    <text class="copy" x="450" y="223" text-anchor="middle">Your messages and the displayed answer</text>
  </g>

  <!-- Shaft ends under its own triangular base; tip meets the runtime border. -->
  <line class="connector" x1="450" y1="243" x2="450" y2="262"/>
  <polygon class="head" points="450,274 443,261 457,261"/>

  <g id="runtime">
    <rect x="48" y="274" width="804" height="80" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="450" y="307" text-anchor="middle">Runtime: the coordinating code</text>
    <text class="copy" x="450" y="335" text-anchor="middle">Prepares context, calls the model, and dispatches permitted tool calls</text>
  </g>

  <!-- Shared coordination branch. Heads meet the three component borders. -->
  <path class="connector" d="M450 355 V376 M171 376 H729 M171 376 V391 M450 376 V391 M729 376 V391"/>
  <polygon class="head" points="171,404 164,390 178,390"/>
  <polygon class="head" points="450,404 443,390 457,390"/>
  <polygon class="head" points="729,404 722,390 736,390"/>

  <g id="model">
    <rect x="48" y="404" width="246" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="171" y="437" text-anchor="middle">Model</text>
    <text class="copy" x="171" y="466" text-anchor="middle">Learned weights</text>
    <text class="copy" x="171" y="492" text-anchor="middle">Generates responses</text>
  </g>
  <g id="tools">
    <rect x="327" y="404" width="246" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="450" y="437" text-anchor="middle">Tools</text>
    <text class="copy" x="450" y="466" text-anchor="middle">Calculator, search, …</text>
    <text class="copy" x="450" y="492" text-anchor="middle">Perform operations</text>
  </g>
  <g id="saved-state">
    <rect x="606" y="404" width="246" height="110" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="label" x="729" y="437" text-anchor="middle">Saved state</text>
    <text class="copy" x="729" y="466" text-anchor="middle">Messages, notes, files</text>
    <text class="copy" x="729" y="492" text-anchor="middle">Stored outside model</text>
  </g>

  <!-- Agent names the way these components cooperate, not another model box. -->
  <text class="copy" x="450" y="546" text-anchor="middle">An agent uses these parts in an action-and-feedback loop.</text>
</svg>
