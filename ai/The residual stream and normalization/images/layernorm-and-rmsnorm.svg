<svg xmlns="http://www.w3.org/2000/svg" width="900" height="716" viewBox="0 0 900 716" role="img" aria-labelledby="title desc">
  <title id="title">LayerNorm centers; RMSNorm does not</title>
  <desc id="desc">Both methods start with the vector [1, 7]. LayerNorm subtracts the mean 4, producing [-3, 3]. The average squared centered value is 9 and its square root is 3; dividing by 3 gives [-1, 1]. RMSNorm keeps the original numbers; their squares are 1 and 49, their average is 25, and its square root is 5. Dividing the original vector by 5 gives [0.2, 1.4]. These simplified calculations use learned multipliers of 1, offsets of 0, and omit the tiny safety term. RMS means root mean square.</desc>
  <!-- Parallel columns compare two rules on the exact same input. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .heading { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 21px; text-anchor: middle; }
      .math { font-size: 23px; text-anchor: middle; }
      .value { font-size: 31px; font-weight: 700; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="716" fill="#ffffff"/>

  <!-- Results are before learned adjustments; the numerical example is intentionally exact. -->
  <text class="title" x="28" y="44">LayerNorm centers; RMSNorm does not</text>
  <text class="subtitle" x="28" y="76">Same input: [1, 7] · read each column downward · simplified arithmetic</text>

  <!-- LayerNorm centers first, then measures the size of the centered vector. -->
  <g id="layernorm-computation">
    <rect x="28" y="115" width="406" height="510" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text class="heading" x="231" y="156">LayerNorm</text>
    <text class="body" x="231" y="204">Mean: (1 + 7) ÷ 2 = 4</text>
    <text class="label" x="231" y="239">Subtract the mean</text>
    <text class="math" x="231" y="276">[1, 7] − [4, 4] = [−3, 3]</text>
    <rect x="54" y="303" width="354" height="136" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="body" x="231" y="335">Squares: 9 and 9</text>
    <text class="body" x="231" y="372">Average: (9 + 9) ÷ 2 = 9</text>
    <text class="body" x="231" y="411">Square root: 3 (3 × 3 = 9)</text>
    <text class="label" x="231" y="473">Divide [−3, 3] by 3</text>
    <rect x="100" y="492" width="262" height="72" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="value" x="231" y="538">[−1, 1]</text>
    <text class="note" x="231" y="600">Center, then rescale</text>
  </g>

  <!-- RMSNorm measures the original vector's size without subtracting its mean. -->
  <g id="rmsnorm-computation">
    <rect x="466" y="115" width="406" height="510" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text class="heading" x="669" y="156">RMSNorm</text>
    <text class="note" x="669" y="187">RMS = root mean square</text>
    <text class="label" x="669" y="239">No mean subtraction</text>
    <text class="math" x="669" y="276">Keep [1, 7]</text>
    <rect x="492" y="303" width="354" height="136" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="body" x="669" y="335">Squares: 1 and 49</text>
    <text class="body" x="669" y="372">Average: (1 + 49) ÷ 2 = 25</text>
    <text class="body" x="669" y="411">Square root: 5 (5 × 5 = 25)</text>
    <text class="label" x="669" y="473">Divide [1, 7] by 5</text>
    <rect x="538" y="492" width="262" height="72" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="value" x="669" y="538">[0.2, 1.4]</text>
    <text class="note" x="669" y="600">Rescale without centering</text>
  </g>

  <!-- Qualify the toy outputs so they do not imply exact invariants after learned gains. -->
  <text class="note" x="450" y="661">Square a number by multiplying it by itself: (−3) × (−3) = 9.</text>
  <text class="note" x="450" y="696">Here: learned multipliers = 1; offsets = 0; tiny safety term left out.</text>
</svg>
