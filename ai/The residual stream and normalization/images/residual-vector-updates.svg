<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="585" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Residual stream: keep a running vector and add updates</title>
  <desc id="desc">Residual stream: keep a running vector and add updates. Where: one token position → through the repeated transformer blocks</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="390" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Residual stream: keep a running vector and add updates</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: one token position → through the repeated transformer blocks</text>
  <!-- Vectors have two slots throughout; signed updates can remove as well as add information. -->
  <rect x="28" y="130" width="220" height="116" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="162" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">Before attention</text>
  <rect x="81" y="180" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="108.5" y="209" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="139" y="180" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="166.5" y="209" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">7</text>
  <rect x="390" y="130" width="220" height="116" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="162" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">After attention</text>
  <rect x="443" y="180" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470.5" y="209" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <rect x="501" y="180" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="528.5" y="209" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">6</text>
  <rect x="752" y="130" width="220" height="116" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="862" y="162" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">After MLP</text>
  <rect x="805" y="180" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="832.5" y="209" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="863" y="180" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="890.5" y="209" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">8</text>
  <line class="connector" x1="248" y1="200" x2="381.0" y2="200.0" style="stroke:#64748b"/>
  <polygon points="390,200 380.0,205.0 380.0,195.0" fill="#64748b"/>
  <line class="connector" x1="610" y1="200" x2="743.0" y2="200.0" style="stroke:#64748b"/>
  <polygon points="752,200 742.0,205.0 742.0,195.0" fill="#64748b"/>
  <text x="319" y="128" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Add [2, −1]</text>
  <text x="681" y="128" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Add [−1, 2]</text>
  <text x="500" y="290" font-size="23" text-anchor="middle" fill="#172033">[1 + 2, 7 − 1] = [3, 6]       then       [3 − 1, 6 + 2] = [2, 8]</text>
  <rect x="28" y="322" width="944" height="44" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="350" font-size="19" text-anchor="middle" fill="#172033">Residual connection = the unchanged path around a component, plus its update.</text>
</svg>
