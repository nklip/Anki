<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="579" viewBox="0 0 1000 386" role="img" aria-labelledby="title desc">
  <title id="title">LayerNorm: center first, then rescale</title>
  <desc id="desc">LayerNorm: center first, then rescale. Where: normalization branch → one token vector, across its slots</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="386" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">LayerNorm: center first, then rescale</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: normalization branch → one token vector, across its slots</text>
  <!-- Ignoring epsilon and learned gain/offset makes the centering and scale arithmetic exact. -->
  <rect x="28" y="116" width="250" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="153" y="150" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Input vector</text>
  <rect x="96" y="176" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="123.5" y="205" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="154" y="176" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="181.5" y="205" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">4</text>
  <text x="153" y="261" font-size="19" text-anchor="middle" fill="#172033">Mean = (2 + 4) / 2 = 3</text>
  <line class="connector" x1="278" y1="206" x2="339.0" y2="206.0" style="stroke:#64748b"/>
  <polygon points="348,206 338.0,211.0 338.0,201.0" fill="#64748b"/>
  <rect x="348" y="116" width="290" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="493" y="150" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Centering</text>
  <text x="493" y="180" font-size="20" text-anchor="middle" fill="#172033">subtract the mean</text>
  <rect x="436" y="199" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="463.5" y="228" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">−1</text>
  <rect x="494" y="199" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="521.5" y="228" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <text x="493" y="271" font-size="21" text-anchor="middle" fill="#172033">[2 − 3, 4 − 3]</text>
  <line class="connector" x1="638" y1="206" x2="699.0" y2="206.0" style="stroke:#64748b"/>
  <polygon points="708,206 698.0,211.0 698.0,201.0" fill="#64748b"/>
  <rect x="708" y="116" width="264" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="840" y="150" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Rescale</text>
  <text x="840" y="180" font-size="20" text-anchor="middle" fill="#172033">spread = 1 here</text>
  <rect x="783" y="199" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="810.5" y="228" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">−1</text>
  <rect x="841" y="199" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="868.5" y="228" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <text x="840" y="271" font-size="19" text-anchor="middle" fill="#172033">divide each slot by 1</text>
  <text x="500" y="333" font-size="21" text-anchor="middle" fill="#172033">Then apply learned scale and, usually, offset to each slot.</text>
  <text x="500" y="367" font-size="18" text-anchor="middle" fill="#64748b">Toy arithmetic omits the tiny safety term ε. No token positions are mixed.</text>
</svg>
