<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="666" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
  <title id="title">Pre-norm: normalize what the component reads</title>
  <desc id="desc">Pre-norm: normalize what the component reads. Where: each attention or MLP branch in a Llama-style block</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="444" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Pre-norm: normalize what the component reads</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: each attention or MLP branch in a Llama-style block</text>
  <!-- The residual bypass travels below the boxes; its head ends at the addition circle. -->
  <rect x="28" y="202" width="160" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="108" y="234" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Residual x</text>
  <text x="108" y="262" font-size="22" text-anchor="middle" fill="#172033">[3, 4]</text>
  <rect x="300" y="112" width="220" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="146" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Normalization</text>
  <text x="410" y="175" font-size="19" text-anchor="middle" fill="#172033">read a rescaled x</text>
  <rect x="600" y="112" width="220" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="146" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Attention or MLP</text>
  <text x="710" y="175" font-size="19" text-anchor="middle" fill="#172033">calculate update</text>
  <circle cx="890" cy="240" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="890" y="248" font-size="30" text-anchor="middle" fill="#172033" font-weight="700">+</text>
  <path class="connector" d="M188 240 H240 V154 H288" style="stroke:#64748b"/>
  <line class="connector" x1="288" y1="154" x2="291.0" y2="154.0" style="stroke:#64748b"/>
  <polygon points="300,154 290.0,159.0 290.0,149.0" fill="#64748b"/>
  <line class="connector" x1="520" y1="154" x2="591.0" y2="154.0" style="stroke:#64748b"/>
  <polygon points="600,154 590.0,159.0 590.0,149.0" fill="#64748b"/>
  <path class="connector" d="M820 154 H890 V198" style="stroke:#64748b"/>
  <line class="connector" x1="890" y1="198" x2="890.0" y2="201.0" style="stroke:#64748b"/>
  <polygon points="890,210 885.0,200.0 895.0,200.0" fill="#64748b"/>
  <path class="connector" d="M240 240 V336 H890 V282" style="stroke:#64748b"/>
  <line class="connector" x1="890" y1="282" x2="890.0" y2="279.0" style="stroke:#64748b"/>
  <polygon points="890,270 895.0,280.0 885.0,280.0" fill="#64748b"/>
  <text x="560" y="322" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Original vector, unchanged</text>
  <line class="connector" x1="920" y1="240" x2="963.0" y2="240.0" style="stroke:#64748b"/>
  <polygon points="972,240 962.0,245.0 962.0,235.0" fill="#64748b"/>
  <text x="774" y="404" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Output = x + component(norm(x))</text>
  <text x="28" y="404" font-size="20" text-anchor="start" fill="#64748b">Same pattern twice per block.</text>
</svg>
