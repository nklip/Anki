<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="607.5" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
  <title id="title">RMSNorm: rescale without subtracting the mean</title>
  <desc id="desc">RMSNorm: rescale without subtracting the mean. Where: normalization branch → Llama-style blocks and final normalization</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="405" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">RMSNorm: rescale without subtracting the mean</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: normalization branch → Llama-style blocks and final normalization</text>
  <!-- RMS is computed across one token vector. This differs from centering and from probabilities. -->
  <rect x="28" y="116" width="250" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="153" y="150" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Input vector</text>
  <rect x="96" y="176" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="123.5" y="205" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <rect x="154" y="176" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="181.5" y="205" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">4</text>
  <text x="153" y="270" font-size="22" text-anchor="middle" fill="#172033">Mean = 3.5</text>
  <line class="connector" x1="278" y1="210" x2="339.0" y2="210.0" style="stroke:#64748b"/>
  <polygon points="348,210 338.0,215.0 338.0,205.0" fill="#64748b"/>
  <rect x="348" y="116" width="320" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="508" y="150" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Root mean square (RMS)</text>
  <text x="508" y="195" font-size="20" text-anchor="middle" fill="#172033">square → average → root</text>
  <text x="508" y="242" font-size="26" text-anchor="middle" fill="#172033">√((3² + 4²) / 2)</text>
  <text x="508" y="282" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">= √12.5 ≈ 3.54</text>
  <line class="connector" x1="668" y1="210" x2="729.0" y2="210.0" style="stroke:#64748b"/>
  <polygon points="738,210 728.0,215.0 728.0,205.0" fill="#64748b"/>
  <rect x="738" y="116" width="234" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="855" y="150" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">Divide by RMS</text>
  <text x="855" y="211" font-size="27" text-anchor="middle" fill="#172033" font-weight="700">[0.85, 1.13]</text>
  <text x="855" y="264" font-size="22" text-anchor="middle" fill="#172033">mean ≠ 0</text>
  <text x="500" y="348" font-size="19" text-anchor="middle" fill="#172033">Then multiply each slot by a learned scale. Normalized values are not probabilities.</text>
  <text x="500" y="385" font-size="18" text-anchor="middle" fill="#64748b">A tiny safety term ε is omitted from the toy calculation.</text>
</svg>
