<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Shared transformer map and the residual stream and normalization</title>
  <desc id="desc">The highlighted region locates the residual stream and normalization in the model or its analysis. Text is tokenized, embedded, processed through pre-norm residual blocks with attention and MLPs, then scored. Selection and decoding follow. Separate dashed research branches inspect features or mechanisms. The lower panel explains the highlighted topic with a worked example.</desc>
  <!-- Shared font and palette; all artwork remains editable SVG. -->
  <defs>
    <style>text {font-family: Arial, Helvetica, sans-serif;}</style>
  </defs>
  <rect width="1200" height="1000" fill="#fff"/>
  <g id="shared-flow">
    <!-- Shared concept map: stable topic names and geometry; only one region receives focus styling. -->
    <text x="28" y="42" font-size="28" font-weight="700" fill="#172033" text-anchor="start">Where it fits · inside a text-generating transformer</text>
    <text x="28" y="73" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">Colored outline: this topic. Gray: surrounding computation. Dashed branches: research.</text>
    <rect x="340" y="96" width="832" height="432" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" id="forward-pass-region"/>
    <text x="366" y="124" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Forward pass: token IDs → next-token scores</text>
    <rect x="28" y="142" width="86" height="84" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="71.0" y="191.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Text</text>
    <rect x="142" y="142" width="174" height="84" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" id="tokenizer-region"/>
    <text x="229.0" y="178.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Tokenizer</text>
    <text x="229.0" y="203.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">text → token IDs</text>
    <rect x="366" y="142" width="182" height="84" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" id="embedding-region"/>
    <text x="457.0" y="178.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Embeddings</text>
    <text x="457.0" y="203.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">ID → vector</text>
    <rect x="578" y="142" width="252" height="84" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="704.0" y="178.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Repeated blocks</text>
    <text x="704.0" y="203.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">update each vector</text>
    <rect x="860" y="142" width="288" height="84" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1004.0" y="178.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Final norm + projection</text>
    <text x="1004.0" y="203.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">vector → scores (logits)</text>
    <path data-connector="true" d="M114 184 L133.0 184.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="142,184 132.0,188.0 132.0,180.0" fill="#64748b"/>
    <path data-connector="true" d="M316 184 L357.0 184.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="366,184 356.0,188.0 356.0,180.0" fill="#64748b"/>
    <path data-connector="true" d="M548 184 L569.0 184.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="578,184 568.0,188.0 568.0,180.0" fill="#64748b"/>
    <path data-connector="true" d="M830 184 L851.0 184.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="860,184 850.0,188.0 850.0,180.0" fill="#64748b"/>
    <!-- The scoring output leaves the model; selecting a token is a separate operation. -->
    <path data-connector="true" d="M1004 226 V250 H171 V280" fill="none" stroke="#64748b" stroke-width="2"/>
    <path data-connector="true" d="M171 280 L171.0 289.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="171,298 167.0,288.0 175.0,288.0" fill="#64748b"/>
    <rect x="28" y="298" width="286" height="110" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="171.0" y="335.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Choose one token ID</text>
    <text x="171.0" y="360.0" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">decode IDs → text</text>
    <text x="171.0" y="385.0" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">append ID; run again</text>
    <text x="28" y="445" font-size="18" font-weight="700" fill="#172033" text-anchor="start">Llama-style pre-norm model.</text>
    <text x="28" y="474" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Norm = rescale a vector.</text>
    <text x="28" y="502" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">+ = add an update.</text>
    <!-- Expanded repeated block; bypasses carry each original vector unchanged to addition. -->
    <rect x="366" y="278" width="782" height="234" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3" data-focus="true" id="residual-region"/>
    <text x="386" y="307" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Residual stream + normalization · one block enlarged</text>
    <text x="500" y="340" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Position enters attention</text>
    <rect x="386" y="360" width="82" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="427.0" y="402.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Norm</text>
    <rect x="494" y="360" width="164" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" id="attention-region"/>
    <text x="576.0" y="389.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Attention</text>
    <text x="576.0" y="414.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">mix positions</text>
    <rect x="740" y="360" width="82" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="781.0" y="402.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Norm</text>
    <rect x="848" y="360" width="172" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" id="mlp-region"/>
    <text x="934.0" y="389.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">MLP / MoE</text>
    <text x="934.0" y="414.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">work per token</text>
    <circle cx="694" cy="395" r="18" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="694" y="403" font-size="27" font-weight="400" fill="#172033" text-anchor="middle">+</text>
    <circle cx="1060" cy="395" r="18" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1060" y="403" font-size="27" font-weight="400" fill="#172033" text-anchor="middle">+</text>
    <path data-connector="true" d="M468 395 L485.0 395.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="494,395 484.0,399.0 484.0,391.0" fill="#64748b"/>
    <path data-connector="true" d="M658 395 L667.0 395.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="676,395 666.0,399.0 666.0,391.0" fill="#64748b"/>
    <path data-connector="true" d="M712 395 L731.0 395.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="740,395 730.0,399.0 730.0,391.0" fill="#64748b"/>
    <path data-connector="true" d="M822 395 L839.0 395.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="848,395 838.0,399.0 838.0,391.0" fill="#64748b"/>
    <path data-connector="true" d="M1020 395 L1033.0 395.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="1042,395 1032.0,399.0 1032.0,391.0" fill="#64748b"/>
    <path data-connector="true" d="M1078 395 L1121.0 395.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="1130,395 1120.0,399.0 1120.0,391.0" fill="#64748b"/>
    <path data-connector="true" d="M378 395 H386 M378 395 V480 H694 V451" fill="none" stroke="#64748b" stroke-width="2"/>
    <path data-connector="true" d="M694 451 L694.0 422.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="694,413 698.0,423.0 690.0,423.0" fill="#64748b"/>
    <path data-connector="true" d="M728 395 V480 H1060 V451" fill="none" stroke="#64748b" stroke-width="2"/>
    <path data-connector="true" d="M1060 451 L1060.0 422.0" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="1060,413 1064.0,423.0 1056.0,423.0" fill="#64748b"/>
    <text x="532" y="460" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">carry input unchanged</text>
    <text x="887" y="460" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">carry updated vector</text>
    <text x="750" y="504" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">MLP: per-token network · MoE: mixture of experts</text>
    <!-- Dashed branches observe activations; these boxes are not extra forward-pass stages. -->
    <path data-connector="true" d="M756 528 V554 H553 V566" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <path data-connector="true" d="M553 566 L553.0 571.0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="553,580 549.0,570.0 557.0,570.0" fill="#64748b"/>
    <path data-connector="true" d="M756 554 H961 V566" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <path data-connector="true" d="M961 566 L961.0 571.0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="961,580 957.0,570.0 965.0,570.0" fill="#64748b"/>
    <text x="28" y="559" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Separate research views</text>
    <text x="28" y="590" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Dashed lines: inspect or test</text>
    <text x="28" y="616" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">internal working vectors.</text>
    <rect x="366" y="580" width="374" height="82" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" id="feature-research-region"/>
    <text x="553.0" y="615.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Features + directions</text>
    <text x="553.0" y="640.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">What is represented?</text>
    <rect x="774" y="580" width="374" height="82" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" id="mechanism-research-region"/>
    <text x="961.0" y="615.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Superposition + circuits</text>
    <text x="961.0" y="640.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">How is it stored and used?</text>
  </g>
  <g id="topic-detail">
    <!-- Topic-specific worked example; the upper concept map provides its context. -->
    <path data-connector="true" d="M28 692 H1172" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="733" font-size="25" font-weight="700" fill="#172033" text-anchor="start">Residual stream + normalization · read a copy, add an update</text>
    <rect x="28" y="775" width="262" height="88" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="159.0" y="813.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Running vector</text>
    <text x="159.0" y="838.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">x = [1, 7]</text>
    <rect x="348" y="775" width="414" height="88" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="555.0" y="813.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Normalize → component</text>
    <text x="555.0" y="838.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">compute update Δ = [2, −1]</text>
    <rect x="820" y="775" width="352" height="88" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="996.0" y="813.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Add matching slots</text>
    <text x="996.0" y="838.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">x + Δ = [3, 6]</text>
    <path data-connector="true" d="M290 819 L339.0 819.0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <polygon points="348,819 338.0,823.0 338.0,815.0" fill="#2563eb"/>
    <path data-connector="true" d="M762 819 L811.0 819.0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <polygon points="820,819 810.0,823.0 810.0,815.0" fill="#2563eb"/>
    <path data-connector="true" d="M158 863 V910 H996 V883" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path data-connector="true" d="M996 883 L996.0 872.0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <polygon points="996,863 1000.0,873.0 992.0,873.0" fill="#2563eb"/>
    <text x="580" y="899" font-size="19" font-weight="400" fill="#2563eb" text-anchor="middle">Unchanged x bypasses normalization and the component</text>
    <text x="28" y="956" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Attention and the MLP both use this read-and-add pattern; the vector width stays fixed.</text>
  </g>
</svg>
