<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="678" viewBox="0 0 1040 678" role="img" aria-labelledby="title desc">
  <title id="title">Step 3: validate the reply and use approved facts</title>
  <desc id="desc">An illustrative draft promises a shipping-fee waiver and a 60-day return window. The authoritative policy has no waiver and specifies 30 days. A model-assisted check can flag unsupported claims but may be wrong. Application code reads approved values from policy and fills a controlled response. Only a checked response reaches the customer.</desc>
  <!-- Purple marks generated text; green marks approved policy data and the released reply. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #475569; }
      .label { font-size: 23px; font-weight: 700; }
      .copy { font-size: 20px; }
      .small { font-size: 19px; fill: #475569; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linejoin: round; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1040" height="678" fill="#ffffff"/>

  <!-- Contrast an explicitly illustrative draft with the video's 30-day example policy. -->
  <text class="title" x="28" y="44">3 · Validate the reply and use approved facts</text>
  <text class="subtitle" x="28" y="78">A model can flag a claim. Trusted records supply the exact policy values.</text>
  <g id="unreleased-draft">
    <rect x="28" y="114" width="420" height="126" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text class="label" x="52" y="151">Illustrative model draft</text>
    <text class="copy" x="52" y="188">Promises a shipping-fee waiver</text>
    <text class="copy" x="52" y="218">and a 60-day return window.</text>
  </g>
  <g id="authoritative-policy">
    <rect x="592" y="114" width="420" height="126" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="616" y="151">Authoritative company policy</text>
    <text class="copy" x="616" y="188">No shipping-fee waiver</text>
    <text class="copy" x="616" y="218">Return window: 30 days</text>
  </g>

  <!-- Both sources feed one output checkpoint; its two methods have different limits. -->
  <g id="output-checkpoint">
    <rect x="28" y="296" width="984" height="154" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <line x1="520" y1="318" x2="520" y2="428" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="52" y="336">Model-assisted comparison</text>
    <text class="copy" x="52" y="376">Flag claims unsupported by the policy.</text>
    <text class="copy" x="52" y="409">The reviewer can still make mistakes.</text>
    <text class="label" x="544" y="336">Application code supplies facts</text>
    <text class="copy" x="544" y="376">Read the 30-day value from policy.</text>
    <text class="copy" x="544" y="409">Fill a controlled response with that value.</text>
  </g>
  <path class="connector" d="M238 241 V283"/>
  <polygon class="head" points="238,296 231,282 245,282"/>
  <path class="connector" d="M802 241 V283"/>
  <polygon class="head" points="802,296 795,282 809,282"/>

  <!-- The checked response is released only after the required policy handling. -->
  <path class="connector" d="M520 451 V511"/>
  <polygon class="head" points="520,524 513,510 527,510"/>
  <text class="small" x="540" y="491">Release after required checks</text>
  <g id="checked-customer-reply">
    <rect x="28" y="524" width="984" height="94" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="52" y="562">Checked reply: return window is 30 days</text>
    <text class="copy" x="52" y="597">No invented waiver. Any refund confirmation must match the actual tool result.</text>
  </g>

  <!-- Failure handling prevents treating a flagged draft as deliverable text. -->
  <text class="small" x="28" y="657">If verification fails: replace or withhold the reply, or route it for review before delivery.</text>
</svg>
