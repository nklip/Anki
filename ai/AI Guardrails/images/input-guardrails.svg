<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="616" viewBox="0 0 1040 616" role="img" aria-labelledby="title desc">
  <title id="title">Step 1: screen the request before the main model</title>
  <desc id="desc">A request asks for a 5000-dollar refund for order 4821 and claims authority. Input checks can mask sensitive data, reject out-of-scope topics, and classify suspicious instructions. The application either blocks or asks for revision, or passes checked text to the model. A passing input check grants no permission to issue a refund.</desc>
  <!-- Blue groups the input checks; red and green distinguish labeled outcomes. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #475569; }
      .label { font-size: 23px; font-weight: 700; }
      .copy { font-size: 20px; }
      .small { font-size: 19px; fill: #475569; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linejoin: round; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1040" height="616" fill="#ffffff"/>

  <!-- State before: neither the text nor its claimed authority has been trusted. -->
  <text class="title" x="28" y="44">1 · Screen the request before the main model</text>
  <text class="subtitle" x="28" y="78">Input guardrails inspect text; they do not grant access to customer accounts.</text>
  <g id="incoming-request">
    <rect x="28" y="110" width="984" height="102" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="52" y="149">Request: refund order 4821 for $5,000</text>
    <text class="copy" x="52" y="184">The sender claims authority in chat. That claim does not establish identity.</text>
  </g>

  <!-- The three columns are checks within one checkpoint, not a mandatory execution order. -->
  <g id="input-checks">
    <rect x="28" y="264" width="984" height="146" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <line x1="356" y1="286" x2="356" y2="388" stroke="#bfdbfe" stroke-width="2"/>
    <line x1="684" y1="286" x2="684" y2="388" stroke="#bfdbfe" stroke-width="2"/>
    <text class="label" x="52" y="304">Sensitive data</text>
    <text class="copy" x="52" y="343">Find likely card numbers.</text>
    <text class="copy" x="52" y="375">Mask them before use.</text>
    <text class="label" x="380" y="304">Topic check</text>
    <text class="copy" x="380" y="343">Is this within the shop's</text>
    <text class="copy" x="380" y="375">customer-support scope?</text>
    <text class="label" x="708" y="304">Attack classifier</text>
    <text class="copy" x="708" y="343">A small model flags signs</text>
    <text class="copy" x="708" y="375">of instruction manipulation.</text>
  </g>
  <path class="connector" d="M520 213 V251"/>
  <polygon class="head" points="520,264 513,250 527,250"/>

  <!-- Fork above the outcome boxes; shafts never pass through their labels. -->
  <path class="connector" d="M520 411 V444 H238 V469"/>
  <polygon class="head" points="238,482 231,468 245,468"/>
  <path class="connector" d="M520 444 H802 V469"/>
  <polygon class="head" points="802,482 795,468 809,468"/>
  <g id="blocked-input">
    <rect x="28" y="482" width="420" height="82" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text class="label" x="52" y="518">Block or request a revision</text>
    <text class="small" x="52" y="547">Do not send rejected text onward.</text>
  </g>
  <g id="permitted-input">
    <rect x="592" y="482" width="420" height="82" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="616" y="518">Pass checked text to the model</text>
    <text class="small" x="616" y="547">It may have been masked.</text>
  </g>

  <!-- A successful screening result must not be mistaken for tool authorization. -->
  <text class="small" x="28" y="599">A classifier can miss an attack. Every proposed refund still needs the tool checks.</text>
</svg>
