<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="547.5" viewBox="0 0 1200 438" role="img" aria-labelledby="title desc">
  <title id="title">Vectors and matrices give the model a numeric workspace</title>
  <desc id="desc">A tiny two-dimensional example; real language-model vectors have many more slots.</desc>
  <!-- Shared typography; editable geometry and real text. -->
  <defs>
    <style>text {font-family:Arial, Helvetica, sans-serif;}</style>
  </defs>
  <rect width="1200" height="438" fill="#fff"/>
  <text x="28" y="44" font-size="28" font-weight="700" fill="#172033" text-anchor="start">Vectors and matrices give the model a numeric workspace</text>
  <text x="28" y="78" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">A tiny two-dimensional example; real language-model vectors have many more slots.</text>
  <!-- A vector has ordered coordinates; a matrix holds rows of such coordinates. -->
  <rect x="28" y="110" width="545" height="248" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="605" y="110" width="567" height="248" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="148" font-size="23" font-weight="700" fill="#172033" text-anchor="start">VECTOR · one ordered list</text>
  <text x="629" y="148" font-size="23" font-weight="700" fill="#172033" text-anchor="start">MATRIX · rows and columns of numbers</text>
  <rect x="80" y="192" width="140" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3" data-focus="true"/>
  <text x="150.0" y="236.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">2</text>
  <text x="150" y="301" font-size="19" font-weight="400" fill="#172033" text-anchor="middle">slot 1</text>
  <rect x="262" y="192" width="140" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3" data-focus="true"/>
  <text x="332.0" y="236.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">1</text>
  <text x="332" y="301" font-size="19" font-weight="400" fill="#172033" text-anchor="middle">slot 2</text>
  <text x="52" y="339" font-size="20" font-weight="400" fill="#172033" text-anchor="start">x = [2, 1] has two coordinates (dimensions).</text>
  <rect x="672" y="174" width="100" height="56" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="722.0" y="209.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">3</text>
  <rect x="798" y="174" width="100" height="56" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="848.0" y="209.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">1</text>
  <rect x="672" y="243" width="100" height="56" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="722.0" y="278.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">0</text>
  <rect x="798" y="243" width="100" height="56" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="848.0" y="278.0" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">2</text>
  <text x="978" y="209" font-size="19" font-weight="400" fill="#172033" text-anchor="start">row 1</text>
  <text x="978" y="278" font-size="19" font-weight="400" fill="#172033" text-anchor="start">row 2</text>
  <text x="629" y="339" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Weights often form a matrix; inputs form vectors.</text>
  <text x="28" y="402" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Where it fits: lookup returns vectors; the blocks and output projection transform them.</text>
</svg>
