<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="643.75" viewBox="0 0 1200 515" role="img" aria-labelledby="title desc">
  <title id="title">A projection turns a vector into vocabulary scores</title>
  <desc id="desc">The same multiply-and-add operation also appears throughout the transformer blocks.</desc>
  <!-- Shared typography; editable geometry and real text. -->
  <defs>
    <style>text {font-family:Arial, Helvetica, sans-serif;}</style>
  </defs>
  <rect width="1200" height="515" fill="#fff"/>
  <text x="28" y="44" font-size="28" font-weight="700" fill="#172033" text-anchor="start">A projection turns a vector into vocabulary scores</text>
  <text x="28" y="78" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">The same multiply-and-add operation also appears throughout the transformer blocks.</text>
  <!-- Show the row-by-row calculation instead of treating projection as a black box. -->
  <rect x="28" y="136" width="250" height="114" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="153.0" y="187.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Input vector</text>
  <text x="153.0" y="212.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">x = [2, 1]</text>
  <rect x="352" y="136" width="478" height="114" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="591.0" y="187.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">OUTPUT PROJECTION · learned rows</text>
  <text x="591.0" y="212.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">sat: [3, 1] · ran: [0, 2]</text>
  <rect x="904" y="136" width="268" height="114" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1038.0" y="187.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">LOGITS · raw scores</text>
  <text x="1038.0" y="212.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">sat: 7 · ran: 2</text>
  <path data-connector="true" d="M278 193 L343.0 193.0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="352,193 342.0,197.0 342.0,189.0" fill="#2563eb"/>
  <path data-connector="true" d="M830 193 L895.0 193.0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="904,193 894.0,197.0 894.0,189.0" fill="#2563eb"/>
  <rect x="28" y="290" width="1144" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="329" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Multiply matching coordinates, then add:</text>
  <text x="52" y="375" font-size="23" font-weight="400" fill="#172033" text-anchor="start">sat: 2 × 3 + 1 × 1 = 7</text>
  <text x="640" y="375" font-size="23" font-weight="400" fill="#172033" text-anchor="start">ran: 2 × 0 + 1 × 2 = 2</text>
  <text x="28" y="450" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Where it fits: after final normalization, score every vocabulary token using the last position.</text>
  <text x="28" y="485" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Only two vocabulary rows are shown. Logits can be negative and need not sum to 1.</text>
</svg>
