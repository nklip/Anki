<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1200 624" role="img" aria-labelledby="title desc">
  <title id="title">The recipe stays; the working numbers change</title>
  <desc id="desc">Inference = use the trained weights. Training is what adjusts those weights.</desc>
  <!-- Shared typography; editable geometry and real text. -->
  <defs>
    <style>text {font-family:Arial, Helvetica, sans-serif;}</style>
  </defs>
  <rect width="1200" height="624" fill="#fff"/>
  <text x="28" y="44" font-size="28" font-weight="700" fill="#172033" text-anchor="start">The recipe stays; the working numbers change</text>
  <text x="28" y="78" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Inference = use the trained weights. Training is what adjusts those weights.</text>
  <!-- Weights are the reusable recipe; activations are the changing input and computed values. -->
  <rect x="28" y="112" width="1144" height="122" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="52" y="150" font-size="24" font-weight="700" fill="#172033" text-anchor="start">WEIGHTS · learned recipe, fixed during inference</text>
  <text x="52" y="194" font-size="22" font-weight="400" fill="#172033" text-anchor="start">W has rows [3, 1] and [0, 2]. Each output = one row multiplied with the input.</text>
  <text x="28" y="280" font-size="24" font-weight="700" fill="#172033" text-anchor="start">ACTIVATIONS · working numbers for this particular input</text>
  <rect x="28" y="316" width="260" height="94" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="158.0" y="357.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Input vector</text>
  <text x="158.0" y="382.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">[2, 1]</text>
  <rect x="350" y="316" width="498" height="94" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="599.0" y="357.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Same W, new calculation</text>
  <text x="599.0" y="382.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">3 × 2 + 1 × 1 = 7</text>
  <rect x="910" y="316" width="262" height="94" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1041.0" y="357.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Output vector</text>
  <text x="1041.0" y="382.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">[7, 2]</text>
  <path data-connector="true" d="M288 363 L341.0 363.0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="350,363 340.0,367.0 340.0,359.0" fill="#2563eb"/>
  <path data-connector="true" d="M848 363 L901.0 363.0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="910,363 900.0,367.0 900.0,359.0" fill="#2563eb"/>
  <rect x="28" y="450" width="260" height="94" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="158.0" y="491.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Input vector</text>
  <text x="158.0" y="516.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">[1, 2]</text>
  <rect x="350" y="450" width="498" height="94" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="599.0" y="491.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Same W, new calculation</text>
  <text x="599.0" y="516.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">3 × 1 + 1 × 2 = 5</text>
  <rect x="910" y="450" width="262" height="94" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1041.0" y="491.5" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Output vector</text>
  <text x="1041.0" y="516.5" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">[5, 4]</text>
  <path data-connector="true" d="M288 497 L341.0 497.0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="350,497 340.0,501.0 340.0,493.0" fill="#2563eb"/>
  <path data-connector="true" d="M848 497 L901.0 497.0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="910,497 900.0,501.0 900.0,493.0" fill="#2563eb"/>
  <text x="28" y="590" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Where it fits: every learned transformation reads fixed weights and produces activations.</text>
</svg>
