<svg xmlns="http://www.w3.org/2000/svg" width="900" height="514" viewBox="0 0 900 514" role="img" aria-labelledby="title desc">
  <title id="title">Each token ID selects a starting vector</title>
  <desc id="desc">An invented tokenizer maps The cat to token IDs 12 and 87. The shared learned embedding table maps ID 12 to the vector [1, 0] and ID 87 to [0, 1]. Each position gets its own starting vector. Only two rows of the table are shown. A vector is an ordered list of numbers.</desc>
  <!-- Blue is input, purple is learned weights, green is computed output. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 21px; text-anchor: middle; }
      .value { font-size: 27px; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="514" fill="#ffffff"/>

  <!-- Columns establish the lookup direction; positions remain separate. -->
  <text class="title" x="28" y="44">Each token ID selects a starting vector</text>
  <text class="subtitle" x="28" y="76">Toy input: “The cat” · invented token IDs and vector values</text>
  <text class="label" x="118" y="126">Input IDs</text>
  <text class="label" x="440" y="126">Shared embedding table</text>
  <text class="label" x="777" y="126">Starting vectors</text>
  <g id="input-token-ids">
    <text class="note" x="118" y="184">Position 1</text>
    <rect x="28" y="207" width="180" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="body" x="118" y="235">The</text>
    <text class="body" x="118" y="263">ID 12</text>
    <text class="note" x="118" y="301">Position 2</text>
    <rect x="28" y="324" width="180" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="body" x="118" y="352">cat</text>
    <text class="body" x="118" y="380">ID 87</text>
  </g>

  <!-- Only the two relevant rows are shown; the table is a learned parameter. -->
  <g id="embedding-table">
    <rect x="300" y="153" width="280" height="263" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="346" y="187">ID</text>
    <text class="label" x="486" y="187">Vector</text>
    <line x1="301" y1="205" x2="579" y2="205" stroke="#9333ea"/>
    <line x1="301" y1="296" x2="579" y2="296" stroke="#9333ea"/>
    <text class="value" x="346" y="252">12</text>
    <text class="value" x="486" y="252">[1, 0]</text>
    <text class="value" x="346" y="369">87</text>
    <text class="value" x="486" y="369">[0, 1]</text>
  </g>

  <!-- These vectors are activations, one for each input position. -->
  <g id="starting-activations">
    <text class="note" x="777" y="184">Position 1</text>
    <rect x="682" y="207" width="190" height="70" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="value" x="777" y="252">[1, 0]</text>
    <text class="note" x="777" y="301">Position 2</text>
    <rect x="682" y="324" width="190" height="70" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="value" x="777" y="369">[0, 1]</text>
  </g>

  <!-- Shafts stop inside their triangle bases; tips meet target boundaries. -->
  <g id="lookup-connectors">
    <line class="connector" x1="209" y1="242" x2="287" y2="242"/>
    <polygon class="head" points="300,242 286,235 286,249"/>
    <line class="connector" x1="581" y1="242" x2="669" y2="242"/>
    <polygon class="head" points="682,242 668,235 668,249"/>
    <line class="connector" x1="209" y1="359" x2="287" y2="359"/>
    <polygon class="head" points="300,359 286,352 286,366"/>
    <line class="connector" x1="581" y1="359" x2="669" y2="359"/>
    <polygon class="head" points="682,359 668,352 668,366"/>
  </g>

  <!-- State the parameter versus activation distinction without relying on color. -->
  <text class="note" x="450" y="454">Table = learned weights. Retrieved vectors = starting activations.</text>
  <text class="note" x="450" y="488">A vector is an ordered list of numbers. Only two table rows are shown.</text>
</svg>
