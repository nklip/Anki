<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="845.454545" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Validation and authorization are separate execution checks</title>
<desc id="desc">Three requests demonstrate a wrong input type, a correctly shaped but unauthorized file request, and an allowed notes.txt read. Only the final request reaches execution.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="620" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Validate the input, then check permission, then execute</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Validation checks the input rules. Authorization checks whether this action on this target is allowed.</text>
<text x="42" y="125" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Generated arguments</text>
<text x="362" y="125" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Validation</text>
<text x="632" y="125" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Authorization</text>
<text x="902" y="125" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Outcome</text>
<rect x="30" y="160" width="280" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="45" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">path: 42</text>
<rect x="350" y="160" width="230" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Reject: not text</text>
<rect x="620" y="160" width="230" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="635" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Not reached</text>
<rect x="890" y="160" width="180" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="905" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Do not run</text>
<path data-connector="true" d="M 310,198 L 339,198" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="350,198 338,204 338,192" fill="#64748b"/>
<path data-connector="true" d="M 580,198 L 609,198" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="620,198 608,204 608,192" fill="#64748b"/>
<path data-connector="true" d="M 850,198 L 879,198" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="890,198 878,204 878,192" fill="#64748b"/>
<rect x="30" y="285" width="280" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="45" y="330" font-size="20" font-weight="400" text-anchor="start" fill="#172033">path: secrets.txt</text>
<rect x="350" y="285" width="230" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365" y="330" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Valid text</text>
<rect x="620" y="285" width="230" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="635" y="330" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Denied target</text>
<rect x="890" y="285" width="180" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="905" y="330" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Do not run</text>
<path data-connector="true" d="M 310,323 L 339,323" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="350,323 338,329 338,317" fill="#64748b"/>
<path data-connector="true" d="M 580,323 L 609,323" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="620,323 608,329 608,317" fill="#64748b"/>
<path data-connector="true" d="M 850,323 L 879,323" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="890,323 878,329 878,317" fill="#64748b"/>
<rect x="30" y="410" width="280" height="75" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="45" y="455" font-size="20" font-weight="400" text-anchor="start" fill="#172033">path: notes.txt</text>
<rect x="350" y="410" width="230" height="75" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365" y="455" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Valid text</text>
<rect x="620" y="410" width="230" height="75" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="635" y="455" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Read permitted</text>
<rect x="890" y="410" width="180" height="75" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="905" y="455" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Run read_file</text>
<path data-connector="true" d="M 310,448 L 339,448" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="350,448 338,454 338,442" fill="#64748b"/>
<path data-connector="true" d="M 580,448 L 609,448" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="620,448 608,454 608,442" fill="#64748b"/>
<path data-connector="true" d="M 850,448 L 879,448" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="890,448 878,454 878,442" fill="#64748b"/>
<!-- Policy scope; preserve reading order and text clearance. -->
<g id="policy-scope">
<text x="30" y="548" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Example policy: read notes.txt only. Tool discovery and valid formatting do not grant permission.</text>
<text x="30" y="585" font-size="20" font-weight="400" text-anchor="start" fill="#172033">These checks belong in application and service code. A model instruction alone is not an access control.</text>
</g>
</svg>
