<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="838.636364" viewBox="0 0 1100 615" role="img" aria-labelledby="title desc">
<title id="title">Tool definition, input schema, and arguments</title>
<desc id="desc">The read_file definition describes capability. Its input schema requires a string path and no other fields. Arguments supply notes.txt for one invocation. Schema validity does not establish authorization or correctness.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="615" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">A definition describes the tool; arguments supply this call’s inputs</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Simplified fields illustrate the contract. Exact message formats depend on the model API.</text>
<!-- Tool definition; preserve reading order and text clearance. -->
<g id="tool-definition">
<rect x="30" y="120" width="320" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="158" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tool definition</text>
<text x="50" y="199" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Name: read_file</text>
<text x="50" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Description: read a</text>
<text x="50" y="263" font-size="20" font-weight="400" text-anchor="start" fill="#172033">permitted text file.</text>
<text x="50" y="295" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The model receives this</text>
<text x="50" y="327" font-size="20" font-weight="400" text-anchor="start" fill="#172033">description with its input.</text>
</g>
<!-- Input schema; preserve reading order and text clearance. -->
<g id="input-schema">
<rect x="390" y="120" width="320" height="310" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="410" y="158" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Input schema</text>
<text x="410" y="199" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Rules for accepted inputs:</text>
<text x="410" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#172033">path is required.</text>
<text x="410" y="263" font-size="20" font-weight="400" text-anchor="start" fill="#172033">path must be a string</text>
<text x="410" y="295" font-size="20" font-weight="400" text-anchor="start" fill="#172033">(a text value).</text>
<text x="410" y="327" font-size="20" font-weight="400" text-anchor="start" fill="#172033">No additional fields.</text>
</g>
<!-- Call arguments; preserve reading order and text clearance. -->
<g id="call-arguments">
<rect x="750" y="120" width="320" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770" y="158" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Arguments</text>
<text x="770" y="199" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Values chosen for one call:</text>
<text x="770" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#172033">{&quot;path&quot;: &quot;notes.txt&quot;}</text>
<text x="770" y="263" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Here path is the field;</text>
<text x="770" y="295" font-size="20" font-weight="400" text-anchor="start" fill="#172033">notes.txt is its value.</text>
<text x="770" y="327" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tool name: read_file</text>
</g>
<!-- Contract flow; preserve reading order and text clearance. -->
<g id="contract-flow">
<path data-connector="true" d="M 350,270 L 379,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="390,270 378,276 378,264" fill="#64748b"/>
<path data-connector="true" d="M 710,270 L 739,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="750,270 738,276 738,264" fill="#64748b"/>
</g>
<!-- Contract limit; preserve reading order and text clearance. -->
<g id="contract-limit">
<rect x="30" y="474" width="1040" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="513" font-size="25" font-weight="700" text-anchor="start" fill="#172033">A well-formed request still needs permission and correct execution.</text>
<text x="50" y="550" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A path can be valid text while naming a forbidden file, the wrong file, or a file that does not exist.</text>
</g>
</svg>
