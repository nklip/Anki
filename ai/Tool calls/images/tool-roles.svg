<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="818.181818" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Tool, runtime, model, and API roles</title>
<desc id="desc">Three participants separate model-generated requests, application orchestration, and executable tool code. An API is the interface used to request functionality. Results return to the model through the runtime.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="600" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">The model requests; the runtime coordinates; the tool acts</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A tool is executable functionality. The runtime is the application code managing the exchange.</text>
<!-- Participants; preserve reading order and text clearance. -->
<g id="participants">
<rect x="30" y="125" width="280" height="235" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model</text>
<text x="50" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Receives current input</text>
<text x="50" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Generates a request:</text>
<text x="50" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">read notes.txt</text>
<text x="50" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Does not open the file.</text>
<rect x="410" y="125" width="280" height="235" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="430" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Runtime</text>
<text x="430" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Receives the tool call</text>
<text x="430" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Checks inputs + access</text>
<text x="430" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Invokes the tool</text>
<text x="430" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Returns its result.</text>
<rect x="790" y="125" width="280" height="235" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="810" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tool implementation</text>
<text x="810" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Actual read_file code</text>
<text x="810" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Opens permitted files</text>
<text x="810" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Reads their contents</text>
<text x="810" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Returns text or an error.</text>
</g>
<!-- Calls and results; preserve reading order and text clearance. -->
<g id="calls-and-results">
<path data-connector="true" d="M 310,230 L 399,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="410,230 398,236 398,224" fill="#64748b"/>
<path data-connector="true" d="M 690,230 L 779,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="790,230 778,236 778,224" fill="#64748b"/>
<path data-connector="true" d="M 930,360 L 930,403 L 550,403 L 550,371" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="550,360 556,372 544,372" fill="#64748b"/>
<text x="692" y="390" font-size="19" font-weight="400" text-anchor="start" fill="#172033">tool result</text>
<path data-connector="true" d="M 410,310 L 321,310" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="310,310 322,304 322,316" fill="#64748b"/>
<text x="328" y="292" font-size="18" font-weight="400" text-anchor="start" fill="#172033">result</text>
</g>
<!-- Api definition; preserve reading order and text clearance. -->
<g id="api-definition">
<rect x="30" y="452" width="1040" height="114" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="490" font-size="25" font-weight="700" text-anchor="start" fill="#172033">API = an interface through which programs request functionality</text>
<text x="50" y="529" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The runtime uses a model API to send input and receive output; tools also expose callable interfaces.</text>
</g>
</svg>
