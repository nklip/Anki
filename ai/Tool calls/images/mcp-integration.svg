<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="852.272727" viewBox="0 0 1100 625" role="img" aria-labelledby="title desc">
<title id="title">MCP host, client, server, discovery, and invocation</title>
<desc id="desc">The application hosts an MCP client that communicates with a server. Tool discovery returns definitions; invocation sends arguments and returns a result. The model remains separate and MCP is an optional integration.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="625" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">MCP standardizes the connection to a tool server</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Model Context Protocol (MCP) is a set of communication rules for applications and context providers.</text>
<!-- Mcp participants; preserve reading order and text clearance. -->
<g id="mcp-participants">
<rect x="30" y="125" width="235" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model</text>
<text x="50" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Requests a tool</text>
<text x="50" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Uses results</text>
<text x="50" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">No MCP client inside</text>
<text x="50" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">the neural model.</text>
<rect x="395" y="125" width="310" height="240" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="415" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Application / host</text>
<text x="415" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Coordinates the run</text>
<text x="415" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Contains an MCP client:</text>
<text x="415" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">a component that talks</text>
<text x="415" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">to the server.</text>
<rect x="835" y="125" width="235" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="855" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">MCP server</text>
<text x="855" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A program exposing</text>
<text x="855" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">tools and other context</text>
<text x="855" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Local or remote</text>
<text x="855" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Returns results.</text>
</g>
<!-- Mcp exchange; preserve reading order and text clearance. -->
<g id="mcp-exchange">
<path data-connector="true" d="M 265,240 L 384,240" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="395,240 383,246 383,234" fill="#64748b"/>
<text x="280" y="218" font-size="18" font-weight="400" text-anchor="start" fill="#172033">tool call</text>
<path data-connector="true" d="M 395,320 L 276,320" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="265,320 277,314 277,326" fill="#64748b"/>
<text x="284" y="299" font-size="18" font-weight="400" text-anchor="start" fill="#172033">result</text>
<path data-connector="true" d="M 705,240 L 824,240" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="835,240 823,246 823,234" fill="#64748b"/>
<text x="719" y="218" font-size="18" font-weight="400" text-anchor="start" fill="#172033">MCP call</text>
<path data-connector="true" d="M 835,320 L 716,320" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="705,320 717,314 717,326" fill="#64748b"/>
<text x="715" y="299" font-size="18" font-weight="400" text-anchor="start" fill="#172033">MCP result</text>
</g>
<!-- Discovery; preserve reading order and text clearance. -->
<g id="discovery">
<rect x="30" y="416" width="500" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="454" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tool discovery</text>
<text x="50" y="495" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Client asks tools/list.</text>
<text x="50" y="527" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Server returns available definitions.</text>
</g>
<!-- Invocation; preserve reading order and text clearance. -->
<g id="invocation">
<rect x="570" y="416" width="500" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="590" y="454" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tool invocation</text>
<text x="590" y="495" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Client sends tools/call with arguments.</text>
<text x="590" y="527" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Server executes the tool and returns its result.</text>
</g>
<text x="30" y="592" font-size="21" font-weight="700" text-anchor="start" fill="#172033">MCP is optional: a runtime can call tool code directly. Permission checks still apply.</text>
</svg>
