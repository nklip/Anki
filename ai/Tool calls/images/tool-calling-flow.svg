<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="811.363636" viewBox="0 0 1100 595" role="img" aria-labelledby="title desc">
<title id="title">A complete file-reading tool exchange</title>
<desc id="desc">A question and definition reach the model, which requests read_file with notes.txt and call identifier A1. The runtime checks and executes the tool, returns the matched result, and makes a subsequent model call.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="595" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Follow one file lookup from request to evidence</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Task: read the meeting time in notes.txt. Each box is a stage in one tool exchange.</text>
<!-- Input; preserve reading order and text clearance. -->
<g id="input">
<rect x="30" y="133" width="180" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="171" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Input</text>
<text x="46" y="215" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Question +</text>
<text x="46" y="250" font-size="18" font-weight="400" text-anchor="start" fill="#172033">read_file definition</text>
<text x="46" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#172033">are sent to</text>
<text x="46" y="320" font-size="18" font-weight="400" text-anchor="start" fill="#172033">the model.</text>
</g>
<!-- Tool call; preserve reading order and text clearance. -->
<g id="tool-call">
<rect x="250" y="133" width="180" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="266" y="171" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Tool call</text>
<text x="266" y="215" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Model requests</text>
<text x="266" y="250" font-size="18" font-weight="400" text-anchor="start" fill="#172033">read_file</text>
<text x="266" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#172033">path: notes.txt</text>
<text x="266" y="320" font-size="18" font-weight="400" text-anchor="start" fill="#172033">call ID: A1</text>
</g>
<!-- Execute; preserve reading order and text clearance. -->
<g id="execute">
<rect x="470" y="133" width="180" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="486" y="171" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Execute</text>
<text x="486" y="215" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Runtime checks</text>
<text x="486" y="250" font-size="18" font-weight="400" text-anchor="start" fill="#172033">the request, then</text>
<text x="486" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#172033">tool code reads</text>
<text x="486" y="320" font-size="18" font-weight="400" text-anchor="start" fill="#172033">the permitted file.</text>
</g>
<!-- Tool result; preserve reading order and text clearance. -->
<g id="tool-result">
<rect x="690" y="133" width="180" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="706" y="171" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Tool result</text>
<text x="706" y="215" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Result for A1:</text>
<text x="706" y="250" font-size="18" font-weight="400" text-anchor="start" fill="#172033">“Meeting starts</text>
<text x="706" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#172033">at 10:00.”</text>
<text x="706" y="320" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Runtime returns it.</text>
</g>
<!-- Next call; preserve reading order and text clearance. -->
<g id="next-call">
<rect x="910" y="133" width="180" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="926" y="171" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Next call</text>
<text x="926" y="215" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Receives the</text>
<text x="926" y="250" font-size="18" font-weight="400" text-anchor="start" fill="#172033">matched result;</text>
<text x="926" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#172033">can answer or</text>
<text x="926" y="320" font-size="18" font-weight="400" text-anchor="start" fill="#172033">request more work.</text>
</g>
<path data-connector="true" d="M 210,270 L 239,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="250,270 238,276 238,264" fill="#64748b"/>
<path data-connector="true" d="M 430,270 L 459,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="470,270 458,276 458,264" fill="#64748b"/>
<path data-connector="true" d="M 650,270 L 679,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="690,270 678,276 678,264" fill="#64748b"/>
<path data-connector="true" d="M 870,270 L 899,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="910,270 898,276 898,264" fill="#64748b"/>
<!-- Request is not execution; preserve reading order and text clearance. -->
<g id="request-is-not-execution">
<rect x="30" y="431" width="1060" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="471" font-size="27" font-weight="700" text-anchor="start" fill="#172033">Generating a request does not run the tool.</text>
<text x="50" y="511" font-size="21" font-weight="400" text-anchor="start" fill="#172033">The runtime must invoke real code and include the result in a later model input.</text>
<text x="50" y="542" font-size="21" font-weight="400" text-anchor="start" fill="#172033">The returned file text is evidence; a filename alone is not its contents.</text>
</g>
</svg>
