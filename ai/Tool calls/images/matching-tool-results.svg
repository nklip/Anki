<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="845.454545" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Call identifiers and tool results</title>
<desc id="desc">Identifiers A1, A2, and A3 pair file requests with their results regardless of arrival order. The third invocation returns an error that enables correction rather than fabricated contents.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="620" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">A call identifier ties each result to the right request</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A call ID labels one invocation, so several calls to the same tool can be distinguished.</text>
<text x="30" y="129" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Requests</text>
<text x="470" y="129" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Matched tool results</text>
<text x="860" y="129" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Next decision</text>
<rect x="30" y="155" width="340" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="204" font-size="23" font-weight="700" text-anchor="start" fill="#172033">A1 · notes.txt</text>
<rect x="450" y="155" width="330" height="84" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="470" y="204" font-size="21" font-weight="400" text-anchor="start" fill="#172033">A1 · “Meeting at 10:00.”</text>
<rect x="860" y="155" width="210" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="875" y="204" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Use meeting time.</text>
<path data-connector="true" d="M 370,197 L 439,197" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="450,197 438,203 438,191" fill="#64748b"/>
<path data-connector="true" d="M 780,197 L 849,197" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="860,197 848,203 848,191" fill="#64748b"/>
<rect x="30" y="285" width="340" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="334" font-size="23" font-weight="700" text-anchor="start" fill="#172033">A2 · agenda.txt</text>
<rect x="450" y="285" width="330" height="84" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="470" y="334" font-size="21" font-weight="400" text-anchor="start" fill="#172033">A2 · “Budget review.”</text>
<rect x="860" y="285" width="210" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="875" y="334" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Use agenda topic.</text>
<path data-connector="true" d="M 370,327 L 439,327" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="450,327 438,333 438,321" fill="#64748b"/>
<path data-connector="true" d="M 780,327 L 849,327" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="860,327 848,333 848,321" fill="#64748b"/>
<rect x="30" y="415" width="340" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="464" font-size="23" font-weight="700" text-anchor="start" fill="#172033">A3 · missing.txt</text>
<rect x="450" y="415" width="330" height="84" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="470" y="464" font-size="21" font-weight="400" text-anchor="start" fill="#172033">A3 · error: file not found</text>
<rect x="860" y="415" width="210" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="875" y="464" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Correct or investigate.</text>
<path data-connector="true" d="M 370,457 L 439,457" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="450,457 438,463 438,451" fill="#64748b"/>
<path data-connector="true" d="M 780,457 L 849,457" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="860,457 848,463 848,451" fill="#64748b"/>
<!-- Matching rule; preserve reading order and text clearance. -->
<g id="matching-rule">
<text x="30" y="552" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Results may arrive in a different order: match by ID, not by arrival position.</text>
<text x="30" y="589" font-size="20" font-weight="400" text-anchor="start" fill="#172033">An error result reports failure. It must not be presented to the model as successful file contents.</text>
</g>
</svg>
