<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1275" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">Where this fits: Decoding and sampling</title>
<desc id="desc">A common request lifecycle with context assembly, optional prefix reuse, model prefill and decode with a KV cache, token selection, a continuation loop, and stopping. Only Decoding and sampling is highlighted. The lower example illustrates that topic.</desc>
<!-- Shared typography; all teaching content remains editable SVG text. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="1020" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Where this fits: the request lifecycle</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Follow the arrows. The blue frame marks this topic; the same map appears in related explanations.</text>
<!-- Shared flow. -->
<g id="shared-flow">
<!-- Context assembly. -->
<g id="context-assembly">
<rect x="30" y="130" width="250" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="166" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Assemble context</text>
<text x="50" y="200" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Instructions + question</text>
<text x="50" y="230" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Examples / history</text>
<text x="50" y="260" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Retrieved notes or files</text>
</g>
<!-- Prefix reuse. -->
<g id="prefix-reuse">
<rect x="320" y="130" width="250" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="340" y="166" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Check prefix cache</text>
<text x="340" y="200" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Optional reuse across calls</text>
<text x="340" y="230" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Match: reuse prefix work</text>
<text x="340" y="260" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Miss: compute the input</text>
</g>
<!-- Model execution. -->
<g id="model-execution">
<rect x="610" y="130" width="300" height="350" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="630" y="166" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Model execution</text>
<rect x="630" y="190" width="260" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
<text x="650" y="222" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Prefill → scores</text>
<text x="650" y="256" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Process uncached input</text>
<rect x="630" y="315" width="260" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
<text x="650" y="348" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Decode → scores</text>
<text x="650" y="382" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Process chosen token</text>
<text x="630" y="438" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Both use a per-request KV cache.</text>
<text x="630" y="465" font-size="18" font-weight="400" text-anchor="start" fill="#172033">KV = attention keys and values</text>
</g>
<!-- Token selection. -->
<g id="token-selection">
<rect x="950" y="130" width="220" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3" data-focus="true"/>
<text x="970" y="166" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Select a token</text>
<text x="970" y="200" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Read model scores</text>
<text x="970" y="230" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Greedy choice or</text>
<text x="970" y="260" font-size="18" font-weight="400" text-anchor="start" fill="#172033">weighted sampling</text>
</g>
<!-- Reply. -->
<g id="reply">
<rect x="1020" y="405" width="150" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="1095" y="437" font-size="22" font-weight="700" text-anchor="middle" fill="#172033">Reply ends</text>
<text x="1095" y="465" font-size="18" font-weight="400" text-anchor="middle" fill="#172033">Stop condition</text>
</g>
<!-- External inputs. -->
<g id="external-inputs">
<rect x="30" y="350" width="250" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="386" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Saved chats / notes</text>
<text x="50" y="422" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Select relevant information</text>
<text x="50" y="452" font-size="18" font-weight="400" text-anchor="start" fill="#172033">to include in this call.</text>
<rect x="320" y="350" width="250" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="340" y="386" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Prior prefix state</text>
<text x="340" y="422" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Saved computation from</text>
<text x="340" y="452" font-size="18" font-weight="400" text-anchor="start" fill="#172033">an earlier request.</text>
<path data-connector="true" d="M 155,350 L 155,301" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="155,290 161,302 149,302" fill="#64748b"/>
<text x="170" y="328" font-size="18" font-weight="400" text-anchor="start" fill="#172033">read</text>
<path data-connector="true" d="M 445,350 L 445,301" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="445,290 451,302 439,302" fill="#64748b"/>
<text x="460" y="328" font-size="18" font-weight="400" text-anchor="start" fill="#172033">look up</text>
</g>
<!-- Request flow. -->
<g id="request-flow">
<path data-connector="true" d="M 280,220 L 309,220" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="320,220 308,226 308,214" fill="#64748b"/>
<path data-connector="true" d="M 570,235 L 619,235" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="630,235 618,241 618,229" fill="#64748b"/>
<path data-connector="true" d="M 890,220 L 939,220" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="950,220 938,226 938,214" fill="#64748b"/>
<path data-connector="true" d="M 890,360 L 925,360 L 925,270 L 939,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="950,270 938,276 938,264" fill="#64748b"/>
<path data-connector="true" d="M 980,300 L 980,540 L 590,540 L 590,360 L 619,360" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="630,360 618,366 618,354" fill="#64748b"/>
<text x="605" y="524" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Continue: feed the chosen token back</text>
<path data-connector="true" d="M 1110,300 L 1110,394" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="1110,405 1104,393 1116,393" fill="#64748b"/>
<text x="1125" y="361" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Stop</text>
</g>
<!-- Information boundaries. -->
<g id="information-boundaries">
<rect x="30" y="580" width="1140" height="88" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="50" y="614" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Model weights stay fixed during inference. The context window limits input plus generated output.</text>
<text x="50" y="648" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Saved notes add information to the input. Caches reuse computation; they do not expand that window.</text>
</g>
</g>
<text x="30" y="721" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Scores become one chosen token</text>
<!-- Topic worked example. -->
<g id="topic-worked-example">
<rect x="30" y="766" width="340" height="178" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="50" y="802" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model scores</text>
<text x="50" y="839" font-size="21" font-weight="400" text-anchor="start" fill="#172033">cat: 2   dog: 1   fox: 0</text>
<text x="50" y="871" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Softmax turns scores</text>
<text x="50" y="903" font-size="21" font-weight="400" text-anchor="start" fill="#172033">into probabilities.</text>
<rect x="430" y="766" width="340" height="178" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="450" y="802" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Selection rule</text>
<text x="450" y="839" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Greedy picks cat.</text>
<text x="450" y="871" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Sampling may pick dog.</text>
<text x="450" y="903" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Choice is not a fact check.</text>
<rect x="830" y="766" width="340" height="178" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="850" y="802" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Next step</text>
<text x="850" y="839" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Feed that token back</text>
<text x="850" y="871" font-size="21" font-weight="400" text-anchor="start" fill="#172033">unless a stop condition</text>
<text x="850" y="903" font-size="21" font-weight="400" text-anchor="start" fill="#172033">ends the reply.</text>
<path data-connector="true" d="M 370,850 L 419,850" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="430,850 418,856 418,844" fill="#64748b"/>
<path data-connector="true" d="M 770,850 L 819,850" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,850 818,856 818,844" fill="#64748b"/>
<text x="30" y="987" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Same scores can lead to different continuations under different selection rules.</text>
</g>
</svg>
