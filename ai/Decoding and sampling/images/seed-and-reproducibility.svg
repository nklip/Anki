<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="951.818181818181818" viewBox="0 0 1100 698" role="img" aria-labelledby="title desc">
<title id="title">Seeds and reproducibility</title><desc id="desc">A seed initializes the random generator. Two toy runs with seed A produce the illustrative draw 0.80 and select dog; a changed seed B produces 0.20 and selects cat. These are illustrative draws, not outputs from a specific generator. Repeating results also requires the same model, prompt, settings, and reproducible execution; seeds do not guarantee identical results across hardware or software.</desc>
<!-- Shared typography; all geometry and text remain editable. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="698" fill="#ffffff"/>
<!-- The seed sets random-generator state; example draws are explicitly illustrative. -->
<g id="heading">
<text x="32" y="44" font-size="29" font-weight="700" fill="#172033" text-anchor="start">A seed starts the random stream used by sampling</text><text x="32" y="77" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Toy draws below: the same probabilities assign 0.80 to dog and 0.20 to cat.</text>
</g>
<!-- A cumulative interval maps random draws to token choices. -->
<g id="probability-key">
<text x="32" y="118" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Probability intervals</text><rect x="275" y="96" width="399" height="38" rx="3" fill="#bfdbfe"/><rect x="674" y="96" width="147" height="38" rx="3" fill="#2563eb"/><rect x="821" y="96" width="54" height="38" rx="3" fill="#cbd5e1"/><text x="474" y="123" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">cat</text><text x="747" y="123" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">dog</text><text x="848" y="123" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">fox</text><text x="275" y="161" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">0</text><text x="674" y="161" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">0.665</text><text x="821" y="161" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">0.910</text><text x="875" y="161" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">1</text>
</g>
<!-- Arrows map seed to generator output to one probability-weighted selection. -->
<g id="run-0">
<text x="32" y="234" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Run A</text><rect x="169" y="190" width="165" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="251.5" y="235" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">seed A</text><rect x="408" y="190" width="250" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="533" y="235" font-size="23" font-weight="400" fill="#172033" text-anchor="middle">Toy draw 0.80</text><rect x="732" y="190" width="336" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="900" y="235" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Selected token: dog</text><path data-connector="true" d="M335 227 H395" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="408,227 394,220 394,234" fill="#64748b"/><path data-connector="true" d="M659 227 H719" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="732,227 718,220 718,234" fill="#64748b"/>
</g>
<!-- Arrows map seed to generator output to one probability-weighted selection. -->
<g id="run-1">
<text x="32" y="344" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Repeat</text><rect x="169" y="300" width="165" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="251.5" y="345" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">seed A</text><rect x="408" y="300" width="250" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="533" y="345" font-size="23" font-weight="400" fill="#172033" text-anchor="middle">Toy draw 0.80</text><rect x="732" y="300" width="336" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="900" y="345" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Selected token: dog</text><path data-connector="true" d="M335 337 H395" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="408,337 394,330 394,344" fill="#64748b"/><path data-connector="true" d="M659 337 H719" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="732,337 718,330 718,344" fill="#64748b"/>
</g>
<!-- Arrows map seed to generator output to one probability-weighted selection. -->
<g id="run-2">
<text x="32" y="454" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Change</text><rect x="169" y="410" width="165" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="251.5" y="455" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">seed B</text><rect x="408" y="410" width="250" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="533" y="455" font-size="23" font-weight="400" fill="#172033" text-anchor="middle">Toy draw 0.20</text><rect x="732" y="410" width="336" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="900" y="455" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Selected token: cat</text><path data-connector="true" d="M335 447 H395" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="408,447 394,440 394,454" fill="#64748b"/><path data-connector="true" d="M659 447 H719" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="732,447 718,440 718,454" fill="#64748b"/>
</g>
<!-- The seed is one repeatability condition, not a guarantee by itself. -->
<g id="conditions">
<rect x="32" y="525" width="1036" height="143" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="562" font-size="24" font-weight="700" fill="#172033" text-anchor="start">To repeat a run, control more than its seed.</text><text x="56" y="600" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Keep the model, prompt, settings, and execution setup the same.</text><text x="56" y="637" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Reproducible operations also matter; different hardware or software may differ.</text>
</g>

</svg>
