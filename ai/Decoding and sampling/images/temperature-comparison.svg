<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Temperature changes sampling chances while preserving the ranking</title>
  <desc id="desc">Three distributions use the same logits, 2, 1, and 0 for cat, dog, and fox. Divide these scores by a positive temperature T before softmax. At T=0.5, scaled logits are 4, 2, 0 and probabilities are approximately 86.7%, 11.7%, and 1.6%. At T=1, probabilities are 66.5%, 24.5%, and 9%. At T=2, scaled logits are 1, 0.5, 0 and probabilities are approximately 50.6%, 30.7%, and 18.6%. Lower temperature concentrates the choices; higher temperature spreads them out. Cat remains the highest-probability token throughout.</desc>
  <!-- Every probability bar uses the same width scale: 190 units represents 100 percent. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 23px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 21px; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .left { font-size: 21px; }
      .right { font-size: 21px; text-anchor: end; }
    </style>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Define the common input and transformation before comparing the results. -->
  <text class="title" x="28" y="44">Temperature changes how spread out choices are</text>
  <text class="subtitle" x="28" y="77">Same logits [2, 1, 0] for cat, dog, fox · Divide by T, then apply softmax</text>
  <g id="low-temperature">
    <rect x="28" y="108" width="268" height="346" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="162" y="143">T = 0.5</text>
    <text class="body" x="162" y="177">Scores: [4, 2, 0]</text>
    <text class="left" x="57" y="218">cat</text><text class="right" x="267" y="218">86.7%</text>
    <rect x="57" y="231" width="190" height="16" rx="3" fill="#dbeafe"/><rect x="57" y="231" width="164.7" height="16" rx="3" fill="#2563eb"/>
    <text class="left" x="57" y="284">dog</text><text class="right" x="267" y="284">11.7%</text>
    <rect x="57" y="297" width="190" height="16" rx="3" fill="#dbeafe"/><rect x="57" y="297" width="22.3" height="16" rx="3" fill="#2563eb"/>
    <text class="left" x="57" y="350">fox</text><text class="right" x="267" y="350">1.6%</text>
    <rect x="57" y="363" width="190" height="16" rx="3" fill="#dbeafe"/><rect x="57" y="363" width="3.0" height="16" rx="1" fill="#2563eb"/>
    <text class="label" x="162" y="424">More concentrated</text>
  </g>

  <!-- The middle column is the unmodified distribution, not a different model. -->
  <g id="unit-temperature">
    <rect x="316" y="108" width="268" height="346" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="450" y="143">T = 1</text>
    <text class="body" x="450" y="177">Scores: [2, 1, 0]</text>
    <text class="left" x="345" y="218">cat</text><text class="right" x="555" y="218">66.5%</text>
    <rect x="345" y="231" width="190" height="16" rx="3" fill="#f3e8ff"/><rect x="345" y="231" width="126.4" height="16" rx="3" fill="#9333ea"/>
    <text class="left" x="345" y="284">dog</text><text class="right" x="555" y="284">24.5%</text>
    <rect x="345" y="297" width="190" height="16" rx="3" fill="#f3e8ff"/><rect x="345" y="297" width="46.5" height="16" rx="3" fill="#9333ea"/>
    <text class="left" x="345" y="350">fox</text><text class="right" x="555" y="350">9.0%</text>
    <rect x="345" y="363" width="190" height="16" rx="3" fill="#f3e8ff"/><rect x="345" y="363" width="17.1" height="16" rx="3" fill="#9333ea"/>
    <text class="label" x="450" y="424">Unchanged</text>
  </g>

  <!-- Higher temperature spreads probability while keeping the same token order. -->
  <g id="high-temperature">
    <rect x="604" y="108" width="268" height="346" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="738" y="143">T = 2</text>
    <text class="body" x="738" y="177">Scores: [1, 0.5, 0]</text>
    <text class="left" x="633" y="218">cat</text><text class="right" x="843" y="218">50.6%</text>
    <rect x="633" y="231" width="190" height="16" rx="3" fill="#d1fae5"/><rect x="633" y="231" width="96.2" height="16" rx="3" fill="#059669"/>
    <text class="left" x="633" y="284">dog</text><text class="right" x="843" y="284">30.7%</text>
    <rect x="633" y="297" width="190" height="16" rx="3" fill="#d1fae5"/><rect x="633" y="297" width="58.4" height="16" rx="3" fill="#059669"/>
    <text class="left" x="633" y="350">fox</text><text class="right" x="843" y="350">18.6%</text>
    <rect x="633" y="363" width="190" height="16" rx="3" fill="#d1fae5"/><rect x="633" y="363" width="35.4" height="16" rx="3" fill="#059669"/>
    <text class="label" x="738" y="424">More spread out</text>
  </g>

  <!-- Shared legend and conclusion clarify the bar encoding and temperature's limit. -->
  <text class="note" x="450" y="491">Each pale bar spans 0–100%. Dark fill shows the token’s probability.</text>
  <text class="body" x="450" y="529">“Cat” stays first: positive temperature does not change a greedy choice.</text>
  <text class="note" x="450" y="571">Percentages are rounded; displayed totals may differ slightly from 100%.</text>
</svg>
