<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="834.545454545454545" viewBox="0 0 1100 612" role="img" aria-labelledby="title desc">
<title id="title">Temperature reshapes sampling probabilities</title><desc id="desc">The same logits 2, 1, 0 at temperatures 0.5, 1, and 2 yield approximately 86.7/11.7/1.6, 66.5/24.5/9.0, and 50.6/30.7/18.6 percent. All charts share a common 0 to 100 percent scale. Positive temperature preserves the token ranking.</desc>
<!-- Shared typography; all geometry and text remain editable. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="612" fill="#ffffff"/>
<!-- Every panel starts with the same three logits. -->
<g id="heading">
<text x="32" y="44" font-size="29" font-weight="700" fill="#172033" text-anchor="start">Temperature changes the spread of probabilities</text><text x="32" y="77" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Divide logits by positive T, then apply softmax. Original logits: cat 2, dog 1, fox 0.</text>
</g>
<!-- All bars share the same 100-percent track width. -->
<g id="temperature-0-5">
<rect x="32" y="108" width="328" height="397" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="196" y="149" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">T = 0.5</text><text x="52" y="186" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Scaled logits: 4, 2, 0</text><text x="52" y="223" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Probability (0–100%)</text><text x="52" y="273" font-size="21" font-weight="700" fill="#172033" text-anchor="start">cat</text><rect x="104" y="251" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="104" y="251" width="164.73" height="27" rx="3" fill="#2563eb"/><text x="318" y="301" font-size="20" font-weight="400" fill="#172033" text-anchor="end">86.7%</text><text x="52" y="348" font-size="21" font-weight="700" fill="#172033" text-anchor="start">dog</text><rect x="104" y="326" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="104" y="326" width="22.229999999999997" height="27" rx="3" fill="#2563eb"/><text x="318" y="376" font-size="20" font-weight="400" fill="#172033" text-anchor="end">11.7%</text><text x="52" y="423" font-size="21" font-weight="700" fill="#172033" text-anchor="start">fox</text><rect x="104" y="401" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="104" y="401" width="3.04" height="27" rx="3" fill="#2563eb"/><text x="318" y="451" font-size="20" font-weight="400" fill="#172033" text-anchor="end">1.6%</text><text x="196" y="480" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Sharper: favorite dominates</text>
</g>
<!-- All bars share the same 100-percent track width. -->
<g id="temperature-1">
<rect x="386" y="108" width="328" height="397" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="550" y="149" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">T = 1</text><text x="406" y="186" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Scaled logits: 2, 1, 0</text><text x="406" y="223" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Probability (0–100%)</text><text x="406" y="273" font-size="21" font-weight="700" fill="#172033" text-anchor="start">cat</text><rect x="458" y="251" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="458" y="251" width="126.35" height="27" rx="3" fill="#2563eb"/><text x="672" y="301" font-size="20" font-weight="400" fill="#172033" text-anchor="end">66.5%</text><text x="406" y="348" font-size="21" font-weight="700" fill="#172033" text-anchor="start">dog</text><rect x="458" y="326" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="458" y="326" width="46.55" height="27" rx="3" fill="#2563eb"/><text x="672" y="376" font-size="20" font-weight="400" fill="#172033" text-anchor="end">24.5%</text><text x="406" y="423" font-size="21" font-weight="700" fill="#172033" text-anchor="start">fox</text><rect x="458" y="401" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="458" y="401" width="17.099999999999998" height="27" rx="3" fill="#2563eb"/><text x="672" y="451" font-size="20" font-weight="400" fill="#172033" text-anchor="end">9.0%</text><text x="550" y="480" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Unchanged distribution</text>
</g>
<!-- All bars share the same 100-percent track width. -->
<g id="temperature-2">
<rect x="740" y="108" width="328" height="397" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="904" y="149" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">T = 2</text><text x="760" y="186" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Scaled logits: 1, 0.5, 0</text><text x="760" y="223" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Probability (0–100%)</text><text x="760" y="273" font-size="21" font-weight="700" fill="#172033" text-anchor="start">cat</text><rect x="812" y="251" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="812" y="251" width="96.14" height="27" rx="3" fill="#2563eb"/><text x="1026" y="301" font-size="20" font-weight="400" fill="#172033" text-anchor="end">50.6%</text><text x="760" y="348" font-size="21" font-weight="700" fill="#172033" text-anchor="start">dog</text><rect x="812" y="326" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="812" y="326" width="58.33" height="27" rx="3" fill="#2563eb"/><text x="1026" y="376" font-size="20" font-weight="400" fill="#172033" text-anchor="end">30.7%</text><text x="760" y="423" font-size="21" font-weight="700" fill="#172033" text-anchor="start">fox</text><rect x="812" y="401" width="190" height="27" rx="3" fill="#e2e8f0"/><rect x="812" y="401" width="35.34" height="27" rx="3" fill="#2563eb"/><text x="1026" y="451" font-size="20" font-weight="400" fill="#172033" text-anchor="end">18.6%</text><text x="904" y="480" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Flatter: alternatives gain</text>
</g>
<!-- Positive temperature preserves ordering; displayed shares are rounded. -->
<g id="takeaway">
<text x="32" y="547" font-size="22" font-weight="700" fill="#172033" text-anchor="start">“cat” remains first in every panel. Positive temperature preserves the ranking.</text><text x="32" y="584" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">It changes sampling frequencies; it does not add knowledge or guarantee correctness.</text>
</g>

</svg>
