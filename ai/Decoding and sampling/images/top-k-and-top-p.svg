<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1036.36363636363636" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Top-k and top-p filtering</title><desc id="desc">Top-k with k 2 keeps A and B. Top-p, also called nucleus sampling, with p 0.8 keeps A, B, and C because their cumulative 90% first reaches the 80% threshold. Survivors are renormalized to total 100 percent before sampling one token.</desc>
<!-- Shared typography; all geometry and text remain editable. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="760" fill="#ffffff"/>
<!-- The two filters are alternatives here, not sequential operations. -->
<g id="heading">
<text x="32" y="44" font-size="28" font-weight="700" fill="#172033" text-anchor="start">Top-k keeps a count; top-p reaches a probability target</text><text x="32" y="77" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Apply each filter separately to A 50%, B 25%, C 15%, D 10%.</text>
</g>
<!-- Bar height uses 1.5 units per percentage point before and after rescaling. Blue survives; gray is removed. -->
<g id="top-k">
<rect x="32" y="108" width="506" height="505" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="147" font-size="25" font-weight="700" fill="#172033" text-anchor="start">Top-k: k = 2</text><text x="56" y="184" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Keep the 2 most likely tokens.</text><text x="56" y="225" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Original shares</text><text x="56" y="386" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Rescale survivors to total 100%</text><rect x="62" y="248.0" width="78" height="75.0" rx="3" fill="#2563eb"/><text x="101" y="349" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">A 50%</text><rect x="62" y="420.000" width="78" height="100.000" rx="3" fill="#2563eb"/><text x="101" y="548" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">66.7%</text><rect x="178" y="285.5" width="78" height="37.5" rx="3" fill="#2563eb"/><text x="217" y="349" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">B 25%</text><rect x="178" y="470.000" width="78" height="50.000" rx="3" fill="#2563eb"/><text x="217" y="548" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">33.3%</text><rect x="294" y="300.5" width="78" height="22.5" rx="3" fill="#cbd5e1"/><text x="333" y="349" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">C 15%</text><text x="333" y="548" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">0%</text><rect x="410" y="308.0" width="78" height="15.0" rx="3" fill="#cbd5e1"/><text x="449" y="349" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">D 10%</text><text x="449" y="548" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">0%</text><text x="285" y="588" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">Divide each kept share by 0.75.</text>
</g>
<!-- Bar height uses 1.5 units per percentage point before and after rescaling. Blue survives; gray is removed. -->
<g id="top-p">
<rect x="562" y="108" width="506" height="505" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="586" y="147" font-size="25" font-weight="700" fill="#172033" text-anchor="start">Top-p: p = 0.8</text><text x="586" y="184" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Keep the smallest top set reaching 80%.</text><text x="586" y="225" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Original shares</text><text x="586" y="386" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Rescale survivors to total 100%</text><rect x="592" y="248.0" width="78" height="75.0" rx="3" fill="#2563eb"/><text x="631" y="349" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">A 50%</text><rect x="592" y="436.667" width="78" height="83.333" rx="3" fill="#2563eb"/><text x="631" y="548" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">55.6%</text><rect x="708" y="285.5" width="78" height="37.5" rx="3" fill="#2563eb"/><text x="747" y="349" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">B 25%</text><rect x="708" y="478.333" width="78" height="41.667" rx="3" fill="#2563eb"/><text x="747" y="548" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">27.8%</text><rect x="824" y="300.5" width="78" height="22.5" rx="3" fill="#2563eb"/><text x="863" y="349" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">C 15%</text><rect x="824" y="495.000" width="78" height="25.000" rx="3" fill="#2563eb"/><text x="863" y="548" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">16.7%</text><rect x="940" y="308.0" width="78" height="15.0" rx="3" fill="#cbd5e1"/><text x="979" y="349" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">D 10%</text><text x="979" y="548" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">0%</text><text x="815" y="588" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">Divide each kept share by 0.90.</text>
</g>
<!-- The threshold calculation clarifies why C survives only top-p. -->
<g id="threshold-reading">
<text x="32" y="656" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Top-k keeps A + B = 75%.</text><text x="562" y="650" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Top-p: A + B = 75% &lt; 80%.</text><text x="562" y="681" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Include C: 75% + 15% = 90%.</text><text x="32" y="732" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Sample one survivor. Blue = kept; gray = removed. Same bar scale; rounded values.</text>
</g>

</svg>
