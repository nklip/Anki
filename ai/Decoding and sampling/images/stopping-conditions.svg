<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1093.63636363636364" viewBox="0 0 1100 802" role="img" aria-labelledby="title desc">
<title id="title">Three reasons generation stops</title><desc id="desc">Separate lanes show an end-of-sequence special token, a configured stop string matching generated text, and a cap of four new tokens ending mid-sentence. These are different mechanisms; token spellings and boundaries are illustrative.</desc>
<!-- Shared typography; all geometry and text remain editable. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="802" fill="#ffffff"/>
<!-- Three distinct stopping events, each shown as a token sequence or text stream. -->
<g id="heading">
<text x="32" y="44" font-size="29" font-weight="700" fill="#172033" text-anchor="start">Generation ends when a stopping condition is met</text><text x="32" y="77" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">The chosen token is checked before another generation step begins.</text>
</g>
<!-- Blue cells show the stopping event; the stop string spans three toy tokens. -->
<g id="eos">
<rect x="32" y="110" width="1036" height="174" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="145" font-size="24" font-weight="700" fill="#172033" text-anchor="start">End-of-sequence (EOS)</text><text x="56" y="179" font-size="20" font-weight="400" fill="#172033" text-anchor="start">The model selects a configured end token.</text><rect x="56" y="205" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="121" y="238" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">The</text><path data-connector="true" d="M187 230 H196" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="209,230 195,223 195,237" fill="#64748b"/><rect x="209" y="205" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="274" y="238" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">cat</text><path data-connector="true" d="M340 230 H349" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="362,230 348,223 348,237" fill="#64748b"/><rect x="362" y="205" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="427" y="238" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">slept.</text><path data-connector="true" d="M493 230 H502" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="515,230 501,223 501,237" fill="#64748b"/><rect x="515" y="205" width="130" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="580" y="238" font-size="21" font-weight="700" fill="#172033" text-anchor="middle">&lt;EOS&gt;</text><path data-connector="true" d="M646 230 H681" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="694,230 680,223 680,237" fill="#64748b"/><text x="714" y="238" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Special token → stop</text>
</g>
<!-- Blue cells show the stopping event; the stop string spans three toy tokens. -->
<g id="stop-string">
<rect x="32" y="305" width="1036" height="174" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="340" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Stop string</text><text x="56" y="374" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Configured text “[END]” can span several tokens.</text><rect x="56" y="400" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="121" y="433" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">42</text><path data-connector="true" d="M187 425 H196" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="209,425 195,418 195,432" fill="#64748b"/><rect x="209" y="400" width="130" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="274" y="433" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">[</text><path data-connector="true" d="M340 425 H349" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="362,425 348,418 348,432" fill="#64748b"/><rect x="362" y="400" width="130" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="427" y="433" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">END</text><path data-connector="true" d="M493 425 H502" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="515,425 501,418 501,432" fill="#64748b"/><rect x="515" y="400" width="130" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="580" y="433" font-size="21" font-weight="700" fill="#172033" text-anchor="middle">]</text><path data-connector="true" d="M646 425 H681" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="694,425 680,418 680,432" fill="#64748b"/><text x="714" y="433" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Text match → stop</text>
</g>
<!-- Blue cells show the stopping event; the stop string spans three toy tokens. -->
<g id="length-limit">
<rect x="32" y="500" width="1036" height="174" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="535" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Length limit</text><text x="56" y="569" font-size="20" font-weight="400" fill="#172033" text-anchor="start">The cap is 4 new tokens in this toy example.</text><rect x="56" y="595" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="121" y="628" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">The</text><path data-connector="true" d="M187 620 H196" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="209,620 195,613 195,627" fill="#64748b"/><rect x="209" y="595" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="274" y="628" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">cat</text><path data-connector="true" d="M340 620 H349" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="362,620 348,613 348,627" fill="#64748b"/><rect x="362" y="595" width="130" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="427" y="628" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">sat</text><path data-connector="true" d="M493 620 H502" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="515,620 501,613 501,627" fill="#64748b"/><rect x="515" y="595" width="130" height="50" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="580" y="628" font-size="21" font-weight="700" fill="#172033" text-anchor="middle">on</text><path data-connector="true" d="M646 620 H681" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="694,620 680,613 680,627" fill="#64748b"/><text x="714" y="628" font-size="22" font-weight="700" fill="#172033" text-anchor="start">4 tokens → stop</text>
</g>
<!-- Token spellings and segmentation are illustrative, not a particular model encoding. -->
<g id="takeaway">
<text x="32" y="735" font-size="21" font-weight="700" fill="#172033" text-anchor="start">EOS is a special token; a stop string is a text match; a limit counts generated tokens.</text><text x="32" y="773" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">A length cap can leave a sentence unfinished. Toy token boundaries are shown.</text>
</g>

</svg>
