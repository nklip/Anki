<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="845.454545454545455" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Logits, softmax, and probabilities</title><desc id="desc">Three toy tokens have logits 2, 1, and 0. Softmax exponentiates each score then divides by the sum, 11.107, producing approximately 66.5%, 24.5%, and 9.0%. These are next-token probabilities, not factual confidence.</desc>
<!-- Shared typography; all geometry and text remain editable. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="620" fill="#ffffff"/>
<!-- The subtitle locates this transformation in token selection. -->
<g id="heading">
<text x="32" y="44" font-size="28" font-weight="700" fill="#172033" text-anchor="start">Softmax turns raw scores into next-token probabilities</text><text x="32" y="77" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Model scores for three possible tokens, before one is chosen.</text>
</g>
<!-- Rows stay aligned to show the same candidate through each operation. -->
<g id="column-panels">
<rect x="32" y="105" width="220" height="337" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="284" y="105" width="340" height="337" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="656" y="105" width="412" height="337" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="140" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Logits</text><text x="307" y="140" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Softmax: two operations</text><text x="679" y="140" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Probabilities: shares</text><text x="55" y="177" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Token</text><text x="228" y="177" font-size="20" font-weight="400" fill="#64748b" text-anchor="end">Raw score</text><text x="307" y="177" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">e raised to score ÷ total</text><text x="679" y="177" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Chance of the next token</text>
</g>
<!-- Values are rounded; all rows use the same total. -->
<g id="candidate-cat">
<text x="55" y="225" font-size="23" font-weight="700" fill="#172033" text-anchor="start">cat</text><text x="211" y="225" font-size="23" font-weight="400" fill="#172033" text-anchor="end">2</text><text x="307" y="225" font-size="23" font-weight="400" fill="#172033" text-anchor="start">7.389 ÷ 11.107</text><text x="679" y="225" font-size="21" font-weight="700" fill="#172033" text-anchor="start">cat</text><rect x="735" y="202" width="172.9" height="28" rx="3" fill="#2563eb"/><text x="1042" y="225" font-size="22" font-weight="700" fill="#172033" text-anchor="end">66.5%</text>
</g>
<!-- Values are rounded; all rows use the same total. -->
<g id="candidate-dog">
<text x="55" y="303" font-size="23" font-weight="700" fill="#172033" text-anchor="start">dog</text><text x="211" y="303" font-size="23" font-weight="400" fill="#172033" text-anchor="end">1</text><text x="307" y="303" font-size="23" font-weight="400" fill="#172033" text-anchor="start">2.718 ÷ 11.107</text><text x="679" y="303" font-size="21" font-weight="700" fill="#172033" text-anchor="start">dog</text><rect x="735" y="280" width="63.7" height="28" rx="3" fill="#2563eb"/><text x="1042" y="303" font-size="22" font-weight="700" fill="#172033" text-anchor="end">24.5%</text>
</g>
<!-- Values are rounded; all rows use the same total. -->
<g id="candidate-fox">
<text x="55" y="381" font-size="23" font-weight="700" fill="#172033" text-anchor="start">fox</text><text x="211" y="381" font-size="23" font-weight="400" fill="#172033" text-anchor="end">0</text><text x="307" y="381" font-size="23" font-weight="400" fill="#172033" text-anchor="start">1.000 ÷ 11.107</text><text x="679" y="381" font-size="21" font-weight="700" fill="#172033" text-anchor="start">fox</text><rect x="735" y="358" width="23.400000000000002" height="28" rx="3" fill="#2563eb"/><text x="1042" y="381" font-size="22" font-weight="700" fill="#172033" text-anchor="end">9.0%</text>
</g>
<!-- Short shafts terminate inside their manual arrowhead bases. -->
<g id="operation-links">
<path data-connector="true" d="M253 280 H271" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="284,280 270,273 270,287" fill="#64748b"/><path data-connector="true" d="M625 280 H643" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="656,280 642,273 642,287" fill="#64748b"/>
</g>
<!-- The total and probability interpretation make the arithmetic explicit. -->
<g id="takeaway">
<text x="32" y="481" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Total = 7.389 + 2.718 + 1.000 = 11.107</text><text x="32" y="518" font-size="21" font-weight="400" fill="#172033" text-anchor="start">All shares add to 100%. Higher scores keep higher probabilities.</text><text x="32" y="552" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">A token probability is not a measure of whether a statement is true.</text>
</g>

<!-- Token definition accompanies the concrete candidate examples above. -->
<g id="token-definition"><text x="32" y="591" font-size="21" font-weight="700" fill="#172033">Token = a text piece or special marker the model can process or generate.</text></g>
</svg>
