<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">DPO learns directly from recorded preferences</title>
  <desc id="desc">In standard Direct Preference Optimization, a prompt with chosen answer A and rejected answer B is evaluated by both a trainable assistant model and a frozen reference model. Each computes the likelihood of the two recorded responses. The DPO loss compares how strongly each model favors A relative to B. Training uses this loss to update only the assistant model. No separate reward model or fresh answer generation is needed for the illustrated update.</desc>
  <!-- Keep input blue, fixed reference gray, and training updates purple. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .copy { font-size: 20px; }
      .note { font-size: 19px; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>

  <!-- Both model copies receive the same recorded preference example. -->
  <text class="title" x="28" y="44">DPO learns directly from recorded preferences</text>
  <text class="subtitle" x="28" y="76">Standard Direct Preference Optimization · follow the arrows downward</text>
  <g id="recorded-pair">
    <rect x="50" y="102" width="800" height="82" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="450" y="137" text-anchor="middle">Recorded preference pair</text>
    <text class="copy" x="450" y="167" text-anchor="middle">One prompt + chosen answer A + rejected answer B</text>
  </g>
  <g id="trainable-assistant-model">
    <rect x="50" y="226" width="380" height="122" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="240" y="262" text-anchor="middle">Assistant model · trainable</text>
    <text class="copy" x="240" y="296" text-anchor="middle">How likely are A and B</text>
    <text class="copy" x="240" y="325" text-anchor="middle">under the current weights?</text>
  </g>
  <g id="frozen-reference-model">
    <rect x="470" y="226" width="380" height="122" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="660" y="262" text-anchor="middle">Reference model · frozen</text>
    <text class="copy" x="660" y="296" text-anchor="middle">How likely are A and B</text>
    <text class="copy" x="660" y="325" text-anchor="middle">under the fixed weights?</text>
  </g>

  <!-- The loss receives likelihoods, not newly sampled responses. -->
  <g id="direct-preference-loss">
    <rect x="50" y="390" width="800" height="112" rx="13" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="label" x="450" y="425" text-anchor="middle">DPO loss · a penalty score</text>
    <text class="copy" x="450" y="457" text-anchor="middle">Encourage stronger preference for A relative to B,</text>
    <text class="copy" x="450" y="486" text-anchor="middle">compared with the reference model.</text>
  </g>
  <g id="assistant-weight-update">
    <rect x="180" y="544" width="540" height="78" rx="13" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="450" y="577" text-anchor="middle">Update only the assistant model</text>
    <text class="copy" x="450" y="606" text-anchor="middle">The reference weights stay fixed.</text>
  </g>

  <!-- All vertical shafts stop within their own triangle bases. -->
  <line class="connector" x1="240" y1="185" x2="240" y2="213"/>
  <polygon class="head" points="240,226 233,212 247,212"/>
  <line class="connector" x1="660" y1="185" x2="660" y2="213"/>
  <polygon class="head" points="660,226 653,212 667,212"/>
  <line class="connector" x1="240" y1="349" x2="240" y2="377"/>
  <polygon class="head" points="240,390 233,376 247,376"/>
  <line class="connector" x1="660" y1="349" x2="660" y2="377"/>
  <polygon class="head" points="660,390 653,376 667,376"/>
  <line class="connector" x1="450" y1="503" x2="450" y2="531"/>
  <polygon class="head" points="450,544 443,530 457,530"/>

  <!-- Distinguish scoring recorded text from sampling a new answer. -->
  <text class="note" x="450" y="659" text-anchor="middle">Both models evaluate the recorded answers; neither needs to generate them here.</text>
  <text class="note" x="450" y="686" text-anchor="middle">No separate reward model is trained in this update.</text>
</svg>
