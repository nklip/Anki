<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" aria-labelledby="title desc">
  <title id="title">One prompt, two answers, one preference</title>
  <desc id="desc">For the prompt Rewrite Send the file politely, answer A says Please send the file and answer B says Send the file now. A human selects A as the chosen answer and B as the rejected answer because A better meets the politeness request. This is a preference judgment, not a fact check.</desc>
  <!-- Match the series typography; green is chosen and orange is rejected. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .copy { font-size: 24px; }
      .note { font-size: 20px; text-anchor: middle; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="428" fill="#ffffff"/>

  <!-- The same prompt conditions both responses in the preference pair. -->
  <text class="title" x="28" y="44">One prompt, two answers, one preference</text>
  <text class="subtitle" x="28" y="78">A fictional example of a human preference label</text>
  <g id="shared-prompt">
    <rect x="28" y="102" width="844" height="84" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="50" y="134">PROMPT</text>
    <text class="copy" x="50" y="166">Rewrite “Send the file” politely.</text>
  </g>

  <!-- Chosen and rejected are relative labels for this request. -->
  <g id="chosen-response">
    <rect x="28" y="228" width="404" height="106" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="50" y="264">A · CHOSEN</text>
    <text class="copy" x="50" y="304">Please send the file.</text>
  </g>
  <g id="rejected-response">
    <rect x="468" y="228" width="404" height="106" rx="13" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="label" x="490" y="264">B · REJECTED</text>
    <text class="copy" x="490" y="304">Send the file now.</text>
  </g>

  <!-- Shafts stop within their heads; tips touch the response borders. -->
  <line class="connector" x1="230" y1="187" x2="230" y2="215"/>
  <polygon class="head" points="230,228 223,214 237,214"/>
  <line class="connector" x1="670" y1="187" x2="670" y2="215"/>
  <polygon class="head" points="670,228 663,214 677,214"/>

  <!-- State the criterion without claiming the chosen answer is perfect. -->
  <text class="note" x="450" y="374">The label says: A is preferred to B for this prompt.</text>
  <text class="note" x="450" y="405">Chosen here for politeness; this is not a fact check.</text>
</svg>
