<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="781.363636363636364" viewBox="0 0 1100 573" role="img" aria-labelledby="title desc">
  <title id="title">A character can span several bytes and tokens</title>
  <desc id="desc">The character é uses UTF-8 bytes 195 and 169. Byte-level BPE may retain two pieces or merge them if a learned rule exists. Byte values and token IDs are different kinds of numbers. Decode the entire sequence to recover the character.</desc>
  <!-- Typography and palette shared across the internals series. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1100" height="573" fill="#ffffff"/>
  <text x="32" y="46" font-size="30" font-weight="700" fill="#172033" text-anchor="start">A character can span several bytes and tokens</text>
  <text x="32" y="79" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">LOCATION  Inside the tokenizer: text → bytes → merged byte pieces → vocabulary IDs</text>
  <!-- The actual UTF-8 byte values for é are C3 A9, written in decimal below. -->
  <text x="32" y="130" font-size="22" font-weight="700" fill="#172033" text-anchor="start">BYTE · one value from 0 to 255</text>
  <rect x="32" y="160" width="200" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="132.0" y="198" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">é</text>
  <path data-connector="true" d="M247 189 L292.0 189.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="303,189 291.0,194.0 291.0,184.0" fill="#64748b"/>
  <rect x="324" y="160" width="215" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="431.5" y="198" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">195</text>
  <rect x="562" y="160" width="215" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="669.5" y="198" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">169</text>
  <text x="818" y="182" font-size="22" font-weight="400" fill="#172033" text-anchor="start">One character,</text>
  <text x="818" y="213" font-size="22" font-weight="400" fill="#172033" text-anchor="start">two UTF-8 bytes.</text>
  <text x="32" y="280" font-size="22" font-weight="700" fill="#2563eb" text-anchor="start">BYTE-LEVEL BPE · begin with all 256 byte values</text>
  <rect x="32" y="307" width="490" height="157" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="343" font-size="21" font-weight="700" fill="#172033" text-anchor="start">If the byte pair has no merge</text>
  <rect x="56" y="365" width="170" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="141.0" y="403" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">[195]</text>
  <rect x="247" y="365" width="170" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="332.0" y="403" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">[169]</text>
  <rect x="554" y="307" width="514" height="157" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="578" y="343" font-size="21" font-weight="700" fill="#172033" text-anchor="start">If the byte pair has a saved merge</text>
  <rect x="578" y="365" width="322" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="739.0" y="403" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">[195, 169]</text>
  <text x="56" y="449" font-size="19" font-weight="400" fill="#172033" text-anchor="start">Two pieces; neither is the full character.</text>
  <text x="578" y="449" font-size="19" font-weight="400" fill="#172033" text-anchor="start">One piece holding the full character.</text>
  <text x="32" y="510" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Byte values are not token IDs. Vocabulary lookup assigns an ID to each resulting byte sequence.</text>
  <text x="32" y="545" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Decode the whole sequence to reconstruct the character; one isolated token may be incomplete.</text>
</svg>
