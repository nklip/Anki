<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="729.545454545454545" viewBox="0 0 1100 535" role="img" aria-labelledby="title desc">
  <title id="title">Tokens spend the context budget</title>
  <desc id="desc">In a toy shared context budget of 1000 tokens, a 700-token input leaves 300 continuation tokens. An invented split of two cats exclamation mark has four pieces. Words and letters are not the token-count unit.</desc>
  <!-- Typography and palette shared across the internals series. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1100" height="535" fill="#ffffff"/>
  <text x="32" y="46" font-size="30" font-weight="700" fill="#172033" text-anchor="start">Tokens spend the context budget</text>
  <text x="32" y="79" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">LOCATION  Token count constrains the model input and the continuation it can process</text>
  <!-- All allocations are illustrative and sum to the labeled shared budget. -->
  <text x="32" y="132" font-size="23" font-weight="700" fill="#172033" text-anchor="start">CONTEXT LIMIT · the maximum working token sequence</text>
  <text x="32" y="170" font-size="22" font-weight="400" fill="#172033" text-anchor="start">Toy budget: 1,000 tokens shared by input and generated continuation</text>
  <rect x="32" y="213" width="1036" height="104" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="32" y="213" width="725.2" height="104" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="757.2" y="213" width="310.8" height="104" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="394" y="258" font-size="27" font-weight="600" fill="#172033" text-anchor="middle">Input · 700 tokens</text>
  <text x="394" y="292" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">Messages + structural markers</text>
  <text x="912" y="258" font-size="27" font-weight="600" fill="#172033" text-anchor="middle">Room: 300</text>
  <text x="912" y="292" font-size="20" font-weight="400" fill="#172033" text-anchor="middle">for continuation</text>
  <text x="32" y="373" font-size="22" font-weight="700" fill="#172033" text-anchor="start">TOKEN COUNT · count pieces, not words or letters</text>
  <rect x="32" y="399" width="250" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="157.0" y="437" font-size="26" font-weight="600" fill="#172033" text-anchor="middle">two cats!</text>
  <path data-connector="true" d="M302 428 L343.0 428.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="354,428 342.0,433.0 342.0,423.0" fill="#64748b"/>
  <rect x="375" y="399" width="352" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="551.0" y="437" font-size="23" font-weight="600" fill="#172033" text-anchor="middle">two | [space]cat | s | !</text>
  <path data-connector="true" d="M747 428 L788.0 428.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="799,428 787.0,433.0 787.0,423.0" fill="#64748b"/>
  <rect x="821" y="399" width="247" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="944.5" y="437" font-size="26" font-weight="600" fill="#172033" text-anchor="middle">4 tokens</text>
  <text x="32" y="505" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Changing language, spaces, or punctuation can change the split. Count with the model’s tokenizer.</text>
</svg>
