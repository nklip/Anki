<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1100 594" role="img" aria-labelledby="title desc">
  <title id="title">BPE learns frequent pairs, then reuses the merges</title>
  <desc id="desc">A toy corpus has hug three times and pug twice. The pair u plus g occurs five times and merges. Applying saved merge rules later does not retrain the tokenizer. Subwords are reusable pieces, not necessarily grammatical parts.</desc>
  <!-- Typography and palette shared across the internals series. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1100" height="594" fill="#ffffff"/>
  <text x="32" y="46" font-size="30" font-weight="700" fill="#172033" text-anchor="start">BPE learns frequent pairs, then reuses the merges</text>
  <text x="32" y="79" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">LOCATION  Tokenizer preparation → saved vocabulary and merge rules → text splitting</text>
  <!-- Frequency is measured across the tiny training corpus. -->
  <text x="32" y="129" font-size="23" font-weight="700" fill="#172033" text-anchor="start">1  Count neighboring pairs</text>
  <rect x="32" y="160" width="270" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="167.0" y="198" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">h | u | g</text>
  <text x="327" y="197" font-size="25" font-weight="600" fill="#172033" text-anchor="start">× 3</text>
  <rect x="32" y="235" width="270" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="167.0" y="273" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">p | u | g</text>
  <text x="327" y="272" font-size="25" font-weight="600" fill="#172033" text-anchor="start">× 2</text>
  <path data-connector="true" d="M401 226 L449.0 226.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,226 448.0,231.0 448.0,221.0" fill="#64748b"/>
  <rect x="479" y="145" width="254" height="177" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="502" y="181" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Pair counts</text>
  <text x="502" y="216" font-size="22" font-weight="400" fill="#172033" text-anchor="start">h + u : 3</text>
  <text x="502" y="252" font-size="22" font-weight="400" fill="#172033" text-anchor="start">p + u : 2</text>
  <text x="502" y="288" font-size="22" font-weight="600" fill="#2563eb" text-anchor="start">u + g : 5  ← most</text>
  <path data-connector="true" d="M751 226 L789.0 226.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="800,226 788.0,231.0 788.0,221.0" fill="#64748b"/>
  <rect x="820" y="145" width="248" height="177" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="845" y="181" font-size="22" font-weight="700" fill="#172033" text-anchor="start">2  Merge u + g</text>
  <text x="845" y="234" font-size="26" font-weight="400" fill="#172033" text-anchor="start">h | ug   × 3</text>
  <text x="845" y="284" font-size="26" font-weight="400" fill="#172033" text-anchor="start">p | ug   × 2</text>
  <!-- New messages use the already learned ranked merges. -->
  <rect x="32" y="365" width="1036" height="166" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="404" font-size="22" font-weight="700" fill="#172033" text-anchor="start">3  Use the saved merges</text>
  <text x="56" y="443" font-size="25" font-weight="400" fill="#172033" text-anchor="start">New text:  h | u | g</text>
  <path data-connector="true" d="M328 435 L387.0 435.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="398,435 386.0,440.0 386.0,430.0" fill="#64748b"/>
  <text x="422" y="443" font-size="27" font-weight="600" fill="#2563eb" text-anchor="start">h | ug</text>
  <text x="56" y="495" font-size="20" font-weight="400" fill="#172033" text-anchor="start">The learned subword “ug” is a reusable piece; it need not be a meaningful word part.</text>
  <text x="32" y="568" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">BPE = byte-pair encoding. This character-based toy teaches the merge rule; byte-level BPE starts from bytes.</text>
</svg>
