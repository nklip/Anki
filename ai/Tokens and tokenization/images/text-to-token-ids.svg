<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="919.090909090909091" viewBox="0 0 1100 674" role="img" aria-labelledby="title desc">
  <title id="title">Text becomes an ordered sequence of token IDs</title>
  <desc id="desc">The tokenizer splits two cats into four invented pieces. The vocabulary maps each piece to an ID. Decoding with the same vocabulary reverses the lookup. Token, vocabulary, ID and decoding each have a labeled panel.</desc>
  <!-- Typography and palette shared across the internals series. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1100" height="674" fill="#ffffff"/>
  <text x="32" y="46" font-size="30" font-weight="700" fill="#172033" text-anchor="start">Text becomes an ordered sequence of token IDs</text>
  <text x="32" y="79" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">LOCATION  Text → tokenizer → IDs → model; chosen IDs → tokenizer decoder → text</text>
  <!-- Tokenizer produces a sequence; the vocabulary supplies labels, not magnitudes. -->
  <text x="32" y="125" font-size="19" font-weight="700" fill="#2563eb" text-anchor="start">TOKENIZER · the program that splits and looks up</text>
  <rect x="32" y="151" width="210" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="137.0" y="189" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">two cats!</text>
  <path data-connector="true" d="M252 180 L289.0 180.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="300,180 288.0,185.0 288.0,175.0" fill="#64748b"/>
  <rect x="310" y="138" width="758" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="332" y="154" width="157" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410.5" y="192" font-size="23" font-weight="600" fill="#172033" text-anchor="middle">two</text>
  <rect x="511" y="154" width="157" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="589.5" y="192" font-size="23" font-weight="600" fill="#172033" text-anchor="middle">[space]cat</text>
  <rect x="690" y="154" width="157" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="768.5" y="192" font-size="23" font-weight="600" fill="#172033" text-anchor="middle">s</text>
  <rect x="869" y="154" width="157" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="947.5" y="192" font-size="23" font-weight="600" fill="#172033" text-anchor="middle">!</text>
  <text x="32" y="266" font-size="19" font-weight="700" fill="#172033" text-anchor="start">TOKEN · one piece</text>
  <text x="32" y="299" font-size="21" font-weight="400" fill="#172033" text-anchor="start">A piece can be a word,</text>
  <text x="32" y="328" font-size="21" font-weight="400" fill="#172033" text-anchor="start">part of a word, or punctuation.</text>
  <text x="360" y="266" font-size="19" font-weight="700" fill="#172033" text-anchor="start">VOCABULARY · piece → ID table</text>
  <rect x="360" y="287" width="300" height="37" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="377" y="313" font-size="21" font-weight="400" fill="#172033" text-anchor="start">two</text>
  <text x="615" y="313" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">8</text>
  <rect x="360" y="329" width="300" height="37" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="377" y="355" font-size="21" font-weight="400" fill="#172033" text-anchor="start">[space]cat</text>
  <text x="615" y="355" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">17</text>
  <rect x="360" y="371" width="300" height="37" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="377" y="397" font-size="21" font-weight="400" fill="#172033" text-anchor="start">s</text>
  <text x="615" y="397" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">4</text>
  <rect x="360" y="413" width="300" height="37" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="377" y="439" font-size="21" font-weight="400" fill="#172033" text-anchor="start">!</text>
  <text x="615" y="439" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">9</text>
  <text x="710" y="266" font-size="19" font-weight="700" fill="#172033" text-anchor="start">TOKEN ID · a vocabulary label</text>
  <rect x="710" y="292" width="358" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="889.0" y="330" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[8, 17, 4, 9]</text>
  <text x="710" y="385" font-size="20" font-weight="400" fill="#172033" text-anchor="start">17 does not mean “more” than 8.</text>
  <!-- Reverse lookup reconstructs the original space in this invented example. -->
  <rect x="32" y="487" width="1036" height="126" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="521" font-size="19" font-weight="700" fill="#2563eb" text-anchor="start">DECODING · IDs back to text</text>
  <rect x="56" y="538" width="288" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="200.0" y="576" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[8, 17, 4, 9]</text>
  <path data-connector="true" d="M361 567 L417.0 567.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="428,567 416.0,572.0 416.0,562.0" fill="#64748b"/>
  <text x="459" y="575" font-size="25" font-weight="400" fill="#172033" text-anchor="start">two + [space]cat + s + !</text>
  <path data-connector="true" d="M778 567 L827.0 567.0" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="838,567 826.0,572.0 826.0,562.0" fill="#64748b"/>
  <text x="860" y="576" font-size="27" font-weight="600" fill="#172033" text-anchor="start">two cats!</text>
  <text x="32" y="649" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Toy pieces and IDs. [space] shows one real space; a real tokenizer can split this text differently.</text>
</svg>
