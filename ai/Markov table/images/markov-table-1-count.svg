<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
  <title id="title">Count the word immediately after each state</title>
  <desc id="desc">Three separate training sentences are i like tea, i like coffee, and you like tea, each with start and end markers. Counting the next word after like gives tea twice and coffee once, for three outgoing transitions.</desc>
  <!-- Shared type and colors: blue marks the selected row or tea; orange marks coffee. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #475569; }
      .value { font-size: 27px; font-weight: 700; }
      .mono { font-family: monospace; font-size: 21px; }
      .blue { font-size: 22px; font-weight: 700; fill: #1d4ed8; }
      .orange { font-size: 22px; font-weight: 700; fill: #9a3412; }
    </style>
  </defs>
  <!-- Canvas and shared heading. -->
  <rect width="1000" height="405" fill="#f8fafc"/>
  <text x="32" y="47" class="title" text-anchor="start">Count the word immediately after each state</text>
  <text x="32" y="80" class="small" text-anchor="start">Step 1 • three training sentences; focus on the current word “like”</text>
  <!-- Keep sentence boundaries visible; do not join the end of one sentence to the next. -->
<g id="training-sentences">
<rect x="32" y="113" width="448" height="222" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="151" class="heading" text-anchor="start">Training sentences</text>
<text x="56" y="200" class="mono" text-anchor="start">&lt;s&gt; i like tea &lt;/s&gt;</text>
<text x="56" y="246" class="mono" text-anchor="start">&lt;s&gt; i like coffee &lt;/s&gt;</text>
<text x="56" y="292" class="mono" text-anchor="start">&lt;s&gt; you like tea &lt;/s&gt;</text>
<text x="44" y="373" class="small" text-anchor="start">&lt;s&gt; = start; &lt;/s&gt; = end of one sentence</text>
</g>
<!-- count-neighbors: shaft ends under the head base; tip stays in the routing gap. -->
<path id="count-neighbors-arrow" d="M497 225 H530" fill="none" stroke="#64748b" stroke-width="2.5"/>
<path id="count-neighbors-head" d="M528 218 L542 225 L528 232 Z" fill="#64748b"/>
<!-- A compact frequency table shows raw counts, not probabilities. -->
<g id="like-counts">
<rect x="558" y="113" width="410" height="222" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="582" y="151" class="heading" text-anchor="start">Counts for the “like” row</text>
<text x="582" y="196" class="small" text-anchor="start">Next word</text>
<text x="920" y="196" class="small" text-anchor="end">Count</text>
<text x="582" y="237" class="blue" text-anchor="start">tea</text>
<text x="920" y="237" class="value" text-anchor="end">2</text>
<text x="582" y="278" class="orange" text-anchor="start">coffee</text>
<text x="920" y="278" class="value" text-anchor="end">1</text>
<text x="582" y="315" class="small" text-anchor="start">Total outgoing transitions = 3</text>
<text x="570" y="373" class="small" text-anchor="start">Count each occurrence, including repeats.</text>
</g>
</svg>
