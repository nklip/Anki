<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="533" viewBox="0 0 1000 533" role="img" aria-labelledby="title desc">
  <title id="title">Sample a next word, then use its row</title>
  <desc id="desc">A uniform draw from zero inclusive to one exclusive falls in the tea interval below two thirds or the coffee interval above it. The example draw 0.80 selects coffee. One possible complete path is start, you, like, coffee, end, producing you like coffee even though that whole sentence was absent from training.</desc>
  <!-- Shared type and colors: blue marks the selected row or tea; orange marks coffee. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #475569; }
      .value { font-size: 27px; font-weight: 700; }
      .mono { font-family: monospace; font-size: 21px; }
      .blue { font-size: 22px; font-weight: 700; fill: #1d4ed8; }
      .orange { font-size: 22px; font-weight: 700; fill: #9a3412; }
    </style>
  </defs>
  <!-- Canvas and shared heading. -->
  <rect width="1000" height="533" fill="#f8fafc"/>
  <text x="32" y="47" class="title" text-anchor="start">Sample a next word, then use its row</text>
  <text x="32" y="80" class="small" text-anchor="start">Step 3 • current state = “like”; a random draw chooses one next word</text>
  <!-- Widths implement two thirds versus one third on a common zero-to-one scale. -->
<g id="weighted-choice">
<text x="42" y="131" class="body" text-anchor="start">Draw uniformly: 0 ≤ draw &lt; 1</text>
<rect x="40" y="150" width="560" height="58" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<rect x="600" y="150" width="280" height="58" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="320" y="188" class="body" text-anchor="middle">tea: probability 2/3</text>
<text x="740" y="188" class="body" text-anchor="middle">coffee: probability 1/3</text>
<text x="40" y="240" class="small" text-anchor="start">0</text>
<text x="600" y="240" class="small" text-anchor="middle">2/3</text>
<text x="880" y="240" class="small" text-anchor="middle">1</text>
<!-- The sample pointer stops just above its interval; its head does not enter the bar. -->
<path id="sample-arrow" d="M712 113 V133" fill="none" stroke="#9a3412" stroke-width="2.5"/>
<path id="sample-head" d="M705 131 L712 145 L719 131 Z" fill="#9a3412"/>
<text x="739" y="114" class="small" text-anchor="start">draw = 0.80</text>
<text x="42" y="280" class="body" text-anchor="start">0 ≤ draw &lt; 2/3 selects tea; 2/3 ≤ draw &lt; 1 selects coffee.</text>
</g>
<!-- The trajectory is one possible draw sequence, not the only output. -->
<g id="complete-sample-path">
<text x="42" y="328" class="heading" text-anchor="start">One possible path from start to end</text>
<rect x="40" y="349" width="132" height="59" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="106" y="387" class="mono" text-anchor="middle">&lt;s&gt;</text>
<!-- start-to-you: shaft ends under the head base; tip stays in the routing gap. -->
<path id="start-to-you-arrow" d="M185 379 H203" fill="none" stroke="#64748b" stroke-width="2.5"/>
<path id="start-to-you-head" d="M201 372 L215 379 L201 386 Z" fill="#64748b"/>
<rect x="228" y="349" width="132" height="59" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="294" y="387" class="heading" text-anchor="middle">you</text>
<!-- you-to-like: shaft ends under the head base; tip stays in the routing gap. -->
<path id="you-to-like-arrow" d="M373 379 H391" fill="none" stroke="#64748b" stroke-width="2.5"/>
<path id="you-to-like-head" d="M389 372 L403 379 L389 386 Z" fill="#64748b"/>
<rect x="416" y="349" width="132" height="59" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="482" y="387" class="heading" text-anchor="middle">like</text>
<!-- like-to-coffee: shaft ends under the head base; tip stays in the routing gap. -->
<path id="like-to-coffee-arrow" d="M561 379 H579" fill="none" stroke="#64748b" stroke-width="2.5"/>
<path id="like-to-coffee-head" d="M577 372 L591 379 L577 386 Z" fill="#64748b"/>
<rect x="604" y="349" width="154" height="59" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="681" y="387" class="heading" text-anchor="middle">coffee</text>
<!-- coffee-to-end: shaft ends under the head base; tip stays in the routing gap. -->
<path id="coffee-to-end-arrow" d="M771 379 H789" fill="none" stroke="#64748b" stroke-width="2.5"/>
<path id="coffee-to-end-head" d="M787 372 L801 379 L787 386 Z" fill="#64748b"/>
<rect x="814" y="349" width="144" height="59" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="886" y="387" class="mono" text-anchor="middle">&lt;/s&gt;</text>
<text x="42" y="455" class="heading" text-anchor="start">Output: you like coffee</text>
<text x="42" y="493" class="small" text-anchor="start">After “coffee”, its row selects &lt;/s&gt; with probability 1. Generation stops.</text>
</g>
</svg>
