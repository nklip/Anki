<svg xmlns="http://www.w3.org/2000/svg" width="900" height="576" viewBox="0 0 900 576" role="img" aria-labelledby="title desc">
  <title id="title">More probability on the target means less loss</title>
  <desc id="desc">For the same input The and target cat, prediction A assigns 20 percent to cat and 80 percent to all other tokens. Prediction B assigns 60 percent to cat and 40 percent to all other tokens. B has lower cross-entropy loss on this target. Each full bar represents 100 probability points. These are invented comparisons, not a guaranteed training trajectory.</desc>
  <!-- Orange marks the observed target, matching the input-target diagram. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #475569; }
      .label { font-size: 23px; font-weight: 700; }
      .copy { font-size: 20px; }
      .small { font-size: 18px; fill: #475569; }
      .bar-label { font-size: 20px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="576" fill="#ffffff"/>

  <!-- Fix both input and target so only the probability assignments differ. -->
  <text class="title" x="28" y="44">More probability on the target means less loss</text>
  <text class="subtitle" x="28" y="77">Input: “The”   •   Observed next token: “cat”</text>

  <!-- A: 20% of the 804-unit bar is exactly 160.8 units; remainder is 643.2. -->
  <g id="prediction-a">
    <rect x="24" y="106" width="852" height="148" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="48" y="143">Prediction A</text>
    <text class="label" x="852" y="143" text-anchor="end">Higher loss</text>
    <rect id="a-target" x="48" y="165" width="160.8" height="58" fill="#fed7aa"/>
    <rect id="a-other" x="208.8" y="165" width="643.2" height="58" fill="#e2e8f0"/>
    <rect x="48" y="165" width="804" height="58" fill="none" stroke="#94a3b8"/>
    <text class="bar-label" x="128.4" y="201">cat: 20%</text>
    <text class="bar-label" x="530.4" y="201">All other tokens: 80%</text>
  </g>

  <!-- B: 60% of the same bar length is 482.4 units; remainder is 321.6. -->
  <g id="prediction-b">
    <rect x="24" y="274" width="852" height="148" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="48" y="311">Prediction B</text>
    <text class="label" x="852" y="311" text-anchor="end">Lower loss</text>
    <rect id="b-target" x="48" y="333" width="482.4" height="58" fill="#fed7aa"/>
    <rect id="b-other" x="530.4" y="333" width="321.6" height="58" fill="#e2e8f0"/>
    <rect x="48" y="333" width="804" height="58" fill="none" stroke="#94a3b8"/>
    <text class="bar-label" x="289.2" y="369">cat: 60%</text>
    <text class="bar-label" x="691.2" y="369">All other tokens: 40%</text>
  </g>

  <!-- Explain percentages without requiring probability notation or logarithms. -->
  <text class="copy" x="48" y="459">Each whole bar = 100 probability points.</text>
  <text class="copy" x="48" y="490">20% gives cat 20 points; 60% gives cat 60 points.</text>
  <text class="copy" x="48" y="521">All other tokens share the remaining points.</text>
  <text class="small" x="48" y="553">Made-up examples, not a guaranteed change after one training update.</text>
</svg>
