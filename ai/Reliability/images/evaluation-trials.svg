<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="886.364" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Trial scores and repeatable evaluation</title>
<desc id="desc">Ten illustrative trials show eight passes and two failures. Eight divided by ten is 80 percent for this sample only. An observed failure becomes a repeatable test, followed by checks after changes and monitoring of real outcomes.</desc>
<!-- Source-native artwork. Uniform scaling preserves the 1500 px landscape canvas. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif;}</style></defs>
<rect width="1100" height="650" fill="#ffffff"/>
<text x="30" y="44" font-size="28" font-weight="700" text-anchor="start" fill="#172033">A trial score describes the tested attempts</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Use the same task and checks, resetting the test environment before every attempt.</text>
<!-- Trial results; preserve text and arrow clearance. -->
<g id="trial-results">
<text x="30" y="131" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Ten invented trials</text>
</g>
<rect x="30" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="73" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">1</text>
<text x="73" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="136" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="179" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">2</text>
<text x="179" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="242" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="285" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">3</text>
<text x="285" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="348" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="391" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">4</text>
<text x="391" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="454" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="497" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">5</text>
<text x="497" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="560" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="603" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">6</text>
<text x="603" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="666" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="709" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">7</text>
<text x="709" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="772" y="159" width="86" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="815" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">8</text>
<text x="815" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#2563eb">pass</text>
<rect x="878" y="159" width="86" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="921" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">9</text>
<text x="921" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#64748b">fail</text>
<rect x="984" y="159" width="86" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1027" y="193" font-size="20" font-weight="700" text-anchor="middle" fill="#172033">10</text>
<text x="1027" y="231" font-size="21" font-weight="700" text-anchor="middle" fill="#64748b">fail</text>
<!-- Observed score; preserve text and arrow clearance. -->
<g id="observed-score">
<rect x="30" y="302" width="1040" height="99" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="341" font-size="27" font-weight="700" text-anchor="start" fill="#172033">8 passes ÷ 10 attempts = 0.8 = 80% observed success</text>
<text x="50" y="376" font-size="21" font-weight="400" text-anchor="start" fill="#172033">This sample does not establish an 80% success rate on every future task.</text>
</g>
<!-- Repeat and monitor; preserve text and arrow clearance. -->
<g id="repeat-and-monitor">
<text x="30" y="453" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Use failures to improve the checks</text>
<rect x="30" y="483" width="300" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="520" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Observed failure</text>
<text x="50" y="557" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A retry after a lost reply</text>
<text x="50" y="587" font-size="20" font-weight="400" text-anchor="start" fill="#172033">created a duplicate.</text>
<rect x="390" y="483" width="300" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="410" y="520" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Repeatable test</text>
<text x="410" y="557" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Simulate that failure</text>
<text x="410" y="587" font-size="20" font-weight="400" text-anchor="start" fill="#172033">on a reset test copy.</text>
<rect x="750" y="483" width="320" height="126" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="770" y="520" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Test and monitor</text>
<text x="770" y="557" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Rerun after changes;</text>
<text x="770" y="587" font-size="20" font-weight="400" text-anchor="start" fill="#172033">check real outcomes too.</text>
<path data-connector="true" d="M 330,548 L 379,548" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="390,548 378,554 378,542" fill="#64748b"/>
<path data-connector="true" d="M 690,548 L 739,548" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="750,548 738,554 738,542" fill="#64748b"/>
</g>
</svg>
