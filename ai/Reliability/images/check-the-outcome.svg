<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
  <title id="title">Grade the saved outcome, not the success message</title>
  <desc id="desc">Reset a test copy of the lists before each trial. No task initially has the title Check opening hours. Run the agent to add that task once to Website. The run produces two kinds of evidence: a trace recording calls and replies, and the actual saved lists. The trace helps explain behavior. For this task, independent code grades the saved lists: exactly one new task has the target title in Website, and nothing else was added, changed, or removed.</desc>
  <!-- Original simplified teaching diagram inspired by Anthropic's separation of trial trajectory and final environment outcome; not a reproduction.
       Source: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
       Figure: https://www-cdn.anthropic.com/images/4zrzovbb/website/0205b36f9639fc27f2f6566f73cb56b06f59d555-4584x2580.png -->
  <!-- Shared series typography and semantic colors; no external artwork is embedded. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="630" fill="#ffffff"/>
  <!-- The task stays concrete while the two outputs separate evidence from claims. -->
  <text class="title" x="28" y="43">Grade the saved outcome, not the success message</text>
  <text class="subtitle" x="28" y="76">Task: add “Check opening hours” once to Website; preserve everything else.</text>
  <!-- Starting state is restored for each trial, so attempts can be compared. -->
  <g id="initial-test-copy">
    <rect x="28" y="195" width="300" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="178" y="232" text-anchor="middle">Test lists</text>
    <text class="body" x="178" y="274" text-anchor="middle">No task has the target title.</text>
    <text class="note" x="178" y="316" text-anchor="middle">Reset before each trial.</text>
  </g>
  <!-- The whole agent run produces both a record and a resulting environment state. -->
  <g id="agent-run">
    <rect x="386" y="195" width="300" height="150" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="536" y="232" text-anchor="middle">Run the agent</text>
    <text class="body" x="536" y="274" text-anchor="middle">Try to create one task</text>
    <text class="body" x="536" y="307" text-anchor="middle">in Website.</text>
  </g>
  <!-- Trace output is diagnostic; it does not feed this task's state-based grader. -->
  <g id="trace-output">
    <rect x="758" y="112" width="314" height="132" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="915" y="149" text-anchor="middle">Trace: run record</text>
    <text class="body" x="915" y="187" text-anchor="middle">Calls, tool replies, “Done”</text>
    <text class="note" x="915" y="222" text-anchor="middle">Helps explain what happened.</text>
  </g>
  <!-- Outcome output records actual stored data, independently of the agent's claims. -->
  <g id="actual-saved-state">
    <rect x="758" y="282" width="314" height="132" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="label" x="915" y="319" text-anchor="middle">Outcome: saved lists</text>
    <text class="body" x="915" y="357" text-anchor="middle">Actual state after the run</text>
    <text class="note" x="915" y="392" text-anchor="middle">Compare with starting copy.</text>
  </g>
  <!-- Shafts end under triangle bases; tips meet target borders without entering boxes. -->
  <g id="test-copy-to-run">
    <line class="connector" x1="329" y1="270" x2="374" y2="270"/>
    <polygon class="head" points="386,270 373,264 373,276"/>
  </g>
  <!-- Separate routes make the two outputs parallel; there is no trace-to-outcome arrow. -->
  <g id="run-to-trace">
    <path class="connector" d="M 687 225 H 722 V 178 H 746"/>
    <polygon class="head" points="758,178 745,172 745,184"/>
  </g>
  <g id="run-to-saved-state">
    <path class="connector" d="M 687 315 H 722 V 348 H 746"/>
    <polygon class="head" points="758,348 745,342 745,354"/>
  </g>
  <!-- For this task, code grades the saved outcome rather than trusting a success reply. -->
  <g id="independent-grader">
    <rect x="28" y="456" width="1044" height="132" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="550" y="492" text-anchor="middle">Independent code checks the saved outcome</text>
    <text class="body" x="550" y="529" text-anchor="middle">Website has exactly one new “Check opening hours” task.</text>
    <text class="body" x="550" y="563" text-anchor="middle">Nothing else was added, changed, or removed.</text>
  </g>
  <!-- Only the saved-state branch feeds this task's success checks. -->
  <g id="saved-state-to-grader">
    <line class="connector" x1="915" y1="415" x2="915" y2="444"/>
    <polygon class="head" points="915,456 909,443 921,443"/>
  </g>
  <text class="note" x="550" y="619" text-anchor="middle">Pass only if every required check holds. A completion message alone cannot pass.</text>
</svg>
