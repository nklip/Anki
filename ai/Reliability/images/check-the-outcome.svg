<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="886.364" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Evaluation, trial, outcome, grader, and external verification</title>
<desc id="desc">One test task starts from a reset state, runs one trial, and produces saved lists. An independent code grader checks exactly one requested addition and no other changes. The model saying Done is not itself proof.</desc>
<!-- Source-native artwork. Uniform scaling preserves the 1500 px landscape canvas. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif;}</style></defs>
<rect width="1100" height="650" fill="#ffffff"/>
<text x="30" y="44" font-size="28" font-weight="700" text-anchor="start" fill="#172033">An evaluation checks the result against a defined task</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Eval = give the agent a test task, run it, and score the required outcome.</text>
<!-- Task and starting state; preserve text and arrow clearance. -->
<g id="task-and-starting-state">
<rect x="30" y="119" width="300" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="158" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Task + starting state</text>
<text x="50" y="198" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Create “Check opening hours”</text>
<text x="50" y="230" font-size="19" font-weight="400" text-anchor="start" fill="#172033">once in the Website list.</text>
<text x="50" y="262" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Preserve everything else.</text>
<text x="50" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">Initially: no task has that title.</text>
</g>
<!-- Trial; preserve text and arrow clearance. -->
<g id="trial">
<rect x="390" y="119" width="270" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="410" y="158" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Trial: one attempt</text>
<text x="410" y="198" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Run the agent on a</text>
<text x="410" y="230" font-size="19" font-weight="400" text-anchor="start" fill="#172033">reset test copy.</text>
<text x="410" y="262" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Tools may change the lists.</text>
</g>
<!-- Outcome; preserve text and arrow clearance. -->
<g id="outcome">
<rect x="720" y="119" width="350" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="740" y="158" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Outcome: saved state</text>
<text x="740" y="198" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Inspect the actual lists</text>
<text x="740" y="230" font-size="21" font-weight="400" text-anchor="start" fill="#172033">after the run finishes.</text>
<text x="740" y="262" font-size="21" font-weight="400" text-anchor="start" fill="#172033">“Done” is only a claim.</text>
</g>
<!-- Task to outcome flow; preserve text and arrow clearance. -->
<g id="task-to-outcome-flow">
<path data-connector="true" d="M 330,225 L 379,225" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="390,225 378,231 378,219" fill="#64748b"/>
<path data-connector="true" d="M 660,225 L 709,225" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="720,225 708,231 708,219" fill="#64748b"/>
</g>
<!-- Grader; preserve text and arrow clearance. -->
<g id="grader">
<rect x="30" y="365" width="1040" height="174" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="404" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Grader: code that applies the success checks in this example</text>
<text x="50" y="446" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Exactly one task was added: in Website, with the requested title.</text>
<text x="50" y="479" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Existing tasks and every other list match the starting copy.</text>
<text x="50" y="512" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Pass only if both checks hold. A grader can check multiple conditions.</text>
<path data-connector="true" d="M 895,309 L 895,354" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="895,365 889,353 901,353" fill="#64748b"/>
</g>
<!-- External verification; preserve text and arrow clearance. -->
<g id="external-verification">
<text x="30" y="588" font-size="22" font-weight="700" text-anchor="start" fill="#172033">External verification = evidence beyond the model’s own completion message.</text>
<text x="30" y="622" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Here, independent code checks saved data. A human is not required to perform the check.</text>
</g>
</svg>
