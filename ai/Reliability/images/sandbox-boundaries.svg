<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="893.182" viewBox="0 0 1100 655" role="img" aria-labelledby="title desc">
<title id="title">Sandbox filesystem and network boundaries</title>
<desc id="desc">A sandboxed tool process is constrained by filesystem and network restrictions, including its child programs. Allowed project access and approved network destinations differ from denied private files and outside destinations. Outcome checking remains necessary.</desc>
<!-- Source-native artwork. Uniform scaling preserves the 1500 px landscape canvas. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif;}</style></defs>
<rect width="1100" height="655" fill="#ffffff"/>
<text x="30" y="44" font-size="28" font-weight="700" text-anchor="start" fill="#172033">A sandbox limits where a program can act</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Sandbox = an enforced execution environment with restricted access to files, network, or other resources.</text>
<!-- Sandboxed tool; preserve text and arrow clearance. -->
<g id="sandboxed-tool">
<rect x="30" y="151" width="300" height="256" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="193" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Tool process</text>
<text x="50" y="239" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Runs inside configured</text>
<text x="50" y="275" font-size="21" font-weight="400" text-anchor="start" fill="#172033">operating-system limits.</text>
<text x="50" y="311" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Child programs must stay</text>
<text x="50" y="347" font-size="21" font-weight="400" text-anchor="start" fill="#172033">inside those limits too.</text>
</g>
<!-- File boundary; preserve text and arrow clearance. -->
<g id="file-boundary">
<rect x="435" y="118" width="635" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="455" y="158" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Filesystem boundary</text>
<text x="455" y="202" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Allow: read and write this project directory.</text>
<text x="455" y="238" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Deny: access to unrelated private files.</text>
</g>
<!-- Network boundary; preserve text and arrow clearance. -->
<g id="network-boundary">
<rect x="435" y="320" width="635" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="455" y="360" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Network boundary</text>
<text x="455" y="404" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Allow: connect to approved service destinations.</text>
<text x="455" y="440" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Deny: connections outside the configured scope.</text>
</g>
<!-- Sandbox routes; preserve text and arrow clearance. -->
<g id="sandbox-routes">
<path data-connector="true" d="M 330,205 L 380,205 L 380,194 L 424,194" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="435,194 423,200 423,188" fill="#64748b"/>
<path data-connector="true" d="M 330,355 L 380,355 L 380,396 L 424,396" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="435,396 423,402 423,390" fill="#64748b"/>
</g>
<!-- Sandbox limit; preserve text and arrow clearance. -->
<g id="sandbox-limit">
<rect x="30" y="520" width="1040" height="102" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="558" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Access limits reduce what a faulty or manipulated tool can affect.</text>
<text x="50" y="597" font-size="21" font-weight="400" text-anchor="start" fill="#172033">They do not verify the task result. A wrong edit inside an allowed directory is still possible.</text>
</g>
</svg>
