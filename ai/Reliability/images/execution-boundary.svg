<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="879.545" viewBox="0 0 1100 645" role="img" aria-labelledby="title desc">
<title id="title">Execution permission checks operation and target</title>
<desc id="desc">A runtime and service enforce whether the model-proposed operation and target are allowed. Creating in Website is allowed, deleting in Website is denied, and creating in Personal is denied. Allowed actions can still be wrong.</desc>
<!-- Source-native artwork. Uniform scaling preserves the 1500 px landscape canvas. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif;}</style></defs>
<rect width="1100" height="645" fill="#ffffff"/>
<text x="30" y="44" font-size="28" font-weight="700" text-anchor="start" fill="#172033">An execution boundary checks operation and target</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Permission = which actions software is allowed to perform, on which resources.</text>
<!-- Proposed call; preserve text and arrow clearance. -->
<g id="proposed-call">
<rect x="30" y="134" width="290" height="184" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="174" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model proposes</text>
<text x="50" y="217" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Operation: create task</text>
<text x="50" y="249" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Target: Website</text>
<text x="50" y="281" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Title: Check opening hours</text>
</g>
<!-- Permission check; preserve text and arrow clearance. -->
<g id="permission-check">
<rect x="405" y="134" width="340" height="184" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="425" y="174" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Runtime + service checks</text>
<text x="425" y="217" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Is create permitted?</text>
<text x="425" y="249" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Is Website permitted?</text>
<text x="425" y="281" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Both must be allowed.</text>
</g>
<!-- Allowed call; preserve text and arrow clearance. -->
<g id="allowed-call">
<rect x="830" y="134" width="240" height="184" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="850" y="174" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Execute only if</text>
<text x="850" y="217" font-size="21" font-weight="400" text-anchor="start" fill="#172033">checks pass.</text>
<text x="850" y="249" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Otherwise return</text>
<text x="850" y="281" font-size="21" font-weight="400" text-anchor="start" fill="#172033">a denial result.</text>
</g>
<!-- Permission flow; preserve text and arrow clearance. -->
<g id="permission-flow">
<path data-connector="true" d="M 320,230 L 394,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="405,230 393,236 393,224" fill="#64748b"/>
<path data-connector="true" d="M 745,230 L 819,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="830,230 818,236 818,224" fill="#64748b"/>
</g>
<!-- Permission examples; preserve text and arrow clearance. -->
<g id="permission-examples">
<text x="30" y="373" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Example grant: read or create in Website only</text>
</g>
<rect x="30" y="402" width="1040" height="45" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="432" font-size="21" font-weight="700" text-anchor="start" fill="#172033">create</text>
<text x="305" y="432" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Website</text>
<text x="610" y="432" font-size="21" font-weight="700" text-anchor="start" fill="#2563eb">Allowed</text>
<rect x="30" y="457" width="1040" height="45" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="487" font-size="21" font-weight="700" text-anchor="start" fill="#172033">delete</text>
<text x="305" y="487" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Website</text>
<text x="610" y="487" font-size="21" font-weight="700" text-anchor="start" fill="#64748b">Denied: operation</text>
<rect x="30" y="512" width="1040" height="45" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="542" font-size="21" font-weight="700" text-anchor="start" fill="#172033">create</text>
<text x="305" y="542" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Personal</text>
<text x="610" y="542" font-size="21" font-weight="700" text-anchor="start" fill="#64748b">Denied: target</text>
<text x="30" y="611" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">An allowed duplicate task would still fail the user’s request. Permission and correctness are separate.</text>
</svg>
