<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="906.818" viewBox="0 0 1100 665" role="img" aria-labelledby="title desc">
<title id="title">Timeout, retry, side effect, and idempotence</title>
<desc id="desc">A service creates a task but its response is lost. The caller times out. Under a service-supported idempotency contract, retrying the same caller request A7 with the same inputs returns the prior outcome and leaves one task.</desc>
<!-- Source-native artwork. Uniform scaling preserves the 1500 px landscape canvas. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif;}</style></defs>
<rect width="1100" height="665" fill="#ffffff"/>
<text x="30" y="44" font-size="28" font-weight="700" text-anchor="start" fill="#172033">A timeout can hide a completed side effect</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Side effect = a change outside the model. Retry = repeat a request. Timeout = stop waiting.</text>
<!-- First attempt; preserve text and arrow clearance. -->
<g id="first-attempt">
<text x="30" y="130" font-size="25" font-weight="700" text-anchor="start" fill="#172033">First attempt: the reply is lost</text>
<rect x="30" y="160" width="290" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="200" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Runtime sends create</text>
<text x="50" y="239" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Request identifier: A7</text>
<text x="50" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Target: Website</text>
<rect x="405" y="160" width="290" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="425" y="200" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Service creates task</text>
<text x="425" y="239" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Stored count: 0 → 1</text>
<text x="425" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A7 is recorded by service.</text>
<rect x="780" y="160" width="290" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="200" font-size="23" font-weight="700" text-anchor="start" fill="#172033">No reply arrives</text>
<text x="800" y="239" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Caller times out.</text>
<text x="800" y="269" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Creation may have worked.</text>
<path data-connector="true" d="M 320,230 L 394,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="405,230 393,236 393,224" fill="#64748b"/>
<path data-connector="true" d="M 695,230 L 769,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="780,230 768,236 768,224" fill="#64748b"/>
</g>
<!-- Idempotent retry; preserve text and arrow clearance. -->
<g id="idempotent-retry">
<text x="30" y="359" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Retry with a supported idempotency contract</text>
<rect x="30" y="390" width="290" height="155" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="430" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Repeat the same A7</text>
<text x="50" y="470" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Same operation and inputs</text>
<text x="50" y="500" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Same caller identity</text>
<rect x="405" y="390" width="290" height="155" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="425" y="430" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Service recognizes A7</text>
<text x="425" y="470" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Reuses the prior outcome.</text>
<text x="425" y="500" font-size="19" font-weight="400" text-anchor="start" fill="#172033">No second task is created.</text>
<rect x="780" y="390" width="290" height="155" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="430" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Count remains 1</text>
<text x="800" y="470" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Idempotent = repeating it</text>
<text x="800" y="500" font-size="19" font-weight="400" text-anchor="start" fill="#172033">adds no further effect.</text>
<path data-connector="true" d="M 320,467 L 394,467" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="405,467 393,473 393,461" fill="#64748b"/>
<path data-connector="true" d="M 695,467 L 769,467" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="780,467 768,473 768,461" fill="#64748b"/>
</g>
<!-- Retry limits; preserve text and arrow clearance. -->
<g id="retry-limits">
<text x="30" y="595" font-size="20" font-weight="700" text-anchor="start" fill="#172033">A new operation needs a new identifier. Merely logging A7 does not implement deduplication.</text>
<text x="30" y="632" font-size="19" font-weight="400" text-anchor="start" fill="#64748b">Check the service’s scope and retention rules. Without this support, investigate before repeating a change.</text>
</g>
</svg>
