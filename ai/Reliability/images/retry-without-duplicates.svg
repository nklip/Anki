<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc">
  <title id="title">A lost reply must not create a second task</title>
  <desc id="desc">Read the top row, then the bottom. First, request A7 creates the task and the service records the identifier with its result, but the response is lost and the caller times out. Later, the caller retries the same operation with A7. A service that supports this guarantee recognizes the identifier, returns the earlier result, and does not create another task. Its documented conditions and retention limits still apply.</desc>
  <!-- Shared series typography; each panel states its own role. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="605" fill="#ffffff"/>
  <!-- Heading states the lesson before the body introduces its parts. -->
  <text class="title" x="28" y="43" text-anchor="start">A lost reply must not create a second task</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Example service design: repeating the same operation has no additional effect.</text>
  <text class="label" x="28" y="113" text-anchor="start">First attempt</text>
  <!-- First request; labels explain the color and role. -->
  <g id="first-request">
    <rect x="28" y="134" width="300" height="166" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="178.0" y="170" text-anchor="middle">Create task: A7</text>
  <text class="body" x="178.0" y="210" text-anchor="middle">List: Website</text>
  <text class="body" x="178.0" y="248" text-anchor="middle">“Check opening hours”</text>
  <text class="note" x="178.0" y="281" text-anchor="middle">A7 identifies this operation.</text>
  </g>
  <!-- First save; labels explain the color and role. -->
  <g id="first-save">
    <rect x="386" y="134" width="314" height="166" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="543.0" y="170" text-anchor="middle">Service saves the task</text>
  <text class="body" x="543.0" y="214" text-anchor="middle">Records A7 with its result</text>
  <text class="body" x="543.0" y="256" text-anchor="middle">One new task now exists.</text>
  </g>
  <!-- Lost reply; labels explain the color and role. -->
  <g id="lost-reply">
    <rect x="758" y="134" width="314" height="166" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="label" x="915.0" y="170" text-anchor="middle">Reply is lost</text>
  <text class="body" x="915.0" y="214" text-anchor="middle">Caller sees a timeout.</text>
  <text class="body" x="915.0" y="256" text-anchor="middle">The saved task still exists.</text>
  </g>
  <!-- create-to-service: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="create-to-service">
    <line class="connector" x1="329" y1="215" x2="374" y2="215"/>
    <polygon class="head" points="386,215 373,209 373,221"/>
  </g>
  <!-- service-to-lost-reply: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="service-to-lost-reply">
    <line class="connector" x1="701" y1="215" x2="746" y2="215"/>
    <polygon class="head" points="758,215 745,209 745,221"/>
  </g>
  <text class="label" x="28" y="350" text-anchor="start">Later retry of the same operation</text>
  <!-- Retry request; labels explain the color and role. -->
  <g id="retry-request">
    <rect x="28" y="371" width="300" height="166" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="178.0" y="407" text-anchor="middle">Create task: A7 again</text>
  <text class="body" x="178.0" y="447" text-anchor="middle">Same operation and inputs</text>
  <text class="body" x="178.0" y="485" text-anchor="middle">Same identifier</text>
  <text class="note" x="178.0" y="518" text-anchor="middle">No new identifier for a retry.</text>
  </g>
  <!-- Recognized duplicate; labels explain the color and role. -->
  <g id="recognized-duplicate">
    <rect x="386" y="371" width="314" height="166" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="label" x="543.0" y="407" text-anchor="middle">Service recognizes A7</text>
  <text class="body" x="543.0" y="451" text-anchor="middle">Finds the recorded result</text>
  <text class="body" x="543.0" y="493" text-anchor="middle">Does not create another task</text>
  </g>
  <!-- Same result; labels explain the color and role. -->
  <g id="same-result">
    <rect x="758" y="371" width="314" height="166" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="915.0" y="407" text-anchor="middle">Return the prior result</text>
  <text class="body" x="915.0" y="451" text-anchor="middle">Caller receives confirmation.</text>
  <text class="body" x="915.0" y="493" text-anchor="middle">Still only one new task.</text>
  </g>
  <!-- retry-to-service: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="retry-to-service">
    <line class="connector" x1="329" y1="452" x2="374" y2="452"/>
    <polygon class="head" points="386,452 373,446 373,458"/>
  </g>
  <!-- service-to-prior-result: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="service-to-prior-result">
    <line class="connector" x1="701" y1="452" x2="746" y2="452"/>
    <polygon class="head" points="758,452 745,446 745,458"/>
  </g>
  <text class="note" x="550" y="579" text-anchor="middle">This requires service support for duplicate detection, within its documented limits.</text>
</svg>
