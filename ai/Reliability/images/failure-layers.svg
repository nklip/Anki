<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="865.909" viewBox="0 0 1100 635" role="img" aria-labelledby="title desc">
<title id="title">Model, orchestration, and tool failure layers</title>
<desc id="desc">Three panels distinguish the model choosing the wrong target, the runtime dispatching or pairing incorrectly, and the tool or service failing. Traces and saved outcomes help identify contributions from multiple layers.</desc>
<!-- Source-native artwork. Uniform scaling preserves the 1500 px landscape canvas. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif;}</style></defs>
<rect width="1100" height="635" fill="#ffffff"/>
<text x="30" y="44" font-size="28" font-weight="700" text-anchor="start" fill="#172033">Find which layer contributed to a failure</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Runtime = the application coordinating model calls and tools. Orchestration = that coordination.</text>
<!-- Model decision; preserve text and arrow clearance. -->
<g id="model-decision">
<rect x="30" y="125" width="320" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model decision</text>
<text x="50" y="214" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Chooses the wrong target:</text>
<text x="50" y="249" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Personal instead of Website.</text>
<text x="50" y="310" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Evidence to inspect</text>
<text x="50" y="350" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Inspect the proposed</text>
<text x="50" y="382" font-size="20" font-weight="400" text-anchor="start" fill="#172033">operation and target.</text>
</g>
<!-- Runtime orchestration; preserve text and arrow clearance. -->
<g id="runtime-orchestration">
<rect x="390" y="125" width="320" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="410" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Runtime orchestration</text>
<text x="410" y="214" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Sends the request twice</text>
<text x="410" y="249" font-size="21" font-weight="400" text-anchor="start" fill="#172033">or pairs the wrong result.</text>
<text x="410" y="310" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Evidence to inspect</text>
<text x="410" y="350" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Inspect dispatch, call IDs,</text>
<text x="410" y="382" font-size="20" font-weight="400" text-anchor="start" fill="#172033">result routing, and retries.</text>
</g>
<!-- Tool or service; preserve text and arrow clearance. -->
<g id="tool-or-service">
<rect x="750" y="125" width="320" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="770" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tool or service</text>
<text x="770" y="214" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Rejects the request</text>
<text x="770" y="249" font-size="21" font-weight="400" text-anchor="start" fill="#172033">or fails while saving.</text>
<text x="770" y="310" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Evidence to inspect</text>
<text x="770" y="350" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Inspect tool errors and</text>
<text x="770" y="382" font-size="20" font-weight="400" text-anchor="start" fill="#172033">the actual stored data.</text>
</g>
<!-- Shared investigation; preserve text and arrow clearance. -->
<g id="shared-investigation">
<rect x="30" y="485" width="1040" height="115" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="527" font-size="26" font-weight="700" text-anchor="start" fill="#172033">One failed task can involve more than one layer.</text>
<text x="50" y="568" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Use the trace to locate behavior, then compare it with an independent outcome check.</text>
</g>
</svg>
