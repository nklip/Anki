<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="570" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Dot product and scaling: make one match score</title>
  <desc id="desc">Dot product and scaling: make one match score. Where: attention head → compare query with each key, before masking</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Dot product and scaling: make one match score</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: attention head → compare query with each key, before masking</text>
  <!-- Matching coordinates are multiplied, then summed; four coordinates make the scaling factor two. -->
  <rect x="28" y="108" width="452" height="224" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="140" font-size="23" text-anchor="start" fill="#172033" font-weight="700">Dot product = multiply, then add</text>
  <text x="50" y="185" font-size="20" text-anchor="start" fill="#172033">Query</text>
  <rect x="164" y="155" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="191.5" y="184" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="222" y="155" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="249.5" y="184" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="280" y="155" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="307.5" y="184" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">0</text>
  <rect x="338" y="155" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365.5" y="184" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <text x="50" y="242" font-size="20" text-anchor="start" fill="#172033">Key</text>
  <rect x="164" y="212" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="191.5" y="241" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="222" y="212" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="249.5" y="241" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">0</text>
  <rect x="280" y="212" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="307.5" y="241" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="338" y="212" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365.5" y="241" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <text x="254" y="302" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">1×2 + 2×0 + 0×1 + 1×2 = 4</text>
  <line class="connector" x1="488" y1="222" x2="521.0" y2="222.0" style="stroke:#64748b"/>
  <polygon points="530,222 520.0,227.0 520.0,217.0" fill="#64748b"/>
  <rect x="540" y="108" width="432" height="224" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="562" y="140" font-size="23" text-anchor="start" fill="#172033" font-weight="700">Scaling = control score size</text>
  <text x="756" y="195" font-size="23" text-anchor="middle" fill="#172033">4 coordinates → √4 = 2</text>
  <text x="756" y="250" font-size="30" text-anchor="middle" fill="#172033" font-weight="700">score 4 ÷ 2 = 2</text>
  <text x="756" y="302" font-size="20" text-anchor="middle" fill="#172033">Divide by √(query/key width).</text>
  <text x="500" y="363" font-size="18" text-anchor="middle" fill="#64748b">A larger dot product gives a higher score, not a guaranteed semantic match.</text>
</svg>
