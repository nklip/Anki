<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="639" viewBox="0 0 1000 426" role="img" aria-labelledby="title desc">
  <title id="title">Causal mask: a position cannot read the future</title>
  <desc id="desc">Causal mask: a position cannot read the future. Where: attention head → after scoring, before softmax</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="426" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Causal mask: a position cannot read the future</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: attention head → after scoring, before softmax</text>
  <!-- Rows are readers; columns supply keys and values. Labels are outside the matrix. -->
  <text x="272" y="130" font-size="20" text-anchor="middle" fill="#172033" font-weight="700">Read from →</text>
  <text x="210" y="168" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">The</text>
  <text x="312" y="168" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">cat</text>
  <text x="414" y="168" font-size="21" text-anchor="middle" fill="#172033" font-weight="700">sat</text>
  <text x="107" y="222" font-size="21" text-anchor="end" fill="#172033" font-weight="700">The</text>
  <rect x="160" y="185" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="224" font-size="19" text-anchor="middle" fill="#172033">read</text>
  <rect x="262" y="185" width="100" height="60" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="312" y="224" font-size="19" text-anchor="middle" fill="#172033">blocked</text>
  <rect x="364" y="185" width="100" height="60" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="414" y="224" font-size="19" text-anchor="middle" fill="#172033">blocked</text>
  <text x="107" y="286" font-size="21" text-anchor="end" fill="#172033" font-weight="700">cat</text>
  <rect x="160" y="249" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="288" font-size="19" text-anchor="middle" fill="#172033">read</text>
  <rect x="262" y="249" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="312" y="288" font-size="19" text-anchor="middle" fill="#172033">read</text>
  <rect x="364" y="249" width="100" height="60" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="414" y="288" font-size="19" text-anchor="middle" fill="#172033">blocked</text>
  <text x="107" y="350" font-size="21" text-anchor="end" fill="#172033" font-weight="700">sat</text>
  <rect x="160" y="313" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="352" font-size="19" text-anchor="middle" fill="#172033">read</text>
  <rect x="262" y="313" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="312" y="352" font-size="19" text-anchor="middle" fill="#172033">read</text>
  <rect x="364" y="313" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="414" y="352" font-size="19" text-anchor="middle" fill="#172033">read</text>
  <rect x="538" y="139" width="434" height="218" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="560" y="177" font-size="23" text-anchor="start" fill="#172033" font-weight="700">Follow the row for “cat”</text>
  <text x="560" y="220" font-size="21" text-anchor="start" fill="#172033">The: allowed     cat: allowed</text>
  <text x="560" y="259" font-size="21" text-anchor="start" fill="#172033">sat: score becomes −∞</text>
  <text x="560" y="298" font-size="20" text-anchor="start" fill="#172033">Softmax gives that position weight 0.</text>
  <text x="500" y="399" font-size="18" text-anchor="middle" fill="#64748b">The diagonal stays open: a token may read itself as well as earlier tokens.</text>
</svg>
