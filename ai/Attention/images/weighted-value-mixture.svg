<svg xmlns="http://www.w3.org/2000/svg" width="900" height="606" viewBox="0 0 900 606" role="img" aria-labelledby="title desc">
  <title id="title">Mix the values, coordinate by coordinate</title>
  <desc id="desc">At cat, use rounded attention weights 0.27 for The, 0.73 for cat, and 0 for the masked sat. Values are invented: [10, 0, 0, 0], [0, 10, 0, 0], and [5, 5, 5, 5]. Their weighted contributions are [2.7, 0, 0, 0], [0, 7.3, 0, 0], and [0, 0, 0, 0]. Adding matching coordinates gives an approximate head result [2.7, 7.3, 0, 0]. This is a mixture, not random token selection.</desc>
  <!-- Orange denotes value vectors; green denotes contributions and the final sum. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 23px; text-anchor: middle; }
      .vector { font-size: 23px; text-anchor: middle; }
      .operator { font-size: 29px; text-anchor: middle; }
      .result { font-size: 30px; font-weight: 700; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .muted { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="606" fill="#ffffff"/>

  <!-- Multiplication is shown explicitly so percentages are not confused with sampling. -->
  <text class="title" x="28" y="44">Mix the values, coordinate by coordinate</text>
  <text class="subtitle" x="28" y="76">At cat · rounded weights: 27% = 0.27; 73% = 0.73 · toy value vectors</text>
  <text class="label" x="73" y="126">Token</text>
  <text class="label" x="196" y="126">Weight</text>
  <text class="label" x="420" y="126">Value</text>
  <text class="label" x="743.5" y="126">Contribution</text>

  <!-- The contributes only to the first coordinate in this deliberately sparse example. -->
  <g id="the-contribution">
    <text class="body" x="73" y="198">The</text>
    <text class="body" x="196" y="198">0.27</text>
    <text class="operator" x="266" y="199">×</text>
    <rect x="305" y="160" width="230" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="vector" x="420" y="198">[10, 0, 0, 0]</text>
    <text class="operator" x="575" y="199">=</text>
    <rect x="615" y="160" width="257" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="vector" x="743.5" y="198">[2.7, 0, 0, 0]</text>
  </g>

  <!-- Cat contributes only to the second coordinate. -->
  <g id="cat-contribution">
    <text class="body" x="73" y="283">cat</text>
    <text class="body" x="196" y="283">0.73</text>
    <text class="operator" x="266" y="284">×</text>
    <rect x="305" y="245" width="230" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="vector" x="420" y="283">[0, 10, 0, 0]</text>
    <text class="operator" x="575" y="284">=</text>
    <rect x="615" y="245" width="257" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="vector" x="743.5" y="283">[0, 7.3, 0, 0]</text>
  </g>

  <!-- A nonzero future value still contributes zero because its mixing weight is zero. -->
  <g id="masked-contribution">
    <text class="body muted" x="73" y="368">sat</text>
    <text class="body muted" x="196" y="368">0</text>
    <text class="operator muted" x="266" y="369">×</text>
    <rect x="305" y="330" width="230" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="vector muted" x="420" y="368">[5, 5, 5, 5]</text>
    <text class="operator muted" x="575" y="369">=</text>
    <rect x="615" y="330" width="257" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="vector muted" x="743.5" y="368">[0, 0, 0, 0]</text>
  </g>

  <!-- The final sum keeps one result vector for the inspected query position. -->
  <g id="head-result">
    <rect x="28" y="434" width="844" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="450" y="469">Add the contributions: one head's result at cat</text>
    <text class="result" x="450" y="516">≈ [2.7, 7.3, 0, 0]</text>
  </g>
  <text class="note" x="450" y="581">A coordinate is one slot. Add first slots together, then second slots, and so on.</text>
</svg>
