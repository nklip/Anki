<svg xmlns="http://www.w3.org/2000/svg" width="900" height="654" viewBox="0 0 900 654" role="img" aria-labelledby="title desc">
  <title id="title">Match, scale, mask, then normalize</title>
  <desc id="desc">For the query at cat in The cat sat, use [2, 0, 0, 0]. Keys for The, cat, and sat are [0, 1, 0, 0], [1, 0, 0, 0], and [2, 0, 0, 0]. Dot products are 0, 2, and 4. Division by 2 gives 0, 1, and 2. The causal mask blocks the later position sat before softmax. The remaining scores produce positive amounts 1 and about 2.72, normalized to about 27 and 73 percent. Sat receives zero weight despite its largest raw score. All values are invented.</desc>
  <!-- Gray marks the blocked row; green groups the softmax calculation. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 21px; text-anchor: middle; }
      .vector { font-size: 20px; text-anchor: middle; }
      .weight { font-size: 24px; font-weight: 700; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .muted { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="654" fill="#ffffff"/>

  <!-- Each row is one source position; columns follow the computation left to right. -->
  <text class="title" x="28" y="44">Match, scale, mask, then normalize</text>
  <text class="subtitle" x="28" y="76">Query at cat: [2, 0, 0, 0] · input: The cat sat · toy numbers · read left to right</text>
  <g id="score-table">
    <rect x="28" y="110" width="844" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="29" y="319" width="842" height="59" fill="#f8fafc"/>
    <text class="label" x="85" y="149">Token</text>
    <text class="label" x="263" y="149">Key</text>
    <text class="label" x="443" y="136">Raw</text>
    <text class="label" x="443" y="161">score</text>
    <text class="label" x="553" y="136">Scaled</text>
    <text class="label" x="553" y="161">(÷ 2)</text>
    <text class="label" x="671" y="149">Mask</text>
    <text class="label" x="805" y="136">Softmax</text>
    <text class="label" x="805" y="161">weight</text>
    <line x1="29" y1="177" x2="871" y2="177" stroke="#cbd5e1"/>
    <line x1="29" y1="248" x2="871" y2="248" stroke="#cbd5e1"/>
    <line x1="29" y1="319" x2="871" y2="319" stroke="#cbd5e1"/>
    <text class="body" x="85" y="222">The</text>
    <text class="vector" x="263" y="222">[0, 1, 0, 0]</text>
    <text class="body" x="443" y="222">0</text>
    <text class="body" x="553" y="222">0</text>
    <text class="body" x="671" y="222">allow</text>
    <text class="weight" x="805" y="222">≈ 27%</text>
    <text class="body" x="85" y="293">cat</text>
    <text class="vector" x="263" y="293">[1, 0, 0, 0]</text>
    <text class="body" x="443" y="293">2</text>
    <text class="body" x="553" y="293">1</text>
    <text class="body" x="671" y="293">allow</text>
    <text class="weight" x="805" y="293">≈ 73%</text>
    <text class="body muted" x="85" y="364">sat</text>
    <text class="vector muted" x="263" y="364">[2, 0, 0, 0]</text>
    <text class="body muted" x="443" y="364">4</text>
    <text class="body muted" x="553" y="364">2</text>
    <text class="body muted" x="671" y="364">blocked</text>
    <text class="weight muted" x="805" y="364">0%</text>
  </g>

  <!-- A fully expanded dot product explains the score without matrix notation. -->
  <g id="dot-product-example">
    <text class="body" x="450" y="430">Dot product: multiply matching numbers, then add.</text>
    <text class="body" x="450" y="463">For the cat key: 2 × 1 + 0 × 0 + 0 × 0 + 0 × 0 = 2</text>
  </g>

  <!-- Blocked entries are excluded before the allowed amounts are normalized. -->
  <g id="softmax-example">
    <rect x="28" y="489" width="844" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="body" x="450" y="521">Softmax: 0 → e⁰ = 1; 1 → e¹ ≈ 2.72</text>
    <text class="body" x="450" y="553">Divide by the total: 1 ÷ 3.72 ≈ 27%; 2.72 ÷ 3.72 ≈ 73%.</text>
    <text class="note" x="450" y="582">The mask gives sat 0% before it can contribute to the mixture.</text>
  </g>
  <text class="note" x="450" y="633">e ≈ 2.718 is a fixed number. The small raised number is a power.</text>
</svg>
