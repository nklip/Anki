<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="705" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Queries match keys; values supply the information</title>
  <desc id="desc">Three separate learned projections make a query, key, and value at every token. Queries and keys produce scores; values are mixed using weights derived from those scores.</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Queries match keys; values supply the information</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: repeated block → attention → one head</text>
  <!-- A single source supplies three distinct learned projections. -->
  <rect x="360" y="106" width="280" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="144" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Current token vector</text>
  <line x1="500" y1="168" x2="500" y2="194" stroke="#64748b" stroke-width="1.5"/>
  <line x1="178" y1="194" x2="822" y2="194" stroke="#64748b" stroke-width="1.5"/>
  <line class="connector" x1="178" y1="194" x2="178.0" y2="212.0" style="stroke:#64748b"/>
  <polygon points="178,221 173.0,211.0 183.0,211.0" fill="#64748b"/>
  <rect x="28" y="221" width="300" height="192" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="178" y="254" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">Query (Q)</text>
  <text x="178" y="285" font-size="20" text-anchor="middle" fill="#172033">What to match</text>
  <rect x="120" y="302" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="147.5" y="331" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="178" y="302" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="205.5" y="331" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <text x="178" y="389" font-size="18" text-anchor="middle" fill="#172033">Compare with every allowed key</text>
  <line class="connector" x1="500" y1="194" x2="500.0" y2="212.0" style="stroke:#64748b"/>
  <polygon points="500,221 495.0,211.0 505.0,211.0" fill="#64748b"/>
  <rect x="350" y="221" width="300" height="192" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="254" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">Key (K)</text>
  <text x="500" y="285" font-size="20" text-anchor="middle" fill="#172033">What can be matched</text>
  <rect x="442" y="302" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="469.5" y="331" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <rect x="500" y="302" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="527.5" y="331" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">0</text>
  <text x="500" y="389" font-size="18" text-anchor="middle" fill="#172033">One key per source position</text>
  <line class="connector" x1="822" y1="194" x2="822.0" y2="212.0" style="stroke:#64748b"/>
  <polygon points="822,221 817.0,211.0 827.0,211.0" fill="#64748b"/>
  <rect x="672" y="221" width="300" height="192" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="822" y="254" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">Value (V)</text>
  <text x="822" y="285" font-size="20" text-anchor="middle" fill="#172033">What gets handed over</text>
  <rect x="764" y="302" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="791.5" y="331" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">4</text>
  <rect x="822" y="302" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="849.5" y="331" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">6</text>
  <text x="822" y="389" font-size="18" text-anchor="middle" fill="#172033">One value per source position</text>
  <text x="500" y="448" font-size="18" text-anchor="middle" fill="#64748b">Q and K set the weights. V holds the content. Numbers are invented examples.</text>
</svg>
