<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-labelledby="title desc">
  <title id="title">Parallel attention heads produce one update</title>
  <desc id="desc">Basic multi-head self-attention, with two heads shown. The same sequence vectors enter both heads in parallel. Each head has its own learned query, key, and value projections and produces a separate mixture for the position cat. The two output vectors are joined end-to-end, called concatenation. A learned attention output projection maps the joined vector back to the residual-vector width. Add the resulting attention update to the incoming residual vector.</desc>
  <!-- Blue and orange distinguish the two parallel heads and their joined outputs. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 21px; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="730" fill="#ffffff"/>

  <!-- The shared source and symmetric split make parallel execution explicit. -->
  <text class="title" x="28" y="44">Parallel heads, one attention update</text>
  <text class="subtitle" x="28" y="76">Basic multi-head design · Two heads shown · Focus: the position cat</text>
  <g id="shared-sequence-input">
    <rect x="170" y="102" width="560" height="64" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="450" y="129">Same sequence vectors</text>
    <text class="note" x="450" y="153">sent to both heads in parallel</text>
  </g>

  <!-- Shafts end inside the separate triangle bases; tips meet the head-panel borders. -->
  <g id="parallel-input-flow">
    <path class="connector" d="M450 167 V184 M228 184 H672 M228 184 V195 M672 184 V195"/>
    <polygon class="head" points="228,208 221,194 235,194"/>
    <polygon class="head" points="672,208 665,194 679,194"/>
  </g>

  <!-- Each head uses its own learned projections; neither head feeds the other. -->
  <g id="head-one">
    <rect x="28" y="208" width="400" height="157" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="228" y="240">Head 1</text>
    <text class="body" x="228" y="274">Own learned projections</text>
    <text class="note" x="228" y="302">for queries, keys, and values</text>
    <text class="label" x="228" y="345">Output: mixture for cat</text>
  </g>
  <g id="head-two">
    <rect x="472" y="208" width="400" height="157" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="label" x="672" y="240">Head 2</text>
    <text class="body" x="672" y="274">Own learned projections</text>
    <text class="note" x="672" y="302">for queries, keys, and values</text>
    <text class="label" x="672" y="345">Output: mixture for cat</text>
  </g>

  <!-- Routes stay outside the concatenation label; each output enters its own vector segment. -->
  <text class="label" x="450" y="399">Join end-to-end (concatenate)</text>
  <g id="head-output-flow">
    <path class="connector" d="M228 366 V414 H289 V419"/>
    <polygon class="head" points="289,432 282,418 296,418"/>
    <path class="connector" d="M672 366 V414 H611 V419"/>
    <polygon class="head" points="611,432 604,418 618,418"/>
  </g>
  <g id="concatenated-head-outputs">
    <rect x="128" y="432" width="322" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="450" y="432" width="322" height="50" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="body" x="289" y="464">Head 1 output</text>
    <text class="body" x="611" y="464">Head 2 output</text>
  </g>

  <!-- This attention projection returns to residual width; it is not a vocabulary-scoring layer. -->
  <g id="attention-output-projection">
    <line class="connector" x1="450" y1="483" x2="450" y2="501"/>
    <polygon class="head" points="450,514 443,500 457,500"/>
    <rect x="170" y="514" width="560" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="450" y="543">Learned attention output projection</text>
    <text class="note" x="450" y="570">Maps back to residual-vector width</text>
  </g>

  <!-- The projection produces an update; the footer names the following residual addition. -->
  <g id="attention-update">
    <line class="connector" x1="450" y1="585" x2="450" y2="603"/>
    <polygon class="head" points="450,616 443,602 457,602"/>
    <rect x="235" y="616" width="430" height="44" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="450" y="644">One attention update for cat</text>
  </g>
  <text class="body" x="450" y="701">Add this update to the incoming residual vector.</text>
</svg>
