<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="705" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Attention heads compute different mixtures in parallel</title>
  <desc id="desc">Attention heads compute different mixtures in parallel. Where: attention → head outputs → output projection → residual addition</desc>
  <!-- Shared type and palette; arrows use separate heads with covered shaft joins. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; } .connector { fill: none; stroke: #64748b; stroke-width: 2; } </style>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="28" y="42" font-size="28" text-anchor="start" fill="#172033" font-weight="700">Attention heads compute different mixtures in parallel</text>
  <text x="28" y="76" font-size="18" text-anchor="start" fill="#64748b">Where: attention → head outputs → output projection → residual addition</text>
  <!-- Head output vectors are concatenated, then projected back to residual width. -->
  <rect x="28" y="172" width="200" height="94" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="128" y="210" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Same input</text>
  <text x="128" y="240" font-size="18" text-anchor="middle" fill="#172033">at every position</text>
  <rect x="298" y="112" width="230" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="413" y="144" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Head 1</text>
  <rect x="355" y="166" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="382.5" y="195" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="413" y="166" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440.5" y="195" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">6</text>
  <path class="connector" d="M228 219 H262 V173 H286" style="stroke:#64748b"/>
  <line class="connector" x1="286" y1="173" x2="289.0" y2="173.0" style="stroke:#64748b"/>
  <polygon points="298,173 288.0,178.0 288.0,168.0" fill="#64748b"/>
  <rect x="298" y="292" width="230" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="413" y="324" font-size="23" text-anchor="middle" fill="#172033" font-weight="700">Head 2</text>
  <rect x="355" y="346" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="382.5" y="375" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <rect x="413" y="346" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440.5" y="375" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <path class="connector" d="M228 219 H262 V353 H286" style="stroke:#64748b"/>
  <line class="connector" x1="286" y1="353" x2="289.0" y2="353.0" style="stroke:#64748b"/>
  <polygon points="298,353 288.0,358.0 288.0,348.0" fill="#64748b"/>
  <path class="connector" d="M528 173 H564 V249" style="stroke:#64748b"/>
  <path class="connector" d="M528 353 H564 V249" style="stroke:#64748b"/>
  <line class="connector" x1="564" y1="249" x2="597.0" y2="249.0" style="stroke:#64748b"/>
  <polygon points="606,249 596.0,254.0 596.0,244.0" fill="#64748b"/>
  <rect x="606" y="144" width="366" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="628" y="178" font-size="23" text-anchor="start" fill="#172033" font-weight="700">Concatenate: join outputs</text>
  <rect x="668" y="197" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="695.5" y="226" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">1</text>
  <rect x="726" y="197" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="753.5" y="226" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">6</text>
  <rect x="784" y="197" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="811.5" y="226" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">3</text>
  <rect x="842" y="197" width="55" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="869.5" y="226" font-size="22" text-anchor="middle" fill="#172033" font-weight="700">2</text>
  <text x="789" y="274" font-size="22" text-anchor="middle" fill="#172033">Learned output projection</text>
  <text x="789" y="319" font-size="24" text-anchor="middle" fill="#172033" font-weight="700">4 slots → 2-slot update</text>
  <text x="500" y="449" font-size="18" text-anchor="middle" fill="#64748b">One head = one learned mixing operation. Heads do not receive predefined human roles.</text>
</svg>
