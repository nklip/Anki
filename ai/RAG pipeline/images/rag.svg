<!-- Landscape canvas; the upper row retrieves, the lower row generates and returns. -->
<rect width="1600" height="780" fill="#fff"/>
<rect x="10" y="10" width="1580" height="760" rx="28" fill="#faf6ff" stroke="#b28bdb" stroke-width="3"/>
<text x="48" y="63" font-size="37" font-weight="700" text-anchor="start" fill="#080a0a">RAG</text>
<text x="48" y="102" font-size="24" font-weight="400" text-anchor="start" fill="#494151">Retrieve evidence, build a prompt, then generate an answer. Follow steps 1–8.</text>
<!-- Offline index: four original source pictograms remain together in one searchable store. -->
<rect id="offline-index" x="1100" y="160" width="440" height="245" rx="18" fill="#fff" stroke="#7c39cf" stroke-width="3"/>
<text x="1320" y="201" font-size="30" font-weight="700" text-anchor="middle" fill="#080a0a">Vector / Hybrid Index</text>
<use href="#symbol-pdf" x="1125" y="238" width="90" height="88"/>
<use href="#symbol-docs" x="1230" y="238" width="72" height="88"/>
<use href="#symbol-code" x="1330" y="238" width="79" height="88"/>
<use href="#symbol-search" x="1435" y="238" width="85" height="88"/>
<text x="1170" y="359" font-size="21" font-weight="400" text-anchor="middle" fill="#080a0a">PDF</text>
<text x="1266" y="359" font-size="21" font-weight="400" text-anchor="middle" fill="#080a0a">Docs</text>
<text x="1370" y="359" font-size="21" font-weight="400" text-anchor="middle" fill="#080a0a">Code</text>
<text x="1465" y="359" font-size="20" font-weight="400" text-anchor="middle" fill="#080a0a">Search Index</text>
<text x="1320" y="438" font-size="23" font-weight="400" text-anchor="middle" fill="#494151">built offline</text>
<!-- Upper row components: user, application, retriever. Original icons stay upright. -->
<use href="#symbol-user" x="60" y="220" width="120" height="120"/>
<use href="#symbol-app" x="376" y="228" width="128" height="104"/>
<use href="#symbol-retriever" x="729" y="220" width="122" height="120"/>
<text x="120" y="379" font-size="31" font-weight="700" text-anchor="middle" fill="#080a0a">User</text>
<text x="440" y="379" font-size="31" font-weight="700" text-anchor="middle" fill="#080a0a">LLM App</text>
<text x="790" y="379" font-size="31" font-weight="700" text-anchor="middle" fill="#080a0a">Retriever</text>
<!-- Request and response are separate lanes between the same user and application. -->
<path id="user-query-connector" class="connector" d="M191 299 H362"/>
<path id="user-query-tip-connector" class="head" d="M348 299 L362 299"/>
<path id="user-query-arrowhead" class="head" d="M349 286 L362 299 L349 312"/>
<g id="step-1"><circle cx="220" cy="343" r="23" fill="#080a0a"/>
<text x="220" y="351" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">1</text>
</g>
<text x="256" y="351" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">query</text>
<path id="user-response-connector" class="connector" d="M362 241 H191"/>
<path id="user-response-tip-connector" class="head" d="M205 241 L191 241"/>
<path id="user-response-arrowhead" class="head" d="M204 228 L191 241 L204 254"/>
<g id="step-8"><circle cx="220" cy="194" r="23" fill="#080a0a"/>
<text x="220" y="202" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">8</text>
</g>
<text x="256" y="202" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">response</text>
<path id="retrieval-query-connector" class="connector" d="M518 281 H711"/>
<path id="retrieval-query-tip-connector" class="head" d="M697 281 L711 281"/>
<path id="retrieval-query-arrowhead" class="head" d="M698 268 L711 281 L698 294"/>
<g id="step-2"><circle cx="572" cy="236" r="23" fill="#080a0a"/>
<text x="572" y="244" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">2</text>
</g>
<text x="608" y="244" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">query</text>
<!-- Index search and its result have distinct opposing lanes; neither crosses a label. -->
<path id="embed-search-connector" class="connector" d="M866 254 H1086"/>
<path id="embed-search-tip-connector" class="head" d="M1072 254 L1086 254"/>
<path id="embed-search-arrowhead" class="head" d="M1073 241 L1086 254 L1073 267"/>
<g id="step-3"><circle cx="874" cy="205" r="23" fill="#080a0a"/>
<text x="874" y="213" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">3</text>
</g>
<text x="910" y="213" font-size="24" font-weight="400" text-anchor="start" fill="#080a0a">embed + search</text>
<path id="top-k-chunks-connector" class="connector" d="M1086 322 H866"/>
<path id="top-k-chunks-tip-connector" class="head" d="M880 322 L866 322"/>
<path id="top-k-chunks-arrowhead" class="head" d="M879 309 L866 322 L879 335"/>
<g id="step-4"><circle cx="900" cy="369" r="23" fill="#080a0a"/>
<text x="900" y="377" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">4</text>
</g>
<text x="936" y="377" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">top-K chunks</text>
<!-- The retriever supplies question plus chunks to the lower prompt-building row. -->
<path id="query-and-chunks-connector" class="connector" d="M790 400 V459 Q790 480 811 480 H1299 Q1320 480 1320 501 V555"/>
<path id="query-and-chunks-tip-connector" class="head" d="M1320 541 L1320 555"/>
<path id="query-and-chunks-arrowhead" class="head" d="M1307 542 L1320 555 L1333 542"/>
<g id="step-5"><circle cx="944" cy="522" r="23" fill="#080a0a"/>
<text x="944" y="530" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">5</text>
</g>
<text x="980" y="530" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">query + chunks</text>
<rect id="prompt-builder" x="1175" y="570" width="290" height="110" rx="18" fill="#f0e8fa" stroke="#7c39cf" stroke-width="3"/>
<text x="1320" y="636" font-size="31" font-weight="700" text-anchor="middle" fill="#080a0a">Prompt Builder</text>
<!-- Generation runs right to left, then the answer returns upward to the application. -->
<use href="#symbol-llm" x="386" y="573" width="108" height="104"/>
<text x="440" y="719" font-size="31" font-weight="700" text-anchor="middle" fill="#080a0a">LLM</text>
<path id="augmented-prompt-connector" class="connector" d="M1160 625 H510"/>
<path id="augmented-prompt-tip-connector" class="head" d="M524 625 L510 625"/>
<path id="augmented-prompt-arrowhead" class="head" d="M523 612 L510 625 L523 638"/>
<g id="step-6"><circle cx="792" cy="578" r="23" fill="#080a0a"/>
<text x="792" y="586" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">6</text>
</g>
<text x="828" y="586" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">augmented prompt</text>
<path id="model-answer-connector" class="connector" d="M440 557 V400"/>
<path id="model-answer-tip-connector" class="head" d="M440 414 L440 400"/>
<path id="model-answer-arrowhead" class="head" d="M427 413 L440 400 L453 413"/>
<g id="step-7"><circle cx="274" cy="479" r="23" fill="#080a0a"/>
<text x="274" y="487" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">7</text>
</g>
<text x="310" y="487" font-size="25" font-weight="400" text-anchor="start" fill="#080a0a">answer</text>
</svg>
