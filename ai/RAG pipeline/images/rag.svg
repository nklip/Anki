.connector{fill:none;stroke:#080a0a;stroke-width:3.5;stroke-dasharray:15 12;stroke-linejoin:round}
.head{fill:none;stroke:#080a0a;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
</style>
