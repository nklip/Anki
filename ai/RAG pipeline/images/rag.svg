<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
<title id="title">RAG: a horizontal retrieval and generation pipeline</title>
<desc id="desc">Horizontal adaptation of ByteByteGo's RAG diagram. Steps 1 and 2 carry a query from the user through the application to the retriever. Steps 3 and 4 search the offline index and return top-K chunks. Step 5 passes the question and chunks to the prompt builder; step 6 sends an augmented prompt to the large language model. Steps 7 and 8 return the answer through the application to the user. Native icons, editable text, and the original numbered handoffs are preserved.</desc>
<!-- Shared styles and source-native pictograms from the original vertical recreation. -->
<defs>
