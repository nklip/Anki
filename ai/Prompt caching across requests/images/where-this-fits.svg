<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="452" viewBox="0 0 1100 452" role="img" aria-labelledby="title desc">
  <title id="title">Prompt caching reuses prefill work across requests</title>
  <desc id="desc">A new request with the same beginning and a new question goes through prefill, decoding, and a reply. During prefill, a cache hit skips the shared beginning. Decoding still produces one token per pass, and the reply is always newly generated. A second row compares three kinds of cache: the KV cache reuses earlier tokens' work inside one request; the prompt cache, this article, reuses a shared beginning across requests; a response cache is a different idea that returns a stored answer. Prompt caching speeds up prefill only.</desc>
  <!-- Shared typography and connector colors match the series' where-this-fits diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="452" fill="#ffffff"/>
  <!-- Heading states the lesson and the reading order. -->
  <text class="title" x="28" y="43" text-anchor="start">Prompt caching reuses prefill work across requests</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Read left to right, then compare the three kinds of cache below.</text>
  <!-- One later request; the prefill box carries the cache hit that this article explains. -->
  <g id="request-route">
    <rect x="28" y="108" width="230" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="143" y="144" text-anchor="middle">New request</text>
    <text class="note" x="143" y="174" text-anchor="middle">same beginning,</text>
    <text class="note" x="143" y="198" text-anchor="middle">new question</text>
    <rect x="312" y="108" width="270" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="447" y="144" text-anchor="middle">Prefill</text>
    <text class="note" x="447" y="174" text-anchor="middle">a cache hit skips</text>
    <text class="note" x="447" y="198" text-anchor="middle">the shared beginning</text>
    <rect x="637" y="108" width="210" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="742" y="144" text-anchor="middle">Decode</text>
    <text class="note" x="742" y="174" text-anchor="middle">one token per pass,</text>
    <text class="note" x="742" y="198" text-anchor="middle">same work as before</text>
    <rect x="902" y="108" width="170" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="987" y="144" text-anchor="middle">Reply</text>
    <text class="note" x="987" y="174" text-anchor="middle">always newly</text>
    <text class="note" x="987" y="198" text-anchor="middle">generated</text>
  </g>
  <!-- Each shaft ends inside its triangular head; tips meet the next box boundary. -->
  <g id="route-connectors">
    <line class="connector" x1="259" y1="160" x2="300" y2="160"/><polygon class="head" points="312,160 299,154 299,166"/>
    <line class="connector" x1="583" y1="160" x2="625" y2="160"/><polygon class="head" points="637,160 624,154 624,166"/>
    <line class="connector" x1="848" y1="160" x2="890" y2="160"/><polygon class="head" points="902,160 889,154 889,166"/>
  </g>
  <!-- Comparison row; the middle box repeats the route's emphasis and names this article. -->
  <g id="cache-comparison">
    <text class="label" x="28" y="256" text-anchor="start">Three kinds of cache that people often confuse</text>
    <rect x="28" y="274" width="328" height="116" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="192" y="308" text-anchor="middle">KV cache</text>
    <text class="body" x="192" y="338" text-anchor="middle">inside one request</text>
    <text class="body" x="192" y="364" text-anchor="middle">reuses earlier tokens' work</text>
    <rect x="386" y="274" width="328" height="116" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="550" y="308" text-anchor="middle">Prompt cache</text>
    <text class="body" x="550" y="338" text-anchor="middle">this article: across requests</text>
    <text class="body" x="550" y="364" text-anchor="middle">reuses a shared beginning</text>
    <rect x="744" y="274" width="328" height="116" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="908" y="308" text-anchor="middle">Response cache</text>
    <text class="body" x="908" y="338" text-anchor="middle">a different idea</text>
    <text class="body" x="908" y="364" text-anchor="middle">returns a stored answer</text>
  </g>
  <!-- Limit note prevents the "80% cached means 80% faster" misconception. -->
  <text class="note" x="550" y="428" text-anchor="middle">Prompt caching speeds up prefill only; writing the reply takes the same work.</text>
</svg>
