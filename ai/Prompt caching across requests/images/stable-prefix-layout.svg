<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="869.196428571428571" viewBox="0 0 1120 649" role="img" aria-labelledby="title desc">
<title id="title">An exact prefix starts at the very beginning</title>
<desc id="desc">Two prompts share instructions and reference material when those regions remain first and identical. Moving a changing timestamp before them breaks the exact prefix. Meaning alone does not establish a cache match.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1120" height="649" fill="#ffffff"/>
<text x="28" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">An exact prefix starts at the very beginning</tspan>
</text>
<text x="28" y="73" font-size="21" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Same token sequence and order; similar meaning is not enough.</tspan>
</text>
<!-- stable-first: keep title and arrows in separate vertical bands. -->
<g id="stable-first">
<rect x="28" y="96" width="1064" height="232" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="131" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Stable prefix first; changing question last</tspan>
</text>
</g>
<text x="50" y="190" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Earlier</tspan>
</text>
<g id="stable-a">
<rect x="160" y="153" width="600" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="189.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="460.0" dy="0">Same instructions + same reference</tspan>
</text>
</g>
<g id="question-a">
<rect x="780" y="153" width="290" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="925.0" y="189.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="925.0" dy="0">Question A</tspan>
</text>
</g>
<text x="50" y="268" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Later</tspan>
</text>
<g id="stable-b">
<rect x="160" y="231" width="600" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="267.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="460.0" dy="0">Same instructions + same reference</tspan>
</text>
</g>
<g id="question-b">
<rect x="780" y="231" width="290" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="925.0" y="267.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="925.0" dy="0">Question B</tspan>
</text>
</g>
<text x="160" y="313" font-size="20" font-weight="400" text-anchor="start" fill="#2563eb">
<tspan x="160" dy="0">The blue region can match from the start.</tspan>
</text>
<!-- change-first: keep title and arrows in separate vertical bands. -->
<g id="change-first">
<rect x="28" y="348" width="1064" height="232" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="383" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">An early change breaks the reusable prefix</tspan>
</text>
</g>
<text x="50" y="442" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Earlier</tspan>
</text>
<g id="time-a">
<rect x="160" y="405" width="190" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="255.0" y="441.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="255.0" dy="0">Time 09:00</tspan>
</text>
</g>
<g id="late-stable-a">
<rect x="370" y="405" width="700" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="720.0" y="441.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="720.0" dy="0">Same instructions + same reference</tspan>
</text>
</g>
<text x="50" y="520" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Later</tspan>
</text>
<g id="time-b">
<rect x="160" y="483" width="190" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="255.0" y="519.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="255.0" dy="0">Time 09:01</tspan>
</text>
</g>
<g id="late-stable-b">
<rect x="370" y="483" width="700" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="720.0" y="519.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="720.0" dy="0">Same instructions + same reference</tspan>
</text>
</g>
<text x="160" y="565" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="160" dy="0">Later matching text cannot repair an earlier mismatch.</tspan>
</text>
<text x="28" y="617" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Keep stable content first. Append new messages instead of editing earlier ones.</tspan>
</text>
</svg>
