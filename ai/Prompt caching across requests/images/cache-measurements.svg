<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1011.16071428571429" viewBox="0 0 1120 755" role="img" aria-labelledby="title desc">
<title id="title">Cached input is not the same as time or money saved</title>
<desc id="desc">An input has 1,024 cached tokens out of 1,280, or 80 percent. Illustrative server time falls from ten to six seconds, or forty percent. A separate timeline defines time to first token as the interval from request submission until the first reply token arrives. Cost depends on read, write, and output pricing.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1120" height="755" fill="#ffffff"/>
<text x="28" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Cached input is not the same as time or money saved</tspan>
</text>
<!-- coverage: keep title and arrows in separate vertical bands. -->
<g id="coverage">
<rect x="28" y="66" width="1064" height="146" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="101" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Cached-input share: how much input was reported as cached</tspan>
</text>
</g>
<g id="cached-input">
<rect x="50" y="121" width="816" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="458.0" y="157.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="458.0" dy="0">1,024 cached input tokens</tspan>
</text>
</g>
<g id="uncached-input">
<rect x="866" y="121" width="204" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="968.0" y="157.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="968.0" dy="0">256 uncached</tspan>
</text>
</g>
<text x="50" y="201" font-size="20" font-weight="400" text-anchor="start" fill="#2563eb">
<tspan x="50" dy="0">1,024 ÷ 1,280 = 80% of input tokens cached</tspan>
</text>
<!-- timing: keep title and arrows in separate vertical bands. -->
<g id="timing">
<rect x="28" y="230" width="1064" height="236" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="265" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Illustrative server time: prefill improves; generation still runs</tspan>
</text>
</g>
<text x="50" y="323" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">No reuse</tspan>
</text>
<g id="full-prefill">
<rect x="190" y="284" width="528" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="454.0" y="321.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="454.0" dy="0">Prefill: 6 s</tspan>
</text>
</g>
<g id="full-decode">
<rect x="718" y="284" width="352" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="894.0" y="321.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="894.0" dy="0">Generate reply: 4 s</tspan>
</text>
</g>
<text x="50" y="402" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Reuse</tspan>
</text>
<g id="short-prefill">
<rect x="190" y="363" width="176" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="278.0" y="400.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="278.0" dy="0">Prefill: 2 s</tspan>
</text>
</g>
<g id="same-decode">
<rect x="366" y="363" width="352" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="542.0" y="400.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="542.0" dy="0">Generate reply: 4 s</tspan>
</text>
</g>
<text x="190" y="451" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="190" dy="0">10 s → 6 s means 40% less server time, not 80%.</tspan>
</text>
<!-- time-to-first-token: keep title and arrows in separate vertical bands. -->
<g id="time-to-first-token">
<rect x="28" y="486" width="1064" height="143" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="521" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Time to first token: wait until the answer starts</tspan>
</text>
</g>
<g id="request-sent">
<rect x="50" y="542" width="210" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="155.0" y="579.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="155.0" dy="0">Send request</tspan>
</text>
</g>
<g id="wait-starts">
<path data-connector="true" d="M260 572 H300" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="310,572 298,565 298,579" fill="#2563eb"/>
</g>
<g id="wait-components">
<rect x="310" y="542" width="500" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="579.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="560.0" dy="0">Queue + computation + network</tspan>
</text>
</g>
<g id="first-arrives">
<path data-connector="true" d="M810 572 H850" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="860,572 848,565 848,579" fill="#2563eb"/>
</g>
<g id="first-token">
<rect x="860" y="542" width="210" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="965.0" y="579.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="965.0" dy="0">First token</tspan>
</text>
</g>
<text x="28" y="667" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Cost: check billed cache reads, cache writes, other input, and generated output.</tspan>
</text>
<text x="28" y="706" font-size="22" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Measure cached tokens, first-token delay, total time, and cost separately.</tspan>
</text>
<text x="28" y="739" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Timing values are examples, not a provider benchmark.</tspan>
</text>
</svg>
