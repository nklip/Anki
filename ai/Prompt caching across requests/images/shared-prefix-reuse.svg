<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="816.964285714285714" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">Prompt caching reuses computation for a shared beginning</title>
<desc id="desc">A prefix is the beginning of a prompt. A first request computes and saves it. A cache hit reuses that saved work; a miss computes it again. Both paths generate a fresh answer.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1120" height="610" fill="#ffffff"/>
<text x="28" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Prompt caching reuses computation for a shared beginning</tspan>
</text>
<text x="28" y="73" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Read each request from left to right. Blue marks work that can be reused.</tspan>
</text>
<!-- first-request: keep title and arrows in separate vertical bands. -->
<g id="first-request">
<rect x="28" y="96" width="1064" height="144" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="131" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">First request: compute and save the prefix</tspan>
</text>
</g>
<g id="first-prefix">
<rect x="50" y="153" width="390" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="245.0" y="193.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="245.0" dy="0">Instructions + reference document</tspan>
</text>
</g>
<g id="first-question">
<rect x="452" y="153" width="230" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="567.0" y="179.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="567.0" dy="0">Suffix</tspan>
<tspan x="567.0" dy="28">Question A</tspan>
</text>
</g>
<g id="first-compute">
<path data-connector="true" d="M682 186 H730" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="740,186 728,179 728,193" fill="#2563eb"/>
</g>
<g id="first-prefill">
<rect x="740" y="153" width="330" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="905.0" y="193.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="905.0" dy="0">Compute input; save prefix</tspan>
</text>
</g>
<!-- cache-hit: keep title and arrows in separate vertical bands. -->
<g id="cache-hit">
<rect x="28" y="258" width="1064" height="144" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="293" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Cache hit = usable saved work is found</tspan>
</text>
</g>
<g id="reused-prefix">
<rect x="50" y="315" width="390" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="245.0" y="355.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="245.0" dy="0">Same prefix: reuse saved work</tspan>
</text>
</g>
<g id="new-suffix">
<rect x="452" y="315" width="230" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="567.0" y="341.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="567.0" dy="0">Process suffix</tspan>
<tspan x="567.0" dy="28">Question B</tspan>
</text>
</g>
<g id="hit-generate">
<path data-connector="true" d="M682 348 H730" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="740,348 728,341 728,355" fill="#2563eb"/>
</g>
<g id="hit-answer">
<rect x="740" y="315" width="330" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="905.0" y="355.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="905.0" dy="0">Generate a fresh answer</tspan>
</text>
</g>
<!-- cache-miss: keep title and arrows in separate vertical bands. -->
<g id="cache-miss">
<rect x="28" y="420" width="1064" height="144" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="455" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Cache miss = no usable saved work is found</tspan>
</text>
</g>
<g id="miss-input">
<rect x="50" y="477" width="632" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="366.0" y="517.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="366.0" dy="0">Compute the prefix and question B again</tspan>
</text>
</g>
<g id="miss-generate">
<path data-connector="true" d="M682 510 H730" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="740,510 728,503 728,517" fill="#2563eb"/>
</g>
<g id="miss-answer">
<rect x="740" y="477" width="330" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="905.0" y="517.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="905.0" dy="0">Generate a fresh answer</tspan>
</text>
</g>
<text x="28" y="594" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Prefix = the beginning of the prompt, before its changing ending (the suffix).</tspan>
</text>
</svg>
