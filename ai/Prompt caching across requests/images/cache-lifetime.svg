<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="713.839285714285714" viewBox="0 0 1120 533" role="img" aria-labelledby="title desc">
<title id="title">Saved work can become unavailable</title>
<desc id="desc">Retention describes how long a cache entry is kept or eligible under the service policy. Expiration follows a time limit. Eviction removes cached work, for example to make space. Missing physical cached state must be recomputed.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1120" height="533" fill="#ffffff"/>
<text x="28" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Saved work can become unavailable</tspan>
</text>
<text x="28" y="74" font-size="21" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Retention = how long a cache entry is kept or remains eligible under a policy.</tspan>
</text>
<!-- expiration: keep title and arrows in separate vertical bands. -->
<g id="expiration">
<rect x="28" y="96" width="1064" height="156" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="131" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Expiration: a time limit ends</tspan>
</text>
</g>
<g id="retained">
<rect x="50" y="155" width="290" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="195.0" y="194.5" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="195.0" dy="0">Saved prefix available</tspan>
</text>
</g>
<g id="clock-passes">
<path data-connector="true" d="M340 187.5 H405" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="415,187.5 403,180.5 403,194.5" fill="#2563eb"/>
</g>
<g id="ttl-ends">
<rect x="415" y="155" width="290" height="65" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="194.5" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="560.0" dy="0">Lifetime ends</tspan>
</text>
</g>
<g id="entry-expires">
<path data-connector="true" d="M705 187.5 H770" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="780,187.5 768,180.5 768,194.5" fill="#2563eb"/>
</g>
<g id="expired">
<rect x="780" y="155" width="290" height="65" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="925.0" y="194.5" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="925.0" dy="0">Entry no longer usable</tspan>
</text>
</g>
<!-- eviction: keep title and arrows in separate vertical bands. -->
<g id="eviction">
<rect x="28" y="272" width="1064" height="156" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="307" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Eviction: the system removes cached work, for example to make space</tspan>
</text>
</g>
<g id="before-eviction">
<rect x="50" y="331" width="290" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="195.0" y="370.5" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="195.0" dy="0">Saved prefix available</tspan>
</text>
</g>
<g id="pressure">
<path data-connector="true" d="M340 363.5 H405" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="415,363.5 403,356.5 403,370.5" fill="#2563eb"/>
</g>
<g id="make-space">
<rect x="415" y="331" width="290" height="65" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="370.5" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="560.0" dy="0">Storage needed</tspan>
</text>
</g>
<g id="remove-entry">
<path data-connector="true" d="M705 363.5 H770" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="780,363.5 768,356.5 768,370.5" fill="#2563eb"/>
</g>
<g id="evicted">
<rect x="780" y="331" width="290" height="65" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="925.0" y="370.5" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="925.0" dy="0">Cached work removed</tspan>
</text>
</g>
<text x="28" y="465" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">If no physical cached state can be reused, the model computes that input again.</tspan>
</text>
<text x="28" y="500" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Check the provider: a pricing lifetime need not guarantee physical reuse or faster replies.</tspan>
</text>
</svg>
