<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="685.714285714285714" viewBox="0 0 1120 512" role="img" aria-labelledby="title desc">
<title id="title">A matching prefix needs an eligible reuse boundary</title>
<desc id="desc">A vLLM example uses blocks of four tokens. Ten tokens match, but only the first eight belong to fully matching blocks. Provider APIs can use eligible message endpoints instead.</desc>
<!-- Shared typography; all labels remain editable text. -->
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1120" height="512" fill="#ffffff"/>
<text x="28" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">A matching prefix needs an eligible reuse boundary</tspan>
</text>
<text x="28" y="74" font-size="21" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Reuse boundary = an endpoint the system can save and look up.</tspan>
</text>
<!-- block-example: keep title and arrows in separate vertical bands. -->
<g id="block-example">
<rect x="28" y="96" width="1064" height="298" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="50" y="131" font-size="24" font-weight="700" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Toy vLLM-style example: four tokens per block</tspan>
</text>
</g>
<text x="50" y="181" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Saved</tspan>
</text>
<g id="saved-abcd">
<rect x="160" y="144" width="280" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="300.0" y="181.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="300.0" dy="0">A  B  C  D</tspan>
</text>
</g>
<g id="saved-efgh">
<rect x="456" y="144" width="280" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="596.0" y="181.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="596.0" dy="0">E  F  G  H</tspan>
</text>
</g>
<g id="saved-ijkl">
<rect x="752" y="144" width="318" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="911.0" y="181.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="911.0" dy="0">I  J  K  L</tspan>
</text>
</g>
<text x="50" y="275" font-size="21" font-weight="600" text-anchor="start" fill="#172033">
<tspan x="50" dy="0">Later</tspan>
</text>
<g id="later-abcd">
<rect x="160" y="238" width="280" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="300.0" y="275.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="300.0" dy="0">A  B  C  D</tspan>
</text>
</g>
<g id="later-efgh">
<rect x="456" y="238" width="280" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="596.0" y="275.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="596.0" dy="0">E  F  G  H</tspan>
</text>
</g>
<g id="later-ijxy">
<rect x="752" y="238" width="318" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="911.0" y="275.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172033">
<tspan x="911.0" dy="0">I  J  x  y</tspan>
</text>
</g>
<text x="448" y="340" font-size="23" font-weight="700" text-anchor="middle" fill="#2563eb">
<tspan x="448" dy="0">Reuse eight tokens</tspan>
</text>
<text x="910" y="340" font-size="23" font-weight="700" text-anchor="middle" fill="#172033">
<tspan x="910" dy="0">Compute this block</tspan>
</text>
<text x="160" y="375" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="160" dy="0">Ten tokens match, but only two complete blocks match.</tspan>
</text>
<text x="28" y="433" font-size="21" font-weight="400" text-anchor="start" fill="#172033">
<tspan x="28" dy="0">Provider APIs may use eligible message endpoints instead of fixed token blocks.</tspan>
</text>
<text x="28" y="466" font-size="21" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Eligible length, model, settings, and cache availability also affect reuse.</tspan>
</text>
<text x="28" y="497" font-size="18" font-weight="400" text-anchor="start" fill="#64748b">
<tspan x="28" dy="0">Token = text piece or special marker. Letters and block sizes here are illustrative.</tspan>
</text>
</svg>
