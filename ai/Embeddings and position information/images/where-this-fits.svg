<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="504" viewBox="0 0 1100 504" role="img" aria-labelledby="title desc">
<title id="title">Embeddings give tokens their starting vectors</title>
<desc id="desc">Text becomes token IDs, which select starting vectors through an embedding lookup. Transformer blocks refine these vectors before next-token scores are computed. Position information is supplied differently across designs: additive position vectors enter before the blocks; rotary position embeddings turn queries and keys inside attention in Llama-style blocks.</desc>
<!-- Shared typography and connector colors match the article's existing diagrams. -->
<defs><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 19px; fill: #475569; }
.label { font-size: 21px; font-weight: 700; }
.body { font-size: 20px; }
.note { font-size: 19px; fill: #475569; }
.connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
.head { fill: #64748b; }
</style></defs>
<rect width="1100" height="504" fill="#ffffff"/>
<!-- Title and reading direction introduce the map. -->
<text class="title" x="28" y="43" text-anchor="start">Embeddings give tokens their starting vectors</text>
<text class="subtitle" x="28" y="77" text-anchor="start">Read left to right. Purple marks the embedding lookup result.</text>
<!-- Common model route; only the article focus is emphasized. -->
<g id="model-route">
<rect x="28" y="112" width="142" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text class="label" x="99.0" y="161" text-anchor="middle">Text</text>
<rect x="207" y="112" width="145" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text class="label" x="279.5" y="161" text-anchor="middle">Token IDs</text>
<rect x="389" y="112" width="182" height="84" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
<text class="label" x="480.0" y="148" text-anchor="middle">Starting</text>
<text class="label" x="480.0" y="176" text-anchor="middle">vectors</text>
<rect x="608" y="112" width="238" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text class="label" x="727.0" y="148" text-anchor="middle">Transformer</text>
<text class="label" x="727.0" y="176" text-anchor="middle">blocks</text>
<rect x="883" y="112" width="189" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text class="label" x="977.5" y="148" text-anchor="middle">Next-token</text>
<text class="label" x="977.5" y="176" text-anchor="middle">scores</text>
</g>
<!-- Each shaft ends inside its triangular head; tips meet the next box boundary. -->
<g id="route-connectors">
<line class="connector" x1="171" y1="154" x2="195" y2="154"/><polygon class="head" points="207,154 194,148 194,160"/>
<line class="connector" x1="353" y1="154" x2="377" y2="154"/><polygon class="head" points="389,154 376,148 376,160"/>
<line class="connector" x1="572" y1="154" x2="596" y2="154"/><polygon class="head" points="608,154 595,148 595,160"/>
<line class="connector" x1="847" y1="154" x2="871" y2="154"/><polygon class="head" points="883,154 870,148 870,160"/>
</g>
<!-- The identity lookup is the common entry point before either position design. -->
<text class="body" x="550" y="232" text-anchor="middle">Embedding lookup: each token ID selects one learned vector.</text>
<text class="label" x="28" y="279" text-anchor="start">Position information enters at different places in different designs</text>
<!-- Two alternatives are separate panels, not two successive steps. -->
<g id="added-position-design">
<rect x="28" y="299" width="500" height="142" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text class="label" x="278" y="332" text-anchor="middle">Added position vectors</text>
<text class="body" x="278" y="368" text-anchor="middle">Add a position vector to the token vector.</text>
<text class="label" x="278" y="412" text-anchor="middle">BEFORE the transformer blocks</text>
</g>
<g id="rotary-position-design">
<rect x="554" y="299" width="518" height="142" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text class="label" x="813" y="332" text-anchor="middle">Rotary position embeddings (RoPE)</text>
<text class="body" x="813" y="368" text-anchor="middle">Rotate the vectors used to compare tokens.</text>
<text class="label" x="813" y="412" text-anchor="middle">INSIDE attention in Llama-style blocks</text>
</g>
<!-- The footer names the contrast rather than relying only on color. -->
<text class="body" x="550" y="477" text-anchor="middle">Identity says which token; position says where it occurs.</text>
</svg>
