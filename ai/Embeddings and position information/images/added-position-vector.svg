<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
  <title id="title">Adding position changes the starting vector</title>
  <desc id="desc">An additive position encoding design adds matching numbers before the transformer blocks. At position 1, token vector [2, 1] plus position vector [0, 3] gives [2, 4]. At position 2, the same token vector plus position vector [1, -1] gives [3, 0]. All numbers are invented. Position vectors may be learned or generated by a fixed rule.</desc>
  <!-- Purple is token identity, blue is position, green is their elementwise sum. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .row-label { font-size: 20px; font-weight: 700; }
      .value { font-size: 30px; text-anchor: middle; }
      .operator { font-size: 33px; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="530" fill="#ffffff"/>

  <!-- This illustrates the additive design, not rotary position embeddings. -->
  <text class="title" x="28" y="44">Adding position changes the starting vector</text>
  <text class="subtitle" x="28" y="76">One design: add matching numbers before the transformer blocks · toy values</text>
  <text class="label" x="143" y="125">Token vector</text>
  <text class="label" x="449" y="125">Position vector</text>
  <text class="label" x="756" y="125">Combined vector</text>

  <!-- Position one supplies a distinct learned or generated vector. -->
  <g id="position-one-sum">
    <text class="row-label" x="28" y="162">At position 1</text>
    <rect x="28" y="180" width="230" height="82" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="value" x="143" y="232">[2, 1]</text>
    <text class="operator" x="296" y="233">+</text>
    <rect x="334" y="180" width="230" height="82" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="value" x="449" y="232">[0, 3]</text>
    <text class="operator" x="602" y="233">=</text>
    <rect x="640" y="180" width="232" height="82" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="value" x="756" y="232">[2, 4]</text>
  </g>

  <!-- Changing position changes only the position vector in this comparison. -->
  <g id="position-two-sum">
    <text class="row-label" x="28" y="320">At position 2</text>
    <rect x="28" y="338" width="230" height="82" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="value" x="143" y="390">[2, 1]</text>
    <text class="operator" x="296" y="391">+</text>
    <rect x="334" y="338" width="230" height="82" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="value" x="449" y="390">[1, −1]</text>
    <text class="operator" x="602" y="391">=</text>
    <rect x="640" y="338" width="232" height="82" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="value" x="756" y="390">[3, 0]</text>
  </g>

  <!-- The worked first row makes the arithmetic understandable without vector notation. -->
  <text class="note" x="450" y="466">First row: 2 + 0 = 2, then 1 + 3 = 4. Keep the same order.</text>
  <text class="note" x="450" y="500">Position vectors can be learned or made by a fixed rule.</text>
</svg>
