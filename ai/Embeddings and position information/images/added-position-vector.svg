<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="814.090909090909091" viewBox="0 0 1100 597" role="img" aria-labelledby="title desc">
  <title id="title">Add a position vector before the transformer blocks</title>
  <desc id="desc">For the additive design, token vector 2,1 plus position-one vector 0,3 gives 2,4. At position two the same token vector plus 1,-1 gives 3,0. These are toy values, not sine/cosine values from the original Transformer.</desc>
  <!-- Typography and palette shared across the internals series. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1100" height="597" fill="#ffffff"/>
  <text x="32" y="46" font-size="30" font-weight="700" fill="#172033" text-anchor="start">Add a position vector before the transformer blocks</text>
  <text x="32" y="79" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">LOCATION  Additive architecture: token embedding + position vector → first block</text>
  <!-- Position vectors are added before blocks only in the additive design. -->
  <text x="32" y="130" font-size="22" font-weight="700" fill="#2563eb" text-anchor="start">POSITIONAL ENCODING · numbers that supply token order</text>
  <text x="32" y="176" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Position</text>
  <text x="204" y="176" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Token vector</text>
  <text x="534" y="176" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Position vector</text>
  <text x="881" y="176" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Combined</text>
  <rect x="32" y="210" width="100" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="82.0" y="248" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">1</text>
  <rect x="170" y="210" width="230" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285.0" y="248" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[2, 1]</text>
  <text x="449" y="249" font-size="32" font-weight="600" fill="#172033" text-anchor="start">+</text>
  <rect x="500" y="210" width="230" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="615.0" y="248" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[0, 3]</text>
  <text x="779" y="249" font-size="32" font-weight="600" fill="#172033" text-anchor="start">=</text>
  <rect x="830" y="210" width="238" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="949.0" y="248" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[2, 4]</text>
  <rect x="32" y="316" width="100" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="82.0" y="354" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">2</text>
  <rect x="170" y="316" width="230" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285.0" y="354" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[2, 1]</text>
  <text x="449" y="355" font-size="32" font-weight="600" fill="#172033" text-anchor="start">+</text>
  <rect x="500" y="316" width="230" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="615.0" y="354" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[1, −1]</text>
  <text x="779" y="355" font-size="32" font-weight="600" fill="#172033" text-anchor="start">=</text>
  <rect x="830" y="316" width="238" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="949.0" y="354" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">[3, 0]</text>
  <rect x="32" y="423" width="1036" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="465" font-size="27" font-weight="600" fill="#172033" text-anchor="start">Add matching slots:  [2 + 0, 1 + 3] = [2, 4]</text>
  <text x="56" y="503" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Same token identity + different position → different vector entering the first block</text>
  <text x="32" y="567" font-size="20" font-weight="400" fill="#172033" text-anchor="start">The original Transformer used fixed sine/cosine patterns; position vectors can also be learned.</text>
</svg>
