<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="979.090909090909091" viewBox="0 0 1100 718" role="img" aria-labelledby="title desc">
  <title id="title">RoPE makes attention comparisons depend on position gaps</title>
  <desc id="desc">RoPE rotates pairs of query and key numbers. For equal starting vectors in a toy with ten degrees per position, key position two and query position five differ by thirty degrees. Positions three and six retain the same difference. Real query-key scores depend on both content and relative position.</desc>
  <!-- Typography and palette shared across the internals series. -->
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1100" height="718" fill="#ffffff"/>
  <text x="32" y="46" font-size="30" font-weight="700" fill="#172033" text-anchor="start">RoPE makes attention comparisons depend on position gaps</text>
  <text x="32" y="79" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">LOCATION  Inside attention: rotate queries and keys before computing their match</text>
  <!-- Equal content vectors isolate the position-only rotations. The toy rate is 10 degrees per position. -->
  <text x="32" y="127" font-size="22" font-weight="700" fill="#2563eb" text-anchor="start">RoPE = rotary position embeddings · rotate pairs of query/key numbers</text>
  <text x="32" y="163" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Query (Q): what this position seeks. Key (K): what another position offers to match.</text>
  <rect x="32" y="197" width="492" height="286" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="234" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Key at 2; query at 5</text>
  <line x1="114" y1="404" x2="424" y2="404" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="264" y1="434" x2="264" y2="264" stroke="#cbd5e1" stroke-width="2"/>
  <path data-connector="true" d="M264 404 L385.2203480813822 359.87940151098877" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="395.5569669100272,356.1171799344064 385.9907561772246,364.919884758244 382.57055474396793,355.5229585503849" fill="#64748b"/>
  <path data-connector="true" d="M264 404 L346.91960164956356 305.1802668376518" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="353.9902653561155,296.75377796334305 350.10703625547194,309.16024932920345 342.4465918242821,302.7323732323381" fill="#2563eb"/>
  <text x="406" y="361" font-size="21" font-weight="700" fill="#64748b" text-anchor="start">K</text>
  <text x="339" y="271" font-size="21" font-weight="700" fill="#2563eb" text-anchor="start">Q</text>
  <text x="56" y="460" font-size="21" font-weight="600" fill="#172033" text-anchor="start">Gap 5 − 2 = 3  →  relative turn 30°</text>
  <rect x="576" y="197" width="492" height="286" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="234" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Key at 3; query at 6</text>
  <line x1="658" y1="404" x2="968" y2="404" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="808" y1="434" x2="808" y2="264" stroke="#cbd5e1" stroke-width="2"/>
  <path data-connector="true" d="M808 404 L919.7172770881925 339.5" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="929.2435565298214,334.0 921.3512516844081,344.3301270189222 916.3512516844081,335.6698729810778" fill="#64748b"/>
  <path data-connector="true" d="M808 404 L872.5 292.28272291180747" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="878.0,282.7564434701786 876.3301270189222,295.6487483155919 867.6698729810778,290.6487483155919" fill="#2563eb"/>
  <text x="950" y="344" font-size="21" font-weight="700" fill="#64748b" text-anchor="start">K</text>
  <text x="883" y="261" font-size="21" font-weight="700" fill="#2563eb" text-anchor="start">Q</text>
  <text x="600" y="460" font-size="21" font-weight="600" fill="#172033" text-anchor="start">Gap 6 − 3 = 3  →  relative turn 30°</text>
  <text x="32" y="530" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Shift both positions by one: each turns 10° more, but the comparison keeps the same relative angle.</text>
  <text x="32" y="565" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Toy rate and equal pre-rotation vectors. Real pairs rotate at different rates; content still affects the match.</text>
  <rect x="32" y="598" width="1036" height="93" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="635" font-size="23" font-weight="600" fill="#172033" text-anchor="start">Inside attention:  Q and K → position rotations → compare → mixing weights</text>
  <text x="56" y="672" font-size="21" font-weight="400" fill="#172033" text-anchor="start">RoPE does not add a position vector to the token embedding.</text>
</svg>
