<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900.000000" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Preparing the repair task context</title>
<desc id="desc">The runtime combines the user goal, file contents read through an allowed tool, two supplied tests, and callable tool definitions. This assembled context supplies actual information to the model.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="660" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Prepare the goal, file contents, tests, and tool definitions</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Runtime = the application coordinating the run. Context = information supplied to one model call.</text>
<!-- Users goal; preserve reading order and text clearance. -->
<g id="users-goal">
<rect x="30" y="130" width="230" height="245" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="48" y="169" font-size="23" font-weight="700" text-anchor="start" fill="#172033">User’s goal</text>
<text x="48" y="211" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Fix total_items.</text>
<text x="48" y="245" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Count marbles in bags.</text>
<text x="48" y="279" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Run the supplied tests.</text>
</g>
<!-- Read file; preserve reading order and text clearance. -->
<g id="read-file">
<rect x="300" y="130" width="230" height="245" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="318" y="169" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Read file</text>
<text x="318" y="211" font-size="18" font-weight="400" text-anchor="start" fill="#172033">marbles.py contains:</text>
<text x="318" y="245" font-size="18" font-weight="400" text-anchor="start" fill="#172033">return bags + per_bag</text>
<text x="318" y="279" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Contents came from</text>
<text x="318" y="313" font-size="18" font-weight="400" text-anchor="start" fill="#172033">an allowed read tool.</text>
</g>
<!-- Supplied tests; preserve reading order and text clearance. -->
<g id="supplied-tests">
<rect x="570" y="130" width="230" height="245" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="588" y="169" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Supplied tests</text>
<text x="588" y="211" font-size="18" font-weight="400" text-anchor="start" fill="#172033">(3, 4) → expected 12</text>
<text x="588" y="245" font-size="18" font-weight="400" text-anchor="start" fill="#172033">(0, 4) → expected 0</text>
<text x="588" y="279" font-size="18" font-weight="400" text-anchor="start" fill="#172033">A test compares an</text>
<text x="588" y="313" font-size="18" font-weight="400" text-anchor="start" fill="#172033">actual result with a target.</text>
</g>
<!-- Available tools; preserve reading order and text clearance. -->
<g id="available-tools">
<rect x="840" y="130" width="230" height="245" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="858" y="169" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Available tools</text>
<text x="858" y="211" font-size="18" font-weight="400" text-anchor="start" fill="#172033">run_tests(path)</text>
<text x="858" y="245" font-size="18" font-weight="400" text-anchor="start" fill="#172033">edit_file(path, change)</text>
<text x="858" y="279" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Definitions describe</text>
<text x="858" y="313" font-size="18" font-weight="400" text-anchor="start" fill="#172033">names and input rules.</text>
</g>
<!-- Context assembly; preserve reading order and text clearance. -->
<g id="context-assembly">
<rect x="215" y="467" width="670" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="550" y="507" font-size="25" font-weight="700" text-anchor="middle" fill="#172033">Runtime assembles the next model input</text>
<text x="550" y="550" font-size="21" font-weight="400" text-anchor="middle" fill="#172033">Instructions + goal + file text + tests + tool definitions</text>
</g>
<path data-connector="true" d="M 145,375 L 145,423 L 550,423 L 550,456" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="550,467 544,455 556,455" fill="#64748b"/>
<path data-connector="true" d="M 415,375 L 415,423 L 550,423 L 550,456" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="550,467 544,455 556,455" fill="#64748b"/>
<path data-connector="true" d="M 685,375 L 685,423 L 550,423 L 550,456" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="550,467 544,455 556,455" fill="#64748b"/>
<path data-connector="true" d="M 955,375 L 955,423 L 550,423 L 550,456" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="550,467 544,455 556,455" fill="#64748b"/>
<text x="30" y="626" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A filename names a file. Its contents become available to the model only when included in the input.</text>
</svg>
