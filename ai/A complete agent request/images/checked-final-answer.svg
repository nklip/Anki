<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
  <title id="title">The final answer reports what was checked</title>
  <desc id="desc">Step 5 starts with the saved edit result and two passing test results in context. The model generates a final reply saying addition was changed to multiplication in marbles.py and both supplied tests pass. The runtime delivers that reply and ends the run. The claim is limited to the checked cases, not all possible inputs. Learned weights stay fixed; context and temporary activations change.</desc>
  <!-- Shared series typography; each panel states its own role. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="450" fill="#ffffff"/>
  <!-- Heading states the lesson before the body introduces its parts. -->
  <text class="title" x="28" y="43" text-anchor="start">The final answer reports what was checked</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Step 5: tool evidence supports the completion report.</text>
  <!-- Verified run evidence; labels explain the color and role. -->
  <g id="verified-run-evidence">
    <rect x="28" y="112" width="304" height="189" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="180.0" y="148" text-anchor="middle">Evidence in context</text>
  <text class="body" x="180.0" y="194" text-anchor="middle">Edit reported saved</text>
  <text class="body" x="180.0" y="235" text-anchor="middle">Both supplied tests passed</text>
  <text class="note" x="180.0" y="276" text-anchor="middle">Results from the tool runs</text>
  </g>
  <!-- Final model call; labels explain the color and role. -->
  <g id="final-model-call">
    <rect x="394" y="112" width="294" height="189" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="label" x="541.0" y="148" text-anchor="middle">Final model call</text>
  <text class="note" x="541.0" y="194" text-anchor="middle">Generate a checked report.</text>
  <text class="body" x="541.0" y="235" text-anchor="middle">Same trained weights</text>
  <text class="note" x="541.0" y="276" text-anchor="middle">New input and activations</text>
  </g>
  <!-- Delivered answer; labels explain the color and role. -->
  <g id="delivered-answer">
    <rect x="750" y="112" width="322" height="189" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="911.0" y="148" text-anchor="middle">Reply delivered</text>
  <text class="body" x="911.0" y="194" text-anchor="middle">“Changed + to * in marbles.py.</text>
  <text class="body" x="911.0" y="235" text-anchor="middle">Both supplied tests pass.”</text>
  <text class="note" x="911.0" y="276" text-anchor="middle">The runtime ends this run.</text>
  </g>
  <!-- evidence-to-final-call: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="evidence-to-final-call">
    <line class="connector" x1="333" y1="207" x2="382" y2="207"/>
    <polygon class="head" points="394,207 381,201 381,213"/>
  </g>
  <!-- answer-to-user: shaft ends inside the head; the tip meets the target boundary. -->
  <g id="answer-to-user">
    <line class="connector" x1="689" y1="207" x2="738" y2="207"/>
    <polygon class="head" points="750,207 737,201 737,213"/>
  </g>
  <!-- Claim boundary; labels explain the color and role. -->
  <g id="claim-boundary">
    <rect x="28" y="337" width="1044" height="86" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text class="label" x="550.0" y="370" text-anchor="middle">This verifies the tested cases, not every possible input.</text>
  <text class="note" x="550.0" y="403" text-anchor="middle">Training shaped behavior; inference generated requests; tools edited and tested the file.</text>
  </g>
</svg>
