<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="845.454545" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">From checked tool outcomes to a bounded final claim</title>
<desc id="desc">Evidence of the saved multiplication change and two fresh passing tests supports a final report of exactly those results. The runtime delivers the response and stops. Passing supplied tests is not proof for every possible input.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="620" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Report only what the recorded outcome supports</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A final answer is a claim to the user. Its strength should match the evidence returned by tools.</text>
<!-- Checked evidence; preserve reading order and text clearance. -->
<g id="checked-evidence">
<rect x="30" y="130" width="320" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Recorded evidence</text>
<text x="50" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Saved file uses multiplication.</text>
<text x="50" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Fresh test results:</text>
<text x="50" y="273" font-size="20" font-weight="400" text-anchor="start" fill="#172033">(3, 4) → 12, expected 12</text>
<text x="50" y="305" font-size="20" font-weight="400" text-anchor="start" fill="#172033">(0, 4) → 0, expected 0</text>
<text x="50" y="337" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Both supplied tests pass.</text>
</g>
<!-- Supported report; preserve reading order and text clearance. -->
<g id="supported-report">
<rect x="390" y="130" width="320" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="410" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Final model reply</text>
<text x="410" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“Changed addition to</text>
<text x="410" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#172033">multiplication in marbles.py.</text>
<text x="410" y="273" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Both supplied tests pass.”</text>
<text x="410" y="305" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Runtime delivers the reply</text>
<text x="410" y="337" font-size="20" font-weight="400" text-anchor="start" fill="#172033">and ends this run.</text>
</g>
<!-- Scope of claim; preserve reading order and text clearance. -->
<g id="scope-of-claim">
<rect x="750" y="130" width="320" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770" y="168" font-size="24" font-weight="700" text-anchor="start" fill="#172033">What this establishes</text>
<text x="770" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The requested edit was made.</text>
<text x="770" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#172033">These two tests passed.</text>
<text x="770" y="273" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Untested inputs remain</text>
<text x="770" y="305" font-size="20" font-weight="400" text-anchor="start" fill="#172033">outside this evidence.</text>
<text x="770" y="337" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tests are not universal proof.</text>
</g>
<!-- Evidence to report; preserve reading order and text clearance. -->
<g id="evidence-to-report">
<path data-connector="true" d="M 350,270 L 379,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="390,270 378,276 378,264" fill="#64748b"/>
<path data-connector="true" d="M 710,270 L 739,270" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="750,270 738,276 738,264" fill="#64748b"/>
</g>
<!-- Completed loop; preserve reading order and text clearance. -->
<g id="completed-loop">
<rect x="30" y="462" width="1040" height="119" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="504" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Generated request → executed action → observed result → supported reply</text>
<text x="50" y="548" font-size="21" font-weight="400" text-anchor="start" fill="#172033">A sentence saying “fixed” would not establish that the file changed or that any test ran.</text>
</g>
</svg>
