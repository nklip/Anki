<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="865.909091" viewBox="0 0 1100 635" role="img" aria-labelledby="title desc">
<title id="title">Training, inference, weights, activations, and tools</title>
<desc id="desc">Training changes saved model weights before the example run. Inference uses fixed weights to compute input-dependent activations and generate requests. External tools read, modify, and test the file, returning feedback.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="635" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Training, inference, and tools change different things</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">This toy walkthrough uses a Llama-style causal model: it generates the next token from earlier input.</text>
<!-- Training and weights; preserve reading order and text clearance. -->
<g id="training-and-weights">
<rect x="30" y="124" width="320" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="162" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Training: before this run</text>
<text x="50" y="203" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Learns from examples</text>
<text x="50" y="235" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Updates weights: saved</text>
<text x="50" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#172033">numerical settings used</text>
<text x="50" y="299" font-size="20" font-weight="400" text-anchor="start" fill="#172033">in model calculations.</text>
<text x="50" y="331" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Produces the trained model.</text>
</g>
<!-- Inference and activations; preserve reading order and text clearance. -->
<g id="inference-and-activations">
<rect x="390" y="124" width="320" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="410" y="162" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Inference: during the run</text>
<text x="410" y="203" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Uses the trained weights</text>
<text x="410" y="235" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Computes activations:</text>
<text x="410" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#172033">temporary numbers for</text>
<text x="410" y="299" font-size="20" font-weight="400" text-anchor="start" fill="#172033">the current input.</text>
<text x="410" y="331" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Generates requests or text.</text>
</g>
<!-- Tools and file; preserve reading order and text clearance. -->
<g id="tools-and-file">
<rect x="750" y="124" width="320" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770" y="162" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Tools: outside the model</text>
<text x="770" y="203" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Executable software</text>
<text x="770" y="235" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Reads marbles.py</text>
<text x="770" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Edits its source code</text>
<text x="770" y="299" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Runs supplied tests</text>
<text x="770" y="331" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Returns results as input.</text>
</g>
<!-- Weight and request path; preserve reading order and text clearance. -->
<g id="weight-and-request-path">
<path data-connector="true" d="M 350,269 L 379,269" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="390,269 378,275 378,263" fill="#64748b"/>
<path data-connector="true" d="M 710,269 L 739,269" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="750,269 738,275 738,263" fill="#64748b"/>
<path data-connector="true" d="M 910,414 L 910,450 L 550,450 L 550,425" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="550,414 556,426 544,426" fill="#64748b"/>
<text x="650" y="437" font-size="20" font-weight="400" text-anchor="start" fill="#172033">tool feedback</text>
</g>
<!-- Changes during run; preserve reading order and text clearance. -->
<g id="changes-during-run">
<rect x="30" y="491" width="1040" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="530" font-size="21" font-weight="700" text-anchor="start" fill="#172033">During this repair: inputs and activations change; the file changes when a tool writes it.</text>
<text x="50" y="568" font-size="21" font-weight="400" text-anchor="start" fill="#172033">The model’s weights stay fixed. Reading a failing test result does not perform training.</text>
</g>
</svg>
