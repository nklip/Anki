<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900.000000" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Attention, position information, activations, and logits</title>
<desc id="desc">Position information informs causal attention, which combines only current and earlier positions. Per-position transformations compute activations. Repeating these blocks leads to the final vector at the last position, which produces next-token scores called logits.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="660" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Model blocks turn context into next-token scores</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A block groups calculations. Embedding vectors enter these blocks; this is a simplified causal model.</text>
<!-- Attention; preserve reading order and text clearance. -->
<g id="attention">
<rect x="30" y="126" width="500" height="204" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="50" y="164" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Causal attention</text>
<text x="50" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Mix information from current</text>
<text x="50" y="237" font-size="20" font-weight="400" text-anchor="start" fill="#172033">and earlier positions. At position 2,</text>
<text x="50" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">use positions 0, 1, 2; never future 3.</text>
</g>
<!-- Position; preserve reading order and text clearance. -->
<g id="position">
<rect x="630" y="126" width="440" height="204" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="650" y="164" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Position supplies order</text>
<text x="650" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Position information enters attention.</text>
<text x="650" y="237" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“bags hold marbles” and</text>
<text x="650" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">“marbles hold bags” differ in order.</text>
</g>
<!-- Per position transform; preserve reading order and text clearance. -->
<g id="per-position-transform">
<rect x="30" y="390" width="500" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="428" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Per-position calculations</text>
<text x="50" y="469" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Transform each position’s vector.</text>
<text x="50" y="501" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Intermediate numbers are activations.</text>
<text x="50" y="533" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Repeat with attention across blocks.</text>
</g>
<!-- Block output; preserve reading order and text clearance. -->
<g id="block-output">
<rect x="630" y="390" width="440" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="650" y="428" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Final vector → logits</text>
<text x="650" y="469" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Use the final vector at the last position.</text>
<text x="650" y="501" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Produce one score per possible token.</text>
<text x="650" y="533" font-size="20" font-weight="400" text-anchor="start" fill="#172033">These next-token scores are logits.</text>
</g>
<!-- Computation path; preserve reading order and text clearance. -->
<g id="computation-path">
<path data-connector="true" d="M 630,230 L 541,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="530,230 542,224 542,236" fill="#64748b"/>
<path data-connector="true" d="M 280,330 L 280,379" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="280,390 274,378 286,378" fill="#64748b"/>
<path data-connector="true" d="M 530,485 L 619,485" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="630,485 618,491 618,479" fill="#64748b"/>
</g>
<text x="30" y="628" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Model computation generates output information. It does not run the test tool.</text>
</svg>
