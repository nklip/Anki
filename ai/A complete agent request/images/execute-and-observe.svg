<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="906.818182" viewBox="0 0 1100 665" role="img" aria-labelledby="title desc">
<title id="title">Executing tests exposes the addition bug</title>
<desc id="desc">A run_tests request with call ID T1 passes validation and authorization before execution. The test tool reports expected 12 versus actual 7 for three bags of four, and expected 0 versus actual 4 for zero bags. Matched results enter the next input.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="665" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Execute the test request and return the actual failures</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A tool call requests work. The runtime checks it before invoking executable test code.</text>
<!-- Call request; preserve reading order and text clearance. -->
<g id="call-request">
<rect x="30" y="125" width="320" height="206" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model request</text>
<text x="50" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tool: run_tests</text>
<text x="50" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Path argument: marbles.py</text>
<text x="50" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Call ID: T1</text>
<text x="50" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The ID labels this request.</text>
</g>
<!-- Runtime checks; preserve reading order and text clearance. -->
<g id="runtime-checks">
<rect x="390" y="125" width="320" height="206" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="410" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Runtime checks</text>
<text x="410" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Validation: inputs fit rules.</text>
<text x="410" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Authorization: action allowed.</text>
<text x="410" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Then invoke the test tool.</text>
<text x="410" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tool code runs Python.</text>
</g>
<!-- Matched result; preserve reading order and text clearance. -->
<g id="matched-result">
<rect x="750" y="125" width="320" height="206" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770" y="163" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Returned observation</text>
<text x="770" y="204" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Actual test report below</text>
<text x="770" y="236" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Return it for call ID T1.</text>
<text x="770" y="268" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Include it in the next input.</text>
<text x="770" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The model can use this result.</text>
</g>
<!-- Execution path; preserve reading order and text clearance. -->
<g id="execution-path">
<path data-connector="true" d="M 350,230 L 379,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="390,230 378,236 378,224" fill="#64748b"/>
<path data-connector="true" d="M 710,230 L 739,230" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="750,230 738,236 738,224" fill="#64748b"/>
</g>
<!-- Failed test evidence; preserve reading order and text clearance. -->
<g id="failed-test-evidence">
<rect x="30" y="380" width="1040" height="207" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="419" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Current code: return bags + per_bag</text>
<text x="50" y="466" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Input (bags, per_bag)</text>
<text x="420" y="466" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Expected</text>
<text x="650" y="466" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Actual</text>
<text x="875" y="466" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Result</text>
<text x="50" y="510" font-size="22" font-weight="400" text-anchor="start" fill="#172033">(3, 4)</text>
<text x="420" y="510" font-size="22" font-weight="400" text-anchor="start" fill="#172033">12</text>
<text x="650" y="510" font-size="22" font-weight="400" text-anchor="start" fill="#172033">7</text>
<text x="875" y="510" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Fail</text>
<text x="50" y="553" font-size="22" font-weight="400" text-anchor="start" fill="#172033">(0, 4)</text>
<text x="420" y="553" font-size="22" font-weight="400" text-anchor="start" fill="#172033">0</text>
<text x="650" y="553" font-size="22" font-weight="400" text-anchor="start" fill="#172033">4</text>
<text x="875" y="553" font-size="22" font-weight="700" text-anchor="start" fill="#172033">Fail</text>
</g>
<text x="30" y="632" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Three bags of four contain 4 + 4 + 4 = 12 marbles. Adding the two inputs gives 3 + 4 = 7.</text>
</svg>
