<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="906.818182" viewBox="0 0 1100 665" role="img" aria-labelledby="title desc">
<title id="title">Edit the code and test the saved revision</title>
<desc id="desc">The model requests multiplication, the runtime authorizes an edit, and the tool writes the file. After that result enters a new context, a later model request runs both supplied tests against the saved revision. Both pass.</desc>
<!-- Shared native text and typography. Shafts end inside separate arrowhead bases. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1100" height="665" fill="#ffffff"/>
<text x="30" y="44" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Revise the file, then make a later request to test the saved version</text>
<text x="30" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Each row is a separate model request, tool execution, and returned result. Read the upper row first.</text>
<!-- Edit request; preserve reading order and text clearance. -->
<g id="edit-request">
<rect x="30" y="126" width="300" height="195" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="164" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Model requests edit</text>
<text x="50" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Context includes failing tests.</text>
<text x="50" y="237" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Replace + with *</text>
<text x="50" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">in total_items.</text>
<text x="50" y="301" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Inputs specify the change.</text>
</g>
<!-- Actual edit; preserve reading order and text clearance. -->
<g id="actual-edit">
<rect x="400" y="126" width="300" height="195" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="420" y="164" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Runtime + edit tool</text>
<text x="420" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Check inputs and permission.</text>
<text x="420" y="237" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Write marbles.py:</text>
<text x="420" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">return bags * per_bag</text>
<text x="420" y="301" font-size="20" font-weight="400" text-anchor="start" fill="#172033">* means multiplication.</text>
</g>
<!-- Edit result; preserve reading order and text clearance. -->
<g id="edit-result">
<rect x="770" y="126" width="300" height="195" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="790" y="164" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Edit result</text>
<text x="790" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The file was written.</text>
<text x="790" y="237" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Return the matched receipt.</text>
<text x="790" y="269" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Include it in the next input.</text>
<text x="790" y="301" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tests still need to run.</text>
</g>
<!-- Edit flow; preserve reading order and text clearance. -->
<g id="edit-flow">
<path data-connector="true" d="M 330,228 L 389,228" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="400,228 388,234 388,222" fill="#64748b"/>
<path data-connector="true" d="M 700,228 L 759,228" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="770,228 758,234 758,222" fill="#64748b"/>
</g>
<!-- Retest request; preserve reading order and text clearance. -->
<g id="retest-request">
<rect x="30" y="386" width="300" height="195" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="424" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Later model request</text>
<text x="50" y="465" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Tool: run_tests</text>
<text x="50" y="497" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Path argument: marbles.py</text>
<text x="50" y="529" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Test the saved file.</text>
<text x="50" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Use the new test output.</text>
</g>
<!-- Test execution; preserve reading order and text clearance. -->
<g id="test-execution">
<rect x="400" y="386" width="300" height="195" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="420" y="424" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Runtime + test tool</text>
<text x="420" y="465" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Check and execute again.</text>
<text x="420" y="497" font-size="20" font-weight="400" text-anchor="start" fill="#172033">(3, 4): expected 12, got 12</text>
<text x="420" y="529" font-size="20" font-weight="400" text-anchor="start" fill="#172033">(0, 4): expected 0, got 0</text>
<text x="420" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Both supplied tests pass.</text>
</g>
<!-- Test result; preserve reading order and text clearance. -->
<g id="test-result">
<rect x="770" y="386" width="300" height="195" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="790" y="424" font-size="24" font-weight="700" text-anchor="start" fill="#172033">New test result</text>
<text x="790" y="465" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Return the fresh test report.</text>
<text x="790" y="497" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Include it in the next input.</text>
<text x="790" y="529" font-size="20" font-weight="400" text-anchor="start" fill="#172033">The model can now report</text>
<text x="790" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#172033">what this run checked.</text>
</g>
<!-- Retest flow; preserve reading order and text clearance. -->
<g id="retest-flow">
<path data-connector="true" d="M 330,488 L 389,488" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="400,488 388,494 388,482" fill="#64748b"/>
<path data-connector="true" d="M 700,488 L 759,488" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="770,488 758,494 758,482" fill="#64748b"/>
</g>
<text x="30" y="632" font-size="21" font-weight="700" text-anchor="start" fill="#172033">The changed file and new tool results are state changes. The model weights remain fixed.</text>
</svg>
