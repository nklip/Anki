<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill:#f8f8f3; }
      .axis { stroke:#777a73; stroke-width:1.4; }
      .circle { fill:none; stroke:#b8bbb4; stroke-width:1.35; }
      .vec { stroke:#111; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
      .node { fill:#f8f8f3; stroke:#111; stroke-width:1.3; }
      .origin { fill:#f8f8f3; stroke:#444; stroke-width:1.2; }
      .sans {
        font-family: Arial, Helvetica, sans-serif;
        fill:#6c6f69;
      }
      .serif {
        font-family: Georgia, "Times New Roman", serif;
        fill:#111;
      }
      .axislabel {
        font-size:22px;
        font-weight:700;
      }
      .pointlabel {
        font-size:16px;
        font-style:italic;
      }
      .brand {
        font-size:17px;
        font-weight:700;
        letter-spacing:1.2px;
        fill:#6c6f69;
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Semantic-space circle -->
  <circle class="circle" cx="618" cy="350" r="212"/>

  <!-- Axes -->
  <line class="axis" x1="364" y1="350" x2="896" y2="350"/>
  <line class="axis" x1="618" y1="76" x2="618" y2="583"/>

  <!-- Axis labels -->
  <text class="sans axislabel" x="618" y="70" text-anchor="middle">About software</text>

  <text class="sans axislabel" x="360" y="344" text-anchor="end">
    <tspan x="360" dy="0">Not about</tspan>
    <tspan x="360" dy="25">medicine</tspan>
  </text>

  <text class="sans axislabel" x="894" y="344">
    <tspan x="894" dy="0">About</tspan>
    <tspan x="894" dy="25">medicine</tspan>
  </text>

  <text class="sans axislabel" x="618" y="602" text-anchor="middle">
    <tspan x="618" dy="0">Not about</tspan>
    <tspan x="618" dy="25">software</tspan>
  </text>

  <!-- Origin -->
  <circle class="origin" cx="618" cy="350" r="4.5"/>

  <!-- Vectors -->
  <!-- User query (0.112, 0.993) -->
  <line class="vec" x1="618" y1="350" x2="648" y2="151"/>

  <!-- Software Engineering (0.295, 0.955) -->
  <line class="vec" x1="618" y1="350" x2="689" y2="162"/>

  <!-- Medical Research (0.944, 0.331) -->
  <line class="vec" x1="618" y1="350" x2="819" y2="291"/>

  <!-- Endpoint nodes -->
  <circle class="node" cx="648" cy="141" r="10"/>
  <circle class="node" cx="690" cy="152" r="10"/>
  <circle class="node" cx="819" cy="291" r="10"/>

  <!-- Point labels -->
  <text class="serif pointlabel" x="652" y="107">
    <tspan x="652" dy="0">User query</tspan>
    <tspan x="652" dy="18">(0.112, 0.993)</tspan>
  </text>

  <text class="serif pointlabel" x="711" y="157">
    <tspan x="711" dy="0">Software Engineering</tspan>
    <tspan x="711" dy="18">(0.295, 0.955)</tspan>
  </text>

  <text class="serif pointlabel" x="837" y="273">
    <tspan x="837" dy="0">Medical Research</tspan>
    <tspan x="837" dy="18">(0.944, 0.331)</tspan>
  </text>

  <!-- Branding -->
  <text class="sans brand" x="82" y="662">ANTHROPIC</text>
</svg>
