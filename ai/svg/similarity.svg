<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    .angleArc {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }
    .vector {
      stroke: currentColor;
      stroke-width: 3;
      fill: none;
    }
    .axis {
      stroke: currentColor;
      stroke-width: 1.5;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .normal {
      font-size: 17px;
    }
    .small {
      font-size: 14px;
    }
  </style>

  <text x="400" y="32" text-anchor="middle" class="title">
    Similarity = how close vectors are in meaning
  </text>

  <!-- Similar -->
  <text x="200" y="75" text-anchor="middle" class="title">
    High similarity
  </text>

  <line class="axis" x1="80" y1="250" x2="330" y2="250"></line>
  <line class="axis" x1="110" y1="280" x2="110" y2="110"></line>

  <line class="vector" x1="110" y1="250" x2="265" y2="145"></line>
  <path class="vector" d="M251 145 L265 145 L259 158"></path>

  <line class="vector" x1="110" y1="250" x2="285" y2="170"></line>
  <path class="vector" d="M271 166 L285 170 L275 180"></path>

  <text x="245" y="125" class="normal">"cheap car"</text>
  <text x="250" y="205" class="normal">"affordable vehicle"</text>

  <!-- Angle arc is centered on the common vector origin (110,250) -->
  <path class="angleArc" d="M180.4 202.3 A85 85 0 0 1 187.3 214.7"></path>
  <line class="angleArc" stroke-width="1" x1="189" y1="218" x2="204" y2="228"></line>
  <text x="222" y="240" text-anchor="middle" class="small">
    ≈10°
  </text>

  <text x="200" y="305" text-anchor="middle" class="normal">
    Similar meaning
  </text>

  <!-- Different -->
  <text x="600" y="75" text-anchor="middle" class="title">
    Low similarity
  </text>

  <line class="axis" x1="470" y1="250" x2="730" y2="250"></line>
  <line class="axis" x1="500" y1="280" x2="500" y2="110"></line>

  <!-- Unrelated vectors shown about 90 degrees apart -->
  <line class="vector" x1="500" y1="250" x2="664" y2="206"></line>
  <path class="vector" d="M649 202 L664 206 L653 217"></path>

  <line class="vector" x1="500" y1="250" x2="456" y2="86"></line>
  <path class="vector" d="M452 101 L456 86 L467 97"></path>

  <text x="650" y="190" class="normal">"cheap car"</text>
  <text x="470" y="102" class="normal">"banana recipe"</text>

  <!-- Angle arc is centered on the common vector origin (500,250) -->
  <path class="angleArc" d="M485.8 196.9 A55 55 0 0 1 553.1 235.8"></path>
  <text x="538" y="188" text-anchor="middle" class="small">
    ≈90°
  </text>

  <text x="600" y="305" text-anchor="middle" class="normal">
    Different meaning
  </text>

  <!-- RAG pipeline -->
  <rect class="box" x="90" y="345" width="140" height="50"></rect>
  <text x="160" y="376" text-anchor="middle" class="normal">
    Query vector
  </text>

  <path class="arrow" d="M230 370 H310"></path>
  <path class="arrow" d="M300 363 L310 370 L300 377"></path>

  <rect class="box" x="315" y="345" width="170" height="50"></rect>
  <text x="400" y="376" text-anchor="middle" class="normal">
    Compare similarity
  </text>

  <path class="arrow" d="M485 370 H565"></path>
  <path class="arrow" d="M555 363 L565 370 L555 377"></path>

  <rect class="box" x="570" y="345" width="150" height="50"></rect>
  <text x="645" y="366" text-anchor="middle" class="normal">
    Retrieve highest
  </text>
  <text x="645" y="385" text-anchor="middle" class="normal">
    scores
  </text>

  <text x="400" y="423" text-anchor="middle" class="title">
    Higher similarity → more likely to retrieve the chunk
  </text>
</svg>