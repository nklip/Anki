<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
    .normal {
      font-size: 17px;
    }
    .small {
      font-size: 15px;
    }
  </style>

  <!-- Lexical -->
  <text x="200" y="35" text-anchor="middle" class="title">
    Lexical Search
  </text>

  <rect class="box" x="100" y="60" width="200" height="55"></rect>
  <text x="200" y="93" text-anchor="middle" class="normal">
    Query: "cheap car"
  </text>

  <path class="arrow" d="M200 115 V155"></path>
  <path class="arrow" d="M193 145 L200 155 L207 145"></path>

  <rect class="box" x="65" y="160" width="270" height="70"></rect>
  <text x="200" y="188" text-anchor="middle" class="normal">
    Compare words
  </text>
  <text x="200" y="212" text-anchor="middle" class="small">
    cheap ↔ cheap, car ↔ car
  </text>

  <path class="arrow" d="M200 230 V270"></path>
  <path class="arrow" d="M193 260 L200 270 L207 260"></path>

  <rect class="box" x="55" y="275" width="290" height="95"></rect>
  <text x="200" y="303" text-anchor="middle" class="normal">
    "cheap car for sale" ✓
  </text>
  <text x="200" y="333" text-anchor="middle" class="normal">
    "affordable automobile" ✗
  </text>
  <text x="200" y="357" text-anchor="middle" class="small">
    Same words matter
  </text>

  <!-- Semantic -->
  <text x="600" y="35" text-anchor="middle" class="title">
    Semantic Search
  </text>

  <rect class="box" x="500" y="60" width="200" height="55"></rect>
  <text x="600" y="93" text-anchor="middle" class="normal">
    Query: "cheap car"
  </text>

  <path class="arrow" d="M600 115 V155"></path>
  <path class="arrow" d="M593 145 L600 155 L607 145"></path>

  <rect class="box" x="465" y="160" width="270" height="70"></rect>
  <text x="600" y="188" text-anchor="middle" class="normal">
    Compare meaning
  </text>
  <text x="600" y="212" text-anchor="middle" class="small">
    embeddings + similarity
  </text>

  <path class="arrow" d="M600 230 V270"></path>
  <path class="arrow" d="M593 260 L600 270 L607 260"></path>

  <rect class="box" x="455" y="275" width="290" height="95"></rect>
  <text x="600" y="303" text-anchor="middle" class="normal">
    "cheap car for sale" ✓
  </text>
  <text x="600" y="333" text-anchor="middle" class="normal">
    "affordable automobile" ✓
  </text>
  <text x="600" y="357" text-anchor="middle" class="small">
    Same meaning matters
  </text>

  <text x="400" y="405" text-anchor="middle" class="title">
    Lexical = words | Semantic = meaning
  </text>
</svg>