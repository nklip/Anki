<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Instruction drift, including the lost-in-the-middle effect, from limited context use and steerability</title>
  <desc id="desc">A three-stage diagram shows an early constraint becoming hard to retrieve or leaving the active context as a conversation grows, so later instructions dominate the answer, followed by restatement and active-constraint checks.</desc>

  <!-- Shared visual system for the five interaction diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #b42318; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .concept-name { font-size: 21px; font-weight: 700; }
      .concept-copy { font-size: 17px; fill: #334155; }
      .plus { font-size: 34px; font-weight: 700; fill: #64748b; text-anchor: middle; }
      .stage-kicker { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .stage-title { font-size: 21px; font-weight: 700; }
      .stage-copy { font-size: 17px; fill: #334155; }
      .callout-label { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
      .callout-copy { font-size: 18px; fill: #1e293b; }
      .flow-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .arrow-shaft { stroke: #64748b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>

  <!-- Title and series position establish the comparison frame. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="38">FAILURE PATTERN 4 OF 5</text>
    <text class="title" x="50" y="82">Instruction drift</text>
    <text class="subtitle" x="50" y="110">Lost in the middle: being inside the context does not guarantee equal use.</text>
  </g>

  <!-- The two highlighted influences; these are interacting properties, not separate modules. -->
  <g id="influences">
    <rect x="50" y="138" width="520" height="130" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="82" cy="174" r="14" fill="#d97706"/>
    <text class="concept-name" x="108" y="181">Working memory (metaphor)</text>
    <text class="concept-copy" x="78" y="218">
      <tspan x="78" dy="0">The active input context for this response;</tspan>
      <tspan x="78" dy="24">access is bounded and position-sensitive.</tspan>
    </text>

    <text class="plus" x="600" y="212">+</text>

    <rect x="630" y="138" width="520" height="130" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="662" cy="174" r="14" fill="#7c3aed"/>
    <text class="concept-name" x="688" y="181">Steerability</text>
    <text class="concept-copy" x="658" y="218">
      <tspan x="658" dy="0">The response is shaped by instructions that</tspan>
      <tspan x="658" dy="24">the model successfully retrieves and applies.</tspan>
    </text>
  </g>

  <!-- Three-stage causal path; arrowheads stop at the target borders. -->
  <g id="failure-path">
    <text class="stage-kicker" x="50" y="316">READ LEFT TO RIGHT</text>

    <rect class="flow-box" x="50" y="338" width="300" height="168" rx="18"/>
    <text class="stage-kicker" x="75" y="371">BEFORE</text>
    <text class="stage-title" x="75" y="405">Critical rule appears early</text>
    <text class="stage-copy" x="75" y="438">
      <tspan x="75" dy="0">Many later turns, documents,</tspan>
      <tspan x="75" dy="23">and instructions accumulate.</tspan>
    </text>

    <line class="arrow-shaft" data-connector="true" x1="365" y1="422" x2="422" y2="422"/>
    <polygon points="440,422 422,412 422,432" fill="#64748b"/>

    <rect class="flow-box" x="440" y="338" width="320" height="168" rx="18"/>
    <text class="stage-kicker" x="465" y="371">CONTEXT PRESSURE</text>
    <text class="stage-title" x="465" y="405">Cue is buried or omitted</text>
    <text class="stage-copy" x="465" y="438">
      <tspan x="465" dy="0">Long-context retrieval may weaken;</tspan>
      <tspan x="465" dy="23">overflow can remove old tokens.</tspan>
    </text>

    <line class="arrow-shaft" data-connector="true" x1="775" y1="422" x2="832" y2="422"/>
    <polygon points="850,422 832,412 832,432" fill="#64748b"/>

    <rect x="850" y="338" width="300" height="168" rx="18" fill="#fff1f0" stroke="#d92d20" stroke-width="2"/>
    <text class="stage-kicker" x="875" y="371" fill="#b42318">RISKY OUTPUT</text>
    <text class="stage-title" x="875" y="405">Constraint is missed</text>
    <text class="stage-copy" x="875" y="438">
      <tspan x="875" dy="0">The answer fits later cues but</tspan>
      <tspan x="875" dy="23">violates an earlier requirement.</tspan>
    </text>
  </g>

  <!-- Risk and mitigation remain identical in position across the series. -->
  <g id="action-block">
    <rect x="50" y="536" width="1100" height="174" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="50" y="536" width="10" height="76" rx="5" fill="#d92d20"/>
    <text class="callout-label" x="82" y="569" fill="#b42318">WHY IT FAILS</text>
    <text class="callout-copy" x="230" y="569">Context capacity and reliable use of context are not the same thing.</text>
    <line x1="82" y1="612" x2="1118" y2="612" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="50" y="612" width="10" height="98" rx="5" fill="#137a4b"/>
    <text class="callout-label" x="82" y="650" fill="#137a4b">SAFER MOVE</text>
    <text class="callout-copy" x="230" y="650">
      <tspan x="230" dy="0">Restate critical constraints near the task, ask for an active-constraints check,</tspan>
      <tspan x="230" dy="26">or start a clean conversation with only the essential context.</tspan>
    </text>
  </g>
</svg>
