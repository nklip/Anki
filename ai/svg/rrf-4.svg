<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .bg { fill:#f8f8f3; }
    .table { fill:none; stroke:#9da098; stroke-width:1.2; }
    .headfill { fill:#deddd5; stroke:#9da098; stroke-width:1.2; }
    .th { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#111; }
    .td { font-family:Arial, Helvetica, sans-serif; font-size:18px; fill:#111; }
    .serif { font-family:Georgia, "Times New Roman", serif; fill:#111; }
    .formula { font-size:27px; }
    .italic { font-style:italic; }
    .bold { font-weight:700; }
    .brand { font-family:Arial, Helvetica, sans-serif; font-size:17px; font-weight:700; letter-spacing:1px; fill:#666b66; }
  </style>

  <rect class="bg" width="1280" height="720"/>

  <!-- RRF formula -->
  <text class="serif formula" x="302" y="110">RRF_score(d) =</text>
  <text class="serif formula" x="492" y="110">∑</text>
  <text class="serif" x="531" y="78" font-size="18">n</text>
  <text class="serif" x="491" y="137" font-size="18">i = 1</text>

  <text class="serif formula" x="596" y="110" text-anchor="middle">1</text>
  <line x1="531" y1="118" x2="662" y2="118" stroke="#111" stroke-width="1.5"/>
  <text class="serif formula" x="533" y="145">
    k + rank<tspan baseline-shift="sub" font-size="18">i</tspan>(d)
  </text>

  <text class="serif italic" x="702" y="92" font-size="23">
    <tspan x="702" dy="0">k is a constant, 60 is often used,</tspan>
    <tspan x="702" dy="22">but going to use 1 here for</tspan>
    <tspan x="702" dy="22">clearer results</tspan>
  </text>

  <!-- Table -->
  <rect class="headfill" x="98" y="222" width="1050" height="70"/>
  <rect class="table" x="98" y="222" width="1050" height="250"/>

  <!-- Vertical separators -->
  <line class="table" x1="339" y1="222" x2="339" y2="472"/>
  <line class="table" x1="421" y1="222" x2="421" y2="472"/>
  <line class="table" x1="535" y1="222" x2="535" y2="472"/>
  <line class="table" x1="1027" y1="222" x2="1027" y2="472"/>

  <!-- Horizontal separators -->
  <line class="table" x1="98" y1="292" x2="1148" y2="292"/>
  <line class="table" x1="98" y1="351" x2="1148" y2="351"/>
  <line class="table" x1="98" y1="410" x2="1148" y2="410"/>

  <!-- Headers -->
  <text class="th" x="218.5" y="264" text-anchor="middle">Text Chunk</text>

  <text class="th" x="380" y="241" text-anchor="middle">
    <tspan x="380" dy="0">Rank</tspan>
    <tspan x="380" dy="22">From</tspan>
    <tspan x="380" dy="22">Vector</tspan>
  </text>

  <text class="th" x="478" y="253" text-anchor="middle">
    <tspan x="478" dy="0">Rank from</tspan>
    <tspan x="478" dy="22">BM25</tspan>
  </text>

  <text class="th" x="781" y="264" text-anchor="middle">Score</text>
  <text class="th" x="1088" y="264" text-anchor="middle">Final Rank</text>

  <!-- Row 1 -->
  <text class="td" x="218.5" y="316" text-anchor="middle">
    <tspan x="218.5" dy="0">Section 2: Software</tspan>
    <tspan x="218.5" dy="22">Engineering...</tspan>
  </text>
  <text class="td" x="380" y="329" text-anchor="middle">1</text>
  <text class="td" x="478" y="329" text-anchor="middle">2</text>
  <text class="td" x="781" y="329" text-anchor="middle">1.0 / (1 + <tspan class="bold">1</tspan>) + 1.0 / (1 + <tspan class="bold">2</tspan>) = <tspan class="bold">0.833</tspan></text>
  <text class="td bold" x="1088" y="330" text-anchor="middle" font-size="25">1</text>

  <!-- Row 2 -->
  <text class="td" x="218.5" y="375" text-anchor="middle">
    <tspan x="218.5" dy="0">Section 6: Product</tspan>
    <tspan x="218.5" dy="22">Engineering...</tspan>
  </text>
  <text class="td" x="380" y="388" text-anchor="middle">3</text>
  <text class="td" x="478" y="388" text-anchor="middle">1</text>
  <text class="td" x="781" y="388" text-anchor="middle">1.0 / (1 + <tspan class="bold">3</tspan>) + 1.0 / (1 + <tspan class="bold">1</tspan>) = <tspan class="bold">0.75</tspan></text>
  <text class="td bold" x="1088" y="389" text-anchor="middle" font-size="25">2</text>

  <!-- Row 3 -->
  <text class="td" x="218.5" y="434" text-anchor="middle">
    <tspan x="218.5" dy="0">Section 7: Historical</tspan>
    <tspan x="218.5" dy="22">Research...</tspan>
  </text>
  <text class="td" x="380" y="447" text-anchor="middle">2</text>
  <text class="td" x="478" y="447" text-anchor="middle">3</text>
  <text class="td" x="781" y="447" text-anchor="middle">1.0 / (1 + <tspan class="bold">2</tspan>) + 1.0 / (1 + <tspan class="bold">3</tspan>) = <tspan class="bold">0.583</tspan></text>
  <text class="td bold" x="1088" y="448" text-anchor="middle" font-size="25">3</text>

  <!-- Note -->
  <text class="serif italic bold" x="614" y="505" font-size="22">
    Higher score = more relevant text chunk
  </text>

  <!-- Branding -->
  <text class="brand" x="82" y="662">ANTHROPIC</text>
</svg>
