<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .title  { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; }
    .lede   { font-size: 28px; }
    .server { font-size: 39.5px; }
    .node   { font-size: 33.5px; font-weight: 700; }
    .claude { font-size: 38.5px; }
    .api    { font-size: 31px; font-weight: 700; }
    .toolname { font-size: 24.2px; font-weight: 700; }
    .toolkind { font-size: 18.5px; font-style: italic; }
    .code   { font-family: 'Courier New', monospace; font-size: 15.5px; fill: #d0876a; }
    .brand  { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700;
              letter-spacing: 1px; fill: #6d7068; }
    .panel  { fill: #bbbbb1; }
    .card   { fill: #e3d6b4; }
    .pill   { fill: #141414; }
    .flow   { stroke: #111; stroke-width: 3; fill: none; }
    .head   { fill: #111; }
  </style>

  <rect fill="#f8faf5" width="1280" height="720"/>

  <text class="title" x="640" y="75" text-anchor="middle">MCP Servers</text>
  <text class="lede" x="640" y="114" text-anchor="middle"><tspan font-weight="700">MCP Servers</tspan> provide access to data or functionality implemented by some</text>
  <text class="lede" x="640" y="147" text-anchor="middle">outside service.</text>

  <rect class="panel" x="149" y="212" width="243" height="401" rx="4"/>
  <text class="server" x="270" y="265" text-anchor="middle">Our Server</text>

  <line class="flow" x1="407" y1="356.5" x2="446" y2="356.5"/>
  <polygon class="head" points="394,356.5 407,350 407,363"/>
  <polygon class="head" points="459,356.5 446,350 446,363"/>

  <line class="flow" x1="407" y1="569.5" x2="445" y2="569.5"/>
  <polygon class="head" points="394,569.5 407,563 407,576"/>
  <polygon class="head" points="458,569.5 445,563 445,576"/>

  <rect x="459" y="217" width="356" height="272" rx="20" fill="#f8faf5" stroke="#e3d6b4" stroke-width="5"/>
  <text class="node" x="636" y="267" text-anchor="middle">MCP Server for</text>
  <text class="node" x="636" y="305" text-anchor="middle">Github</text>

  <rect class="card" x="509" y="342" width="255" height="123" rx="14"/>
  <text class="toolkind" x="636" y="365" text-anchor="middle">tool</text>
  <text class="toolname" x="636" y="390" text-anchor="middle">get_repos()</text>
  <rect class="pill" x="526" y="404" width="108" height="47" rx="13"/>
  <text class="code" x="580" y="433" text-anchor="middle">schema</text>
  <rect class="pill" x="639" y="404" width="108" height="47" rx="13"/>
  <text class="code" x="693" y="433" text-anchor="middle">fn</text>

  <line class="flow" x1="765" y1="433.5" x2="838" y2="433.5"/>
  <polygon class="head" points="856,433.5 838,425 838,442"/>

  <rect x="857" y="394" width="265" height="79" rx="8" fill="#ba6853"/>
  <text class="api" x="988" y="445" text-anchor="middle">Github</text>

  <rect class="panel" x="461" y="527" width="351" height="86" rx="4"/>
  <text class="claude" x="636" y="583" text-anchor="middle">Claude</text>

  <text class="brand" x="83" y="661">ANTHROP\C</text>
</svg>
