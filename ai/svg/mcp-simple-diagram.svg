<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 976">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111; }
    .name { font-size: 39px; font-weight: 700; }
    .desc { font-size: 39px; }
    .note { font-size: 26px; }
    .box { fill: #fff; stroke: #111; stroke-width: 4; }
    .hub { fill: #e0eaf4; stroke: #4594e7; stroke-width: 4; }
    .link { fill: none; stroke: #9ea095; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect fill="#fff" width="2500" height="976"/>

  <!-- AI applications (left column) -->
  <rect class="box" x="208" y="191" width="517" height="173" rx="24"/>
  <text class="name" x="466" y="267" text-anchor="middle">Chat interface</text>
  <text class="desc" x="466" y="315" text-anchor="middle">Claude Desktop, LibreChat</text>

  <rect class="box" x="208" y="401" width="517" height="174" rx="24"/>
  <text class="name" x="466" y="478" text-anchor="middle">IDEs and code editors</text>
  <text class="desc" x="466" y="526" text-anchor="middle">Claude Code, Goose</text>

  <rect class="box" x="208" y="614" width="517" height="173" rx="24"/>
  <text class="name" x="466" y="690" text-anchor="middle">Other AI applications</text>
  <text class="desc" x="466" y="738" text-anchor="middle">5ire, Superinterface</text>

  <!-- MCP hub -->
  <rect class="hub" x="967" y="335" width="559" height="306" rx="14"/>
  <text class="name" x="1246" y="478" text-anchor="middle">MCP</text>
  <text class="desc" x="1246" y="526" text-anchor="middle">Standardized protocol</text>

  <!-- Data sources and tools (right column) -->
  <rect class="box" x="1770" y="191" width="517" height="173" rx="24"/>
  <text class="name" x="2028" y="267" text-anchor="middle">Data and file systems</text>
  <text class="desc" x="2028" y="315" text-anchor="middle">PostgreSQL, SQLite, GDrive</text>

  <rect class="box" x="1770" y="401" width="517" height="174" rx="24"/>
  <text class="name" x="2028" y="478" text-anchor="middle">Development tools</text>
  <text class="desc" x="2028" y="526" text-anchor="middle">Git, Sentry, etc.</text>

  <rect class="box" x="1770" y="614" width="517" height="173" rx="24"/>
  <text class="name" x="2028" y="690" text-anchor="middle">Productivity tools</text>
  <text class="desc" x="2028" y="738" text-anchor="middle">Slack, Google Maps, etc.</text>

