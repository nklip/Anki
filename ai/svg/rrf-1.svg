  <text class="td" x="160" y="425" text-anchor="middle">1</text>
  <text class="td" x="357" y="425" text-anchor="middle">Section 2: Software Engineering...</text>
  <text class="td" x="566" y="425" text-anchor="middle">0.234</text>

  <text class="td" x="160" y="485" text-anchor="middle">2</text>
  <text class="td" x="357" y="485" text-anchor="middle">Section 7: Historical Research...</text>
  <text class="td" x="566" y="485" text-anchor="middle">0.913</text>

  <text class="td" x="160" y="545" text-anchor="middle">3</text>
  <text class="td" x="357" y="545" text-anchor="middle">Section 6: Product Engineering</text>
  <text class="td" x="566" y="545" text-anchor="middle">1.327</text>

  <rect class="tablehead" x="665" y="326" width="493" height="61"/>
  <rect class="table" x="665" y="326" width="493" height="243"/>
  <line class="table" x1="740" y1="326" x2="740" y2="569"/>
  <line class="table" x1="1057" y1="326" x2="1057" y2="569"/>
  <line class="table" x1="665" y1="387" x2="1158" y2="387"/>
  <line class="table" x1="665" y1="447" x2="1158" y2="447"/>
  <line class="table" x1="665" y1="507" x2="1158" y2="507"/>

  <text class="th" x="702.5" y="363" text-anchor="middle">Rank</text>
  <text class="th" x="898.5" y="363" text-anchor="middle">Text Chunk</text>
  <text class="th" x="1107.5" y="363" text-anchor="middle">Score</text>

  <text class="td" x="702.5" y="425" text-anchor="middle">1</text>
  <text class="td" x="898.5" y="425" text-anchor="middle">Section 6: Product Engineering</text>
  <text class="td" x="1107.5" y="425" text-anchor="middle">0.184</text>

  <text class="td" x="702.5" y="485" text-anchor="middle">2</text>
  <text class="td" x="898.5" y="485" text-anchor="middle">Section 2: Software Engineering...</text>
  <text class="td" x="1107.5" y="485" text-anchor="middle">0.414</text>

  <text class="td" x="702.5" y="545" text-anchor="middle">3</text>
  <text class="td" x="898.5" y="545" text-anchor="middle">Section 7: Historical Research...</text>
  <text class="td" x="1107.5" y="545" text-anchor="middle">0.781</text>

  <text class="brand" x="82" y="662">ANTHROPIC</text>
</svg>
