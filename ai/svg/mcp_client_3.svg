<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <defs>
    <style>
      .title { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; font-weight: 800; fill: #090b0a; }
      .serif { font-family: Georgia, 'Times New Roman', serif; fill: #11110f; }
      .sans { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; fill: #11110f; }
      .arrow { stroke: #121512; fill: none; marker-end: url(#arrow); }
      .message { stroke: #171815; stroke-width: 1.5; }
      text { text-rendering: optimizeLegibility; }
    </style>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#121512"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 10 0 L 0 4 L 10 8 Z" fill="#121512"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f8f3"/>
  <circle cx="1274" cy="5" r="2.2" fill="#c98c19"/>
  <text x="640" y="96" class="title" text-anchor="middle" font-size="40">MCP Communication</text><text x="640" y="136" class="serif" text-anchor="middle" font-size="26"><tspan x="640" dy="0">The MCP specification defines different types of messages that</tspan><tspan x="640" dy="33">can be exchanged</tspan></text><rect x="138" y="250" width="330" height="332" rx="38" fill="none" stroke="#b5b7b1" stroke-width="1.4"/><text x="303" y="307" class="serif" text-anchor="middle" font-size="38">Our Server</text><rect x="174" y="345" width="260" height="150" rx="23" fill="#e4d6af"/><text x="304" y="430" class="serif" text-anchor="middle" font-size="36">MCP Client</text><rect x="885" y="345" width="270" height="150" rx="10" fill="none" stroke="#e2d1a6" stroke-width="5"/><text x="1020" y="416" class="serif" text-anchor="middle" font-size="30"><tspan x="1020" dy="0">MCP Server for</tspan><tspan x="1020" dy="33">Github</tspan></text><line x1="434" y1="382" x2="885" y2="382" class="arrow" stroke-width="2.2"/><line x1="885" y1="457" x2="434" y2="457" class="arrow" stroke-width="2.2"/><rect x="553" y="322" width="260" height="60" class="message" fill="#cd9574"/><text x="683.0" y="360.05" class="serif" text-anchor="middle" font-size="23" font-weight="700">ListToolsRequest</text><rect x="554" y="457" width="260" height="60" class="message" fill="#cd9574"/><text x="684.0" y="494.7" class="serif" text-anchor="middle" font-size="22" font-weight="700">ListToolsResult</text><text x="683" y="293" class="serif" text-anchor="middle" font-size="19" font-style="italic"><tspan x="683" dy="0">Give me a list of tools</tspan><tspan x="683" dy="21">you provide</tspan></text><text x="684" y="535" class="serif" text-anchor="middle" font-size="18" font-style="italic"><tspan x="684" dy="0">Here are the tools I can</tspan><tspan x="684" dy="21">run</tspan></text>
  <text x="82" y="663" class="sans" font-size="17" font-weight="700" letter-spacing="1.2" fill="#74766f">ANTHROPIC</text>
</svg>
