<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .normal {
      font-size: 17px;
    }
    .small {
      font-size: 14px;
    }
  </style>

  <text x="400" y="30" text-anchor="middle" class="title">
    Choosing K is a trade-off
  </text>

  <!-- Small K -->
  <rect class="box" x="50" y="75" width="300" height="200"></rect>
  <text x="200" y="110" text-anchor="middle" class="title">
    Small K
  </text>

  <text x="200" y="150" text-anchor="middle" class="normal">
    K = 1–2
  </text>

  <text x="200" y="190" text-anchor="middle" class="normal">
    Less context
  </text>

  <text x="200" y="220" text-anchor="middle" class="normal">
    Less noise
  </text>

  <text x="200" y="250" text-anchor="middle" class="small">
    but may miss useful information
  </text>

  <!-- Large K -->
  <rect class="box" x="450" y="75" width="300" height="200"></rect>
  <text x="600" y="110" text-anchor="middle" class="title">
    Large K
  </text>

  <text x="600" y="150" text-anchor="middle" class="normal">
    K = 10–20
  </text>

  <text x="600" y="190" text-anchor="middle" class="normal">
    More context
  </text>

  <text x="600" y="220" text-anchor="middle" class="normal">
    More noise
  </text>

  <text x="600" y="250" text-anchor="middle" class="small">
    and more tokens
  </text>

  <text x="400" y="325" text-anchor="middle" class="title">
    Goal: enough context, not too much noise
  </text>
</svg>