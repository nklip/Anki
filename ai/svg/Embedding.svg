<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .normal {
      font-size: 17px;
    }
    .small {
      font-size: 14px;
    }
  </style>

  <text x="400" y="32" text-anchor="middle" class="title">
    Text → Embedding → Vector
  </text>

  <rect class="box" x="40" y="65" width="180" height="65"></rect>
  <text x="130" y="92" text-anchor="middle" class="normal">
    "cheap car"
  </text>
  <text x="130" y="115" text-anchor="middle" class="small">
    human-readable text
  </text>

  <path class="arrow" d="M220 97 H285"></path>
  <path class="arrow" d="M275 90 L285 97 L275 104"></path>

  <rect class="box" x="290" y="65" width="200" height="65"></rect>
  <text x="390" y="92" text-anchor="middle" class="normal">
    Embedding model
  </text>
  <text x="390" y="115" text-anchor="middle" class="small">
    converts meaning to numbers
  </text>

  <path class="arrow" d="M490 97 H555"></path>
  <path class="arrow" d="M545 90 L555 97 L545 104"></path>

  <rect class="box" x="560" y="65" width="200" height="65"></rect>
  <text x="660" y="92" text-anchor="middle" class="normal">
    [0.21, -0.73, 0.44, ...]
  </text>
  <text x="660" y="115" text-anchor="middle" class="small">
    vector
  </text>

  <text x="400" y="180" text-anchor="middle" class="title">
    Similar meaning → nearby vectors
  </text>

  <circle cx="270" cy="265" r="8" fill="currentColor"></circle>
  <text x="250" y="245" text-anchor="end" class="normal">
    "cheap car"
  </text>

  <circle cx="305" cy="285" r="8" fill="currentColor"></circle>
  <text x="325" y="310" class="normal">
    "affordable vehicle"
  </text>

  <circle cx="610" cy="270" r="8" fill="currentColor"></circle>
  <text x="610" y="245" text-anchor="middle" class="normal">
    "banana recipe"
  </text>

  <path class="arrow" d="M280 265 Q295 260 302 277"></path>
  <text x="290" y="225" text-anchor="middle" class="small">
    close = similar meaning
  </text>

  <path class="arrow" stroke-dasharray="7 7" d="M320 280 H585"></path>
  <text x="450" y="270" text-anchor="middle" class="small">
    far = different meaning
  </text>

  <text x="400" y="365" text-anchor="middle" class="title">
    Embedding = meaning represented as numbers
  </text>
</svg>