<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <defs>
    <style>
      .title { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; font-weight: 800; fill: #090b0a; }
      .serif { font-family: Georgia, 'Times New Roman', serif; fill: #11110f; }
      .sans { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; fill: #11110f; }
      .arrow { stroke: #121512; fill: none; marker-end: url(#arrow); }
      .message { stroke: #171815; stroke-width: 1.5; }
      text { text-rendering: optimizeLegibility; }
    </style>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#121512"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 10 0 L 0 4 L 10 8 Z" fill="#121512"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f8f3"/>
  <circle cx="1274" cy="5" r="2.2" fill="#c98c19"/>
  <text x="640" y="96" class="title" text-anchor="middle" font-size="40">MCP Client</text><text x="640" y="136" class="serif" font-size="27" text-anchor="middle">Communication between the <tspan font-weight="700">Client</tspan> and <tspan font-weight="700">Server</tspan> can be done</text><text x="640" y="169" class="serif" text-anchor="middle" font-size="27">over many different protocols</text><rect x="200" y="212" width="300" height="402" rx="32" fill="none" stroke="#b5b7b1" stroke-width="1.4"/><text x="350" y="267" class="serif" text-anchor="middle" font-size="38">Our Server</text><rect x="232" y="350" width="237" height="124" rx="20" fill="#e4d6af"/><text x="350" y="425" class="serif" text-anchor="middle" font-size="39">MCP Client</text><rect x="780" y="349" width="327" height="126" rx="9" fill="none" stroke="#e2d1a6" stroke-width="5"/><text x="944" y="392" class="serif" text-anchor="middle" font-size="32"><tspan x="944" dy="0">MCP Server for</tspan><tspan x="944" dy="36">Github</tspan></text><text x="944" y="457" class="serif" text-anchor="middle" font-size="23" font-style="italic">Running locally</text><line x1="469" y1="411" x2="780" y2="411" class="arrow" stroke-width="2.2" marker-start="url(#arrow-start)"/><text x="625" y="403" class="serif" text-anchor="middle" font-size="32" font-weight="700">Websockets</text>
  <text x="82" y="663" class="sans" font-size="17" font-weight="700" letter-spacing="1.2" fill="#74766f">ANTHROPIC</text>
</svg>
