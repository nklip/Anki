<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .h1   { font-size: 36px; font-weight: 700; }
    .h2   { font-size: 34px; font-weight: 700; }
    .pill { font-size: 25.5px; }
    .brand{ font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700;
            letter-spacing: 1px; fill: #6d7068; }
    .panel { fill: #ecebe7; }
    .cream { fill: #e3d6b4; }
    .terra { fill: #ca9374; }
    .flow  { stroke: #111; stroke-width: 3; fill: none; }
    .head  { fill: #111; }
  </style>

  <rect fill="#f8faf5" width="1280" height="720"/>

  <!-- our server -->
  <rect class="panel" x="156" y="186" width="294" height="277" rx="22"/>
  <text class="h1" x="302" y="242" text-anchor="middle">Our Server</text>
  <rect class="terra" x="180" y="302" width="245" height="92" rx="14"/>
  <text class="h1" x="302" y="360" text-anchor="middle">MCP Client</text>

  <!-- branch curves -->
  <path class="flow" d="M426 348 C520 348 520 190 604 190"/>
  <polygon class="head" points="620,190 604,183.5 604,196.5"/>
  <path class="flow" d="M426 348 C520 348 520 462 604 462"/>
  <polygon class="head" points="620,462 604,455.5 604,468.5"/>

  <!-- MCP server 1 -->
  <rect class="cream" x="621" y="80" width="275" height="221" rx="16"/>
  <text class="h2" x="758" y="127" text-anchor="middle">MCP Server</text>
  <rect class="terra" x="683" y="148" width="151" height="36" rx="9"/>
  <text class="pill" x="758" y="174" text-anchor="middle">Tools</text>
  <rect class="terra" x="683" y="199" width="151" height="37" rx="9"/>
  <text class="pill" x="758" y="226" text-anchor="middle">Prompts</text>
  <rect class="terra" x="683" y="251" width="151" height="36" rx="9"/>
  <text class="pill" x="758" y="277" text-anchor="middle">Resources</text>

  <line class="flow" x1="896" y1="189.5" x2="948" y2="189.5"/>
  <polygon class="head" points="964,189.5 948,183 948,196"/>
  <rect class="cream" x="967" y="80" width="157" height="221" rx="16"/>
  <text class="h2" x="1045" y="183" text-anchor="middle">Outside</text>
  <text class="h2" x="1045" y="221" text-anchor="middle">Service</text>

  <!-- MCP server 2 -->
  <rect class="cream" x="621" y="354" width="275" height="221" rx="16"/>
  <text class="h2" x="758" y="401" text-anchor="middle">MCP Server</text>
  <rect class="terra" x="683" y="422" width="151" height="36" rx="9"/>
  <text class="pill" x="758" y="448" text-anchor="middle">Tools</text>
  <rect class="terra" x="683" y="473" width="151" height="37" rx="9"/>
  <text class="pill" x="758" y="500" text-anchor="middle">Prompts</text>
  <rect class="terra" x="683" y="525" width="151" height="36" rx="9"/>
  <text class="pill" x="758" y="551" text-anchor="middle">Resources</text>

  <line class="flow" x1="896" y1="463.5" x2="948" y2="463.5"/>
  <polygon class="head" points="964,463.5 948,457 948,470"/>
  <rect class="cream" x="966" y="354" width="158" height="221" rx="16"/>
  <text class="h2" x="1045" y="457" text-anchor="middle">Outside</text>
  <text class="h2" x="1045" y="495" text-anchor="middle">Service</text>

  <text class="brand" x="83" y="661">ANTHROP\C</text>
</svg>
