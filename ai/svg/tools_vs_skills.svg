<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .head { font-size: 70px; font-weight: 700; }
    .item { font-size: 44px; }
    .tool { fill: #b3cac1; }
    .skill{ fill: #c3c0d2; }
  </style>

  <rect fill="#f7f5f2" width="1920" height="1080"/>

  <text class="head" x="60" y="172">Tools</text>
  <text class="head" x="995" y="172">Skills</text>

  <rect class="tool"  x="59"  y="274" width="884" height="166" rx="12"/>
  <rect class="skill" x="993" y="274" width="884" height="166" rx="12"/>
  <text class="item" x="98"   y="374">Connect to Data</text>
  <text class="item" x="1032" y="374">Teach a procedure</text>

  <rect class="tool"  x="59"  y="457" width="884" height="166" rx="12"/>
  <rect class="skill" x="993" y="457" width="884" height="166" rx="12"/>
  <text class="item" x="98"   y="557">Take actions</text>
  <text class="item" x="1032" y="557">Just instructions</text>

  <rect class="tool"  x="59"  y="640" width="884" height="166" rx="12"/>
  <rect class="skill" x="993" y="640" width="884" height="166" rx="12"/>
  <text class="item" x="98"   y="740">Run code</text>
  <text class="item" x="1032" y="740">No code runs</text>

  <rect class="tool"  x="59"  y="823" width="884" height="166" rx="12"/>
  <rect class="skill" x="993" y="823" width="884" height="166" rx="12"/>
  <text class="item" x="98"   y="923">What Claude can do</text>
  <text class="item" x="1032" y="923">How you want it done</text>

</svg>
