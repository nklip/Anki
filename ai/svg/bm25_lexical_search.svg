<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    .bg { fill:#f7f7f2; }
    .divider { stroke:#d8d8cf; stroke-width:2; }
    .step { fill:#e7e3d9; }
    .box { fill:none; stroke:#8f928b; stroke-width:1.4; }
    .dark { fill:#111; stroke:#111; stroke-width:1; }
    .arrow { stroke:#111; stroke-width:5; fill:none; stroke-linecap:round; }
    .thin-arrow { stroke:#aeb0a8; stroke-width:8; fill:none; }
    .sans { font-family: Arial, Helvetica, sans-serif; fill:#111; }
    .serif { font-family: Georgia, 'Times New Roman', serif; fill:#111; }
    .mono { font-family: 'Courier New', monospace; fill:#d9aa91; }
    .h1 { font-size:22px; font-weight:600; }
    .body { font-size:20px; }
    .small { font-size:17px; }
    .tiny { font-size:13px; }
    .tableh { font-size:18px; }
    .brand { font-size:17px; font-weight:700; letter-spacing:1px; fill:#666b66; }
    .italic { font-style:italic; }
  </style>

  <rect class="bg" width="1280" height="720"/>

  <!-- left vertical arrow -->
  <path class="arrow" d="M74 68 V606"/>
  <path class="arrow" d="M57 587 L74 607 L91 587"/>

  <!-- section dividers -->
  <line class="divider" x1="104" y1="162" x2="1260" y2="162"/>
  <line class="divider" x1="104" y1="343" x2="1260" y2="343"/>
  <line class="divider" x1="104" y1="507" x2="1260" y2="507"/>

  <!-- STEP 1 -->
  <rect class="step" x="98" y="68" width="264" height="84" rx="16"/>
  <text class="serif body" x="230" y="118" text-anchor="middle">Tokenize user query</text>

  <rect class="box" x="466" y="87" width="316" height="46"/>
  <line class="box" x1="582" y1="87" x2="582" y2="133"/>
  <text class="sans small" x="524" y="109" text-anchor="middle">User’s</text>
  <text class="sans small" x="524" y="128" text-anchor="middle">Question</text>
  <text class="sans small" x="682" y="117" text-anchor="middle">a INC-2023-Q4-011</text>

  <path class="thin-arrow" d="M791 110 H815"/>
  <path fill="#aeb0a8" d="M831 110 l-18 -13 v26 z"/>

  <rect class="box" x="837" y="76" width="190" height="69"/>
  <line class="box" x1="837" y1="110" x2="1027" y2="110"/>
  <text class="sans h1" x="932" y="101" text-anchor="middle">a</text>
  <text class="sans h1" x="932" y="136" text-anchor="middle">INC-2023-Q4-011</text>

  <!-- STEP 2 -->
  <rect class="step" x="98" y="209" width="264" height="84" rx="16"/>
  <text class="serif body" x="230" y="236" text-anchor="middle">
    <tspan x="230" dy="0">See how often each term</tspan>
    <tspan x="230" dy="23">occurs across all</tspan>
    <tspan x="230" dy="23">documents</tspan>
  </text>

  <rect class="dark" x="426" y="178" width="373" height="70" rx="8"/>
  <text class="mono tiny" x="441" y="201">
    <tspan x="441" dy="0">A new incident named INC-2023-Q4-011 was</tspan>
    <tspan x="441" dy="16">found to have large impacts on a portion of</tspan>
    <tspan x="441" dy="16">our infra.</tspan>
  </text>

  <rect class="dark" x="426" y="255" width="373" height="70" rx="8"/>
  <text class="mono tiny" x="441" y="278">
    <tspan x="441" dy="0">Financial analysis revealed a complex</tspan>
    <tspan x="441" dy="16">picture. A more dedicated report will be</tspan>
    <tspan x="441" dy="16">required to get a better idea of the impact.</tspan>
  </text>

  <path class="thin-arrow" d="M807 252 H830"/>
  <path fill="#aeb0a8" d="M846 252 l-18 -13 v26 z"/>

  <rect class="box" x="852" y="200" width="340" height="103"/>
  <line class="box" x1="1018" y1="200" x2="1018" y2="303"/>
  <line class="box" x1="852" y1="234" x2="1192" y2="234"/>
  <line class="box" x1="852" y1="268" x2="1192" y2="268"/>

  <text class="sans tableh" x="935" y="224" text-anchor="middle">Term</text>
  <text class="sans tableh" x="1105" y="224" text-anchor="middle">Frequency</text>
  <text class="sans small" x="935" y="258" text-anchor="middle">a</text>
  <text class="sans small" x="1105" y="258" text-anchor="middle" font-weight="700">5</text>
  <text class="sans small" x="935" y="292" text-anchor="middle">INC-2023-Q4-011</text>
  <text class="sans small" x="1105" y="292" text-anchor="middle" font-weight="700">1</text>

  <!-- STEP 3 -->
  <rect class="step" x="98" y="382" width="264" height="84" rx="16"/>
  <text class="serif body" x="230" y="410" text-anchor="middle">
    <tspan x="230" dy="0">Terms used less</tspan>
    <tspan x="230" dy="23">frequently are given more</tspan>
    <tspan x="230" dy="23">importance</tspan>
  </text>

  <rect class="box" x="427" y="372" width="475" height="104"/>
  <line class="box" x1="582" y1="372" x2="582" y2="476"/>
  <line class="box" x1="741" y1="372" x2="741" y2="476"/>
  <line class="box" x1="427" y1="406" x2="902" y2="406"/>
  <line class="box" x1="427" y1="441" x2="902" y2="441"/>

  <text class="sans tableh" x="505" y="398" text-anchor="middle">Term</text>
  <text class="sans tableh" x="661" y="398" text-anchor="middle">Frequency</text>
  <text class="sans tableh" x="822" y="398" text-anchor="middle">Importance</text>

  <text class="sans small" x="505" y="432" text-anchor="middle">a</text>
  <text class="sans small" x="661" y="432" text-anchor="middle">5</text>
  <text class="sans small" x="822" y="432" text-anchor="middle">LOW</text>

  <text class="sans small" x="505" y="467" text-anchor="middle">INC-2023-Q4-011</text>
  <text class="sans small" x="661" y="467" text-anchor="middle">1</text>
  <text class="sans small" x="822" y="467" text-anchor="middle">HIGH</text>

  <!-- STEP 4 -->
  <rect class="step" x="98" y="526" width="264" height="84" rx="16"/>
  <text class="serif body" x="230" y="553" text-anchor="middle">
    <tspan x="230" dy="0">Find the text chunk that</tspan>
    <tspan x="230" dy="23">uses the higher weighted</tspan>
    <tspan x="230" dy="23">terms more often</tspan>
  </text>

  <rect class="dark" x="426" y="531" width="373" height="70" rx="8"/>
  <text class="mono tiny" x="441" y="554">
    <tspan x="441" dy="0">A new incident named INC-2023-Q4-011 was</tspan>
    <tspan x="441" dy="16">found to have large impacts on a portion of</tspan>
    <tspan x="441" dy="16">our infra.</tspan>
  </text>

  <text class="serif body italic" x="818" y="558">
    <tspan x="818" dy="0">Contains more instances of the</tspan>
    <tspan x="818" dy="28">higher-weighted terms</tspan>
  </text>

  <text class="sans brand" x="82" y="662">ANTHROPIC</text>
</svg>
