<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" preserveAspectRatio="none" markerWidth="1.6" markerHeight="2.75"
            refX="0" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b7b9b1"/>
    </marker>
    <style>
      .bg { fill:#f8f8f3; }
      .headerbox { fill:#e8d8a9; }
      .headertext { font-family:Georgia, "Times New Roman", serif; font-size:27px; font-weight:700; fill:#111; }

      .table { fill:none; stroke:#9da098; stroke-width:1.2; }
      .headfill { fill:#deddd5; stroke:#9da098; stroke-width:1.2; }

      .th { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#111; }
      .td { font-family:Arial, Helvetica, sans-serif; font-size:18px; fill:#111; }

      .arrow { stroke:#b7b9b1; stroke-width:7; fill:none; marker-end:url(#arrow-gray); }
      .brand { font-family:Arial, Helvetica, sans-serif; font-size:17px; font-weight:700; letter-spacing:1px; fill:#666b66; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Top index headers -->
  <rect class="headerbox" x="115" y="31" width="509" height="52" rx="9"/>
  <text class="headertext" x="369.5" y="66" text-anchor="middle">VectorIndex</text>

  <rect class="headerbox" x="658" y="31" width="507" height="52" rx="9"/>
  <text class="headertext" x="911.5" y="66" text-anchor="middle">BM25Index</text>

  <!-- Down arrows -->
  <line class="arrow" x1="370" y1="88" x2="370" y2="115"/>
  <line class="arrow" x1="912" y1="88" x2="912" y2="115"/>

  <!-- LEFT TABLE: VectorIndex -->
  <rect class="headfill" x="173" y="131" width="392" height="35"/>
  <rect class="table" x="173" y="131" width="392" height="139"/>

  <line class="table" x1="248" y1="131" x2="248" y2="270"/>
  <line class="table" x1="173" y1="166" x2="565" y2="166"/>
  <line class="table" x1="173" y1="200" x2="565" y2="200"/>
  <line class="table" x1="173" y1="235" x2="565" y2="235"/>

  <text class="th" x="210.5" y="155" text-anchor="middle">Rank</text>
  <text class="th" x="406.5" y="155" text-anchor="middle">Text Chunk</text>

  <text class="td" x="210.5" y="190" text-anchor="middle">1</text>
  <text class="td" x="406.5" y="190" text-anchor="middle">Section 2: Software Engineering...</text>

  <text class="td" x="210.5" y="224" text-anchor="middle">2</text>
  <text class="td" x="406.5" y="224" text-anchor="middle">Section 7: Historical Research...</text>

  <text class="td" x="210.5" y="259" text-anchor="middle">3</text>
  <text class="td" x="406.5" y="259" text-anchor="middle">Section 6: Product Engineering</text>

  <!-- RIGHT TABLE: BM25Index -->
  <rect class="headfill" x="713" y="131" width="397" height="35"/>
  <rect class="table" x="713" y="131" width="397" height="139"/>

  <line class="table" x1="790" y1="131" x2="790" y2="270"/>
  <line class="table" x1="713" y1="166" x2="1110" y2="166"/>
  <line class="table" x1="713" y1="200" x2="1110" y2="200"/>
  <line class="table" x1="713" y1="235" x2="1110" y2="235"/>

  <text class="th" x="751.5" y="155" text-anchor="middle">Rank</text>
  <text class="th" x="950" y="155" text-anchor="middle">Text Chunk</text>

  <text class="td" x="751.5" y="190" text-anchor="middle">1</text>
  <text class="td" x="950" y="190" text-anchor="middle">Section 6: Product Engineering</text>

  <text class="td" x="751.5" y="224" text-anchor="middle">2</text>
  <text class="td" x="950" y="224" text-anchor="middle">Section 2: Software Engineering...</text>

  <text class="td" x="751.5" y="259" text-anchor="middle">3</text>
  <text class="td" x="950" y="259" text-anchor="middle">Section 7: Historical Research...</text>

  <!-- Arrows into merged rank table -->
  <line class="arrow" x1="543" y1="290" x2="543" y2="316"/>
  <line class="arrow" x1="733" y1="290" x2="733" y2="316"/>

  <!-- MERGED RANK TABLE -->
  <rect class="headfill" x="318" y="348" width="646" height="60"/>
  <rect class="table" x="318" y="348" width="646" height="240"/>

  <line class="table" x1="533" y1="348" x2="533" y2="588"/>
  <line class="table" x1="748" y1="348" x2="748" y2="588"/>

  <line class="table" x1="318" y1="408" x2="964" y2="408"/>
  <line class="table" x1="318" y1="468" x2="964" y2="468"/>
  <line class="table" x1="318" y1="528" x2="964" y2="528"/>

  <!-- merged headers -->
  <text class="th" x="425.5" y="385" text-anchor="middle">Text Chunk</text>

  <text class="th" x="640.5" y="373" text-anchor="middle">
    <tspan x="640.5" dy="0">Rank From Vector</tspan>
    <tspan x="640.5" dy="23">Index</tspan>
  </text>

  <text class="th" x="856" y="373" text-anchor="middle">
    <tspan x="856" dy="0">Rank from BM25</tspan>
    <tspan x="856" dy="23">Index</tspan>
  </text>

  <!-- Row 1 -->
  <text class="td" x="425.5" y="436" text-anchor="middle">
    <tspan x="425.5" dy="0">Section 2: Software</tspan>
    <tspan x="425.5" dy="23">Engineering...</tspan>
  </text>
  <text class="td" x="640.5" y="448" text-anchor="middle">1</text>
  <text class="td" x="856" y="448" text-anchor="middle">2</text>

  <!-- Row 2 -->
  <text class="td" x="425.5" y="495" text-anchor="middle">
    <tspan x="425.5" dy="0">Section 7: Historical</tspan>
    <tspan x="425.5" dy="23">Research...</tspan>
  </text>
  <text class="td" x="640.5" y="508" text-anchor="middle">2</text>
  <text class="td" x="856" y="508" text-anchor="middle">3</text>

  <!-- Row 3 -->
  <text class="td" x="425.5" y="555" text-anchor="middle">
    <tspan x="425.5" dy="0">Section 6: Product</tspan>
    <tspan x="425.5" dy="23">Engineering...</tspan>
  </text>
  <text class="td" x="640.5" y="568" text-anchor="middle">3</text>
  <text class="td" x="856" y="568" text-anchor="middle">1</text>

  <!-- Branding -->
  <text class="brand" x="82" y="662">ANTHROPIC</text>
</svg>
