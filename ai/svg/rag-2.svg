<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 300">
  <style>
    text { font-family: Arial, sans-serif; fill: currentColor; }
    .box { fill: none; stroke: currentColor; stroke-width: 2; rx: 9; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; }
    .title { font-size: 18px; font-weight: bold; }
    .label { font-size: 15px; }
  </style>

  <text x="20" y="30" class="title">1. Indexing</text>

  <rect class="box" x="20" y="50" width="120" height="50"></rect>
  <text x="80" y="80" text-anchor="middle" class="label">Documents</text>

  <path class="arrow" d="M140 75 H180"></path>
  <path class="arrow" d="M170 68 L180 75 L170 82"></path>

  <rect class="box" x="185" y="50" width="120" height="50"></rect>
  <text x="245" y="80" text-anchor="middle" class="label">Chunks</text>

  <path class="arrow" d="M305 75 H345"></path>
  <path class="arrow" d="M335 68 L345 75 L335 82"></path>

  <rect class="box" x="350" y="50" width="120" height="50"></rect>
  <text x="410" y="80" text-anchor="middle" class="label">Embeddings</text>

  <path class="arrow" d="M470 75 H510"></path>
  <path class="arrow" d="M500 68 L510 75 L500 82"></path>

  <rect class="box" x="515" y="50" width="150" height="50"></rect>
  <text x="590" y="80" text-anchor="middle" class="label">Vector DB</text>

  <text x="20" y="160" class="title">2. Retrieval + Generation</text>

  <rect class="box" x="20" y="185" width="100" height="50"></rect>
  <text x="70" y="215" text-anchor="middle" class="label">Question</text>

  <path class="arrow" d="M120 210 H155"></path>
  <path class="arrow" d="M145 203 L155 210 L145 217"></path>

  <rect class="box" x="160" y="185" width="110" height="50"></rect>
  <text x="215" y="215" text-anchor="middle" class="label">Embedding</text>

  <path class="arrow" d="M270 210 H305"></path>
  <path class="arrow" d="M295 203 L305 210 L295 217"></path>

  <rect class="box" x="310" y="185" width="125" height="50"></rect>
  <text x="372" y="207" text-anchor="middle" class="label">Similarity</text>
  <text x="372" y="225" text-anchor="middle" font-size="13">search</text>

  <path class="arrow" d="M435 210 H470"></path>
  <path class="arrow" d="M460 203 L470 210 L460 217"></path>

  <rect class="box" x="475" y="185" width="110" height="50"></rect>
  <text x="530" y="207" text-anchor="middle" class="label">Relevant</text>
  <text x="530" y="225" text-anchor="middle" font-size="13">chunks</text>

  <path class="arrow" d="M585 210 H620"></path>
  <path class="arrow" d="M610 203 L620 210 L610 217"></path>

  <rect class="box" x="625" y="185" width="55" height="50"></rect>
  <text x="652" y="215" text-anchor="middle" class="label">LLM</text>

  <path class="arrow" d="M680 210 H710"></path>
  <path class="arrow" d="M700 203 L710 210 L700 217"></path>

  <rect class="box" x="715" y="185" width="90" height="50"></rect>
  <text x="760" y="215" text-anchor="middle" class="label">Answer</text>
</svg>