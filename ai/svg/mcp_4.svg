<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .title  { font-family: Arial, Helvetica, sans-serif; font-size: 39.5px; font-weight: 700; }
    .lede   { font-size: 28px; }
    .server { font-size: 39.5px; }
    .node   { font-size: 33.5px; font-weight: 700; }
    .claude { font-size: 38.5px; }
    .toolname { font-size: 21px; font-weight: 700; }
    .toolkind { font-size: 18.5px; font-style: italic; }
    .code   { font-family: 'Courier New', monospace; font-size: 15.5px; fill: #d0876a; }
    .brand  { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700;
              letter-spacing: 1px; fill: #6d7068; }
    .panel  { fill: #bbbbb1; }
    .card   { fill: #e3d6b4; }
    .pill   { fill: #141414; }
    .flow   { stroke: #111; stroke-width: 3; fill: none; }
    .head   { fill: #111; }
  </style>

  <rect fill="#f8faf5" width="1280" height="720"/>

  <text class="title" x="640" y="75" text-anchor="middle">Model Context Protocol</text>
  <text class="lede" x="640" y="147" text-anchor="middle">Shifts the burden of tool definitions and execution onto <tspan font-weight="700">MCP Servers.</tspan></text>

  <!-- our server -->
  <rect class="panel" x="281" y="208" width="298" height="401" rx="26"/>
  <text class="server" x="430" y="263" text-anchor="middle">Our Server</text>

  <rect class="card" x="304" y="340" width="253" height="137" rx="14"/>
  <text class="toolkind" x="430" y="361" text-anchor="middle">tool</text>
  <text class="toolname" x="430" y="387" text-anchor="middle">get_repos()</text>
  <rect class="pill" x="320" y="408" width="107" height="54" rx="13"/>
  <text class="code" x="373" y="440" text-anchor="middle">schema</text>
  <rect class="pill" x="433" y="408" width="107" height="54" rx="13"/>
  <text class="code" x="486" y="440" text-anchor="middle">fn</text>

  <!-- links -->
  <line class="flow" x1="595" y1="352.5" x2="634" y2="352.5"/>
  <polygon class="head" points="582,352.5 595,346 595,359"/>
  <polygon class="head" points="647,352.5 634,346 634,359"/>

  <line class="flow" x1="595" y1="565.5" x2="633" y2="565.5"/>
  <polygon class="head" points="582,565.5 595,559 595,572"/>
  <polygon class="head" points="646,565.5 633,559 633,572"/>

  <!-- MCP server -->
  <rect x="646" y="213" width="357" height="271" rx="20" fill="#f8faf5" stroke="#e3d6b4" stroke-width="5"/>
  <text class="node" x="824" y="263" text-anchor="middle">MCP Server</text>

  <!-- Claude -->
  <rect class="panel" x="649" y="523" width="351" height="86" rx="10"/>
  <text class="claude" x="824" y="578" text-anchor="middle">Claude</text>

  <text class="brand" x="83" y="661">ANTHROP\C</text>
</svg>
