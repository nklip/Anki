<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .axis {
      stroke: currentColor;
      stroke-width: 1.5;
    }
    .dash {
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      fill: none;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .normal {
      font-size: 16px;
    }
    .small {
      font-size: 14px;
    }
  </style>

  <text x="380" y="30" text-anchor="middle" class="title">
    Similar meanings are close together
  </text>

  <line class="axis" x1="80" y1="290" x2="700" y2="290"></line>
  <line class="axis" x1="100" y1="310" x2="100" y2="70"></line>

  <!-- Password cluster -->
  <circle cx="250" cy="180" r="8" fill="currentColor"></circle>
  <text x="235" y="160" text-anchor="end" class="normal">
    reset password
  </text>

  <circle cx="285" cy="205" r="8" fill="currentColor"></circle>
  <text x="305" y="210" class="normal">
    change credentials
  </text>

  <circle cx="270" cy="160" r="10" fill="none" stroke="currentColor" stroke-width="3"></circle>
  <text x="290" y="138" class="normal">
    query
  </text>

  <path class="dash" d="M270 160 L250 180"></path>
  <path class="dash" d="M270 160 L285 205"></path>

  <!-- Distant point -->
  <circle cx="590" cy="115" r="8" fill="currentColor"></circle>
  <text x="590" y="92" text-anchor="middle" class="normal">
    lunch menu
  </text>

  <path class="dash" d="M270 160 L590 115"></path>

  <text x="275" y="250" text-anchor="middle" class="small">
    close → similar
  </text>

  <text x="475" y="150" text-anchor="middle" class="small">
    far → less similar
  </text>

  <text x="380" y="335" text-anchor="middle" class="title">
    Vector DB finds the nearest vectors
  </text>
</svg>