<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 180">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
    .label {
      font-size: 18px;
    }
  </style>

  <text x="600" y="30" text-anchor="middle" class="title">
    RAG Retrieval Flow
  </text>

  <!-- Question -->
  <rect class="box" x="20" y="70" width="140" height="50"></rect>
  <text x="90" y="102" text-anchor="middle" class="label">Question</text>

  <line class="arrow" x1="160" y1="95" x2="200" y2="95"></line>
  <path class="arrow" d="M190 88 L200 95 L190 102"></path>

  <!-- Embedding -->
  <rect class="box" x="200" y="70" width="140" height="50"></rect>
  <text x="270" y="102" text-anchor="middle" class="label">Embedding</text>

  <line class="arrow" x1="340" y1="95" x2="380" y2="95"></line>
  <path class="arrow" d="M370 88 L380 95 L370 102"></path>

  <!-- Similarity search -->
  <rect class="box" x="380" y="70" width="170" height="50"></rect>
  <text x="465" y="102" text-anchor="middle" class="label">Similarity search</text>

  <line class="arrow" x1="550" y1="95" x2="590" y2="95"></line>
  <path class="arrow" d="M580 88 L590 95 L580 102"></path>

  <!-- Rank results -->
  <rect class="box" x="590" y="70" width="150" height="50"></rect>
  <text x="665" y="102" text-anchor="middle" class="label">Rank results</text>

  <line class="arrow" x1="740" y1="95" x2="780" y2="95"></line>
  <path class="arrow" d="M770 88 L780 95 L770 102"></path>

  <!-- Top K -->
  <rect class="box" x="780" y="70" width="120" height="50"></rect>
  <text x="840" y="102" text-anchor="middle" class="label">Top K</text>

  <line class="arrow" x1="900" y1="95" x2="940" y2="95"></line>
  <path class="arrow" d="M930 88 L940 95 L930 102"></path>

  <!-- Relevant chunks -->
  <rect class="box" x="940" y="70" width="180" height="50"></rect>
  <text x="1030" y="102" text-anchor="middle" class="label">Relevant chunks</text>

  <line class="arrow" x1="1120" y1="95" x2="1160" y2="95"></line>
  <path class="arrow" d="M1150 88 L1160 95 L1150 102"></path>

  <!-- LLM -->
  <rect class="box" x="1160" y="70" width="80" height="50"></rect>
  <text x="1200" y="102" text-anchor="middle" class="label">LLM</text>
</svg>