<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 5 of the RAG pipeline: assembling instructions, labelled chunks and the question into one prompt</title>
  <desc id="desc">Three ingredients on the left — instructions, the selected chunks with their identifiers, and the question — flow into one assembled prompt on the right, shown as the literal text the model receives. Two closing cards state the ordering rule and the need to name the passages as the authoritative source.</desc>

  <!-- Shared visual system for the seven RAG pipeline diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #6d28d9; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .kicker { font-size: 14px; font-weight: 700; letter-spacing: 1.3px; fill: #64748b; }
      .part-copy { font-size: 14px; fill: #334155; }
      .prompt-rule { font-size: 15px; font-weight: 700; fill: #4c1d95; }
      .prompt-chunk { font-size: 15px; fill: #0e7490; }
      .prompt-ask { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .note { font-size: 14px; fill: #64748b; }
      .card-label { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
      .card-title { font-size: 18px; font-weight: 700; }
      .card-copy { font-size: 14px; fill: #334155; }
      .shaft { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>

  <g id="heading">
    <text class="eyebrow" x="50" y="38">STEP 5 OF 6 — ASSEMBLE</text>
    <text class="title" x="50" y="82">Build one prompt out of three parts</text>
    <text class="subtitle" x="50" y="110">The model never sees your index. It sees this text, so every label, rule and position in it is a design decision.</text>
  </g>

  <!-- The three ingredients, kept separate so the prompt on the right reads as an assembly. -->
  <g id="parts">
    <rect x="50" y="160" width="320" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="kicker" x="72" y="190">WHAT GOES IN</text>

    <rect x="72" y="208" width="276" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text class="kicker" x="92" y="234" fill="#6d28d9">1 · INSTRUCTIONS</text>
    <text class="part-copy" x="92" y="262">
      <tspan x="92" dy="0">Answer only from the passages,</tspan>
      <tspan x="92" dy="20">cite the id you used, and say so</tspan>
      <tspan x="92" dy="20">when they fall short.</tspan>
    </text>

    <rect x="72" y="334" width="276" height="110" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text class="kicker" x="92" y="360" fill="#0e7490">2 · SELECTED CHUNKS</text>
    <text class="part-copy" x="92" y="388">
      <tspan x="92" dy="0">c1 — retry cap per merchant</tspan>
      <tspan x="92" dy="20">c2 — HTTP 429 and reset</tspan>
      <tspan x="92" dy="20">c3 — back-off rule</tspan>
    </text>

    <rect x="72" y="460" width="276" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="kicker" x="92" y="486">3 · THE QUESTION</text>
    <text class="part-copy" x="92" y="514">Why did my payment stop retrying?</text>
  </g>

  <line class="shaft" data-connector="true" x1="376" y1="360" x2="394" y2="360"/>
  <polygon points="406,360 394,352 394,368" fill="#64748b"/>

  <!-- The literal prompt text. Colour marks which ingredient each line came from. -->
  <g id="prompt">
    <rect x="410" y="160" width="740" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="kicker" x="432" y="190">THE ASSEMBLED PROMPT — WHAT THE MODEL ACTUALLY RECEIVES</text>

    <rect x="432" y="208" width="696" height="280" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text class="prompt-rule" x="456" y="240">Use only the passages below to answer.</text>
    <text class="prompt-chunk" x="456" y="280">[c1] Each payment is retried up to five times.</text>
    <text class="prompt-chunk" x="485" y="302">The retry cap is counted per merchant.</text>
    <text class="prompt-chunk" x="456" y="328">[c2] Going over it returns HTTP 429 and a reset time.</text>
    <text class="prompt-chunk" x="456" y="354">[c3] Clients must wait for that time before retrying.</text>
    <text class="prompt-ask" x="456" y="396">Question: Why did my payment stop retrying?</text>
    <text class="prompt-rule" x="456" y="436">Cite the passage id behind every claim.</text>
    <text class="prompt-rule" x="456" y="458">If the passages do not answer it, say so instead of guessing.</text>

    <text class="note" x="432" y="518">
      <tspan x="432" dy="0">Every part of this is a choice: which chunks, in what order, under which labels, with which rules.</tspan>
      <tspan x="432" dy="20">Nothing about the index reaches the model except the text you put here.</tspan>
    </text>
  </g>

  <!-- Two rules that decide whether the assembled prompt is actually used as intended. -->
  <g id="rules">
    <rect x="50" y="590" width="540" height="120" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text class="card-label" x="76" y="620" fill="#92400e">RULE 1 · ORDER</text>
    <text class="card-title" x="76" y="650">Do not bury the best passage</text>
    <text class="card-copy" x="76" y="676">
      <tspan x="76" dy="0">Evidence placed in the middle of a long context is used less reliably</tspan>
      <tspan x="76" dy="20">than the same evidence placed at its beginning or its end.</tspan>
    </text>

    <rect x="610" y="590" width="540" height="120" rx="16" fill="#fff1f0" stroke="#d92d20" stroke-width="2"/>
    <text class="card-label" x="636" y="620" fill="#b42318">RULE 2 · AUTHORITY</text>
    <text class="card-title" x="636" y="650">Say which source wins</text>
    <text class="card-copy" x="636" y="676">
      <tspan x="636" dy="0">The model still carries its own trained associations. If the prompt does</tspan>
      <tspan x="636" dy="20">not name the passages as authoritative, the two can blend silently.</tspan>
    </text>
  </g>
</svg>
