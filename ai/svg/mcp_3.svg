  <text class="li" x="105" y="318">number of tool schemas and</text>
  <text class="li" x="105" y="358">functions</text>
  <circle cx="86" cy="391" r="6" fill="#111"/>
  <text class="li bold" x="105" y="399">This is all code that we (developers)</text>
  <text class="li bold" x="105" y="439">have to write, test, and maintain</text>

