<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">MCP client sequence diagram</title>
  <desc id="description">A sequence diagram showing a user request followed by MCP ListToolsRequest and ListToolsResult messages.</desc>

  <rect width="1280" height="720" fill="#f8faf5"/>
  <circle cx="1274" cy="5" r="2.2" fill="#e39631"/>

  <!-- Participant headers measured from mcp_client_8.jpg. -->
  <g fill="#ecebe7" stroke="#686963" stroke-width="2.2">
    <rect x="41" y="79" width="186.5" height="46" rx="7"/>
    <rect x="245" y="79" width="186.5" height="46" rx="7"/>
    <rect x="448" y="79" width="186.5" height="46" rx="7"/>
    <rect x="651" y="79" width="186.5" height="46" rx="7"/>
    <rect x="854" y="79" width="186.5" height="46" rx="7"/>
    <rect x="1057" y="79" width="186.5" height="46" rx="7"/>
  </g>

  <g font-family="Times New Roman, Times, serif" font-size="30" fill="#11120f" text-anchor="middle">
    <text x="135" y="111">User</text>
    <text x="338" y="111">Our Server</text>
    <text x="541" y="111">MCP Client</text>
    <text x="744" y="111">MCP Server</text>
    <text x="947" y="111">Claude</text>
    <text x="1150" y="111">Github</text>
  </g>

  <!-- Lifelines intentionally follow the slightly offset positions in the JPEG. -->
  <g stroke="#898b84" stroke-width="1.25" stroke-dasharray="5 5">
    <line x1="142" y1="130" x2="142" y2="608"/>
    <line x1="343" y1="130" x2="343" y2="608"/>
    <line x1="545.5" y1="130" x2="545.5" y2="608"/>
    <line x1="746.5" y1="130" x2="746.5" y2="608"/>
    <line x1="948" y1="130" x2="948" y2="608"/>
    <line x1="1150" y1="130" x2="1150" y2="608"/>
  </g>

  <!-- Message rectangles are drawn first so the arrow shafts sit on their top edges. -->
  <g fill="#ca9374" stroke="#24221c" stroke-width="1.2">
    <rect x="571" y="174" width="149" height="25"/>
    <rect x="574" y="256" width="148" height="25"/>
  </g>

  <!-- Explicit arrowhead polygons reproduce the JPEG geometry without marker overlap. -->
  <g fill="#151713" stroke="#151713" stroke-linecap="square">
    <line x1="147" y1="174" x2="322" y2="174" stroke-width="2"/>
    <path d="M322 169.5 L336 174 L322 178.5 Z" stroke="none"/>

    <line x1="352" y1="174" x2="526" y2="174" stroke-width="2"/>
    <path d="M526 169.5 L540 174 L526 178.5 Z" stroke="none"/>

    <line x1="554" y1="174" x2="729" y2="174" stroke-width="2"/>
    <path d="M728 168.5 L744 174 L728 179.5 Z" stroke="none"/>

    <line x1="572" y1="255" x2="740" y2="255" stroke-width="2"/>
    <path d="M572 249.5 L556 255 L572 260.5 Z" stroke="none"/>
  </g>

  <g font-family="Times New Roman, Times, serif" fill="#10110e" text-anchor="middle">
    <text x="238" y="198" font-size="22" font-style="italic">
      <tspan x="238">What repositories</tspan>
      <tspan x="238" dy="25">do I have?</tspan>
    </text>
    <text x="445" y="198" font-size="22" font-style="italic">
      <tspan x="445">I need a list of tools</tspan>
      <tspan x="445" dy="25">to send to Claude</tspan>
    </text>
    <text x="645.5" y="192" font-size="17" font-weight="700">ListToolsRequest</text>
    <text x="647.5" y="273" font-size="17" font-weight="700">ListToolsResult</text>
  </g>

  <text x="82" y="663" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.1" fill="#74766f">ANTHROPIC</text>

  <!-- Faint presentation controls visible along the bottom of the source JPEG. -->
  <g fill="#f4f5f2" stroke="#aeb1ad" stroke-width="0.7" opacity="0.34">
    <rect x="379" y="711" width="16" height="8" rx="3"/><rect x="397" y="711" width="17" height="8" rx="3"/>
    <rect x="416" y="711" width="17" height="8" rx="3"/><rect x="435" y="711" width="17" height="8" rx="3"/>
    <rect x="454" y="711" width="17" height="8" rx="3"/><rect x="473" y="711" width="17" height="8" rx="3"/>
    <rect x="492" y="711" width="17" height="8" rx="3"/><rect x="511" y="711" width="17" height="8" rx="3"/>
    <rect x="530" y="711" width="17" height="8" rx="3"/><rect x="549" y="711" width="17" height="8" rx="3"/>
    <rect x="568" y="711" width="17" height="8" rx="3"/><rect x="587" y="711" width="17" height="8" rx="3"/>
    <rect x="606" y="711" width="17" height="8" rx="3"/><rect x="625" y="711" width="17" height="8" rx="3"/>
    <rect x="644" y="711" width="17" height="8" rx="3"/><rect x="663" y="711" width="17" height="8" rx="3"/>
    <rect x="682" y="711" width="17" height="8" rx="3"/><rect x="701" y="711" width="17" height="8" rx="3"/>
    <rect x="720" y="711" width="17" height="8" rx="3"/><rect x="739" y="711" width="17" height="8" rx="3"/>
    <rect x="758" y="711" width="17" height="8" rx="3"/><rect x="777" y="711" width="17" height="8" rx="3"/>
    <rect x="796" y="711" width="17" height="8" rx="3"/><rect x="815" y="711" width="17" height="8" rx="3"/>
    <rect x="834" y="711" width="17" height="8" rx="3"/><rect x="853" y="711" width="17" height="8" rx="3"/>
    <rect x="872" y="711" width="17" height="8" rx="3"/><rect x="891" y="711" width="10" height="8" rx="3"/>
  </g>
</svg>
