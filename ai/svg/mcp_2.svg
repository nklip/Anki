<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .server { font-size: 38px; }
    .api    { font-size: 36px; font-weight: 700; }
    .toolname { font-size: 24.5px; font-weight: 700; }
    .toolkind { font-size: 18.5px; font-style: italic; }
    .who    { font-size: 23.5px; font-weight: 700; }
    .body   { font-size: 19px; }
    .btn    { font-size: 19px; font-weight: 700; }
    .code   { font-family: 'Courier New', monospace; font-size: 15.5px; fill: #d0876a; }
    .brand  { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700;
              letter-spacing: 1px; fill: #6d7068; }
    .chrome { fill: #ecebe7; stroke: #111; stroke-width: 2.5; }
    .screen { fill: #f8faf5; stroke: #111; stroke-width: 2; }
    .bubble { fill: #ecebe7; stroke: #111; stroke-width: 2; }
    .panel  { fill: #bbbbb1; }
    .card   { fill: #e3d6b4; }
    .pill   { fill: #141414; }
    .wire   { stroke: #111; stroke-width: 2; fill: none; }
    .head   { fill: #111; }
  </style>

  <rect fill="#f8faf5" width="1280" height="720"/>

  <!-- chat client -->
  <rect class="chrome" x="140" y="101" width="311" height="469" rx="14"/>
  <rect class="screen" x="156" y="121" width="279" height="365"/>

  <path class="bubble" d="M196 257 H415 V318 L428 332 L415 346 V363 H196 Z"/>
  <text class="who"  x="209" y="287">You</text>
  <text class="body" x="209" y="308" textLength="185" lengthAdjust="spacingAndGlyphs">What open pull requests</text>
  <text class="body" x="209" y="329" textLength="171" lengthAdjust="spacingAndGlyphs">are there across all my</text>
  <text class="body" x="209" y="350" textLength="98" lengthAdjust="spacingAndGlyphs">repositories?</text>

  <path class="bubble" d="M393 382 H174 V414 L161 428 L174 442 V459 H393 Z"/>
  <text class="who"  x="187" y="412">AI</text>
  <text class="body" x="187" y="446">…</text>

  <rect class="screen" x="156" y="502" width="204" height="49"/>
  <rect x="366" y="502" width="69" height="49" fill="#e3d6b4" stroke="#111" stroke-width="2"/>
  <text class="btn" x="400" y="534" text-anchor="middle">Send</text>

  <!-- our server -->
  <rect class="panel" x="495" y="102" width="291" height="468" rx="32"/>
  <text class="server" x="644" y="157" text-anchor="middle">Our Server</text>

  <line class="wire" x1="451" y1="253" x2="512" y2="253"/>
  <line class="wire" x1="451" y1="424" x2="512" y2="424"/>

  <rect class="card" x="512" y="183" width="257" height="141" rx="16"/>
  <text class="toolkind" x="640" y="206" text-anchor="middle">tool</text>
  <text class="toolname" x="640" y="232" text-anchor="middle" textLength="115" lengthAdjust="spacingAndGlyphs">get_repos()</text>
  <rect class="pill" x="530" y="253" width="108" height="54" rx="13"/>
  <text class="code" x="584" y="288" text-anchor="middle">schema</text>
  <rect class="pill" x="643" y="253" width="108" height="54" rx="13"/>
  <text class="code" x="697" y="288" text-anchor="middle">fn</text>

  <rect class="card" x="511" y="354" width="257" height="141" rx="16"/>
  <text class="toolkind" x="640" y="377" text-anchor="middle">tool</text>
  <text class="toolname" x="640" y="403" text-anchor="middle" textLength="200" lengthAdjust="spacingAndGlyphs">get_pull_requests()</text>
  <rect class="pill" x="529" y="425" width="108" height="53" rx="13"/>
  <text class="code" x="583" y="459" text-anchor="middle">schema</text>
  <rect class="pill" x="642" y="425" width="108" height="53" rx="13"/>
  <text class="code" x="696" y="459" text-anchor="middle">fn</text>

  <!-- wiring to the API -->
  <path class="wire" d="M751 280 H824 V451 H750"/>
  <line class="wire" x1="824" y1="360.5" x2="881" y2="360.5"/>
  <polygon class="head" points="897,360.5 881,354 881,367"/>

  <rect x="899" y="314" width="263" height="93" rx="12" fill="#ba6853"/>
  <text class="api" x="1030" y="374" text-anchor="middle">Github API</text>

  <text class="brand" x="83" y="661">ANTHROP\C</text>
</svg>
