<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2042 1004">

  <style>
    text { fill: #111; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 68px; font-weight: 700; }
    .card  { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 700; }
    .body  { font-family: Georgia, 'Times New Roman', serif; font-size: 41px; }
    .b     { font-weight: 700; }
  </style>

  <rect width="2042" height="1004" fill="#fbfbf9"/>

  <text class="title" x="1021" y="158" text-anchor="middle">MCP Server Primitives</text>

  <!-- Tools -->
  <rect x="63" y="276" width="595" height="658" rx="29" fill="#eadfc4"/>
  <text class="card" x="100" y="376" textLength="124" lengthAdjust="spacingAndGlyphs">Tools</text>
  <text class="body b" x="100" y="446" textLength="451" lengthAdjust="spacingAndGlyphs">Model-controlled: Claude</text>
  <text class="body"   x="100" y="495" textLength="438" lengthAdjust="spacingAndGlyphs">decides when to call these.</text>
  <text class="body"   x="100" y="544" textLength="453" lengthAdjust="spacingAndGlyphs">Results are used by <tspan class="b">Claude</tspan></text>
  <text class="body"   x="100" y="674" textLength="154" lengthAdjust="spacingAndGlyphs">Used for:</text>
  <circle cx="120" cy="710" r="9" fill="#111"/>
  <text class="body"   x="155" y="722" textLength="288" lengthAdjust="spacingAndGlyphs">Giving additional</text>
  <text class="body"   x="155" y="771" textLength="378" lengthAdjust="spacingAndGlyphs">functionality to Claude</text>

  <!-- Resources -->
  <rect x="725" y="276" width="595" height="658" rx="29" fill="#d3a184"/>
  <text class="card" x="762" y="376" textLength="245" lengthAdjust="spacingAndGlyphs">Resources</text>
  <text class="body b" x="762" y="446" textLength="438" lengthAdjust="spacingAndGlyphs">App-controlled: Our app</text>
  <text class="body"   x="762" y="495" textLength="438" lengthAdjust="spacingAndGlyphs">decides when to call these.</text>
  <text class="body"   x="762" y="544" textLength="430" lengthAdjust="spacingAndGlyphs">Results are used primarily</text>
  <text class="body"   x="762" y="593" textLength="199" lengthAdjust="spacingAndGlyphs">by <tspan class="b">our app</tspan>.</text>
  <text class="body"   x="762" y="674" textLength="154" lengthAdjust="spacingAndGlyphs">Used for:</text>
  <circle cx="782" cy="710" r="9" fill="#111"/>
  <text class="body"   x="817" y="722" textLength="410" lengthAdjust="spacingAndGlyphs">Getting data into our app</text>
  <circle cx="782" cy="759" r="9" fill="#111"/>
  <text class="body"   x="817" y="771" textLength="296" lengthAdjust="spacingAndGlyphs">Adding context to</text>
  <text class="body"   x="817" y="820" textLength="155" lengthAdjust="spacingAndGlyphs">messages</text>

  <!-- Prompts -->
  <rect x="1387" y="276" width="595" height="658" rx="29" fill="#c1705a"/>
  <text class="card" x="1424" y="376" textLength="195" lengthAdjust="spacingAndGlyphs">Prompts</text>
  <text class="body b" x="1424" y="446" textLength="448" lengthAdjust="spacingAndGlyphs">User-controlled: The user</text>
  <text class="body"   x="1424" y="495" textLength="434" lengthAdjust="spacingAndGlyphs">decides when to use these.</text>
  <text class="body"   x="1424" y="684" textLength="154" lengthAdjust="spacingAndGlyphs">Used for:</text>
  <circle cx="1444" cy="721" r="9" fill="#111"/>
  <text class="body"   x="1479" y="733" textLength="392" lengthAdjust="spacingAndGlyphs">Workflows to run based</text>
  <text class="body"   x="1479" y="782" textLength="417" lengthAdjust="spacingAndGlyphs">on user input, like a slash</text>
  <text class="body"   x="1479" y="831" textLength="387" lengthAdjust="spacingAndGlyphs">command, button click,</text>
  <text class="body"   x="1479" y="880" textLength="251" lengthAdjust="spacingAndGlyphs">or menu option</text>
</svg>
