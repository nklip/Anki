<text class="body2" x="727" y="187"><tspan x="727">A discrete, indivisible unit of a physical quantity, especially</tspan><tspan x="727" dy="34">energy. From Latin "quantus" meaning "how much."</tspan></text>
<text class="body2" x="727" y="328"><tspan x="727">Relating to quantum mechanics or quantum physics, a</tspan><tspan x="727" dy="34">branch of physics dealing with atomic and subatomic</tspan><tspan x="727" dy="34">particles.</tspan></text>
<text class="body2" x="727" y="518">Extremely small or occurring at the subatomic level.</text>
<text class="body2" x="727" y="639"><tspan x="727">Relating to quantum computing, which uses</tspan><tspan x="727" dy="34">quantum-mechanical phenomena to perform operations on</tspan><tspan x="727" dy="34">data.</tspan></text>
<text class="brand" x="82" y="866">ANTHROPIC</text>
