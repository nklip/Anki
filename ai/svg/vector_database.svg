<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    .title {
      font-size: 21px;
      font-weight: bold;
    }
    .normal {
      font-size: 17px;
    }
    .small {
      font-size: 14px;
    }
  </style>

  <text x="400" y="30" text-anchor="middle" class="title">
    Vector Database = store vectors + search similar vectors
  </text>

  <!-- Documents -->
  <rect class="box" x="30" y="70" width="170" height="60"></rect>
  <text x="115" y="95" text-anchor="middle" class="normal">
    Document chunks
  </text>
  <text x="115" y="117" text-anchor="middle" class="small">
    text
  </text>

  <path class="arrow" d="M200 100 H270"></path>
  <path class="arrow" d="M260 93 L270 100 L260 107"></path>

  <!-- Embedding -->
  <rect class="box" x="275" y="70" width="170" height="60"></rect>
  <text x="360" y="95" text-anchor="middle" class="normal">
    Embedding model
  </text>
  <text x="360" y="117" text-anchor="middle" class="small">
    text → vectors
  </text>

  <path class="arrow" d="M445 100 H515"></path>
  <path class="arrow" d="M505 93 L515 100 L505 107"></path>

  <!-- DB -->
  <rect class="box" x="520" y="55" width="240" height="105"></rect>
  <text x="640" y="82" text-anchor="middle" class="title">
    Vector DB
  </text>
  <text x="640" y="108" text-anchor="middle" class="small">
    [0.21, -0.44, ...] + text
  </text>
  <text x="640" y="130" text-anchor="middle" class="small">
    [0.19, -0.40, ...] + text
  </text>
  <text x="640" y="152" text-anchor="middle" class="small">
    [-0.62, 0.11, ...] + text
  </text>

  <!-- Query -->
  <rect class="box" x="30" y="230" width="170" height="60"></rect>
  <text x="115" y="255" text-anchor="middle" class="normal">
    User question
  </text>
  <text x="115" y="277" text-anchor="middle" class="small">
    "I forgot my password"
  </text>

  <path class="arrow" d="M200 260 H270"></path>
  <path class="arrow" d="M260 253 L270 260 L260 267"></path>

  <rect class="box" x="275" y="230" width="170" height="60"></rect>
  <text x="360" y="255" text-anchor="middle" class="normal">
    Query embedding
  </text>
  <text x="360" y="277" text-anchor="middle" class="small">
    question → vector
  </text>

  <path class="arrow" d="M445 260 H515"></path>
  <path class="arrow" d="M505 253 L515 260 L505 267"></path>

  <rect class="box" x="520" y="220" width="240" height="80"></rect>
  <text x="640" y="250" text-anchor="middle" class="normal">
    Similarity search
  </text>
  <text x="640" y="275" text-anchor="middle" class="small">
    find nearest vectors
  </text>

  <path class="arrow" d="M640 300 V350"></path>
  <path class="arrow" d="M633 340 L640 350 L647 340"></path>

  <rect class="box" x="500" y="355" width="280" height="55"></rect>
  <text x="640" y="378" text-anchor="middle" class="normal">
    Most relevant chunks
  </text>
  <text x="640" y="399" text-anchor="middle" class="small">
    returned to RAG / LLM
  </text>

  <text x="250" y="390" text-anchor="middle" class="title">
    Search by meaning
  </text>
</svg>