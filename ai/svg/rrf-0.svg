<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style>
      .bg { fill:#f8f8f3; }
      .table { fill:none; stroke:#9da098; stroke-width:1.2; }
      .headfill { fill:#deddd5; stroke:#9da098; stroke-width:1.2; }
      .cream { fill:#e8d8a9; }
      .merge { fill:#cf936f; }
      .sans { font-family:Arial, Helvetica, sans-serif; fill:#111; }
      .serif { font-family:Georgia, "Times New Roman", serif; fill:#111; }
      .th { font-size:18px; font-weight:700; }
      .query { font-size:18px; font-weight:700; }
      .boxTitle { font-size:27px; font-weight:700; }
      .boxSub { font-size:18px; font-style:italic; font-weight:700; }
      .resultText { font-size:26px; }
      .mergeText { font-size:28px; font-weight:700; }
      .brand { font-family:Arial, Helvetica, sans-serif; font-size:17px; font-weight:700; letter-spacing:1px; fill:#666b66; }
      .link { stroke:#111; stroke-width:1.5; fill:none; }
      .sheet { fill:#f8f8f3; stroke:#111; stroke-width:1.2; }
      .front { fill:#e6e4e0; stroke:#111; stroke-width:1.2; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- User question -->
  <rect class="headfill" x="380" y="76" width="111" height="84"/>
  <rect class="table" x="491" y="76" width="409" height="84"/>
  <text class="sans th" x="435.5" y="111" text-anchor="middle">
    <tspan x="435.5" dy="0">User’s</tspan>
    <tspan x="435.5" dy="23">Question</tspan>
  </text>
  <text class="sans query" x="695.5" y="126" text-anchor="middle">
    What happened with INC-2023-Q4-011?
  </text>

  <!-- Split connector -->
  <path class="link" d="M640 160
                         C640 185 590 186 540 205
                         C515 214 503 223 503 234"/>
  <path class="link" d="M640 160
                         C640 185 690 186 740 205
                         C765 214 778 223 778 234"/>

  <!-- Search boxes -->
  <rect class="cream" x="372" y="218" width="260" height="97" rx="16"/>
  <text class="serif boxTitle" x="502" y="266" text-anchor="middle">Semantic Search</text>
  <text class="serif boxSub" x="502" y="289" text-anchor="middle">(Embeddings + Vector DB)</text>

  <rect class="cream" x="648" y="218" width="260" height="97" rx="16"/>
  <text class="serif boxTitle" x="778" y="266" text-anchor="middle">Lexical Search</text>
  <text class="serif boxSub" x="778" y="289" text-anchor="middle">(Classic text search)</text>

  <!-- connectors to results -->
  <line class="link" x1="502" y1="315" x2="502" y2="350"/>
  <line class="link" x1="778" y1="315" x2="778" y2="350"/>

  <!-- Left result stack -->
  <path class="sheet" d="M435 350 H571 V412
                         Q500 422 435 412 Z"/>
  <path class="sheet" d="M423 358 H559 V420
                         Q490 430 423 420 Z"/>
  <path class="front" d="M411 366 H550 V440
                         Q480 451 411 440 Z"/>
  <text class="serif resultText" x="480" y="414" text-anchor="middle">Results</text>

  <!-- Right result stack -->
  <path class="sheet" d="M710 350 H846 V412
                         Q775 422 710 412 Z"/>
  <path class="sheet" d="M699 358 H835 V420
                         Q765 430 699 420 Z"/>
  <path class="front" d="M687 366 H824 V440
                         Q755 451 687 440 Z"/>
  <text class="serif resultText" x="756" y="414" text-anchor="middle">Results</text>

  <!-- Merge connectors -->
  <path class="link" d="M480 446
                         C480 465 520 463 590 480
                         C620 487 640 493 640 496"/>
  <path class="link" d="M755 446
                         C755 465 720 463 690 477
                         C660 489 640 493 640 496"/>

  <!-- Merge results -->
  <rect class="merge" x="510" y="496" width="261" height="99" rx="16"/>
  <text class="serif mergeText" x="640.5" y="555" text-anchor="middle">Merge results</text>

  <!-- Branding -->
  <text class="brand" x="82" y="662">ANTHROPIC</text>
</svg>
