<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1648 928">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="5.5" markerHeight="5.5" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc8365"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" markerWidth="5.5" markerHeight="5.5" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#aeb0a8"/>
    </marker>
    <style>
      .bg{fill:#f8f8f3}
      .sans{font-family:Arial,Helvetica,sans-serif;fill:#444}
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#111}
      .top{font-family:Arial,Helvetica,sans-serif;fill:#4a4a47;font-size:20px;font-weight:700}
      .title{font-family:Arial,Helvetica,sans-serif;fill:#333;font-size:34px}
      .body{font-family:Georgia,'Times New Roman',serif;fill:#111;font-size:30px}
      .body2{font-family:Georgia,'Times New Roman',serif;fill:#111;font-size:24px}
      .small{font-family:Georgia,'Times New Roman',serif;fill:#111;font-size:20px}
      .italic{font-style:italic}
      .brand{font-family:Arial,Helvetica,sans-serif;fill:#6d7068;font-size:24px;font-weight:700;letter-spacing:1px}
      .soft{fill:#e8e5e1}
      .cream{fill:#efe3c4}
      .peach{fill:#d8b393}
      .outline{fill:none;stroke:#aeb0a8;stroke-width:1.5}
      .thin{stroke:#aeb0a8;stroke-width:2;fill:none}
      .dash{stroke:#333;stroke-width:2;stroke-dasharray:2 6;fill:none}
      .accent{stroke:#c98b62;stroke-width:2;fill:none}
      .arrowline{stroke:#cc8365;stroke-width:6;fill:none;marker-end:url(#arrow)}
      .arrowgray{stroke:#aeb0a8;stroke-width:4;fill:none;marker-end:url(#arrowGray)}
    </style>
  </defs>
<rect class="bg" width="1648" height="928"/><polygon points="63,13 363,13 383,38 363,63 63,63" fill="#efe2c7" opacity="0.65"/>
<text class="top" x="218.0" y="42" text-anchor="middle">Request to Server</text>
<polygon points="366,13 666,13 686,38 666,63 366,63 384,38" fill="#dfbd9f" opacity="0.65"/>
<text class="top" x="521.0" y="31" text-anchor="middle"><tspan x="521.0" dy="0">Request to</tspan><tspan x="521.0" dy="25">Anthropic API</tspan></text>
<polygon points="665,13 965,13 985,38 965,63 665,63 683,38" fill="#d9957c" opacity="0.65"/>
<text class="top" x="820.0" y="42" text-anchor="middle">Model Processing</text>
<polygon points="969,13 1269,13 1289,38 1269,63 969,63 987,38" fill="#eee1c7" opacity="1"/>
<text class="top" x="1124.0" y="42" text-anchor="middle">Response to Server</text>
<polygon points="1264,13 1564,13 1584,38 1564,63 1264,63 1282,38" fill="#cfd2cc" opacity="0.65"/>
<text class="top" x="1419.0" y="42" text-anchor="middle">Response to Client</text>
<rect x="58" y="385" width="523" height="173" rx="28" class="soft"/>
<text class="body" x="98" y="459" font-weight="700">
  <tspan x="98" dy="0">Output text placed into an</tspan>
  <tspan x="98" dy="42">“assistant” message</tspan>
</text>

<rect x="639" y="184" width="225" height="605" rx="20" class="cream"/>
<text class="title" x="752" y="236" text-anchor="middle">Your Server</text>
<rect x="662" y="294" width="179" height="399" rx="20" class="peach"/>
<text class="title" x="752" y="487" text-anchor="middle">Anthropic</text>
<text class="title" x="752" y="522" text-anchor="middle">SDK</text>

<rect x="891" y="356" width="498" height="229" class="outline"/>
<line x1="1054" y1="356" x2="1054" y2="585" class="thin"/>
<line x1="891" y1="414" x2="1389" y2="414" class="thin"/>
<line x1="891" y1="471" x2="1389" y2="471" class="thin"/>
<line x1="891" y1="528" x2="1389" y2="528" class="thin"/>
<text class="body2" x="973" y="395" text-anchor="middle" font-weight="700">Data</text>
<text class="body2" x="1221" y="395" text-anchor="middle" font-weight="700">Purpose</text>
<text class="body2" x="973" y="452" text-anchor="middle">Message</text>
<text class="small" x="1221" y="435" text-anchor="middle"><tspan x="1221">Single “message” that contains the</tspan><tspan x="1221" dy="24">generated text</tspan></text>
<text class="body2" x="973" y="510" text-anchor="middle">Usage</text>
