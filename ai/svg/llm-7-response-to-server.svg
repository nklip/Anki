<text class="body2" x="973" y="568" text-anchor="middle">Stop Reason</text>
<text class="small" x="1221" y="551" text-anchor="middle"><tspan x="1221">Why the model stopped</tspan><tspan x="1221" dy="24">generation</tspan></text>

<line x1="1426" y1="610" x2="871" y2="610" class="arrowline"/>
<rect x="1426" y="184" width="190" height="605" rx="20" class="cream"/>
<text class="title" x="1521" y="480" text-anchor="middle">Anthropic</text>
<text class="title" x="1521" y="516" text-anchor="middle">API</text>
<text class="brand" x="82" y="866">ANTHROPIC</text>
</svg>