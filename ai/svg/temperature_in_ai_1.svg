<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .title  { font-size: 57px; font-weight: 700; }
    .ylab   { font-size: 27px; }
    .axname { font-size: 33px; }
    .cap    { font-size: 41.5px; font-weight: 700; }
    .sub    { font-size: 39px; font-style: italic; }
    .tok    { font-family: Arial, Helvetica, sans-serif; font-size: 24px; }
    .val    { font-family: Arial, Helvetica, sans-serif; font-size: 21px; }
    .brand  { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700;
              letter-spacing: 2px; fill: #6d7068; }
    .axis   { stroke: #111; stroke-width: 4; }
    .head   { fill: #111; }
    .bar    { fill: #c06d4d; }
  </style>

  <rect fill="#f4faf4" width="1920" height="1080"/>

  <text class="title" x="960" y="135" text-anchor="middle">Temperature changes how likely</text>
  <text class="title" x="960" y="196" text-anchor="middle">each token is to be selected</text>

  <!-- low temperature -->
  <rect class="bar" x="224" y="418" width="60" height="311.5"/>
  <line class="axis" x1="194.5" y1="731.5" x2="194.5" y2="328"/>
  <polygon class="head" points="194.5,304 185.5,330 203.5,330"/>
  <line class="axis" x1="148" y1="731.5" x2="846" y2="731.5"/>
  <polygon class="head" points="872,731.5 846,722.5 846,740.5"/>
  <text class="val" x="254" y="410" text-anchor="middle">100%</text>
  <text class="val" x="340" y="715" text-anchor="middle">0%</text>
  <text class="val" x="426" y="715" text-anchor="middle">0%</text>
  <text class="val" x="512" y="715" text-anchor="middle">0%</text>
  <text class="val" x="598" y="715" text-anchor="middle">0%</text>
  <text class="val" x="684" y="715" text-anchor="middle">0%</text>
  <text class="val" x="770" y="715" text-anchor="middle">0%</text>
  <text class="tok" x="254" y="752" text-anchor="middle">about</text>
  <text class="tok" x="340" y="752" text-anchor="middle">would</text>
  <text class="tok" x="426" y="752" text-anchor="middle">of</text>
  <text class="tok" x="512" y="752" text-anchor="middle">is</text>
  <text class="tok" x="598" y="752" text-anchor="middle">when</text>
  <text class="tok" x="684" y="752" text-anchor="middle">makes</text>
  <text class="tok" x="770" y="752" text-anchor="middle">we</text>
  <text class="ylab" x="180" y="340" text-anchor="end">Selection</text>
  <text class="ylab" x="180" y="368" text-anchor="end">probability</text>
  <text class="axname" x="847" y="773">Token</text>

  <!-- high temperature -->
  <rect class="bar" x="1102" y="482" width="60" height="243.5"/>
  <rect class="bar" x="1188" y="509" width="60" height="216.5"/>
  <rect class="bar" x="1274" y="587" width="60" height="138.5"/>
  <rect class="bar" x="1360" y="625" width="60" height="100.5"/>
  <rect class="bar" x="1446" y="625" width="60" height="100.5"/>
  <rect class="bar" x="1532" y="637" width="60" height="88.5"/>
  <rect class="bar" x="1618" y="658" width="60" height="67.5"/>
  <line class="axis" x1="1073.5" y1="727.5" x2="1073.5" y2="323"/>
  <polygon class="head" points="1073.5,299 1064.5,325 1082.5,325"/>
  <line class="axis" x1="1027" y1="727.5" x2="1723" y2="727.5"/>
  <polygon class="head" points="1749,727.5 1723,718.5 1723,736.5"/>
  <text class="val" x="1132" y="472" text-anchor="middle">23%</text>
  <text class="val" x="1218" y="504" text-anchor="middle">18%</text>
  <text class="val" x="1304" y="578" text-anchor="middle">15%</text>
  <text class="val" x="1390" y="618" text-anchor="middle">12%</text>
  <text class="val" x="1476" y="618" text-anchor="middle">12%</text>
  <text class="val" x="1562" y="630" text-anchor="middle">11%</text>
  <text class="val" x="1648" y="650" text-anchor="middle">9%</text>
  <text class="tok" x="1132" y="748" text-anchor="middle">about</text>
  <text class="tok" x="1218" y="748" text-anchor="middle">would</text>
  <text class="tok" x="1304" y="748" text-anchor="middle">of</text>
  <text class="tok" x="1390" y="748" text-anchor="middle">is</text>
  <text class="tok" x="1476" y="748" text-anchor="middle">when</text>
  <text class="tok" x="1562" y="748" text-anchor="middle">makes</text>
  <text class="tok" x="1648" y="748" text-anchor="middle">we</text>
  <text class="ylab" x="1057" y="326" text-anchor="end">Selection</text>
  <text class="ylab" x="1057" y="354" text-anchor="end">probability</text>
  <text class="axname" x="1726" y="769">Token</text>

  <rect x="200" y="804" width="624" height="108" rx="16" fill="#e4d4af"/>
  <text class="cap" x="512" y="852" text-anchor="middle">Low temperature</text>
  <text class="sub" x="512" y="892" text-anchor="middle">More deterministic output</text>

  <rect x="1077" y="804" width="623" height="108" rx="16" fill="#e4d4af"/>
  <text class="cap" x="1388" y="852" text-anchor="middle">High temperature</text>
  <text class="sub" x="1388" y="892" text-anchor="middle">More random output</text>

  <text class="brand" x="95" y="1006">ANTHROP\C</text>
</svg>
