<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .node  { font-size: 48px; }
    .ev    { font-size: 29.5px; font-weight: 700; }
    .de    { font-size: 31px; }
    .lead  { font-size: 44px; }
    .brand { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700;
             letter-spacing: 2px; fill: #6d7068; }
    .lane  { fill: #e4e6e1; stroke: #7c7f77; stroke-width: 3.5; }
    .life  { stroke: #7c7f77; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    .rule  { stroke: #111; stroke-width: 2.5; }
    .cell  { stroke: #aeb2a7; stroke-width: 1.5; }
    .brace { fill: none; stroke: #111; stroke-width: 4; stroke-linecap: round; }
  </style>

  <rect fill="#f5f7f3" width="1920" height="1080"/>

  <rect class="lane" x="1527.5" y="57.5" width="250" height="87" rx="12"/>
  <text class="node" x="1652.5" y="116" text-anchor="middle">Claude</text>
  <line class="life" x1="1652.5" y1="145" x2="1652.5" y2="1018"/>

  <line class="rule" x1="680" y1="175.5" x2="1652.5" y2="175.5"/>
  <rect class="cell" x="725.5" y="93" width="296" height="84" fill="#e2d3ae"/>
  <rect class="cell" x="1022.5" y="93" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="145.5" text-anchor="middle">MessageStart</text>
  <text class="de" x="1244" y="145.5" text-anchor="middle">A new message is being sent</text>

  <line class="rule" x1="680" y1="291.5" x2="1652.5" y2="291.5"/>
  <rect class="cell" x="725.5" y="209" width="296" height="84" fill="#cc946f"/>
  <rect class="cell" x="1022.5" y="209" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="261.5" text-anchor="middle">ContentBlockStart</text>
  <text class="de" x="1244" y="242.5" text-anchor="middle">Start of a new block, which</text>
  <text class="de" x="1244" y="279.5" text-anchor="middle">contains text, tool use, or other</text>

  <line class="rule" x1="680" y1="410.5" x2="1652.5" y2="410.5"/>
  <rect class="cell" x="725.5" y="328" width="296" height="84" fill="#c06d50"/>
  <rect class="cell" x="1022.5" y="328" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="380.5" text-anchor="middle">ContentBlockDelta</text>
  <text class="de" x="1244" y="361.5" text-anchor="middle">Chunk related to the latest</text>
  <text class="de" x="1244" y="398.5" text-anchor="middle">content block that was started</text>

  <line class="rule" x1="680" y1="526.5" x2="1652.5" y2="526.5"/>
  <rect class="cell" x="725.5" y="444" width="296" height="84" fill="#c06d50"/>
  <rect class="cell" x="1022.5" y="444" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="496.5" text-anchor="middle">ContentBlockDelta</text>
  <text class="de" x="1244" y="477.5" text-anchor="middle">Chunk related to the latest</text>
  <text class="de" x="1244" y="514.5" text-anchor="middle">content block that was started</text>

  <line class="rule" x1="680" y1="641.5" x2="1652.5" y2="641.5"/>
  <rect class="cell" x="725.5" y="559" width="296" height="84" fill="#c06d50"/>
  <rect class="cell" x="1022.5" y="559" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="611.5" text-anchor="middle">ContentBlockDelta</text>
  <text class="de" x="1244" y="592.5" text-anchor="middle">Chunk related to the latest</text>
  <text class="de" x="1244" y="629.5" text-anchor="middle">content block that was started</text>

  <line class="rule" x1="680" y1="756.5" x2="1652.5" y2="756.5"/>
  <rect class="cell" x="725.5" y="674" width="296" height="84" fill="#bab9af"/>
  <rect class="cell" x="1022.5" y="674" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="726.5" text-anchor="middle">ContentBlockStop</text>
  <text class="de" x="1244" y="707.5" text-anchor="middle">The current content block has</text>
  <text class="de" x="1244" y="744.5" text-anchor="middle">been completed</text>

  <line class="rule" x1="680" y1="871.5" x2="1652.5" y2="871.5"/>
  <rect class="cell" x="725.5" y="789" width="296" height="84" fill="#deddd3"/>
  <rect class="cell" x="1022.5" y="789" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="841.5" text-anchor="middle">MessageDelta</text>
  <text class="de" x="1244" y="822.5" text-anchor="middle">The current message is</text>
  <text class="de" x="1244" y="859.5" text-anchor="middle">complete</text>

  <line class="rule" x1="680" y1="987.5" x2="1652.5" y2="987.5"/>
  <rect class="cell" x="725.5" y="905" width="296" height="84" fill="#deddd3"/>
  <rect class="cell" x="1022.5" y="905" width="443" height="84" fill="#fbfdf9"/>
  <text class="ev" x="874" y="957.5" text-anchor="middle">MessageStop</text>
  <text class="de" x="1244" y="938.5" text-anchor="middle">End of information about the</text>
  <text class="de" x="1244" y="975.5" text-anchor="middle">current message</text>

  <path class="brace" d="M695 327 C665 327 665 345 665 365 L665 462 C665 478 650 480 632 485
                         C650 490 665 492 665 508 L665 606 C665 626 665 644 695 644"/>
  <text class="lead" x="622" y="476" text-anchor="end">These contain the</text>
  <text class="lead" x="622" y="522" text-anchor="end">actual generated text</text>

  <text class="brand" x="97" y="1006">ANTHROP\C</text>
</svg>
