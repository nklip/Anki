<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #111; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 700; }
    .q     { font-family: Arial, Helvetica, sans-serif; font-size: 21.3px; font-weight: 700; }
    .a     { font-size: 23.4px; }
    .brand { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700;
             letter-spacing: 1px; fill: #6d7068; }
    .cell  { fill: #e2e2d8; }
    .sep   { stroke: #9b9d96; stroke-width: 1.5; }
  </style>

  <rect fill="#f8faf5" width="1280" height="720"/>

  <text class="title" x="640" y="94" text-anchor="middle">Common Questions</text>

  <!-- row 1 -->
  <rect class="cell" x="112" y="168" width="389" height="141"/>
  <text class="q" x="126" y="198">Who authors the MCP Server?</text>
  <text class="a" x="525" y="218">Anyone! Often the service provider itself will make their own MCP</text>
  <text class="a" x="525" y="246">implementation. You can make a MCP server to wrap up access to</text>
  <text class="a" x="525" y="274">some service.</text>
  <line class="sep" x1="505" y1="309.5" x2="1181" y2="309.5"/>

  <!-- row 2 -->
  <rect class="cell" x="113" y="310" width="387" height="140"/>
  <text class="q" x="126" y="342">How is using an MCP Server</text>
  <text class="q" x="126" y="367">different from just calling a</text>
  <text class="q" x="126" y="392">service’s API directly?</text>
  <text class="a" x="525" y="353">MCP Servers provide tool schemas + functions.</text>
  <text class="a" x="525" y="395">If you want to directly call an API directly, you’ll be authoring those</text>
  <text class="a" x="525" y="423">on your own.</text>
  <line class="sep" x1="505" y1="451.5" x2="1181" y2="451.5"/>

  <!-- row 3 -->
  <rect class="cell" x="113" y="452" width="387" height="141"/>
  <text class="q" x="126" y="484">Sounds like MCP Servers and tool</text>
  <text class="q" x="126" y="509">use are the same thing.</text>
  <text class="a" x="525" y="517">MCP Servers provide tool schemas + functions already defined for</text>
  <text class="a" x="525" y="545">you.</text>

  <text class="brand" x="83" y="661">ANTHROP\C</text>
</svg>
