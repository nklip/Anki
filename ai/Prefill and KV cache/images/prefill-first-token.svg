<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="981.818181818181818" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Prefill processes the prompt and prepares the first choice</title><desc id="desc">The prompt A B C is processed together with a causal mask. A triangular permission grid shows that each position can read itself and earlier positions only. All layers cache A B C, while the final position produces logits for a separate token selection step that chooses D. D is not yet cached.</desc>
<!-- Shared typography and palette; blue identifies the state under discussion. -->
<defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:18px}.muted{fill:#64748b}.blue{fill:#2563eb}.mono{font-family:monospace;font-size:22px}</style></defs>
<rect width="1100" height="720" fill="white"/>
<text x="40" y="48" class="title" text-anchor="start">Prefill processes the prompt and prepares the first choice</text>
<text x="40" y="82" class="small muted" text-anchor="start">Example: prompt A B C. Letters stand for token IDs, not necessarily individual characters.</text>
<!-- Prompt tokens are aligned with the causal mask columns; blocked cells explicitly label the causal rule. -->
<rect id="prompt-causal-mask" x="40" y="113" width="440" height="365" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="151" class="head" text-anchor="start">Known prompt → process together</text>
<rect  x="204" y="178" width="72" height="46" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="240.0" y="208" class="head" text-anchor="middle">A</text>
<rect  x="284" y="178" width="72" height="46" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="320.0" y="208" class="head" text-anchor="middle">B</text>
<rect  x="364" y="178" width="72" height="46" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="400.0" y="208" class="head" text-anchor="middle">C</text>
<text x="62" y="280" class="small" text-anchor="start">Reads →</text>
<text x="163" y="277" class="head" text-anchor="middle">A</text>
<rect  x="204" y="245" width="70" height="49" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="239" y="277" class="small blue" text-anchor="middle">yes</text>
<rect  x="284" y="245" width="70" height="49" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="319" y="277" class="small muted" text-anchor="middle">—</text>
<rect  x="364" y="245" width="70" height="49" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="399" y="277" class="small muted" text-anchor="middle">—</text>
<text x="163" y="336" class="head" text-anchor="middle">B</text>
<rect  x="204" y="304" width="70" height="49" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="239" y="336" class="small blue" text-anchor="middle">yes</text>
<rect  x="284" y="304" width="70" height="49" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="319" y="336" class="small blue" text-anchor="middle">yes</text>
<rect  x="364" y="304" width="70" height="49" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="399" y="336" class="small muted" text-anchor="middle">—</text>
<text x="163" y="395" class="head" text-anchor="middle">C</text>
<rect  x="204" y="363" width="70" height="49" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="239" y="395" class="small blue" text-anchor="middle">yes</text>
<rect  x="284" y="363" width="70" height="49" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="319" y="395" class="small blue" text-anchor="middle">yes</text>
<rect  x="364" y="363" width="70" height="49" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="399" y="395" class="small blue" text-anchor="middle">yes</text>
<text x="62" y="426" class="head" text-anchor="start">Causal mask</text>
<text x="62" y="456" class="small" text-anchor="start">A position reads itself and earlier positions.</text>
<path data-connector="true" d="M480 292 H539" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="536,285 550,292 536,299" fill="#2563eb"/>
<rect id="model-run-and-cache" x="550" y="113" width="510" height="365" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="574" y="151" class="head" text-anchor="start">Run through every model layer</text>
<text x="574" y="190" class="small" text-anchor="start">Positions can run in parallel within a layer.</text>
<text x="574" y="218" class="small" text-anchor="start">Later layers still depend on earlier layers.</text>
<text x="574" y="269" class="head" text-anchor="start">After prefill: saved at every layer</text>
<rect  x="574" y="293" width="133" height="68" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="640.5" y="320" class="head blue" text-anchor="middle">A</text>
<text x="640.5" y="347" class="small" text-anchor="middle">key + value</text>
<rect  x="724" y="293" width="133" height="68" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="790.5" y="320" class="head blue" text-anchor="middle">B</text>
<text x="790.5" y="347" class="small" text-anchor="middle">key + value</text>
<rect  x="874" y="293" width="133" height="68" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="940.5" y="320" class="head blue" text-anchor="middle">C</text>
<text x="940.5" y="347" class="small" text-anchor="middle">key + value</text>
<text x="574" y="408" class="small" text-anchor="start">The final prompt position C also produces</text>
<text x="574" y="435" class="small" text-anchor="start">logits: one score per possible next token.</text>
<!-- Token selection is outside the forward pass. No arrow adds chosen D to the cache in this figure. -->
<path data-connector="true" d="M805 478 V512" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="798,509 805,523 812,509" fill="#2563eb"/>
<rect id="current-cache" x="40" y="523" width="440" height="151" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="563" class="head" text-anchor="start">Cache state now</text>
<text x="62" y="604" class="mono blue" text-anchor="start">A   B   C</text>
<text x="62" y="645" class="small" text-anchor="start">D has been chosen, but is not cached yet.</text>
<rect id="logits-and-selection" x="550" y="523" width="510" height="151" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="574" y="562" class="head" text-anchor="start">Logits → token selection</text>
<text x="574" y="597" class="small" text-anchor="start">D</text>
<rect  x="604" y="580" width="100" height="19" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="723" y="597" class="small" text-anchor="start">2.4</text>
<text x="574" y="626" class="small" text-anchor="start">E</text>
<rect  x="604" y="609" width="33" height="19" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="723" y="626" class="small" text-anchor="start">0.8</text>
<text x="574" y="655" class="small" text-anchor="start">F</text>
<rect  x="604" y="638" width="8" height="19" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="723" y="655" class="small" text-anchor="start">0.2</text>
<text x="807" y="595" class="small" text-anchor="start">Example rule:</text>
<text x="807" y="621" class="small" text-anchor="start">largest score</text>
<rect  x="970" y="610" width="60" height="46" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1000.0" y="640" class="head blue" text-anchor="middle">D</text>
</svg>
