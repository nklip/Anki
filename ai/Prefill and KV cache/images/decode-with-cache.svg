<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-labelledby="title desc">
  <title id="title">Process token D using the saved keys and values</title>
  <desc id="desc">One layer while processing the newly chosen token D. Learned projections of D's current vector produce its query, key, and value. The new key and value are appended to this layer's cached entries for A, B, and C, giving an updated cache for A through D. D's query compares with all four keys; the resulting attention weights mix the corresponding four values. D's computation continues through the model, repeating this pattern with each attention layer's own cache. Only after the last layer do token scores allow the system to choose the following token E. The cache keeps keys and values, not D's query.</desc>
  <!-- Blue marks saved entries, purple the newly computed query/key/value, and green continuing computation. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 21px; text-anchor: middle; }
      .note { font-size: 19px; text-anchor: middle; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="730" fill="#ffffff"/>

  <!-- D has already been selected; this forward computation produces scores for the following token. -->
  <text class="title" x="28" y="44">Process D using saved keys and values</text>
  <text class="subtitle" x="28" y="76">One layer of decoding · Q = query, K = key, V = value</text>
  <g id="current-token-vector">
    <rect x="28" y="108" width="844" height="67" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="450" y="137">D’s current vector at this layer</text>
    <text class="note" x="450" y="163">The model computes a query, key, and value.</text>
  </g>

  <!-- The query and cache-entry paths split: no query arrow enters the cache. -->
  <g id="new-query-key-value-flow">
    <path class="connector" d="M450 176 V197 M131 197 H778 M131 197 V218 M778 197 V218"/>
    <polygon class="head" points="131,231 124,217 138,217"/>
    <polygon class="head" points="778,231 771,217 785,217"/>
    <rect x="28" y="231" width="206" height="72" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="131" y="260">Query for D</text>
    <text class="note" x="131" y="288">Used in this step</text>
    <rect x="684" y="231" width="188" height="72" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="778" y="260">New K and V</text>
    <text class="note" x="778" y="288">for D</text>
  </g>

  <!-- This layer's cache includes the current position as well as its three past positions. -->
  <g id="updated-layer-cache">
    <rect x="284" y="350" width="588" height="166" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="578" y="379">Updated K/V cache for this layer</text>
    <rect x="310" y="396" width="120" height="99" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="446" y="396" width="120" height="99" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="582" y="396" width="120" height="99" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="718" y="396" width="120" height="99" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="note" x="370" y="420">A · saved</text>
    <text class="note" x="506" y="420">B · saved</text>
    <text class="note" x="642" y="420">C · saved</text>
    <text class="note" x="778" y="420">D · new</text>
    <text class="body" x="370" y="449">Key A</text>
    <text class="body" x="506" y="449">Key B</text>
    <text class="body" x="642" y="449">Key C</text>
    <text class="body" x="778" y="449">Key D</text>
    <text class="body" x="370" y="479">Value A</text>
    <text class="body" x="506" y="479">Value B</text>
    <text class="body" x="642" y="479">Value C</text>
    <text class="body" x="778" y="479">Value D</text>
  </g>

  <!-- The append shaft intentionally crosses the cache grouping border; it avoids the heading and ends at D's entry. -->
  <g id="append-current-key-and-value">
    <line class="connector" x1="778" y1="304" x2="778" y2="383"/>
    <polygon class="head" points="778,396 771,382 785,382"/>
    <text class="note" x="824" y="331">Append</text>
  </g>

  <!-- The query reads all keys and the matching values; the cache itself remains available afterward. -->
  <g id="attention-using-the-cache">
    <rect x="28" y="350" width="206" height="166" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="131" y="380">Attention for D</text>
    <text class="note" x="131" y="412">Compare Q with</text>
    <text class="note" x="131" y="437">all 4 cached keys.</text>
    <text class="note" x="131" y="475">Use the weights to</text>
    <text class="note" x="131" y="500">mix all 4 values.</text>
    <line class="connector" x1="131" y1="304" x2="131" y2="337"/>
    <polygon class="head" points="131,350 124,336 138,336"/>
    <line class="connector" x1="283" y1="449" x2="247" y2="449"/>
    <polygon class="head" points="234,449 248,442 248,456"/>
    <line class="connector" x1="283" y1="479" x2="247" y2="479"/>
    <polygon class="head" points="234,479 248,472 248,486"/>
  </g>

  <!-- This is an intermediate computation; the final token choice comes after the remaining model. -->
  <g id="continue-current-token-computation">
    <line class="connector" x1="131" y1="517" x2="131" y2="547"/>
    <polygon class="head" points="131,560 124,546 138,546"/>
    <rect x="28" y="560" width="844" height="75" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="450" y="591">Continue D’s computation through the model.</text>
    <text class="note" x="450" y="620">Repeat this pattern with each attention layer’s own cache.</text>
  </g>
  <text class="body" x="450" y="674">After the last layer, compute token scores and choose E.</text>
  <text class="note" x="450" y="705">Keep K/V for A, B, C, D; D’s query is used for this step.</text>
</svg>
