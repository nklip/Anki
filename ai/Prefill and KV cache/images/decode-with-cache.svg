<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940.909090909090909" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
<title id="title">Decode: input D, cache D, then choose E</title><desc id="desc">Before the next forward pass, only A B C are cached and D has been selected. Input D forms its own query, key, and value at each layer. Append its key and value, use its query to read A through D, and continue through the model. Output logits select E, which is not cached until another forward pass.</desc>
<!-- Shared typography and palette; blue identifies the state under discussion. -->
<defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:18px}.muted{fill:#64748b}.blue{fill:#2563eb}.mono{font-family:monospace;font-size:22px}</style></defs>
<rect width="1100" height="690" fill="white"/>
<text x="40" y="48" class="title" text-anchor="start">Decode: input D, cache D, then choose E</text>
<text x="40" y="82" class="small muted" text-anchor="start">Ordinary token-by-token generation: one newly selected token enters each next model run.</text>
<!-- Before-state contains only processed tokens. The chosen token remains outside until this forward pass. -->
<rect id="before-decode" x="40" y="115" width="290" height="167" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="152" class="head" text-anchor="start">Before this model run</text>
<text x="62" y="192" class="mono" text-anchor="start">Cache: A   B   C</text>
<text x="62" y="236" class="head blue" text-anchor="start">Selected token: D</text>
<path data-connector="true" d="M330 200 H374" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="371,193 385,200 371,207" fill="#2563eb"/>
<rect id="new-token-vectors" x="385" y="115" width="675" height="167" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="409" y="152" class="head" text-anchor="start">Input D → compute its query, key, and value</text>
<rect  x="409" y="177" width="198" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="508" y="219" class="small blue" text-anchor="middle">Qᴅ: current query</text>
<rect  x="619" y="177" width="198" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="718" y="219" class="small blue" text-anchor="middle">Kᴅ: new key</text>
<rect  x="829" y="177" width="198" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="928" y="219" class="small blue" text-anchor="middle">Vᴅ: new value</text>
<!-- The layer reads cached keys plus the new key; the analogous value row is shown immediately below. -->
<rect id="append-and-read-cache" x="40" y="328" width="1020" height="203" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="368" class="head" text-anchor="start">At this attention layer: append D, then read A through D</text>
<rect  x="62" y="395" width="210" height="96" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="167" y="430" class="head" text-anchor="middle">Query Qᴅ</text>
<text x="167" y="466" class="small" text-anchor="middle">match → mix</text>
<path data-connector="true" d="M272 442 H329" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="326,435 340,442 326,449" fill="#2563eb"/>
<rect  x="340" y="395" width="150" height="96" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="415" y="427" class="head" text-anchor="middle">A</text>
<text x="415" y="466" class="small" text-anchor="middle">key + value</text>
<rect  x="512" y="395" width="150" height="96" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="587" y="427" class="head" text-anchor="middle">B</text>
<text x="587" y="466" class="small" text-anchor="middle">key + value</text>
<rect  x="684" y="395" width="150" height="96" rx="7" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="759" y="427" class="head" text-anchor="middle">C</text>
<text x="759" y="466" class="small" text-anchor="middle">key + value</text>
<rect  x="856" y="395" width="150" height="96" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="931" y="427" class="head blue" text-anchor="middle">D</text>
<text x="931" y="466" class="small" text-anchor="middle">key + value</text>
<text x="856" y="516" class="small blue" text-anchor="start">D is now cached.</text>
<path data-connector="true" d="M720 282 V317" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="713,314 720,328 727,314" fill="#2563eb"/>
<path data-connector="true" d="M550 531 V565" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="543,562 550,576 557,562" fill="#2563eb"/>
<!-- All layers update their own cache before final scores select E. This is model decoding, not the selection rule itself. -->
<rect id="next-token-selection" x="40" y="576" width="1020" height="78" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="62" y="609" class="head" text-anchor="start">Repeat at each layer → final logits → select E</text>
<text x="62" y="638" class="small" text-anchor="start">Cache now holds A B C D. E enters the next run; the old tokens do not rerun.</text>
</svg>
