<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="818.75" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">Evaluate effort against quality, latency, and token use</title>
<desc id="desc">Two invented settings are compared on the same 20 tasks. One achieves more passes but uses more tokens and longer waits. The diagram defines evaluation and latency and separates costs from counts.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="655" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Choose effort using checked outcomes</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Evaluation = testing representative tasks against explicit success checks.</text>
<!-- Same test set; keep labels clear of connector corridors. -->
<g id="same-test-set">
<rect x="30" y="116" width="1140" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="152" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Keep the model, prompts, tools, and test tasks the same; vary effort.</text>
<text x="50" y="187" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Check correctness independently. Record waiting time and token usage as separate measurements.</text>
</g>
<!-- Setting a; keep labels clear of connector corridors. -->
<g id="setting-a">
<rect x="30" y="247" width="540" height="188" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="50" y="289" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Setting A</text>
<text x="50" y="332" font-size="23" font-weight="400" text-anchor="start" fill="#172033">16 of 20 tasks pass</text>
<text x="50" y="370" font-size="23" font-weight="400" text-anchor="start" fill="#172033">Average wait: 2 seconds</text>
<text x="50" y="408" font-size="23" font-weight="400" text-anchor="start" fill="#172033">400 generated tokens per task</text>
</g>
<!-- Setting b; keep labels clear of connector corridors. -->
<g id="setting-b">
<rect x="630" y="247" width="540" height="188" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="650" y="289" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Setting B</text>
<text x="650" y="332" font-size="23" font-weight="400" text-anchor="start" fill="#172033">18 of 20 tasks pass</text>
<text x="650" y="370" font-size="23" font-weight="400" text-anchor="start" fill="#172033">Average wait: 6 seconds</text>
<text x="650" y="408" font-size="23" font-weight="400" text-anchor="start" fill="#172033">1,200 generated tokens per task</text>
</g>
<!-- Tradeoff; keep labels clear of connector corridors. -->
<g id="tradeoff">
<rect x="30" y="478" width="1140" height="102" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="518" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Here: 2 more passes, with longer waits and more tokens.</text>
<text x="50" y="556" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Latency = waiting time. Monetary cost depends on billable usage and prices, not token count alone.</text>
</g>
<text x="30" y="620" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Invented measurements, not a benchmark. Repeated trials and new tasks may produce different results.</text>
</svg>
