<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="668.75" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc">
<title id="title">Internal reasoning, summary, and final answer</title>
<desc id="desc">Three distinct panels show internal work, an optional summary, and a final response. The invented summary is not presented as an actual reasoning trace.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="535" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">A reasoning summary is a view of the work</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A displayed summary is not the raw internal token stream or a complete record of computation.</text>
<!-- Internal work; keep labels clear of connector corridors. -->
<g id="internal-work">
<rect x="30" y="133" width="340" height="228" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="50" y="176" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Internal work</text>
<text x="50" y="223" font-size="22" font-weight="400" text-anchor="start" fill="#172033">Reasoning tokens support</text>
<text x="50" y="262" font-size="22" font-weight="400" text-anchor="start" fill="#172033">the model’s current work.</text>
<text x="50" y="301" font-size="22" font-weight="400" text-anchor="start" fill="#172033">The service may hide them.</text>
</g>
<!-- Reasoning summary; keep labels clear of connector corridors. -->
<g id="reasoning-summary">
<rect x="430" y="133" width="340" height="228" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="450" y="176" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Reasoning summary</text>
<text x="450" y="223" font-size="22" font-weight="400" text-anchor="start" fill="#172033">Optional account of the work</text>
<text x="450" y="262" font-size="22" font-weight="400" text-anchor="start" fill="#172033">Example: “Checked the</text>
<text x="450" y="301" font-size="22" font-weight="400" text-anchor="start" fill="#172033">scheduling constraints.”</text>
</g>
<!-- Final answer; keep labels clear of connector corridors. -->
<g id="final-answer">
<rect x="830" y="133" width="340" height="228" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="850" y="176" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Final answer</text>
<text x="850" y="223" font-size="22" font-weight="400" text-anchor="start" fill="#172033">The task-facing response</text>
<text x="850" y="262" font-size="22" font-weight="400" text-anchor="start" fill="#172033">Example: “The meeting</text>
<text x="850" y="301" font-size="22" font-weight="400" text-anchor="start" fill="#172033">can start at 11:00.”</text>
</g>
<!-- Visibility limit; keep labels clear of connector corridors. -->
<g id="visibility-limit">
<rect x="30" y="409" width="1140" height="93" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="446" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Visible length does not reveal how many reasoning tokens were generated.</text>
<text x="50" y="482" font-size="20" font-weight="400" text-anchor="start" fill="#172033">Availability and display depend on the model, service, and settings. The example text is invented.</text>
</g>
</svg>
