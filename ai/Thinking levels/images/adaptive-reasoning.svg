<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="693.75" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc">
<title id="title">Adaptive reasoning varies the work</title>
<desc id="desc">The same effort setting is used for copying a stated time and resolving several constraints. These requests can induce different amounts of reasoning; no token counts or timings are promised.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="555" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Adaptive reasoning allocates work to the request</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Adaptive = the model varies its work with the input, even at the same effort setting.</text>
<!-- Same effort; keep labels clear of connector corridors. -->
<g id="same-effort">
<rect x="30" y="209" width="245" height="122" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="50" y="253" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Same effort</text>
<text x="50" y="296" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Both requests use it.</text>
</g>
<!-- Simple request; keep labels clear of connector corridors. -->
<g id="simple-request">
<rect x="360" y="121" width="480" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="380" y="161" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Copy a stated meeting time</text>
<text x="380" y="204" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Input: “Meeting starts at 11:00.”</text>
<text x="380" y="236" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Return that time.</text>
<rect x="930" y="121" width="240" height="145" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="950" y="170" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Often little</text>
<text x="950" y="208" font-size="23" font-weight="700" text-anchor="start" fill="#172033">reasoning needed</text>
</g>
<!-- Complex request; keep labels clear of connector corridors. -->
<g id="complex-request">
<rect x="360" y="322" width="480" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="380" y="362" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Resolve conflicting schedules</text>
<text x="380" y="405" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Combine availability, travel time,</text>
<text x="380" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#172033">and a deadline before answering.</text>
<rect x="930" y="322" width="240" height="145" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="950" y="371" font-size="23" font-weight="700" text-anchor="start" fill="#172033">May need</text>
<text x="950" y="409" font-size="23" font-weight="700" text-anchor="start" fill="#172033">more reasoning</text>
</g>
<!-- Adaptive flow; keep labels clear of connector corridors. -->
<g id="adaptive-flow">
<path data-connector="true" d="M 275,241 L 314,241 L 314,193 L 349,193" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="360,193 348,199 348,187" fill="#64748b"/>
<path data-connector="true" d="M 275,300 L 314,300 L 314,394 L 349,394" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="360,394 348,400 348,388" fill="#64748b"/>
<path data-connector="true" d="M 840,193 L 919,193" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="930,193 918,199 918,187" fill="#64748b"/>
<path data-connector="true" d="M 840,394 L 919,394" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="930,394 918,400 918,388" fill="#64748b"/>
</g>
<text x="30" y="521" font-size="21" font-weight="400" text-anchor="start" fill="#172033">“High” is guidance, not a fixed duration or token count. Extra work still does not guarantee correctness.</text>
</svg>
