<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
  <title id="title">A short reply can still involve lots of work</title>
  <desc id="desc">Two fictional runs have equally long visible replies of 50 tokens. Run A has 100 reasoning tokens, totaling 150. Run B has 300 reasoning tokens, totaling 350. The bars have a common token scale and omit input and formatting tokens. These are example counts, not guarantees for any effort level, prices, or times.</desc>
  <!-- Shared series typography; the individual labels carry each color's meaning. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="455" fill="#ffffff"/>
  <!-- Heading states the lesson before the body introduces its parts. -->
  <text class="title" x="28" y="43" text-anchor="start">A short reply can still involve lots of work</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Invented example counts, not promised amounts for low or high effort.</text>
  <!-- Legend: light purple is reasoning and light green is the visible reply. -->
  <rect x="28" y="99" width="20" height="20" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="body" x="60" y="116" text-anchor="start">Reasoning tokens</text>
  <rect x="310" y="99" width="20" height="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="body" x="342" y="116" text-anchor="start">Visible reply tokens</text>
  <text class="label" x="1010" y="116" text-anchor="middle">Total</text>
  <!-- Run A: 100 reasoning tokens plus 50 reply tokens; widths are 200 and 100. -->
  <g id="run-a">
  <text class="label" x="28" y="186" text-anchor="start">Run A</text>
    <rect x="200" y="150" width="200" height="60" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="400" y="150" width="100" height="60" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="300" y="188" text-anchor="middle">100</text>
  <text class="label" x="450" y="188" text-anchor="middle">50</text>
  <text class="label" x="1010" y="188" text-anchor="middle">150</text>
  </g>
  <!-- Run B: 300 reasoning tokens plus the same 50 reply tokens; widths are 600 and 100. -->
  <g id="run-b">
  <text class="label" x="28" y="286" text-anchor="start">Run B</text>
    <rect x="200" y="250" width="600" height="60" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="800" y="250" width="100" height="60" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="500" y="288" text-anchor="middle">300</text>
  <text class="label" x="850" y="288" text-anchor="middle">50</text>
  <text class="label" x="1010" y="288" text-anchor="middle">350</text>
  </g>
  <text class="label" x="550" y="357" text-anchor="middle">100 + 50 = 150       •       300 + 50 = 350</text>
  <text class="body" x="550" y="393" text-anchor="middle">Both visible replies use 50 tokens. Run B uses 200 more tokens overall.</text>
  <text class="note" x="550" y="427" text-anchor="middle">Toy counts omit input and formatting tokens; these bars do not measure time.</text>
</svg>
