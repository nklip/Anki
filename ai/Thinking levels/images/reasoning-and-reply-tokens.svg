<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="737.5" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Reasoning tokens and reply tokens</title>
<desc id="desc">Two invented runs both show 50 reply tokens. Their reasoning counts are 100 and 300, so total generated tokens are 150 and 350. Bars use one consistent scale.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="590" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Reasoning and visible replies use different tokens</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Token = an encoded input or output unit, often a word or part of a word.</text>
<!-- Token types; keep labels clear of connector corridors. -->
<g id="token-types">
<rect x="30" y="112" width="550" height="104" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="50" y="151" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Reasoning tokens</text>
<text x="50" y="188" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Generated intermediate work, often hidden</text>
<rect x="620" y="112" width="550" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="640" y="151" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Reply tokens</text>
<text x="640" y="188" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Generated text shown in the final answer</text>
</g>
<text x="30" y="262" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Toy runs · one shared token scale</text>
<!-- Run a; keep labels clear of connector corridors. -->
<g id="run-a">
<text x="30" y="338" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Run A</text>
<rect x="210" y="300" width="200" height="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="410" y="300" width="100" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="338" font-size="24" font-weight="700" text-anchor="middle" fill="#7c3aed">100</text>
<text x="460.0" y="338" font-size="24" font-weight="700" text-anchor="middle" fill="#2563eb">50</text>
<text x="1025" y="338" font-size="24" font-weight="700" text-anchor="middle" fill="#172033">150 total</text>
</g>
<!-- Run b; keep labels clear of connector corridors. -->
<g id="run-b">
<text x="30" y="440" font-size="23" font-weight="700" text-anchor="start" fill="#172033">Run B</text>
<rect x="210" y="402" width="600" height="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="810" y="402" width="100" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510.0" y="440" font-size="24" font-weight="700" text-anchor="middle" fill="#7c3aed">300</text>
<text x="860.0" y="440" font-size="24" font-weight="700" text-anchor="middle" fill="#2563eb">50</text>
<text x="1025" y="440" font-size="24" font-weight="700" text-anchor="middle" fill="#172033">350 total</text>
</g>
<text x="30" y="518" font-size="22" font-weight="700" text-anchor="start" fill="#172033">100 + 50 = 150; 300 + 50 = 350. Equal reply length can hide very different amounts of work.</text>
<text x="30" y="559" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Invented counts omit input and formatting tokens. Bar length measures tokens, not waiting time or price.</text>
</svg>
