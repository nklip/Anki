<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">Four controls answer different questions</title>
  <desc id="desc">Model choice selects the trained model. Reasoning effort guides how much problem-solving work is spent during use. Temperature controls randomness in next-token selection. Verbosity controls the detail of the visible answer. These purposes differ, but providers can couple their effects and support different settings.</desc>
  <!-- Shared series typography; the individual labels carry each color's meaning. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 19px; fill: #475569; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="510" fill="#ffffff"/>
  <!-- Heading states the lesson before the body introduces its parts. -->
  <text class="title" x="28" y="43" text-anchor="start">Four controls answer different questions</text>
  <text class="subtitle" x="28" y="76" text-anchor="start">Read each panel as one question about the request.</text>
  <!-- Model choice; labels explain the color and role. -->
  <g id="model-choice">
    <rect x="28" y="112" width="506" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="281.0" y="147" text-anchor="middle">Model choice</text>
  <text class="body" x="281.0" y="186" text-anchor="middle">Which trained model handles the task?</text>
  <text class="note" x="281.0" y="224" text-anchor="middle">Changing effort does not enlarge a model.</text>
  </g>
  <!-- Reasoning effort; labels explain the color and role. -->
  <g id="reasoning-effort">
    <rect x="566" y="112" width="506" height="150" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="label" x="819.0" y="147" text-anchor="middle">Reasoning effort</text>
  <text class="body" x="819.0" y="186" text-anchor="middle">How much problem-solving work to spend?</text>
  <text class="note" x="819.0" y="224" text-anchor="middle">Guidance, not guaranteed correctness.</text>
  </g>
  <!-- Temperature; labels explain the color and role. -->
  <g id="temperature">
    <rect x="28" y="292" width="506" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="label" x="281.0" y="327" text-anchor="middle">Temperature</text>
  <text class="body" x="281.0" y="366" text-anchor="middle">How randomly is the next token selected?</text>
  <text class="note" x="281.0" y="404" text-anchor="middle">This is not a thinking-depth control.</text>
  </g>
  <!-- Verbosity; labels explain the color and role. -->
  <g id="verbosity">
    <rect x="566" y="292" width="506" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="label" x="819.0" y="327" text-anchor="middle">Verbosity</text>
  <text class="body" x="819.0" y="366" text-anchor="middle">How detailed should the visible answer be?</text>
  <text class="note" x="819.0" y="404" text-anchor="middle">A concise answer can follow long reasoning.</text>
  </g>
  <text class="note" x="550" y="483" text-anchor="middle">Distinct purposes; available settings and interactions depend on the provider and model.</text>
</svg>
