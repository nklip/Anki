<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Model choice, reasoning effort, temperature, and verbosity</title>
<desc id="desc">Four labeled panels separate learned model selection, inference effort, probability spreading for sampling, and visible explanation length. These controls are not guaranteed to act independently.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Four controls change different things</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Their effects can overlap; supported controls depend on the model and service.</text>
<!-- Model choice size; keep labels clear of connector corridors. -->
<g id="model-choice-size">
<rect x="30" y="124" width="540" height="176" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="50" y="167" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Model choice / size</text>
<text x="50" y="215" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Selects learned weights and model design.</text>
<text x="50" y="250" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Effort does not add learned weights.</text>
</g>
<!-- Reasoning effort; keep labels clear of connector corridors. -->
<g id="reasoning-effort">
<rect x="630" y="124" width="540" height="176" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="650" y="167" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Reasoning effort</text>
<text x="650" y="215" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Guides work spent during this request.</text>
<text x="650" y="250" font-size="21" font-weight="400" text-anchor="start" fill="#172033">It can affect token use and waiting time.</text>
</g>
<!-- Temperature; keep labels clear of connector corridors. -->
<g id="temperature">
<rect x="30" y="343" width="540" height="176" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="50" y="386" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Temperature</text>
<text x="50" y="434" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Changes the spread of token probabilities.</text>
<text x="50" y="469" font-size="21" font-weight="400" text-anchor="start" fill="#172033">It adjusts sampling, not learned knowledge.</text>
</g>
<!-- Verbosity; keep labels clear of connector corridors. -->
<g id="verbosity">
<rect x="630" y="343" width="540" height="176" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="650" y="386" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Verbosity</text>
<text x="650" y="434" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Guides how much explanation is shown.</text>
<text x="650" y="469" font-size="21" font-weight="400" text-anchor="start" fill="#172033">A short reply can follow substantial reasoning.</text>
</g>
<text x="30" y="569" font-size="20" font-weight="400" text-anchor="start" fill="#172033">A hard output cap separately limits generated tokens. Provider effort controls can also change reply length.</text>
</svg>
