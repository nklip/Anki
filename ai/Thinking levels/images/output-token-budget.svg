<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="681.25" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc">
<title id="title">Effort guidance and output token limits</title>
<desc id="desc">A 500-token toy cap includes reasoning and visible output. One run uses 350 reasoning tokens and 150 reply tokens; another reaches the cap with no visible reply. Real accounting can also include formatting.</desc>
<!-- Shared typography and native vector artwork; intrinsic width is 1500 pixels. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; }</style></defs>
<rect width="1200" height="545" fill="#ffffff"/>
<text x="30" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#172033">An output budget can include hidden reasoning</text>
<text x="30" y="80" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">A hard cap limits total generated tokens; it is a different control from effort guidance.</text>
<text x="30" y="130" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Toy cap: 500 generated tokens · input and formatting omitted</text>
<!-- Room for a reply; keep labels clear of connector corridors. -->
<g id="room-for-a-reply">
<text x="30" y="175" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Room for a reply</text>
<rect x="30" y="197" width="1140" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="30" y="197" width="798" height="74" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="429.0" y="243" font-size="24" font-weight="700" text-anchor="middle" fill="#7c3aed">350 reasoning</text>
<rect x="828" y="197" width="342" height="74" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="999.0" y="243" font-size="24" font-weight="700" text-anchor="middle" fill="#2563eb">150 reply</text>
</g>
<!-- Cap reached during reasoning; keep labels clear of connector corridors. -->
<g id="cap-reached-during-reasoning">
<text x="30" y="321" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Cap reached during reasoning</text>
<rect x="30" y="343" width="1140" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="30" y="343" width="1140" height="74" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="600.0" y="389" font-size="24" font-weight="700" text-anchor="middle" fill="#7c3aed">500 reasoning</text>
</g>
<text x="30" y="470" font-size="22" font-weight="700" text-anchor="start" fill="#172033">350 + 150 = 500. If reasoning consumes all 500, the cap may stop output before a visible answer.</text>
<text x="30" y="512" font-size="21" font-weight="400" text-anchor="start" fill="#64748b">Use the provider’s incomplete-response signal. Do not infer success from the request finishing.</text>
</svg>
