<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Cosine similarity compares vector directions</title>
  <desc id="desc">Three panels show same-direction vectors with score one, perpendicular vectors with score zero, and opposite vectors with score minus one.</desc>

  <!-- Shared diagram palette and typography. -->
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #334155; text-anchor: middle; }
      .score { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .blue { fill: none; stroke: #1677b8; stroke-width: 5; }
      .orange { fill: none; stroke: #e8792e; stroke-width: 5; }
      .origin { fill: #0f172a; }
    </style>
  </defs>

  <!-- Title and reading cue. -->
  <text x="480" y="40" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Direction determines cosine similarity</text>
  <text x="480" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569" text-anchor="middle">Vector length can change while the score stays the same</text>

  <!-- Same direction: separate parallel arrows prevent overlapping heads while showing positive scaling. -->
  <g id="same-direction">
    <rect class="panel" x="25" y="95" width="290" height="350" rx="18"/>
    <text class="heading" x="170" y="132">Same direction</text>
    <path class="blue" d="M75 245 L182 192"/>
    <path d="M200 183 L184 202 L176 185 Z" fill="#1677b8"/>
    <circle class="origin" cx="75" cy="245" r="5"/>
    <text class="label" x="142" y="230">A</text>

    <path class="orange" d="M75 355 L242 272"/>
    <path d="M260 263 L244 282 L236 265 Z" fill="#e8792e"/>
    <circle class="origin" cx="75" cy="355" r="5"/>
    <text class="label" x="172" y="327">3A</text>
    <text class="score" x="170" y="400">similarity = 1</text>
    <text class="label" x="170" y="427">different lengths, same direction</text>
  </g>

  <!-- Perpendicular vectors share one origin and form a visible right angle. -->
  <g id="perpendicular-directions">
    <rect class="panel" x="335" y="95" width="290" height="350" rx="18"/>
    <text class="heading" x="480" y="132">Perpendicular</text>
    <circle class="origin" cx="455" cy="330" r="5"/>
    <path class="blue" d="M455 330 H558"/>
    <path d="M578 330 L558 320 V340 Z" fill="#1677b8"/>
    <text class="label" x="530" y="360">A</text>
    <path class="orange" d="M455 330 V222"/>
    <path d="M455 202 L445 222 H465 Z" fill="#e8792e"/>
    <text class="label" x="430" y="247">B</text>
    <path d="M455 307 H478 V330" fill="none" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="505" y="274">90°</text>
    <text class="score" x="480" y="400">similarity = 0</text>
    <text class="label" x="480" y="427">no directional alignment</text>
  </g>

  <!-- Opposite vectors point away from their common origin. -->
  <g id="opposite-directions">
    <rect class="panel" x="645" y="95" width="290" height="350" rx="18"/>
    <text class="heading" x="790" y="132">Opposite directions</text>
    <circle class="origin" cx="790" cy="300" r="5"/>
    <path class="blue" d="M790 300 H870"/>
    <path d="M890 300 L870 290 V310 Z" fill="#1677b8"/>
    <text class="label" x="850" y="335">A</text>
    <path class="orange" d="M790 300 H710"/>
    <path d="M690 300 L710 290 V310 Z" fill="#e8792e"/>
    <text class="label" x="730" y="335">B</text>
    <path d="M735 266 A65 65 0 0 1 845 266" fill="none" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="790" y="218">180°</text>
    <text class="score" x="790" y="400">similarity = −1</text>
    <text class="label" x="790" y="427">maximum directional opposition</text>
  </g>

  <!-- Color legend kept below the panels. -->
  <line x1="370" y1="482" x2="400" y2="482" stroke="#1677b8" stroke-width="5"/>
  <text x="410" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">vector A</text>
  <line x1="505" y1="482" x2="535" y2="482" stroke="#e8792e" stroke-width="5"/>
  <text x="545" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">vector B or a scaled A</text>
</svg>
