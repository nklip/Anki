<svg xmlns="http://www.w3.org/2000/svg" width="900" height="676" viewBox="0 0 900 676" role="img" aria-labelledby="title desc">
  <title id="title">A checked answer can guide training</title>
  <desc id="desc">The toy problem asks how many marbles are in three bags with four marbles each. Attempt A adds 4 plus 4 plus 4 and answers 12, earning one reward point. Attempt B adds 3 plus 4 and answers 7, earning zero points. Reinforcement learning uses the rewards to update model weights. Only the final answer is checked here, so the reward does not verify the intermediate working.</desc>
  <!-- Blue is generated text; green and orange distinguish checker outcomes. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .copy { font-size: 22px; }
      .math { font-size: 27px; text-anchor: middle; }
      .number { font-size: 32px; font-weight: 700; text-anchor: middle; }
      .note { font-size: 19px; }
      .connector { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .head { fill: #64748b; }
    </style>
  </defs>
  <rect width="900" height="676" fill="#ffffff"/>

  <!-- Establish the arithmetic and the exact scoring rule before showing attempts. -->
  <text class="title" x="28" y="44">A checked answer can guide training</text>
  <text class="subtitle" x="28" y="76">Toy reward rule: answer 12 earns 1 point; any other answer earns 0.</text>
  <g id="training-problem">
    <rect x="28" y="100" width="844" height="88" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="50" y="133">TRAINING PROBLEM</text>
    <text class="copy" x="50" y="166">3 bags, 4 marbles in each. How many marbles?</text>
  </g>
  <text class="section" x="28" y="224">TWO ATTEMPTS GENERATED BY THE MODEL</text>
  <text class="label" x="50" y="260">Working</text>
  <text class="label" x="500" y="260">Final answer</text>
  <text class="label" x="700" y="260">Checker reward</text>

  <!-- Attempt A uses repeated addition to count three groups of four. -->
  <g id="correct-attempt">
    <rect x="28" y="282" width="430" height="86" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="math" x="243" y="334">4 + 4 + 4 = 12</text>
    <rect x="500" y="282" width="140" height="86" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="number" x="570" y="337">12</text>
    <rect x="700" y="282" width="172" height="86" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="number" x="786" y="337">1 point</text>
  </g>

  <!-- Attempt B adds the bag count to the per-bag count, giving the wrong total. -->
  <g id="incorrect-attempt">
    <rect x="28" y="400" width="430" height="86" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="math" x="243" y="452">3 + 4 = 7</text>
    <rect x="500" y="400" width="140" height="86" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="number" x="570" y="455">7</text>
    <rect x="700" y="400" width="172" height="86" rx="13" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text class="number" x="786" y="455">0 points</text>
  </g>

  <!-- Each answer is scored. Heads touch borders; shafts stop within their bases. -->
  <line class="connector" x1="459" y1="325" x2="487" y2="325"/>
  <polygon class="head" points="500,325 486,318 486,332"/>
  <line class="connector" x1="641" y1="325" x2="687" y2="325"/>
  <polygon class="head" points="700,325 686,318 686,332"/>
  <line class="connector" x1="459" y1="443" x2="487" y2="443"/>
  <polygon class="head" points="500,443 486,436 486,450"/>
  <line class="connector" x1="641" y1="443" x2="687" y2="443"/>
  <polygon class="head" points="700,443 686,436 686,450"/>

  <!-- Rewards merge in the right-side gutter, then feed the weight update. -->
  <path id="rewards-to-update-connector" class="connector" d="M873 325 H886 V518 H450 V539"/>
  <line class="connector" x1="873" y1="443" x2="886" y2="443"/>
  <polygon class="head" points="450,552 443,538 457,538"/>
  <g id="reinforcement-learning-update">
    <rect x="28" y="552" width="844" height="78" rx="13" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text class="label" x="450" y="585" text-anchor="middle">Reinforcement learning uses rewards to update model weights.</text>
    <text class="note" x="450" y="614" text-anchor="middle">Repeat on many problems to encourage higher-scoring attempts.</text>
  </g>

  <!-- The key limitation: scoring an outcome does not certify its working. -->
  <text class="note" x="450" y="660" text-anchor="middle">Only final answers are checked here; the working is not verified.</text>
</svg>
