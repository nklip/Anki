<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Dependency Injection compared with Inversion of Control</title>
  <desc id="desc">Inversion of Control is the broad principle of moving control outside a component. Dependency Injection is one form: an external assembler creates a dependency and passes it to an object instead of the object constructing it.</desc>

  <!-- Palette and typography are kept in one place for quick maintenance. -->
  <defs>
    <style>
      .heading { font: 700 34px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .panel-title { font: 700 28px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .label { font: 700 23px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .body { font: 400 22px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 600 20px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .key { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
    </style>
  </defs>

  <!-- Background and title. -->
  <rect width="1500" height="780" fill="#f8fafc"/>
  <text class="heading" x="750" y="55" text-anchor="middle">IoC is the principle; DI is one way to apply it</text>
  <text class="body" x="750" y="91" text-anchor="middle">Keep construction and wiring outside the object that uses a dependency.</text>

  <!-- Broad IoC banner. The badge makes the subset relationship explicit. -->
  <rect x="40" y="120" width="1420" height="120" rx="22" fill="#e8f0fe" stroke="#285ea8" stroke-width="4"/>
  <text class="panel-title" x="80" y="166">Inversion of Control (broad principle)</text>
  <text class="body" x="80" y="207">A framework, container, or external assembler controls creation, wiring, lifecycle, or calls.</text>
  <rect x="1220" y="143" width="200" height="74" rx="18" fill="#ffffff" stroke="#285ea8" stroke-width="3"/>
  <text class="label" x="1320" y="177" text-anchor="middle">DI is one form</text>
  <text class="small" x="1320" y="204" text-anchor="middle">of IoC</text>

  <!-- Left panel: the component owns construction and therefore chooses a concrete class. -->
  <rect x="40" y="275" width="650" height="370" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
  <text class="panel-title" x="365" y="322" text-anchor="middle">Without dependency injection</text>
  <rect x="90" y="380" width="230" height="110" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
  <text class="label" x="205" y="429" text-anchor="middle">OrderService</text>
  <text class="small" x="205" y="463" text-anchor="middle">owns construction</text>
  <rect x="420" y="380" width="220" height="110" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
  <text class="label" x="530" y="429" text-anchor="middle">EmailNotifier</text>
  <text class="small" x="530" y="463" text-anchor="middle">concrete class</text>
  <!-- Arrow shaft may cross structural regions, but its label and head stay clear of boxes. -->
  <text class="small" x="370" y="407" text-anchor="middle">creates with new</text>
  <line x1="320" y1="444" x2="394" y2="444" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
  <polygon points="394,432 414,444 394,456" fill="#c2410c"/>
  <text class="body" x="365" y="550" text-anchor="middle">The service chooses and locates its own collaborator.</text>
  <text class="key" x="365" y="594" text-anchor="middle">Control stays inside the component.</text>

  <!-- Central transition arrow: move only dependency wiring outside the component. -->
  <line x1="716" y1="460" x2="776" y2="460" stroke="#285ea8" stroke-width="7" stroke-linecap="round"/>
  <polygon points="776,446 800,460 776,474" fill="#285ea8"/>

  <!-- Right panel: an external assembler creates and passes the dependency. -->
  <rect x="810" y="275" width="650" height="370" rx="22" fill="#ecfdf5" stroke="#15803d" stroke-width="4"/>
  <text class="panel-title" x="1135" y="322" text-anchor="middle">Dependency Injection (one form of IoC)</text>
  <rect x="855" y="380" width="240" height="110" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
  <text class="label" x="975" y="429" text-anchor="middle">External assembler</text>
  <text class="small" x="975" y="463" text-anchor="middle">manual or container</text>
  <rect x="1170" y="350" width="240" height="100" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
  <text class="label" x="1290" y="409" text-anchor="middle">Notifier object</text>
  <rect x="1170" y="510" width="240" height="100" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
  <text class="label" x="1290" y="569" text-anchor="middle">OrderService</text>
  <!-- Creation arrow and its separate head stop before the dependency box. -->
  <text class="small" x="1130" y="390" text-anchor="middle">creates</text>
  <line x1="1095" y1="420" x2="1144" y2="420" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1144,408 1164,420 1144,432" fill="#15803d"/>
  <!-- Injection arrow passes the ready object into the service constructor. -->
  <text class="small" x="1260" y="484" text-anchor="end">injects</text>
  <line x1="1290" y1="450" x2="1290" y2="484" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1278,484 1290,504 1302,484" fill="#15803d"/>
  <text class="key" x="1010" y="548" text-anchor="middle">Dependency arrives</text>
  <text class="key" x="1010" y="580" text-anchor="middle">from outside.</text>

  <!-- Bottom memory aid: two related questions, not interchangeable terms. -->
  <rect x="40" y="675" width="1420" height="75" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text class="key" x="370" y="721" text-anchor="middle">IoC asks: Who controls?</text>
  <line x1="750" y1="692" x2="750" y2="733" stroke="#cbd5e1" stroke-width="3"/>
  <text class="key" x="1130" y="721" text-anchor="middle">DI asks: How do dependencies arrive?</text>
</svg>
