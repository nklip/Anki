<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">ReentrantLock: one owner, several holds</title>
  <desc id="description">Thread A owns a shared ReentrantLock twice while Thread B waits to acquire it. A's hold count rises from one to two and falls to one and then zero. Only the release to zero allows another thread to acquire the lock.</desc>

  <!-- Shared text hierarchy and semantic colors: blue owner, amber waiter, green released. -->
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172b45; }
      .heading { font: 700 23px Arial, Helvetica, sans-serif; fill: #172b45; }
      .body { font: 20px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .code { font: 20px monospace; fill: #172b45; }
      .count { font: 700 28px Arial, Helvetica, sans-serif; fill: #245fa3; }
    </style>
  </defs>

  <!-- Title and the snapshot's context. -->
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">One owner, several holds</text>
  <text x="600" y="88" text-anchor="middle" class="body">Reentrant = the owning thread can acquire the same lock again.</text>

  <!-- Ownership snapshot; containers leave connector corridors on both sides of the lock. -->
  <g id="owner-thread">
    <rect x="40" y="132" width="300" height="150" rx="14" fill="#edf5ff" stroke="#3776b8" stroke-width="2"/>
    <text x="190" y="170" text-anchor="middle" class="heading">Thread A · owner</text>
    <text x="190" y="211" text-anchor="middle" class="body">Two successful acquisitions</text>
    <text x="190" y="251" text-anchor="middle" class="small">May access protected state</text>
  </g>
  <g id="shared-lock">
    <rect x="440" y="132" width="320" height="150" rx="14" fill="#f2f5fa" stroke="#64748b" stroke-width="2"/>
    <text x="600" y="170" text-anchor="middle" class="heading">Shared ReentrantLock</text>
    <text x="600" y="216" text-anchor="middle" class="count">hold count = 2</text>
    <text x="600" y="251" text-anchor="middle" class="small">Holds belong to A, not B</text>
  </g>
  <g id="waiting-thread">
    <rect x="860" y="132" width="300" height="150" rx="14" fill="#fff6e7" stroke="#ba7b25" stroke-width="2"/>
    <text x="1010" y="170" text-anchor="middle" class="heading">Thread B · waiting</text>
    <text x="1010" y="211" text-anchor="middle" class="code">lock() has not returned</text>
    <text x="1010" y="251" text-anchor="middle" class="small">Cannot enter yet</text>
  </g>

  <!-- Manual arrow shafts end beneath their heads; tips remain clear of target borders. -->
  <g id="ownership-arrows">
    <path id="owner-connector" d="M342 210 H423" fill="none" stroke="#3776b8" stroke-width="3"/>
    <path d="M421 202 L437 210 L421 218 Z" fill="#3776b8"/>
    <path id="waiter-connector" d="M858 210 H777" fill="none" stroke="#ba7b25" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M779 202 L763 210 L779 218 Z" fill="#ba7b25"/>
  </g>

  <!-- A left-to-right state trace explains why one unlock is insufficient. -->
  <text x="40" y="338" class="heading">A's acquisitions and releases · read left to right</text>
  <g id="first-acquisition">
    <rect x="40" y="372" width="250" height="150" rx="12" fill="#edf5ff" stroke="#3776b8" stroke-width="2"/>
    <text x="165" y="410" text-anchor="middle" class="code">A: lock()</text>
    <text x="165" y="457" text-anchor="middle" class="count">count 1</text>
    <text x="165" y="495" text-anchor="middle" class="body">A owns the lock</text>
  </g>
  <g id="reentrant-acquisition">
    <rect x="330" y="372" width="250" height="150" rx="12" fill="#edf5ff" stroke="#3776b8" stroke-width="2"/>
    <text x="455" y="410" text-anchor="middle" class="code">A: lock() again</text>
    <text x="455" y="457" text-anchor="middle" class="count">count 2</text>
    <text x="455" y="495" text-anchor="middle" class="body">A owns the lock</text>
  </g>
  <g id="partial-release">
    <rect x="620" y="372" width="250" height="150" rx="12" fill="#edf5ff" stroke="#3776b8" stroke-width="2"/>
    <text x="745" y="410" text-anchor="middle" class="code">A: unlock()</text>
    <text x="745" y="457" text-anchor="middle" class="count">count 1</text>
    <text x="745" y="495" text-anchor="middle" class="body">A still owns it</text>
  </g>
  <g id="full-release">
    <rect x="910" y="372" width="250" height="150" rx="12" fill="#ecf8f1" stroke="#36835d" stroke-width="2"/>
    <text x="1035" y="410" text-anchor="middle" class="code">A: unlock()</text>
    <text x="1035" y="457" text-anchor="middle" style="font:700 28px Arial, Helvetica, sans-serif;fill:#256344">count 0</text>
    <text x="1035" y="495" text-anchor="middle" class="body">Lock is now free</text>
  </g>

  <!-- Identical horizontal joins; arrowheads stop 3 units before the next panel. -->
  <g id="hold-count-flow" fill="#64748b" stroke="none">
    <path id="hold-flow-one" d="M292 450 H313" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M311 442 L327 450 L311 458 Z"/>
    <path id="hold-flow-two" d="M582 450 H603" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M601 442 L617 450 L601 458 Z"/>
    <path id="hold-flow-three" d="M872 450 H893" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M891 442 L907 450 L891 458 Z"/>
  </g>

  <!-- The outcome avoids promising that B will necessarily be the next owner. -->
  <rect x="40" y="554" width="1120" height="54" rx="10" fill="#f2f5fa"/>
  <text x="600" y="588" text-anchor="middle" class="body">B can acquire only after A's hold count reaches zero. Every acquisition needs its own unlock().</text>
</svg>
