<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title description">
  <title id="title">ConcurrentHashMap atomic per-key operations</title>
  <desc id="description">A comparison between a broken get-then-put counter that loses an update and an atomic merge operation that preserves both increments. The diagram also summarizes atomic map methods and the per-key happens-before visibility guarantee.</desc>

  <!-- Background and title -->
  <rect width="1500" height="1000" fill="white"/>
  <text x="750" y="52" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="black">ConcurrentHashMap atomic operations</text>
  <text x="750" y="84" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#444">Thread-safe methods do not make an arbitrary sequence of calls atomic</text>

  <!-- Broken compound operation -->
  <rect x="40" y="115" width="690" height="490" rx="7" fill="#fff3f1" stroke="#b34a42" stroke-width="2"/>
  <rect x="40" y="115" width="690" height="58" rx="7" fill="#b34a42"/>
  <rect x="40" y="160" width="690" height="13" fill="#b34a42"/>
  <text x="65" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="white">Broken: get() followed by put()</text>

  <rect x="275" y="195" width="220" height="52" rx="4" fill="white" stroke="#b34a42" stroke-width="2"/>
  <text x="385" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#8b302d">map["word"] = 0</text>

  <text x="195" y="281" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#8b302d">Thread A</text>
  <text x="535" y="281" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#8b302d">Thread B</text>

  <rect x="85" y="300" width="220" height="56" rx="4" fill="white" stroke="#b34a42"/>
  <rect x="425" y="300" width="220" height="56" rx="4" fill="white" stroke="#b34a42"/>
  <text x="195" y="334" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">get("word") → 0</text>
  <text x="535" y="334" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">get("word") → 0</text>

  <rect x="85" y="390" width="220" height="56" rx="4" fill="white" stroke="#b34a42"/>
  <rect x="425" y="390" width="220" height="56" rx="4" fill="white" stroke="#b34a42"/>
  <text x="195" y="424" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">calculate 0 + 1</text>
  <text x="535" y="424" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">calculate 0 + 1</text>

  <rect x="85" y="480" width="220" height="56" rx="4" fill="white" stroke="#b34a42"/>
  <rect x="425" y="480" width="220" height="56" rx="4" fill="white" stroke="#b34a42"/>
  <text x="195" y="514" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">put("word", 1)</text>
  <text x="535" y="514" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">put("word", 1)</text>

  <!-- Down arrows use separate shafts and triangles. -->
  <path d="M195 362V374" fill="none" stroke="#777" stroke-width="2"/>
  <polygon points="195,386 189,373 201,373" fill="#777"/>
  <path d="M195 452V464" fill="none" stroke="#777" stroke-width="2"/>
  <polygon points="195,476 189,463 201,463" fill="#777"/>
  <path d="M535 362V374" fill="none" stroke="#777" stroke-width="2"/>
  <polygon points="535,386 529,373 541,373" fill="#777"/>
  <path d="M535 452V464" fill="none" stroke="#777" stroke-width="2"/>
  <polygon points="535,476 529,463 541,463" fill="#777"/>

  <rect x="225" y="555" width="320" height="37" rx="4" fill="#b34a42"/>
  <text x="385" y="580" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">final value = 1 — one update is lost</text>

  <!-- Correct atomic operation -->
  <rect x="770" y="115" width="690" height="490" rx="7" fill="#eef8ef" stroke="#4d8758" stroke-width="2"/>
  <rect x="770" y="115" width="690" height="58" rx="7" fill="#4d8758"/>
  <rect x="770" y="160" width="690" height="13" fill="#4d8758"/>
  <text x="795" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="white">Correct: merge() is atomic for the key</text>

  <rect x="1005" y="195" width="220" height="52" rx="4" fill="white" stroke="#4d8758" stroke-width="2"/>
  <text x="1115" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#35623e">map["word"] = 0</text>

  <rect x="815" y="290" width="250" height="62" rx="4" fill="white" stroke="#4d8758"/>
  <rect x="1165" y="290" width="250" height="62" rx="4" fill="white" stroke="#4d8758"/>
  <text x="940" y="316" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#35623e">Thread A requests</text>
  <text x="940" y="339" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">merge("word", 1, sum)</text>
  <text x="1290" y="316" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#35623e">Thread B requests</text>
  <text x="1290" y="339" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">merge("word", 1, sum)</text>

  <rect x="975" y="390" width="280" height="65" rx="5" fill="#dcefdc" stroke="#4d8758" stroke-width="2"/>
  <text x="1115" y="417" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#35623e">Per-key atomic update</text>
  <text x="1115" y="441" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">observe current value, then publish next</text>

  <!-- Requests converge on the atomic operation. -->
  <path d="M940 359L1040 382" fill="none" stroke="#555" stroke-width="2"/>
  <polygon points="1055,386 1038,374 1035,388" fill="#555"/>
  <path d="M1290 359L1190 382" fill="none" stroke="#555" stroke-width="2"/>
  <polygon points="1175,386 1195,388 1192,374" fill="#555"/>

  <!-- State transition -->
  <rect x="830" y="500" width="115" height="58" rx="4" fill="white" stroke="#4d8758"/>
  <rect x="1057" y="500" width="115" height="58" rx="4" fill="white" stroke="#4d8758"/>
  <rect x="1285" y="500" width="115" height="58" rx="4" fill="#4d8758" stroke="#4d8758"/>
  <text x="887" y="535" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#35623e">0</text>
  <text x="1114" y="535" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#35623e">1</text>
  <text x="1342" y="535" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">2</text>
  <path d="M951 529H1039" fill="none" stroke="#555" stroke-width="3"/>
  <polygon points="1053,529 1038,522 1038,536" fill="#555"/>
  <path d="M1178 529H1267" fill="none" stroke="#555" stroke-width="3"/>
  <polygon points="1281,529 1266,522 1266,536" fill="#555"/>
  <text x="1002" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Thread A</text>
  <text x="1228" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Thread B</text>
  <text x="1115" y="586" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#35623e">final value = 2 — both updates are preserved</text>

  <!-- Atomic method selector -->
  <rect x="40" y="635" width="780" height="315" rx="7" fill="#fafafa" stroke="#777" stroke-width="2"/>
  <text x="65" y="674" font-family="sans-serif" font-size="21" font-weight="bold" fill="black">Choose the atomic operation that expresses the rule</text>

  <rect x="70" y="710" width="220" height="78" rx="5" fill="#e8f1fb" stroke="#2f6fad"/>
  <rect x="320" y="710" width="220" height="78" rx="5" fill="#e8f1fb" stroke="#2f6fad"/>
  <rect x="570" y="710" width="220" height="78" rx="5" fill="#e8f1fb" stroke="#2f6fad"/>
  <text x="180" y="739" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4f82">putIfAbsent</text>
  <text x="180" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">install only when absent</text>
  <text x="430" y="739" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4f82">replace / remove</text>
  <text x="430" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">change only if value matches</text>
  <text x="680" y="739" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4f82">computeIfAbsent</text>
  <text x="680" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">create only when absent</text>

  <rect x="70" y="820" width="220" height="78" rx="5" fill="#e8f1fb" stroke="#2f6fad"/>
  <rect x="320" y="820" width="220" height="78" rx="5" fill="#e8f1fb" stroke="#2f6fad"/>
  <rect x="570" y="820" width="220" height="78" rx="5" fill="#e8f1fb" stroke="#2f6fad"/>
  <text x="180" y="849" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4f82">compute</text>
  <text x="180" y="874" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">derive from current or absent</text>
  <text x="430" y="849" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4f82">computeIfPresent</text>
  <text x="430" y="874" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">derive only when present</text>
  <text x="680" y="849" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4f82">merge</text>
  <text x="680" y="874" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">insert or combine atomically</text>
  <text x="430" y="930" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Atomic for the relevant mapping — not a transaction across several keys.</text>

  <!-- Per-key visibility -->
  <rect x="850" y="635" width="610" height="315" rx="7" fill="#eef8ef" stroke="#4d8758" stroke-width="2"/>
  <text x="875" y="674" font-family="sans-serif" font-size="21" font-weight="bold" fill="#35623e">Per-key visibility</text>
  <text x="1435" y="674" text-anchor="end" font-family="sans-serif" font-size="15" fill="#555">when get reports the published value</text>

  <rect x="890" y="710" width="150" height="58" rx="4" fill="white" stroke="#4d8758"/>
  <rect x="1080" y="710" width="150" height="58" rx="4" fill="white" stroke="#4d8758"/>
  <rect x="1270" y="710" width="150" height="58" rx="4" fill="white" stroke="#4d8758"/>
  <text x="965" y="734" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">initialize</text>
  <text x="965" y="754" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">payload</text>
  <text x="1155" y="734" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">put(key,</text>
  <text x="1155" y="754" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">payload)</text>
  <text x="1345" y="734" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">get(key)</text>
  <text x="1345" y="754" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">returns payload</text>
  <path d="M1046 739H1064" fill="none" stroke="#555" stroke-width="2"/>
  <polygon points="1077,739 1063,732.5 1063,745.5" fill="#555"/>
  <path d="M1236 739H1254" fill="none" stroke="#555" stroke-width="2"/>
  <polygon points="1267,739 1253,732.5 1253,745.5" fill="#555"/>
  <text x="1060" y="700" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#35623e">happens-before</text>
  <text x="1250" y="700" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#35623e">happens-before</text>

  <rect x="930" y="810" width="450" height="70" rx="5" fill="#dcefdc" stroke="#4d8758"/>
  <text x="1155" y="838" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#35623e">Reader sees state published before insertion</text>
  <text x="1155" y="863" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#444">Later mutations inside the value still need their own safety policy.</text>
  <text x="1155" y="918" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">No whole-map atomic snapshot is implied.</text>

  <!-- Footer -->
  <text x="750" y="982" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">Keep remapping functions short and simple; some competing updates can wait while they execute.</text>
</svg>
