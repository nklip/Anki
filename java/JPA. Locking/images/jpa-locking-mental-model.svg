<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">JPA optimistic and pessimistic locking mental model</title>
  <desc id="diagram-description">Database transaction isolation is the baseline. Optimistic locking normally reads a version and validates it when writing, while pessimistic locking obtains a database lock immediately and retains it until transaction completion. A lower decision strip compares retry cost with waiting and deadlock cost.</desc>

  <!-- Blue means validate later, orange means reserve now, and gray is the database isolation baseline shared by both strategies. -->
  <style>
    .heading { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #17212b; }
    .body { font-family: Inter, Arial, sans-serif; fill: #2f3a45; }
    .muted { font-family: Inter, Arial, sans-serif; fill: #596673; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #23303d; }
    .light { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Title identifies the single timing distinction that organizes the diagram. -->
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="heading" font-size="32">JPA locking adds rules above transaction isolation</text>
  <text x="700" y="80" text-anchor="middle" class="muted" font-size="18">Optimistic locking validates a revision later; pessimistic locking reserves database state now.</text>

  <!-- Isolation remains active for every transaction regardless of the explicit JPA lock mode. -->
  <g id="isolation-baseline">
    <rect x="40" y="110" width="1320" height="108" rx="13" fill="#f2f4f6" stroke="#87939e" stroke-width="2"/>
    <rect x="58" y="129" width="230" height="70" rx="10" fill="#66727d"/>
    <text x="173" y="158" text-anchor="middle" class="light" font-size="19">DATABASE ISOLATION</text>
    <text x="173" y="184" text-anchor="middle" class="light" font-size="14">always underneath</text>
    <text x="325" y="151" class="heading" font-size="18">Controls visibility and concurrency for the whole transaction.</text>
    <text x="325" y="181" class="body" font-size="16">JPA lock modes add entity-level guarantees; they do not replace the database isolation level.</text>
  </g>

  <!-- Optimistic path: work proceeds, then a version predicate decides whether the write is still valid. -->
  <g id="optimistic-path">
    <rect x="40" y="250" width="640" height="440" rx="13" fill="#eef5ff" stroke="#356da8" stroke-width="3"/>
    <rect x="40" y="250" width="640" height="55" rx="13" fill="#356da8"/>
    <path d="M40 291H680" stroke="#356da8" stroke-width="28"/>
    <text x="65" y="286" class="light" font-size="21">OPTIMISTIC · detect a stale revision when writing</text>
    <text x="360" y="342" text-anchor="middle" class="heading" font-size="17">Best when conflicts are uncommon and retry is acceptable</text>

    <rect x="110" y="365" width="500" height="64" rx="10" fill="#ffffff" stroke="#356da8" stroke-width="2"/>
    <text x="135" y="393" class="heading" font-size="17">Read entity state and its version</text>
    <text x="135" y="417" class="mono" font-size="15">stock = 8 · version = 5</text>

    <!-- Vertical shafts end before the following box; each triangle is a separately repairable head. -->
    <path d="M360 435V447" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="349,447 360,461 371,447" fill="#356da8"/>

    <rect x="110" y="469" width="500" height="64" rx="10" fill="#ffffff" stroke="#356da8" stroke-width="2"/>
    <text x="135" y="497" class="heading" font-size="17">Compute a change without reserving the row</text>
    <text x="135" y="521" class="muted" font-size="15">Ordinary @Version updates typically hold no long database lock.</text>

    <path d="M360 539V551" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="349,551 360,565 371,551" fill="#356da8"/>

    <rect x="110" y="573" width="500" height="64" rx="10" fill="#ffffff" stroke="#356da8" stroke-width="2"/>
    <text x="135" y="601" class="heading" font-size="17">Write only if the database still has version 5</text>
    <text x="135" y="625" class="mono" font-size="14">match → version 6 · no match → stale write rejected</text>

    <rect x="110" y="650" width="500" height="24" rx="6" fill="#ffffff" stroke="#7651a5" stroke-width="1.5"/>
    <text x="360" y="667" text-anchor="middle" class="body" font-size="13">Failure marks the transaction for rollback; reload and retry in a new one.</text>
  </g>

  <!-- Pessimistic path: the transaction reserves database state before performing conflicting work. -->
  <g id="pessimistic-path">
    <rect x="720" y="250" width="640" height="440" rx="13" fill="#fff7ef" stroke="#b56032" stroke-width="3"/>
    <rect x="720" y="250" width="640" height="55" rx="13" fill="#b56032"/>
    <path d="M720 291H1360" stroke="#b56032" stroke-width="28"/>
    <text x="745" y="286" class="light" font-size="21">PESSIMISTIC · reserve database state immediately</text>
    <text x="1040" y="342" text-anchor="middle" class="heading" font-size="17">Best when a late conflict would be unusually expensive</text>

    <rect x="790" y="365" width="500" height="64" rx="10" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="815" y="393" class="heading" font-size="17">Request a lock inside an active transaction</text>
    <text x="815" y="417" class="mono" font-size="15">PESSIMISTIC_READ or PESSIMISTIC_WRITE</text>

    <!-- Orange arrows mirror the optimistic path and remain in a text-free central corridor. -->
    <path d="M1040 435V447" fill="none" stroke="#b56032" stroke-width="4"/>
    <polygon points="1029,447 1040,461 1051,447" fill="#b56032"/>

    <rect x="790" y="469" width="500" height="64" rx="10" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="815" y="497" class="heading" font-size="17">Provider obtains a long database lock now</text>
    <text x="815" y="521" class="muted" font-size="15">Exact mechanism and coverage are database-specific.</text>

    <path d="M1040 539V551" fill="none" stroke="#b56032" stroke-width="4"/>
    <polygon points="1029,551 1040,565 1051,551" fill="#b56032"/>

    <rect x="790" y="573" width="500" height="64" rx="10" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="815" y="601" class="heading" font-size="17">Retain the lock until commit or rollback</text>
    <text x="815" y="625" class="body" font-size="15">A conflicting contender waits, times out, or fails.</text>

    <rect x="790" y="650" width="500" height="24" rx="6" fill="#ffffff" stroke="#7651a5" stroke-width="1.5"/>
    <text x="1040" y="667" text-anchor="middle" class="body" font-size="13">Costs include waiting, reduced concurrency, and possible deadlocks.</text>
  </g>

  <!-- Compact decision strip consumes the final band with the practical selection rule. -->
  <g id="decision-strip">
    <rect x="40" y="720" width="1320" height="70" rx="12" fill="#faf8fc" stroke="#7651a5" stroke-width="2"/>
    <text x="70" y="750" class="heading" font-size="17">Choose by the losing path:</text>
    <text x="310" y="750" class="body" font-size="16">optimistic = discarded work and retry;</text>
    <text x="635" y="750" class="body" font-size="16">pessimistic = waiting and deadlock risk.</text>
    <text x="70" y="777" class="muted" font-size="15">Use measurements and business cost—not the word “lock” alone—to decide.</text>
  </g>
</svg>
