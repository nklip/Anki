<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"
     role="img" aria-labelledby="diagram-title diagram-description" font-family="Inter, Arial, sans-serif">
  <title id="diagram-title">Pessimistic locking lets checkouts take turns</title>
  <desc id="diagram-description">The bars on the database lifeline show which checkout holds the write lock on the row for product 42. T1 acquires the lock and reads eight units. T2 requests the same lock and waits for find() to return. T1 subtracts two units, commits six units and releases the lock. T2 then acquires the lock and reads the six remaining units. It subtracts one unit, commits five units and releases the lock. If the request fails, LockTimeoutException leaves the JPA rollback-only flag unchanged. PessimisticLockException marks the transaction for rollback. After a database lock timeout, PostgreSQL requires a rollback of the transaction or a rollback to an earlier savepoint. MySQL InnoDB rolls back only the waiting statement by default.</desc>

  <!-- The marker noses extend four pixels past their shaft endpoints to meet the lifeline or lock bar. -->
  <defs>
    <marker id="t1-head" markerWidth="16" markerHeight="14" viewBox="0 0 16 14" refX="12" refY="7"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 7 L0 14 Z" fill="#356da8"/>
    </marker>
    <marker id="t2-head" markerWidth="16" markerHeight="14" viewBox="0 0 16 14" refX="12" refY="7"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 7 L0 14 Z" fill="#7651a5"/>
    </marker>
  </defs>
  <style>
    .participant { fill: #ffffff; font-size: 24px; font-weight: 700; text-anchor: middle; }
    .detail { fill: #ffffff; font-size: 19px; text-anchor: middle; }
    .lifeline { fill: none; stroke: #9eacb9; stroke-width: 2; stroke-dasharray: 6 7; }
    .message { fill: #243340; font-size: 23px; text-anchor: middle; }
    .confirm { fill: #263a4a; font-size: 23px; font-weight: 700; text-anchor: middle; }
    .t1 { fill: none; stroke: #356da8; stroke-width: 3; marker-end: url(#t1-head); }
    .t2 { fill: none; stroke: #7651a5; stroke-width: 3; marker-end: url(#t2-head); }
    .reply { stroke-dasharray: 10 5; }
    .alternative { fill: #76451e; font-size: 24px; font-weight: 700; }
    .exception { fill: #322e29; font-size: 24px; font-weight: 700; }
    .scope { fill: #494037; font-size: 22px; }
  </style>

  <!-- The subtitle names the exact lock mode applied to both reads. -->
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="48" y="64" font-size="40" font-weight="700" fill="#17212b">Pessimistic locking lets checkouts take turns</text>
  <text x="48" y="105" font-size="23" fill="#465b70">Both transactions call find() with PESSIMISTIC_WRITE to lock the same product row.</text>

  <!-- Participant boxes anchor the same three lifelines throughout the successful sequence. -->
  <g id="participants">
    <rect x="44" y="140" width="202" height="62" rx="10" fill="#356da8"/>
    <rect x="499" y="140" width="202" height="62" rx="10" fill="#465b70"/>
    <rect x="954" y="140" width="202" height="62" rx="10" fill="#7651a5"/>
    <text x="145" y="166" class="participant">Checkout 1</text>
    <text x="600" y="166" class="participant">Database</text>
    <text x="1055" y="166" class="participant">Checkout 2</text>
    <text x="145" y="190" class="detail">T1 · wants 2 units</text>
    <text x="600" y="190" class="detail">Product 42</text>
    <text x="1055" y="190" class="detail">T2 · wants 1 unit</text>
    <path class="lifeline" d="M145 202V793 M600 202V793 M1055 202V793"/>
  </g>

  <!-- Lock bars on the database lifeline take the color of the checkout that owns the lock. -->
  <g id="database-lock-ownership" text-anchor="end" font-size="22" font-weight="700">
    <rect x="593" y="261" width="14" height="286" rx="2" fill="#d8e8f8" stroke="#356da8" stroke-width="2"/>
    <rect x="593" y="594" width="14" height="149" rx="2" fill="#e9e0f3" stroke="#7651a5" stroke-width="2"/>
    <text x="585" y="352" fill="#356da8">T1 holds the lock</text>
    <text x="585" y="690" fill="#7651a5">T2 holds the lock</text>
  </g>

  <!-- The amber interval on T2's lifeline spans the outstanding request and stops at its reply. -->
  <g id="pending-request">
    <rect x="1049" y="374" width="12" height="237" rx="3" fill="#f8d991" stroke="#aa711b" stroke-width="2"/>
    <text x="1027" y="476" text-anchor="end" fill="#855212" font-size="24" font-weight="700">T2 waits for find() to return</text>
    <text x="1027" y="507" text-anchor="end" fill="#644c31" font-size="22">T1 releases the lock at commit.</text>
  </g>

  <!-- Solid messages request work; dashed replies return the lock, data, or commit result. -->
  <g id="t1-locks-and-reads">
    <text x="373" y="238" class="message">Request write lock</text>
    <path class="t1" d="M146 252H595"/>
    <text x="373" y="299" class="confirm">Lock granted · stock 8</text>
    <path class="t1 reply" d="M592 313H150"/>
  </g>
  <g id="t2-requests-same-lock">
    <text x="828" y="360" class="message">Request the same write lock</text>
    <path class="t2" d="M1054 374H612"/>
  </g>

  <!-- T1's stock change remains under its lock until commit. -->
  <g id="t1-writes-and-commits">
    <text x="373" y="423" class="message">Write stock 8 − 2 = 6</text>
    <path class="t1" d="M146 437H588"/>
    <text x="373" y="481" class="message">Commit</text>
    <path class="t1" d="M146 495H588"/>
    <text x="373" y="539" class="confirm">Committed 6 units · lock released</text>
    <path class="t1 reply" d="M599 553H150"/>
  </g>

  <!-- The blocked read resumes only after the previous commit makes six units available. -->
  <g id="t2-locks-writes-and-commits">
    <text x="828" y="600" class="confirm">Lock granted · stock 6</text>
    <path class="t2 reply" d="M608 614H1050"/>
    <text x="828" y="659" class="message">Write stock 6 − 1 = 5</text>
    <path class="t2" d="M1054 673H612"/>
    <text x="828" y="712" class="message">Commit</text>
    <path class="t2" d="M1054 726H612"/>
    <text x="828" y="766" class="confirm">Committed 5 units · lock released</text>
    <path class="t2 reply" d="M601 780H1050"/>
  </g>

  <!-- This separate panel branches from the amber waiting interval, outside the successful timeline. -->
  <g id="failed-lock-request">
    <rect x="44" y="808" width="1112" height="171" rx="12" fill="#fff8ec" stroke="#d6b77f" stroke-width="2"/>
    <text x="68" y="837" class="alternative">If T2’s lock request fails</text>
    <path d="M68 847H1132 M567 856V904 M68 916H1132" fill="none" stroke="#ddc9a5" stroke-width="2"/>
    <text x="68" y="872" class="exception">LockTimeoutException</text>
    <text x="68" y="900" class="scope">JPA leaves T2’s rollback-only flag unchanged.</text>
    <text x="589" y="872" class="exception">PessimisticLockException</text>
    <text x="589" y="900" class="scope">JPA marks T2 for rollback. Retry in a new transaction.</text>
    <text x="68" y="938" class="scope">After a lock timeout, PostgreSQL requires a rollback before further SQL can run.</text>
    <text x="68" y="965" class="scope">MySQL InnoDB rolls back only the waiting statement by default.</text>
  </g>
</svg>
