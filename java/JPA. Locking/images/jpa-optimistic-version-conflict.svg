<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Optimistic locking rejects a stale update</title>
  <desc id="diagram-description">Time runs downward. Vertical bars show each checkout preparing requests or handling replies and the database processing each request. Both checkouts read eight units of product 42 at version 5. Each requests a stock change and a version increase to 6 only if the stored version is still 5. Checkout 1 sets stock to six and commits. Checkout 2 then tries to set stock to seven. The database reports zero updated rows because the stored version is now 6. JPA raises OptimisticLockException and the second transaction rolls back. A fresh transaction can read six and reserve one, leaving five.</desc>

  <!-- Marker tips project three units past the path endpoints to meet the near face of the activity bar. -->
  <defs>
    <marker id="first-checkout-arrow" viewBox="0 0 16 14" markerWidth="16" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L16 7L0 14Z" fill="#356da8"/>
    </marker>
    <marker id="second-checkout-arrow" viewBox="0 0 16 14" markerWidth="16" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L16 7L0 14Z" fill="#7651a5"/>
    </marker>
    <marker id="failed-reply" viewBox="0 0 16 14" markerWidth="16" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L16 7L0 14Z" fill="#a93832"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #17212b; }
    .title { font-size: 40px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #46596b; }
    .actor { font-size: 24px; font-weight: 700; fill: #fff; }
    .role { font-size: 19px; fill: #fff; }
    .label { font-size: 23px; }
    .error { font-size: 23px; fill: #94332d; font-weight: 700; }
    .note { font-size: 21px; }
    .life { stroke: #9aaab8; stroke-width: 2; stroke-dasharray: 6 7; }
    .t1 { stroke: #356da8; stroke-width: 3; fill: none; marker-end: url(#first-checkout-arrow); }
    .t2 { stroke: #7651a5; stroke-width: 3; fill: none; marker-end: url(#second-checkout-arrow); }
    .reply { stroke-dasharray: 10 5; }
  </style>
  <rect width="1200" height="1000" fill="#fff"/>

  <!-- The same participants and arrow conventions appear in the pessimistic sequence. -->
  <g id="heading">
    <text x="48" y="64" class="title">Optimistic locking rejects a stale update</text>
    <text x="48" y="105" class="subtitle">Read down. Vertical bars show who is working. Solid arrows are requests. Dashed arrows are replies.</text>
  </g>
  <g id="participants" text-anchor="middle">
    <rect x="44" y="140" width="202" height="62" rx="10" fill="#356da8"/>
    <rect x="499" y="140" width="202" height="62" rx="10" fill="#465b70"/>
    <rect x="954" y="140" width="202" height="62" rx="10" fill="#7651a5"/>
    <text x="145" y="166" class="actor">Checkout 1</text>
    <text x="600" y="166" class="actor">Database</text>
    <text x="1055" y="166" class="actor">Checkout 2</text>
    <text x="145" y="190" class="role">T1 · wants 2 units</text>
    <text x="600" y="190" class="role">Product 42</text>
    <text x="1055" y="190" class="role">T2 · wants 1 unit</text>
    <line x1="145" x2="145" y1="202" y2="849" class="life"/>
    <line x1="600" x2="600" y1="202" y2="849" class="life"/>
    <line x1="1055" x2="1055" y1="202" y2="849" class="life"/>
  </g>

  <!-- Checkout bars stop when a request is sent and resume when its reply arrives. -->
  <g id="checkout-1-activity" fill="#d8e8f8" stroke="#356da8" stroke-width="2">
    <rect x="138" y="230" width="14" height="28" rx="2"/>
    <rect x="138" y="304" width="14" height="162" rx="2"/>
    <rect x="138" y="513" width="14" height="54" rx="2"/>
    <rect x="138" y="603" width="14" height="17" rx="2"/>
  </g>
  <!-- The gap between calculating seven and sending the update leaves T2's idle interval visible. -->
  <g id="checkout-2-activity" fill="#e9e0f3" stroke="#7651a5" stroke-width="2">
    <rect x="1048" y="330" width="14" height="28" rx="2"/>
    <rect x="1048" y="404" width="14" height="149" rx="2"/>
    <rect x="1048" y="641" width="14" height="28" rx="2"/>
    <rect x="1048" y="717" width="14" height="119" rx="2"/>
  </g>
  <!-- Separate database bars cover both reads, the first update and commit, the stale update, and rollback. -->
  <g id="database-activity" fill="#e1e8ee" stroke="#465b70" stroke-width="2">
    <rect x="593" y="254" width="14" height="54" rx="2"/>
    <rect x="593" y="354" width="14" height="54" rx="2"/>
    <rect x="593" y="462" width="14" height="55" rx="2"/>
    <rect x="593" y="563" width="14" height="44" rx="2"/>
    <rect x="593" y="665" width="14" height="56" rx="2"/>
    <rect x="593" y="832" width="14" height="17" rx="2"/>
  </g>

  <!-- Both transactions receive the original revision before either attempts a write. -->
  <g id="initial-reads" text-anchor="middle">
    <text x="372" y="244" class="label">Read product 42</text>
    <path class="t1" d="M153 256H589"/>
    <text x="372" y="294" class="label">8 units, version 5</text>
    <path class="t1 reply" d="M592 306H156"/>
    <text x="828" y="344" class="label">Read product 42</text>
    <path class="t2" d="M1047 356H611"/>
    <text x="172" y="382" text-anchor="start" class="note">T1 calculates 8 − 2 = 6.</text>
    <text x="828" y="394" class="label">8 units, version 5</text>
    <path class="t2 reply" d="M608 406H1044"/>
  </g>

  <!-- The conditional write succeeds first. Commit makes the new revision visible to the other checkout. -->
  <g id="first-checkout-commits" text-anchor="middle">
    <text x="372" y="452" class="label">Set stock 6, version 6 if version is 5</text>
    <path class="t1" d="M153 464H589"/>
    <text x="372" y="503" class="label">1 row updated</text>
    <path class="t1 reply" d="M592 515H156"/>
    <rect x="652" y="478" width="352" height="75" rx="8" fill="#f4f0fa"/>
    <text x="828" y="509" class="note">Checkout 2 still remembers 8.</text>
    <text x="828" y="537" class="note">It plans to write 8 − 1 = 7.</text>
    <text x="372" y="553" class="label">Commit</text>
    <path class="t1" d="M153 565H589"/>
    <text x="372" y="591" class="label">Committed 6 units at version 6</text>
    <path class="t1 reply" d="M592 605H156"/>
  </g>

  <!-- The database returns an affected-row count. The persistence provider interprets it as an optimistic conflict. -->
  <g id="stale-update" text-anchor="middle">
    <text x="828" y="655" class="label">Set stock 7, version 6 if version is 5</text>
    <path class="t2" d="M1047 667H611"/>
    <text x="828" y="707" class="error">0 rows updated</text>
    <path d="M608 719H1044" data-connector="true" fill="none" stroke="#a93832" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#failed-reply)"/>
    <rect x="623" y="735" width="408" height="58" rx="8" fill="#fbeeea"/>
    <text x="827" y="759" class="note">JPA raises OptimisticLockException.</text>
    <text x="827" y="783" class="note">T2 is marked for rollback.</text>
    <text x="828" y="822" class="label">Roll back</text>
    <path class="t2" d="M1047 834H611"/>
  </g>

  <!-- A retry starts a new transaction after the failed transaction has rolled back. -->
  <g id="retry">
    <rect x="48" y="874" width="1104" height="96" rx="12" fill="#edf4fa"/>
    <text x="72" y="911" font-size="25" font-weight="700">If the reservation can be retried</text>
    <text x="72" y="949" class="label">Start a new transaction and read 6 units at version 6. Reserving one leaves 5 at version 7.</text>
  </g>
</svg>
