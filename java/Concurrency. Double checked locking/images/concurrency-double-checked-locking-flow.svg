<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title description">
  <title id="title">Double-checked locking has a fast path and an initialization path</title>
  <desc id="description">A caller first reads a volatile reference into a local variable. A non-null value returns without locking. A null value enters a stable lock and checks again. If another thread already initialized the value, that value is returned. Otherwise the current thread constructs the object, publishes it through a volatile write, releases the lock, and returns it.</desc>

  <!-- Shared typography and semantic colors keep future wording repairs localized. -->
  <defs>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #182230; }
      .subtitle { font: 20px Arial, Helvetica, sans-serif; fill: #52606d; }
      .panelTitle { font: 700 25px Arial, Helvetica, sans-serif; }
      .nodeTitle { font: 700 20px Arial, Helvetica, sans-serif; fill: #182230; }
      .body { font: 17px Arial, Helvetica, sans-serif; fill: #364152; }
      .code { font: 700 18px "Courier New", monospace; fill: #182230; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; }
      .footer { font: 700 19px Arial, Helvetica, sans-serif; fill: #182230; }
    </style>
  </defs>

  <!-- Background and explicit reading direction. -->
  <rect width="1500" height="880" fill="#ffffff"/>
  <text x="750" y="50" text-anchor="middle" class="title">Double-checked locking: two paths, two different checks</text>
  <text x="750" y="84" text-anchor="middle" class="subtitle">Begin at “method call”; follow green for the common fast path and orange when initialization is needed</text>

  <!-- Fast path: one volatile read and no monitor acquisition after initialization. -->
  <rect x="40" y="115" width="1420" height="270" rx="18" fill="#f2f8f3" stroke="#84ae8b" stroke-width="3"/>
  <text x="70" y="155" class="panelTitle" fill="#2f6f3e">FAST PATH — used after the object exists</text>

  <rect x="75" y="205" width="160" height="100" rx="14" fill="#ffffff" stroke="#4f8a5b" stroke-width="3"/>
  <text x="155" y="247" text-anchor="middle" class="nodeTitle">Method call</text>
  <text x="155" y="278" text-anchor="middle" class="code">instance()</text>

  <!-- Horizontal shaft ends beneath its own head; the head touches the next border only. -->
  <path d="M235 255 H284" fill="none" stroke="#4f8a5b" stroke-width="6"/>
  <polygon points="300,255 282,244 282,266" fill="#4f8a5b"/>

  <rect x="300" y="185" width="320" height="140" rx="14" fill="#eef4ff" stroke="#4774b3" stroke-width="3"/>
  <text x="460" y="224" text-anchor="middle" class="nodeTitle">Read volatile reference once</text>
  <text x="460" y="264" text-anchor="middle" class="code">result = instance;</text>
  <text x="460" y="298" text-anchor="middle" class="body">Keep the acquired value in a local</text>

  <path d="M620 255 H674" fill="none" stroke="#4f8a5b" stroke-width="6"/>
  <polygon points="690,255 672,244 672,266" fill="#4f8a5b"/>

  <rect x="690" y="185" width="310" height="140" rx="14" fill="#fff8e8" stroke="#bc7824" stroke-width="3"/>
  <text x="845" y="224" text-anchor="middle" class="nodeTitle">First check</text>
  <text x="845" y="264" text-anchor="middle" class="code">result != null?</text>
  <text x="845" y="298" text-anchor="middle" class="body">Purpose: avoid locking when ready</text>

  <path d="M1000 255 H1164" fill="none" stroke="#4f8a5b" stroke-width="6"/>
  <polygon points="1180,255 1162,244 1162,266" fill="#4f8a5b"/>
  <text x="1090" y="233" text-anchor="middle" class="label" fill="#2f6f3e">non-null</text>

  <rect x="1180" y="185" width="235" height="140" rx="14" fill="#e8f5eb" stroke="#4f8a5b" stroke-width="3"/>
  <text x="1298" y="230" text-anchor="middle" class="nodeTitle">Return immediately</text>
  <text x="1298" y="270" text-anchor="middle" class="code">return result;</text>
  <text x="1298" y="301" text-anchor="middle" class="body">No lock acquired</text>

  <!-- Initialization path: the second check happens only after the shared lock is held. -->
  <rect x="40" y="420" width="1420" height="365" rx="18" fill="#fff9ef" stroke="#d5a45f" stroke-width="3"/>
  <text x="70" y="450" class="panelTitle" fill="#8b5718">INITIALIZATION PATH — used only while the local value is null</text>

  <!-- The null branch is painted above both panel backgrounds but below all node text. -->
  <path d="M845 325 V478 H186 V493" fill="none" stroke="#bc7824" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="186,510 175,492 197,492" fill="#bc7824"/>
  <text x="815" y="365" text-anchor="end" class="label" fill="#8b5718">null → initialization path</text>

  <rect x="75" y="510" width="225" height="125" rx="14" fill="#fff2d9" stroke="#bc7824" stroke-width="3"/>
  <text x="188" y="550" text-anchor="middle" class="nodeTitle">Acquire stable lock</text>
  <text x="188" y="588" text-anchor="middle" class="code">synchronized (...)</text>
  <text x="188" y="615" text-anchor="middle" class="body">Only one initializer enters</text>

  <path d="M300 572 H354" fill="none" stroke="#bc7824" stroke-width="6"/>
  <polygon points="370,572 352,561 352,583" fill="#bc7824"/>

  <rect x="370" y="495" width="325" height="155" rx="14" fill="#fff8e8" stroke="#bc7824" stroke-width="3"/>
  <text x="533" y="535" text-anchor="middle" class="nodeTitle">Second read and check</text>
  <text x="533" y="574" text-anchor="middle" class="code">result = instance;</text>
  <text x="533" y="605" text-anchor="middle" class="code">result != null?</text>
  <text x="533" y="633" text-anchor="middle" class="body">Purpose: detect the thread that won</text>

  <!-- Non-null branch: a waiting thread uses the already-published winner. -->
  <path d="M695 550 H774" fill="none" stroke="#4f8a5b" stroke-width="6"/>
  <polygon points="790,550 772,539 772,561" fill="#4f8a5b"/>
  <text x="743" y="529" text-anchor="middle" class="label" fill="#2f6f3e">non-null</text>
  <rect x="790" y="490" width="220" height="120" rx="14" fill="#e8f5eb" stroke="#4f8a5b" stroke-width="3"/>
  <text x="900" y="531" text-anchor="middle" class="nodeTitle">Use winner’s object</text>
  <text x="900" y="568" text-anchor="middle" class="body">Do not construct again</text>

  <!-- Still-null branch: construction completes before the volatile publication. -->
  <path d="M533 650 V682 H774" fill="none" stroke="#bc7824" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="790,682 772,671 772,693" fill="#bc7824"/>
  <text x="643" y="705" text-anchor="middle" class="label" fill="#8b5718">still null</text>
  <rect x="790" y="630" width="220" height="105" rx="14" fill="#eef4ff" stroke="#4774b3" stroke-width="3"/>
  <text x="900" y="670" text-anchor="middle" class="nodeTitle">Construct fully</text>
  <text x="900" y="706" text-anchor="middle" class="code">new Service()</text>

  <path d="M1010 682 H1054" fill="none" stroke="#7354a3" stroke-width="6"/>
  <polygon points="1070,682 1052,671 1052,693" fill="#7354a3"/>

  <rect x="1070" y="630" width="300" height="105" rx="14" fill="#f3edfb" stroke="#7354a3" stroke-width="3"/>
  <text x="1220" y="670" text-anchor="middle" class="nodeTitle">Publish with volatile write</text>
  <text x="1220" y="706" text-anchor="middle" class="code">instance = result;</text>

  <!-- Both initialization branches converge on the same lock release and return. -->
  <path d="M1010 550 H1054" fill="none" stroke="#4f8a5b" stroke-width="6"/>
  <polygon points="1070,550 1052,539 1052,561" fill="#4f8a5b"/>
  <rect x="1070" y="490" width="300" height="120" rx="14" fill="#e8f5eb" stroke="#4f8a5b" stroke-width="3"/>
  <text x="1220" y="531" text-anchor="middle" class="nodeTitle">Release lock and return</text>
  <text x="1220" y="568" text-anchor="middle" class="code">return result;</text>

  <!-- Publication arrow rises into the bottom border; the head remains outside the target. -->
  <path d="M1220 630 V626" fill="none" stroke="#7354a3" stroke-width="6"/>
  <polygon points="1220,610 1209,628 1231,628" fill="#7354a3"/>

  <!-- Summary boxes are isolated below every route to prevent connector/text collisions. -->
  <rect x="115" y="814" width="1270" height="48" rx="12" fill="#f4f6f8" stroke="#aab4bf" stroke-width="2"/>
  <text x="750" y="845" text-anchor="middle" class="footer">First check saves locking • second check prevents duplicate construction • volatile safely publishes the object</text>
</svg>
