<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">TreeMap searches one branch at each comparison</title>
  <desc id="desc">The demo's OpenJDK 25 tree has root 40, children 20 and 60, and leaves 10, 30, 50, and 70. To find 50, follow the thicker path from 40 to 60 to 50, as traced in the panel. Left subtrees contain smaller keys and right subtrees contain larger keys. Visiting left subtree, node, then right subtree yields sorted iteration. Balancing colors are omitted.</desc>
  <!-- Shared typography; the lookup route uses greater line thickness as well as blue. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
      .title { font-size: 27px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #5f6368; }
      .node { fill: #f1f3f4; stroke: #9aa0a6; stroke-width: 2; }
      .visited { fill: #e8f0fe; stroke: #356eb3; stroke-width: 2; }
      .key { font-size: 20px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <!-- Heading and reading instructions. -->
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="30" y="42" class="title">TreeMap: comparisons narrow the search</text>
  <text x="30" y="75" class="body">Natural integer order · each box is key : value · start at the root</text>
  <!-- Parent-child links have no arrowheads; their top-down reading order is explicit. -->
  <g id="tree-links" fill="none" stroke="#9aa0a6" stroke-width="2">
    <path d="M340 174 L180 224"/>
    <path d="M340 174 L500 224" stroke="#356eb3" stroke-width="4"/>
    <path d="M180 272 L100 322"/>
    <path d="M180 272 L260 322"/>
    <path d="M500 272 L420 322" stroke="#356eb3" stroke-width="4"/>
    <path d="M500 272 L580 322"/>
  </g>
  <!-- Nodes; the actual red-black color flags are intentionally not shown. -->
  <g id="tree-nodes">
    <rect x="292" y="126" width="96" height="48" rx="8" class="visited"/>
    <rect x="132" y="224" width="96" height="48" rx="8" class="node"/>
    <rect x="452" y="224" width="96" height="48" rx="8" class="visited"/>
    <rect x="52" y="322" width="96" height="48" rx="8" class="node"/>
    <rect x="212" y="322" width="96" height="48" rx="8" class="node"/>
    <rect x="372" y="322" width="96" height="48" rx="8" class="visited"/>
    <rect x="532" y="322" width="96" height="48" rx="8" class="node"/>
    <text x="340" y="157" class="key">40 : D</text>
    <text x="180" y="255" class="key">20 : B</text>
    <text x="500" y="255" class="key">60 : F</text>
    <text x="100" y="353" class="key">10 : A</text>
    <text x="260" y="353" class="key">30 : C</text>
    <text x="420" y="353" class="key">50 : E</text>
    <text x="580" y="353" class="key">70 : G</text>
    <text x="340" y="112" class="small" text-anchor="middle">root</text>
  </g>
  <!-- Compact rule panel explains both the general relation and the concrete search. -->
  <rect x="662" y="112" width="268" height="272" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="682" y="145" class="body" font-weight="700">At every node</text>
  <text x="682" y="177" class="body">Smaller keys: left subtree</text>
  <text x="682" y="207" class="body">Larger keys: right subtree</text>
  <text x="682" y="252" class="body" font-weight="700">Find 50: thick path</text>
  <text x="682" y="283" class="body">50 &gt; 40: go right</text>
  <text x="682" y="312" class="body">50 &lt; 60: go left</text>
  <text x="682" y="341" class="body">50 = 50: return E</text>
  <text x="682" y="369" class="small">Only 3 mappings visited.</text>
  <!-- The iteration strip separates key order from the tree's physical shape. -->
  <rect x="30" y="407" width="900" height="51" rx="8" fill="#e6f4ea"/>
  <text x="50" y="439" class="body">Sorted iteration: 10 → 20 → 30 → 40 → 50 → 60 → 70</text>
  <text x="30" y="484" class="small">OpenJDK 25 demo tree. Balancing colors and empty (null) child links are omitted.</text>
</svg>
