<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title description">
  <title id="title">SequencedMap orders entries and exposes a reversed view</title>
  <desc id="description">A LinkedHashMap named scores contains Ada=10, Ben=20, and Cy=30 in insertion order. Its reversed view visits Cy=30, Ben=20, and Ada=10. First and last are swapped. Calling pollFirstEntry on the reversed view removes Cy=30 from scores, leaving Ada=10 and Ben=20.</desc>

  <!-- Shared typography; palette matches the SequencedCollection companion diagram. -->
  <defs>
    <style>
      text { font-family: sans-serif; }
      .code { font-family: monospace; }
      .blue { fill: #1d4f82; }
      .purple { fill: #6a3e94; }
    </style>
  </defs>

  <!-- Lesson statement and notation: each node is one complete map entry. -->
  <rect width="1500" height="720" fill="white"/>
  <text x="750" y="52" text-anchor="middle" font-size="36" font-weight="bold" fill="#111">SequencedMap: entries in order, accessible from either end</text>
  <text x="750" y="90" text-anchor="middle" font-size="22" fill="#444">Each box is a key=value entry; arrows show the order in which entries are visited</text>

  <!-- Original map: positions follow insertion order for this default LinkedHashMap. -->
  <g id="original-order">
    <rect x="55" y="130" width="625" height="380" rx="10" fill="#edf5fd" stroke="#2f6fad" stroke-width="3"/>
    <path d="M55 198H680" stroke="#2f6fad" stroke-width="3"/>
    <text x="367" y="173" text-anchor="middle" font-size="27" font-weight="bold" class="blue">scores: LinkedHashMap</text>

    <text x="165" y="239" text-anchor="middle" font-size="18" font-weight="bold" class="blue">FIRST</text>
    <text x="569" y="239" text-anchor="middle" font-size="18" font-weight="bold" class="blue">LAST</text>

    <rect x="90" y="264" width="150" height="90" rx="8" fill="white" stroke="#2f6fad" stroke-width="2"/>
    <text x="165" y="318" text-anchor="middle" font-size="25" font-weight="bold" class="code blue">Ada=10</text>
    <rect x="292" y="264" width="150" height="90" rx="8" fill="white" stroke="#2f6fad" stroke-width="2"/>
    <text x="367" y="318" text-anchor="middle" font-size="25" font-weight="bold" class="code blue">Ben=20</text>
    <rect x="494" y="264" width="150" height="90" rx="8" fill="white" stroke="#2f6fad" stroke-width="2"/>
    <text x="569" y="318" text-anchor="middle" font-size="25" font-weight="bold" class="code blue">Cy=30</text>

    <!-- Shafts end inside their heads' bases; arrow tips stop short of node borders. -->
    <path id="original-first-connector" data-connector="true" d="M246 309H268" stroke="#2f6fad" stroke-width="3"/>
    <polygon points="286,309 267,300 267,318" fill="#2f6fad"/>
    <path id="original-last-connector" data-connector="true" d="M448 309H470" stroke="#2f6fad" stroke-width="3"/>
    <polygon points="488,309 469,300 469,318" fill="#2f6fad"/>

    <rect x="105" y="390" width="525" height="85" rx="8" fill="#dceafb" stroke="#2f6fad" stroke-width="2"/>
    <text x="367" y="424" text-anchor="middle" font-size="22" font-weight="bold" class="code blue">scores.firstEntry() = Ada=10</text>
    <text x="367" y="456" text-anchor="middle" font-size="22" font-weight="bold" class="code blue">scores.lastEntry() = Cy=30</text>
  </g>

  <!-- The central relation creates a view; its arrow stays outside both panels. -->
  <g id="reversed-relation">
    <text x="750" y="275" text-anchor="middle" font-size="20" font-weight="bold" class="code purple">reversed()</text>
    <path id="view-connector" data-connector="true" d="M697 309H784" stroke="#7b4ba3" stroke-width="4"/>
    <polygon points="803,309 783,299 783,319" fill="#7b4ba3"/>
    <text x="750" y="354" text-anchor="middle" font-size="18" class="purple">same entries</text>
    <text x="750" y="381" text-anchor="middle" font-size="18" class="purple">reverse order</text>
  </g>

  <!-- Reverse view: key-value pairs stay together, while first and last exchange roles. -->
  <g id="reversed-order">
    <rect x="820" y="130" width="625" height="380" rx="10" fill="#f4edfb" stroke="#7b4ba3" stroke-width="3"/>
    <path d="M820 198H1445" stroke="#7b4ba3" stroke-width="3"/>
    <text x="1132" y="173" text-anchor="middle" font-size="27" font-weight="bold" class="purple">reverse: view of scores</text>

    <text x="930" y="239" text-anchor="middle" font-size="18" font-weight="bold" class="purple">FIRST</text>
    <text x="1334" y="239" text-anchor="middle" font-size="18" font-weight="bold" class="purple">LAST</text>

    <rect x="855" y="264" width="150" height="90" rx="8" fill="white" stroke="#7b4ba3" stroke-width="2"/>
    <text x="930" y="318" text-anchor="middle" font-size="25" font-weight="bold" class="code purple">Cy=30</text>
    <rect x="1057" y="264" width="150" height="90" rx="8" fill="white" stroke="#7b4ba3" stroke-width="2"/>
    <text x="1132" y="318" text-anchor="middle" font-size="25" font-weight="bold" class="code purple">Ben=20</text>
    <rect x="1259" y="264" width="150" height="90" rx="8" fill="white" stroke="#7b4ba3" stroke-width="2"/>
    <text x="1334" y="318" text-anchor="middle" font-size="25" font-weight="bold" class="code purple">Ada=10</text>

    <!-- The reversed encounter order still reads left to right within this panel. -->
    <path id="reverse-first-connector" data-connector="true" d="M1011 309H1033" stroke="#7b4ba3" stroke-width="3"/>
    <polygon points="1051,309 1032,300 1032,318" fill="#7b4ba3"/>
    <path id="reverse-last-connector" data-connector="true" d="M1213 309H1235" stroke="#7b4ba3" stroke-width="3"/>
    <polygon points="1253,309 1234,300 1234,318" fill="#7b4ba3"/>

    <rect x="870" y="390" width="525" height="85" rx="8" fill="#eadcf7" stroke="#7b4ba3" stroke-width="2"/>
    <text x="1132" y="424" text-anchor="middle" font-size="22" font-weight="bold" class="code purple">reverse.firstEntry() = Cy=30</text>
    <text x="1132" y="456" text-anchor="middle" font-size="22" font-weight="bold" class="code purple">reverse.lastEntry() = Ada=10</text>
  </g>

  <!-- Concrete write-through outcome ties the view to the original map's stored entries. -->
  <g id="removal-outcome">
    <rect x="120" y="550" width="1260" height="115" rx="9" fill="#fafafa" stroke="#777" stroke-width="2"/>
    <text x="750" y="588" text-anchor="middle" font-size="25" font-weight="bold" fill="#333">Removing from the view removes from the original map</text>
    <text x="750" y="633" text-anchor="middle" font-size="23" class="code" fill="#333">reverse.pollFirstEntry() returns Cy=30 → scores is now {Ada=10, Ben=20}</text>
  </g>
  <text x="750" y="699" text-anchor="middle" font-size="19" fill="#555">This example uses LinkedHashMap, which supports removal through its reversed view.</text>
</svg>
