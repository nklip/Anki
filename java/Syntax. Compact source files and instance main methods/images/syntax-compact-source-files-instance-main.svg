<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Compact source files and instance main methods in Java 25</title>
  <desc id="description">A beginner comparison of a traditional Java entry point with a compact source file, followed by the compiler and launcher steps that create an implicit class, construct an instance, and invoke main.</desc>

  <!-- Shared typography and semantic colors: blue is explicit source, purple is compiler-supplied structure, and green is launch behavior. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and lesson statement. -->
  <rect id="background" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Java 25: less entry-point ceremony</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">The class still exists; Java can declare it implicitly and launch an instance main method</text>
  <rect x="1000" y="22" width="170" height="42" rx="21" fill="#dcefe1" stroke="#34834b" stroke-width="2"/>
  <text x="1085" y="49" text-anchor="middle" class="heading" font-size="15">FINAL · JDK 25</text>

  <!-- Source comparison: the compact form removes syntax, not the class-based execution model. -->
  <g id="source-comparison">
    <g id="traditional-source">
      <rect x="30" y="105" width="435" height="270" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
      <rect x="30" y="105" width="435" height="48" rx="11" fill="#356eb3"/>
      <rect x="30" y="142" width="435" height="11" fill="#356eb3"/>
      <text x="55" y="137" class="light" font-size="20">Traditional entry point · still valid</text>
      <text x="60" y="190" class="mono" font-size="15">public class HelloWorld {</text>
      <text x="80" y="220" class="mono" font-size="15">public static void main(String[] args) {</text>
      <text x="100" y="250" class="mono" font-size="15">System.out.println("Hello");</text>
      <text x="80" y="280" class="mono" font-size="15">}</text>
      <text x="60" y="310" class="mono" font-size="15">}</text>
      <text x="247" y="349" text-anchor="middle" class="muted" font-size="15">class + public + static + parameter are explicit</text>
    </g>

    <!-- Arrowhead stops before the compact-source border. -->
    <path d="M475 240H492" fill="none" stroke="#64717c" stroke-width="4"/>
    <polygon points="492,230 509,240 492,250" fill="#64717c"/>

    <g id="compact-source">
      <rect x="520" y="105" width="650" height="270" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="3"/>
      <rect x="520" y="105" width="650" height="48" rx="11" fill="#744b91"/>
      <rect x="520" y="142" width="650" height="11" fill="#744b91"/>
      <text x="545" y="137" class="light" font-size="20">Compact source file · HelloWorld.java</text>

      <text x="555" y="190" class="mono" font-size="15">String greeting = "Hello";</text>
      <text x="555" y="225" class="mono" font-size="15">void main() {</text>
      <text x="575" y="255" class="mono" font-size="15">System.out.println(greeting);</text>
      <text x="555" y="285" class="mono" font-size="15">}</text>

      <rect x="875" y="180" width="260" height="125" rx="8" fill="#ffffff" stroke="#744b91" stroke-width="2"/>
      <text x="1005" y="212" text-anchor="middle" class="heading" font-size="17">What is omitted?</text>
      <text x="1005" y="241" text-anchor="middle" class="body" font-size="15">explicit class declaration</text>
      <text x="1005" y="267" text-anchor="middle" class="body" font-size="15">public · static · String[]</text>
      <text x="845" y="348" text-anchor="middle" class="muted" font-size="15">Fields and helper methods become members of the implicit class.</text>
    </g>
  </g>

  <!-- Execution sequence: every arrowhead stops before its destination, while labels sit above connector geometry. -->
  <g id="compile-and-launch-flow">
    <rect x="30" y="400" width="1140" height="175" rx="11" fill="#f7f9fb" stroke="#64717c" stroke-width="2"/>
    <text x="55" y="434" class="heading" font-size="20">What Java does</text>

    <rect x="55" y="460" width="230" height="82" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="3"/>
    <text x="170" y="491" text-anchor="middle" class="heading" font-size="17">1 · Read declarations</text>
    <text x="170" y="520" text-anchor="middle" class="mono" font-size="14">fields + methods</text>

    <path d="M295 501H342" fill="none" stroke="#744b91" stroke-width="4"/>
    <polygon points="342,491 359,501 342,511" fill="#744b91"/>

    <rect x="370" y="452" width="305" height="98" rx="8" fill="#f1e7f7" stroke="#744b91" stroke-width="3"/>
    <text x="522" y="483" text-anchor="middle" class="heading" font-size="17">2 · Supply a class</text>
    <text x="522" y="512" text-anchor="middle" class="body" font-size="15">implicit · final · unnamed package</text>
    <text x="522" y="536" text-anchor="middle" class="muted" font-size="13">its name is unavailable in source</text>

    <path d="M685 501H732" fill="none" stroke="#34834b" stroke-width="4"/>
    <polygon points="732,491 749,501 732,511" fill="#34834b"/>

    <rect x="760" y="452" width="385" height="98" rx="8" fill="#edf8f0" stroke="#34834b" stroke-width="3"/>
    <text x="952" y="483" text-anchor="middle" class="heading" font-size="17">3 · Launch an instance main</text>
    <text x="952" y="512" text-anchor="middle" class="body" font-size="15">construct no-argument instance → call main</text>
    <text x="952" y="536" text-anchor="middle" class="muted" font-size="13">also works for an explicitly declared class</text>
  </g>

  <!-- Candidate-main checklist: concise rules prevent the common assumption that every modifier is now optional. -->
  <g id="candidate-main-rules">
    <rect x="30" y="600" width="1140" height="90" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="55" y="633" class="heading" font-size="18">Launchable main in Java 25</text>
    <rect x="55" y="650" width="245" height="25" rx="5" fill="#ffffff" stroke="#b7791f"/>
    <rect x="320" y="650" width="245" height="25" rx="5" fill="#ffffff" stroke="#b7791f"/>
    <rect x="585" y="650" width="245" height="25" rx="5" fill="#ffffff" stroke="#b7791f"/>
    <rect x="850" y="650" width="295" height="25" rx="5" fill="#ffffff" stroke="#b7791f"/>
    <text x="177" y="668" text-anchor="middle" class="mono" font-size="13">void result</text>
    <text x="442" y="668" text-anchor="middle" class="mono" font-size="13">zero args or String[]</text>
    <text x="707" y="668" text-anchor="middle" class="mono" font-size="13">static or instance</text>
    <text x="997" y="668" text-anchor="middle" class="mono" font-size="13">public / protected / package</text>
  </g>
</svg>
