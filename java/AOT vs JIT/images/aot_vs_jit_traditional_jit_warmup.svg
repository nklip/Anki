<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Traditional HotSpot JIT warmup</title>
  <desc id="description">A timeline shows a JVM starting with little workload-specific information, collecting profiles and compiling hot code during warmup, then reaching a steadier optimized phase.</desc>

  <!-- Shared title treatment used across the complete AOT/JIT visual set. -->
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" fill="#172033">Traditional JIT warmup: useful knowledge grows during the run</text>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f6878">The curve is conceptual—the duration and shape depend on the application and workload</text>

  <!-- Plot area: labels are outside the curve and separated from axes. -->
  <rect x="120" y="120" width="1015" height="330" rx="12" fill="#f6f9fd" stroke="#9db7d1" stroke-width="2"/>
  <line x1="190" y1="390" x2="1075" y2="390" stroke="#172033" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1067,380 1088,390 1067,400" fill="#172033"/>
  <line x1="190" y1="390" x2="190" y2="169" stroke="#172033" stroke-width="3" stroke-linecap="round"/>
  <polygon points="180,177 190,156 200,177" fill="#172033"/>
  <text x="1100" y="420" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">time →</text>
  <text x="145" y="210" transform="rotate(-90 145 210)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">optimized performance readiness →</text>

  <!-- One continuous blue curve: startup, profile-driven warmup, steady phase. -->
  <path d="M 205 368 C 280 361, 335 342, 398 303 S 505 210, 610 192 S 810 174, 1060 174" fill="none" stroke="#1f4e79" stroke-width="8" stroke-linecap="round"/>
  <circle cx="250" cy="357" r="8" fill="#ffffff" stroke="#1f4e79" stroke-width="4"/>
  <circle cx="530" cy="225" r="8" fill="#ffffff" stroke="#1f4e79" stroke-width="4"/>
  <circle cx="875" cy="174" r="8" fill="#ffffff" stroke="#1f4e79" stroke-width="4"/>

  <!-- Phase dividers do not cross descriptive text. -->
  <line x1="350" y1="140" x2="350" y2="425" stroke="#c5cfdb" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="720" y1="140" x2="720" y2="425" stroke="#c5cfdb" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="260" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">STARTUP</text>
  <text x="535" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">WARMUP</text>
  <text x="915" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">STEADIER PHASE</text>

  <rect x="215" y="185" width="220" height="70" rx="8" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
  <text x="325" y="213" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Begin executing bytecode</text>
  <text x="325" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5f6878">little workload-specific data yet</text>

  <rect x="465" y="300" width="300" height="76" rx="8" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
  <text x="615" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#172033">Profile and compile hot code</text>
  <text x="615" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">optimized methods become available</text>

  <rect x="785" y="230" width="285" height="76" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="927.5" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#172033">Run optimized native code</text>
  <text x="927.5" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">JVM can still adapt and recompile</text>

  <!-- Amber memory aid is consistent with the rest of the family. -->
  <rect x="155" y="490" width="890" height="70" rx="8" fill="#fff4ce" stroke="#b7791f" stroke-width="1.5"/>
  <text x="600" y="519" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#684713">Warmup is not a fixed timer.</text>
  <text x="600" y="544" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#684713">It is the period before the running JVM reaches representative, more fully optimized behavior.</text>
</svg>
