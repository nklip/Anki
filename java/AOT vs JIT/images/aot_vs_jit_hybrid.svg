<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Project Leyden AOT-assisted HotSpot flow</title>
  <desc id="description">A training run records classes, cached objects, and method profiles into an AOT cache. A later production HotSpot JVM starts with that knowledge while continuing normal online profiling and JIT compilation.</desc>

  <!-- Amber represents reusable training knowledge; blue represents the live HotSpot JVM. -->
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" fill="#172033">Project Leyden: AOT preparation + HotSpot + adaptive JIT</text>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f6878">The cache moves repeatable JVM work earlier; it does not replace the JVM with a native executable</text>

  <!-- Training lane. -->
  <rect x="40" y="115" width="1120" height="185" rx="12" fill="#fffaf0" stroke="#d8b36a" stroke-width="2"/>
  <text x="70" y="151" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#684713">PREPARATION</text>
  <rect x="95" y="180" width="270" height="82" rx="9" fill="#fff4ce" stroke="#b7791f" stroke-width="2"/>
  <text x="230" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172033">Training run</text>
  <text x="230" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">exercise representative paths</text>
  <line x1="365" y1="221" x2="431" y2="221" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="427,210 451,221 427,232" fill="#b7791f"/>
  <rect x="451" y="165" width="300" height="112" rx="9" fill="#fff4ce" stroke="#b7791f" stroke-width="2"/>
  <text x="601" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172033">Record reusable knowledge</text>
  <text x="601" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">loaded and linked classes</text>
  <text x="601" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">cached objects + method profiles</text>
  <line x1="751" y1="221" x2="817" y2="221" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="813,210 837,221 813,232" fill="#b7791f"/>
  <rect x="837" y="180" width="270" height="82" rx="9" fill="#fff4ce" stroke="#b7791f" stroke-width="2"/>
  <text x="972" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172033">AOT cache</text>
  <text x="972" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">saved for later JVM starts</text>

  <!-- Cache injection arrow is entirely in open space between lanes. -->
  <line x1="972" y1="262" x2="972" y2="340" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="961,336 972,360 983,336" fill="#b7791f"/>
  <text x="952" y="327" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#684713">reuse</text>

  <!-- Production lane remains visibly a blue HotSpot path. -->
  <rect x="40" y="360" width="1120" height="205" rx="12" fill="#f6f9fd" stroke="#9db7d1" stroke-width="2"/>
  <text x="70" y="397" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1f4e79">PRODUCTION JVM RUN</text>
  <rect x="95" y="430" width="270" height="92" rx="9" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
  <text x="230" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172033">HotSpot starts</text>
  <text x="230" y="491" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">with cached work available</text>
  <line x1="365" y1="476" x2="431" y2="476" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
  <polygon points="427,465 451,476 427,487" fill="#1f4e79"/>
  <rect x="451" y="430" width="300" height="92" rx="9" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
  <text x="601" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172033">JIT compiles sooner</text>
  <text x="601" y="491" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">saved profiles guide early choices</text>
  <line x1="751" y1="476" x2="817" y2="476" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
  <polygon points="813,465 837,476 813,487" fill="#1f4e79"/>
  <rect x="837" y="430" width="270" height="92" rx="9" fill="#dce9f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="972" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172033">Keep adapting online</text>
  <text x="972" y="491" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">profile, deoptimize, recompile</text>

  <!-- Release milestones are short and factual; the card provides the detail. -->
  <rect x="80" y="600" width="1040" height="64" rx="8" fill="#fff4ce" stroke="#b7791f" stroke-width="1.5"/>
  <text x="600" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#684713">JDK 24: class loading/linking cache • JDK 25: method profiles • JDK 26: object caching with any GC</text>
  <text x="600" y="649" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#684713">The result is still a HotSpot JVM process with a live JIT compiler.</text>
</svg>
