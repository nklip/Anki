<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">When a JPA entity identifier becomes known</title>
  <desc id="diagram-description">Four horizontal timelines compare IDENTITY, SEQUENCE or TABLE, UUID, and application-assigned identifiers. IDENTITY needs the entity INSERT before the key is returned. The other approaches know the key before the entity INSERT, which permits normal write-behind and can preserve Hibernate insert batching.</desc>

  <!-- Shared typography and color roles are intentionally close to the strategy map. -->
  <style>
    .heading { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #17212b; }
    .body { font-family: Inter, Arial, sans-serif; fill: #2f3a45; }
    .muted { font-family: Inter, Arial, sans-serif; fill: #596673; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #23303d; }
    .light { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="heading" font-size="32">The important timing question: is the ID known before INSERT?</text>
  <text x="700" y="80" text-anchor="middle" class="muted" font-size="18">Arrows show order. “Later” means the provider may wait until flush; it is not a promise that it always will.</text>

  <!-- The header describes chronological flow; event categories occur in different positions in each lane. -->
  <g id="timeline-header">
    <rect x="28" y="110" width="1344" height="54" rx="10" fill="#eef1f4" stroke="#b8c2cc" stroke-width="2"/>
    <text x="140" y="143" text-anchor="middle" class="heading" font-size="17">STRATEGY</text>
    <text x="810" y="143" text-anchor="middle" class="heading" font-size="17">EVENT ORDER · Read each row from left to right</text>
  </g>

  <!-- IDENTITY: the row must exist before the database-generated key can be returned. -->
  <g id="identity-lane">
    <rect x="28" y="182" width="1344" height="132" rx="12" fill="#fff5ea" stroke="#d7a180" stroke-width="2"/>
    <rect x="48" y="207" width="184" height="82" rx="10" fill="#b56032"/>
    <text x="140" y="240" text-anchor="middle" class="light" font-size="20">IDENTITY</text>
    <text x="140" y="269" text-anchor="middle" class="light" font-size="14">post-insert key</text>

    <rect x="280" y="214" width="180" height="68" rx="9" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="370" y="243" text-anchor="middle" class="mono" font-size="17">persist(entity)</text>
    <text x="370" y="266" text-anchor="middle" class="muted" font-size="14">provider needs the key</text>

    <path d="M466 248H895" fill="none" stroke="#b56032" stroke-width="4"/>
    <polygon points="895,238 909,248 895,258" fill="#b56032"/>
    <text x="680" y="232" text-anchor="middle" class="body" font-size="15">no key can be returned yet</text>

    <rect x="915" y="214" width="180" height="68" rx="9" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="1005" y="243" text-anchor="middle" class="heading" font-size="17">INSERT row</text>
    <text x="1005" y="266" text-anchor="middle" class="muted" font-size="14">DB generates key</text>

    <path d="M1101 248H1161" fill="none" stroke="#b56032" stroke-width="4"/>
    <polygon points="1161,238 1175,248 1161,258" fill="#b56032"/>
    <rect x="1181" y="214" width="158" height="68" rx="9" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="1260" y="243" text-anchor="middle" class="heading" font-size="17">ID known</text>
    <text x="1260" y="266" text-anchor="middle" class="muted" font-size="14">key returned</text>
  </g>

  <!-- SEQUENCE and TABLE allocate first, then the entity INSERT may join normal write-behind. -->
  <g id="allocator-lane">
    <rect x="28" y="330" width="1344" height="132" rx="12" fill="#edf8f0" stroke="#9ec7a7" stroke-width="2"/>
    <rect x="48" y="355" width="184" height="82" rx="10" fill="#43804c"/>
    <text x="140" y="387" text-anchor="middle" class="light" font-size="19">SEQUENCE</text>
    <text x="140" y="416" text-anchor="middle" class="light" font-size="14">or TABLE allocator</text>

    <rect x="280" y="362" width="180" height="68" rx="9" fill="#ffffff" stroke="#43804c" stroke-width="2"/>
    <text x="370" y="391" text-anchor="middle" class="mono" font-size="17">persist(entity)</text>
    <text x="370" y="414" text-anchor="middle" class="muted" font-size="14">request identifier</text>
    <path d="M466 396H595" fill="none" stroke="#43804c" stroke-width="4"/>
    <polygon points="595,386 609,396 595,406" fill="#43804c"/>

    <rect x="615" y="362" width="180" height="68" rx="9" fill="#ffffff" stroke="#43804c" stroke-width="2"/>
    <text x="705" y="391" text-anchor="middle" class="heading" font-size="17">Get value / pool</text>
    <text x="705" y="414" text-anchor="middle" class="muted" font-size="14">before entity INSERT</text>
    <path d="M801 396H851" fill="none" stroke="#43804c" stroke-width="4"/>
    <polygon points="851,386 865,396 851,406" fill="#43804c"/>

    <rect x="871" y="362" width="170" height="68" rx="9" fill="#ffffff" stroke="#43804c" stroke-width="2"/>
    <text x="956" y="391" text-anchor="middle" class="heading" font-size="17">ID known</text>
    <text x="956" y="414" text-anchor="middle" class="muted" font-size="14">entity can be linked</text>
    <path d="M1047 396H1111" fill="none" stroke="#43804c" stroke-width="4"/>
    <polygon points="1111,386 1125,396 1111,406" fill="#43804c"/>

    <rect x="1131" y="362" width="208" height="68" rx="9" fill="#ffffff" stroke="#43804c" stroke-width="2"/>
    <text x="1235" y="391" text-anchor="middle" class="heading" font-size="17">INSERT at flush</text>
    <text x="1235" y="414" text-anchor="middle" class="muted" font-size="14">batching may be used</text>
  </g>

  <!-- UUID: provider-side generation is local and precedes database access. -->
  <g id="uuid-lane">
    <rect x="28" y="478" width="1344" height="132" rx="12" fill="#f4f0fa" stroke="#bba6d3" stroke-width="2"/>
    <rect x="48" y="503" width="184" height="82" rx="10" fill="#7651a5"/>
    <text x="140" y="536" text-anchor="middle" class="light" font-size="20">UUID</text>
    <text x="140" y="565" text-anchor="middle" class="light" font-size="14">provider-side key</text>

    <rect x="280" y="510" width="180" height="68" rx="9" fill="#ffffff" stroke="#7651a5" stroke-width="2"/>
    <text x="370" y="539" text-anchor="middle" class="mono" font-size="17">persist(entity)</text>
    <text x="370" y="562" text-anchor="middle" class="muted" font-size="14">provider creates UUID</text>
    <path d="M466 544H595" fill="none" stroke="#7651a5" stroke-width="4"/>
    <polygon points="595,534 609,544 595,554" fill="#7651a5"/>

    <rect x="615" y="510" width="180" height="68" rx="9" fill="#ffffff" stroke="#7651a5" stroke-width="2"/>
    <text x="705" y="539" text-anchor="middle" class="heading" font-size="17">ID known</text>
    <text x="705" y="562" text-anchor="middle" class="muted" font-size="14">no allocator round trip</text>
    <path d="M801 544H1025" fill="none" stroke="#7651a5" stroke-width="4"/>
    <polygon points="1025,534 1039,544 1025,554" fill="#7651a5"/>
    <rect x="1045" y="510" width="294" height="68" rx="9" fill="#ffffff" stroke="#7651a5" stroke-width="2"/>
    <text x="1192" y="539" text-anchor="middle" class="heading" font-size="17">INSERT may wait for flush</text>
    <text x="1192" y="562" text-anchor="middle" class="muted" font-size="14">normal batching remains possible</text>
  </g>

  <!-- Assigned: the application has the identifier even before calling persist. -->
  <g id="assigned-lane">
    <rect x="28" y="626" width="1344" height="132" rx="12" fill="#f7f9fb" stroke="#b8c2cc" stroke-width="2"/>
    <rect x="48" y="651" width="184" height="82" rx="10" fill="#66727d"/>
    <text x="140" y="684" text-anchor="middle" class="light" font-size="20">ASSIGNED</text>
    <text x="140" y="713" text-anchor="middle" class="light" font-size="14">application key</text>

    <rect x="280" y="658" width="220" height="68" rx="9" fill="#ffffff" stroke="#66727d" stroke-width="2"/>
    <text x="390" y="687" text-anchor="middle" class="mono" font-size="16">new Entity(knownId)</text>
    <text x="390" y="710" text-anchor="middle" class="muted" font-size="14">ID already known</text>
    <path d="M506 692H625" fill="none" stroke="#66727d" stroke-width="4"/>
    <polygon points="625,682 639,692 625,702" fill="#66727d"/>

    <rect x="645" y="658" width="180" height="68" rx="9" fill="#ffffff" stroke="#66727d" stroke-width="2"/>
    <text x="735" y="687" text-anchor="middle" class="mono" font-size="17">persist(entity)</text>
    <text x="735" y="710" text-anchor="middle" class="muted" font-size="14">no generation request</text>
    <path d="M831 692H1025" fill="none" stroke="#66727d" stroke-width="4"/>
    <polygon points="1025,682 1039,692 1025,702" fill="#66727d"/>

    <rect x="1045" y="658" width="294" height="68" rx="9" fill="#ffffff" stroke="#66727d" stroke-width="2"/>
    <text x="1192" y="687" text-anchor="middle" class="heading" font-size="17">INSERT may wait for flush</text>
    <text x="1192" y="710" text-anchor="middle" class="muted" font-size="14">application owns uniqueness</text>
  </g>

  <!-- Hibernate-specific consequence is isolated so it is not mistaken for a JPA portability rule. -->
  <g id="hibernate-note">
    <rect x="28" y="790" width="1344" height="78" rx="12" fill="#eef5ff" stroke="#356da8" stroke-width="2"/>
    <text x="54" y="822" class="heading" font-size="17">Hibernate consequence:</text>
    <text x="280" y="822" class="body" font-size="16">IDENTITY entity INSERTs cannot use Hibernate JDBC insert batching.</text>
    <text x="54" y="850" class="body" font-size="16">Knowing the key before INSERT preserves ordinary write-behind and makes batching possible when batching is configured.</text>
  </g>
</svg>
