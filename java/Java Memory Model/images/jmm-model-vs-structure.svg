<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
  <title id="title">Java Memory Model versus Java memory structure</title>
  <desc id="description">The Java Memory Model specifies allowed shared-memory behavior: which writes a thread may observe, including visibility, ordering, and atomicity rules. JVM memory structure describes runtime data areas. The heap and method area are shared; every thread has its own JVM stack with frames and local variables. These are different questions about the same running program.</desc>

  <!-- Shared typography and semantic palette; text remains editable. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #5f6878; }
      .heading { font-size: 27px; font-weight: 700; }
      .question { font-size: 21px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; fill: #5f6878; }
      .code { font-family: monospace; font-size: 21px; }
    </style>
  </defs>

  <!-- Side-by-side comparison has no causal arrows between the two concepts. -->
  <rect width="1200" height="670" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" class="title">Memory model = behavior rules · Memory structure = data areas</text>
  <text x="600" y="79" text-anchor="middle" class="subtitle">Two different questions about the same Java program</text>

  <!-- Model panel: the two actions illustrate a semantic question, not a synchronization edge. -->
  <g id="memory-model-panel">
    <rect x="30" y="108" width="550" height="470" rx="15" fill="#f6f9fd" stroke="#9db7d1" stroke-width="2"/>
    <text x="60" y="151" class="heading" fill="#1f4e79">Java Memory Model (JMM)</text>
    <text x="60" y="190" class="question">Which writes may a thread observe?</text>
    <text x="60" y="223" class="body">Rules for shared-memory behavior</text>

    <rect x="60" y="250" width="490" height="151" rx="10" fill="#ffffff" stroke="#9db7d1" stroke-width="2"/>
    <text x="82" y="281" class="small">Example: both threads access a shared field x</text>
    <text x="82" y="324" class="label">Thread A writes</text>
    <text x="335" y="324" class="code">x = 42;</text>
    <text x="82" y="371" class="label">Thread B reads</text>
    <text x="335" y="371" class="code">r = x;</text>

    <rect x="60" y="426" width="490" height="119" rx="10" fill="#dce9f7"/>
    <text x="82" y="458" class="label">The JMM determines allowed values of r.</text>
    <text x="82" y="491" class="body">Its rules cover visibility, ordering,</text>
    <text x="82" y="519" class="body">and atomicity.</text>
  </g>

  <!-- Structure panel: explicit ownership labels distinguish shared and per-thread areas. -->
  <g id="memory-structure-panel">
    <rect x="610" y="108" width="560" height="470" rx="15" fill="#f4fbf9" stroke="#8bbfb1" stroke-width="2"/>
    <text x="640" y="151" class="heading" fill="#246c5a">Java memory structure</text>
    <text x="640" y="190" class="question">Where does runtime data live?</text>
    <text x="640" y="223" class="body">Java Virtual Machine (JVM): runtime areas</text>

    <rect x="640" y="250" width="500" height="125" rx="10" fill="#e0f2eb" stroke="#8bbfb1" stroke-width="2"/>
    <text x="662" y="280" class="label" fill="#246c5a">SHARED BY THREADS</text>
    <text x="662" y="312" class="body">Heap: objects and arrays</text>
    <text x="662" y="341" class="body">Method area: class data, including</text>
    <text x="662" y="365" class="body">runtime constant pools</text>

    <text x="640" y="411" class="label" fill="#916019">EACH THREAD HAS ITS OWN JVM STACK</text>
    <rect x="640" y="428" width="240" height="117" rx="10" fill="#fff8e9" stroke="#d8b36a" stroke-width="2"/>
    <text x="760" y="457" text-anchor="middle" class="label">Thread A stack</text>
    <rect x="658" y="474" width="204" height="54" rx="6" fill="#ffffff" stroke="#d8b36a"/>
    <text x="760" y="497" text-anchor="middle" class="small">Frames for method calls</text>
    <text x="760" y="519" text-anchor="middle" class="small">with local variables</text>

    <rect x="900" y="428" width="240" height="117" rx="10" fill="#fff8e9" stroke="#d8b36a" stroke-width="2"/>
    <text x="1020" y="457" text-anchor="middle" class="label">Thread B stack</text>
    <rect x="918" y="474" width="204" height="54" rx="6" fill="#ffffff" stroke="#d8b36a"/>
    <text x="1020" y="497" text-anchor="middle" class="small">Frames for method calls</text>
    <text x="1020" y="519" text-anchor="middle" class="small">with local variables</text>
  </g>

  <!-- The summary names each role without implying a physical location for the JMM. -->
  <rect x="95" y="602" width="1010" height="44" rx="9" fill="#f1f3f6"/>
  <text x="600" y="630" text-anchor="middle" class="body">Use the JMM to reason about allowed results; use runtime areas to describe data organization.</text>
</svg>
