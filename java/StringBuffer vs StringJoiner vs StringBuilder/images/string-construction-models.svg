<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">StringBuilder and StringBuffer edit text; StringJoiner joins elements</title>
  <desc id="description">Three examples read from left to right. StringBuilder and StringBuffer explicitly append Ada, a plus sign with spaces, and Lin, producing Ada + Lin. StringBuffer synchronizes individual operations. StringJoiner receives a comma delimiter and square bracket boundaries, adds Ada and Lin, and produces [Ada, Lin]. Each example ends with toString to obtain an immutable String.</desc>

  <!-- Shared type styles; blue and amber compare editing APIs, green identifies element joining. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
    </style>
  </defs>

  <!-- Title and left-to-right reading guide. -->
  <rect id="background" width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="heading" font-size="30">Edit text, or join a sequence of elements?</text>
  <text x="600" y="77" text-anchor="middle" class="muted" font-size="18">Read each row left to right · toString() produces an immutable String</text>
  <text x="55" y="113" class="heading" font-size="15">MUTABLE OBJECT</text>
  <text x="333" y="113" class="heading" font-size="15">OPERATIONS</text>
  <text x="952" y="113" class="heading" font-size="15">RESULT</text>

  <!-- StringBuilder row: all punctuation is explicitly appended by the caller. -->
  <g id="builder-row">
    <rect x="30" y="132" width="1140" height="150" rx="10" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <text x="55" y="175" class="heading" font-size="24">StringBuilder</text>
    <text x="55" y="207" class="body" font-size="17">General text editing</text>
    <text x="55" y="237" class="body" font-size="17">Usually one owner</text>
    <text x="333" y="169" class="mono" font-size="18">new StringBuilder()</text>
    <text x="333" y="201" class="mono" font-size="18">  .append("Ada").append(" + ")</text>
    <text x="333" y="233" class="mono" font-size="18">  .append("Lin").toString()</text>
    <!-- The shaft ends under the triangular head; the arrow sits in a text-free corridor. -->
    <path id="builder-result-arrow" d="M835 206H897" fill="none" stroke="#356eb3" stroke-width="3"/>
    <polygon points="897,199 910,206 897,213" fill="#356eb3"/>
    <rect x="930" y="177" width="213" height="60" rx="7" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
    <text x="1036" y="213" text-anchor="middle" class="mono" font-size="21">"Ada + Lin"</text>
    <text x="333" y="263" class="muted" font-size="16">The caller adds spaces and punctuation.</text>
  </g>

  <!-- StringBuffer has the same text mechanics, with synchronization at individual operations. -->
  <g id="buffer-row">
    <rect x="30" y="304" width="1140" height="150" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="55" y="347" class="heading" font-size="24">StringBuffer</text>
    <text x="55" y="379" class="body" font-size="17">Similar editing API</text>
    <text x="55" y="409" class="body" font-size="17">Synchronized operations</text>
    <text x="333" y="341" class="mono" font-size="18">new StringBuffer()</text>
    <text x="333" y="373" class="mono" font-size="18">  .append("Ada").append(" + ")</text>
    <text x="333" y="405" class="mono" font-size="18">  .append("Lin").toString()</text>
    <path id="buffer-result-arrow" d="M835 378H897" fill="none" stroke="#b7791f" stroke-width="3"/>
    <polygon points="897,371 910,378 897,385" fill="#b7791f"/>
    <rect x="930" y="349" width="213" height="60" rx="7" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
    <text x="1036" y="385" text-anchor="middle" class="mono" font-size="21">"Ada + Lin"</text>
    <text x="333" y="435" class="muted" font-size="16">Multiple calls can still interleave across threads.</text>
  </g>

  <!-- StringJoiner separates configuration from element addition to make automatic punctuation visible. -->
  <g id="joiner-row">
    <rect x="30" y="476" width="1140" height="170" rx="10" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <text x="55" y="519" class="heading" font-size="24">StringJoiner</text>
    <text x="55" y="551" class="body" font-size="17">Adds whole elements</text>
    <text x="55" y="581" class="body" font-size="17">Inserts separators</text>
    <text x="333" y="513" class="mono" font-size="18">new StringJoiner(", ", "[", "]")</text>
    <text x="333" y="545" class="mono" font-size="18">  .add("Ada").add("Lin")</text>
    <text x="333" y="577" class="mono" font-size="18">  .toString()</text>
    <path id="joiner-result-arrow" d="M835 550H897" fill="none" stroke="#34834b" stroke-width="3"/>
    <polygon points="897,543 910,550 897,557" fill="#34834b"/>
    <rect x="930" y="521" width="213" height="60" rx="7" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
    <text x="1036" y="557" text-anchor="middle" class="mono" font-size="21">"[Ada, Lin]"</text>
    <text x="333" y="611" class="muted" font-size="16">Constructor: delimiter, prefix, suffix · No trailing comma.</text>
  </g>
</svg>
