<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">Three gates for correct and useful parallel streams</title>
  <desc id="description">Three side-by-side gates ask whether the computation is safe, whether ordering and terminal semantics are understood, and whether the workload is large and CPU-heavy enough to benefit. Correctness is mandatory; speed must be measured.</desc>

  <!-- Shared styles keep the checklist easy to repair. -->
  <defs>
    <style>
      .title { font: 700 36px sans-serif; fill: #111827; }
      .subtitle { font: 20px sans-serif; fill: #4b5563; }
      .header { font: 700 25px sans-serif; }
      .question { font: 700 20px sans-serif; fill: #273444; }
      .body { font: 18px sans-serif; fill: #273444; }
      .small { font: 16px sans-serif; fill: #4b5563; }
      .code { font: 17px monospace; fill: #1f2937; }
      .verdict { font: 700 20px sans-serif; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" class="title">Before calling parallel(): pass three gates</text>
  <text x="750" y="86" text-anchor="middle" class="subtitle">Correctness is non-negotiable; ordering is a semantic choice; performance is an experiment</text>

  <!-- Gate 1: data-race and reduction correctness. -->
  <rect x="45" y="130" width="440" height="650" rx="18" fill="#f5f0fc" stroke="#7645a8" stroke-width="4"/>
  <rect x="45" y="130" width="440" height="78" rx="18" fill="#7645a8"/>
  <rect x="45" y="188" width="440" height="20" fill="#7645a8"/>
  <circle cx="90" cy="169" r="24" fill="#ffffff"/>
  <text x="90" y="177" text-anchor="middle" class="header" fill="#563080">1</text>
  <text x="265" y="177" text-anchor="middle" class="header" fill="#ffffff">CORRECTNESS</text>

  <text x="80" y="253" class="question">Are lambdas stateless?</text>
  <text x="80" y="287" class="body">No changing shared counter, list,</text>
  <text x="80" y="316" class="body">flag, or non-concurrent source.</text>

  <line x1="80" y1="348" x2="450" y2="348" stroke="#c7b6da" stroke-width="2"/>
  <text x="80" y="390" class="question">Is reduction valid?</text>
  <text x="80" y="424" class="body">Associative operation, neutral</text>
  <text x="80" y="453" class="body">identity, compatible combiner.</text>
  <rect x="80" y="484" width="370" height="72" rx="11" fill="#ffffff" stroke="#9c78c3" stroke-width="2"/>
  <text x="265" y="515" text-anchor="middle" class="code">0 + x = x</text>
  <text x="265" y="542" text-anchor="middle" class="code">(a + b) + c = a + (b + c)</text>

  <rect x="80" y="598" width="370" height="125" rx="13" fill="#fff1ef" stroke="#c96a5b" stroke-width="3"/>
  <text x="265" y="635" text-anchor="middle" class="verdict" fill="#873c33">IF NO: DO NOT PARALLELIZE</text>
  <text x="265" y="670" text-anchor="middle" class="body">The result may be wrong even if</text>
  <text x="265" y="699" text-anchor="middle" class="body">a test happens to pass.</text>

  <!-- Gate 2: ordering and terminal-operation semantics. -->
  <rect x="530" y="130" width="440" height="650" rx="18" fill="#eef5fc" stroke="#356da8" stroke-width="4"/>
  <rect x="530" y="130" width="440" height="78" rx="18" fill="#356da8"/>
  <rect x="530" y="188" width="440" height="20" fill="#356da8"/>
  <circle cx="575" cy="169" r="24" fill="#ffffff"/>
  <text x="575" y="177" text-anchor="middle" class="header" fill="#234f7c">2</text>
  <text x="750" y="177" text-anchor="middle" class="header" fill="#ffffff">SEMANTICS</text>

  <text x="565" y="253" class="question">Must encounter order survive?</text>
  <text x="565" y="287" class="code">forEachOrdered() and findFirst()</text>
  <text x="565" y="316" class="body">can require extra coordination.</text>

  <line x1="565" y1="348" x2="935" y2="348" stroke="#a9c5e2" stroke-width="2"/>
  <text x="565" y="390" class="question">Is there a stateful barrier?</text>
  <text x="565" y="424" class="code">sorted · distinct · ordered limit</text>
  <text x="565" y="458" class="body">Buffering or global knowledge may</text>
  <text x="565" y="487" class="body">divide the pipeline into segments.</text>

  <rect x="565" y="530" width="370" height="193" rx="13" fill="#ffffff" stroke="#6d9dce" stroke-width="3"/>
  <text x="750" y="568" text-anchor="middle" class="verdict" fill="#234f7c">CHOOSE THE CONTRACT</text>
  <text x="595" y="608" class="code">forEach</text>
  <text x="910" y="608" text-anchor="end" class="small">action order unspecified</text>
  <text x="595" y="646" class="code">findAny</text>
  <text x="910" y="646" text-anchor="end" class="small">more scheduling freedom</text>
  <text x="595" y="684" class="code">unordered</text>
  <text x="910" y="684" text-anchor="end" class="small">only if semantics permit</text>

  <!-- Gate 3: workload economics and measurement. -->
  <rect x="1015" y="130" width="440" height="650" rx="18" fill="#fff8eb" stroke="#bd7823" stroke-width="4"/>
  <rect x="1015" y="130" width="440" height="78" rx="18" fill="#bd7823"/>
  <rect x="1015" y="188" width="440" height="20" fill="#bd7823"/>
  <circle cx="1060" cy="169" r="24" fill="#ffffff"/>
  <text x="1060" y="177" text-anchor="middle" class="header" fill="#7b4d16">3</text>
  <text x="1235" y="177" text-anchor="middle" class="header" fill="#ffffff">PERFORMANCE</text>

  <text x="1050" y="253" class="question">Can the source split well?</text>
  <text x="1050" y="287" class="body">Prefer balanced, cheap partitions</text>
  <text x="1050" y="316" class="body">with useful size information.</text>

  <line x1="1050" y1="348" x2="1420" y2="348" stroke="#e1bb82" stroke-width="2"/>
  <text x="1050" y="390" class="question">Is useful work large enough?</text>
  <text x="1050" y="424" class="body">CPU-heavy independent work can</text>
  <text x="1050" y="453" class="body">amortize task and combine costs.</text>

  <line x1="1050" y1="487" x2="1420" y2="487" stroke="#e1bb82" stroke-width="2"/>
  <text x="1050" y="529" class="question">Is the pool free to help?</text>
  <text x="1050" y="563" class="body">Blocking I/O, nested parallelism,</text>
  <text x="1050" y="592" class="body">or other common-pool work competes.</text>

  <rect x="1050" y="628" width="370" height="95" rx="13" fill="#edf8ef" stroke="#43804c" stroke-width="3"/>
  <text x="1235" y="666" text-anchor="middle" class="verdict" fill="#315e38">IF MAYBE: BENCHMARK BOTH</text>
  <text x="1235" y="699" text-anchor="middle" class="body">Representative data, warm-up, load.</text>

  <!-- Closing hierarchy: correctness precedes optimization. -->
  <rect x="140" y="820" width="1220" height="56" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="750" y="856" text-anchor="middle" class="verdict" fill="#273444">Safe semantics first → acceptable ordering constraints second → measured speed last</text>
</svg>
