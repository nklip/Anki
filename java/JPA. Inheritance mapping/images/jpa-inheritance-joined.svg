<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">JPA joined inheritance mapping</title>
  <desc id="diagram-description">A CardPayment object with id 42 is stored across a payment row and a card payment row. The subclass primary key is also a foreign key to payment. WirePayment has another subtype table. A polymorphic Payment query joins the root table with the subtype tables.</desc>

  <!-- Blue is the root entity row, green and purple are subtype rows, and orange highlights the shared primary-key join. -->
  <style>
    .heading { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #17212b; }
    .body { font-family: Inter, Arial, sans-serif; fill: #2f3a45; }
    .muted { font-family: Inter, Arial, sans-serif; fill: #596673; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #23303d; }
    .light { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="heading" font-size="32">JOINED · one object is assembled from related rows</text>
  <text x="700" y="80" text-anchor="middle" class="muted" font-size="18">Common fields stay in the root table; each subtype table stores only its own fields.</text>

  <!-- The object card separates inherited and subtype state before showing where each part is stored. -->
  <g id="card-payment-object">
    <rect x="40" y="125" width="340" height="300" rx="13" fill="#ffffff" stroke="#356da8" stroke-width="3"/>
    <rect x="40" y="125" width="340" height="58" rx="13" fill="#356da8"/>
    <path d="M40 167H380" stroke="#356da8" stroke-width="30"/>
    <text x="210" y="163" text-anchor="middle" class="light" font-size="21">CardPayment object</text>

    <rect x="65" y="205" width="290" height="91" rx="9" fill="#eef5ff" stroke="#8fb4d8"/>
    <text x="85" y="235" class="heading" font-size="16">Inherited Payment state</text>
    <text x="85" y="268" class="mono" font-size="15">id = 42 · amount = 25.00</text>

    <rect x="65" y="315" width="290" height="81" rx="9" fill="#edf8f0" stroke="#8ebd98"/>
    <text x="85" y="345" class="heading" font-size="16">CardPayment state</text>
    <text x="85" y="375" class="mono" font-size="15">cardLast4 = 4242</text>
  </g>

  <!-- Separate horizontal arrows map the two object parts to rows; neither crosses a label. -->
  <path d="M380 250H462" fill="none" stroke="#356da8" stroke-width="5"/>
  <polygon points="462,239 478,250 462,261" fill="#356da8"/>
  <path d="M380 355H462" fill="none" stroke="#43804c" stroke-width="5"/>
  <polygon points="462,344 478,355 462,366" fill="#43804c"/>

  <!-- Root and subtype rows deliberately share id 42: this is the primary-key/foreign-key link. -->
  <g id="joined-tables">
    <rect x="485" y="125" width="460" height="170" rx="12" fill="#eef5ff" stroke="#356da8" stroke-width="3"/>
    <rect x="485" y="125" width="460" height="50" rx="12" fill="#356da8"/>
    <path d="M485 160H945" stroke="#356da8" stroke-width="28"/>
    <text x="510" y="158" class="light" font-size="20">payment · root table</text>
    <text x="520" y="208" class="heading" font-size="15">id (PK)</text>
    <text x="705" y="208" class="heading" font-size="15">amount</text>
    <line x1="640" y1="185" x2="640" y2="275" stroke="#b9d2ea"/>
    <line x1="510" y1="225" x2="920" y2="225" stroke="#b9d2ea"/>
    <text x="545" y="256" class="mono" font-size="15">42</text>
    <text x="705" y="256" class="mono" font-size="15">25.00</text>

    <rect x="485" y="315" width="460" height="150" rx="12" fill="#edf8f0" stroke="#43804c" stroke-width="3"/>
    <rect x="485" y="315" width="460" height="50" rx="12" fill="#43804c"/>
    <path d="M485 350H945" stroke="#43804c" stroke-width="28"/>
    <text x="510" y="348" class="light" font-size="20">card_payment · subtype table</text>
    <text x="520" y="398" class="heading" font-size="15">payment_id (PK, FK)</text>
    <text x="770" y="398" class="heading" font-size="15">card_last4</text>
    <line x1="730" y1="375" x2="730" y2="445" stroke="#add3b5"/>
    <line x1="510" y1="415" x2="920" y2="415" stroke="#add3b5"/>
    <text x="565" y="443" class="mono" font-size="15">42</text>
    <text x="790" y="443" class="mono" font-size="15">4242</text>

    <rect x="485" y="485" width="460" height="150" rx="12" fill="#f4f0fa" stroke="#7651a5" stroke-width="3"/>
    <rect x="485" y="485" width="460" height="50" rx="12" fill="#7651a5"/>
    <path d="M485 520H945" stroke="#7651a5" stroke-width="28"/>
    <text x="510" y="518" class="light" font-size="20">wire_payment · subtype table</text>
    <text x="520" y="568" class="heading" font-size="15">payment_id (PK, FK)</text>
    <text x="770" y="568" class="heading" font-size="15">bank_code</text>
    <line x1="730" y1="545" x2="730" y2="615" stroke="#cbbadd"/>
    <line x1="510" y1="585" x2="920" y2="585" stroke="#cbbadd"/>
    <text x="565" y="613" class="muted" font-size="15">another id</text>
    <text x="790" y="613" class="muted" font-size="15">subtype value</text>
  </g>

  <!-- The orange bracket explains the join key without drawing through either table. -->
  <path d="M965 250H990V390H965" fill="none" stroke="#b56032" stroke-width="4"/>
  <text x="1010" y="310" class="heading" font-size="16" fill="#8a5016">same identifier</text>
  <text x="1010" y="337" class="body" font-size="15">joins the two rows</text>
  <text x="1010" y="364" class="mono" font-size="15">payment.id = card_payment.payment_id</text>

  <!-- The query panel distinguishes the portable semantics from Hibernate's representative SQL shape. -->
  <g id="polymorphic-query">
    <rect x="1010" y="410" width="350" height="225" rx="12" fill="#fff7ef" stroke="#b56032" stroke-width="3"/>
    <text x="1035" y="451" class="heading" font-size="20">Polymorphic Payment query</text>
    <text x="1035" y="490" class="mono" font-size="14">select p from Payment p</text>
    <line x1="1035" y1="509" x2="1335" y2="509" stroke="#e4b99e"/>
    <text x="1035" y="542" class="body" font-size="15">Hibernate typically reads the root</text>
    <text x="1035" y="568" class="body" font-size="15">and left-joins subtype tables.</text>
    <text x="1035" y="604" class="muted" font-size="14">More hierarchy levels can mean more joins.</text>
  </g>

  <!-- The lower summary uses the remaining space instead of leaving a blank center band. -->
  <g id="joined-summary">
    <rect x="40" y="680" width="1320" height="105" rx="12" fill="#f7f9fb" stroke="#66727d" stroke-width="2"/>
    <text x="70" y="718" class="heading" font-size="18">Schema benefit:</text>
    <text x="235" y="718" class="body" font-size="17">shared columns exist once, while subtype columns can have subtype-specific constraints.</text>
    <text x="70" y="756" class="heading" font-size="18">Runtime cost:</text>
    <text x="235" y="756" class="body" font-size="17">loading a subtype combines rows; hierarchy-wide queries may join every subtype table.</text>
  </g>
</svg>
