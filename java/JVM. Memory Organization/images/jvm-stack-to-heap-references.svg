<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
  <title id="title">Two variables point to one Box</title>
  <desc id="description">On one thread, the current remember frame holds the parameter item and the caller's main frame holds the local box. Both arrows reach one Box on the heap. Its count field is 2. The next statement will copy item into the static field saved.</desc>

  <!-- Shared fonts and region colors match the reachability diagram. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .heading { font-size: 47px; font-weight: 700; }
      .body { font-size: 27px; }
      .label { font-size: 22px; font-weight: 700; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 35px; font-weight: 700; }
      .stack { fill: #234f7c; }
      .heap { fill: #315e38; }
    </style>
  </defs>

  <!-- Orient the reader at the statement immediately before the static field assignment. -->
  <rect width="960" height="800" fill="#ffffff"/>
  <g id="snapshot">
    <text x="42" y="71" class="heading">Two variables point to one Box</text>
    <text x="44" y="124" class="body">main calls remember(box), copying the reference into item.</text>
    <text x="44" y="163" class="body">Here, remember has just executed item.count = 2.</text>
  </g>

  <!-- Only the two frames relevant to this call are shown, with the current call on top. -->
  <g id="thread-stack">
    <rect x="40" y="201" width="416" height="451" rx="18" fill="#edf4fa" stroke="#90aec7" stroke-width="2"/>
    <text x="66" y="253" class="stack" font-size="31" font-weight="700">One thread’s stack</text>

    <g id="current-frame">
      <rect x="66" y="283" width="356" height="146" rx="12" fill="#ffffff" stroke="#5885ab" stroke-width="2"/>
      <text x="87" y="320" class="label stack">Current frame · remember</text>
      <line x1="87" y1="340" x2="400" y2="340" stroke="#ccdae5" stroke-width="2"/>
      <text x="87" y="390" class="body">Parameter</text>
      <text x="396" y="392" text-anchor="end" class="code stack">item</text>
    </g>

    <g id="caller-frame">
      <rect x="66" y="458" width="356" height="146" rx="12" fill="#ffffff" stroke="#5885ab" stroke-width="2"/>
      <text x="87" y="495" class="label stack">Caller’s frame · main</text>
      <line x1="87" y1="515" x2="400" y2="515" stroke="#ccdae5" stroke-width="2"/>
      <text x="87" y="565" class="body">Local variable</text>
      <text x="396" y="567" text-anchor="end" class="code stack">box</text>
    </g>
  </g>

  <!-- Keep the right-hand target a single object with the primitive inside its boundary. -->
  <g id="heap">
    <rect x="575" y="201" width="345" height="451" rx="18" fill="#f0f7f0" stroke="#96b49a" stroke-width="2"/>
    <text x="600" y="253" class="heap" font-size="31" font-weight="700">Shared heap</text>
    <rect x="613" y="329" width="269" height="217" rx="12" fill="#ffffff" stroke="#53835b" stroke-width="3"/>
    <text x="639" y="395" class="code heap">Box</text>
    <line x1="639" y1="416" x2="856" y2="416" stroke="#c6d9c7" stroke-width="2"/>
    <text x="639" y="458" class="label heap">Integer field</text>
    <text x="639" y="508" class="code">count = 2</text>
  </g>

  <!-- The shafts cross the region outlines to join each variable to the same object.
       Their final horizontal segments terminate under separate arrowhead bases. -->
  <g id="reference-arrows" fill="#356da8">
    <path id="item-arrow" d="M422 380 H502 Q513 380 524 390 L542 405 Q553 415 567 415 H597" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="594,406 612,415 594,424"/>
    <path id="box-arrow" d="M422 555 H480 Q491 555 505 542 L545 505 Q557 494 572 494 H597" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="594,485 612,494 594,503"/>
  </g>

  <!-- The observation connects reference copying to a visible change in the shared field. -->
  <g id="shared-field">
    <rect x="40" y="687" width="880" height="76" rx="12" fill="#f1f4f6"/>
    <text x="64" y="735" class="body" font-weight="700">Both item.count and box.count read the same field.</text>
  </g>
</svg>
