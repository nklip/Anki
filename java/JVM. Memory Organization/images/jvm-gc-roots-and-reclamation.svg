<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
  <title id="title">When can the Box be collected?</title>
  <desc id="description">After remember returns, main sets box to null. The live MemoryExample class still holds a strong reference in its static field saved, so saved.count can be read. When main clears saved too, the last strong path to the Box disappears. The garbage collector can then reclaim it.</desc>

  <!-- Use the same reference blue and object green as the stack-to-heap snapshot. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .heading { font-size: 47px; font-weight: 700; }
      .body { font-size: 27px; }
      .stage { font-size: 32px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 35px; font-weight: 700; }
    </style>
  </defs>

  <!-- The timeline begins after the helper has returned to main. -->
  <rect width="960" height="800" fill="#ffffff"/>
  <g id="timeline-start">
    <text x="42" y="71" class="heading">When can the Box be collected?</text>
    <text x="44" y="124" class="body">remember has returned. Its parameter item is gone.</text>
  </g>

  <!-- Position the saved field and its Box consistently in both time slices. -->
  <g id="reachable">
    <rect x="40" y="161" width="880" height="237" rx="18" fill="#f0f7f0" stroke="#96b49a" stroke-width="2"/>
    <text x="66" y="211" class="stage">1. After box = null</text>
    <text x="66" y="252" class="body">The live class still holds the Box through its static field.</text>
    <rect x="67" y="278" width="306" height="94" rx="10" fill="#ffffff" stroke="#5885ab" stroke-width="2"/>
    <text x="88" y="310" class="label" fill="#234f7c">Static field</text>
    <text x="88" y="351" class="code">saved</text>
    <rect x="602" y="278" width="289" height="94" rx="10" fill="#ffffff" stroke="#53835b" stroke-width="3"/>
    <text x="624" y="310" class="label">Reachable object</text>
    <text x="624" y="351" class="code">Box</text>

    <!-- The triangular head meets the object outline. -->
    <path id="saved-arrow" d="M374 325 H586" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="583,316 601,325 583,334" fill="#356da8"/>
  </g>

  <!-- Removing the arrow represents loss of the last strong path. The object remains
       visible with a dashed outline to distinguish eligibility from actual reclamation. -->
  <g id="unreachable">
    <rect x="40" y="426" width="880" height="237" rx="18" fill="#f5f6f7" stroke="#aab3b9" stroke-width="2"/>
    <text x="66" y="476" class="stage">2. After saved = null</text>
    <text x="66" y="517" class="body">The last strong path to this Box is gone.</text>
    <rect x="67" y="543" width="306" height="94" rx="10" fill="#ffffff" stroke="#81919d" stroke-width="2"/>
    <text x="88" y="575" class="label">Static field</text>
    <text x="88" y="616" class="code">saved = null</text>
    <rect x="602" y="543" width="289" height="94" rx="10" fill="#ffffff" stroke="#81919d" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="624" y="575" class="label">Unreachable object</text>
    <text x="624" y="616" class="code">Box</text>
  </g>

  <!-- Separate eligibility from the time when storage is reused. -->
  <g id="collection-timing">
    <text x="44" y="723" class="body" font-weight="700">The Box is now eligible for garbage collection.</text>
    <text x="44" y="762" class="body">The collector may reclaim its space later.</text>
  </g>
</svg>
