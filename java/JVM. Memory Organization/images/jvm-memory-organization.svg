<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
  <title id="title">What does -Xmx limit?</title>
  <desc id="description">Within a single HotSpot process, -Xmx caps the shared Java heap. A Box instance and the Class object for its type both live there. Outside the heap, the same process also holds class metadata, compiled code, native platform-thread stacks, and other native allocations.</desc>

  <!-- Shared type scale and colors match the Box reference diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .title { font-size: 47px; font-weight: 700; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .code { font: bold 30px Menlo, Consolas, monospace; }
      .heap { fill: #315e38; }
    </style>
  </defs>

  <!-- A single outer border encloses both parts of the process. -->
  <rect width="960" height="800" fill="#ffffff"/>
  <text x="40" y="69" class="title">What does -Xmx limit?</text>
  <text x="42" y="115" class="body">A HotSpot process needs memory for objects and for the JVM itself.</text>
  <rect x="40" y="145" width="880" height="624" rx="18" fill="#fafbfc" stroke="#81939f" stroke-width="2"/>
  <text x="66" y="189" class="heading">One HotSpot process</text>

  <!-- Both examples inside this boundary are Java heap objects. -->
  <g id="heap">
    <rect x="66" y="214" width="828" height="208" rx="12" fill="#f0f7f0" stroke="#53835b" stroke-width="2"/>
    <text x="91" y="259" class="heading heap">Java heap</text>
    <text x="865" y="259" text-anchor="end" class="label heap">Maximum size set by -Xmx</text>
    <line x1="91" y1="278" x2="868" y2="278" stroke="#bdd0be" stroke-width="2"/>
    <line x1="465" y1="300" x2="465" y2="398" stroke="#bdd0be" stroke-width="2"/>
    <text x="91" y="334" class="code">new Box()</text>
    <text x="91" y="376" class="body">An instance with a count field</text>
    <text x="492" y="334" class="code">Box.class</text>
    <text x="492" y="376" class="body">A Class object for the Box type</text>
  </g>

  <!-- Native allocations are siblings of the heap within the process boundary. -->
  <g id="native-memory">
    <text x="66" y="481" class="heading">Outside the Java heap</text>
    <rect x="66" y="504" width="398" height="101" rx="12" fill="#fff4e5" stroke="#c99855" stroke-width="2"/>
    <text x="87" y="545" class="label">Metaspace</text>
    <text x="87" y="580" class="body">Field and method descriptions</text>

    <rect x="482" y="504" width="412" height="101" rx="12" fill="#f6f0fa" stroke="#a18bb5" stroke-width="2"/>
    <text x="503" y="545" class="label">Code cache</text>
    <text x="503" y="580" class="body">Compiled machine instructions</text>

    <rect x="66" y="626" width="398" height="105" rx="12" fill="#edf4fa" stroke="#90aec7" stroke-width="2"/>
    <text x="87" y="667" class="label">Platform-thread stacks</text>
    <text x="87" y="702" class="body">Native space for active calls</text>

    <rect x="482" y="626" width="412" height="105" rx="12" fill="#f1f4f6" stroke="#9eabb4" stroke-width="2"/>
    <text x="503" y="667" class="label">Other native memory</text>
    <text x="503" y="702" class="body">GC data and direct-buffer storage</text>
  </g>
</svg>
