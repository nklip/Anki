<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">A switch expression selects one arm and produces one value</title>
  <desc id="description">A beginner diagram following Status.RUNNING through a switch expression to the Running result, with supporting rules for arrow arms, yield from a block, and exhaustive case coverage.</desc>

  <!-- Shared styles; blue identifies the selector, purple the switch, green the chosen arm and result, and orange the compile-time rules. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and lesson statement; the release badge stays above the main flow. -->
  <rect id="background" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Switch expression: select one arm → produce one value</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">Read left to right: selector → matching case → result</text>
  <rect x="1010" y="93" width="160" height="40" rx="20" fill="#dcefe1" stroke="#34834b" stroke-width="2"/>
  <text x="1090" y="119" text-anchor="middle" class="heading" font-size="14">FINAL · JDK 14</text>

  <!-- Step 1: one selector value enters the switch. -->
  <g id="selector">
    <rect x="30" y="150" width="270" height="250" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <rect x="30" y="150" width="270" height="50" rx="11" fill="#356eb3"/>
    <rect x="30" y="189" width="270" height="11" fill="#356eb3"/>
    <text x="55" y="183" class="light" font-size="20">1 · Selector</text>
    <rect x="58" y="230" width="214" height="58" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
    <text x="165" y="265" text-anchor="middle" class="mono" font-size="16">Status.RUNNING</text>
    <text x="165" y="329" text-anchor="middle" class="heading" font-size="17">One input value</text>
    <text x="165" y="363" text-anchor="middle" class="body" font-size="15">Which case label matches?</text>
  </g>

  <!-- First flow arrow: the shaft ends under its own head; the head stops before the switch border. -->
  <path d="M310 270H361" fill="none" stroke="#744b91" stroke-width="4"/>
  <polygon points="360,259 380,270 360,281" fill="#744b91"/>

  <!-- Step 2: only RUNNING is highlighted, making the chosen arm obvious without relying on color alone. -->
  <g id="switch-arms">
    <rect x="390" y="120" width="420" height="310" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <rect x="390" y="120" width="420" height="50" rx="11" fill="#744b91"/>
    <rect x="390" y="159" width="420" height="11" fill="#744b91"/>
    <text x="415" y="153" class="light" font-size="20">2 · Match one arm</text>
    <text x="785" y="152" text-anchor="end" class="light" font-size="15">switch (status)</text>

    <rect x="420" y="190" width="360" height="48" rx="7" fill="#ffffff" stroke="#b7a4c5" stroke-width="1.5"/>
    <text x="440" y="220" class="mono" font-size="15">case NEW -&gt; "New";</text>

    <rect x="420" y="252" width="360" height="90" rx="7" fill="#edf8f0" stroke="#34834b" stroke-width="2.5"/>
    <text x="440" y="278" class="heading" font-size="14">MATCH</text>
    <text x="520" y="278" class="mono" font-size="14">case RUNNING -&gt; {</text>
    <text x="465" y="307" class="mono" font-size="14">yield "Running";</text>
    <text x="440" y="329" class="mono" font-size="14">}</text>

    <rect x="420" y="356" width="360" height="48" rx="7" fill="#ffffff" stroke="#b7a4c5" stroke-width="1.5"/>
    <text x="440" y="386" class="mono" font-size="15">case DONE -&gt; "Done";</text>
  </g>

  <!-- Second flow arrow points from the selected arm to the result and remains clear of both borders. -->
  <path d="M820 270H871" fill="none" stroke="#34834b" stroke-width="4"/>
  <polygon points="870,259 890,270 870,281" fill="#34834b"/>

  <!-- Step 3: the selected arm's yielded expression becomes the value of the whole switch expression. -->
  <g id="result">
    <rect x="900" y="150" width="270" height="250" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <rect x="900" y="150" width="270" height="50" rx="11" fill="#34834b"/>
    <rect x="900" y="189" width="270" height="11" fill="#34834b"/>
    <text x="925" y="183" class="light" font-size="20">3 · One result</text>
    <rect x="930" y="230" width="210" height="58" rx="8" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
    <text x="1035" y="266" text-anchor="middle" class="mono" font-size="18">"Running"</text>
    <text x="1035" y="329" text-anchor="middle" class="heading" font-size="17">The switch has a value</text>
    <text x="1035" y="361" text-anchor="middle" class="body" font-size="15">assign · return · pass onward</text>
  </g>

  <!-- Bottom rule panels answer the three most common beginner questions. -->
  <g id="core-rules">
    <g id="arrow-rule">
      <rect x="30" y="465" width="360" height="225" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
      <rect x="30" y="465" width="360" height="48" rx="11" fill="#356eb3"/>
      <rect x="30" y="502" width="360" height="11" fill="#356eb3"/>
      <text x="55" y="497" class="light" font-size="20">Arrow arm</text>
      <rect x="60" y="540" width="300" height="48" rx="7" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
      <text x="210" y="570" text-anchor="middle" class="mono" font-size="15">case NEW -&gt; "New";</text>
      <text x="210" y="625" text-anchor="middle" class="heading" font-size="17">The expression is the result</text>
      <text x="210" y="658" text-anchor="middle" class="body" font-size="15">No break · no fall-through</text>
    </g>

    <g id="yield-rule">
      <rect x="420" y="465" width="360" height="225" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
      <rect x="420" y="465" width="360" height="48" rx="11" fill="#744b91"/>
      <rect x="420" y="502" width="360" height="11" fill="#744b91"/>
      <text x="445" y="497" class="light" font-size="20">Block arm</text>
      <rect x="450" y="532" width="300" height="67" rx="7" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
      <text x="600" y="558" text-anchor="middle" class="mono" font-size="14">case RUNNING -&gt; {</text>
      <text x="600" y="584" text-anchor="middle" class="mono" font-size="14">yield "Running"; }</text>
      <text x="600" y="633" text-anchor="middle" class="heading" font-size="17">yield supplies the arm's value</text>
      <text x="600" y="661" text-anchor="middle" class="body" font-size="14">It does not return from the method</text>
    </g>

    <g id="exhaustive-rule">
      <rect x="810" y="465" width="360" height="225" rx="11" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
      <rect x="810" y="465" width="360" height="48" rx="11" fill="#b7791f"/>
      <rect x="810" y="502" width="360" height="11" fill="#b7791f"/>
      <text x="835" y="497" class="light" font-size="20">Exhaustive cases</text>
      <rect x="840" y="540" width="82" height="37" rx="18" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
      <rect x="938" y="540" width="94" height="37" rx="18" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
      <rect x="1048" y="540" width="92" height="37" rx="18" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
      <text x="881" y="564" text-anchor="middle" class="mono" font-size="13">NEW</text>
      <text x="985" y="564" text-anchor="middle" class="mono" font-size="13">RUNNING</text>
      <text x="1094" y="564" text-anchor="middle" class="mono" font-size="13">DONE</text>
      <text x="990" y="625" text-anchor="middle" class="heading" font-size="17">Every enum constant is covered</text>
      <text x="990" y="658" text-anchor="middle" class="body" font-size="15">No explicit default is needed</text>
    </g>
  </g>
</svg>
