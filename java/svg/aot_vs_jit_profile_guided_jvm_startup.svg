<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 220">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
    .label {
      font-size: 18px;
    }
  </style>

  <text x="725" y="32" text-anchor="middle" class="title">
    Profile-Guided JVM Startup
  </text>

  <rect class="box" x="20" y="90" width="180" height="60"/>
  <text x="110" y="126" text-anchor="middle" class="label">Previous run</text>

  <line class="arrow" x1="200" y1="120" x2="290" y2="120"/>
  <path class="arrow" d="M280 113 L290 120 L280 127"/>

  <rect class="box" x="290" y="90" width="180" height="60"/>
  <text x="380" y="126" text-anchor="middle" class="label">Saved profile</text>

  <line class="arrow" x1="470" y1="120" x2="560" y2="120"/>
  <path class="arrow" d="M550 113 L560 120 L550 127"/>

  <rect class="box" x="560" y="90" width="190" height="60"/>
  <text x="655" y="126" text-anchor="middle" class="label">New JVM starts</text>

  <line class="arrow" x1="750" y1="120" x2="840" y2="120"/>
  <path class="arrow" d="M830 113 L840 120 L830 127"/>

  <rect class="box" x="840" y="90" width="340" height="60"/>
  <text x="1010" y="126" text-anchor="middle" class="label">JIT already has profiling information</text>

  <line class="arrow" x1="1180" y1="120" x2="1270" y2="120"/>
  <path class="arrow" d="M1260 113 L1270 120 L1260 127"/>

  <rect class="box" x="1270" y="90" width="160" height="60"/>
  <text x="1350" y="126" text-anchor="middle" class="label">Optimize sooner</text>
</svg>
