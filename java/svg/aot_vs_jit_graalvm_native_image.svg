<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
    .label {
      font-size: 18px;
    }
    .small {
      font-size: 14px;
    }
  </style>

  <text x="600" y="32" text-anchor="middle" class="title">
    GraalVM Native Image AOT Flow
  </text>

  <rect class="box" x="20" y="90" width="170" height="60"/>
  <text x="105" y="126" text-anchor="middle" class="label">Java bytecode</text>

  <line class="arrow" x1="190" y1="120" x2="245" y2="120"/>
  <path class="arrow" d="M235 113 L245 120 L235 127"/>

  <rect class="box" x="245" y="90" width="230" height="60"/>
  <text x="360" y="126" text-anchor="middle" class="label">GraalVM Native Image</text>

  <line class="arrow" x1="475" y1="120" x2="585" y2="120"/>
  <path class="arrow" d="M575 113 L585 120 L575 127"/>
  <text x="530" y="100" text-anchor="middle" class="small">AOT compilation</text>

  <rect class="box" x="585" y="90" width="190" height="60"/>
  <text x="680" y="126" text-anchor="middle" class="label">Native executable</text>

  <line class="arrow" x1="775" y1="120" x2="860" y2="120"/>
  <path class="arrow" d="M850 113 L860 120 L850 127"/>

  <rect class="box" x="860" y="90" width="170" height="60"/>
  <text x="945" y="126" text-anchor="middle" class="label">Runs directly</text>
</svg>
