<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">JPA table per class inheritance mapping</title>
  <desc id="diagram-description">CardPayment and WirePayment each have a complete table with duplicated inherited columns id and amount plus their subtype column. A polymorphic Payment query combines both tables with a union. The diagram notes that Jakarta Persistence support for this strategy is optional.</desc>

  <!-- Blue cells are duplicated inherited fields, green and purple cells are subtype fields, and orange is the polymorphic union. -->
  <style>
    .heading { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #17212b; }
    .body { font-family: Inter, Arial, sans-serif; fill: #2f3a45; }
    .muted { font-family: Inter, Arial, sans-serif; fill: #596673; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #23303d; }
    .light { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="heading" font-size="32">TABLE_PER_CLASS · every concrete type owns a complete table</text>
  <text x="700" y="80" text-anchor="middle" class="muted" font-size="18">Inherited columns are repeated; a hierarchy-wide query must combine the concrete tables.</text>

  <!-- A visible portability note prevents learners from assuming every conforming provider implements this strategy. -->
  <g id="portability-note">
    <rect x="250" y="105" width="900" height="65" rx="11" fill="#fff7ef" stroke="#b56032" stroke-width="2"/>
    <text x="700" y="133" text-anchor="middle" class="heading" font-size="17">Portability warning</text>
    <text x="700" y="157" text-anchor="middle" class="body" font-size="15">Jakarta Persistence 3.2 makes provider support optional; verify your provider before choosing it.</text>
  </g>

  <!-- Each concrete table repeats the blue inherited columns and adds exactly one subtype column. -->
  <g id="concrete-tables">
    <rect x="40" y="205" width="620" height="280" rx="13" fill="#f7f9fb" stroke="#43804c" stroke-width="3"/>
    <rect x="40" y="205" width="620" height="56" rx="13" fill="#43804c"/>
    <path d="M40 245H660" stroke="#43804c" stroke-width="30"/>
    <text x="65" y="243" class="light" font-size="21">card_payment table</text>
    <text x="635" y="243" text-anchor="end" class="light" font-size="15">complete CardPayment row</text>

    <rect x="70" y="285" width="560" height="63" rx="8" fill="#eef5ff" stroke="#8fb4d8"/>
    <text x="95" y="311" class="heading" font-size="15">inherited from Payment</text>
    <text x="95" y="335" class="mono" font-size="15">id · amount</text>

    <rect x="70" y="365" width="560" height="63" rx="8" fill="#edf8f0" stroke="#8ebd98"/>
    <text x="95" y="391" class="heading" font-size="15">declared by CardPayment</text>
    <text x="95" y="415" class="mono" font-size="15">card_last4</text>

    <text x="70" y="462" class="muted" font-size="14">Example columns: id · amount · card_last4</text>

    <rect x="740" y="205" width="620" height="280" rx="13" fill="#f7f9fb" stroke="#7651a5" stroke-width="3"/>
    <rect x="740" y="205" width="620" height="56" rx="13" fill="#7651a5"/>
    <path d="M740 245H1360" stroke="#7651a5" stroke-width="30"/>
    <text x="765" y="243" class="light" font-size="21">wire_payment table</text>
    <text x="1335" y="243" text-anchor="end" class="light" font-size="15">complete WirePayment row</text>

    <rect x="770" y="285" width="560" height="63" rx="8" fill="#eef5ff" stroke="#8fb4d8"/>
    <text x="795" y="311" class="heading" font-size="15">inherited from Payment</text>
    <text x="795" y="335" class="mono" font-size="15">id · amount</text>

    <rect x="770" y="365" width="560" height="63" rx="8" fill="#f4f0fa" stroke="#c0a5d8"/>
    <text x="795" y="391" class="heading" font-size="15">declared by WirePayment</text>
    <text x="795" y="415" class="mono" font-size="15">bank_code</text>

    <text x="770" y="462" class="muted" font-size="14">Example columns: id · amount · bank_code</text>
  </g>

  <!-- Both arrows converge into the UNION without passing through labels. -->
  <path d="M350 485V520H610V539" fill="none" stroke="#43804c" stroke-width="5"/>
  <polygon points="598,539 610,555 622,539" fill="#43804c"/>
  <path d="M1050 485V520H790V539" fill="none" stroke="#7651a5" stroke-width="5"/>
  <polygon points="778,539 790,555 802,539" fill="#7651a5"/>

  <!-- The union panel describes Hibernate's representative SQL implementation of the portable polymorphic query. -->
  <g id="union-query">
    <rect x="260" y="560" width="880" height="135" rx="13" fill="#fff7ef" stroke="#b56032" stroke-width="3"/>
    <text x="700" y="599" text-anchor="middle" class="heading" font-size="20">Polymorphic query combines concrete tables</text>
    <text x="700" y="632" text-anchor="middle" class="mono" font-size="15">select p from Payment p</text>
    <text x="700" y="666" text-anchor="middle" class="body" font-size="16">Hibernate uses a UNION-style query and supplies NULL placeholders for fields of the other subtype.</text>
  </g>

  <!-- The bottom strip balances the concrete-read benefit against duplication and union cost. -->
  <g id="tradeoff-summary">
    <rect x="40" y="730" width="1320" height="60" rx="11" fill="#f7f9fb" stroke="#66727d" stroke-width="2"/>
    <text x="70" y="767" class="heading" font-size="16">Good:</text>
    <text x="125" y="767" class="body" font-size="15">a concrete type reads one table.</text>
    <text x="505" y="767" class="heading" font-size="16">Cost:</text>
    <text x="555" y="767" class="body" font-size="15">base columns repeat, base-field schema changes repeat, and polymorphic reads combine tables.</text>
  </g>
</svg>
