<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
    .label {
      font-size: 18px;
    }
  </style>

  <text x="500" y="32" text-anchor="middle" class="title">
    Traditional JIT Warmup
  </text>

  <!-- Start JVM -->
  <rect class="box" x="30" y="90" width="170" height="60"/>
  <text x="115" y="126" text-anchor="middle" class="label">Start JVM</text>

  <line class="arrow" x1="200" y1="120" x2="280" y2="120"/>
  <path class="arrow" d="M270 113 L280 120 L270 127"/>

  <!-- Collect profiles -->
  <rect class="box" x="280" y="90" width="190" height="60"/>
  <text x="375" y="126" text-anchor="middle" class="label">Collect profiles</text>

  <line class="arrow" x1="470" y1="120" x2="550" y2="120"/>
  <path class="arrow" d="M540 113 L550 120 L540 127"/>

  <!-- Wait -->
  <rect class="box" x="550" y="90" width="120" height="60"/>
  <text x="610" y="126" text-anchor="middle" class="label">Wait</text>

  <line class="arrow" x1="670" y1="120" x2="750" y2="120"/>
  <path class="arrow" d="M740 113 L750 120 L740 127"/>

  <!-- JIT optimize -->
  <rect class="box" x="750" y="90" width="200" height="60"/>
  <text x="850" y="126" text-anchor="middle" class="label">JIT optimize</text>
</svg>
