<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .line {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
    }
    .label {
      font-size: 18px;
    }
  </style>

  <text x="500" y="35" text-anchor="middle" class="title">
    Modern Java Execution Paths
  </text>

  <!-- Root -->
  <rect class="box" x="420" y="60" width="160" height="55"/>
  <text x="500" y="95" text-anchor="middle" class="label">Java</text>

  <!-- Split -->
  <line class="line" x1="500" y1="115" x2="500" y2="155"/>
  <line class="line" x1="250" y1="155" x2="750" y2="155"/>
  <line class="line" x1="250" y1="155" x2="250" y2="185"/>
  <line class="line" x1="750" y1="155" x2="750" y2="185"/>

  <!-- Path labels -->
  <rect class="box" x="155" y="185" width="190" height="55"/>
  <text x="250" y="220" text-anchor="middle" class="label">JVM path</text>

  <rect class="box" x="655" y="185" width="190" height="55"/>
  <text x="750" y="220" text-anchor="middle" class="label">Native path</text>

  <!-- Left branch -->
  <line class="line" x1="250" y1="240" x2="250" y2="270"/>
  <rect class="box" x="155" y="270" width="190" height="55"/>
  <text x="250" y="305" text-anchor="middle" class="label">HotSpot</text>

  <line class="line" x1="250" y1="325" x2="250" y2="355"/>
  <rect class="box" x="105" y="355" width="290" height="55"/>
  <text x="250" y="390" text-anchor="middle" class="label">AOT caches + JIT</text>

  <line class="line" x1="250" y1="410" x2="250" y2="440"/>
  <rect class="box" x="155" y="440" width="190" height="55"/>
  <text x="250" y="475" text-anchor="middle" class="label">Native code</text>

  <!-- Right branch -->
  <line class="line" x1="750" y1="240" x2="750" y2="270"/>
  <rect class="box" x="655" y="270" width="190" height="55"/>
  <text x="750" y="305" text-anchor="middle" class="label">GraalVM</text>

  <line class="line" x1="750" y1="325" x2="750" y2="355"/>
  <rect class="box" x="630" y="355" width="240" height="55"/>
  <text x="750" y="390" text-anchor="middle" class="label">Native Image</text>

  <line class="line" x1="750" y1="410" x2="750" y2="440"/>
  <rect class="box" x="655" y="440" width="190" height="55"/>
  <text x="750" y="475" text-anchor="middle" class="label">Native binary</text>
</svg>
