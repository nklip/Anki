<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title description">
  <title id="title">Compare-and-set success, failure, and retry</title>
  <desc id="description">Compare-and-set atomically compares the current value with an expected value. A match stores the update and succeeds. A mismatch changes nothing, so a retry loop rereads and recalculates before trying again.</desc>

  <!-- Background and lesson statement -->
  <rect width="1500" height="930" fill="white"/>
  <text x="750" y="52" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#111">Compare-and-set: one atomic decision</text>
  <text x="750" y="86" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#444">Compare the observed state and conditionally publish a replacement without an intervening write</text>

  <!-- Invocation and atomic comparison -->
  <g id="cas-decision">
    <rect x="375" y="115" width="750" height="62" rx="7" fill="#e8f1fb" stroke="#2f6fad" stroke-width="2"/>
    <text x="750" y="153" text-anchor="middle" font-family="monospace" font-size="21" font-weight="bold" fill="#1d4f82">atomic.compareAndSet(expected, update)</text>

    <!-- Shaft ends under its separate head; the head stops before the decision diamond. -->
    <path d="M750 180V204" fill="none" stroke="#555" stroke-width="4"/>
    <polygon points="750,220 741,204 759,204" fill="#555"/>

    <polygon points="750,225 880,305 750,385 620,305" fill="#fff7df" stroke="#b88b22" stroke-width="3"/>
    <text x="750" y="297" text-anchor="middle" font-family="monospace" font-size="19" font-weight="bold" fill="#6b500f">current ==</text>
    <text x="750" y="325" text-anchor="middle" font-family="monospace" font-size="19" font-weight="bold" fill="#6b500f">expected ?</text>
  </g>

  <!-- Success branch; arrowhead stops before the result panel border. -->
  <g id="cas-success">
    <path d="M616 305H543" fill="none" stroke="#4d8758" stroke-width="5"/>
    <polygon points="527,305 543,296 543,314" fill="#4d8758"/>
    <text x="577" y="286" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#35623e">match</text>

    <rect x="70" y="242" width="455" height="176" rx="8" fill="#eef8ef" stroke="#4d8758" stroke-width="2"/>
    <text x="297" y="278" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#35623e">Success</text>
    <text x="297" y="315" text-anchor="middle" font-family="monospace" font-size="20" fill="#35623e">current = update</text>
    <text x="297" y="347" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#444">The comparison and write are indivisible.</text>
    <rect x="172" y="367" width="250" height="36" rx="5" fill="#4d8758"/>
    <text x="297" y="392" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="white">return true</text>
  </g>

  <!-- Failure branch; no write occurs. -->
  <g id="cas-failure">
    <path d="M884 305H957" fill="none" stroke="#b34a42" stroke-width="5"/>
    <polygon points="973,305 957,296 957,314" fill="#b34a42"/>
    <text x="923" y="286" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#9b352f">mismatch</text>

    <rect x="975" y="242" width="455" height="176" rx="8" fill="#fff3f1" stroke="#b34a42" stroke-width="2"/>
    <text x="1202" y="278" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#9b352f">Failure</text>
    <text x="1202" y="315" text-anchor="middle" font-family="monospace" font-size="20" fill="#9b352f">current is unchanged</text>
    <text x="1202" y="347" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#444">The expected observation became stale.</text>
    <rect x="1077" y="367" width="250" height="36" rx="5" fill="#b34a42"/>
    <text x="1202" y="392" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="white">return false</text>
  </g>

  <!-- Equality rule -->
  <rect x="410" y="430" width="680" height="70" rx="7" fill="#fafafa" stroke="#777" stroke-width="2"/>
  <text x="750" y="459" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333">Primitive values compare by value; references compare by identity</text>
  <text x="750" y="485" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">For AtomicReference, the rule is ==, not equals().</text>

  <!-- Retry-loop panel -->
  <g id="retry-loop">
    <rect x="40" y="535" width="1420" height="345" rx="8" fill="#fafafa" stroke="#777" stroke-width="2"/>
    <text x="70" y="576" font-family="sans-serif" font-size="24" font-weight="bold" fill="#333">A failed CAS retries from fresh state</text>
    <text x="70" y="605" font-family="sans-serif" font-size="16" fill="#555">The calculated replacement belongs to one observation; after failure, reread and recalculate it.</text>

    <rect x="80" y="660" width="245" height="76" rx="6" fill="white" stroke="#2f6fad" stroke-width="2"/>
    <text x="202" y="690" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1d4f82">Read</text>
    <text x="202" y="718" text-anchor="middle" font-family="monospace" font-size="17" fill="#444">old = atomic.get()</text>

    <rect x="410" y="660" width="245" height="76" rx="6" fill="white" stroke="#2f6fad" stroke-width="2"/>
    <text x="532" y="690" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1d4f82">Calculate</text>
    <text x="532" y="718" text-anchor="middle" font-family="monospace" font-size="17" fill="#444">next = f(old)</text>

    <rect x="740" y="660" width="300" height="76" rx="6" fill="#e8f1fb" stroke="#2f6fad" stroke-width="2"/>
    <text x="890" y="690" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1d4f82">Attempt CAS</text>
    <text x="890" y="718" text-anchor="middle" font-family="monospace" font-size="16" fill="#444">compareAndSet(old, next)</text>

    <rect x="1190" y="660" width="220" height="76" rx="6" fill="#eef8ef" stroke="#4d8758" stroke-width="2"/>
    <text x="1300" y="690" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#35623e">Success</text>
    <text x="1300" y="718" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#444">operation complete</text>

    <!-- Forward arrows stay in gutters and stop before each destination. -->
    <path d="M327 698H392" fill="none" stroke="#555" stroke-width="4"/>
    <polygon points="408,698 392,689 392,707" fill="#555"/>
    <path d="M657 698H722" fill="none" stroke="#555" stroke-width="4"/>
    <polygon points="738,698 722,689 722,707" fill="#555"/>
    <path d="M1042 698H1172" fill="none" stroke="#4d8758" stroke-width="4"/>
    <polygon points="1188,698 1172,689 1172,707" fill="#4d8758"/>
    <text x="1115" y="681" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#35623e">true</text>

    <!-- Failure route uses the empty lower corridor and returns to the Read box. -->
    <path d="M890 740V802H202V754" fill="none" stroke="#b34a42" stroke-width="4"/>
    <polygon points="202,738 193,754 211,754" fill="#b34a42"/>
    <text x="545" y="830" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#9b352f">false: another thread changed the value — reread, recalculate, retry</text>
  </g>

  <text x="750" y="914" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">Atomicity protects the tested variable; the surrounding algorithm still determines progress, fairness, and correctness.</text>
</svg>
