<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">HashMap resize split</title>
  <desc id="description">When capacity doubles from 8 to 16, one old bucket is divided between the same index and the index plus old capacity by testing one hash bit.</desc>

  <!-- Background and title -->
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#202124">HashMap resize: one old bucket splits into two</text>

  <!-- Old table bin -->
  <rect x="45" y="102" width="155" height="92" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="3"/>
  <text x="122.5" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#202124">old table</text>
  <text x="122.5" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124">capacity = 8</text>
  <rect x="45" y="220" width="155" height="74" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
  <text x="122.5" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#202124">bucket j = 2</text>
  <text x="122.5" y="277" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#202124">old index</text>

  <!-- Old collision chain. Parentheses show the tested old-capacity bit. -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="260" y="220" width="165" height="74" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
    <text x="342.5" y="250" font-size="18" font-weight="bold" fill="#202124">Node A</text>
    <text x="342.5" y="277" font-family="Menlo, Consolas, monospace" font-size="15" fill="#202124">hash &amp; 8 = 0</text>
    <rect x="485" y="220" width="165" height="74" rx="7" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
    <text x="567.5" y="250" font-size="18" font-weight="bold" fill="#202124">Node B</text>
    <text x="567.5" y="277" font-family="Menlo, Consolas, monospace" font-size="15" fill="#202124">hash &amp; 8 = 8</text>
    <rect x="710" y="220" width="165" height="74" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
    <text x="792.5" y="250" font-size="18" font-weight="bold" fill="#202124">Node C</text>
    <text x="792.5" y="277" font-family="Menlo, Consolas, monospace" font-size="15" fill="#202124">hash &amp; 8 = 0</text>
    <rect x="935" y="220" width="165" height="74" rx="7" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
    <text x="1017.5" y="250" font-size="18" font-weight="bold" fill="#202124">Node D</text>
    <text x="1017.5" y="277" font-family="Menlo, Consolas, monospace" font-size="15" fill="#202124">hash &amp; 8 = 8</text>
  </g>

  <!-- List links; each line extends slightly under its arrowhead -->
  <g stroke="#356eb3" stroke-width="5" stroke-linecap="round">
    <line x1="200" y1="257" x2="251" y2="257"/>
    <line x1="425" y1="257" x2="476" y2="257"/>
    <line x1="650" y1="257" x2="701" y2="257"/>
    <line x1="875" y1="257" x2="926" y2="257"/>
  </g>
  <g fill="#356eb3">
    <polygon points="240,246 263,257 240,268"/>
    <polygon points="465,246 488,257 465,268"/>
    <polygon points="690,246 713,257 690,268"/>
    <polygon points="915,246 938,257 915,268"/>
  </g>

  <!-- Single-bit split rule -->
  <rect x="300" y="345" width="600" height="78" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="3"/>
  <text x="600" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">Test the newly relevant bit: (node.hash &amp; oldCapacity)</text>
  <text x="600" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124">0 → stay at j   ·   non-zero → move to j + oldCapacity</text>

  <!-- Two clean branch arrows -->
  <line x1="490" y1="423" x2="360" y2="483" stroke="#34834b" stroke-width="6" stroke-linecap="round"/>
  <polygon points="369,466 343,491 378,488" fill="#34834b"/>
  <line x1="710" y1="423" x2="940" y2="483" stroke="#7b1fa2" stroke-width="6" stroke-linecap="round"/>
  <polygon points="922,488 957,491 931,466" fill="#7b1fa2"/>

  <!-- New lower bucket: original relative order A then C -->
  <rect x="55" y="500" width="180" height="78" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
  <text x="145" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#202124">new bucket 2</text>
  <text x="145" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">same index j</text>
  <rect x="285" y="500" width="140" height="78" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
  <text x="355" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">A</text>
  <line x1="425" y1="539" x2="474" y2="539" stroke="#34834b" stroke-width="5" stroke-linecap="round"/>
  <polygon points="463,528 486,539 463,550" fill="#34834b"/>
  <rect x="486" y="500" width="140" height="78" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
  <text x="556" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">C</text>

  <!-- New upper bucket: original relative order B then D -->
  <rect x="670" y="500" width="180" height="78" rx="7" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
  <text x="760" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#202124">new bucket 10</text>
  <text x="760" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">j + oldCapacity</text>
  <rect x="900" y="500" width="115" height="78" rx="7" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
  <text x="957.5" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">B</text>
  <line x1="1015" y1="539" x2="1054" y2="539" stroke="#7b1fa2" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1043,528 1066,539 1043,550" fill="#7b1fa2"/>
  <rect x="1066" y="500" width="95" height="78" rx="7" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
  <text x="1113.5" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">D</text>

  <!-- Resize notes -->
  <rect x="55" y="620" width="1106" height="52" rx="8" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/>
  <text x="608" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124">Capacity doubles 8 → 16; node hashes are reused, hashCode() is not recomputed, and each result keeps its original relative order.</text>
</svg>
