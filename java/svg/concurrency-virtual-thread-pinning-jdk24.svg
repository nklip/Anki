<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">JDK 24 removed synchronized as a routine virtual-thread pinning cause</title>
  <desc id="description">The upper flow shows a virtual thread blocking on socket input while inside synchronized code, then unmounting so the carrier becomes free in JDK 24 and later. The lower flow shows remaining pinning when a native or foreign frame prevents unmounting, so both the virtual thread and carrier remain blocked.</desc>

  <!-- Shared styles follow the established concurrency visual language. -->
  <defs>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #202124; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #5f6368; }
      .section { font: 700 21px Arial, Helvetica, sans-serif; fill: #202124; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #202124; }
      .body { font: 400 16px Arial, Helvetica, sans-serif; fill: #3c4043; }
      .small { font: 600 14px Arial, Helvetica, sans-serif; fill: #5f6368; }
      .code { font: 700 16px "Courier New", monospace; fill: #202124; }
    </style>
  </defs>

  <!-- Background and lesson statement. -->
  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="600" y="42" text-anchor="middle">Pinning after JDK 24: synchronized is no longer the usual cause</text>
  <text class="subtitle" x="600" y="71" text-anchor="middle">Pinning means a blocked virtual thread cannot unmount, so its carrier is unavailable too.</text>

  <!-- JEP 491 flow: monitor ownership follows the virtual thread, allowing unmounting. -->
  <rect x="45" y="100" width="1110" height="285" rx="12" fill="#f1f8f3" stroke="#34834b" stroke-width="2.5"/>
  <text x="75" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#34834b">JDK 24+ with JEP 491 — synchronized code can release the carrier</text>

  <rect x="75" y="174" width="230" height="128" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="2.5"/>
  <text class="label" x="190" y="207" text-anchor="middle">Virtual thread enters</text>
  <text class="code" x="190" y="240" text-anchor="middle">synchronized (lock)</text>
  <text class="body" x="190" y="270" text-anchor="middle">VT owns the monitor</text>
  <text class="small" x="190" y="292" text-anchor="middle">mounted on carrier-1</text>

  <!-- Arrow tips meet, but do not enter, the next state box. -->
  <line x1="305" y1="238" x2="334" y2="238" stroke="#356eb3" stroke-width="5" stroke-linecap="round"/>
  <polygon points="333,227 350,238 333,249" fill="#356eb3"/>

  <rect x="350" y="174" width="230" height="128" rx="10" fill="#fff4ce" stroke="#b7791f" stroke-width="2.5"/>
  <text class="label" x="465" y="207" text-anchor="middle">Supported blocking I/O</text>
  <text class="code" x="465" y="240" text-anchor="middle">socket.read()</text>
  <text class="body" x="465" y="270" text-anchor="middle">No bytes are ready</text>
  <text class="small" x="465" y="292" text-anchor="middle">VT must wait</text>

  <line x1="580" y1="238" x2="609" y2="238" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="608,227 625,238 608,249" fill="#b7791f"/>

  <rect x="625" y="174" width="230" height="128" rx="10" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="2.5"/>
  <text x="740" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#7b1fa2">Virtual thread unmounts</text>
  <text class="code" x="740" y="240" text-anchor="middle">VT waits separately</text>
  <text class="body" x="740" y="270" text-anchor="middle">Monitor ownership remains</text>
  <text class="small" x="740" y="292" text-anchor="middle">carrier identity may change</text>

  <line x1="855" y1="238" x2="884" y2="238" stroke="#7b1fa2" stroke-width="5" stroke-linecap="round"/>
  <polygon points="883,227 900,238 883,249" fill="#7b1fa2"/>

  <rect x="900" y="174" width="230" height="128" rx="10" fill="#d7f0df" stroke="#34834b" stroke-width="2.5"/>
  <text x="1015" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#34834b">Carrier becomes free</text>
  <text class="code" x="1015" y="240" text-anchor="middle">carrier-1 → VT-B</text>
  <text class="body" x="1015" y="270" text-anchor="middle">Another task can run</text>
  <text class="small" x="1015" y="292" text-anchor="middle">scalability is preserved</text>

  <rect x="185" y="315" width="830" height="56" rx="8" fill="#ffffff" stroke="#34834b" stroke-width="1.8"/>
  <text class="body" x="600" y="338" text-anchor="middle">Choose synchronized or java.util.concurrent locks for their semantics.</text>
  <text class="small" x="600" y="359" text-anchor="middle">JDK 24 removes the old need to replace synchronized merely to avoid pinning.</text>

  <!-- Remaining cause: a native or foreign frame prevents unmounting and keeps the carrier occupied. -->
  <rect x="45" y="410" width="1110" height="220" rx="12" fill="#fdf3f2" stroke="#d93025" stroke-width="2.5"/>
  <text x="75" y="448" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#d93025">Remaining pinning — native or foreign execution can keep the carrier attached</text>

  <rect x="80" y="480" width="245" height="106" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="2.5"/>
  <text class="label" x="202" y="513" text-anchor="middle">Virtual thread calls</text>
  <text class="code" x="202" y="546" text-anchor="middle">nativeOrForeignCall()</text>
  <text class="small" x="202" y="572" text-anchor="middle">native / foreign frame exists</text>

  <line x1="325" y1="533" x2="359" y2="533" stroke="#356eb3" stroke-width="5" stroke-linecap="round"/>
  <polygon points="358,522 375,533 358,544" fill="#356eb3"/>

  <rect x="375" y="480" width="245" height="106" rx="10" fill="#fff4ce" stroke="#b7791f" stroke-width="2.5"/>
  <text class="label" x="497" y="513" text-anchor="middle">Operation blocks</text>
  <text class="code" x="497" y="546" text-anchor="middle">wait for completion</text>
  <text class="small" x="497" y="572" text-anchor="middle">VT cannot safely unmount</text>

  <line x1="620" y1="533" x2="654" y2="533" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="653,522 670,533 653,544" fill="#b7791f"/>

  <rect x="670" y="480" width="450" height="106" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2.5"/>
  <text x="895" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#d93025">Pinned: virtual thread + carrier both wait</text>
  <text class="body" x="895" y="545" text-anchor="middle">Correctness is unchanged, but long or frequent pinning</text>
  <text class="body" x="895" y="569" text-anchor="middle">reduces the carriers available for other virtual threads.</text>

  <text class="small" x="600" y="660" text-anchor="middle">Use the JDK Flight Recorder event jdk.VirtualThreadPinned to investigate consequential pinning.</text>
</svg>
