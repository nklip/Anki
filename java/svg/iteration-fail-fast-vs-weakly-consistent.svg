<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">Fail-fast and weakly consistent iteration</title>
  <desc id="description">A fail-fast ArrayList iterator detects a structural modification through a modification count mismatch and throws ConcurrentModificationException. A ConcurrentHashMap iterator continues during updates without providing a snapshot.</desc>

  <!-- Background and title -->
  <rect width="1500" height="900" fill="white"/>
  <text x="750" y="50" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="black">Fail-fast vs. weakly consistent iteration</text>
  <text x="750" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#444">The behaviors solve different problems; neither term means that arbitrary code is automatically thread-safe</text>

  <!-- Fail-fast panel -->
  <rect x="40" y="115" width="690" height="650" rx="8" fill="#fff3f1" stroke="#b34a42" stroke-width="2"/>
  <rect x="40" y="115" width="690" height="58" rx="8" fill="#b34a42"/>
  <rect x="40" y="159" width="690" height="14" fill="#b34a42"/>
  <text x="70" y="153" font-family="sans-serif" font-size="25" font-weight="bold" fill="white">Fail-fast: ArrayList / HashMap</text>

  <!-- Step 1 -->
  <circle cx="82" cy="220" r="22" fill="#b34a42"/>
  <text x="82" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">1</text>
  <text x="120" y="226" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9b352f">Iterator remembers the structural version</text>

  <rect x="110" y="260" width="100" height="58" rx="5" fill="white" stroke="#b34a42"/>
  <rect x="210" y="260" width="100" height="58" rx="5" fill="white" stroke="#b34a42"/>
  <rect x="310" y="260" width="100" height="58" rx="5" fill="white" stroke="#b34a42"/>
  <text x="160" y="296" text-anchor="middle" font-family="monospace" font-size="20" fill="#9b352f">A</text>
  <text x="260" y="296" text-anchor="middle" font-family="monospace" font-size="20" fill="#9b352f">B</text>
  <text x="360" y="296" text-anchor="middle" font-family="monospace" font-size="20" fill="#9b352f">C</text>
  <text x="470" y="283" font-family="monospace" font-size="17" font-weight="bold" fill="#9b352f">modCount = 3</text>
  <text x="470" y="310" font-family="monospace" font-size="17" fill="#555">expected = 3</text>

  <!-- Down arrow -->
  <path d="M385 330V354" fill="none" stroke="#555" stroke-width="4"/>
  <polygon points="385,370 376,354 394,354" fill="#555"/>

  <!-- Step 2 -->
  <circle cx="82" cy="401" r="22" fill="#b34a42"/>
  <text x="82" y="408" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">2</text>
  <text x="120" y="407" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9b352f">Collection is modified directly</text>
  <rect x="130" y="440" width="490" height="64" rx="6" fill="white" stroke="#b34a42" stroke-width="2"/>
  <text x="375" y="468" text-anchor="middle" font-family="monospace" font-size="18" fill="#9b352f">list.add("D")</text>
  <text x="375" y="492" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#9b352f">modCount becomes 4</text>

  <path d="M385 506V530" fill="none" stroke="#555" stroke-width="4"/>
  <polygon points="385,546 376,530 394,530" fill="#555"/>

  <!-- Step 3 -->
  <circle cx="82" cy="577" r="22" fill="#b34a42"/>
  <text x="82" y="584" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">3</text>
  <text x="120" y="583" font-family="sans-serif" font-size="19" font-weight="bold" fill="#9b352f">Iterator detects a mismatch on a later check</text>
  <rect x="125" y="615" width="500" height="94" rx="7" fill="#b34a42" stroke="#b34a42" stroke-width="2"/>
  <text x="375" y="647" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="white">expectedModCount != modCount</text>
  <text x="375" y="683" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="white">throw ConcurrentModificationException</text>
  <text x="375" y="744" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Best-effort bug detection — not a synchronization guarantee</text>

  <!-- Weakly consistent panel -->
  <rect x="770" y="115" width="690" height="650" rx="8" fill="#eef6fc" stroke="#2f6fad" stroke-width="2"/>
  <rect x="770" y="115" width="690" height="58" rx="8" fill="#2f6fad"/>
  <rect x="770" y="159" width="690" height="14" fill="#2f6fad"/>
  <text x="800" y="153" font-family="sans-serif" font-size="25" font-weight="bold" fill="white">Weakly consistent: ConcurrentHashMap</text>

  <!-- Step 1 -->
  <circle cx="812" cy="220" r="22" fill="#2f6fad"/>
  <text x="812" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">1</text>
  <text x="850" y="226" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1d4f82">Iterator begins over the live structure</text>
  <rect x="840" y="260" width="130" height="58" rx="5" fill="white" stroke="#2f6fad"/>
  <rect x="970" y="260" width="130" height="58" rx="5" fill="white" stroke="#2f6fad"/>
  <rect x="1100" y="260" width="130" height="58" rx="5" fill="white" stroke="#2f6fad"/>
  <text x="905" y="296" text-anchor="middle" font-family="monospace" font-size="20" fill="#1d4f82">A</text>
  <text x="1035" y="296" text-anchor="middle" font-family="monospace" font-size="20" fill="#1d4f82">B</text>
  <text x="1165" y="296" text-anchor="middle" font-family="monospace" font-size="20" fill="#1d4f82">C</text>
  <path d="M1235 289H1302" fill="none" stroke="#2f6fad" stroke-width="4"/>
  <polygon points="1318,289 1302,280 1302,298" fill="#2f6fad"/>
  <text x="1370" y="295" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1d4f82">iterator</text>

  <path d="M1115 330V354" fill="none" stroke="#555" stroke-width="4"/>
  <polygon points="1115,370 1106,354 1124,354" fill="#555"/>

  <!-- Step 2 -->
  <circle cx="812" cy="401" r="22" fill="#2f6fad"/>
  <text x="812" y="408" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">2</text>
  <text x="850" y="407" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1d4f82">Another thread updates the map</text>
  <rect x="860" y="440" width="510" height="64" rx="6" fill="white" stroke="#2f6fad" stroke-width="2"/>
  <text x="1115" y="468" text-anchor="middle" font-family="monospace" font-size="18" fill="#1d4f82">map.put("D", value)</text>
  <text x="1115" y="492" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">the update is allowed to overlap traversal</text>

  <path d="M1115 506V530" fill="none" stroke="#555" stroke-width="4"/>
  <polygon points="1115,546 1106,530 1124,530" fill="#555"/>

  <!-- Step 3 -->
  <circle cx="812" cy="577" r="22" fill="#2f6fad"/>
  <text x="812" y="584" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">3</text>
  <text x="850" y="583" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1d4f82">Traversal continues without CME</text>
  <rect x="855" y="615" width="520" height="94" rx="7" fill="#dcebf8" stroke="#2f6fad" stroke-width="2"/>
  <text x="1115" y="647" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4f82">May observe A, B, C</text>
  <text x="1115" y="680" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4f82">or may also observe D</text>
  <text x="1115" y="744" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Safe concurrent traversal — but not a frozen snapshot</text>

  <!-- Bottom terminology note -->
  <rect x="40" y="800" width="1420" height="62" rx="7" fill="#fff9e8" stroke="#a47a20" stroke-width="2"/>
  <text x="750" y="826" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6f5214">“Fail-safe” is informal terminology.</text>
  <text x="750" y="850" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Java documentation uses precise terms such as snapshot iterator and weakly consistent iterator.</text>
</svg>
