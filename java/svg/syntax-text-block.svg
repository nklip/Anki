<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Java converts text block source into an ordinary String</title>
  <desc id="description">A beginner diagram showing visibly indented text block source, the compiler's three processing steps, the resulting String with relative indentation and a final newline, plus delimiter and escape rules.</desc>

  <!-- Shared styles; blue identifies source text, purple compile-time processing, green the runtime String, and orange syntax rules. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and lesson statement; badge records when text blocks became permanent. -->
  <rect id="background" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Text block source → compiler cleanup → ordinary String</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">Java removes source-only indentation but preserves meaningful structure</text>
  <rect x="1010" y="93" width="160" height="40" rx="20" fill="#dcefe1" stroke="#34834b" stroke-width="2"/>
  <text x="1090" y="119" text-anchor="middle" class="heading" font-size="14">FINAL · JDK 15</text>

  <!-- Step 1: middle dots make otherwise invisible source indentation explicit; each dot represents one source space. -->
  <g id="source-text-block">
    <rect x="30" y="130" width="370" height="350" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <rect x="30" y="130" width="370" height="50" rx="11" fill="#356eb3"/>
    <rect x="30" y="169" width="370" height="11" fill="#356eb3"/>
    <text x="55" y="163" class="light" font-size="20">1 · Source text block</text>
    <rect x="55" y="205" width="320" height="216" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
    <text x="75" y="235" class="mono" font-size="14">String json = """</text>
    <text x="75" y="267" class="mono" font-size="14">········{</text>
    <text x="75" y="299" class="mono" font-size="14">··········"name": "Ada",</text>
    <text x="75" y="331" class="mono" font-size="14">··········"active": true</text>
    <text x="75" y="363" class="mono" font-size="14">········}</text>
    <text x="75" y="395" class="mono" font-size="14">········""";</text>
    <text x="215" y="451" text-anchor="middle" class="muted" font-size="14">· = one visible space in this diagram</text>
  </g>

  <!-- First flow arrow stops before the compiler panel and never crosses a label. -->
  <path d="M410 300H421" fill="none" stroke="#744b91" stroke-width="4"/>
  <polygon points="420,289 440,300 420,311" fill="#744b91"/>

  <!-- Step 2: processing order matters because escape sequences are interpreted last. -->
  <g id="compiler-processing">
    <rect x="450" y="130" width="300" height="350" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <rect x="450" y="130" width="300" height="50" rx="11" fill="#744b91"/>
    <rect x="450" y="169" width="300" height="11" fill="#744b91"/>
    <text x="475" y="163" class="light" font-size="20">2 · Compiler</text>

    <rect x="480" y="205" width="240" height="67" rx="8" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
    <circle cx="508" cy="238" r="16" fill="#744b91"/>
    <text x="508" y="244" text-anchor="middle" class="light" font-size="15">1</text>
    <text x="535" y="231" class="heading" font-size="15">Normalize endings</text>
    <text x="535" y="252" class="mono" font-size="13">CR / CRLF → LF</text>

    <rect x="480" y="288" width="240" height="67" rx="8" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
    <circle cx="508" cy="321" r="16" fill="#744b91"/>
    <text x="508" y="327" text-anchor="middle" class="light" font-size="15">2</text>
    <text x="535" y="314" class="heading" font-size="15">Remove incidental</text>
    <text x="535" y="335" class="body" font-size="13">common indentation</text>

    <rect x="480" y="371" width="240" height="67" rx="8" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
    <circle cx="508" cy="404" r="16" fill="#744b91"/>
    <text x="508" y="410" text-anchor="middle" class="light" font-size="15">3</text>
    <text x="535" y="397" class="heading" font-size="15">Interpret escapes</text>
    <text x="535" y="418" class="mono" font-size="13">\n · \s · \...</text>
  </g>

  <!-- Second flow arrow points to the runtime value and stays clear of both panel borders. -->
  <path d="M760 300H771" fill="none" stroke="#34834b" stroke-width="4"/>
  <polygon points="770,289 790,300 770,311" fill="#34834b"/>

  <!-- Step 3: the result shows two meaningful spaces before properties and explicitly labels the final LF. -->
  <g id="runtime-string">
    <rect x="800" y="130" width="370" height="350" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <rect x="800" y="130" width="370" height="50" rx="11" fill="#34834b"/>
    <rect x="800" y="169" width="370" height="11" fill="#34834b"/>
    <text x="825" y="163" class="light" font-size="20">3 · Runtime String</text>
    <rect x="825" y="205" width="320" height="216" rx="8" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
    <text x="850" y="247" class="mono" font-size="16">{</text>
    <text x="850" y="284" class="mono" font-size="16">··"name": "Ada",</text>
    <text x="850" y="321" class="mono" font-size="16">··"active": true</text>
    <text x="850" y="358" class="mono" font-size="16">}</text>
    <text x="850" y="395" class="mono" font-size="15">↵ final LF newline</text>
    <text x="985" y="451" text-anchor="middle" class="heading" font-size="16">ordinary java.lang.String</text>
  </g>

  <!-- Bottom panels summarize delimiter placement and the non-raw escape behavior. -->
  <g id="syntax-rules">
    <g id="opening-rule">
      <rect x="30" y="515" width="360" height="175" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
      <rect x="30" y="515" width="360" height="46" rx="11" fill="#356eb3"/>
      <rect x="30" y="550" width="360" height="11" fill="#356eb3"/>
      <text x="55" y="546" class="light" font-size="19">Opening delimiter</text>
      <text x="210" y="604" text-anchor="middle" class="mono" font-size="18">""" then a line break</text>
      <text x="210" y="642" text-anchor="middle" class="body" font-size="15">Content cannot start beside it.</text>
      <text x="210" y="669" text-anchor="middle" class="muted" font-size="14">A one-line text block is invalid.</text>
    </g>

    <g id="closing-rule">
      <rect x="420" y="515" width="360" height="175" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
      <rect x="420" y="515" width="360" height="46" rx="11" fill="#744b91"/>
      <rect x="420" y="550" width="360" height="11" fill="#744b91"/>
      <text x="445" y="546" class="light" font-size="19">Closing delimiter</text>
      <text x="450" y="604" class="mono" font-size="15">own line</text>
      <text x="545" y="604" class="body" font-size="15">→ final \n</text>
      <text x="450" y="640" class="mono" font-size="15">after text</text>
      <text x="555" y="640" class="body" font-size="15">→ no final \n</text>
      <text x="600" y="669" text-anchor="middle" class="muted" font-size="14">Its indentation can affect stripping.</text>
    </g>

    <g id="escape-rule">
      <rect x="810" y="515" width="360" height="175" rx="11" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
      <rect x="810" y="515" width="360" height="46" rx="11" fill="#b7791f"/>
      <rect x="810" y="550" width="360" height="11" fill="#b7791f"/>
      <text x="835" y="546" class="light" font-size="19">Not a raw string</text>
      <text x="840" y="602" class="mono" font-size="15">\s</text>
      <text x="895" y="602" class="body" font-size="15">preserves one space</text>
      <text x="840" y="636" class="mono" font-size="15">\ + line end</text>
      <text x="965" y="636" class="body" font-size="15">joins source lines</text>
      <text x="990" y="669" text-anchor="middle" class="muted" font-size="14">Normal Java escapes are interpreted.</text>
    </g>
  </g>
</svg>
