<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">JVM stack area and stack frames</title>
  <desc id="diagram-description">A normal per-thread JVM stack shows main, checkout, and calculate frames, with calculate as the current frame. The frame contains local variables, an operand stack, and linkage information. A second stack shows recursion growing until a StackOverflowError risk.</desc>

  <style>
    .sans { font-family: Inter, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .heading { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #17212b; }
    .body { font-family: Inter, Arial, sans-serif; fill: #2f3a45; }
    .muted { font-family: Inter, Arial, sans-serif; fill: #596673; }
  </style>

  <!-- Background and title. -->
  <rect width="1400" height="900" fill="#ffffff"/>
  <text id="diagram-title-text" x="700" y="49" text-anchor="middle" class="heading" font-size="35">A JVM stack is private to one thread and contains method frames</text>
  <text x="700" y="81" text-anchor="middle" class="muted" font-size="18">A call pushes a frame; a normal return or uncaught exception removes it.</text>

  <!-- Normal call stack with one expanded current frame. -->
  <g id="normal-thread-stack">
    <rect x="40" y="120" width="690" height="610" rx="14" fill="#eef6fc" stroke="#356da8" stroke-width="3"/>
    <rect x="40" y="120" width="690" height="56" rx="14" fill="#356da8"/>
    <path d="M40 160H730" stroke="#356da8" stroke-width="30"/>
    <text x="68" y="157" class="sans" font-size="22" font-weight="700" fill="#ffffff">THREAD A · one private JVM stack</text>
    <text x="700" y="157" text-anchor="end" class="sans" font-size="16" fill="#ffffff">newest frame at the top</text>

    <!-- Current frame and its specified logical parts. -->
    <rect x="105" y="205" width="560" height="270" rx="12" fill="#ffffff" stroke="#43804c" stroke-width="4"/>
    <rect x="105" y="205" width="560" height="52" rx="12" fill="#43804c"/>
    <path d="M105 242H665" stroke="#43804c" stroke-width="28"/>
    <text x="130" y="240" class="sans" font-size="21" font-weight="700" fill="#ffffff">CURRENT FRAME · calculate()</text>

    <rect x="130" y="282" width="150" height="150" rx="9" fill="#fff7ef" stroke="#d79a77" stroke-width="2"/>
    <text x="205" y="312" text-anchor="middle" class="heading" font-size="17">Local variables</text>
    <line x1="150" y1="325" x2="260" y2="325" stroke="#e6c4b1" stroke-width="2"/>
    <text x="150" y="352" class="mono" font-size="15" fill="#8a3f20">0: this ref</text>
    <text x="150" y="379" class="mono" font-size="15" fill="#8a3f20">1: price</text>
    <text x="150" y="406" class="mono" font-size="15" fill="#8a3f20">2: tax ref</text>

    <rect x="310" y="282" width="150" height="150" rx="9" fill="#f4f0fa" stroke="#b8a2d0" stroke-width="2"/>
    <text x="385" y="312" text-anchor="middle" class="heading" font-size="17">Operand stack</text>
    <line x1="330" y1="325" x2="440" y2="325" stroke="#d8cce5" stroke-width="2"/>
    <rect x="340" y="386" width="90" height="26" fill="#e9def4" stroke="#7651a5" stroke-width="2"/>
    <rect x="340" y="357" width="90" height="26" fill="#eee7f5" stroke="#7651a5" stroke-width="2"/>
    <text x="385" y="375" text-anchor="middle" class="mono" font-size="14" fill="#56357e">price</text>
    <text x="385" y="405" text-anchor="middle" class="mono" font-size="14" fill="#56357e">rate</text>

    <rect x="490" y="282" width="150" height="150" rx="9" fill="#f7f9fb" stroke="#aab5bf" stroke-width="2"/>
    <text x="565" y="312" text-anchor="middle" class="heading" font-size="17">Linkage</text>
    <line x1="510" y1="325" x2="620" y2="325" stroke="#cbd2d8" stroke-width="2"/>
    <text x="565" y="354" text-anchor="middle" class="body" font-size="14">constant-pool</text>
    <text x="565" y="379" text-anchor="middle" class="body" font-size="14">reference</text>
    <text x="565" y="410" text-anchor="middle" class="body" font-size="14">return state</text>

    <!-- Older caller frames are compact because only the top frame is active. -->
    <rect x="105" y="505" width="560" height="78" rx="10" fill="#dcecf8" stroke="#6d9ac5" stroke-width="2"/>
    <text x="135" y="538" class="heading" font-size="18">caller frame · checkout()</text>
    <text x="135" y="565" class="muted" font-size="15">suspended while calculate() runs</text>

    <rect x="105" y="604" width="560" height="78" rx="10" fill="#e8f1f8" stroke="#8bb0d1" stroke-width="2"/>
    <text x="135" y="637" class="heading" font-size="18">oldest frame · main()</text>
    <text x="135" y="664" class="muted" font-size="15">resumes after its callees return</text>

    <!-- Push and pop arrows remain in side corridors, away from frame text. -->
    <path d="M72 646V264" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="62,264 72,248 82,264" fill="#356da8"/>
    <text x="94" y="481" text-anchor="middle" transform="rotate(-90 94 481)" class="sans" font-size="15" font-weight="700" fill="#234f7c">method call pushes</text>

    <path d="M697 264V646" fill="none" stroke="#43804c" stroke-width="4"/>
    <polygon points="687,646 697,662 707,646" fill="#43804c"/>
    <text x="676" y="481" text-anchor="middle" transform="rotate(90 676 481)" class="sans" font-size="15" font-weight="700" fill="#315e38">return pops</text>
  </g>

  <!-- A second thread has a separate stack; recursion demonstrates stack growth. -->
  <g id="recursive-thread-stack">
    <rect x="770" y="120" width="590" height="610" rx="14" fill="#fff7ef" stroke="#b56032" stroke-width="3"/>
    <rect x="770" y="120" width="590" height="56" rx="14" fill="#b56032"/>
    <path d="M770 160H1360" stroke="#b56032" stroke-width="30"/>
    <text x="798" y="157" class="sans" font-size="22" font-weight="700" fill="#ffffff">THREAD B · separate private stack</text>

    <rect x="845" y="214" width="440" height="73" rx="10" fill="#f8ded0" stroke="#b56032" stroke-width="3"/>
    <text x="875" y="246" class="heading" font-size="18">current · recurse(4)</text>
    <text x="875" y="270" class="muted" font-size="14">calls recurse(5) next</text>

    <rect x="845" y="306" width="440" height="73" rx="10" fill="#fae7dc" stroke="#c8784c" stroke-width="2"/>
    <text x="875" y="349" class="heading" font-size="18">recurse(3)</text>

    <rect x="845" y="398" width="440" height="73" rx="10" fill="#fbede4" stroke="#d18b64" stroke-width="2"/>
    <text x="875" y="441" class="heading" font-size="18">recurse(2)</text>

    <rect x="845" y="490" width="440" height="73" rx="10" fill="#fcf1ea" stroke="#dba181" stroke-width="2"/>
    <text x="875" y="533" class="heading" font-size="18">recurse(1)</text>

    <rect x="845" y="582" width="440" height="73" rx="10" fill="#f7f9fb" stroke="#aab5bf" stroke-width="2"/>
    <text x="875" y="625" class="heading" font-size="18">main()</text>

    <!-- Growth arrow stops before the warning label and never crosses text. -->
    <path d="M1318 626V234" fill="none" stroke="#a94442" stroke-width="4"/>
    <polygon points="1308,234 1318,218 1328,234" fill="#a94442"/>
    <text x="1342" y="430" text-anchor="middle" transform="rotate(90 1342 430)" class="sans" font-size="15" font-weight="700" fill="#8a302c">deeper calls consume stack</text>

    <rect x="815" y="674" width="500" height="34" rx="8" fill="#f9dddd" stroke="#a94442" stroke-width="2"/>
    <text x="1065" y="697" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#7a2826">Beyond the permitted stack size → StackOverflowError</text>
  </g>

  <!-- Closing rules distinguish the specification model from HotSpot virtual-thread storage. -->
  <g id="stack-takeaways">
    <rect x="40" y="765" width="1320" height="100" rx="14" fill="#f7f9fb" stroke="#b9c3cd" stroke-width="2"/>
    <text x="70" y="801" class="heading" font-size="18">Remember</text>
    <text x="70" y="831" class="body" font-size="16">The JVMS defines a private stack per thread, but it does not require frames to be contiguous or physically native-stack objects.</text>
    <text x="70" y="855" class="body" font-size="16">HotSpot virtual-thread stacks are stored as heap stack-chunk objects; that implementation detail enables many lightweight virtual threads.</text>
  </g>
</svg>
