<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Comparator compare compared with Comparable compareTo</title>
  <desc id="description">Comparable compareTo is implemented by the compared type and defines its natural ordering. Comparator compare belongs to a separate strategy and allows multiple alternative orderings. Both return a negative number, zero, or a positive number.</desc>

  <!-- Shared styles match nearby Java teaching diagrams. -->
  <defs>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #202124; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #5f6368; }
      .panel-title { font: 700 23px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .badge { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 0.6px; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #202124; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #3c4043; }
      .code { font: 700 18px "Courier New", monospace; fill: #202124; }
      .small { font: 600 15px Arial, Helvetica, sans-serif; fill: #5f6368; }
    </style>
  </defs>

  <!-- Background and beginner-facing lesson. -->
  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="600" y="43" text-anchor="middle">compareTo() defines the natural order; compare() applies a strategy</text>
  <text class="subtitle" x="600" y="73" text-anchor="middle">Ask where the ordering lives and how many orderings the type needs.</text>

  <!-- Comparable panel: ordering behavior is owned by the compared type. -->
  <rect x="45" y="103" width="535" height="410" rx="14" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
  <rect x="45" y="103" width="535" height="64" rx="14" fill="#356eb3"/>
  <rect x="45" y="145" width="535" height="22" fill="#356eb3"/>
  <text class="panel-title" x="312" y="143" text-anchor="middle">Comparable&lt;T&gt;.compareTo</text>
  <rect x="82" y="190" width="180" height="34" rx="17" fill="#d2e3fc" stroke="#356eb3" stroke-width="2"/>
  <text class="badge" x="172" y="213" text-anchor="middle" fill="#285a9f">INSIDE THE TYPE</text>
  <text class="code" x="82" y="265">int compareTo(T other)</text>
  <line x1="82" y1="281" x2="543" y2="281" stroke="#b7c9e8" stroke-width="2"/>
  <text class="label" x="82" y="318">Call</text>
  <text class="code" x="82" y="348">alice.compareTo(bob)</text>
  <text class="small" x="82" y="376">alice is this; bob is other</text>
  <text class="label" x="82" y="420">Purpose</text>
  <text class="body" x="82" y="450">Defines the type's natural (default) order.</text>
  <text class="body" x="82" y="479">The class implements Comparable&lt;Person&gt;.</text>

  <!-- Comparator panel: a separate object owns an alternative ordering strategy. -->
  <rect x="620" y="103" width="535" height="410" rx="14" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
  <rect x="620" y="103" width="535" height="64" rx="14" fill="#34834b"/>
  <rect x="620" y="145" width="535" height="22" fill="#34834b"/>
  <text class="panel-title" x="887" y="143" text-anchor="middle">Comparator&lt;T&gt;.compare</text>
  <rect x="657" y="190" width="190" height="34" rx="17" fill="#ceead6" stroke="#34834b" stroke-width="2"/>
  <text class="badge" x="752" y="213" text-anchor="middle" fill="#256b38">SEPARATE STRATEGY</text>
  <text class="code" x="657" y="265">int compare(T first, T second)</text>
  <line x1="657" y1="281" x2="1118" y2="281" stroke="#b8d8c1" stroke-width="2"/>
  <text class="label" x="657" y="318">Call</text>
  <text class="code" x="657" y="348">byAge.compare(alice, bob)</text>
  <text class="small" x="657" y="376">both objects are explicit arguments</text>
  <text class="label" x="657" y="420">Purpose</text>
  <text class="body" x="657" y="450">Defines an external or alternative order.</text>
  <text class="body" x="657" y="479">Many strategies can coexist: byAge, byName.</text>

  <!-- Shared sign contract; exact magnitudes such as -1 and 1 are not promised. -->
  <rect x="45" y="540" width="1110" height="105" rx="12" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/>
  <text class="label" x="600" y="570" text-anchor="middle">Both methods use the sign of the result, not a required exact number</text>
  <rect x="85" y="590" width="290" height="37" rx="8" fill="#fce8e6"/>
  <rect x="455" y="590" width="290" height="37" rx="8" fill="#fff4ce"/>
  <rect x="825" y="590" width="290" height="37" rx="8" fill="#e6f4ea"/>
  <text class="code" x="230" y="615" text-anchor="middle">&lt; 0  comes before</text>
  <text class="code" x="600" y="615" text-anchor="middle">0  same position</text>
  <text class="code" x="970" y="615" text-anchor="middle">&gt; 0  comes after</text>
  <text class="small" x="600" y="668" text-anchor="middle">A zero result means ordering-equivalent; it does not automatically mean equals() is true.</text>
</svg>
