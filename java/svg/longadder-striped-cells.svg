<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">LongAdder striped counter organization</title>
  <desc id="description">Low-contention updates use a base value. Under contention, threads are spread across padded cells. The sum operation reads base and all cells and adds them together.</desc>

  <!-- Background and title -->
  <rect width="1500" height="900" fill="white"/>
  <text x="750" y="50" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="black">LongAdder: base plus striped cells</text>
  <text x="750" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#444">Contention is distributed across several independently updated values</text>

  <!-- Low-contention panel -->
  <rect x="40" y="115" width="500" height="330" rx="8" fill="#eef6fc" stroke="#2f6fad" stroke-width="2"/>
  <text x="70" y="155" font-family="sans-serif" font-size="23" font-weight="bold" fill="#1d4f82">1. Low contention</text>
  <text x="70" y="184" font-family="sans-serif" font-size="16" fill="#555">The cells array is initially absent.</text>

  <rect x="90" y="225" width="130" height="52" rx="6" fill="white" stroke="#2f6fad" stroke-width="2"/>
  <rect x="320" y="225" width="130" height="52" rx="6" fill="white" stroke="#2f6fad" stroke-width="2"/>
  <text x="155" y="257" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1d4f82">Thread A</text>
  <text x="385" y="257" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1d4f82">Thread B</text>

  <path d="M155 279L238 326" fill="none" stroke="#2f6fad" stroke-width="4"/>
  <polygon points="252,334 234,333 243,317" fill="#2f6fad"/>
  <path d="M385 279L302 326" fill="none" stroke="#2f6fad" stroke-width="4"/>
  <polygon points="288,334 297,317 306,333" fill="#2f6fad"/>

  <rect x="190" y="337" width="160" height="72" rx="7" fill="#dcebf8" stroke="#2f6fad" stroke-width="3"/>
  <text x="270" y="367" text-anchor="middle" font-family="monospace" font-size="19" font-weight="bold" fill="#1d4f82">base = 8</text>
  <text x="270" y="394" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">updated with CAS</text>
  <text x="430" y="372" text-anchor="middle" font-family="monospace" font-size="16" fill="#777">cells = null</text>

  <!-- Transition to striped mode -->
  <path d="M542 280H568" fill="none" stroke="#b35b34" stroke-width="5"/>
  <polygon points="584,280 568,271 568,289" fill="#b35b34"/>
  <text x="565" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9b352f">base CAS contention</text>

  <!-- High-contention panel -->
  <rect x="590" y="115" width="870" height="330" rx="8" fill="#fff9ed" stroke="#a47a20" stroke-width="2"/>
  <text x="620" y="155" font-family="sans-serif" font-size="23" font-weight="bold" fill="#6f5214">2. Contention creates and expands stripes</text>
  <text x="620" y="184" font-family="sans-serif" font-size="16" fill="#555">A per-thread probe selects a cell; collisions cause retry, rehash, or expansion.</text>

  <!-- Threads aligned with cells -->
  <rect x="640" y="215" width="145" height="48" rx="6" fill="white" stroke="#a47a20"/>
  <rect x="840" y="215" width="145" height="48" rx="6" fill="white" stroke="#a47a20"/>
  <rect x="1040" y="215" width="145" height="48" rx="6" fill="white" stroke="#a47a20"/>
  <rect x="1240" y="215" width="145" height="48" rx="6" fill="white" stroke="#a47a20"/>
  <text x="712" y="245" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6f5214">Thread A</text>
  <text x="912" y="245" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6f5214">Thread B</text>
  <text x="1112" y="245" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6f5214">Thread C</text>
  <text x="1312" y="245" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6f5214">Thread D</text>

  <!-- Vertical update arrows -->
  <path d="M712 265V295" fill="none" stroke="#a47a20" stroke-width="4"/>
  <polygon points="712,311 703,295 721,295" fill="#a47a20"/>
  <path d="M912 265V295" fill="none" stroke="#a47a20" stroke-width="4"/>
  <polygon points="912,311 903,295 921,295" fill="#a47a20"/>
  <path d="M1112 265V295" fill="none" stroke="#a47a20" stroke-width="4"/>
  <polygon points="1112,311 1103,295 1121,295" fill="#a47a20"/>
  <path d="M1312 265V295" fill="none" stroke="#a47a20" stroke-width="4"/>
  <polygon points="1312,311 1303,295 1321,295" fill="#a47a20"/>

  <!-- Padded cells -->
  <rect x="630" y="313" width="165" height="82" rx="7" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <rect x="830" y="313" width="165" height="82" rx="7" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <rect x="1030" y="313" width="165" height="82" rx="7" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <rect x="1230" y="313" width="165" height="82" rx="7" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <text x="712" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6f5214">Cell 0</text>
  <text x="712" y="375" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#6f5214">value = 5</text>
  <text x="912" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6f5214">Cell 1</text>
  <text x="912" y="375" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#6f5214">value = 4</text>
  <text x="1112" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6f5214">Cell 2</text>
  <text x="1112" y="375" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#6f5214">value = 7</text>
  <text x="1312" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6f5214">Cell 3</text>
  <text x="1312" y="375" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#6f5214">value = 2</text>
  <text x="1025" y="423" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Cells are padded to reduce false sharing; each value is updated independently with CAS.</text>

  <!-- Sum calculation panel -->
  <rect x="40" y="485" width="1420" height="355" rx="8" fill="#fafafa" stroke="#777" stroke-width="2"/>
  <text x="70" y="525" font-family="sans-serif" font-size="23" font-weight="bold" fill="#333">3. sum() traverses all maintained values</text>
  <text x="70" y="554" font-family="sans-serif" font-size="16" fill="#555">The public result is calculated; there is no single counter field after striping begins.</text>

  <!-- Components -->
  <rect x="80" y="610" width="190" height="74" rx="6" fill="#dcebf8" stroke="#2f6fad" stroke-width="2"/>
  <rect x="350" y="610" width="190" height="74" rx="6" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <rect x="620" y="610" width="190" height="74" rx="6" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <rect x="890" y="610" width="190" height="74" rx="6" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <rect x="1160" y="610" width="190" height="74" rx="6" fill="#fff3cf" stroke="#a47a20" stroke-width="2"/>
  <text x="175" y="640" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#1d4f82">base</text>
  <text x="175" y="668" text-anchor="middle" font-family="monospace" font-size="20" fill="#1d4f82">8</text>
  <text x="445" y="640" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#6f5214">cell[0]</text>
  <text x="445" y="668" text-anchor="middle" font-family="monospace" font-size="20" fill="#6f5214">5</text>
  <text x="715" y="640" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#6f5214">cell[1]</text>
  <text x="715" y="668" text-anchor="middle" font-family="monospace" font-size="20" fill="#6f5214">4</text>
  <text x="985" y="640" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#6f5214">cell[2]</text>
  <text x="985" y="668" text-anchor="middle" font-family="monospace" font-size="20" fill="#6f5214">7</text>
  <text x="1255" y="640" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#6f5214">cell[3]</text>
  <text x="1255" y="668" text-anchor="middle" font-family="monospace" font-size="20" fill="#6f5214">2</text>

  <!-- Plus signs -->
  <text x="310" y="660" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#555">+</text>
  <text x="580" y="660" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#555">+</text>
  <text x="850" y="660" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#555">+</text>
  <text x="1120" y="660" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#555">+</text>

  <path d="M715 696V724" fill="none" stroke="#4d8758" stroke-width="5"/>
  <polygon points="715,740 706,724 724,724" fill="#4d8758"/>
  <rect x="480" y="742" width="470" height="58" rx="7" fill="#edf8ef" stroke="#4d8758" stroke-width="2"/>
  <text x="715" y="778" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#35623e">sum() = 8 + 5 + 4 + 7 + 2 = 26</text>

  <rect x="960" y="726" width="430" height="82" rx="7" fill="#fff3f1" stroke="#b34a42" stroke-width="2"/>
  <text x="1175" y="755" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#9b352f">Not an atomic snapshot</text>
  <text x="1175" y="781" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Concurrent updates may occur while the values are read.</text>
</svg>
