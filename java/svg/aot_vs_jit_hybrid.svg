<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: currentColor;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      rx: 10;
    }
    .arrow {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
    .label {
      font-size: 18px;
    }
    .small {
      font-size: 16px;
    }
  </style>

  <text x="300" y="32" text-anchor="middle" class="title">
    Hybrid AOT + JIT Flow
  </text>

  <!-- Top -->
  <rect class="box" x="180" y="60" width="220" height="60"/>
  <text x="290" y="97" text-anchor="middle" class="label">AOT knowledge</text>

  <line class="arrow" x1="290" y1="120" x2="290" y2="160"/>
  <path class="arrow" d="M283 150 L290 160 L297 150"/>

  <!-- Main horizontal flow -->
  <rect class="box" x="40" y="160" width="110" height="60"/>
  <text x="95" y="197" text-anchor="middle" class="label">Bytecode</text>

  <line class="arrow" x1="150" y1="190" x2="230" y2="190"/>
  <path class="arrow" d="M220 183 L230 190 L220 197"/>

  <rect class="box" x="230" y="160" width="120" height="60"/>
  <text x="290" y="197" text-anchor="middle" class="label">JVM</text>

  <line class="arrow" x1="350" y1="190" x2="430" y2="190"/>
  <path class="arrow" d="M420 183 L430 190 L420 197"/>

  <rect class="box" x="430" y="160" width="120" height="60"/>
  <text x="490" y="197" text-anchor="middle" class="label">JIT</text>

  <!-- Bottom -->
  <line class="arrow" x1="290" y1="220" x2="290" y2="250"/>
  <path class="arrow" d="M283 240 L290 250 L297 240"/>

  <rect class="box" x="150" y="250" width="280" height="64"/>
  <text x="185" y="278" text-anchor="start" class="small">• faster startup</text>
  <text x="185" y="302" text-anchor="start" class="small">• faster warmup</text>
</svg>