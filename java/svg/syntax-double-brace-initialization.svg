<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">How double-brace initialization works and what to use instead</title>
  <desc id="description">A beginner diagram decomposing double-brace initialization into an anonymous HashMap subclass and an instance initializer, showing the resulting anonymous object and safer collection construction alternatives.</desc>

  <!-- Shared styles; purple identifies the anonymous type, orange the construction-time initializer, and green recommended alternatives. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and the one-sentence lesson. -->
  <rect id="background" width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Double-brace initialization is hidden subclassing</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">Read left to right: syntax → two language features → an anonymous runtime object</text>

  <!-- Source expression; colored guide bars map each brace pair to its actual role. -->
  <g id="double-brace-source">
    <rect x="30" y="105" width="355" height="270" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <rect x="30" y="105" width="355" height="48" rx="11" fill="#356eb3"/>
    <rect x="30" y="142" width="355" height="11" fill="#356eb3"/>
    <text x="55" y="137" class="light" font-size="20">What the code looks like</text>

    <text x="55" y="193" class="mono" font-size="15">new HashMap&lt;&gt;() {</text>
    <text x="75" y="229" class="mono" font-size="15">{</text>
    <text x="95" y="260" class="mono" font-size="15">put("Alice", 10);</text>
    <text x="95" y="291" class="mono" font-size="15">put("Bob", 20);</text>
    <text x="75" y="322" class="mono" font-size="15">}</text>
    <text x="55" y="350" class="mono" font-size="15">}</text>

    <rect x="315" y="169" width="8" height="178" rx="4" fill="#744b91"/>
    <rect x="331" y="211" width="8" height="116" rx="4" fill="#b7791f"/>
  </g>

  <!-- First connector: tip stops before the decomposition panel. -->
  <path d="M395 240H422" fill="none" stroke="#64717c" stroke-width="4"/>
  <polygon points="422,230 439,240 422,250" fill="#64717c"/>

  <!-- Decomposition panel makes the two brace pairs explicit rather than relying on color alone. -->
  <g id="language-feature-decomposition">
    <rect x="450" y="105" width="385" height="270" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <text x="475" y="140" class="heading" font-size="20">What the braces mean</text>

    <rect x="475" y="165" width="335" height="78" rx="8" fill="#f1e7f7" stroke="#744b91" stroke-width="3"/>
    <text x="642" y="195" text-anchor="middle" class="heading" font-size="18">Outer braces</text>
    <text x="642" y="222" text-anchor="middle" class="body" font-size="15">declare an anonymous HashMap subclass</text>

    <rect x="475" y="265" width="335" height="78" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="3"/>
    <text x="642" y="295" text-anchor="middle" class="heading" font-size="18">Inner braces</text>
    <text x="642" y="322" text-anchor="middle" class="body" font-size="15">run an instance initializer at construction</text>
  </g>

  <!-- Second connector: manual head remains clear of the runtime-object boundary. -->
  <path d="M845 240H872" fill="none" stroke="#744b91" stroke-width="4"/>
  <polygon points="872,230 889,240 872,250" fill="#744b91"/>

  <!-- Runtime consequence: show the concrete class identity and the conditional capture rule. -->
  <g id="runtime-object">
    <rect x="900" y="105" width="270" height="270" rx="11" fill="#f7effb" stroke="#744b91" stroke-width="3"/>
    <text x="1035" y="140" text-anchor="middle" class="heading" font-size="20">What is created</text>
    <rect x="930" y="165" width="210" height="82" rx="8" fill="#ffffff" stroke="#744b91" stroke-width="2"/>
    <text x="1035" y="195" text-anchor="middle" class="mono" font-size="16">Example$1</text>
    <text x="1035" y="222" text-anchor="middle" class="body" font-size="15">anonymous subtype</text>
    <text x="1035" y="276" text-anchor="middle" class="body" font-size="15">not exactly HashMap.class</text>
    <text x="1035" y="309" text-anchor="middle" class="body" font-size="15">may capture used outer</text>
    <text x="1035" y="333" text-anchor="middle" class="body" font-size="15">or local state</text>
    <text x="1035" y="358" text-anchor="middle" class="muted" font-size="13">not automatically immutable</text>
  </g>

  <!-- Consequences and replacements use equal-height panels to avoid a meaningless empty center. -->
  <g id="decision-guide">
    <g id="why-avoid">
      <rect x="30" y="405" width="550" height="245" rx="11" fill="#fff4e9" stroke="#b06020" stroke-width="2"/>
      <rect x="30" y="405" width="550" height="48" rx="11" fill="#b06020"/>
      <rect x="30" y="442" width="550" height="11" fill="#b06020"/>
      <text x="55" y="437" class="light" font-size="20">Why avoid it?</text>
      <text x="60" y="492" class="body" font-size="16">• generates an unnecessary anonymous class</text>
      <text x="60" y="529" class="body" font-size="16">• can retain referenced surrounding state</text>
      <text x="60" y="566" class="body" font-size="16">• complicates serialization and reflection</text>
      <text x="60" y="603" class="body" font-size="16">• runs mutation code during construction</text>
      <text x="60" y="634" class="muted" font-size="13">The declared Map type does not remove these effects.</text>
    </g>

    <g id="preferred-alternatives">
      <rect x="610" y="405" width="560" height="245" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
      <rect x="610" y="405" width="560" height="48" rx="11" fill="#34834b"/>
      <rect x="610" y="442" width="560" height="11" fill="#34834b"/>
      <text x="635" y="437" class="light" font-size="20">Prefer explicit construction</text>

      <rect x="640" y="478" width="500" height="62" rx="8" fill="#ffffff" stroke="#34834b" stroke-width="2"/>
      <text x="665" y="503" class="heading" font-size="16">Fixed + unmodifiable</text>
      <text x="665" y="527" class="mono" font-size="15">Map.of("Alice", 10, "Bob", 20)</text>

      <rect x="640" y="561" width="500" height="62" rx="8" fill="#ffffff" stroke="#34834b" stroke-width="2"/>
      <text x="665" y="586" class="heading" font-size="16">Mutable</text>
      <text x="665" y="610" class="mono" font-size="15">new HashMap&lt;&gt;(); then put(...)</text>
      <text x="890" y="641" text-anchor="middle" class="muted" font-size="13">Clear class identity · no hidden initializer</text>
    </g>
  </g>
</svg>
