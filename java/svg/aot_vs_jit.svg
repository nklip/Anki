<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1179" viewBox="0 0 1920 1179"
  role="img" aria-labelledby="title desc">
  <title id="title">AOT versus JIT radar chart</title>
  <desc id="desc">Comparison of ahead-of-time and just-in-time compilation characteristics.</desc>
  <rect x="0" y="0" width="1920" height="1179" fill="#ffffff" />

  <!-- Semi-transparent comparison areas -->
  <polygon points="550,174 1136,310 1268,580 950,990 455,680"
    fill="#8fbe98" fill-opacity="0.55" stroke="#319b43" stroke-width="7" />
  <polygon points="850,420 1315,140 1455,630 950,730 727,585"
    fill="#ffc481" fill-opacity="0.62" stroke="#ff8500" stroke-width="7" />

  <!-- Five radar axes -->
  <g fill="none" stroke="#0784a3" stroke-width="6" stroke-linecap="square">
    <line x1="950" y1="505" x2="507" y2="138" />
    <line x1="950" y1="505" x2="1338" y2="111" />
    <line x1="950" y1="505" x2="1550" y2="650" />
    <line x1="950" y1="505" x2="950" y2="1051" />
    <line x1="950" y1="505" x2="420" y2="692" />
  </g>

  <!-- Axis arrowheads -->
  <g fill="#0784a3">
    <polygon points="484,117 519,126 497,154" />
    <polygon points="1361,87 1349,122 1327,100" />
    <polygon points="1588,663 1548,673 1556,638" />
    <polygon points="950,1095 932,1050 968,1050" />
    <polygon points="386,710 420,678 431,714" />
  </g>

  <!-- Axis labels -->
  <g fill="#535353" text-anchor="middle" font-family="Arial, sans-serif" font-size="60">
    <text x="485" y="88">Startup Speed</text>
    <text x="1375" y="62">Peak Throughput</text>
    <text x="205" y="690"><tspan x="205">Low Memory</tspan><tspan x="205" dy="84">Footprint</tspan></text>
    <text x="1720" y="675"><tspan x="1720">Reduced</tspan><tspan x="1720" dy="82">Max Latency</tspan></text>
    <text x="950" y="1153">Small Packaging</text>
  </g>

  <!-- Compiler labels -->
  <text x="320" y="420" font-size="116" fill="#319b43" text-anchor="middle"
    font-family="Arial, sans-serif">AOT</text>
  <text x="1535" y="417" font-size="116" fill="#ff8500" text-anchor="middle"
    font-family="Arial, sans-serif">JIT</text>
</svg>
