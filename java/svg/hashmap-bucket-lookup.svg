<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">HashMap bucket selection and lookup</title>
  <desc id="description">The incoming key hash code is spread, masked using the power-of-two table length, and used to select a bucket. Nodes are then checked by cached hash and key equality.</desc>

  <!-- Background and title -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#202124">How HashMap finds a bucket</text>

  <!-- Main lookup pipeline -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="30" y="105" width="150" height="96" rx="9" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
    <text x="105" y="145" font-size="19" font-weight="bold" fill="#202124">Incoming key</text>
    <text x="105" y="175" font-size="16" fill="#5f6368">non-null</text>

    <rect x="225" y="105" width="180" height="96" rx="9" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
    <text x="315" y="145" font-size="18" font-weight="bold" fill="#202124">key.hashCode()</text>
    <text x="315" y="175" font-size="16" fill="#5f6368">raw hash h</text>

    <rect x="450" y="105" width="220" height="96" rx="9" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
    <text x="560" y="140" font-size="18" font-weight="bold" fill="#202124">Spread high bits</text>
    <text x="560" y="174" font-family="Menlo, Consolas, monospace" font-size="18" fill="#202124">h ^ (h &gt;&gt;&gt; 16)</text>

    <rect x="715" y="105" width="210" height="96" rx="9" fill="#fff4ce" stroke="#b7791f" stroke-width="3"/>
    <text x="820" y="140" font-size="18" font-weight="bold" fill="#202124">Mask by capacity</text>
    <text x="820" y="174" font-family="Menlo, Consolas, monospace" font-size="18" fill="#202124">(n - 1) &amp; hash</text>

    <rect x="970" y="105" width="200" height="96" rx="9" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
    <text x="1070" y="141" font-size="19" font-weight="bold" fill="#202124">table[index]</text>
    <text x="1070" y="175" font-size="16" fill="#5f6368">selected bucket</text>
  </g>

  <!-- Pipeline arrows. Lines extend under the arrowheads so no gap is visible. -->
  <g stroke="#356eb3" stroke-width="5" stroke-linecap="round">
    <line x1="180" y1="153" x2="216" y2="153"/>
    <line x1="405" y1="153" x2="441" y2="153"/>
    <line x1="670" y1="153" x2="706" y2="153"/>
    <line x1="925" y1="153" x2="961" y2="153"/>
  </g>
  <g fill="#356eb3">
    <polygon points="205,142 228,153 205,164"/>
    <polygon points="430,142 453,153 430,164"/>
    <polygon points="695,142 718,153 695,164"/>
    <polygon points="950,142 973,153 950,164"/>
  </g>

  <!-- Traverse the selected list or tree bin -->
  <line x1="1070" y1="201" x2="1070" y2="267" stroke="#7b1fa2" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1058,254 1070,280 1082,254" fill="#7b1fa2"/>
  <rect x="705" y="280" width="465" height="177" rx="10" fill="#f8f9fa" stroke="#5f6368" stroke-width="3"/>
  <text x="937.5" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#202124">Search the selected list or tree bin</text>
  <text x="735" y="354" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">1. Match the node's cached hash to the incoming hash.</text>
  <text x="735" y="389" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">2. Match the same reference or key.equals(storedKey).</text>
  <text x="735" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">3. Continue through the bin; return value on a match.</text>

  <!-- Important distinction between incoming and stored hashes -->
  <rect x="30" y="280" width="625" height="177" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="3"/>
  <text x="342.5" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#202124">Which hash is recomputed?</text>
  <text x="57" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124">• Each operation calls hashCode() on the incoming lookup key.</text>
  <text x="57" y="390" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124">• A stored node keeps its spread hash in a final hash field.</text>
  <text x="57" y="425" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124">• Resize therefore does not call hashCode() on stored keys.</text>

  <!-- Null-key special path -->
  <rect x="30" y="500" width="1140" height="80" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="62" y="534" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#202124">Null key:</text>
  <text x="162" y="534" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#202124">HashMap assigns spread hash 0, so the null key is searched in bucket 0.</text>
  <text x="62" y="561" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">A non-null key whose spread hash is 0 can share that bucket; equality still distinguishes the keys.</text>
</svg>
