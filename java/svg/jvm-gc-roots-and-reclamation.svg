<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title description">
  <title id="title">GC roots, heap reachability, and class unloading</title>
  <desc id="description">Stack, class-associated, JNI, and JVM roots point to a live heap object graph. A disconnected object graph is reclaimable. A separate class-unloading path shows how an unreachable class loader can allow its Metaspace arena to be recycled.</desc>

  <!-- Background and title -->
  <rect width="1500" height="950" fill="white"/>
  <text x="750" y="52" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#111">GC roots, heap reachability, and class unloading</text>
  <text x="750" y="88" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#444">Reachability decides heap liveness; class-loader reachability also controls Metaspace reclamation</text>

  <!-- Root sources -->
  <text x="55" y="133" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222">Typical root sources</text>
  <rect x="55" y="150" width="300" height="92" rx="7" fill="#fff5f4" stroke="#b34a42" stroke-width="2"/>
  <text x="205" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7a2826">Active platform-thread frames</text>
  <text x="205" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">locals, registers, monitors</text>

  <rect x="395" y="150" width="300" height="92" rx="7" fill="#eef5fc" stroke="#356da8" stroke-width="2"/>
  <text x="545" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#234f7c">Class-associated roots</text>
  <text x="545" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">static references, loaded-class structures</text>

  <rect x="735" y="150" width="300" height="92" rx="7" fill="#f4eff8" stroke="#7651a5" stroke-width="2"/>
  <text x="885" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#56357e">JNI and JVM handles</text>
  <text x="885" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">native and runtime references</text>

  <rect x="1075" y="150" width="370" height="92" rx="7" fill="#edf8ef" stroke="#43804c" stroke-width="2"/>
  <text x="1260" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#315e38">Collector-specific roots</text>
  <text x="1260" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">remembered sets, code roots, queues</text>

  <!-- Heap boundary -->
  <rect x="55" y="300" width="1390" height="425" rx="10" fill="#f9fbfd" stroke="#356da8" stroke-width="3"/>
  <rect x="55" y="300" width="1390" height="55" rx="10" fill="#356da8"/>
  <rect x="55" y="342" width="1390" height="13" fill="#356da8"/>
  <text x="750" y="338" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="white">JAVA HEAP</text>

  <!-- Root arrows into heap, with shaft/head separation -->
  <path d="M205 242V278" fill="none" stroke="#b34a42" stroke-width="4"/>
  <polygon points="205,294 197,276 213,276" fill="#b34a42"/>
  <path d="M545 242V278" fill="none" stroke="#356da8" stroke-width="4"/>
  <polygon points="545,294 537,276 553,276" fill="#356da8"/>
  <path d="M885 242V278" fill="none" stroke="#7651a5" stroke-width="4"/>
  <polygon points="885,294 877,276 893,276" fill="#7651a5"/>
  <path d="M1260 242V278" fill="none" stroke="#43804c" stroke-width="4"/>
  <polygon points="1260,294 1252,276 1268,276" fill="#43804c"/>

  <!-- Live reachable graph -->
  <text x="330" y="390" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#315e38">Reachable graph · marked live</text>
  <circle cx="155" cy="475" r="45" fill="#d7ebd9" stroke="#43804c" stroke-width="4"/>
  <circle cx="315" cy="475" r="45" fill="#d7ebd9" stroke="#43804c" stroke-width="4"/>
  <circle cx="475" cy="475" r="45" fill="#d7ebd9" stroke="#43804c" stroke-width="4"/>
  <circle cx="315" cy="620" r="45" fill="#d7ebd9" stroke="#43804c" stroke-width="4"/>
  <text x="155" y="483" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#315e38">A</text>
  <text x="315" y="483" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#315e38">B</text>
  <text x="475" y="483" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#315e38">C</text>
  <text x="315" y="628" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#315e38">D</text>
  <path d="M200 475H254" fill="none" stroke="#43804c" stroke-width="4"/>
  <polygon points="270,475 252,466 252,484" fill="#43804c"/>
  <path d="M360 475H414" fill="none" stroke="#43804c" stroke-width="4"/>
  <polygon points="430,475 412,466 412,484" fill="#43804c"/>
  <path d="M315 520V559" fill="none" stroke="#43804c" stroke-width="4"/>
  <polygon points="315,575 306,557 324,557" fill="#43804c"/>
  <path d="M205 355C205 399 175 409 163 415" fill="none" stroke="#b34a42" stroke-width="4"/>
  <polygon points="152,428 157,408 172,420" fill="#b34a42"/>
  <text x="330" y="690" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#315e38">kept; some collectors may move or compact these objects</text>

  <!-- Class-loader and class mirror path -->
  <text x="760" y="390" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#234f7c">Live class-loader path</text>
  <rect x="640" y="430" width="240" height="92" rx="7" fill="#dceafa" stroke="#356da8" stroke-width="3"/>
  <text x="760" y="465" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#234f7c">ClassLoader object</text>
  <text x="760" y="495" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">reachable in heap</text>
  <rect x="640" y="570" width="240" height="92" rx="7" fill="#dceafa" stroke="#356da8" stroke-width="3"/>
  <text x="760" y="605" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#234f7c">Class mirror(s)</text>
  <text x="760" y="635" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">classes remain loaded</text>
  <path d="M760 522V549" fill="none" stroke="#356da8" stroke-width="4"/>
  <polygon points="760,565 751,547 769,547" fill="#356da8"/>
  <path d="M545 355C545 396 638 403 699 421" fill="none" stroke="#356da8" stroke-width="4"/>
  <polygon points="714,426 698,413 693,430" fill="#356da8"/>

  <!-- Unreachable graph -->
  <rect x="1005" y="390" width="385" height="280" rx="8" fill="#fff5f4" stroke="#b34a42" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1197" y="427" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7a2826">No path from any root</text>
  <circle cx="1125" cy="520" r="45" fill="#eee" stroke="#777" stroke-width="3"/>
  <circle cx="1270" cy="520" r="45" fill="#eee" stroke="#777" stroke-width="3"/>
  <text x="1125" y="528" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#555">X</text>
  <text x="1270" y="528" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#555">Y</text>
  <path d="M1170 520H1209" fill="none" stroke="#777" stroke-width="4"/>
  <polygon points="1225,520 1207,511 1207,529" fill="#777"/>
  <text x="1197" y="600" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7a2826">unmarked / reclaimable</text>
  <text x="1197" y="630" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">when the collector performs reclamation</text>

  <!-- Outcomes -->
  <rect x="55" y="770" width="420" height="130" rx="8" fill="#edf8ef" stroke="#43804c" stroke-width="3"/>
  <text x="265" y="807" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#315e38">Reachable heap objects</text>
  <text x="265" y="842" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">remain live for this collection</text>
  <text x="265" y="873" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">references repaired if objects move</text>

  <rect x="535" y="770" width="420" height="130" rx="8" fill="#fff5f4" stroke="#b34a42" stroke-width="3"/>
  <text x="745" y="807" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7a2826">Unreachable heap objects</text>
  <text x="745" y="842" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">space becomes reusable</text>
  <text x="745" y="873" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">timing and mechanism depend on collector</text>

  <rect x="1015" y="770" width="430" height="130" rx="8" fill="#fff8eb" stroke="#bd7823" stroke-width="3"/>
  <text x="1230" y="807" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7b4d16">Unreachable class loader</text>
  <text x="1230" y="842" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">classes may unload during GC</text>
  <text x="1230" y="873" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Metaspace chunks recycled or uncommitted</text>

  <!-- Outcome arrows with clear heads -->
  <path d="M315 725V750" fill="none" stroke="#43804c" stroke-width="4"/>
  <polygon points="315,770 305,749 325,749" fill="#43804c"/>
  <path d="M1197 670C1197 724 825 726 760 751" fill="none" stroke="#b34a42" stroke-width="4"/>
  <polygon points="745,770 754,748 769,763" fill="#b34a42"/>
  <path d="M880 616C980 616 1110 711 1210 754" fill="none" stroke="#bd7823" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="1230,770 1207,765 1218,746" fill="#bd7823"/>
  <text x="1040" y="690" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7b4d16">if the entire loader path later becomes unreachable</text>

  <!-- Footer -->
  <text x="750" y="935" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222">Stack frames pop automatically; heap objects require reachability-based collection; Metaspace depends on class unloading.</text>
</svg>
