<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">HotSpot JIT compilation flow</title>
  <desc id="description">HotSpot starts with bytecode, executes through the interpreter and lower compilation tiers, collects profiles, and compiles hot methods into optimized native code while retaining the ability to adapt.</desc>

  <!-- Heading matches every diagram in the AOT/JIT visual family. -->
  <rect width="1200" height="570" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" fill="#172033">HotSpot JIT: execute → observe → optimize → adapt</text>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f6878">Tiered compilation improves early execution while profiles are still being collected</text>

  <!-- Four left-to-right nodes; the node wording already explains every arrow. -->
  <g id="jit-flow">
    <rect x="35" y="160" width="245" height="145" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="157.5" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#172033">Bytecode</text>
    <text x="157.5" y="238" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" fill="#356eb3">.class methods</text>
    <text x="157.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">portable input</text>

    <line x1="280" y1="232" x2="323" y2="232" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
    <polygon points="319,221 343,232 319,243" fill="#1f4e79"/>

    <rect x="343" y="160" width="245" height="145" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="465.5" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#172033">Interpreter +</text>
    <text x="465.5" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#172033">lower JIT tiers</text>
    <text x="465.5" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">run code and add counters</text>
    <text x="465.5" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">faster than interpreting forever</text>

    <line x1="588" y1="232" x2="631" y2="232" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
    <polygon points="627,221 651,232 627,243" fill="#1f4e79"/>

    <rect x="651" y="160" width="245" height="145" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="773.5" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#172033">Runtime profiles</text>
    <text x="773.5" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#356eb3">hot methods</text>
    <text x="773.5" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#356eb3">branch frequencies</text>
    <text x="773.5" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#356eb3">encountered types</text>

    <line x1="896" y1="232" x2="939" y2="232" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
    <polygon points="935,221 959,232 935,243" fill="#1f4e79"/>

    <rect x="959" y="160" width="206" height="145" rx="10" fill="#dce9f7" stroke="#1f4e79" stroke-width="2"/>
    <text x="1062" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#172033">Optimized</text>
    <text x="1062" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#172033">native code</text>
    <text x="1062" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">stored in the JVM</text>
    <text x="1062" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6878">code cache</text>
  </g>

  <!-- Adaptation explanation stays below the flow, leaving a clear center. -->
  <rect x="125" y="355" width="950" height="105" rx="10" fill="#f6f9fd" stroke="#9db7d1" stroke-width="2"/>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1f4e79">The JVM keeps observing after compilation</text>
  <text x="600" y="421" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5f6878">If a speculative assumption stops matching reality, HotSpot can deoptimize and later recompile.</text>
  <text x="600" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6878">That adaptation is a central JIT advantage for dynamic, long-running applications.</text>

  <rect x="235" y="495" width="730" height="48" rx="8" fill="#fff4ce" stroke="#b7791f" stroke-width="1.5"/>
  <text x="600" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#684713">“Hot” means worth compiling based on observed execution—not merely present in the program.</text>
</svg>
