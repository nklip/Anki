<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="220" viewBox="0 0 1500 220"
  role="img" aria-labelledby="title desc">
  <title id="title">Java Execution Flow with JIT</title>
  <desc id="desc">Java source is compiled to bytecode and processed by the JVM, interpreter, and JIT compiler.</desc>
  <rect x="0" y="0" width="1500" height="220" fill="#ffffff" />

  <!-- Diagram title -->
  <text x="750" y="32" font-size="22" fill="#000000" text-anchor="middle"
    font-family="Arial, sans-serif" font-weight="700">Java Execution Flow with JIT</text>

  <!-- Processing boxes -->
  <g fill="none" stroke="#000000" stroke-width="2">
    <rect x="115" y="90" width="140" height="60" rx="10" />
    <rect x="295" y="90" width="180" height="60" rx="10" />
    <rect x="515" y="90" width="120" height="60" rx="10" />
    <rect x="675" y="90" width="170" height="60" rx="10" />
    <rect x="885" y="90" width="240" height="60" rx="10" />
    <rect x="1165" y="90" width="200" height="60" rx="10" />
  </g>

  <!-- Box labels -->
  <g fill="#000000" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">
    <text x="185" y="126">.java</text>
    <text x="385" y="126">.class bytecode</text>
    <text x="575" y="126">JVM</text>
    <text x="760" y="126">Interpreter</text>
    <text x="1005" y="126">JIT detects hot code</text>
    <text x="1265" y="116">Native</text>
    <text x="1265" y="138">Machine Code</text>
  </g>

  <!-- Short connectors between neighboring boxes -->
  <g fill="none" stroke="#000000" stroke-width="2">
    <line x1="255" y1="120" x2="295" y2="120" />
    <polyline points="285,113 295,120 285,127" />
    <line x1="475" y1="120" x2="515" y2="120" />
    <polyline points="505,113 515,120 505,127" />
    <line x1="635" y1="120" x2="675" y2="120" />
    <polyline points="665,113 675,120 665,127" />
    <line x1="845" y1="120" x2="885" y2="120" />
    <polyline points="875,113 885,120 875,127" />
    <line x1="1125" y1="120" x2="1165" y2="120" />
    <polyline points="1155,113 1165,120 1155,127" />
  </g>

  <!-- Compiler name above the first connector -->
  <text x="275" y="100" font-size="14" fill="#000000" text-anchor="middle"
    font-family="Arial, sans-serif">javac</text>
</svg>
