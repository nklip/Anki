<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">How ZGC colored pointers and barriers keep references correct</title>
  <desc id="diagram-description">Heap object fields store colored pointers containing an address and garbage collector metadata, while stacks and registers use colorless references. A load barrier removes metadata and remaps a stale address after relocation. A store barrier adds metadata, preserves snapshot-at-the-beginning marking, and records old fields that may point to young objects.</desc>

  <!-- Blue represents address handling, purple represents pointer metadata, green represents application-visible safe references, and orange represents generational tracking. -->
  <style>
    .heading { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #17212b; }
    .body { font-family: Inter, Arial, sans-serif; fill: #2f3a45; }
    .muted { font-family: Inter, Arial, sans-serif; fill: #596673; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #23303d; }
    .light { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1400" height="840" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="heading" font-size="32">ZGC barriers translate and protect object references</text>
  <text x="700" y="80" text-anchor="middle" class="muted" font-size="18">The application still sees ordinary Java references; HotSpot injects the checks.</text>

  <!-- Pointer-format band separates the colored heap representation from colorless runtime roots. -->
  <g id="pointer-formats">
    <rect x="40" y="110" width="1320" height="170" rx="13" fill="#f7f9fb" stroke="#66727d" stroke-width="2"/>
    <text x="65" y="145" class="heading" font-size="20">Where the metadata lives</text>

    <rect x="70" y="170" width="490" height="75" rx="10" fill="#ffffff" stroke="#7651a5" stroke-width="2"/>
    <text x="95" y="198" class="heading" font-size="16">Reference stored in a heap object field</text>
    <rect x="95" y="212" width="265" height="20" fill="#dceafb" stroke="#356da8"/>
    <rect x="360" y="212" width="175" height="20" fill="#eee4f4" stroke="#7651a5"/>
    <text x="227" y="228" text-anchor="middle" class="mono" font-size="12">object address</text>
    <text x="447" y="228" text-anchor="middle" class="mono" font-size="12">GC metadata</text>

    <!-- Translation arrow stays within the label-free corridor between representation boxes. -->
    <path d="M575 208H790" fill="none" stroke="#66727d" stroke-width="4"/>
    <polygon points="790,198 804,208 790,218" fill="#66727d"/>
    <text x="690" y="194" text-anchor="middle" class="muted" font-size="14">barriers translate</text>

    <rect x="820" y="170" width="510" height="75" rx="10" fill="#edf8f0" stroke="#43804c" stroke-width="2"/>
    <text x="845" y="198" class="heading" font-size="16">Reference in a JVM stack slot or CPU register</text>
    <rect x="845" y="212" width="460" height="20" fill="#d9f0dc" stroke="#43804c"/>
    <text x="1075" y="228" text-anchor="middle" class="mono" font-size="12">colorless, directly usable address</text>
  </g>

  <!-- Load panel: the fast path is normal; the slow path repairs a stale reference after an object moves. -->
  <g id="load-barrier-panel">
    <rect x="40" y="310" width="640" height="415" rx="13" fill="#eef5ff" stroke="#356da8" stroke-width="3"/>
    <rect x="40" y="310" width="640" height="56" rx="13" fill="#356da8"/>
    <path d="M40 350H680" stroke="#356da8" stroke-width="30"/>
    <text x="65" y="348" class="light" font-size="21">LOAD BARRIER · application reads a reference field</text>

    <rect x="105" y="395" width="510" height="66" rx="9" fill="#ffffff" stroke="#356da8" stroke-width="2"/>
    <text x="130" y="423" class="heading" font-size="16">Read the colored pointer from the heap field</text>
    <text x="130" y="447" class="mono" font-size="14">stored address may be current or stale</text>

    <path d="M360 467V484" fill="none" stroke="#356da8" stroke-width="4"/>
    <polygon points="350,484 360,498 370,484" fill="#356da8"/>

    <rect x="105" y="505" width="510" height="75" rx="9" fill="#ffffff" stroke="#7651a5" stroke-width="2"/>
    <text x="130" y="534" class="heading" font-size="16">Fast check: is this address valid for the phase?</text>
    <text x="130" y="559" class="body" font-size="14">Usually yes → strip metadata and continue.</text>

    <path d="M360 586V603" fill="none" stroke="#7651a5" stroke-width="4"/>
    <polygon points="350,603 360,617 370,603" fill="#7651a5"/>

    <rect x="105" y="624" width="510" height="71" rx="9" fill="#edf8f0" stroke="#43804c" stroke-width="2"/>
    <text x="130" y="652" class="heading" font-size="16">Slow path when needed: remap old address → new address</text>
    <text x="130" y="678" class="body" font-size="14">Return a safe colorless reference; later reads usually stay fast.</text>
  </g>

  <!-- Store panel: one check supports pointer coloring, SATB marking, and precise old-to-young tracking. -->
  <g id="store-barrier-panel">
    <rect x="720" y="310" width="640" height="415" rx="13" fill="#fff7ef" stroke="#b56032" stroke-width="3"/>
    <rect x="720" y="310" width="640" height="56" rx="13" fill="#b56032"/>
    <path d="M720 350H1360" stroke="#b56032" stroke-width="30"/>
    <text x="745" y="348" class="light" font-size="21">STORE BARRIER · application writes a reference field</text>

    <rect x="785" y="395" width="510" height="66" rx="9" fill="#ffffff" stroke="#b56032" stroke-width="2"/>
    <text x="810" y="423" class="heading" font-size="16">Inspect the field value that will be overwritten</text>
    <text x="810" y="447" class="body" font-size="14">The pointer color says which GC work is still required.</text>

    <path d="M1040 467V484" fill="none" stroke="#b56032" stroke-width="4"/>
    <polygon points="1030,484 1040,498 1050,484" fill="#b56032"/>

    <rect x="785" y="505" width="510" height="58" rx="9" fill="#ffffff" stroke="#7651a5" stroke-width="2"/>
    <text x="810" y="540" class="heading" font-size="16">Color the new pointer before storing it in the heap</text>

    <!-- Three outcomes share a row and are deliberately short enough for fallback fonts. -->
    <rect x="785" y="590" width="155" height="105" rx="9" fill="#f4f0fa" stroke="#7651a5" stroke-width="2"/>
    <text x="862" y="619" text-anchor="middle" class="heading" font-size="15">Pointer state</text>
    <text x="862" y="647" text-anchor="middle" class="body" font-size="13">add metadata</text>
    <text x="862" y="670" text-anchor="middle" class="body" font-size="13">for later checks</text>

    <rect x="955" y="590" width="155" height="105" rx="9" fill="#eef5ff" stroke="#356da8" stroke-width="2"/>
    <text x="1032" y="619" text-anchor="middle" class="heading" font-size="15">SATB marking</text>
    <text x="1032" y="647" text-anchor="middle" class="body" font-size="13">report an old value</text>
    <text x="1032" y="670" text-anchor="middle" class="body" font-size="13">when required</text>

    <rect x="1125" y="590" width="170" height="105" rx="9" fill="#edf8f0" stroke="#43804c" stroke-width="2"/>
    <text x="1210" y="619" text-anchor="middle" class="heading" font-size="15">Remembered set</text>
    <text x="1210" y="647" text-anchor="middle" class="body" font-size="13">record an old field</text>
    <text x="1210" y="670" text-anchor="middle" class="body" font-size="13">that may point young</text>
  </g>

  <!-- Bottom summary connects both barriers to the low-pause design without introducing another flow. -->
  <g id="barrier-summary">
    <rect x="40" y="755" width="1320" height="55" rx="10" fill="#f7f9fb" stroke="#66727d" stroke-width="2"/>
    <text x="70" y="789" class="heading" font-size="16">Result:</text>
    <text x="137" y="789" class="body" font-size="15">ZGC can mark and move objects concurrently while reads still find the current object and young collections still find old → young roots.</text>
  </g>
</svg>
