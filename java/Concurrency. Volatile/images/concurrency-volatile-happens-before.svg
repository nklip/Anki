<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Volatile happens-before chain</title>
  <desc id="description">Ordinary writes in a writer thread occur before a volatile release write. A reader that subsequently performs an acquire read of the same volatile field sees those earlier ordinary writes through program order and transitivity.</desc>

  <!-- Background and title -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#202124">Volatile publication: the complete happens-before chain</text>

  <!-- Thread headings -->
  <rect x="55" y="72" width="430" height="52" rx="7" fill="#356eb3"/>
  <text x="270" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Thread A — writer</text>
  <rect x="715" y="72" width="430" height="52" rx="7" fill="#34834b"/>
  <text x="930" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Thread B — reader</text>

  <!-- Writer ordinary writes -->
  <rect x="75" y="150" width="390" height="103" rx="8" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
  <text x="270" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Ordinary writes</text>
  <text x="270" y="211" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#202124">data = 42;</text>
  <text x="270" y="237" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#202124">message = "ready";</text>

  <!-- Program-order arrow in the writer -->
  <line x1="270" y1="253" x2="270" y2="317" stroke="#356eb3" stroke-width="5" stroke-linecap="round"/>
  <polygon points="259,305 270,329 281,305" fill="#356eb3"/>
  <text x="288" y="293" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">program order</text>

  <!-- Volatile release write -->
  <rect x="75" y="329" width="390" height="115" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2.5"/>
  <text x="270" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#d93025">Release</text>
  <text x="270" y="400" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#202124">ready = true;</text>
  <text x="270" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">volatile write</text>

  <!-- Volatile acquire read -->
  <rect x="735" y="329" width="390" height="115" rx="8" fill="#e6f4ea" stroke="#34834b" stroke-width="2.5"/>
  <text x="930" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#34834b">Acquire</text>
  <text x="930" y="400" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#202124">read ready == true</text>
  <text x="930" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">subsequent volatile read</text>

  <!-- Cross-thread volatile edge. Line ends beneath a large, aligned arrowhead. -->
  <line x1="465" y1="386" x2="716" y2="386" stroke="#7b1fa2" stroke-width="6" stroke-linecap="round"/>
  <polygon points="702,374 729,386 702,398" fill="#7b1fa2"/>
  <text x="600" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#7b1fa2">synchronizes-with</text>
  <text x="600" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7b1fa2">same volatile field</text>

  <!-- Program-order arrow in the reader -->
  <line x1="930" y1="444" x2="930" y2="482" stroke="#34834b" stroke-width="5" stroke-linecap="round"/>
  <polygon points="919,470 930,494 941,470" fill="#34834b"/>

  <!-- Reader observes earlier ordinary state -->
  <rect x="735" y="494" width="390" height="83" rx="8" fill="#e6f4ea" stroke="#34834b" stroke-width="2"/>
  <text x="930" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Guaranteed observations</text>
  <text x="930" y="554" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#202124">data == 42; message.equals("ready")</text>

  <!-- Transitivity summary -->
  <rect x="75" y="494" width="560" height="83" rx="8" fill="#fff4ce" stroke="#b7791f" stroke-width="1.5"/>
  <text x="355" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Program order + volatile edge + program order</text>
  <text x="355" y="554" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">By transitivity, the ordinary writes happen-before the ordinary reads.</text>

  <text x="600" y="607" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">The release and acquire must use the same volatile variable.</text>
</svg>
