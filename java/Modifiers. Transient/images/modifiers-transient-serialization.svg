<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"
     role="img" aria-labelledby="title description">
  <title id="title">A transient field is skipped by default Java serialization</title>
  <desc id="description">A three-stage flow. A live UserSession contains username Mia and transient access token abc123. Default serialization writes username but skips the transient field. The restored object has username Mia and a null access token.</desc>

  <!--
    Repair map:
    - Title: y=0..100
    - Three equal teaching panels: y=130..545
    - Connector corridors: x=350..425 and x=775..850
    - Default-value and customization notes: y=575..690
    Keep arrowheads in their corridors; their tips meet, but never enter, target borders.
  -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #25313d; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
      .status { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.6px; }
    </style>
  </defs>

  <rect id="background" width="1200" height="720" fill="#f7f9fc"/>

  <!-- The lesson and reading direction are explicit for a first-time learner. -->
  <text x="600" y="45" text-anchor="middle" class="heading" font-size="31">transient changes the default serialized form</text>
  <text x="600" y="78" text-anchor="middle" class="muted" font-size="18">Read left to right: live object → fields written → restored object</text>

  <!-- Panels are painted before connectors; text is painted last and stays above all geometry. -->
  <g id="panel-shapes">
    <rect x="30" y="130" width="320" height="415" rx="14" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <rect x="30" y="130" width="320" height="60" rx="14" fill="#356eb3"/>
    <rect x="30" y="176" width="320" height="14" fill="#356eb3"/>

    <rect x="425" y="130" width="350" height="415" rx="14" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <rect x="425" y="130" width="350" height="60" rx="14" fill="#744b91"/>
    <rect x="425" y="176" width="350" height="14" fill="#744b91"/>

    <rect x="850" y="130" width="320" height="415" rx="14" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <rect x="850" y="130" width="320" height="60" rx="14" fill="#34834b"/>
    <rect x="850" y="176" width="320" height="14" fill="#34834b"/>
  </g>

  <!-- Arrow shafts end inside their own triangular bases; head tips only meet target borders. -->
  <g id="flow-arrows" fill="#536170" stroke="#536170">
    <path d="M350 338 H395" fill="none" stroke-width="5"/>
    <polygon points="395,325 425,338 395,351" stroke="none"/>
    <path d="M775 338 H820" fill="none" stroke-width="5"/>
    <polygon points="820,325 850,338 820,351" stroke="none"/>
  </g>

  <!-- Stage 1: both values are present in the live object. -->
  <g id="live-object">
    <text x="190" y="168" text-anchor="middle" class="light" font-size="21">1 · LIVE OBJECT</text>
    <text x="190" y="225" text-anchor="middle" class="heading" font-size="18">UserSession in memory</text>

    <rect x="55" y="250" width="270" height="82" rx="10" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
    <text x="75" y="281" class="mono" font-size="16">username</text>
    <text x="75" y="311" class="body" font-size="18">“Mia”</text>
    <text x="300" y="281" text-anchor="end" class="status" fill="#28723c">NORMAL</text>

    <rect x="55" y="365" width="270" height="100" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="75" y="396" class="mono" font-size="16">transient accessToken</text>
    <text x="75" y="428" class="body" font-size="18">“abc123”</text>
    <text x="300" y="451" text-anchor="end" class="status" fill="#9a5c0a">SKIP MARK</text>

    <text x="190" y="503" text-anchor="middle" class="heading" font-size="16">Both values still exist</text>
    <text x="190" y="526" text-anchor="middle" class="muted" font-size="14">in the running program</text>
  </g>

  <!-- Stage 2: the default field-selection rule is visible beside its result. -->
  <g id="default-write">
    <text x="600" y="168" text-anchor="middle" class="light" font-size="21">2 · DEFAULT WRITE</text>
    <text x="600" y="222" text-anchor="middle" class="heading" font-size="18">Select persistent fields</text>
    <text x="600" y="247" text-anchor="middle" class="muted" font-size="14">non-static + non-transient</text>

    <rect x="450" y="270" width="300" height="85" rx="10" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <text x="470" y="302" class="mono" font-size="16">username = “Mia”</text>
    <text x="730" y="335" text-anchor="end" class="status" fill="#28723c">WRITTEN</text>

    <rect x="450" y="385" width="300" height="85" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="470" y="417" class="mono" font-size="16">accessToken</text>
    <text x="730" y="450" text-anchor="end" class="status" fill="#9a5c0a">SKIPPED</text>

    <text x="600" y="505" text-anchor="middle" class="heading" font-size="16">The stream has no token value</text>
    <text x="600" y="528" text-anchor="middle" class="muted" font-size="14">static fields are also excluded</text>
  </g>

  <!-- Stage 3: missing serialized data becomes the field type's default value. -->
  <g id="restored-object">
    <text x="1010" y="168" text-anchor="middle" class="light" font-size="21">3 · RESTORED</text>
    <text x="1010" y="225" text-anchor="middle" class="heading" font-size="18">New UserSession object</text>

    <rect x="875" y="250" width="270" height="82" rx="10" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
    <text x="895" y="281" class="mono" font-size="16">username</text>
    <text x="895" y="311" class="body" font-size="18">“Mia”</text>
    <text x="1120" y="281" text-anchor="end" class="status" fill="#28723c">RESTORED</text>

    <rect x="875" y="365" width="270" height="100" rx="10" fill="#eef2f6" stroke="#7b8794" stroke-width="2"/>
    <text x="895" y="396" class="mono" font-size="16">accessToken</text>
    <text x="895" y="428" class="mono" font-size="18">null</text>
    <text x="1120" y="451" text-anchor="end" class="status" fill="#596674">DEFAULT</text>

    <text x="1010" y="503" text-anchor="middle" class="heading" font-size="16">Skipped reference → null</text>
    <text x="1010" y="526" text-anchor="middle" class="muted" font-size="14">primitives receive 0 or false</text>
  </g>

  <!-- Bottom strip prevents the two most likely overgeneralizations. -->
  <g id="limits-strip">
    <rect x="30" y="575" width="1140" height="115" rx="13" fill="#ffffff" stroke="#c7d0dc" stroke-width="2"/>
    <text x="55" y="608" class="heading" font-size="18">Remember</text>

    <rect x="55" y="625" width="515" height="43" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="312.5" y="652" text-anchor="middle" class="body" font-size="15">transient does not erase or encrypt the live value</text>

    <rect x="595" y="625" width="550" height="43" rx="8" fill="#faf8fc" stroke="#744b91" stroke-width="1.5"/>
    <text x="870" y="652" text-anchor="middle" class="body" font-size="15">custom writeObject/readObject can explicitly store and restore it</text>
  </g>
</svg>
