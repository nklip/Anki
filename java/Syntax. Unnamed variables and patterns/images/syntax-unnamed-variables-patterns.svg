<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Underscore ignores a required value without creating a name</title>
  <desc id="description">A beginner diagram showing Point 10,20 matched by Point int x underscore, where x is bound to 10 but the second component is ignored and no variable named underscore enters scope, plus allowed contexts and restrictions.</desc>

  <!-- Shared styles; blue identifies the incoming value, purple the syntactic pattern, green a usable binding, and orange an intentionally ignored value. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and lesson statement; the badge records the permanent release. -->
  <rect id="background" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Required slot + _ = intentionally ignored value</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">The operation still happens, but underscore introduces no name that code can use</text>
  <rect x="1010" y="93" width="160" height="40" rx="20" fill="#dcefe1" stroke="#34834b" stroke-width="2"/>
  <text x="1090" y="119" text-anchor="middle" class="heading" font-size="14">FINAL · JDK 22</text>

  <!-- Step 1: the record contains two values before matching. -->
  <g id="input-record">
    <rect x="30" y="140" width="300" height="280" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <rect x="30" y="140" width="300" height="50" rx="11" fill="#356eb3"/>
    <rect x="30" y="179" width="300" height="11" fill="#356eb3"/>
    <text x="55" y="173" class="light" font-size="20">1 · Input value</text>
    <rect x="60" y="220" width="240" height="54" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
    <text x="180" y="253" text-anchor="middle" class="mono" font-size="18">Point(10, 20)</text>
    <rect x="60" y="302" width="105" height="72" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
    <rect x="195" y="302" width="105" height="72" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
    <text x="112" y="328" text-anchor="middle" class="heading" font-size="15">x component</text>
    <text x="112" y="357" text-anchor="middle" class="mono" font-size="18">10</text>
    <text x="247" y="328" text-anchor="middle" class="heading" font-size="15">y component</text>
    <text x="247" y="357" text-anchor="middle" class="mono" font-size="18">20</text>
    <text x="180" y="401" text-anchor="middle" class="muted" font-size="14">Both values exist in the record.</text>
  </g>

  <!-- First arrow joins its head cleanly and stops before the record-pattern panel. -->
  <path d="M340 280H361" fill="none" stroke="#744b91" stroke-width="4"/>
  <polygon points="360,269 390,280 360,291" fill="#744b91"/>

  <!-- Step 2: parallel rows contrast binding x with ignoring the second component. -->
  <g id="record-pattern">
    <rect x="400" y="120" width="400" height="320" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <rect x="400" y="120" width="400" height="50" rx="11" fill="#744b91"/>
    <rect x="400" y="159" width="400" height="11" fill="#744b91"/>
    <text x="425" y="153" class="light" font-size="20">2 · Apply a record pattern</text>
    <rect x="435" y="195" width="330" height="52" rx="8" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
    <text x="600" y="227" text-anchor="middle" class="mono" font-size="18">Point(int x, _)</text>

    <rect x="435" y="272" width="330" height="62" rx="8" fill="#edf8f0" stroke="#34834b" stroke-width="1.5"/>
    <text x="460" y="298" class="mono" font-size="16">10 + int x</text>
    <text x="625" y="298" class="heading" font-size="15">BIND</text>
    <text x="460" y="321" class="body" font-size="14">Create the usable variable x.</text>

    <rect x="435" y="350" width="330" height="62" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="460" y="376" class="mono" font-size="16">20 + _</text>
    <text x="625" y="376" class="heading" font-size="15">IGNORE</text>
    <text x="460" y="399" class="body" font-size="14">Match the slot, but bind no name.</text>
  </g>

  <!-- Second arrow points to scope; the head remains outside the result panel. -->
  <path d="M810 280H831" fill="none" stroke="#34834b" stroke-width="4"/>
  <polygon points="830,269 860,280 830,291" fill="#34834b"/>

  <!-- Step 3: scope contains x only; the orange notice explicitly denies a hidden underscore variable. -->
  <g id="resulting-scope">
    <rect x="870" y="140" width="300" height="280" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <rect x="870" y="140" width="300" height="50" rx="11" fill="#34834b"/>
    <rect x="870" y="179" width="300" height="11" fill="#34834b"/>
    <text x="895" y="173" class="light" font-size="20">3 · Inside the match</text>
    <rect x="900" y="220" width="240" height="58" rx="8" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
    <text x="1020" y="256" text-anchor="middle" class="mono" font-size="18">x = 10</text>
    <rect x="900" y="302" width="240" height="68" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="1020" y="330" text-anchor="middle" class="heading" font-size="16">No variable named _</text>
    <text x="1020" y="354" text-anchor="middle" class="body" font-size="14">The value 20 cannot be read.</text>
    <text x="1020" y="400" text-anchor="middle" class="muted" font-size="14">Only x enters scope.</text>
  </g>

  <!-- Bottom panels summarize the two feature forms and their most important constraints. -->
  <g id="reference-rules">
    <g id="unnamed-variable">
      <rect x="30" y="470" width="360" height="220" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
      <rect x="30" y="470" width="360" height="48" rx="11" fill="#356eb3"/>
      <rect x="30" y="507" width="360" height="11" fill="#356eb3"/>
      <text x="55" y="502" class="light" font-size="20">Unnamed variable</text>
      <rect x="60" y="542" width="300" height="46" rx="7" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
      <text x="210" y="570" text-anchor="middle" class="mono" font-size="14">for (Object _ : values)</text>
      <text x="60" y="622" class="body" font-size="15">Allowed for locals, loops, resources,</text>
      <text x="60" y="647" class="body" font-size="15">catch parameters, and lambda parameters.</text>
      <text x="210" y="675" text-anchor="middle" class="muted" font-size="14">The declaration runs; the name is absent.</text>
    </g>

    <g id="unnamed-pattern">
      <rect x="420" y="470" width="360" height="220" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
      <rect x="420" y="470" width="360" height="48" rx="11" fill="#744b91"/>
      <rect x="420" y="507" width="360" height="11" fill="#744b91"/>
      <text x="445" y="502" class="light" font-size="20">Unnamed pattern</text>
      <rect x="450" y="540" width="300" height="65" rx="7" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
      <text x="600" y="566" text-anchor="middle" class="mono" font-size="14">Point(int x, _)</text>
      <text x="600" y="590" text-anchor="middle" class="mono" font-size="14">String _</text>
      <text x="600" y="635" text-anchor="middle" class="body" font-size="15">_ ignores a component entirely.</text>
      <text x="600" y="660" text-anchor="middle" class="body" font-size="15">Type _ tests a type without a name.</text>
  </g>

    <g id="restrictions">
      <rect x="810" y="470" width="360" height="220" rx="11" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
      <rect x="810" y="470" width="360" height="48" rx="11" fill="#b7791f"/>
      <rect x="810" y="507" width="360" height="11" fill="#b7791f"/>
      <text x="835" y="502" class="light" font-size="20">Rules to remember</text>
      <text x="840" y="554" class="heading" font-size="15">Cannot read or assign _</text>
      <text x="840" y="584" class="body" font-size="15">Multiple _ declarations may coexist.</text>
      <text x="840" y="614" class="body" font-size="15">Not allowed for fields or method</text>
      <text x="840" y="638" class="body" font-size="15">and constructor parameters.</text>
      <text x="840" y="672" class="mono" font-size="14">_value  →  ordinary identifier</text>
    </g>
  </g>
</svg>
