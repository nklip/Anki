<svg xmlns="http://www.w3.org/2000/svg" width="1359" height="76" viewBox="0 0 1359 76" role="img" aria-labelledby="title desc">
<title id="title">A linked list visits nodes one by one</title>
<desc id="desc">Read from the left sentinel through a1 to an. Dots are link origins, arrows point to the next node, and NULL marks the end. The dots in the gap omit intermediate nodes.</desc>
<!-- Source-native recreation; the original canvas, labels, colors, and ellipsis gap are retained. -->
<rect width="1359" height="76" fill="#fff"/>
