<svg xmlns="http://www.w3.org/2000/svg" width="1359" height="151" viewBox="0 0 1359 151" role="img" aria-labelledby="title desc">
<title id="title">Adding a shortcut layer skips intermediate nodes</title>
<desc id="desc">The lower row visits every key. The upper row links every other key as an illustration of shortcuts. A real skip list selects index levels probabilistically. NULL marks the end.</desc>
