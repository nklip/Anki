    <path class="arrowhead" d="M552 213 L546 220 L558 220 Z M552 241 L546 234 L558 234 Z"/>
  </g>
  <g id="association-25-levels-3-2">
    <path class="connector" d="M931 79 V95"/>
    <path class="arrowhead" d="M931 73 L925 80 L937 80 Z M931 101 L925 94 L937 94 Z"/>
  </g>
  <g id="association-25-levels-2-1">
    <path class="connector" d="M931 149 V165"/>
    <path class="arrowhead" d="M931 143 L925 150 L937 150 Z M931 171 L925 164 L937 164 Z"/>
  </g>
  <g id="association-25-levels-1-0">
    <path class="connector" d="M931 219 V235"/>
    <path class="arrowhead" d="M931 213 L925 220 L937 220 Z M931 241 L925 234 L937 234 Z"/>
  </g>
</svg>
