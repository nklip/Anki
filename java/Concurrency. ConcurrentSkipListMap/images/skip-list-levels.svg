      <circle cx="1001" cy="262" r="3.2" fill="#000"/>
    </g>
    <!-- Shafts cross only pointer fields. Each head tip meets the target stroke; the shaft ends inside its head base. -->
    <path id="pointer-to-1-level-0" class="connector" d="M78 262 H126"/>
    <path class="arrowhead" d="M137 262 L125 256 L125 268 Z"/>
    <path id="pointer-to-8-level-0" class="connector" d="M250 262 H313"/>
    <path class="arrowhead" d="M324 262 L312 256 L312 268 Z"/>
    <path id="pointer-to-12-level-0" class="connector" d="M437 262 H498"/>
    <path class="arrowhead" d="M509 262 L497 256 L497 268 Z"/>
    <path id="pointer-to-15-level-0" class="connector" d="M622 262 H680"/>
    <path class="arrowhead" d="M691 262 L679 256 L679 268 Z"/>
    <path id="pointer-to-25-level-0" class="connector" d="M804 262 H877"/>
    <path class="arrowhead" d="M888 262 L876 256 L876 268 Z"/>
  </g>
  <!-- Vertical associations are centered in the key field, with a fixed x for every copy of that key. Heads stop at the outer borders. -->
  <g id="association-1-levels-1-0">
    <path class="connector" d="M180 219 V235"/>
    <path class="arrowhead" d="M180 213 L174 220 L186 220 Z M180 241 L174 234 L186 234 Z"/>
  </g>
  <g id="association-12-levels-2-1">
    <path class="connector" d="M552 149 V165"/>
    <path class="arrowhead" d="M552 143 L546 150 L558 150 Z M552 171 L546 164 L558 164 Z"/>
  </g>
  <g id="association-12-levels-1-0">
