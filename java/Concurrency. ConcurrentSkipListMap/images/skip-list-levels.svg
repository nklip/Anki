<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="305" viewBox="0 0 1048 305" role="img" aria-labelledby="title desc">
  <title id="title">Skip-list levels: long jumps above, all keys below</title>
  <desc id="desc">L0 is the sorted base list, with keys 1, 8, 12, 15, 25. L1, L2 and L3 contain progressively fewer index nodes. Start at the upper-left head, move right without passing the target, then descend. Vertical arrows associate levels; they are not literal bidirectional OpenJDK links.</desc>
  <!-- Source diagram adapted to an exact grid: rows are 70 units apart, and each repeated key has one fixed column. -->
  <!-- Shared editable typography and connector palette. -->
  <defs>
    <style>
      .box { fill: none; stroke: #000; stroke-width: 2; }
      .key { fill: #000; font-family: Times New Roman, serif; font-size: 20px; text-anchor: middle; }
      .level { fill: #000; font-family: Arial, Helvetica, sans-serif; font-size: 24px; text-anchor: middle; }
      .connector { fill: none; stroke: #4472c4; stroke-width: 1; }
      .arrowhead { fill: #4472c4; }
    </style>
  </defs>
  <rect width="1048" height="305" fill="#fff"/>
  <!-- L3: box borders, pointer origins, arrow shafts and labels share one row. -->
  <g id="level-3">
    <rect class="box" x="50" y="32" width="56" height="40"/>
    <text class="level" x="21" y="60">L3</text>
    <circle cx="78" cy="52" r="3.2" fill="#000"/>
    <g id="key-25-level-3">
      <rect class="box" x="889" y="32" width="140" height="40"/>
      <path class="box" d="M973 32 V72"/>
      <text class="key" x="931" y="59">25</text>
      <circle cx="1001" cy="52" r="3.2" fill="#000"/>
    </g>
    <!-- Shafts cross only pointer fields. Each head tip meets the target stroke; the shaft ends inside its head base. -->
    <path id="pointer-to-25-level-3" class="connector" d="M78 52 H877"/>
    <path class="arrowhead" d="M888 52 L876 46 L876 58 Z"/>
  </g>
  <!-- L2: box borders, pointer origins, arrow shafts and labels share one row. -->
  <g id="level-2">
    <rect class="box" x="50" y="102" width="56" height="40"/>
    <text class="level" x="21" y="130">L2</text>
    <circle cx="78" cy="122" r="3.2" fill="#000"/>
    <g id="key-12-level-2">
      <rect class="box" x="510" y="102" width="140" height="40"/>
      <path class="box" d="M594 102 V142"/>
      <text class="key" x="552" y="129">12</text>
      <circle cx="622" cy="122" r="3.2" fill="#000"/>
    </g>
    <g id="key-25-level-2">
      <rect class="box" x="889" y="102" width="140" height="40"/>
      <path class="box" d="M973 102 V142"/>
      <text class="key" x="931" y="129">25</text>
      <circle cx="1001" cy="122" r="3.2" fill="#000"/>
    </g>
    <!-- Shafts cross only pointer fields. Each head tip meets the target stroke; the shaft ends inside its head base. -->
    <path id="pointer-to-12-level-2" class="connector" d="M78 122 H498"/>
    <path class="arrowhead" d="M509 122 L497 116 L497 128 Z"/>
    <path id="pointer-to-25-level-2" class="connector" d="M622 122 H877"/>
    <path class="arrowhead" d="M888 122 L876 116 L876 128 Z"/>
  </g>
  <!-- L1: box borders, pointer origins, arrow shafts and labels share one row. -->
  <g id="level-1">
    <rect class="box" x="50" y="172" width="56" height="40"/>
    <text class="level" x="21" y="200">L1</text>
    <circle cx="78" cy="192" r="3.2" fill="#000"/>
    <g id="key-1-level-1">
      <rect class="box" x="138" y="172" width="140" height="40"/>
      <path class="box" d="M222 172 V212"/>
      <text class="key" x="180" y="199">1</text>
      <circle cx="250" cy="192" r="3.2" fill="#000"/>
    </g>
    <g id="key-12-level-1">
      <rect class="box" x="510" y="172" width="140" height="40"/>
      <path class="box" d="M594 172 V212"/>
      <text class="key" x="552" y="199">12</text>
