      <text class="key" x="931" y="199">25</text>
      <circle cx="1001" cy="192" r="3.2" fill="#000"/>
    </g>
    <!-- Shafts cross only pointer fields. Each head tip meets the target stroke; the shaft ends inside its head base. -->
    <path id="pointer-to-1-level-1" class="connector" d="M78 192 H126"/>
    <path class="arrowhead" d="M137 192 L125 186 L125 198 Z"/>
    <path id="pointer-to-12-level-1" class="connector" d="M250 192 H498"/>
    <path class="arrowhead" d="M509 192 L497 186 L497 198 Z"/>
    <path id="pointer-to-25-level-1" class="connector" d="M622 192 H877"/>
    <path class="arrowhead" d="M888 192 L876 186 L876 198 Z"/>
  </g>
  <!-- L0: box borders, pointer origins, arrow shafts and labels share one row. -->
