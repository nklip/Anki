<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">The mental model for pattern matching in Java</title>
  <desc id="description">A beginner diagram showing a value tested against a pattern, the success path where pattern variables are initialized and in scope, the failure path where they do not exist, and the differences between type patterns, record patterns, and guarded switch cases.</desc>

  <!-- Shared styles; blue is the target value, purple is the pattern, green is a successful match, red is failure, and orange marks the scope rule. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and the lesson statement; the badge summarizes the final-release milestones. -->
  <rect id="background" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Pattern matching = test + conditional extraction</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">A pattern variable exists only on a control-flow path where the pattern definitely matched</text>
  <rect x="1000" y="22" width="170" height="42" rx="21" fill="#dcefe1" stroke="#34834b" stroke-width="2"/>
  <text x="1085" y="49" text-anchor="middle" class="heading" font-size="14">FINAL · JDK 16 / 21</text>

  <!-- Input value panel: the declared type is broad, while the runtime value may have a more specific structure. -->
  <g id="target-value">
    <rect x="30" y="105" width="270" height="235" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <rect x="30" y="105" width="270" height="48" rx="11" fill="#356eb3"/>
    <rect x="30" y="142" width="270" height="11" fill="#356eb3"/>
    <text x="55" y="137" class="light" font-size="20">1 · Target value</text>
    <text x="165" y="197" text-anchor="middle" class="mono" font-size="18">Object value</text>
    <rect x="65" y="222" width="200" height="58" rx="8" fill="#ffffff" stroke="#356eb3" stroke-width="2"/>
    <text x="165" y="258" text-anchor="middle" class="mono" font-size="18">"hello"</text>
    <text x="165" y="315" text-anchor="middle" class="muted" font-size="14">What structure does it have?</text>
  </g>

  <!-- First connector: the head stops before the pattern border and stays clear of every label. -->
  <path d="M310 222H366" fill="none" stroke="#744b91" stroke-width="4"/>
  <polygon points="366,212 383,222 366,232" fill="#744b91"/>

  <!-- Pattern panel separates the predicate from the conditional variable binding. -->
  <g id="pattern-test">
    <rect x="390" y="105" width="340" height="235" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <rect x="390" y="105" width="340" height="48" rx="11" fill="#744b91"/>
    <rect x="390" y="142" width="340" height="11" fill="#744b91"/>
    <text x="415" y="137" class="light" font-size="20">2 · Apply a pattern</text>
    <rect x="420" y="178" width="280" height="51" rx="7" fill="#ffffff" stroke="#744b91" stroke-width="2"/>
    <text x="560" y="210" text-anchor="middle" class="mono" font-size="15">value instanceof String text</text>
    <text x="425" y="266" class="heading" font-size="16">Test</text>
    <text x="495" y="266" class="body" font-size="16">Is the value a String?</text>
    <text x="425" y="303" class="heading" font-size="16">Extract</text>
    <text x="505" y="303" class="body" font-size="16">Bind that String to text</text>
    <text x="560" y="327" text-anchor="middle" class="muted" font-size="13">Extraction happens only after success</text>
  </g>

  <!-- Branch shafts curve through an empty routing corridor; both heads stop before their result boxes. -->
  <path d="M740 190C785 190 792 160 826 160" fill="none" stroke="#34834b" stroke-width="4"/>
  <polygon points="826,150 843,160 826,170" fill="#34834b"/>
  <path d="M740 255C785 255 792 285 826 285" fill="none" stroke="#b33a3a" stroke-width="4"/>
  <polygon points="826,275 843,285 826,295" fill="#b33a3a"/>

  <!-- Match results: success and failure use text labels as well as color. -->
  <g id="match-results">
    <rect x="850" y="105" width="320" height="108" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <text x="875" y="140" class="heading" font-size="19">MATCH</text>
    <text x="875" y="170" class="body" font-size="15">text is initialized with "hello"</text>
    <text x="875" y="197" class="body" font-size="15">and is now in scope</text>

    <rect x="850" y="232" width="320" height="108" rx="11" fill="#fceeed" stroke="#b33a3a" stroke-width="2"/>
    <text x="875" y="267" class="heading" font-size="19">NO MATCH</text>
    <text x="875" y="297" class="body" font-size="15">no extraction occurs</text>
    <text x="875" y="324" class="body" font-size="15">text is not in scope</text>
  </g>

  <!-- Three pattern forms use parallel panels so a new learner can compare what each form extracts. -->
  <g id="pattern-forms">
    <g id="type-pattern">
      <rect x="30" y="370" width="360" height="215" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
      <rect x="30" y="370" width="360" height="46" rx="11" fill="#356eb3"/>
      <rect x="30" y="405" width="360" height="11" fill="#356eb3"/>
      <text x="55" y="401" class="light" font-size="20">Type pattern</text>
      <rect x="60" y="442" width="300" height="48" rx="7" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
      <text x="210" y="472" text-anchor="middle" class="mono" font-size="17">String text</text>
      <text x="210" y="527" text-anchor="middle" class="body" font-size="15">Tests the runtime type</text>
      <text x="210" y="554" text-anchor="middle" class="body" font-size="15">and binds the whole value</text>
    </g>

    <g id="record-pattern">
      <rect x="420" y="370" width="360" height="215" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
      <rect x="420" y="370" width="360" height="46" rx="11" fill="#744b91"/>
      <rect x="420" y="405" width="360" height="11" fill="#744b91"/>
      <text x="445" y="401" class="light" font-size="20">Record pattern</text>
      <rect x="450" y="442" width="300" height="48" rx="7" fill="#ffffff" stroke="#744b91" stroke-width="1.5"/>
      <text x="600" y="472" text-anchor="middle" class="mono" font-size="16">Point(int x, int y)</text>
      <text x="600" y="527" text-anchor="middle" class="body" font-size="15">Tests the record type</text>
      <text x="600" y="554" text-anchor="middle" class="body" font-size="15">and extracts its components</text>
    </g>

    <g id="guarded-switch-pattern">
      <rect x="810" y="370" width="360" height="215" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
      <rect x="810" y="370" width="360" height="46" rx="11" fill="#34834b"/>
      <rect x="810" y="405" width="360" height="11" fill="#34834b"/>
      <text x="835" y="401" class="light" font-size="20">Guarded switch case</text>
      <rect x="840" y="442" width="300" height="48" rx="7" fill="#ffffff" stroke="#34834b" stroke-width="1.5"/>
      <text x="990" y="471" text-anchor="middle" class="mono" font-size="13">case String text when ...</text>
      <text x="990" y="527" text-anchor="middle" class="body" font-size="15">Matches the pattern first;</text>
      <text x="990" y="554" text-anchor="middle" class="body" font-size="15">when adds another condition</text>
    </g>
  </g>

  <!-- Flow-scope footer; keep code and explanation within this safe area when editing. -->
  <g id="flow-scope-rule">
    <rect x="30" y="615" width="1140" height="75" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="55" y="647" class="heading" font-size="18">Flow-sensitive scope</text>
    <text x="250" y="647" class="mono" font-size="15">value instanceof String text &amp;&amp; !text.isBlank()</text>
    <text x="600" y="676" text-anchor="middle" class="body" font-size="15">text is usable on the right of &amp;&amp; and in the true branch because the match is known to have succeeded</text>
  </g>
</svg>
