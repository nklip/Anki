<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Flexible constructor bodies in Java 25</title>
  <desc id="description">A beginner diagram dividing a constructor into a prologue, an explicit super or this invocation, and an epilogue, with examples of operations allowed and forbidden before superclass initialization.</desc>

  <!-- Shared styles; orange marks early construction, purple the constructor boundary, green normal instance use, and red prohibited access. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and lesson title; badge records the lifecycle fact without consuming the main flow. -->
  <rect id="background" width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="30">Flexible constructor bodies</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">Statements may precede super(...) or this(...), but the new object is not ready for ordinary use</text>
  <rect x="1000" y="22" width="170" height="42" rx="21" fill="#dcefe1" stroke="#34834b" stroke-width="2"/>
  <text x="1085" y="49" text-anchor="middle" class="heading" font-size="15">FINAL · JDK 25</text>

  <!-- Three-phase constructor flow; manual arrowheads stop before each destination border. -->
  <g id="constructor-phases">
    <rect x="30" y="105" width="1140" height="245" rx="11" fill="#f7f9fb" stroke="#64717c" stroke-width="2"/>
    <text x="55" y="139" class="heading" font-size="20">Read the constructor from left to right</text>

    <g id="prologue-phase">
      <rect x="55" y="165" width="330" height="155" rx="9" fill="#fff8e6" stroke="#b7791f" stroke-width="3"/>
      <text x="220" y="199" text-anchor="middle" class="heading" font-size="20">1 · Prologue</text>
      <text x="220" y="228" text-anchor="middle" class="muted" font-size="14">early construction context</text>
      <text x="80" y="260" class="body" font-size="15">validate parameters · compute locals</text>
      <text x="80" y="289" class="body" font-size="15">assign fields declared by this class</text>
    </g>

    <path d="M395 243H432" fill="none" stroke="#744b91" stroke-width="4"/>
    <polygon points="432,233 449,243 432,253" fill="#744b91"/>

    <g id="constructor-invocation-phase">
      <rect x="460" y="178" width="275" height="129" rx="9" fill="#f1e7f7" stroke="#744b91" stroke-width="3"/>
      <text x="597" y="211" text-anchor="middle" class="heading" font-size="18">2 · Constructor invocation</text>
      <rect x="480" y="232" width="235" height="43" rx="6" fill="#ffffff" stroke="#744b91" stroke-width="2"/>
      <text x="597" y="259" text-anchor="middle" class="mono" font-size="15">super(...) / this(...)</text>
      <text x="597" y="294" text-anchor="middle" class="muted" font-size="13">initialization boundary</text>
    </g>

    <path d="M745 243H782" fill="none" stroke="#34834b" stroke-width="4"/>
    <polygon points="782,233 799,243 782,253" fill="#34834b"/>

    <g id="epilogue-phase">
      <rect x="810" y="165" width="335" height="155" rx="9" fill="#edf8f0" stroke="#34834b" stroke-width="3"/>
      <text x="977" y="199" text-anchor="middle" class="heading" font-size="20">3 · Epilogue</text>
      <text x="977" y="228" text-anchor="middle" class="muted" font-size="14">normal constructor context</text>
      <text x="835" y="260" class="body" font-size="15">read initialized superclass state</text>
      <text x="835" y="289" class="body" font-size="15">use instance fields and methods normally</text>
    </g>
  </g>

  <!-- Early-context decision guide keeps legal and illegal operations adjacent for quick comparison. -->
  <g id="early-context-rules">
    <g id="allowed-before-invocation">
      <rect x="30" y="380" width="555" height="275" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
      <rect x="30" y="380" width="555" height="48" rx="11" fill="#34834b"/>
      <rect x="30" y="417" width="555" height="11" fill="#34834b"/>
      <text x="55" y="412" class="light" font-size="20">Allowed before super(...) / this(...)</text>

      <text x="60" y="469" class="mono" font-size="15">if (age &lt; 18) throw ...;</text>
      <text x="60" y="507" class="mono" font-size="15">String name = raw.strip();</text>
      <text x="60" y="545" class="mono" font-size="15">this.badge = badge;</text>
      <text x="60" y="586" class="body" font-size="15">Uses parameters, locals, static state, or a direct</text>
      <text x="60" y="611" class="body" font-size="15">assignment to a field declared by this class.</text>
      <text x="60" y="638" class="muted" font-size="13">It may fail fast before superclass construction begins.</text>
    </g>

    <g id="forbidden-before-invocation">
      <rect x="615" y="380" width="555" height="275" rx="11" fill="#fceeed" stroke="#b33a3a" stroke-width="2"/>
      <rect x="615" y="380" width="555" height="48" rx="11" fill="#b33a3a"/>
      <rect x="615" y="417" width="555" height="11" fill="#b33a3a"/>
      <text x="640" y="412" class="light" font-size="20">Forbidden: ordinary use of the new object</text>

      <text x="645" y="469" class="mono" font-size="15">validateState();</text>
      <text x="645" y="507" class="mono" font-size="15">int old = this.badge.length();</text>
      <text x="645" y="545" class="mono" font-size="15">register(this);</text>
      <text x="645" y="586" class="body" font-size="15">No instance-method calls, field reads, inherited</text>
      <text x="645" y="611" class="body" font-size="15">instance access, or exposure of this.</text>
      <text x="645" y="638" class="muted" font-size="13">The compiler rejects unsafe early access.</text>
    </g>
  </g>
</svg>
