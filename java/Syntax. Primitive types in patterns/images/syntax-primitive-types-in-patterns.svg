<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">How primitive type patterns use exact conversions</title>
  <desc id="description">A beginner diagram comparing the integer values 100 and 1000 against a byte pattern. The exact conversion of 100 matches and binds a byte variable, while the inexact conversion of 1000 does not match. Supporting panels show primitive instanceof and long switch syntax in the JDK 26 fourth preview.</desc>

  <!-- Shared styles; blue is the source value, purple is the conversion test, green is an exact match, red is an inexact conversion, and orange marks preview status. -->
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #202124; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #303840; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5f6872; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; fill: #303840; }
      .light { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background and lesson statement; badge makes the non-final lifecycle visible immediately. -->
  <rect id="background" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="heading" font-size="29">Primitive patterns prevent lossy conversions</text>
  <text x="600" y="73" text-anchor="middle" class="muted" font-size="18">The target type and the actual value determine whether a primitive pattern matches</text>
  <rect x="980" y="22" width="190" height="42" rx="21" fill="#fff1d5" stroke="#b7791f" stroke-width="2"/>
  <text x="1075" y="49" text-anchor="middle" class="heading" font-size="14">4TH PREVIEW · JDK 26</text>

  <!-- Exact-conversion row: 100 remains 100 as a byte, so the pattern variable is initialized. -->
  <g id="exact-conversion-example">
    <rect x="30" y="110" width="330" height="125" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <text x="55" y="145" class="heading" font-size="17">SOURCE VALUE</text>
    <text x="195" y="184" text-anchor="middle" class="mono" font-size="19">int value = 100</text>
    <text x="195" y="216" text-anchor="middle" class="muted" font-size="14">100 fits in byte: −128 … 127</text>

    <!-- Arrowhead stops before the pattern box. -->
    <path d="M370 173H406" fill="none" stroke="#744b91" stroke-width="4"/>
    <polygon points="406,163 423,173 406,183" fill="#744b91"/>

    <rect x="430" y="110" width="350" height="125" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <text x="455" y="145" class="heading" font-size="17">PRIMITIVE PATTERN</text>
    <text x="605" y="184" text-anchor="middle" class="mono" font-size="17">value instanceof byte small</text>
    <text x="605" y="216" text-anchor="middle" class="body" font-size="14">int → byte conversion is exact</text>

    <!-- Arrowhead stops before the successful result box. -->
    <path d="M790 173H846" fill="none" stroke="#34834b" stroke-width="4"/>
    <polygon points="846,163 863,173 846,183" fill="#34834b"/>

    <rect x="870" y="110" width="300" height="125" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
    <text x="895" y="145" class="heading" font-size="18">MATCH</text>
    <text x="1020" y="184" text-anchor="middle" class="mono" font-size="18">small = 100</text>
    <text x="1020" y="216" text-anchor="middle" class="body" font-size="14">safe byte value is bound</text>
  </g>

  <!-- Inexact-conversion row: 1000 would become -24 as a byte, so no result is exposed or bound. -->
  <g id="inexact-conversion-example">
    <rect x="30" y="260" width="330" height="125" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
    <text x="55" y="295" class="heading" font-size="17">SOURCE VALUE</text>
    <text x="195" y="334" text-anchor="middle" class="mono" font-size="19">int value = 1_000</text>
    <text x="195" y="366" text-anchor="middle" class="muted" font-size="14">1,000 is outside the byte range</text>

    <!-- Arrowhead stops before the second pattern box. -->
    <path d="M370 323H406" fill="none" stroke="#744b91" stroke-width="4"/>
    <polygon points="406,313 423,323 406,333" fill="#744b91"/>

    <rect x="430" y="260" width="350" height="125" rx="11" fill="#faf8fc" stroke="#744b91" stroke-width="2"/>
    <text x="455" y="295" class="heading" font-size="17">PRIMITIVE PATTERN</text>
    <text x="605" y="334" text-anchor="middle" class="mono" font-size="17">value instanceof byte small</text>
    <text x="605" y="366" text-anchor="middle" class="body" font-size="14">conversion would lose information</text>

    <!-- Red arrowhead stops before the failed result box. -->
    <path d="M790 323H846" fill="none" stroke="#b33a3a" stroke-width="4"/>
    <polygon points="846,313 863,323 846,333" fill="#b33a3a"/>

    <rect x="870" y="260" width="300" height="125" rx="11" fill="#fceeed" stroke="#b33a3a" stroke-width="2"/>
    <text x="895" y="295" class="heading" font-size="18">NO MATCH</text>
    <text x="1020" y="334" text-anchor="middle" class="mono" font-size="18">no small variable</text>
    <text x="1020" y="366" text-anchor="middle" class="body" font-size="14">the lossy result is discarded</text>
  </g>

  <!-- Two preview capabilities: safe conditional conversion and switches over every primitive selector type. -->
  <g id="preview-capabilities">
    <g id="primitive-instanceof">
      <rect x="30" y="415" width="555" height="190" rx="11" fill="#eef5ff" stroke="#356eb3" stroke-width="2"/>
      <rect x="30" y="415" width="555" height="46" rx="11" fill="#356eb3"/>
      <rect x="30" y="450" width="555" height="11" fill="#356eb3"/>
      <text x="55" y="446" class="light" font-size="20">Primitive instanceof pattern</text>
      <rect x="60" y="486" width="495" height="48" rx="7" fill="#ffffff" stroke="#356eb3" stroke-width="1.5"/>
      <text x="307" y="516" text-anchor="middle" class="mono" font-size="16">if (value instanceof byte small) { ... }</text>
      <text x="307" y="567" text-anchor="middle" class="body" font-size="15">test exactness → convert safely → bind small</text>
      <text x="307" y="591" text-anchor="middle" class="muted" font-size="13">No explicit cast and no truncated value</text>
    </g>

    <g id="primitive-switch">
      <rect x="615" y="415" width="555" height="190" rx="11" fill="#edf8f0" stroke="#34834b" stroke-width="2"/>
      <rect x="615" y="415" width="555" height="46" rx="11" fill="#34834b"/>
      <rect x="615" y="450" width="555" height="11" fill="#34834b"/>
      <text x="640" y="446" class="light" font-size="20">switch over every primitive type</text>
      <text x="645" y="495" class="mono" font-size="15">switch (longCode) {</text>
      <text x="675" y="525" class="mono" font-size="15">case 0L → "stopped";</text>
      <text x="675" y="555" class="mono" font-size="15">case long other → "unknown";</text>
      <text x="645" y="585" class="mono" font-size="15">}</text>
      <text x="1005" y="585" text-anchor="middle" class="muted" font-size="13">boolean · long · float · double</text>
    </g>
  </g>

  <!-- Preview commands remain in a separate footer so they cannot be mistaken for Java source. -->
  <g id="preview-tooling">
    <rect x="30" y="630" width="1140" height="62" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="55" y="660" class="heading" font-size="16">JDK 26 preview</text>
    <text x="205" y="660" class="mono" font-size="14">javac --release 26 --enable-preview Main.java</text>
    <text x="705" y="660" class="mono" font-size="14">java --enable-preview Main</text>
    <text x="600" y="683" text-anchor="middle" class="muted" font-size="12">Preview syntax is disabled by default and is not yet a permanent Java language feature.</text>
  </g>
</svg>
