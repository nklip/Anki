<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
  <title id="title">HashMap resize split</title>
  <desc id="description">During growth from capacity 8 to 16, unequal keys A and B have cached spread hashes 2 and 10. Both started in bucket 2. The mask changes from binary 0111 to 1111. The newly relevant 1000 bit is zero in A and set in B, so A stays in bucket 2 and B moves to bucket 10. Other buckets are omitted.</desc>
  <!-- Reusable text styles preserve the neighboring diagrams' palette and typography. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
      .title { font-size: 28px; font-weight: bold; }
      .heading { font-size: 19px; font-weight: bold; }
      .body { font-size: 17px; }
      .note { font-size: 16px; fill: #5f6368; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 18px; }
    </style>
  </defs>
  <!-- Background and reading order. -->
  <rect width="1200" height="740" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" class="title" >HashMap resize: one old bucket splits into two</text>
  <text x="600" y="76" text-anchor="middle" class="body" >n = capacity. Four-digit strings are binary; indices and capacities are decimal.</text>
  <!-- Old selected bucket: two nodes with unequal keys and different cached spread hashes. -->
  <rect id="old-table-example" x="40" y="108" width="1120" height="205" rx="9" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="3"/>
  <text x="65" y="141" text-anchor="start" class="heading" >1. Before growth: n = 8, so mask = n − 1 = 7 = 0111 (binary)</text>
  <rect id="old-bucket-2" x="65" y="182" width="200" height="91" rx="9" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
  <text x="165" y="220" text-anchor="middle" class="heading" >Old bucket 2</text>
  <text x="165" y="251" text-anchor="middle" class="note" >two mappings</text>
  <rect id="old-node-a" x="350" y="175" width="330" height="105" rx="9" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
  <text x="515" y="203" text-anchor="middle" class="heading" >Node A: spread hash 2</text>
  <text x="515" y="232" text-anchor="middle" class="code" >0010 &amp; 0111 = 0010</text>
  <text x="515" y="262" text-anchor="middle" class="body" >index 2</text>
  <rect id="old-node-b" x="790" y="175" width="330" height="105" rx="9" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
  <text x="955" y="203" text-anchor="middle" class="heading" >Node B: spread hash 10</text>
  <text x="955" y="232" text-anchor="middle" class="code" >1010 &amp; 0111 = 0010</text>
  <text x="955" y="262" text-anchor="middle" class="body" >index 2</text>
  <!-- List links stop at the target stroke; shaft joins are hidden under their heads. -->
  <g id="old-bucket-to-a"><line data-connector="true" x1="266.5" y1="227.5" x2="331.50" y2="227.50" stroke="#356eb3" stroke-width="4"/><polygon points="328.50,236.50 348.50,227.50 328.50,218.50" fill="#356eb3"/></g>
  <g id="old-a-to-b"><line data-connector="true" x1="681.5" y1="227.5" x2="771.50" y2="227.50" stroke="#356eb3" stroke-width="4"/><polygon points="768.50,236.50 788.50,227.50 768.50,218.50" fill="#356eb3"/></g>
  <!-- Growth exposes exactly one new mask bit; this step applies to the cached hashes. -->
  <rect id="new-mask-rule" x="220" y="348" width="760" height="91" rx="9" fill="#fff8e1" stroke="#b7791f" stroke-width="3"/>
  <text x="600" y="380" text-anchor="middle" class="heading" >2. Double capacity to 16: new mask = 15 = 1111</text>
  <text x="600" y="411" text-anchor="middle" class="body" >Newly relevant bit: 1000. Test each cached hash &amp; 1000.</text>
  <g id="old-table-to-growth"><line data-connector="true" x1="600" y1="314.5" x2="600.00" y2="331.50" stroke="#b7791f" stroke-width="4"/><polygon points="592.00,328.50 600.00,346.50 608.00,328.50" fill="#b7791f"/></g>
  <!-- The branch arrows lead to their result panels; neither head penetrates a border. -->
  <g id="stay-branch"><line data-connector="true" x1="405" y1="440.5" x2="321.08" y2="493.37" stroke="#34834b" stroke-width="5"/><polygon points="318.28,483.31 305.00,503.50 328.94,500.23" fill="#34834b"/></g>
  <g id="move-branch"><line data-connector="true" x1="795" y1="440.5" x2="878.92" y2="493.37" stroke="#7b1fa2" stroke-width="5"/><polygon points="871.06,500.23 895.00,503.50 881.72,483.31" fill="#7b1fa2"/></g>
  <rect id="new-bucket-2" x="55" y="505" width="500" height="114" rx="9" fill="#e6f4ea" stroke="#34834b" stroke-width="3"/>
  <text x="305" y="536" text-anchor="middle" class="heading" >3. Node A stays in bucket 2</text>
  <text x="305" y="571" text-anchor="middle" class="code" >0010 &amp; 1000 = 0000 → stay</text>
  <text x="305" y="602" text-anchor="middle" class="body" >New index: 0010 &amp; 1111 = 0010 = 2</text>
  <rect id="new-bucket-10" x="645" y="505" width="500" height="114" rx="9" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="3"/>
  <text x="895" y="536" text-anchor="middle" class="heading" >3. Node B moves to bucket 10</text>
  <text x="895" y="571" text-anchor="middle" class="code" >1010 &amp; 1000 = 1000 → move</text>
  <text x="895" y="602" text-anchor="middle" class="body" >New index: 1010 &amp; 1111 = 1010 = 10</text>
  <!-- Rule and scope notes make the partial-table example self-contained. -->
  <text x="600" y="651" text-anchor="middle" class="body" >&amp; (AND) keeps a 1 only where both input bits are 1. A set new bit adds the old capacity: 2 + 8 = 10.</text>
  <rect id="resize-scope-note" x="55" y="677" width="1090" height="43" rx="9" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="3"/>
  <text x="600" y="704" text-anchor="middle" class="note" >Other buckets are omitted. All higher hash bits are zero. Resize reuses hashes; no new hashCode() call.</text>
</svg>
