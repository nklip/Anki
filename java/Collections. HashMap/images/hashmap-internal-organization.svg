<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">HashMap internal organization</title>
  <desc id="description">A conceptual HashMap with capacity 64 and threshold 48 stores thirteen mappings: a null-key node in bucket 0, three linked nodes in bucket 3, and nine tree nodes in bucket 42. The red-black tree is a balanced search tree. A put into a list bin can create this tree on its ninth node when capacity is at least 64. The modCount field tracks structural changes. Tree shape is illustrative and all other buckets are empty.</desc>

  <!-- Shared tree styles preserve the neighboring diagrams' palette and typography. -->
  <defs>
    <style>
      .tree-link { stroke: #5f6368; stroke-width: 4; stroke-linecap: round; }
      .tree-black { fill: #3c4043; stroke: #202124; stroke-width: 2; }
      .tree-red { fill: #d93025; stroke: #8f1d18; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background and title -->
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#202124">HashMap internal organization</text>

  <!-- Conceptual HashMap object -->
  <rect id="hashmap-object" x="35" y="112" width="235" height="328" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
  <rect x="35" y="112" width="235" height="54" rx="10" fill="#356eb3"/>
  <rect x="35" y="154" width="235" height="12" fill="#356eb3"/>
  <text x="152.5" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">HashMap&lt;K,V&gt;</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#202124">
    <text x="58" y="207">table</text>
    <text x="58" y="250">size = 13</text>
    <text x="58" y="293">threshold = 48</text>
    <text x="58" y="336">loadFactor = 0.75</text>
    <text x="58" y="379">modCount</text>
    <text x="58" y="404" font-size="15">tracks structural changes:</text>
    <text x="58" y="424" font-size="15">adding/removing mappings</text>
  </g>
  <circle cx="225" cy="201" r="6" fill="#356eb3"/>

  <!-- The table reference crosses the object border intentionally; its shaft ends under its head. -->
  <line id="object-table-arrow-shaft" data-connector="true" x1="231" y1="201" x2="319" y2="201" stroke="#356eb3" stroke-width="5" stroke-linecap="round"/>
  <polygon points="315,190 339,201 315,212" fill="#356eb3"/>

  <!-- Power-of-two bucket array -->
  <text x="405" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">Node[] table — capacity 64</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124" text-anchor="middle">
    <rect x="340" y="102" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="136">bucket 0</text>
    <rect x="340" y="156" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="190">bucket 3</text>
    <rect x="340" y="210" width="130" height="42" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="405" y="237">⋮</text>
    <rect x="340" y="252" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="286">bucket 17</text>
    <rect x="340" y="306" width="130" height="42" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="405" y="333">⋮</text>
    <rect x="340" y="348" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="382">bucket 42</text>
    <rect x="340" y="402" width="130" height="42" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="405" y="429">⋮</text>
    <rect x="340" y="444" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="478">bucket 63</text>
  </g>

  <!-- Bucket 0: the null key has spread hash 0 -->
  <line id="null-node-arrow-shaft" data-connector="true" x1="471" y1="129" x2="508" y2="129" stroke="#34834b" stroke-width="4"/>
  <polygon points="504,120 526,129 504,138" fill="#34834b"/>
  <rect x="527" y="91" width="210" height="76" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="2"/>
  <text x="632" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Node</text>
  <text x="632" y="138" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash=0 | key=null</text>
  <text x="632" y="157" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">value | next=null</text>
  <text x="755" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">one null key allowed</text>

  <!-- Bucket 3: collision chain -->
  <!-- Route bucket 3 to the first node's center; stay below the null-key node. -->
  <path id="list-bin-arrow-shaft" data-connector="true" d="M471 183 H491 V219 H508" fill="none" stroke="#356eb3" stroke-width="4"/>
  <polygon points="504,210 526,219 504,228" fill="#356eb3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="527" y="177" width="185" height="83" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="619.5" y="204" font-size="17" font-weight="bold" fill="#202124">Node A</text>
    <text x="619.5" y="231" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash | key | value</text>
    <text x="619.5" y="250" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">next →</text>
    <rect x="755" y="177" width="185" height="83" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="847.5" y="204" font-size="17" font-weight="bold" fill="#202124">Node B</text>
    <text x="847.5" y="231" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash | key | value</text>
    <text x="847.5" y="250" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">next →</text>
    <rect x="983" y="177" width="180" height="83" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="1073" y="204" font-size="17" font-weight="bold" fill="#202124">Node C</text>
    <text x="1073" y="231" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash | key | value</text>
    <text x="1073" y="250" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">next = null</text>
  </g>
  <line id="list-a-b-arrow-shaft" data-connector="true" x1="713" y1="219" x2="736" y2="219" stroke="#356eb3" stroke-width="4"/>
  <polygon points="732,210 754,219 732,228" fill="#356eb3"/>
  <line id="list-b-c-arrow-shaft" data-connector="true" x1="941" y1="219" x2="964" y2="219" stroke="#356eb3" stroke-width="4"/>
  <polygon points="960,210 982,219 960,228" fill="#356eb3"/>
  <text x="845" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">Different keys selected the same bucket, so nodes are linked</text>

  <!-- Empty buckets -->
  <text x="504" y="285" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9aa0a6">empty</text>
  <text x="504" y="480" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9aa0a6">empty</text>

  <!-- Bucket 42 points directly to the root. The shaft stops under the head, whose tip meets the root boundary. -->
  <text x="548" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#202124">Tree bin: a balanced search tree (red-black tree)</text>
  <text x="548" y="352" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">For put: a list bin treeifies on node 9 when capacity ≥ 64.</text>
  <path id="bucket-42-root-arrow-shaft" data-connector="true" d="M471 375 H536 V392 H724" fill="none" stroke="#b3261e" stroke-width="4"/>
  <polygon id="bucket-42-root-arrowhead" points="720,382 744,392 720,402" fill="#b3261e"/>

  <!-- A valid illustrative nine-node red-black tree: insertion of ordered comparable keys 1..9
       with hash 42 yields root 4, children 2/6, grandchildren 1/3/5/8, and 8's children 7/9.
       Only parent-child edges are shown; shafts stay between circle boundaries and clear of labels. -->
  <g id="tree-parent-child-links" class="tree-link">
    <line x1="747.4" y1="404.1" x2="672.6" y2="443.9"/>
    <line x1="793.8" y1="402.1" x2="896.2" y2="445.9"/>
    <line x1="631.1" y1="473.3" x2="598.9" y2="502.7"/>
    <line x1="668.9" y1="473.3" x2="701.1" y2="502.7"/>
    <line x1="901.1" y1="473.3" x2="868.9" y2="502.7"/>
    <line x1="940.0" y1="472.0" x2="980.0" y2="504.0"/>
    <line x1="984.2" y1="540.2" x2="965.8" y2="563.8"/>
    <line x1="1015.8" y1="540.2" x2="1034.2" y2="563.8"/>
  </g>
  <g id="tree-nodes">
    <circle id="tree-root" cx="770" cy="392" r="25" class="tree-black"/>
    <circle id="tree-left" cx="650" cy="456" r="25" class="tree-red"/>
    <circle id="tree-right" cx="920" cy="456" r="25" class="tree-red"/>
    <circle id="tree-left-left" cx="580" cy="520" r="25" class="tree-black"/>
    <circle id="tree-left-right" cx="720" cy="520" r="25" class="tree-black"/>
    <circle id="tree-right-left" cx="850" cy="520" r="25" class="tree-black"/>
    <circle id="tree-right-right" cx="1000" cy="520" r="25" class="tree-black"/>
    <circle id="tree-right-right-left" cx="950" cy="584" r="25" class="tree-red"/>
    <circle id="tree-right-right-right" cx="1050" cy="584" r="25" class="tree-red"/>
  </g>
  <g id="tree-labels" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="770" y="398">T</text>
    <text x="650" y="462">T</text>
    <text x="920" y="462">T</text>
    <text x="580" y="526">T</text>
    <text x="720" y="526">T</text>
    <text x="850" y="526">T</text>
    <text x="1000" y="526">T</text>
    <text x="950" y="590">T</text>
    <text x="1050" y="590">T</text>
  </g>
  <!-- Short legend defines the abbreviation and clarifies which links are omitted. -->
  <g id="tree-legend" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">
    <text x="980" y="395">T = one TreeNode</text>
    <text x="980" y="422">Red/black = node colors</text>
    <text x="980" y="449">Also linked for iteration</text>
    <text x="548" y="582">Tree shape is illustrative.</text>
    <text x="548" y="608">Traversal links are omitted.</text>
  </g>

  <!-- Count and terminology notes keep the conceptual snapshot self-contained. -->
  <rect id="structure-notes" x="35" y="636" width="1130" height="94" rx="9" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
  <text x="55" y="666" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Conceptual current-OpenJDK model: 1 null-key node + 3 list nodes + 9 tree nodes = 13 mappings.</text>
  <text x="55" y="692" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">Each node caches the spread hash: the key’s hash code after high bits are mixed down (0 for null).</text>
  <text x="55" y="716" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">The table is allocated lazily. Other buckets are empty. The resize threshold is 64 × 0.75 = 48 mappings.</text>
</svg>
