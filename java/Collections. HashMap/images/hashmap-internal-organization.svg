<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">HashMap internal organization</title>
  <desc id="description">A HashMap object points to a power-of-two Node array. A bucket can be empty, contain one node, contain a linked list, or contain a red-black tree bin after heavy collisions.</desc>

  <!-- Background and title -->
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#202124">HashMap internal organization</text>

  <!-- Conceptual HashMap object -->
  <rect x="35" y="112" width="235" height="272" rx="10" fill="#e8f0fe" stroke="#356eb3" stroke-width="3"/>
  <rect x="35" y="112" width="235" height="54" rx="10" fill="#356eb3"/>
  <rect x="35" y="154" width="235" height="12" fill="#356eb3"/>
  <text x="152.5" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">HashMap&lt;K,V&gt;</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#202124">
    <text x="58" y="207">table</text>
    <text x="58" y="250">size = 11</text>
    <text x="58" y="293">threshold = 48</text>
    <text x="58" y="336">loadFactor = 0.75</text>
    <text x="58" y="369">modCount</text>
  </g>
  <circle cx="225" cy="201" r="6" fill="#356eb3"/>

  <!-- Reference to the bucket array; the line ends underneath the arrowhead -->
  <line x1="231" y1="201" x2="325" y2="201" stroke="#356eb3" stroke-width="5" stroke-linecap="round"/>
  <polygon points="314,189 338,201 314,213" fill="#356eb3"/>

  <!-- Power-of-two bucket array -->
  <text x="405" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">Node[] table — capacity 64</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202124" text-anchor="middle">
    <rect x="340" y="102" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="136">bucket 0</text>
    <rect x="340" y="156" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="190">bucket 3</text>
    <rect x="340" y="210" width="130" height="42" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="405" y="237">⋮</text>
    <rect x="340" y="252" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="286">bucket 17</text>
    <rect x="340" y="306" width="130" height="42" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="405" y="333">⋮</text>
    <rect x="340" y="348" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="382">bucket 42</text>
    <rect x="340" y="402" width="130" height="42" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
    <text x="405" y="429">⋮</text>
    <rect x="340" y="444" width="130" height="54" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="405" y="478">bucket 63</text>
  </g>

  <!-- Bucket 0: the null key has spread hash 0 -->
  <line x1="470" y1="129" x2="516" y2="129" stroke="#34834b" stroke-width="4"/>
  <polygon points="505,119 527,129 505,139" fill="#34834b"/>
  <rect x="527" y="91" width="210" height="76" rx="7" fill="#e6f4ea" stroke="#34834b" stroke-width="2"/>
  <text x="632" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Node</text>
  <text x="632" y="138" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash=0 | key=null</text>
  <text x="632" y="157" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">value | next=null</text>
  <text x="755" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5f6368">one null key allowed</text>

  <!-- Bucket 3: collision chain -->
  <line x1="470" y1="183" x2="516" y2="183" stroke="#356eb3" stroke-width="4"/>
  <polygon points="505,173 527,183 505,193" fill="#356eb3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="527" y="177" width="185" height="83" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="619.5" y="204" font-size="17" font-weight="bold" fill="#202124">Node A</text>
    <text x="619.5" y="231" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash | key | value</text>
    <text x="619.5" y="250" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">next →</text>
    <rect x="755" y="177" width="185" height="83" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="847.5" y="204" font-size="17" font-weight="bold" fill="#202124">Node B</text>
    <text x="847.5" y="231" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash | key | value</text>
    <text x="847.5" y="250" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">next →</text>
    <rect x="983" y="177" width="180" height="83" rx="7" fill="#e8f0fe" stroke="#356eb3" stroke-width="2"/>
    <text x="1073" y="204" font-size="17" font-weight="bold" fill="#202124">Node C</text>
    <text x="1073" y="231" font-family="Menlo, Consolas, monospace" font-size="13" fill="#202124">hash | key | value</text>
    <text x="1073" y="250" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5f6368">next = null</text>
  </g>
  <line x1="712" y1="219" x2="744" y2="219" stroke="#356eb3" stroke-width="4"/>
  <polygon points="733,209 755,219 733,229" fill="#356eb3"/>
  <line x1="940" y1="219" x2="972" y2="219" stroke="#356eb3" stroke-width="4"/>
  <polygon points="961,209 983,219 961,229" fill="#356eb3"/>
  <text x="845" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">Different keys selected the same bucket, so nodes are linked</text>

  <!-- Empty buckets -->
  <text x="504" y="285" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9aa0a6">empty</text>
  <text x="504" y="480" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9aa0a6">empty</text>

  <!-- Bucket 42: tree bin after severe collisions and sufficient capacity -->
  <line x1="470" y1="375" x2="537" y2="375" stroke="#b3261e" stroke-width="4"/>
  <polygon points="526,365 548,375 526,385" fill="#b3261e"/>
  <text x="548" y="343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Tree bin (capacity ≥ 64)</text>
  <line x1="760" y1="405" x2="680" y2="462" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="405" x2="840" y2="462" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="680" y1="488" x2="626" y2="536" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="680" y1="488" x2="720" y2="536" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="840" y1="488" x2="800" y2="536" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="840" y1="488" x2="894" y2="536" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <circle cx="760" cy="397" r="28" fill="#3c4043" stroke="#202124" stroke-width="2"/>
  <circle cx="680" cy="477" r="28" fill="#d93025" stroke="#8f1d18" stroke-width="2"/>
  <circle cx="840" cy="477" r="28" fill="#3c4043" stroke="#202124" stroke-width="2"/>
  <circle cx="616" cy="547" r="24" fill="#3c4043" stroke="#202124" stroke-width="2"/>
  <circle cx="730" cy="547" r="24" fill="#3c4043" stroke="#202124" stroke-width="2"/>
  <circle cx="790" cy="547" r="24" fill="#d93025" stroke="#8f1d18" stroke-width="2"/>
  <circle cx="904" cy="547" r="24" fill="#d93025" stroke="#8f1d18" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="760" y="402">T</text>
    <text x="680" y="482">T</text>
    <text x="840" y="482">T</text>
    <text x="616" y="552">T</text>
    <text x="730" y="552">T</text>
    <text x="790" y="552">T</text>
    <text x="904" y="552">T</text>
  </g>
  <text x="995" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">Red-black tree nodes</text>
  <text x="995" y="474" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">also remain linked</text>
  <text x="995" y="501" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f6368">for traversal</text>

  <!-- Explanatory notes -->
  <rect x="35" y="606" width="1130" height="82" rx="9" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
  <text x="55" y="638" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#202124">Conceptual current-OpenJDK model:</text>
  <text x="55" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">The table is allocated lazily, its capacity is a power of two, and each node caches the spread hash alongside the key, value, and next reference.</text>
</svg>
