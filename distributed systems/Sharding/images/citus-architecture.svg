<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-labelledby="title desc">
  <title id="title">Citus: one coordinator, workers holding shards</title>
  <desc id="desc">An application connects to the Citus coordinator, which holds metadata mapping a hash of customer_id to a shard and each shard to a worker. It routes a query for customer_id 42 to worker 1 and a query for customer_id 7 to worker 2. Each worker is a PostgreSQL server holding shards as ordinary tables. The orders and order_items shards for the same hash range form a co-located shard group on the same worker: worker 1 holds hash ranges 1 and 3, worker 2 holds ranges 2 and 4. The reference table products has a single shard, products_102016, copied to every worker.</desc>
  <!-- Shard IDs and the customer-to-range mapping are illustrative; Citus names each shard table_shardid. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .small { font-size: 19px; fill: #536174; }
      .label { font-size: 19px; font-weight: 700; }
      .code { font-size: 15px; fill: #17212f; font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .route { font-size: 17px; fill: #17212f; font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .tiny { font-size: 15px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
      .group { fill: #f3faed; stroke: #9fc98a; stroke-width: 1.5; }
      .pill { fill: #fff; stroke: #9fc98a; stroke-width: 1.5; }
      .ref { fill: #f0f8fc; stroke: #7fb3d5; stroke-width: 1.5; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <rect width="1120" height="752" fill="#fff"/>

  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">Citus: one coordinator, workers holding shards</text>
  <text x="28" y="77" class="sub" text-anchor="start">Distributed by customer_id and co-located: orders, order_items. Reference table: products.</text>

  <!-- Application: talks only to the coordinator. -->
  <rect x="440" y="104" width="240" height="56" rx="10" class="node" fill="#fff"/>
  <text x="560" y="139" class="label" text-anchor="middle">Application</text>
  <path data-connector="true" d="M560 160L560 191" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="560,204 554,190 566,190" fill="#17212f"/>

  <!-- Coordinator: an ordinary PostgreSQL server with the Citus metadata tables. -->
  <rect x="300" y="204" width="520" height="96" rx="10" class="node" fill="#f7f8fa"/>
  <text x="560" y="234" class="label" text-anchor="middle">Coordinator</text>
  <text x="560" y="260" class="small" text-anchor="middle">metadata: hash(customer_id) &#8594; shard &#8594; worker</text>
  <text x="560" y="286" class="tiny" text-anchor="middle">pg_dist_shard, pg_dist_placement</text>

  <!-- Two routed queries: each lands on the worker holding that customer's hash range. -->
  <path data-connector="true" d="M430 300L430 377" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="430,390 424,376 436,376" fill="#17212f"/>
  <text x="416" y="352" class="route" text-anchor="end">customer_id = 42</text>
  <path data-connector="true" d="M690 300L690 377" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="690,390 684,376 696,376" fill="#17212f"/>
  <text x="704" y="352" class="route" text-anchor="start">customer_id = 7</text>

  <!-- WORKER 1: hash ranges 1 and 3. -->
  <rect x="48" y="390" width="500" height="300" rx="12" class="node" fill="#fff"/>
  <use href="#server" x="64" y="404" width="14" height="24"/>
  <text x="88" y="424" class="label" text-anchor="start">Worker 1</text>
  <text x="532" y="424" class="tiny" text-anchor="end">an ordinary PostgreSQL server</text>
  <rect x="64" y="440" width="468" height="86" rx="10" class="group"/>
  <text x="80" y="462" class="tiny" text-anchor="start">shard group: hash range 1 of 4</text>
  <rect x="80" y="474" width="212" height="36" rx="6" class="pill"/>
  <text x="186" y="497" class="code" text-anchor="middle">orders_102008</text>
  <rect x="304" y="474" width="212" height="36" rx="6" class="pill"/>
  <text x="410" y="497" class="code" text-anchor="middle">order_items_102012</text>
  <rect x="64" y="536" width="468" height="86" rx="10" class="group"/>
  <text x="80" y="558" class="tiny" text-anchor="start">shard group: hash range 3 of 4</text>
  <rect x="80" y="570" width="212" height="36" rx="6" class="pill"/>
  <text x="186" y="593" class="code" text-anchor="middle">orders_102010</text>
  <rect x="304" y="570" width="212" height="36" rx="6" class="pill"/>
  <text x="410" y="593" class="code" text-anchor="middle">order_items_102014</text>
  <rect x="64" y="634" width="468" height="38" rx="8" class="ref"/>
  <text x="80" y="658" class="code" text-anchor="start">products_102016</text>
  <text x="516" y="658" class="tiny" text-anchor="end">reference table: full copy</text>

  <!-- WORKER 2: hash ranges 2 and 4; the reference shard is the same table as on worker 1. -->
  <rect x="572" y="390" width="500" height="300" rx="12" class="node" fill="#fff"/>
  <use href="#server" x="588" y="404" width="14" height="24"/>
  <text x="612" y="424" class="label" text-anchor="start">Worker 2</text>
  <text x="1056" y="424" class="tiny" text-anchor="end">an ordinary PostgreSQL server</text>
  <rect x="588" y="440" width="468" height="86" rx="10" class="group"/>
  <text x="604" y="462" class="tiny" text-anchor="start">shard group: hash range 2 of 4</text>
  <rect x="604" y="474" width="212" height="36" rx="6" class="pill"/>
  <text x="710" y="497" class="code" text-anchor="middle">orders_102009</text>
  <rect x="828" y="474" width="212" height="36" rx="6" class="pill"/>
  <text x="934" y="497" class="code" text-anchor="middle">order_items_102013</text>
  <rect x="588" y="536" width="468" height="86" rx="10" class="group"/>
  <text x="604" y="558" class="tiny" text-anchor="start">shard group: hash range 4 of 4</text>
  <rect x="604" y="570" width="212" height="36" rx="6" class="pill"/>
  <text x="710" y="593" class="code" text-anchor="middle">orders_102011</text>
  <rect x="828" y="570" width="212" height="36" rx="6" class="pill"/>
  <text x="934" y="593" class="code" text-anchor="middle">order_items_102015</text>
  <rect x="588" y="634" width="468" height="38" rx="8" class="ref"/>
  <text x="604" y="658" class="code" text-anchor="start">products_102016</text>
  <text x="1040" y="658" class="tiny" text-anchor="end">reference table: full copy</text>

  <!-- Footer: the real default shard count. -->
  <text x="28" y="726" class="small" text-anchor="start">Four shards per table are drawn; by default Citus creates 32 (citus.shard_count).</text>
</svg>
