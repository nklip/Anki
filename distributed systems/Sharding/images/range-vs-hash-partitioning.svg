<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Range keeps neighbours together; hash scatters them</title>
  <desc id="desc">Twelve orders, IDs 101 to 112, assigned in increasing order, are split across three shards in two ways. With range partitioning, S1 holds 101 to 104, S2 holds 105 to 108 and S3 holds 109 and up, so the new orders 113 to 115 all go to S3, a write hot spot, but a query for 105 to 107 asks only S2. With hash partitioning, a hash of the order ID picks the shard, so the IDs are scattered, the new orders land one per shard, but a query for 105 to 107 must ask all three shards.</desc>
  <!-- The hash placement is illustrative; it only needs to look scattered, not match a real function. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .label { font-size: 19px; font-weight: 700; }
      .id { font-size: 17px; fill: #17212f; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
      .old { fill: #f3faed; stroke: #9fc98a; stroke-width: 1.5; }
      .new { fill: #fff; stroke: #536174; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .good { fill: #f3faed; stroke: #9fc98a; stroke-width: 2; }
      .bad { fill: #fdf0ee; stroke: #c0392b; stroke-width: 2; }
      .badtext { font-size: 19px; fill: #c0392b; }
      .goodtext { font-size: 19px; fill: #2f6b12; }
    </style>
  </defs>
  <rect width="1120" height="700" fill="#fff"/>

  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">Range keeps neighbours together; hash scatters them</text>
  <text x="28" y="77" class="sub" text-anchor="start">Order IDs grow over time. The same orders, 101&#8211;112, split across three shards two ways. Dashed = new.</text>

  <!-- LEFT PANEL: range partitioning. Columns at x=48, 214, 380; pills step 36 units from y=240. -->
  <rect x="28" y="110" width="524" height="566" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="146" class="heading" text-anchor="start">Range partitioning</text>
  <text x="48" y="176" class="small" text-anchor="start">101&#8211;104 &#8594; S1, 105&#8211;108 &#8594; S2, 109 and up &#8594; S3</text>

  <rect x="48" y="196" width="152" height="304" rx="10" class="node" fill="#fff"/>
  <text x="124" y="226" class="label" text-anchor="middle">S1</text>
  <rect x="64" y="240" width="120" height="30" rx="6" class="old"/><text x="124" y="261" class="id" text-anchor="middle">101</text>
  <rect x="64" y="276" width="120" height="30" rx="6" class="old"/><text x="124" y="297" class="id" text-anchor="middle">102</text>
  <rect x="64" y="312" width="120" height="30" rx="6" class="old"/><text x="124" y="333" class="id" text-anchor="middle">103</text>
  <rect x="64" y="348" width="120" height="30" rx="6" class="old"/><text x="124" y="369" class="id" text-anchor="middle">104</text>

  <rect x="214" y="196" width="152" height="304" rx="10" class="node" fill="#fff"/>
  <text x="290" y="226" class="label" text-anchor="middle">S2</text>
  <rect x="230" y="240" width="120" height="30" rx="6" class="old"/><text x="290" y="261" class="id" text-anchor="middle">105</text>
  <rect x="230" y="276" width="120" height="30" rx="6" class="old"/><text x="290" y="297" class="id" text-anchor="middle">106</text>
  <rect x="230" y="312" width="120" height="30" rx="6" class="old"/><text x="290" y="333" class="id" text-anchor="middle">107</text>
  <rect x="230" y="348" width="120" height="30" rx="6" class="old"/><text x="290" y="369" class="id" text-anchor="middle">108</text>

  <!-- S3 owns the open-ended top range, so every new, higher ID lands here. -->
  <rect x="380" y="196" width="152" height="304" rx="10" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="456" y="226" class="label" text-anchor="middle">S3</text>
  <rect x="396" y="240" width="120" height="30" rx="6" class="old"/><text x="456" y="261" class="id" text-anchor="middle">109</text>
  <rect x="396" y="276" width="120" height="30" rx="6" class="old"/><text x="456" y="297" class="id" text-anchor="middle">110</text>
  <rect x="396" y="312" width="120" height="30" rx="6" class="old"/><text x="456" y="333" class="id" text-anchor="middle">111</text>
  <rect x="396" y="348" width="120" height="30" rx="6" class="old"/><text x="456" y="369" class="id" text-anchor="middle">112</text>
  <rect x="396" y="384" width="120" height="30" rx="6" class="new"/><text x="456" y="405" class="id" text-anchor="middle">113</text>
  <rect x="396" y="420" width="120" height="30" rx="6" class="new"/><text x="456" y="441" class="id" text-anchor="middle">114</text>
  <rect x="396" y="456" width="120" height="30" rx="6" class="new"/><text x="456" y="477" class="id" text-anchor="middle">115</text>

  <!-- Left verdicts: one cost, one benefit. -->
  <rect x="48" y="516" width="484" height="66" rx="10" class="bad"/>
  <text x="64" y="542" class="label" text-anchor="start">New orders 113&#8211;115</text>
  <text x="64" y="568" class="badtext" text-anchor="start">Cost: all go to S3, one hot shard.</text>
  <rect x="48" y="594" width="484" height="66" rx="10" class="good"/>
  <text x="64" y="620" class="label" text-anchor="start">Query IDs 105&#8211;107</text>
  <text x="64" y="646" class="goodtext" text-anchor="start">Good: asks S2 only.</text>

  <!-- RIGHT PANEL: hash partitioning. Columns at x=588, 754, 920. -->
  <rect x="568" y="110" width="524" height="566" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="588" y="146" class="heading" text-anchor="start">Hash partitioning</text>
  <text x="588" y="176" class="small" text-anchor="start">hash(order_id) picks the shard</text>

  <rect x="588" y="196" width="152" height="304" rx="10" class="node" fill="#fff"/>
  <text x="664" y="226" class="label" text-anchor="middle">S1</text>
  <rect x="604" y="240" width="120" height="30" rx="6" class="old"/><text x="664" y="261" class="id" text-anchor="middle">102</text>
  <rect x="604" y="276" width="120" height="30" rx="6" class="old"/><text x="664" y="297" class="id" text-anchor="middle">105</text>
  <rect x="604" y="312" width="120" height="30" rx="6" class="old"/><text x="664" y="333" class="id" text-anchor="middle">110</text>
  <rect x="604" y="348" width="120" height="30" rx="6" class="old"/><text x="664" y="369" class="id" text-anchor="middle">111</text>
  <rect x="604" y="384" width="120" height="30" rx="6" class="new"/><text x="664" y="405" class="id" text-anchor="middle">114</text>

  <rect x="754" y="196" width="152" height="304" rx="10" class="node" fill="#fff"/>
  <text x="830" y="226" class="label" text-anchor="middle">S2</text>
  <rect x="770" y="240" width="120" height="30" rx="6" class="old"/><text x="830" y="261" class="id" text-anchor="middle">101</text>
  <rect x="770" y="276" width="120" height="30" rx="6" class="old"/><text x="830" y="297" class="id" text-anchor="middle">106</text>
  <rect x="770" y="312" width="120" height="30" rx="6" class="old"/><text x="830" y="333" class="id" text-anchor="middle">107</text>
  <rect x="770" y="348" width="120" height="30" rx="6" class="old"/><text x="830" y="369" class="id" text-anchor="middle">112</text>
  <rect x="770" y="384" width="120" height="30" rx="6" class="new"/><text x="830" y="405" class="id" text-anchor="middle">113</text>

  <rect x="920" y="196" width="152" height="304" rx="10" class="node" fill="#fff"/>
  <text x="996" y="226" class="label" text-anchor="middle">S3</text>
  <rect x="936" y="240" width="120" height="30" rx="6" class="old"/><text x="996" y="261" class="id" text-anchor="middle">103</text>
  <rect x="936" y="276" width="120" height="30" rx="6" class="old"/><text x="996" y="297" class="id" text-anchor="middle">104</text>
  <rect x="936" y="312" width="120" height="30" rx="6" class="old"/><text x="996" y="333" class="id" text-anchor="middle">108</text>
  <rect x="936" y="348" width="120" height="30" rx="6" class="old"/><text x="996" y="369" class="id" text-anchor="middle">109</text>
  <rect x="936" y="384" width="120" height="30" rx="6" class="new"/><text x="996" y="405" class="id" text-anchor="middle">115</text>

  <!-- Right verdicts mirror the left ones: the benefit and the cost swap places. -->
  <rect x="588" y="516" width="484" height="66" rx="10" class="good"/>
  <text x="604" y="542" class="label" text-anchor="start">New orders 113&#8211;115</text>
  <text x="604" y="568" class="goodtext" text-anchor="start">Good: one per shard, writes stay spread.</text>
  <rect x="588" y="594" width="484" height="66" rx="10" class="bad"/>
  <text x="604" y="620" class="label" text-anchor="start">Query IDs 105&#8211;107</text>
  <text x="604" y="646" class="badtext" text-anchor="start">Cost: must ask all three shards.</text>
</svg>
