<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Partition key in the query: one shard. Missing: every shard.</title>
  <desc id="desc">The customers table is sharded across three shards behind a Citus coordinator, and customer_id is its partition key. On the left, a query with WHERE customer_id = 42 goes from the coordinator to shard S2 only; S1 and S3 stay idle, so the query costs one shard's work. On the right, a query with WHERE email equal to an address does not name the partition key and cannot be mapped to a shard, so the coordinator sends it to S1, S2 and S3, waits for all three answers and merges them; the query costs every shard's work and waits for the slowest.</desc>
  <!-- Arrow geometry is generated: each shaft stops 1 unit inside its head's base; each tip meets a box border. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .small { font-size: 19px; fill: #536174; }
      .label { font-size: 19px; font-weight: 700; }
      .code { font-size: 19px; fill: #17212f; font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .note { font-size: 17px; fill: #0b78b5; font-weight: 700; }
      .tiny { font-size: 15px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
      .busy { fill: #f3faed; stroke: #9fc98a; stroke-width: 2; }
      .good { fill: #f3faed; stroke: #9fc98a; stroke-width: 2; }
      .bad { fill: #fdf0ee; stroke: #c0392b; stroke-width: 2; }
      .goodtext { font-size: 19px; fill: #2f6b12; }
      .badtext { font-size: 19px; fill: #c0392b; }
    </style>
  </defs>
  <rect width="1120" height="640" fill="#fff"/>

  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">Partition key in the query: one shard. Missing: every shard.</text>
  <text x="28" y="77" class="sub" text-anchor="start">Partition key: customer_id. The customers table has three shards behind a Citus coordinator.</text>

  <!-- LEFT: targeted. The coordinator maps customer_id 42 to S2 and sends nothing elsewhere. -->
  <rect x="28" y="104" width="524" height="512" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="140" class="heading" text-anchor="start">Targeted query</text>
  <rect x="48" y="160" width="484" height="46" rx="8" class="node" fill="#fff"/>
  <text x="64" y="190" class="code" text-anchor="start">WHERE customer_id = 42</text>
  <path data-connector="true" d="M290 206L290 237" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="290,250 284,236 296,236" fill="#17212f"/>
  <rect x="160" y="250" width="260" height="64" rx="10" class="node" fill="#fff"/>
  <text x="290" y="277" class="label" text-anchor="middle">Coordinator</text>
  <text x="290" y="300" class="note" text-anchor="middle">sends to S2 only</text>
  <rect x="48" y="410" width="140" height="64" rx="10" class="node" fill="#fff"/>
  <text x="118" y="438" class="label" text-anchor="middle">S1</text>
  <text x="118" y="460" class="tiny" text-anchor="middle">idle</text>
  <rect x="220" y="410" width="140" height="64" rx="10" class="busy"/>
  <text x="290" y="438" class="label" text-anchor="middle">S2</text>
  <text x="290" y="460" class="tiny" text-anchor="middle">searches</text>
  <rect x="392" y="410" width="140" height="64" rx="10" class="node" fill="#fff"/>
  <text x="462" y="438" class="label" text-anchor="middle">S3</text>
  <text x="462" y="460" class="tiny" text-anchor="middle">idle</text>
  <path data-connector="true" d="M290 314L290 397" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="290,410 284,396 296,396" fill="#17212f"/>
  <rect x="48" y="502" width="484" height="94" rx="10" class="good"/>
  <text x="64" y="538" class="goodtext" text-anchor="start">Cost: one shard's work.</text>
  <text x="64" y="568" class="goodtext" text-anchor="start">More shards add capacity for these queries.</text>

  <!-- RIGHT: scatter/gather. Nothing maps an email to a shard, so every shard is asked. -->
  <rect x="568" y="104" width="524" height="512" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="588" y="140" class="heading" text-anchor="start">Scatter/gather query</text>
  <rect x="588" y="160" width="484" height="46" rx="8" class="node" fill="#fff"/>
  <text x="604" y="190" class="code" text-anchor="start">WHERE email = 'ann@example.com'</text>
  <path data-connector="true" d="M830 206L830 237" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="830,250 824,236 836,236" fill="#17212f"/>
  <rect x="700" y="250" width="260" height="64" rx="10" class="node" fill="#fff"/>
  <text x="830" y="277" class="label" text-anchor="middle">Coordinator</text>
  <text x="830" y="300" class="note" text-anchor="middle">asks all, then merges</text>
  <rect x="588" y="410" width="140" height="64" rx="10" class="busy"/>
  <text x="658" y="438" class="label" text-anchor="middle">S1</text>
  <text x="658" y="460" class="tiny" text-anchor="middle">searches</text>
  <rect x="760" y="410" width="140" height="64" rx="10" class="busy"/>
  <text x="830" y="438" class="label" text-anchor="middle">S2</text>
  <text x="830" y="460" class="tiny" text-anchor="middle">searches</text>
  <rect x="932" y="410" width="140" height="64" rx="10" class="busy"/>
  <text x="1002" y="438" class="label" text-anchor="middle">S3</text>
  <text x="1002" y="460" class="tiny" text-anchor="middle">searches</text>
  <path data-connector="true" d="M830 314L669.4 403.7" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="658,410 667.3,397.9 673.1,408.4" fill="#17212f"/>
  <path data-connector="true" d="M830 314L830 397" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="830,410 824,396 836,396" fill="#17212f"/>
  <path data-connector="true" d="M830 314L990.6 403.7" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="1002,410 986.9,408.4 992.7,397.9" fill="#17212f"/>
  <rect x="588" y="502" width="484" height="94" rx="10" class="bad"/>
  <text x="604" y="538" class="badtext" text-anchor="start">Cost: every shard's work; the answer waits</text>
  <text x="604" y="568" class="badtext" text-anchor="start">for the slowest shard. More shards, more work.</text>
</svg>
