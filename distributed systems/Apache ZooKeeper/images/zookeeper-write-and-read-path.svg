<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">A write needs a majority; a read is answered locally</title>
  <desc id="desc">Write path: the client sends the write to its own server, that server forwards it to the leader, the leader proposes it to the followers, each appends it to disk and acknowledges, and a majority commits it. Read path: the client's own server answers from its in-memory copy without asking the leader, so the value can be stale unless the client calls sync first.</desc>
  <!-- Two panels, same three-server ensemble: the expensive path on top, the cheap path below. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="700" fill="#fff"/>
  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">A write needs a majority; a read is answered locally</text>
  <text x="28" y="77" class="sub" text-anchor="start">One ensemble of three voting members: a leader and followers A and B.</text>
  <!-- WRITE PATH. -->
  <rect x="28" y="110" width="1064" height="310" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="150" class="heading" text-anchor="start">Write path</text>
  <rect x="48" y="182" width="150" height="76" rx="10" class="node" fill="#f3faed"/>
  <text x="123" y="216" class="heading" text-anchor="middle">Client</text>
  <text x="123" y="242" class="small" text-anchor="middle">one session</text>
  <path data-connector="true" d="M210.0 206.0L274.00 206.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="286.0,206.0 272.00,212.00 272.00,200.00" fill="#17212f"/>
  <text x="242" y="188" class="small" text-anchor="middle">write</text>
  <rect x="286" y="182" width="190" height="76" rx="10" class="node" fill="#f0f8fc"/>
  <text x="381" y="216" class="heading" text-anchor="middle">Follower A</text>
  <text x="381" y="242" class="small" text-anchor="middle">client's server</text>
  <path data-connector="true" d="M488.0 206.0L552.00 206.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="564.0,206.0 550.00,212.00 550.00,200.00" fill="#17212f"/>
  <text x="520" y="188" class="small" text-anchor="middle">forward</text>
  <rect x="564" y="182" width="170" height="76" rx="10" class="node" fill="#f0f8fc"/>
  <text x="649" y="216" class="heading" text-anchor="middle">Leader</text>
  <text x="649" y="242" class="small" text-anchor="middle">assigns the zxid</text>
  <!-- Out and back in the same corridor: propose above the box centre, acknowledge below it. -->
  <path data-connector="true" d="M746.0 202.0L798.00 202.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="810.0,202.0 796.00,208.00 796.00,196.00" fill="#17212f"/>
  <text x="772" y="184" class="small" text-anchor="middle">propose</text>
  <path data-connector="true" d="M798.0 240.0L746.00 240.00" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="734.0,240.0 748.00,234.00 748.00,246.00" fill="#0b78b5"/>
  <text x="772" y="272" class="small" text-anchor="middle" style="fill:#0b78b5">ACK</text>
  <!-- The whole voting set, the leader included: every one of them logs the change. -->
  <rect x="810" y="182" width="258" height="76" rx="10" class="node" fill="#f0f8fc"/>
  <text x="939" y="216" class="heading" text-anchor="middle">All voting members</text>
  <text x="939" y="242" class="small" text-anchor="middle">append to disk, then ACK</text>
  <text x="48" y="312" class="small" text-anchor="start">Only the leader assigns the order, so every server applies changes in the same sequence.</text>
  <text x="48" y="338" class="small" text-anchor="start">Acknowledging means the change is already in that server's transaction log on disk.</text>
  <text x="48" y="364" class="small" text-anchor="start">A majority of the three — the leader plus one follower — commits the write.</text>
  <text x="48" y="390" class="small" text-anchor="start">The client is answered after the commit, so a successful return means the write survived.</text>
  <!-- READ PATH. -->
  <rect x="28" y="444" width="1064" height="176" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="484" class="heading" text-anchor="start">Read path</text>
  <rect x="48" y="506" width="150" height="76" rx="10" class="node" fill="#f3faed"/>
  <text x="123" y="540" class="heading" text-anchor="middle">Client</text>
  <text x="123" y="566" class="small" text-anchor="middle">one session</text>
  <path data-connector="true" d="M210.0 544.0L274.00 544.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="286.0,544.0 272.00,550.00 272.00,538.00" fill="#17212f"/>
  <text x="242" y="526" class="small" text-anchor="middle">getData</text>
  <rect x="286" y="506" width="190" height="76" rx="10" class="node" fill="#fff"/>
  <text x="381" y="540" class="heading" text-anchor="middle">Follower A</text>
  <text x="381" y="566" class="small" text-anchor="middle">client's server</text>
  <text x="500" y="530" class="small" text-anchor="start">The server answers from its own in-memory copy.</text>
  <text x="500" y="556" class="small" text-anchor="start">It does not ask the leader, so the value can be stale.</text>
  <text x="500" y="582" class="small" text-anchor="start">Call sync(path) before the read when that matters.</text>
  <text x="28" y="672" class="body" text-anchor="start">Writes pay for a majority; reads skip it, which is why a read can be behind the leader.</text>
</svg>
