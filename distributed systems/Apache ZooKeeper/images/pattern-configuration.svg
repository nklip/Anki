<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Configuration: one znode, one write, everyone notified</title>
  <desc id="desc">Three report-workers read the znode slash config, which holds batchSize equals 500 at version 7, and ask to be notified. An operator writes 800, the version becomes 8, and all three workers are notified.</desc>
  <!-- Icons copied from System Design/01. Scaling: message-queue.svg (server) and database.svg (laptop). -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
  </defs>
  <rect width="1120" height="520" fill="#fff"/>
  <text x="28" y="43" class="title" text-anchor="start">Configuration: one znode, one write, everyone notified</text>
  <text x="28" y="77" class="sub" text-anchor="start">The operator writes on the right; the workers on the left are told, then read again.</text>
  <!-- The readers. -->
  <rect x="28" y="110" width="300" height="330" rx="12" fill="#f3faed" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="150" class="heading" text-anchor="start">report-workers</text>
  <use href="#server" x="56" y="178" width="30" height="52"/>
  <text x="100" y="210" class="body" text-anchor="start">worker 1</text>
  <use href="#server" x="56" y="258" width="30" height="52"/>
  <text x="100" y="290" class="body" text-anchor="start">worker 2</text>
  <use href="#server" x="56" y="338" width="30" height="52"/>
  <text x="100" y="370" class="body" text-anchor="start">worker 3</text>
  <!-- Read out, notification back: two arrows in one corridor, at different heights. -->
  <path data-connector="true" d="M340.0 240.0L408.00 240.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="420.0,240.0 406.00,246.00 406.00,234.00" fill="#17212f"/>
  <text x="380" y="222" class="small" text-anchor="middle">read</text>
  <path data-connector="true" d="M408.0 330.0L352.00 330.00" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="340.0,330.0 354.00,324.00 354.00,336.00" fill="#0b78b5"/>
  <text x="380" y="312" class="small" text-anchor="middle" style="fill:#0b78b5">notify</text>
  <!-- The one znode that holds the setting. -->
  <rect x="420" y="110" width="320" height="330" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="440" y="150" class="heading" text-anchor="start">ZooKeeper</text>
  <rect x="440" y="196" width="280" height="150" rx="10" class="node" fill="#fff"/>
  <text x="460" y="236" class="heading" text-anchor="start">/config</text>
  <text x="460" y="274" class="body" text-anchor="start">batchSize=500</text>
  <text x="460" y="310" class="small" text-anchor="start">version 7</text>
  <text x="440" y="404" class="small" text-anchor="start">one znode, a few bytes</text>
  <!-- The writer. -->
  <path data-connector="true" d="M820.0 270.0L732.00 270.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="720.0,270.0 734.00,264.00 734.00,276.00" fill="#17212f"/>
  <text x="776" y="252" class="small" text-anchor="middle">setData</text>
  <rect x="832" y="110" width="260" height="330" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="852" y="150" class="heading" text-anchor="start">operator</text>
  <use href="#laptop" x="898" y="186" width="110" height="70"/>
  <text x="852" y="308" class="small" text-anchor="start">writes 800</text>
  <text x="852" y="336" class="small" text-anchor="start">version becomes 8</text>
  <text x="28" y="490" class="body" text-anchor="start">Each worker reads the value and asks to be told when it changes. One write notifies them all.</text>
</svg>
