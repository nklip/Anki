<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1932" height="820" viewBox="0 0 1932 820" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 · Prepare makes a durable promise</title>
  <desc id="desc">The coordinator executes uncommitted debit and credit branches, then asks both databases to prepare. Each saves durable prepared state before voting yes. Red balance-row locks continue beyond the displayed phase; no commit has occurred.</desc>
  <!-- Match 2pc-protocol.svg: Arial, three timelines, open events, dashed phases, and red balance-row locks. -->
  <defs>
    <style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
.timeline{fill:none;stroke:#000;stroke-width:2.5}
.phase-boundary{fill:none;stroke:#000;stroke-width:2.5;stroke-dasharray:10 9}
.lock-span{fill:none;stroke:#fe2700;stroke-width:6}
.event{fill:#fff;stroke:#000;stroke-width:2.5}
.message-shaft{fill:none;stroke:#000;stroke-width:2.5}
.annotation-shaft{fill:none;stroke:#000;stroke-width:1.7}
</style>
    <!-- A 4-unit nose projection covers the 2.5-unit shaft. Message endpoints also clear the target event's outer radius. -->
    <marker id="message-arrowhead" markerWidth="20" markerHeight="16" viewBox="0 0 20 16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L20 8 L0 16 Z" fill="#000" />
    </marker>
    <!-- Callouts use the reference's smaller head and a 3-unit endpoint inset. -->
    <marker id="annotation-arrowhead" markerWidth="11" markerHeight="9" viewBox="0 0 11 9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#000" />
    </marker>
  </defs>
  <rect width="1932" height="820" fill="#fff" />
  <!-- Visible lesson and reading guide. -->
  <!-- Dashed boundaries and split direction bars locate each displayed stage; arrow tips stay 4 units inside the dividers. -->
  <path class="phase-boundary" d="M350 190 V725" />
  <path class="phase-boundary" d="M1010 190 V725" />
  <path class="phase-boundary" d="M1790 190 V725" />
  <path id="phase-1-bar" class="timeline" data-connector="true" d="M377 204 H572.0 M788.0 204 H983" />
  <path d="M354 204 L377 195 L377 213 Z M1006 204 L983 195 L983 213 Z" fill="#000" />
  <path id="phase-2-bar" class="timeline" data-connector="true" d="M1037 204 H1317.0 M1483.0 204 H1763" />
  <path d="M1014 204 L1037 195 L1037 213 Z M1786 204 L1763 195 L1763 213 Z" fill="#000" />
  <!-- Time flows left to right on all three rows; event circles are painted last over shafts. -->
  <path id="coordinator-timeline" class="timeline" data-connector="true" d="M320 280 H1868" />
  <path d="M1890 280 L1868 271 L1868 289 Z" fill="#000" />
  <path id="database-a-timeline" class="timeline" data-connector="true" d="M320 450 H1868" />
  <path d="M1890 450 L1868 441 L1868 459 Z" fill="#000" />
  <path id="database-c-timeline" class="timeline" data-connector="true" d="M320 620 H1868" />
  <path d="M1890 620 L1868 611 L1868 629 Z" fill="#000" />
  <!-- Lock spans begin with the initial updates and continue as red arrows: no unlock occurs in Prepare. -->
  <path id="database-a-lock-span" class="lock-span" data-connector="true" d="M505 450 H1870" />
  <path class="timeline" d="M505 429 V471" />
  <path id="database-a-lock-continues-arrowhead" d="M1890 450 L1868 441 L1868 459 Z" fill="#fe2700" />
  <path id="database-c-lock-span" class="lock-span" data-connector="true" d="M825 620 H1870" />
  <path class="timeline" d="M825 599 V641" />
  <path id="database-c-lock-continues-arrowhead" d="M1890 620 L1868 611 L1868 629 Z" fill="#fe2700" />
  <!-- Initial writes and execution acknowledgements precede the preparation request. -->
  <path id="write-a" class="message-shaft" data-connector="true" d="M390 280 L462.016 433.035" marker-end="url(#message-arrowhead)" />
  <path id="write-a-ok-source" class="message-shaft" data-connector="true" d="M545 450 L575.000 390" />
  <path id="write-a-ok-target" class="message-shaft" data-connector="true" d="M605.000 330 L621.615 296.771" marker-end="url(#message-arrowhead)" />
  <path id="write-c" class="message-shaft" data-connector="true" d="M700 280 L785.202 601.874" marker-end="url(#message-arrowhead)" />
  <path id="write-c-ok-source" class="message-shaft" data-connector="true" d="M870 620 L930.882 390" />
  <path id="write-c-ok-target" class="message-shaft" data-connector="true" d="M946.765 330 L955.202 298.126" marker-end="url(#message-arrowhead)" />
  <path id="lock-a-callout" class="annotation-shaft" data-connector="true" d="M525 512 L506.315 473.696" marker-end="url(#annotation-arrowhead)" />
  <path id="lock-c-callout" class="annotation-shaft" data-connector="true" d="M846 679 L826.451 643.626" marker-end="url(#annotation-arrowhead)" />
  <!-- PREPARE fans out; save-state labels sit between each request arrival and its YES reply. -->
  <path id="prepare-a" class="message-shaft" data-connector="true" d="M1060 280 L1178.610 435.106" marker-end="url(#message-arrowhead)" />
  <path id="prepare-c" class="message-shaft" data-connector="true" d="M1060 280 L1192.861 602.662" marker-end="url(#message-arrowhead)" />
  <path id="yes-a-source" class="message-shaft" data-connector="true" d="M1320 450 L1369.412 390" />
  <path id="yes-a-target" class="message-shaft" data-connector="true" d="M1418.824 330 L1448.080 294.474" marker-end="url(#message-arrowhead)" />
  <path id="yes-c-source" class="message-shaft" data-connector="true" d="M1360 620 L1535.882 390" />
  <path id="yes-c-target" class="message-shaft" data-connector="true" d="M1581.765 330 L1608.610 294.894" marker-end="url(#message-arrowhead)" />
  <!-- White event circles mask only their own source joins and the horizontal timeline, keeping every incoming arrowhead outside the circle. -->
  <circle id="event-1" class="event" cx="390" cy="280" r="13.5" />
  <circle id="event-2" class="event" cx="470" cy="450" r="13.5" />
  <circle id="event-3" class="event" cx="545" cy="450" r="13.5" />
  <circle id="event-4" class="event" cx="630" cy="280" r="13.5" />
  <circle id="event-5" class="event" cx="700" cy="280" r="13.5" />
  <circle id="event-6" class="event" cx="790" cy="620" r="13.5" />
  <circle id="event-7" class="event" cx="870" cy="620" r="13.5" />
  <circle id="event-8" class="event" cx="960" cy="280" r="13.5" />
  <circle id="event-9" class="event" cx="1060" cy="280" r="13.5" />
  <circle id="event-10" class="event" cx="1190" cy="450" r="13.5" />
  <circle id="event-11" class="event" cx="1200" cy="620" r="13.5" />
  <circle id="event-12" class="event" cx="1320" cy="450" r="13.5" />
  <circle id="event-13" class="event" cx="1360" cy="620" r="13.5" />
  <circle id="event-14" class="event" cx="1460" cy="280" r="13.5" />
  <circle id="event-15" class="event" cx="1620" cy="280" r="13.5" />
  <!-- All labels have reserved clearance from message paths, lock ticks, and phase dividers. -->
  <text x="40" y="50" font-size="38" text-anchor="start" style="font-weight:700">Phase 1 · Prepare makes a durable promise</text>
  <text x="40" y="93" font-size="28" text-anchor="start">Transfer tr-42: $1 from A to C. Read left to right; the debit and credit remain uncommitted.</text>
  <text x="680.0" y="169" font-size="38" text-anchor="middle">Uncommitted writes</text>
  <text x="680.0" y="216" font-size="34" text-anchor="middle">before 2PC</text>
  <text x="1400.0" y="169" font-size="38" text-anchor="middle">Prepare</text>
  <text x="1400.0" y="216" font-size="34" text-anchor="middle">phase 1</text>
  <text x="50" y="292" font-size="38" text-anchor="start">Coordinator</text>
  <text x="50" y="331" font-size="30" text-anchor="start">(Wallet Service)</text>
  <text x="50" y="462" font-size="38" text-anchor="start">Database A</text>
  <text x="50" y="632" font-size="38" text-anchor="start">Database C</text>
  <text x="1820" y="251" font-size="38" text-anchor="start">time</text>
  <text x="590.0" y="371" font-size="30" text-anchor="middle">ok</text>
  <text x="938.8235294117648" y="371" font-size="30" text-anchor="middle">ok</text>
  <text x="405" y="258" font-size="36" text-anchor="start">A−$1</text>
  <text x="715" y="258" font-size="36" text-anchor="start">C+$1</text>
  <text x="472" y="548" font-size="28" text-anchor="start">lock A</text>
  <text x="795" y="713" font-size="28" text-anchor="start">lock C</text>
  <text x="1394.1176470588234" y="371" font-size="30" text-anchor="middle">yes</text>
  <text x="1558.8235294117646" y="371" font-size="30" text-anchor="middle">yes</text>
  <text x="1255" y="495" font-size="26" text-anchor="middle">save state</text>
  <text x="1255" y="530" font-size="26" text-anchor="middle">before YES</text>
  <text x="1280" y="669" font-size="26" text-anchor="middle">save state</text>
  <text x="1280" y="705" font-size="26" text-anchor="middle">before YES</text>
  <text x="1660" y="419" font-size="28" text-anchor="middle">PREPARED</text>
  <text x="1660" y="498" font-size="28" text-anchor="middle">A−$1 pending</text>
  <text x="1660" y="589" font-size="28" text-anchor="middle">PREPARED</text>
  <text x="1660" y="668" font-size="28" text-anchor="middle">C+$1 pending</text>
  <!-- Outcome and lock legend make the isolated phase understandable without the article. -->
  <text x="40" y="768" font-size="26" text-anchor="start">YES is a durable promise to finish after recovery; it does not mean COMMIT.</text>
  <text x="40" y="803" font-size="26" text-anchor="start">Red spans = balance-row locks. Both remain held while the databases wait for the final decision.</text>
</svg>
