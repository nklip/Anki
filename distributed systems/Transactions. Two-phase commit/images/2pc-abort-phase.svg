<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1932" height="820" viewBox="0 0 1932 820" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 alternative · Abort the transfer</title>
  <desc id="desc">The coordinator asks both databases to prepare. A saves prepared state and votes yes. C cannot prepare, rolls back, releases its lock, and votes no. The coordinator chooses abort and tells A to roll back its prepared debit. Final balances remain A one dollar and C zero dollars; no refund is required.</desc>
  <!-- Match 2pc-protocol.svg: Arial, three timelines, open events, dashed phases, and red balance-row locks. -->
  <defs>
    <style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
.timeline{fill:none;stroke:#000;stroke-width:2.5}
.phase-boundary{fill:none;stroke:#000;stroke-width:2.5;stroke-dasharray:10 9}
.lock-span{fill:none;stroke:#fe2700;stroke-width:6}
.event{fill:#fff;stroke:#000;stroke-width:2.5}
.message-shaft{fill:none;stroke:#000;stroke-width:2.5}
.annotation-shaft{fill:none;stroke:#000;stroke-width:1.7}
</style>
    <!-- A 4-unit nose projection covers the 2.5-unit shaft. Message endpoints also clear the target event's outer radius. -->
    <marker id="message-arrowhead" markerWidth="20" markerHeight="16" viewBox="0 0 20 16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L20 8 L0 16 Z" fill="#000" />
    </marker>
    <!-- Callouts use the reference's smaller head and a 3-unit endpoint inset. -->
    <marker id="annotation-arrowhead" markerWidth="11" markerHeight="9" viewBox="0 0 11 9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#000" />
    </marker>
  </defs>
  <rect width="1932" height="820" fill="#fff" />
  <!-- Visible lesson and reading guide. -->
  <!-- Dashed boundaries and split direction bars locate each displayed stage; arrow tips stay 4 units inside the dividers. -->
  <path class="phase-boundary" d="M350 190 V725" />
  <path class="phase-boundary" d="M1080 190 V725" />
  <path class="phase-boundary" d="M1790 190 V725" />
  <path id="phase-1-bar" class="timeline" data-connector="true" d="M377 204 H632.0 M798.0 204 H1053" />
  <path d="M354 204 L377 195 L377 213 Z M1076 204 L1053 195 L1053 213 Z" fill="#000" />
  <path id="phase-2-bar" class="timeline" data-connector="true" d="M1107 204 H1352.0 M1518.0 204 H1763" />
  <path d="M1084 204 L1107 195 L1107 213 Z M1786 204 L1763 195 L1763 213 Z" fill="#000" />
  <!-- Time flows left to right on all three rows; event circles are painted last over shafts. -->
  <path id="coordinator-timeline" class="timeline" data-connector="true" d="M320 280 H1868" />
  <path d="M1890 280 L1868 271 L1868 289 Z" fill="#000" />
  <path id="database-a-timeline" class="timeline" data-connector="true" d="M320 450 H1868" />
  <path d="M1890 450 L1868 441 L1868 459 Z" fill="#000" />
  <path id="database-c-timeline" class="timeline" data-connector="true" d="M320 620 H1868" />
  <path d="M1890 620 L1868 611 L1868 629 Z" fill="#000" />
  <!-- Both updates began before the diagram. C unlocks on its local rejection; A retains its lock until ABORT arrives. -->
  <path id="database-a-lock-span" class="lock-span" data-connector="true" d="M320 450 H1470" />
  <path class="timeline" d="M1470 429 V471" />
  <path id="database-c-lock-span" class="lock-span" data-connector="true" d="M320 620 H765" />
  <path class="timeline" d="M765 599 V641" />
  <!-- C rejects preparation and reports NO only after its local work is rolled back. -->
  <path id="prepare-a" class="message-shaft" data-connector="true" d="M395 280 L518.340 435.317" marker-end="url(#message-arrowhead)" />
  <path id="prepare-c" class="message-shaft" data-connector="true" d="M395 280 L551.814 603.131" marker-end="url(#message-arrowhead)" />
  <path id="yes-a-source" class="message-shaft" data-connector="true" d="M680 450 L731.176 390" />
  <path id="yes-a-target" class="message-shaft" data-connector="true" d="M782.353 330 L812.832 294.266" marker-end="url(#message-arrowhead)" />
  <path id="no-c-source" class="message-shaft" data-connector="true" d="M825 620 L943.382 390" />
  <path id="no-c-target" class="message-shaft" data-connector="true" d="M974.265 330 L991.419 296.671" marker-end="url(#message-arrowhead)" />
  <path id="unlock-c-callout" class="annotation-shaft" data-connector="true" d="M792 678 L766.768 643.423" marker-end="url(#annotation-arrowhead)" />
  <!-- After NO the coordinator chooses ABORT. C is already rolled back, so only the unresolved prepared branch needs completion here. -->
  <path id="abort-a" class="message-shaft" data-connector="true" d="M1140 280 L1330.567 438.031" marker-end="url(#message-arrowhead)" />
  <path id="abort-a-ok-source" class="message-shaft" data-connector="true" d="M1530 450 L1586.471 390" />
  <path id="abort-a-ok-target" class="message-shaft" data-connector="true" d="M1642.941 330 L1677.149 293.654" marker-end="url(#message-arrowhead)" />
  <path id="unlock-a-callout" class="annotation-shaft" data-connector="true" d="M1444 510 L1468.336 473.496" marker-end="url(#annotation-arrowhead)" />
  <!-- White event circles mask only their own source joins and the horizontal timeline, keeping every incoming arrowhead outside the circle. -->
  <circle id="event-1" class="event" cx="395" cy="280" r="13.5" />
  <circle id="event-2" class="event" cx="530" cy="450" r="13.5" />
  <circle id="event-3" class="event" cx="560" cy="620" r="13.5" />
  <circle id="event-4" class="event" cx="680" cy="450" r="13.5" />
  <circle id="event-5" class="event" cx="825" cy="280" r="13.5" />
  <circle id="event-6" class="event" cx="825" cy="620" r="13.5" />
  <circle id="event-7" class="event" cx="1000" cy="280" r="13.5" />
  <circle id="event-8" class="event" cx="1140" cy="280" r="13.5" />
  <circle id="event-9" class="event" cx="1345" cy="450" r="13.5" />
  <circle id="event-10" class="event" cx="1530" cy="450" r="13.5" />
  <circle id="event-11" class="event" cx="1690" cy="280" r="13.5" />
  <!-- All labels have reserved clearance from message paths, lock ticks, and phase dividers. -->
  <text x="40" y="50" font-size="38" text-anchor="start" style="font-weight:700">Phase 2 alternative · Abort the transfer</text>
  <text x="40" y="93" font-size="28" text-anchor="start">Transfer tr-42: A prepares, but C rejects preparation. Read left to right; neither change commits.</text>
  <text x="715.0" y="169" font-size="38" text-anchor="middle">Prepare</text>
  <text x="715.0" y="216" font-size="34" text-anchor="middle">phase 1</text>
  <text x="1435.0" y="169" font-size="38" text-anchor="middle">Abort</text>
  <text x="1435.0" y="216" font-size="34" text-anchor="middle">phase 2</text>
  <text x="50" y="292" font-size="38" text-anchor="start">Coordinator</text>
  <text x="50" y="331" font-size="30" text-anchor="start">(Wallet Service)</text>
  <text x="50" y="462" font-size="38" text-anchor="start">Database A</text>
  <text x="50" y="632" font-size="38" text-anchor="start">Database C</text>
  <text x="1820" y="251" font-size="38" text-anchor="start">time</text>
  <text x="756.7647058823529" y="371" font-size="30" text-anchor="middle">yes</text>
  <text x="958.8235294117646" y="371" font-size="30" text-anchor="middle">no</text>
  <text x="422" y="255" font-size="32" text-anchor="start">prepare</text>
  <text x="615" y="417" font-size="26" text-anchor="middle">save state</text>
  <text x="700" y="500" font-size="28" text-anchor="middle">PREPARED</text>
  <text x="680" y="588" font-size="28" text-anchor="middle">roll back C</text>
  <text x="733" y="713" font-size="28" text-anchor="start">unlock C</text>
  <text x="1220" y="254" font-size="32" text-anchor="middle">choose ABORT</text>
  <text x="1614.7058823529412" y="371" font-size="30" text-anchor="middle">ok</text>
  <text x="1400" y="417" font-size="28" text-anchor="middle">roll back A</text>
  <text x="1382" y="548" font-size="28" text-anchor="start">unlock A</text>
  <text x="1700" y="417" font-size="28" text-anchor="middle">ABORTED</text>
  <text x="1700" y="500" font-size="30" text-anchor="middle">A = $1</text>
  <text x="1350" y="588" font-size="28" text-anchor="middle">Already rolled back</text>
  <text x="1700" y="588" font-size="28" text-anchor="middle">ABORTED</text>
  <text x="1700" y="670" font-size="30" text-anchor="middle">C = $0</text>
  <!-- Outcome and lock legend make the isolated phase understandable without the article. -->
  <text x="40" y="768" font-size="26" text-anchor="start">Red spans = balance-row locks. C releases its lock before voting NO; A releases its lock on rollback.</text>
  <text x="40" y="803" font-size="26" text-anchor="start">ABORT is the alternative to COMMIT. The debit never committed, so no new refund is needed.</text>
</svg>
