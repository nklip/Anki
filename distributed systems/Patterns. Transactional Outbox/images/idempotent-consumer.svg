<svg xmlns="http://www.w3.org/2000/svg" width="704" height="799" viewBox="0 0 704 799" role="img" aria-labelledby="title desc">
  <title id="title">Idempotent consumer: duplicate detection at commit</title>
  <desc id="desc">Read downward along the two consumer instances and their shared database. Both instances save the same message identifier and perform processing. Instance 1 commits; instance 2 encounters the uniqueness constraint at commit and its database transaction is rolled back.</desc>
  <!-- Legacy Mermaid uses stroked regular Trebuchet text for messages, rather than bold glyphs. -->
  <defs><style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; font-size: 14px; }
    .actor { fill: #ececff; stroke: #dacef3; stroke-width: 1; }
    .lifeline { stroke: #dacef3; stroke-width: 2; }
    .activation { fill: #f4f4f4; stroke: #666; stroke-width: 1; }
    .note-label { font-family: "Trebuchet MS", Arial, sans-serif; }
    .note { fill: #fff5ad; stroke: #aaaa33; stroke-width: 1; }
    .message { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #333; stroke: #333; stroke-width: 0.75; }
    .shaft { fill: none; stroke: #333; stroke-width: 1.5; }
  </style></defs>
  <!-- Lifelines show time progressing downward; activation bars cover them during work. -->
  <rect width="704" height="799" fill="#fff"/>
  <line class="lifeline" x1="131.9" y1="75" x2="131.9" y2="722.75"/>
  <line class="lifeline" x1="331.7" y1="75" x2="331.7" y2="722.75"/>
  <line class="lifeline" x1="566.6" y1="75" x2="566.6" y2="722.75"/>
  <rect id="instance-one-activation" class="activation" x="126.9" y="77" width="10" height="484"/>
  <rect id="instance-two-activation" class="activation" x="561.6" y="77" width="10" height="626"/>
  <rect id="database-activation" class="activation" x="326.7" y="611" width="10" height="46"/>
  <!-- Repeated participant boxes preserve the reference’s top and bottom alignment. -->
  <rect class="actor" x="56.900000000000006" y="10.25" width="150" height="65" rx="3"/>
  <text x="131.9" y="41.5" text-anchor="middle">Consumer Service<tspan x="131.9" dy="14.5">Instance 1</tspan></text>
  <rect class="actor" x="256.7" y="10.25" width="150" height="65" rx="3"/>
  <text x="331.7" y="48.75" text-anchor="middle">Database</text>
  <rect class="actor" x="491.6" y="10.25" width="150" height="65" rx="3"/>
  <text x="566.6" y="41.5" text-anchor="middle">Consumer Service<tspan x="566.6" dy="14.5">Instance 2</tspan></text>
  <rect class="actor" x="56.900000000000006" y="722.75" width="150" height="65" rx="3"/>
  <text x="131.9" y="754.0" text-anchor="middle">Consumer Service<tspan x="131.9" dy="14.5">Instance 1</tspan></text>
  <rect class="actor" x="256.7" y="722.75" width="150" height="65" rx="3"/>
  <text x="331.7" y="761.25" text-anchor="middle">Database</text>
  <rect class="actor" x="491.6" y="722.75" width="150" height="65" rx="3"/>
  <text x="566.6" y="754.0" text-anchor="middle">Consumer Service<tspan x="566.6" dy="14.5">Instance 2</tspan></text>
  <!-- Notes over activation bars mark transaction boundaries. -->
  <rect class="note" x="56.900000000000006" y="85" width="150" height="36"/>
  <text class="note-label" x="131.9" y="107.75" text-anchor="middle">Begin DB transaction</text>
  <rect class="note" x="491.6" y="227" width="150" height="36"/>
  <text class="note-label" x="566.6" y="249.75" text-anchor="middle">Begin DB transaction</text>
  <text class="message" x="234.3" y="156" text-anchor="middle">save(messageId)</text>
  <path class="shaft" data-connector="true" d="M136.9 169 H324.7"/>
  <path d="M331.7 169 l-10 -5 v10 Z" fill="#333"/>
  <text class="message" x="234.3" y="204" text-anchor="middle">write</text>
  <path class="shaft" data-connector="true" d="M136.9 217 H324.7"/>
  <path d="M331.7 217 l-10 -5 v10 Z" fill="#333"/>
  <text class="message" x="446.65" y="298" text-anchor="middle">save(messageId)</text>
  <path class="shaft" data-connector="true" d="M561.6 311 H338.7"/>
  <path d="M331.7 311 l10 -5 v10 Z" fill="#333"/>
  <text class="message" x="446.65" y="346" text-anchor="middle">write</text>
  <path class="shaft" data-connector="true" d="M561.6 359 H338.7"/>
  <path d="M331.7 359 l10 -5 v10 Z" fill="#333"/>
  <!-- Self-call curves return to the outer activation edge; each shaft ends beneath its head. -->
  <text class="message" x="136.9" y="394" text-anchor="middle">Other event processing</text>
  <path class="shaft" data-connector="true" d="M136.9 407 C196.9 397 196.9 437 143.9 427"/>
  <path d="M136.9 427 l10 -4.5 -1.5 9 Z" fill="#333"/>
  <text class="message" x="571.6" y="472" text-anchor="middle">Other event processing</text>
  <path class="shaft" data-connector="true" d="M571.6 485 C631.6 475 631.6 515 578.6 505"/>
  <path d="M571.6 505 l10 -4.5 -1.5 9 Z" fill="#333"/>
  <rect class="note" x="49.900000000000006" y="525" width="164" height="36"/>
  <text class="note-label" x="131.9" y="547.75" text-anchor="middle">Commit DB transaction</text>
  <!-- The dashed database response reports the uniqueness conflict after the first commit. -->
  <text class="message" x="446.65" y="596" text-anchor="middle">Commit DB transaction</text>
  <path class="shaft" data-connector="true" d="M561.6 609 H338.7"/>
  <path d="M331.7 609 l10 -5 v10 Z" fill="#333"/>
  <text class="message" x="449.15" y="644" text-anchor="middle">constraint violation</text>
  <path class="shaft" data-connector="true" d="M336.7 657 H554.6" stroke-dasharray="3 3"/>
  <path d="M561.6 657 l-10 -5 v10 Z" fill="#333"/>
  <rect class="note" x="483.6" y="667" width="166" height="36"/>
  <text class="note-label" x="566.6" y="689.75" text-anchor="middle">Transaction rolled back</text>
  <!-- Source: https://www.lydtechconsulting.com/blog/kafka-idempotent-consumer-transactional-outbox ; etalon: idempotent-consumer.png. -->
</svg>
