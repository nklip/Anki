<svg xmlns="http://www.w3.org/2000/svg" width="759" height="671" viewBox="0 0 759 671" role="img" aria-labelledby="title desc">
  <title id="title">Idempotent consumer: flush and wait for the unique-key lock</title>
  <desc id="desc">Read downward along the two consumer instances and their shared database. Instance 1 flushes its message identifier and commits its processing. Instance 2 waits for the conflicting identifier lock, then its transaction rolls back on the uniqueness constraint.</desc>
  <!-- Legacy Mermaid uses stroked regular Trebuchet text for messages, rather than bold glyphs. -->
  <defs><style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; font-size: 14px; }
    .actor { fill: #ececff; stroke: #dacef3; stroke-width: 1; }
    .lifeline { stroke: #dacef3; stroke-width: 2; }
    .activation { fill: #f4f4f4; stroke: #666; stroke-width: 1; }
    .note-label { font-family: "Trebuchet MS", Arial, sans-serif; }
    .note { fill: #fff5ad; stroke: #aaaa33; stroke-width: 1; }
    .message { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #333; stroke: #333; stroke-width: 0.75; }
    .shaft { fill: none; stroke: #333; stroke-width: 1.5; }
  </style></defs>
  <!-- Lifelines show time progressing downward; activation bars cover them during work. -->
  <rect width="759" height="671" fill="#fff"/>
  <line class="lifeline" x1="131.9" y1="75" x2="131.9" y2="594.9"/>
  <line class="lifeline" x1="382.9" y1="75" x2="382.9" y2="594.9"/>
  <line class="lifeline" x1="633.9" y1="75" x2="633.9" y2="594.9"/>
  <rect id="instance-one-activation" class="activation" x="126.9" y="77" width="10" height="404"/>
  <rect id="instance-two-activation" class="activation" x="628.9" y="77" width="10" height="498"/>
  <rect id="database-activation" class="activation" x="377.9" y="313" width="10" height="262"/>
  <!-- Repeated participant boxes preserve the reference’s top and bottom alignment. -->
  <rect class="actor" x="56.900000000000006" y="10" width="150" height="65" rx="3"/>
  <text x="131.9" y="41.25" text-anchor="middle">Consumer Service<tspan x="131.9" dy="14.5">Instance 1</tspan></text>
  <rect class="actor" x="307.9" y="10" width="150" height="65" rx="3"/>
  <text x="382.9" y="48.5" text-anchor="middle">Database</text>
  <rect class="actor" x="558.9" y="10" width="150" height="65" rx="3"/>
  <text x="633.9" y="41.25" text-anchor="middle">Consumer Service<tspan x="633.9" dy="14.5">Instance 2</tspan></text>
  <rect class="actor" x="56.900000000000006" y="594.9" width="150" height="65" rx="3"/>
  <text x="131.9" y="626.15" text-anchor="middle">Consumer Service<tspan x="131.9" dy="14.5">Instance 1</tspan></text>
  <rect class="actor" x="307.9" y="594.9" width="150" height="65" rx="3"/>
  <text x="382.9" y="633.4" text-anchor="middle">Database</text>
  <rect class="actor" x="558.9" y="594.9" width="150" height="65" rx="3"/>
  <text x="633.9" y="626.15" text-anchor="middle">Consumer Service<tspan x="633.9" dy="14.5">Instance 2</tspan></text>
  <!-- Notes over activation bars mark transaction boundaries. -->
  <rect class="note" x="56.900000000000006" y="85" width="150" height="36"/>
  <text class="note-label" x="131.9" y="107.75" text-anchor="middle">Begin DB transaction</text>
  <rect class="note" x="558.9" y="227" width="150" height="36"/>
  <text class="note-label" x="633.9" y="249.75" text-anchor="middle">Begin DB transaction</text>
  <text class="message" x="259.9" y="156" text-anchor="middle">saveAndFlush(messageId)</text>
  <path class="shaft" data-connector="true" d="M136.9 169 H375.9"/>
  <path d="M382.9 169 l-10 -5 v10 Z" fill="#333"/>
  <text class="message" x="259.9" y="204" text-anchor="middle">write</text>
  <path class="shaft" data-connector="true" d="M136.9 217 H375.9"/>
  <path d="M382.9 217 l-10 -5 v10 Z" fill="#333"/>
  <text class="message" x="505.9" y="298" text-anchor="middle">saveAndFlush(messageId)</text>
  <path class="shaft" data-connector="true" d="M628.9 311 H389.9"/>
  <path d="M382.9 311 l10 -5 v10 Z" fill="#333"/>
  <rect class="note" x="307.9" y="321" width="150" height="36"/>
  <text class="note-label" x="382.9" y="343.75" text-anchor="middle">Wait to acquire lock</text>
  <!-- Self-call curves return to the outer activation edge; each shaft ends beneath its head. -->
  <text class="message" x="136.9" y="392" text-anchor="middle">Other event processing</text>
  <path class="shaft" data-connector="true" d="M136.9 405 C196.9 395 196.9 435 143.9 425"/>
  <path d="M136.9 425 l10 -4.5 -1.5 9 Z" fill="#333"/>
  <rect class="note" x="49.900000000000006" y="445" width="164" height="36"/>
  <text class="note-label" x="131.9" y="467.75" text-anchor="middle">Commit DB transaction</text>
  <!-- The dashed database response reports the uniqueness conflict after the first commit. -->
  <rect class="note" x="299.9" y="491" width="166" height="36"/>
  <text class="note-label" x="382.9" y="513.75" text-anchor="middle">Transaction rolled back</text>
  <text class="message" x="508.4" y="562" text-anchor="middle">constraint violation</text>
  <path class="shaft" data-connector="true" d="M387.9 575 H621.9" stroke-dasharray="3 3"/>
  <path d="M628.9 575 l-10 -5 v10 Z" fill="#333"/>
  <!-- Source: https://www.lydtechconsulting.com/blog/kafka-idempotent-consumer-transactional-outbox ; etalon: idempotent-consumer-flush-lock.png. -->
</svg>
