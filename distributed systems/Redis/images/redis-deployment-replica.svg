</defs>
<rect y="30" width="320" height="175" fill="#fff"/>

<!-- Adapted title names replication without implying automatic failover. -->
<text id="replica-title" x="160" y="64" font-size="22" text-anchor="middle">Redis: primary + replica</text>
<!-- Primary and replica share identical Redis geometry; face and side colors identify their roles. -->
<use id="primary-redis" href="#redis-red" x="38" y="86.5" width="74.5" height="63.823"/>
<use id="replica-redis" href="#redis-yellow" x="197" y="85.5" width="74.5" height="63.823"/>
<!-- Primary-to-replica replication arrow; its open hand-drawn head joins the shaft cleanly. -->
<path id="replication-arrow" data-connector="true" d="M130 117.7 Q154 118.6 179.7 116.8" fill="none" stroke="#293949" stroke-width="3.3" stroke-linecap="round"/>
<path id="replication-arrowhead" d="M172.2 112.6 L179.7 116.8 L173.2 121.8" fill="none" stroke="#293949" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Direct arrow caption keeps the longer role names clear below their icons. -->
<text id="replication-label" x="155" y="101" font-size="12" text-anchor="middle">async copy</text>
<text id="primary-label" x="75" y="174" font-size="22" text-anchor="middle">Primary</text>
<text id="replica-label" x="234" y="174" font-size="22" text-anchor="middle">Replica</text>
<!-- The deployment limitation belongs to the diagram itself. -->
<text id="failover-note" x="160" y="196" font-size="12" text-anchor="middle">No automatic failover</text>
</svg>
