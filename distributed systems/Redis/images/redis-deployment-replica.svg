      <path fill="#fff" d="M80.4 26.1l-10.8 1.2-2.5 5.8-3.9-6.5-12.5-1.1 9.3-3.4-2.8-5.2 8.8 3.4 8.2-2.7L72 23z"/>
      <path fill="#fff" d="M66.5 54.5l-20.3-8.4 29.1-4.4z"/>
      <ellipse fill="#fff" cx="38.4" cy="35.4" rx="15.5" ry="6"/>
      <path fill="#806018" d="M93.3 27.7l17.2 6.8-17.2 6.8z"/>
