<svg xmlns="http://www.w3.org/2000/svg" width="320" height="175" viewBox="0 30 320 175" role="img" aria-labelledby="title desc">
<title id="title">Redis primary and replica</title>
<desc id="desc">A Redis primary asynchronously copies its dataset to a replica. The arrow points from primary to replica. Replication alone does not provide automatic failover.</desc>
<!-- Shared typography and Redis symbols for the compact, borderless replication diagram. -->
<defs>
<style>text { fill: #24313e; font-family: "Comic Sans MS", "Chalkboard", sans-serif; }</style>
<!-- Redis mark copied from system design/16. Proximity Service/images/final-design.svg.
     Geometry is the MIT-licensed Devicon redis-original icon (github.com/devicons/devicon,
     icons/redis/redis-original.svg). Preserve its native aspect ratio; colors distinguish
     red primaries from yellow replicas. Each diagram embeds its own complete symbols. -->
<symbol id="redis-red" viewBox="1.2 10.2 125.6 107.6">
      <path fill="#b30001" d="M121.8 93.1c-6.7 3.5-41.4 17.7-48.8 21.6-7.4 3.9-11.5 3.8-17.3 1S13 98.1 6.3 94.9c-3.3-1.6-5-2.9-5-4.2V78s48-10.5 55.8-13.2c7.8-2.8 10.4-2.9 17-.5s46.1 9.5 52.6 11.9v12.5c0 1.3-1.5 2.7-4.9 4.4z"/>
