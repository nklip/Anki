<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1020" height="630" fill="#fff"/>
<!-- Three parallel alternatives; each column is a separate example, not a sequence across columns. -->
<text x="510" y="36" font-size="26" text-anchor="middle" font-weight="700">Three ways to update a shared counter</text>
<text x="510" y="68" font-size="17" text-anchor="middle">Each case starts at views:42 = 10. Backends A and B each need to add one view.</text>
<text x="180" y="117" font-size="22" text-anchor="middle">Unprotected read</text>
<text x="180" y="151" font-size="17" text-anchor="middle">1. A reads 10; calculates 11.</text>
<text x="180" y="176" font-size="17" text-anchor="middle">2. B increments Redis to 11.</text>
<!-- backend-a-0: application service -->
<rect id="backend-a-0" class="box" x="50" y="199" width="260" height="100"/>
<text x="180.0" y="230" font-size="22" text-anchor="middle">Backend A</text>
<text x="180.0" y="257" font-size="17" text-anchor="middle">MULTI · SET views:42 11</text>
<text x="180.0" y="280" font-size="17" text-anchor="middle">EXEC</text>
<path id="command-0" class="flow" d="M180 299 L180 350.5"/>
<text x="194" y="330" font-size="16" text-anchor="start">stale write</text>
<use id="redis-0" href="#redis-red" x="137" y="360" width="86" height="73.6752"/>
<text x="180" y="468" font-size="22" text-anchor="middle">views:42 = 11</text>
<text x="180" y="505" font-size="17" text-anchor="middle">One increment is lost.</text>
<text x="180" y="530" font-size="17" text-anchor="middle">The earlier read was unprotected.</text>
<text x="510" y="117" font-size="22" text-anchor="middle">WATCH before the read</text>
<text x="510" y="151" font-size="17" text-anchor="middle">1. A: WATCH, then GET → 10.</text>
<text x="510" y="176" font-size="17" text-anchor="middle">2. B increments Redis to 11.</text>
<!-- backend-a-1: application service -->
<rect id="backend-a-1" class="box" x="380" y="199" width="260" height="100"/>
<text x="510.0" y="230" font-size="22" text-anchor="middle">Backend A</text>
<text x="510.0" y="257" font-size="17" text-anchor="middle">MULTI · SET views:42 11</text>
<text x="510.0" y="280" font-size="17" text-anchor="middle">EXEC</text>
<path id="command-1" class="flow" d="M510 299 L510 350.5"/>
<text x="524" y="330" font-size="16" text-anchor="start">EXEC → null</text>
<use id="redis-1" href="#redis-red" x="467" y="360" width="86" height="73.6752"/>
<text x="510" y="468" font-size="22" text-anchor="middle">views:42 = 11</text>
<text x="510" y="505" font-size="17" text-anchor="middle">A’s queued SET does not run.</text>
<text x="510" y="530" font-size="17" text-anchor="middle">A must reread and retry.</text>
<text x="840" y="117" font-size="22" text-anchor="middle">Direct INCR</text>
<text x="840" y="151" font-size="17" text-anchor="middle">1. B increments Redis to 11.</text>
<text x="840" y="176" font-size="17" text-anchor="middle">2. A sends an increment.</text>
<!-- backend-a-2: application service -->
<rect id="backend-a-2" class="box" x="710" y="199" width="260" height="100"/>
<text x="840.0" y="230" font-size="22" text-anchor="middle">Backend A</text>
<text x="840.0" y="257" font-size="17" text-anchor="middle">INCR views:42</text>
<text x="840.0" y="280" font-size="17" text-anchor="middle">Uses the current value</text>
<path id="command-2" class="flow" d="M840 299 L840 350.5"/>
<text x="854" y="330" font-size="16" text-anchor="start">atomic INCR</text>
<use id="redis-2" href="#redis-red" x="797" y="360" width="86" height="73.6752"/>
<text x="840" y="468" font-size="22" text-anchor="middle">views:42 = 12</text>
<text x="840" y="505" font-size="17" text-anchor="middle">Both increments are counted.</text>
<text x="840" y="530" font-size="17" text-anchor="middle">No WATCH is needed.</text>
<!-- The shared conclusion distinguishes transaction execution from protection of a prior read. -->
<text x="510" y="580" font-size="17" text-anchor="middle">MULTI isolates queued execution; it does not protect an earlier read.</text>
<text x="510" y="606" font-size="17" text-anchor="middle">WATCH detects changes. INCR updates the current Redis value atomically.</text>
</svg>
