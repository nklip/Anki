<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="630" viewBox="0 0 1020 630" role="img" aria-labelledby="title desc">
<title id="title">Three ways to update a shared counter</title><desc id="desc">Three independent cases start at views:42 equal to ten. Unprotected application reads lose an increment; WATCH aborts a stale transaction; direct INCR counts both updates.</desc>
