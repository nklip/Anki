<rect y="15" width="330" height="380" fill="#ffffff"/>
<!-- Deployment title and consistent primary/replica role labels. -->
<g transform="translate(175 0) scale(.83 1)"><text x="0" y="77" font-size="30" text-anchor="middle" class="" >Redis Sentinel</text>
</g>
<text x="21" y="131" font-size="16" text-anchor="start" class="" >Sentinel nodes</text>
<g transform="translate(204 0) scale(.86 1)"><text x="0" y="165" font-size="21" text-anchor="middle" class="" >Primary</text>
</g><!-- Monitoring, from the first Sentinel to each data server; the lower sentinels repeat this relationship. -->
<path id="sentinel-monitor-primary" class="line" data-connector="true" d="M108 171 L169 206" stroke-width="2.5" stroke-dasharray="5 8"/><path id="sentinel-monitor-replica-1" class="line" data-connector="true" d="M106 193 L155 245" stroke-width="2.5" stroke-dasharray="5 8"/><path id="sentinel-monitor-replica-2" class="line" data-connector="true" d="M110 185 L218 254" stroke-width="2.5" stroke-dasharray="5 8"/><!-- Solid arrows carry primary replication; open sketch arrowheads finish before the replica icons. -->
<path id="primary-replication-left" class="line" data-connector="true" d="M181 229 Q178 239 174 250" stroke-width="2.6"/><path id="replication-left-head" class="line" d="M173 241 L173 251 L181 246" stroke-width="2.6"/><path id="primary-replication-right" class="line" data-connector="true" d="M225 229 Q227 237 232 250" stroke-width="2.6"/><path id="replication-right-head" class="line" d="M225 244 L232 250 L234 241" stroke-width="2.6"/><text x="245" y="209" font-size="12" text-anchor="start" class="" >replication</text>
<path id="replication-annotation" class="line" data-connector="true" d="M266 218 Q263 232 240 236" stroke-width="2.6"/><path id="annotation-head" class="line" d="M247 229 L240 236 L252 238" stroke-width="2.6"/><!-- Reused Redis marks; Sentinels are grey, the primary is red, and replicas are yellow. -->
<use id="sentinel-1" href="#redis-grey" x="38" y="143" width="64" height="54.8280"/>
<use id="sentinel-2" href="#redis-grey" x="38" y="207" width="64" height="54.8280"/>
<use id="sentinel-3" href="#redis-grey" x="38" y="279" width="64" height="54.8280"/>
<use id="primary" href="#redis-red" x="171" y="178" width="64" height="54.8280"/>
<use id="replica-1" href="#redis-yellow" x="127" y="253" width="64" height="54.8280"/>
<use id="replica-2" href="#redis-yellow" x="216" y="255" width="64" height="54.8280"/>
<!-- Sentinel numbers sit beside grey nodes, separate from the numbered replica labels. -->
<text id="sentinel-1-label" x="22" y="180" font-size="16" text-anchor="middle">1</text>
<text id="sentinel-2-label" x="22" y="244" font-size="16" text-anchor="middle">2</text>
<text id="sentinel-3-label" x="22" y="316" font-size="16" text-anchor="middle">3</text>
<text id="replica-1-label" x="159" y="331" font-size="15" text-anchor="middle">Replica 1</text>
<text id="replica-2-label" x="247" y="331" font-size="15" text-anchor="middle">Replica 2</text>
<!-- The legend makes partial monitoring lines and the failover role explicit. -->
<text id="monitoring-legend" x="165" y="363" font-size="11" text-anchor="middle">Dashed: monitoring (links from node 1 shown)</text>
<text id="failover-note" x="165" y="383" font-size="12" text-anchor="middle">Sentinels coordinate automatic failover</text>
</svg>
