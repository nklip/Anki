<svg xmlns="http://www.w3.org/2000/svg" width="330" height="380" viewBox="0 15 330 380" role="img" aria-labelledby="title desc">
<title id="title">Redis Sentinel deployment</title><desc id="desc">Three numbered Sentinel processes monitor a primary Redis server and its two replicas and coordinate automatic failover. Dashed lines are monitoring; solid arrows copy primary data to replicas. Only Sentinel 1's monitoring lines are drawn for clarity. Sentinel numbers and replica numbers identify different roles.</desc>
