<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="550" fill="#fff"/>
<!-- Title and reading direction: user, trusted service, shared Redis data. -->
<text x="500" y="37" font-size="26" text-anchor="middle" font-weight="bold">Rate limiting: share one quota across gateways</text>
<text x="500" y="69" font-size="18" text-anchor="middle">A short Redis script updates the counter and expiry atomically, then returns a decision.</text>
<use id="requesting-user" href="#person" x="78" y="163" width="72" height="72.0000"/>
<text x="114" y="264" font-size="22" text-anchor="middle">API user</text>
<!-- application: application service -->
<rect id="application" class="box" x="390" y="141" width="230" height="121"/>
<text x="505.0" y="172" font-size="22" text-anchor="middle">API gateway</text>
<text x="505.0" y="199" font-size="17" text-anchor="middle">Uses the shared quota</text>
<text x="505.0" y="222" font-size="17" text-anchor="middle">Enforces the decision</text>
<use id="shared-redis" href="#redis-red" x="839" y="168" width="98" height="83.9554"/>
<text x="888" y="283" font-size="22" text-anchor="middle">Redis</text>
<!-- Request and response lanes remain outside every node label. -->
<path id="user-request" class="flow" d="M158 184 L387.5 184"/>
<text x="274" y="166" font-size="18" text-anchor="middle">API request</text>
<path id="user-response" class="flow" d="M390 232 L160.5 232"/>
<text x="274" y="217" font-size="18" text-anchor="middle">result / HTTP 429</text>
<path id="redis-command" class="flow" d="M620 184 L831.5 184"/>
<text x="725" y="166" font-size="18" text-anchor="middle">Lua script</text>
<path id="redis-response" class="flow" d="M834 233 L622.5 233"/>
<text x="725" y="216" font-size="18" text-anchor="middle">allow / deny</text>
<text x="888" y="311" font-size="18" text-anchor="middle">rate:user7:minute</text>
<text x="888" y="337" font-size="18" text-anchor="middle">count: 24</text>
<text x="888" y="363" font-size="18" text-anchor="middle">expires in: 45 s</text>
<!-- backend-service: application service -->
<rect id="backend-service" class="box" x="390" y="355" width="230" height="90"/>
<text x="505.0" y="386" font-size="22" text-anchor="middle">Backend service</text>
<text x="505.0" y="413" font-size="17" text-anchor="middle">Allowed requests only</text>
<path id="allowed-request" class="flow" d="M479 262 L479 352.5"/>
<text x="460" y="313" font-size="17" text-anchor="end">Allowed only</text>
<path id="backend-result" class="flow" d="M533 355 L533 264.5"/>
<text x="550" y="333" font-size="17" text-anchor="start">result</text>
<text x="58" y="322" font-size="17" text-anchor="start">Quota: 100 requests / minute.</text>
<text x="58" y="350" font-size="17" text-anchor="start">Over limit: HTTP 429.</text>
<text x="58" y="399" font-size="16" text-anchor="start">Atomic: no other request</text>
<text x="58" y="423" font-size="16" text-anchor="start">interleaves counter + expiry.</text>
<!-- Data placement and the main correctness caveat; no decorative note panel. -->
<text x="500" y="513" font-size="16" text-anchor="middle">Redis: short-lived counters or tokens.  CDN: public assets; never the shared mutable quota.</text>
<text x="500" y="537" font-size="16" text-anchor="middle">Fixed windows allow boundary bursts. Define what the gateway does when Redis is unavailable.</text>
</svg>
