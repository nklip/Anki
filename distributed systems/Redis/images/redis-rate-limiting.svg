<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Rate limiting: share one quota across gateways</title><desc id="desc">An API user sends a request to a gateway. A short Lua script in Redis atomically updates the shared per-user window counter and expiry, returning allow or deny. The gateway forwards only allowed requests to the backend. Over-limit requests receive HTTP 429.</desc>
