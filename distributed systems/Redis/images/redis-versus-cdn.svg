<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">Redis and CDN serve different parts of a request</title><desc id="desc">A browser requests a public asset through a CDN, whose miss is served by an object origin. Private API requests reach a backend, which reads shared Redis state and authoritative database records. Replies return along the same routes.</desc>
