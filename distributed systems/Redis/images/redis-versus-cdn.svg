<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="670" fill="#fff"/>
<!-- Two user request paths separate public asset delivery from backend application-state access. -->
<text x="500" y="35" font-size="26" text-anchor="middle" font-weight="700">Redis and CDN serve different parts of a request</text>
<text x="500" y="65" font-size="17" text-anchor="middle">Request and lookup paths are shown; replies return along the same routes.</text>
<use id="browser-user" href="#person" x="76" y="230" width="48" height="48.0000"/>
<text x="100" y="309" font-size="22" text-anchor="middle">User</text>
<text x="100" y="335" font-size="17" text-anchor="middle">Browser / app</text>
<!-- cdn: application service -->
<rect id="cdn" class="box" x="345" y="112" width="210" height="100"/>
<text x="450.0" y="143" font-size="22" text-anchor="middle">CDN edge</text>
<text x="450.0" y="170" font-size="17" text-anchor="middle">Public HTTP responses</text>
<text x="450.0" y="193" font-size="17" text-anchor="middle">JS, CSS, images, video</text>
<path id="asset-request" class="flow" d="M100 230 L100 162 L342.5 162"/>
<text x="228" y="144" font-size="18" text-anchor="middle">/app.4f2.js</text>
<use id="object-origin" href="#database" x="810" y="119" width="72" height="76.0909" color="#fff"/>
<text x="846" y="233" font-size="22" text-anchor="middle">Object origin</text>
<text x="846" y="258" font-size="17" text-anchor="middle">Original asset files</text>
<text x="846" y="282" font-size="17" text-anchor="middle">Persistent storage</text>
<path id="cdn-miss" class="flow" d="M555 162 L797.5 162"/>
<text x="680" y="144" font-size="18" text-anchor="middle">on cache miss</text>
<!-- backend: application service -->
<rect id="backend" class="box" x="345" y="330" width="210" height="100"/>
<text x="450.0" y="361" font-size="22" text-anchor="middle">Backend API</text>
<text x="450.0" y="388" font-size="17" text-anchor="middle">Authenticate the user</text>
<text x="450.0" y="411" font-size="17" text-anchor="middle">Build the cart response</text>
<path id="api-request" class="flow" d="M124 253 L200 253 L200 380 L342.5 380"/>
<text x="271" y="362" font-size="18" text-anchor="middle">/api/cart</text>
<use id="redis-app-state" href="#redis-red" x="810" y="353" width="72" height="61.6815"/>
<text x="846" y="451" font-size="22" text-anchor="middle">Redis</text>
<text x="846" y="477" font-size="17" text-anchor="middle">cart:42 · session:abc</text>
<path id="redis-lookup" class="flow" d="M555 384 L797.5 384"/>
<text x="680" y="366" font-size="18" text-anchor="middle">GET cart / session</text>
<use id="durable-database" href="#database" x="810" y="513" width="72" height="76.0909" color="#fff"/>
<text x="846" y="617" font-size="22" text-anchor="middle">Database</text>
<text x="846" y="642" font-size="17" text-anchor="middle">Accounts, orders, payments</text>
<path id="durable-read-write" class="flow" d="M455 430 L455 553 L797.5 553"/>
<text x="641" y="535" font-size="17" text-anchor="middle">authoritative read / write</text>
<!-- Placement guidance stays next to the system paths without a decorative panel. -->
<text x="40" y="475" font-size="17" text-anchor="start">Redis: small, mutable backend state.</text>
<text x="40" y="501" font-size="17" text-anchor="start">CDN: reusable HTTP responses / files.</text>
<text x="40" y="527" font-size="17" text-anchor="start">Private responses need cache controls.</text>
<text x="40" y="594" font-size="17" text-anchor="start">CDN = content delivery network.</text>
<text x="40" y="620" font-size="17" text-anchor="start">The API accesses Redis; the browser does not.</text>
</svg>
