     Exact geometry from the MIT-licensed Devicon redis-original icon
     (github.com/devicons/devicon, icons/redis/redis-original.svg).
     Red preserves the source palette; yellow identifies replicas and grey identifies Sentinels.
     The native artwork viewBox and aspect ratio are preserved in every instance. -->
