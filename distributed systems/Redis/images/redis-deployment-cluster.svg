<rect y="25" width="416" height="300" fill="#ffffff"/>
<g transform="translate(198 0) scale(.86 1)"><text x="0" y="62" font-size="21" text-anchor="middle" class="" >Redis Cluster</text>
</g><text x="91" y="79" font-size="12" text-anchor="middle" class="" >read/write</text>
<text x="220" y="84" font-size="11" text-anchor="middle" class="" >async replication</text>
<text x="331" y="78" font-size="11" text-anchor="middle" class="" >optional reads</text>
