<svg xmlns="http://www.w3.org/2000/svg" width="416" height="300" viewBox="0 25 416 300" role="img" aria-labelledby="title desc">
<title id="title">Redis Cluster deployment</title><desc id="desc">Three primary servers, Primary 1, Primary 2, and Primary 3, each hold a shard and asynchronously copy it to the corresponding Replica 1, Replica 2, or Replica 3. Cluster-aware clients route reads and writes to the primary owning the key; optional replica reads can lag. Dashed cross-node lines illustrate cluster communication, including gossip, while solid primary-to-replica arrows show data replication.</desc>
<!-- Adapted role names and captions retain the hand-drawn deployment style. -->
<defs><style>text { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; fill: #273443; } .line {fill:none;stroke:#273443;stroke-linecap:round;stroke-linejoin:round}</style>
