<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="750" fill="#fff"/>
<!-- Title and reading cue; topology starts with the user at the left. -->
<text x="500" y="40" font-size="26" text-anchor="middle" font-weight="bold">Short leases: reduce duplicate cache rebuilds</text>
<text x="500" y="70" font-size="18" text-anchor="middle">A temporary Redis lease reduces repeated work; pauses or failover can still allow overlap.</text>
<!-- Concurrent report requests compete for one short-lived lease. -->
<use id="report-user" href="#person" x="72" y="132" width="68" height="68.0000"/>
<text x="106" y="230" font-size="22" text-anchor="middle">Users</text>
<!-- backend-workers: application service -->
<rect id="backend-workers" class="box" x="350" y="125" width="240" height="105"/>
<text x="470.0" y="156" font-size="22" text-anchor="middle">Backend workers</text>
<text x="470.0" y="183" font-size="17" text-anchor="middle">Many cache misses</text>
<text x="470.0" y="206" font-size="17" text-anchor="middle">Try a short lease</text>
<use id="lease-redis" href="#redis-red" x="817" y="130" width="76" height="65.1083"/>
<text x="855" y="229" font-size="22" text-anchor="middle">Redis lease</text>
<text x="855" y="254" font-size="17" text-anchor="middle">lock:report → unique token</text>
<text x="855" y="277" font-size="17" text-anchor="middle">NX: absent only; PX: 30 s</text>
<path id="request-report" class="flow" d="M145 166 L347.5 166"/>
<text x="247" y="144" font-size="17" text-anchor="middle">GET /reports/42</text>
<path id="return-summary-to-users" class="flow" d="M350 197 L147.5 197"/>
<text x="247" y="220" font-size="17" text-anchor="middle">summary</text>
<path id="acquire-lease" class="flow" d="M590 166 L812.5 166"/>
<text x="702" y="143" font-size="17" text-anchor="middle">SET NX PX 30000</text>
<!-- The winner recomputes; other workers wait or retry the cached result. -->
<!-- lease-holder: application service -->
<rect id="lease-holder" class="box" x="350" y="375" width="240" height="115"/>
<text x="470.0" y="406" font-size="22" text-anchor="middle">Lease holder</text>
<text x="470.0" y="433" font-size="17" text-anchor="middle">Read and recompute</text>
<text x="470.0" y="456" font-size="17" text-anchor="middle">Token-checked release</text>
<path id="lease-acquired" class="flow" d="M817 180 L735 180 L735 320 L470 320 L470 372.5"/>
<text x="610" y="302" font-size="17" text-anchor="middle">lease acquired</text>
<use id="report-inputs" href="#database" x="817" y="377" width="76" height="80.3182" color="#fff"/>
<text x="855" y="492" font-size="22" text-anchor="middle">Database</text>
<text x="855" y="517" font-size="17" text-anchor="middle">Authoritative report inputs</text>
<path id="read-input-data" class="flow" d="M815 419 L592.5 419"/>
<text x="702" y="397" font-size="18" text-anchor="middle">read inputs</text>
<use id="summary-redis" href="#redis-red" x="68" y="380" width="76" height="65.1083"/>
<text x="106" y="482" font-size="22" text-anchor="middle">Redis cache</text>
<text x="106" y="507" font-size="17" text-anchor="middle">report:42 → summary</text>
<text x="106" y="530" font-size="17" text-anchor="middle">Rebuildable; short TTL</text>
<path id="save-cached-summary" class="flow" d="M350 419 L148.5 419"/>
<text x="247" y="397" font-size="18" text-anchor="middle">cache summary</text>
<path id="return-summary-via-api" class="flow" d="M106 378 L106 319 L380 319 L380 232.5"/>
<text x="242" y="299" font-size="17" text-anchor="middle">cached summary</text>
<!-- Large generated files are stored as objects and delivered through the CDN. -->
<use id="file-user" href="#person" x="72" y="588" width="68" height="68.0000"/>
<text x="106" y="682" font-size="22" text-anchor="middle">Users</text>
<!-- report-file-cdn: application service -->
<rect id="report-file-cdn" class="box" x="350" y="580" width="240" height="80"/>
<text x="470.0" y="611" font-size="22" text-anchor="middle">CDN</text>
<text x="470.0" y="638" font-size="17" text-anchor="middle">Generated report files</text>
<use id="report-file-storage" href="#database" x="820" y="580" width="70" height="73.9773" color="#fff"/>
<text x="855" y="682" font-size="22" text-anchor="middle">Object storage</text>
<path id="origin-report-file" class="flow" d="M818 618 L592.5 618"/>
<text x="702" y="597" font-size="18" text-anchor="middle">file bytes</text>
<path id="deliver-report-file" class="flow" d="M350 618 L147.5 618"/>
<text x="247" y="597" font-size="18" text-anchor="middle">download</text>
<!-- A random lease token identifies ownership but does not provide fencing. -->
<text x="500" y="716" font-size="16" text-anchor="middle">Release only by an atomic token check + delete. Others wait, retry the cache, or use allowed stale data.</text>
<text x="500" y="740" font-size="16" text-anchor="middle">Expiry or failover can allow two workers. Tolerate duplicate computation; do not rely on this for invariants.</text>
</svg>
