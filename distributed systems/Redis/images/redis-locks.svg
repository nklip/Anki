<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
<title id="title">Short leases: reduce duplicate cache rebuilds</title><desc id="desc">Users request a missing cached report. Workers compete for a temporary Redis lease. The winner reads durable inputs and writes a derived cached summary. Token-checked release avoids deleting a newer lease, but expiry and failover can still allow overlap.</desc>
