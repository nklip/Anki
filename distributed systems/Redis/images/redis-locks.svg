<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">Short leases: reduce duplicate cache rebuilds</title><desc id="desc">Users request a missing cached report. Backend servers compete for a temporary Redis lease. Parallel arrows show the successful acquisition and the later token-checked release. The selected worker requests database inputs in step 4a, receives them in step 4b, recomputes, and caches the summary. A cloud icon marks optional CDN file delivery. Expiry and failover can still allow overlapping workers.</desc>
<!-- Shared system-design icons: Redis geometry copied from redis-deployment-sentinel.svg,
     originally the MIT-licensed Devicon redis-original icon. Person and database symbols
     are copied from system design/16. Proximity Service/images/final-design.svg. -->
