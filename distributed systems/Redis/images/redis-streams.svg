<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="755" fill="#fff"/>
<!-- Title and reading cue; topology starts with the user at the left. -->
<text x="500" y="40" font-size="26" text-anchor="middle" font-weight="bold">Streams: background exports</text>
<text x="500" y="70" font-size="18" text-anchor="middle">Redis holds small job entries; durable storage holds job outcomes and report bytes.</text>
<!-- User request and stream append. -->
<use id="export-user" href="#person" x="72" y="135" width="68" height="68.0000"/>
<text x="106" y="230" font-size="22" text-anchor="middle">User</text>
<!-- export-api: application service -->
<rect id="export-api" class="box" x="350" y="125" width="240" height="100"/>
<text x="470.0" y="156" font-size="22" text-anchor="middle">Export API</text>
<text x="470.0" y="183" font-size="17" text-anchor="middle">Return job ID + status</text>
<text x="470.0" y="206" font-size="17" text-anchor="middle">Authorize download URL</text>
<use id="export-stream" href="#redis-red" x="817" y="128" width="76" height="65.1083"/>
<text x="855" y="230" font-size="22" text-anchor="middle">Redis Stream</text>
<text x="855" y="255" font-size="17" text-anchor="middle">jobs:exports</text>
<text x="855" y="278" font-size="17" text-anchor="middle">jobId:42, inputRef:obj7</text>
<text x="855" y="301" font-size="17" text-anchor="middle">pending deliveries tracked</text>
<path id="request-export" class="flow" d="M145 165 L347.5 165"/>
<text x="247" y="140" font-size="17" text-anchor="middle">request / poll status</text>
<path id="return-job-status-link" class="flow" d="M350 197 L147.5 197"/>
<text x="247" y="223" font-size="17" text-anchor="middle">job ID / download link</text>
<path id="append-job" class="flow" d="M590 165 L812.5 165"/>
<text x="702" y="144" font-size="18" text-anchor="middle">XADD job 42</text>
<!-- Stream delivery bends around the labels; acknowledgement uses the outer corridor. -->
<!-- export-workers: application service -->
<rect id="export-workers" class="box" x="735" y="395" width="240" height="115"/>
<text x="855.0" y="426" font-size="22" text-anchor="middle">Worker group</text>
<text x="855.0" y="453" font-size="17" text-anchor="middle">export-workers</text>
<text x="855.0" y="476" font-size="17" text-anchor="middle">Process job, then XACK</text>
<path id="read-group-job" class="flow" d="M817 178 L735 178 L735 340 L850 340 L850 392.5"/>
<text x="640" y="305" font-size="17" text-anchor="middle">XREADGROUP</text>
<text x="640" y="328" font-size="17" text-anchor="middle">delivers a job</text>
<path id="ack-after-success" class="flow" d="M975 440 L987 440 L987 168 L897.5 168"/>
<text x="925" y="343" font-size="16" text-anchor="middle">XACK</text>
<text x="925" y="366" font-size="16" text-anchor="middle">after success</text>
<!-- The database owns the durable request and business outcome. -->
<use id="job-database" href="#database" x="412" y="390" width="76" height="80.3182" color="#fff"/>
<text x="450" y="503" font-size="22" text-anchor="middle">Job database</text>
<text x="450" y="527" font-size="17" text-anchor="middle">request + job 42 = ready</text>
<path id="save-request-read-status" class="flow" d="M450 225 L450 386.5"/>
<text x="360" y="300" font-size="17" text-anchor="middle">save request</text>
<text x="360" y="323" font-size="17" text-anchor="middle">read status</text>
<path id="record-outcome" class="flow" d="M735 440 L492.5 440"/>
<text x="610" y="419" font-size="18" text-anchor="middle">record outcome</text>
<!-- Large report bytes move from workers to object storage and through the CDN. -->
<use id="report-storage" href="#database" x="817" y="574" width="76" height="80.3182" color="#fff"/>
<text x="855" y="680" font-size="22" text-anchor="middle">Object storage</text>
<path id="write-report" class="flow" d="M855 510 L855 571.5"/>
<text x="915" y="549" font-size="17" text-anchor="middle">report.pdf</text>
<!-- report-cdn: application service -->
<rect id="report-cdn" class="box" x="350" y="578" width="240" height="80"/>
<text x="470.0" y="609" font-size="22" text-anchor="middle">CDN</text>
<text x="470.0" y="636" font-size="17" text-anchor="middle">Authorized report download</text>
<use id="download-user" href="#person" x="72" y="586" width="68" height="68.0000"/>
<text x="106" y="681" font-size="22" text-anchor="middle">User</text>
<path id="fetch-report-bytes" class="flow" d="M815 615 L592.5 615"/>
<text x="702" y="595" font-size="18" text-anchor="middle">file bytes</text>
<path id="signed-download" class="flow" d="M350 615 L147.5 615"/>
<text x="247" y="593" font-size="18" text-anchor="middle">report bytes</text>
<!-- Pending-work semantics and durability remain visible beneath the data path. -->
<text x="500" y="715" font-size="16" text-anchor="middle">A crash before XACK can repeat work: reclaim pending jobs and make effects idempotent.</text>
<text x="500" y="739" font-size="16" text-anchor="middle">XACK clears pending status, not the stream entry. Define retention and persistence deliberately.</text>
</svg>
