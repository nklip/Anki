<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="990" fill="#fff"/>
<!-- Title and reading cue; topology starts with the user at the left. -->
<text x="500" y="40" font-size="26" text-anchor="middle" font-weight="bold">Streams: background exports</text>
<text x="500" y="70" font-size="18" text-anchor="middle">Redis holds small job entries; durable storage holds job outcomes and report bytes.</text>
<!-- User request and stream append. -->
<use id="export-user" href="#person" x="72" y="135" width="68" height="68.0000"/>
<text x="106" y="230" font-size="22" text-anchor="middle">User</text>
<!-- export-api: application service -->
<rect id="export-api" class="box" x="350" y="125" width="240" height="100"/>
<use id="export-api-icon" href="#backend-server" x="371" y="138" width="30" height="52.5"/>
<text x="502" y="154" font-size="22" text-anchor="middle" font-weight="bold">Export API</text>
<text x="502" y="181" font-size="16" text-anchor="middle">Return job ID + status</text>
<text x="470" y="212" font-size="16" text-anchor="middle">Authorize download URL</text>
<use id="export-stream" href="#redis-red" x="817" y="128" width="76" height="65.1083"/>
<text x="855" y="230" font-size="22" text-anchor="middle">Redis Stream</text>
<text x="855" y="255" font-size="17" text-anchor="middle">jobs:exports</text>
<text x="855" y="278" font-size="17" text-anchor="middle">jobId:42, inputRef:obj7</text>
<text x="855" y="301" font-size="17" text-anchor="middle">pending deliveries tracked</text>
<path id="request-export" class="flow" d="M145 165 L347.5 165"/>
<text x="247" y="140" font-size="17" text-anchor="middle">1. Request export</text>
<path id="return-job-status-link" class="flow" d="M350 197 L147.5 197"/>
<text x="247" y="223" font-size="17" text-anchor="middle">4. Accepted: job ID</text>
<path id="append-job" class="flow" d="M590 165 L812.5 165"/>
<text x="702" y="144" font-size="18" text-anchor="middle">3. XADD job 42</text>
<!-- Stream delivery bends around the labels; acknowledgement uses the outer corridor. -->
<!-- export-workers: application service -->
<rect id="export-workers" class="box" x="735" y="395" width="240" height="115"/>
<use id="export-workers-icon" href="#backend-server-cluster" x="749" y="411" width="66" height="45.6923"/>
<text x="891" y="426" font-size="21" text-anchor="middle" font-weight="bold">Worker group</text>
<text x="891" y="451" font-size="16" text-anchor="middle">export-workers</text>
<text x="855" y="490" font-size="17" text-anchor="middle">Process job, then XACK</text>
<path id="read-group-job" class="flow" d="M817 178 L735 178 L735 340 L850 340 L850 392.5"/>
<text x="640" y="305" font-size="17" text-anchor="middle">5. XREADGROUP</text>
<text x="640" y="328" font-size="17" text-anchor="middle">delivers a job</text>
<path id="ack-after-success" class="flow" d="M975 440 L987 440 L987 168 L897.5 168"/>
<text x="925" y="343" font-size="16" text-anchor="middle">8. XACK</text>
<text x="925" y="366" font-size="16" text-anchor="middle">after success</text>
<!-- The database owns the durable request and business outcome. -->
<use id="job-database" href="#database" x="412" y="390" width="76" height="80.3182" color="#fff"/>
<text x="450" y="503" font-size="22" text-anchor="middle">Job database</text>
<text x="450" y="527" font-size="17" text-anchor="middle">request + job 42 = ready</text>
<path id="save-durable-job" class="flow" d="M450 225 L450 386.5"/>
<text x="360" y="300" font-size="17" text-anchor="middle">2. Save job</text>
<text x="360" y="323" font-size="17" text-anchor="middle">durably</text>
<path id="record-outcome" class="flow" d="M735 440 L492.5 440"/>
<text x="610" y="419" font-size="18" text-anchor="middle">7. Record outcome</text>
<!-- Large report bytes move from workers to object storage and through the CDN. -->
<use id="report-storage" href="#database" x="817" y="574" width="76" height="80.3182" color="#fff"/>
<text x="855" y="680" font-size="22" text-anchor="middle">Object storage</text>
<path id="write-report" class="flow" d="M855 510 L855 571.5"/>
<text x="927" y="549" font-size="16" text-anchor="middle">6. Write report</text>
<!-- report-cdn: application service -->
<rect id="report-cdn" class="box" x="350" y="578" width="240" height="80"/>
<use id="report-cdn-icon" href="#cdn-cloud" x="366" y="591" width="78" height="53.625"/>
<text x="511" y="603" font-size="23" text-anchor="middle" font-weight="bold">CDN</text>
<text x="511" y="625" font-size="16" text-anchor="middle">Authorized</text>
<text x="511" y="646" font-size="16" text-anchor="middle">report download</text>
<use id="download-user" href="#person" x="72" y="586" width="68" height="68.0000"/>
<text x="106" y="681" font-size="22" text-anchor="middle">User</text>
<path id="fetch-report-bytes" class="flow" d="M815 615 L592.5 615"/>
<text x="702" y="595" font-size="18" text-anchor="middle">D1. Origin bytes</text>
<path id="signed-download" class="flow" d="M350 615 L147.5 615"/>
<text x="247" y="593" font-size="18" text-anchor="middle">D2. Report bytes</text>
<!-- Pending-work semantics and durability remain visible beneath the data path. -->
<text x="430" y="554" font-size="16" text-anchor="middle">D: optional download; request omitted. D1 only on CDN miss.</text>
<!-- Optional polling is a separate exchange; its timing is independent of XACK. -->
<text x="500" y="727" font-size="18" text-anchor="middle" font-weight="bold">P: optional status polling, including while workers are still processing</text>
<use id="poll-user" href="#person" x="72" y="775" width="68" height="68"/>
<text x="106" y="883" font-size="22" text-anchor="middle">User</text>
<rect id="poll-api" class="box" x="350" y="765" width="240" height="110"/>
<use id="poll-api-icon" href="#backend-server" x="371" y="780" width="30" height="52.5"/>
<text x="502" y="796" font-size="22" text-anchor="middle" font-weight="bold">Export API</text>
<text x="502" y="823" font-size="16" text-anchor="middle">Check user access</text>
<text x="470" y="857" font-size="17" text-anchor="middle">Link only when ready</text>
<use id="poll-job-database" href="#database" x="817" y="783" width="76" height="80.3182" color="#fff"/>
<text x="855" y="893" font-size="22" text-anchor="middle">Same job DB</text>
<path id="poll-status" class="flow" d="M145 805 L347.5 805"/>
<text x="247" y="783" font-size="17" text-anchor="middle">P1. Poll job 42</text>
<path id="read-durable-status" class="flow" d="M590 818 L812.5 818"/>
<text x="702" y="795" font-size="17" text-anchor="middle">P2. Read status</text>
<path id="return-status-link" class="flow" d="M350 844 L147.5 844"/>
<text x="247" y="871" font-size="17" text-anchor="middle">P3. Status / ready link</text>
<!-- Step 5 may start after 3, without waiting for the accepted response to reach the user. -->
<text x="500" y="933" font-size="16" text-anchor="middle">5–8 run asynchronously after 3. P2 includes the DB reply; polling does not wait for 8.</text>
<text x="500" y="957" font-size="16" text-anchor="middle">A crash before XACK can repeat work: reclaim pending jobs and make effects idempotent.</text>
<text x="500" y="981" font-size="16" text-anchor="middle">XACK clears pending status, not the stream entry. Define retention and persistence deliberately.</text>
</svg>
