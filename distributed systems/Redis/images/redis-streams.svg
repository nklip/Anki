<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-labelledby="title desc">
<title id="title">Streams: background exports</title><desc id="desc">Numbered export flow: save a durable job, append to Redis, and return an accepted job ID. Asynchronously, workers receive the job, write the report, save its durable outcome, and acknowledge. Separate optional polling can run while processing; an authorized download follows readiness.</desc>
