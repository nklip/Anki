<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="755" viewBox="0 0 1000 755" role="img" aria-labelledby="title desc">
<title id="title">Streams: background exports</title><desc id="desc">A user requests an export. The API adds a small job entry to a Redis Stream. A worker group processes the job, saves the outcome and report, and acknowledges only after success. The user gets an authorized download through a CDN.</desc>
