<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">Pub/Sub: live chat notifications</title><desc id="desc">S1 subscribes gateways before publication. Steps 1 to 4 send a message, save history, confirm the database commit, then publish. Step 5 reaches currently subscribed gateways; step 6 pushes to connected users. A1 to A4 are a separate optional attachment request: request the file, fetch from object storage only on a CDN miss, receive origin bytes, then deliver. A cache hit skips A2 and A3.</desc>
