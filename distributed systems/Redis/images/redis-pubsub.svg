<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">Pub/Sub: live chat notifications</title><desc id="desc">A sender calls the chat API. The API commits history to a database and publishes an event to Redis. Subscribed gateways push it to connected users. Attachments are stored durably and delivered through a CDN.</desc>
