      <path d="M0.9 13.75A43.1 8.75 0 0 1 87.1 13.75V82.25A43.1 8.75 0 0 1 0.9 82.25Z" fill="currentColor" stroke="#111" stroke-width="1.6"/>
      <ellipse cx="44" cy="13.75" rx="43.1" ry="8.75" fill="currentColor" stroke="#111" stroke-width="1.6"/>
    </symbol>
<!-- Server and CDN symbols match redis-locks.svg. Cluster/cloud geometry comes from
     system design/14. Youtube/images/message-queue2.svg; the single server comes from
     system design/01. Scaling/images/data-center.svg. -->
<symbol id="backend-server-cluster" viewBox="0 0 130 90">
  <g fill="#63c51b"><rect x="33" y="3" width="34" height="19" rx="2"/><rect x="72" y="3" width="34" height="19" rx="2"/><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g>
  <path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/>
</symbol>
<symbol id="backend-server" viewBox="0 0 64 112">
  <rect width="64" height="112" rx="7" fill="#63c51b"/>
  <path d="M13 18H51M13 82H51M13 96H51" fill="none" stroke="#fff" stroke-width="6"/>
</symbol>
<symbol id="cdn-cloud" viewBox="0 0 160 110">
  <path d="M31 92C12 92 3 79 5 65C6 52 16 44 29 43C31 27 44 18 59 21C68 6 85 5 96 15C107 6 124 12 128 27C143 27 155 39 155 55C155 76 140 92 121 92Z" fill="#75d6ef" stroke="#1677b8" stroke-width="2"/>
  <path d="M79 15L62 54H83L70 91L109 45H90L103 15Z" fill="#fff"/>
</symbol>
<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="710" fill="#fff"/>
<!-- Title and reading cue; topology starts with the user at the left. -->
<text x="500" y="40" font-size="26" text-anchor="middle" font-weight="bold">Pub/Sub: live chat notifications</text>
<text x="500" y="70" font-size="18" text-anchor="middle">The database keeps history; Redis broadcasts to currently connected subscribers.</text>
<!-- Sender, API, and durable message history. -->
<use id="sender" href="#person" x="72" y="123" width="68" height="68.0000"/>
<text x="106" y="217" font-size="22" text-anchor="middle">Sender</text>
<!-- chat-api: application service -->
<rect id="chat-api" class="box" x="350" y="116" width="240" height="100"/>
<use id="chat-api-icon" href="#backend-server" x="371" y="130" width="30" height="52.5"/>
<text x="505" y="145" font-size="22" text-anchor="middle" font-weight="bold">Chat API</text>
<text x="505" y="173" font-size="16" text-anchor="middle">Authorize access</text>
<text x="470" y="203" font-size="16" text-anchor="middle">Save message, then publish</text>
<use id="chat-database" href="#database" x="817" y="110" width="76" height="80.3182" color="#fff"/>
<text x="855" y="223" font-size="22" text-anchor="middle">Chat database</text>
<text x="855" y="250" font-size="17" text-anchor="middle">message 84, room 9</text>
<text x="855" y="273" font-size="17" text-anchor="middle">“Hello” + saved history</text>
<path id="send-message" class="flow" d="M145 165 L347.5 165"/>
<text x="247" y="143" font-size="18" text-anchor="middle">1. send “Hello”</text>
<path id="save-history" class="flow" d="M590 154 L812.5 154"/>
<text x="702" y="134" font-size="17" text-anchor="middle">2. save history</text>
<path id="history-committed" class="flow" d="M815 190 L592.5 190"/>
<text x="702" y="179" font-size="17" text-anchor="middle">3. commit confirmed</text>
<!-- Publication and live fan-out; the route remains below the database labels. -->
<use id="pubsub-redis" href="#redis-red" x="817" y="335" width="76" height="65.1083"/>
<text x="855" y="430" font-size="22" text-anchor="middle">Redis Pub/Sub</text>
<text x="855" y="455" font-size="17" text-anchor="middle">chat:room:9</text>
<text x="855" y="478" font-size="17" text-anchor="middle">{messageId:84}</text>
<!-- gateways: application service -->
<rect id="gateways" class="box" x="350" y="330" width="240" height="100"/>
<use id="gateways-icon" href="#backend-server-cluster" x="367" y="343" width="66" height="45.6923"/>
<text x="509" y="355" font-size="21" text-anchor="middle" font-weight="bold">Gateways</text>
<text x="509" y="380" font-size="16" text-anchor="middle">Forward events</text>
<text x="470" y="414" font-size="16" text-anchor="middle">Subscribed to chat:room:9</text>
<use id="receivers" href="#person" x="72" y="339" width="68" height="68.0000"/>
<text x="106" y="430" font-size="22" text-anchor="middle">Other users</text>
<!-- One direct publish shaft; its endpoint compensates for the marker's 2.5-unit projection. -->
<path id="publish-after-commit" class="flow" d="M470 216 L852.608015 332.273085"/>
<text id="publish-after-commit-label" x="0" y="-14" transform="translate(662.5 274.5) rotate(16.90382)" font-size="17" text-anchor="middle">4. PUBLISH after 3</text>
<!-- Subscription completes before publication; fan-out has its own conditional return lane. -->
<path id="subscribe-before-publication" class="flow" d="M590 350 L812.5 350"/>
<text x="702" y="337" font-size="16" text-anchor="middle">S1. SUBSCRIBE first</text>
<path id="broadcast-event" class="flow" d="M815 394 L592.5 394"/>
<text x="702" y="381" font-size="16" text-anchor="middle">5. event if subscribed</text>
<path id="websocket-delivery" class="flow" d="M350 376 L147.5 376"/>
<text x="247" y="355" font-size="17" text-anchor="middle">6. WebSocket push</text>
<text x="247" y="402" font-size="16" text-anchor="middle">if user connected</text>
<!-- Attachment delivery is an independent optional request; a hit skips both origin lanes. -->
<text x="500" y="507" font-size="16" text-anchor="middle">Optional, independent attachment request: a CDN hit skips A2–A3.</text>
<use id="attachment-user" href="#person" x="72" y="527" width="68" height="68.0000"/>
<text x="106" y="613" font-size="22" text-anchor="middle">Users</text>
<!-- attachment-cdn: application service -->
<rect id="attachment-cdn" class="box" x="350" y="523" width="240" height="70"/>
<use id="attachment-cdn-icon" href="#cdn-cloud" x="366" y="529" width="78" height="53.625"/>
<text x="510" y="545" font-size="23" text-anchor="middle" font-weight="bold">CDN</text>
<text x="510" y="565" font-size="16" text-anchor="middle">Authorized</text>
<text x="510" y="584" font-size="16" text-anchor="middle">attachments</text>
<use id="attachment-storage" href="#database" x="820" y="520" width="70" height="73.9773" color="#fff"/>
<text x="855" y="614" font-size="22" text-anchor="middle">Object storage</text>
<path id="request-attachment" class="flow" d="M145 544 L347.5 544"/>
<text x="247" y="532" font-size="16" text-anchor="middle">A1. request file</text>
<path id="fetch-attachment-on-miss" class="flow" d="M590 544 L815.5 544"/>
<text x="704" y="532" font-size="16" text-anchor="middle">A2. fetch on miss</text>
<path id="origin-attachment-bytes" class="flow" d="M818 581 L592.5 581"/>
<text x="704" y="569" font-size="16" text-anchor="middle">A3. bytes on miss</text>
<path id="deliver-attachment-bytes" class="flow" d="M350 581 L147.5 581"/>
<text x="247" y="569" font-size="16" text-anchor="middle">A4. file bytes</text>
<!-- Failure semantics and recovery, without decorative note panels. -->
<text x="500" y="652" font-size="16" text-anchor="middle">At-most-once: disconnected users can miss events; reload saved history through the API.</text>
<text x="500" y="677" font-size="16" text-anchor="middle">Channels retain no replay history. A DB commit and PUBLISH are separate; an outbox can bridge the gap.</text>
</svg>
