<symbol id="person" viewBox="0 0 54 54"><circle cx="27" cy="12" r="11"/><path d="M3 49V41C3 29 51 29 51 41V49Z"/></symbol>
<symbol id="database" viewBox="0 0 88 93">
      <path d="M0.9 13.75A43.1 8.75 0 0 1 87.1 13.75V82.25A43.1 8.75 0 0 1 0.9 82.25Z" fill="currentColor" stroke="#111" stroke-width="1.6"/>
      <ellipse cx="44" cy="13.75" rx="43.1" ry="8.75" fill="currentColor" stroke="#111" stroke-width="1.6"/>
    </symbol>
<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="710" fill="#fff"/>
<!-- Title and reading cue; topology starts with the user at the left. -->
<text x="500" y="40" font-size="26" text-anchor="middle" font-weight="bold">Pub/Sub: live chat notifications</text>
<text x="500" y="70" font-size="18" text-anchor="middle">The database keeps history; Redis broadcasts to currently connected subscribers.</text>
<!-- Sender, API, and durable message history. -->
<use id="sender" href="#person" x="72" y="123" width="68" height="68.0000"/>
<text x="106" y="217" font-size="22" text-anchor="middle">Sender</text>
<!-- chat-api: application service -->
<rect id="chat-api" class="box" x="350" y="116" width="240" height="100"/>
<text x="470.0" y="147" font-size="22" text-anchor="middle">Chat API</text>
<text x="470.0" y="174" font-size="17" text-anchor="middle">Authorize room access</text>
<text x="470.0" y="197" font-size="17" text-anchor="middle">Save message, then publish</text>
<use id="chat-database" href="#database" x="817" y="110" width="76" height="80.3182" color="#fff"/>
<text x="855" y="223" font-size="22" text-anchor="middle">Chat database</text>
<text x="855" y="250" font-size="17" text-anchor="middle">message 84, room 9</text>
<text x="855" y="273" font-size="17" text-anchor="middle">“Hello” + saved history</text>
<path id="send-message" class="flow" d="M145 165 L347.5 165"/>
<text x="247" y="143" font-size="18" text-anchor="middle">send “Hello”</text>
<path id="save-history" class="flow" d="M590 154 L812.5 154"/>
<text x="702" y="134" font-size="17" text-anchor="middle">commit message 84</text>
<!-- Publication and live fan-out; the route remains below the database labels. -->
<use id="pubsub-redis" href="#redis-red" x="817" y="335" width="76" height="65.1083"/>
<text x="855" y="430" font-size="22" text-anchor="middle">Redis Pub/Sub</text>
<text x="855" y="455" font-size="17" text-anchor="middle">chat:room:9</text>
<text x="855" y="478" font-size="17" text-anchor="middle">{messageId:84}</text>
<!-- gateways: application service -->
<rect id="gateways" class="box" x="350" y="330" width="240" height="100"/>
<text x="470.0" y="361" font-size="22" text-anchor="middle">Gateways</text>
<text x="470.0" y="388" font-size="17" text-anchor="middle">Subscribed to chat:room:9</text>
<text x="470.0" y="411" font-size="17" text-anchor="middle">Forward live events</text>
<use id="receivers" href="#person" x="72" y="339" width="68" height="68.0000"/>
<text x="106" y="430" font-size="22" text-anchor="middle">Other users</text>
<path id="publish-after-commit" class="flow" d="M570 216 L570 315 L855 315 L855 330.5"/>
<text x="719" y="299" font-size="17" text-anchor="middle">PUBLISH after commit</text>
<path id="broadcast-event" class="flow" d="M815 373 L592.5 373"/>
<text x="702" y="351" font-size="18" text-anchor="middle">live event</text>
<path id="websocket-delivery" class="flow" d="M350 376 L147.5 376"/>
<text x="247" y="355" font-size="18" text-anchor="middle">WebSocket</text>
<!-- File bytes use a separate object-storage and CDN path. -->
<use id="attachment-user" href="#person" x="72" y="527" width="68" height="68.0000"/>
<text x="106" y="613" font-size="22" text-anchor="middle">Users</text>
<!-- attachment-cdn: application service -->
<rect id="attachment-cdn" class="box" x="350" y="523" width="240" height="70"/>
<text x="470.0" y="554" font-size="22" text-anchor="middle">CDN</text>
<text x="470.0" y="581" font-size="17" text-anchor="middle">Authorized attachments</text>
<use id="attachment-storage" href="#database" x="820" y="520" width="70" height="73.9773" color="#fff"/>
<text x="855" y="614" font-size="22" text-anchor="middle">Object storage</text>
<path id="origin-attachment-bytes" class="flow" d="M818 556 L592.5 556"/>
<text x="704" y="537" font-size="18" text-anchor="middle">file bytes</text>
<path id="deliver-attachment-bytes" class="flow" d="M350 556 L147.5 556"/>
<text x="247" y="537" font-size="18" text-anchor="middle">attachments</text>
<!-- Failure semantics and recovery, without decorative note panels. -->
<text x="500" y="652" font-size="16" text-anchor="middle">At-most-once: disconnected users can miss events; reload saved history through the API.</text>
<text x="500" y="677" font-size="16" text-anchor="middle">Channels retain no replay history. A DB commit and PUBLISH are separate; an outbox can bridge the gap.</text>
</svg>
