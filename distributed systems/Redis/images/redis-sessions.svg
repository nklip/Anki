<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Shared sessions: any backend can recognize the user</title><desc id="desc">Login steps L1–L6 load and verify account credentials, create a session with expiry after success, and return its opaque cookie. Separate later-request steps R1–R4 read the session and return a private page or request sign-in. A routine request does not repeat login.</desc>
