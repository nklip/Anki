      <path d="M0.9 13.75A43.1 8.75 0 0 1 87.1 13.75V82.25A43.1 8.75 0 0 1 0.9 82.25Z" fill="currentColor" stroke="#111" stroke-width="1.6"/>
      <ellipse cx="44" cy="13.75" rx="43.1" ry="8.75" fill="currentColor" stroke="#111" stroke-width="1.6"/>
    </symbol>
<!-- Green server cluster matches redis-pubsub.svg; geometry comes from
     system design/14. Youtube/images/message-queue2.svg. -->
<symbol id="backend-server-cluster" viewBox="0 0 130 90">
  <g fill="#63c51b"><rect x="33" y="3" width="34" height="19" rx="2"/><rect x="72" y="3" width="34" height="19" rx="2"/><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g>
  <path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/>
</symbol>
<!-- A 2.5-unit nose inset covers the 1.8-unit shaft; connector endpoints compensate for it. -->
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.8}</style>
</defs>
<rect width="1000" height="610" fill="#fff"/>
<!-- The numbered login and later-request flows reuse actors, not one mandatory sequence. -->
<text x="500" y="37" font-size="26" text-anchor="middle" font-weight="bold">Shared sessions: any backend can recognize the user</text>
<text x="500" y="69" font-size="18" text-anchor="middle">An opaque cookie identifies the session; private session fields remain on the server.</text>
<text x="500" y="99" font-size="17" text-anchor="middle">L1–L6 = login.  R1–R4 = each later request.  These are separate flows.</text>
<use id="requesting-user" href="#person" x="78" y="182" width="72" height="72"/>
<text x="114" y="290" font-size="22" text-anchor="middle">Browser</text>
<!-- Shared backend actor performs credential verification before login session creation. -->
<rect id="application" class="box" x="390" y="128" width="230" height="154"/>
<use id="application-icon" href="#backend-server-cluster" x="402" y="143" width="58" height="40.1538"/>
<text x="535" y="160" font-size="21" text-anchor="middle" font-weight="bold">Any backend</text>
<text x="535" y="184" font-size="16" text-anchor="middle">Instance A, B, or C</text>
<text x="505" y="221" font-size="17" text-anchor="middle">L: verifies credentials</text>
<text x="505" y="251" font-size="17" text-anchor="middle">R: checks session expiry</text>
<use id="shared-redis" href="#redis-red" x="839" y="182" width="98" height="83.9554"/>
<text x="888" y="302" font-size="22" text-anchor="middle">Redis</text>
<!-- Each shared lane has distinct L and R labels; no read/create operation is implied. -->
<path id="user-request" class="flow" d="M158 184 L387.5 184"/>
<text x="274" y="144" font-size="17" text-anchor="middle">L1. credentials</text>
<text x="274" y="168" font-size="17" text-anchor="middle">R1. cookie + URL</text>
<path id="user-response" class="flow" d="M390 258 L160.5 258"/>
<text x="274" y="216" font-size="17" text-anchor="middle">L6. session cookie</text>
<text x="274" y="240" font-size="17" text-anchor="middle">R4. page / sign-in</text>
<path id="redis-command" class="flow" d="M620 184 L831.5 184"/>
<text x="725" y="144" font-size="17" text-anchor="middle">L4. create + TTL</text>
<text x="725" y="168" font-size="17" text-anchor="middle">R2. read session</text>
<path id="redis-response" class="flow" d="M834 258 L622.5 258"/>
<text x="725" y="216" font-size="17" text-anchor="middle">L5. stored</text>
<text x="725" y="240" font-size="17" text-anchor="middle">R3. user / absent</text>
<text x="888" y="331" font-size="18" text-anchor="middle">session:&lt;id&gt;</text>
<text x="888" y="357" font-size="18" text-anchor="middle">userId: 7</text>
<text x="888" y="383" font-size="18" text-anchor="middle">expiry + key TTL</text>
<!-- Only login loads the account; a routine request uses the existing Redis session. -->
<use id="durable-database" href="#database" x="466" y="394" width="78" height="82.4318" color="#fff"/>
<text x="505" y="502" font-size="22" text-anchor="middle">Account database</text>
<text x="505" y="524" font-size="17" text-anchor="middle">Permanent account + password hash</text>
<path id="database-request" class="flow" d="M479 282 L479 398"/>
<text x="460" y="346" font-size="17" text-anchor="end">L2. load account</text>
<path id="database-response" class="flow" d="M533 401 L533 284.5"/>
<text x="550" y="368" font-size="17" text-anchor="start">L3. account + hash</text>
<!-- Conditions are required branches, not optional security checks. -->
<text x="58" y="331" font-size="17" text-anchor="start">L4–L6: verified login only.</text>
<text x="58" y="385" font-size="17" text-anchor="start">R4: valid session → page.</text>
<text x="58" y="413" font-size="17" text-anchor="start">Absent / expired → sign-in.</text>
<text x="58" y="462" font-size="16" text-anchor="start">TTL = time to live.</text>
<text x="58" y="487" font-size="16" text-anchor="start">No new login on each request.</text>
<!-- Data placement and lifetime behavior. -->
<text x="500" y="562" font-size="16" text-anchor="middle">Redis: private session fields.  CDN: public assets; never session cookies or private responses.</text>
<text x="500" y="588" font-size="16" text-anchor="middle">Session reads are required here. Optional idle-timeout refresh is omitted. Session loss can log users out.</text>
</svg>
