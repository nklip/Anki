<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1426.470588" viewBox="0 0 1020 970" role="img" aria-labelledby="breaker-title breaker-desc">
  <title id="breaker-title">Circuit breaker: stop new calls when open</title>
  <desc id="breaker-desc">Read top to bottom. The client sends payment 42 through a closed circuit breaker. The payment service commits the payment, but its response is lost. The caller times out and does not know the outcome. Later, after the failure limit is reached, the circuit is open. A retry is rejected before dispatch, and no new request reaches the payment service. The earlier payment remains committed. Resolve the original payment using its stored status or an idempotent retry that prevents duplicate payment.</desc>
  <!-- Restyled from the existing transaction-outcome diagram to match timeout.svg and fallback.svg.
       Preserve the distinction between caller knowledge, admission of new calls, and durable payment state. -->
  <!-- Shared sequence typography, lavender participant headers, and monochrome message arrows. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .title{font-size:26px;font-weight:bold}
      .subtitle{font-size:17px;fill:#444}
      .participant{font-size:19px}
      .message{font-size:18px}
      .note{font-size:17px}
      .header{fill:#e2e2ee;stroke:#666;stroke-width:1}
      .event{fill:#f7f7fb;stroke:#777;stroke-width:1}
      .lifeline{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:6 6}
      .arrow-shaft{fill:none;stroke:#111;stroke-width:1.5}
      .return-shaft{fill:none;stroke:#111;stroke-width:1.5;stroke-dasharray:4 3}
    </style>
    <!-- Human client actor shared with timeout.svg and fallback.svg. -->
    <symbol id="client-actor" viewBox="0 0 44 65">
      <circle cx="22" cy="10" r="9" fill="#e2e2ee" stroke="#666" stroke-width="1"/>
      <path d="M22 19 V43 M6 28 H38 M22 43 L7 62 M22 43 L37 62" fill="none" stroke="#666" stroke-width="1"/>
    </symbol>
  </defs>
  <rect width="1020" height="970" fill="#fff"/>
  <!-- Header establishes the reading direction and the particular lost-response scenario. -->
  <text x="510" y="34" class="title" text-anchor="middle">Circuit breaker: stop new calls when open</text>
  <text x="510" y="63" class="subtitle" text-anchor="middle">Read top to bottom. This payment completes before its reply is lost.</text>
  <!-- Shift the sequence down so the shared human client actor clears the title. -->
  <g id="payment-sequence" transform="translate(0 33)">
  <!-- The client actor and service participants align with their closing labels. -->
  <use id="client-top-actor" href="#client-actor" x="108" y="49" width="44" height="65"/>
  <rect id="breaker-top" class="header" x="420" y="92" width="180" height="44" rx="2"/>
  <rect id="payment-top" class="header" x="800" y="92" width="180" height="44" rx="2"/>
  <text x="130" y="136" class="participant" text-anchor="middle">Client</text>
  <text x="510" y="120" class="participant" text-anchor="middle">Circuit breaker</text>
  <text x="890" y="120" class="participant" text-anchor="middle">Payment service</text>
  <!-- Lifelines stop around event notes so lines never pass through their text.
       The lost return intentionally crosses the breaker lifeline before ending at a loss mark. -->
  <path id="order-lifeline" class="lifeline" d="M130 145V432 M130 494V741"/>
  <path id="breaker-lifeline" class="lifeline" d="M510 136V155 M510 189V520 M510 579V741"/>
  <path id="payment-lifeline" class="lifeline" d="M890 136V309 M890 371V596 M890 704V741"/>
  <!-- Closed admission allows the original payment through. Shafts stop beneath their separate heads. -->
  <rect id="closed-state" class="event" x="410" y="155" width="200" height="34" rx="2"/>
  <text x="510" y="178" class="note" text-anchor="middle">Closed: allow calls</text>
  <text x="320" y="216" class="message" text-anchor="middle">Request payment #42</text>
  <path id="payment-request-shaft" class="arrow-shaft" data-connector="true" d="M130 232H501"/>
  <polygon id="payment-request-head" points="510,232 499,227 499,237" fill="#111"/>
  <text x="700" y="264" class="message" text-anchor="middle">Forward request</text>
  <path id="forward-request-shaft" class="arrow-shaft" data-connector="true" d="M510 280H881"/>
  <polygon id="forward-request-head" points="890,280 879,275 879,285" fill="#111"/>
  <!-- The remote commit precedes the lost reply. Its durable effect must remain visible. -->
  <rect id="payment-committed" class="event" x="780" y="309" width="220" height="62" rx="2"/>
  <text x="890" y="334" class="note" text-anchor="middle">Payment #42 committed</text>
  <text x="890" y="358" class="note" text-anchor="middle">Payment took effect</text>
  <text x="700" y="395" class="message" text-anchor="middle">Reply lost on the network</text>
  <!-- A lost message ends at an X, not at a receiving participant. The solid short join
       meets the loss mark intentionally; there is no delivered-response arrowhead. -->
  <path id="lost-reply-shaft" class="return-shaft" data-connector="true" d="M342 411H890"/>
  <path id="lost-reply-join" class="arrow-shaft" data-connector="true" d="M330 411H344"/>
  <path id="reply-loss-mark" d="M324 405L336 417 M324 417L336 405" fill="none" stroke="#111" stroke-width="1.8"/>
  <rect id="caller-timeout" class="event" x="25" y="432" width="210" height="62" rx="2"/>
  <text x="130" y="457" class="note" text-anchor="middle">Caller times out</text>
  <text x="130" y="481" class="note" text-anchor="middle">Outcome unknown here</text>
  <!-- The later opening is a threshold decision, not an assertion that one timeout always opens a circuit. -->
  <rect id="later-open-state" class="event" x="400" y="520" width="220" height="59" rx="2"/>
  <text x="510" y="544" class="note" text-anchor="middle">Later: circuit is open</text>
  <text x="510" y="567" class="note" text-anchor="middle">Failure limit reached</text>
  <text x="320" y="610" class="message" text-anchor="middle">Retry payment #42</text>
  <path id="retry-request-shaft" class="arrow-shaft" data-connector="true" d="M130 626H501"/>
  <polygon id="retry-request-head" points="510,626 499,621 499,631" fill="#111"/>
  <text x="320" y="668" class="message" text-anchor="middle">Rejected before dispatch</text>
  <!-- Start the dashed return under the head to keep its first dash joined to the head base. -->
  <path id="rejected-retry-shaft" class="return-shaft" data-connector="true" d="M139 684H510"/>
  <polygon id="rejected-retry-head" points="130,684 141,679 141,689" fill="#111"/>
  <!-- There is no arrow from the open breaker to payment; the old commit remains in force. -->
  <rect id="unchanged-payment" class="event" x="780" y="596" width="220" height="108" rx="2"/>
  <text x="890" y="622" class="note" text-anchor="middle">No new request received</text>
  <text x="890" y="655" class="note" text-anchor="middle">Payment #42 remains</text>
  <text x="890" y="679" class="note" text-anchor="middle">committed</text>
  <!-- Repeated participant headers close the sequence in the same style as the other patterns. -->
  <rect id="breaker-bottom" class="header" x="420" y="741" width="180" height="44" rx="2"/>
  <rect id="payment-bottom" class="header" x="800" y="741" width="180" height="44" rx="2"/>
  <text x="130" y="769" class="participant" text-anchor="middle">Client</text>
  <use id="client-bottom-actor" href="#client-actor" x="108" y="780" width="44" height="65"/>
  <text x="510" y="769" class="participant" text-anchor="middle">Circuit breaker</text>
  <text x="890" y="769" class="participant" text-anchor="middle">Payment service</text>
  </g>
  <!-- Preserve the original outcome/recovery distinction without introducing implementation code. -->
  <text x="510" y="914" class="message" text-anchor="middle">Opening the circuit does not undo an earlier payment.</text>
  <text x="510" y="945" class="subtitle" text-anchor="middle">Resolve payment #42 using stored status or an idempotent retry (no duplicate payment).</text>
</svg>
