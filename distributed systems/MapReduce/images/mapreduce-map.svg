<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-labelledby="title desc">
  <title id="title">Map: turn each word into a count of 1</title>
  <desc id="desc">Two map tasks independently read cat dog and cat cat, emitting four word-count pairs.</desc>
  <!-- Shared typography and palette; labels also identify every grouping. -->
  <defs><style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #536174; }
    .heading { font-size: 20px; font-weight: 700; }
    .body { font-size: 23px; }
    .note { font-size: 18px; fill: #536174; }
  </style></defs>
  <!-- Canvas and reading direction. -->
  <rect width="960" height="352" fill="#fff"/>
  <text x="24" y="38" class="title" text-anchor="start">Map: turn each word into a count of 1</text>
  <text x="24" y="70" class="subtitle" text-anchor="start">Read each row left to right: document → map function → key–value pairs.</text>
  <!-- Independent documents and their emitted pairs; each row is a map task. -->
  <rect x="24" y="106" width="350" height="88" rx="12" fill="#f0f6fc" stroke="#a3bed4" stroke-width="2"/>
  <rect x="584" y="106" width="352" height="88" rx="12" fill="#fff6ed" stroke="#dcb588" stroke-width="2"/>
  <text x="44" y="135" class="heading" text-anchor="start">Document A</text>
  <text x="44" y="169" class="body" text-anchor="start">cat dog</text>
  <text x="604" y="135" class="heading" text-anchor="start">Intermediate pairs</text>
  <text x="604" y="169" class="body" text-anchor="start">(cat, 1), (dog, 1)</text>
  <!-- Shaft ends just inside the triangle base; head stops clear of the target. -->
  <path data-connector="true" d="M382 150 L565.00 150.00" fill="none" stroke="#526579" stroke-width="2.5"/><polygon points="576,150 564.00,155.00 564.00,145.00" fill="#526579"/>
  <text x="479" y="130" class="heading" text-anchor="middle">map</text>
  <rect x="24" y="214" width="350" height="88" rx="12" fill="#f0f6fc" stroke="#a3bed4" stroke-width="2"/>
  <rect x="584" y="214" width="352" height="88" rx="12" fill="#fff6ed" stroke="#dcb588" stroke-width="2"/>
  <text x="44" y="243" class="heading" text-anchor="start">Document B</text>
  <text x="44" y="277" class="body" text-anchor="start">cat cat</text>
  <text x="604" y="243" class="heading" text-anchor="start">Intermediate pairs</text>
  <text x="604" y="277" class="body" text-anchor="start">(cat, 1), (cat, 1)</text>
  <!-- Shaft ends just inside the triangle base; head stops clear of the target. -->
  <path data-connector="true" d="M382 258 L565.00 258.00" fill="none" stroke="#526579" stroke-width="2.5"/><polygon points="576,258 564.00,263.00 564.00,253.00" fill="#526579"/>
  <text x="479" y="238" class="heading" text-anchor="middle">map</text>
  <text x="24" y="335" class="note" text-anchor="start">Each emitted 1 means one occurrence. The two rows can run in parallel.</text>
</svg>
