<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="917" viewBox="0 0 1200 917" role="img" aria-labelledby="title desc">
  <title id="title">Sticky sessions pin requests; shared state frees routing</title>
  <desc id="desc">Read each panel from left to right. With sticky sessions, requests 1 and 2 from client session s42 go through the load balancer to server A, which holds the cart locally. Server B lacks that session. If A fails, rerouting to B cannot recover A's local cart. With a stateless application tier, request 1 can go to A and request 2 to B. Both application servers read and write session s42 in a shared session store, such as Redis or a database, so either healthy application server can serve the client.</desc>

  <!-- Reused without shape or palette changes: laptop and server symbols from
       cs/Protocols. HTTP/images/http-request-response.svg. Load-balancer geometry
       from system design/01. Scaling/images/load-balancer.svg is translated into
       a symbol. The shared-storage cylinder is translated from
       system design/01. Scaling/images/stateless.svg. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #475569; }
      .panel-title { font-size: 27px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 20px; fill: #475569; }
      .route-label { font-size: 20px; font-weight: 700; fill: #0b78b5; }
      .note { font-size: 22px; fill: #475569; }
      .frame { fill: #fff; stroke: #08b7d1; stroke-width: 3; }
      .flow { fill: none; stroke: #0b78b5; stroke-width: 3; stroke-linejoin: round; }
      .head { fill: #0b78b5; }
    </style>
    <symbol id="laptop" viewBox="0 0 110 70">
      <rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/>
      <path d="M7 58H103L96 66H14Z" fill="#111"/>
      <rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/>
    </symbol>
    <symbol id="server" viewBox="0 0 64 112">
      <rect width="64" height="112" rx="7" fill="#63c51b"/>
      <path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/>
    </symbol>
    <symbol id="load-balancer" viewBox="0 0 120 98">
      <g transform="translate(-790 -485)">
        <path d="M806 485H894L910 583H790Z" fill="#0b78b5"/>
        <circle cx="850" cy="505" r="7" fill="white"/>
        <path d="M850 513V557M850 530L827 548M850 530L873 548M827 548V561M873 548V561" stroke="white" stroke-width="5" fill="none"/>
      </g>
    </symbol>
    <symbol id="session-store" viewBox="0 0 106 110">
      <g transform="translate(-402 -676)">
        <path d="M405 700C405 687 428 679 455 679S505 687 505 700V765C505 778 482 786 455 786S405 778 405 765Z" fill="#0b78b5"/>
        <ellipse cx="455" cy="700" rx="50" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
        <text x="455" y="753" text-anchor="middle" style="font-size:38px;font-weight:bold;fill:white">{ }</text>
      </g>
    </symbol>
  </defs>

  <!-- One lesson, with two comparable left-to-right request paths. -->
  <rect id="background" width="1200" height="917" fill="#fff"/>
  <text class="title" x="28" y="48">Sticky sessions pin requests; shared state frees routing</text>
  <text class="subtitle" x="28" y="84">Example: requests 1 and 2 belong to the same client session, s42.</text>

  <!-- Sticky panel: keep A and B equally sized and padded; only session state
       and routing differ. B is deliberately unconnected. -->
  <g id="sticky-panel">
    <rect class="frame" x="24" y="112" width="1152" height="370" rx="20"/>
    <text class="panel-title" x="48" y="155">Sticky sessions · send this session back to A</text>
    <use href="#laptop" x="76" y="235" width="110" height="70"/>
    <text class="label" x="131" y="345" text-anchor="middle">Client</text>
    <text class="small" x="131" y="375" text-anchor="middle">Session s42</text>

    <rect class="frame" x="305" y="214" width="200" height="174" rx="17"/>
    <use href="#load-balancer" x="345" y="235" width="120" height="98"/>
    <text class="label" x="405" y="369" text-anchor="middle">Load balancer</text>

    <rect class="frame" x="618" y="181" width="518" height="112" rx="17"/>
    <use href="#server" x="642" y="195" width="48" height="84"/>
    <text class="label" x="717" y="219">Server A</text>
    <text class="small" x="717" y="250">Local session s42:</text>
    <text class="small" x="907" y="250">cart = 1 book</text>

    <rect class="frame" x="618" y="313" width="518" height="112" rx="17"/>
    <use href="#server" x="642" y="327" width="48" height="84"/>
    <text class="label" x="717" y="351">Server B</text>
    <text class="small" x="717" y="382">No local session s42</text>
  </g>

  <!-- Manual arrows: each shaft stops under its own head base. Tips touch only
       the destination frame's outer stroke; request 1 and request 2 both use A. -->
  <g id="sticky-request-flows">
    <text class="route-label" x="242" y="237" text-anchor="middle">1</text>
    <path class="flow" data-connector="true" d="M188 253H291.5"/>
    <polygon class="head" points="303.5,253 289.5,245 289.5,261"/>
    <text class="route-label" x="242" y="325" text-anchor="middle">2</text>
    <path class="flow" data-connector="true" d="M188 289H291.5"/>
    <polygon class="head" points="303.5,289 289.5,281 289.5,297"/>
    <text class="route-label" x="559" y="211" text-anchor="middle">1</text>
    <path class="flow" data-connector="true" d="M506.5 233H604.5"/>
    <polygon class="head" points="616.5,233 602.5,225 602.5,241"/>
    <text class="route-label" x="559" y="302" text-anchor="middle">2</text>
    <path class="flow" data-connector="true" d="M506.5 270H604.5"/>
    <polygon class="head" points="616.5,270 602.5,262 602.5,278"/>
  </g>

  <!-- The failure note separates routing availability from recovery of state. -->
  <text class="note" x="48" y="459">If A fails, rerouting to B cannot recover A’s local cart.</text>

  <!-- Preserve the lower panel's internal geometry and the inter-panel gap
       after adding 21 units to the sticky panel for its equal-sized peers. -->
  <g id="stateless-section" transform="translate(0 21)">
  <!-- Shared-state panel: app servers retain no required local session state. -->
  <g id="stateless-panel">
    <rect class="frame" x="24" y="481" width="1152" height="387" rx="20"/>
    <text class="panel-title" x="48" y="524">Stateless app tier · either server can use the same session</text>
    <use href="#laptop" x="76" y="639" width="110" height="70"/>
    <text class="label" x="131" y="749" text-anchor="middle">Client</text>
    <text class="small" x="131" y="779" text-anchor="middle">Session s42</text>

    <rect class="frame" x="305" y="618" width="200" height="174" rx="17"/>
    <use href="#load-balancer" x="345" y="639" width="120" height="98"/>
    <text class="label" x="405" y="773" text-anchor="middle">Load balancer</text>

    <rect class="frame" x="618" y="569" width="228" height="104" rx="17"/>
    <use href="#server" x="638" y="579" width="48" height="84"/>
    <text class="label" x="706" y="628">Server A</text>

    <rect class="frame" x="618" y="705" width="228" height="104" rx="17"/>
    <use href="#server" x="638" y="715" width="48" height="84"/>
    <text class="label" x="706" y="764">Server B</text>

    <rect class="frame" x="963" y="569" width="189" height="240" rx="17"/>
    <use href="#session-store" x="1004.5" y="590" width="106" height="110"/>
    <text class="label" x="1057.5" y="733" text-anchor="middle">Session store</text>
    <text class="small" x="1057.5" y="762" text-anchor="middle">Redis / database</text>
    <text class="small" x="1057.5" y="790" text-anchor="middle">s42: cart = 1 book</text>
  </g>

  <!-- Request arrows are examples of valid routing, not a required schedule.
       Short horizontal final segments keep all manual arrowheads aligned. -->
  <g id="stateless-request-flows">
    <text class="route-label" x="242" y="641" text-anchor="middle">1</text>
    <path class="flow" data-connector="true" d="M188 657H291.5"/>
    <polygon class="head" points="303.5,657 289.5,649 289.5,665"/>
    <text class="route-label" x="242" y="729" text-anchor="middle">2</text>
    <path class="flow" data-connector="true" d="M188 693H291.5"/>
    <polygon class="head" points="303.5,693 289.5,685 289.5,701"/>
    <text class="route-label" x="559" y="600" text-anchor="middle">1</text>
    <path class="flow" data-connector="true" d="M506.5 650H541L577 621H604.5"/>
    <polygon class="head" points="616.5,621 602.5,613 602.5,629"/>
    <text class="route-label" x="559" y="791" text-anchor="middle">2</text>
    <path class="flow" data-connector="true" d="M506.5 744H541L577 757H604.5"/>
    <polygon class="head" points="616.5,757 602.5,749 602.5,765"/>
  </g>

  <!-- Both server-to-store arrows mean read/write access. The shared store has
       its own lifecycle; this diagram makes no store-availability guarantee. -->
  <g id="shared-state-access">
    <text class="small" x="904.5" y="590" text-anchor="middle">Read /</text>
    <text class="small" x="904.5" y="613" text-anchor="middle">write</text>
    <path class="flow" data-connector="true" d="M847.5 641H949.5"/>
    <polygon class="head" points="961.5,641 947.5,633 947.5,649"/>
    <text class="small" x="904.5" y="735" text-anchor="middle">Read /</text>
    <text class="small" x="904.5" y="758" text-anchor="middle">write</text>
    <path class="flow" data-connector="true" d="M847.5 786H949.5"/>
    <polygon class="head" points="961.5,786 947.5,778 947.5,794"/>
  </g>

  <!-- The outcome names the scope of statelessness: the application tier. -->
  <text class="note" x="48" y="845">State lives in shared storage; any healthy app server can serve the session.</text>
  </g>
</svg>
