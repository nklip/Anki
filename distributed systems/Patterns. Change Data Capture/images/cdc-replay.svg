<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="689" viewBox="0 0 1128 689" role="img" aria-labelledby="title desc">
  <title id="title">At-least-once source delivery may replay a change after a crash</title>
  <desc id="desc">A database update changes product 7 from price 100 to 120 once. Debezium publishes it to Kafka at offset 41, crashes before its source checkpoint is saved, restarts at the earlier saved position, and publishes the same source change at offset 42. Consumers must handle repeat delivery safely.</desc>
  <!-- Source-native symbols reused unchanged from system design/10. Notification System/images/improved-design.svg. -->
  <defs>
    <symbol id="green-server" viewBox="0 0 30 60">
      <rect x="8" y="1" width="14" height="9" rx="1" fill="#65c515"/>
      <path d="M11 5 H19" stroke="#fff" stroke-width="1.5"/>
      <rect x="3" y="12" width="24" height="46" rx="1.5" fill="#65c515"/>
      <path d="M7 19 H23 M7 40 H23 M7 48 H23" stroke="#fff" stroke-width="2"/>
    </symbol>
<symbol id="channel-queue" viewBox="0 0 150 58">
      <path d="M2 2 H135 L148 29 L135 56 H2 Z" fill="#fff" stroke="#1677b8" stroke-width="4"/>
      <g fill="none" stroke="#1677b8" stroke-width="4">
        <rect x="10" y="12" width="36" height="33"/><path d="M10 13 L28 29 L46 13"/>
        <rect x="54" y="12" width="36" height="33"/><path d="M54 13 L72 29 L90 13"/>
        <rect x="98" y="12" width="36" height="33"/><path d="M98 13 L116 29 L134 13"/>
      </g>
    </symbol>
<symbol id="db-cylinder" viewBox="0 0 58 82">
      <rect x="3" y="12" width="52" height="58" fill="#1677b8"/>
      <ellipse cx="29" cy="12" rx="26" ry="10" fill="#1677b8" stroke="#fff" stroke-width="2"/>
      <path d="M3 70 A26 10 0 0 0 55 70" fill="#1677b8"/>
    </symbol>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182633; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; }
      .small { font-size: 16px; fill: #475569; }
      .event { font-size: 17px; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #1677b8; stroke-width: 2.5; }
    </style>
  </defs>
  <!-- White canvas and reading-order header. -->
  <rect width="1128" height="689" fill="#fff"/>
  <text class="title" x="24" y="41">A restart can publish the same source change again</text>
  <text class="subtitle" x="24" y="73">Ordinary at-least-once source delivery: publication and checkpoint saving are separate steps.</text>

  <!-- The database commits once; duplication appears in delivery, not as another database update. -->
  <g id="one-source-change">
    <rect x="24" y="100" width="1080" height="89" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <use href="#db-cylinder" x="47" y="111" width="43" height="62"/>
    <text class="heading" x="112" y="132">One database update</text>
    <text class="label" x="112" y="163">product 7: price 100 → 120</text>
    <text class="small" x="594" y="132">The row is now 120.</text>
    <text class="small" x="594" y="161">The same log change can be read again after a failure.</text>
  </g>

  <!-- Three steps read left to right; connectors stay in the clear gaps between panels. -->
  <g id="publish-before-checkpoint">
    <rect class="panel" x="24" y="222" width="336" height="326" rx="12"/>
    <text class="heading" x="44" y="258">1. Publish to Kafka</text>
    <use href="#green-server" x="46" y="282" width="31" height="62"/>
    <text class="label" x="95" y="307">Debezium reads</text>
    <text class="label" x="95" y="334">the source change.</text>
    <use href="#channel-queue" x="45" y="365" width="82" height="32"/>
    <text class="event" x="143" y="378">Kafka appends</text>
    <text class="event" x="143" y="402">at offset 41.</text>
    <rect x="44" y="425" width="296" height="101" rx="8" fill="#fff7ed" stroke="#dba46b" stroke-width="1.3"/>
    <text class="small" x="59" y="450" font-weight="700">Crash before checkpoint save</text>
    <text class="small" x="59" y="480">The saved source position is</text>
    <text class="small" x="59" y="506">still behind this change.</text>
  </g>
  <!-- Short separate-shaft arrow; nose ends before the next panel. -->
  <path id="restart-arrow" class="flow" d="M366 385 H379"/>
  <path d="M378 379 L389 385 L378 391 Z" fill="#1677b8"/>
  <g id="replay-after-restart">
    <rect class="panel" x="396" y="222" width="336" height="326" rx="12"/>
    <text class="heading" x="416" y="258">2. Restart and replay</text>
    <use href="#green-server" x="418" y="282" width="31" height="62"/>
    <text class="label" x="467" y="307">Resume from the</text>
    <text class="label" x="467" y="334">saved source position.</text>
    <use href="#channel-queue" x="417" y="365" width="82" height="32"/>
    <text class="event" x="515" y="378">Kafka appends</text>
    <text class="event" x="515" y="402">again at offset 42.</text>
    <rect x="416" y="425" width="296" height="101" rx="8" fill="#eef7fd" stroke="#1677b8" stroke-width="1.3"/>
    <text class="small" x="431" y="450" font-weight="700">Same source change</text>
    <text class="small" x="431" y="480">The connector rereads and</text>
    <text class="small" x="431" y="506">republishes the update.</text>
  </g>
  <path id="duplicate-result-arrow" class="flow" d="M738 385 H751"/>
  <path d="M750 379 L761 385 L750 391 Z" fill="#1677b8"/>
  <g id="two-kafka-records">
    <rect class="panel" x="768" y="222" width="336" height="326" rx="12"/>
    <text class="heading" x="788" y="258">3. Two delivered records</text>
    <text class="small" x="788" y="290">One Kafka topic partition</text>
    <rect x="788" y="312" width="296" height="75" rx="8" fill="#eef7fd" stroke="#1677b8" stroke-width="1.3"/>
    <text class="event" x="803" y="340" font-weight="700">offset 41 · key 7 · op u</text>
    <text class="event" x="803" y="367">after.price: 120</text>
    <rect x="788" y="405" width="296" height="75" rx="8" fill="#eef7fd" stroke="#1677b8" stroke-width="1.3"/>
    <text class="event" x="803" y="433" font-weight="700">offset 42 · key 7 · op u</text>
    <text class="event" x="803" y="460">after.price: 120</text>
    <text class="small" x="788" y="514">Different offsets; same source change.</text>
  </g>

  <!-- Outcome explains why application handling matters without promising universal exactly-once delivery. -->
  <g id="consumer-lesson">
    <rect x="24" y="571" width="1080" height="94" rx="12" fill="#f6faf3" stroke="#b4d797" stroke-width="1.5"/>
    <text class="heading" x="44" y="604">Make repeat delivery safe for the consumer.</text>
    <text class="label" x="44" y="637">For example, setting product 7’s price to 120 twice is safe; charging a customer twice is not.</text>
  </g>
</svg>
