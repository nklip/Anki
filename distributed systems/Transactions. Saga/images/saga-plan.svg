<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">The saga plan for transfer tr-42</title>
<desc id="desc">Start, then T1 debits Alice by $1 in database A, then T2 credits Bob by $1 in database B, and the transfer is completed. If T1 is rejected, the saga stops with nothing to undo. If T2 is rejected, the compensating transaction C1 refunds Alice's $1 in database A, and the transfer ends compensated. Each box is one local transaction with its own commit.</desc>
<!-- Visual style follows this folder's black-and-white diagrams and system design/27. Digital Wallet/images/saga.svg: Arial, white boxes, black 2.5-unit outlines, blue check and red cross terminals. -->
<defs><style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}.box{fill:#fff;stroke:#000;stroke-width:2.5}.shaft{fill:none;stroke:#000;stroke-width:2.5}</style>
</defs>
<rect width="1120" height="560" fill="#fff"/>
<!-- Title and reading order. -->
<text x="32" y="43" font-size="28">The saga plan for transfer tr-42</text>
<text x="32" y="77" font-size="18">Forward steps run left to right. A rejected step sends the saga down its failure branch.</text>
<!-- Forward row: Start, T1, T2, Completed. Shafts end 3 units inside their triangle bases; tips meet the next boundary. -->
<g id="forward-row">
<circle id="start" class="box" cx="70" cy="200" r="18"/>
<text x="70" y="250" font-size="20" text-anchor="middle">Start</text>
<rect id="t1-debit" class="box" x="150" y="150" width="260" height="100"/>
<text x="280" y="193" font-size="22" text-anchor="middle">T1 · Debit Alice $1</text>
<text x="280" y="226" font-size="19" text-anchor="middle">database A</text>
<rect id="t2-credit" class="box" x="500" y="150" width="260" height="100"/>
<text x="630" y="193" font-size="22" text-anchor="middle">T2 · Credit Bob $1</text>
<text x="630" y="226" font-size="19" text-anchor="middle">database B</text>
<circle id="completed" class="box" cx="850" cy="200" r="18"/>
<path id="completed-check" d="M839 201 L846 210 L860 187" fill="none" stroke="#0797f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="209" font-size="24">Completed</text>
<path id="start-to-t1-shaft" class="shaft" data-connector="true" d="M88 200 L141 200"/>
<polygon id="start-to-t1-head" points="150,200 138,205.5 138,194.5" fill="#000"/>
<path id="t1-to-t2-shaft" class="shaft" data-connector="true" d="M410 200 L491 200"/>
<polygon id="t1-to-t2-head" points="500,200 488,205.5 488,194.5" fill="#000"/>
<path id="t2-to-completed-shaft" class="shaft" data-connector="true" d="M760 200 L823 200"/>
<polygon id="t2-to-completed-head" points="832,200 820,205.5 820,194.5" fill="#000"/>
</g>
<!-- Failure branch of T1: nothing committed, so nothing to compensate. Label sits right of the shaft. -->
<g id="t1-rejected-branch">
<path id="t1-rejected-shaft" class="shaft" data-connector="true" d="M280 250 L280 393"/>
<polygon id="t1-rejected-head" points="280,402 274.5,390 285.5,390" fill="#000"/>
<text x="294" y="333" font-size="19">rejected</text>
<circle id="stopped" class="box" cx="280" cy="420" r="18"/>
<path id="stopped-cross" d="M270 410 L290 430 M290 410 L270 430" fill="none" stroke="#ff2600" stroke-width="4" stroke-linecap="round"/>
<text x="280" y="470" font-size="20" text-anchor="middle">Stopped: nothing to undo</text>
</g>
<!-- Failure branch of T2: C1 compensates the committed T1 in database A. -->
<g id="t2-rejected-branch">
<path id="t2-rejected-shaft" class="shaft" data-connector="true" d="M630 250 L630 361"/>
<polygon id="t2-rejected-head" points="630,370 624.5,358 635.5,358" fill="#000"/>
<text x="644" y="318" font-size="19">rejected</text>
<rect id="c1-refund" class="box" x="500" y="370" width="260" height="100"/>
<text x="630" y="413" font-size="22" text-anchor="middle">C1 · Refund Alice $1</text>
<text x="630" y="446" font-size="19" text-anchor="middle">database A</text>
<circle id="compensated" class="box" cx="850" cy="420" r="18"/>
<path id="compensated-cross" d="M840 410 L860 430 M860 410 L840 430" fill="none" stroke="#ff2600" stroke-width="4" stroke-linecap="round"/>
<text x="882" y="429" font-size="24">Compensated</text>
<path id="c1-to-compensated-shaft" class="shaft" data-connector="true" d="M760 420 L823 420"/>
<polygon id="c1-to-compensated-head" points="832,420 820,425.5 820,414.5" fill="#000"/>
</g>
<!-- Legend; keep within the bottom safe area. -->
<text x="32" y="528" font-size="18">T = forward local transaction. C = compensating local transaction. Each box commits on its own.</text>
</svg>
