<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-labelledby="title desc">
<title id="title">One local commit records both the effect and the message</title><desc id="desc">In one participant database transaction, record the command identity, debit, result, and outgoing event. A relay publishes committed outbox records to a broker, which delivers them to an idempotent receiver. Retried delivery can duplicate messages.</desc>
<!-- Visual style follows system design/27. Digital Wallet/images/saga.svg: regular Arial, white square boxes, black 2.5-unit outlines and connectors. -->
<defs><style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000}.outline{fill:#fff;stroke:#000;stroke-width:2.5}</style>
</defs>
<rect width="1120" height="416" fill="#fff"/>
<!-- Title, reading direction, and lesson. -->
<text x="32" y="43" font-size="28" text-anchor="start" font-weight="400" style="fill:#000">One local commit records both the effect and the message</text>
<text x="32" y="77" font-size="18" text-anchor="start" font-weight="400" style="fill:#000">Transactional outbox: a durable outgoing record closes the gap between changing data and sending a message.</text>
<!-- The transaction boundary encloses all four records, never the remote broker. -->
<rect id="atomic-local-transaction" x="32" y="114" width="410" height="212" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="237" y="151" font-size="22" text-anchor="middle" font-weight="400" style="fill:#000">Participant database · one commit</text>
<text x="57" y="191" font-size="19" text-anchor="start" font-weight="400" style="fill:#000">Command key: (tr-42, debit-a)</text>
<text x="57" y="226" font-size="19" text-anchor="start" font-weight="400" style="fill:#000">Business change: A − $1</text>
<text x="57" y="261" font-size="19" text-anchor="start" font-weight="400" style="fill:#000">Saved outcome: debit committed</text>
<text x="57" y="296" font-size="19" text-anchor="start" font-weight="400" style="fill:#000">Outbox record: ADebited</text>
<rect id="relay" x="511" y="170" width="155" height="115" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="588.5" y="205.5" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">Relay</text>
<text x="588.5" y="234.5" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">Publish saved</text>
<text x="588.5" y="263.5" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">records</text>
<rect id="broker" x="735" y="170" width="140" height="115" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="805.0" y="220.0" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">Broker</text>
<text x="805.0" y="249.0" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">Deliver</text>
<rect id="receiver" x="944" y="170" width="144" height="115" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="1016.0" y="220.0" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">Receiver</text>
<text x="1016.0" y="249.0" font-size="19" text-anchor="middle" font-weight="400" style="fill:#000">Deduplicate</text>
<!-- All transport arrows use separate heads that meet the next component boundary. -->
<path id="read-outbox-shaft" data-connector="true" d="M442 227 L502 227" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
<polygon id="read-outbox-head" points="511,227 499,232.5 499,221.5" fill="#000"/>
<path id="publish-outbox-shaft" data-connector="true" d="M666 227 L726 227" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
<polygon id="publish-outbox-head" points="735,227 723,232.5 723,221.5" fill="#000"/>
<path id="consume-message-shaft" data-connector="true" d="M875 227 L935 227" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
<polygon id="consume-message-head" points="944,227 932,232.5 932,221.5" fill="#000"/>
<text x="32" y="377" font-size="21" text-anchor="start" font-weight="400" style="fill:#000">A relay crash can cause redelivery. The receiver must prevent a second business effect.</text>
</svg>
