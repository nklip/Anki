<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"
     role="img" aria-labelledby="title desc">
  <title id="title">One order event reaches fulfilment and audit</title>
  <desc id="desc">Checkout publishes OrderCreated for order 42. Its event ID is E17 and its routing key is order.created. Inside RabbitMQ, the orders topic exchange matches the fulfilment.work binding order.created and the audit.work binding order.#. Each queue gets a copy. Worker A receives the fulfilment copy and creates a packing task for order 42. Worker B can take another order. The audit worker records the other copy independently.</desc>

  <!-- Shared type and colours follow the other RabbitMQ diagrams. The marker nose extends
       three units past the shaft endpoint to meet the destination's outer border. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; }
      .title { font-size: 30px; font-weight: 700; }
      .group { font-size: 20px; font-weight: 700; }
      .name { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .key { font-size: 19px; font-weight: 700; fill: #175784; }
      .broker { fill: #f3f8fe; stroke: #7e99b1; stroke-width: 2; }
      .node { fill: #fff; stroke: #697d8f; stroke-width: 1.6; }
      .application { fill: #fff; stroke: #838383; stroke-width: 1.6; }
      .available { fill: #fafafa; stroke: #838383; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .note { fill: #fff4da; stroke: #b7a67d; stroke-width: 1.4; }
      .flow { fill: none; stroke: #263d50; stroke-width: 2.4; }
    </style>
    <marker id="arrowhead" viewBox="0 0 15 14" markerWidth="15" markerHeight="14"
            refX="12" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L15 7 L0 14 Z" fill="#263d50"/>
    </marker>
  </defs>

  <!-- The central boundary distinguishes RabbitMQ's exchange and queues from applications. -->
  <rect width="1100" height="630" fill="#fff"/>
  <text class="title" x="550" y="46" text-anchor="middle">One order event reaches fulfilment and audit</text>
  <text class="body" x="550" y="80" text-anchor="middle">Follow event E17 from the checkout application on the left to the workers on the right.</text>
  <rect class="broker" x="250" y="107" width="544" height="392" rx="12"/>
  <text class="group" x="270" y="141">RabbitMQ broker</text>
  <text class="group" x="25" y="141">Publisher</text>
  <text class="group" x="830" y="141">Consumers</text>

  <!-- The routing key is part of the same publication as the event. -->
  <g id="checkout-publisher">
    <rect class="application" x="25" y="201" width="197" height="222" rx="8"/>
    <text class="name" x="41" y="241">Checkout</text>
    <text class="body" x="41" y="278">OrderCreated</text>
    <text class="body" x="41" y="305">Order 42 · Event E17</text>
    <path d="M41 326 H205" stroke="#c5cbd0"/>
    <text class="body" x="41" y="357">Routing key</text>
    <text class="key" x="41" y="388">order.created</text>
  </g>

  <!-- Keep both queue bindings visible alongside the exchange's branching routes. -->
  <g id="orders-exchange">
    <rect class="node" x="272" y="250" width="190" height="128" rx="8"/>
    <text class="body" x="287" y="281">Topic exchange</text>
    <text class="name" x="287" y="312">orders</text>
    <text class="body" x="287" y="348">Matches the key</text>
  </g>
  <g id="fulfilment-queue">
    <rect class="node" x="516" y="161" width="253" height="125" rx="8"/>
    <text class="body" x="534" y="189">Queue</text>
    <text class="name" x="534" y="220">fulfilment.work</text>
    <text class="body" x="534" y="259">Binding</text>
    <text class="key" x="603" y="259">order.created</text>
  </g>
  <g id="audit-queue">
    <rect class="node" x="516" y="354" width="253" height="125" rx="8"/>
    <text class="body" x="534" y="382">Queue</text>
    <text class="name" x="534" y="413">audit.work</text>
    <text class="body" x="534" y="452">Binding</text>
    <text class="key" x="603" y="452">order.#</text>
  </g>

  <!-- Only A receives this fulfilment delivery. B can handle other orders from the same queue. -->
  <g id="fulfilment-consumers">
    <rect class="application" x="830" y="161" width="247" height="95" rx="8"/>
    <text class="group" x="847" y="195">Fulfilment worker A</text>
    <text class="body" x="847" y="231">Creates a packing task</text>
    <rect class="available" x="830" y="268" width="247" height="76" rx="8"/>
    <text class="group" x="847" y="298">Fulfilment worker B</text>
    <text class="body" x="847" y="327">Ready for another order</text>
  </g>
  <g id="audit-consumer">
    <rect class="application" x="830" y="369" width="247" height="96" rx="8"/>
    <text class="group" x="847" y="402">Audit worker</text>
    <text class="body" x="847" y="439">Records E17 for order 42</text>
  </g>

  <!-- A shared trunk splits only at the exchange. Delivery shafts cross the broker boundary. -->
  <g id="routes">
    <path class="flow" d="M223 314 H268" marker-end="url(#arrowhead)"/>
    <path class="flow" d="M463 314 H490 M490 220 V416"/>
    <path class="flow" d="M490 220 H512" marker-end="url(#arrowhead)"/>
    <path class="flow" d="M490 416 H512" marker-end="url(#arrowhead)"/>
    <path class="flow" d="M770 220 H826" marker-end="url(#arrowhead)"/>
    <path class="flow" d="M770 416 H826" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Explain the two independent deliveries and the one shared fulfilment queue. -->
  <g id="outcome">
    <rect class="note" x="25" y="523" width="1052" height="81" rx="8"/>
    <text class="group" x="45" y="554">Both queues get a copy of E17. The # in order.# matches zero or more words, including created.</text>
    <text class="body" x="45" y="584">Workers A and B share the fulfilment queue. RabbitMQ delivers its copy to A this time.</text>
  </g>
</svg>
