<svg xmlns="http://www.w3.org/2000/svg" width="1069" height="967" viewBox="0 0 1069 967" role="img" aria-labelledby="title desc">
<title id="title">Manual Kafka offset commits: Time between polls exceeds the limit; a later commit fails after assignment loss</title>
<desc id="desc">Service Instance 1 takes too long between poll calls. In this scenario it loses its assignment and a later manual commit is rejected. Service Instance 2 resumes from the last committed offsets; previously produced output may repeat. The limit applies between polls, not to the duration of a poll call. Automatic commits are disabled. Each produce step waits for all output acknowledgments before the application commits the next input offsets to the consumer group coordinator. These operations are not in a transaction. Read downward.</desc>
<!-- Corrected source-native adaptation of the supplied PNG. Participant order, sequence layout, and palette are retained; labels now explicitly teach application-controlled commits rather than automatic commits. -->
<!-- Shared styles. White message-label backings separate text from the vertical time guides. -->
<defs><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #202020; text-anchor: middle; }
.title-label { font-size: 22px; font-weight: 700; }
.subtitle { font-size: 15px; }
.rule, .actor-label, .note-label { font-size: 14px; }
.message-label { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #333333; }
.actor-box { fill: #ececff; stroke: #dacef3; stroke-width: 1; }
.note-box { fill: #fff5ad; stroke: #aaaa33; stroke-width: 1; }
.lifeline { fill: none; stroke: #dacef3; stroke-width: 2; }
.activation { fill: #f4f4f4; stroke: #666666; stroke-width: 1; }
.message-shaft { fill: none; stroke: #333333; stroke-width: 1.5; }
.reply { stroke-dasharray: 3 3; }
</style></defs>
<rect width="1069" height="967" fill="#ffffff"/>
<!-- The commit policy and acknowledgment requirement are visible without surrounding prose. -->
<text class="title-label" x="534.5" y="28">Manual commits • enable.auto.commit=false</text>
<text class="subtitle" x="534.5" y="50">Time between polls exceeds the limit; a later commit fails after assignment loss</text>
<text class="rule" x="534.5" y="72">Wait for all output writes to succeed, then commit next offsets. No transaction.</text>
