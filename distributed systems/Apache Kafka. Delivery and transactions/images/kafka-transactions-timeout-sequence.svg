<text class="actor-label" x="725" y="36">Transaction Log</text>
<text class="actor-label" x="725" y="56">(__transaction_state)</text>
<rect class="actor-box" x="850" y="10" width="150" height="65" rx="3"/>
<text class="actor-label" x="925" y="36">Kafka Outbound</text>
<text class="actor-label" x="925" y="56">Topic 1</text>
