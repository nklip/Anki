<path class="lifeline" d="M325 75 V769"/>
<path class="lifeline" d="M525 75 V769"/>
<path class="lifeline" d="M725 75 V769"/>
<path class="lifeline" d="M925 75 V769"/>
<!-- Participant headers and repeated footer labels. -->
