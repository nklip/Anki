<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="914" viewBox="0 0 1050 914" role="img" aria-labelledby="title desc">
<title id="title">Kafka transactions • transaction timeout</title>
<desc id="desc">Read downward. A previously initialized producer begins a local transaction and writes transactional output that remains pending. It crashes with the transaction unfinished. When transaction.timeout.ms expires, the transaction coordinator appends PREPARE_ABORT to the transaction log, sends ABORT markers to participating partitions, waits for acknowledgments, and appends COMPLETE_ABORT. Consumers using read_committed skip the aborted output and the committed input offsets do not advance. One output partition is shown; additional output partitions and any staged input-offset partitions follow the same marker protocol. The requested producer timeout is capped by the broker transaction.max.timeout.ms.</desc>
<!-- Reference PNG (corrected source-native adaptation):
https://cdn.prod.website-files.com/687e4d3574f64b1a223d933f/68bef455f12493f4573ca9b4_kafka-transactions-seq-abort.png
-->
<!-- Source-native adaptation of the Lydtech sequence: preserve the five columns, participant order, palette, and downward reading order. Corrected lifecycle steps need additional rows. -->
<!-- Shared §2 styles; white label backings keep text clear of vertical time guides. -->
<defs><style>text { font-family: Arial, Helvetica, sans-serif; fill: #202020; text-anchor: middle; }
.actor-label, .note-label, .rule { font-size: 14px; }
.message-label { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #333333; }
.actor-box { fill: #ececff; stroke: #dacef3; stroke-width: 1; }
.note-box { fill: #fff5ad; stroke: #aaaa33; stroke-width: 1; }
.lifeline { fill: none; stroke: #dacef3; stroke-width: 2; }
.activation { fill: #f4f4f4; stroke: #666666; stroke-width: 1; }
.message-shaft { fill: none; stroke: #333333; stroke-width: 1.5; }
.reply { stroke-dasharray: 3 3; }</style></defs>
<rect width="1050" height="914" fill="#ffffff"/>
