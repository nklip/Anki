<text class="actor-label" x="125" y="795">Kafka</text>
<text class="actor-label" x="125" y="815">Inbound Topic</text>
<rect class="actor-box" x="250" y="769" width="150" height="65" rx="3"/>
<text class="actor-label" x="325" y="807">Service</text>
<rect class="actor-box" x="450" y="769" width="150" height="65" rx="3"/>
<text class="actor-label" x="525" y="795">Transaction</text>
<text class="actor-label" x="525" y="815">Coordinator</text>
