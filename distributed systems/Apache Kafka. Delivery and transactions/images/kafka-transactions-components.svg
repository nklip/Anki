<svg xmlns="http://www.w3.org/2000/svg" width="940" height="969" viewBox="0 0 940 969" role="img" aria-labelledby="title desc">
<title id="title">Kafka transaction components and commit flow</title><desc id="desc">A Service contains Kafka Consumer, Business Logic, and Kafka Producer. Kafka brokers are a logical view: output partition leaders, Group Coordinator, Transaction Coordinator, and internal-log leaders may run on different brokers. The P1, P2, and P3 circles identify producer calls; C1, C2, and C3 identify Transaction Coordinator steps. The producer initializes once, begins each transaction locally, produces output, and stages next input offsets. The coordinator commits using PREPARE_COMMIT, commit markers, and COMPLETE_COMMIT. Input offsets are independent of output partition names and record counts. The symbol a denotes a pending transactional record; c denotes a COMMIT marker.</desc>
<!-- Reference PNG (corrected source-native adaptation):
https://cdn.prod.website-files.com/687e4d3574f64b1a223d933f/68bef27a40b9b8c3d8487f36_kafka-transactions.drawio.png
-->
<!-- Shared source-native styles; the reference layout and black-and-white containers are retained. -->
<defs><style>text {font-family: Arial, Helvetica, sans-serif; fill:#111; text-anchor:middle;} .label {font-size:14px;} .small {font-size:12px;} .tiny {font-size:11px;} .log-label {font-size:10px;} .left {text-anchor:start;} .heading {font-size:15px;} .container {fill:#fff;stroke:#111;stroke-width:1;} .shaft {fill:none;stroke:#111;stroke-width:1;} .muted {fill:#333;} .callout {fill:#e1d5e7;stroke:#9673a6;stroke-width:1;} .broker-callout {fill:#dae8fc;stroke:#6c8ebf;stroke-width:1;} .pending-badge {fill:#f8cecc;stroke:#ea6b66;stroke-width:1;} .commit-badge {fill:#d5e8d4;stroke:#82b366;stroke-width:1;} .badge-label {font-size:11px;font-weight:700;}</style></defs>
