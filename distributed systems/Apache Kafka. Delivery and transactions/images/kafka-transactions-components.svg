<!-- A compact visible key explains each summary step and the read_committed visibility rule. -->
<rect id="flow-key" class="container" x="0.5" y="837.5" width="939" height="131" rx="12"/>
<text class="small left" x="18" y="859" text-anchor="start">Producer: P1 initTransactions() once. P2 After local beginTransaction(), produce output and</text>
<text class="small left" x="18" y="880" text-anchor="start">sendOffsetsToTransaction(next input offsets, group metadata). P3 commitTransaction() requests commit.</text>
<text class="small left" x="18" y="901" text-anchor="start">Transaction Coordinator: C1 PREPARE_COMMIT. C2 Write commit markers. C3 COMPLETE_COMMIT after marker acknowledgments.</text>
<text class="small left" x="18" y="922" text-anchor="start">a = pending before commit. c = COMMIT marker. Input offsets and output records need not map one-to-one.</text>
<text class="small left" x="18" y="947" text-anchor="start">read_committed visibility follows commit markers and the last stable offset; it does not wait for COMPLETE_COMMIT.</text>
</svg>
