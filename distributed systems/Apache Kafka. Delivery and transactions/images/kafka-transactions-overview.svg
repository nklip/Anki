<path id="flow-4-head" d="M743.5 123.79 L750.5 120.5 L743.5 117.21 Z" fill="#111"/>
<path id="flow-5-shaft" class="shaft" data-connector="true" d="M850.5 120.5 L914.5 120.5"/>
<path id="flow-5-head" d="M913.5 123.79 L920.5 120.5 L913.5 117.21 Z" fill="#111"/>
<text class="small" x="425.5" y="49">transactional.id=service-1</text>
<text class="small" x="1000.5" y="49">isolation.level=read_committed</text>
<!-- Added compact explanation corrects the scope without changing the reference flow. -->
<text class="small" x="425.5" y="186">Output records + next input offsets: one Kafka transaction.</text>
<text class="small" x="425.5" y="203">Commit both together, or abort both.</text>
<text class="tiny" x="1000.5" y="186">Aborted output is hidden.</text>
<text class="tiny" x="1000.5" y="203">Its own processing may still replay.</text>
</svg>
