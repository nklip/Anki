<path d="M16 13 V62 M18 33 L38 24 M18 37 L38 48" fill="none"/><circle cx="16" cy="9" r="7"/><circle cx="16" cy="35" r="10"/><circle cx="16" cy="64" r="7"/><circle cx="40" cy="22" r="8"/><circle cx="40" cy="50" r="8"/></g>
<text class="label" x="50.5" y="112">Kafka</text>
