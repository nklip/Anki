<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1361" viewBox="0 0 1200 1361" role="img" aria-labelledby="title desc">
<title id="title">CDN signed URL: the backend creates it</title>
<desc id="desc">Read top to bottom. The client asks the backend for file access. The backend checks course entitlement, signs a CloudFront resource policy locally with its private key, and returns a CloudFront signed URL. The client uses that URL at the CDN edge. CloudFront verifies the viewer signature with its trusted public key and checks policy expiration before looking in its cache. Either it returns cached bytes, or it sends a separately signed OAC request to private S3. S3 validates origin access and sends bytes to CloudFront, which returns them to the client and may cache them. Signing keys and origin access are configured in advance; only successful paths are shown.</desc>
<!-- Palette and typography match the article's other diagrams. -->
<defs><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
.title { font-size: 30px; font-weight: 700; }
.label { font-size: 23px; font-weight: 700; }
.body { font-size: 21px; }
.small { font-size: 19px; }
.note { font-size: 20px; fill: #475569; }
</style></defs>
<!-- White canvas; chronological reading direction is explicit. -->
<rect width="1200" height="1361" fill="#fff"/>
<text class="title" x="28" y="44" text-anchor="start">CDN signed URL: the backend creates it</text>
<text class="note" x="28" y="79" text-anchor="start">Successful GET download · time flows downward · signing material is already available</text>
<text class="small" x="28" y="111" text-anchor="start">Solid arrows: requests   ·   Dashed arrows: responses   ·   Boxes on a lifeline: local work</text>
<!-- Lifelines are painted first. Notes and message labels mask them where needed.
     A request crossing an intermediate timeline is not a message to that actor. -->
<path id="client-lifeline" d="M130 215V1173" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7" fill="none"/>
<path id="backend-lifeline" d="M430 215V532" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7" fill="none"/>
<path id="cloudfront-lifeline" d="M750 215V1173" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7" fill="none"/>
<path id="origin-lifeline" d="M1080 215V1103" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7" fill="none"/>
<!-- Actor headers remain aligned on the same baseline. -->
<!-- client-actor: a filled local-work box masks its own lifeline. -->
<g id="client-actor"><rect x="30.0" y="137" width="200" height="78" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text class="label" x="130.0" y="168" text-anchor="middle">Client</text>
<text class="small" x="130.0" y="196" text-anchor="middle">Browser or app</text></g>
<!-- backend-actor: a filled local-work box masks its own lifeline. -->
<g id="backend-actor"><rect x="300.0" y="137" width="260" height="78" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text class="label" x="430.0" y="168" text-anchor="middle">Your backend</text>
<text class="small" x="430.0" y="196" text-anchor="middle">Holds the private key</text></g>
<!-- cloudfront-actor: a filled local-work box masks its own lifeline. -->
<g id="cloudfront-actor"><rect x="620.0" y="137" width="260" height="78" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text class="label" x="750.0" y="168" text-anchor="middle">CloudFront</text>
<text class="small" x="750.0" y="196" text-anchor="middle">CDN edge + cache</text></g>
<!-- origin-actor: a filled local-work box masks its own lifeline. -->
<g id="origin-actor"><rect x="975.0" y="137" width="210" height="78" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
<text class="label" x="1080.0" y="168" text-anchor="middle">Private S3</text>
<text class="small" x="1080.0" y="196" text-anchor="middle">CloudFront’s origin</text></g>
<!-- ask-backend: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="ask-backend">
<rect x="183.5" y="220" width="193" height="31" rx="4" fill="#fff"/>
<text class="body" x="280.0" y="242" text-anchor="middle">Ask for access</text>
<path id="ask-backend-shaft" data-connector="true" d="M135 262H415" fill="none" stroke="#7c3aed" stroke-width="3"/>
<polygon id="ask-backend-head" points="425,262 411,254 411,270" fill="#7c3aed"/>
</g>
<!-- backend-authorizes: a filled local-work box masks its own lifeline. -->
<g id="backend-authorizes"><rect x="273" y="285" width="314" height="67" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text class="body" x="430.0" y="314" text-anchor="middle">Check user’s permission</text>
<text class="small" x="430.0" y="338" text-anchor="middle">Course access is allowed</text></g>
<!-- backend-signs-policy: a filled local-work box masks its own lifeline. -->
<g id="backend-signs-policy"><rect x="260" y="373" width="340" height="97" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text class="label" x="430.0" y="402" text-anchor="middle">Create the URL locally</text>
<text class="body" x="430.0" y="430" text-anchor="middle">Sign resource + expiry</text>
<text class="body" x="430.0" y="455" text-anchor="middle">with the private key</text></g>
<!-- return-cloudfront-url: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="return-cloudfront-url">
<rect x="145.0" y="474" width="270" height="31" rx="4" fill="#fff"/>
<text class="body" x="280.0" y="496" text-anchor="middle">CloudFront signed URL</text>
<path id="return-cloudfront-url-shaft" data-connector="true" d="M425 516H145" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" stroke-dashoffset="4"/>
<!-- A solid terminal segment keeps the dashed shaft joined beneath its arrowhead. -->
<path id="return-cloudfront-url-head-join" data-connector="true" d="M163 516H145" fill="none" stroke="#7c3aed" stroke-width="3"/>
<polygon id="return-cloudfront-url-head" points="135,516 149,508 149,524" fill="#7c3aed"/>
</g>
<!-- request-cloudfront-file: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="request-cloudfront-file">
<rect x="259.0" y="542" width="362" height="31" rx="4" fill="#fff"/>
<text class="body" x="440.0" y="564" text-anchor="middle">GET using the CloudFront URL</text>
<path id="request-cloudfront-file-shaft" data-connector="true" d="M135 584H735" fill="none" stroke="#7c3aed" stroke-width="3"/>
<polygon id="request-cloudfront-file-head" points="745,584 731,576 731,592" fill="#7c3aed"/>
</g>
<!-- cloudfront-validates: a filled local-work box masks its own lifeline. -->
<g id="cloudfront-validates"><rect x="579" y="608" width="342" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text class="label" x="750.0" y="637" text-anchor="middle">Validate signature + policy</text>
<text class="body" x="750.0" y="666" text-anchor="middle">Use the trusted public key</text>
<text class="body" x="750.0" y="690" text-anchor="middle">Check expiry before cache</text></g>
<!-- Alternative fragment: only one branch runs. Gray divider is not a message. -->
<g id="cache-alternatives"><rect x="58" y="729" width="1128" height="449" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="735" width="477" height="33" fill="#fff"/>
<text class="body" x="88" y="759" text-anchor="start">Either: cache hit — a fresh copy is available</text>
<!-- cache-hit-response: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="cache-hit-response">
<rect x="275.0" y="771" width="330" height="31" rx="4" fill="#fff"/>
<text class="body" x="440.0" y="793" text-anchor="middle">200 OK + cached file bytes</text>
<path id="cache-hit-response-shaft" data-connector="true" d="M745 813H145" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8 6" stroke-dashoffset="6"/>
<!-- A solid terminal segment keeps the dashed shaft joined beneath its arrowhead. -->
<path id="cache-hit-response-head-join" data-connector="true" d="M163 813H145" fill="none" stroke="#15803d" stroke-width="3"/>
<polygon id="cache-hit-response-head" points="135,813 149,805 149,821" fill="#15803d"/>
</g>
<path id="alternative-divider" d="M59 845H1185" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="76" y="855" width="418" height="33" fill="#fff"/>
<text class="body" x="88" y="879" text-anchor="start">Or: cache miss — fetch from S3</text>
<!-- oac-origin-request: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="oac-origin-request">
<rect x="762.5" y="892" width="305" height="31" rx="4" fill="#fff"/>
<text class="small" x="915" y="914" text-anchor="middle">Separate GET signed by OAC</text>
<path id="oac-origin-request-shaft" data-connector="true" d="M755 934H1065" fill="none" stroke="#0284c7" stroke-width="3"/>
<polygon id="oac-origin-request-head" points="1075,934 1061,926 1061,942" fill="#0284c7"/>
</g>
<!-- s3-validates-origin: a filled local-work box masks its own lifeline. -->
<g id="s3-validates-origin"><rect x="920" y="956" width="252" height="86" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
<text class="small" x="1046" y="983" text-anchor="middle">Validate origin request</text>
<text class="small" x="1046" y="1008" text-anchor="middle">Check distribution’s</text>
<text class="small" x="1046" y="1032" text-anchor="middle">bucket-policy access</text></g>
<!-- origin-returns-bytes: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="origin-returns-bytes">
<rect x="792.0" y="1048" width="246" height="31" rx="4" fill="#fff"/>
<text class="body" x="915.0" y="1070" text-anchor="middle">200 OK + file bytes</text>
<path id="origin-returns-bytes-shaft" data-connector="true" d="M1075 1090H765" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 6" stroke-dashoffset="2"/>
<!-- A solid terminal segment keeps the dashed shaft joined beneath its arrowhead. -->
<path id="origin-returns-bytes-head-join" data-connector="true" d="M783 1090H765" fill="none" stroke="#0284c7" stroke-width="3"/>
<polygon id="origin-returns-bytes-head" points="755,1090 769,1082 769,1098" fill="#0284c7"/>
</g>
<!-- edge-returns-origin-bytes: tips stop clear of the destination lifeline; the shaft ends inside its head.
     The white label plate hides any intermediate lifeline behind text, never the message arrow. -->
<g id="edge-returns-origin-bytes">
<rect x="241.5" y="1118" width="397" height="31" rx="4" fill="#fff"/>
<text class="body" x="440.0" y="1140" text-anchor="middle">Return file; CloudFront may cache it</text>
<path id="edge-returns-origin-bytes-shaft" data-connector="true" d="M745 1160H145" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8 6" stroke-dashoffset="6"/>
<!-- A solid terminal segment keeps the dashed shaft joined beneath its arrowhead. -->
<path id="edge-returns-origin-bytes-head-join" data-connector="true" d="M163 1160H145" fill="none" stroke="#15803d" stroke-width="3"/>
<polygon id="edge-returns-origin-bytes-head" points="135,1160 149,1152 149,1168" fill="#15803d"/>
</g>
</g>
<!-- Teaching takeaway and abbreviation key; outside every lifeline. -->
<!-- takeaway: a filled local-work box masks its own lifeline. -->
<g id="takeaway"><rect x="28" y="1203" width="1144" height="73" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text class="label" x="600.0" y="1232" text-anchor="middle">The client receives a CloudFront URL. S3 is contacted only when an origin fetch is needed.</text>
<text class="note" x="600.0" y="1259" text-anchor="middle">CloudFront validates the viewer’s signature before either cache branch.</text></g>
<text class="note" x="28" y="1308" text-anchor="start">CDN = content delivery network. OAC = Origin Access Control: CloudFront signs its own request to S3.</text>
<text class="note" x="28" y="1337" text-anchor="start">GET requests a download. The backend’s private key stays on the backend.</text>
</svg>
