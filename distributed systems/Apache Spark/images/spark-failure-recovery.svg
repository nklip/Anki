<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="505" viewBox="0 0 1120 505" role="img" aria-labelledby="title desc">
  <title id="title">Failure recovery replays the work that is needed</title>
  <desc id="desc">A task loses its result when its executor fails. Spark can retry the task on a surviving executor and reread the available input. Other available results remain useful. Rebuilt and retained results allow downstream work to continue.</desc>

  <!-- Shared source-native infrastructure icons; explicit use sizes preserve portability. -->
  <defs>
