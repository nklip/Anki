      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 19px; fill: #536174; }
    </style>
