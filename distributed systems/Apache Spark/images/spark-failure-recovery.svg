  <!-- White canvas, lesson title, and reading guide. -->
  <rect width="1120" height="505" fill="#fff"/>
<text x="30" y="43" class="title" text-anchor="start">Failure recovery replays the work that is needed</text>
<text x="30" y="77" class="subtitle" text-anchor="start">Example: an executor disappears while the driver and original input remain available.</text>

<!-- Available durable input and independent surviving results. -->
<rect x="30" y="150" width="270" height="170" rx="12" fill="#f1f8fd" stroke="#c4cbd4" stroke-width="2"/>
<use href="#storage-icon" x="51" y="174" width="64" height="71"/>
<text x="133" y="192" class="heading" text-anchor="start">Available</text>
<text x="133" y="221" class="heading" text-anchor="start">source data</text>
<text x="52" y="289" class="body" text-anchor="start">Input partition 1</text>
<rect x="430" y="113" width="270" height="110" rx="12" fill="#fff0ee" stroke="#da9a8d" stroke-width="2"/>
<text x="451" y="149" class="heading" text-anchor="start">Executor lost</text>
<text x="451" y="183" class="body" text-anchor="start">Task 1 result unavailable</text>
<rect x="825" y="113" width="265" height="110" rx="12" fill="#f4faef" stroke="#9cc48a" stroke-width="2"/>
<text x="846" y="150" class="heading" text-anchor="start">Other results</text>
<text x="846" y="179" class="heading" text-anchor="start">still available</text>
<!-- Recovery replays the necessary recipe on a surviving executor. -->
<rect x="430" y="286" width="270" height="110" rx="12" fill="#f4faef" stroke="#9cc48a" stroke-width="2"/>
<text x="451" y="322" class="heading" text-anchor="start">Retry task 1</text>
<text x="451" y="363" class="body" text-anchor="start">On a surviving executor</text>
<rect x="825" y="286" width="265" height="110" rx="12" fill="#f4faef" stroke="#9cc48a" stroke-width="2"/>
<text x="846" y="326" class="heading" text-anchor="start">Continue the</text>
<text x="846" y="355" class="heading" text-anchor="start">downstream work</text>
<!-- Original attempt is dashed; retry re-reads its available input. -->
<path data-connector="true" d="M306 182 L413 182" fill="none" stroke="#637083" stroke-width="2.5" stroke-dasharray="7 6"/><path data-connector="true" d="M405 182 L413 182" fill="none" stroke="#637083" stroke-width="2.5"/><polygon points="424,182 412,187 412,177" fill="#637083"/>
<text x="365" y="153" class="small" text-anchor="middle">Attempt</text>
<path data-connector="true" d="M565 229 L565 269" fill="none" stroke="#17212f" stroke-width="2.5"/><polygon points="565,280 560,268 570,268" fill="#17212f"/>
<text x="584" y="259" class="small" text-anchor="start">Retry</text>
<path data-connector="true" d="M165 326 L165 362 L413 362" fill="none" stroke="#1976b7" stroke-width="2.5"/><polygon points="424,362 412,367 412,357" fill="#1976b7"/>
<text x="174" y="342" class="small" text-anchor="start">Re-read input</text>
<path data-connector="true" d="M706 342 L808 342" fill="none" stroke="#17212f" stroke-width="2.5"/><polygon points="819,342 807,347 807,337" fill="#17212f"/>
<text x="762" y="317" class="small" text-anchor="middle">Rebuilt</text>
<path data-connector="true" d="M957 229 L957 269" fill="none" stroke="#17212f" stroke-width="2.5"/><polygon points="957,280 952,268 962,268" fill="#17212f"/>
<text x="30" y="443" class="subtitle" text-anchor="start">Lineage is the recorded recipe for rebuilding a missing result from available data.</text>
<text x="30" y="476" class="small" text-anchor="start">Missing shuffle outputs may require more upstream work to be repeated.</text>
</svg>
