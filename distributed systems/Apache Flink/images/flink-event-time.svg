<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="443" viewBox="0 0 1120 443" role="img" aria-labelledby="title desc">
  <title id="title">A watermark advances event time; arrival order can differ</title>
  <desc id="desc">Arrival sequence for shop A: payment 5 at event time 12:00:50, then payment 10 at 12:00:10, then watermark 12:01:00, then payment 4 at 12:00:40. The first two payments match the SQL example. The out-of-order second payment is included. The watermark emits total 15 and cleans the window. The fourth payment is too late for this window.</desc>
  <!-- Shared typography and System Design infrastructure icons. Each use has explicit dimensions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .value { font-size: 27px; font-weight: 700; }
    </style>
    <!-- Server and envelope: System Design/01. Scaling/images/message-queue.svg.
         Laptop: System Design/01. Scaling/images/database.svg. Original geometry and colors retained. -->
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="envelope" viewBox="0 0 42 30"><rect x="1" y="1" width="40" height="28" rx="3" fill="white" stroke="#0b78b5" stroke-width="4"/><path d="M3 4L21 19L39 4" fill="none" stroke="#0b78b5" stroke-width="4"/></symbol>
<symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <!-- Database geometry copied from System Design/01. Scaling/images/database.svg; label omitted. -->
    <symbol id="storage" viewBox="965 459 106 140">
      <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
      <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
    </symbol>
  </defs>
  <rect width="1120" height="443" fill="#fff"/>
  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">A watermark advances event time; arrival order can differ</text>
  <text x="28" y="77" class="sub" text-anchor="start">Shop A, one input, minute window [12:00, 12:01), zero allowed lateness.</text>
  <!-- Arrival order flows left to right; the watermark has its own visibly distinct panel. -->
  <rect x="28" y="134" width="239" height="204" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <rect x="303" y="134" width="239" height="204" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <rect x="578" y="134" width="239" height="204" rx="12" fill="#f3faed" stroke="#b9c8d4" stroke-width="2"/>
  <rect x="853" y="134" width="239" height="204" rx="12" fill="#fff5eb" stroke="#b9c8d4" stroke-width="2"/>
  <text x="28" y="116" class="small" text-anchor="start">Arrival order →</text>
  <use href="#envelope" x="46" y="151" width="34" height="25"/>
  <text x="46" y="211" class="small" text-anchor="start">Payment arrives</text>
  <text x="46" y="250" class="value" text-anchor="start">12:00:50</text>
  <text x="46" y="284" class="small" text-anchor="start">Event time · +5</text>
  <text x="46" y="316" class="small" text-anchor="start">Window total: 5</text>
  <use href="#envelope" x="321" y="151" width="34" height="25"/>
  <text x="321" y="211" class="small" text-anchor="start">Older event arrives</text>
  <text x="321" y="250" class="value" text-anchor="start">12:00:10</text>
  <text x="321" y="284" class="small" text-anchor="start">Event time · +10</text>
  <text x="321" y="316" class="small" text-anchor="start">Window total: 15</text>
  <use href="#envelope" x="871" y="151" width="34" height="25"/>
  <text x="871" y="211" class="small" text-anchor="start">Older event arrives</text>
  <text x="871" y="250" class="value" text-anchor="start">12:00:40</text>
  <text x="871" y="284" class="small" text-anchor="start">Event time · +4</text>
  <text x="871" y="316" class="small" text-anchor="start">Too late for this window</text>
  <text x="597" y="174" class="heading" text-anchor="start" style="fill:#2b7b23">WATERMARK</text>
  <text x="597" y="218" class="value" text-anchor="start">12:01:00</text>
  <text x="597" y="261" class="body" text-anchor="start">Emit total: 15</text>
  <text x="597" y="292" class="body" text-anchor="start">Clean up this window</text>
  <path data-connector="true" d="M267.0 233.0L290.00 233.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="302.0,233.0 288.00,239.00 288.00,227.00" fill="#17212f"/>
  <path data-connector="true" d="M542.0 233.0L565.00 233.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="577.0,233.0 563.00,239.00 563.00,227.00" fill="#17212f"/>
  <path data-connector="true" d="M817.0 233.0L840.00 233.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="852.0,233.0 838.00,239.00 838.00,227.00" fill="#17212f"/>
  <!-- Footnotes distinguish out-of-order membership from post-cleanup arrivals. -->
  <text x="28" y="383" class="body" text-anchor="start">The second record is out of order but usable. The fourth needs a late-data policy.</text>
  <text x="28" y="415" class="small" text-anchor="start">A watermark is a progress assumption; it cannot prevent an older event from arriving.</text>
</svg>
