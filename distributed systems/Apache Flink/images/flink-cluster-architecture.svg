<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="596" viewBox="0 0 1120 596" role="img" aria-labelledby="title desc">
  <title id="title">The JobManager coordinates; TaskManagers process records</title>
  <desc id="desc">A client submits a job to the JobManager. The JobManager coordinates two TaskManagers, which execute source, filter, aggregation and sink work. Records travel directly between workers. A task slot is a scheduling resource, not a CPU core.</desc>
  <!-- Shared typography and System Design infrastructure icons. Each use has explicit dimensions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .value { font-size: 27px; font-weight: 700; }
    </style>
    <!-- Server and envelope: System Design/01. Scaling/images/message-queue.svg.
         Laptop: System Design/01. Scaling/images/database.svg. Original geometry and colors retained. -->
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="envelope" viewBox="0 0 42 30"><rect x="1" y="1" width="40" height="28" rx="3" fill="white" stroke="#0b78b5" stroke-width="4"/><path d="M3 4L21 19L39 4" fill="none" stroke="#0b78b5" stroke-width="4"/></symbol>
<symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <!-- Database geometry copied from System Design/01. Scaling/images/database.svg; label omitted. -->
    <symbol id="storage" viewBox="965 459 106 140">
      <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
      <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
    </symbol>
  </defs>
  <rect width="1120" height="596" fill="#fff"/>
  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">The JobManager coordinates; TaskManagers process records</text>
  <text x="28" y="77" class="sub" text-anchor="start">A simplified streaming job with two workers and illustrative shared task slots.</text>
  <!-- Submission and coordination row. -->
  <rect x="28" y="114" width="240" height="104" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="43" y="132" width="68" height="44"/>
  <text x="128" y="150" class="heading" text-anchor="start">Client</text>
  <text x="128" y="184" class="small" text-anchor="start">Submit job</text>
  <rect x="366" y="114" width="395" height="104" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="383" y="129" width="38" height="66"/>
  <text x="444" y="148" class="heading" text-anchor="start">JobManager</text>
  <text x="444" y="179" class="small" text-anchor="start">Schedule • checkpoint • recover</text>
  <path data-connector="true" d="M269.0 163.0L353.00 163.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="365.0,163.0 351.00,169.00 351.00,157.00" fill="#17212f"/>
  <text x="316" y="141" class="small" text-anchor="middle">plan</text>
  <!-- Dashed coordination paths end above worker borders; manual heads have covered shaft joins. -->
  <path d="M433 219V259H294" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path data-connector="true" d="M294.0 258.0L294.00 287.00" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- Solid terminal segment joins a dashed shaft to its arrowhead without a dash gap. -->
  <path data-connector="true" d="M294.00 275.00L294.00 287.00" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="294.0,299.0 288.00,285.00 300.00,285.00" fill="#0b78b5"/>
  <path d="M694 219V259H824" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path data-connector="true" d="M824.0 258.0L824.00 287.00" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- Solid terminal segment joins a dashed shaft to its arrowhead without a dash gap. -->
  <path data-connector="true" d="M824.00 275.00L824.00 287.00" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="824.0,299.0 818.00,285.00 830.00,285.00" fill="#0b78b5"/>
  <text x="558" y="273" class="small" text-anchor="middle" style="fill:#0b78b5">coordination</text>
  <!-- Workers and task slots; the central corridor contains only the record exchange. -->
  <rect x="104" y="300" width="380" height="216" rx="12" fill="#f3faed" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="124" y="319" width="31" height="54"/>
  <text x="176" y="345" class="heading" text-anchor="start">TaskManager 1</text>
  <text x="176" y="375" class="small" text-anchor="start">Worker process</text>
  <rect x="126" y="402" width="336" height="101" rx="8" fill="#fff" stroke="#98bd80" stroke-width="2"/>
  <text x="144" y="429" class="small" text-anchor="start">Shared task slot (illustrative)</text>
  <text x="144" y="461" class="heading" text-anchor="start">Source + filter</text>
  <text x="144" y="486" class="small" text-anchor="start">Read and validate payments</text>
  <rect x="634" y="300" width="380" height="216" rx="12" fill="#f3faed" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="654" y="319" width="31" height="54"/>
  <text x="706" y="345" class="heading" text-anchor="start">TaskManager 2</text>
  <text x="706" y="375" class="small" text-anchor="start">Worker process</text>
  <rect x="656" y="402" width="336" height="101" rx="8" fill="#fff" stroke="#98bd80" stroke-width="2"/>
  <text x="674" y="429" class="small" text-anchor="start">Shared task slot (illustrative)</text>
  <text x="674" y="461" class="heading" text-anchor="start">Aggregate + sink</text>
  <text x="674" y="486" class="small" text-anchor="start">Update state and write results</text>
  <path data-connector="true" d="M485.0 451.0L621.00 451.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="633.0,451.0 619.00,457.00 619.00,445.00" fill="#17212f"/>
  <text x="559" y="426" class="small" text-anchor="middle">records</text>
  <text x="28" y="559" class="body" text-anchor="start">A slot allocates resources; it is not one dedicated CPU core or one operator.</text>
</svg>
