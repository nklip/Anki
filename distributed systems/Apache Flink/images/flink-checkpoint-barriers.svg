<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="503" viewBox="0 0 1120 503" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint barriers keep a snapshot boundary consistent</title>
  <desc id="desc">Input A has reached checkpoint barrier 7, so its records beyond the barrier are held. Input B is still processing records preceding barrier 7. Once B reaches the same barrier, the operator snapshots the state at that shared boundary and resumes A. A durable checkpoint also records matching source progress.</desc>
  <!-- Shared typography and System Design infrastructure icons. Each use has explicit dimensions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .value { font-size: 27px; font-weight: 700; }
    </style>
    <!-- Server and envelope: System Design/01. Scaling/images/message-queue.svg.
         Laptop: System Design/01. Scaling/images/database.svg. Original geometry and colors retained. -->
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="envelope" viewBox="0 0 42 30"><rect x="1" y="1" width="40" height="28" rx="3" fill="white" stroke="#0b78b5" stroke-width="4"/><path d="M3 4L21 19L39 4" fill="none" stroke="#0b78b5" stroke-width="4"/></symbol>
<symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <!-- Database geometry copied from System Design/01. Scaling/images/database.svg; label omitted. -->
    <symbol id="storage" viewBox="965 459 106 140">
      <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
      <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
    </symbol>
  </defs>
  <rect width="1120" height="503" fill="#fff"/>
  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">Checkpoint barriers keep a snapshot boundary consistent</text>
  <text x="28" y="77" class="sub" text-anchor="start">Aligned checkpoint example: both inputs must reach barrier 7 before the operator snapshots.</text>
  <!-- Inputs depict processing status, not a misleading left-to-right physical queue order. -->
  <rect x="28" y="124" width="535" height="119" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#envelope" x="47" y="144" width="33" height="24"/>
  <text x="96" y="164" class="heading" text-anchor="start">Input A: barrier 7 received</text>
  <text x="49" y="202" class="body" text-anchor="start">Hold records beyond barrier 7</text>
  <rect x="28" y="273" width="535" height="119" rx="12" fill="#fff5eb" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#envelope" x="47" y="293" width="33" height="24"/>
  <text x="96" y="313" class="heading" text-anchor="start">Input B: barrier 7 still pending</text>
  <text x="49" y="351" class="body" text-anchor="start">Process records before barrier 7</text>
  <!-- Input arrows enter separate ports; captions are above their shafts. -->
  <path data-connector="true" d="M564.0 184.0L650.00 184.00" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- Solid terminal segment joins a dashed shaft to its arrowhead without a dash gap. -->
  <path data-connector="true" d="M638.00 184.00L650.00 184.00" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="662.0,184.0 648.00,190.00 648.00,178.00" fill="#0b78b5"/>
  <text x="612" y="163" class="small" text-anchor="middle">wait</text>
  <path data-connector="true" d="M564.0 333.0L650.00 333.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="662.0,333.0 648.00,339.00 648.00,327.00" fill="#17212f"/>
  <text x="612" y="312" class="small" text-anchor="middle">read</text>
  <rect x="663" y="124" width="429" height="268" rx="12" fill="#f3faed" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="683" y="147" width="32" height="56"/>
  <text x="735" y="166" class="heading" text-anchor="start">Stateful operator</text>
  <text x="735" y="197" class="small" text-anchor="start">One consistent boundary</text>
  <text x="687" y="245" class="body" text-anchor="start">When both barriers arrive:</text>
  <text x="687" y="279" class="body" text-anchor="start">snapshot state for checkpoint 7</text>
  <text x="687" y="313" class="body" text-anchor="start">and resume held records.</text>
  <text x="28" y="438" class="body" text-anchor="start">Durable checkpoint = corresponding source positions + operator state.</text>
  <text x="28" y="473" class="small" text-anchor="start">A barrier marks a recovery boundary. A watermark marks event-time progress.</text>
</svg>
