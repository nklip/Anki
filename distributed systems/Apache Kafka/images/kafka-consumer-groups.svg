<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="605" viewBox="0 0 1000 605" role="img" aria-labelledby="title desc">
<title id="title">Consumer groups read independently</title>
<desc id="desc">The same three partitions from the orders topic are shown twice to compare two independent standard consumer groups. Shipping assigns partitions P0 and P1 to S1 and P2 to S2. Analytics assigns all three to A1. Each group saves independent offsets per partition. With four consumers and only three subscribed partitions, at least one consumer has no assignment.</desc>
<!-- Shared typography, semantic colors, and arrows. The marker tip projects 2.5 units beyond each compensated path endpoint. -->
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.panel{fill:#f7f7f7;stroke:#888;stroke-width:1.5}.blue{fill:#eaf3ff;stroke:#2868a6;stroke-width:1.8}.amber{fill:#fff3da;stroke:#a56a0b;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}</style>
</defs>
<rect width="1000" height="605" fill="#fff"/>
<!-- Title and reading cue. -->
<text x="500" y="39" font-size="26" text-anchor="middle" font-weight="bold">Consumer groups read independently</text>
<text x="500" y="70" font-size="18" text-anchor="middle">Within a standard group, each partition has one assigned consumer at a time.</text>
<text x="500" y="98" font-size="17" text-anchor="middle">The same retained orders records are shown in both panels.</text>
<!-- shipping group: record arrows enter consumer boundaries at separate heights. -->
<rect id="shipping-panel" class="panel" x="25" y="120" width="460" height="363"/>
<text x="255" y="150" font-size="22" text-anchor="middle" font-weight="bold">Group: shipping</text>
<text x="95" y="178" font-size="17" text-anchor="middle">Partitions</text>
<text x="355" y="178" font-size="17" text-anchor="middle">Consumers</text>
<rect id="shipping-p0" class="box" x="50" y="195" width="90" height="45"/>
<text x="95" y="224" font-size="20" text-anchor="middle" font-weight="bold">P0</text>
<rect id="shipping-p1" class="box" x="50" y="280" width="90" height="45"/>
<text x="95" y="309" font-size="20" text-anchor="middle" font-weight="bold">P1</text>
<rect id="shipping-p2" class="box" x="50" y="365" width="90" height="45"/>
<text x="95" y="394" font-size="20" text-anchor="middle" font-weight="bold">P2</text>
<rect id="shipping-b1" class="blue" x="255" y="195" width="205" height="140"/>
<text x="357.5" y="239" font-size="22" text-anchor="middle" font-weight="bold">S1</text>
<text x="357.5" y="269" font-size="18" text-anchor="middle">reads P0 + P1</text>
<text x="357.5" y="299" font-size="16" text-anchor="middle">one process</text>
<rect id="shipping-b2" class="blue" x="255" y="357" width="205" height="60"/>
<text x="357.5" y="383" font-size="22" text-anchor="middle" font-weight="bold">S2</text>
<text x="357.5" y="405" font-size="17" text-anchor="middle">reads P2</text>
<path id="shipping-p0-assignment" class="flow" d="M140 217.5 L252.5 217.5"/>
<path id="shipping-p1-assignment" class="flow" d="M140 302.5 L252.5 302.5"/>
<path id="shipping-p2-assignment" class="flow" d="M140 387.5 L252.5 387.5"/>
<text x="255" y="445" font-size="17" text-anchor="middle">Example saved next offsets:</text>
<text x="255" y="469" font-size="17" text-anchor="middle">P0: 12   •   P1: 8   •   P2: 21</text>
<!-- analytics group: record arrows enter consumer boundaries at separate heights. -->
<rect id="analytics-panel" class="panel" x="515" y="120" width="460" height="363"/>
<text x="745" y="150" font-size="22" text-anchor="middle" font-weight="bold">Group: analytics</text>
<text x="585" y="178" font-size="17" text-anchor="middle">Partitions</text>
<text x="845" y="178" font-size="17" text-anchor="middle">Consumers</text>
<rect id="analytics-p0" class="box" x="540" y="195" width="90" height="45"/>
<text x="585" y="224" font-size="20" text-anchor="middle" font-weight="bold">P0</text>
<rect id="analytics-p1" class="box" x="540" y="280" width="90" height="45"/>
<text x="585" y="309" font-size="20" text-anchor="middle" font-weight="bold">P1</text>
<rect id="analytics-p2" class="box" x="540" y="365" width="90" height="45"/>
<text x="585" y="394" font-size="20" text-anchor="middle" font-weight="bold">P2</text>
<rect id="analytics-a1" class="box" x="745" y="195" width="205" height="222"/>
<text x="847.5" y="269" font-size="22" text-anchor="middle" font-weight="bold">A1</text>
<text x="847.5" y="300" font-size="17" text-anchor="middle">reads P0 + P1 + P2</text>
<text x="847.5" y="331" font-size="16" text-anchor="middle">one process</text>
<path id="analytics-p0-assignment" class="flow" d="M630 217.5 L742.5 217.5"/>
<path id="analytics-p1-assignment" class="flow" d="M630 302.5 L742.5 302.5"/>
<path id="analytics-p2-assignment" class="flow" d="M630 387.5 L742.5 387.5"/>
<text x="745" y="445" font-size="17" text-anchor="middle">Example saved next offsets:</text>
<text x="745" y="469" font-size="17" text-anchor="middle">P0: 4   •   P1: 3   •   P2: 9</text>
<!-- Parallelism limit applies to the partitions subscribed by one standard group. -->
<text x="500" y="520" font-size="18" text-anchor="middle">Each group has its own offset for each partition; shipping does not advance analytics.</text>
<text x="500" y="550" font-size="17" text-anchor="middle">Three partitions allow at most three assigned consumers in one standard group.</text>
<text x="500" y="580" font-size="17" text-anchor="middle">If that group has four consumers, at least one is idle until it receives a partition.</text>
</svg>
