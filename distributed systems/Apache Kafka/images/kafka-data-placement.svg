<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Place authoritative orders, retained events, and query views in separate roles</title>
<desc id="desc">In this order-system example, the order service and its database own accepted orders. An outbox publisher sends their committed events to Kafka. Kafka retains the events for consumers, and a consumer updates a query or search view. A user-facing API reads that derived view, which may lag behind the accepted order.</desc>
<!-- Shared white canvas, Arial typography, and semantic ownership colors. -->
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:26px;font-weight:bold}.label{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#111;stroke-width:1.8}.blue{fill:#eaf3fb;stroke:#111;stroke-width:1.8}.amber{fill:#fff4db;stroke:#111;stroke-width:1.8}.shaft{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round}</style></defs>
<rect width="1000" height="650" fill="#fff"/>
<!-- Start at the authoritative order, then follow its event clockwise to the derived view. -->
<text x="500" y="40" class="title" text-anchor="middle">Order facts → retained events → query views</text>
<text x="500" y="70" class="small" text-anchor="middle">Example: the order database owns the accepted order; Kafka carries the change to readers.</text>
<rect id="authoritative-orders" class="blue" x="30" y="125" width="275" height="170"/>
<text x="167" y="157" class="label" font-weight="bold" text-anchor="middle">Order service + database</text>
<text x="167" y="192" class="small" text-anchor="middle">Own accepted orders</text>
<text x="167" y="222" class="small" text-anchor="middle">Commit order + outbox event</text>
<text x="167" y="267" class="label" text-anchor="middle">order 42 = accepted</text>
<rect id="outbox-publisher" class="box" x="405" y="160" width="215" height="105"/>
<text x="512" y="191" class="label" text-anchor="middle">Outbox publisher</text>
<text x="512" y="221" class="small" text-anchor="middle">Change data capture</text>
<text x="512" y="245" class="small" text-anchor="middle">or a relay process</text>
<rect id="retained-events" class="box" x="735" y="145" width="235" height="135"/>
<text x="852" y="177" class="label" font-weight="bold" text-anchor="middle">Kafka topic</text>
<text x="852" y="207" class="small" text-anchor="middle">Retain the events</text>
<text x="852" y="237" class="label" text-anchor="middle">OrderCreated(42)</text>
<text x="852" y="263" class="small" text-anchor="middle">Read and replay history</text>
<!-- Manual arrowheads meet each target border; shafts finish under their bases. -->
<path id="committed-outbox-shaft" class="shaft" data-connector="true" d="M305 215 H393"/>
<path id="committed-outbox-head" d="M391 208 L405 215 L391 222Z" fill="#111"/>
<text x="355" y="188" class="small" text-anchor="middle">committed</text>
<path id="publish-event-shaft" class="shaft" data-connector="true" d="M620 215 H723"/>
<path id="publish-event-head" d="M721 208 L735 215 L721 222Z" fill="#111"/>
<text x="677" y="188" class="small" text-anchor="middle">publish</text>
<!-- Readers build a query-optimized copy asynchronously. -->
<rect id="consumer" class="box" x="735" y="380" width="235" height="110"/>
<text x="852" y="414" class="label" font-weight="bold" text-anchor="middle">Consumer</text>
<text x="852" y="445" class="small" text-anchor="middle">Read each order event</text>
<text x="852" y="472" class="small" text-anchor="middle">Update derived state</text>
<path id="read-event-shaft" class="shaft" data-connector="true" d="M852 280 V368"/>
<path id="read-event-head" d="M845 366 L852 380 L859 366Z" fill="#111"/>
<text x="737" y="336" class="small" text-anchor="middle">read events</text>
<rect id="query-view" class="blue" x="385" y="365" width="250" height="145"/>
<text x="510" y="398" class="label" font-weight="bold" text-anchor="middle">Query / search view</text>
<text x="510" y="430" class="small" text-anchor="middle">Derived from events</text>
<text x="510" y="461" class="small" text-anchor="middle">order 42 becomes visible</text>
<text x="510" y="487" class="small" text-anchor="middle">after the consumer catches up</text>
<path id="update-view-shaft" class="shaft" data-connector="true" d="M735 438 H647"/>
<path id="update-view-head" d="M649 431 L635 438 L649 445Z" fill="#111"/>
<text x="685" y="411" class="small" text-anchor="middle">update</text>
<!-- The user-facing read queries the view; it does not scan the Kafka log on each request. -->
<rect id="query-api" class="box" x="30" y="385" width="240" height="105"/>
<text x="150" y="418" class="label" font-weight="bold" text-anchor="middle">User-facing API</text>
<text x="150" y="448" class="small" text-anchor="middle">Get order 42 or search</text>
<text x="150" y="473" class="small" text-anchor="middle">Return the view’s result</text>
<path id="query-view-shaft" class="shaft" data-connector="true" d="M270 438 H373"/>
<path id="query-view-head" d="M371 431 L385 438 L371 445Z" fill="#111"/>
<text x="328" y="411" class="small" text-anchor="middle">query</text>
<!-- Eventual-update caveat names the user-visible outcome. -->
<rect id="view-lag-note" class="amber" x="30" y="550" width="940" height="65"/>
<text x="500" y="590" class="label" text-anchor="middle">Order accepted does not mean every view has caught up. Define what users see during lag.</text>
<text x="500" y="640" class="small" text-anchor="middle">These are roles in this example; choosing Kafka alone does not decide which store owns the facts.</text>
</svg>
