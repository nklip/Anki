<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="766" viewBox="0 0 1100 766" role="img" aria-labelledby="title desc">
  <title id="title">Kafka, Redis, and databases: where each layer fits</title>
  <desc id="desc">In this shop example, the order service commits an accepted order and its outbox event in the authoritative order database. An outbox publisher sends committed events to Kafka, which retains them for reading and replay. A consumer updates downstream read storage, illustrated by a Redis cache and a query or search store. A user-facing API queries this derived storage. An accepted order can become visible there later, after consumers catch up.</desc>

  <!-- Shared typography and source-native icons reused from the System Design
       Proximity Service final design and Notification System improved design. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; text-anchor: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 20px; }
      .strong { font-size: 20px; font-weight: 700; }
      .detail { font-size: 17px; }
      .small { font-size: 16px; }
      .flow { fill: none; stroke: #171717; stroke-width: 2; }
      .head { fill: #171717; }
      .panel { fill: #fff; stroke: #888; stroke-width: 1.6; }
      .service { fill: #fff; stroke: #171717; stroke-width: 1.6; }
    </style>
    <symbol id="user" viewBox="0 0 54 54"><circle cx="27" cy="12" r="11"/><path d="M3 49V41C3 29 51 29 51 41V49Z"/></symbol>
    <symbol id="db" viewBox="0 0 88 93">
      <path d="M0.9 13.75A43.1 8.75 0 0 1 87.1 13.75V82.25A43.1 8.75 0 0 1 0.9 82.25Z" fill="currentColor" stroke="#111" stroke-width="1.6"/>
      <ellipse cx="44" cy="13.75" rx="43.1" ry="8.75" fill="currentColor" stroke="#111" stroke-width="1.6"/>
    </symbol>
    <symbol id="redis-cube" viewBox="17 0 95 81" preserveAspectRatio="xMidYMid meet">
      <path fill="#A41E11" d="M106.9 62.7c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.4-2.1-31.7-13.1-36.7-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c.1.9-1 1.9-3.5 3.2z"/>
      <path fill="#D82C20" d="M106.9 53.3c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8C53.5 68 26.2 57 21.2 54.6c-4.9-2.4-5-4-.2-5.9 4.8-1.9 32.1-12.6 37.8-14.6 5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 30.5 12 35.3 13.7 5 1.8 5.2 3.2.2 5.8z"/>
      <path fill="#A41E11" d="M106.9 47.4c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.4-2.1-31.7-13.2-36.7-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c.1.9-1 1.9-3.5 3.2z"/>
      <path fill="#D82C20" d="M106.9 38c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5-4.9-2.4-5-4-.2-5.9 4.8-1.9 32.1-12.6 37.8-14.6 5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 30.5 12 35.3 13.7 4.9 1.7 5.1 3.2.1 5.8z"/>
      <path fill="#A41E11" d="M106.9 31.5c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c0 .8-1.1 1.9-3.6 3.2z"/>
      <path fill="#D82C20" d="M106.9 22.1c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5s-5-4-.2-5.9c4.8-1.9 32.1-12.6 37.8-14.6C64.7.8 66.7.8 71.5 2.6c4.9 1.8 30.5 12 35.3 13.7 4.9 1.7 5.1 3.2.1 5.8z"/>
      <path fill="#fff" d="M76.2 13l-8.1.8-1.8 4.4-2.9-4.9-9.3-.8L61 10l-2-3.8 6.5 2.5 6.1-2-1.7 4zM65.8 34.1l-15-6.3 21.6-3.3z"/>
      <ellipse fill="#fff" cx="45" cy="19.9" rx="11.5" ry="4.5"/>
      <path fill="#7A0C00" d="M85.7 14.2l12.8 5-12.8 5.1z"/>
      <path fill="#AD2115" d="M71.6 19.8l14.1-5.6v10.1l-1.3.5z"/>
    </symbol>
    <symbol id="green-server" viewBox="0 0 30 60">
      <rect x="8" y="1" width="14" height="9" rx="1" fill="#65c515"/>
      <path d="M11 5 H19" stroke="#fff" stroke-width="1.5"/>
      <rect x="3" y="12" width="24" height="46" rx="1.5" fill="#65c515"/>
      <path d="M7 19 H23 M7 40 H23 M7 48 H23" stroke="#fff" stroke-width="2"/>
    </symbol>
    <symbol id="channel-queue" viewBox="0 0 150 58">
      <path d="M2 2 H135 L148 29 L135 56 H2 Z" fill="#fff" stroke="#1677b8" stroke-width="4"/>
      <g fill="none" stroke="#1677b8" stroke-width="4">
        <rect x="10" y="12" width="36" height="33"/><path d="M10 13 L28 29 L46 13"/>
        <rect x="54" y="12" width="36" height="33"/><path d="M54 13 L72 29 L90 13"/>
        <rect x="98" y="12" width="36" height="33"/><path d="M98 13 L116 29 L134 13"/>
      </g>
    </symbol>
  </defs>

  <!-- Reading order: accepted order at upper left, event delivery to the right,
       then consumer updates toward the lower storage group. -->
  <rect id="canvas" width="1100" height="766" fill="#fff"/>
  <text class="title" x="550" y="35">Kafka, Redis, and databases: where each layer fits</text>
  <text class="detail" x="550" y="66">Order database owns accepted orders; Kafka carries events to downstream readers.</text>

  <!-- Write-side ownership; pink primary database matches the Proximity Service
       convention. The local commit arrow stays between the two icons. -->
  <g id="authoritative-order-store">
    <rect class="panel" x="30" y="117" width="315" height="242"/>
    <text class="strong" x="187.5" y="148">Own accepted orders</text>
    <use href="#green-server" x="79" y="172" width="42" height="84"/>
    <use href="#db" x="230" y="166" width="82" height="92" style="color:#eea6ed"/>
    <!-- Shafts end inside their triangle bases, keeping the visible nose clean. -->
    <path id="commit-flow" class="flow" d="M129 212H215"/>
    <path id="commit-head" class="head" d="M213 206L225 212L213 218Z"/>
    <text class="detail" x="174" y="188">commit</text>
    <text class="label" x="100" y="282">Order service</text>
    <text class="label" x="271" y="282">Order DB</text>
    <text class="small" x="187.5" y="313">Order + outbox in one transaction</text>
    <text class="detail" x="187.5" y="338">order 42 = accepted</text>
  </g>

  <!-- Outbox publisher: committed changes are delivered to Kafka. -->
  <g id="outbox-publisher">
    <path id="committed-flow" class="flow" d="M345 216H471"/>
    <path id="committed-head" class="head" d="M469 210L481 216L469 222Z"/>
    <text class="detail" x="412" y="190">committed</text>
    <use href="#green-server" x="492" y="173" width="46" height="92"/>
    <text class="strong" x="515" y="291">Outbox publisher</text>
    <text class="detail" x="515" y="315">Change data capture</text>
    <text class="detail" x="515" y="338">or relay process</text>
  </g>

  <!-- The queue glyph represents events in the topic; retention and replay
       remain explicit so it is not mistaken for delete-on-read messaging. -->
  <g id="kafka-event-log">
    <path id="publish-flow" class="flow" d="M549 216H794"/>
    <path id="publish-head" class="head" d="M792 210L804 216L792 222Z"/>
    <text class="detail" x="676" y="190">publish</text>
    <use href="#channel-queue" x="810" y="172" width="230" height="92"/>
    <text class="strong" x="925" y="291">Kafka topic</text>
    <text class="detail" x="925" y="315">Retain OrderCreated(42)</text>
    <text class="detail" x="925" y="338">Read and replay history</text>
  </g>

  <!-- Consumer input uses the clear vertical corridor below the Kafka caption. -->
  <g id="event-consumer">
    <path id="read-events-flow" class="flow" d="M925 355V460"/>
    <path id="read-events-head" class="head" d="M919 458L925 470L931 458Z"/>
    <text class="detail" x="1000" y="417">read events</text>
    <use href="#green-server" x="902" y="480" width="46" height="92"/>
    <text class="strong" x="925" y="609">Consumer</text>
    <text class="detail" x="925" y="634">Update derived state</text>
  </g>

  <!-- Redis and a database/search store are examples of downstream read storage.
       The enclosing panel is the target for both update and query connections. -->
  <g id="derived-read-storage">
    <rect class="panel" x="380" y="449" width="410" height="205"/>
    <text class="strong" x="585" y="478">Derived query / search view</text>
    <use href="#redis-cube" x="427" y="500" width="96" height="82"/>
    <use href="#db" x="642" y="490" width="88" height="93" style="color:#fff"/>
    <text class="label" x="475" y="609">Redis cache</text>
    <text class="label" x="686" y="609">Query / search store</text>
    <text class="small" x="585" y="638">order 42 appears as consumers catch up</text>
    <!-- Left-facing tip touches the storage border without entering the panel. -->
    <path id="update-view-flow" class="flow" d="M885 524H800"/>
    <path id="update-view-head" class="head" d="M802 518L790 524L802 530Z"/>
    <text class="detail" x="839" y="497">update</text>
  </g>

  <!-- The lower-left client reads the derived view through the API. -->
  <g id="query-api">
    <use href="#user" x="38" y="496" width="54" height="54"/>
    <text class="detail" x="65" y="580">Client</text>
    <path id="client-request-flow" class="flow" d="M98 524H135"/>
    <path id="client-request-head" class="head" d="M133 518L145 524L133 530Z"/>
    <rect class="service" x="145" y="490" width="160" height="68"/>
    <text class="label" x="225" y="518">User-facing<tspan x="225" dy="25">API</tspan></text>
    <text class="detail" x="225" y="585">Get order 42 or search</text>
    <path id="query-view-flow" class="flow" d="M305 524H370"/>
    <path id="query-view-head" class="head" d="M368 518L380 524L368 530Z"/>
    <text class="detail" x="343" y="497">query</text>
  </g>

  <!-- Preserve the original consistency warning and example-specific ownership. -->
  <g id="consistency-note">
    <rect x="30" y="681" width="1040" height="43" fill="#fff4da" stroke="#888" stroke-width="1.4"/>
    <text x="550" y="708" style="font-size:18px">Order accepted does not mean every view has caught up. Define what users see during lag.</text>
    <text class="small" x="550" y="751">Roles shown for this example: Kafka alone does not decide which store owns the facts.</text>
  </g>
</svg>
