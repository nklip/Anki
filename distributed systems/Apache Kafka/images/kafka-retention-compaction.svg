<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Kafka cleanup: delete old segments or compact old values</title>
<desc id="desc">Delete retention removes old log segments by time or size, whether consumers read them or not. Compaction eventually removes superseded records per key while retaining the original offsets of surviving records. A null-valued record is a tombstone for deleting a key; the tombstone can later be removed.</desc>
<!-- Shared typography, semantic fills, and manual arrows. -->
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:26px;font-weight:bold}.label{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#111;stroke-width:1.8}.blue{fill:#eaf3fb;stroke:#111;stroke-width:1.8}.amber{fill:#fff4db;stroke:#111;stroke-width:1.8}.shaft{fill:none;stroke:#111;stroke-width:1.8}</style></defs>
<rect width="1000" height="690" fill="#fff"/>
<!-- Two vertically stacked examples separate segment deletion from key compaction. -->
<text x="500" y="40" class="title" text-anchor="middle">Cleanup changes what can be replayed</text>
<text x="500" y="70" class="small" text-anchor="middle">Consumer reads do not delete records. The topic’s cleanup policy controls removal.</text>
<rect id="delete-panel" x="25" y="95" width="950" height="235" fill="#fafafa" stroke="#ccc"/>
<text x="45" y="126" class="label" font-weight="bold">1. Delete policy: remove old log segments by age or size</text>
<text x="45" y="158" class="small">Before</text>
<rect id="expired-segment" class="amber" x="45" y="175" width="200" height="83"/>
<text x="145" y="204" class="label" text-anchor="middle">Offsets 0–99</text>
<text x="145" y="234" class="small" text-anchor="middle">old segment</text>
<rect id="recent-segment-before" class="blue" x="265" y="175" width="210" height="83"/>
<text x="370" y="204" class="label" text-anchor="middle">Offsets 100–199</text>
<text x="370" y="234" class="small" text-anchor="middle">newer segment</text>
<!-- Clear transition corridor; arrowhead meets the resulting segment boundary. -->
<path id="delete-shaft" class="shaft" data-connector="true" d="M495 218 H703"/>
<path id="delete-head" d="M701 211 L715 218 L701 225Z" fill="#111"/>
<text x="604" y="185" class="small" text-anchor="middle">cleanup runs</text>
<text x="715" y="158" class="small">After</text>
<rect id="recent-segment-after" class="blue" x="715" y="175" width="230" height="83"/>
<text x="830" y="204" class="label" text-anchor="middle">Offsets 100–199</text>
<text x="830" y="234" class="small" text-anchor="middle">still available</text>
<text x="45" y="297" class="small">The expired segment is removed even if a slow consumer has never read it.</text>
<!-- Compaction example keeps offsets aligned to reveal the gap rather than renumbering. -->
<rect id="compact-panel" x="25" y="350" width="950" height="315" fill="#fafafa" stroke="#ccc"/>
<text x="45" y="381" class="label" font-weight="bold">2. Compact policy: eventually retain the latest value for each key</text>
<text x="45" y="416" class="small">Before</text>
<rect id="a-old" class="amber" x="180" y="393" width="190" height="68"/>
<text x="275" y="419" class="small" text-anchor="middle">offset 10</text>
<text x="275" y="445" class="label" text-anchor="middle">A = old</text>
<rect id="b-value" class="blue" x="400" y="393" width="190" height="68"/>
<text x="495" y="419" class="small" text-anchor="middle">offset 11</text>
<text x="495" y="445" class="label" text-anchor="middle">B = value</text>
<rect id="a-new" class="blue" x="620" y="393" width="190" height="68"/>
<text x="715" y="419" class="small" text-anchor="middle">offset 12</text>
<text x="715" y="445" class="label" text-anchor="middle">A = new</text>
<!-- Downward transition arrows stay in the gap between row containers. -->
<path id="compact-b-shaft" class="shaft" data-connector="true" d="M495 461 V486"/>
<path id="compact-b-head" d="M489 484 L495 498 L501 484Z" fill="#111"/>
<path id="compact-a-shaft" class="shaft" data-connector="true" d="M715 461 V486"/>
<path id="compact-a-head" d="M709 484 L715 498 L721 484Z" fill="#111"/>
<text x="45" y="535" class="small">After cleaning</text>
<text x="275" y="523" class="small" text-anchor="middle">10 is gone</text>
<text x="275" y="548" class="small" text-anchor="middle">gap is allowed</text>
<rect id="b-retained" class="blue" x="400" y="498" width="190" height="68"/>
<text x="495" y="524" class="small" text-anchor="middle">offset 11</text>
<text x="495" y="550" class="label" text-anchor="middle">B = value</text>
<rect id="a-retained" class="blue" x="620" y="498" width="190" height="68"/>
<text x="715" y="524" class="small" text-anchor="middle">offset 12</text>
<text x="715" y="550" class="label" text-anchor="middle">A = new</text>
<text x="45" y="600" class="small">Surviving records keep their offsets; compaction runs in the background.</text>
<text x="45" y="631" class="small">A = null is a tombstone: delete A. Later cleanup can remove the tombstone too.</text>
</svg>
