<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040" role="img" aria-labelledby="title desc">
  <title id="title">Three watermarks measure different kinds of progress</title>
  <desc id="desc">Read the top row from left to right, then the lower panel. The leader broker computes Kafka's low watermark to track deletion progress: for one partition with a leader log start offset of 20 and one live follower at 10, the minimum is 10, so deletion before offset 20 still waits. When both log start offsets reach 20, the low watermark becomes 20. Live followers count even when out of sync; offline brokers do not hold deletion back. Kafka brokers use the high watermark as an exclusive replication boundary: with HW 43, retained nontransactional records below offset 43 are readable, while offsets 43 and higher are held back. A leader log start offset of 20 and HW 43 allow reads of offsets 20 through 42 when there are no gaps. The bottom panel belongs to a stream processor and shows an event-time watermark of 12:01; an event timestamped 12:00:30 can still arrive and requires a late-event policy. Each Kafka Streams task tracks its stream time and applies window grace to manage late updates. A consumer group's saved restart offset is separate from broker watermarks.</desc>
  <!-- Shared typography, semantic fills, and the native server icon match adjacent Kafka diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .strong { font-size: 19px; font-weight: 700; }
      .detail { font-size: 17px; }
      .small { font-size: 16px; }
      .panel { fill: #fff; stroke: #888; stroke-width: 1.6; }
      .blue { fill: #eaf3ff; stroke: #888; stroke-width: 1.6; }
      .note { fill: #fff4da; stroke: #888; stroke-width: 1.6; }
      .shaft { fill: none; stroke: #171717; stroke-width: 2; stroke-linejoin: round; }
    </style>
    <symbol id="green-server" viewBox="0 0 30 60">
      <rect x="8" y="1" width="14" height="9" rx="1" fill="#65c515"/>
      <path d="M11 5 H19" stroke="#fff" stroke-width="1.5"/>
      <rect x="3" y="12" width="24" height="46" rx="1.5" fill="#65c515"/>
      <path d="M7 19 H23 M7 40 H23 M7 48 H23" stroke="#fff" stroke-width="2"/>
    </symbol>
  </defs>
  <!-- Canvas and lesson heading; top row uses offsets, lower panel uses timestamps. -->
  <rect width="1100" height="1040" fill="#fff"/>
  <text class="title" x="550" y="38" text-anchor="middle">Three watermarks measure different kinds of progress</text>
  <text class="detail" x="550" y="70" text-anchor="middle">Low and high watermarks use partition offsets; event-time watermarks use timestamps.</text>

  <!-- Low watermark: two live replicas feed one minimum. Log start and low watermark remain distinct. -->
  <g id="broker-low-watermark">
    <rect class="panel" x="30" y="100" width="500" height="515"/>
    <text class="heading" x="54" y="132">Kafka low watermark</text>
    <text class="detail" x="54" y="162">How far has deletion progressed?</text>
    <!-- Actor labels sit under each icon, clear of the explanatory text to the left. -->
    <use href="#green-server" x="457" y="120" width="30" height="60"/>
    <text id="low-watermark-owner" class="small" x="472" y="200" text-anchor="middle">Leader broker</text>
    <text class="detail" x="54" y="195">Log start = first available offset.</text>
    <text class="detail" x="54" y="219">Deletion request: remove offsets &lt; 20.</text>
    <rect id="leader-log-start" class="blue" x="56" y="240" width="200" height="75"/>
    <text class="strong" x="156" y="270" text-anchor="middle">Leader</text>
    <text class="detail" x="156" y="299" text-anchor="middle">log start = 20</text>
    <rect id="follower-log-start" class="note" x="304" y="240" width="200" height="75"/>
    <text class="strong" x="404" y="270" text-anchor="middle">Live follower</text>
    <text class="detail" x="404" y="299" text-anchor="middle">log start = 10</text>
    <!-- Both branches merge in an empty corridor. The downward shaft ends inside its head base. -->
    <path id="low-watermark-minimum-flow" class="shaft" data-connector="true" d="M156 315 V342 H280 V352"/>
    <path id="follower-minimum-flow" class="shaft" data-connector="true" d="M404 315 V342 H280"/>
    <path id="low-watermark-minimum-head" d="M274 350 L280 362 L286 350Z" fill="#171717"/>
    <rect id="low-watermark-waiting" class="note" x="60" y="362" width="440" height="60"/>
    <text class="strong" x="280" y="388" text-anchor="middle">Low watermark = min(20, 10) = 10</text>
    <text class="small" x="280" y="411" text-anchor="middle">Minimum across live replicas; deletion still waits.</text>
    <text class="detail" x="280" y="448" text-anchor="middle">After the follower's log start reaches 20:</text>
    <rect id="low-watermark-complete" class="blue" x="60" y="465" width="440" height="45"/>
    <text class="strong" x="280" y="494" text-anchor="middle">Low watermark = 20; deletion complete</text>
    <text class="small" x="54" y="545">Live = broker considered alive by Kafka.</text>
    <text class="small" x="54" y="569">Out-of-sync live followers still count.</text>
    <text class="small" x="54" y="593">Offline brokers do not hold deletion back.</text>
  </g>

  <!-- High watermark: offset 43 is the first held-back record, not the last readable one. -->
  <g id="broker-high-watermark">
    <rect class="panel" x="570" y="100" width="500" height="515"/>
    <text class="heading" x="594" y="132">Kafka high watermark (HW)</text>
    <text class="detail" x="594" y="162">How far can consumers read?</text>
    <use href="#green-server" x="997" y="120" width="30" height="60"/>
    <text id="high-watermark-owner" class="small" x="1012" y="200" text-anchor="middle">Kafka broker</text>
    <text class="detail" x="594" y="195">Replication commits a prefix of the log.</text>
    <text class="detail" x="594" y="219">Below: retained, nontransactional records.</text>
    <text class="strong" x="820" y="267" text-anchor="middle">HW = 43</text>
    <path id="hw-offset-boundary" d="M820 279 V365" fill="none" stroke="#1677b8" stroke-width="3"/>
    <g id="offset-41">
      <rect class="blue" x="606" y="291" width="85" height="62"/>
      <text class="small" x="648.5" y="316" text-anchor="middle">offset</text>
      <text class="strong" x="648.5" y="343" text-anchor="middle">41</text>
    </g>
    <g id="offset-42">
      <rect class="blue" x="706" y="291" width="85" height="62"/>
      <text class="small" x="748.5" y="316" text-anchor="middle">offset</text>
      <text class="strong" x="748.5" y="343" text-anchor="middle">42</text>
    </g>
    <g id="offset-43">
      <rect class="note" x="849" y="291" width="85" height="62"/>
      <text class="small" x="891.5" y="316" text-anchor="middle">offset</text>
      <text class="strong" x="891.5" y="343" text-anchor="middle">43</text>
    </g>
    <g id="offset-44">
      <rect class="note" x="949" y="291" width="85" height="62"/>
      <text class="small" x="991.5" y="316" text-anchor="middle">offset</text>
      <text class="strong" x="991.5" y="343" text-anchor="middle">44</text>
    </g>
    <text class="strong" x="698.5" y="394" text-anchor="middle">Readable</text>
    <text class="strong" x="941.5" y="394" text-anchor="middle">Held back</text>
    <text class="detail" x="820" y="430" text-anchor="middle">Consumer reads must stay below HW.</text>
    <rect id="consumer-read-range" class="blue" x="594" y="455" width="452" height="60"/>
    <text class="detail" x="820" y="480" text-anchor="middle">With log start = 20 and HW = 43:</text>
    <text class="detail" x="820" y="504" text-anchor="middle">offsets 20–42 are readable (no gaps).</text>
    <text class="small" x="594" y="545">endOffsets() = HW for read_uncommitted.</text>
    <text class="small" x="594" y="569">acks=all waits for the in-sync replicas (ISR).</text>
    <text class="small" x="594" y="593">read_committed can stop earlier.</text>
  </g>

  <!-- Event-time progress uses a timestamp axis; Kafka Streams details share the same lower panel. -->
  <g id="event-time-watermark">
    <rect class="panel" x="30" y="645" width="1040" height="345"/>
    <text class="heading" x="54" y="677">Event-time watermark</text>
    <text class="detail" x="54" y="705">How far have event timestamps progressed?</text>
    <!-- The labeled application icon is separate from the Streams-task rules below. -->
    <use href="#green-server" x="968" y="656" width="20" height="40"/>
    <text id="event-time-watermark-owner" class="small" x="978" y="718" text-anchor="middle">Stream processor</text>
    <text class="strong" x="296" y="744" text-anchor="middle">T = 12:01</text>
    <!-- The axis intentionally crosses its ticks and timestamp boundary. Labels stay outside that corridor. -->
    <path id="event-time-axis-flow" class="shaft" data-connector="true" d="M75 780 H536"/>
    <path id="event-time-axis-head" d="M534 774 L546 780 L534 786Z" fill="#171717"/>
    <path id="event-time-ticks" d="M96 771 V789 M496 771 V789" fill="none" stroke="#171717" stroke-width="1.6"/>
    <path id="event-time-watermark-boundary" d="M296 764 V797" fill="none" stroke="#1677b8" stroke-width="3"/>
    <text class="detail" x="96" y="821" text-anchor="middle">12:00</text>
    <text class="detail" x="296" y="821" text-anchor="middle">12:01</text>
    <text class="detail" x="496" y="821" text-anchor="middle">12:02</text>
    <rect id="late-arriving-event" class="note" x="55" y="849" width="256" height="60"/>
    <text class="detail" x="183" y="874" text-anchor="middle">Arrives now: event time</text>
    <text class="strong" x="183" y="898" text-anchor="middle">12:00:30</text>
    <!-- The horizontal shaft joins inside the head; its tip meets the late-policy box. -->
    <path id="apply-late-event-policy-flow" class="shaft" data-connector="true" d="M311 879 H350"/>
    <path id="apply-late-event-policy-head" d="M348 873 L360 879 L348 885Z" fill="#171717"/>
    <rect id="late-event-policy" class="panel" x="360" y="849" width="185" height="60"/>
    <text class="strong" x="452.5" y="874" text-anchor="middle">Late event</text>
    <text class="detail" x="452.5" y="898" text-anchor="middle">apply policy</text>
    <text class="detail" x="300" y="945" text-anchor="middle">Earlier events can still arrive.</text>
    <text class="small" x="300" y="972" text-anchor="middle">This watermark estimates timestamp progress.</text>
    <!-- Streams time and grace are supporting rules, not a fourth kind of broker watermark. -->
    <g id="streams-time-and-grace">
      <rect class="blue" x="574" y="730" width="472" height="239"/>
      <text class="strong" x="810" y="760" text-anchor="middle">Kafka Streams task: stream time + grace</text>
      <text class="detail" x="810" y="794" text-anchor="middle">Stream time = largest timestamp</text>
      <text class="detail" x="810" y="819" text-anchor="middle">observed by each task.</text>
      <text class="detail" x="810" y="855" text-anchor="middle">Window grace extends acceptance</text>
      <text class="detail" x="810" y="880" text-anchor="middle">of late updates, not window membership.</text>
      <text class="detail" x="810" y="916" text-anchor="middle">Time advances with records,</text>
      <text class="detail" x="810" y="941" text-anchor="middle">not a wall-clock timer.</text>
    </g>
  </g>
  <!-- Shared distinction from consumer-group progress. -->
  <text class="small" x="550" y="1020" text-anchor="middle">Broker watermarks track offsets; a consumer group saves its own restart offset.</text>
</svg>
