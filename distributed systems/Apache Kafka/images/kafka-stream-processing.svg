<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Kafka Streams: turn events into windowed counts</title>
<desc id="desc">Orders flow from the Kafka orders topic into a Kafka Streams application running in an application process. It groups records by merchant and minute, keeps a local count, and writes counts to the Kafka order-counts topic. A Kafka state changelog supports local-state restoration. With exactly_once_v2, supported Kafka processing coordinates offsets, state changes, and Kafka output. An external serving view has its own write and retry guarantees.</desc>
<!-- Shared typography and arrows: marker tips project 2.5 units past the compensated endpoints. -->
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.8}.panel{fill:#f7f7f7;stroke:#888;stroke-width:1.5}.blue{fill:#eaf3ff;stroke:#2868a6;stroke-width:1.8}.amber{fill:#fff3da;stroke:#a56a0b;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.metadata{fill:none;stroke:#111;stroke-width:1.8;stroke-dasharray:7 5;stroke-linejoin:round;marker-end:url(#arrow)}.coordination{fill:none;stroke:#111;stroke-width:1.8;stroke-dasharray:7 5;stroke-linejoin:round}.boundary{fill:#fafcff;stroke:#2868a6;stroke-width:1.8;stroke-dasharray:8 5}</style>
</defs>
<rect width="1000" height="650" fill="#fff"/>
<!-- Title and lesson. -->
<text x="500" y="40" font-size="26" text-anchor="middle" font-weight="bold">Kafka Streams: turn events into windowed counts</text>
<text x="500" y="72" font-size="18" text-anchor="middle">Example: orders per merchant per minute; late arrivals need an explicit policy.</text>
<!-- Dashed boundary is a processing guarantee, not a machine or broker boundary. -->
<rect id="kafka-processing-boundary" class="boundary" x="25" y="110" width="710" height="425"/>
<text x="380" y="144" font-size="18" text-anchor="middle" font-weight="bold">Coordinated Kafka offsets, state changelog, and outputs*</text>
<!-- The application runs outside Kafka brokers; the left and right nodes are Kafka topics. -->
<rect id="orders-topic" class="blue" x="50" y="205" width="150" height="83"/>
<text x="125" y="231" font-size="21" text-anchor="middle" font-weight="bold">orders</text>
<text x="125" y="259" font-size="17" text-anchor="middle">merchant = 7</text>
<text x="125" y="315" font-size="16" text-anchor="middle">Kafka input topic</text>
<rect id="streams-app" class="box" x="255" y="175" width="255" height="220"/>
<text x="382.5" y="203" font-size="20" text-anchor="middle" font-weight="bold">Streams application</text>
<text x="382.5" y="227" font-size="16" text-anchor="middle">runs in your process</text>
<text x="382.5" y="257" font-size="17" text-anchor="middle">Group → window → count</text>
<rect id="local-state" class="blue" x="279" y="280" width="207" height="88"/>
<text x="382.5" y="310" font-size="19" text-anchor="middle" font-weight="bold">Local state</text>
<text x="382.5" y="337" font-size="16" text-anchor="middle">merchant 7 / 12:00</text>
<text x="382.5" y="360" font-size="16" text-anchor="middle">count = 12</text>
<rect id="counts-topic" class="blue" x="575" y="205" width="135" height="83"/>
<text x="642.5" y="231" font-size="19" text-anchor="middle" font-weight="bold">order-counts</text>
<text x="642.5" y="259" font-size="17" text-anchor="middle">count = 12</text>
<text x="642.5" y="315" font-size="16" text-anchor="middle">Kafka output topic</text>
<path id="input-to-streams" class="flow" d="M200 246 L252.5 246"/>
<path id="streams-to-output" class="flow" d="M510 246 L572.5 246"/>
<!-- State changes are logged in Kafka; restoration flows back into local state. The vertical shafts stay outside all local-state labels. -->
<rect id="state-changelog" class="box" x="255" y="449" width="255" height="67"/>
<text x="382.5" y="477" font-size="20" text-anchor="middle" font-weight="bold">State changelog</text>
<text x="382.5" y="501" font-size="16" text-anchor="middle">Kafka topic for restoration</text>
<path id="log-state-changes" class="flow" d="M300 368 V446.5"/>
<path id="restore-local-state" class="flow" d="M465 449 V370.5"/>
<text x="315" y="421" font-size="16" text-anchor="start">log</text>
<text x="450" y="421" font-size="16" text-anchor="end">restore</text>
<!-- Downstream materialization lies outside the conditional Kafka guarantee. -->
<rect id="serving-view" class="box" x="775" y="194" width="200" height="115"/>
<text x="875" y="224" font-size="21" text-anchor="middle" font-weight="bold">Serving view</text>
<text x="875" y="252" font-size="16" text-anchor="middle">consumer + query store</text>
<text x="875" y="281" font-size="16" text-anchor="middle">dashboard reads here</text>
<path id="output-to-serving-view" class="flow" d="M710 246 L772.5 246"/>
<text x="875" y="365" font-size="18" text-anchor="middle" font-weight="bold">External writes</text>
<text x="875" y="394" font-size="17" text-anchor="middle">need their own</text>
<text x="875" y="420" font-size="17" text-anchor="middle">retry guarantees.</text>
<!-- Explain the conditional guarantee and its scope without implying business deduplication. -->
<text x="500" y="571" font-size="18" text-anchor="middle">*Enable processing.guarantee=exactly_once_v2 for supported Kafka processing.</text>
<text x="500" y="602" font-size="17" text-anchor="middle">It does not include arbitrary external API calls or remove duplicate business events.</text>
<text x="500" y="630" font-size="16" text-anchor="middle">A window groups events into a time interval. Repartition topics may be needed (omitted).</text>
</svg>
