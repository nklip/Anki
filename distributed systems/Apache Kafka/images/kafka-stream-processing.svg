<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="743" viewBox="0 0 1100 743" role="img" aria-labelledby="title desc">
<title id="title">Kafka Streams: turn events into windowed counts</title>
<desc id="desc">Orders flow from a Kafka input topic into a Kafka Streams application running in your process. It groups orders by merchant, windows them by minute, and counts them in local state. A Kafka changelog supports restoration. Counts go to the order-counts topic, then a consumer updates a query store read by the dashboard. With exactly_once_v2, supported Kafka processing coordinates offsets, state changes, and Kafka output; external writes have their own retry guarantees and duplicate business events are not removed.</desc>
<!-- Shared system-design typography and native icons, matching kafka-data-placement.svg.
     Icon sources: Proximity Service final-design.svg; Notification System improved-design.svg. -->
<defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #171717; }
.title { font-size: 28px; font-weight: 700; }
.label { font-size: 20px; }
.strong { font-size: 20px; font-weight: 700; }
.detail { font-size: 17px; }
.small { font-size: 16px; }
.mono { font-family: Consolas, Menlo, monospace; font-size: 16px; }
.panel { fill: #fff; stroke: #888; stroke-width: 1.6; }
.blue { fill: #eaf3ff; stroke: #888; stroke-width: 1.6; }
.note { fill: #fff4da; stroke: #888; stroke-width: 1.4; }
.service { fill: #fff; stroke: #171717; stroke-width: 1.6; }
</style>
<symbol id="green-server" viewBox="0 0 30 60">
      <rect x="8" y="1" width="14" height="9" rx="1" fill="#65c515"/>
      <path d="M11 5 H19" stroke="#fff" stroke-width="1.5"/>
      <rect x="3" y="12" width="24" height="46" rx="1.5" fill="#65c515"/>
      <path d="M7 19 H23 M7 40 H23 M7 48 H23" stroke="#fff" stroke-width="2"/>
    </symbol>
<symbol id="channel-queue" viewBox="0 0 150 58">
      <path d="M2 2 H135 L148 29 L135 56 H2 Z" fill="#fff" stroke="#1677b8" stroke-width="4"/>
      <g fill="none" stroke="#1677b8" stroke-width="4">
        <rect x="10" y="12" width="36" height="33"/><path d="M10 13 L28 29 L46 13"/>
        <rect x="54" y="12" width="36" height="33"/><path d="M54 13 L72 29 L90 13"/>
        <rect x="98" y="12" width="36" height="33"/><path d="M98 13 L116 29 L134 13"/>
      </g>
    </symbol>
<symbol id="db" viewBox="0 0 88 93">
      <path d="M0.9 13.75A43.1 8.75 0 0 1 87.1 13.75V82.25A43.1 8.75 0 0 1 0.9 82.25Z" fill="currentColor" stroke="#111" stroke-width="1.6"/>
      <ellipse cx="44" cy="13.75" rx="43.1" ry="8.75" fill="currentColor" stroke="#111" stroke-width="1.6"/>
    </symbol>
</defs>
<!-- Canvas and lesson heading. -->
<rect width="1100" height="743" fill="#fff"/>
<text class="title" x="550.0" y="35" text-anchor="middle" >Kafka Streams: turn events into windowed counts</text>
<text class="detail" x="550.0" y="66" text-anchor="middle" >Orders per merchant per minute; choose an explicit policy for late arrivals.</text>
<!-- kafka-guarantee-boundary -->
<g id="kafka-guarantee-boundary">
<!-- The stepped outline stays close to all four coordinated components, excluding the unused area below the output topic. -->
<path class="panel" d="M30 106 H775 V404 H573 V596 H30 Z" stroke-dasharray="8 5"/><text class="strong" x="402.5" y="137" text-anchor="middle" >Coordinated Kafka processing*</text>
</g><!-- orders-input -->
<g id="orders-input">
<use href="#channel-queue" x="45" y="215" width="190" height="76"/><text class="strong" x="140" y="325" text-anchor="middle" >orders</text><text class="detail" x="140" y="352" text-anchor="middle" >merchant = 7</text><text class="small" x="140" y="379" text-anchor="middle" >Kafka input topic</text>
</g><!-- streams-application -->
<g id="streams-application">
<rect class="panel" x="270" y="169" width="280" height="283" /><text class="strong" x="410" y="199" text-anchor="middle" >Streams application</text><text class="small" x="410" y="225" text-anchor="middle" >Runs in your process</text><use href="#green-server" x="293" y="243" width="42" height="84"/><text class="detail" x="444" y="266" text-anchor="middle" >Group by merchant<tspan x="444" dy="26">Window: one minute</tspan><tspan x="444" dy="26">Count events</tspan></text><use href="#db" x="287" y="348" width="62" height="67" style="color:#fff"/><text class="strong" x="436" y="362" text-anchor="middle" >Local state</text><text class="small" x="436" y="388" text-anchor="middle" >7 / 12:00<tspan x="436" dy="24">count = 12</tspan></text>
</g><!-- order-counts-output -->
<g id="order-counts-output">
<use href="#channel-queue" x="575" y="215" width="176" height="76"/><text class="strong" x="663" y="325" text-anchor="middle" >order-counts</text><text class="detail" x="663" y="352" text-anchor="middle" >count = 12</text><text class="small" x="663" y="379" text-anchor="middle" >Kafka output topic</text>
</g><!-- Read left to right: input events, application transformation, and published counts. -->
<g id="processing-flow">
<!-- orders-to-app: shaft ends inside its separate arrowhead base. -->
<path id="orders-to-app-flow" data-connector="true" d="M239 255 L260 255" fill="none" stroke="#171717" stroke-width="2"/><path id="orders-to-app-head" d="M258 261 L270 255 L258 249Z" fill="#171717"/><!-- app-to-counts: shaft ends inside its separate arrowhead base. -->
<path id="app-to-counts-flow" data-connector="true" d="M550 255 L562 255" fill="none" stroke="#171717" stroke-width="2"/><path id="app-to-counts-head" d="M560 261 L572 255 L560 249Z" fill="#171717"/>
</g><!-- The two state arrows touch panel borders; the changelog supports local-state restoration. -->
<!-- The changelog occupies the lower-left space beneath input; state connectors stay in the lower corridor and touch panel borders. -->
<g id="state-changelog">
<rect class="panel" x="60" y="461" width="255" height="110" /><use href="#channel-queue" x="107.5" y="471" width="160" height="63"/><text class="strong" x="187.5" y="558" text-anchor="middle" >State changelog in Kafka</text><!-- log-state-changes: shaft ends inside its separate arrowhead base. -->
<path id="log-state-changes-flow" data-connector="true" d="M370 452 L370 486 L325 486" fill="none" stroke="#171717" stroke-width="2"/><path id="log-state-changes-head" d="M327 480 L315 486 L327 492Z" fill="#171717"/><text class="small" x="342" y="474" text-anchor="middle" >log</text><!-- restore-local-state: shaft ends inside its separate arrowhead base. -->
<path id="restore-local-state-flow" data-connector="true" d="M315 538 L510 538 L510 462" fill="none" stroke="#171717" stroke-width="2"/><path id="restore-local-state-head" d="M516 464 L510 452 L504 464Z" fill="#171717"/><text class="small" x="417" y="522" text-anchor="middle" >restore</text>
</g><!-- serving-view -->
<g id="serving-view">
<rect class="panel" x="820" y="181" width="250" height="266" /><text class="strong" x="945" y="211" text-anchor="middle" >Serving view</text><use href="#green-server" x="849" y="239" width="42" height="84"/><use href="#db" x="968.5" y="242" width="67" height="80" style="color:#fff"/><!-- materialize-query-store: shaft ends inside its separate arrowhead base. -->
<path id="materialize-query-store-flow" data-connector="true" d="M901 280 L951 280" fill="none" stroke="#171717" stroke-width="2"/><path id="materialize-query-store-head" d="M949 286 L961 280 L949 274Z" fill="#171717"/><text class="detail" x="870" y="351" text-anchor="middle" >Consumer</text><text class="detail" x="1002" y="351" text-anchor="middle" >Query store</text><text class="detail" x="945" y="391" text-anchor="middle" >External writes need<tspan x="945" dy="25">their own retry guarantees.</tspan></text><!-- counts-to-serving: shaft ends inside its separate arrowhead base. -->
<path id="counts-to-serving-flow" data-connector="true" d="M752 255 L810 255" fill="none" stroke="#171717" stroke-width="2"/><path id="counts-to-serving-head" d="M808 261 L820 255 L808 249Z" fill="#171717"/>
</g><!-- merchant-dashboard -->
<!-- The dashboard sits directly below its external serving view; its result connector ends at the monitor boundary. -->
<g id="merchant-dashboard">
<!-- dashboard-query-result: shaft ends inside its separate arrowhead base. -->
<path id="dashboard-query-result-flow" data-connector="true" d="M945 447 L945 477" fill="none" stroke="#171717" stroke-width="2"/><path id="dashboard-query-result-head" d="M939 475 L945 487 L951 475Z" fill="#171717"/><text class="small" x="997" y="474" text-anchor="middle" >counts</text><rect x="880" y="487" width="130" height="84" rx="2" fill="#fff" stroke="#171717" stroke-width="2"/><path d="M925 589 H965 M945 571 V589" fill="none" stroke="#171717" stroke-width="2"/><path d="M901 551 V534 H919 V551 M934 551 V520 H952 V551 M967 551 V508 H985 V551" fill="#eaf3ff" stroke="#1677b8" stroke-width="2"/><text class="strong" x="945" y="620" text-anchor="middle" >Dashboard</text>
</g><!-- guarantee-and-window-notes -->
<g id="guarantee-and-window-notes">
<text class="detail" x="550" y="654" text-anchor="middle" >*processing.guarantee=exactly_once_v2 coordinates Kafka offsets, state changes, and output.</text><text class="detail" x="550" y="685" text-anchor="middle" >It excludes arbitrary external API calls and does not remove duplicate business events.</text><text class="small" x="550" y="716" text-anchor="middle" >A window groups events into a time interval. Repartition topics may be needed (omitted).</text>
</g>
</svg>
