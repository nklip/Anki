<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" role="img" aria-labelledby="title desc">
<title id="title">Kafka Connect moves product changes from a database to a search view</title>
<desc id="desc">A merchant updates a product in its authoritative database. A source connector task in a Connect worker imports the change into the products topic on Kafka brokers. A sink connector task in a Connect worker reads the topic and writes a derived search view. Workers are separate processes from brokers. The view may lag, and delivery guarantees depend on the connectors and destination.</desc>
<!-- Shared typography and process boundaries; task boxes sit within worker boxes. -->
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:26px;font-weight:bold}.label{font-size:20px}.task{font-size:19px;font-weight:bold}.small{font-size:17px}.box{fill:#fff;stroke:#111;stroke-width:1.8}.blue{fill:#eaf3fb;stroke:#111;stroke-width:1.8}.amber{fill:#fff4db;stroke:#111;stroke-width:1.8}.shaft{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round}</style></defs>
<rect width="1000" height="665" fill="#fff"/>
<!-- Read clockwise: merchant, database, source task, Kafka topic, sink task, search view. -->
<text x="500" y="40" class="title" text-anchor="middle">Kafka Connect: move a product change into a search view</text>
<text x="500" y="70" class="small" text-anchor="middle">Source = import into Kafka. Sink = export from Kafka to another system.</text>
<rect id="merchant" class="box" x="30" y="155" width="190" height="100"/>
<text x="125" y="191" class="label" font-weight="bold" text-anchor="middle">Merchant</text>
<text x="125" y="224" class="small" text-anchor="middle">Change product 7</text>
<rect id="product-database" class="blue" x="330" y="145" width="240" height="120"/>
<text x="450" y="178" class="label" font-weight="bold" text-anchor="middle">Product database</text>
<text x="450" y="210" class="small" text-anchor="middle">Authoritative state</text>
<text x="450" y="240" class="small" text-anchor="middle">product 7 = updated</text>
<!-- Source worker is a runtime process separate from the brokers below it. -->
<rect id="source-worker" class="blue" x="690" y="110" width="280" height="175"/>
<text x="830" y="140" class="label" font-weight="bold" text-anchor="middle">Connect worker A</text>
<rect id="source-task" class="box" x="710" y="159" width="240" height="101"/>
<text x="830" y="189" class="task" text-anchor="middle">Source connector task</text>
<text x="830" y="220" class="small" text-anchor="middle">Read database changes</text>
<text x="830" y="245" class="small" text-anchor="middle">Publish product events</text>
<!-- Manual shafts stop under their triangular bases; arrow noses meet target borders. -->
<path id="merchant-update-shaft" class="shaft" data-connector="true" d="M220 205 H318"/>
<path id="merchant-update-head" d="M316 198 L330 205 L316 212Z" fill="#111"/>
<text x="275" y="183" class="small" text-anchor="middle">update</text>
<path id="source-read-shaft" class="shaft" data-connector="true" d="M570 205 H678"/>
<path id="source-read-head" d="M676 198 L690 205 L676 212Z" fill="#111"/>
<text x="630" y="183" class="small" text-anchor="middle">changes</text>
<!-- The topic belongs to Kafka brokers, not to either Connect worker. -->
<rect id="brokers" x="735" y="360" width="235" height="150" fill="#f4f4f4" stroke="#111" stroke-width="1.8"/>
<text x="852" y="390" class="label" font-weight="bold" text-anchor="middle">Kafka brokers</text>
<rect id="products-topic" class="box" x="755" y="406" width="195" height="81"/>
<text x="852" y="435" class="label" text-anchor="middle">products topic</text>
<text x="852" y="465" class="small" text-anchor="middle">ProductUpdated(7)</text>
<path id="source-publish-shaft" class="shaft" data-connector="true" d="M852 285 V348"/>
<path id="source-publish-head" d="M845 346 L852 360 L859 346Z" fill="#111"/>
<text x="748" y="326" class="small" text-anchor="middle">into Kafka</text>
<!-- Sink task exports retained events into a queryable destination. -->
<rect id="sink-worker" class="blue" x="375" y="340" width="280" height="175"/>
<text x="515" y="372" class="label" font-weight="bold" text-anchor="middle">Connect worker B</text>
<rect id="sink-task" class="box" x="395" y="391" width="240" height="101"/>
<text x="515" y="421" class="task" text-anchor="middle">Sink connector task</text>
<text x="515" y="452" class="small" text-anchor="middle">Read product events</text>
<text x="515" y="477" class="small" text-anchor="middle">Write search documents</text>
<path id="sink-read-shaft" class="shaft" data-connector="true" d="M735 443 H667"/>
<path id="sink-read-head" d="M669 436 L655 443 L669 450Z" fill="#111"/>
<text x="695" y="419" class="small" text-anchor="middle">read</text>
<rect id="search-view" class="box" x="30" y="375" width="235" height="115"/>
<text x="147" y="407" class="label" font-weight="bold" text-anchor="middle">Search view</text>
<text x="147" y="438" class="small" text-anchor="middle">Derived product state</text>
<text x="147" y="467" class="small" text-anchor="middle">May lag behind the update</text>
<path id="sink-write-shaft" class="shaft" data-connector="true" d="M375 443 H277"/>
<path id="sink-write-head" d="M279 436 L265 443 L279 450Z" fill="#111"/>
<text x="320" y="419" class="small" text-anchor="middle">write</text>
<!-- Runtime and delivery caveats keep the product roles explicit. -->
<text x="500" y="550" class="small" text-anchor="middle">Connect workers run tasks; Kafka brokers store the topic. They are separate processes.</text>
<rect id="delivery-note" class="amber" x="30" y="575" width="940" height="65"/>
<text x="500" y="602" class="small" text-anchor="middle">Delivery and recovery depend on the connectors and the destination’s write behavior.</text>
<text x="500" y="627" class="small" text-anchor="middle">Using Connect alone does not promise exactly-once effects in every destination.</text>
</svg>
