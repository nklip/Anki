<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Every server is a follower, a candidate, or a leader</title>
  <desc id="desc">Three state boxes in a row. A server starts up as a follower. A follower that times out becomes a candidate. A candidate that wins votes from a majority becomes the leader; a candidate that times out again starts another election; a candidate that discovers a current leader or a newer term returns to follower. A leader that discovers a server with a higher term also returns to follower.</desc>
  <!-- Server icon copied from System Design/01. Scaling/images/message-queue.svg. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <rect width="1120" height="580" fill="#fff"/>

  <!-- Lesson heading. -->
  <text x="28" y="43" class="title" text-anchor="start">Every server is a follower, a candidate, or a leader</text>
  <text x="28" y="77" class="sub" text-anchor="start">Each arrow label is the event that causes the change; the two return arrows run underneath.</text>

  <!-- Self-loop for a failed election; drawn above the candidate so the label stays clear of both neighbours. -->
  <text x="560" y="128" class="small" text-anchor="middle">times out again,</text>
  <text x="560" y="150" class="small" text-anchor="middle">starts a new election</text>
  <path data-connector="true" d="M495 250L495 176L625 176L625 238" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="625,250 619,236 631,236" fill="#17212f"/>

  <!-- Forward transition labels sit above the boxes, never inside the 12px arrow corridors. -->
  <text x="397" y="214" class="small" text-anchor="middle">times out,</text>
  <text x="397" y="236" class="small" text-anchor="middle">starts an election</text>
  <text x="722" y="214" class="small" text-anchor="middle">wins votes from</text>
  <text x="722" y="236" class="small" text-anchor="middle">a majority</text>

  <!-- Entry into the cluster: a server always boots as a follower. -->
  <text x="30" y="238" class="small" text-anchor="start">starts up</text>
  <path data-connector="true" d="M30 300L86 300" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="98,300 84,294 84,306" fill="#17212f"/>

  <!-- THE THREE STATES. -->
  <rect x="110" y="250" width="250" height="100" rx="12" class="node" fill="#f0f8fc"/>
  <use href="#server" x="128" y="274" width="30" height="52"/>
  <text x="174" y="290" class="heading" text-anchor="start">Follower</text>
  <text x="174" y="320" class="small" text-anchor="start">answers requests</text>

  <rect x="435" y="250" width="250" height="100" rx="12" class="node" fill="#fff"/>
  <use href="#server" x="453" y="274" width="30" height="52"/>
  <text x="499" y="290" class="heading" text-anchor="start">Candidate</text>
  <text x="499" y="320" class="small" text-anchor="start">asks for votes</text>

  <rect x="760" y="250" width="250" height="100" rx="12" class="node" fill="#f3faed"/>
  <use href="#server" x="778" y="274" width="30" height="52"/>
  <text x="824" y="290" class="heading" text-anchor="start">Leader</text>
  <text x="824" y="320" class="small" text-anchor="start">runs the log</text>

  <path data-connector="true" d="M372 300L411 300" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="423,300 409,294 409,306" fill="#17212f"/>
  <path data-connector="true" d="M697 300L736 300" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="748,300 734,294 734,306" fill="#17212f"/>

  <!-- Both demotions land on the follower box; they run at two depths so the shafts never cross. -->
  <path data-connector="true" d="M560 350L560 400L237 400L237 362" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="237,350 231,364 243,364" fill="#0b78b5"/>
  <text x="432" y="428" class="small" text-anchor="middle" style="fill:#0b78b5">discovers a current leader or a newer term</text>

  <path data-connector="true" d="M885 350L885 470L213 470L213 362" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <polygon points="213,350 207,364 219,364" fill="#0b78b5"/>
  <text x="550" y="498" class="small" text-anchor="middle" style="fill:#0b78b5">discovers a server with a higher term</text>

  <text x="28" y="545" class="body" text-anchor="start">Timeouts and messages move a server between these states.</text>
</svg>
