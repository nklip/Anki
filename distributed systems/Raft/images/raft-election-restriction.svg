<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">A voter refuses any candidate whose log is behind its own</title>
  <desc id="desc">One voter whose log ends at index 5 in term 3 judges four candidates. Candidate A ends at index 4 in term 3 and is refused because its log is shorter in the same term. Candidate B ends at index 7 in term 2 and is refused because its last term is older, even though its log is longer. Candidate C ends at index 5 in term 3 and is granted. Candidate D ends at index 6 in term 3 and is granted.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .tiny { font-size: 15px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <rect width="1120" height="700" fill="#fff"/>

  <text x="28" y="43" class="title" text-anchor="start">A voter refuses any candidate whose log is behind its own</text>
  <text x="28" y="77" class="sub" text-anchor="start">Compare the last entry only: term first, then length.</text>

  <!-- The yardstick every RequestVote in this diagram is measured against. -->
  <rect x="28" y="110" width="1064" height="96" rx="12" class="node" fill="#f0f8fc"/>
  <use href="#server" x="48" y="129" width="22" height="38"/>
  <text x="84" y="150" class="heading" text-anchor="start">The voter's own log ends at index 5, term 3</text>
  <text x="48" y="186" class="small" text-anchor="start">It compares every incoming RequestVote against exactly this one entry.</text>

  <rect x="28" y="224" width="1064" height="96" rx="12" class="node" fill="#f7f8fa"/>
  <text x="48" y="264" class="heading" text-anchor="start">The rule, in order</text>
  <text x="48" y="300" class="small" text-anchor="start">Grant if the candidate's last term is later, or equal with a log at least as long.</text>

  <!-- Four verdicts against the same yardstick; the badge column carries the outcome in words. -->
  <text x="84" y="380" class="tiny" text-anchor="start">candidate</text>
  <text x="280" y="380" class="tiny" text-anchor="start">its last entry</text>
  <text x="510" y="380" class="tiny" text-anchor="start">compared with index 5, term 3</text>
  <text x="970" y="380" class="tiny" text-anchor="middle">vote</text>
  <path d="M48 392L1060 392" fill="none" stroke="#b9c8d4" stroke-width="2"/>

  <use href="#server" x="48" y="411" width="22" height="38"/>
  <text x="84" y="437" class="small" text-anchor="start">Candidate A</text>
  <text x="280" y="437" class="small" text-anchor="start">index 4, term 3</text>
  <text x="510" y="437" class="small" text-anchor="start">same term, shorter log</text>
  <rect x="880" y="413" width="180" height="34" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="970" y="436" class="small" text-anchor="middle" style="fill:#c0392b">refused</text>

  <use href="#server" x="48" y="459" width="22" height="38"/>
  <text x="84" y="485" class="small" text-anchor="start">Candidate B</text>
  <text x="280" y="485" class="small" text-anchor="start">index 7, term 2</text>
  <text x="510" y="485" class="small" text-anchor="start">older term, even though longer</text>
  <rect x="880" y="461" width="180" height="34" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="970" y="484" class="small" text-anchor="middle" style="fill:#c0392b">refused</text>

  <use href="#server" x="48" y="507" width="22" height="38"/>
  <text x="84" y="533" class="small" text-anchor="start">Candidate C</text>
  <text x="280" y="533" class="small" text-anchor="start">index 5, term 3</text>
  <text x="510" y="533" class="small" text-anchor="start">identical last entry</text>
  <rect x="880" y="509" width="180" height="34" rx="8" class="node" fill="#f3faed"/>
  <text x="970" y="532" class="small" text-anchor="middle">granted</text>

  <use href="#server" x="48" y="555" width="22" height="38"/>
  <text x="84" y="581" class="small" text-anchor="start">Candidate D</text>
  <text x="280" y="581" class="small" text-anchor="start">index 6, term 3</text>
  <text x="510" y="581" class="small" text-anchor="start">same term, longer log</text>
  <rect x="880" y="557" width="180" height="34" rx="8" class="node" fill="#f3faed"/>
  <text x="970" y="580" class="small" text-anchor="middle">granted</text>

  <text x="28" y="632" class="small" text-anchor="start">Candidate B has the longest log and still loses: an older last term means its extra entries were never committed.</text>
  <text x="28" y="672" class="body" text-anchor="start">Every committed entry sits on a majority, so some voter blocks a candidate missing it.</text>
</svg>
