<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
  <title id="title">One write, message by message</title>
  <desc id="desc">A sequence chart of one write. The client sends the command to the leader, which appends it to its own log on disk, then sends AppendEntries to follower A and follower B. Follower A replies that the entry is on disk. The leader now has the entry on two of three servers, which is a majority, so it commits and answers the client. Follower B's acknowledgement arrives afterwards and changes nothing.</desc>
  <!-- Message sequence chart: time runs downward. Solid shafts are requests, dashed
       shafts are replies, and a shaft may cross a lifeline it is not addressed to. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
      .life { stroke: #8a94a6; stroke-width: 2.5; stroke-dasharray: 3 6; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
  </defs>
  <rect width="1120" height="840" fill="#fff"/>

  <text x="28" y="43" class="title" text-anchor="start">One write, message by message</text>
  <text x="28" y="77" class="sub" text-anchor="start">Time runs downward. Solid arrows are requests, dashed arrows are replies.</text>

  <!-- Everything inside this outline is the Raft group; the client sits outside it. -->
  <rect x="310" y="96" width="766" height="604" rx="12" fill="#f7f8fa" stroke="#8a94a6" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="332" y="130" class="heading" text-anchor="start">Raft group</text>
  <use href="#laptop" x="92" y="140" width="52" height="33"/>
  <rect x="18" y="198" width="200" height="54" rx="10" class="node" fill="#f3faed"/>
  <text x="118" y="232" class="heading" text-anchor="middle">Client</text>
  <use href="#server" x="407" y="140" width="26" height="46"/>
  <rect x="320" y="198" width="200" height="54" rx="10" class="node" fill="#f3faed"/>
  <text x="420" y="232" class="heading" text-anchor="middle">Leader</text>
  <use href="#server" x="707" y="140" width="26" height="46"/>
  <rect x="620" y="198" width="200" height="54" rx="10" class="node" fill="#f0f8fc"/>
  <text x="720" y="232" class="heading" text-anchor="middle">Follower A</text>
  <use href="#server" x="957" y="140" width="26" height="46"/>
  <rect x="870" y="198" width="200" height="54" rx="10" class="node" fill="#f0f8fc"/>
  <text x="970" y="232" class="heading" text-anchor="middle">Follower B</text>
  <path class="life" d="M118 258L118 700"/>
  <path class="life" d="M420 258L420 700"/>
  <path class="life" d="M720 258L720 700"/>
  <path class="life" d="M970 258L970 700"/>
  <path data-connector="true" d="M118 300L408 300" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="420,300 406,294 406,306" fill="#17212f"/>
  <!-- Centred between the client lifeline (118) and the group outline (310) so the dashed border never crosses the label. -->
  <text x="214" y="284" class="small" text-anchor="middle">command x←3</text>
  <path data-connector="true" d="M420 342L484 342L484 366L432 366" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="420,366 434,360 434,372" fill="#17212f"/>
  <text x="438" y="330" class="small" text-anchor="start">append it to its own log</text>
  <path data-connector="true" d="M420 412L708 412" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="720,412 706,406 706,418" fill="#17212f"/>
  <text x="570" y="396" class="small" text-anchor="middle">AppendEntries</text>
  <path data-connector="true" d="M420 454L958 454" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="970,454 956,448 956,460" fill="#17212f"/>
  <text x="750" y="438" class="small" text-anchor="start">AppendEntries</text>
  <path data-connector="true" d="M720 512L432 512" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="420,512 434,506 434,518" fill="#0b78b5"/>
  <text x="570" y="496" class="small" text-anchor="middle">ack — the entry is on disk</text>
  <path data-connector="true" d="M420 554L484 554L484 578L432 578" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="420,578 434,572 434,584" fill="#17212f"/>
  <text x="438" y="542" class="small" text-anchor="start">a majority has it — committed</text>
  <path data-connector="true" d="M420 624L130 624" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="118,624 132,618 132,630" fill="#0b78b5"/>
  <text x="214" y="608" class="small" text-anchor="middle">success</text>
  <path data-connector="true" d="M970 680L432 680" fill="none" stroke="#8a94a6" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="420,680 434,674 434,686" fill="#8a94a6"/>
  <text x="440" y="664" class="small" text-anchor="start" style="fill:#8a94a6">a late ack, no longer needed</text>

  <!-- Names the outcome the sequence above produces. -->
  <rect x="28" y="718" width="1064" height="74" rx="10" class="node" fill="#f3faed"/>
  <text x="50" y="754" class="heading" text-anchor="start">Committed means a majority has it on disk</text>
  <text x="50" y="786" class="small" text-anchor="start">The client is answered at that moment, not when the last follower finally replies.</text>

  <text x="28" y="826" class="body" text-anchor="start">The leader stops waiting at the majority; the rest of the cluster catches up behind the answer.</text>
</svg>
