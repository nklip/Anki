<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="title desc">
  <title id="title">Copies on a majority do not commit an old-term entry</title>
  <desc id="desc">Two possible futures from the same starting point, based on Figure 8 of the Raft paper. S1 leads term 4 and has copied its term-2 entry at index 2 to S2 and S3, three of five servers; S4 holds only index 1, and S5 holds a different entry from term 3 at index 2. In future A, S1 crashes at once. S5 asks for votes; its last entry is from term 3, newer than the term-2 and term-1 entries that end the logs of S2, S3 and S4, so all three grant, S5 wins with four of five votes and replaces index 2 on every server, so the term-2 entry is lost although a majority held it. In future B, S1 first copies a term-4 entry at index 3 to S2 and S3 and then crashes. S2 and S3 now end in term 4, newer than term 3, so they refuse; S5 gets only its own vote and S4's, two of five, and cannot win. Index 3 is committed, and index 2 is committed with it.</desc>
  <!-- Shared styles and the server glyphs used by every Raft diagram in this folder. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .tiny { font-size: 15px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
    <symbol id="server-dead" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#c9cfd6"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <rect width="1120" height="652" fill="#fff"/>

  <text x="28" y="43" class="title" text-anchor="start">Copies on a majority do not commit an old-term entry</text>
  <text x="28" y="77" class="sub" text-anchor="start">Both futures start alike: S1 leads term 4, and its term-2 entry at index 2 sits on S1, S2 and S3.</text>

  <!-- FUTURE A: term 3 beats every log that ends in term 1 or 2, so S5 wins and the term-2 entry (red) is overwritten. -->
  <rect x="28" y="100" width="520" height="476" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="136" class="heading" text-anchor="start">Future A &#8212; S1 crashes now</text>
  <text x="48" y="164" class="small" text-anchor="start">S5, whose last entry is term 3, asks for votes.</text>
  <!-- Column headers: log index over the cells, the vote each server gives S5 over the badges (S5 counts its own vote). -->
  <text x="126" y="196" class="tiny" text-anchor="end">index</text>
  <text x="169" y="196" class="tiny" text-anchor="middle">1</text>
  <text x="245" y="196" class="tiny" text-anchor="middle">2</text>
  <text x="321" y="196" class="tiny" text-anchor="middle">3</text>
  <text x="448" y="196" class="tiny" text-anchor="middle">vote for S5</text>
  <use href="#server-dead" x="48" y="211" width="22" height="38"/>
  <text x="80" y="237" class="small" text-anchor="start">S1</text>
  <rect x="134" y="210" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="169" y="236" class="tiny" text-anchor="middle">term 1</text>
  <rect x="210" y="210" width="70" height="40" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="245" y="236" class="tiny" text-anchor="middle" style="fill:#c0392b">term 2</text>
  <rect x="368" y="213" width="160" height="34" rx="8" class="node" fill="#f7f8fa"/>
  <text x="448" y="236" class="small" text-anchor="middle" style="fill:#8a94a6">down</text>
  <use href="#server" x="48" y="259" width="22" height="38"/>
  <text x="80" y="285" class="small" text-anchor="start">S2</text>
  <rect x="134" y="258" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="169" y="284" class="tiny" text-anchor="middle">term 1</text>
  <rect x="210" y="258" width="70" height="40" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="245" y="284" class="tiny" text-anchor="middle" style="fill:#c0392b">term 2</text>
  <rect x="368" y="261" width="160" height="34" rx="8" class="node" fill="#f3faed"/>
  <text x="448" y="284" class="small" text-anchor="middle">granted</text>
  <use href="#server" x="48" y="307" width="22" height="38"/>
  <text x="80" y="333" class="small" text-anchor="start">S3</text>
  <rect x="134" y="306" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="169" y="332" class="tiny" text-anchor="middle">term 1</text>
  <rect x="210" y="306" width="70" height="40" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="245" y="332" class="tiny" text-anchor="middle" style="fill:#c0392b">term 2</text>
  <rect x="368" y="309" width="160" height="34" rx="8" class="node" fill="#f3faed"/>
  <text x="448" y="332" class="small" text-anchor="middle">granted</text>
  <use href="#server" x="48" y="355" width="22" height="38"/>
  <text x="80" y="381" class="small" text-anchor="start">S4</text>
  <rect x="134" y="354" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="169" y="380" class="tiny" text-anchor="middle">term 1</text>
  <rect x="368" y="357" width="160" height="34" rx="8" class="node" fill="#f3faed"/>
  <text x="448" y="380" class="small" text-anchor="middle">granted</text>
  <use href="#server" x="48" y="403" width="22" height="38"/>
  <text x="80" y="429" class="small" text-anchor="start">S5</text>
  <rect x="134" y="402" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="169" y="428" class="tiny" text-anchor="middle">term 1</text>
  <rect x="210" y="402" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="245" y="428" class="tiny" text-anchor="middle">term 3</text>
  <rect x="368" y="405" width="160" height="34" rx="8" class="node" fill="#fff"/>
  <text x="448" y="428" class="small" text-anchor="middle">votes for itself</text>
  <!-- The copy count sits under the outlined column, so both panels show the same "3 of 5" with opposite outcomes. -->
  <text x="245" y="468" class="small" text-anchor="middle" style="fill:#c0392b">on 3 of 5</text>
  <rect x="48" y="482" width="480" height="76" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="68" y="514" class="heading" text-anchor="start" style="fill:#c0392b">S5 wins with 4 of 5 votes</text>
  <text x="68" y="543" class="small" text-anchor="start">It replaces index 2 on every server.</text>

  <!-- FUTURE B: the term-4 entry (blue) now ends a majority of logs, and term 4 beats S5's term 3, so no voter majority exists for S5. -->
  <rect x="572" y="100" width="520" height="476" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="592" y="136" class="heading" text-anchor="start">Future B &#8212; a term-4 entry first</text>
  <text x="592" y="164" class="small" text-anchor="start">S1 copies index 3 to S2 and S3, then crashes.</text>
  <!-- Column headers: log index over the cells, the vote each server gives S5 over the badges (S5 counts its own vote). -->
  <text x="670" y="196" class="tiny" text-anchor="end">index</text>
  <text x="713" y="196" class="tiny" text-anchor="middle">1</text>
  <text x="789" y="196" class="tiny" text-anchor="middle">2</text>
  <text x="865" y="196" class="tiny" text-anchor="middle">3</text>
  <text x="992" y="196" class="tiny" text-anchor="middle">vote for S5</text>
  <use href="#server-dead" x="592" y="211" width="22" height="38"/>
  <text x="624" y="237" class="small" text-anchor="start">S1</text>
  <rect x="678" y="210" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="713" y="236" class="tiny" text-anchor="middle">term 1</text>
  <rect x="754" y="210" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="789" y="236" class="tiny" text-anchor="middle">term 2</text>
  <rect x="830" y="210" width="70" height="40" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <text x="865" y="236" class="tiny" text-anchor="middle" style="fill:#0b78b5">term 4</text>
  <rect x="912" y="213" width="160" height="34" rx="8" class="node" fill="#f7f8fa"/>
  <text x="992" y="236" class="small" text-anchor="middle" style="fill:#8a94a6">down</text>
  <use href="#server" x="592" y="259" width="22" height="38"/>
  <text x="624" y="285" class="small" text-anchor="start">S2</text>
  <rect x="678" y="258" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="713" y="284" class="tiny" text-anchor="middle">term 1</text>
  <rect x="754" y="258" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="789" y="284" class="tiny" text-anchor="middle">term 2</text>
  <rect x="830" y="258" width="70" height="40" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <text x="865" y="284" class="tiny" text-anchor="middle" style="fill:#0b78b5">term 4</text>
  <rect x="912" y="261" width="160" height="34" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="992" y="284" class="small" text-anchor="middle" style="fill:#c0392b">refused</text>
  <use href="#server" x="592" y="307" width="22" height="38"/>
  <text x="624" y="333" class="small" text-anchor="start">S3</text>
  <rect x="678" y="306" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="713" y="332" class="tiny" text-anchor="middle">term 1</text>
  <rect x="754" y="306" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="789" y="332" class="tiny" text-anchor="middle">term 2</text>
  <rect x="830" y="306" width="70" height="40" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <text x="865" y="332" class="tiny" text-anchor="middle" style="fill:#0b78b5">term 4</text>
  <rect x="912" y="309" width="160" height="34" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="992" y="332" class="small" text-anchor="middle" style="fill:#c0392b">refused</text>
  <use href="#server" x="592" y="355" width="22" height="38"/>
  <text x="624" y="381" class="small" text-anchor="start">S4</text>
  <rect x="678" y="354" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="713" y="380" class="tiny" text-anchor="middle">term 1</text>
  <rect x="912" y="357" width="160" height="34" rx="8" class="node" fill="#f3faed"/>
  <text x="992" y="380" class="small" text-anchor="middle">granted</text>
  <use href="#server" x="592" y="403" width="22" height="38"/>
  <text x="624" y="429" class="small" text-anchor="start">S5</text>
  <rect x="678" y="402" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="713" y="428" class="tiny" text-anchor="middle">term 1</text>
  <rect x="754" y="402" width="70" height="40" rx="8" class="node" fill="#f3faed"/>
  <text x="789" y="428" class="tiny" text-anchor="middle">term 3</text>
  <rect x="912" y="405" width="160" height="34" rx="8" class="node" fill="#fff"/>
  <text x="992" y="428" class="small" text-anchor="middle">votes for itself</text>
  <!-- The copy count sits under the outlined column, so both panels show the same "3 of 5" with opposite outcomes. -->
  <text x="865" y="468" class="small" text-anchor="middle" style="fill:#0b78b5">on 3 of 5</text>
  <rect x="592" y="482" width="480" height="76" rx="10" class="node" fill="#f3faed"/>
  <text x="612" y="514" class="heading" text-anchor="start">S5 gets 2 of 5 votes and loses</text>
  <text x="612" y="543" class="small" text-anchor="start">Index 3 is committed, and index 2 with it.</text>

  <text x="28" y="616" class="body" text-anchor="start">Only an entry from the leader's own term commits by count; earlier ones commit with it.</text>
</svg>
