<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="968" viewBox="0 0 1120 968" role="img" aria-labelledby="title desc">
  <title id="title">Repairing a log: propose, get rejected, step back</title>
  <desc id="desc">A sequence chart between a leader and one follower. The leader starts with nextIndex 6 and sends AppendEntries claiming the previous entry is index 5 of term 4. The follower rejects it because its own index 5 is from term 2. The leader steps nextIndex back by one and tries index 4 of term 4, which the follower also rejects because its index 4 is from term 2. The leader steps back once more and claims the previous entry is index 3 of term 1. That matches, so the follower deletes index 4 and 5 and appends the leader's entries, then reports success.</desc>
  <!-- Message sequence chart: time runs downward. Solid shafts are requests, dashed
       shafts are replies, and a shaft may cross a lifeline it is not addressed to. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
      .life { stroke: #8a94a6; stroke-width: 2.5; stroke-dasharray: 3 6; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
  </defs>
  <rect width="1120" height="968" fill="#fff"/>

  <text x="28" y="43" class="title" text-anchor="start">Repairing a log: propose, get rejected, step back</text>
  <text x="28" y="77" class="sub" text-anchor="start">Time runs downward. The leader never asks what the follower holds; it guesses and retries.</text>

  <!-- Everything inside this outline is the Raft group. -->
  <rect x="28" y="96" width="1064" height="808" rx="12" fill="#f7f8fa" stroke="#8a94a6" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="50" y="130" class="heading" text-anchor="start">Raft group — a leader and a follower whose log has diverged</text>
  <use href="#server" x="287" y="140" width="26" height="46"/>
  <rect x="200" y="198" width="200" height="54" rx="10" class="node" fill="#f3faed"/>
  <text x="300" y="232" class="heading" text-anchor="middle">Leader</text>
  <use href="#server" x="807" y="140" width="26" height="46"/>
  <rect x="720" y="198" width="200" height="54" rx="10" class="node" fill="#f0f8fc"/>
  <text x="820" y="232" class="heading" text-anchor="middle">Follower</text>
  <path class="life" d="M300 258L300 904"/>
  <path class="life" d="M820 258L820 904"/>
  <path data-connector="true" d="M300 286L364 286L364 310L312 310" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="300,310 314,304 314,316" fill="#17212f"/>
  <text x="318" y="274" class="small" text-anchor="start">nextIndex = 6, its own last index plus one</text>
  <path data-connector="true" d="M300 356L808 356" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="820,356 806,350 806,362" fill="#17212f"/>
  <text x="560" y="340" class="small" text-anchor="middle">AppendEntries &#8212; previous is index 5, term 4</text>
  <path data-connector="true" d="M820 412L312 412" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="300,412 314,406 314,418" fill="#0b78b5"/>
  <text x="560" y="396" class="small" text-anchor="middle">reject &#8212; my index 5 is term 2, not 4</text>
  <path data-connector="true" d="M300 454L364 454L364 478L312 478" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="300,478 314,472 314,484" fill="#17212f"/>
  <text x="318" y="442" class="small" text-anchor="start">step nextIndex back to 5</text>
  <path data-connector="true" d="M300 524L808 524" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="820,524 806,518 806,530" fill="#17212f"/>
  <text x="560" y="508" class="small" text-anchor="middle">AppendEntries &#8212; previous is index 4, term 4</text>
  <path data-connector="true" d="M820 580L312 580" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="300,580 314,574 314,586" fill="#0b78b5"/>
  <text x="560" y="564" class="small" text-anchor="middle">reject &#8212; my index 4 is term 2 as well</text>
  <path data-connector="true" d="M300 622L364 622L364 646L312 646" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="300,646 314,640 314,652" fill="#17212f"/>
  <text x="318" y="610" class="small" text-anchor="start">step nextIndex back to 4</text>
  <path data-connector="true" d="M300 692L808 692" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="820,692 806,686 806,698" fill="#17212f"/>
  <text x="560" y="676" class="small" text-anchor="middle">AppendEntries &#8212; previous is index 3, term 1</text>
  <path data-connector="true" d="M820 734L756 734L756 758L808 758" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="820,758 806,752 806,764" fill="#17212f"/>
  <text x="802" y="722" class="small" text-anchor="end">index 3 matches: swaps its 4–5 for the leader's</text>
  <path data-connector="true" d="M820 804L312 804" fill="none" stroke="#0b78b5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="300,804 314,798 314,810" fill="#0b78b5"/>
  <text x="560" y="788" class="small" text-anchor="middle">success</text>
  <path data-connector="true" d="M300 846L364 846L364 870L312 870" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="300,870 314,864 314,876" fill="#17212f"/>
  <text x="318" y="834" class="small" text-anchor="start">the two logs now agree</text>

  <text x="28" y="954" class="body" text-anchor="start">Each rejection costs one round trip and moves the guess back; the logs converge, never merge.</text>
</svg>
