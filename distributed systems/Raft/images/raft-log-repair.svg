<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">A new leader overwrites a follower's log; it never adopts it</title>
  <desc id="desc">Two panels show the same leader and follower before and after a repair. Before, the two logs agree through index 3, but the follower holds term 2 entries at index 4 and 5 that the leader does not have. After, the follower holds the leader's term 4 entries at index 4 and 5 and the term 2 entries are gone. The leader's own log is identical in both panels. </desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .tiny { font-size: 15px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <rect width="1120" height="550" fill="#fff"/>

  <text x="28" y="43" class="title" text-anchor="start">A new leader overwrites a follower's log; it never adopts it</text>
  <text x="28" y="77" class="sub" text-anchor="start">Compare index 4 and 5 across the two panels. The leader's own row is identical in both.</text>

  <!-- BEFORE: the follower carries entries from a term the leader never had. -->
  <rect x="28" y="110" width="520" height="360" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="146" class="heading" text-anchor="start">Before &#8212; they diverge at 4</text>

  <text x="389" y="174" class="tiny" text-anchor="middle">last agreeing index</text>
  <path d="M389 210L389 380" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 7"/>

  <text x="170" y="200" class="tiny" text-anchor="end">index</text>
  <text x="209" y="200" class="tiny" text-anchor="middle">1</text>
  <text x="281" y="200" class="tiny" text-anchor="middle">2</text>
  <text x="353" y="200" class="tiny" text-anchor="middle">3</text>
  <text x="425" y="200" class="tiny" text-anchor="middle">4</text>
  <text x="497" y="200" class="tiny" text-anchor="middle">5</text>

  <use href="#server" x="48" y="231" width="22" height="38"/>
  <text x="78" y="246" class="small" text-anchor="start">Leader</text>
  <text x="78" y="270" class="tiny" text-anchor="start">term 4</text>
  <rect x="176" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="209" y="242" class="tiny" text-anchor="middle">term 1</text>
  <text x="209" y="267" class="small" text-anchor="middle">x&#8592;3</text>
  <rect x="248" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="281" y="242" class="tiny" text-anchor="middle">term 1</text>
  <text x="281" y="267" class="small" text-anchor="middle">y&#8592;1</text>
  <rect x="320" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="353" y="242" class="tiny" text-anchor="middle">term 1</text>
  <text x="353" y="267" class="small" text-anchor="middle">y&#8592;9</text>
  <rect x="392" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="425" y="242" class="tiny" text-anchor="middle">term 4</text>
  <text x="425" y="267" class="small" text-anchor="middle">x&#8592;5</text>
  <rect x="464" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="497" y="242" class="tiny" text-anchor="middle">term 4</text>
  <text x="497" y="267" class="small" text-anchor="middle">y&#8592;4</text>

  <use href="#server" x="48" y="325" width="22" height="38"/>
  <text x="78" y="340" class="small" text-anchor="start">Follower</text>
  <text x="78" y="364" class="tiny" text-anchor="start">stale</text>
  <rect x="176" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="209" y="336" class="tiny" text-anchor="middle">term 1</text>
  <text x="209" y="361" class="small" text-anchor="middle">x&#8592;3</text>
  <rect x="248" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="281" y="336" class="tiny" text-anchor="middle">term 1</text>
  <text x="281" y="361" class="small" text-anchor="middle">y&#8592;1</text>
  <rect x="320" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="353" y="336" class="tiny" text-anchor="middle">term 1</text>
  <text x="353" y="361" class="small" text-anchor="middle">y&#8592;9</text>
  <!-- Inline stroke, not a class: the .node rule would otherwise win over the conflict colour. -->
  <rect x="392" y="313" width="66" height="62" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="425" y="336" class="tiny" text-anchor="middle" style="fill:#c0392b">term 2</text>
  <text x="425" y="361" class="small" text-anchor="middle" style="fill:#c0392b">z&#8592;7</text>
  <rect x="464" y="313" width="66" height="62" rx="8" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="497" y="336" class="tiny" text-anchor="middle" style="fill:#c0392b">term 2</text>
  <text x="497" y="361" class="small" text-anchor="middle" style="fill:#c0392b">z&#8592;8</text>

  <text x="48" y="414" class="small" text-anchor="start">Index 4 and 5 are term-2 leftovers from</text>
  <text x="48" y="438" class="small" text-anchor="start">an older leader. The leader has neither.</text>

  <!-- AFTER: the same two rows once the consistency check has walked back and succeeded. -->
  <rect x="572" y="110" width="520" height="360" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="592" y="146" class="heading" text-anchor="start">After &#8212; the follower matches</text>

  <text x="714" y="200" class="tiny" text-anchor="end">index</text>
  <text x="753" y="200" class="tiny" text-anchor="middle">1</text>
  <text x="825" y="200" class="tiny" text-anchor="middle">2</text>
  <text x="897" y="200" class="tiny" text-anchor="middle">3</text>
  <text x="969" y="200" class="tiny" text-anchor="middle">4</text>
  <text x="1041" y="200" class="tiny" text-anchor="middle">5</text>

  <use href="#server" x="592" y="231" width="22" height="38"/>
  <text x="622" y="246" class="small" text-anchor="start">Leader</text>
  <text x="622" y="270" class="tiny" text-anchor="start">term 4</text>
  <rect x="720" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="753" y="242" class="tiny" text-anchor="middle">term 1</text>
  <text x="753" y="267" class="small" text-anchor="middle">x&#8592;3</text>
  <rect x="792" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="825" y="242" class="tiny" text-anchor="middle">term 1</text>
  <text x="825" y="267" class="small" text-anchor="middle">y&#8592;1</text>
  <rect x="864" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="897" y="242" class="tiny" text-anchor="middle">term 1</text>
  <text x="897" y="267" class="small" text-anchor="middle">y&#8592;9</text>
  <rect x="936" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="969" y="242" class="tiny" text-anchor="middle">term 4</text>
  <text x="969" y="267" class="small" text-anchor="middle">x&#8592;5</text>
  <rect x="1008" y="219" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="1041" y="242" class="tiny" text-anchor="middle">term 4</text>
  <text x="1041" y="267" class="small" text-anchor="middle">y&#8592;4</text>

  <use href="#server" x="592" y="325" width="22" height="38"/>
  <text x="622" y="340" class="small" text-anchor="start">Follower</text>
  <text x="622" y="364" class="tiny" text-anchor="start">repaired</text>
  <rect x="720" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="753" y="336" class="tiny" text-anchor="middle">term 1</text>
  <text x="753" y="361" class="small" text-anchor="middle">x&#8592;3</text>
  <rect x="792" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="825" y="336" class="tiny" text-anchor="middle">term 1</text>
  <text x="825" y="361" class="small" text-anchor="middle">y&#8592;1</text>
  <rect x="864" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed"/>
  <text x="897" y="336" class="tiny" text-anchor="middle">term 1</text>
  <text x="897" y="361" class="small" text-anchor="middle">y&#8592;9</text>
  <rect x="936" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <text x="969" y="336" class="tiny" text-anchor="middle" style="fill:#0b78b5">term 4</text>
  <text x="969" y="361" class="small" text-anchor="middle" style="fill:#0b78b5">x&#8592;5</text>
  <rect x="1008" y="313" width="66" height="62" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <text x="1041" y="336" class="tiny" text-anchor="middle" style="fill:#0b78b5">term 4</text>
  <text x="1041" y="361" class="small" text-anchor="middle" style="fill:#0b78b5">y&#8592;4</text>

  <text x="592" y="414" class="small" text-anchor="start">Index 4 and 5 now carry the leader's term-4</text>
  <text x="592" y="438" class="small" text-anchor="start">entries. The term-2 pair is gone for good.</text>

  <text x="28" y="516" class="body" text-anchor="start">Entries only ever flow out of the leader, which is why the logs converge instead of merging.</text>
</svg>
