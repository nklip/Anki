<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Raft adds or removes one server at a time</title>
  <desc id="desc">Two panels compare configuration changes. On the left the cluster grows from three servers to five in one step: a majority of the old three is S1 and S2, while a majority of the new five is S3, S4 and S5, and those two sets share no server, so two leaders could win the same term. On the right the cluster grows from three to four in one step: a majority of the old three is S1 and S2, a majority of the new four is S2, S3 and S4, and S2 belongs to both, so only one of them can win.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; fill: #536174; }
      .node { stroke: #b9c8d4; stroke-width: 2; }
    </style>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <rect width="1120" height="640" fill="#fff"/>

  <text x="28" y="43" class="title" text-anchor="start">Raft adds or removes one server at a time</text>
  <text x="28" y="77" class="sub" text-anchor="start">Servers adopt a new configuration at different moments, so the two majorities must overlap.</text>

  <!-- UNSAFE: a two-server jump lets the two majorities miss each other completely. -->
  <rect x="28" y="110" width="520" height="450" rx="12" fill="#f7f8fa" stroke="#b9c8d4" stroke-width="2"/>
  <text x="48" y="150" class="heading" text-anchor="start">3 servers become 5 at once</text>
  <text x="48" y="180" class="small" text-anchor="start">S4 and S5 are added in a single step, so</text>
  <text x="48" y="204" class="small" text-anchor="start">two different rules are live at the same time.</text>

  <text x="48" y="250" class="small" text-anchor="start">a majority of the old 3</text>
  <rect x="48" y="264" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="56" y="270" width="18" height="32"/>
  <text x="86" y="293" class="small" text-anchor="start">S1</text>
  <rect x="134" y="264" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="142" y="270" width="18" height="32"/>
  <text x="172" y="293" class="small" text-anchor="start">S2</text>

  <text x="48" y="350" class="small" text-anchor="start">a majority of the new 5</text>
  <rect x="48" y="364" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="56" y="370" width="18" height="32"/>
  <text x="86" y="393" class="small" text-anchor="start">S3</text>
  <rect x="134" y="364" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="142" y="370" width="18" height="32"/>
  <text x="172" y="393" class="small" text-anchor="start">S4</text>
  <rect x="220" y="364" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="228" y="370" width="18" height="32"/>
  <text x="258" y="393" class="small" text-anchor="start">S5</text>

  <!-- Inline stroke, not a class: the .node rule would otherwise win over the warning colour. -->
  <rect x="48" y="438" width="480" height="94" rx="10" class="node" fill="#fff" style="stroke:#c0392b"/>
  <text x="68" y="472" class="heading" text-anchor="start" style="fill:#c0392b">No server in common</text>
  <text x="68" y="504" class="small" text-anchor="start">Two leaders could win the very same term.</text>

  <!-- SAFE: a one-server step forces at least one server into both majorities. -->
  <rect x="572" y="110" width="520" height="450" rx="12" fill="#f0f8fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="592" y="150" class="heading" text-anchor="start">3 servers become 4 at once</text>
  <text x="592" y="180" class="small" text-anchor="start">Only S4 is added, so any old majority and</text>
  <text x="592" y="204" class="small" text-anchor="start">any new majority must share a server.</text>

  <text x="592" y="250" class="small" text-anchor="start">a majority of the old 3</text>
  <rect x="592" y="264" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="600" y="270" width="18" height="32"/>
  <text x="630" y="293" class="small" text-anchor="start">S1</text>
  <rect x="678" y="264" width="76" height="44" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <use href="#server" x="686" y="270" width="18" height="32"/>
  <text x="716" y="293" class="small" text-anchor="start" style="fill:#0b78b5">S2</text>

  <text x="592" y="350" class="small" text-anchor="start">a majority of the new 4</text>
  <rect x="592" y="364" width="76" height="44" rx="8" class="node" fill="#f3faed" style="stroke:#0b78b5"/>
  <use href="#server" x="600" y="370" width="18" height="32"/>
  <text x="630" y="393" class="small" text-anchor="start" style="fill:#0b78b5">S2</text>
  <rect x="678" y="364" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="686" y="370" width="18" height="32"/>
  <text x="716" y="393" class="small" text-anchor="start">S3</text>
  <rect x="764" y="364" width="76" height="44" rx="8" class="node" fill="#fff"/>
  <use href="#server" x="772" y="370" width="18" height="32"/>
  <text x="802" y="393" class="small" text-anchor="start">S4</text>

  <rect x="592" y="438" width="480" height="94" rx="10" class="node" fill="#f3faed"/>
  <text x="612" y="472" class="heading" text-anchor="start">S2 is in both majorities</text>
  <text x="612" y="504" class="small" text-anchor="start">It votes once, so only one of them can win.</text>

  <text x="28" y="606" class="body" text-anchor="start">One server at a time means the old and the new majority always share a voter.</text>
</svg>
