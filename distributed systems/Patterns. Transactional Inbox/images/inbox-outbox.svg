<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="685" viewBox="0 0 1100 685" role="img" aria-labelledby="title desc">
<title id="title">Inbox + Outbox connect incoming and outgoing work</title>
<desc id="desc">Sequence diagram with incoming broker, consumer, database, relay and outgoing broker. The incoming broker delivers evt-901. One database transaction saves the inbox receipt, applies the account credit, and stores an outgoing event with a stable ID. After commit the consumer acknowledges the incoming delivery. Separately, a relay reads the committed outbox event from the database and publishes it to the outgoing broker. Outgoing delivery can repeat, so the next consumer must deduplicate too.</desc>
<!-- Shared native SVG styles; dashed message arrows mean replies, not failures.
Reply heads have short solid joins so dash gaps cannot detach them from their shafts. -->
<defs><style>
text {font-family:Arial, Helvetica, sans-serif; fill:#17304b;}
.title {font-size:28px; font-weight:700;}
.subtitle {font-size:18px; fill:#486078;}
.actor {font-size:20px; font-weight:700;}
.message {font-size:18px;}
.detail {font-size:17px;}
.emphasis {font-size:18px; font-weight:700;}
.actor-box {fill:#eff6ff; stroke:#3980bd; stroke-width:1.6;}
.transaction {fill:#eff6ff; stroke:#7da8ce; stroke-width:1.5;}
.lifeline {fill:none; stroke:#8fa4b8; stroke-width:1.4; stroke-dasharray:5 6;}
.flow {fill:none; stroke:#47637f; stroke-width:2;}
.reply {stroke-dasharray:7 5;}
.failure {fill:#fff6e5; stroke:#c68b25; stroke-width:1.4;}
</style></defs>
<!-- Canvas and reading convention. -->
<rect width="1100" height="685" fill="#fff"/>
<text class="title" x="28" y="39" text-anchor="start">Inbox + Outbox connect incoming and outgoing work</text>
<text class="subtitle" x="28" y="72" text-anchor="start">Read top to bottom · dashed arrows are replies</text>
<!-- Only the consumer/database actions are enclosed in the atomic transaction. -->
<g id="inbox-business-outbox"><rect class="transaction" x="277" y="200" width="300" height="253" rx="8"/><text class="detail" x="425" y="226" text-anchor="middle">Database transaction</text></g>
<!-- Relay and both brokers stay outside the transaction boundary. -->
<path id="incoming-broker-lifeline" class="lifeline" d="M100 158 V635"/>
<path id="consumer-lifeline" class="lifeline" d="M310 158 V635"/>
<path id="database-lifeline" class="lifeline" d="M540 158 V635"/>
<path id="relay-lifeline" class="lifeline" d="M770 158 V635"/>
<path id="outgoing-broker-lifeline" class="lifeline" d="M1000 158 V635"/>
<rect class="actor-box" x="20" y="100" width="160" height="58" rx="8"/><text class="actor" x="100" y="123" text-anchor="middle">Incoming</text><text class="actor" x="100" y="147" text-anchor="middle">broker</text>
<rect class="actor-box" x="230" y="100" width="160" height="58" rx="8"/><text class="actor" x="310" y="136" text-anchor="middle">Consumer</text>
<rect class="actor-box" x="460" y="100" width="160" height="58" rx="8"/><text class="actor" x="540" y="136" text-anchor="middle">Database</text>
<rect class="actor-box" x="690" y="100" width="160" height="58" rx="8"/><text class="actor" x="770" y="136" text-anchor="middle">Relay</text>
<rect class="actor-box" x="920" y="100" width="160" height="58" rx="8"/><text class="actor" x="1000" y="123" text-anchor="middle">Outgoing</text><text class="actor" x="1000" y="147" text-anchor="middle">broker</text>
<!-- Database writes include receipt, business state, and outgoing intent. -->
<text class="message" x="205.0" y="183" text-anchor="middle">evt-901</text><path id="incoming-delivery-shaft" class="flow" data-connector="true" d="M101 195 H298"/><polygon id="incoming-delivery-head" points="297,190 308,195 297,200" fill="#47637f"/>
<text class="message" x="425.0" y="254" text-anchor="middle">BEGIN</text><path id="begin-shaft" class="flow" data-connector="true" d="M311 266 H528"/><polygon id="begin-head" points="527,261 538,266 527,271" fill="#47637f"/>
<text class="message" x="425.0" y="296" text-anchor="middle">Receipt + credit</text><path id="inbox-business-shaft" class="flow" data-connector="true" d="M311 308 H528"/><polygon id="inbox-business-head" points="527,303 538,308 527,313" fill="#47637f"/>
<text class="message" x="425.0" y="338" text-anchor="middle">Store outgoing event</text><path id="store-outbox-shaft" class="flow" data-connector="true" d="M311 350 H528"/><polygon id="store-outbox-head" points="527,345 538,350 527,355" fill="#47637f"/>
<text class="message" x="425.0" y="380" text-anchor="middle">COMMIT</text><path id="commit-shaft" class="flow" data-connector="true" d="M311 392 H528"/><polygon id="commit-head" points="527,387 538,392 527,397" fill="#47637f"/>
<text class="message" x="425.0" y="424" text-anchor="middle">Committed</text><path id="committed-shaft" class="flow reply" data-connector="true" d="M539 436 H322"/><path id="committed-head-join" class="flow" data-connector="true" d="M328 436 H322"/><polygon id="committed-head" points="323,431 312,436 323,441" fill="#47637f"/>
<!-- The acknowledgement follows commit; publishing remains a separate operation. -->
<text class="message" x="205.0" y="476" text-anchor="middle">Acknowledge delivery</text><path id="ack-incoming-shaft" class="flow" data-connector="true" d="M309 488 H112"/><polygon id="ack-incoming-head" points="113,483 102,488 113,493" fill="#47637f"/>
<text class="message" x="655.0" y="521" text-anchor="middle">Read committed outbox</text><path id="read-outbox-shaft" class="flow" data-connector="true" d="M769 533 H552"/><polygon id="read-outbox-head" points="553,528 542,533 553,538" fill="#47637f"/>
<text class="message" x="655.0" y="565" text-anchor="middle">Event + stable ID</text><path id="outbox-event-shaft" class="flow reply" data-connector="true" d="M541 577 H758"/><path id="outbox-event-head-join" class="flow" data-connector="true" d="M752 577 H758"/><polygon id="outbox-event-head" points="757,572 768,577 757,582" fill="#47637f"/>
<text class="message" x="885.0" y="609" text-anchor="middle">Publish outgoing event</text><path id="publish-shaft" class="flow" data-connector="true" d="M771 621 H988"/><polygon id="publish-head" points="987,616 998,621 987,626" fill="#47637f"/>
<text class="message" x="28" y="663" text-anchor="start">Outgoing delivery may repeat; the next consumer deduplicates its incoming message too.</text>
</svg>
