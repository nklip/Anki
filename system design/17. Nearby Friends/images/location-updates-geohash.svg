<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 750" role="img" aria-labelledby="title desc">
  <title id="title">Location updates through geohash Pub/Sub</title>
  <desc id="desc">User two sends a location update, subscribes to geohash 9q8znd, and receives nearby users through WebSocket connections.</desc>
  <!-- Original monochrome layout styles. -->
  <defs>
    <style>.heading{font:400 27.3px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.text{font:400 27.3px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.user-text{font:400 26.4px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.small{font:400 23px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.channel-text{font:400 26.6px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.panel{fill:none;stroke:#000;stroke-width:1.8;stroke-dasharray:9 7}.box{fill:#fff;stroke:#000;stroke-width:1.7}.flow{fill:none;stroke:#000;stroke-width:1.8}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#000"/></marker>
    <!-- Source channels have a flat body that terminates at a wider vertical end cap. -->
    <symbol id="channel" viewBox="0 0 292 92"><path d="M22 0H260V90H22C10.4 90 1 69.9 1 45S10.4 0 22 0Z" class="box"/><ellipse cx="260" cy="45" rx="30" ry="45" class="box"/></symbol>
  </defs>
  <rect width="1650" height="750" fill="#fff"/>
  <!-- Dashed WebSocket and Redis regions. -->
  <rect x="68" y="207" width="321" height="175" class="panel"/><text x="79" y="409" class="heading">WebSocket connections</text>
  <rect x="650" y="59" width="358" height="633" class="panel"/><text x="736" y="720" class="heading">Redis Pub/Sub</text>
  <text x="1285" y="44" class="heading">Users in geohash: 9q8nzd</text><rect x="1301" y="59" width="287" height="491" class="panel"/><text x="1298" y="586" class="heading">WebSocket connections</text>
  <!-- Source user and step 1. The connector is split around the badge and label. -->
  <rect x="112" y="247" width="231" height="95" class="box"/><text x="227" y="304" text-anchor="middle" class="user-text">User 2</text>
  <path class="flow" d="M342 294H436"/><circle cx="456" cy="292.5" r="19.5" class="box"/><text x="456" y="301.5" text-anchor="middle" class="small">1</text><path class="flow" marker-end="url(#arrow)" d="M605 294H686"/><text x="542" y="286" text-anchor="middle" class="text">Location</text><text x="542" y="318" text-anchor="middle" class="text">update</text>
  <!-- Four geohash channels. -->
  <use href="#channel" x="685" y="98.5" width="292" height="93"/><text x="815.5" y="137" text-anchor="middle" class="channel-text">Geohash:</text><text x="815.5" y="168" text-anchor="middle" class="channel-text">9q8zn6</text>
  <use href="#channel" x="685" y="248.5" width="292" height="93"/><text x="815.5" y="288" text-anchor="middle" class="channel-text">Geohash:</text><text x="815.5" y="319" text-anchor="middle" class="channel-text">9q8znd</text>
  <use href="#channel" x="685" y="411.5" width="292" height="93"/><text x="815.5" y="450" text-anchor="middle" class="channel-text">Geohash:</text><text x="815.5" y="481" text-anchor="middle" class="channel-text">9q8znf</text>
  <use href="#channel" x="685" y="561.5" width="292" height="93"/><text x="815.5" y="601" text-anchor="middle" class="channel-text">Geohash:</text><text x="815.5" y="632" text-anchor="middle" class="channel-text">9q8zn3</text>
  <!-- Step 2 subscription and fan-out to three nearby connections. -->
  <path class="flow" d="M974 294H1048"/><circle cx="1068" cy="293.5" r="19.5" class="box"/><text x="1068" y="301.5" text-anchor="middle" class="small">2</text><text x="1093" y="304" class="text">Subscribe</text>
  <path class="flow" d="M1226 294H1262V134H1346" marker-end="url(#arrow)"/><path class="flow" d="M1262 294V455H1346" marker-end="url(#arrow)"/>
  <rect x="1346" y="87" width="188" height="94" class="box"/><text x="1440" y="143" text-anchor="middle" class="user-text">User 1</text><rect x="1346" y="247" width="188" height="94" class="box"/><text x="1440" y="303" text-anchor="middle" class="user-text">User 2</text><rect x="1346" y="408" width="188" height="94" class="box"/><text x="1440" y="464" text-anchor="middle" class="user-text">User 3</text>
</svg>
