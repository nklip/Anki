<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1682 1430" role="img" aria-labelledby="title desc">
  <title id="title">Detailed periodic location update and friend delivery</title>
  <desc id="desc">Users one and five publish locations through WebSocket connections to their Redis channels. Users two, three, four, and six subscribe and receive friends' location updates.</desc>
  <!-- Original black-and-white swimlane styles and reusable device/channel symbols. -->
  <defs>
    <style>.label{font:400 35px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.caption{font:400 29px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.panel{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:10.5 7.5}.node{fill:#fff;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2}</style>
    <marker id="arrow" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 20 8 0 16Z" fill="#000"/></marker>
    <symbol id="phone" viewBox="0 0 58 97"><rect x="0" y="0" width="58" height="97" rx="6" fill="#000"/><rect x="9" y="12" width="40" height="62" fill="#fff"/><circle cx="29" cy="86" r="7" fill="#fff"/></symbol>
    <symbol id="channel" viewBox="0 0 71 149"><path d="M2 16.5V131.5A33.5 14.5 0 0 0 69 131.5V16.5" class="node"/><ellipse cx="35.5" cy="16.5" rx="33.5" ry="14.5" class="node"/></symbol>
  </defs>
  <rect width="1682" height="1430" fill="#fff"/>
  <!-- Publishing users. -->
  <text x="752" y="61" text-anchor="middle" class="label">User 1</text><use href="#phone" x="724" y="71" width="58" height="97"/><text x="1276" y="61" text-anchor="middle" class="label">User 5</text><use href="#phone" x="1247" y="71" width="58" height="97"/>
  <!-- User 1's connector is split around the original inline step label. -->
  <path class="flow" d="M752 167V196"/><path class="flow" marker-end="url(#arrow)" d="M752 251V301"/><path class="flow" marker-end="url(#arrow)" d="M1276 167V301"/>
  <circle cx="613" cy="222.5" r="24.5" class="node"/><text x="613" y="233.5" text-anchor="middle" class="caption">1</text><text x="648" y="233" class="caption">User 1’s location</text>
  <!-- First WebSocket-server lane. -->
  <text x="143" y="349" text-anchor="middle" class="label">WebSocket</text><text x="143" y="388" text-anchor="middle" class="label">Servers</text><rect x="244" y="273" width="1356" height="169" class="panel"/>
  <rect x="628" y="301" width="249" height="110" class="node"/><text x="752" y="349" text-anchor="middle" class="label">User 1’s WS</text><text x="752" y="388" text-anchor="middle" class="label">connection</text><rect x="1152" y="301" width="249" height="110" class="node"/><text x="1276" y="349" text-anchor="middle" class="label">User 5’s WS</text><text x="1276" y="388" text-anchor="middle" class="label">connection</text>
  <!-- Publishing into per-user channels. Both connectors are split around their "Publish" labels. -->
  <path class="flow" d="M752 411V478"/><path class="flow" marker-end="url(#arrow)" d="M752 534V619"/><path class="flow" d="M1276 411V483"/><path class="flow" marker-end="url(#arrow)" d="M1276 537V619"/>
  <circle cx="674" cy="505" r="24.5" class="node"/><text x="674" y="516" text-anchor="middle" class="caption">2</text><text x="708" y="515" class="caption">Publish</text><text x="1276" y="519" text-anchor="middle" class="caption">Publish</text>
  <text x="143" y="678" text-anchor="middle" class="label">Redis</text><text x="143" y="719" text-anchor="middle" class="label">Pub/Sub</text><rect x="244" y="576" width="1356" height="208" class="panel"/>
  <use href="#channel" x="717" y="614.5" width="71" height="149"/><text x="452" y="701" class="label">User 1’s channel</text><use href="#channel" x="1240" y="614.5" width="71" height="149"/><text x="1325" y="702" class="label">User 5’s channel</text>
  <!-- Subscription fan-out: the diagonals leave the channel walls and each route is split around its label. -->
  <path class="flow" d="M719 722L607.7 828"/><path class="flow" marker-end="url(#arrow)" d="M545.8 887L465 964"/>
  <path class="flow" d="M752 761V830"/><path class="flow" marker-end="url(#arrow)" d="M752 887V964"/>
  <path class="flow" d="M786 722L896.8 828"/><path class="flow" marker-end="url(#arrow)" d="M958.5 887L1039 964"/>
  <path class="flow" d="M1242 749L1200.1 828"/><path class="flow" marker-end="url(#arrow)" d="M1168.8 887L1128 964"/>
  <path class="flow" d="M1309 749L1347.9 828"/><path class="flow" marker-end="url(#arrow)" d="M1377.1 887L1415 964"/>
  <circle cx="476" cy="855" r="24.5" class="node"/><text x="476" y="866" text-anchor="middle" class="caption">3</text><text x="514" y="865" class="caption">Subscribe</text><text x="689" y="865" class="caption">Subscribe</text><text x="864" y="865" class="caption">Subscribe</text><text x="1123" y="865" class="caption">Subscribe</text><text x="1297" y="865" class="caption">Subscribe</text>
  <!-- Friend WebSocket-server lane. -->
  <text x="143" y="1013" text-anchor="middle" class="label">WebSocket</text><text x="143" y="1052" text-anchor="middle" class="label">Servers</text><rect x="244" y="929.5" width="1356" height="180" class="panel"/>
  <g><rect x="282" y="964.5" width="249" height="110" class="node"/><text x="406" y="1013" text-anchor="middle" class="label">User 2’s WS</text><text x="406" y="1052" text-anchor="middle" class="label">connection</text><rect x="628" y="964.5" width="249" height="110" class="node"/><text x="752" y="1013" text-anchor="middle" class="label">User 3’s WS</text><text x="752" y="1052" text-anchor="middle" class="label">connection</text><rect x="974" y="964.5" width="249" height="110" class="node"/><text x="1098" y="1013" text-anchor="middle" class="label">User 4’s WS</text><text x="1098" y="1052" text-anchor="middle" class="label">connection</text><rect x="1320" y="964.5" width="249" height="110" class="node"/><text x="1444" y="1013" text-anchor="middle" class="label">User 6’s WS</text><text x="1444" y="1052" text-anchor="middle" class="label">connection</text></g>
  <!-- Delivery to friend devices. User 2's route is split around the source-positioned step label. -->
  <path class="flow" d="M406 1075V1137"/><path class="flow" marker-end="url(#arrow)" d="M406 1199V1265"/><path class="flow" marker-end="url(#arrow)" d="M752 1075V1265"/><path class="flow" marker-end="url(#arrow)" d="M1098 1075V1265"/><path class="flow" marker-end="url(#arrow)" d="M1444 1075V1265"/>
  <circle cx="185" cy="1167" r="24.5" class="node"/><text x="185" y="1178" text-anchor="middle" class="caption">4</text><text x="220" y="1180" class="label">Friends’ location update</text>
  <g><use href="#phone" x="378" y="1266" width="58" height="97"/><text x="406" y="1399" text-anchor="middle" class="label">User 2</text><use href="#phone" x="724" y="1266" width="58" height="97"/><text x="752" y="1399" text-anchor="middle" class="label">User 3</text><use href="#phone" x="1070" y="1266" width="58" height="97"/><text x="1098" y="1399" text-anchor="middle" class="label">User 4</text><use href="#phone" x="1416" y="1266" width="58" height="97"/><text x="1444" y="1399" text-anchor="middle" class="label">User 6</text></g>
</svg>
