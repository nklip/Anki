<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1624 1272" role="img" aria-labelledby="title desc">
  <title id="title">Nearby Friends high-level design</title>
  <desc id="desc">Mobile users connect through a load balancer to WebSocket and API servers, backed by Redis Pub/Sub, a location cache, location history, and a user database.</desc>
  <!-- Source-matching monochrome infrastructure symbols. -->
  <defs>
    <style>.label{font:400 29.7px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.small{font:400 27.8px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.node{fill:#fff;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2}</style>
    <marker id="arrow" viewBox="0 0 16 12.2" refX="16" refY="6.1" markerWidth="16" markerHeight="12.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 16 6.1 0 12.2Z" fill="#000"/></marker>
    <!-- Backward-pointing head for the start of the bidirectional connector. -->
    <marker id="arrowback" viewBox="0 0 16 12.2" refX="0" refY="6.1" markerWidth="16" markerHeight="12.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M16 0 0 6.1 16 12.2Z" fill="#000"/></marker>
    <symbol id="phone" viewBox="0 0 52 88"><rect x="0" y="0" width="52" height="88" rx="6" fill="#000"/><rect x="9" y="12" width="35" height="57" fill="#fff"/><circle cx="25.5" cy="77" r="6" fill="#fff"/></symbol>
    <!-- Storage cylinder: flat body with a shallow top ellipse and matching base curve. -->
    <symbol id="db" viewBox="0 0 128 128"><path d="M2 14V114A62 12 0 0 0 126 114V14" class="node"/><ellipse cx="64" cy="14" rx="62" ry="12" class="node"/></symbol>
    <!-- Messaging cylinder: flat body with a rounded left end and a vertical end cap. -->
    <symbol id="channel" viewBox="0 0 226 121"><path d="M23 2H202.5V119H23A21 58.5 0 0 1 23 2Z" class="node"/><ellipse cx="202.5" cy="60.5" rx="22" ry="58.5" class="node"/></symbol>
  </defs>
  <rect width="1624" height="1272" fill="#fff"/>
  <!-- Client and routing layer. -->
  <text x="801.9" y="54.2" text-anchor="middle" class="label">Mobile Users</text><use href="#phone" x="777" y="62.7" width="49" height="82.8"/>
  <!-- Client curves are split around their labels; the WebSocket route is bidirectional. -->
  <path class="flow" marker-end="url(#arrow)" d="M729.6 208.1C736.5 184 750.3 158.4 775.1 127.6"/><path class="flow" marker-end="url(#arrow)" d="M732.3 300.3C739 323 748.6 345.1 757.2 367.5"/>
  <path class="flow" d="M826 127.6C853.7 162.6 866.6 193.7 870 224"/><path class="flow" marker-end="url(#arrow)" d="M867.2 277.7C861.7 305.7 851 334.9 839.1 367.5"/>
  <text x="649" y="247.1" class="label">WebSocket</text><text x="693.2" y="281" class="label">(WS)</text><text x="844.8" y="261.2" class="label">http</text>
  <rect x="675.8" y="367.1" width="250.4" height="101.6" class="node"/><text x="801.9" y="427.7" text-anchor="middle" class="label">Load Balancer</text>
  <!-- Application services. -->
  <path class="flow" marker-start="url(#arrowback)" marker-end="url(#arrow)" d="M756.4 468.7L575.1 676.6"/><path class="flow" marker-end="url(#arrow)" d="M847.2 468.7L1036 676.6"/>
  <rect x="405.6" y="676.6" width="250.4" height="100.7" class="node"/><text x="530.3" y="720.4" text-anchor="middle" class="label">WebSocket</text><text x="530.3" y="754.2" text-anchor="middle" class="label">Servers</text>
  <text x="672.5" y="721.3" class="small">Bi-directional</text><text x="671.6" y="752.3" class="small">location info</text>
  <rect x="956.3" y="676.6" width="250.4" height="100.7" class="node"/><text x="1081.1" y="720.4" text-anchor="middle" class="label">API</text><text x="1081.1" y="754.2" text-anchor="middle" class="label">Servers</text>
  <text x="1223.3" y="708.1" class="small">User management</text><text x="1223.3" y="740.1" class="small">Friendship management</text><text x="1223.3" y="772.1" class="small">Auth, etc</text>
  <!-- Storage connector layer. -->
  <path class="flow" marker-end="url(#arrow)" d="M586.1 777.3L875.9 1039.3"/>
  <path class="flow" marker-end="url(#arrow)" d="M543.9 777.3L611.1 1031.3"/>
  <path class="flow" marker-end="url(#arrow)" d="M520.3 777.3C487.9 916 449.2 1014.2 382.5 1075.1"/>
  <path class="flow" marker-end="url(#arrow)" d="M626.4 777.3L1160.2 1057.2"/>
  <path class="flow" marker-end="url(#arrow)" d="M1101.1 777.3L1197.8 1029.9"/>
  <!-- Return loop from Redis Pub/Sub back into the WebSocket servers. -->
  <path class="flow" marker-end="url(#arrow)" d="M171.6 1083.5C111.5 1033.1 96.3 984.4 96.3 930C96.3 857.7 151.9 720.1 405.3 735.4"/>
  <!-- Messaging and storage nodes. -->
  <use href="#channel" x="169.7" y="1029.4" width="212.8" height="113.8"/><text x="176.3" y="1170.1" class="label">Redis Pub/Sub</text>
  <rect x="568.5" y="1031.3" width="116.7" height="115.7" rx="26.4" class="node"/><text x="626.4" y="1099.5" text-anchor="middle" class="label">Cache</text><text x="626.4" y="1176.7" text-anchor="middle" class="label">Location</text><text x="626.4" y="1211.5" text-anchor="middle" class="label">Cache</text>
  <use href="#db" x="870.2" y="1029.4" width="120.5" height="120.4"/><text x="930.9" y="1176.7" text-anchor="middle" class="label">Location</text><text x="930.9" y="1211.5" text-anchor="middle" class="label">History</text><text x="930.9" y="1245.4" text-anchor="middle" class="label">Database</text>
  <use href="#db" x="1160.2" y="1029.4" width="120.5" height="120.4"/><text x="1221.4" y="1176.7" text-anchor="middle" class="label">User</text><text x="1221.4" y="1211.5" text-anchor="middle" class="label">Database</text><text x="1290.1" y="1082.6" class="small">User profile,</text><text x="1290.1" y="1114.6" class="small">Friendship</text>
</svg>
