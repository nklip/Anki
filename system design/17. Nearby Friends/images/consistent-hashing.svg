<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 674" role="img" aria-labelledby="title desc">
  <title id="title">Consistent-hash ring before and after replacing a server</title>
  <desc id="desc">Two hash rings show channel name two mapping to p_1, then to p_1_new after the server is replaced.</desc>
  <!-- Source-matching ring styles. -->
  <defs>
    <style>.text{font:400 27px 'DejaVu Sans',Arial,sans-serif;fill:#000}.small{font:400 25px 'DejaVu Sans',Arial,sans-serif;fill:#000}.panel{fill:#fff;stroke:#000;stroke-width:1.8;stroke-dasharray:9 7}.ring{fill:none;stroke:#000;stroke-width:1.8}.range{fill:none;stroke:#c8c8c8;stroke-width:55}.node{fill:#fff;stroke:#000;stroke-width:1.8}.active{fill:#d6d6d6;stroke:#000;stroke-width:1.8}.flow{fill:none;stroke:#000;stroke-width:1.8}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#000"/></marker>
  </defs>
  <rect width="1590" height="674" fill="#fff"/>
  <!-- Before and after frames. -->
  <rect x="26" y="25" width="597" height="621" class="panel"/><rect x="899" y="25" width="665" height="621" class="panel"/>
  <!-- Left ring and channel assignment. -->
  <path d="M137 165Q325 23 511 165" class="range"/><circle cx="321" cy="356" r="264" class="ring"/>
  <circle cx="137" cy="166" r="43" class="node"/><text x="137" y="176" text-anchor="middle" class="small">p_4</text><circle cx="511" cy="166" r="43" class="active"/><text x="511" y="176" text-anchor="middle" class="small">p_1</text><circle cx="516" cy="525" r="43" class="node"/><text x="516" y="535" text-anchor="middle" class="small">p_2</text><circle cx="131" cy="525" r="43" class="node"/><text x="131" y="535" text-anchor="middle" class="small">p_3</text>
  <circle cx="380" cy="100" r="21" class="node"/><path class="flow" marker-end="url(#arrow)" d="M339 232L373 121"/><text x="200" y="259" class="text">hash(channel_name2)</text><path class="flow" stroke-dasharray="8 7" marker-end="url(#arrow)" d="M397 113Q433 153 468 166"/>
  <!-- Change arrow between rings. -->
  <path d="M687 298H813V261L833 334 813 409V373H687Z" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <!-- Right ring; the replacement receives the same adjacent hash. -->
  <path d="M997 165Q1183 23 1369 165" class="range"/><circle cx="1182" cy="356" r="264" class="ring"/>
  <circle cx="997" cy="166" r="43" class="node"/><text x="997" y="176" text-anchor="middle" class="small">p_4</text><circle cx="1369" cy="166" r="43" class="active"/><text x="1369" y="176" text-anchor="middle" class="small">p_1</text><circle cx="1374" cy="525" r="43" class="node"/><text x="1374" y="535" text-anchor="middle" class="small">p_2</text><circle cx="989" cy="525" r="43" class="node"/><text x="989" y="535" text-anchor="middle" class="small">p_3</text>
  <circle cx="1238" cy="101" r="21" class="node"/><path class="flow" marker-end="url(#arrow)" d="M1197 232L1231 122"/><text x="1058" y="259" class="text">hash(channel_name2)</text><path class="flow" stroke-dasharray="8 7" marker-end="url(#arrow)" d="M1255 114Q1294 153 1326 166"/>
  <path class="flow" marker-end="url(#arrow)" d="M1456 88L1403 138"/><text x="1418" y="78" class="text">p_1_new</text>
</svg>
