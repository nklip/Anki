<svg xmlns="http://www.w3.org/2000/svg" width="944" height="1042" viewBox="0 0 944 1042" role="img" aria-labelledby="title desc">
  <title id="title">Find the correct Redis Pub/Sub server</title>
  <desc id="desc">A WebSocket server first uses the channel hash on a consistent-hash ring to locate Redis Pub/Sub server p_1, then publishes a location update to Channel 2 on that server. The other ring servers are p_2, p_3, and p_4.</desc>
  <!-- Source-matching monochrome styles, inset arrowheads, and a channel with unclipped top and bottom strokes. -->
  <defs>
    <style>
      .text{font:400 22.4px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}
      .step{font:400 19.5px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}
      .ellipsis{font:400 26.4px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}
      .node{fill:#fff;stroke:#000;stroke-width:1.3}
      .ring,.flow{fill:none;stroke:#000;stroke-width:1.3}
      .range{fill:none;stroke:#c0c0c0;stroke-width:43}
    </style>
    <!-- The nose projects 3 units beyond the shaft endpoint; every endpoint compensates for that projection. -->
    <marker id="arrow" markerWidth="14" markerHeight="10.2" viewBox="0 0 14 10.2" refX="11" refY="5.1" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L14 5.1 0 10.2Z" fill="#000"/>
    </marker>
    <symbol id="channel" viewBox="0 0 235 74" overflow="visible">
      <path d="M23.5 0H211.5V74H23.5C10.52 74 0 57.43 0 37S10.52 0 23.5 0Z" class="node"/>
      <ellipse cx="211.5" cy="37" rx="23.5" ry="37" class="node"/>
    </symbol>
  </defs>
  <rect width="944" height="1042" fill="#fff"/>

  <!-- Highlighted server range lies behind the hash ring and its nodes. -->
  <path class="range" d="M557.78 96.31Q704.87 -20 851.96 96.31"/>
  <circle class="ring" cx="704.86" cy="246.53" r="207.85"/>
  <circle class="node" cx="557.78" cy="96.31" r="33.99"/>
  <circle cx="851.96" cy="96.31" r="33.88" fill="#ccc" stroke="#000" stroke-width="1.3"/>
  <circle class="node" cx="553.34" cy="378.73" r="33.97"/>
  <circle class="node" cx="856.83" cy="378.74" r="33.96"/>
  <text class="text" x="557.78" y="104.9" text-anchor="middle">p_4</text>
  <text class="text" x="851.96" y="104.9" text-anchor="middle">p_1</text>
  <text class="text" x="553.34" y="387.3" text-anchor="middle">p_3</text>
  <text class="text" x="856.83" y="387.3" text-anchor="middle">p_2</text>

  <!-- Channel hash and its clockwise assignment; arrow tips meet the outer node strokes. -->
  <circle class="node" cx="748.94" cy="43.72" r="16.13"/>
  <path id="hash-label-arrow" class="flow" d="M737.45 153.4L746.85 63.4" marker-end="url(#arrow)"/>
  <!-- Align the final dash with the head's base so the dashed route has a continuous shaft-to-head join. -->
  <path id="hash-owner-arrow" class="flow" d="M755 59.37Q777 95 814.429 96.852" stroke-dasharray="5 4" stroke-dashoffset="3.139" marker-end="url(#arrow)"/>
  <text class="text" x="735.8" y="175.4" text-anchor="middle">hash(channel_name2)</text>

  <!-- Step 1: split the upward route around the three-line instruction. -->
  <path id="server-lookup-arrow" class="flow" d="M704.25 526.4V458.03" marker-end="url(#arrow)"/>
  <path id="server-lookup-shaft" class="flow" d="M704.25 670.75V618.4"/>
  <circle class="node" cx="554.45" cy="566.69" r="15.46"/>
  <text class="step" x="554.45" y="573.6" text-anchor="middle">1</text>
  <text class="text" x="704.25" y="554.8" text-anchor="middle">Figure out which Redis</text>
  <text class="text" x="704.25" y="580.3" text-anchor="middle">Pub/Sub server to publish</text>
  <text class="text" x="704.25" y="605.8" text-anchor="middle">location to</text>

  <!-- WebSocket publisher. -->
  <rect class="node" x="625.3" y="671.4" width="157.8" height="70.4"/>
  <text class="text" x="704.2" y="701.7" text-anchor="middle">WebSocket</text>
  <text class="text" x="704.2" y="727.2" text-anchor="middle">Servers</text>

  <!-- Redis server and its channels; the middle channel receives the location update. -->
  <rect class="node" x="17.3" y="533.6" width="319.1" height="496"/>
  <use href="#channel" x="59.6" y="564.9" width="235" height="74"/>
  <use href="#channel" x="59.6" y="669.7" width="235" height="74"/>
  <use href="#channel" x="59.6" y="869.7" width="235" height="74"/>
  <text class="text" x="169.7" y="714.8" text-anchor="middle">Channel 2</text>
  <text class="ellipsis" x="176.3" y="803.4" text-anchor="middle">......</text>
  <text class="text" x="169.7" y="1012.9" text-anchor="middle">Redis Pub/Sub</text>

  <!-- Step 2: leave space for the badge and label, and stop the leftward nose at the channel end cap. -->
  <path id="publish-shaft" class="flow" d="M624.65 706.7H533.9"/>
  <path id="publish-arrow" class="flow" d="M397.5 706.7H298.25" marker-end="url(#arrow)"/>
  <circle class="node" cx="413.61" cy="706.08" r="15.49"/>
  <text class="step" x="413.61" y="713.1" text-anchor="middle">2</text>
  <text class="text" x="481" y="689" text-anchor="middle">Publish</text>
  <text class="text" x="481" y="714.5" text-anchor="middle">location</text>
  <text class="text" x="481" y="740" text-anchor="middle">update</text>
</svg>
