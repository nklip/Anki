<svg xmlns="http://www.w3.org/2000/svg" width="1222" height="504" viewBox="0 0 1222 504" role="img" aria-labelledby="title desc">
  <title id="title">Backend fan-out to three friends</title>
  <desc id="desc">A user sends an update to the backend, which forwards it to Friend A, Friend B, and Friend C.</desc>
  <!-- Black-and-white source-matching definitions. -->
  <defs>
    <style>.label{font:400 30px 'DejaVu Sans',Arial,sans-serif;fill:#000}.node{fill:#fff;stroke:#000;stroke-width:1.8}.flow{fill:none;stroke:#000;stroke-width:1.8}</style>
    <!-- Keep the shaft 2.4 units behind the nose and compensate every endpoint at the visible node stroke. -->
    <marker id="arrow" viewBox="0 0 14.4 14.4" refX="12" refY="7.2" markerWidth="14.4" markerHeight="14.4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14.4 7.2 0 14.4Z" fill="#000"/></marker>
    <symbol id="phone" viewBox="0 0 56 86"><rect x="5" y="1" width="46" height="82" rx="6" fill="#000"/><rect x="12" y="11" width="32" height="54" fill="#fff"/><circle cx="28" cy="74" r="5.5" fill="#fff"/></symbol>
  </defs>
  <rect width="1222" height="504" fill="#fff"/>
  <!-- Connector layer; every arrow stops at a node boundary. -->
  <path id="user-to-backend-arrow" class="flow" marker-end="url(#arrow)" d="M163 255H428.511"/>
  <path id="friend-a-arrow" class="flow" marker-end="url(#arrow)" d="M637 214L910.604 104.159"/>
  <path id="friend-b-arrow" class="flow" marker-end="url(#arrow)" d="M648 255H906.7"/>
  <path id="friend-c-arrow" class="flow" marker-end="url(#arrow)" d="M637 296L910.281 406.709"/>
  <!-- Sender and backend cloud. -->
  <circle cx="106" cy="255" r="56" class="node"/><use href="#phone" x="78" y="212" width="56" height="86"/><text x="106" y="341" text-anchor="middle" class="label">User</text>
  <path d="M448 305c-29-10-29-43-8-60-12-29 23-57 48-50 16-27 58-27 76-5 31-14 72 10 74 39 24 8 27 42 6 57 6 30-31 53-61 40-22 18-58 14-73-6-26 12-52 5-62-15Z" class="node" transform="translate(448 256) scale(.95 .98) translate(-448 -256)"/><text x="536" y="266" text-anchor="middle" class="label">Backend</text>
  <!-- Friend recipients. -->
  <g><circle cx="966" cy="83" r="56" class="node"/><use href="#phone" x="938" y="40" width="56" height="86"/><text x="1034" y="94" class="label">Friend A</text><circle cx="966" cy="255" r="56" class="node"/><use href="#phone" x="938" y="212" width="56" height="86"/><text x="1034" y="266" class="label">Friend B</text><circle cx="966" cy="427" r="56" class="node"/><use href="#phone" x="938" y="384" width="56" height="86"/><text x="1034" y="438" class="label">Friend C</text></g>
</svg>
