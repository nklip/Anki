<svg xmlns="http://www.w3.org/2000/svg" width="926" height="526" viewBox="0 0 926 526" role="img" aria-labelledby="title desc">
  <title id="title">Peer-to-peer connections between mobile users</title>
  <desc id="desc">Eight phones form a peer-to-peer network with sixteen direct, undirected connections. Crossing lines do not represent additional peers or junctions.</desc>
  <!-- Reusable source-matching phone; every instance has explicit dimensions for predictable scaling. -->
  <defs>
    <style>
      .link{fill:none;stroke:#000;stroke-width:1.35}
      .peer{fill:#fff;stroke:#000;stroke-width:1.35}
    </style>
    <symbol id="phone" viewBox="0 0 39.4 66.9">
      <rect width="39.4" height="66.9" rx="8" fill="#000"/>
      <rect x="5.9" y="9" width="27.6" height="42.9" rx="0.5" fill="#fff"/>
      <circle cx="19.7" cy="59.5" r="4.65" fill="#fff"/>
    </symbol>
  </defs>
  <rect width="926" height="526" fill="#fff"/>

  <!-- Undirected links are painted beneath their endpoint circles; interior crossings are intentional, not junctions. -->
  <g id="peer-connections" class="link">
    <path id="link-a-b" data-connector="true" d="M71.63 66.87L400.82 132.37"/>
    <path id="link-a-e" data-connector="true" d="M71.63 66.87L277.37 239.03"/>
    <path id="link-a-g" data-connector="true" d="M71.63 66.87L161.56 429.46"/>
    <path id="link-b-c" data-connector="true" d="M400.82 132.37L698 85.15"/>
    <path id="link-b-f" data-connector="true" d="M400.82 132.37L552.46 346.43"/>
    <path id="link-c-d" data-connector="true" d="M698 85.15L854.22 178.85"/>
    <path id="link-c-f" data-connector="true" d="M698 85.15L552.46 346.43"/>
    <path id="link-c-g" data-connector="true" d="M698 85.15L161.56 429.46"/>
    <path id="link-c-h" data-connector="true" d="M698 85.15L752.11 462.21"/>
    <path id="link-d-f" data-connector="true" d="M854.22 178.85L552.46 346.43"/>
    <path id="link-d-h" data-connector="true" d="M854.22 178.85L752.11 462.21"/>
    <path id="link-e-f" data-connector="true" d="M277.37 239.03L552.46 346.43"/>
    <path id="link-e-g" data-connector="true" d="M277.37 239.03L161.56 429.46"/>
    <path id="link-f-g" data-connector="true" d="M552.46 346.43L161.56 429.46"/>
    <path id="link-f-h" data-connector="true" d="M552.46 346.43L752.11 462.21"/>
    <path id="link-g-h" data-connector="true" d="M161.56 429.46L752.11 462.21"/>
  </g>

  <!-- White peer circles mask the internal parts of the links and preserve the reference's node positions. -->
  <g id="peer-a">
    <circle class="peer" cx="71.63" cy="66.87" r="46.09"/>
    <use href="#phone" x="51.83" y="32.60" width="39.4" height="66.9"/>
  </g>
  <g id="peer-b">
    <circle class="peer" cx="400.82" cy="132.37" r="46.09"/>
    <use href="#phone" x="381.12" y="98.25" width="39.4" height="66.9"/>
  </g>
  <g id="peer-c">
    <circle class="peer" cx="698" cy="85.15" r="46.09"/>
    <use href="#phone" x="678.26" y="50.90" width="39.4" height="66.9"/>
  </g>
  <g id="peer-d">
    <circle class="peer" cx="854.22" cy="178.85" r="46.09"/>
    <use href="#phone" x="834.73" y="144.72" width="39.4" height="66.9"/>
  </g>
  <g id="peer-e">
    <circle class="peer" cx="277.37" cy="239.03" r="46.09"/>
    <use href="#phone" x="257.59" y="204.86" width="39.4" height="66.9"/>
  </g>
  <g id="peer-f">
    <circle class="peer" cx="552.46" cy="346.43" r="46.09"/>
    <use href="#phone" x="532.80" y="312.19" width="39.4" height="66.9"/>
  </g>
  <g id="peer-g">
    <circle class="peer" cx="161.56" cy="429.46" r="46.09"/>
    <use href="#phone" x="141.88" y="395.20" width="39.4" height="66.9"/>
  </g>
  <g id="peer-h">
    <circle class="peer" cx="752.11" cy="462.21" r="46.09"/>
    <use href="#phone" x="732.39" y="427.92" width="39.4" height="66.9"/>
  </g>
</svg>
