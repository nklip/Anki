<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1714 1344" role="img" aria-labelledby="title desc">
  <title id="title">Periodic location update</title>
  <desc id="desc">A mobile user sends periodic location updates through a load balancer and WebSocket servers to Redis Pub/Sub, location cache, location history, and the user database.</desc>
  <!-- Source-matching monochrome infrastructure and numbered-step styles. -->
  <defs>
    <style>.label{font:400 31.5px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.small{font:400 29.5px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.badge{font:400 26px Helvetica,Arial,'Liberation Sans',sans-serif;fill:#000}.node{fill:#fff;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2}</style>
    <marker id="arrow" viewBox="0 0 17 13" refX="17" refY="6.5" markerWidth="17" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 17 6.5 0 13Z" fill="#000"/></marker>
    <!-- Backward-pointing head for the start of bidirectional connectors. -->
    <marker id="arrowback" viewBox="0 0 17 13" refX="0" refY="6.5" markerWidth="17" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M17 0 0 6.5 17 13Z" fill="#000"/></marker>
    <symbol id="phone" viewBox="0 0 52 88"><rect x="0" y="0" width="52" height="88" rx="6" fill="#000"/><rect x="9" y="12" width="35" height="57" fill="#fff"/><circle cx="25.5" cy="77" r="6" fill="#fff"/></symbol>
    <!-- Storage cylinder: 124-wide body with a 12-deep top ellipse and matching base curve. -->
    <symbol id="db" viewBox="0 0 128 128"><path d="M2 14V114A62 12 0 0 0 126 114V14" class="node"/><ellipse cx="64" cy="14" rx="62" ry="12" class="node"/></symbol>
    <!-- Messaging cylinder: flat body with a rounded left end and a vertical end cap. -->
    <symbol id="channel" viewBox="0 0 226 121"><path d="M23 2H202.5V119H23A21 58.5 0 0 1 23 2Z" class="node"/><ellipse cx="202.5" cy="60.5" rx="22" ry="58.5" class="node"/></symbol>
  </defs>
  <rect width="1714" height="1344" fill="#fff"/>
  <!-- Mobile client and step 1. -->
  <text x="853.5" y="56" text-anchor="middle" class="label">Mobile Users</text><use href="#phone" x="827" y="65" width="52" height="88"/>
  <!-- Client curves are split around both protocol labels; the WebSocket route is bidirectional. -->
  <path class="flow" marker-end="url(#arrow)" d="M776.7 219.5C784 193.9 798.6 166.7 825 134"/><path class="flow" marker-end="url(#arrow)" d="M779.5 317.5C786.6 341.7 796.8 365.2 806 389"/>
  <path class="flow" d="M879 134C908.5 171.2 922.2 204.2 925.8 236.5"/><path class="flow" marker-end="url(#arrow)" d="M922.8 293.5C917 323.3 905.6 354.3 893 389"/>
  <circle cx="666" cy="264.5" r="22" class="node"/><text x="666" y="275" text-anchor="middle" class="badge">1</text><text x="691" y="261" class="label">WebSocket</text><text x="738" y="297" class="label">(WS)</text><text x="899" y="276" class="label">http</text>
  <rect x="719.5" y="388.5" width="266" height="108" class="node"/><text x="853.5" y="453" text-anchor="middle" class="label">Load Balancer</text>
  <!-- Service split and step 2. -->
  <path class="flow" marker-start="url(#arrowback)" marker-end="url(#arrow)" d="M805.1 496.5L612.6 717.5"/><path class="flow" marker-end="url(#arrow)" d="M901.6 496.5L1102.1 717.5"/>
  <circle cx="714" cy="603.5" r="22" class="node"/><text x="714" y="614" text-anchor="middle" class="badge">2</text>
  <rect x="432.5" y="717.5" width="266" height="107" class="node"/><text x="565" y="764" text-anchor="middle" class="label">WebSocket</text><text x="565" y="800" text-anchor="middle" class="label">Servers</text><circle cx="459.5" cy="793.5" r="22" class="node"/><text x="459.5" y="804" text-anchor="middle" class="badge">7</text>
  <text x="716" y="765" class="small">Bi-directional</text><text x="715" y="798" class="small">location info</text>
  <rect x="1017.5" y="717.5" width="266" height="107" class="node"/><text x="1150" y="764" text-anchor="middle" class="label">API</text><text x="1150" y="800" text-anchor="middle" class="label">Servers</text><text x="1301" y="751" class="small">User management</text><text x="1301" y="785" class="small">Friendship management</text><text x="1301" y="819" class="small">Auth, etc</text>
  <!-- Data operations; connectors are split around their step badges. -->
  <path class="flow" d="M624.2 824.5L746.7 936"/><path class="flow" marker-end="url(#arrow)" d="M801.9 986L932 1103"/>
  <path class="flow" d="M579.4 824.5L608.9 936"/><path class="flow" marker-end="url(#arrow)" d="M622.1 986L650.8 1094.5"/>
  <path class="flow" d="M554.4 824.5C544.9 865.3 534.8 902.7 523.8 937"/><path class="flow" marker-end="url(#arrow)" d="M507.6 983C481.6 1050.1 450.1 1102.6 408 1141"/>
  <path class="flow" marker-end="url(#arrow)" d="M667 824.5L1234 1122"/><path class="flow" marker-end="url(#arrow)" d="M1171.2 824.5L1274 1093"/>
  <!-- Return loop from Redis Pub/Sub back into the WebSocket servers. -->
  <path class="flow" d="M184 1150C122.4 1097.6 102.3 1049.7 104 982"/><path class="flow" marker-end="url(#arrow)" d="M112 936C142.6 856.2 191.9 772.8 432 780"/>
  <g><circle cx="771.5" cy="959.5" r="22" class="node"/><text x="771.5" y="970" text-anchor="middle" class="badge">3</text><circle cx="615.5" cy="959.5" r="22" class="node"/><text x="615.5" y="970" text-anchor="middle" class="badge">4</text><circle cx="515" cy="959.5" r="22" class="node"/><text x="515" y="970" text-anchor="middle" class="badge">5</text><circle cx="109" cy="959.5" r="22" class="node"/><text x="109" y="970" text-anchor="middle" class="badge">6</text></g>
  <!-- Messaging and storage layer. -->
  <use href="#channel" x="182" y="1092.5" width="226" height="121"/><text x="189" y="1242" class="label">Redis Pub/Sub</text>
  <rect x="605.5" y="1094.5" width="124" height="123" rx="28" class="node"/><text x="667" y="1167" text-anchor="middle" class="label">Cache</text><text x="667" y="1249" text-anchor="middle" class="label">Location</text><text x="667" y="1286" text-anchor="middle" class="label">Cache</text>
  <use href="#db" x="926" y="1092.5" width="128" height="128"/><text x="990.5" y="1249" text-anchor="middle" class="label">Location</text><text x="990.5" y="1286" text-anchor="middle" class="label">History</text><text x="990.5" y="1322" text-anchor="middle" class="label">Database</text>
  <use href="#db" x="1234" y="1092.5" width="128" height="128"/><text x="1299" y="1249" text-anchor="middle" class="label">User</text><text x="1299" y="1286" text-anchor="middle" class="label">Database</text><text x="1372" y="1149" class="small">User profile,</text><text x="1372" y="1183" class="small">Friendship</text>
</svg>
