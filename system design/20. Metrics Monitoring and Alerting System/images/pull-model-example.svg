<svg xmlns="http://www.w3.org/2000/svg" width="1398" height="772" viewBox="0 0 1398 772" role="img" aria-labelledby="title desc">
  <title id="title">Pull model for metric collection</title>
  <desc id="desc">A central metrics collector discovers targets and pulls metrics from web, database, queue, and cache clusters.</desc>
  <!-- Shared flow styles -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:9 7}.line{fill:none;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.t{font-size:31px;text-anchor:middle}</style></defs>
  <rect width="1398" height="772" fill="#fff"/>
  <!-- Metrics sources -->
  <rect class="dash" x="46" y="39" width="386" height="699"/><text class="t" x="239" y="79">Metrics Source</text>
  <g class="t"><rect class="box" x="85" y="114" width="307" height="108"/><text x="238" y="180">Web Servers</text><rect class="box" x="85" y="272" width="307" height="108"/><text x="238" y="338">DB Clusters</text><rect class="box" x="85" y="430" width="307" height="108"/><text x="238" y="496">Queue Clusters</text><rect class="box" x="85" y="588" width="307" height="108"/><text x="238" y="654">Cache Clusters</text></g>
  <!-- Collector and service discovery -->
  <rect class="box" x="966" y="345" width="306" height="109"/><text class="t" x="1119" y="412">Metrics Collector</text>
  <rect class="box" x="876" y="39" width="486" height="137"/><text class="t" x="1119" y="81">Service Discovery</text><rect class="box" x="903" y="107" width="208" height="43"/><text class="t" x="1007" y="141">etcd</text><rect class="box" x="1130" y="107" width="208" height="43"/><text class="t" x="1234" y="141">Zookeeper</text><path class="flow" d="M1119 343V178"/>
  <!-- Pull arrows stop at each source boundary; labels sit in the routing corridor. -->
  <path class="line" d="M966 359L765 305M966 388L765 372M966 416L765 435M966 443L765 508"/>
  <!-- Each pulled source has its own destination head. -->
  <path class="flow" d="M535 244L394 205"/><path class="flow" d="M535 353L394 342"/>
  <path class="flow" d="M535 461L394 476"/><path class="flow" d="M535 582L394 628"/>
  <g class="t"><text x="650" y="278">Pull metrics</text><text x="650" y="362">Pull metrics</text><text x="650" y="447">Pull metrics</text><text x="650" y="532">Pull metrics</text></g>
</svg>
