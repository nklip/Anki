<svg xmlns="http://www.w3.org/2000/svg" width="878" height="524" viewBox="0 0 878 524" role="img" aria-labelledby="title desc">
  <title id="title">Core metrics monitoring components</title>
  <desc id="desc">A metrics monitoring and alerting system branches into data collection, transmission, storage, alerting, and visualization.</desc>
  <!-- Shared diagram styling -->
  <defs><style>text{font-family:Georgia,'Times New Roman',serif;fill:#111}.branch{fill:none;stroke:#111;stroke-width:3}</style></defs>
  <rect width="878" height="524" fill="#fff"/>
  <!-- Central system -->
  <rect x="18" y="168" width="370" height="192" rx="42" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="203" y="225" font-size="38" text-anchor="middle"><tspan x="203">Metrics mon-</tspan><tspan x="203" dy="50">itoring and</tspan><tspan x="203" dy="50">alerting system</tspan></text>
  <!-- Five core responsibilities -->
  <g id="responsibilities" font-size="35">
    <path class="branch" d="M388 264C438 248 433 52 490 48"/><text x="505" y="62">1. Data collection</text>
    <path class="branch" d="M388 264C440 257 445 157 490 153"/><text x="505" y="168">2. Data transmission</text>
    <path class="branch" d="M388 264H490"/><text x="505" y="277">3. Data storage</text>
    <path class="branch" d="M388 264C440 270 445 367 490 371"/><text x="505" y="386">4. Alerting</text>
    <path class="branch" d="M388 264C438 280 433 472 490 476"/><text x="505" y="491">5. Visualization</text>
  </g>
</svg>
