<svg xmlns="http://www.w3.org/2000/svg" width="1582" height="952" viewBox="0 0 1582 952" role="img" aria-labelledby="title desc">
  <title id="title">Time-series labels and query window</title>
  <desc id="desc">Two labeled HTTP error series are plotted across times t1 through t9; a query selects both machines between t4 and t7.</desc>
  <!-- Shared axes and arrow marker -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.axis{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dot{fill:#07559f}.note{font-size:30px;text-anchor:middle}</style></defs>
  <rect width="1582" height="952" fill="#fff"/>
  <!-- Plot axes and selected time range -->
  <!-- Separate axes are required because a marker applies only to the final subpath. -->
  <path class="axis" d="M724 665V28"/><path class="axis" d="M724 665H1537"/><text x="699" y="345" font-size="30" text-anchor="middle" transform="rotate(-90 699 345)">Time series Names/Labels</text><text x="1488" y="743" font-size="30">Time</text>
  <rect x="1005" y="489" width="337" height="156" fill="#e3a56d"/>
  <!-- Time ticks and metric samples -->
  <g font-size="25" text-anchor="middle"><text x="779" y="697">t1</text><text x="874" y="697">t2</text><text x="962" y="697">t3</text><text x="1050" y="697">t4</text><text x="1138" y="697">t5</text><text x="1226" y="697">t6</text><text x="1314" y="697">t7</text><text x="1402" y="697">t8</text><text x="1490" y="697">t9</text></g>
  <g class="dot">
    <circle cx="779" cy="193" r="12"/><circle cx="874" cy="193" r="12"/><circle cx="1050" cy="193" r="12"/><circle cx="1138" cy="193" r="12"/><circle cx="1226" cy="193" r="12"/><circle cx="1402" cy="193" r="12"/><circle cx="1490" cy="193" r="12"/>
    <circle cx="779" cy="259" r="12"/><circle cx="962" cy="259" r="12"/><circle cx="1138" cy="259" r="12"/><circle cx="1226" cy="259" r="12"/><circle cx="1314" cy="259" r="12"/>
    <circle cx="1050" cy="325" r="12"/><circle cx="1226" cy="325" r="12"/><circle cx="1402" cy="325" r="12"/><circle cx="1490" cy="325" r="12"/>
    <circle cx="779" cy="391" r="12"/><circle cx="874" cy="391" r="12"/><circle cx="962" cy="391" r="12"/><circle cx="1138" cy="391" r="12"/><circle cx="1314" cy="391" r="12"/>
    <circle cx="962" cy="457" r="12"/><circle cx="1138" cy="457" r="12"/><circle cx="1226" cy="457" r="12"/><circle cx="1402" cy="457" r="12"/><circle cx="1490" cy="457" r="12"/>
    <circle cx="779" cy="523" r="12"/><circle cx="874" cy="523" r="12"/><circle cx="1050" cy="523" r="12"/><circle cx="1138" cy="523" r="12"/><circle cx="1314" cy="523" r="12"/><circle cx="1402" cy="523" r="12"/>
    <circle cx="779" cy="589" r="12"/><circle cx="874" cy="589" r="12"/><circle cx="962" cy="589" r="12"/><circle cx="1050" cy="589" r="12"/><circle cx="1226" cy="589" r="12"/><circle cx="1314" cy="589" r="12"/><circle cx="1402" cy="589" r="12"/><circle cx="1490" cy="589" r="12"/>
  </g>
  <!-- Series labels point to the two lowest rows. -->
  <text x="282" y="490" font-size="27" text-anchor="middle"><tspan x="282">http_error_count{“servicepool”:”s1”,</tspan><tspan x="282" dy="38">”method”:”GET”,”machinename”:”m2”}</tspan></text><path d="M553 523H710" stroke="#000" stroke-width="2"/><path d="M724 523L710 515V531Z"/>
  <text x="282" y="614" font-size="27" text-anchor="middle"><tspan x="282">http_error_count{“servicepool”:”s1”,</tspan><tspan x="282" dy="38">”method”:”GET”,”machinename”:”m1”}</tspan></text><path d="M553 589H710" stroke="#000" stroke-width="2"/><path d="M724 589L710 581V597Z"/>
  <!-- Query annotation -->
  <path class="axis" d="M1173 755V647"/><text class="note" x="1173" y="809"><tspan x="1173">Query to get errors on</tspan><tspan x="1173" dy="37">servicepool=s1 and method=GET</tspan><tspan x="1173" dy="37">across all machines</tspan><tspan x="1173" dy="37">between time t4 and t7</tspan></text>
</svg>
