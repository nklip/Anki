<svg xmlns="http://www.w3.org/2000/svg" width="1382" height="1060" viewBox="0 0 1382 1060" role="img" aria-labelledby="title desc">
  <title id="title">Metrics partitioning in Kafka</title>
  <desc id="desc">A metrics collector publishes different metrics into separate Kafka partitions.</desc>
  <!-- Shared flow styles -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:9 7}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.t{font-size:40px;text-anchor:middle}</style></defs>
  <rect width="1382" height="1060" fill="#fff"/>
  <!-- Producer -->
  <rect class="box" x="64" y="469" width="359" height="128"/><text class="t" x="243" y="548">Metrics Collector</text>
  <!-- Kafka partitions -->
  <rect class="dash" x="763" y="40" width="549" height="987"/><text class="t" x="1037" y="96">Kafka</text>
  <rect class="box" x="819" y="142" width="436" height="128"/><text class="t" x="1037" y="220">Partition 0 (metric 1)</text>
  <rect class="box" x="819" y="361" width="436" height="128"/><text class="t" x="1037" y="439">Partition 1 (metric 2)</text>
  <rect class="box" x="819" y="580" width="436" height="128"/><text class="t" x="1037" y="658">Partition 2 (metric 3)</text>
  <text x="1037" y="819" font-size="65" text-anchor="middle">…</text><text x="1037" y="947" font-size="65" text-anchor="middle">…</text>
  <path class="flow" d="M423 533H761"/>
</svg>
