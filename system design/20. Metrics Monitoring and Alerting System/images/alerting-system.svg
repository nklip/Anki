<svg xmlns="http://www.w3.org/2000/svg" width="1956" height="708" viewBox="0 0 1956 708" role="img" aria-labelledby="title desc">
  <title id="title">Alerting system workflow</title>
  <desc id="desc">Rules and queries feed an alert manager, which stores alerts, publishes through Kafka, and sends notifications through an alert consumer.</desc>
  <!-- Shared shapes and arrow marker -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.label{font-size:31px;text-anchor:middle}.step{fill:#fff;stroke:#000;stroke-width:2}</style></defs>
  <rect width="1956" height="708" fill="#fff"/>
  <!-- Rule, cache, and alert evaluation -->
  <path class="box" d="M92 46H168L188 66V157H92Z"/><path d="M168 46V69H188" fill="none" stroke="#000" stroke-width="2"/><text x="140" y="188" class="label">Rule config files</text>
  <rect class="box" x="360" y="53" width="273" height="98"/><text x="496" y="113" class="label">Cache</text>
  <rect class="box" x="360" y="317" width="273" height="97"/><text x="496" y="377" class="label">Alert Manager</text>
  <rect class="box" x="360" y="581" width="273" height="97"/><text x="496" y="642" class="label">Query Service</text>
  <!-- Alert store cylinder -->
  <path class="box" d="M92 327V399C92 417 189 417 189 399V327Z"/><ellipse class="box" cx="140.5" cy="327" rx="48.5" ry="10"/><text x="140" y="445" class="label">Alert store</text>
  <!-- Kafka and consumer -->
  <path class="box" d="M804 317H971C994 317 994 414 971 414H804C781 414 781 317 804 317Z"/><ellipse class="box" cx="971" cy="365.5" rx="19" ry="48.5"/><text x="879" y="377" class="label">Kafka</text>
  <rect class="box" x="1160" y="317" width="273" height="97"/><text x="1296" y="377" class="label">Alert Consumer</text>
  <!-- Notification channels -->
  <g class="label"><rect class="box" x="1634" y="109" width="272" height="98"/><text x="1770" y="170">Email</text><rect class="box" x="1634" y="248" width="272" height="97"/><text x="1770" y="308">Text Message</text><rect class="box" x="1634" y="387" width="272" height="97"/><text x="1770" y="448">PageDuty</text><rect class="box" x="1634" y="526" width="272" height="97"/><text x="1770" y="587">HTTPS Endpoints</text></g>
  <!-- Numbered flow; each destination segment is separate so every arrowhead renders. -->
  <path d="M188 102H255M635 365H699M992 365H1056M1435 365H1460M1500 365H1525M1525 158V574" fill="none" stroke="#000" stroke-width="2"/>
  <path class="flow" d="M295 102H358"/>
  <!-- Cache, alert store, and query service exchange data with the alert manager in both directions. -->
  <path class="flow" d="M496 253V315"/><path class="flow" d="M496 213V153"/>
  <path class="flow" d="M295 365H358"/><path class="flow" d="M255 365H191"/>
  <path class="flow" d="M496 477V416"/><path class="flow" d="M496 517V579"/>
  <!-- Kafka's rounded left edge reaches x=780 at the centerline; keep the arrow tip on that boundary. -->
  <path class="flow" d="M739 365H780"/><path class="flow" d="M1096 365H1158"/>
  <path class="flow" d="M1525 158H1632"/>
  <path class="flow" d="M1525 296H1632"/><path class="flow" d="M1525 435H1632"/><path class="flow" d="M1525 574H1632"/>
  <g font-size="25" text-anchor="middle"><circle class="step" cx="275" cy="102" r="18"/><text x="275" y="111">1</text><circle class="step" cx="496" cy="233" r="18"/><text x="496" y="242">2</text><circle class="step" cx="496" cy="497" r="18"/><text x="496" y="506">3</text><circle class="step" cx="275" cy="365" r="18"/><text x="275" y="374">4</text><circle class="step" cx="719" cy="365" r="18"/><text x="719" y="374">5</text><circle class="step" cx="1076" cy="365" r="18"/><text x="1076" y="374">6</text><circle class="step" cx="1480" cy="365" r="18"/><text x="1480" y="374">7</text></g>
</svg>
