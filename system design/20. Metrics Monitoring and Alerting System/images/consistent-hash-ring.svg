<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1076" viewBox="0 0 1750 1076" role="img" aria-labelledby="title desc">
  <title id="title">Consistent-hash ring for collectors</title>
  <desc id="desc">Four collectors and six servers are placed on a hash ring; Collector 2 owns the highlighted arc between Collector 1 and Collector 2.</desc>
  <!-- Shared node and arrow styling -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.ring{fill:none;stroke:#111;stroke-width:2}.node{fill:#fff;stroke:#111;stroke-width:2}.collector{fill:#fff;stroke:#111;stroke-width:2}.t{font-size:31px}.s{font-size:25px;text-anchor:middle}</style></defs>
  <rect width="1750" height="1076" fill="#fff"/>
  <!-- Ring and Collector 2 ownership range -->
  <ellipse class="ring" cx="628" cy="584" rx="463" ry="425"/>
  <path d="M302 279A463 425 0 0 1 955 279" fill="none" stroke="#c7c7c7" stroke-width="80"/>
  <path class="ring" d="M302 279A463 425 0 0 1 955 279"/>
  <text x="628" y="43" font-size="31" text-anchor="middle">Collector 2 is responsible for servers in this range</text><path d="M628 66V120" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Collector nodes -->
  <g><circle class="collector" cx="302" cy="279" r="70"/><circle class="collector" cx="955" cy="279" r="70"/><circle class="collector" cx="965" cy="857" r="70"/><circle class="collector" cx="291" cy="857" r="70"/></g>
  <g class="t"><text x="67" y="290">Collector 1</text><text x="1039" y="290">Collector 2</text><text x="1048" y="869">Collector 3</text><text x="52" y="869">Collector 4</text></g>
  <!-- Server positions -->
  <g class="s"><circle class="node" cx="520" cy="171" r="36"/><text x="520" y="180">S1</text><circle class="node" cx="727" cy="171" r="36"/><text x="727" y="180">S5</text><circle class="node" cx="1066" cy="446" r="34"/><text x="1066" y="455">S2</text><circle class="node" cx="1089" cy="641" r="34"/><text x="1089" y="650">S4</text><circle class="node" cx="628" cy="1012" r="34"/><text x="628" y="1021">S3</text><circle class="node" cx="165" cy="558" r="34"/><text x="165" y="567">S6</text></g>
  <!-- Legend -->
  <g class="s"><circle class="node" cx="1510" cy="193" r="34"/><text x="1510" y="202">S1</text><circle class="node" cx="1510" cy="270" r="34"/><text x="1510" y="279">S2</text><circle class="node" cx="1510" cy="347" r="34"/><text x="1510" y="356">S3</text><circle class="node" cx="1510" cy="424" r="34"/><text x="1510" y="433">S4</text><circle class="node" cx="1510" cy="501" r="34"/><text x="1510" y="510">S5</text><circle class="node" cx="1510" cy="578" r="34"/><text x="1510" y="587">S6</text></g>
  <g class="t"><text x="1555" y="204">= Server 1</text><text x="1555" y="281">= Server 2</text><text x="1555" y="358">= Server 3</text><text x="1555" y="435">= Server 4</text><text x="1555" y="512">= Server 5</text><text x="1555" y="589">= Server 6</text></g>
</svg>
