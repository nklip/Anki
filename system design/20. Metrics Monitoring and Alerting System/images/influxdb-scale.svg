<svg xmlns="http://www.w3.org/2000/svg" width="1658" height="496" viewBox="0 0 1658 496" role="img" aria-labelledby="title desc">
  <title id="title">InfluxDB scaling reference</title>
  <desc id="desc">A sizing table mapping CPU, memory, IOPS, write rate, query rate, and unique-series count.</desc>
  <!-- Shared table styling -->
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle}.h{fill:#fff;font-size:28px;font-weight:700}.v{fill:#4d525c;font-size:27px}</style></defs>
  <rect width="1658" height="496" fill="#fff"/>
  <!-- Header -->
  <rect x="10" y="8" width="1638" height="109" rx="8" fill="#6658ef"/>
  <g class="h">
    <text x="142" y="52"><tspan x="142">vCPU or</tspan><tspan x="142" dy="34">CPU</tspan></text>
    <text x="395" y="70">RAM</text><text x="616" y="70">IOPS</text>
    <text x="879" y="52"><tspan x="879">Writes per</tspan><tspan x="879" dy="34">second</tspan></text>
    <text x="1190" y="52"><tspan x="1190">Queries’ per</tspan><tspan x="1190" dy="34">second</tspan></text>
    <text x="1498" y="52"><tspan x="1498">Unique</tspan><tspan x="1498" dy="34">series</tspan></text>
  </g>
  <!-- Capacity rows -->
  <rect x="10" y="117" width="1638" height="105" fill="#fff"/>
  <rect x="10" y="222" width="1638" height="105" fill="#f5f6f8"/>
  <rect x="10" y="327" width="1638" height="105" fill="#fff"/>
  <g class="v">
    <text x="142" y="181">2–4 cores</text><text x="395" y="181">2–4 GB</text><text x="616" y="181">500</text><text x="879" y="181">&lt; 5,000</text><text x="1190" y="181">&lt; 5</text><text x="1498" y="181">&lt; 100,000</text>
    <text x="142" y="286">4–6 cores</text><text x="395" y="269"><tspan x="395">8–32</tspan><tspan x="395" dy="34">GB</tspan></text><text x="616" y="269"><tspan x="616">500–</tspan><tspan x="616" dy="34">1000</tspan></text><text x="879" y="286">&lt; 250,000</text><text x="1190" y="286">&lt; 25</text><text x="1498" y="286">&lt; 1,000,000</text>
    <text x="142" y="391">8+ cores</text><text x="395" y="391">32+ GB</text><text x="616" y="391">1000+</text><text x="879" y="391">&gt; 250,000</text><text x="1190" y="391">&gt; 25</text><text x="1498" y="391">&gt; 1,000,000</text>
  </g>
  <rect x="10" y="8" width="1638" height="424" rx="8" fill="none" stroke="#d4d7dd" stroke-width="2"/>
</svg>
