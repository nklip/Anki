<svg xmlns="http://www.w3.org/2000/svg" width="1114" height="398" viewBox="0 0 1114 398" role="img" aria-labelledby="title desc">
  <title id="title">Example metric data fields</title>
  <desc id="desc">A table showing the name, labels, timestamp, and value of a CPU load metric.</desc>
  <!-- Shared table styling -->
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24272b}.cell{stroke:#dedede;stroke-width:1.5}.label{font-size:31px;font-weight:700}.value{font-size:31px}</style></defs>
  <rect width="1114" height="398" fill="#fff"/>
  <!-- Four metric fields; alternating rows match the source table. -->
  <g id="metric-fields">
    <rect class="cell" x="5" y="5" width="1104" height="96" fill="#f4f4f4"/>
    <rect class="cell" x="5" y="101" width="1104" height="96" fill="#fff"/>
    <rect class="cell" x="5" y="197" width="1104" height="96" fill="#f4f4f4"/>
    <rect class="cell" x="5" y="293" width="1104" height="96" fill="#fff"/>
    <path d="M491 5V389" stroke="#dedede" stroke-width="1.5"/>
    <text class="label" x="29" y="65">metric_name</text><text class="label" x="514" y="65">cpu.load</text>
    <text class="label" x="29" y="161">labels</text><text class="value" x="514" y="161">host:i631,env:prod</text>
    <text class="label" x="29" y="257">timestamp</text><text class="value" x="514" y="257">1613707265</text>
    <text class="label" x="29" y="353">value</text><text class="value" x="514" y="353">0.29</text>
  </g>
</svg>
