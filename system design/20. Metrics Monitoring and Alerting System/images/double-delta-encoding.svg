<svg xmlns="http://www.w3.org/2000/svg" width="1928" height="652" viewBox="0 0 1928 652" role="img" aria-labelledby="title desc">
  <title id="title">Double-delta encoding</title>
  <desc id="desc">Five timestamps produce four second-order differences: 10, 10, 9, and 11.</desc>
  <!-- Shared arrow marker and text styling -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.flow{fill:none;stroke:#000;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1928" height="652" fill="#fff"/>
  <text x="964" y="62" font-size="42" text-anchor="middle">Double-delta Encoding</text>
  <!-- Timestamp axis -->
  <path d="M138 218H1880" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-size="39" text-anchor="middle">
    <path d="M138 188V251M515 188V251M889 188V251M1264 188V251M1639 188V251" stroke="#000" stroke-width="2.5"/>
    <text x="138" y="178">T0</text><text x="515" y="178">T0</text><text x="889" y="178">T0</text><text x="1264" y="178">T0</text><text x="1639" y="178">T0</text>
    <text x="138" y="291">1610087371</text><text x="515" y="291">1610087381</text><text x="889" y="291">1610087391</text><text x="1264" y="291">1610087400</text><text x="1639" y="291">1610087411</text>
  </g>
  <!-- Adjacent timestamps feed each double-delta result. -->
  <g class="flow">
    <path d="M160 315L294 464"/><path d="M495 315L365 464"/>
    <path d="M538 315L674 464"/><path d="M870 315L739 464"/>
    <path d="M912 315L1051 464"/><path d="M1245 315L1117 464"/>
    <path d="M1286 315L1426 464"/><path d="M1620 315L1492 464"/>
  </g>
  <g text-anchor="middle">
    <circle cx="330" cy="507" r="52" fill="#fff" stroke="#000" stroke-width="2.5"/><path d="M305 526L330 477L355 526Z" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="330" y="611" font-size="39">10</text>
    <circle cx="708" cy="507" r="52" fill="#fff" stroke="#000" stroke-width="2.5"/><path d="M683 526L708 477L733 526Z" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="708" y="611" font-size="39">10</text>
    <circle cx="1085" cy="507" r="52" fill="#fff" stroke="#000" stroke-width="2.5"/><path d="M1060 526L1085 477L1110 526Z" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1085" y="611" font-size="39">9</text>
    <circle cx="1461" cy="507" r="52" fill="#fff" stroke="#000" stroke-width="2.5"/><path d="M1436 526L1461 477L1486 526Z" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1461" y="611" font-size="39">11</text>
  </g>
</svg>
