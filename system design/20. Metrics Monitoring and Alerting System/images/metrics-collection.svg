<svg xmlns="http://www.w3.org/2000/svg" width="1744" height="808" viewBox="0 0 1744 808" role="img" aria-labelledby="title desc">
  <title id="title">Metrics collection subsystem</title>
  <desc id="desc">The highlighted collection subsystem contains a metrics source and collector before time-series storage, querying, visualization, and alerting.</desc>
  <!-- Shared flow styles -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.t{font-size:24px;text-anchor:middle}</style></defs>
  <rect width="1744" height="808" fill="#fff"/>
  <!-- Dashed collection boundary -->
  <rect class="dash" x="40" y="474" width="679" height="183"/>
  <rect class="box" x="76" y="531" width="244" height="82"/><text class="t" x="198" y="582">Metrics Source</text><rect class="box" x="438" y="531" width="244" height="82"/><text class="t" x="560" y="582">Metrics Collector</text><path class="flow" d="M320 572H436"/>
  <!-- Storage and query services -->
  <path class="box" d="M803 540V602C803 618 892 618 892 602V540Z"/><ellipse class="box" cx="847.5" cy="540" rx="44.5" ry="10"/><text class="t" x="848" y="648">Time series DB</text><path class="flow" d="M684 572H801"/>
  <rect class="box" x="1036" y="531" width="244" height="82"/><text class="t" x="1158" y="582">Query Service</text><path class="flow" d="M1034 572H894"/>
  <rect class="box" x="1036" y="702" width="244" height="82"/><text class="t" x="1158" y="735"><tspan x="1158">Visualization</tspan><tspan x="1158" dy="28">System</tspan></text><path d="M1158 700V685" fill="none" stroke="#000" stroke-width="2"/><path class="flow" d="M1158 635V615"/><text class="t" x="1158" y="665">Send Queries</text>
  <!-- Alerting fan-out -->
  <rect class="box" x="1036" y="359" width="244" height="82"/><text class="t" x="1158" y="410">Alerting System</text><path d="M1158 443V466" fill="none" stroke="#000" stroke-width="2"/><path class="flow" d="M1158 506V529"/><text class="t" x="1158" y="491">Send Queries</text>
  <g class="t"><rect class="box" x="1456" y="190" width="244" height="82"/><text x="1578" y="241">Email</text><rect class="box" x="1456" y="306" width="244" height="82"/><text x="1578" y="357">Text Message</text><rect class="box" x="1456" y="422" width="244" height="82"/><text x="1578" y="473">PageDuty</text><rect class="box" x="1456" y="538" width="244" height="82"/><text x="1578" y="589">HTTPS Endpoints</text></g>
  <!-- Keep notification routes independent so all four destination heads render. -->
  <path class="flow" d="M1220 358Q1360 260 1454 231"/>
  <path class="flow" d="M1280 377Q1370 345 1454 347"/>
  <path class="flow" d="M1280 422Q1370 460 1454 463"/>
  <path class="flow" d="M1220 441Q1360 550 1454 579"/>
</svg>
