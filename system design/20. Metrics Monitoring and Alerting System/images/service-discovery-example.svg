<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="352" viewBox="0 0 1158 352" role="img" aria-labelledby="title desc">
  <title id="title">Service discovery registry</title>
  <desc id="desc">A service-discovery layer backed by etcd and Zookeeper stores regional MySQL service records.</desc>
  <!-- Shared styles and document shape -->
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.outline{fill:#fff;stroke:#000;stroke-width:2}</style></defs>
  <rect width="1158" height="352" fill="#fff"/>
  <!-- Service discovery backends -->
  <g id="registry">
    <rect class="outline" x="34" y="92" width="580" height="164"/>
    <text x="324" y="144" font-size="40" text-anchor="middle">Service Discovery</text>
    <rect class="outline" x="65" y="174" width="249" height="52"/><text x="189" y="214" font-size="40" text-anchor="middle">etcd</text>
    <rect class="outline" x="336" y="174" width="249" height="52"/><text x="460" y="214" font-size="40" text-anchor="middle">Zookeeper</text>
  </g>
  <!-- Overlapping records demonstrate different discovered regions. -->
  <g id="service-records" font-size="31">
    <path class="outline" d="M740 29H970L1029 61V186H740Z"/><path d="M970 29V61H1029" fill="none" stroke="#000" stroke-width="2"/>
    <text x="763" y="91"><tspan x="763">region: us-west</tspan><tspan x="763" dy="38">type: mysql</tspan><tspan x="763" dy="38">host: 10.10.11.9</tspan></text>
    <path class="outline" d="M791 96H1021L1080 128V253H791Z"/><path d="M1021 96V128H1080" fill="none" stroke="#000" stroke-width="2"/>
    <text x="814" y="158"><tspan x="814">region: us-south</tspan><tspan x="814" dy="38">type: mysql</tspan><tspan x="814" dy="38">host: 10.10.11.5</tspan></text>
    <path class="outline" d="M843 163H1073L1132 195V320H843Z"/><path d="M1073 163V195H1132" fill="none" stroke="#000" stroke-width="2"/>
    <text x="866" y="225"><tspan x="866">region: us-east</tspan><tspan x="866" dy="38">type: mysql</tspan><tspan x="866" dy="38">host: 10.10.11.1</tspan></text>
  </g>
</svg>
