<svg xmlns="http://www.w3.org/2000/svg" width="1204" height="408" viewBox="0 0 1204 408" role="img" aria-labelledby="title desc">
  <title id="title">Time-series data structure</title>
  <desc id="desc">A table describing the metric name, tags or labels, and timestamped values in a time series.</desc>
  <!-- Shared table styling -->
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24272b}.cell{stroke:#dedede;stroke-width:1.5}.head{font-size:31px;font-weight:700}.body{font-size:29px}</style></defs>
  <rect width="1204" height="408" fill="#fff"/>
  <!-- Header and three time-series fields -->
  <g id="time-series-fields">
    <rect class="cell" x="6" y="6" width="1192" height="91" fill="#f4f4f4"/>
    <rect class="cell" x="6" y="97" width="1192" height="91" fill="#fff"/>
    <rect class="cell" x="6" y="188" width="1192" height="91" fill="#f4f4f4"/>
    <rect class="cell" x="6" y="279" width="1192" height="91" fill="#fff"/>
    <path d="M619 6V370" stroke="#dedede" stroke-width="1.5"/>
    <text class="head" x="30" y="63">Name</text><text class="head" x="643" y="63">Type</text>
    <text class="body" x="30" y="154">A metric name</text><text class="body" x="643" y="154">String</text>
    <text class="body" x="30" y="245">A set of tags/labels</text><text class="body" x="643" y="245">List of &lt;key:value&gt; pairs</text>
    <text class="body" x="30" y="336">An array of values and their timestamps</text><text class="body" x="643" y="336">An array of &lt;value, timestamp&gt; pairs</text>
  </g>
</svg>
