<svg xmlns="http://www.w3.org/2000/svg" width="1714" height="590" viewBox="0 0 1714 590" role="img" aria-labelledby="title desc">
  <title id="title">Metrics collection agent</title>
  <desc id="desc">A web server feeds three metrics into a local collection agent, which pushes through a load balancer to a collector pool.</desc>
  <!-- Shared agent and flow styling -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:9 7}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.t{font-size:31px;text-anchor:middle}</style></defs>
  <rect width="1714" height="590" fill="#fff"/>
  <!-- Source and local collection agent -->
  <rect class="dash" x="36" y="28" width="803" height="533"/><text class="t" x="201" y="100">Metrics Source</text>
  <rect class="box" x="70" y="249" width="260" height="94"/><text class="t" x="200" y="307">Web Servers</text>
  <rect class="dash" x="481" y="66" width="328" height="461"/><text class="t" x="645" y="102">Collection Agent</text>
  <rect class="box" x="514" y="130" width="260" height="92"/><text class="t" x="644" y="187">Metrics 1</text><rect class="box" x="514" y="264" width="260" height="92"/><text class="t" x="644" y="321">Metrics 2</text><rect class="box" x="514" y="398" width="260" height="92"/><text class="t" x="644" y="455">Metrics 3</text>
  <path class="flow" d="M330 296H479"/>
  <!-- Push path to scalable collectors -->
  <path d="M809 296H875" fill="none" stroke="#000" stroke-width="2"/><path class="flow" d="M1020 296H1070"/><text class="t" x="945" y="287"><tspan x="945">Push</tspan><tspan x="945" dy="34">Messages</tspan></text>
  <rect class="box" x="1072" y="110" width="140" height="372"/><text class="t" x="1142" y="289"><tspan x="1142">Load</tspan><tspan x="1142" dy="34">Balancer</tspan></text>
  <path d="M1212 296H1379" fill="none" stroke="#000" stroke-width="2"/><path d="M1393 296L1379 288V304Z"/>
  <rect class="box" x="1425" y="278" width="260" height="94"/><rect class="box" x="1409" y="264" width="260" height="94"/><rect class="box" x="1393" y="249" width="260" height="94"/><text class="t" x="1523" y="307">Metrics Collectors</text>
</svg>
