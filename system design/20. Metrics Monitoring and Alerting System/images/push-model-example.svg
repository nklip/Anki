<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="674" viewBox="0 0 1170 674" role="img" aria-labelledby="title desc">
  <title id="title">Push model for metric collection</title>
  <desc id="desc">Web, database, queue, and cache clusters push their metrics to a central metrics collector.</desc>
  <!-- Shared flow styles -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:9 7}.line{fill:none;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.t{font-size:31px;text-anchor:middle}</style></defs>
  <rect width="1170" height="674" fill="#fff"/>
  <!-- Metrics sources -->
  <rect class="dash" x="36" y="25" width="345" height="626"/><text class="t" x="208" y="63">Metrics Source</text>
  <g class="t"><rect class="box" x="70" y="92" width="275" height="98"/><text x="207" y="152">Web Servers</text><rect class="box" x="70" y="234" width="275" height="98"/><text x="207" y="294">DB Clusters</text><rect class="box" x="70" y="376" width="275" height="98"/><text x="207" y="436">Queue Clusters</text><rect class="box" x="70" y="518" width="275" height="98"/><text x="207" y="578">Cache Clusters</text></g>
  <!-- Push routes and collector -->
  <rect class="box" x="859" y="300" width="275" height="98"/><text class="t" x="996" y="360">Metrics Collector</text>
  <path class="line" d="M345 177L440 202M345 294L440 302M345 413L440 404M345 529L440 502"/>
  <!-- Each pushed source has its own destination head. -->
  <path class="flow" d="M670 265L857 312"/><path class="flow" d="M670 324L857 336"/>
  <path class="flow" d="M670 380L857 362"/><path class="flow" d="M670 437L857 386"/>
  <g class="t"><text x="550" y="248">Push metrics</text><text x="550" y="324">Push metrics</text><text x="550" y="400">Push metrics</text><text x="550" y="476">Push metrics</text></g>
</svg>
