<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1452" height="532" viewBox="0 0 1452 532"
     role="img" aria-labelledby="title desc">
  <title id="title">Chess game leaderboard table using a composite leaderboard name</title>
  <desc id="desc">A leaderboard record table has user_id as the primary key and stores score, email, profile picture URL, and leaderboard_name. Five example users and an ellipsis row are shown.</desc>

  <!-- Shared typography and the thin grid used by the source table. -->
  <defs>
    <style>
      .canvas{fill:#fff}
      text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:36px;font-weight:400}
      .header{font-size:34px;font-weight:700}
      .sans-cell{font-size:33px}
      .score-cell{font-family:"Times New Roman",Times,serif;font-size:34px}
      .email-cell{font-family:"Times New Roman",Times,serif;font-size:36px}
      .grid{fill:none;stroke:#111;stroke-width:1.5}
    </style>
  </defs>

  <rect class="canvas" width="1452" height="532"/>

  <!-- The first header groups the primary key separately from all attributes. -->
  <g id="table-grid">
    <rect class="grid" x="35.5" y="36.5" width="1383" height="467"/>
    <path class="grid" d="M295.5 36.5V503.5"/>
    <path class="grid" d="M413.5 94.5V503.5M665.5 94.5V503.5M1094.5 94.5V503.5"/>
    <path class="grid" d="M35.5 94.5H1418.5M35.5 152.5H1418.5M35.5 211.5H1418.5M35.5 269.5H1418.5M35.5 328.5H1418.5M35.5 387.5H1418.5M35.5 445.5H1418.5"/>
  </g>

  <!-- Group and column headers. -->
  <g id="table-headers">
    <text class="header" x="71" y="77">Primary key</text>
    <text class="header" x="857" y="77" text-anchor="middle">Attributes</text>

    <text class="header" x="51" y="135">user_id</text>
    <text class="header" x="309" y="135">score</text>
    <text class="header" x="428" y="135">email</text>
    <text class="header" x="680" y="135">profile_pic</text>
    <text class="header" x="1110" y="135">leaderboard_name</text>
  </g>

  <!-- Example leaderboard records. -->
  <g id="leaderboard-records">
    <g id="record-lovelove">
      <text class="sans-cell" x="51" y="193">lovelove</text>
      <text class="score-cell" x="309" y="193">309</text>
      <text class="email-cell" x="428" y="193">love@test.com</text>
      <text class="sans-cell" x="680" y="193">https://cdn.example/3.png</text>
      <text class="sans-cell" x="1110" y="193">chess#2020-02</text>
    </g>

    <g id="record-i-love-tofu">
      <text class="sans-cell" x="51" y="252">i_love_tofu</text>
      <text class="score-cell" x="309" y="252">209</text>
      <text class="email-cell" x="428" y="252" style="font-size:31px"
            textLength="209" lengthAdjust="spacingAndGlyphs"
            transform="translate(0 252) scale(1 1.1613) translate(0 -252)">test@test.com</text>
      <text class="sans-cell" x="680" y="252">https://cdn.example/p.png</text>
      <text class="sans-cell" x="1110" y="252">chess#2020-02</text>
    </g>

    <g id="record-golden-gate">
      <text class="sans-cell" x="51" y="310">golden_gate</text>
      <text class="score-cell" x="309" y="310">103</text>
      <text class="email-cell" x="428" y="310">gold@test.com</text>
      <text class="sans-cell" x="680" y="310">https://cdn.example/2.png</text>
      <text class="sans-cell" x="1110" y="310">chess#2020-03</text>
    </g>

    <g id="record-pizza-or-bread">
      <text class="sans-cell" x="51" y="369">pizza_or_bread</text>
      <text class="score-cell" x="309" y="369">203</text>
      <text class="email-cell" x="428" y="369">piz@test.com</text>
      <text class="sans-cell" x="681" y="369" style="font-size:28px"
            textLength="397" lengthAdjust="spacingAndGlyphs"
            transform="translate(0 369) scale(1 1.1786) translate(0 -369)">https://cdn.example/31.png</text>
      <text class="sans-cell" x="1110" y="369">chess#2021-05</text>
    </g>

    <g id="record-ocean">
      <text class="sans-cell" x="51" y="427">ocean</text>
      <text class="score-cell" x="309" y="427">10</text>
      <text class="email-cell" x="428" y="427">oce@test.com</text>
      <text class="sans-cell" x="681" y="427" style="font-size:28px"
            textLength="397" lengthAdjust="spacingAndGlyphs"
            transform="translate(0 427) scale(1 1.1786) translate(0 -427)">https://cdn.example/32.png</text>
      <text class="sans-cell" x="1110" y="427">chess#2020-02</text>
    </g>

    <g id="additional-records">
      <text class="sans-cell" x="51" y="486">...</text>
      <text class="score-cell" x="309" y="486">...</text>
      <text class="email-cell" x="428" y="486">...</text>
      <text class="sans-cell" x="680" y="486">...</text>
      <text class="sans-cell" x="1110" y="486">...</text>
    </g>
  </g>
</svg>
