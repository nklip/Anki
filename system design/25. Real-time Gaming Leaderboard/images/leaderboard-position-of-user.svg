<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1344" height="1112" viewBox="0 0 1344 1112"
     role="img" aria-labelledby="title desc">
  <title id="title">A user's position in the leaderboard</title>
  <desc id="desc">A leaderboard table lists rank, player, and points. The selected player Mallow007 is highlighted in green at rank 361 with 785 points.</desc>

  <!-- Shared table geometry and typography sampled from the PNG etalon. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400;font-size:40px;text-anchor:middle}
      .header{fill:#f7c5fd;stroke:#111;stroke-width:2.2}
      .row{fill:#fff;stroke:#111;stroke-width:2.2}
      .selected-row{fill:#ccfcc4;stroke:#111;stroke-width:2.2}
    </style>
  </defs>

  <rect width="1344" height="1112" fill="#fff"/>

  <!-- Column headings. -->
  <g id="leaderboard-header">
    <rect class="header" x="49.5" y="31.5" width="1249" height="88"/>
    <text x="143" y="89">Rank</text>
    <text x="644" y="89">Player</text>
    <text x="1195" y="89">Points</text>
  </g>

  <!-- Rows above the selected player. -->
  <g id="rows-above-player">
    <g id="rank-267">
      <rect class="row" x="49.5" y="139.5" width="1249" height="88" rx="35"/>
      <text x="143" y="197">267</text>
      <text x="644" y="197">Aquaboys</text>
      <text x="1195" y="197">876</text>
    </g>
    <g id="rank-258">
