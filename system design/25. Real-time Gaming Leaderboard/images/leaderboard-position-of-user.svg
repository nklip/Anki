      <text x="143" y="414">259</text>
      <text x="644" y="414">Berlin’s Angels</text>
      <text x="1195" y="414">832</text>
    </g>
    <g id="rank-360">
      <rect class="row" x="49.5" y="464.5" width="1249" height="88" rx="35"/>
      <text x="143" y="522">360</text>
      <text x="644" y="522">GrendelTeam</text>
      <text x="1195" y="522">799</text>
    </g>
  </g>

  <!-- The queried user's row is the only green selection. -->
  <g id="selected-player-rank-361">
    <rect class="selected-row" x="49.5" y="571.5" width="1249" height="88" rx="35"/>
    <text x="143" y="629">361</text>
    <text x="644" y="629">Mallow007</text>
    <text x="1195" y="629">785</text>
  </g>

