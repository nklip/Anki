  <title id="title">Skip-list indexes for leaderboard scores</title>
  <desc id="desc">A sorted base list is promoted into one-level and two-level skip-list indexes. Bold links show the lookup path to score 45, which is highlighted in pink in every base list.</desc>

  <!-- Shared boxes, panel boundaries, typography, and two connector weights. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .panel{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:10 7}
      .panel-label{font-size:31px}
      .node-box{fill:#fff;stroke:#111;stroke-width:1.8}
      .target-node{fill:#ffc0ff}
      .node-value{font-size:31px;text-anchor:middle}
      .index-link{fill:none;stroke:#111;stroke-width:1.25}
      .search-link{fill:none;stroke:#111;stroke-width:3.5}
      .stage-arrow{fill:none;stroke:#111;stroke-width:2}
    </style>
    <!-- All heads are 18×16. A 4.5-unit nose projection covers even the bold shaft. -->
    <marker id="connector-arrowhead" viewBox="0 0 18 16" refX="13.5" refY="8"
            markerWidth="18" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 8 L0 16 Z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1342" height="1182" fill="#fff"/>

