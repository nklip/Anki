      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .panel{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:10 7}
      .panel-label{font-size:31px}
      .node-box{fill:#fff;stroke:#111;stroke-width:1.8}
      .target-node{fill:#ffc0ff}
      .node-value{font-size:31px;text-anchor:middle}
      .index-link{fill:none;stroke:#111;stroke-width:1.25}
      .search-link{fill:none;stroke:#111;stroke-width:3.5}
      .stage-arrow{fill:#fff;stroke:#111;stroke-width:2;stroke-linejoin:round}
    </style>
    <marker id="index-arrowhead" viewBox="0 0 10 8" refX="10" refY="4"
            markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#111"/>
    </marker>
    <marker id="search-arrowhead" viewBox="0 0 12 10" refX="12" refY="5"
            markerWidth="24" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#111"/>
    </marker>
  </defs>

