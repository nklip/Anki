  <rect id="canvas" width="1344" height="286" fill="#fff"/>

  <!-- The originating application node. Two centred lines share the box centre x=206. -->
  <g id="leaderboard-service">
    <rect class="box" x="63" y="60" width="286" height="99"/>
    <text x="206" y="102"><tspan x="206">Leaderboard</tspan><tspan x="206" dy="38">service</tspan></text>
  </g>

  <!-- Left-to-right call chain. Each shaft stops one pixel inside its triangular head so the
       join is continuous; every head keeps a clear gap before the mark it points at. -->
  <g id="pipeline-connectors">
    <path id="service-to-gateway-shaft" class="shaft" data-connector="true" d="M350 109H532"/>
    <polygon id="service-to-gateway-arrowhead" class="arrow-head" points="550,109 531,100.5 531,117.5"/>
    <path id="gateway-to-lambda-shaft" class="shaft" data-connector="true" d="M678 109H846"/>
    <polygon id="gateway-to-lambda-arrowhead" class="arrow-head" points="864,109 845,100.5 845,117.5"/>
    <path id="lambda-to-dynamodb-shaft" class="shaft" data-connector="true" d="M966 109H1134"/>
    <polygon id="lambda-to-dynamodb-arrowhead" class="arrow-head" points="1152,109 1133,100.5 1133,117.5"/>
  </g>

  <!-- AWS icons use the local source artwork, embedded above to keep this diagram self-contained. -->
  <g id="aws-api-gateway">
    <use href="#icon-api-gateway" x="569.3" y="54.684" width="90" height="108.633"/>
    <text x="614.3" y="204"><tspan x="614.3">AWS</tspan><tspan x="614.3" dy="38">API Gateway</tspan></text>
  </g>

  <!-- Lambda retains the source icon's aspect ratio within its existing slot. -->
  <g id="aws-lambda">
    <use href="#icon-lambda" x="866.5" y="59" width="100" height="100"/>
    <text x="916.5" y="204"><tspan x="916.5">AWS</tspan><tspan x="916.5" dy="38">Lambda</tspan></text>
  </g>

  <!-- DynamoDB preserves the horizontal padding in its source viewBox. -->
  <g id="aws-dynamodb">
    <use href="#icon-dynamo-db" x="1168" y="55.5" width="111" height="111"/>
    <text x="1223.5" y="206"><tspan x="1223.5">AWS</tspan><tspan x="1223.5" dy="38">DynamoDB</tspan></text>
  </g>
