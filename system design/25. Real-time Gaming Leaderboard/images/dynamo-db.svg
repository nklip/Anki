  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400;font-size:32px;text-anchor:middle}
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .shaft{fill:none;stroke:#111;stroke-width:2.2}
      .arrow-head{fill:#111}
    </style>

