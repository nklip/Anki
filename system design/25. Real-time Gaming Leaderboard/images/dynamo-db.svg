<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1344" height="286" viewBox="0 0 1344 286"
     role="img" aria-labelledby="title desc">
  <title id="title">Leaderboard service backed by DynamoDB</title>
  <desc id="desc">Left to right: a Leaderboard service box, an arrow into the AWS API Gateway mark, an arrow into the AWS Lambda mark, and an arrow into the AWS DynamoDB mark. The leaderboard service calls API Gateway, API Gateway invokes a Lambda function, and the Lambda function reads and writes the leaderboard data in DynamoDB.</desc>

  <!-- Shared typography and connector styling. The AWS marks below carry their own fills. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400;font-size:32px;text-anchor:middle}
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .shaft{fill:none;stroke:#111;stroke-width:2.2}
      .arrow-head{fill:#111}
    </style>
  </defs>

  <rect id="canvas" width="1344" height="286" fill="#fff"/>

  <!-- The originating application node. Two centred lines share the box centre x=206. -->
  <g id="leaderboard-service">
    <rect class="box" x="63" y="60" width="286" height="99"/>
    <text x="206" y="102"><tspan x="206">Leaderboard</tspan><tspan x="206" dy="38">service</tspan></text>
  </g>

  <!-- Left-to-right call chain. Each shaft stops one pixel inside its triangular head so the
       join is continuous; every head keeps a clear gap before the mark it points at. -->
  <g id="pipeline-connectors">
    <path id="service-to-gateway-shaft" class="shaft" data-connector="true" d="M350 109H532"/>
    <polygon id="service-to-gateway-arrowhead" class="arrow-head" points="550,109 531,100.5 531,117.5"/>
    <path id="gateway-to-lambda-shaft" class="shaft" data-connector="true" d="M678 109H846"/>
    <polygon id="gateway-to-lambda-arrowhead" class="arrow-head" points="864,109 845,100.5 845,117.5"/>
    <path id="lambda-to-dynamodb-shaft" class="shaft" data-connector="true" d="M966 109H1134"/>
    <polygon id="lambda-to-dynamodb-arrowhead" class="arrow-head" points="1152,109 1133,100.5 1133,117.5"/>
  </g>

  <!-- AWS marks are traced as flat colour regions: one silhouette path per icon carries the
       shaded faces, and the lighter faces are painted over it. Edit a face by editing its path. -->
  <g id="aws-api-gateway">
