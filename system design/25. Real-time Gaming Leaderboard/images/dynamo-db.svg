<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1344" height="286" viewBox="0 0 1344 286"
     role="img" aria-labelledby="title desc">
  <title id="title">Leaderboard service backed by DynamoDB</title>
  <desc id="desc">Left to right: a Leaderboard service box, an arrow into the AWS API Gateway mark, an arrow into the AWS Lambda mark, and an arrow into the AWS DynamoDB mark. The leaderboard service calls API Gateway, API Gateway invokes a Lambda function, and the Lambda function reads and writes the leaderboard data in DynamoDB.</desc>

