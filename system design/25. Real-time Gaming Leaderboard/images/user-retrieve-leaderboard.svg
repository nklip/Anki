<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1964" height="506" viewBox="0 0 1964 506"
     role="img" aria-labelledby="title desc">
  <title id="title">Retrieve leaderboard and user details</title>
  <desc id="desc">A leaderboard service requests leaderboard data through AWS API Gateway and AWS Lambda. Lambda calls Redis ZREVRANGE for the leaderboard and fetches user details from a MySQL point table.</desc>

  <!-- Shared diagram styles and the exact local brand vectors reused from sibling SVGs. -->
  <defs>
