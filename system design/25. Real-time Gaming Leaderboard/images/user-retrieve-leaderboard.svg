      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .outline{fill:#fff;stroke:#111;stroke-width:2.2}
      .shaft{fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:butt}
      .arrow-head{fill:#111}
      .node-label{font-size:34px;text-anchor:middle}
      .flow-label{font-size:34px;text-anchor:middle}
      .aws-label{font-size:34px;text-anchor:middle}
      .branch-label{font-size:34px}
      .store-label{font-size:34px}
    </style>

