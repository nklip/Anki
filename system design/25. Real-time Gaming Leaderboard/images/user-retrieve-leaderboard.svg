  <rect width="1964" height="506" fill="#fff"/>

  <!-- Entry service and the request label set into the horizontal connector gap. -->
  <g id="leaderboard-service">
    <rect class="outline" x="41" y="211" width="298" height="99"/>
    <text class="node-label" x="190" y="253"><tspan x="190">Leaderboard</tspan><tspan x="190" dy="38">service</tspan></text>
  </g>

  <g id="service-to-api-flow">
    <path id="service-return-shaft" class="shaft" data-connector="true" d="M418 260H361"/>
    <polygon id="service-return-arrowhead" class="arrow-head" points="339,260 361,250 361,270"/>
    <text class="flow-label" x="520" y="254"><tspan x="520">Get</tspan><tspan x="520" dy="38">leaderboard</tspan></text>
    <path id="service-request-shaft" class="shaft" data-connector="true" d="M622 260H671"/>
    <polygon id="service-request-arrowhead" class="arrow-head" points="694,260 671,250 671,270"/>
  </g>

  <!-- Reused AWS API Gateway mark. -->
  <g id="api-gateway-node">
    <use href="#aws-api-gateway" x="712" y="208" width="96" height="108"/>
    <text class="aws-label" x="760" y="356"><tspan x="760">AWS</tspan><tspan x="760" dy="38">API Gateway</tspan></text>
  </g>

  <!-- Bidirectional invocation/response link between API Gateway and Lambda. -->
  <g id="api-lambda-flow">
    <path id="api-lambda-shaft" class="shaft" data-connector="true" d="M848 260H999"/>
    <polygon id="lambda-to-api-arrowhead" class="arrow-head" points="826,260 848,250 848,270"/>
    <polygon id="api-to-lambda-arrowhead" class="arrow-head" points="1021,260 999,250 999,270"/>
  </g>

  <!-- Reused AWS Lambda mark. -->
  <g id="lambda-node">
    <use href="#aws-lambda" x="1025" y="210" width="98" height="100"/>
    <text class="aws-label" x="1074" y="356"><tspan x="1074">AWS</tspan><tspan x="1074" dy="38">Lambda</tspan></text>
  </g>

  <!-- Lambda callouts: leader segments stop before text, and arrowheads stay clear of logos. -->
  <g id="redis-query-flow">
    <path id="redis-callout-leading-shaft" class="shaft" data-connector="true" d="M1123 244L1251 202"/>
    <text class="branch-label" x="1160" y="185">① Call ZREVRANGE</text>
    <path id="redis-callout-trailing-shaft" class="shaft" data-connector="true" d="M1425 145L1500 121"/>
    <polygon id="redis-query-arrowhead" class="arrow-head" points="1522,112 1504,130 1496,112"/>
  </g>

  <g id="mysql-query-flow">
    <path id="mysql-callout-leading-shaft" class="shaft" data-connector="true" d="M1123 274L1207 298"/>
    <text class="branch-label" x="1218" y="319"><tspan x="1218">② Fetch</tspan><tspan x="1218" dy="38">user details</tspan></text>
    <path id="mysql-callout-trailing-shaft" class="shaft" data-connector="true" d="M1430 356L1500 379"/>
    <polygon id="mysql-query-arrowhead" class="arrow-head" points="1522,386 1497,389 1503,369"/>
  </g>

  <!-- Data stores reuse the local Redis/MySQL marks from manage-services-ourselves.svg. -->
  <g id="data-stores">
