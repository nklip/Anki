<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="884" height="580" viewBox="0 0 884 580"
     role="img" aria-labelledby="title desc">
  <title id="title">Leaderboard table schema</title>
  <desc id="desc">A database table named leaderboard contains a user_id varchar field and a score integer field.</desc>

  <!-- Typography and border treatment follow the PNG etalon. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000}
      .table-border{fill:#fff;stroke:#111;stroke-width:3}
      .table-heading{font-size:81px;font-weight:700;text-anchor:middle}
      .field{font-size:81px;font-weight:400;text-anchor:start}
    </style>
  </defs>

  <rect width="884" height="580" fill="#fff"/>

  <!-- Table frame and heading divider. -->
  <g id="table-frame">
    <rect class="table-border" x="41.5" y="39.5" width="805" height="507"/>
    <line x1="42" y1="204.5" x2="846" y2="204.5" stroke="#111" stroke-width="3"/>
  </g>

  <!-- Schema title and two field/type rows. -->
  <g id="schema-labels">
    <text class="table-heading" x="443" y="142">leaderboard</text>
    <text class="field" x="74" y="340">user_id</text>
    <text class="field" x="533" y="340">varchar</text>
    <text class="field" x="73" y="474">score</text>
    <text class="field" x="533" y="474">int</text>
  </g>
</svg>
