<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1390" height="560" viewBox="0 0 1390 560"
     role="img" aria-labelledby="title desc">
  <title id="title">Top four leaderboard</title>
  <desc id="desc">A leaderboard ranks Aquaboys first with 976 points, B team second with 956, Berlin’s Angels third with 890, and GrendelTeam fourth with 878. Stars visually distinguish the four ranks.</desc>

  <!-- Shared row, type, and rank-star definitions sampled from the PNG etalon. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-size:40px;font-weight:400;text-anchor:middle}
      .header{fill:#ffc0ff;stroke:#111;stroke-width:2}
      .row{fill:#fff;stroke:#111;stroke-width:2}
      .rank-star{stroke:#111;stroke-width:2.5;stroke-linejoin:round}
    </style>
    <symbol id="rank-star" viewBox="0 0 66 66">
      <path d="M33 2 L40.5 25 H65 L45 39.5 L52.5 63 L33 48.5 L13.5 63 L21 39.5 L1 25 H25.5 Z"/>
    </symbol>
  </defs>

  <rect width="1390" height="560" fill="#fff"/>

  <!-- Leaderboard column headings. -->
  <g id="leaderboard-header">
    <rect class="header" x="75" y="36" width="1246" height="84"/>
    <text x="207" y="92">Rank</text>
    <text x="695" y="92">Player</text>
    <text x="1221" y="92">Points</text>
  </g>

  <!-- Ranked rows and progressively lighter rank stars. -->
  <g id="leaderboard-rows">
    <g id="rank-1">
      <rect class="row" x="74.5" y="141.5" width="1247" height="83" rx="35"/>
      <use class="rank-star" href="#rank-star" x="99" y="149" width="66" height="66" fill="#ff0000"/>
      <text x="207" y="197">1</text>
      <text x="695" y="197">Aquaboys</text>
      <text x="1221" y="197">976</text>
    </g>
    <g id="rank-2">
      <rect class="row" x="74.5" y="246.5" width="1247" height="83" rx="35"/>
      <use class="rank-star" href="#rank-star" x="99" y="254" width="66" height="66" fill="#ff8181"/>
      <text x="207" y="302">2</text>
      <text x="695" y="302">B team</text>
      <text x="1221" y="302">956</text>
    </g>
    <g id="rank-3">
      <rect class="row" x="74.5" y="351.5" width="1247" height="83" rx="35"/>
      <use class="rank-star" href="#rank-star" x="99" y="359" width="66" height="66" fill="#ffc0c0"/>
      <text x="207" y="407">3</text>
      <text x="695" y="407">Berlin’s Angels</text>
      <text x="1221" y="407">890</text>
    </g>
    <g id="rank-4">
      <rect class="row" x="74.5" y="455.5" width="1247" height="83" rx="35"/>
      <use class="rank-star" href="#rank-star" x="99" y="463" width="66" height="66" fill="#fff"/>
      <text x="207" y="512">4</text>
      <text x="695" y="512">GrendelTeam</text>
      <text x="1221" y="512">878</text>
    </g>
  </g>
</svg>
