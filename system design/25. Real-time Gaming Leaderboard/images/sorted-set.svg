<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1352" height="760" viewBox="0 0 1352 760"
     role="img" aria-labelledby="title desc">
  <title id="title">Sorted set for the February 2021 leaderboard</title>
  <desc id="desc">The key leaderboard_feb_2021 points to a sorted set whose members are ordered by descending score, from user10 with 99 points to user309 with 72 points.</desc>

  <!-- Shared typography and thin black diagram strokes follow the PNG etalon. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000}
      .outline{fill:#fff;stroke:#111;stroke-width:1.8}
      .key-label{font-size:35.5px;font-weight:700}
      .heading{font-size:36px;font-weight:700}
      .cell-label{font-size:36px;font-weight:400}
      .score-value{font-family:"Times New Roman",Times,serif;font-size:36px;font-weight:400}
      .table-rule{fill:none;stroke:#111;stroke-width:1.8}
    </style>
  </defs>

  <rect width="1352" height="760" fill="#fff"/>

  <!-- The leaderboard key and its short right-pointing connector. -->
  <g id="leaderboard-key">
    <rect class="outline" x="76.8" y="352" width="411" height="73"/>
    <text class="key-label" x="94" y="397.5">leaderboard_feb_2021</text>
  </g>
  <g id="key-to-sorted-set-arrow">
    <!-- The shaft stops at the triangular head so no line protrudes through its tip. -->
    <rect id="key-arrow-shaft" data-connector="true"
          x="488" y="387.6" width="228.5" height="1.8" fill="#111"/>
    <path id="key-arrowhead" d="M730.5 388.5 L716.5 381.8 L716.5 395.2 Z" fill="#111"/>
  </g>

  <!-- A brace groups the ten ordered score/member records as one sorted set. -->
  <path id="sorted-set-brace"
        d="M812 55
           C792 63 782.5 81 782.5 113
           V326
           C782.5 360 770 377 753 388.5
           C770 400 782.5 417 782.5 451
           V663
           C782.5 695 792 713 812 721"
        fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="butt"/>

  <!-- Score and member columns retain the descending order shown in the etalon. -->
  <g id="sorted-set-table">
    <rect class="table-rule" x="835" y="56.5" width="426" height="664"/>
    <path class="table-rule" d="M1026 56.5 V720.5"/>
    <path class="table-rule"
          d="M835 117.5 H1261 M835 177.5 H1261 M835 238 H1261
             M835 298 H1261 M835 358.5 H1261 M835 418.5 H1261
             M835 478.5 H1261 M835 539 H1261 M835 599.5 H1261
             M835 659.5 H1261"/>

    <g id="table-headings">
      <text class="heading" x="859" y="100">score</text>
      <text class="heading" x="1049" y="100">member</text>
    </g>

    <g id="score-values">
      <text class="score-value" x="859" y="160">99</text>
      <text class="score-value" x="859" y="220">97</text>
      <text class="score-value" x="859" y="281">94</text>
      <text class="score-value" x="859" y="341">92</text>
      <text class="score-value" x="859" y="401">90</text>
      <text class="score-value" x="859" y="461">86</text>
      <text class="score-value" x="859" y="521">83</text>
      <text class="score-value" x="859" y="582">82</text>
      <text class="score-value" x="859" y="642">79</text>
      <text class="score-value" x="859" y="702">72</text>
    </g>

    <g id="member-values">
      <text class="cell-label" x="1049" y="160">user10</text>
      <text class="cell-label" x="1049" y="220">user20</text>
      <text class="cell-label" x="1049" y="281">user105</text>
      <text class="cell-label" x="1049" y="341">user45</text>
      <text class="cell-label" x="1049" y="401">user7</text>
      <text class="cell-label" x="1049" y="461">user101</text>
      <text class="cell-label" x="1049" y="521">user9</text>
      <text class="cell-label" x="1049" y="582">user302</text>
      <text class="cell-label" x="1049" y="642">user200</text>
      <text class="cell-label" x="1049" y="702">user309</text>
    </g>
  </g>
</svg>
