<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1956" height="322" viewBox="0 0 1956 322"
     role="img" aria-labelledby="title desc">
  <title id="title">Skip-list search performance</title>
  <desc id="desc">A six-level skip list contains increasingly sparse express lanes above a dense base list. The search path moves right across each useful level, drops down, and finishes at a red target node near the end of the base list.</desc>

  <!-- Reusable node and the thin search-path treatment sampled from the PNG etalon. -->
  <defs>
    <style>
      .node{color:#111}
      .selected-node{color:#f00}
      .search-shaft{fill:none;stroke:#111;stroke-width:1.1}
      .search-head{fill:#111}
    </style>
    <symbol id="skip-node" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5.4" fill="currentColor"/>
      <circle cx="6" cy="6" r="4.1" fill="#fff"/>
    </symbol>
    <symbol id="selected-skip-node" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5.4" fill="#111"/>
      <circle cx="6" cy="6" r="4.1" fill="#f00"/>
    </symbol>
  </defs>

  <rect width="1956" height="322" fill="#fff"/>

  <!-- Shafts overlap their head bases by 0.5 units to avoid antialiased gaps. -->
  <g id="skip-list-search-route">
    <path id="top-search-shaft" class="search-shaft" data-connector="true" d="M52.5 44 H979.38"/>
    <path id="drop-to-level-4-shaft" class="search-shaft" data-connector="true" d="M993 49.5 V78.5"/>
    <path id="level-4-search-shaft" class="search-shaft" data-connector="true" d="M998.5 92 H1452.27"/>
    <path id="drop-to-level-3-shaft" class="search-shaft" data-connector="true" d="M1465.95 97.5 V126.5"/>
    <path id="level-3-search-shaft" class="search-shaft" data-connector="true" d="M1471.45 140 H1688.71"/>
    <path id="drop-to-level-2-shaft" class="search-shaft" data-connector="true" d="M1702.78 145.5 V174.5"/>
    <path id="level-2-search-shaft" class="search-shaft" data-connector="true" d="M1708.28 188 H1806.93"/>
    <path id="drop-to-level-1-shaft" class="search-shaft" data-connector="true" d="M1821.02 193.5 V222.5"/>
    <path id="drop-to-base-shaft" class="search-shaft" data-connector="true" d="M1821.02 241.5 V269.5"/>
    <path id="base-search-shaft" class="search-shaft" data-connector="true" d="M1826.52 283 H1836.49"/>

    <!-- All heads are symmetric 8.5×9 triangles; their tips stay outside the circles. -->
    <g id="search-arrowheads" class="search-head">
      <path id="top-search-head" d="M987.38 44 L978.88 39.5 L978.88 48.5 Z"/>
      <path id="drop-to-level-4-head" d="M993 86.5 L988.5 78 L997.5 78 Z"/>
      <path id="level-4-search-head" d="M1460.27 92 L1451.77 87.5 L1451.77 96.5 Z"/>
      <path id="drop-to-level-3-head" d="M1465.95 134.5 L1461.45 126 L1470.45 126 Z"/>
      <path id="level-3-search-head" d="M1696.71 140 L1688.21 135.5 L1688.21 144.5 Z"/>
      <path id="drop-to-level-2-head" d="M1702.78 182.5 L1698.28 174 L1707.28 174 Z"/>
      <path id="level-2-search-head" d="M1814.93 188 L1806.43 183.5 L1806.43 192.5 Z"/>
      <path id="drop-to-level-1-head" d="M1821.02 230.5 L1816.52 222 L1825.52 222 Z"/>
      <path id="drop-to-base-head" d="M1821.02 277.5 L1816.52 269 L1825.52 269 Z"/>
      <path id="base-search-head" d="M1844.49 283 L1835.99 278.5 L1835.99 287.5 Z"/>
    </g>
  </g>

