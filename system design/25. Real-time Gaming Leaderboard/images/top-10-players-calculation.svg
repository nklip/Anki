<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1460" height="1388" viewBox="0 0 1460 1388"
     role="img" aria-labelledby="title desc">
  <title id="title">Calculating the global top ten players</title>
  <desc id="desc">Three shards each return their local top ten scores. Scatter-gather merges those results into one global top-ten score and member table.</desc>

  <!-- Typography and table rules reproduce the PNG's mixed sans-serif and serif text. -->
  <defs>
    <style>
      text{fill:#000}
      .sans{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
      .serif{font-family:"Times New Roman",Times,serif}
      .table-rule{fill:#fff;stroke:#111;stroke-width:1.8}
      .title-label{font-size:32px;font-weight:700;text-anchor:middle}
      .heading-label{font-size:31.5px;font-weight:700}
      .score-label{font-size:33px;font-weight:400}
      .member-label{font-size:32px;font-weight:400}
      .flow-label{font-size:32px;font-weight:400}
    </style>
  </defs>

  <rect width="1460" height="1388" fill="#fff"/>

  <!-- Shard 0 contributes its locally highest scores. -->
  <g id="shard-0-table">
    <rect class="table-rule" x="127" y="26.5" width="398" height="372"/>
    <path class="table-rule" d="M306 79.5 V398.5"/>
    <path class="table-rule"
          d="M127 79.5 H525 M127 132.5 H525 M127 185.5 H525
             M127 238.5 H525 M127 291.5 H525 M127 345.5 H525"/>

    <text class="sans title-label" x="326" y="63.8"
          transform="translate(326 0) scale(1.036 1) translate(-326 0)">shard 0 (top 10)</text>
    <text class="sans heading-label" x="150" y="117"
          transform="translate(150 0) scale(1.035 1) translate(-150 0)">score</text>
    <text class="sans heading-label" x="328" y="117"
          transform="translate(328 0) scale(1.035 1) translate(-328 0)">member</text>

    <g id="shard-0-scores" class="serif score-label">
      <text x="151" y="171">99</text>
      <text x="151" y="224">90</text>
      <text x="151" y="277">86</text>
      <text x="151" y="330">70</text>
    </g>
    <g id="shard-0-members" class="sans member-label"
       transform="translate(328 0) scale(1.04 1) translate(-328 0)">
      <text x="328" y="171">user10</text>
      <text x="328" y="224">user7</text>
      <text x="328" y="277">user101</text>
      <text x="328" y="330">user109</text>
    </g>
    <text class="sans member-label" x="151" y="382"
          transform="translate(151 0) scale(1.19 1) translate(-151 0)">...</text>
    <text class="sans member-label" x="329" y="382"
          transform="translate(329 0) scale(1.19 1) translate(-329 0)">...</text>
  </g>

  <!-- Shard 1 contributes another local top-ten slice. -->
  <g id="shard-1-table">
    <rect class="table-rule" x="127" y="499" width="398" height="372"/>
    <path class="table-rule" d="M306 552 V871"/>
    <path class="table-rule"
          d="M127 552 H525 M127 605 H525 M127 658 H525
             M127 711.5 H525 M127 764.5 H525 M127 817.5 H525"/>

    <text class="sans title-label" x="326" y="536.8"
          transform="translate(326 0) scale(1.036 1) translate(-326 0)">shard 1 (top 10)</text>
    <text class="sans heading-label" x="150" y="590"
          transform="translate(150 0) scale(1.035 1) translate(-150 0)">score</text>
    <text class="sans heading-label" x="328" y="590"
          transform="translate(328 0) scale(1.035 1) translate(-328 0)">member</text>

    <g id="shard-1-scores" class="serif score-label">
      <text x="151" y="644">97</text>
      <text x="151" y="697">83</text>
      <text x="151" y="750">79</text>
      <text x="151" y="803">72</text>
    </g>
    <g id="shard-1-members" class="sans member-label"
       transform="translate(328 0) scale(1.04 1) translate(-328 0)">
      <text x="328" y="644">user20</text>
      <text x="328" y="697">user9</text>
      <text x="328" y="750">user200</text>
      <text x="328" y="803">user309</text>
    </g>
    <text class="sans member-label" x="151" y="855"
          transform="translate(151 0) scale(1.19 1) translate(-151 0)">...</text>
    <text class="sans member-label" x="329" y="855"
          transform="translate(329 0) scale(1.19 1) translate(-329 0)">...</text>
  </g>

  <!-- Shard 2 supplies the remaining locally high scores. -->
  <g id="shard-2-table">
    <rect class="table-rule" x="127" y="971" width="398" height="372"/>
    <path class="table-rule" d="M306 1024 V1343"/>
    <path class="table-rule"
          d="M127 1024 H525 M127 1077.5 H525 M127 1130.5 H525
             M127 1183.5 H525 M127 1236.5 H525 M127 1289.5 H525"/>

    <text class="sans title-label" x="326" y="1008.8"
          transform="translate(326 0) scale(1.036 1) translate(-326 0)">shard 2 (top 10)</text>
    <text class="sans heading-label" x="150" y="1062"
          transform="translate(150 0) scale(1.035 1) translate(-150 0)">score</text>
    <text class="sans heading-label" x="328" y="1062"
          transform="translate(328 0) scale(1.035 1) translate(-328 0)">member</text>

    <g id="shard-2-scores" class="serif score-label">
      <text x="151" y="1116">94</text>
      <text x="151" y="1169">92</text>
      <text x="151" y="1222">82</text>
      <text x="151" y="1275">71</text>
    </g>
    <g id="shard-2-members" class="sans member-label"
       transform="translate(328 0) scale(1.04 1) translate(-328 0)">
      <text x="328" y="1116">user105</text>
      <text x="328" y="1169">user45</text>
      <text x="328" y="1222">user302</text>
      <text x="328" y="1275">user5</text>
    </g>
    <text class="sans member-label" x="151" y="1327"
          transform="translate(151 0) scale(1.19 1) translate(-151 0)">...</text>
    <text class="sans member-label" x="329" y="1327"
          transform="translate(329 0) scale(1.19 1) translate(-329 0)">...</text>
  </g>

  <!-- Three scatter-gather routes converge just before the merged table boundary. -->
  <g id="scatter-gather-routes" fill="none" stroke="#111" stroke-width="1.8">
    <path id="shard-0-flow-shaft" data-connector="true" d="M525 348 L933 626"/>
    <path id="shard-1-flow-shaft" data-connector="true" d="M525 685 H933"/>
    <path id="shard-2-flow-shaft" data-connector="true" d="M525 1024 L933 745"/>
  </g>
  <g id="scatter-gather-arrowheads" fill="#111">
    <!-- Each head is separated from the result table by the same small white gap as the PNG. -->
    <path id="shard-0-flow-head" d="M944 633 L933 630.5 L937 622.5 Z"/>
    <path id="shard-1-flow-head" d="M944 685 L934 679 L934 691 Z"/>
    <path id="shard-2-flow-head" d="M944 738 L937 749.5 L933 741 Z"/>
  </g>
  <text class="sans flow-label" x="633" y="665.5"
        transform="translate(633 0) scale(1.03 1) translate(-633 0)">scatter-gather</text>

  <!-- The merged table contains the global top ten in descending score order. -->
  <g id="global-top-10-table">
    <rect class="table-rule" x="954" y="366.5" width="398" height="637.5"/>
    <path class="table-rule" d="M1132 419.5 V1004"/>
    <path class="table-rule"
          d="M954 419.5 H1352 M954 472.5 H1352 M954 525.5 H1352
             M954 578.5 H1352 M954 631.5 H1352 M954 684.5 H1352
             M954 737.5 H1352 M954 790.5 H1352 M954 844 H1352
             M954 897.5 H1352 M954 950.5 H1352"/>

    <text class="sans title-label" x="1153" y="402.8"
          transform="translate(1153 0) scale(1.036 1) translate(-1153 0)">top 10</text>
    <text class="sans heading-label" x="977" y="457"
          transform="translate(977 0) scale(1.035 1) translate(-977 0)">score</text>
    <text class="sans heading-label" x="1155" y="457"
          transform="translate(1155 0) scale(1.035 1) translate(-1155 0)">member</text>

    <g id="global-scores" class="serif score-label">
      <text x="977" y="511">99</text>
      <text x="977" y="564">97</text>
      <text x="977" y="617">94</text>
      <text x="977" y="670">92</text>
      <text x="977" y="723">90</text>
      <text x="977" y="776">86</text>
      <text x="977" y="829">83</text>
      <text x="977" y="882">82</text>
      <text x="977" y="935">79</text>
      <text x="977" y="988">72</text>
    </g>
    <g id="global-members" class="sans member-label"
       transform="translate(1155 0) scale(1.04 1) translate(-1155 0)">
      <text x="1155" y="511">user10</text>
      <text x="1155" y="564">user20</text>
      <text x="1155" y="617">user105</text>
      <text x="1155" y="670">user45</text>
      <text x="1155" y="723">user7</text>
      <text x="1155" y="776">user101</text>
      <text x="1155" y="829">user9</text>
      <text x="1155" y="882">user302</text>
      <text x="1155" y="935">user200</text>
      <text x="1155" y="988">user309</text>
    </g>
  </g>
</svg>
