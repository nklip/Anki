<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1836" height="770" viewBox="0 0 1836 770"
     role="img" aria-labelledby="title desc">
  <title id="title">Self-managed leaderboard services</title>
  <desc id="desc">A user reaches web servers through a load balancer. The web servers keep the leaderboard sorted set and the top-ten user-profile cache in Redis, while user profiles and points are stored in MySQL.</desc>

  <!-- Shared diagram styling plus source-native Redis and MySQL vector marks. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .outline{fill:#fff;stroke:#111;stroke-width:2.2}
      .shaft{fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:butt}
      .arrow-head{fill:#111}
      .node-label{font-size:38px;text-anchor:middle}
      .caption{font-size:36px;text-anchor:middle}
      .branch-label{font-size:38px;text-anchor:middle}
    </style>

