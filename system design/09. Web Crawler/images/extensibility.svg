<svg xmlns="http://www.w3.org/2000/svg" width="1666" height="1082" viewBox="0 0 1666 1082" role="img" aria-labelledby="title desc">
  <title id="title">Extensible web crawler architecture</title>
  <desc id="desc">After content is downloaded, parsed, and deduplicated, extension handlers can download PNG files, extract links, or monitor web content. Extracted links continue through URL filtering and deduplication before unseen URLs return to the frontier.</desc>

  <!-- Match the PNG's monochrome process flow and gray extension-module panel. -->
  <defs>
    <marker id="arrow-black" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="13" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L14 7 L0 14 Z" fill="#111"/>
    </marker>
    <style>
      .node { fill: #fff; stroke: #111; stroke-width: 2; }
      .storage { fill: #fff; stroke: #111; stroke-width: 3; }
      .module { fill: #c7c7c7; stroke: #111; stroke-width: 2; }
      .flow { fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-black); }
      .two-way { fill: none; stroke: #111; stroke-width: 2.2; marker-start: url(#arrow-black); marker-end: url(#arrow-black); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 23px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .storage-label { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #111; text-anchor: middle; }
      .module-title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #111; }
    </style>
  </defs>

  <rect width="1666" height="1082" fill="#fff"/>

  <!-- Core crawler stages align to the source image's upper horizontal row. -->
  <g id="core-pipeline">
    <rect class="node" x="10" y="225" width="220" height="90" rx="14"/>
    <text class="label" x="120" y="270">seed URLs</text>
    <path class="flow" d="M230 270 H284"/>

    <rect class="node" x="284" y="225" width="220" height="90" rx="14"/>
    <text class="label" x="394" y="270">URL Frontier</text>
    <path class="flow" d="M504 270 H558"/>

    <rect class="node" x="558" y="225" width="220" height="90" rx="14"/>
    <text class="label" x="668" y="270">HTML Downloader</text>
    <path class="flow" d="M778 270 H850"/>

    <rect class="node" x="850" y="225" width="220" height="90" rx="14"/>
    <text class="label" x="960" y="270">Content Parser</text>
    <path class="flow" d="M1070 270 H1142"/>

    <rect class="node" x="1142" y="223" width="202" height="92" rx="14"/>
    <text class="label" x="1243" y="269">Content Seen?</text>
  </g>

  <!-- DNS resolution and content storage remain above their dependent stages. -->
  <g id="support-services">
    <rect class="node" x="558" y="27" width="220" height="98" rx="14"/>
    <text class="label" x="668" y="76">DNS Resolver</text>
    <path class="flow" d="M668 225 V125"/>

    <rect class="storage" x="1188" y="39" width="110" height="73"/>
    <ellipse class="storage" cx="1243" cy="39" rx="55" ry="17"/>
    <path class="storage" d="M1188 112 A55 17 0 0 0 1298 112"/>
    <text class="storage-label" x="1243" y="78">Content</text>
    <text class="storage-label" x="1243" y="102">Storage</text>
    <path class="two-way" d="M1243 129 V223"/>
  </g>

  <!-- Extension module panel and the three handlers shown in the PNG. -->
  <rect class="module" x="850" y="351" width="776" height="228" rx="30"/>
  <text class="module-title" x="1370" y="552">Extension Module</text>

  <g id="extension-handlers">
    <path class="flow" d="M1243 315 L996 396"/>
    <path class="flow" d="M1243 315 V396"/>
    <path class="flow" d="M1243 315 L1487 396"/>

    <rect class="node" x="896" y="396" width="201" height="91" rx="14"/>
    <text class="label" x="996.5" y="431">PNG</text>
    <text class="label" x="996.5" y="457">Downloader</text>

    <rect class="node" x="1142" y="396" width="202" height="91" rx="14"/>
    <text class="label" x="1243" y="441.5">Link Extractor</text>

    <rect class="node" x="1387" y="396" width="200" height="91" rx="14"/>
    <text class="label" x="1487" y="441.5">Web Monitor</text>
  </g>

  <!-- The link-extractor branch continues downward exactly as in the source. -->
  <g id="url-processing">
    <path class="flow" d="M1243 487 V615"/>
    <rect class="node" x="1133" y="615" width="220" height="92" rx="14"/>
    <text class="label" x="1243" y="661">URL Filter</text>

    <path class="flow" d="M1243 707 V780"/>
    <rect class="node" x="1138" y="780" width="212" height="91" rx="14"/>
    <text class="label" x="1244" y="825.5">URL Seen?</text>
  </g>

  <!-- URL storage and the feedback loop retain the original monochrome routing. -->
  <g id="url-storage">
    <path class="two-way" d="M1244 871 V962"/>
    <rect class="storage" x="1189" y="979" width="110" height="73"/>
    <ellipse class="storage" cx="1244" cy="979" rx="55" ry="17"/>
    <path class="storage" d="M1189 1052 A55 17 0 0 0 1299 1052"/>
    <text class="storage-label" x="1244" y="1018">URL</text>
    <text class="storage-label" x="1244" y="1042">Storage</text>
  </g>

  <path id="frontier-feedback" class="flow" d="M1138 825.5 H394 V315"/>
</svg>
