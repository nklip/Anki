<svg xmlns="http://www.w3.org/2000/svg" width="930" height="926" viewBox="0 0 930 926" role="img" aria-labelledby="title desc">
  <title id="title">Data center outage: all traffic routed to US-East</title>
  <desc id="desc">Web and mobile clients access DNS, a CDN, and a load balancer. US-West is unavailable, marked by a red cross and faded regional components. The load balancer routes 100% of traffic to US-East. Each region contains web servers, databases, and caches, and both regions connect to shared NoSQL storage.</desc>
  <!-- Source-native infrastructure symbols match the neighboring chapter diagrams. -->
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif}</style>

<symbol id="laptop" viewBox="0 0 100 70">
      <path d="M8 54V10Q8 3 15 3H85Q92 3 92 10V54" fill="none" stroke="#111" stroke-width="4"/>
      <path d="M7 62H94" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
      <path d="M42 62H59" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </symbol>
<symbol id="phone" viewBox="0 0 54 80">
      <rect x="3" y="3" width="48" height="74" rx="5" fill="white" stroke="#333" stroke-width="4"/>
      <path d="M4 13H50M4 66H50" stroke="#333" stroke-width="2"/>
      <path d="M24 8H30M25 71H29" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
<symbol id="stack-server" viewBox="0 0 60 115" preserveAspectRatio="none">
      <path d="M7 0H53Q60 0 60 7V115H0V7Q0 0 7 0Z" fill="#7fba42" stroke="#e8e8e8" stroke-width="4"/>
      <path d="M12 16H48M12 84H48M12 98H48" stroke="white" stroke-width="5"/>
    </symbol>
<symbol id="rear-server" viewBox="0 0 60 115" preserveAspectRatio="none">
      <path d="M7 0H53Q60 0 60 7V42H0V7Q0 0 7 0Z" fill="#7fba42" stroke="#e8e8e8" stroke-width="4"/>
      <path d="M12 16H48" stroke="white" stroke-width="5"/>
    </symbol>
<symbol id="dns-globe" viewBox="0 0 140 136">
      <g fill="none" stroke="#4d4d4d" stroke-width="8">
        <ellipse cx="70" cy="68" rx="65" ry="63"/>
        <path d="M19 26Q70 44 121 26M19 110Q70 92 121 110M38 47Q48 5 70 5Q92 5 102 47M38 91Q48 131 70 131Q92 131 102 91M5 68H16M124 68H135"/>
      </g>
      <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="49" fill="#4d4d4d">DNS</text>
    </symbol>
<symbol id="load-balancer" viewBox="0 0 114 78" preserveAspectRatio="none">
      <path d="M13 0H101L113 70Q115 78 106 78H8Q0 78 1 70Z" fill="#2e73b8"/>
      <circle cx="56" cy="14" r="6" fill="white"/>
      <path d="M56 20V67M56 32L36 51M56 32L77 51M36 39V51H48M65 51H77V39M48 58L56 67L64 58" fill="none" stroke="white" stroke-width="3.5"/>
    </symbol>
<symbol id="cloud" viewBox="0 0 180 110">
      <path d="M25 46C16 20 45 -1 73 17C82 8 91 3 103 1C112 -1 128 1 139 8C152 17 158 31 156 45C187 58 192 90 164 106C160 109 151 110 143 110H31C5 110 -6 91 3 71C7 59 14 52 25 46Z" fill="#7eddfd"/>
      <path d="M103 0H141L127 25H149L89 91L104 51H83Z" fill="white"/>
    </symbol>

    <symbol id="nosql" viewBox="0 0 64 85" preserveAspectRatio="none">
      <path d="M0 12C0 -4 64 -4 64 12V74C64 88.667 0 88.667 0 74Z" fill="#2e73b8"/>
      <ellipse cx="32" cy="12" rx="24" ry="6.5" fill="white"/>
      <text x="32" y="64" text-anchor="middle" font-size="39" font-weight="bold" fill="white">{ }</text>
    </symbol>
    <!-- Four-unit nose projection keeps every 2.4-unit shaft covered at its tapered head. -->
    <marker id="blue-arrow" markerWidth="16" markerHeight="14" viewBox="0 0 16 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 7L0 14L4 7Z" fill="#2d68a0"/></marker>
    <marker id="blue-triangle-arrow" markerWidth="14" markerHeight="12" viewBox="0 0 14 12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 6L0 12Z" fill="#2d68a0"/></marker>
    <!-- Shallow regional routes use narrower heads so their rear corners clear the panel boundary. -->
    <marker id="regional-arrow" markerWidth="14" markerHeight="8" viewBox="0 0 14 8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 4L0 8Z" fill="#2d68a0"/></marker>
    <marker id="green-arrow" markerWidth="14" markerHeight="12" viewBox="0 0 14 12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 6L0 12Z" fill="#006000"/></marker>
    <marker id="purple-arrow" markerWidth="16" markerHeight="14" viewBox="0 0 16 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 7L0 14Z" fill="#4c0099"/></marker>
  </defs>
  <!-- White canvas and regional backplates; only the regional interiors are gray. -->
  <rect width="930" height="926" fill="white"/>
  <rect id="east-region" x="15" y="382" width="353" height="526" rx="55" fill="#e8e8e8" stroke="#37b5d8" stroke-width="2.4" stroke-dasharray="7.5 7.5"/>
  <rect id="west-region" x="403" y="382" width="353" height="526" rx="55" fill="#e8e8e8" stroke="#37b5d8" stroke-width="2.4" stroke-dasharray="7.5 7.5"/>

  <!-- User devices resolve DNS and fetch static content from the CDN. -->
  <rect id="user-group" x="181" y="20" width="377" height="163" rx="25" fill="white" stroke="#37b5d8" stroke-width="2.4"/>
  <use href="#laptop" x="268" y="64" width="62" height="44"/>
  <use href="#phone" x="420" y="54" width="40" height="59"/>
  <use href="#dns-globe" x="18" y="57" width="86" height="83"/>
  <use href="#cloud" x="689" y="53" width="113" height="68"/>
  <text x="200" y="53" text-anchor="start" font-size="20" >User</text>
  <text x="303" y="132" text-anchor="middle" font-size="18" >Web browser</text>
  <text x="449" y="133" text-anchor="middle" font-size="18" >Mobile app</text>
  <text x="742" y="151" text-anchor="middle" font-size="20" >CDN</text>
  <path id="dns-request" d="M181 101L107.300 101.000" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#blue-arrow)"/>
  <path id="cdn-request" d="M558 101L686.200 101.000" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#blue-arrow)"/>
  <!-- Browser and mobile requests converge on the load balancer. -->
  <path id="browser-request" d="M283 143L347.919 249.584" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#blue-triangle-arrow)"/>
  <path id="mobile-request" d="M431 150L357.375 249.781" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#blue-triangle-arrow)"/>
  <text x="157" y="223" text-anchor="start" font-size="20" >www.mysite.com</text>
  <text x="397" y="223" text-anchor="start" font-size="20" >api.mysite.com</text>
  <use href="#load-balancer" x="324" y="253" width="66" height="60"/>
  <text x="393" y="289" text-anchor="start" font-size="20" >Load balancer</text>
  <!-- Traffic goes to the available region. The white-ringed cross interrupts the unavailable route. -->
  <path id="all-traffic-to-east" d="M352 313L196.679 379.231" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#regional-arrow)"/>
  <path id="unavailable-west-route" d="M358 313L576.174 379.632" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#regional-arrow)"/>
  <text x="217" y="361" text-anchor="start" font-size="16" transform="rotate(-23.1 217 361)">100% traffic</text>
  <circle id="outage-marker" cx="460" cy="340" r="19" fill="#da2145" stroke="white" stroke-width="1.5"/>
  <path id="outage-cross" d="M452 332L468 348M468 332L452 348" fill="none" stroke="white" stroke-width="2"/>
  <!-- east: five web servers above three databases and three caches. -->
  <text x="75" y="423" text-anchor="middle" font-size="17" >DC1</text>
  <text x="75" y="443" text-anchor="middle" font-size="17" >US-East</text>
  <rect id="east-server-pool" x="122" y="402" width="148" height="166" rx="23" fill="none" stroke="#37b5d8" stroke-width="2.4" stroke-dasharray="7.5 7.5"/>
  <use href="#rear-server" x="162" y="417" width="34" height="72"/>
  <use href="#rear-server" x="200" y="417" width="34" height="72"/>
  <use href="#stack-server" x="143" y="444" width="34" height="72"/>
  <use href="#stack-server" x="181" y="443" width="34" height="72"/>
  <use href="#stack-server" x="219" y="444" width="34" height="72"/>
  <text x="200" y="550" text-anchor="middle" font-size="20" >Web servers</text>
  <rect id="east-database-group" x="32" y="690" width="134" height="169" rx="21" fill="none" stroke="#37b5d8" stroke-width="2.4"/>
  <path d="M53 719V763C53 777 97 777 97 763V719" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <ellipse cx="75" cy="719" rx="22" ry="7.8" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <path d="M77 734V778C77 792 121 792 121 778V734" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <ellipse cx="99" cy="734" rx="22" ry="7.8" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <path d="M101 750V794C101 808 145 808 145 794V750" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <ellipse cx="123" cy="750" rx="22" ry="7.8" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <text x="103" y="837" text-anchor="middle" font-size="20" >Databases</text>
  <rect id="east-cache-group" x="207" y="692" width="137" height="166" rx="21" fill="none" stroke="#37b5d8" stroke-width="2.4"/>
  <rect x="216" y="718" width="49" height="57" rx="6" fill="#19527a"/>
  <rect x="216" y="717" width="49" height="57" rx="6" fill="#2e73b8" stroke="#19527a" stroke-width="0.7"/>
  <text x="240.5" y="735" text-anchor="middle" font-size="15" fill="white" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(240.5 0) scale(.85 1) translate(-240.5 0)">CACHE</text>
  <rect x="245" y="741" width="49" height="57" rx="6" fill="#19527a"/>
  <rect x="245" y="740" width="49" height="57" rx="6" fill="#2e73b8" stroke="#19527a" stroke-width="0.7"/>
  <text x="269.5" y="758" text-anchor="middle" font-size="15" fill="white" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(269.5 0) scale(.85 1) translate(-269.5 0)">CACHE</text>
  <rect x="281" y="765" width="49" height="57" rx="6" fill="#19527a"/>
  <rect x="281" y="764" width="49" height="57" rx="6" fill="#2e73b8" stroke="#19527a" stroke-width="0.7"/>
  <text x="305.5" y="782" text-anchor="middle" font-size="15" fill="white" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(305.5 0) scale(.85 1) translate(-305.5 0)">CACHE</text>
  <text x="275" y="850" text-anchor="middle" font-size="20" >Caches</text>
  <path id="east-database-flow" d="M194 571L101.511 685.686" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#blue-triangle-arrow)"/>
  <path id="east-cache-flow" d="M199 573L272.831 687.439" fill="none" stroke="#006000" stroke-width="2.4" marker-end="url(#green-arrow)"/>
  <!-- The failed region is uniformly faded, while its outer dashed boundary stays visible. -->
  <g id="unavailable-west-components" opacity="0.12">
  <!-- west: five web servers above three databases and three caches. -->
  <text x="454" y="423" text-anchor="middle" font-size="17" >DC2</text>
  <text x="454" y="443" text-anchor="middle" font-size="17" >US-West</text>
  <rect id="west-server-pool" x="511" y="402" width="148" height="166" rx="23" fill="none" stroke="#37b5d8" stroke-width="2.4" stroke-dasharray="7.5 7.5"/>
  <use href="#rear-server" x="551" y="417" width="34" height="72"/>
  <use href="#rear-server" x="589" y="417" width="34" height="72"/>
  <use href="#stack-server" x="532" y="444" width="34" height="72"/>
  <use href="#stack-server" x="570" y="443" width="34" height="72"/>
  <use href="#stack-server" x="608" y="444" width="34" height="72"/>
  <text x="589" y="550" text-anchor="middle" font-size="20" >Web servers</text>
  <rect id="west-database-group" x="421" y="690" width="134" height="169" rx="21" fill="none" stroke="#37b5d8" stroke-width="2.4"/>
  <path d="M442 719V763C442 777 486 777 486 763V719" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <ellipse cx="464" cy="719" rx="22" ry="7.8" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <path d="M466 734V778C466 792 510 792 510 778V734" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <ellipse cx="488" cy="734" rx="22" ry="7.8" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <path d="M490 750V794C490 808 534 808 534 794V750" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <ellipse cx="512" cy="750" rx="22" ry="7.8" fill="#2e73b8" stroke="#e8e8e8" stroke-width="3"/>
  <text x="492" y="837" text-anchor="middle" font-size="20" >Databases</text>
  <rect id="west-cache-group" x="596" y="692" width="137" height="166" rx="21" fill="none" stroke="#37b5d8" stroke-width="2.4"/>
  <rect x="605" y="718" width="49" height="57" rx="6" fill="#19527a"/>
  <rect x="605" y="717" width="49" height="57" rx="6" fill="#2e73b8" stroke="#19527a" stroke-width="0.7"/>
  <text x="629.5" y="735" text-anchor="middle" font-size="15" fill="white" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(629.5 0) scale(.85 1) translate(-629.5 0)">CACHE</text>
  <rect x="634" y="741" width="49" height="57" rx="6" fill="#19527a"/>
  <rect x="634" y="740" width="49" height="57" rx="6" fill="#2e73b8" stroke="#19527a" stroke-width="0.7"/>
  <text x="658.5" y="758" text-anchor="middle" font-size="15" fill="white" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(658.5 0) scale(.85 1) translate(-658.5 0)">CACHE</text>
  <rect x="670" y="765" width="49" height="57" rx="6" fill="#19527a"/>
  <rect x="670" y="764" width="49" height="57" rx="6" fill="#2e73b8" stroke="#19527a" stroke-width="0.7"/>
  <text x="694.5" y="782" text-anchor="middle" font-size="15" fill="white" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(694.5 0) scale(.85 1) translate(-694.5 0)">CACHE</text>
  <text x="664" y="850" text-anchor="middle" font-size="20" >Caches</text>
  <path id="west-database-flow" d="M583 571L490.511 685.686" fill="none" stroke="#2d68a0" stroke-width="2.4" marker-end="url(#blue-triangle-arrow)"/>
  <path id="west-cache-flow" d="M588 573L661.831 687.439" fill="none" stroke="#006000" stroke-width="2.4" marker-end="url(#green-arrow)"/>
    <!-- The failed region's NoSQL shaft is faded only while inside that region. -->
    <path id="west-nosql-interior-flow" d="M586 568L756 653.664" fill="none" stroke="#4c0099" stroke-width="2.4"/>
  </g>
  <!-- External NoSQL routes stay visible. The active east route intentionally crosses the west panel. -->
  <path id="west-nosql-exterior-flow" d="M756 653.664L876.435 714.985" fill="none" stroke="#4c0099" stroke-width="2.4" marker-end="url(#purple-arrow)"/>
  <path id="east-nosql-flow" d="M197 568L860.098 717.520" fill="none" stroke="#4c0099" stroke-width="2.4" marker-end="url(#purple-arrow)"/>
  <!-- Arrowheads retain the reference clearance above the curved shared NoSQL rim. -->
  <use href="#nosql" x="851" y="720" width="61" height="80"/>
  <text x="880" y="827" text-anchor="middle" font-size="20" >NoSQL</text>
</svg>
