<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="184" viewBox="0 0 1202 184" role="img" aria-labelledby="title desc">
  <title id="title">Cache read flow</title>
  <desc id="desc">If data exists in cache, the cache returns it to the web server. Otherwise, data is fetched from the database and saved in cache before being returned.</desc>
  <!-- Typography and colors follow the PNG reference's sRGB rendering. -->
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.caption{font-size:24px}.step{font-size:21px}.cache-label{font-family:'Arial Narrow',Arial,sans-serif;font-stretch:condensed;font-weight:bold;fill:white}</style>
  </defs>
  <rect width="1202" height="184" fill="#fefefe"/>
  <!-- The reference has a small clipped mark at its upper edge. -->
  <path d="M52 0H58" stroke="#555" stroke-width="1"/>
  <!-- Web server: the lower corners are square in the source icon. -->
  <path d="M49 124V24Q49 17 56 17H97Q104 17 104 24V124Z" fill="#6abd25"/>
  <path d="M59 33H93M59 96H93M59 110H93" stroke="white" stroke-width="5"/>
  <text class="caption" x="76" y="151" text-anchor="middle">Web server</text>
  <!-- Cache hit and cache miss responses; the shafts end inside the arrow bases. -->
  <path id="cache-hit-shaft" d="M617 53H119" stroke="#008000" stroke-width="3"/>
  <path d="M106 53L123 45V61Z" fill="#008000"/>
  <text class="step" x="614" y="40" text-anchor="end">1. If data exists in cache, read data from cache</text>
  <path id="cache-response-shaft" d="M624 101.5H123" stroke="#176d9c" stroke-width="3"/>
  <path d="M109 101.5L126 93V110Z" fill="#176d9c"/>
  <text class="step" x="177" y="138">2.2 Return data to the web server</text>
  <path id="database-response-shaft" d="M1100 101H718" stroke="#176d9c" stroke-width="3"/>
  <path d="M703 101L720 92.5V109.5Z" fill="#176d9c"/>
  <text class="step" x="907" y="137" text-anchor="middle"><tspan x="907">2.1 If data doesn't exist in cache,</tspan><tspan x="867" dy="23">save data to cache</tspan></text>
  <!-- Cache tile, including its darker lower edge and condensed label. -->
  <rect x="623" y="36" width="78" height="80" rx="12" fill="#005879"/>
  <rect x="623" y="33" width="78" height="80" rx="12" fill="#0074bc"/>
  <text class="cache-label" x="662" y="60" transform="translate(66.2 0) scale(0.9 1)" font-size="23" text-anchor="middle">CACHE</text>
  <text class="caption" x="658" y="149" text-anchor="middle">Cache</text>
  <!-- Database cylinder, with a white top opening and the original DB label. -->
  <path d="M1098 33C1098 16 1166 16 1166 33V112C1166 130 1098 130 1098 112Z" fill="#0074bc"/>
  <ellipse cx="1132" cy="34" rx="26" ry="7" fill="#fefefe"/>
  <text x="1133" y="96" text-anchor="middle" font-size="39" style="fill:white">DB</text>
  <text class="caption" x="1132" y="153" text-anchor="middle">Database</text>
</svg>
