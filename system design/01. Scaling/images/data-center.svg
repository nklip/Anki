<svg xmlns="http://www.w3.org/2000/svg" width="902" height="884" viewBox="0 0 902 884" role="img" aria-labelledby="title desc">
  <title id="title">Two data centers with geo-routing</title>
  <desc id="desc">Users access DNS, a CDN and a load balancer. Geo-routed traffic goes to US-East or US-West; each contains five web servers, three databases and three caches. Both regions use a shared NoSQL store.</desc>
  <!-- Faithful reusable infrastructure icons from the PNG etalons. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 100 70">
      <path d="M8 54V10Q8 3 15 3H85Q92 3 92 10V54" fill="none" stroke="#111" stroke-width="4"/>
      <path d="M7 62H94" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
      <path d="M42 62H59" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="phone" viewBox="0 0 54 80">
      <rect x="3" y="3" width="48" height="74" rx="5" fill="white" stroke="#333" stroke-width="4"/>
      <path d="M4 13H50M4 66H50" stroke="#333" stroke-width="2"/>
      <path d="M24 8H30M25 71H29" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="server" viewBox="0 0 60 115">
      <path d="M7 0H53Q60 0 60 7V115H0V7Q0 0 7 0Z" fill="#6bbc24"/>
      <path d="M12 16H48M12 84H48M12 98H48" stroke="white" stroke-width="5"/>
    </symbol>
    <symbol id="stack-server" viewBox="0 0 60 115" preserveAspectRatio="none">
      <path d="M7 0H53Q60 0 60 7V115H0V7Q0 0 7 0Z" fill="#6bbc24" stroke="#e7e7e7" stroke-width="4"/>
      <path d="M12 16H48M12 84H48M12 98H48" stroke="white" stroke-width="5"/>
    </symbol>
    <symbol id="dns-globe" viewBox="0 0 140 136">
      <g fill="none" stroke="#4d4d4d" stroke-width="8">
        <ellipse cx="70" cy="68" rx="65" ry="63"/>
        <path d="M19 26Q70 44 121 26M19 110Q70 92 121 110M38 47Q48 5 70 5Q92 5 102 47M38 91Q48 131 70 131Q92 131 102 91M5 68H16M124 68H135"/>
      </g>
      <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="49" fill="#4d4d4d">DNS</text>
    </symbol>
    <symbol id="load-balancer" viewBox="0 0 114 78" preserveAspectRatio="none">
      <path d="M13 0H101L113 70Q115 78 106 78H8Q0 78 1 70Z" fill="#0074bc"/>
      <circle cx="56" cy="14" r="6" fill="white"/>
      <path d="M56 20V67M56 32L36 51M56 32L77 51M36 39V51H48M65 51H77V39M48 58L56 67L64 58" fill="none" stroke="white" stroke-width="3.5"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 180 110">
      <path d="M25 46C16 20 45 -1 73 17C82 8 91 3 103 1C112 -1 128 1 139 8C152 17 158 31 156 45C187 58 192 90 164 106C160 109 151 110 143 110H31C5 110 -6 91 3 71C7 59 14 52 25 46Z" fill="#55dfff"/>
      <path d="M103 0H141L127 25H149L89 91L104 51H83Z" fill="white"/>
    </symbol>
    <!-- Rear servers show only their upper tier; lower slots must not appear between front servers. -->
    <symbol id="rear-server" viewBox="0 0 60 115" preserveAspectRatio="none">
      <path d="M7 0H53Q60 0 60 7V42H0V7Q0 0 7 0Z" fill="#6bbc24" stroke="#e7e7e7" stroke-width="4"/>
      <path d="M12 16H48" stroke="white" stroke-width="5"/>
    </symbol>
  </defs>
  <!-- Canvas. -->
  <rect width="902" height="884" fill="white"/>
  <!-- Users resolve DNS and access the CDN at the edge. -->
  <rect x="190" y="28" width="357" height="155" rx="23" fill="white" stroke="#00b5d4" stroke-width="2"/>
  <text x="207" y="59" font-family="Arial, sans-serif" font-size="19">User</text>
  <use href="#laptop" x="271" y="71" width="60" height="43"/>
  <text x="305" y="135" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Web browser</text>
  <use href="#phone" x="414" y="60" width="39" height="57"/>
  <text x="440" y="136" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Mobile app</text>
  <use href="#dns-globe" x="34" y="63" width="84" height="80"/>
  <g id="dns-lookup">
    <path data-connector="true" d="M190 106L129 106" fill="none" stroke="#16739c" stroke-width="2"/>
    <path d="M117 106L130 100.15L130 111.85Z" fill="#16739c"/>
  </g>
  <use href="#cloud" x="670" y="58" width="109" height="66"/>
  <text x="721" y="153" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">CDN</text>
  <g id="cdn-request">
    <path data-connector="true" d="M548 105L656 105" fill="none" stroke="#16739c" stroke-width="2"/>
    <path d="M669 105L655 111.3L655 98.7Z" fill="#16739c"/>
  </g>
  <!-- Client routes and regional routing preserve the reference’s diagonal paths. -->
  <g id="browser-request">
    <path data-connector="true" d="M283 143L345.453 238.943" fill="none" stroke="#16739c" stroke-width="2.3"/>
    <path d="M352 249L340.005 241.296L349.811 234.913Z" fill="#16739c"/>
  </g>
  <text x="167" y="221" font-family="Arial, sans-serif" font-size="18">www.mysite.com</text>
  <g id="mobile-request">
    <path data-connector="true" d="M427 153L360.326 239.496" fill="none" stroke="#16739c" stroke-width="2.3"/>
    <path d="M353 249L356.303 235.132L365.57 242.275Z" fill="#16739c"/>
  </g>
  <text x="393" y="220" font-family="Arial, sans-serif" font-size="18">api.mysite.com</text>
  <use href="#load-balancer" x="325" y="249" width="63" height="58"/>
  <text x="390" y="285" font-family="Arial, sans-serif" font-size="18">Load balancer</text>
  <g id="geo-east">
    <path data-connector="true" d="M352 306L191.225 366.758" fill="none" stroke="#16739c" stroke-width="2.3"/>
    <path d="M180 371L190.093 360.932L194.229 371.877Z" fill="#16739c"/>
  </g>
  <text x="215" y="351" font-family="Arial, sans-serif" font-size="15" transform="rotate(-20.7 215 351)">Geo-routed</text>
  <g id="geo-west">
    <path data-connector="true" d="M359 306L562.513 367.527" fill="none" stroke="#16739c" stroke-width="2.3"/>
    <path d="M574 371L559.863 372.838L563.249 361.638Z" fill="#16739c"/>
  </g>
  <text x="443" y="323" font-family="Arial, sans-serif" font-size="15" transform="rotate(17 443 323)">Geo-routed</text>
  <!-- US-East: five web servers, three databases and three caches. -->
  <rect x="12" y="371" width="334" height="498" rx="55" fill="#e7e7e7" stroke="#00b5d4" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">DC1</text>
  <text x="70" y="429" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">US-East</text>
  <rect x="113" y="390" width="141" height="157" rx="23" fill="none" stroke="#00b5d4" stroke-width="2" stroke-dasharray="7 7"/>
  <use href="#rear-server" x="151" y="403" width="33" height="68"/>
  <use href="#rear-server" x="187" y="403" width="33" height="68"/>
  <use href="#stack-server" x="133" y="430" width="33" height="68"/>
  <use href="#stack-server" x="169" y="429" width="33" height="68"/>
  <use href="#stack-server" x="206" y="430" width="33" height="68"/>
  <text x="188" y="530" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Web servers</text>
  <rect x="29" y="662" width="127" height="160" rx="20" fill="none" stroke="#00b5d4" stroke-width="2"/>
  <g>
    <path d="M48 690V732C48 746 91 746 91 732V690" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <ellipse cx="69.5" cy="690" rx="21.5" ry="8" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <path d="M70 704V746C70 760 113 760 113 746V704" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <ellipse cx="91.5" cy="704" rx="21.5" ry="8" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <path d="M93 719V761C93 775 136 775 136 761V719" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <ellipse cx="114.5" cy="719" rx="21.5" ry="8" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
  </g>
  <text x="96" y="801" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Databases</text>
  <rect x="194" y="664" width="130" height="158" rx="20" fill="none" stroke="#00b5d4" stroke-width="2"/>
  <g>
    <rect x="203" y="687" width="47" height="55" rx="6" fill="#0074bc" stroke="#08618d" stroke-width="1.5"/>
    <text x="226.5" y="705" font-family="Arial Narrow, Arial, sans-serif" font-size="15" text-anchor="middle" fill="white" font-weight="bold" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(226.5 0) scale(.85 1) translate(-226.5 0)">CACHE</text>
    <rect x="230" y="709" width="47" height="55" rx="6" fill="#0074bc" stroke="#08618d" stroke-width="1.5"/>
    <text x="253.5" y="727" font-family="Arial Narrow, Arial, sans-serif" font-size="15" text-anchor="middle" fill="white" font-weight="bold" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(253.5 0) scale(.85 1) translate(-253.5 0)">CACHE</text>
    <rect x="264" y="732" width="47" height="55" rx="6" fill="#0074bc" stroke="#08618d" stroke-width="1.5"/>
    <text x="287.5" y="750" font-family="Arial Narrow, Arial, sans-serif" font-size="15" text-anchor="middle" fill="white" font-weight="bold" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(287.5 0) scale(.85 1) translate(-287.5 0)">CACHE</text>
  </g>
  <text x="258" y="814" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Caches</text>
  <g id="east-databases">
    <path data-connector="true" d="M181 550L99.4656 652.605" fill="none" stroke="#16739c" stroke-width="2"/>
    <path d="M92 662L95.5077 648.183L104.668 655.462Z" fill="#16739c"/>
  </g>
  <g id="east-caches">
    <path data-connector="true" d="M186 550L252.529 653.894" fill="none" stroke="#006a08" stroke-width="2"/>
    <path d="M259 664L247.063 656.207L256.916 649.898Z" fill="#006a08"/>
  </g>
  <!-- US-West: five web servers, three databases and three caches. -->
  <rect x="407" y="371" width="334" height="498" rx="55" fill="#e7e7e7" stroke="#00b5d4" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="465" y="410" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">DC2</text>
  <text x="465" y="429" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">US-West</text>
  <rect x="508" y="390" width="141" height="157" rx="23" fill="none" stroke="#00b5d4" stroke-width="2" stroke-dasharray="7 7"/>
  <use href="#rear-server" x="546" y="403" width="33" height="68"/>
  <use href="#rear-server" x="582" y="403" width="33" height="68"/>
  <use href="#stack-server" x="528" y="430" width="33" height="68"/>
  <use href="#stack-server" x="564" y="429" width="33" height="68"/>
  <use href="#stack-server" x="601" y="430" width="33" height="68"/>
  <text x="583" y="530" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Web servers</text>
  <rect x="424" y="662" width="127" height="160" rx="20" fill="none" stroke="#00b5d4" stroke-width="2"/>
  <g>
    <path d="M443 690V732C443 746 486 746 486 732V690" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <ellipse cx="464.5" cy="690" rx="21.5" ry="8" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <path d="M465 704V746C465 760 508 760 508 746V704" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <ellipse cx="486.5" cy="704" rx="21.5" ry="8" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <path d="M488 719V761C488 775 531 775 531 761V719" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
    <ellipse cx="509.5" cy="719" rx="21.5" ry="8" fill="#0074bc" stroke="#e7e7e7" stroke-width="2.5"/>
  </g>
  <text x="491" y="801" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Databases</text>
  <rect x="589" y="664" width="130" height="158" rx="20" fill="none" stroke="#00b5d4" stroke-width="2"/>
  <g>
    <rect x="598" y="687" width="47" height="55" rx="6" fill="#0074bc" stroke="#08618d" stroke-width="1.5"/>
    <text x="621.5" y="705" font-family="Arial Narrow, Arial, sans-serif" font-size="15" text-anchor="middle" fill="white" font-weight="bold" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(621.5 0) scale(.85 1) translate(-621.5 0)">CACHE</text>
    <rect x="625" y="709" width="47" height="55" rx="6" fill="#0074bc" stroke="#08618d" stroke-width="1.5"/>
    <text x="648.5" y="727" font-family="Arial Narrow, Arial, sans-serif" font-size="15" text-anchor="middle" fill="white" font-weight="bold" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(648.5 0) scale(.85 1) translate(-648.5 0)">CACHE</text>
    <rect x="659" y="732" width="47" height="55" rx="6" fill="#0074bc" stroke="#08618d" stroke-width="1.5"/>
    <text x="682.5" y="750" font-family="Arial Narrow, Arial, sans-serif" font-size="15" text-anchor="middle" fill="white" font-weight="bold" style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold" transform="translate(682.5 0) scale(.85 1) translate(-682.5 0)">CACHE</text>
  </g>
  <text x="653" y="814" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Caches</text>
  <g id="west-databases">
    <path data-connector="true" d="M576 550L494.466 652.605" fill="none" stroke="#16739c" stroke-width="2"/>
    <path d="M487 662L490.508 648.183L499.668 655.462Z" fill="#16739c"/>
  </g>
  <g id="west-caches">
    <path data-connector="true" d="M581 550L647.529 653.894" fill="none" stroke="#006a08" stroke-width="2"/>
    <path d="M654 664L642.063 656.207L651.916 649.898Z" fill="#006a08"/>
  </g>
  <!-- Both regions connect to the shared NoSQL store; shafts intentionally cross the regional panel boundaries. -->
  <g id="east-nosql">
    <path data-connector="true" d="M186 548L831.293 687.258" fill="none" stroke="#51058b" stroke-width="2"/>
    <path d="M844 690L828.986 693.205L831.644 680.888Z" fill="#51058b"/>
  </g>
  <g id="west-nosql">
    <path data-connector="true" d="M581 548L846.381 681.169" fill="none" stroke="#51058b" stroke-width="2"/>
    <path d="M858 687L842.661 686.352L848.313 675.09Z" fill="#51058b"/>
  </g>
  <g transform="translate(830 689) scale(0.6041666666666666 0.6909090909090909)">
    <path d="M0 12C0 -4 96 -4 96 12V96C96 115 0 115 0 96Z" fill="#0074bc"/>
    <ellipse cx="48" cy="13" rx="36" ry="8" fill="white"/>
  </g>
  <text x="859" y="750" font-family="Arial, sans-serif" font-size="38" font-weight="bold" text-anchor="middle" fill="white">{ }</text>
  <text x="859" y="791" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">NoSQL</text>
</svg>
