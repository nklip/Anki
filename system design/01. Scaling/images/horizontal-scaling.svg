<svg xmlns="http://www.w3.org/2000/svg" width="916" height="638" viewBox="0 0 916 638" role="img" aria-labelledby="title desc">
  <title id="title">Vertical scaling versus horizontal scaling</title>
  <desc id="desc">Vertical scaling increases CPU, RAM, and disk capacity within one server. Horizontal scaling adds more servers.</desc>
  <!-- Stretchable server silhouette and directional dart arrow. -->
  <defs>
    <symbol id="server" viewBox="0 0 50 100" preserveAspectRatio="none">
      <path d="M0 5Q0 0 5 0H45Q50 0 50 5V100H0Z" fill="#6abd25"/>
      <path d="M7.5 17H42.5M7.5 78H42.5M7.5 88H42.5" stroke="#fefefe" stroke-width="5"/>
    </symbol>
    <!-- The dart tip projects 10 units beyond refX; its shaft ends within the solid head. -->
    <marker id="arrow" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="8" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L18 9L0 18L5 9Z" fill="#146b9f"/>
    </marker>
  </defs>
  <rect width="916" height="638" fill="#fefefe"/>
  <!-- The dashed frame retains the reference’s wide rounded corners and right margin. -->
  <rect id="frame" x="16.5" y="6.5" width="892.5" height="621.5" rx="95" fill="none" stroke="#009fe1" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Vertical scaling increases the size of one machine, reading from bottom to top. -->
  <text x="99.5" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0097d9">Vertical Scaling</text>
  <text x="36" y="75.5" font-family="Arial, Helvetica, sans-serif" font-size="18">(Increase CPU, RAM, DISK, etc)</text>
  <use href="#server" x="121" y="108.5" width="92" height="192"/>
  <use href="#server" x="137.5" y="329" width="59.5" height="124"/>
  <use href="#server" x="145.5" y="493" width="43" height="90"/>
  <path id="vertical-arrow" d="M287.5 594.5V106.5" fill="none" stroke="#146b9f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="360" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29">vs</text>

  <!-- Horizontal scaling adds equal-sized machines in two rows. -->
  <text x="543.5" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0097d9">Horizontal Scaling</text>
  <text x="547" y="269.5" font-family="Arial, Helvetica, sans-serif" font-size="18">(Add more servers)</text>
  <g id="horizontal-servers">
    <use href="#server" x="432.5" y="313" width="43" height="90"/>
    <use href="#server" x="557" y="313" width="43" height="90"/>
    <use href="#server" x="681.5" y="313" width="43" height="90"/>
    <use href="#server" x="806" y="313" width="43" height="90"/>
    <use href="#server" x="432.5" y="454" width="43" height="90"/>
    <use href="#server" x="557" y="454" width="43" height="90"/>
    <use href="#server" x="681.5" y="454" width="43" height="90"/>
    <use href="#server" x="806" y="454" width="43" height="90"/>
  </g>
  <path id="horizontal-arrow" d="M426.5 595.5H856.5" fill="none" stroke="#146b9f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
