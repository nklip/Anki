<svg xmlns="http://www.w3.org/2000/svg" width="916" height="638" viewBox="0 0 916 638" role="img" aria-labelledby="title desc">
  <title id="title">Vertical scaling versus horizontal scaling</title>
  <desc id="desc">Vertical scaling increases the resources of one server. Horizontal scaling adds more servers.</desc>

  <!-- Shared server icon and directional arrowhead. -->
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#0b78b5"/></marker>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>

  <rect width="916" height="638" fill="white"/>
  <rect x="16" y="8" width="884" height="620" rx="92" fill="none" stroke="#09a9d0" stroke-width="3" stroke-dasharray="9 7"/>

  <!-- Vertical scaling: one machine grows in capacity. -->
  <text x="100" y="47" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#078bc4">Vertical Scaling</text>
  <text x="36" y="76" font-family="Arial, sans-serif" font-size="18">Increase CPU, RAM, and disk</text>
  <use href="#server" x="120" y="108" width="94" height="196"/>
  <use href="#server" x="138" y="328" width="64" height="126"/>
  <use href="#server" x="145" y="492" width="48" height="92"/>
  <path d="M288 596V111" fill="none" stroke="#0b78b5" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="359" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="29">vs</text>

  <!-- Horizontal scaling: capacity grows by adding peers. -->
  <text x="545" y="242" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#078bc4">Horizontal Scaling</text>
  <text x="547" y="273" font-family="Arial, sans-serif" font-size="18">Add more servers</text>
  <g>
    <use href="#server" x="432" y="313" width="45" height="92"/><use href="#server" x="556" y="313" width="45" height="92"/><use href="#server" x="680" y="313" width="45" height="92"/><use href="#server" x="804" y="313" width="45" height="92"/>
    <use href="#server" x="432" y="454" width="45" height="92"/><use href="#server" x="556" y="454" width="45" height="92"/><use href="#server" x="680" y="454" width="45" height="92"/><use href="#server" x="804" y="454" width="45" height="92"/>
  </g>
  <path d="M426 596H855" fill="none" stroke="#0b78b5" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
