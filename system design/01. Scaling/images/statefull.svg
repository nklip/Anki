<svg xmlns="http://www.w3.org/2000/svg" width="956" height="546" viewBox="0 0 956 546" role="img" aria-labelledby="title desc">
  <title id="title">Stateful web servers</title>
  <desc id="desc">Each user is tied to one server because session data and profile images are stored locally on that server.</desc>

  <!-- Reusable user device, server, and request arrow. -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="0" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L12 6.5L0 12Z" fill="#0b78b5"/></marker>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>

  <rect width="956" height="546" fill="white"/>

  <!-- Users and sticky request routes. -->
  <use href="#laptop" x="91" y="14" width="110" height="70"/><text x="146" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">User A</text>
  <use href="#laptop" x="421" y="14" width="110" height="70"/><text x="476" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">User B</text>
  <use href="#laptop" x="742" y="14" width="110" height="70"/><text x="797" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">User C</text>
  <path d="M146 123V234" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="119" y="186" text-anchor="middle" transform="rotate(90 119 186)" font-family="Arial, sans-serif" font-size="16">HTTP request</text>
  <path d="M476 123V234" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="449" y="186" text-anchor="middle" transform="rotate(90 449 186)" font-family="Arial, sans-serif" font-size="16">HTTP request</text>
  <path d="M797 123V234" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="186" text-anchor="middle" transform="rotate(90 770 186)" font-family="Arial, sans-serif" font-size="16">HTTP request</text>

  <!-- Every server owns different user state. -->
  <g id="server-a"><rect x="35" y="248" width="220" height="278" rx="32" fill="#fbfbfb" stroke="#08b7d1" stroke-width="3"/><path d="M35 318H255" stroke="#08b7d1" stroke-width="3"/><text x="145" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">Server 1</text><use href="#server" x="107" y="331" width="48" height="94"/><text x="61" y="460" font-family="Arial, sans-serif" font-size="16">• Session data for User A</text><text x="61" y="499" font-family="Arial, sans-serif" font-size="16">• Profile image for User A</text></g>
  <g id="server-b"><rect x="366" y="248" width="220" height="278" rx="32" fill="#fbfbfb" stroke="#08b7d1" stroke-width="3"/><path d="M366 318H586" stroke="#08b7d1" stroke-width="3"/><text x="476" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">Server 2</text><use href="#server" x="438" y="331" width="48" height="94"/><text x="392" y="460" font-family="Arial, sans-serif" font-size="16">• Session data for User B</text><text x="392" y="499" font-family="Arial, sans-serif" font-size="16">• Profile image for User B</text></g>
  <g id="server-c"><rect x="687" y="248" width="220" height="278" rx="32" fill="#fbfbfb" stroke="#08b7d1" stroke-width="3"/><path d="M687 318H907" stroke="#08b7d1" stroke-width="3"/><text x="797" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">Server 3</text><use href="#server" x="759" y="331" width="48" height="94"/><text x="713" y="460" font-family="Arial, sans-serif" font-size="16">• Session data for User C</text><text x="713" y="499" font-family="Arial, sans-serif" font-size="16">• Profile image for User C</text></g>
</svg>
