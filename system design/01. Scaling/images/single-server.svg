<svg xmlns="http://www.w3.org/2000/svg" width="1222" height="712" viewBox="0 0 1222 712" role="img" aria-labelledby="title desc">
  <title id="title">Single-server architecture</title>
  <desc id="desc">A browser and mobile app resolve a domain through DNS and send web and API requests to one web server.</desc>
  <!-- Reusable native device silhouettes and the monochrome DNS globe. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 100 70"><path d="M6 55V11Q6 4 13 4H87Q94 4 94 11V55" fill="none" stroke="#000" stroke-width="5"/><rect y="60" width="100" height="9" rx="4" fill="#000"/><rect x="39" y="62" width="22" height="3" rx="1.5" fill="#fff"/></symbol>
    <symbol id="phone" viewBox="0 0 64 96"><rect x="3" y="3" width="58" height="90" rx="6" fill="none" stroke="#4d4d4d" stroke-width="6"/><path d="M4 16H60M4 80H60" stroke="#4d4d4d" stroke-width="4"/><path d="M27 9H37M29 87H35" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="server" viewBox="0 0 72 140"><path d="M0 140V9Q0 0 9 0H63Q72 0 72 9V140Z" fill="#6abd25"/><path d="M5 139V9Q5 4 10 4H63" fill="none" stroke="#88c74b" stroke-width="3"/><path d="M14 21H57M14 103H57M14 121H57" stroke="#fff" stroke-width="6"/></symbol>
    <symbol id="dns-globe" viewBox="0 0 140 136"><g fill="none" stroke="#4d4d4d" stroke-width="8"><ellipse cx="70" cy="68" rx="65" ry="63"/><path d="M19 26Q70 44 121 26M19 110Q70 92 121 110M38 47Q48 5 70 5Q92 5 102 47M38 91Q48 131 70 131Q92 131 102 91M5 68H16M124 68H135"/></g><text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="49" fill="#4d4d4d">DNS</text></symbol>
  </defs>
  <rect width="1222" height="712" fill="#fefefe"/>
<!-- User devices; dimensions and labels follow the PNG etalon. -->
<rect x="127" y="7" width="607" height="263" rx="39" fill="none" stroke="#000" stroke-width="2"/>
<text x="157" y="61" font-family="Arial, sans-serif" font-size="32">User</text>
<use href="#laptop" x="268" y="78" width="98" height="70"/>
<text x="322" y="188" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">Web browser</text>
<use href="#phone" x="511" y="62" width="64" height="94"/>
<text x="553" y="190" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">Mobile app</text>
<!-- Domain lookup and IP response use distinct horizontal routes. -->
<use href="#dns-globe" x="1073" y="45" width="140" height="135"/>
<path data-connector="true" d="M740 101L1061.55 101" fill="none" stroke="#000" stroke-width="2"/><path d="M1074 101L1057 109L1059.55 101L1057 93Z" fill="#000"/>
<text x="939" y="89" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">api.mysite.com</text>
<path data-connector="true" d="M1084 151L754.45 151" fill="none" stroke="#000" stroke-width="2"/><path d="M742 151L759 143L756.45 151L759 159Z" fill="#000"/>
<text x="906" y="192" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">IP address</text>
<!-- Both client arrows stop at the dashed web-tier boundary. -->
<path data-connector="true" d="M274 272L274 421.55" fill="none" stroke="#000" stroke-width="2"/><path d="M274 434L266 417L274 419.55L282 417Z" fill="#000"/>
<text x="29" y="376" font-family="Arial, sans-serif" font-size="32">www.mysite.com</text>
<path data-connector="true" d="M583 271L583 421.55" fill="none" stroke="#000" stroke-width="2"/><path d="M583 434L575 417L583 419.55L591 417Z" fill="#000"/>
<text x="600" y="376" font-family="Arial, sans-serif" font-size="32">api.mysite.com</text>
<!-- Single web server; the icon has the square lower edge in the reference. -->
<rect x="76" y="435" width="767" height="263" rx="40" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 6"/>
<use href="#server" x="413" y="478" width="72" height="140"/>
<text x="444" y="660" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">Web server</text>
</svg>
