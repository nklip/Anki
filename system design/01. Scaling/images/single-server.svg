<svg xmlns="http://www.w3.org/2000/svg" width="1222" height="712" viewBox="0 0 1222 712" role="img" aria-labelledby="title desc">
  <title id="title">Single-server architecture</title>
  <desc id="desc">A browser and mobile app resolve a domain through DNS and send web and API requests to one web server.</desc>

  <!-- Reusable devices, server, DNS symbol, and directional arrow. -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="0" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L12 6.5L0 12Z" fill="#222"/></marker>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <symbol id="phone" viewBox="0 0 54 96"><rect x="5" y="2" width="44" height="90" rx="7" fill="white" stroke="#333" stroke-width="5"/><path d="M19 11H35M23 82H31" stroke="#333" stroke-width="3"/></symbol>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
    <!-- Centered DNS globe shared by every scaling diagram. -->
    <symbol id="dns-globe" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="54" fill="white" stroke="#555" stroke-width="7"/>
      <path d="M60 6C36 24 36 96 60 114M60 6C84 24 84 96 60 114" fill="none" stroke="#555" stroke-width="5"/>
      <path d="M14 38Q60 20 106 38M14 82Q60 100 106 82" fill="none" stroke="#555" stroke-width="5"/>
      <rect x="15" y="42" width="90" height="36" rx="9" fill="white"/>
      <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b78b5">DNS</text>
    </symbol>
  </defs>

  <rect width="1222" height="712" fill="white"/>

  <!-- User devices. -->
  <rect x="126" y="8" width="608" height="262" rx="42" fill="white" stroke="#222" stroke-width="2"/>
  <text x="157" y="60" font-family="Arial, sans-serif" font-size="31">User</text>
  <use href="#laptop" x="245" y="74" width="110" height="70"/>
  <text x="300" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="28">Web browser</text>
  <use href="#phone" x="506" y="58" width="54" height="96"/>
  <text x="533" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="28">Mobile app</text>

  <!-- DNS request and response. -->
  <use href="#dns-globe" x="1071" y="44" width="134" height="134"/>
  <path d="M740 100H1059" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="905" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="28">api.mysite.com</text>
  <path d="M1071 153H752" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="905" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="27">IP address</text>

  <!-- Both client routes terminate at the same server boundary. -->
  <path d="M274 270V419" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="139" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="26">www.mysite.com</text>
  <path d="M582 270V419" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="372" font-family="Arial, sans-serif" font-size="26">api.mysite.com</text>

  <!-- Single web tier. -->
  <rect x="76" y="433" width="770" height="266" rx="45" fill="#fbfbfb" stroke="#222" stroke-width="2" stroke-dasharray="8 7"/>
  <use href="#server" x="413" y="478" width="72" height="140"/>
  <text x="449" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">Web server</text>
</svg>
