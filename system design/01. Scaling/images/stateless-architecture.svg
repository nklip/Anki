<svg xmlns="http://www.w3.org/2000/svg" width="908" height="832" viewBox="0 0 908 832" role="img" aria-labelledby="title desc">
  <title id="title">Stateless web servers</title>
  <desc id="desc">All three users can send HTTP requests to the same pool of five web servers. The servers fetch state from shared storage.</desc>
  <!-- Reusable user device and triangular arrows. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 80 55">
      <path d="M6 44V7Q6 2 11 2H69Q74 2 74 7V44" fill="none" stroke="#050505" stroke-width="3.5"/>
      <rect x="0" y="48" width="80" height="7" rx="3.5" fill="#050505"/>
      <rect x="31" y="50" width="18" height="2.5" rx="1.25" fill="#fefefe"/>
    </symbol>
    <!-- The triangular tip projects 10 units beyond refX; its shaft ends within the solid head. -->
    <marker id="arrow" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="8" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L18 9L0 18Z" fill="#146b9f"/>
    </marker>
  </defs>
  <rect width="908" height="832" fill="#fefefe"/>
  <!-- Request sources; label baselines follow the reference’s slight vertical offsets. -->
  <use href="#laptop" x="31" y="38" width="78" height="53.6"/><text x="70" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22">User A</text>
  <use href="#laptop" x="415" y="40" width="78" height="53.6"/><text x="454" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22">User B</text>
  <use href="#laptop" x="776" y="38" width="78" height="53.6"/><text x="815" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22">User C</text>
  <!-- Arrow shafts stop beneath their heads; visible tips meet the server-pool border. -->
  <g fill="none" stroke="#146b9f" stroke-width="3" marker-end="url(#arrow)">
    <path id="request-a" d="M70.5 143L395.08 305.48"/>
    <path id="request-b" d="M454.5 140V300"/>
    <path id="request-c" d="M819.5 132.5L526.4 304.89"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
    <text x="225" y="211" transform="rotate(27 225 211)">http request</text>
    <text x="421" y="213" transform="rotate(90 421 213)">http request</text>
    <text x="648" y="217" transform="rotate(-30.7 648 217)">http request</text>
  </g>

  <!-- Five servers, with the upper two partially hidden by the three foreground servers. -->
  <rect id="server-pool" x="335.5" y="311.5" width="239.5" height="231" rx="35" fill="none" stroke="#00b5d3" stroke-width="3" stroke-dasharray="9 10"/>
  <g id="server-icons" fill="#6abd25">
    <path d="M401 337Q401 332 406 332H449Q454 332 454 337V364H436Q430 364 427 367Q423 364 418 364H401Z"/>
    <path d="M462 337Q462 332 467 332H510Q515 332 515 337V364H497Q491 364 488 367Q484 364 479 364H462Z"/>
    <path d="M370 376Q370 371 375 371H419Q424 371 424 376V470H370Z"/>
    <path d="M431 376Q431 371 436 371H480Q485 371 485 376V470H431Z"/>
    <path d="M492 376Q492 371 497 371H541Q546 371 546 376V470H492Z"/>
    <path d="M410 347H445M471 347H506M379 385H415M440 385H476M501 385H537M379 445H415M440 445H476M501 445H537M379 458H415M440 458H476M501 458H537" stroke="#fefefe" stroke-width="4"/>
  </g>
  <text x="444" y="517" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">Web servers</text>

  <!-- Shared state; the reference has a vertical label and a narrower storage cylinder. -->
  <path id="fetch-state" d="M457.5 549.5V663.5" fill="none" stroke="#146b9f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="437" y="601.5" text-anchor="middle" transform="rotate(90 437 601.5)" font-family="Arial, Helvetica, sans-serif" font-size="18">fetch state</text>
  <path id="shared-storage" d="M414 697C414 689 431.5 682.5 453 682.5S492 689 492 697V769C492 778 474.5 785.5 453 785.5S414 778 414 769Z" fill="#0074bc"/>
  <ellipse cx="453" cy="695.5" rx="27.5" ry="8" fill="#fefefe"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="bold" fill="#fefefe"><text x="424" y="757">{</text><text x="461" y="757">}</text></g>
  <text x="459" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25">Shared Storage</text>
</svg>
