<svg xmlns="http://www.w3.org/2000/svg" width="874" height="216" viewBox="0 0 874 216" role="img" aria-labelledby="title desc">
  <title id="title">Message queue producer and consumer</title>
  <desc id="desc">A cluster of web servers publishes photo-processing messages to a queue. A cluster of workers consumes those messages.</desc>
  <!-- Shared five-server cluster and queue envelope, matching the PNG geometry. -->
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}</style>
    <symbol id="server-cluster" viewBox="0 0 96 80">
      <path d="M17 22V4Q17 0 21 0H42Q46 0 46 4V22ZM49 22V4Q49 0 53 0H74Q78 0 78 4V22Z" fill="#6abd25"/>
      <path d="M22 9H40M54 9H72" stroke="white" stroke-width="3"/>
      <path d="M1 79V27Q1 23 5 23H26Q30 23 30 27V79ZM33 79V27Q33 23 37 23H58Q62 23 62 27V79ZM65 79V27Q65 23 69 23H90Q94 23 94 27V79Z" fill="#6abd25"/>
      <path d="M6 31H24M6 65H24M6 72H24M38 31H56M38 65H56M38 72H56M70 31H88M70 65H88M70 72H88" stroke="white" stroke-width="3"/>
    </symbol>
    <symbol id="envelope" viewBox="0 0 47 43">
      <rect x="2.5" y="2.5" width="40" height="35" rx="1" fill="#fefefe" stroke="#0074bc" stroke-width="5"/>
      <path d="M4 5L22.5 22L41 5" fill="none" stroke="#0074bc" stroke-width="5" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="874" height="216" fill="#fefefe"/>
  <!-- Faint clipped marks at the bottom edge are present in the PNG canvas. -->
  <path d="M376 215.5H384M387 215.5H388M436 215.5H437M459 215.5H461" fill="none" stroke="#dadada" stroke-width="1"/>
  <!-- Producer cluster and its original caption. -->
  <rect x="0.5" y="12" width="127" height="134" rx="23" fill="none" stroke="#00b6cb" stroke-width="2" stroke-dasharray="7 7"/>
  <use href="#server-cluster" x="18" y="24" width="96" height="80"/>
  <text x="65" y="132" text-anchor="middle" font-size="21">Producer</text>
  <text x="71" y="183" text-anchor="middle" font-size="20">Web servers</text>
  <!-- The queue is a hollow right-pointing outline with three envelopes. -->
  <path d="M339 47H492L508 78L492 108H339Q334 108 334 103V52Q334 47 339 47Z" fill="#fefefe" stroke="#0074bc" stroke-width="3.5"/>
  <use href="#envelope" x="342" y="58" width="47" height="43"/>
  <use href="#envelope" x="393" y="58" width="47" height="43"/>
  <use href="#envelope" x="444" y="58" width="47" height="43"/>
  <text x="417" y="133" text-anchor="middle" font-size="18">queue for photo processing</text>
  <!-- Consumer cluster; five servers, and no added hyphen in the caption. -->
  <rect x="712" y="13" width="127" height="134" rx="23" fill="none" stroke="#00b6cb" stroke-width="2" stroke-dasharray="7 7"/>
  <use href="#server-cluster" x="729" y="25" width="96" height="80"/>
  <text x="774" y="133" text-anchor="middle" font-size="21">Consumer</text>
  <text x="780" y="181" text-anchor="middle" font-size="20"><tspan x="780">Photo processing</tspan><tspan x="780" dy="23">workers</tspan></text>
  <!-- Separate arrowheads meet the queue and consumer boundaries without entering them. -->
  <path id="publish-shaft" d="M128 78.5H325" stroke="#176d9c" stroke-width="2.5"/>
  <path d="M332.25 78.5L320.25 72L320.25 85Z" fill="#176d9c"/>
  <text x="224" y="69" text-anchor="middle" font-size="18">publish</text>
  <path id="consume-shaft" d="M510 79.5H701" stroke="#176d9c" stroke-width="2.5"/>
  <path d="M711 79.5L697 72.5V86.5Z" fill="#176d9c"/>
  <text x="604" y="72" text-anchor="middle" font-size="18">consume</text>
</svg>
