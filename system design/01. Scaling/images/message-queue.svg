<svg xmlns="http://www.w3.org/2000/svg" width="874" height="216" viewBox="0 0 874 216" role="img" aria-labelledby="title desc">
  <title id="title">Message queue producer and consumer</title>
  <desc id="desc">Web servers publish photo-processing jobs to a queue. Photo-processing workers consume the jobs independently.</desc>

  <!-- Reusable infrastructure icons and arrowhead. -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L11 6L0 11Z" fill="#0b78b5"/></marker>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
    <symbol id="envelope" viewBox="0 0 42 30"><rect x="1" y="1" width="40" height="28" rx="3" fill="white" stroke="#0b78b5" stroke-width="4"/><path d="M3 4L21 19L39 4" fill="none" stroke="#0b78b5" stroke-width="4"/></symbol>
  </defs>

  <rect width="874" height="216" fill="white"/>

  <!-- Producer cluster. -->
  <rect x="4" y="12" width="124" height="136" rx="28" fill="none" stroke="#09b6d2" stroke-width="3" stroke-dasharray="8 7"/>
  <use href="#server" x="20" y="46" width="36" height="63"/><use href="#server" x="50" y="24" width="36" height="63"/><use href="#server" x="78" y="46" width="36" height="63"/>
  <text x="66" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">Producer</text>
  <text x="66" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">Web servers</text>

  <!-- Queue. -->
  <path d="M334 48H490L511 78L490 108H334Z" fill="#eef8fd" stroke="#0b78b5" stroke-width="4"/>
  <use href="#envelope" x="344" y="58" width="42" height="30"/><use href="#envelope" x="394" y="58" width="42" height="30"/><use href="#envelope" x="444" y="58" width="42" height="30"/>
  <text x="422" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">queue for photo processing</text>

  <!-- Consumer cluster. -->
  <rect x="712" y="12" width="126" height="136" rx="28" fill="none" stroke="#09b6d2" stroke-width="3" stroke-dasharray="8 7"/>
  <use href="#server" x="728" y="46" width="36" height="63"/><use href="#server" x="758" y="24" width="36" height="63"/><use href="#server" x="786" y="46" width="36" height="63"/>
  <text x="775" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">Consumer</text>
  <text x="775" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">Photo-processing</text>
  <text x="775" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">workers</text>

  <!-- Publish and consume directions. -->
  <path d="M130 78H321" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="231" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">publish</text>
  <path d="M513 78H699" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="611" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">consume</text>
</svg>
