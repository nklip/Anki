<svg xmlns="http://www.w3.org/2000/svg" width="1192" height="1004" viewBox="0 0 1192 1004" role="img" aria-labelledby="title desc">
  <title id="title">Load-balanced web tier</title>
  <desc id="desc">DNS maps the public domain to one load balancer, which routes requests to two private web servers.</desc>
  <!-- Reusable native device silhouettes and the monochrome DNS globe. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 100 70"><path d="M6 55V11Q6 4 13 4H87Q94 4 94 11V55" fill="none" stroke="#000" stroke-width="5"/><rect y="60" width="100" height="9" rx="4" fill="#000"/><rect x="39" y="62" width="22" height="3" rx="1.5" fill="#fff"/></symbol>
    <symbol id="phone" viewBox="0 0 64 96"><rect x="3" y="3" width="58" height="90" rx="6" fill="none" stroke="#4d4d4d" stroke-width="6"/><path d="M4 16H60M4 80H60" stroke="#4d4d4d" stroke-width="4"/><path d="M27 9H37M29 87H35" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="server" viewBox="0 0 72 140"><path d="M0 140V9Q0 0 9 0H63Q72 0 72 9V140Z" fill="#6abd25"/><path d="M5 139V9Q5 4 10 4H63" fill="none" stroke="#88c74b" stroke-width="3"/><path d="M14 21H57M14 103H57M14 121H57" stroke="#fff" stroke-width="6"/></symbol>
    <symbol id="dns-globe" viewBox="0 0 140 136"><g fill="none" stroke="#4d4d4d" stroke-width="8"><ellipse cx="70" cy="68" rx="65" ry="63"/><path d="M19 26Q70 44 121 26M19 110Q70 92 121 110M38 47Q48 5 70 5Q92 5 102 47M38 91Q48 131 70 131Q92 131 102 91M5 68H16M124 68H135"/></g><text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="49" fill="#4d4d4d">DNS</text></symbol>
  </defs>
  <rect width="1192" height="1004" fill="#fefefe"/>
<!-- User devices and DNS lookup. -->
<rect x="529" y="21" width="634" height="274" rx="42" fill="none" stroke="#00b8d8" stroke-width="4"/>
<text x="562" y="76" font-family="Arial, sans-serif" font-size="32">User</text>
<use href="#laptop" x="677" y="94" width="102" height="74"/>
<text x="735" y="209" font-family="Arial, sans-serif" font-size="29" text-anchor="middle">Web browser</text>
<use href="#phone" x="930" y="79" width="67" height="97"/>
<text x="975" y="211" font-family="Arial, sans-serif" font-size="29" text-anchor="middle">Mobile app</text>
<use href="#dns-globe" x="156" y="92" width="144" height="138"/>
<path data-connector="true" d="M529 157L320.4 157" fill="none" stroke="#126a9e" stroke-width="4"/><path d="M302 157L326 145L322.4 157L326 169Z" fill="#126a9e"/>
<path data-connector="true" d="M230 230L230 332.1" fill="none" stroke="#126a9e" stroke-width="4"/><path d="M230 350.5L218 326.5L230 330.1L242 326.5Z" fill="#126a9e"/>
<!-- DNS table retains its capitalization and original column widths. -->
<rect x="27" y="352" width="367" height="208" fill="none" stroke="#444" stroke-width="3"/><path d="M27 454H394M231 352V560" stroke="#444" stroke-width="3"/>
<text x="37" y="411" font-family="Arial, sans-serif" font-size="25" font-weight="bold">Domain</text>
<text x="241" y="411" font-family="Arial, sans-serif" font-size="25" font-weight="bold">IP Address</text>
<text x="37" y="513" font-family="Arial, sans-serif" font-size="25">mywebsite.com</text>
<text x="241" y="513" font-family="Arial, sans-serif" font-size="25">88.88.88.1</text>
<!-- Public route is interrupted behind the centered IP annotation. -->
<path data-connector="true" d="M846 296L847 359" stroke="#126a9e" stroke-width="4"/>
<path data-connector="true" d="M847.1 395L848.63 467.454" fill="none" stroke="#126a9e" stroke-width="4"/><path d="M849 485L836.517 462.258L848.587 465.454L860.512 461.752Z" fill="#126a9e"/>
<text x="850" y="385" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Public IP: 88.88.88.1</text>
<!-- Native load-balancer silhouette and its three white branching arrows. -->
<path id="load-balancer" d="M809 485H890Q894 485 895 490L905 575Q906 583 899 584H800Q792 584 794 575L804 491Q804 485 809 485Z" fill="#0074bc"/>
<ellipse cx="847" cy="503" rx="5" ry="8" fill="#fff"/><path d="M847 508V572M847 522L827 548V534M827 548H839M847 522L868 548V534M868 548H856M847 572L840 563M847 572L854 563" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="925" y="544" font-family="Arial, sans-serif" font-size="34">Load balancer</text>
<!-- Private routes also break around their labels; arrow tips meet the pool boundary. -->
<path data-connector="true" d="M834 587L801 630M852 585L897 635" fill="none" stroke="#126a9e" stroke-width="4"/>
<path data-connector="true" d="M771 672L727.914 726.256" fill="none" stroke="#126a9e" stroke-width="4"/><path d="M717 740L722.689 715.148L729.158 724.69L739.918 728.829Z" fill="#126a9e"/>
<path data-connector="true" d="M929 672L980.073 727.126" fill="none" stroke="#126a9e" stroke-width="4"/><path d="M992 740L968.299 730.604L978.713 725.659L984.438 715.652Z" fill="#126a9e"/>
<text x="712" y="661" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Private IP: 10.0.0.1</text>
<text x="990" y="661" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Private IP: 10.0.0.2</text>
<!-- The private server pool and exact original server labels. -->
<rect x="579" y="742" width="552" height="237" rx="40" fill="none" stroke="#00b8d8" stroke-width="4" stroke-dasharray="12 12"/>
<use href="#server" x="683" y="762" width="75" height="147"/>
<text x="720" y="954" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">Server1</text>
<use href="#server" x="950" y="762" width="75" height="147"/>
<text x="995" y="952" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">Server2</text>
</svg>
