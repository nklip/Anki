<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1282" viewBox="0 0 1202 1282" role="img" aria-labelledby="title desc">
  <title id="title">Database replication architecture</title>
  <desc id="desc">Both load-balanced web servers write to the master database and read from the slave. The master and slave share the replication connector shown in the reference.</desc>
  <!-- Faithful reusable infrastructure icons from the PNG etalons. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 100 70">
      <path d="M8 54V10Q8 3 15 3H85Q92 3 92 10V54" fill="none" stroke="#111" stroke-width="4"/>
      <path d="M7 62H94" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
      <path d="M42 62H59" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="phone" viewBox="0 0 54 80">
      <rect x="3" y="3" width="48" height="74" rx="5" fill="white" stroke="#333" stroke-width="4"/>
      <path d="M4 13H50M4 66H50" stroke="#333" stroke-width="2"/>
      <path d="M24 8H30M25 71H29" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="server" viewBox="0 0 60 115">
      <path d="M7 0H53Q60 0 60 7V115H0V7Q0 0 7 0Z" fill="#6bbc24"/>
      <path d="M12 16H48M12 84H48M12 98H48" stroke="white" stroke-width="5"/>
    </symbol>
    <symbol id="stack-server" viewBox="0 0 60 115" preserveAspectRatio="none">
      <path d="M7 0H53Q60 0 60 7V115H0V7Q0 0 7 0Z" fill="#6bbc24" stroke="#e7e7e7" stroke-width="4"/>
      <path d="M12 16H48M12 84H48M12 98H48" stroke="white" stroke-width="5"/>
    </symbol>
    <symbol id="dns-globe" viewBox="0 0 104 104">
      <g fill="none" stroke="#525252" stroke-width="5">
        <path d="M52 4C20 25 20 79 52 100M52 4C84 25 84 79 52 100M12 25Q52 40 92 25M12 79Q52 64 92 79"/>
      </g>
      <rect x="3" y="34" width="98" height="37" fill="white"/>
      <circle cx="52" cy="52" r="48" fill="none" stroke="#525252" stroke-width="6"/>
      <text x="52" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#525252">DNS</text>
    </symbol>
    <symbol id="load-balancer" viewBox="0 0 114 78" preserveAspectRatio="none">
      <path d="M13 0H101L113 70Q115 78 106 78H8Q0 78 1 70Z" fill="#0074bc"/>
      <circle cx="56" cy="14" r="6" fill="white"/>
      <path d="M56 20V67M56 32L36 51M56 32L77 51M36 39V51H48M65 51H77V39M48 58L56 67L64 58" fill="none" stroke="white" stroke-width="3.5"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 180 110">
      <path d="M25 46C16 20 45 -1 73 17C82 8 91 3 103 1C112 -1 128 1 139 8C152 17 158 31 156 45C187 58 192 90 164 106C160 109 151 110 143 110H31C5 110 -6 91 3 71C7 59 14 52 25 46Z" fill="#55dfff"/>
      <path d="M103 0H141L127 25H149L89 91L104 51H83Z" fill="white"/>
    </symbol>
  </defs>
  <!-- Canvas. -->
  <rect width="1202" height="1282" fill="white"/>
  <!-- User devices and the two DNS directions. -->
  <rect x="101" y="13" width="642" height="213" rx="32" fill="white" stroke="#00b5d4" stroke-width="3.5"/>
  <text x="121" y="63" font-family="Arial, sans-serif" font-size="34">User</text>
  <use href="#laptop" x="234" y="71" width="84" height="60"/>
  <text x="296" y="167" font-family="Arial, sans-serif" font-size="29" text-anchor="middle">Web browser</text>
  <use href="#phone" x="489" y="57" width="55" height="79"/>
  <text x="518" y="170" font-family="Arial, sans-serif" font-size="29" text-anchor="middle">Mobile app</text>
  <use href="#dns-globe" x="1087" y="45" width="107" height="107"/>
  <g id="dns-request">
    <path data-connector="true" d="M749 89L1065 89.9322" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M1088 90L1063.97 100.729L1064.03 79.1293Z" fill="#16739c"/>
  </g>
  <text x="793" y="74" font-family="Arial, sans-serif" font-size="33">www.mysite.com</text>
  <g id="dns-response">
    <path data-connector="true" d="M1087 129L767 129" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M743 129L768 117.75L768 140.25Z" fill="#16739c"/>
  </g>
  <text x="793" y="171" font-family="Arial, sans-serif" font-size="33">IP address</text>
  <!-- The browser and mobile app converge on the load balancer. -->
  <g id="browser-request">
    <path data-connector="true" d="M282 227L355.616 383.102" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M365 403L345.828 386.612L364.551 377.783Z" fill="#16739c"/>
  </g>
  <text x="48" y="349" font-family="Arial, sans-serif" font-size="33">www.mysite.com</text>
  <g id="mobile-request">
    <path data-connector="true" d="M522 225L462.75 382.41" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M455 403L453.416 377.828L472.789 385.12Z" fill="#16739c"/>
  </g>
  <text x="507" y="349" font-family="Arial, sans-serif" font-size="33">api.mysite.com</text>
  <use href="#load-balancer" x="352" y="403" width="115" height="78"/>
  <text x="504" y="452" font-family="Arial, sans-serif" font-size="33">Load balancer</text>
  <!-- The web tier fans out from the same load-balancer point. -->
  <g id="balancer-to-server-1">
    <path data-connector="true" d="M408 481L285.856 609.339" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M270 626L278.722 601.169L294.369 616.061Z" fill="#16739c"/>
  </g>
  <g id="balancer-to-server-2">
    <path data-connector="true" d="M408 481L532.966 609.511" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M549 626L524.526 616.323L540.011 601.265Z" fill="#16739c"/>
  </g>
  <rect x="130" y="627" width="559" height="185" rx="32" fill="none" stroke="#00b5d4" stroke-width="3.5" stroke-dasharray="12 12"/>
  <use href="#server" x="244" y="642" width="58" height="114"/>
  <text x="273" y="799" font-family="Arial, sans-serif" font-size="33" text-anchor="middle">Server 1</text>
  <use href="#server" x="512" y="638" width="59" height="113"/>
  <text x="542" y="795" font-family="Arial, sans-serif" font-size="33" text-anchor="middle">Server 2</text>
  <text x="713" y="732" font-family="Arial, sans-serif" font-size="33">Web tier</text>
  <!-- Each server writes to the master and reads from the slave. The four shafts have deliberate gaps around their labels. -->
  <path data-connector="true" d="M270 812L204 929" fill="none" stroke="#16739c" stroke-width="4"/>
  <g id="server-1-write">
    <path data-connector="true" d="M177 977L141.651 1037.17" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M130 1057L132.845 1030.84L151.469 1041.78Z" fill="#16739c"/>
  </g>
  <text x="141" y="962" font-family="Arial, sans-serif" font-size="33">Write</text>
  <path data-connector="true" d="M550 812L352 930" fill="none" stroke="#16739c" stroke-width="4"/>
  <g id="server-2-write">
    <path data-connector="true" d="M281 976L164.761 1045.23" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M145 1057L160.093 1035.44L171.146 1054Z" fill="#16739c"/>
  </g>
  <text x="282" y="962" font-family="Arial, sans-serif" font-size="33">Write</text>
  <path data-connector="true" d="M270 812L458 931" fill="none" stroke="#16739c" stroke-width="4"/>
  <g id="server-1-read">
    <path data-connector="true" d="M521 974L629.702 1044.49" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M649 1057L622.987 1053L634.739 1034.88Z" fill="#16739c"/>
  </g>
  <text x="443" y="966" font-family="Arial, sans-serif" font-size="33">Read</text>
  <path data-connector="true" d="M550 812L610 934" fill="none" stroke="#16739c" stroke-width="4"/>
  <g id="server-2-read">
    <path data-connector="true" d="M632 980L659.821 1036.37" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M670 1057L649.694 1040.26L669.064 1030.7Z" fill="#16739c"/>
  </g>
  <text x="589" y="966" font-family="Arial, sans-serif" font-size="33">Read</text>
  <!-- Master/slave data tier and the etalon’s two-headed replication connector. -->
  <rect x="10" y="1057" width="785" height="208" rx="34" fill="none" stroke="#00b5d4" stroke-width="3.5" stroke-dasharray="12 12"/>
  <g transform="translate(75 1085) scale(0.9583333333333334 1.009090909090909)">
    <path d="M0 12C0 -4 96 -4 96 12V96C96 115 0 115 0 96Z" fill="#0074bc"/>
    <ellipse cx="48" cy="13" rx="36" ry="8" fill="white"/>
    <text x="48" y="80" font-family="Arial, sans-serif" font-size="43" text-anchor="middle" fill="white">DB</text>
  </g>
  <text x="122" y="1240" font-family="Arial, sans-serif" font-size="33" text-anchor="middle">Master DB</text>
  <g transform="translate(607 1086) scale(0.9583333333333334 1.009090909090909)">
    <path d="M0 12C0 -4 96 -4 96 12V96C96 115 0 115 0 96Z" fill="#0074bc"/>
    <ellipse cx="48" cy="13" rx="36" ry="8" fill="white"/>
    <text x="48" y="80" font-family="Arial, sans-serif" font-size="43" text-anchor="middle" fill="white">DB</text>
  </g>
  <text x="652" y="1240" font-family="Arial, sans-serif" font-size="33" text-anchor="middle">Slave DB</text>
  <g id="replication-to-slave">
    <path data-connector="true" d="M386 1152L580 1151.11" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M603 1151L579.05 1161.91L578.95 1140.31Z" fill="#16739c"/>
  </g>
  <g id="replication-to-master">
    <path data-connector="true" d="M386 1152L191 1152.89" fill="none" stroke="#16739c" stroke-width="4"/>
    <path d="M168 1153L191.95 1142.09L192.049 1163.69Z" fill="#16739c"/>
  </g>
  <text x="350" y="1135" font-family="Arial, sans-serif" font-size="33">Replicate</text>
  <text x="821" y="1183" font-family="Arial, sans-serif" font-size="33">Data tier</text>
</svg>
