<svg xmlns="http://www.w3.org/2000/svg" width="908" height="832" viewBox="0 0 908 832" role="img" aria-labelledby="title desc">
  <title id="title">Stateless web servers</title>
  <desc id="desc">Any user request can reach any web server because persistent state is stored in shared storage rather than on an individual server.</desc>

  <!-- Reusable request arrow, laptop, server, and storage icons. -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="0" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L12 6.5L0 12Z" fill="#0b78b5"/></marker>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>

  <rect width="908" height="832" fill="white"/>

  <!-- Any user can address the shared server pool. -->
  <use href="#laptop" x="21" y="35" width="100" height="64"/><text x="71" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">User A</text>
  <use href="#laptop" x="404" y="35" width="100" height="64"/><text x="454" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">User B</text>
  <use href="#laptop" x="779" y="35" width="100" height="64"/><text x="829" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">User C</text>
  <path d="M70 141L390.31 304.54" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="205" text-anchor="middle" transform="rotate(27 230 205)" font-family="Arial, sans-serif" font-size="17">HTTP request</text>
  <path d="M454 141V298" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="426" y="225" text-anchor="middle" transform="rotate(90 426 225)" font-family="Arial, sans-serif" font-size="17">HTTP request</text>
  <path d="M829 141L526.56 304.3" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="205" text-anchor="middle" transform="rotate(-27 675 205)" font-family="Arial, sans-serif" font-size="17">HTTP request</text>

  <!-- Stateless web-server pool. -->
  <rect x="334" y="311" width="242" height="234" rx="35" fill="#fbfbfb" stroke="#08b7d1" stroke-width="3" stroke-dasharray="9 7"/>
  <use href="#server" x="369" y="370" width="55" height="108"/><use href="#server" x="428" y="333" width="55" height="108"/><use href="#server" x="487" y="370" width="55" height="108"/>
  <text x="455" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="25">Web servers</text>

  <!-- State is external to every server. -->
  <path d="M455 547V662" fill="none" stroke="#0b78b5" stroke-width="3" marker-end="url(#arrow)"/><text x="431" y="615" text-anchor="end" font-family="Arial, sans-serif" font-size="17">fetch state</text>
  <path d="M405 700C405 687 428 679 455 679S505 687 505 700V765C505 778 482 786 455 786S405 778 405 765Z" fill="#0b78b5"/><ellipse cx="455" cy="700" rx="50" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/><text x="455" y="753" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="white">{ }</text>
  <text x="455" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="25">Shared storage</text>
</svg>
