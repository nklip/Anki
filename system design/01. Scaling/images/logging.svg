<svg xmlns="http://www.w3.org/2000/svg" width="846" height="1058" viewBox="0 0 846 1058" role="img" aria-labelledby="title desc">
  <title id="title">Logging, metrics, and asynchronous processing</title>
  <desc id="desc">Clients use DNS and a CDN and connect through a load balancer to a data center. Web servers access databases, caches, and NoSQL storage and send jobs through a message queue to workers. Logging, metrics, monitoring, and automation tools support the data center.</desc>
  <!-- Reusable native icons, shared with the original architecture diagrams. -->
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.label{font-size:18px}.small{font-size:16px}</style>

  <symbol id="laptop" viewBox="0 0 100 70"><path d="M6 55V11Q6 4 13 4H87Q94 4 94 11V55" fill="none" stroke="#000" stroke-width="5"/><rect y="60" width="100" height="9" rx="4" fill="#000"/><rect x="39" y="62" width="22" height="3" rx="1.5" fill="#fff"/></symbol>
  <symbol id="phone" viewBox="0 0 64 96"><rect x="3" y="3" width="58" height="90" rx="6" fill="none" stroke="#4d4d4d" stroke-width="6"/><path d="M4 16H60M4 80H60" stroke="#4d4d4d" stroke-width="4"/><path d="M27 9H37M29 87H35" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="server" viewBox="0 0 60 115">
    <path d="M7 0H53Q60 0 60 7V115H0V7Q0 0 7 0Z" fill="#6bbc24"/>
    <path d="M12 16H48M12 84H48M12 98H48" stroke="white" stroke-width="5"/>
  </symbol>
  <symbol id="dns-globe" viewBox="0 0 140 136"><g fill="none" stroke="#4d4d4d" stroke-width="8"><ellipse cx="70" cy="68" rx="65" ry="63"/><path d="M19 26Q70 44 121 26M19 110Q70 92 121 110M38 47Q48 5 70 5Q92 5 102 47M38 91Q48 131 70 131Q92 131 102 91M5 68H16M124 68H135"/></g><text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="49" style="fill:#4d4d4d">DNS</text></symbol>
  <symbol id="load-balancer" preserveAspectRatio="none" viewBox="0 0 114 78">
    <path d="M13 0H101L113 70Q115 78 106 78H8Q0 78 1 70Z" fill="#0074bc"/>
    <circle cx="56" cy="14" r="6" fill="white"/>
    <path d="M56 20V67M56 32L36 51M56 32L77 51M36 39V51H48M65 51H77V39M48 58L56 67L64 58" fill="none" stroke="white" stroke-width="3.5"/>
  </symbol>
  <symbol id="cloud" viewBox="0 0 180 110">
    <path d="M25 46C16 20 45 -1 73 17C82 8 91 3 103 1C112 -1 128 1 139 8C152 17 158 31 156 45C187 58 192 90 164 106C160 109 151 110 143 110H31C5 110 -6 91 3 71C7 59 14 52 25 46Z" fill="#55dfff"/>
    <path d="M103 0H141L127 25H149L89 91L104 51H83Z" fill="white"/>
  </symbol>

<symbol id="server-cluster" preserveAspectRatio="none" viewBox="0 0 96 80">
      <path d="M17 22V4Q17 0 21 0H42Q46 0 46 4V22ZM49 22V4Q49 0 53 0H74Q78 0 78 4V22Z" fill="#6abd25"/>
      <path d="M22 9H40M54 9H72" stroke="white" stroke-width="3"/>
      <path d="M1 79V27Q1 23 5 23H26Q30 23 30 27V79ZM33 79V27Q33 23 37 23H58Q62 23 62 27V79ZM65 79V27Q65 23 69 23H90Q94 23 94 27V79Z" fill="#6abd25"/>
      <path d="M6 31H24M6 65H24M6 72H24M38 31H56M38 65H56M38 72H56M70 31H88M70 65H88M70 72H88" stroke="white" stroke-width="3"/>
    </symbol>
    <symbol id="database" viewBox="0 0 44 61">
      <path d="M1 9V51C1 64 43 64 43 51V9Z" fill="#0074bc"/>
      <ellipse cx="22" cy="9" rx="21" ry="8" fill="#0074bc" stroke="#f0f0f0" stroke-width="3"/>
    </symbol>
    <symbol id="cache" viewBox="0 0 48 57">
      <rect x="1" y="3" width="46" height="54" rx="7" fill="#005879"/>
      <rect x="1" y="1" width="46" height="54" rx="7" fill="#0074bc"/>
      <text x="24" y="19" transform="translate(2.4 0) scale(0.9 1)" text-anchor="middle" font-family="Arial Narrow,Arial,sans-serif" font-size="15" style="font-family:Arial Narrow,Arial,sans-serif;font-weight:bold;fill:white">CACHE</text>
    </symbol>
    <symbol id="envelope" viewBox="0 0 47 37">
      <rect x="2" y="2" width="43" height="33" rx="1" fill="#f0f0f0" stroke="#0074bc" stroke-width="4"/>
      <path d="M4 5L23.5 21L43 5" fill="none" stroke="#0074bc" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
    <!-- The head extends 2 units beyond the shaft endpoint, covering its nose join. -->
    <marker id="blue-arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14L4 7Z" fill="#176d9c"/></marker>
    <marker id="green-arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#008000"/></marker>
    <marker id="purple-arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#6100a8"/></marker>
    <marker id="blue-triangle" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#176d9c"/></marker>
  </defs>
  <rect width="846" height="1058" fill="white"/>
  <!-- User devices and the two edge services. -->
  <rect x="181" y="29" width="347" height="151" rx="24" fill="white" stroke="#00b6cb" stroke-width="2"/>
  <text x="199" y="59" class="label">User</text>
  <use href="#laptop" x="262" y="70" width="56" height="41"/>
  <text x="293" y="132" text-anchor="middle" font-size="15">Web browser</text>
  <use href="#phone" x="400" y="60" width="38" height="56"/>
  <text x="426" y="134" text-anchor="middle" font-size="15">Mobile app</text>
  <use href="#dns-globe" x="31" y="63" width="80" height="77"/>
  <use href="#cloud" x="648" y="60" width="104" height="63"/>
  <text x="698" y="151" text-anchor="middle" class="label">CDN</text>
  <path d="M181 104L113 105" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M528 104H645" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <!-- Routes converge at the original balancer position; endpoints account for head projection. -->
  <path d="M272 138L315.3 241.16" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-triangle)"/>
  <path d="M414 142L364.89 241.21" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-triangle)"/>
  <text x="159" y="217" class="label">www.mysite.com</text>
  <text x="393" y="217" class="label">api.mysite.com</text>
  <use href="#load-balancer" x="309" y="243" width="62" height="57" preserveAspectRatio="none"/>
  <text x="377" y="287" class="label">Load balancer</text>
  <path d="M339 300V345" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-triangle)"/>
  <!-- Data center and its two five-server pools. -->
  <rect x="12" y="348" width="643" height="483" rx="73" fill="#f0f0f0" stroke="#00b6cb" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="40" y="386" class="small">DC1</text>
  <rect x="112" y="366" width="137" height="153" rx="22" fill="none" stroke="#00b6cb" stroke-width="2" stroke-dasharray="6 6"/>
  <use href="#server-cluster" x="131" y="380" width="104" height="91"/>
  <text x="185" y="502" text-anchor="middle" class="label">Web servers</text>
  <rect x="444" y="622" width="137" height="151" rx="22" fill="none" stroke="#00b6cb" stroke-width="2" stroke-dasharray="6 6"/>
  <use href="#server-cluster" x="463" y="636" width="103" height="91"/>
  <text x="514" y="756" text-anchor="middle" class="small">Workers</text>
  <!-- Message queue, with a straight downward consumer route as in the reference. -->
  <path d="M434 405H596L613 431L596 458H434Q429 458 429 453V410Q429 405 434 405Z" fill="none" stroke="#0074bc" stroke-width="3.5"/>
  <use href="#envelope" x="437" y="414" width="48" height="35"/>
  <use href="#envelope" x="490" y="414" width="48" height="35"/>
  <use href="#envelope" x="543" y="414" width="48" height="35"/>
  <circle cx="433" cy="475" r="10" fill="none" stroke="#111" stroke-width="1"/>
  <text x="433" y="480" text-anchor="middle" font-size="15">1</text>
  <text x="449" y="481" class="label">Message Queue</text>
  <path d="M250 442H425.25" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M506 489V613" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <!-- Three database replicas and three cache tiles, preserving the staggered stacking. -->
  <rect x="30" y="631" width="123" height="156" rx="20" fill="none" stroke="#00b6cb" stroke-width="2"/>
  <use href="#database" x="48" y="649" width="43" height="60"/>
  <use href="#database" x="70" y="663" width="43" height="60"/>
  <use href="#database" x="92" y="677" width="43" height="60"/>
  <text x="95" y="766" text-anchor="middle" class="label">Databases</text>
  <rect x="190" y="633" width="127" height="153" rx="20" fill="none" stroke="#00b6cb" stroke-width="2"/>
  <use href="#cache" x="198" y="654" width="47" height="56"/>
  <use href="#cache" x="224" y="675" width="47" height="56"/>
  <use href="#cache" x="257" y="697" width="47" height="56"/>
  <text x="252" y="778" text-anchor="middle" class="label">Caches</text>
  <path d="M177 523L93.2 628.4" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M182 524L251.9 630.3" fill="none" stroke="#008000" stroke-width="2" marker-end="url(#green-arrow)"/>
  <!-- The NoSQL write crosses the queue's vertical shaft, but stays clear of every label. -->
  <path d="M182 520L751 606.7" fill="none" stroke="#6100a8" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <path d="M742 618C742 602 798 602 798 618V669C798 685 742 685 742 669Z" fill="#0074bc"/>
  <ellipse cx="770" cy="616" rx="20" ry="6" fill="white"/>
  <text x="770" y="664" text-anchor="middle" font-size="36" font-weight="bold" style="fill:white">{ }</text>
  <text x="770" y="707" text-anchor="middle" class="label">NoSQL</text>
  <!-- Operations tools connect upward to the data-center boundary. -->
  <path d="M275 887V833" fill="none" stroke="#176d9c" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <rect x="152" y="888" width="247" height="124" rx="21" fill="none" stroke="#6100a8" stroke-width="2"/>
  <rect x="175" y="900" width="92" height="42" rx="6" fill="none" stroke="#6100a8" stroke-width="2"/>
  <rect x="280" y="900" width="92" height="42" rx="6" fill="none" stroke="#6100a8" stroke-width="2"/>
  <rect x="175" y="952" width="92" height="42" rx="6" fill="none" stroke="#6100a8" stroke-width="2"/>
  <rect x="280" y="952" width="92" height="42" rx="6" fill="none" stroke="#6100a8" stroke-width="2"/>
  <text x="221" y="928" text-anchor="middle" font-size="15">Logging</text>
  <text x="326" y="928" text-anchor="middle" font-size="15">Metrics</text>
  <text x="221" y="980" text-anchor="middle" font-size="15">Monitoring</text>
  <text x="326" y="980" text-anchor="middle" font-size="15">Automation</text>
  <circle cx="210" cy="1040" r="10" fill="none" stroke="#111" stroke-width="1"/>
  <text x="210" y="1045" text-anchor="middle" font-size="15">2</text>
  <text x="228" y="1046" class="label">Tools</text>
</svg>
