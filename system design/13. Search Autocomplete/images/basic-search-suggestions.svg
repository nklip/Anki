<svg xmlns="http://www.w3.org/2000/svg" width="664" height="508" viewBox="0 0 664 508" role="img" aria-labelledby="title desc">
  <title id="title">Basic search suggestions</title>
  <desc id="desc">Typing the prefix tw displays five ranked autocomplete suggestions: twitter, twitch, twilight, twin peak, and twitch prime.</desc>
  <!-- Search field and suggestion list share one aligned panel. -->
  <defs>
    <style>.ui{font-family:Arial,Helvetica,sans-serif;fill:#111}.entry{font-size:31px}.suggestion{font-size:31px}.match{font-weight:700}</style>
  </defs>
  <rect width="664" height="508" fill="#fff"/>
  <!-- Active input field. -->
  <rect x="34" y="27" width="586" height="78" fill="#fafafa" stroke="#6aa9d4" stroke-width="2"/>
  <text class="ui entry" x="55" y="77">tw</text><path d="M88 48 V84" stroke="#111" stroke-width="2"/>
  <!-- Ranked suggestions; gray rules separate selectable rows. -->
  <g fill="#fff" stroke="#c9c9c9" stroke-width="1.5">
    <rect x="35" y="105" width="584" height="77"/><rect x="35" y="182" width="584" height="77"/><rect x="35" y="259" width="584" height="77"/><rect x="35" y="336" width="584" height="77"/><rect x="35" y="413" width="584" height="77"/>
  </g>
  <g class="ui suggestion">
    <text class="match" x="55" y="154">twitter</text>
    <text class="match" x="55" y="231">twitch</text>
    <text class="match" x="55" y="308">twilight</text>
    <text class="match" x="55" y="385">twin</text><text x="122" y="385">peak</text>
    <text class="match" x="55" y="462">twitch</text><text x="165" y="462">prime</text>
  </g>
</svg>
