<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="1018" viewBox="0 0 1466 1018" role="img" aria-labelledby="title desc">
  <title id="title">Search query frequency table</title>
  <desc id="desc">A two-column table ranks eight search queries by frequency, from Twitter at 35 to twin peak sf at 8.</desc>
  <!-- Table typography and grid. -->
  <defs><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:39px}.head{font-weight:700}</style></defs>
  <rect width="1466" height="1018" fill="#fff"/>
  <!-- Outer boundary, column divider, and evenly spaced rows. -->
  <g fill="none" stroke="#111" stroke-width="2">
    <rect x="19" y="23" width="1425" height="974"/>
    <path d="M731 23 V997 M19 132 H1444 M19 240 H1444 M19 348 H1444 M19 456 H1444 M19 564 H1444 M19 672 H1444 M19 780 H1444 M19 888 H1444"/>
  </g>
  <!-- Column headers. -->
  <text class="t head" x="36" y="75">Query</text><text class="t head" x="747" y="75">Frequency</text>
  <!-- Query rows preserve the source capitalization and ordering. -->
  <g class="t">
    <text x="36" y="184">Twitter</text><text x="747" y="184">35</text>
    <text x="36" y="292">twitch</text><text x="747" y="292">29</text>
    <text x="36" y="400">twilight</text><text x="747" y="400">25</text>
    <text x="36" y="508">twin peak</text><text x="747" y="508">21</text>
    <text x="36" y="616">twitch prime</text><text x="747" y="616">18</text>
    <text x="36" y="724">twitter search</text><text x="747" y="724">14</text>
    <text x="36" y="832">twillo</text><text x="747" y="832">10</text>
    <text x="36" y="940">twin peak sf</text><text x="747" y="940">8</text>
  </g>
</svg>
