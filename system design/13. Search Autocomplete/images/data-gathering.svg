<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="468" viewBox="0 0 1466 468" role="img" aria-labelledby="title desc">
  <title id="title">Incremental query frequency gathering</title>
  <desc id="desc">Five snapshots show an initially empty frequency table updated by the queries twitch, twitter, twitter, and twillo.</desc>
  <!-- Shared table styles keep each time step directly comparable. -->
  <defs><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:25px}.head{font-weight:700}.grid{fill:#fff;stroke:#333;stroke-width:1.4}</style></defs>
  <rect width="1466" height="468" fill="#fff"/>
  <!-- Dashed dividers mark successive query events. -->
  <g stroke="#111" stroke-width="1.6" stroke-dasharray="5 6"><path d="M284 12 V452"/><path d="M576 12 V452"/><path d="M877 12 V452"/><path d="M1159 12 V452"/></g>
  <!-- Snapshot 0: empty frequency table. -->
  <g><rect class="grid" x="11" y="69" width="247" height="112"/><path d="M101 69 V181 M11 124 H258" stroke="#555" stroke-width="1.2"/><text class="t head" x="19" y="106">Query</text><text class="t head" x="112" y="106">Frequency</text></g>
  <!-- Snapshot 1: twitch appears once. -->
  <text class="t" x="362" y="43">query: twitch</text><g><rect class="grid" x="311" y="69" width="247" height="112"/><path d="M401 69 V181 M311 124 H558" stroke="#555" stroke-width="1.2"/><text class="t head" x="319" y="106">Query</text><text class="t head" x="412" y="106">Frequency</text><text class="t" x="322" y="162">twitch</text><text class="t" x="475" y="162">1</text></g>
  <!-- Snapshot 2: twitter is added. -->
  <text class="t" x="679" y="43">query: twitter</text><g><rect class="grid" x="603" y="69" width="246" height="168"/><path d="M692 69 V237 M603 124 H849 M603 181 H849" stroke="#555" stroke-width="1.2"/><text class="t head" x="611" y="106">Query</text><text class="t head" x="703" y="106">Frequency</text><text class="t" x="614" y="162">twitch</text><text class="t" x="766" y="162">1</text><text class="t" x="614" y="218">twitter</text><text class="t" x="766" y="218">1</text></g>
  <!-- Snapshot 3: the twitter counter increments. -->
  <text class="t" x="959" y="43">query: twitter</text><g><rect class="grid" x="892" y="69" width="247" height="224"/><path d="M982 69 V293 M892 124 H1139 M892 218 H1139" stroke="#555" stroke-width="1.2"/><text class="t head" x="900" y="113">Query</text><text class="t head" x="994" y="113">Frequency</text><text class="t" x="904" y="189">twitch</text><text class="t" x="1057" y="189">1</text><text class="t" x="904" y="264">twitter</text><text class="t" x="1057" y="264">2</text></g>
  <!-- Snapshot 4: twillo becomes a third key. -->
  <text class="t" x="1275" y="43">query: twillo</text><g><rect class="grid" x="1184" y="69" width="247" height="281"/><path d="M1274 69 V350 M1184 124 H1431 M1184 199 H1431 M1184 274 H1431" stroke="#555" stroke-width="1.2"/><text class="t head" x="1192" y="113">Query</text><text class="t head" x="1285" y="113">Frequency</text><text class="t" x="1196" y="189">twitch</text><text class="t" x="1349" y="189">1</text><text class="t" x="1196" y="264">twitter</text><text class="t" x="1349" y="264">2</text><text class="t" x="1196" y="339">twillo</text><text class="t" x="1349" y="339">1</text></g>
</svg>
