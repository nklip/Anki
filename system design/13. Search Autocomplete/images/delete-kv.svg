<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="306" viewBox="0 0 1296 306" role="img" aria-labelledby="title desc">
  <title id="title">Filtering deleted autocomplete entries</title>
  <desc id="desc">Trie cache results pass through a filter layer before reaching API servers, removing deleted or otherwise disallowed key-value entries.</desc>
  <!-- Reusable cache and API server icons. -->
  <defs>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker>
    <symbol id="servers" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#65c515"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#65c515"/><g fill="#65c515"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34 H38 M12 71 H38 M52 34 H78 M52 71 H78 M92 34 H118 M92 71 H118 M39 11 H61 M78 11 H100" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="cache" viewBox="0 0 170 130"><g fill="#087ab9" stroke="#075a88" stroke-width="2"><rect x="8" y="8" width="92" height="70" rx="9"/><rect x="47" y="38" width="92" height="70" rx="9"/><rect x="87" y="68" width="75" height="58" rx="9"/></g><g fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18"><text x="18" y="35">CACHE</text><text x="58" y="65">CACHE</text><text x="92" y="96">CACHE</text></g></symbol>
    <style>.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.group{fill:#fff;stroke:#08b4cf;stroke-width:3;stroke-dasharray:10 8}.flow{fill:none;stroke:#1677b8;stroke-width:2.4;marker-end:url(#blue-arrow)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:30px;text-anchor:middle}</style>
  </defs>
  <rect width="1296" height="306" fill="#fff"/>
  <!-- Results move right-to-left from cache through the filter to the API tier. -->
  <rect class="group" x="7" y="30" width="211" height="236" rx="31"/><use href="#servers" x="44" y="51" width="130" height="100"/><text class="t" x="112.5" y="243">API servers</text>
  <path class="flow" d="M570 147 H218"/>
  <!-- Funnel symbol keeps the filter label clear below it. -->
  <path d="M586 78 H749 L685 148 V202 L650 226 V148 Z" fill="#fff" stroke="#231f20" stroke-width="11" stroke-linejoin="round"/><text class="t" x="667.5" y="278">Filter Layer</text>
  <path class="flow" d="M1048 147 H749"/>
  <rect class="box" x="1048" y="11" width="224" height="268" rx="34"/><use href="#cache" x="1074" y="42" width="170" height="130"/><text class="t" x="1160" y="264">Trie Cache</text>
</svg>
