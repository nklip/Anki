<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="762" viewBox="0 0 1298 762" role="img" aria-labelledby="title desc">
  <title id="title">Trie prefixes stored in a key-value database</title>
  <desc id="desc">A b-prefix trie caches top completions in each node. Dotted arrows map the prefixes b, be, bee, bes, beer, and best to rows in a key-value table.</desc>
  <!-- Tree nodes, cached recommendation groups, and solid hierarchy arrows. -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#111"/></marker>
    <style>.node{fill:#fff;stroke:#111;stroke-width:1.6}.terminal{fill:#fff;stroke:#55afa4;stroke-width:1.7}.cache{fill:none;stroke:#55afa4;stroke-width:3;stroke-dasharray:10 9}.edge{fill:none;stroke:#111;stroke-width:1.6;marker-end:url(#arrow)}.map{fill:none;stroke:#111;stroke-width:1.5;stroke-dasharray:5 5}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:22px;text-anchor:middle}.list{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:20px;font-weight:700;text-anchor:middle}.compact-list{font-size:18px}.table{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:21px}</style>
  </defs>
  <rect width="1298" height="762" fill="#fff"/>
  <!-- Prefix tree and cached top completions. -->
  <rect class="node" x="484" y="75" width="129" height="65" rx="10"/><path class="edge" d="M665 107 H613"/><text class="t" x="677" y="115" text-anchor="start">root</text>
  <path class="edge" d="M548.5 140 V228"/>
  <rect class="cache" x="176" y="219" width="454" height="85" rx="16"/><text class="list" x="347" y="258">[be: 15, bee: 20,</text><text class="list" x="347" y="283">beer: 10, best: 35]</text><rect class="node" x="484" y="228" width="129" height="65" rx="10"/><text class="t" x="548.5" y="269">b</text>
  <path class="edge" d="M548.5 293 V365"/>
  <rect class="cache" x="201" y="355" width="430" height="85" rx="16"/><text class="list" x="350" y="394">[be: 15, bee: 20,</text><text class="list" x="350" y="419">beer: 10, best: 35]</text><rect class="node" x="484" y="365" width="129" height="65" rx="10"/><text class="t" x="548.5" y="406">be: 15</text>
  <path class="edge" d="M548.5 430 L277 544"/><path class="edge" d="M548.5 430 V544"/>
  <rect class="cache" x="4" y="534" width="357" height="84" rx="16"/><text class="list" x="104" y="583">[bee: 20, beer, 10]</text><rect class="terminal" x="213" y="544" width="129" height="65" rx="10"/><text class="t" x="277.5" y="585">bee: 20</text>
  <rect class="cache" x="376" y="534" width="255" height="84" rx="16"/><text class="list compact-list" x="428" y="583">[best: 35]</text><rect class="node" x="484" y="544" width="129" height="65" rx="10"/><text class="t" x="548.5" y="585">bes</text>
  <path class="edge" d="M277.5 609 V672"/><path class="edge" d="M548.5 609 V672"/>
  <rect class="terminal" x="213" y="672" width="129" height="65" rx="10"/><text class="t" x="277.5" y="713">beer: 10</text><rect class="terminal" x="484" y="672" width="129" height="65" rx="10"/><text class="t" x="548.5" y="713">best: 35</text>
  <!-- Key-value table. -->
  <g fill="#fff" stroke="#333" stroke-width="1.4"><rect x="858" y="98" width="390" height="630"/><path d="M946 98 V728 M858 182 H1248 M858 288 H1248 M858 396 H1248 M858 478 H1248 M858 562 H1248 M858 644 H1248"/></g>
  <text class="table" x="880" y="148" font-weight="700">Key</text><text class="table" x="1065" y="148" font-weight="700">Value</text>
  <g class="table" text-anchor="middle"><text x="902" y="243">b</text><text x="902" y="352">be</text><text x="902" y="442">bee</text><text x="902" y="526">bes</text><text x="902" y="609">beer</text><text x="902" y="692">best</text></g>
  <g class="table" text-anchor="middle"><text x="1097" y="229">[be: 15, bee: 20,</text><text x="1097" y="255">beer: 10, best: 35]</text><text x="1097" y="337">[be: 15, bee: 20,</text><text x="1097" y="363">beer: 10, best: 35]</text><text x="1097" y="450">[bee: 20, beer: 10]</text><text x="1097" y="534">[best: 35]</text><text x="1097" y="617">[beer: 10]</text><text x="1097" y="700">[best: 35]</text></g>
  <!-- Dotted mapping shafts terminate in separate heads at the table boundary. -->
  <g class="map"><path d="M630 261 L846 236"/><path d="M631 398 L846 344"/><path d="M361 576 L846 448"/><path d="M631 576 L846 524"/><path d="M342 704 L846 608"/><path d="M613 704 L846 690"/></g>
  <g fill="#111"><path d="M846 230 L858 236 L846 242 Z"/><path d="M846 338 L858 344 L846 350 Z"/><path d="M846 442 L858 448 L846 454 Z"/><path d="M846 518 L858 524 L846 530 Z"/><path d="M846 602 L858 608 L846 614 Z"/><path d="M846 684 L858 690 L846 696 Z"/></g>
</svg>
