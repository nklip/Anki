<svg xmlns="http://www.w3.org/2000/svg" width="764" height="1098" viewBox="0 0 764 1098" role="img" aria-labelledby="title desc">
  <title id="title">Location service architecture</title>
  <desc id="desc">A mobile user connects through a load balancer to the location service and user location database.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2.5}.arrow{stroke:#000;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect id="background" width="764" height="1098" fill="#fff"/>
  <!-- Client -->
  <text x="374" y="59" font-size="40" text-anchor="middle">Mobile User</text>
  <g id="phone"><rect x="342" y="70" width="65" height="111" rx="12"/><rect x="351" y="83" width="47" height="71" fill="#fff"/><circle cx="374.5" cy="168" r="8" fill="#fff"/></g>
  <!-- Request path -->
  <path class="arrow" d="M374 181V334"/>
  <rect id="load-balancer" class="box" x="198" y="338" width="353" height="117"/>
  <text x="374" y="410" font-size="40" text-anchor="middle">Load Balancer</text>
  <path class="arrow" d="M374 455V608"/>
  <rect id="location-service" class="box" x="198" y="612" width="353" height="117"/>
  <text x="374" y="663" font-size="40" text-anchor="middle"><tspan x="374">Location</tspan><tspan x="374" dy="47">Service</tspan></text>
  <path class="arrow" d="M374 729V884"/>
  <!-- Database -->
  <g id="user-location-db" fill="#fff" stroke="#000" stroke-width="2.5"><path d="M305 902v110c0 15 31 27 69 27s69-12 69-27V902"/><ellipse cx="374" cy="902" rx="69" ry="16"/></g>
  <text x="374" y="1067" font-size="40" text-anchor="middle">User Location DB</text>
</svg>
