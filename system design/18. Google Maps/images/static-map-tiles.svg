<svg xmlns="http://www.w3.org/2000/svg" width="910" height="896" viewBox="0 0 910 896" role="img" aria-labelledby="title desc">
  <title id="title">Static map tile delivery</title>
  <desc id="desc">Precomputed map images at the origin are delivered through a CDN to a mobile user.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.db{fill:#fff;stroke:#000;stroke-width:2}</style></defs>
  <rect id="background" width="910" height="896" fill="#fff"/>
  <!-- Mobile client -->
  <text x="426" y="46" font-size="36" text-anchor="middle">Mobile User</text>
  <g id="phone"><rect x="401" y="55" width="51" height="88" rx="9"/><rect x="408" y="65" width="37" height="57" fill="#fff"/><circle cx="426.5" cy="133" r="7" fill="#fff"/></g>
  <path class="arrow" d="M426 143V355"/>
  <!-- CDN delivery point -->
  <g id="cdn-cloud" fill="#000"><circle cx="380" cy="427" r="43"/><circle cx="426" cy="398" r="48"/><circle cx="475" cy="432" r="40"/><rect x="339" y="424" width="174" height="51" rx="26"/></g><text x="528" y="427" font-size="36">CDN</text>
  <path class="arrow" d="M426 690V478"/>
  <!-- Precomputed tile origin -->
  <g id="origin-db" class="db"><path d="M371 706v76c0 12 25 21 55 21s55-9 55-21v-76"/><ellipse cx="426" cy="706" rx="55" ry="14"/></g>
  <text x="426" y="834" font-size="35" text-anchor="middle"><tspan x="426">Precomputed Map Images</tspan><tspan x="426" dy="41">(Origin)</tspan></text>
</svg>
