<svg xmlns="http://www.w3.org/2000/svg" width="582" height="878" viewBox="0 0 582 878" role="img" aria-labelledby="title desc">
  <title id="title">Location service data flow</title>
  <desc id="desc">A mobile user sends location data through a load balancer and location service into the user location database.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.arrow{stroke:#000;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect id="background" width="582" height="878" fill="#fff"/>
  <!-- Client -->
  <text x="292" y="42" font-size="32" text-anchor="middle">Mobile User</text>
  <g id="phone"><rect x="266" y="50" width="52" height="88" rx="9"/><rect x="273" y="60" width="38" height="57" fill="#fff"/><circle cx="292" cy="128" r="7" fill="#fff"/></g>
  <path class="arrow" d="M292 138V260"/>
  <!-- Request path -->
  <rect id="load-balancer" class="box" x="150" y="264" width="283" height="94"/>
  <text x="292" y="323" font-size="32" text-anchor="middle">Load Balancer</text>
  <path class="arrow" d="M292 358V480"/>
  <rect id="location-service" class="box" x="150" y="484" width="283" height="95"/>
  <text x="292" y="525" font-size="32" text-anchor="middle"><tspan x="292">Location</tspan><tspan x="292" dy="37">Service</tspan></text>
  <path class="arrow" d="M292 579V700"/>
  <!-- Persistent location store -->
  <g id="user-location-db" fill="#fff" stroke="#000" stroke-width="2"><path d="M237 716v86c0 12 25 21 55 21s55-9 55-21v-86"/><ellipse cx="292" cy="716" rx="55" ry="13"/></g>
  <text x="292" y="847" font-size="32" text-anchor="middle">User Location DB</text>
</svg>
