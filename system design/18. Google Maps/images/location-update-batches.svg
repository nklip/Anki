<svg xmlns="http://www.w3.org/2000/svg" width="1492" height="438" viewBox="0 0 1492 438" role="img" aria-labelledby="title desc">
  <title id="title">Client location update batches</title>
  <desc id="desc">The client groups location updates into sequential fifteen-second batches.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.frame{fill:#fff;stroke:#000;stroke-width:2}.outer{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:10 8}.tick{stroke:#000;stroke-width:2}.measure{stroke:#000;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style></defs>
  <rect id="background" width="1492" height="438" fill="#fff"/>
  <rect id="client" class="outer" x="30" y="25" width="1435" height="388"/>
  <text x="746" y="70" font-size="34" text-anchor="middle">Client</text>
  <!-- Batches -->
  <g id="batch-three"><rect class="frame" x="78" y="111" width="422" height="196"/><text x="289" y="150" font-size="34" text-anchor="middle">Batch 3</text><rect class="frame" x="105" y="181" width="73" height="95"/><rect class="frame" x="203" y="181" width="73" height="95"/><rect class="frame" x="301" y="181" width="73" height="95"/><rect class="frame" x="399" y="181" width="73" height="95"/><text x="141.5" y="221" font-size="34" text-anchor="middle"><tspan x="141.5">loc</tspan><tspan x="141.5" dy="37">45</tspan></text><text x="239.5" y="240" font-size="34" text-anchor="middle">…</text><text x="337.5" y="221" font-size="34" text-anchor="middle"><tspan x="337.5">loc</tspan><tspan x="337.5" dy="37">32</tspan></text><text x="435.5" y="221" font-size="34" text-anchor="middle"><tspan x="435.5">loc</tspan><tspan x="435.5" dy="37">31</tspan></text></g>
  <g id="batch-two"><rect class="frame" x="536" y="111" width="422" height="196"/><text x="747" y="150" font-size="34" text-anchor="middle">Batch 2</text><rect class="frame" x="563" y="181" width="73" height="95"/><rect class="frame" x="661" y="181" width="73" height="95"/><rect class="frame" x="759" y="181" width="73" height="95"/><rect class="frame" x="857" y="181" width="73" height="95"/><text x="599.5" y="221" font-size="34" text-anchor="middle"><tspan x="599.5">loc</tspan><tspan x="599.5" dy="37">30</tspan></text><text x="697.5" y="240" font-size="34" text-anchor="middle">…</text><text x="795.5" y="221" font-size="34" text-anchor="middle"><tspan x="795.5">loc</tspan><tspan x="795.5" dy="37">17</tspan></text><text x="893.5" y="221" font-size="34" text-anchor="middle"><tspan x="893.5">loc</tspan><tspan x="893.5" dy="37">16</tspan></text></g>
  <g id="batch-one"><rect class="frame" x="994" y="111" width="422" height="196"/><text x="1205" y="150" font-size="34" text-anchor="middle">Batch 1</text><rect class="frame" x="1021" y="181" width="73" height="95"/><rect class="frame" x="1119" y="181" width="73" height="95"/><rect class="frame" x="1217" y="181" width="73" height="95"/><rect class="frame" x="1315" y="181" width="73" height="95"/><text x="1057.5" y="221" font-size="34" text-anchor="middle"><tspan x="1057.5">loc</tspan><tspan x="1057.5" dy="37">15</tspan></text><text x="1155.5" y="240" font-size="34" text-anchor="middle">…</text><text x="1253.5" y="221" font-size="34" text-anchor="middle"><tspan x="1253.5">loc</tspan><tspan x="1253.5" dy="37">2</tspan></text><text x="1351.5" y="221" font-size="34" text-anchor="middle"><tspan x="1351.5">loc</tspan><tspan x="1351.5" dy="37">1</tspan></text></g>
  <!-- Fifteen-second windows -->
  <g id="batch-durations"><path class="measure" d="M82 347H497"/><path class="measure" d="M540 347H955"/><path class="measure" d="M998 347H1413"/><path class="tick" d="M78 325V370M500 325V370M536 325V370M958 325V370M994 325V370M1416 325V370"/><g fill="#fff"><rect x="254" y="326" width="70" height="42"/><rect x="712" y="326" width="70" height="42"/><rect x="1170" y="326" width="70" height="42"/></g><text x="289" y="359" font-size="34" text-anchor="middle">15s</text><text x="747" y="359" font-size="34" text-anchor="middle">15s</text><text x="1205" y="359" font-size="34" text-anchor="middle">15s</text></g>
</svg>
