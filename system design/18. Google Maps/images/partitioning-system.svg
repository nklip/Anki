<svg xmlns="http://www.w3.org/2000/svg" width="792" height="760" viewBox="0 0 792 760" role="img" aria-labelledby="title desc">
  <title id="title">Geographic partitioning by latitude and longitude</title>
  <desc id="desc">A globe grid illustrates a point at 40 degrees north latitude and 70 degrees east longitude.</desc>
  <defs><clipPath id="globe-clip"><circle cx="396" cy="380" r="354"/></clipPath><style>text{font-family:Arial,Helvetica,sans-serif}.grid{fill:none;stroke:#438ed8;stroke-width:3}.axis{fill:none;stroke:#f20b62;stroke-width:6}.edge{fill:none;stroke:#111;stroke-width:3}</style></defs>
  <rect id="background" width="792" height="760" fill="#fff"/>
  <!-- Globe grid -->
  <g id="globe" clip-path="url(#globe-clip)">
    <circle cx="396" cy="380" r="354" fill="#fff"/>
    <g id="longitude-grid" class="grid">
      <ellipse cx="396" cy="380" rx="55" ry="354"/><ellipse cx="396" cy="380" rx="105" ry="354"/><ellipse cx="396" cy="380" rx="165" ry="354"/><ellipse cx="396" cy="380" rx="230" ry="354"/><ellipse cx="396" cy="380" rx="300" ry="354"/>
      <ellipse cx="396" cy="380" rx="55" ry="354" transform="rotate(30 396 380)"/><ellipse cx="396" cy="380" rx="105" ry="354" transform="rotate(30 396 380)"/><ellipse cx="396" cy="380" rx="165" ry="354" transform="rotate(30 396 380)"/><ellipse cx="396" cy="380" rx="230" ry="354" transform="rotate(30 396 380)"/><ellipse cx="396" cy="380" rx="300" ry="354" transform="rotate(30 396 380)"/>
      <ellipse cx="396" cy="380" rx="55" ry="354" transform="rotate(-30 396 380)"/><ellipse cx="396" cy="380" rx="105" ry="354" transform="rotate(-30 396 380)"/><ellipse cx="396" cy="380" rx="165" ry="354" transform="rotate(-30 396 380)"/><ellipse cx="396" cy="380" rx="230" ry="354" transform="rotate(-30 396 380)"/><ellipse cx="396" cy="380" rx="300" ry="354" transform="rotate(-30 396 380)"/>
    </g>
    <g id="latitude-grid" class="grid"><ellipse cx="396" cy="125" rx="245" ry="55"/><ellipse cx="396" cy="205" rx="310" ry="87"/><ellipse cx="396" cy="295" rx="345" ry="112"/><ellipse cx="396" cy="380" rx="354" ry="121"/><ellipse cx="396" cy="465" rx="345" ry="112"/><ellipse cx="396" cy="555" rx="310" ry="87"/><ellipse cx="396" cy="635" rx="245" ry="55"/></g>
    <ellipse id="equator" class="axis" cx="396" cy="380" rx="354" ry="229"/>
    <path id="longitude-slice" d="M404 82 198 578Q396 677 632 579Z" fill="#ffffe6" fill-opacity=".88" stroke="#111" stroke-width="3"/>
    <path d="M404 82 407 378 198 578M407 378 632 579" class="edge"/>
  </g>
  <circle cx="396" cy="380" r="354" class="edge"/>
  <!-- Coordinates -->
  <circle cx="407" cy="378" r="10"/><circle cx="583" cy="329" r="10"/>
  <path d="M417 376 575 331" fill="none" stroke="#ff9800" stroke-width="6"/>
  <path d="M365 414A61 61 0 0 0 463 374" class="edge"/>
  <text x="493" y="409" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#438ed8">40°N Lat</text>
  <text x="350" y="480" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#438ed8">70°E Long</text>
</svg>
