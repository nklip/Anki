<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="760" viewBox="0 0 792 760" role="img" aria-labelledby="title desc">
  <title id="title">Geographic partitioning by latitude and longitude</title>
  <desc id="desc">A blue latitude–longitude grid surrounds a cutaway globe. The magenta equator is dashed behind the globe and solid in front. A shaded reference meridian and a pale cutaway show a point at 40 degrees north latitude and 70 degrees east longitude, with separate angle arcs and an orange radius to the point.</desc>
  <!-- Shared palette and the original 792 × 760 reference canvas. -->
  <defs>
    <clipPath id="globe-clip"><circle cx="397.63" cy="380.61" r="356.06"/></clipPath>
    <style>
      .grid{fill:none;stroke:#529bdb;stroke-width:4.5}
      .latitude-line{stroke-width:2.8}
      .edge{fill:none;stroke:#101310;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .equator{fill:none;stroke:#f30b63;stroke-width:7;stroke-linecap:butt}
      .coordinate-label{font-family:Arial,Helvetica,sans-serif;font-size:26px;fill:#5799cd;text-anchor:start}
    </style>
  </defs>
  <rect id="background" width="792" height="760" fill="#fff"/>

  <!-- Both hemispheres remain visible through the wire globe; the cutaway overlays this grid. -->
  <g id="globe" clip-path="url(#globe-clip)">
    <!-- Projected meridians share the north and south poles, at (402,83) and (398,645). -->
    <g id="longitude-grid" class="grid">
      <ellipse id="longitude-0" cx="399.576" cy="363.984" rx="349.424" ry="280.660" transform="rotate(-174.805 399.576 363.984)"/>
      <ellipse id="longitude-1" cx="395.721" cy="364.294" rx="350.821" ry="278.794" transform="rotate(168.444 395.721 364.294)"/>
      <ellipse id="longitude-2" cx="391.919" cy="365.443" rx="351.065" ry="268.454" transform="rotate(153.019 391.919 365.443)"/>
      <ellipse id="longitude-3" cx="389.049" cy="367.279" rx="351.488" ry="250.282" transform="rotate(139.935 389.049 367.279)"/>
      <ellipse id="longitude-4" cx="387.767" cy="369.539" rx="352.681" ry="223.417" transform="rotate(-51.327 387.767 369.539)"/>
      <ellipse id="longitude-5" cx="387.002" cy="372.387" rx="352.911" ry="190.611" transform="rotate(-60.538 387.002 372.387)"/>
      <ellipse id="longitude-6" cx="387.755" cy="375.117" rx="350.994" ry="153.163" transform="rotate(-68.436 387.755 375.117)"/>
      <ellipse id="longitude-7" cx="390.813" cy="377.422" rx="353.471" ry="106.236" transform="rotate(-75.769 390.813 377.422)"/>
      <ellipse id="longitude-8" cx="394.393" cy="379.368" rx="353.419" ry="59.326" transform="rotate(-82.185 394.393 379.368)"/>
      <ellipse id="longitude-9" cx="398.985" cy="375.953" rx="349.477" ry="12.958" transform="rotate(-88.028 398.985 375.953)"/>
      <ellipse id="longitude-10" cx="403.521" cy="379.776" rx="353.231" ry="38.821" transform="rotate(-94.386 403.521 379.776)"/>
      <ellipse id="longitude-11" cx="408.039" cy="379.133" rx="353.139" ry="87.265" transform="rotate(-100.698 408.039 379.133)"/>
      <ellipse id="longitude-12" cx="408.657" cy="373.875" rx="349.572" ry="131.322" transform="rotate(-106.973 408.657 373.875)"/>
      <ellipse id="longitude-13" cx="411.736" cy="373.141" rx="349.466" ry="172.036" transform="rotate(-114.194 411.736 373.141)"/>
      <ellipse id="longitude-14" cx="414.180" cy="371.824" rx="352.764" ry="209.204" transform="rotate(-123.420 414.180 371.824)"/>
      <ellipse id="longitude-15" cx="412.933" cy="369.000" rx="352.403" ry="238.180" transform="rotate(-133.395 412.933 369.000)"/>
      <ellipse id="longitude-16" cx="411.659" cy="366.837" rx="349.690" ry="261.377" transform="rotate(-145.880 411.659 366.837)"/>
      <ellipse id="longitude-17" cx="406.990" cy="364.956" rx="352.246" ry="274.795" transform="rotate(-159.974 406.990 364.956)"/>
    </g>
    <!-- Latitude circles and the two compact polar rings; equator is drawn separately. -->
    <g id="latitude-grid" class="grid latitude-line">
      <ellipse id="latitude-0" cx="400.761" cy="640.338" rx="56.490" ry="37.564" transform="rotate(179.932 400.761 640.338)"/>
      <ellipse id="latitude-1" cx="400.749" cy="630.510" rx="113.105" ry="74.978" transform="rotate(179.932 400.749 630.510)"/>
      <ellipse id="latitude-2" cx="400.729" cy="614.113" rx="166.802" ry="110.002" transform="rotate(179.932 400.729 614.113)"/>
      <ellipse id="latitude-3" cx="400.702" cy="591.324" rx="216.135" ry="141.513" transform="rotate(179.932 400.702 591.324)"/>
      <ellipse id="latitude-4" cx="400.667" cy="562.433" rx="259.705" ry="168.492" transform="rotate(179.932 400.667 562.433)"/>
      <ellipse id="latitude-5" cx="400.625" cy="527.872" rx="296.188" ry="190.069" transform="rotate(179.932 400.625 527.872)"/>
      <ellipse id="latitude-6" cx="400.577" cy="488.259" rx="324.375" ry="205.556" transform="rotate(179.932 400.577 488.259)"/>
      <ellipse id="latitude-7" cx="400.525" cy="444.430" rx="343.216" ry="214.481" transform="rotate(179.932 400.525 444.430)"/>
      <ellipse id="latitude-8" cx="400.409" cy="348.658" rx="349.796" ry="211.978" transform="rotate(179.932 400.409 348.658)"/>
      <ellipse id="latitude-9" cx="400.350" cy="299.575" rx="336.732" ry="200.841" transform="rotate(179.932 400.350 299.575)"/>
      <ellipse id="latitude-10" cx="400.293" cy="251.925" rx="312.816" ry="183.697" transform="rotate(179.932 400.293 251.925)"/>
      <ellipse id="latitude-11" cx="400.239" cy="207.524" rx="278.580" ry="161.219" transform="rotate(179.932 400.239 207.524)"/>
      <ellipse id="latitude-12" cx="400.192" cy="168.188" rx="234.965" ry="134.216" transform="rotate(179.932 400.192 168.188)"/>
      <ellipse id="latitude-13" cx="400.153" cy="135.618" rx="183.304" ry="103.573" transform="rotate(179.932 400.153 135.618)"/>
      <ellipse id="latitude-14" cx="400.123" cy="111.285" rx="125.284" ry="70.212" transform="rotate(179.932 400.123 111.285)"/>
      <ellipse id="latitude-15" cx="400.105" cy="96.322" rx="62.875" ry="35.059" transform="rotate(179.932 400.105 96.322)"/>
      <ellipse id="south-polar-ring" cx="400.764" cy="642.756" rx="27.549" ry="18.333"/>
      <ellipse id="north-polar-ring" cx="400.101" cy="92.595" rx="30.699" ry="17.096"/>
    </g>
  </g>
  <circle id="globe-outline" cx="397.63" cy="380.61" r="356.06" class="edge"/>

  <!-- Eight rear-equator dashes preserve the slightly asymmetric reference spacing and stop clear of the front arc. -->
  <path id="equator-rear" class="equator" d="M746.703 356.694 A356 215 0 0 0 728.784 320.524
    M700.626 286.767 A356 215 0 0 0 668.367 260.130
    M630.036 236.944 A356 215 0 0 0 592.396 219.884
    M549.767 205.516 A356 215 0 0 0 509.886 195.894
    M276.206 197.974 A356 215 0 0 0 236.936 208.263
    M194.329 223.662 A356 215 0 0 0 156.486 242.043
    M119.147 266.345 A356 215 0 0 0 89.841 292.348
    M61.967 329.009 A356 215 0 0 0 46.292 366.716"/>

  <!-- Curved cutaway faces follow meridians; near-opaque paint retains the reference's faint grid ghosting. -->
  <path id="cutaway-face" fill="#feffed" fill-opacity=".985" d="M402 83
    L406.5 378.5 L199.5 574
    L199.5 578.2 A355.27 214.24 0 0 0 634.5 560.7 L634.5 562
    C630.672 474.667 610.750 387.333 570 300
    C533.827 227.667 494.077 155.333 402 83 Z"/>
  <path id="reference-meridian-face" fill="#d9dbc5" fill-opacity=".975" d="M402 83
    C327.223 155.333 287.035 227.667 256.5 300
    C218.048 391.333 200.437 482.667 199.5 574
    L406.5 378.5 Z"/>

  <!-- Stable repair targets for the two curved edges and three radii; no arrowheads are present in the reference. -->
  <path id="reference-meridian-edge" class="edge" d="M402 83
    C327.223 155.333 287.035 227.667 256.5 300
    C218.048 391.333 200.437 482.667 199.5 574"/>
  <path id="point-meridian-edge" class="edge" d="M402 83
    C494.077 155.333 533.827 227.667 570 300
    C610.750 387.333 630.672 474.667 634.5 562"/>
  <path id="cutaway-radii" class="edge" d="M402 83 L406.5 378.5 L199.5 574 M406.5 378.5 L634.5 562"/>

  <!-- Angle arcs meet their radii; the orange radius stays above the latitude arc at their join. -->
  <path id="latitude-angle" class="edge" d="M474.542 359.170 A63.688 63.688 0 0 1 471.909 431.143"/>
  <path id="longitude-angle" class="edge" d="M364.040 418.601 A79.690 79.690 0 0 0 453.627 416.429"/>
  <path id="point-radius" d="M406.5 378.5 L582.5 328.5" fill="none" stroke="#ff9d00" stroke-width="5.5"/>

  <!-- Only the left end of this short lower rim remains visible above the front equator. -->
  <path id="cutaway-lower-rim" class="edge" d="M199.5 574 Q213.5 580.5 242 593.5"/>

  <!-- The continuous front equator covers the lower face joins, as in the PNG. -->
  <path id="equator-front" class="equator" d="M42.488 401.236 A355.270 214.242 0 0 0 753.028 401.236"/>

  <!-- Coordinate points and editable labels sit above all geometry. -->
  <g id="coordinate-points" fill="#050706">
    <circle id="globe-center" cx="406.5" cy="378.5" r="9.5"/>
    <circle id="surface-point" cx="582.5" cy="328.5" r="10"/>
  </g>
  <text id="latitude-label" class="coordinate-label" x="494" y="410">40°N Lat</text>
  <text id="longitude-label" class="coordinate-label" x="351" y="479">70°E Long</text>
</svg>
