<svg xmlns="http://www.w3.org/2000/svg" width="1962" height="1114" viewBox="0 0 1962 1114" role="img"
  aria-labelledby="title desc">
  <title id="title">Streaming location update architecture</title>
  <desc id="desc">The location service writes to the user location database and Kafka; Kafka fans updates to traffic,
    personalization, routing tile, and analytics services and databases.</desc>
  <!-- The 16px head projects 3px beyond its reference point, covering the shaft before the nose. -->
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="16" markerHeight="16" orient="auto"
      markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 8 L0 16 Z" fill="#000" />
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #000
      }

      .box {
        fill: #fff;
        stroke: #000;
        stroke-width: 2
      }

      .region {
        fill: #fff;
        stroke: #000;
        stroke-width: 2;
        stroke-dasharray: 11 8
      }

      .arrow {
        fill: none;
        stroke: #000;
        stroke-width: 2;
        marker-end: url(#arrow)
      }

      .db {
        fill: #fff;
        stroke: #000;
        stroke-width: 2
      }
    </style>
  </defs>
  <rect id="background" width="1962" height="1114" fill="#fff" />
  <!-- Ingestion -->
  <text x="212" y="58" font-size="36" text-anchor="middle">Mobile User</text>
  <g id="phone">
    <rect x="183" y="70" width="58" height="96" rx="10" />
    <rect x="191" y="81" width="42" height="62" fill="#fff" />
    <circle cx="212" cy="155" r="7" fill="#fff" />
  </g>
  <!-- Each shaft ends 3px before the geometric border so its nose meets the stroke without entering the fill. -->
  <path id="mobile-to-load-balancer" class="arrow" d="M212 166V303" />
  <rect id="load-balancer" class="box" x="55" y="306" width="313" height="104" /><text x="211" y="372" font-size="36"
    text-anchor="middle">Load Balancer</text>
  <path id="load-balancer-to-location" class="arrow" d="M211 410V547" />
  <rect id="location-service" class="box" x="55" y="550" width="313" height="104" /><text x="211" y="592" font-size="36"
    text-anchor="middle">
    <tspan x="211">Location</tspan>
    <tspan x="211" dy="42">Service</tspan>
  </text>
  <!-- The database ellipse is centered at y=806 with ry=15; the nose meets its top at y=791. -->
  <path id="location-to-user-db" class="arrow" d="M211 654V788" />
  <g id="user-location-db" class="db">
    <path d="M150 806v88c0 14 27 24 61 24s61-10 61-24v-88" />
    <ellipse cx="211" cy="806" rx="61" ry="15" />
  </g><text x="211" y="952" font-size="35" text-anchor="middle">User Location DB</text>
  <!-- The region is behind the fanout lines; their crossings of its dashed boundary are intentional. -->
  <rect id="consumer-region" class="region" x="1077" y="118" width="851" height="966" />
  <!-- Kafka's incoming head meets the left cap at x=548 instead of disappearing inside the cylinder. -->
  <path id="location-to-kafka" class="arrow" d="M368 602H545" />
  <!-- Fanout origins follow the right ellipse's outer edge. The cylinder is painted afterward for clean joins. -->
  <!-- Diagonal noses meet the traffic bottom-left and analytics top-left corners: (1131,326), (1131,878). -->
  <path id="kafka-to-traffic" class="arrow" d="M844.062 571 L1128.719 327.948" />
  <path id="kafka-to-personalization" class="arrow" d="M847.926 583 L1128.074 519.662" />
  <path id="kafka-to-routing" class="arrow" d="M848.352 619 L1128.068 679.367" />
  <path id="kafka-to-analytics" class="arrow" d="M844.062 633 L1128.719 876.052" />
  <!-- Event-stream cylinder stays above its connector joins without covering the incoming arrowhead. -->
  <g id="kafka" class="db">
    <path d="M580 552h241v100H580c-18 0-32-22-32-50s14-50 32-50z" />
    <ellipse cx="821" cy="602" rx="28" ry="50" />
  </g>
  <!-- Center the label between x=548 and x=793 in the visible barrel; the rendered glyphs center vertically at y=602. -->
  <text id="kafka-label" x="680.5" y="615.5" font-size="36" text-anchor="middle">Kafka</text>
  <!-- Stream consumers -->
  <rect id="traffic-update-service" class="box" x="1131" y="180" width="313" height="146" /><text x="1288" y="243"
    font-size="35" text-anchor="middle">
    <tspan x="1288">Traffic Update</tspan>
    <tspan x="1288" dy="42">Service</tspan>
  </text>
  <rect id="personalization-service" class="box" x="1131" y="412" width="313" height="148" /><text x="1288" y="457"
    font-size="34" text-anchor="middle">
    <tspan x="1288">Machine Learning</tspan>
    <tspan x="1288" dy="40">Service for</tspan>
    <tspan x="1288" dy="40">Personalization</tspan>
  </text>
  <rect id="routing-tile-service" class="box" x="1131" y="645" width="313" height="147" /><text x="1288" y="691"
    font-size="34" text-anchor="middle">
    <tspan x="1288">Routing Tile</tspan>
    <tspan x="1288" dy="40">Processing</tspan>
    <tspan x="1288" dy="40">Service</tspan>
  </text>
  <rect id="analytics-service" class="box" x="1131" y="878" width="313" height="146" /><text x="1288" y="965"
    font-size="35" text-anchor="middle">Analytics</text>
  <!-- Consumer stores -->
  <!-- All four database noses meet the same side boundary at x=1667. -->
  <path id="traffic-to-db" class="arrow" d="M1444 253H1664" />
  <path id="personalization-to-db" class="arrow" d="M1444 486H1664" />
  <path id="routing-to-storage" class="arrow" d="M1444 718H1664" />
  <path id="analytics-to-db" class="arrow" d="M1444 951H1664" />
  <g id="traffic-db" class="db">
    <path d="M1667 204v88c0 14 27 24 61 24s61-10 61-24v-88" />
    <ellipse cx="1728" cy="204" rx="61" ry="15" />
  </g><text x="1728" y="351" font-size="35" text-anchor="middle">Traffic DB</text>
  <g id="personalization-db" class="db">
    <path d="M1667 437v88c0 14 27 24 61 24s61-10 61-24v-88" />
    <ellipse cx="1728" cy="437" rx="61" ry="15" />
  </g><text x="1728" y="582" font-size="34" text-anchor="middle">Personalization DB</text>
  <g id="routing-tiles" class="db">
    <path d="M1667 669v88c0 14 27 24 61 24s61-10 61-24v-88" />
    <ellipse cx="1728" cy="669" rx="61" ry="15" />
  </g><text x="1728" y="816" font-size="34" text-anchor="middle">
    <tspan x="1728">Routing Tiles</tspan>
    <tspan x="1728" dy="40">(Object storage)</tspan>
  </text>
  <g id="analytics-db" class="db">
    <path d="M1667 902v88c0 14 27 24 61 24s61-10 61-24v-88" />
    <ellipse cx="1728" cy="902" rx="61" ry="15" />
  </g><text x="1728" y="1048" font-size="35" text-anchor="middle">Analytics DB</text>
</svg>