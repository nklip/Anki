<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="810" height="494" viewBox="0 0 405 247"
     role="img" aria-labelledby="title desc">
  <title id="title">Client gateway responsibilities</title>
  <desc id="desc">A gateway contains authentication, validation, rate limiting, normalization, and FIXT protocol support.</desc>

  <!-- Reusable styling matches the monochrome box diagram in the PNG reference. -->
  <defs>
    <style>
      .label { font: 20px Arial, Helvetica, sans-serif; fill: #000; text-anchor: middle; }
      .feature { fill: #fff; stroke: #000; stroke-width: 1.25; }
    </style>
  </defs>

  <!-- Opaque canvas matches the white PNG background in every SVG renderer. -->
  <rect width="405" height="247" fill="#fff"/>

  <!-- Gateway boundary and heading. -->
  <rect x="29.75" y="15.5" width="340.75" height="217.25" rx="0" fill="#fff" stroke="#000"
        stroke-width="1.25" stroke-dasharray="6 4"/>
  <text class="label" x="200" y="40.5">Gateway</text>

  <!-- Independent request-processing responsibilities. -->
  <g>
    <rect class="feature" x="45.25" y="72.75" width="147" height="38"/>
    <rect class="feature" x="207.25" y="72.75" width="147" height="38"/>
    <rect class="feature" x="45.25" y="124.75" width="147" height="38.5"/>
    <rect class="feature" x="207.25" y="124.75" width="147" height="38.5"/>
    <rect class="feature" x="45.25" y="177.75" width="147" height="38.5"/>
  </g>
  <g class="label">
    <text x="118.75" y="98.5">Auth</text>
    <text x="280.75" y="98.5">Validation</text>
    <text x="118.75" y="151.5">Rate Limit</text>
    <text x="280.75" y="151.5">Normalization</text>
    <text x="118.75" y="204.5">FIXT Support</text>
  </g>
</svg>
