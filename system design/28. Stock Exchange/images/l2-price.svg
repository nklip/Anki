<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="976" height="942" viewBox="0 0 488 471"
     role="img" aria-labelledby="title desc">
  <title id="title">Level 2 price book for Apple stock</title>
  <desc id="desc">A level 2 market view showing four aggregated price levels on the sell book and four aggregated price levels on the buy book.</desc>

  <!-- Shared styles reproduce the two-times PNG export while keeping every row editable. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: normal; fill: #000; }
      .number { font-family: "Marker Felt", "Comic Sans MS", cursive; font-size: 19px; font-weight: normal; fill: #000; }
      .outline { fill: #fff; stroke: #000; stroke-width: 1; }
      .panel { fill: none; stroke: #000; stroke-width: 1; stroke-dasharray: 6 4; }
      .bid { fill: #ccfcc4; stroke: #000; stroke-width: 1; }
      .rule { fill: none; stroke: #000; stroke-width: 1; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="488" height="471" fill="#fff"/>
  <rect class="outline" x="27" y="17" width="433.5" height="437"/>

  <!-- Overall title and the two order-book regions. -->
  <text class="label" x="34.5" y="43.5">APPLE stock</text>
  <rect class="panel" x="138" y="65" width="307.5" height="181"/>
  <rect class="panel" x="138" y="258.5" width="307.5" height="181"/>
  <g class="label center">
    <text x="82.5" y="162">Sell book</text>
    <text x="82.5" y="356">Buy book</text>
    <text x="300" y="92">Price</text>
    <text x="397.5" y="92">Quantity</text>
    <text x="300" y="285.5">Price</text>
    <text x="397.5" y="285.5">Quantity</text>
  </g>

  <!-- Aggregated sell levels. -->
  <g class="label">
    <text x="147" y="128">depth of ask</text>
    <text x="165" y="222.5">best ask</text>
  </g>
  <g class="number center">
    <text x="298.5" y="128">100.13</text>
    <text x="298.5" y="159.5">100.12</text>
    <text x="298.5" y="191">100.11</text>
    <text x="298.5" y="222.5">100.10</text>
  </g>
  <rect class="outline" x="366.75" y="104.5" width="62.5" height="126"/>
  <path class="rule" d="M366.75 136 H429.25 M366.75 167.5 H429.25 M366.75 199 H429.25"/>
  <g class="number center">
    <text x="398" y="128">300</text>
    <text x="398" y="159.5">1500</text>
    <text x="398" y="191">2000</text>
    <text x="398" y="222.5">1800</text>
  </g>

  <!-- Aggregated buy levels use the source's light-green bid fill. -->
  <g class="label">
    <text x="166" y="321.5">best bid</text>
    <text x="147" y="416">depth of bid</text>
  </g>
  <g class="number center">
    <text x="298.5" y="321.5">100.08</text>
    <text x="298.5" y="353">100.07</text>
    <text x="298.5" y="384.5">100.06</text>
    <text x="298.5" y="416">100.05</text>
  </g>
  <rect class="bid" x="366.75" y="298.5" width="62.5" height="126"/>
  <path class="rule" d="M366.75 330 H429.25 M366.75 361.5 H429.25 M366.75 393 H429.25"/>
  <g class="number center">
    <text x="398" y="321.5">2000</text>
    <text x="398" y="353">800</text>
    <text x="398" y="384.5">2000</text>
    <text x="398" y="416">600</text>
  </g>
</svg>
