<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1336" height="888" viewBox="0 0 668 444"
     role="img" aria-labelledby="title desc">
  <title id="title">Level 3 price book for Apple stock</title>
  <desc id="desc">A level 3 market view showing every individual order at four ask price levels and four bid price levels. An arrow identifies the individual orders that form a price level.</desc>

  <!-- Shared source-native styles preserve the PNG's two-times export grid. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: normal; fill: #000; }
      .number { font-family: "Marker Felt", "Comic Sans MS", cursive; font-size: 19px; font-weight: normal; fill: #000; }
      .outline { fill: #fff; stroke: #000; stroke-width: 1; }
      .panel { fill: none; stroke: #000; stroke-width: 1; stroke-dasharray: 6 4; }
      .ask-cell { fill: #fff; stroke: #000; stroke-width: 1; }
      .bid-cell { fill: #ccfcc4; stroke: #000; stroke-width: 1; }
      .connector { fill: none; stroke: #000; stroke-width: 1; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="668" height="444" fill="#fff"/>
  <rect class="outline" x="24" y="16" width="624" height="413"/>

  <!-- Overall title and sell/buy book boundaries. -->
  <text class="label" x="40.5" y="43.5">APPLE stock</text>
  <rect class="panel" x="140" y="63.5" width="495.5" height="171.5"/>
  <rect class="panel" x="140" y="245.5" width="495.5" height="171.5"/>
  <g class="label center">
    <text x="85" y="155.5">Sell book</text>
    <text x="85" y="338.5">Buy book</text>
    <text x="291.5" y="90">Price</text>
    <text x="384" y="90">Quantity</text>
    <text x="291.5" y="273.5">Price</text>
    <text x="384" y="273.5">Quantity</text>
  </g>

  <!-- Sell-side labels and prices. -->
  <g class="label">
    <!-- Explicit word starts preserve the etalon's generous clearance before the price. -->
    <text y="123"><tspan x="147">depth</tspan><tspan x="202">of</tspan><tspan x="225">ask</tspan></text>
    <text x="164" y="213">best ask</text>
  </g>
  <g class="number center">
    <text x="289.5" y="123">100.13</text>
    <text x="289.5" y="153">100.12</text>
    <text x="289.5" y="183">100.11</text>
    <text x="289.5" y="213">100.10</text>
  </g>

  <!-- Each ask cell is one order; coincident borders remain a single one-unit rule. -->
  <g class="ask-cell">
    <rect x="354.75" y="101.25" width="59" height="29.75"/>
    <rect x="413.75" y="101.25" width="59" height="29.75"/>
    <rect x="354.75" y="131" width="59" height="30"/>
    <rect x="413.75" y="131" width="59" height="30"/>
    <rect x="354.75" y="161" width="59" height="30"/>
    <rect x="413.75" y="161" width="59" height="30"/>
    <rect x="472.75" y="161" width="59" height="30"/>
    <rect x="354.75" y="191" width="59" height="29.25"/>
    <rect x="413.75" y="191" width="59" height="29.25"/>
    <rect x="472.75" y="191" width="59" height="29.25"/>
    <rect x="531.75" y="191" width="59" height="29.25"/>
  </g>
  <g class="number center">
    <text x="384.25" y="123">100</text><text x="443.25" y="123">200</text>
    <text x="384.25" y="153">600</text><text x="443.25" y="153">900</text>
    <text x="384.25" y="183">900</text><text x="443.25" y="183">700</text><text x="502.25" y="183">400</text>
    <text x="384.25" y="213">200</text><text x="443.25" y="213">400</text><text x="502.25" y="213">1100</text><text x="561.25" y="213">100</text>
  </g>

  <!-- The callout uses a separate symmetric head so it cannot deform with the shaft. -->
  <path class="connector" id="price-level-callout" data-connector="true" d="M485 116 H527.5"/>
  <path d="M474 116 L485 111.5 L485 120.5 Z" fill="#000"/>
  <text class="label" x="529.5" y="123">price levels</text>

  <!-- Buy-side labels and prices. -->
  <g class="label">
    <text x="165" y="306.5">best bid</text>
    <text y="396.5"><tspan x="148">depth</tspan><tspan x="203">of</tspan><tspan x="226">bid</tspan></text>
  </g>
  <g class="number center">
    <text x="289.5" y="306.5">100.08</text>
    <text x="289.5" y="336.5">100.07</text>
    <text x="289.5" y="366.5">100.06</text>
    <text x="289.5" y="396.5">100.05</text>
  </g>

  <!-- Individual bid orders retain the reference's light-green fill. -->
  <g class="bid-cell">
    <rect x="354.75" y="284.75" width="59" height="30"/>
    <rect x="413.75" y="284.75" width="59" height="30"/>
    <rect x="472.75" y="284.75" width="59" height="30"/>
    <rect x="354.75" y="314.75" width="59" height="30"/>
    <rect x="413.75" y="314.75" width="59" height="30"/>
    <rect x="354.75" y="344.75" width="59" height="29.75"/>
    <rect x="413.75" y="344.75" width="59" height="29.75"/>
    <rect x="472.75" y="344.75" width="59" height="29.75"/>
    <rect x="531.75" y="344.75" width="59" height="29.75"/>
    <rect x="354.75" y="374.5" width="59" height="29.75"/>
    <rect x="413.75" y="374.5" width="59" height="29.75"/>
  </g>
  <g class="number center">
    <text x="384.25" y="306.5">500</text><text x="443.25" y="306.5">600</text><text x="502.25" y="306.5">900</text>
    <text x="384.25" y="336.5">100</text><text x="443.25" y="336.5">700</text>
    <text x="384.25" y="366.5">1100</text><text x="443.25" y="366.5">400</text><text x="502.25" y="366.5">300</text><text x="561.25" y="366.5">200</text>
    <text x="384.25" y="396.5">500</text><text x="443.25" y="396.5">100</text>
  </g>
</svg>
