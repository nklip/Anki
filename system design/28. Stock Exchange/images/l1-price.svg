<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="690" height="462" viewBox="0 0 345 231"
     role="img" aria-labelledby="title desc">
  <title id="title">Level 1 price for Apple stock</title>
  <desc id="desc">A level 1 market view showing the best ask at 100.10 for 1800 shares and the best bid at 100.08 for 2000 shares.</desc>

  <!-- The half-size viewBox preserves the PNG reference's two-times export grid. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: normal; fill: #000; }
      .number { font-family: "Marker Felt", "Comic Sans MS", cursive; font-size: 19px; font-weight: normal; fill: #000; }
      .outline { fill: #fff; stroke: #000; stroke-width: 1; }
      .bid { fill: #ccfcc4; stroke: #000; stroke-width: 1; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <!-- Opaque canvas keeps the diagram identical in light and transparent renderers. -->
  <rect width="345" height="231" fill="#fff"/>
  <rect class="outline" x="15" y="14" width="314" height="205"/>

  <!-- Title and column headings. -->
  <g class="label">
    <text x="36.5" y="49.5">APPLE stock</text>
    <text class="center" x="179.5" y="97.5">Price</text>
    <text class="center" x="278" y="97.5">Quantity</text>
    <text x="36.5" y="146">best ask</text>
    <text x="36.5" y="194">best bid</text>
  </g>

  <!-- Level 1 exposes one ask and one bid. -->
  <g class="number center">
    <text x="177.5" y="146.5">100.10</text>
    <text x="177.5" y="194.5">100.08</text>
  </g>
  <rect class="outline" x="246.5" y="123.5" width="62.5" height="31.5"/>
  <rect class="bid" x="246.5" y="171.5" width="62.5" height="31.5"/>
  <g class="number center">
    <text x="277.75" y="146.5">1800</text>
    <text x="277.75" y="194.5">2000</text>
  </g>
</svg>
