<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="896" viewBox="0 0 1106 896" role="img" aria-labelledby="title desc">
  <title id="title">Delta synchronization</title>
  <desc id="desc">Block servers send only changed blocks, Block 2 and Block 5, to cloud storage.</desc>
  <!-- Shared arrow and typography. -->
  <defs>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13Z" fill="#147eae"/></marker>
    <style>.frame{fill:#fff;stroke:#08afd0;stroke-width:4}.block{stroke:#111;stroke-width:4}.txt{font-family:Arial,Helvetica,sans-serif;font-size:34px;text-anchor:middle}.caption{font-family:Arial,Helvetica,sans-serif;font-size:36px;text-anchor:middle}</style>
  </defs>
  <rect width="1106" height="896" fill="#fff"/>
  <!-- Block-server inventory; black blocks are the changed chunks. -->
  <rect class="frame" x="8" y="24" width="579" height="858" rx="92"/>
  <g class="txt">
    <g><rect class="block" x="76" y="71" width="182" height="91" fill="#fff"/><text x="167" y="130">Block 1</text></g>
    <g><rect class="block" x="323" y="71" width="182" height="91" fill="#000"/><text x="414" y="130" fill="#fff">Block 2</text></g>
    <g><rect class="block" x="76" y="239" width="182" height="91" fill="#fff"/><text x="167" y="298">Block 3</text></g>
    <g><rect class="block" x="323" y="239" width="182" height="91" fill="#fff"/><text x="414" y="298">Block 4</text></g>
    <g><rect class="block" x="76" y="391" width="182" height="93" fill="#000"/><text x="167" y="451" fill="#fff">Block 5</text></g>
    <g><rect class="block" x="323" y="391" width="182" height="93" fill="#fff"/><text x="414" y="451">Block 6</text></g>
    <g><rect class="block" x="76" y="543" width="182" height="91" fill="#fff"/><text x="167" y="602">Block 7</text></g>
    <g><rect class="block" x="323" y="543" width="182" height="91" fill="#fff"/><text x="414" y="602">Block 8</text></g>
    <g><rect class="block" x="76" y="702" width="182" height="90" fill="#fff"/><text x="167" y="761">Block 9</text></g>
    <g><rect class="block" x="323" y="702" width="182" height="90" fill="#fff"/><text x="414" y="761">Block 10</text></g>
  </g>
  <text class="caption" x="297" y="850">Block servers</text>
  <!-- Delta transfer stays clear of its label and destination frame. -->
  <path d="M589 375H835" fill="none" stroke="#147eae" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="712" y="360" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle">changed only</text>
  <!-- Cloud destination contains only the two changed blocks. -->
  <rect class="frame" x="845" y="19" width="250" height="860" rx="40"/>
  <g class="txt">
    <g><rect class="block" x="863" y="68" width="185" height="96" fill="#000"/><text x="955.5" y="130" fill="#fff">Block 2</text></g>
    <g><rect class="block" x="863" y="228" width="185" height="94" fill="#000"/><text x="955.5" y="289" fill="#fff">Block 5</text></g>
  </g>
  <!-- Repair target: simple bucket outline, centered above the caption. -->
  <g fill="#fff" stroke="#078a0d" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="953" cy="668" rx="61" ry="20"/>
    <path d="M892 668L903 766Q953 790 1003 766L1014 668"/>
    <path d="M929 701L916 727H942Z M952 737H976V760H952Z M973 714A14 14 0 1 0 973 742A14 14 0 1 0 973 714Z" fill="none"/>
    <path d="M975 705L1019 725" fill="none" stroke-linecap="round"/><circle cx="970" cy="702" r="5" fill="#078a0d" stroke="none"/>
  </g>
  <text class="caption" x="970" y="844">Cloud storage</text>
</svg>
