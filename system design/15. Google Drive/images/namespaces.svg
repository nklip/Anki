<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="526" viewBox="0 0 1146 526" role="img" aria-labelledby="title desc">
  <title id="title">Google Drive namespaces</title>
  <desc id="desc">A collapsed drive namespace expands into user folders and their nested files.</desc>
  <!-- Reusable tree icons and expansion arrow. -->
  <defs>
    <marker id="arrow-black" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13Z" fill="#111"/></marker>
    <symbol id="folder" viewBox="0 0 44 33"><path d="M1 7H15L20 12H43V32H1Z" fill="#b5c4cb"/><path d="M1 7V32H43V12H20L15 7Z" fill="none" stroke="#b5c4cb" stroke-width="2"/></symbol>
    <symbol id="document" viewBox="0 0 34 43"><path d="M2 1H23L32 10V42H2Z" fill="#b5c4cb"/><path d="M23 1V10H32" fill="#fff"/><path d="M8 18H26M8 24H26M8 30H23" stroke="#65767e" stroke-width="3"/></symbol>
    <symbol id="image-file" viewBox="0 0 34 43"><path d="M2 1H23L32 10V42H2Z" fill="#b5c4cb"/><path d="M23 1V10H32" fill="#fff"/><rect x="6" y="17" width="22" height="18" fill="#55c8e8"/><circle cx="22" cy="22" r="3" fill="#fff"/><path d="M7 34L15 26L20 31L24 27L28 34Z" fill="#65bd52"/></symbol>
    <style>.tree{font-family:Arial,Helvetica,sans-serif;font-size:38px;fill:#151515}.tri{fill:#aaa}</style>
  </defs>
  <rect width="1146" height="526" fill="#fff"/>
  <!-- Collapsed namespace. -->
  <g class="tree">
    <path class="tri" d="M32 42H61L47 69Z"/><use href="#folder" x="91" y="36" width="44" height="33"/><text x="145" y="68">drive</text>
    <path class="tri" d="M96 96L121 111L96 126Z"/><use href="#folder" x="151" y="94" width="44" height="33"/><text x="204" y="126">user1</text>
    <path class="tri" d="M96 151L121 166L96 181Z"/><use href="#folder" x="151" y="149" width="44" height="33"/><text x="204" y="181">user2</text>
    <path class="tri" d="M96 208L121 223L96 238Z"/><use href="#folder" x="151" y="206" width="44" height="33"/><text x="204" y="238">user3</text>
  </g>
  <!-- Expansion instruction; label is above the dashed connector. -->
  <path d="M340 140H520" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-black)"/>
  <text x="420" y="127" font-family="Arial,Helvetica,sans-serif" font-size="36" text-anchor="middle">expand</text>
  <!-- Expanded namespace and files. -->
  <g class="tree">
    <path class="tri" d="M542 20H569L555 46Z"/><use href="#folder" x="598" y="16" width="44" height="33"/><text x="651" y="48">drive</text>
    <path class="tri" d="M598 75H625L612 101Z"/><use href="#folder" x="657" y="70" width="44" height="33"/><text x="710" y="103">user1</text>
    <use href="#folder" x="714" y="124" width="44" height="33"/><text x="763" y="157">recipes</text>
    <use href="#document" x="716" y="171" width="34" height="43"/><text x="763" y="210">chicken_soup.txt</text>
    <path class="tri" d="M598 238H625L612 264Z"/><use href="#folder" x="657" y="233" width="44" height="33"/><text x="710" y="266">user2</text>
    <use href="#document" x="716" y="279" width="34" height="43"/><text x="763" y="317">football.mov</text>
    <use href="#document" x="716" y="334" width="34" height="43"/><text x="763" y="372">sports.txt</text>
    <path class="tri" d="M598 400H625L612 426Z"/><use href="#folder" x="657" y="395" width="44" height="33"/><text x="710" y="428">user3</text>
    <use href="#image-file" x="716" y="442" width="34" height="43"/><text x="763" y="481">best_pic_ever.png</text>
  </g>
</svg>
