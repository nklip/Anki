<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="800" viewBox="0 0 1408 800" role="img" aria-labelledby="title desc">
  <title id="title">Coordinator routes a client operation to replicas</title>
  <desc id="desc">A client sends a read or write to coordinator n6, which contacts replicas n0, n1, and n2 and receives responses.</desc>

  <!-- Separate request and response markers keep directions unambiguous. -->
  <defs>
    <marker id="request-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" viewBox="0 0 14 14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 13 7 1 13Z" fill="#111"/></marker>
    <marker id="response-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" viewBox="0 0 14 14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 13 7 1 13Z" fill="#111"/></marker>
    <style>
      .ring { fill: none; stroke: #707070; stroke-width: 7; }
      .request { fill: none; stroke: #111; stroke-width: 3; marker-end: url(#request-arrow); }
      .response { fill: none; stroke: #111; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#response-arrow); }
      .node { stroke: #111; stroke-width: 4; }
      .node-text { font: 30px Georgia, serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .label { font: 30px Arial, sans-serif; fill: #111; text-anchor: middle; }
    </style>
  </defs>

  <!-- Client and request entry point. -->
  <rect width="1408" height="800" fill="#fff"/>
  <rect x="18" y="350" width="218" height="88" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
  <text class="label" x="127" y="405">Client</text>
  <path class="request" d="M240 382H614"/>
  <text class="label" x="410" y="365">read / write</text>
  <path class="response" d="M614 418H240"/>
  <text class="label" x="410" y="456">response</text>

  <!-- Storage ring and coordinator n6. -->
  <circle class="ring" cx="1010" cy="400" r="350"/>
  <circle class="node" cx="660" cy="400" r="46" fill="#fff"/>
  <text class="node-text" x="660" y="400">n6</text>
  <text class="label" x="660" y="475">coordinator</text>

  <!-- Ring members; blue nodes are the selected replicas. -->
  <circle class="node" cx="1010" cy="50" r="44" fill="#10afd2"/><text class="node-text" x="1010" y="50">n0</text>
  <circle class="node" cx="1258" cy="152" r="44" fill="#10afd2"/><text class="node-text" x="1258" y="152">n1</text>
  <circle class="node" cx="1360" cy="400" r="44" fill="#10afd2"/><text class="node-text" x="1360" y="400">n2</text>
  <circle class="node" cx="1258" cy="648" r="44" fill="#fff"/><text class="node-text" x="1258" y="648">n3</text>
  <circle class="node" cx="1010" cy="750" r="44" fill="#fff"/><text class="node-text" x="1010" y="750">n4</text>
  <circle class="node" cx="762" cy="648" r="44" fill="#fff"/><text class="node-text" x="762" y="648">n5</text>
  <circle class="node" cx="762" cy="152" r="44" fill="#fff"/><text class="node-text" x="762" y="152">n7</text>

  <!-- Each replica uses two straight, parallel lanes with distinct coordinator endpoints. -->
  <path class="request" d="M689 364 975 78"/>
  <path class="response" d="M982 85 696 371"/>
  <path class="request" d="M701 378 1215 164"/>
  <path class="response" d="M1219 173 704 387"/>
  <path class="request" d="M706 393H1316"/>
  <path class="response" d="M1316 407H706"/>
</svg>
