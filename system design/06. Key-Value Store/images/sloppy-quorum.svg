<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="1014" viewBox="0 0 1072 1014" role="img" aria-labelledby="title desc">
  <title id="title">Sloppy quorum skips an unavailable replica</title>
  <desc id="desc">A coordinator writes to s0 and s1. The intended request to unavailable s2 is rejected, while s3 remains an available fallback on the ring.</desc>

  <!-- Arrow and failure styles. -->
  <defs>
    <!-- The tip projects six units beyond the shaft endpoint; the broad body hides the three-unit shaft. -->
    <marker id="black-arrow" markerWidth="30" markerHeight="30" refX="24" refY="15" viewBox="0 0 30 30" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L30 15L0 30Z" fill="#111"/>
    </marker>
    <style>
      .write { stroke: #111; stroke-width: 3; fill: none; marker-end: url(#black-arrow); }
      .ack { stroke: #111; stroke-width: 3; fill: none; marker-end: url(#black-arrow); }
      .failed { stroke: #111; stroke-width: 3; stroke-dasharray: 9 9; fill: none; marker-end: url(#black-arrow); }
      .label { font: 34px Georgia, serif; fill: #111; text-anchor: middle; }
      .node-text { font: 38px Georgia, serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Replica ring and request coordinator. -->
  <rect width="1072" height="1014" fill="#fff"/>
  <!-- The reference fills the first 1040 pixels with its captured off-white background. -->
  <rect x="0" y="0" width="1040" height="1014" fill="#fefefe"/>
  <circle cx="534" cy="503" r="449" fill="none" stroke="#656565" stroke-width="7"/>
  <!-- Filled border keeps the left side at full thickness instead of clipping half its stroke at x=0. -->
  <rect x="0" y="433" width="227" height="72" fill="#111" shape-rendering="crispEdges"/>
  <rect x="2" y="435" width="223" height="68" fill="#fefefe" shape-rendering="crispEdges"/>
  <!-- Horizontal spacing preserves the reference width while the smaller declared size keeps clearance measurable. -->
  <text x="6" y="484" font-family="Georgia,serif" font-size="34" letter-spacing="2.6" transform="translate(0 484) scale(1 1.1470588) translate(0 -484)">coordinator</text>
  <circle cx="535" cy="54" r="38" fill="#00b7df"/><text class="node-text" x="535" y="54">s0</text>
  <circle cx="983" cy="503" r="38" fill="#00b7df"/><text class="node-text" x="983" y="503">s1</text>
  <circle cx="535" cy="952" r="38" fill="#00b7df"/><text class="node-text" x="535" y="952">s2</text>
  <circle cx="140" cy="728" r="38" fill="#00b7df"/><text class="node-text" x="140" y="728">s3</text>

  <!-- s0 write nose and ACK shaft meet the blue boundary without entering it or leaving a gap. -->
  <path class="write" data-connector="true" d="M226 432L497.03 76.09"/>
  <path class="ack" data-connector="true" d="M521.08 89.36L229 464"/>
  <text class="label" x="360" y="211" transform="rotate(-52.71 360 211)">put(key1, val1)</text>
  <text class="label" x="450" y="281" transform="rotate(-52.06 450 281)">ACK</text>
  <path class="write" data-connector="true" d="M226 468L939 503"/>
  <path class="ack" data-connector="true" d="M951 527L231 486"/>
  <text class="label" x="730" y="464" transform="rotate(2.81 730 464)">put(key1, val1)</text>
  <text class="label" x="699" y="560" transform="rotate(3.26 699 560)">ACK</text>

  <!-- Failed s2 request is dashed and stopped by a red cross before the target. -->
  <path class="failed" data-connector="true" d="M226 484L511 915"/>
  <text class="label" x="399" y="708" transform="rotate(56.53 399 708)">put(key1, val1)</text>
  <path d="M444 847L493 881M493 847L444 881" fill="none" stroke="#f6285c" stroke-width="10" stroke-linecap="square"/>
</svg>
