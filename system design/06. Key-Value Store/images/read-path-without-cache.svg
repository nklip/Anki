<svg xmlns="http://www.w3.org/2000/svg" width="1406" height="680" viewBox="0 0 1406 680" role="img" aria-labelledby="title desc">
  <title id="title">Read path when the memory cache misses</title>
  <desc id="desc">A read request checks memory, then the Bloom filter and SSTables on disk, produces result data, and returns it to the client.</desc>

  <!-- Flow arrows and numbered step badges. -->
  <defs>
    <marker id="black-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" viewBox="0 0 11 11" orient="auto" markerUnits="strokeWidth"><path d="M1 1 10 5.5 1 10Z" fill="#111"/></marker>
    <style>
      .flow { stroke: #111; stroke-width: 3; fill: none; marker-end: url(#black-arrow); }
      .return { stroke: #111; stroke-width: 3; stroke-dasharray: 9 9; fill: none; marker-end: url(#black-arrow); }
      .label { font: 27px Arial, sans-serif; fill: #111; }
      .box-label { font: 27px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .step { fill: #fff; stroke: #08b5d0; stroke-width: 3; }
    </style>
  </defs>

  <!-- Client and server regions. -->
  <rect width="1406" height="680" fill="#fff"/>
  <rect x="398" y="20" width="982" height="647" fill="#f1f1f1" stroke="#111" stroke-width="2"/>
  <rect x="398" y="377" width="982" height="290" fill="#fff4b8" stroke="#111" stroke-width="2"/>
  <text x="889" y="80" font-family="Arial, sans-serif" font-size="42" text-anchor="middle">Server</text>
  <text class="label" x="416" y="368">MEMORY</text><text class="label" x="416" y="415">DISK</text>
  <rect x="2" y="139" width="178" height="74" rx="10" fill="#fff" stroke="#08b5d0" stroke-width="3"/>
  <text class="box-label" x="91" y="176">Client</text>

  <!-- Step 1: request enters the memory cache. -->
  <path class="flow" d="M180 155H1104"/>
  <text class="label" x="216" y="137">Read request</text>
  <circle class="step" cx="766" cy="128" r="20"/><text class="box-label" x="766" y="128" font-size="22">1</text>
  <rect x="1106" y="127" width="218" height="96" rx="16" fill="#00a500"/>
  <text x="1215" y="176" font-family="Arial, sans-serif" font-size="27" fill="#fff" text-anchor="middle">Memory cache</text>

  <!-- Steps 2 and 3: a cache miss checks the Bloom filter, then relevant SSTables. -->
  <path class="flow" d="M1215 223V466"/>
  <circle class="step" cx="1250" cy="323" r="20"/><text class="box-label" x="1250" y="323" font-size="22">2</text>
  <rect x="1118" y="477" width="194" height="97" rx="15" fill="#fff9d7" stroke="#08b5d0" stroke-width="3"/>
  <text class="box-label" x="1215" y="526">Bloom filter</text>
  <path class="flow" d="M1118 526H1035"/>
  <circle class="step" cx="1073" cy="495" r="20"/><text class="box-label" x="1073" y="495" font-size="22">3</text>

  <!-- Step 4: SSTables yield result data. -->
  <rect x="718" y="439" width="307" height="171" rx="24" fill="#fff9d7" stroke="#08b5d0" stroke-width="3"/>
  <g fill="#70a6df"><rect x="741" y="451" width="65" height="65"/><rect x="837" y="451" width="65" height="65"/><rect x="933" y="451" width="65" height="65"/><rect x="741" y="533" width="65" height="65"/><rect x="837" y="533" width="65" height="65"/><rect x="933" y="533" width="65" height="65"/></g>
  <text class="box-label" x="871" y="642">SSTables</text>
  <path class="flow" d="M718 526H639"/>
  <circle class="step" cx="680" cy="495" r="20"/><text class="box-label" x="680" y="495" font-size="22">4</text>
  <rect x="434" y="476" width="195" height="97" rx="15" fill="#fff9d7" stroke="#08b5d0" stroke-width="3"/>
  <text class="box-label" x="531" y="525">Result data</text>

  <!-- Step 5: result returns around the server boundary to the client. -->
  <path class="return" d="M434 526H92V220"/>
  <text class="label" x="130" y="379">Return result</text>
  <circle class="step" cx="220" cy="495" r="20"/><text class="box-label" x="220" y="495" font-size="22">5</text>
</svg>
