<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="968" viewBox="0 0 1016 968" role="img" aria-labelledby="title desc">
  <title id="title">Responsibilities of a single key-value store node</title>
  <desc id="desc">One node drawn as a circle containing six rounded boxes: client API, failure detection, conflict resolution, failure repair mechanism, replication, and storage engine, with two further boxes left as ellipses.</desc>

  <!-- Every node runs the same stack, so the ring members are interchangeable. -->
  <defs>
    <style>
      .node-boundary { fill: none; stroke: #111; stroke-width: 4; }
      .component { fill: none; stroke: #42b2d6; stroke-width: 4.1; }
      .node-name { font: 53.35px Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; }
      .label { font: 30.7px Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; }
      .more { font: 69.5px Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; }
    </style>
  </defs>

  <!-- The node itself. -->
  <rect width="1016" height="968" fill="#fff"/>
  <circle class="node-boundary" cx="517.265" cy="491.829" r="449.375"/>
  <text class="node-name" x="519.34" y="143.25">node</text>

  <!-- Components, in two columns of four. -->
  <g class="component">
    <rect x="234.47" y="207.85" width="245.03" height="122.49" rx="18"/>
    <rect x="561.16" y="207.85" width="245.03" height="122.49" rx="18"/>
    <rect x="234.47" y="371.34" width="245.03" height="122.58" rx="18"/>
    <rect x="561.16" y="371.34" width="245.03" height="122.58" rx="18"/>
    <rect x="234.47" y="534.79" width="245.03" height="122.50" rx="18"/>
    <rect x="561.16" y="534.79" width="245.03" height="122.50" rx="18"/>
    <rect x="234.47" y="698.19" width="245.03" height="122.67" rx="18"/>
    <rect x="561.16" y="698.19" width="245.03" height="122.67" rx="18"/>
  </g>

  <!-- Left column: what the node does for clients and for its own data. -->
  <text class="label" x="355.62" y="280.54">Client API</text>
  <text class="label" x="355.93" y="425.55">Conflict</text>
  <text class="label" x="355.98" y="462.35">resolution</text>
  <text class="label" x="356.21" y="607.36">Replication</text>
  <text class="more" x="355.87" y="764.71">...</text>

  <!-- Right column: what the node does about failures and on disk. -->
  <text class="label" x="682.69" y="280.54">Failure detection</text>
  <text class="label" x="682.61" y="425.63">Failure repair</text>
  <text class="label" x="682.67" y="462.32">mechanism</text>
  <text class="label" x="682.63" y="607.33">Storage engine</text>
  <text class="more" x="682.90" y="764.71">...</text>
</svg>
