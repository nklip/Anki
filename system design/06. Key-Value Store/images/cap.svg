<svg xmlns="http://www.w3.org/2000/svg" width="1384" height="1106" viewBox="0 0 1384 1106" role="img" aria-labelledby="title desc">
  <title id="title">CAP theorem trade-offs</title>
  <desc id="desc">A three-circle diagram showing consistency, availability, and partition tolerance, with CA, CP, and AP in their pairwise overlaps.</desc>

  <!-- Shared typography keeps the three CAP properties equally prominent. -->
  <defs>
    <style>
      .label { font: 54px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .pair { font: 700 52px Arial, sans-serif; fill: #111; text-anchor: middle; }
    </style>
  </defs>

  <!-- CAP property circles; opacity exposes the pairwise trade-off regions. -->
  <rect width="1384" height="1106" fill="#fff"/>
  <circle cx="692" cy="325" r="300" fill="#04b8ba" fill-opacity=".78"/>
  <circle cx="430" cy="790" r="305" fill="#00bd38" fill-opacity=".78"/>
  <circle cx="954" cy="790" r="305" fill="#e6e900" fill-opacity=".78"/>

  <!-- Property and overlap labels remain above every translucent circle. -->
  <text class="label" x="692" y="330">Consistency</text>
  <text class="label" x="405" y="795">Availability</text>
  <text class="label" x="980" y="765">Partition</text>
  <text class="label" x="980" y="827">Tolerance</text>
  <text class="pair" x="575" y="578">CA</text>
  <text class="pair" x="809" y="578">CP</text>
  <text class="pair" x="692" y="820">AP</text>
</svg>
