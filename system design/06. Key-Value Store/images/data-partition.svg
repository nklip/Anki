<svg xmlns="http://www.w3.org/2000/svg" width="1074" height="1080" viewBox="0 0 1074 1080" role="img" aria-labelledby="title desc">
  <title id="title">Partitioning a key to the next server clockwise</title>
  <desc id="desc">A consistent-hashing ring with eight white server nodes, s0 through s7. Key0 lies between s0 and s1. A clockwise arrow assigns key0 to s1.</desc>

  <!-- Match the canvas, ring, node sizes, typography, and palette of data-replication.svg. -->
  <defs>
    <style>
      .ring { fill: none; stroke: #707070; stroke-width: 9; }
      .server { stroke: #111; stroke-width: 5; }
      .node-text { font: 40px Georgia, serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .key-label { font: 44px Georgia, serif; fill: #111; text-anchor: middle; }
    </style>
  </defs>

  <!-- The ring's open center represents the circular hash space. -->
  <rect width="1074" height="1080" fill="#fff"/>
  <circle id="hash-ring" class="ring" cx="537" cy="540" r="478"/>

  <!-- Eight servers; only the first server clockwise from key0 owns this partition. -->
  <g id="servers" aria-label="servers around the ring">
    <circle class="server" cx="537" cy="62" r="39" fill="#fff"/><text class="node-text" x="537" y="62">s0</text>
    <circle id="partition-owner" class="server" cx="875" cy="202" r="39" fill="#fff"/><text class="node-text" x="875" y="202">s1</text>
    <circle class="server" cx="1015" cy="540" r="39" fill="#fff"/><text class="node-text" x="1015" y="540">s2</text>
    <circle class="server" cx="875" cy="878" r="39" fill="#fff"/><text class="node-text" x="875" y="878">s3</text>
    <circle class="server" cx="537" cy="1018" r="39" fill="#fff"/><text class="node-text" x="537" y="1018">s4</text>
    <circle class="server" cx="199" cy="878" r="39" fill="#fff"/><text class="node-text" x="199" y="878">s5</text>
    <circle class="server" cx="59" cy="540" r="39" fill="#fff"/><text class="node-text" x="59" y="540">s6</text>
    <circle class="server" cx="199" cy="202" r="39" fill="#fff"/><text class="node-text" x="199" y="202">s7</text>
  </g>

  <!-- The key sits between s0 and s1, as in the PNG reference. -->
  <circle id="key-position" cx="692" cy="88" r="31" fill="#555"/>
  <text class="key-label" x="692" y="42">key0</text>

  <!-- Clockwise assignment: the shaft ends just inside the head's base.
       The nose meets the outside of s1's 5-unit border at radius 41.5. -->
  <path id="assignment-arrow-shaft" data-connector="true" d="M716 68.38 C840 68.38 916 88.58 897.68 140.90" fill="none" stroke="#111" stroke-width="5"/>
  <path id="assignment-arrowhead" d="M885.73 135.79 L890 163.31 L910.27 144.21 Z" fill="#111"/>
</svg>
