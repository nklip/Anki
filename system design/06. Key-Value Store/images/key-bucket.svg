<svg xmlns="http://www.w3.org/2000/svg" width="1274" height="430" viewBox="0 0 1274 430" role="img" aria-labelledby="title desc">
  <title id="title">Different key value at replica server 2</title>
  <desc id="desc">Two servers contain the same twelve key slots except key 8, which has a value on server 1 and is missing on server 2.</desc>

  <!-- Table styles emphasize the one differing key slot. -->
  <defs>
    <style>
      .server-label { font: 36px Georgia, serif; fill: #111; text-anchor: middle; }
      .cell { fill: #fff; stroke: #555; stroke-width: 3; }
      .cell-text { font: 31px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .panel { fill: #fff; stroke: #111; stroke-width: 3; }
    </style>
  </defs>

  <!-- Server panels. -->
  <rect width="1274" height="430" fill="#fff"/>
  <text class="server-label" x="294" y="50">server 1</text>
  <text class="server-label" x="980" y="50">server 2</text>
  <rect class="panel" x="12" y="86" width="565" height="312" rx="42"/>
  <rect class="panel" x="697" y="86" width="565" height="312" rx="42"/>

  <!-- Server 1 key buckets. -->
  <g aria-label="server 1 keys">
    <rect class="cell" x="52" y="118" width="82" height="74"/><rect class="cell" x="52" y="192" width="82" height="74"/><rect class="cell" x="52" y="266" width="82" height="74"/>
    <text class="cell-text" x="93" y="155">1</text><text class="cell-text" x="93" y="229">2</text><text class="cell-text" x="93" y="303">3</text>
    <rect class="cell" x="190" y="118" width="82" height="74"/><rect class="cell" x="190" y="192" width="82" height="74"/><rect class="cell" x="190" y="266" width="82" height="74"/>
    <text class="cell-text" x="231" y="229">5</text><text class="cell-text" x="231" y="303">6</text>
    <rect class="cell" x="328" y="118" width="82" height="74"/><rect x="328" y="192" width="82" height="74" fill="#ff0e2a" stroke="#555" stroke-width="3"/><rect class="cell" x="328" y="266" width="82" height="74"/>
    <text class="cell-text" x="369" y="155">7</text><text class="cell-text" x="369" y="229">8</text><text class="cell-text" x="369" y="303">9</text>
    <rect class="cell" x="466" y="118" width="82" height="74"/><rect class="cell" x="466" y="192" width="82" height="74"/><rect class="cell" x="466" y="266" width="82" height="74"/>
    <text class="cell-text" x="507" y="155">10</text><text class="cell-text" x="507" y="229">11</text><text class="cell-text" x="507" y="303">12</text>
  </g>

  <!-- Server 2 mirrors the layout but key 8 is missing. -->
  <g aria-label="server 2 keys">
    <rect class="cell" x="737" y="118" width="82" height="74"/><rect class="cell" x="737" y="192" width="82" height="74"/><rect class="cell" x="737" y="266" width="82" height="74"/>
    <text class="cell-text" x="778" y="155">1</text><text class="cell-text" x="778" y="229">2</text><text class="cell-text" x="778" y="303">3</text>
    <rect class="cell" x="875" y="118" width="82" height="74"/><rect class="cell" x="875" y="192" width="82" height="74"/><rect class="cell" x="875" y="266" width="82" height="74"/>
    <text class="cell-text" x="916" y="229">5</text><text class="cell-text" x="916" y="303">6</text>
    <rect class="cell" x="1013" y="118" width="82" height="74"/><rect x="1013" y="192" width="82" height="74" fill="#ff0e2a" stroke="#555" stroke-width="3"/><rect class="cell" x="1013" y="266" width="82" height="74"/>
    <text class="cell-text" x="1054" y="155">7</text><text class="cell-text" x="1054" y="303">9</text>
    <rect class="cell" x="1151" y="118" width="82" height="74"/><rect class="cell" x="1151" y="192" width="82" height="74"/><rect class="cell" x="1151" y="266" width="82" height="74"/>
    <text class="cell-text" x="1192" y="155">10</text><text class="cell-text" x="1192" y="229">11</text><text class="cell-text" x="1192" y="303">12</text>
  </g>
</svg>
