<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="708" viewBox="0 0 1284 708" role="img" aria-labelledby="title desc">
  <title id="title">Modulo hashing across four servers</title>
  <desc id="desc">The formula serverIndex equals hash modulo four distributes eight keys evenly across server indices zero through three.</desc>

  <!-- Palette shared with the consistent-hashing ring diagrams. -->
  <defs>
    <style>.label{font-family:Georgia,serif;fill:#111}.sans{font-family:Arial,sans-serif;fill:#111}</style>
  </defs>
  <rect width="1284" height="708" fill="white"/>

  <!-- Hash formula and server indices. -->
  <text x="715" y="100" text-anchor="middle" class="label" font-size="47">serverIndex = hash % 4</text>
  <text x="28" y="225" class="sans" font-size="47">Server Index</text>
  <g text-anchor="middle" class="label" font-size="47">
    <text x="405" y="225">0</text><text x="681" y="225">1</text><text x="928" y="225">2</text><text x="1135" y="225">3</text>
  </g>

  <!-- Four physical servers; outline colors match the PNG. -->
  <text x="80" y="414" class="label" font-size="45">Servers</text>
  <g fill="white" stroke-width="6">
    <rect x="331" y="307" width="166" height="164" rx="24" stroke="#c3a4ce"/>
    <rect x="596" y="307" width="166" height="164" rx="24" stroke="#05b5d3"/>
    <rect x="839" y="307" width="166" height="164" rx="24" stroke="#f13cf1"/>
    <rect x="1052" y="307" width="166" height="164" rx="24" stroke="#ffad55"/>
  </g>
  <g text-anchor="middle" class="label" font-size="36">
    <text x="414" y="406">server 0</text><text x="679" y="406">server 1</text><text x="922" y="406">server 2</text><text x="1135" y="406">server 3</text>
  </g>

  <!-- Key assignments produced by hash modulo four. -->
  <text x="94" y="588" class="label" font-size="47">Keys</text>
  <g text-anchor="middle" class="label" font-size="44">
    <text x="414" y="581">key1</text><text x="414" y="650">key3</text>
    <text x="679" y="581">key0</text><text x="679" y="650">key4</text>
    <text x="922" y="581">key2</text><text x="922" y="650">key6</text>
    <text x="1135" y="581">key5</text><text x="1135" y="650">key7</text>
  </g>
</svg>
