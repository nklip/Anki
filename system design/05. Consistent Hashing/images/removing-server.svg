<svg xmlns="http://www.w3.org/2000/svg" width="1478" height="1040" viewBox="0 0 1478 1040" role="img" aria-labelledby="title desc">
  <title id="title">Removing a server from a consistent hash ring</title>
  <desc id="desc">Server s1 is removed. Only key k1's clockwise range moves, continuing past the removed position to server s2.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#111"/></marker>
  </defs>
  <rect width="1478" height="1040" fill="white"/>

  <!-- Four-server legend before the removal. -->
  <text x="50" y="207" font-family="Georgia,serif" font-size="34">Servers</text>
  <g font-family="Arial,sans-serif" font-size="27">
    <rect x="46" y="248" width="120" height="120" rx="19" fill="#c3a4ce"/><text x="106" y="319" text-anchor="middle">server 0</text>
    <rect x="46" y="396" width="120" height="120" rx="19" fill="#08b5d3"/><text x="106" y="467" text-anchor="middle">server 1</text>
    <rect x="46" y="554" width="120" height="120" rx="19" fill="#f13cf1"/><text x="106" y="625" text-anchor="middle">server 2</text>
    <rect x="46" y="695" width="120" height="120" rx="19" fill="#ffad55"/><text x="106" y="766" text-anchor="middle">server 3</text>
  </g>

  <!-- Ring, surviving servers, and key positions. -->
  <circle cx="711" cy="512" r="381" fill="none" stroke="#6f6f6f" stroke-width="7"/>
  <g font-family="Georgia,serif" font-size="31" text-anchor="middle">
    <circle cx="984" cy="223" r="30" fill="#c3a4ce"/><text x="984" y="234">s0</text>
    <circle cx="984" cy="755" r="30" fill="#08b5d3"/><text x="984" y="766">s1</text>
    <circle cx="414" cy="755" r="30" fill="#f13cf1"/><text x="414" y="766">s2</text>
    <circle cx="449" cy="223" r="30" fill="#ffad55"/><text x="449" y="234">s3</text>
  </g>
  <g font-family="Georgia,serif" font-size="28" text-anchor="middle">
    <circle cx="649" cy="116" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="649" y="126">k0</text>
    <circle cx="1047" cy="617" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="1047" y="627">k1</text>
    <circle cx="600" cy="858" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="600" y="868">k2</text>
    <circle cx="320" cy="568" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="320" y="578">k3</text>
  </g>

  <!-- Red cross marks s1; the affected range now continues clockwise to s2. -->
  <text x="880" y="771" font-family="Georgia,serif" font-size="30">s1</text>
  <path d="M965 735L1003 773M1003 735L965 773" stroke="#f0475d" stroke-width="10"/>
  <path id="reassign-k1-to-s2" d="M1073 617C1104 866 943 1009 713 1010C500 1011 417 903 414 806" fill="none" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Symbol definitions. -->
  <g font-family="Arial,sans-serif" font-size="29">
    <text x="1220" y="294">s0 = server 0</text><text x="1220" y="332">s1 = server 1</text><text x="1220" y="370">s2 = server 2</text><text x="1220" y="408">s3 = server 3</text>
    <text x="1220" y="484">k0 = key0</text><text x="1220" y="522">k1 = key1</text><text x="1220" y="560">k2 = key2</text><text x="1220" y="598">k3 = key3</text>
  </g>
</svg>
