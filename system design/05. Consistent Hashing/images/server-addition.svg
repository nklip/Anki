<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="1060" viewBox="0 0 1424 1060" role="img" aria-labelledby="title desc">
  <title id="title">Key reassignment after adding server s4</title>
  <desc id="desc">Server s4 joins between k0 and s0. The solid clockwise route assigns key0 to s4 and the dashed former route to s0 is rejected.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#111"/></marker>
  </defs>
  <rect width="1424" height="1060" fill="white"/>

  <!-- Legend including the added server. -->
  <text x="8" y="269" font-family="Georgia,serif" font-size="34">Servers</text>
  <g font-family="Arial,sans-serif" font-size="27">
    <rect x="2" y="310" width="120" height="120" rx="19" fill="#c3a4ce"/><text x="62" y="381" text-anchor="middle">server 0</text>
    <rect x="2" y="458" width="120" height="120" rx="19" fill="#08b5d3"/><text x="62" y="529" text-anchor="middle">server 1</text>
    <rect x="2" y="616" width="120" height="120" rx="19" fill="#f13cf1"/><text x="62" y="687" text-anchor="middle">server 2</text>
    <rect x="2" y="757" width="120" height="120" rx="19" fill="#ffad55"/><text x="62" y="828" text-anchor="middle">server 3</text>
    <rect x="2" y="910" width="120" height="120" rx="19" fill="#00a74f"/><text x="62" y="981" text-anchor="middle">server 4</text>
  </g>

  <!-- Ring and positions are scaled to the source PNG canvas. -->
  <circle cx="674" cy="552" r="377" fill="none" stroke="#6f6f6f" stroke-width="7"/>
  <g font-family="Georgia,serif" font-size="31" text-anchor="middle">
    <circle cx="940" cy="286" r="30" fill="#c3a4ce"/><text x="940" y="297">s0</text>
    <circle cx="940" cy="817" r="30" fill="#08b5d3"/><text x="940" y="828">s1</text>
    <circle cx="395" cy="817" r="30" fill="#f13cf1"/><text x="395" y="828">s2</text>
    <circle cx="404" cy="285" r="30" fill="#ffad55"/><text x="404" y="296">s3</text>
    <circle cx="792" cy="201" r="30" fill="#00a74f"/><text x="792" y="212">s4</text>
  </g>
  <g font-family="Georgia,serif" font-size="28" text-anchor="middle">
    <circle cx="603" cy="181" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="603" y="191">k0</text>
    <circle cx="1029" cy="676" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="1029" y="686">k1</text>
    <circle cx="580" cy="915" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="580" y="925">k2</text>
    <circle cx="299" cy="628" r="25" fill="white" stroke="#111" stroke-width="6"/><text x="299" y="638">k3</text>
  </g>
  <text x="489" y="145" font-family="Georgia,serif" font-size="31">key0</text><text x="581" y="982" font-family="Georgia,serif" font-size="31">key2</text>

  <!-- Solid new route and dashed invalidated route. -->
  <path id="key0-to-s4" d="M603 143C630 67 786 68 792 157" fill="none" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  <path id="old-key0-route" d="M620 211C647 239 630 324 701 344C777 366 801 300 896 288" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="13 10" marker-end="url(#arrow)"/>
  <path d="M688 316L736 364M736 316L688 364" stroke="#ed1c24" stroke-width="14"/>

  <!-- Symbol definitions. -->
  <g font-family="Arial,sans-serif" font-size="29">
    <text x="1178" y="356">s0 = server 0</text><text x="1178" y="394">s1 = server 1</text><text x="1178" y="432">s2 = server 2</text><text x="1178" y="470">s3 = server 3</text>
    <text x="1178" y="546">k0 = key0</text><text x="1178" y="584">k1 = key1</text><text x="1178" y="622">k2 = key2</text><text x="1178" y="660">k3 = key3</text>
  </g>
</svg>
