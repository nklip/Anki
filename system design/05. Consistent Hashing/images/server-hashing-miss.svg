<svg xmlns="http://www.w3.org/2000/svg" width="1246" height="814" viewBox="0 0 1246 814" role="img" aria-labelledby="title desc">
  <title id="title">Modulo hashing disruption after changing the server count</title>
  <desc id="desc">Changing the formula to hash modulo three remaps many keys. Red key labels show assignments that no longer match the former four-server distribution.</desc>

  <defs>
    <style>.label{font-family:Georgia,serif;fill:#111}.sans{font-family:Arial,sans-serif;fill:#111}</style>
  </defs>
  <rect width="1246" height="814" fill="white"/>

  <!-- New modulo formula and only three valid indices. -->
  <text x="682" y="101" text-anchor="middle" class="label" font-size="47">serverIndex = hash % 3</text>
  <text x="20" y="218" class="sans" font-size="47">Server Index</text>
  <g text-anchor="middle" class="label" font-size="47">
    <text x="383" y="218">0</text><text x="888" y="218">1</text><text x="1092" y="218">2</text>
  </g>

  <!-- The old four server boxes expose the instability when N changes. -->
  <text x="69" y="400" class="label" font-size="45">Servers</text>
  <g stroke-width="6">
    <rect x="311" y="299" width="164" height="162" rx="24" fill="white" stroke="#c3a4ce"/>
    <rect x="554" y="299" width="164" height="162" rx="24" fill="#b8b8b8" stroke="#05b5d3"/>
    <rect x="804" y="299" width="164" height="162" rx="24" fill="white" stroke="#f13cf1"/>
    <rect x="1011" y="299" width="164" height="162" rx="24" fill="white" stroke="#ffad55"/>
  </g>
  <g text-anchor="middle" class="label" font-size="35">
    <text x="393" y="394">server 0</text><text x="636" y="394">server 1</text><text x="886" y="394">server 2</text><text x="1093" y="394">server 3</text>
  </g>

  <!-- Red labels are the keys whose placement changes. -->
  <text x="83" y="572" class="label" font-size="47">Keys</text>
  <g class="label" font-size="43">
    <text x="320" y="558" fill="#e60000" font-weight="bold">key0</text><text x="320" y="623">key1</text><text x="320" y="688" fill="#e60000" font-weight="bold">key5</text><text x="320" y="753" fill="#e60000" font-weight="bold">key7</text>
    <text x="814" y="558">key2</text><text x="814" y="623" fill="#e60000" font-weight="bold">key4</text><text x="814" y="688">key6</text>
    <text x="1025" y="558" fill="#e60000" font-weight="bold">key3</text>
  </g>
</svg>
