<svg xmlns="http://www.w3.org/2000/svg" width="1418" height="958" viewBox="0 0 1418 958" role="img" aria-labelledby="title desc">
  <title id="title">Virtual nodes spread physical servers around the hash ring</title>
  <desc id="desc">Servers s0 and s1 each own three virtual nodes. Colored outer arcs show the alternating ring ranges owned by each physical server.</desc>

  <rect width="1418" height="958" fill="white"/>

  <!-- Two physical-server legend entries. -->
  <text x="18" y="186" font-family="Georgia,serif" font-size="34">Servers</text>
  <g font-family="Arial,sans-serif" font-size="27">
    <rect x="14" y="231" width="126" height="125" rx="20" fill="#c3a4ce"/><text x="77" y="305" text-anchor="middle">server 0</text>
    <rect x="14" y="402" width="126" height="126" rx="20" fill="#08b5d3"/><text x="77" y="476" text-anchor="middle">server 1</text>
  </g>

  <!-- Ownership arcs are painted before the gray ring and node markers. -->
  <g fill="none" stroke-width="5">
    <path d="M445 177C467 17 984 10 1008 177" stroke="#08b5d3"/>
    <path d="M415 211C279 215 268 685 404 748" stroke="#c3a4ce"/>
    <path d="M1038 189C1115 176 1135 275 1125 356" stroke="#c3a4ce"/>
    <path d="M1131 389C1211 391 1208 687 1037 748" stroke="#08b5d3"/>
    <path d="M1006 804C1000 890 875 928 821 900" stroke="#c3a4ce"/>
    <path d="M760 901C695 958 458 958 435 805" stroke="#08b5d3"/>
  </g>
  <g font-family="Georgia,serif" font-size="29">
    <text x="694" y="34" text-anchor="middle">s1</text><text x="278" y="533" text-anchor="middle">s0</text><text x="1110" y="261" text-anchor="middle">s0</text>
    <text x="1190" y="621" text-anchor="middle">s1</text><text x="944" y="915" text-anchor="middle">s0</text><text x="516" y="940" text-anchor="middle">s1</text>
  </g>

  <!-- Base hash ring. -->
  <circle cx="719" cy="486" r="394" fill="none" stroke="#6f6f6f" stroke-width="7"/>

  <!-- Six virtual nodes, three for each physical server. -->
  <g font-family="Georgia,serif" font-size="26" text-anchor="middle">
    <circle cx="445" cy="209" r="36" fill="#c3a4ce"/><text x="445" y="218">s0_2</text>
    <circle cx="1008" cy="209" r="36" fill="#08b5d3"/><text x="1008" y="218">s1_0</text>
    <circle cx="1100" cy="395" r="36" fill="#c3a4ce"/><text x="1100" y="404">s0_0</text>
    <circle cx="1005" cy="773" r="36" fill="#08b5d3"/><text x="1005" y="782">s1_1</text>
    <circle cx="790" cy="885" r="36" fill="#c3a4ce"/><text x="790" y="894">s0_1</text>
    <circle cx="435" cy="773" r="36" fill="#08b5d3"/><text x="435" y="782">s1_2</text>
  </g>

  <!-- Physical-server notation. -->
  <g font-family="Arial,sans-serif" font-size="29">
    <text x="1177" y="272">s0 = server 0</text><text x="1177" y="312">s1 = server 1</text>
  </g>
</svg>
