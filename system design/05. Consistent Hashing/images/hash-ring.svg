<svg xmlns="http://www.w3.org/2000/svg" width="1454" height="946" viewBox="0 0 1454 946" role="img" aria-labelledby="title desc">
  <title id="title">Wrapping a linear hash space into a ring</title>
  <desc id="desc">A linear hash space runs from x0 to xn. Joining its endpoints produces the circular hash ring shown below.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#111"/></marker>
  </defs>
  <rect width="1454" height="946" fill="white"/>

  <!-- Linear hash space divided into equal slots. -->
  <rect x="25" y="116" width="1334" height="49" fill="white" stroke="#333" stroke-width="2"/>
  <g stroke="#777" stroke-width="2">
    <path d="M50 116V165M75 116V165M100 116V165M125 116V165M150 116V165M175 116V165M200 116V165M225 116V165M250 116V165M275 116V165M300 116V165M325 116V165M350 116V165M375 116V165M400 116V165M425 116V165M450 116V165M475 116V165M500 116V165M525 116V165M550 116V165M575 116V165M600 116V165M625 116V165M650 116V165M675 116V165M700 116V165M725 116V165M750 116V165M775 116V165M800 116V165M825 116V165M850 116V165M875 116V165M900 116V165M925 116V165M950 116V165M975 116V165M1000 116V165M1025 116V165M1050 116V165M1075 116V165M1100 116V165M1125 116V165M1150 116V165M1175 116V165M1200 116V165M1225 116V165M1250 116V165M1275 116V165M1300 116V165M1325 116V165"/>
  </g>
  <path id="x0-pointer" d="M43 51V97" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <path id="xn-pointer" d="M1342 51V97" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="43" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="31">x0</text><text x="1342" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="31">xn</text>
  <text x="727" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="35">Figure 5-3</text>

  <!-- The sentence is part of the source PNG and introduces the wrapping operation. -->
  <text x="20" y="293" font-family="Georgia,serif" font-size="34">By collecting both ends, we get a hash ring as shown in Figure 5-4:</text>

  <!-- Circular representation; x0 and xn meet at the top seam. -->
  <circle cx="711" cy="680" r="235" fill="none" stroke="#6f6f6f" stroke-width="7"/>
  <path d="M723 400V493" stroke="#111" stroke-width="4"/>
  <path id="xn-to-seam" d="M630 370L704 428" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <path id="x0-to-seam" d="M814 370L741 429" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="605" y="349" text-anchor="middle" font-family="Georgia,serif" font-size="31">xn</text><text x="838" y="349" text-anchor="middle" font-family="Georgia,serif" font-size="31">x0</text>
</svg>
