<svg xmlns="http://www.w3.org/2000/svg" width="1402" height="930" viewBox="0 0 1402 930" role="img" aria-labelledby="title desc">
  <title id="title">Servers placed on a consistent hash ring</title>
  <desc id="desc">Four servers are hashed to positions around a circular hash space. The annotation highlights the hash position f of server zero.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#111"/></marker>
  </defs>
  <rect width="1402" height="930" fill="white"/>

  <!-- Server legend. -->
  <text x="15" y="247" font-family="Georgia,serif" font-size="34">Servers</text>
  <g font-family="Arial,sans-serif" font-size="27">
    <rect x="10" y="290" width="120" height="119" rx="19" fill="#c3a4ce"/><text x="70" y="361" text-anchor="middle">server 0</text>
    <rect x="10" y="437" width="120" height="119" rx="19" fill="#08b5d3"/><text x="70" y="508" text-anchor="middle">server 1</text>
    <rect x="10" y="594" width="120" height="119" rx="19" fill="#f13cf1"/><text x="70" y="665" text-anchor="middle">server 2</text>
    <rect x="10" y="736" width="120" height="119" rx="19" fill="#ffad55"/><text x="70" y="807" text-anchor="middle">server 3</text>
  </g>

  <!-- Hash ring and four server positions. -->
  <circle cx="681" cy="530" r="375" fill="none" stroke="#6f6f6f" stroke-width="7"/>
  <g font-family="Georgia,serif" font-size="31" text-anchor="middle">
    <circle cx="950" cy="267" r="30" fill="#c3a4ce"/><text x="950" y="278">s0</text>
    <circle cx="950" cy="795" r="30" fill="#08b5d3"/><text x="950" y="806">s1</text>
    <circle cx="411" cy="795" r="30" fill="#f13cf1"/><text x="411" y="806">s2</text>
    <circle cx="411" cy="267" r="30" fill="#ffad55"/><text x="411" y="278">s3</text>
  </g>

  <!-- Annotation points to the hash position for server zero. -->
  <path id="server-zero-hash" d="M997 117L966 224" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="998" y="101" text-anchor="middle" font-family="Georgia,serif" font-size="31">f (server 0)</text>

  <!-- Symbol definitions on the right. -->
  <g font-family="Arial,sans-serif" font-size="28">
    <text x="1183" y="302">s0 = server 0</text><text x="1183" y="340">s1 = server 1</text><text x="1183" y="378">s2 = server 2</text><text x="1183" y="416">s3 = server 3</text>
  </g>
</svg>
