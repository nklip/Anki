<svg xmlns="http://www.w3.org/2000/svg" width="1478" height="1040" viewBox="0 0 1478 1040" role="img" aria-labelledby="title desc">
  <title id="title">Removing a server from a consistent hash ring</title>
  <desc id="desc">Server s1 is removed. Only key k1's clockwise range moves, continuing past the removed position to server s2.</desc>

  <defs>
    <!-- The head projects five units beyond the shaft endpoint; its wider body hides the four-unit shaft. -->
    <marker id="arrow" markerWidth="28" markerHeight="30" viewBox="0 0 28 30" refX="23" refY="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L28 15L0 30Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1478" height="1040" fill="white"/>
  <!-- The reference places the diagram on a subtly off-white inset. -->
  <rect x="46" y="90" width="1378" height="950" fill="#fefefe"/>

  <!-- Four-server legend before the removal. -->
  <text x="51" y="208" font-family="Georgia,serif" font-size="33">Servers</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="28">
    <rect x="46" y="247" width="120" height="120" rx="19" fill="#c6aad2"/><text x="105" y="317" text-anchor="middle">server 0</text>
    <rect x="46" y="395" width="120" height="120" rx="19" fill="#00b7df"/><text x="105" y="465" text-anchor="middle">server 1</text>
    <rect x="46" y="553" width="120" height="120" rx="19" fill="#ff58ff"/><text x="105" y="623" text-anchor="middle">server 2</text>
    <rect x="46" y="694" width="120" height="120" rx="19" fill="#ffb15e"/><text x="105" y="764" text-anchor="middle">server 3</text>
  </g>

  <!-- Ring, surviving servers, and key positions. -->
  <circle cx="718" cy="493" r="376" fill="none" stroke="#666666" stroke-width="7"/>
  <g font-family="Georgia,serif" font-size="31" text-anchor="middle">
    <circle cx="984" cy="223" r="30" fill="#c6aad2"/><text x="984" y="238">s0</text>
    <circle cx="984" cy="755" r="30" fill="#00b7df"/>
    <circle cx="440" cy="755" r="30" fill="#ff58ff"/><text x="440" y="770">s2</text>
    <circle cx="449" cy="223" r="30" fill="#ffb15e"/><text x="449" y="236">s3</text>
  </g>
  <g font-family="Georgia,serif" font-size="31" text-anchor="middle">
    <circle cx="648" cy="117" r="24" fill="white" stroke="#111" stroke-width="6"/><text x="648" y="130">k0</text>
    <circle cx="1073" cy="613" r="24" fill="white" stroke="#111" stroke-width="6"/><text x="1073" y="626">k1</text>
    <circle cx="624" cy="852" r="24" fill="white" stroke="#111" stroke-width="6"/><text x="624" y="865">k2</text>
    <circle cx="342" cy="565" r="24" fill="white" stroke="#111" stroke-width="6"/><text x="342" y="578">k3</text>
  </g>

  <!-- Red cross marks s1; the affected range now continues clockwise to s2. -->
  <text x="905" y="766" font-family="Arial,sans-serif" font-size="31">s1</text>
  <path d="M972 742L999 769M999 742L972 769" fill="none" stroke="#ef476f" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <!-- The marker endpoint is tucked beneath its head so no shaft tail reaches the tapered nose. -->
  <path id="reassign-k1-to-s2" data-connector="true" d="M1099 613C1123 858 959 1000 735 1010C526 1019 442 904 436 790" fill="none" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Symbol definitions. -->
  <g font-family="Arial,sans-serif" font-size="33">
    <text x="1220" y="295">s0 = server 0</text><text x="1220" y="333">s1 = server 1</text><text x="1220" y="371">s2 = server 2</text><text x="1220" y="409">s3 = server 3</text>
    <text x="1220" y="485">k0 = key0</text><text x="1220" y="523">k1 = key1</text><text x="1220" y="561">k2 = key2</text><text x="1220" y="599">k3 = key3</text>
  </g>
</svg>
