<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1142" height="406" viewBox="0 0 1142 406"
     role="img" aria-labelledby="title desc">
  <title id="title">Metadata data model for buckets and objects</title>
  <desc id="desc">Two schema tables. The bucket table contains bucket_name, bucket_id, owner_id, and enable_versioning. The object table contains bucket_name, object_name, object_version, and object_id.</desc>

  <!-- Shared table geometry and typography. -->
  <defs>
    <style>
      .canvas{fill:#fff}
      .table{fill:#fff;stroke:#000;stroke-width:1.5}
      .divider{fill:none;stroke:#000;stroke-width:1.5}
      text{font-family:Arial,Helvetica,sans-serif;fill:#000;font-size:36px}
      .table-title{font-weight:700;text-anchor:middle}
      .field{font-weight:400;text-anchor:start}
    </style>
  </defs>

  <rect class="canvas" width="1142" height="406"/>

  <!-- Bucket metadata table. -->
  <g id="bucket-table">
    <rect class="table" x="94" y="46" width="422" height="329"/>
    <path class="divider" d="M94 118H516"/>
    <text class="table-title" x="305" y="91">bucket</text>
    <text class="field" x="120" y="172">bucket_name</text>
    <text class="field" x="120" y="228">bucket_id</text>
    <text class="field" x="120" y="285">owner_id</text>
    <text class="field" x="120" y="342">enable_versioning</text>
  </g>

  <!-- Object metadata table. -->
  <g id="object-table">
    <rect class="table" x="643" y="46" width="422" height="329"/>
    <path class="divider" d="M643 118H1065"/>
    <text class="table-title" x="854" y="91">object</text>
    <text class="field" x="668" y="172">bucket_name</text>
    <text class="field" x="668" y="228">object_name</text>
    <text class="field" x="668" y="285">object_version</text>
    <text class="field" x="668" y="342">object_id</text>
  </g>
</svg>
