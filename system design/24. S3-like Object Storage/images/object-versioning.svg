<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1122" height="830" viewBox="0 0 1122 830"
     role="img" aria-labelledby="title desc">
  <title id="title">Uploading an object with versioning</title>
  <desc id="desc">A client uploads an object through a load balancer and API service. The API validates identity, checks whether the object exists and versioning is enabled, creates versioned object metadata, and sends the object to a primary storage service that replicates it to two secondary storage nodes.</desc>

  <!-- Typography and reusable shapes follow the companion uploading-object diagram. -->
  <defs>
    <style>
      .canvas { fill: #fff; }
      text { fill: #000; font-family: Arial, Helvetica, sans-serif; font-weight: 400; }
      .node-label { font-size: 24px; text-anchor: middle; }
      .flow-label { font-size: 23px; text-anchor: middle; }
      .small-label { font-size: 19px; text-anchor: middle; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .panel { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .group { fill: none; stroke: #000; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .store { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .glyph, .arrowhead { fill: #000; }
      .connector, .shaft { fill: none; stroke: #000; stroke-width: 1.5; }
      .tree { fill: none; stroke: #000; stroke-width: 1.25; }
      .step-badge { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .step-number { font-size: 19px; text-anchor: middle; }
    </style>

    <!-- Cylinder reused for the metadata database and every storage disk. -->
    <symbol id="cylinder" viewBox="0 0 50 50">
      <path class="store" d="M1 5.5V44.5A24 5 0 0 0 49 44.5V5.5"/>
      <ellipse class="store" cx="25" cy="5.5" rx="24" ry="5"/>
    </symbol>
  </defs>

  <rect class="canvas" width="1122" height="830"/>

  <!-- Client and step 1: a PUT request enters the load balancer. -->
  <g id="client" class="glyph">
    <circle cx="446.5" cy="53.5" r="12.5"/>
    <path d="M423 89V82C423 75.4 433.5 71 446.5 71S470 75.4 470 82V89Z"/>
  </g>
  <path id="client-stem" class="connector" data-connector="true" d="M446.5 89V121"/>
  <g id="step-1">
    <circle class="step-badge" cx="346" cy="140.5" r="10.5"/>
    <text class="step-number" x="346" y="147">1</text>
    <text class="flow-label" x="462" y="149">HTTP PUT object</text>
  </g>
  <path id="client-load-balancer-shaft" class="shaft" data-connector="true" d="M446.5 161V195"/>
  <polygon id="client-load-balancer-arrowhead" class="arrowhead" points="446.5,208 440,195 453,195"/>

  <!-- Load balancer: the same fan-out glyph as uploading-object.svg. -->
  <text class="node-label" x="304" y="247">Load balancer</text>
  <g id="load-balancer">
    <rect class="box" x="391" y="208" width="110" height="59"/>
    <rect class="box" x="439" y="216" width="14" height="9"/>
    <path class="connector" data-connector="true" d="M446 225V238"/>
    <path class="tree" data-connector="true" d="M414 238H478"/>
    <path class="tree" data-connector="true" d="M414 238V249"/>
    <path class="tree" data-connector="true" d="M446 238V249"/>
    <path class="tree" data-connector="true" d="M478 238V249"/>
    <polygon class="arrowhead" points="414,254 410,247 418,247"/>
    <polygon class="arrowhead" points="446,254 442,247 450,247"/>
    <polygon class="arrowhead" points="478,254 474,247 482,247"/>
    <rect class="box" x="407" y="250" width="14" height="9"/>
    <rect class="box" x="439" y="250" width="14" height="9"/>
    <rect class="box" x="471" y="250" width="14" height="9"/>
  </g>
  <path id="load-balancer-api-shaft" class="shaft" data-connector="true" d="M446.5 267V343"/>
  <polygon id="load-balancer-api-arrowhead" class="arrowhead" points="446.5,356 440,343 453,343"/>

  <!-- The API service coordinates validation, version checks, metadata, and object bytes. -->
  <rect id="api-service" class="box" x="339" y="356" width="218" height="36"/>
  <text class="node-label" x="448" y="383">API Service</text>

  <!-- Step 2: identity validation is split around its label to keep the arrow clear. -->
  <g id="identity-service">
    <path class="box" d="M51 346H118V408H51Z"/>
    <path class="box" d="M51 346L58 339H124L118 346Z"/>
    <path class="box" d="M118 346L124 339V401L118 408Z"/>
    <path fill="none" stroke="#000" stroke-width="2.7" d="M111 398V393A7 7 0 0 1 125 393V398"/>
    <rect class="glyph" x="106" y="397" width="24" height="23" rx="3"/>
    <circle cx="118" cy="408" r="2.3" fill="#fff"/>
  </g>
  <text class="flow-label" x="5" y="444" style="text-anchor:start">Identity Service</text>
  <path id="api-identity-connector" class="connector" data-connector="true" d="M339 374H321"/>
  <path id="identity-arrow-shaft" class="shaft" data-connector="true" d="M167 374H138"/>
  <polygon id="identity-arrowhead" class="arrowhead" points="124,374 138,367 138,381"/>
  <g id="step-2">
    <circle class="step-badge" cx="239" cy="324" r="10.5"/>
    <text class="step-number" x="239" y="330.5">2</text>
    <text class="flow-label" x="252" y="355">
      <tspan x="252">Identity</tspan>
      <tspan x="252" dy="25" transform="translate(252 0) scale(.84 1) translate(-252 0)">validation and</tspan>
      <tspan x="252" dy="25" transform="translate(252 0) scale(.84 1) translate(-252 0)">authorization</tspan>
    </text>
  </g>

  <!-- Steps 4 and 5: evaluate the versioning rule, then create object metadata. -->
  <g id="step-4">
    <circle class="step-badge" cx="190" cy="476" r="10.5"/>
    <text class="step-number" x="190" y="482.5">4</text>
    <text class="flow-label" x="198" y="459" style="text-anchor:start">
      <tspan x="208">Check:</tspan>
      <tspan x="208" dy="25" transform="translate(228 0) scale(.9 1) translate(-228 0)">1. Object exists?</tspan>
      <tspan x="208" dy="25" transform="translate(228 0) scale(.79 1) translate(-228 0)">2. Versioning enabled?</tspan>
    </text>
  </g>
  <path id="api-metadata-shaft" class="shaft" data-connector="true" d="M447.5 392V584"/>
  <polygon id="api-metadata-arrowhead" class="arrowhead" points="447.5,598 440.5,584 454.5,584"/>
  <g id="step-5">
    <circle class="step-badge" cx="470" cy="476" r="10.5"/>
    <text class="step-number" x="470" y="482.5">5</text>
    <text class="flow-label" x="490" y="469" style="text-anchor:start">
      <tspan x="490">Create object</tspan>
      <tspan x="490" dy="25">metadata</tspan>
    </text>
  </g>

  <!-- Metadata store receives the new versioned object record. -->
  <g id="metadata-store">
    <rect class="group" x="280" y="559" width="335" height="228"/>
    <rect class="box" x="324" y="598" width="248" height="35"/>
    <text class="node-label" x="448" y="624">Metadata Service</text>
    <path id="metadata-database-shaft" class="shaft" data-connector="true" d="M448 633V681"/>
    <polygon id="metadata-database-arrowhead" class="arrowhead" points="448,695 441,681 455,681"/>
    <use href="#cylinder" x="423" y="694" width="50" height="50"/>
    <text class="node-label" x="448" y="773">Metadata DB</text>
    <text class="node-label" x="448" y="811">Metadata Store</text>
  </g>

  <!-- Data store: the primary receives the upload and replicates to two secondaries. -->
  <g id="data-store">
    <rect class="group" x="713" y="106" width="381" height="536"/>

    <g id="secondary-storage-node-top">
      <rect class="panel" x="742" y="134" width="325" height="136"/>
      <text class="node-label" x="1006" y="159">Secondary</text>
      <rect class="box" x="765" y="166" width="133" height="71"/>
      <text class="node-label" x="831.5" y="197">
        <tspan x="831.5">Storage</tspan>
        <tspan x="831.5" dy="26">Service</tspan>
      </text>
      <path id="top-service-disk-shaft" class="shaft" data-connector="true" d="M898 202H980"/>
      <polygon id="top-service-disk-arrowhead" class="arrowhead" points="994,202 980,195 980,209"/>
      <use href="#cylinder" x="993" y="177" width="50" height="50"/>
      <text class="small-label" x="1006" y="263">Storage Node</text>
    </g>

    <g id="primary-storage-node">
      <rect class="panel" x="742" y="307" width="325" height="134"/>
      <text class="node-label" x="1023" y="331">Primary</text>
      <rect class="box" x="765" y="338" width="133" height="70"/>
      <text class="node-label" x="831.5" y="368">
        <tspan x="831.5">Storage</tspan>
        <tspan x="831.5" dy="26">Service</tspan>
      </text>
      <path id="primary-service-disk-shaft" class="shaft" data-connector="true" d="M898 374H980"/>
      <polygon id="primary-service-disk-arrowhead" class="arrowhead" points="994,374 980,367 980,381"/>
      <use href="#cylinder" x="993" y="349" width="50" height="50"/>
      <text class="small-label" x="1006" y="434">Storage Node</text>
    </g>

    <g id="secondary-storage-node-bottom">
      <rect class="panel" x="742" y="478" width="325" height="135"/>
      <text class="node-label" x="1006" y="503">Secondary</text>
      <rect class="box" x="765" y="510" width="133" height="70"/>
      <text class="node-label" x="831.5" y="540">
        <tspan x="831.5">Storage</tspan>
        <tspan x="831.5" dy="26">Service</tspan>
      </text>
      <path id="bottom-service-disk-shaft" class="shaft" data-connector="true" d="M898 545H980"/>
      <polygon id="bottom-service-disk-arrowhead" class="arrowhead" points="994,545 980,538 980,552"/>
      <use href="#cylinder" x="993" y="520" width="50" height="50"/>
      <text class="small-label" x="1006" y="606">Storage Node</text>
    </g>

    <!-- Replication noses meet the secondary service borders without entering the boxes. -->
    <path id="replication-up-shaft" class="shaft" data-connector="true" d="M831 338V251"/>
    <polygon id="replication-up-arrowhead" class="arrowhead" points="831,237 824,251 838,251"/>
    <path id="replication-down-shaft" class="shaft" data-connector="true" d="M831 408V496"/>
    <polygon id="replication-down-arrowhead" class="arrowhead" points="831,510 824,496 838,496"/>

    <text class="node-label" x="904" y="666">Data Store</text>
  </g>

  <!-- Step 3 is painted last so its arrow stays visible across both store boundaries. -->
  <path id="api-upload-connector" class="connector" data-connector="true" d="M557 374H596"/>
  <path id="upload-object-shaft" class="shaft" data-connector="true" d="M670 374H751"/>
  <polygon id="upload-object-arrowhead" class="arrowhead" points="765,374 751,367 751,381"/>
  <g id="step-3">
    <circle class="step-badge" cx="633" cy="333" r="10.5"/>
    <text class="step-number" x="633" y="339.5">3</text>
    <text class="flow-label" x="633" y="366">
      <tspan x="633">Upload</tspan>
      <tspan x="633" dy="25" transform="translate(633 0) scale(.82 1) translate(-633 0)">object</tspan>
    </text>
  </g>
</svg>
