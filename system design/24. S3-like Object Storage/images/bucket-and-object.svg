<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="648"
     viewBox="0 0 1400 648"
     role="img"
     aria-labelledby="bucket-object-title bucket-object-desc">
  <title id="bucket-object-title">Bucket and object composition</title>
  <desc id="bucket-object-desc">A bucket is associated with bucket metadata such as its ID, name, policy, and life cycle. An object is associated with binary data and object metadata such as its ID, name, version, expiration, access control, and bucket.</desc>

  <!-- Shared border, typography, connector, and symbol styles reproduce the PNG etalon. -->
  <defs>
    <style>
      .metadata-frame { fill: #fff; stroke: #111; stroke-width: 2; }
      .diagram-text { font: 400 36px Arial, Helvetica, sans-serif; fill: #050505; }
      .centered { text-anchor: middle; }
      .relation-line { fill: none; stroke: #111; stroke-width: 2; }
      .binary-data { font: 400 36px "Arial Narrow", Arial, sans-serif; letter-spacing: .4px; fill: #050505; }
    </style>
  </defs>
  <rect id="background" width="1400" height="648" fill="#fff"/>

  <!-- Relationship lines are painted first so their endpoints disappear cleanly under symbols and frames. -->
  <g id="relationships" class="relation-line">
    <path id="bucket-metadata-relation" data-connector="true" d="M334 284H530"/>
    <path id="object-data-relation" data-connector="true" d="M866 269L1073 189"/>
    <path id="object-metadata-relation" data-connector="true" d="M866 304L1073 417"/>
  </g>

  <!-- Bucket-level metadata remains separate from the bucket symbol. -->
  <g id="bucket-metadata">
    <rect class="metadata-frame" x="81" y="167" width="263" height="235"/>
    <text class="diagram-text centered" x="207.5" y="159">Metadata</text>
    <text class="diagram-text" x="114" y="220">ID</text>
    <text class="diagram-text" x="114" y="259">Bucket Name</text>
    <text class="diagram-text" x="114" y="297">Policy</text>
    <text class="diagram-text" x="114" y="335">Life Cycle</text>
    <text class="diagram-text" x="114" y="374">…</text>
  </g>

  <!-- The bucket icon is an editable black pail with a white opening. -->
  <g id="bucket-symbol">
    <path d="M526 243H599L590 319Q589 326 582 326H542Q535 326 534 319Z" fill="#000"/>
    <path d="M534 251H591L588 269H537Z" fill="#fff"/>
    <text class="diagram-text centered" x="562.5" y="384">Bucket</text>
  </g>

  <!-- The object node branches to its raw bytes and its independently managed metadata. -->
  <g id="object-symbol">
    <circle cx="829" cy="284.5" r="40.5" fill="#fff" stroke="#000" stroke-width="8"/>
    <text class="diagram-text centered" x="829" y="384">Object</text>
  </g>

  <!-- Binary object data uses the condensed numeral style visible in the etalon. -->
  <g id="object-data">
    <rect class="metadata-frame" x="1073" y="71" width="254" height="141"/>
    <text class="diagram-text centered" x="1200" y="63">Data</text>
    <text class="binary-data" x="1093" y="115">0110101010110</text>
    <text class="binary-data" x="1093" y="153">1010010101001</text>
    <text class="binary-data" x="1093" y="191">0100100010100</text>
  </g>

  <!-- Object metadata includes versioning, expiration, access, and owning bucket fields. -->
  <g id="object-metadata">
    <rect class="metadata-frame" x="1073" y="349" width="264" height="273"/>
    <text class="diagram-text centered" x="1200" y="342">Metadata</text>
    <text class="diagram-text" x="1089" y="395">ID</text>
    <text class="diagram-text" x="1089" y="433">Object Name</text>
    <text class="diagram-text" x="1089" y="471">Version ID</text>
    <text class="diagram-text" x="1089" y="510">Expiration</text>
    <text class="diagram-text" x="1089" y="548">Access Control</text>
    <text class="diagram-text" x="1089" y="586">Bucket</text>
  </g>
</svg>
