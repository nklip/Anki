<svg xmlns="http://www.w3.org/2000/svg" width="1186" height="164" viewBox="0 0 1186 164" role="img" aria-labelledby="title desc">
  <title id="title">Twitter Snowflake 64-bit identifier layout</title>
  <desc id="desc">A Snowflake ID contains one sign bit, 41 timestamp bits, 5 datacenter bits, 5 machine bits, and 12 sequence bits.</desc>

  <!-- Serif typography and fine rules reproduce the original bit-field table. -->
  <defs>
    <style>
      .bit-count { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; fill: #111; text-anchor: middle; }
      .field-label { font-family: 'Times New Roman', Times, serif; font-size: 27px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .rule { fill: #fff; stroke: #333; stroke-width: 1; }
    </style>
  </defs>

  <!-- Bit counts above each field. -->
  <g id="bit-counts">
    <text class="bit-count" x="28" y="33">1 bit</text>
    <text class="bit-count" x="267" y="33">41 bits</text>
    <text class="bit-count" x="585" y="33">5 bits</text>
    <text class="bit-count" x="754" y="33">5 bits</text>
    <text class="bit-count" x="1012" y="33">12 bits</text>
  </g>

  <!-- 64-bit field table. -->
  <g id="snowflake-fields">
    <rect class="rule" x="11" y="43" width="1159" height="102"/>
    <path d="M34 43 V145 M501 43 V145 M668 43 V145 M839 43 V145" fill="none" stroke="#777" stroke-width="1"/>
    <text class="field-label" x="22.5" y="95">0</text>
    <text class="field-label" x="267.5" y="95">timestamp</text>
    <text class="field-label" x="584.5" y="95">datacenter ID</text>
    <text class="field-label" x="753.5" y="95">machine ID</text>
    <text class="field-label" x="1004.5" y="95">sequence number</text>
  </g>
</svg>
