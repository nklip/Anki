<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="450" viewBox="0 0 1202 450" role="img" aria-labelledby="title desc">
  <title id="title">Ticket server ID generation</title>
  <desc id="desc">Four web servers connect to a single ticket server that assigns unique identifiers.</desc>

  <!-- Typography and connector style follow the simple monochrome source diagram. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 29px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .node { fill: #fff; stroke: #111; stroke-width: 2; }
    </style>
  </defs>

  <!-- Dashed system boundary. -->
  <rect x="18" y="5" width="1165" height="433" rx="63" fill="#fff" stroke="#43b8ca" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- Connections are behind the boxes and converge at the ticket-server boundary. -->
  <g id="ticket-connections" fill="none" stroke="#111" stroke-width="2">
    <path d="M175 144 L539 301"/>
    <path d="M470 144 L539 301"/>
    <path d="M726 144 L539 301"/>
    <path d="M1021 144 L539 301"/>
  </g>

  <!-- Web-server clients. -->
  <g id="web-servers">
    <rect class="node" x="56" y="25" width="238" height="119"/>
    <text class="label" x="175" y="87">Web Server</text>
    <rect class="node" x="352" y="25" width="237" height="119"/>
    <text class="label" x="470.5" y="87">Web Server</text>
    <rect class="node" x="607" y="25" width="238" height="119"/>
    <text class="label" x="726" y="87">Web Server</text>
    <rect class="node" x="903" y="25" width="237" height="119"/>
    <text class="label" x="1021.5" y="87">Web Server</text>
  </g>

  <!-- Central ticket server. -->
  <g id="ticket-server">
    <rect class="node" x="421" y="301" width="237" height="119"/>
    <text class="label" x="539.5" y="363">Ticket Server</text>
  </g>
</svg>
