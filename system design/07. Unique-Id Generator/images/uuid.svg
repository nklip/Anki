<svg xmlns="http://www.w3.org/2000/svg" width="1192" height="324" viewBox="0 0 1192 324" role="img" aria-labelledby="title desc">
  <title id="title">UUID generation at each web server</title>
  <desc id="desc">Four independent web servers each include their own local ID generator.</desc>

  <!-- Reusable node styling follows the source diagram. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 29px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .solid-edge { fill: #fff; stroke: #111; stroke-width: 2; }
      .id-edge { fill: #fff; stroke: #111; stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <!-- Dashed boundary groups the distributed web-server processes. -->
  <rect x="7" y="31" width="1158" height="280" rx="48" fill="#fff" stroke="#3cb6cc" stroke-width="4" stroke-dasharray="14 12"/>

  <!-- Each server owns an independent ID generator directly below it. -->
  <g id="uuid-generators">
    <g id="uuid-node-1">
      <rect class="solid-edge" x="26" y="71" width="240" height="120"/>
      <rect class="id-edge" x="26" y="191" width="240" height="80"/>
      <text class="label" x="146" y="133">Web Server</text>
      <text class="label" x="146" y="233">ID gen</text>
    </g>
    <g id="uuid-node-2">
      <rect class="solid-edge" x="325" y="71" width="240" height="120"/>
      <rect class="id-edge" x="325" y="191" width="240" height="80"/>
      <text class="label" x="445" y="133">Web Server</text>
      <text class="label" x="445" y="233">ID gen</text>
    </g>
    <g id="uuid-node-3">
      <rect class="solid-edge" x="585" y="71" width="240" height="120"/>
      <rect class="id-edge" x="585" y="191" width="240" height="80"/>
      <text class="label" x="705" y="133">Web Server</text>
      <text class="label" x="705" y="233">ID gen</text>
    </g>
    <g id="uuid-node-4">
      <rect class="solid-edge" x="884" y="71" width="241" height="120"/>
      <rect class="id-edge" x="884" y="191" width="241" height="80"/>
      <text class="label" x="1004.5" y="133">Web Server</text>
      <text class="label" x="1004.5" y="233">ID gen</text>
    </g>
  </g>
</svg>
