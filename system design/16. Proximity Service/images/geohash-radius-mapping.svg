<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="390" viewBox="0 0 1140 390" role="img" aria-labelledby="title desc">
  <title id="title">Search radius to geohash length mapping</title>
  <desc id="desc">A two-column table maps radii from 0.5 to 20 kilometers to recommended geohash lengths from six to four characters.</desc>
  <!-- Table grid and typography. -->
  <defs><style>.grid{fill:none;stroke:#222;stroke-width:1.2}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:28px;text-anchor:middle;dominant-baseline:middle}.head{font-size:29px;font-weight:500}</style></defs>
  <rect width="1140" height="390" fill="#fff"/>
  <g class="grid"><rect x="4" y="20" width="1132" height="352"/><path d="M570 20V372M4 78H1136M4 137H1136M4 196H1136M4 254H1136M4 313H1136"/></g>
  <!-- Headers and row values. -->
  <g class="t"><text class="head" x="287" y="50">Radius (Kilometers)</text><text class="head" x="853" y="50">Geohash length</text><text x="287" y="108">0.5 km (0.31 mile)</text><text x="853" y="108">6</text><text x="287" y="167">1 km (0.62 mile)</text><text x="853" y="167">5</text><text x="287" y="225">2 km (1.24 mile)</text><text x="853" y="225">5</text><text x="287" y="284">5 km (3.1 mile)</text><text x="853" y="284">4</text><text x="287" y="343">20 km (12.42 mile)</text><text x="853" y="343">4</text></g>
</svg>
