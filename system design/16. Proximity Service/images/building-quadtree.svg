<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="752" viewBox="0 0 1148 752" role="img" aria-labelledby="title desc">
  <title id="title">Building a quadtree by subdividing geographic regions</title>
  <desc id="desc">A root covering 200 meters splits into northwest, northeast, southwest, and southeast regions. One branch continues through internal nodes to leaf nodes, while dashed branches stand for omitted layers.</desc>
  <!-- Shared node and connector styling. -->
  <defs><style>.line{fill:none;stroke:#333;stroke-width:2}.many{stroke-dasharray:7 6}.node{fill:#fff;stroke:#222;stroke-width:2}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:22px}.small{font-size:17px}.value{text-anchor:end}</style></defs>
  <rect width="1148" height="752" fill="#fff"/>
  <!-- Labeled branches are split around compass text, matching the gaps in the PNG original. -->
  <g class="line">
    <path d="M428 44L336 99M291 126L216 171M428 44L396 99M380 126L354 171M428 44L455 99M469 126L491 171M428 44L514 99M557 126L627 171"/>
    <path d="M354 171L264 230M218 260L147 307M354 171L324 230M309 260L285 307M354 171L384 230M399 260L422 307M354 171L443 230M489 260L560 307"/>
    <path class="many" d="M285 307L79 439M285 307L216 439M285 307L354 439M285 307L491 439"/>
    <path d="M354 439L155 581M354 439L292 581M354 439L430 581M354 439L567 581M567 581L499 706M567 581L636 706"/>
  </g>
  <!-- Internal nodes are circles; leaf nodes are squares. -->
  <g class="node">
    <circle cx="428" cy="44" r="20"/><circle cx="216" cy="171" r="20"/><circle cx="354" cy="171" r="20"/><circle cx="491" cy="171" r="20"/><circle cx="627" cy="171" r="20"/>
    <circle cx="147" cy="307" r="20"/><circle cx="285" cy="307" r="20"/><circle cx="422" cy="307" r="20"/><circle cx="560" cy="307" r="20"/>
    <circle cx="79" cy="439" r="20"/><circle cx="216" cy="439" r="20"/><circle cx="354" cy="439" r="20"/><circle cx="491" cy="439" r="20"/>
    <rect x="136" y="562" width="38" height="38"/><rect x="273" y="562" width="38" height="38"/><rect x="411" y="562" width="38" height="38"/>
    <circle cx="567" cy="581" r="20"/><rect x="480" y="687" width="38" height="38"/><rect x="617" y="687" width="38" height="38"/>
  </g>
  <!-- Values and compass branch labels. -->
  <g class="t">
    <text x="458" y="52">200m</text><text class="value" x="191" y="179">40m</text><text class="value" x="329" y="179">30m</text><text class="value" x="466" y="179">70m</text><text class="value" x="602" y="179">60m</text>
    <text class="value" x="122" y="315">12m</text><text class="value" x="260" y="315">4m</text><text class="value" x="397" y="315">5m</text><text class="value" x="535" y="315">9m</text>
    <text class="value" x="131" y="590">50</text><text class="value" x="268" y="590">90</text><text class="value" x="406" y="590">60</text><text class="value" x="542" y="590">140</text><text class="value" x="475" y="715">60</text><text class="value" x="612" y="715">80</text>
    <text x="286" y="118" class="small">nw</text><text x="379" y="118" class="small">ne</text><text x="451" y="118" class="small">sw</text><text x="526" y="118" class="small">se</text>
    <text x="227" y="253" class="small">nw</text><text x="308" y="253" class="small">ne</text><text x="379" y="253" class="small">sw</text><text x="458" y="253" class="small">se</text><text x="287" y="448">340</text>
  </g>
  <!-- Legend mirrors the source image. -->
  <g transform="translate(775 22)"><rect x="0" y="0" width="354" height="178" fill="#fff" stroke="#222" stroke-width="1.5"/><path class="line many" d="M18 29H83"/><text class="t" x="98" y="37">Represent many layers</text><circle class="node" cx="52" cy="73" r="20"/><text class="t" x="98" y="82">Internal node</text><rect class="node" x="33" y="114" width="38" height="38"/><text class="t" x="98" y="143">Leaf node</text></g>
</svg>
