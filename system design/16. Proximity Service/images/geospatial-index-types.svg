<svg xmlns="http://www.w3.org/2000/svg" width="958" height="372" viewBox="0 0 958 372" role="img" aria-labelledby="title desc">
  <title id="title">Geospatial index types</title>
  <desc id="desc">Geospatial indexes divide into hash indexes and tree indexes. Hash includes even grid, geohash, and Cartesian tiers. Tree includes quadtree, Google S2, and R-tree.</desc>
  <!-- Shared box and text styles. -->
  <defs><style>.edge{fill:none;stroke:#555;stroke-width:1.6}.box{fill:#fff;stroke:#444;stroke-width:1.5}.chosen{fill:#f0a4ef}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:17px;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="958" height="372" fill="#fff"/>
  <!-- Hierarchy edges stay behind the labeled boxes. -->
  <path class="edge" d="M479 99L244 168M479 99L690 168M244 218L97 294M244 218V294M244 218L393 294M690 218L541 294M690 218V294M690 218L838 294"/>
  <!-- Index family and implementations. -->
  <g class="box"><rect x="433" y="49" width="92" height="50"/><rect x="198" y="168" width="92" height="50"/><rect x="644" y="168" width="92" height="50"/><rect class="chosen" x="52" y="294" width="90" height="50"/><rect class="chosen" x="199" y="294" width="91" height="50"/><rect x="348" y="294" width="90" height="50"/><rect class="chosen" x="496" y="294" width="90" height="50"/><rect class="chosen" x="645" y="294" width="90" height="50"/><rect x="793" y="294" width="90" height="50"/></g>
  <g class="t"><text x="479" y="75">Index</text><text x="244" y="194">Hash</text><text x="690" y="194">Tree</text><text x="97" y="320">Even Grid</text><text x="245" y="320">Geohash</text><text x="393" y="311">Cartesian</text><text x="393" y="329">Tiers</text><text x="541" y="320">Quadtree</text><text x="690" y="320">Google S2</text><text x="838" y="320">RTree</text></g>
</svg>
