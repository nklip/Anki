<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="340" viewBox="0 0 1158 340" role="img" aria-labelledby="title desc">
  <title id="title">Progressive quadtree subdivision</title>
  <desc id="desc">A 200 meter square splits into four quadrants, then the northeast quadrant splits again into four smaller cells.</desc>
  <!-- Outlined stage boxes and transition arrows. -->
  <defs><style>.g{fill:none;stroke:#222;stroke-width:1.5}.t{font:18px Arial,Helvetica,sans-serif;fill:#222;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="1158" height="340" fill="#fff"/>
  <!-- Stage 1: one region. -->
  <rect class="g" x="44" y="24" width="288" height="288"/><text class="t" x="188" y="168">200m</text>
  <!-- Hollow arrowheads stay between stages. -->
  <path class="g" d="M333 163H412V151L440 168L412 186V175H333Z"/>
  <!-- Stage 2: four equal quadrants. -->
  <rect class="g" x="440" y="24" width="288" height="288"/><path class="g" d="M584 24V312M440 168H728"/><g class="t"><text x="512" y="98">NW (40m)</text><text x="656" y="98">NE (30m)</text><text x="512" y="243">SW (70m)</text><text x="656" y="243">SE (60m)</text></g>
  <path class="g" d="M729 163H807V151L836 168L807 186V175H729Z"/>
  <!-- Stage 3: northeast quadrant subdivided again. -->
  <rect class="g" x="836" y="24" width="288" height="288"/><path class="g" d="M980 24V312M836 168H1124M1052 24V168M980 96H1124"/><g class="t"><text x="1016" y="61">10m</text><text x="1088" y="61">11m</text><text x="1016" y="133">4m</text><text x="1088" y="133">5m</text></g>
</svg>
