<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="884" viewBox="0 0 1122 884" role="img" aria-labelledby="title desc">
  <title id="title">Nearby points on a Hilbert curve</title>
  <desc id="desc">A repeated Hilbert curve maps two-dimensional cells to positions from zero to one. Purple points in nearby cells map to neighboring one-dimensional values near one half.</desc>
  <!-- A reusable third-order Hilbert motif keeps the vector compact. -->
  <defs>
    <path id="h" d="M17 17V68H51V34H85V68H119V17M17 85H51V119H17V153H68V119H102V153H153V119H119V85H153V17H102V51H68V17" fill="none" stroke="#adb1b8" stroke-width="2.2"/>
    <style>.cell{fill:#e8dfd8}.grid{stroke:#fff;stroke-width:4}.axis{stroke:#555;stroke-width:3}.tick{stroke:#555;stroke-width:3}.purple{fill:none;stroke:#7a42cf;stroke-width:3;opacity:.75}.dot{fill:#8046d2;opacity:.75}.orange{fill:none;stroke:#df8b64;stroke-width:3;opacity:.75}.ot{fill:#df8b64;opacity:.75}.t{font:22px Arial,Helvetica,sans-serif;fill:#333;text-anchor:middle}</style>
  </defs>
  <rect width="1122" height="884" fill="#fff"/>
  <!-- Five by seven repeated curve cells. -->
  <rect class="cell" x="22" y="20" width="1068" height="744"/>
  <g opacity=".72"><use href="#h" x="22" y="20"/><use href="#h" x="174" y="20"/><use href="#h" x="326" y="20"/><use href="#h" x="478" y="20"/><use href="#h" x="630" y="20"/><use href="#h" x="782" y="20"/><use href="#h" x="934" y="20"/><use href="#h" x="22" y="168"/><use href="#h" x="174" y="168"/><use href="#h" x="326" y="168"/><use href="#h" x="478" y="168"/><use href="#h" x="630" y="168"/><use href="#h" x="782" y="168"/><use href="#h" x="934" y="168"/><use href="#h" x="22" y="316"/><use href="#h" x="174" y="316"/><use href="#h" x="326" y="316"/><use href="#h" x="478" y="316"/><use href="#h" x="630" y="316"/><use href="#h" x="782" y="316"/><use href="#h" x="934" y="316"/><use href="#h" x="22" y="464"/><use href="#h" x="174" y="464"/><use href="#h" x="326" y="464"/><use href="#h" x="478" y="464"/><use href="#h" x="630" y="464"/><use href="#h" x="782" y="464"/><use href="#h" x="934" y="464"/><use href="#h" x="22" y="612"/><use href="#h" x="174" y="612"/><use href="#h" x="326" y="612"/><use href="#h" x="478" y="612"/><use href="#h" x="630" y="612"/><use href="#h" x="782" y="612"/><use href="#h" x="934" y="612"/></g>
  <g class="grid"><path d="M22 168H1090M22 316H1090M22 464H1090M22 612H1090M174 20V764M326 20V764M478 20V764M630 20V764M782 20V764M934 20V764"/></g>
  <!-- Projection lines join selected map points to their curve values. -->
  <path class="orange" d="M34 816L102 651M34 816L102 651"/><circle class="ot" cx="34" cy="816" r="10"/><circle class="ot" cx="102" cy="651" r="11"/>
  <path class="purple" d="M548 816L510 117M548 816L512 134M548 816L530 117M548 816L543 151M582 816L750 117M582 816L776 117M582 816L790 151M582 816L807 134"/>
  <g class="dot"><circle cx="548" cy="816" r="12"/><circle cx="582" cy="816" r="12"/><circle cx="510" cy="117" r="11"/><circle cx="512" cy="134" r="11"/><circle cx="530" cy="117" r="11"/><circle cx="543" cy="151" r="11"/><circle cx="750" cy="117" r="11"/><circle cx="776" cy="117" r="11"/><circle cx="790" cy="151" r="11"/><circle cx="807" cy="134" r="11"/></g>
  <!-- One-dimensional scale. -->
  <path class="axis" d="M22 816H1090"/><g class="tick"><path d="M22 795V837M156 795V837M289 795V837M423 795V837M556 795V837M690 795V837M823 795V837M957 795V837M1090 795V837"/></g>
  <g class="t"><text x="22" y="868">0</text><text x="156" y="868">0.125</text><text x="289" y="868">0.250</text><text x="423" y="868">0.375</text><text x="556" y="868">0.500</text><text x="690" y="868">0.625</text><text x="823" y="868">0.750</text><text x="957" y="868">0.875</text><text x="1090" y="868">1</text></g>
</svg>
