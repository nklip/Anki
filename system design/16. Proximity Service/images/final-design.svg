<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="812" viewBox="0 0 1172 812" role="img" aria-labelledby="title desc">
  <title id="title">Final design of a proximity service</title>
  <desc id="desc">A user reaches a load balancer. Nearby searches use the location-based service and a Redis cluster; business lookups use the business service and primary database. Data is replicated and synchronized.</desc>
  <!-- Shared icons and flow styling. -->
  <defs>
    <!-- All ten arrows share this symmetric 10-by-10 head. The 1.6-wide shaft ends at refX 7.5,
         where the triangle is 2.5 tall, so no shaft protrudes past the tapered nose. The visible
         tip projects 2.5 units beyond each endpoint; routes allow a 2-unit gap to target strokes. -->
    <marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <symbol id="user" viewBox="0 0 54 54"><circle cx="27" cy="12" r="11"/><path d="M3 49V41C3 29 51 29 51 41V49Z"/></symbol>
    <!-- Cylinder measured off the etalon: lid ellipse rx 43.1 / ry 8.75 centred at local y 13.75,
         walls down to y 82.25 so the base arc bottoms out at y 91. Elliptical arcs put the body's
         shoulders on exactly the same curve as the lid. The previous cubic approximation sat the
         lid ~4 units low and 1.25 too deep, which is what left the Write arrowhead short of the rim. -->
    <symbol id="db" viewBox="0 0 88 93">
      <path d="M0.9 13.75A43.1 8.75 0 0 1 87.1 13.75V82.25A43.1 8.75 0 0 1 0.9 82.25Z" fill="currentColor" stroke="#111" stroke-width="1.6"/>
      <ellipse cx="44" cy="13.75" rx="43.1" ry="8.75" fill="currentColor" stroke="#111" stroke-width="1.6"/>
    </symbol>
    <!-- Official Redis mark, reused verbatim from 25. Real-time Gaming Leaderboard/images/hash-partition.svg,
         so every Redis icon in this repository shares one definition and the brand palette. Replaces an
         earlier devicon copy recoloured to pure reds (#ec0000/#b30001) for PNG-etalon fidelity. -->
    <symbol id="redis-cube" viewBox="17 0 95 81" preserveAspectRatio="xMidYMid meet">
      <path fill="#A41E11" d="M106.9 62.7c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.4-2.1-31.7-13.1-36.7-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c.1.9-1 1.9-3.5 3.2z"/>
      <path fill="#D82C20" d="M106.9 53.3c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8C53.5 68 26.2 57 21.2 54.6c-4.9-2.4-5-4-.2-5.9 4.8-1.9 32.1-12.6 37.8-14.6 5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 30.5 12 35.3 13.7 5 1.8 5.2 3.2.2 5.8z"/>
      <path fill="#A41E11" d="M106.9 47.4c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.4-2.1-31.7-13.2-36.7-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c.1.9-1 1.9-3.5 3.2z"/>
      <path fill="#D82C20" d="M106.9 38c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5-4.9-2.4-5-4-.2-5.9 4.8-1.9 32.1-12.6 37.8-14.6 5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 30.5 12 35.3 13.7 4.9 1.7 5.1 3.2.1 5.8z"/>
      <path fill="#A41E11" d="M106.9 31.5c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c0 .8-1.1 1.9-3.6 3.2z"/>
      <path fill="#D82C20" d="M106.9 22.1c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5s-5-4-.2-5.9c4.8-1.9 32.1-12.6 37.8-14.6C64.7.8 66.7.8 71.5 2.6c4.9 1.8 30.5 12 35.3 13.7 4.9 1.7 5.1 3.2.1 5.8z"/>
      <path fill="#fff" d="M76.2 13l-8.1.8-1.8 4.4-2.9-4.9-9.3-.8L61 10l-2-3.8 6.5 2.5 6.1-2-1.7 4zM65.8 34.1l-15-6.3 21.6-3.3z"/>
      <ellipse fill="#fff" cx="45" cy="19.9" rx="11.5" ry="4.5"/>
      <path fill="#7A0C00" d="M85.7 14.2l12.8 5-12.8 5.1z"/>
      <path fill="#AD2115" d="M71.6 19.8l14.1-5.6v10.1l-1.3.5z"/>
    </symbol>
    <style>.box{fill:#fff;stroke:#111;stroke-width:1.6}.flow{fill:none;stroke:#111;stroke-width:1.6;marker-end:url(#arrow)}.plain{fill:none;stroke:#111;stroke-width:1.6}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}.node{font-size:24px}.label{font-size:22px}.small{font-size:18px}.cluster{font-size:23px}</style>
  </defs>
  <rect width="1172" height="812" fill="#fff"/>
  <!-- Entry point and services. Each labelled connector is one straight line broken by a single
       gap for its label, so both fragments share the line the etalon measures; the gap is only as
       tall as the label needs. Lines: LB->LBS x=916.33-1.7585y, LB->Business x=198.71+1.4811y. -->
  <use href="#user" x="500" y="37" width="54" height="54"/><path class="plain" d="M527 91V118"/><path id="user-to-load-balancer-arrow" class="flow" d="M527 145V181.7"/><circle cx="527" cy="129" r="10" fill="#fff" stroke="#111"/><text class="t small" x="527" y="136">1</text>
  <rect class="box" x="431" y="187" width="191" height="68"/><text class="t node" x="527" y="230">Load balancer</text>
  <path class="plain" d="M467.9 255L409.9 288"/><path id="load-balancer-to-lbs-arrow" class="flow" d="M341.3 327L272.815 365.964"/><text class="t label" x="361" y="317">② /search/nearby</text>
  <path class="plain" d="M576.4 255L626.7 289"/><path id="load-balancer-to-business-arrow" class="flow" d="M683 327L740.569 365.803"/><text class="t label" x="662" y="317">/businesses/{:id}</text>
  <rect class="box" x="109" y="370" width="191" height="68"/><text class="t node" x="205" y="413">LBS</text><text class="t label" x="61" y="413">③ ④</text>
  <rect class="box" x="703" y="370" width="191" height="68"/><text class="t node" x="799" y="394">Business</text><text class="t node" x="799" y="425">Service</text>
  <!-- Redis reads and database access. -->
  <!-- Steps 5 and 6 flank the shared Read label. Opposite path directions use the same marker
       on x=204.86; each visible tip stays 2 units outside its target's painted border. -->
  <path id="redis-to-lbs-read-arrow" class="flow" d="M204.86 500V443.3"/>
  <path id="lbs-to-redis-read-arrow" class="flow" d="M204.86 534V590.7"/>
  <text class="t label" x="161" y="509">⑤</text><text class="t label" x="161" y="544">⑥</text><text class="t label" x="205" y="524">Read</text>
  <path class="plain" d="M725.9 438L620.2 487"/><path id="business-to-redis-read-arrow" class="flow" d="M554.5 517.5L379.068 598.863"/><text class="t label" x="586" y="510">Read</text>
  <path class="plain" d="M824.3 438L853.5 475.5"/><text class="t label" x="869" y="500">Write</text>
  <!-- Redis cluster. -->
  <rect class="box" x="35" y="596" width="339" height="166"/><use href="#redis-cube" x="90.85" y="623.1" width="66.3" height="56.8"/><use href="#redis-cube" x="264.85" y="623.1" width="66.3" height="56.8"/><g class="t label"><text x="124" y="707">Business Info</text><text x="298" y="707">Geohash</text><text class="cluster" x="205" y="746">Redis Cluster</text></g>
  <!-- Database cluster and replication. -->
  <rect class="box" x="497" y="565" width="601" height="229"/><use href="#db" x="548" y="618" width="88" height="93" color="#fff"/><use href="#db" x="753.5" y="618" width="88" height="93" color="#fff"/><use href="#db" x="959.25" y="618" width="88" height="93" color="#f2a7f1"/>
  <!-- Write crosses the cluster panel intentionally, so it is painted above the panel and
       cylinder. Its visible tip (969.710, 623.372) clears the curved lid stroke by 2 units. -->
  <path id="business-to-primary-write-arrow" class="flow" d="M884.3 514.5L968.167 621.405"/>
  <g class="t label"><text x="592" y="739">Replica</text><text x="797" y="739">Replica</text><text x="1003" y="739">Primary</text></g>
  <!-- Trim both ends of the original replication arc around the label for readable clearance.
       The left curve's final tangent sets the marker direction; both replica tips clear walls by 2 units. -->
  <path id="primary-to-first-replica-source-connector" class="plain" d="M959.6 638.7C922.460 618.544 885.233 605.528 848 599.409"/>
  <path id="primary-to-first-replica-arrow" class="flow" d="M749 599.502C712.740 605.429 676.475 617.855 640.125 636.467"/>
  <text class="t small" x="798" y="601">Replicate</text><path class="plain" d="M949 666.5H960.15"/><path id="primary-to-second-replica-arrow" class="flow" d="M864 666.5H845.9"/><text class="t small" x="906.5" y="671.5">Replicate</text>
  <!-- Cache data is synchronized from the database replicas; the head clears the Redis border. -->
  <path id="database-to-redis-sync-arrow" class="flow" d="M497 679H379.3"/><text class="t label" x="435" y="667">Sync</text><text class="t cluster" x="797" y="778">Database Cluster</text>
</svg>
