<svg xmlns="http://www.w3.org/2000/svg" width="930" height="544" viewBox="0 0 930 544" role="img" aria-labelledby="title desc">
  <title id="title">Notification delivery with a persistent log</title>
  <desc id="desc">An iOS push-notification queue feeds workers. Workers send messages to Apple Push Notification service and write notification events to a persistent notification log.</desc>

  <!-- Reusable queue, worker, database, and APNs styling. -->
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L14 7 L0 14 Z" fill="#1677b8"/>
    </marker>
    <symbol id="green-server" viewBox="0 0 50 90">
      <rect x="3" y="2" width="44" height="86" rx="3" fill="#65c515"/>
      <path d="M12 17 H38 M12 68 H38 M12 78 H38" stroke="#fff" stroke-width="4"/>
    </symbol>
    <symbol id="db-cylinder" viewBox="0 0 58 82">
      <rect x="3" y="12" width="52" height="58" fill="#1677b8"/>
      <ellipse cx="29" cy="12" rx="26" ry="10" fill="#1677b8" stroke="#fff" stroke-width="2"/>
      <path d="M3 70 A26 10 0 0 0 55 70" fill="#1677b8"/>
    </symbol>
    <style>
      .cyan-box { fill: #fff; stroke: #08b4cf; stroke-width: 4; }
      .dashed-box { fill: #fff; stroke: #08b4cf; stroke-width: 4; stroke-dasharray: 11 10; }
      .flow { fill: none; stroke: #1677b8; stroke-width: 3; marker-end: url(#arrow-blue); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 28px; fill: #111; text-anchor: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 25px; fill: #111; text-anchor: middle; }
      .queue-line { fill: none; stroke: #1677b8; stroke-width: 5; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="930" height="544" fill="#fff"/>

  <!-- iOS push-notification queue with three envelope slots. -->
  <g id="ios-queue">
    <path class="queue-line" d="M48 88 H279 L303 128 L279 167 H48 Z"/>
    <g fill="none" stroke="#1677b8" stroke-width="5" stroke-linejoin="round">
      <rect x="62" y="103" width="64" height="49"/>
      <path d="M62 104 L94 132 L126 104"/>
      <rect x="135" y="103" width="64" height="49"/>
      <path d="M135 104 L167 132 L199 104"/>
      <rect x="208" y="103" width="64" height="49"/>
      <path d="M208 104 L240 132 L272 104"/>
    </g>
    <text class="label" x="165" y="199">iOS PN</text>
  </g>

  <path class="flow" d="M303 128 H428"/>

  <!-- Worker cluster dispatches the notification and records its status. -->
  <g id="workers">
    <rect class="dashed-box" x="428" y="44" width="150" height="170" rx="25"/>
    <use href="#green-server" x="449" y="83" width="44" height="80"/>
    <use href="#green-server" x="485" y="83" width="44" height="80"/>
    <use href="#green-server" x="521" y="83" width="44" height="80"/>
    <use href="#green-server" x="465" y="56" width="40" height="33"/>
    <use href="#green-server" x="505" y="56" width="40" height="33"/>
    <text class="small" x="503" y="192">Workers</text>
  </g>

  <!-- Worker delivery to Apple Push Notification service. -->
  <path class="flow" d="M578 128 H767"/>
  <g id="apns">
    <path d="M778 158 C760 158 754 138 766 126 C759 105 774 87 792 89 C800 72 819 65 834 76 C850 67 872 77 875 96 C894 99 905 113 903 130 C902 147 888 159 870 159 Z" fill="#fff" stroke="#333" stroke-width="7" stroke-linejoin="round"/>
    <text x="832" y="143" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#111" text-anchor="middle">APNs</text>
  </g>

  <!-- Downward log write is separated from the APNs delivery path. -->
  <path class="flow" d="M503 214 V360"/>
  <g id="notification-log">
    <rect class="cyan-box" x="407" y="360" width="194" height="171" rx="25"/>
    <use href="#db-cylinder" x="445" y="371" width="60" height="84"/>
    <use href="#db-cylinder" x="477" y="384" width="60" height="84"/>
    <use href="#db-cylinder" x="509" y="397" width="56" height="78"/>
    <text class="small" x="504" y="510">Notification log</text>
  </g>
</svg>
