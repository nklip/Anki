<svg xmlns="http://www.w3.org/2000/svg"
     width="856"
     height="518"
     viewBox="0 0 856 518"
     role="img"
     aria-labelledby="legend-title legend-desc">
  <title id="legend-title">Cassandra table-key legend</title>
  <desc id="legend-desc">K means partition key. C with an upward arrow means ascending clustering key. C with a downward arrow means descending clustering key.</desc>

  <!-- Shared frame and text styling reproduce the compact PNG legend. -->
  <defs>
    <style>
      .frame { fill: none; stroke: #111; stroke-width: 3; }
      .legend-text { font: 400 56px Arial, Helvetica, sans-serif; fill: #050505; }
    </style>
  </defs>
  <rect id="background" width="856" height="518" fill="#fff"/>
  <rect id="legend-frame" class="frame" x="22.5" y="19.5" width="814" height="480"/>

  <!-- Key symbols form a fixed left column; explanations align on the right. -->
  <g id="legend-entries" class="legend-text">
    <text x="49" y="119">K</text>
    <text x="145" y="119">Partition Key</text>

    <text x="49" y="216">C↑</text>
    <text x="145" y="216">
      <tspan x="145">Clustering Key (ascend-</tspan>
      <tspan x="145" dy="67">ing)</tspan>
    </text>

    <text x="49" y="380">C↓</text>
    <text x="145" y="380">
      <tspan x="145">Clustering Key (descend-</tspan>
      <tspan x="145" dy="67">ing)</tspan>
    </text>
  </g>
</svg>
