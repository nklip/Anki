<svg xmlns="http://www.w3.org/2000/svg"
     width="1824"
     height="1006"
     viewBox="0 0 1824 1006"
     role="img"
     aria-labelledby="receiving-title receiving-desc">
  <title id="receiving-title">Email receiving flow</title>
  <desc id="receiving-desc">An incoming email passes through a load balancer and SMTP acceptance policy, enters a queue, is checked for viruses and spam, and is delivered through real-time or web servers. Metadata, search data, attachments, and the latest email are stored in the storage layer.</desc>

  <!-- Shared diagram styles and a reusable boundary-safe arrowhead. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:25px}
      .node{fill:#fff;stroke:#333;stroke-width:1.6}
      .pink-node{fill:#f3a7f2;stroke:#333;stroke-width:1.6}
      .zone{fill:none;stroke:#333;stroke-width:1.6;stroke-dasharray:7 6}
      .route{fill:none;stroke:#111;stroke-width:1.8}
      .center{text-anchor:middle}
      .small{font-size:22px}
      .realtime-label{font-size:23px}
    </style>
    <!-- The tip projects 2.5 units beyond the shaft; endpoints are retracted to target outlines. -->
    <marker id="flow-arrowhead"
            markerWidth="18"
            markerHeight="18"
            viewBox="0 0 18 18"
            refX="15.5"
            refY="9"
            markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M0 0L18 9L0 18Z" fill="#111"/>
    </marker>
    <radialGradient id="chrome-blue" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4c9bff"/>
      <stop offset="1" stop-color="#2877de"/>
    </radialGradient>
    <linearGradient id="safari-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46d6fa"/>
      <stop offset="1" stop-color="#087bd7"/>
    </linearGradient>

    <!-- Full multigradient Edge geometry and corrected Chrome color sectors. -->
    <symbol id="edge-mark" viewBox="0 0 27600 27600">
      <defs>
        <linearGradient id="edge-dark" x1="6870" y1="18705" x2="24704" y2="18705" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#0c59a4"/><stop offset="1" stop-color="#114a8b"/>
        </linearGradient>
        <linearGradient id="edge-blue" x1="16272" y1="10968" x2="5133" y2="23102" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#1b9de2"/><stop offset="0.16" stop-color="#1595df"/><stop offset="0.67" stop-color="#0680d7"/><stop offset="1" stop-color="#0078d4"/>
        </linearGradient>
        <radialGradient id="edge-dark-shade" cx="16720" cy="18747" r="9538" gradientUnits="userSpaceOnUse">
          <stop offset="0.72" stop-opacity="0"/><stop offset="0.95" stop-opacity="0.53"/><stop offset="1"/>
        </radialGradient>
        <radialGradient id="edge-blue-shade" cx="7130" cy="19866" r="14324" gradientUnits="userSpaceOnUse" gradientTransform="matrix(.14843 -.98892 .79688 .1196 -8759 25542)">
          <stop offset="0.76" stop-opacity="0"/><stop offset="0.95" stop-opacity="0.5"/><stop offset="1"/>
        </radialGradient>
        <radialGradient id="edge-green" cx="2523" cy="4680" r="20243" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-.03715 .99931 -2.12836 -.07913 13579 3530)">
          <stop offset="0" stop-color="#35c1f1"/><stop offset="0.11" stop-color="#34c1ed"/><stop offset="0.23" stop-color="#2fc2df"/><stop offset="0.31" stop-color="#2bc3d2"/><stop offset="0.67" stop-color="#36c752"/>
        </radialGradient>
        <radialGradient id="edge-green-highlight" cx="24247" cy="7758" r="9734" gradientUnits="userSpaceOnUse" gradientTransform="matrix(.28109 .95968 -.78353 .22949 24510 -16292)">
          <stop offset="0" stop-color="#66eb6e"/><stop offset="1" stop-color="#66eb6e" stop-opacity="0"/>
        </radialGradient>
        <path id="edge-dark-shape" d="M24105 20053a9345 9345 0 0 1-1053 472 10202 10202 0 0 1-3590 646c-4732 0-8855-3255-8855-7432 0-1175 680-2193 1643-2729-4280 180-5380 4640-5380 7253 0 7387 6810 8137 8276 8137 791 0 1984-230 2704-456l130-44a12834 12834 0 0 0 6660-5282c220-350-168-757-535-565z"/>
        <path id="edge-blue-shape" d="M11571 25141a7913 7913 0 0 1-2273-2137 8145 8145 0 0 1-1514-4740 8093 8093 0 0 1 3093-6395 8082 8082 0 0 1 1373-859c312-148 846-414 1554-404a3236 3236 0 0 1 2569 1297 3184 3184 0 0 1 636 1866c0-21 2446-7960-8005-7960-4390 0-8004 4166-8004 7820 0 2319 538 4170 1212 5604a12833 12833 0 0 0 7684 6757 12795 12795 0 0 0 3908 610c1414 0 2774-233 4045-656a7575 7575 0 0 1-6278-803z"/>
        <path id="edge-green-shape" d="M16231 15886c-80 105-330 250-330 566 0 260 170 512 472 723 1438 1003 4149 868 4156 868a5954 5954 0 0 0 3027-839 6147 6147 0 0 0 1133-850 6180 6180 0 0 0 1910-4437c26-2242-796-3732-1133-4392-2120-4141-6694-6525-11668-6525-7011 0-12703 5635-12798 12620 47-3654 3679-6605 7996-6605 350 0 2346 34 4200 1007 1634 858 2490 1894 3086 2921 618 1067 728 2415 728 2952s-271 1333-780 1990z"/>
      </defs>
      <use href="#edge-dark-shape" fill="url(#edge-dark)"/>
      <use href="#edge-dark-shape" fill="url(#edge-dark-shade)" opacity="0.35"/>
      <use href="#edge-blue-shape" fill="url(#edge-blue)"/>
      <use href="#edge-blue-shape" fill="url(#edge-blue-shade)" opacity="0.4"/>
      <use href="#edge-green-shape" fill="url(#edge-green)"/>
      <use href="#edge-green-shape" fill="url(#edge-green-highlight)"/>
    </symbol>
    <symbol id="chrome-mark" viewBox="0 0 64 64">
      <path d="M32 32L16 4.287A32 32 0 0 1 64 32Z" fill="#f44336"/>
      <path d="M32 32H64A32 32 0 0 1 16 59.713Z" fill="#fbc02d"/>
      <path d="M32 32L16 59.713A32 32 0 0 1 16 4.287Z" fill="#0f9d58"/>
      <circle cx="32" cy="32" r="16" fill="#fff"/>
      <circle cx="32" cy="32" r="12.5" fill="url(#chrome-blue)"/>
    </symbol>
  </defs>
  <rect id="background" width="1824" height="1006" fill="#fff"/>

  <!-- Dashed zones group SMTP acceptance and mail processing. -->
  <rect id="smtp-acceptance-zone" class="zone" x="316" y="241" width="256" height="244"/>
  <rect id="mail-processing-zone" class="zone" x="913" y="115" width="257" height="377"/>

  <!-- The storage panel sits behind the fan-out routes and storage symbols. -->
  <rect id="storage-layer-panel" class="node" x="611" y="652" width="863" height="324"/>

  <!-- Main numbered flow, split around each step circle.
       Steps 4 and 7 are centered between figures; steps 3 and 10 mirror into the bus's upper corners. -->
  <g id="main-flow-routes">
    <path id="incoming-email-line" class="route" d="M133 135V248"/>
    <path id="incoming-email-continuation" class="route" d="M133 280V286"/>
    <path id="incoming-email-arrow" class="route" data-connector="true"
          d="M133 286V390.7" marker-end="url(#flow-arrowhead)"/>

    <path id="load-balancer-line" class="route" d="M235 428H260"/>
    <path id="load-balancer-to-smtp-arrow" class="route" data-connector="true"
          d="M292 428H338.7" marker-end="url(#flow-arrowhead)"/>

    <path id="smtp-to-storage-line" class="route" d="M496 463L753.190524 554.375655"/>
    <path id="smtp-to-storage-arrow" class="route" data-connector="true"
          d="M784.851651 565.624345L1000.844261 642.363044" marker-end="url(#flow-arrowhead)"/>

    <path id="smtp-to-queue-line" class="route" d="M547 428H583.7"/>
    <path id="smtp-to-queue-arrow" class="route" data-connector="true"
          d="M617.3 428H650.7" marker-end="url(#flow-arrowhead)"/>

    <path id="queue-to-processing-line" class="route" d="M827 428H854"/>
    <path id="queue-to-processing-arrow" class="route" data-connector="true"
          d="M886 428H936.7" marker-end="url(#flow-arrowhead)"/>

    <path id="processing-to-storage-line" class="route" d="M1042 492V552"/>
    <path id="processing-storage-continuation" class="route" d="M1042 584V590"/>
    <path id="processing-to-storage-arrow" class="route" data-connector="true"
          d="M1042 590V640.7" marker-end="url(#flow-arrowhead)"/>

    <path id="processing-to-realtime-line" class="route" d="M1144 428H1187.7"/>
    <path id="processing-to-realtime-arrow" class="route" data-connector="true"
          d="M1221.3 428H1261.7" marker-end="url(#flow-arrowhead)"/>

    <!-- WebSocket and HTTPS use mirrored straight routes, split at y=256..301 for their labels. -->
    <path id="realtime-to-webmail-arrow" class="route" data-connector="true"
          d="M1422.358326 256L1471.79645 165.991225" marker-end="url(#flow-arrowhead)"/>
    <path id="webmail-to-realtime-arrow" class="route" data-connector="true"
          d="M1397.641674 301L1348.20355 391.008775" marker-end="url(#flow-arrowhead)"/>

    <!-- HTTPS communication is bidirectional, with a label-sized gap. -->
    <path id="webserver-to-webmail-arrow" class="route" data-connector="true"
          d="M1596.641674 256L1547.20355 165.991225" marker-end="url(#flow-arrowhead)"/>
    <path id="webmail-to-webserver-arrow" class="route" data-connector="true"
          d="M1621.358326 301L1670.79645 391.008775" marker-end="url(#flow-arrowhead)"/>

    <path id="webserver-to-storage-line" class="route" d="M1589 463L1331.809476 554.375655"/>
    <path id="webserver-to-storage-arrow" class="route" data-connector="true"
          d="M1300.148349 565.624345L1084.155739 642.363044" marker-end="url(#flow-arrowhead)"/>
  </g>

  <!-- Smooth, continuous feedback curves are painted beneath the opaque processing boxes.
       Straight terminal shafts use mirrored 3:4 directions, keeping each 18-unit head symmetric. -->
  <g id="processing-feedback-routes">
    <path id="virus-check-feedback" class="route" data-connector="true"
          d="M1012.5 391.2L1000.5 375.2C996 369.2 996 362.8 1000.5 356.8L1012.5 340.8"
          marker-start="url(#flow-arrowhead)" marker-end="url(#flow-arrowhead)"/>
    <!-- The white virus box hides the middle of this taller continuous curve. -->
    <path id="spam-check-feedback" class="route" data-connector="true"
          d="M1071.5 391.2L1083.5 375.2C1120 326.533333 1120 280.466667 1083.5 231.8L1071.5 215.8"
          marker-start="url(#flow-arrowhead)" marker-end="url(#flow-arrowhead)"/>
  </g>

  <!-- Fan-out pairs use mirrored angles; each route stays collinear across its y=727..766 label gap.
       Outer tips meet side edges, inner tips meet top rims, and all four labels share baseline y=754. -->
  <g id="storage-fanout-routes">
    <path id="metadata-lead-in" class="route" d="M1018 661L896.134194 727"/>
    <path id="metadata-arrow" class="route" data-connector="true"
          d="M824.122581 766L733.99831 814.809441" marker-end="url(#flow-arrowhead)"/>
    <path id="search-store-lead-in" class="route" d="M1039.153846 661L988.384615 727"/>
    <path id="search-store-arrow" class="route" data-connector="true"
          d="M958.384615 766L930.524277 802.21844" marker-end="url(#flow-arrowhead)"/>
    <path id="attachment-lead-in" class="route" d="M1055.615385 661L1106.384615 727"/>
    <path id="attachment-arrow" class="route" data-connector="true"
          d="M1136.384615 766L1163.475723 801.21844" marker-end="url(#flow-arrowhead)"/>
    <path id="latest-email-lead-in" class="route" d="M1068 661L1189.865806 727"/>
    <path id="latest-email-arrow" class="route" data-connector="true"
          d="M1261.877419 766L1367.340884 823.116831" marker-end="url(#flow-arrowhead)"/>
  </g>

  <!-- Sender icon and the entry load balancer. -->
  <g id="incoming-email-source">
    <rect class="node" x="79" y="70" width="108" height="65"/>
    <path class="route" d="M80 71L133 99L186 71"/>
    <rect class="node" x="31" y="394" width="204" height="69"/>
    <text class="center" x="133" y="438">Load balancer</text>
  </g>

  <!-- SMTP policy and acceptance servers. -->
  <g id="smtp-acceptance-nodes">
    <rect class="node" x="342" y="269" width="205" height="69"/>
    <text class="center" x="444.5" y="298">Email Acceptance</text>
    <text class="center" x="444.5" y="326">policy</text>

    <path id="policy-smtp-arrow" class="route" data-connector="true"
          d="M444.5 341.3V390.7"
          marker-start="url(#flow-arrowhead)" marker-end="url(#flow-arrowhead)"/>
    <rect class="pink-node" x="342" y="394" width="205" height="69"/>
    <text class="center" x="444.5" y="438">SMTP servers</text>
  </g>

  <!-- Incoming email queue with three editable envelope symbols. -->
  <g id="incoming-email-queue">
    <path class="node"
          d="M681 396H809
             C819 396 827 410 827 428
             C827 446 819 460 809 460
             H681
             C666 460 654 446 654 428
             C654 410 666 396 681 396Z"/>
    <ellipse class="node" cx="809" cy="428" rx="18" ry="32"/>
    <g id="queued-message-icons" fill="#fff" stroke="#333" stroke-width="1.4">
      <path d="M669 417H701V441H669Z M669 417L685 430L701 417"/>
      <path d="M708 417H740V441H708Z M708 417L724 430L740 417"/>
      <path d="M747 417H779V441H747Z M747 417L763 430L779 417"/>
    </g>
    <text class="center" x="741" y="484">Incoming email queue</text>
  </g>

  <!-- Spam and virus checks feed back into mail processing. -->
  <g id="mail-processing-nodes">
    <rect class="node" x="940" y="145" width="204" height="68"/>
    <text class="center" x="1042" y="188">Check spam</text>
    <rect class="node" x="940" y="270" width="204" height="68"/>
    <text class="center" x="1042" y="313">Check virus</text>
    <rect class="pink-node" x="940" y="394" width="204" height="69"/>
    <text class="center" x="1042" y="438">Mail processing</text>
  </g>

  <!-- Delivery servers and webmail client. -->
  <g id="delivery-nodes">
    <rect class="node" x="1265" y="394" width="203" height="69"/>
    <text class="center realtime-label" x="1371" y="438">Real-time Servers</text>
    <rect class="node" x="1588" y="394" width="205" height="69"/>
    <text class="center" x="1690.5" y="438">Web servers</text>
    <rect class="node" x="1362" y="31" width="295" height="132"/>
    <text class="center" x="1509.5" y="146">Webmail</text>
  </g>

  <!-- Browser marks remain editable while preserving their recognizable geometry. -->
  <g id="browser-icons">
    <use id="edge-icon" href="#edge-mark" x="1392" y="51" width="64" height="64"/>
    <use id="chrome-icon" href="#chrome-mark" x="1478" y="51" width="64" height="64"/>

    <g id="safari-icon">
      <circle cx="1599" cy="83" r="32" fill="url(#safari-blue)"/>
      <circle cx="1599" cy="83" r="28" fill="none" stroke="#dff7ff" stroke-width="2"/>
      <g stroke="#fff" stroke-width="1.4">
        <path d="M1599 53V59M1599 107V113M1569 83H1575M1623 83H1629"/>
        <path d="M1578 62L1582 66M1616 100L1620 104M1620 62L1616 66M1582 100L1578 104"/>
      </g>
      <path d="M1618 63L1605 86L1580 104L1594 79Z" fill="#ed1c24"/>
      <path d="M1580 104L1594 79L1605 86Z" fill="#fff"/>
      <circle cx="1599" cy="83" r="3" fill="#fff"/>
    </g>
  </g>

  <!-- Storage bus and four persistence destinations.
       Every icon and its caption is 60 units lower, matching the spacing change in the sending diagram. -->
  <g id="storage-layer-nodes">
    <rect id="storage-bus" class="node" x="1004" y="644" width="77" height="17"/>

    <g id="metadata-database" transform="translate(0 60)">
      <path class="node" d="M653 756V810C653 826 731 826 731 810V756"/>
      <ellipse class="node" cx="692" cy="756" rx="39" ry="11"/>
      <text class="center" x="692" y="846">Database</text>
    </g>
    <g id="search-database" transform="translate(0 60)">
      <path class="node" d="M890 756V810C890 826 968 826 968 810V756"/>
      <ellipse class="node" cx="929" cy="756" rx="39" ry="11"/>
      <text class="center" x="929" y="846">Database</text>
    </g>
    <g id="attachment-object-store" transform="translate(0 60)">
      <path class="node" d="M1127 756L1142 823H1188L1203 756Z"/>
      <ellipse class="node" cx="1165" cy="756" rx="38" ry="12"/>
      <circle cx="1165" cy="787" r="8" fill="none" stroke="#333" stroke-width="1.5"/>
      <path d="M1144 817L1152 800L1160 817Z" fill="none" stroke="#333" stroke-width="1.5"/>
      <rect x="1168" y="800" width="17" height="17" fill="none" stroke="#333" stroke-width="1.5"/>
      <text class="center" x="1165" y="846">Object Store</text>
    </g>

    <g id="latest-email-cache" transform="translate(0 60)">
      <path d="M1363 792L1397 778L1431 792V803L1397 818L1363 803Z" fill="#b90000"/>
      <path d="M1363 779L1397 765L1431 779V791L1397 805L1363 791Z" fill="#d60000"/>
      <path d="M1363 767L1397 753L1431 767L1397 782Z" fill="#ef0000"/>
      <path d="M1386 765L1394 763L1398 758L1402 763L1410 765L1403 769L1404 774L1397 771L1390 774L1391 769Z" fill="#fff"/>
      <ellipse cx="1413" cy="768" rx="5" ry="3" fill="#fff"/>
      <text class="center" x="1397" y="846">Cache</text>
    </g>

    <text class="center" x="1042.5" y="960">Storage Layer</text>
  </g>

  <!-- Fan-out labels remain above their corresponding split routes. -->
  <g id="storage-route-labels">
    <text class="center small" x="834" y="754">Metadata</text>
    <text class="center small" x="968" y="754">Search store</text>
    <text class="center small" x="1113" y="754">Attachment</text>
    <text class="center small" x="1258" y="754">Latest email</text>
  </g>

  <!-- Numbered annotations mirror the source image's reading order. -->
  <g id="numbered-steps" font-size="24" text-anchor="middle">
    <g><circle class="node" cx="133" cy="264" r="16"/><text x="133" y="273">1</text></g>
    <g><circle class="node" cx="276" cy="428" r="16"/><text x="276" y="437">2</text></g>
    <g><circle class="node" cx="769.021088" cy="560" r="16"/><text x="769.021088" y="569">3</text></g>
    <g><circle class="node" cx="600.5" cy="428" r="16"/><text x="600.5" y="437">4</text></g>
    <g><circle class="node" cx="870" cy="428" r="16"/><text x="870" y="437">5</text></g>
    <g><circle class="node" cx="1042" cy="568" r="16"/><text x="1042" y="577">6</text></g>
    <g><circle class="node" cx="1204.5" cy="428" r="16"/><text x="1204.5" y="437">7</text></g>
    <g><circle class="node" cx="1348" cy="278" r="16"/><text x="1348" y="287">8</text></g>
    <g><circle class="node" cx="1557" cy="278" r="16"/><text x="1557" y="287">9</text></g>
    <g><circle class="node" cx="1315.978912" cy="560" r="16"/><text x="1315.978912" y="569">10</text></g>
  </g>
  <text x="1373" y="287">WebSocket</text>
  <text x="1582" y="287">Https</text>
</svg>
