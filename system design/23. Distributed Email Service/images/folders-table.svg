<svg xmlns="http://www.w3.org/2000/svg"
     width="872"
     height="544"
     viewBox="0 0 872 544"
     role="img"
     aria-labelledby="folders-table-title folders-table-desc">
  <title id="folders-table-title">folders_by_user table schema</title>
  <desc id="folders-table-desc">A table named folders_by_user. The user_id UUID is the partition key; each folder also has a folder_id UUID and a folder_name text value.</desc>

  <!-- Shared styles mirror the neighboring email-schema diagram and PNG etalon. -->
  <defs>
    <style>
      .frame { fill: none; stroke: #111; stroke-width: 3; }
      .title { font: 700 62px Arial, Helvetica, sans-serif; fill: #050505; text-anchor: middle; }
      .cell { font: 400 63px Arial, Helvetica, sans-serif; fill: #050505; }
    </style>
  </defs>
  <rect id="background" width="872" height="544" fill="#fff"/>

  <!-- One frame and a single divider form the compact table header. -->
  <g id="table-frame">
    <rect class="frame" x="28.5" y="29.5" width="813" height="488"/>
    <path class="frame" d="M29 153.5H841"/>
    <text class="title" x="436" y="109">folders_by_user</text>
  </g>

  <!-- Column names, data types, and the Cassandra partition-key marker. -->
  <g id="schema-rows" class="cell">
    <text x="54" y="258">user_id</text>
    <text x="465" y="258">UUID</text>
    <text x="720" y="258">K</text>

    <text x="54" y="360">folder_id</text>
    <text x="465" y="360">UUID</text>

    <text x="54" y="462">folder_name</text>
    <text x="465" y="462">TEXT</text>
  </g>
</svg>
