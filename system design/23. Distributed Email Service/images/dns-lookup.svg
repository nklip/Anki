<svg xmlns="http://www.w3.org/2000/svg"
     width="1494"
     height="546"
     viewBox="0 0 1494 546"
     role="img"
     aria-labelledby="title description">
  <title id="title">MX-record lookup for gmail.com</title>
  <desc id="description">A terminal session using nslookup to request Gmail MX records. Rounded white outlines call out the mail exchanger label, priority, and mail server name columns.</desc>

  <!-- Terminal background and captured window edges. -->
  <rect id="terminal-background" width="1494" height="546" fill="#000"/>
  <rect id="terminal-top-edge" width="1494" height="5" fill="#fff"/>
  <g id="terminal-bottom-edge">
    <rect y="541" width="1494" height="1" fill="#0d0d0d"/>
    <rect y="542" width="1494" height="1" fill="#282828"/>
    <rect y="543" width="1494" height="1" fill="#1a1a1a"/>
    <rect y="544" width="1494" height="1" fill="#343434"/>
    <rect y="545" width="1494" height="1" fill="#b2b2b2"/>
  </g>

  <!-- Three repair-friendly callouts identify the MX result columns. -->
  <g id="mx-column-callouts" fill="none" stroke="#f2f2f2" stroke-width="2.5">
    <rect id="mail-exchanger-callout" x="337.25" y="317.25" width="339.5" height="222" rx="31"/>
    <rect id="priority-callout" x="712.25" y="317.25" width="63.5" height="222" rx="13"/>
    <rect id="mail-server-callout" x="784.75" y="317.25" width="692.5" height="222" rx="31"/>
  </g>

  <!-- Explicit coordinates keep terminal columns stable in renderers that collapse spaces. -->
  <g id="terminal-transcript"
     fill="#00ff00"
     font-family="Monaco, Menlo, monospace"
     font-size="36.5"
     font-weight="400">
    <text x="3" y="41">draws-mbp:~ draw$ nslookup</text>
    <text x="3" y="85">&gt; set q=mx</text>
    <text x="3" y="129">&gt; gmail.com</text>
    <text x="3" y="173">Server:</text>
    <text x="352" y="173">192.168.86.1</text>
    <text x="3" y="217">Address:</text>
    <text x="352" y="217">192.168.86.1#53</text>
    <text x="3" y="305">Non-authoritative answer:</text>

    <!-- Every result row uses the same five column origins. -->
    <g id="mx-result-alt2" aria-label="gmail.com mail exchanger equals 20 alt2.gmail-smtp-in.l.google.com">
      <text x="5" y="349">gmail.com</text>
      <text x="355" y="349">mail exchanger</text>
      <text x="682" y="349">=</text>
      <text x="726" y="349">20</text>
      <text x="792" y="349">alt2.gmail-smtp-in.l.google.com.</text>
    </g>
    <g id="mx-result-alt3" aria-label="gmail.com mail exchanger equals 30 alt3.gmail-smtp-in.l.google.com">
      <text x="5" y="393">gmail.com</text>
      <text x="355" y="393">mail exchanger</text>
      <text x="682" y="393">=</text>
      <text x="726" y="393">30</text>
      <text x="792" y="393">alt3.gmail-smtp-in.l.google.com.</text>
    </g>
    <g id="mx-result-alt4" aria-label="gmail.com mail exchanger equals 40 alt4.gmail-smtp-in.l.google.com">
      <text x="5" y="437">gmail.com</text>
      <text x="355" y="437">mail exchanger</text>
      <text x="682" y="437">=</text>
      <text x="726" y="437">40</text>
      <text x="792" y="437">alt4.gmail-smtp-in.l.google.com.</text>
    </g>
    <g id="mx-result-gmail" aria-label="gmail.com mail exchanger equals 5 gmail-smtp-in.l.google.com">
      <text x="5" y="481">gmail.com</text>
      <text x="355" y="481">mail exchanger</text>
      <text x="682" y="481">=</text>
      <text x="726" y="481">5</text>
      <text x="792" y="481">gmail-smtp-in.l.google.com.</text>
    </g>
    <g id="mx-result-alt1" aria-label="gmail.com mail exchanger equals 10 alt1.gmail-smtp-in.l.google.com">
      <text x="5" y="525">gmail.com</text>
      <text x="355" y="525">mail exchanger</text>
      <text x="682" y="525">=</text>
      <text x="726" y="525">10</text>
      <text x="792" y="525">alt1.gmail-smtp-in.l.google.com.</text>
    </g>
  </g>
</svg>
