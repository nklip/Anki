<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="368" viewBox="0 0 1032 368" role="img" aria-labelledby="title desc">
  <title id="title">Example URL hash values</title>
  <desc id="desc">A table compares hexadecimal outputs from CRC32, MD5, and SHA-1.</desc>

  <!-- Typography and table rules reproduce the source comparison. -->
  <defs>
    <style>
      .header { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111; dominant-baseline: middle; }
      .cell { font-family: Arial, Helvetica, sans-serif; font-size: 28px; fill: #111; dominant-baseline: middle; }
      .rule { fill: none; stroke: #333; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Four-row, two-column hash table. -->
  <g id="hash-table">
    <rect class="rule" x="20" y="22" width="971" height="320"/>
    <path class="rule" d="M328 22 V342 M20 102 H991 M20 182 H991 M20 262 H991"/>
    <text class="header" x="31" y="63">Hash function</text>
    <text class="header" x="339" y="63">Hash value (Hexadecimal)</text>
    <text class="cell" x="31" y="155">CRC32</text>
    <text class="cell" x="339" y="155">5cb54054</text>
    <text class="cell" x="31" y="235">MD5</text>
    <text class="cell" x="339" y="235">5a62509a84df9ee03fe1230b9df8b84e</text>
    <text class="cell" x="31" y="315">SHA-1</text>
    <text class="cell" x="339" y="315">0eeae7916c06853901d9ccbefbfcaf4de57ed85b</text>
  </g>
</svg>
