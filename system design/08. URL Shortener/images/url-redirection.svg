<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="626" viewBox="0 0 1312 626" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 301 response from a short URL</title>
  <desc id="desc">A browser network-details view highlights the tinyurl request, its 301 status, and the response Location header containing the destination URL.</desc>

  <!-- Browser-like typography and highlighted response fields. -->
  <defs>
    <style>
      .key { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #252525; dominant-baseline: middle; }
      .value { font-family: Menlo, Consolas, monospace; font-size: 19px; fill: #333; dominant-baseline: middle; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #666; dominant-baseline: middle; }
      .highlight { fill: none; stroke: #e11a22; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Request summary; red outlines identify the short URL and redirect status. -->
  <rect class="highlight" x="34" y="15" width="513" height="48" rx="7"/>
  <text class="key" x="50" y="40">Request URL:</text>
  <text class="value" x="210" y="40">https://tinyurl.com/qtj5opu</text>

  <text class="key" x="50" y="80">Request Method:</text>
  <text class="value" x="240" y="80">GET</text>

  <rect class="highlight" x="34" y="96" width="513" height="48" rx="7"/>
  <text class="key" x="50" y="121">Status Code:</text>
  <circle cx="200" cy="118" r="9" fill="#ffd000" stroke="#e4ad00" stroke-width="1.5"/>
  <text class="value" x="218" y="121">301</text>

  <text class="key" x="50" y="162">Remote Address:</text>
  <text class="value" x="238" y="162">[2606:4700:10::6814:391e]:443</text>
  <text class="key" x="50" y="203">Referrer Policy:</text>
  <text class="value" x="234" y="203">no-referrer-when-downgrade</text>

  <!-- Response headers. -->
  <path d="M14 250 H28 L21 262 Z" fill="#777"/>
  <text class="section" x="31" y="258">Response Headers</text>
  <path d="M12 230 H1301" stroke="#d8d8d8" stroke-width="2"/>

  <text class="key" x="49" y="303">alt-svc:</text>
  <text class="value" x="145" y="303" font-size="18">h3-27=":443"; ma=86400, h3-25=":443"; ma=86400, h3-24=":443"; ma=86400, h3-23=":443"; ma=86400</text>

  <text class="key" x="49" y="344">cache-control:</text>
  <text class="value" x="220" y="344">max-age=0, no-cache, private</text>

  <text class="key" x="49" y="385">cf-cache-status:</text>
  <text class="value" x="250" y="385">DYNAMIC</text>

  <text class="key" x="49" y="426">cf-ray:</text>
  <text class="value" x="138" y="426">581fbd8ac986ed33-SJC</text>

  <text class="key" x="49" y="467">content-type:</text>
  <text class="value" x="214" y="467">text/html; charset=UTF-8</text>

  <text class="key" x="49" y="508">date:</text>
  <text class="value" x="112" y="508">Fri, 10 Apr 2020 22:00:23 GMT</text>

  <text class="key" x="49" y="543">expect-ct:</text>
  <text class="value" x="176" y="543" font-size="18">max-age=604800, report-uri="https://report-uri.cloudflare.com/cdn-cgi/beacon/expect-ct"</text>

  <!-- Location is the redirect destination returned with HTTP 301. -->
  <rect class="highlight" x="34" y="560" width="1152" height="48" rx="7"/>
  <text class="key" x="49" y="585">location:</text>
  <text class="value" x="151" y="585" font-size="18">https://www.amazon.com/dp/B017V4NTFA?pLink=63eaef76-979c-4d&amp;ref=adb1p13nvvxx_0_2_im</text>
</svg>
