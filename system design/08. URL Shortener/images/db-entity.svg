<svg xmlns="http://www.w3.org/2000/svg" width="940" height="172" viewBox="0 0 940 172" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener database entity</title>
  <desc id="desc">A database table with columns id, shortURL, and longURL. The example record maps ID 2009215674938 and short URL code zn9edcu to https://en.wikipedia.org/wiki/Systems_design.</desc>

  <!-- Shared typography and grid styling match the supplied table. -->
  <defs>
    <style>
      .cell { font-family: Arial, Helvetica, sans-serif; font-size: 23.5px; font-weight: 400; fill: #111; }
      .grid { fill: none; stroke: #111; stroke-width: 1.25; }
    </style>
  </defs>

  <!-- The original canvas and column widths leave the long destination URL on one line. -->
  <rect id="canvas" width="940" height="172" fill="#fff"/>
  <g id="table-grid" class="grid">
    <rect id="table-border" x="11.5" y="19.6" width="916" height="139.2"/>
    <path id="column-dividers" d="M230.9 19.6 V158.8 M380.3 19.6 V158.8"/>
    <path id="header-divider" d="M11.5 89.3 H927.5"/>
  </g>

  <!-- Field names preserve their original capitalization. -->
  <g id="column-headings" class="cell">
    <text x="21.3" y="53">id</text>
    <text x="240.5" y="53">shortURL</text>
    <text x="390.3" y="53">longURL</text>
  </g>

  <!-- One example entity; every value remains selectable and editable. -->
  <g id="example-record" class="cell">
    <text x="21.3" y="122.7">2009215674938</text>
    <text x="240.5" y="122.7">zn9edcu</text>
    <text x="390.3" y="122.7">https://en.wikipedia.org/wiki/Systems_design</text>
  </g>
</svg>
