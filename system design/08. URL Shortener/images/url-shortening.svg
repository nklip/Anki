<svg xmlns="http://www.w3.org/2000/svg" width="734" height="520" viewBox="0 0 734 520" role="img" aria-labelledby="title desc">
  <title id="title">Shorten a long URL with a hash function</title>
  <desc id="desc">A long URL enters a hash function, which produces the short code qtj5opu for tinyurl.com.</desc>

  <!-- Shared styles; arrowheads are separate triangles for clean joins. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .node { fill: #fff; stroke: #06b3d2; stroke-width: 4; }
      .shaft { fill: none; stroke: #247ba5; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Input URL and hash operation. -->
  <rect class="node" x="50" y="51" width="248" height="113" rx="18"/>
  <text class="label" x="174" y="109" font-size="34">longURL</text>
  <path class="shaft" d="M298 107 H454"/>
  <path d="M473 107 L454 97 V117 Z" fill="#247ba5"/>
  <rect class="node" x="473" y="27" width="202" height="162" rx="25"/>
  <text x="574" y="125" font-family="Georgia, 'Times New Roman', serif" font-size="99" font-weight="700" font-style="italic" text-anchor="middle">ƒx</text>
  <text class="label" x="574" y="235" font-size="34">hash</text>

  <!-- Hash result and complete shortened URL. -->
  <path class="shaft" d="M573 253 V413"/>
  <path d="M573 432 L563 413 H583 Z" fill="#247ba5"/>
  <text x="490" y="480" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#111" text-anchor="end" dominant-baseline="middle">https://tinyurl.com/</text>
  <rect class="node" x="502" y="432" width="140" height="68" rx="13"/>
  <text class="label" x="572" y="468" font-size="30">qtj5opu</text>
</svg>
