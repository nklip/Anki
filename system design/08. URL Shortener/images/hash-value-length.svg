<svg xmlns="http://www.w3.org/2000/svg" width="950" height="592" viewBox="0 0 950 592" role="img" aria-labelledby="title desc">
  <title id="title">Base-62 hash length and the maximal number of URLs</title>
  <desc id="desc">The table shows the number of distinct codes of length N when each position has 62 possible symbols. For N from 1 through 7, the capacity is 62 to the power N. Seven characters allow 3,521,614,606,208 distinct codes, approximately 3.5 trillion.</desc>

  <!-- Shared styles reproduce the reference's plain table and editable text. -->
  <defs>
    <style>
      .cell { font-family: Arial, Helvetica, sans-serif; font-size: 23.7px; font-weight: 400; fill: #111; }
      .grid { fill: none; stroke: #111; stroke-width: 1.25; }
    </style>
  </defs>

  <!-- The canvas, table edges, and column divider retain the PNG's original proportions. -->
  <rect id="canvas" width="950" height="592" fill="#fff"/>
  <g id="table-grid" class="grid">
    <rect id="table-border" x="15.4" y="16.7" width="921" height="561.3"/>
    <path id="column-divider" d="M285.2 16.7 V578"/>
    <path id="row-dividers" d="M15.4 87.1 H936.4 M15.4 157.3 H936.4 M15.4 226.9 H936.4 M15.4 297 H936.4 M15.4 367.3 H936.4 M15.4 437.5 H936.4 M15.4 507.5 H936.4"/>
  </g>

  <!-- Column headings; N denotes the number of characters in each code. -->
  <g id="table-headings" class="cell">
    <text x="25.4" y="50.3">N</text>
    <text x="295.2" y="50.3">Maximal number of URLs</text>
  </g>

  <!-- Character lengths align with the corresponding powers of 62. -->
  <g id="hash-lengths" class="cell">
    <text x="25.4" y="120.4">1</text>
    <text x="25.4" y="190.5">2</text>
    <text x="25.4" y="260.5">3</text>
    <text x="25.4" y="330.6">4</text>
    <text x="25.4" y="400.8">5</text>
    <text x="25.4" y="470.9">6</text>
    <text x="25.4" y="541">7</text>
  </g>

  <!-- Literal caret notation and number formatting match the supplied table. -->
  <g id="url-capacities" class="cell">
    <text x="295.2" y="120.4">62^1 = 62</text>
    <text x="295.2" y="190.5">62^2 = 3,844</text>
    <text x="295.2" y="260.5">62^3 = 238,328</text>
    <text x="295.2" y="330.6">62^ 4 = 14,776,336</text>
    <text x="295.2" y="400.8">62^5 = 916,132,832</text>
    <text x="295.2" y="470.9">62^6 = 56,800,235,584</text>
    <text x="295.2" y="541">62^7 = 3,521,614,606,208 = ~3.5 trillion</text>
  </g>
</svg>
