<svg xmlns="http://www.w3.org/2000/svg" width="488" height="390" viewBox="0 0 488 390" role="img" aria-labelledby="title desc">
  <title id="title">URL table schema</title>
  <desc id="desc">The URL table uses an auto-incrementing ID primary key and stores a short URL with its long URL.</desc>

  <!-- Table typography and border styling. -->
  <defs>
    <style>
      .table-title { font-family: Georgia, 'Times New Roman', serif; font-size: 39px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .field { font-family: Arial, Helvetica, sans-serif; font-size: 34px; fill: #111; dominant-baseline: middle; }
      .primary { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; fill: #111; dominant-baseline: middle; text-decoration: underline; }
    </style>
  </defs>

  <!-- Rounded table shell and shaded title row. -->
  <path d="M50 13 H423 Q458 13 458 48 V85 H15 V48 Q15 13 50 13 Z" fill="#dedede"/>
  <rect x="15" y="13" width="443" height="357" rx="35" fill="none" stroke="#111" stroke-width="2.5"/>
  <path d="M15 85 H458 M15 167 H458 M98 85 V340" fill="none" stroke="#111" stroke-width="2.5"/>

  <!-- Schema labels. -->
  <text class="table-title" x="236.5" y="55">url Table</text>
  <text class="field" x="35" y="128">PK</text>
  <text class="primary" x="116" y="128">id (auto increment)</text>
  <text class="field" x="116" y="215">shortURL</text>
  <text class="field" x="116" y="285">longURL</text>
</svg>
