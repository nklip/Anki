<svg xmlns="http://www.w3.org/2000/svg" width="850" height="388" viewBox="0 0 850 388" role="img" aria-labelledby="title desc">
  <title id="title">Convert 11157 from base 10 to base 62</title>
  <desc id="desc">Repeated division by 62 gives quotients 179, 2, and 0, with remainders 59, 55, and 2. These remainders correspond to X, T, and 2 in the illustrated base-62 alphabet. Read the symbols from bottom to top to obtain 2TX.</desc>

  <!-- Shared typography and colors preserve the reference image's visual style. -->
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 400; fill: #111; }
      .division-bracket { fill: none; stroke: #111; stroke-width: 1.7; stroke-linecap: butt; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- White canvas and rounded cyan frame use the original PNG's dimensions. -->
  <rect id="canvas" width="850" height="388" fill="#fff"/>
  <rect id="diagram-frame" x="28.7" y="12.3" width="800.3" height="361.4" rx="54" fill="none" stroke="#38b5d8" stroke-width="1.7"/>

  <!-- Column headings align with the three remainder and symbol rows. -->
  <g id="column-headings" class="label" text-anchor="middle">
    <text x="381.5" y="73.2">Remainder</text>
    <text x="657" y="73.2">Representation in base 62</text>
  </g>

  <!-- Repeated division: each quotient becomes the next row's dividend. -->
  <g id="repeated-division">
    <path id="first-division-bracket" class="division-bracket" d="M89.3 115.5 V165.9 Q89.3 184.4 107.8 184.4 H209.5"/>
    <path id="second-division-bracket" class="division-bracket" d="M123.5 184.4 V234.6 Q123.5 253 141.9 253 H243.7"/>
    <path id="third-division-bracket" class="division-bracket" d="M151.2 253 V303.7 Q151.2 322.1 169.6 322.1 H271.4"/>
    <g class="label">
      <text x="39.5" y="159.5">62</text>
      <text x="120.7" y="159.5">11157</text>
      <text x="73.5" y="236.8">62</text>
      <text x="145" y="236.8">179</text>
      <text x="108.2" y="303.8">62</text>
      <text x="173.5" y="303.8">2</text>
      <text x="173.5" y="362.2">0</text>
    </g>
  </g>

  <!-- The remainder values share baselines with their corresponding division steps. -->
  <g id="remainders" class="label" text-anchor="middle">
    <text x="381" y="159.5">59</text>
    <text x="381" y="236.8">55</text>
    <text x="381" y="303.8">2</text>
  </g>

  <!-- Native text keeps the base-62 symbols selectable and editable. -->
  <g id="base-62-symbols" class="label" text-anchor="middle">
    <text x="656" y="159.5">X</text>
    <text x="656" y="236.8">T</text>
    <text x="656" y="303.8">2</text>
  </g>
</svg>
