<svg xmlns="http://www.w3.org/2000/svg" width="1316" height="1442" viewBox="0 0 1316 1442" role="img"
  aria-labelledby="title desc">
  <title id="title">News feed publishing deep dive</title>
  <desc id="desc">The complete publishing path routes a user request through DNS, a load balancer, authenticated web
    servers, post and notification services, and a fanout pipeline. The fanout service reads graph and user data, queues
    jobs for workers, and writes precomputed feeds to cache.</desc>

  <!-- Reusable infrastructure symbols keep the large architecture repairable. -->
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"
      markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1677b8" />
    </marker>
    <symbol id="dns-globe" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="43" fill="#fff" stroke="#555" stroke-width="5" />
      <path d="M8 50 H92 M16 25 Q50 39 84 25 M16 75 Q50 61 84 75 M50 7 C28 25 28 75 50 93 M50 7 C72 25 72 75 50 93"
        fill="none" stroke="#555" stroke-width="4" /><text x="50" y="60" font-family="Arial, Helvetica, sans-serif"
        font-size="31" font-weight="700" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke"
        text-anchor="middle">DNS</text>
    </symbol>
    <symbol id="laptop" viewBox="0 0 90 70">
      <rect x="17" y="5" width="56" height="45" rx="4" fill="none" stroke="#333" stroke-width="4" />
      <path d="M9 58 H81 L87 65 H3 Z" fill="#111" />
      <path d="M38 60 H52" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </symbol>
    <symbol id="phone" viewBox="0 0 60 100">
      <rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4" />
      <path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3" />
    </symbol>
    <symbol id="load-balancer" viewBox="0 0 90 85">
      <path d="M12 3 H78 L87 81 H3 Z" fill="#1677b8" />
      <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M45 16 V66 M45 29 L30 46 V60 M45 29 L60 46 V60" />
        <path d="M39 22 L45 16 L51 22 M24 54 L30 60 L36 54 M54 54 L60 60 L66 54 M39 60 L45 66 L51 60" />
      </g>
      <circle cx="45" cy="13" r="5" fill="#fff" />
    </symbol>
    <symbol id="server-rack" viewBox="0 0 30 50">
      <rect x="2" y="1" width="26" height="48" rx="1.5" fill="#65c515" />
      <path d="M6 9 H24 M6 37 H24 M6 44 H24" stroke="#fff" stroke-width="2" />
    </symbol>
    <symbol id="server-back" viewBox="0 0 30 18">
      <rect x="2" y="1" width="26" height="16" rx="1.5" fill="#65c515" />
      <path d="M6 7 H24" stroke="#fff" stroke-width="2" />
    </symbol>
    <symbol id="cache-card" viewBox="0 0 120 110">
      <rect x="3" y="4" width="58" height="59" rx="8" fill="#1677b8" /><text x="32" y="27"
        font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle">CACHE</text>
      <rect x="31" y="25" width="58" height="59" rx="8" fill="#1677b8" /><text x="60" y="48"
        font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle">CACHE</text>
      <rect x="59" y="46" width="58" height="59" rx="8" fill="#1677b8" /><text x="88" y="69"
        font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle">CACHE</text>
    </symbol>
    <symbol id="db-cluster" viewBox="0 0 120 100">
      <g fill="#1677b8" stroke="#fff" stroke-width="1.5">
        <path d="M8 18 A25 8 0 0 1 58 18 V68 A25 8 0 0 1 8 68 Z" />
        <ellipse cx="33" cy="18" rx="25" ry="8" />
        <path d="M35 29 A25 8 0 0 1 85 29 V79 A25 8 0 0 1 35 79 Z" />
        <ellipse cx="60" cy="29" rx="25" ry="8" />
        <path d="M62 40 A25 8 0 0 1 112 40 V90 A25 8 0 0 1 62 90 Z" />
        <ellipse cx="87" cy="40" rx="25" ry="8" />
      </g>
    </symbol>
    <symbol id="graph-db" viewBox="0 0 120 120">
      <path d="M15 27 A45 22 0 0 1 105 27 V91 A45 22 0 0 1 15 91 Z" fill="#fff" stroke="#555" stroke-width="2" />
      <ellipse cx="60" cy="27" rx="45" ry="22" fill="#fff" stroke="#555" stroke-width="2" />
      <g fill="#f3f3f3" stroke="#666" stroke-width="1.2">
        <circle cx="51" cy="60" r="9" />
        <circle cx="72" cy="72" r="12" />
        <circle cx="55" cy="94" r="10" />
        <circle cx="80" cy="53" r="6" />
      </g>
      <path d="M51 60 L72 72 L55 94 M51 60 L80 53 L72 72" fill="none" stroke="#777" stroke-width="1.2"
        stroke-dasharray="2 2" />
    </symbol>
    <symbol id="message-queue" viewBox="0 0 264 80">
      <path d="M2 2 H241 L262 40 L241 78 H2 Z" fill="#fff" stroke="#1677b8" stroke-width="5" stroke-linejoin="round" />
      <g fill="none" stroke="#1677b8" stroke-width="5">
        <rect x="14" y="15" width="65" height="46" />
        <path d="M14 16 L46.5 42 L79 16" />
        <rect x="89" y="15" width="65" height="46" />
        <path d="M89 16 L121.5 42 L154 16" />
        <rect x="164" y="15" width="65" height="46" />
        <path d="M164 16 L196.5 42 L229 16" />
      </g>
    </symbol>
    <style>
      .node {
        fill: #fff;
        stroke: #111;
        stroke-width: 1.8;
      }

      .cyan-node {
        fill: #fff;
        stroke: #08b4cf;
        stroke-width: 3;
      }

      .dashed-node {
        fill: #fff;
        stroke: #08b4cf;
        stroke-width: 3;
        stroke-dasharray: 10 9;
      }

      .flow {
        fill: none;
        stroke: #1677b8;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-blue);
      }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        fill: #111;
        text-anchor: middle;
      }

      .service-label {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 23px;
        fill: #111;
        text-anchor: middle;
      }

      .step {
        fill: #fff;
        stroke: #111;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <rect width="1316" height="1442" fill="#fff" />

  <!-- User request entry. -->
  <g id="entry">
    <use href="#dns-globe" x="93" y="34" width="100" height="100" />
    <path class="flow" d="M322 84 H193" />
    <rect class="cyan-node" x="322" y="18" width="378" height="137" rx="21" />
    <text x="341" y="53" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#111">User</text>
    <use href="#laptop" x="397" y="48" width="72" height="56" />
    <text class="label" x="433" y="125">Web browser</text>
    <use href="#phone" x="575" y="38" width="45" height="75" />
    <text class="label" x="597.5" y="125">Mobile app</text>
    <path class="flow" d="M511 155 V278" />
    <text x="520" y="181" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111">v1/me/feed?</text>
    <text x="541" y="207" font-family="Arial, Helvetica, sans-serif" font-size="20"
      fill="#111">content=Hello&amp;</text>
    <text x="541" y="233" font-family="Arial, Helvetica, sans-serif" font-size="20"
      fill="#111">auth_token={auth_token}</text>
    <use href="#load-balancer" x="469" y="278" width="90" height="79" />
    <text x="562" y="325" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111">Load balancer</text>
    <path class="flow" d="M514 357 V403" />
  </g>

  <!-- Authenticated web tier and immediate service calls. -->
  <g id="web-tier">
    <rect class="dashed-node" x="303" y="403" width="431" height="172" rx="25" />
    <use href="#server-back" x="347" y="420" width="42" height="25" />
    <use href="#server-back" x="390" y="420" width="42" height="25" />
    <use href="#server-rack" x="327" y="442" width="40" height="76" />
    <use href="#server-rack" x="367" y="442" width="40" height="76" />
    <use href="#server-rack" x="407" y="442" width="40" height="76" />
    <text class="label" x="389" y="561" style="font-size:27px;">Web servers</text>
    <rect class="node" x="489" y="450" width="224" height="78" />
    <path d="M489 489 H713" stroke="#111" stroke-width="1.5" />
    <text class="label" x="601" y="480" style="font-size:20px;">Authentication</text>
    <text class="label" x="601" y="517" style="font-size:20px;">Rate Limiting</text>

    <path class="flow" d="M303 489 H219" />
    <rect class="node" x="29" y="442" width="190" height="95" rx="14" />
    <text class="service-label" x="124" y="499">Post Service</text>

    <path class="flow" d="M734 487 H863" />
    <rect class="node" x="863" y="439" width="191" height="97" rx="14" />
    <text class="service-label" x="958.5" y="481">Notification</text>
    <text class="service-label" x="958.5" y="509">Service</text>

    <path class="flow" d="M514 575 V649" />
    <rect class="node" x="418" y="649" width="190" height="96" rx="14" />
    <text class="service-label" x="513" y="707">Fanout Service</text>
  </g>

  <!-- Post data is written through cache to database. -->
  <g id="post-storage">
    <path class="flow" d="M124 537 V609" />
    <rect class="cyan-node" x="41" y="609" width="168" height="169" rx="24" />
    <use href="#cache-card" x="65" y="620" width="120" height="110" />
    <text class="label" x="125" y="755">Post Cache</text>
    <path class="flow" d="M125 778 V876" />
    <rect class="cyan-node" x="41" y="876" width="168" height="169" rx="24" />
    <use href="#db-cluster" x="65" y="894" width="120" height="100" />
    <text class="label" x="125" y="1021">Post DB</text>
  </g>

  <!-- Graph and user data reads performed by the fanout service. -->
  <g id="fanout-data">
    <path class="flow" d="M608 697 H881" />
    <circle class="step" cx="658" cy="670" r="15" /><text class="label" x="658" y="678" style="font-size:19px;">1</text>
    <rect x="676" y="654" width="150" height="29" fill="#fff" /><text class="service-label" x="751" y="678"
      style="font-size:21px;">get friend ids</text>
    <rect class="cyan-node" x="881" y="614" width="170" height="168" rx="24" />
    <use href="#graph-db" x="906" y="624" width="120" height="120" />
    <text class="label" x="966" y="760">Graph DB</text>

    <path class="flow" d="M608 705 L821 944" />
    <circle class="step" cx="658" cy="800" r="15" />
    <text class="label" x="658" y="808" style="font-size:19px;">2</text>
    <!-- The rotated lookup label stays above, rather than on, the diagonal route. -->
    <g transform="rotate(48 730 804)">
      <rect x="637" y="787" width="186" height="31" fill="#fff" />
      <text class="service-label" x="775" y="860" style="font-size:21px;">get friends data</text>
    </g>
    <rect class="cyan-node" x="821" y="862" width="169" height="169" rx="24" />
    <use href="#cache-card" x="846" y="872" width="120" height="110" />
    <text class="label" x="905.5" y="1008">User Cache</text>
    <path class="flow" d="M990 946 H1103" />
    <rect class="cyan-node" x="1103" y="862" width="169" height="169" rx="24" />
    <use href="#db-cluster" x="1128" y="879" width="120" height="100" />
    <text class="label" x="1187.5" y="1008">User DB</text>
  </g>

  <!-- Message queue, workers, and the resulting per-user feed cache. -->
  <g id="fanout-pipeline">
    <path class="flow" d="M514 745 V831" />
    <circle class="step" cx="485" cy="793" r="15" /><text class="label" x="485" y="801" style="font-size:19px;">3</text>
    <use href="#message-queue" x="386" y="831" width="264" height="80" />
    <text class="label" x="518" y="944">Message Queue</text>
    <path class="flow" d="M513 953 V1022" />
    <circle class="step" cx="483" cy="979" r="15" /><text class="label" x="483" y="987" style="font-size:19px;">4</text>

    <rect class="dashed-node" x="416" y="1022" width="194" height="160" rx="23" />
    <use href="#server-back" x="462" y="1035" width="42" height="25" />
    <use href="#server-back" x="505" y="1035" width="42" height="25" />
    <use href="#server-rack" x="441" y="1057" width="40" height="77" />
    <use href="#server-rack" x="481" y="1057" width="40" height="77" />
    <use href="#server-rack" x="521" y="1057" width="40" height="77" />
    <text class="label" x="513" y="1168">Fanout Workers</text>
    <path class="flow" d="M513 1182 V1259" />
    <circle class="step" cx="483" cy="1217" r="15" /><text class="label" x="483" y="1225"
      style="font-size:19px;">5</text>

    <rect class="cyan-node" x="421" y="1259" width="166" height="166" rx="24" />
    <use href="#cache-card" x="444" y="1268" width="120" height="110" />
    <text class="label" x="504" y="1389">News Feed</text>
    <text class="label" x="504" y="1415">Cache</text>
  </g>
</svg>