<svg xmlns="http://www.w3.org/2000/svg" width="920" height="882" viewBox="0 0 920 882" role="img" aria-labelledby="title desc">
  <title id="title">News feed retrieval deep dive</title>
  <desc id="desc">A recreation of the reference diagram. Step 1: the user requests /v1/me/feed through a load balancer. Step 2: the request reaches web servers with authentication and rate limiting. Step 3: web servers call the News Feed Service. Step 4: the service reads the News Feed Cache. Step 5: user and post information is retrieved through caches backed by databases. Step 6: the web servers return the feed to the user. The user also connects to DNS (Domain Name System) and a CDN (content delivery network).</desc>

  <!-- Shared source-native infrastructure icons and reference-matched colors. -->
  <defs>
    <!-- The nose extends 2.5 units beyond the shaft endpoint; every route compensates for it. -->
    <marker id="arrow-blue" markerWidth="17" markerHeight="17" viewBox="0 0 17 17" refX="14.5" refY="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L17 8.5 L0 17 L5 8.5 Z" fill="#2a6999"/>
    </marker>
    <symbol id="dns-globe" viewBox="0 0 74 78">
      <ellipse cx="37" cy="39" rx="33" ry="35" fill="#fff" stroke="#555654" stroke-width="4"/>
      <path d="M12 16 Q37 30 62 16 M12 63 Q37 49 62 63 M37 4 C16 15 16 63 37 74 M37 4 C58 15 58 63 37 74 M4 39 H70" fill="none" stroke="#555654" stroke-width="3.7"/>
      <rect x="10" y="26" width="54" height="29" fill="#fff"/>
      <text x="37" y="49" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#555654">DNS</text>
    </symbol>
    <symbol id="laptop" viewBox="0 0 46 33">
      <path d="M4 26 V5 Q4 2 7 2 H39 Q42 2 42 5 V26" fill="#fff" stroke="#111" stroke-width="2.1"/>
      <rect x="1" y="28" width="45" height="3.3" rx="0.6" fill="#111"/>
      <path d="M19 29 H28" stroke="#fff" stroke-width="1.2"/>
    </symbol>
    <symbol id="phone" viewBox="0 0 31 45">
      <rect x="2" y="2" width="27" height="41" rx="2.3" fill="#fff" stroke="#333" stroke-width="1.9"/>
      <path d="M2 8 H29 M2 36.5 H29 M12 5 H18 M14 40 H17" fill="none" stroke="#333" stroke-width="1.3"/>
    </symbol>
    <symbol id="load-balancer" viewBox="0 0 77 70">
      <path d="M11 1 H66 Q68 1 68.5 3 L75 63 Q75.5 67 72 67 H4 Q1 67 1.5 63 L9 3 Q9 1 11 1 Z" fill="#2e73b8" stroke="#2870a4" stroke-width="1"/>
      <path d="M38 14 V60 M38 25 L25 44 M38 25 L51 44 M25 33 V44 H35 M51 33 V44 H42 M33 53 L38 60 L43 53" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="miter"/>
      <ellipse cx="38" cy="12.3" rx="3.8" ry="4.8" fill="#fff"/>
    </symbol>
    <symbol id="server-rack" viewBox="0 0 35 65">
      <path d="M0 65 V4 Q0 0 4 0 H31 Q35 0 35 4 V65 Z" fill="#7fba42"/>
      <path d="M6 9 H28 M6 48 H28 M6 56 H28" stroke="#fff" stroke-width="2.5"/>
    </symbol>
    <symbol id="server-back" viewBox="0 0 35 21">
      <path d="M0 21 V4 Q0 0 4 0 H31 Q35 0 35 4 V21 Z" fill="#7fba42"/>
      <path d="M6 9 H28" stroke="#fff" stroke-width="2.5"/>
    </symbol>
    <symbol id="cache-stack" viewBox="0 0 98 93">
      <!-- Overlapping cards reproduce the stepped silhouette; each label stays above its overlap. -->
      <rect x="1" y="2.5" width="40" height="48" rx="5" fill="#185272"/>
      <rect x="1" y="0.5" width="40" height="48" rx="5" fill="#2e73b8" stroke="#276a9a" stroke-width="1"/>
      <text x="0" y="16" transform="translate(5 0) scale(.66 1)" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff">CACHE</text>
      <rect x="25" y="22" width="40" height="48" rx="5" fill="#185272"/>
      <rect x="25" y="20" width="40" height="48" rx="5" fill="#2e73b8" stroke="#276a9a" stroke-width="1"/>
      <text x="0" y="35.5" transform="translate(29 0) scale(.66 1)" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff">CACHE</text>
      <rect x="55" y="43" width="40" height="48" rx="5" fill="#185272"/>
      <rect x="55" y="41" width="40" height="48" rx="5" fill="#2e73b8" stroke="#276a9a" stroke-width="1"/>
      <text x="0" y="56.5" transform="translate(59 0) scale(.66 1)" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff">CACHE</text>
    </symbol>
    <symbol id="database-cluster" viewBox="0 0 89 78">
      <g fill="#2e73b8" stroke="#fff" stroke-width="2.3">
        <path d="M1 8 H43 V44 C43 55 1 55 1 44 Z"/>
        <ellipse cx="22" cy="8" rx="21" ry="6.5"/>
        <path d="M24 20 H66 V56 C66 67 24 67 24 56 Z"/>
        <ellipse cx="45" cy="20" rx="21" ry="6.5"/>
        <path d="M47 33 H89 V69 C89 80 47 80 47 69 Z"/>
        <ellipse cx="68" cy="33" rx="21" ry="6.5"/>
      </g>
    </symbol>
    <style>
      .panel { fill: #fff; stroke: #32b0d0; stroke-width: 2.5; }
      .flow { fill: none; stroke: #2a6999; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111; text-anchor: middle; }
      .step { fill: #fff; stroke: #222; stroke-width: 1.3; }
      .step-label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #222; text-anchor: middle; }
    </style>
  </defs>

  <rect width="920" height="882" fill="#fff"/>

  <!-- User, name resolution, and the content delivery network retain the reference canvas positions. -->
  <g id="user-and-edge-services">
    <use href="#dns-globe" x="13" y="29" width="74" height="78"/>
    <path id="dns-connector" class="flow" d="M192.5 73.5 H88.5"/>
    <path id="cdn-connector" class="flow" d="M519.5 73.5 H637.5"/>
    <rect id="user-panel" class="panel" x="192.5" y="13.5" width="327" height="120" rx="18.5"/>
    <text x="209" y="45" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">User</text>
    <use href="#laptop" x="268" y="45" width="46" height="33"/>
    <text class="label" x="292" y="104" style="font-size:19.5px">Web browser</text>
    <use href="#phone" x="418.5" y="37.5" width="31" height="45"/>
    <text class="label" x="441" y="104" style="font-size:19.5px">Mobile app</text>
    <g id="cdn-cloud">
      <path d="M662 99 C650 98 641.5 88 641.5 77 C641.5 66 648 59 658.5 55 C652 33 674 22 692.5 36 C698 29 704.5 25 714 23.5 L700 58.5 H713 L704 87 L744.5 42 H730.5 L740.5 26 C748.5 34 753 44 752 55 C773.5 65 773.5 91 752.5 99 Z" fill="#7eddfd"/>
      <text class="label" x="701.5" y="134" style="font-size:22px">CDN</text>
    </g>
  </g>

  <!-- Steps 1 and 2: the request passes through the load balancer into the web tier. -->
  <g id="request-entry">
    <path id="request-connector" class="flow" d="M228.5 134.8 V203.5"/>
    <text x="235" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111">/v1/me/feed</text>
    <circle class="step" cx="205.5" cy="166.5" r="12.3"/>
    <text class="step-label" x="205.5" y="172.3">1</text>
    <use href="#load-balancer" x="193" y="205.5" width="77" height="70"/>
    <text x="272" y="246" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">Load balancer</text>
    <path id="load-balancer-web-connector" class="flow" d="M230 273 V329.2"/>
    <circle class="step" cx="205.5" cy="301" r="12.3"/>
    <text class="step-label" x="205.5" y="306.8">2</text>
  </g>

  <!-- Web servers, authentication, and rate limiting share the cyan dashed boundary. -->
  <g id="web-tier">
    <rect id="web-server-panel" class="panel" x="173" y="333" width="370" height="148" rx="24" stroke-dasharray="8.5 8"/>
    <use href="#server-back" x="212" y="349" width="35" height="21"/>
    <use href="#server-back" x="251" y="349" width="35" height="21"/>
    <use href="#server-rack" x="193" y="373" width="35" height="65"/>
    <use href="#server-rack" x="232" y="373" width="35" height="65"/>
    <use href="#server-rack" x="270" y="373" width="35" height="65"/>
    <text class="label" x="248" y="464" style="font-size:22px">Web servers</text>
    <rect x="332.5" y="374" width="192" height="66" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <path d="M332.5 404.5 H524.5" stroke="#111" stroke-width="1.3"/>
    <text class="label" x="428.5" y="395">Authentication</text>
    <text class="label" x="428.5" y="428.5">Rate Limiting</text>
  </g>

  <!-- Steps 3 and 4: retrieve the precomputed feed. Service text remains real serif text. -->
  <g id="feed-service-and-cache">
    <path id="web-feed-service-connector" class="flow" d="M233.5 482.3 V539.3"/>
    <circle class="step" cx="208.5" cy="510" r="12.3"/>
    <text class="step-label" x="208.5" y="515.8">3</text>
    <rect id="news-feed-service" x="151" y="542.5" width="165" height="83" rx="12.5" fill="#fff" stroke="#222" stroke-width="1.4"/>
    <text x="232" y="592" font-family="Times New Roman, Times, serif" font-size="19" fill="#111" text-anchor="middle">News Feed Service</text>
    <path id="feed-cache-connector" class="flow" d="M233.5 626.2 V699.8"/>
    <circle class="step" cx="208.5" cy="670.5" r="12.3"/>
    <text class="step-label" x="208.5" y="676.3">4</text>
    <rect id="news-feed-cache-panel" class="panel" x="163" y="703.5" width="142" height="145" rx="21"/>
    <use href="#cache-stack" x="185.5" y="709.5" width="98" height="93"/>
    <text class="label" x="234" y="821">News Feed</text>
    <text class="label" x="234" y="840">Cache</text>
  </g>

  <!-- Step 5 branches to user and post data. The two shafts intentionally share one source point. -->
  <g id="data-lookup-connectors">
    <path id="user-cache-connector" class="flow" d="M318 586 H470.2"/>
    <path id="post-cache-connector" class="flow" d="M318 586 L471.25 788.36"/>
    <circle class="step" cx="406.5" cy="565" r="12.3"/>
    <text class="step-label" x="406.5" y="570.8">5</text>
    <circle class="step" cx="403.5" cy="670.5" r="12.3"/>
    <text class="step-label" x="403.5" y="676.3">5</text>
    <path id="user-database-connector" class="flow" d="M619.8 586 H715.3"/>
    <path id="post-database-connector" class="flow" d="M619.8 792 H715.3"/>
  </g>

  <!-- The two cache/database rows preserve matching footprints and icon scales. -->
  <g id="user-storage">
    <rect id="user-cache-panel" class="panel" x="474" y="514" width="144.5" height="144.5" rx="21"/>
    <use href="#cache-stack" x="490.5" y="522.5" width="98" height="93"/>
    <text class="label" x="543" y="640">User Cache</text>
    <rect id="user-database-panel" class="panel" x="719" y="514" width="144.5" height="144.5" rx="21"/>
    <use href="#database-cluster" x="745" y="535.5" width="89" height="78"/>
    <text class="label" x="790" y="641">User DB</text>
  </g>
  <g id="post-storage">
    <rect id="post-cache-panel" class="panel" x="474" y="720" width="144.5" height="144.5" rx="21"/>
    <use href="#cache-stack" x="490.5" y="728.5" width="98" height="93"/>
    <text class="label" x="542" y="846">Post Cache</text>
    <rect id="post-database-panel" class="panel" x="719" y="720" width="144.5" height="144.5" rx="21"/>
    <use href="#database-cluster" x="745" y="740.5" width="89" height="78"/>
    <text class="label" x="789" y="847">Post DB</text>
  </g>

  <!-- Step 6: the response arrow points up and stops at the user panel's lower boundary. -->
  <g id="feed-response">
    <path id="response-connector" class="flow" d="M471 331.5 V137.3"/>
    <circle class="step" cx="487.5" cy="241" r="12.3"/>
    <text class="step-label" x="487.5" y="246.8">6</text>
  </g>
</svg>
