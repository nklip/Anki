<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="698" viewBox="0 0 1248 698" role="img" aria-labelledby="title desc">
  <title id="title">News feed cache architecture</title>
  <desc id="desc">Five cache categories organize news feeds, content, social graph relationships, user actions, and counters.</desc>

  <!-- Shared typography and row styling match the PNG reference. -->
  <defs>
    <style>
      .row-frame { fill: none; stroke: #111; stroke-width: 4; stroke-dasharray: 11 9; }
      .cache-box { fill: #fff; stroke: #08b4cf; stroke-width: 2.2; }
      .row-label { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .item-label { font-family: Arial, Helvetica, sans-serif; font-size: 33px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1248" height="698" fill="#fff"/>

  <!-- Left-side category labels. -->
  <g id="category-labels">
    <text class="row-label" x="94" y="79">News Feed</text>
    <text class="row-label" x="94" y="210">Content</text>
    <text class="row-label" x="101" y="341" style="font-size:32px;">Social Graph</text>
    <text class="row-label" x="94" y="472">Action</text>
    <text class="row-label" x="94" y="603">Counters</text>
  </g>

  <!-- Dashed row boundaries share one left and right edge. -->
  <g id="cache-rows">
    <path class="row-frame" d="M207 13 H1218 V144 H207 Z"/>
    <path class="row-frame" d="M207 144 H1218 V276 H207 Z"/>
    <path class="row-frame" d="M207 276 H1218 V407 H207 Z"/>
    <path class="row-frame" d="M207 407 H1218 V537 H207 Z"/>
    <path class="row-frame" d="M207 537 H1218 V668 H207 Z"/>
  </g>

  <!-- Individual cache partitions. -->
  <g id="cache-partitions">
    <rect class="cache-box" x="278" y="28" width="244" height="101" rx="14"/>
    <text class="item-label" x="400" y="79">news feed</text>

    <rect class="cache-box" x="278" y="159" width="244" height="101" rx="14"/>
    <text class="item-label" x="400" y="210">hot cache</text>
    <rect class="cache-box" x="611" y="159" width="243" height="101" rx="14"/>
    <text class="item-label" x="732.5" y="210">normal</text>

    <rect class="cache-box" x="278" y="290" width="244" height="101" rx="14"/>
    <text class="item-label" x="400" y="341">follower</text>
    <rect class="cache-box" x="611" y="290" width="243" height="101" rx="14"/>
    <text class="item-label" x="732.5" y="341">following</text>

    <rect class="cache-box" x="278" y="421" width="244" height="101" rx="14"/>
    <text class="item-label" x="400" y="472">liked</text>
    <rect class="cache-box" x="611" y="421" width="243" height="101" rx="14"/>
    <text class="item-label" x="732.5" y="472">replied</text>
    <rect class="cache-box" x="923" y="421" width="244" height="101" rx="14"/>
    <text class="item-label" x="1045" y="472">others</text>

    <rect class="cache-box" x="278" y="552" width="244" height="101" rx="14"/>
    <text class="item-label" x="400" y="603">like counter</text>
    <rect class="cache-box" x="611" y="552" width="243" height="101" rx="14"/>
    <text class="item-label" x="732.5" y="603">reply counter</text>
    <rect class="cache-box" x="923" y="552" width="244" height="101" rx="14"/>
    <text class="item-label" x="1045" y="603">other counters</text>
  </g>
</svg>
