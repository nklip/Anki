<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1690" height="720" viewBox="0 0 1690 720"
     role="img" aria-labelledby="title desc">
  <title id="title">Out-of-order execution during a wallet transaction</title>
  <desc id="desc">A delayed first-phase Try request reaches database C after the coordinator has already sent the second-phase Cancel request, so Cancel arrives before Try.</desc>

  <!-- Shared styles keep the timing diagram source-native and easy to repair. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .timeline{fill:none;stroke:#000;stroke-width:2.5}
      .phase-boundary{fill:none;stroke:#000;stroke-width:2.5;stroke-dasharray:10 9}
      .event{fill:#fff;stroke:#000;stroke-width:2.5}
      .message-shaft{fill:none;stroke:#000;stroke-width:3.2}
      .annotation-shaft{fill:none;stroke:#000;stroke-width:1.4;stroke-dasharray:5 5}
      .participant{font-size:42px}
      .participant-note{font-size:31px}
      .phase-title{font-size:41px;text-anchor:middle}
      .action-label{font-size:32px}
      .operation-label{font-size:30px}
      .failure-mark{font-size:40px;fill:#fe2700}
      .failure-label{font-size:32px;fill:#fe2700}
      .caption{font-size:30px}
      .emphasis{fill:#fe2700}
    </style>

  </defs>

  <rect width="1690" height="720" fill="#fff"/>

  <!-- Dashed dividers frame the first phase and the cancel phase. -->
  <g id="phase-boundaries">
    <path class="phase-boundary" d="M351 37 V591"/>
    <path class="phase-boundary" d="M927.5 37 V591"/>
    <path class="phase-boundary" d="M1495 34 V584"/>
  </g>

  <!-- Participant timelines; database C is split around its inline NOP label. -->
  <g id="participant-timelines">
    <path class="timeline" d="M315 154.5 H1560"/>
    <path id="coordinator-time-head" d="M1584 154.5 L1560 144.5 L1560 164.5 Z" fill="#000"/>

    <!-- Split the A timeline beneath the first-phase head so no track stroke protrudes past its nose. -->
    <path class="timeline" d="M315 330.5 H727.2579 M761 330.5 H1560"/>
    <!-- First-phase progression on A: both shafts end two units inside the head base. -->
    <path id="database-a-first-phase-arrow-shaft" class="message-shaft" data-connector="true"
          d="M608 330.5 H727.2579"/>
    <path id="database-a-time-head" d="M1584 330.5 L1560 320.5 L1560 340.5 Z" fill="#000"/>

    <path class="timeline" d="M315 506.5 H734 M804 506.5 H1560"/>
    <path id="database-c-time-head" d="M1584 506.5 L1560 496.5 L1560 516.5 Z" fill="#000"/>
  </g>

  <!-- Split messages follow the line between their event centers. Nodes mask the starts;
       target shafts stop inside separate heads whose tips meet the outer circle stroke. -->
  <!-- First phase: Try reaches A, A fails, and the Try for C is delayed in flight. -->
  <g id="first-phase-messages">
    <path id="try-a-source" class="message-shaft" data-connector="true" d="M384 155 L474.6818 231"/>
    <path id="try-a-target" class="message-shaft" data-connector="true"
          d="M527.1818 275 L568.1332 309.3212"/>

    <path id="database-a-failed-source" class="message-shaft" data-connector="true" d="M761 331 L805.8864 252"/>
    <path id="database-a-failed-target" class="message-shaft" data-connector="true"
          d="M829.75 210 L844.3272 184.3442"/>

    <path id="delayed-try-source" class="message-shaft" data-connector="true" d="M384 155 L1215.5199 440"/>
    <path id="delayed-try-target" class="message-shaft" data-connector="true"
          d="M1277.6651 461.3 L1379.0732 496.0572"/>
  </g>

  <!-- Second phase: Cancel is dispatched before the delayed Try reaches database C. -->
  <g id="cancel-phase-messages">
    <path id="cancel-a-source" class="message-shaft" data-connector="true" d="M996 155 L1058.8295 212"/>
    <path id="cancel-a-target" class="message-shaft" data-connector="true"
          d="M1112.8409 261 L1165.0037 308.3230"/>

    <path id="cancel-c-source" class="message-shaft" data-connector="true" d="M996 155 L1045.7614 271"/>
    <path id="cancel-c-target" class="message-shaft" data-connector="true"
          d="M1066.7812 320 L1133.6946 475.9834"/>
  </g>

  <!-- Dashed callouts stay clear of the caption; dash offsets keep the last dash joined beneath each small head. -->
  <g id="caption-callouts">
    <path id="cancel-callout" class="annotation-shaft" data-connector="true" stroke-dashoffset="5.3921"
          d="M1085.5312 647.5 L1137.4806 528.7587"/>
    <path id="try-callout" class="annotation-shaft" data-connector="true" stroke-dashoffset="8.8231"
          d="M1463.3241 647.5 L1419.2887 529.2567"/>
  </g>

  <!-- Event circles mask the timeline and connector joins cleanly. -->
  <g id="event-points">
    <circle class="event" cx="384" cy="155" r="14.5"/>
    <circle class="event" cx="861" cy="155" r="14.5"/>
    <circle class="event" cx="996" cy="155" r="14.5"/>

    <circle class="event" cx="594" cy="331" r="14.5"/>
    <circle class="event" cx="761" cy="331" r="14.5"/>
    <circle class="event" cx="1190" cy="331" r="14.5"/>

    <circle class="event" cx="1147" cy="507" r="14.5"/>
    <circle class="event" cx="1411" cy="507" r="14.5"/>
  </g>

  <!-- Triangular noses meet the outside of each circle's 2.5-unit stroke.
       The matching shaft stops two units inside the head base, leaving the tapered nose clear. -->
  <g id="message-arrowheads" fill="#000">
    <path id="database-a-first-phase-arrowhead"
          d="M745.2579 330.5 L725.2579 338.5 L725.2579 322.5 Z"/>
    <path id="try-a-arrowhead"
          d="M581.9288 320.8832 L561.4617 314.1679 L571.7391 301.9051 Z"/>
    <path id="database-a-failed-arrowhead"
          d="M853.2194 168.6939 L850.2948 190.0351 L836.3835 182.1310 Z"/>
    <path id="delayed-try-arrowhead"
          d="M1396.1008 501.8934 L1374.5874 502.9766 L1379.7751 487.8409 Z"/>
    <path id="cancel-a-arrowhead"
          d="M1178.3351 320.4174 L1158.1472 312.9042 L1168.8978 301.0541 Z"/>
    <path id="cancel-c-arrowhead"
          d="M1140.7908 492.5256 L1125.5540 477.2993 L1140.2582 470.9915 Z"/>
  </g>

  <g id="annotation-arrowheads" fill="#000">
    <path id="cancel-callout-arrowhead"
          d="M1140.6871 521.4295 L1140.3435 532.1943 L1133.0143 528.9878 Z"/>
    <path id="try-callout-arrowhead"
          d="M1416.4967 521.7597 L1423.7352 529.7349 L1416.2382 532.5269 Z"/>
  </g>

  <!-- Labels are painted last so connector shafts never cross through the words. -->
  <g id="labels">
    <text class="participant" x="77" y="168">Coordinator</text>
    <text class="participant-note" x="78" y="210">(Wallet Service)</text>
    <text class="participant" x="82" y="343">Database A</text>
    <text class="participant" x="80" y="520">Database C</text>

    <text class="phase-title" x="633" y="87">First Phase</text>
    <text class="phase-title" x="1211" y="87">Second Phase: Cancel</text>

    <text class="action-label" x="477" y="264">Try</text>
    <text class="failure-mark" x="755" y="244">X</text>
    <text class="failure-label" x="789" y="241">Failed</text>
    <text class="action-label" x="1056" y="247">Cancel</text>
    <text class="action-label" x="1000" y="307">Cancel</text>
    <text class="action-label" x="1221" y="459">Try</text>
    <text class="operation-label" x="736" y="519">NOP</text>

    <text class="caption" x="846" y="676">Out-of-order:</text>
    <text class="caption emphasis" x="1029" y="676">Cancel</text>
    <text class="caption" x="1127" y="676">operation arrived before</text>
    <text class="caption emphasis" x="1450" y="676">Try</text>
    <text class="caption" x="1497" y="676">operation</text>
  </g>
</svg>
