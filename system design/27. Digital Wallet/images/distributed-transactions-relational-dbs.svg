<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1718" height="1014" viewBox="0 0 1718 1014"
     role="img" aria-labelledby="title desc">
  <title id="title">Distributed transactions across relational databases</title>
  <desc id="desc">Two wallet-service workers use Zookeeper partition information and can route transfer commands to relational databases A, B, and C.</desc>

  <!-- Shared visual language and auto-oriented connector head. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .outline{fill:#fff;stroke:#000;stroke-width:2.5;stroke-linejoin:round}
      .database{fill:#ffbfff;stroke:#000;stroke-width:2.5;stroke-linejoin:round}
      .connector{fill:none;stroke:#000;stroke-width:2.5;stroke-linejoin:round}
      .command-label{font-size:38px;letter-spacing:-.55px;text-anchor:middle}
      .service-label{font-size:38px;letter-spacing:-.45px;text-anchor:middle}
      .system-label{font-size:37px;text-anchor:middle}
      .table-label{font-size:28px;text-anchor:middle}
    </style>
    <marker id="arrowhead" markerWidth="24" markerHeight="18" viewBox="0 0 24 18"
            refX="24" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L24 9 L0 18 Z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1718" height="1014" fill="#fff"/>

  <!-- Transfer-command sources and the two wallet-service workers. -->
  <g id="wallet-workers">
    <circle class="outline" cx="514" cy="119" r="25.5"/>
    <circle class="outline" cx="968" cy="119" r="25.5"/>
    <rect class="outline" x="365.5" y="351.5" width="296" height="126"/>
    <rect class="outline" x="819.5" y="351.5" width="296" height="126"/>
  </g>

  <!-- Zookeeper stores the partition map used by both wallet workers. -->
  <g id="zookeeper-store">
    <path class="outline" d="M1386.5 349 V481.5 C1386.5 503.5 1613.5 503.5 1613.5 481.5 V349 Z"/>
    <ellipse class="outline" cx="1500" cy="349" rx="113.5" ry="17"/>
  </g>

  <!-- Three identical relational stores; the top ellipse masks each cylinder body seam. -->
  <g id="relational-databases">
    <g id="database-a">
      <path class="database" d="M145.5 734 V895.5 C145.5 923 441.5 923 441.5 895.5 V734 Z"/>
      <ellipse class="database" cx="293.5" cy="734" rx="148" ry="20.5"/>
    </g>
    <g id="database-b">
      <path class="database" d="M592.5 734 V895.5 C592.5 923 888.5 923 888.5 895.5 V734 Z"/>
      <ellipse class="database" cx="740.5" cy="734" rx="148" ry="20.5"/>
    </g>
    <g id="database-c">
      <path class="database" d="M1039.5 734 V895.5 C1039.5 923 1335.5 923 1335.5 895.5 V734 Z"/>
      <ellipse class="database" cx="1187.5" cy="734" rx="148" ry="20.5"/>
    </g>
  </g>

  <!-- Commands enter vertically; each head terminates on the wallet-service top edge. -->
  <g id="command-connectors">
    <path class="connector" data-connector="true" d="M514 145 V351" marker-end="url(#arrowhead)"/>
    <path class="connector" data-connector="true" d="M968 145 V351" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Every wallet worker can address every relational partition. -->
  <g id="database-connectors">
    <path id="left-wallet-to-a" class="connector" data-connector="true"
          d="M477 478 L349 714" marker-end="url(#arrowhead)"/>
    <path id="left-wallet-to-b" class="connector" data-connector="true"
          d="M550 478 L684 714" marker-end="url(#arrowhead)"/>
    <path id="left-wallet-to-c" class="connector" data-connector="true"
          d="M620 478 L1042 728" marker-end="url(#arrowhead)"/>

    <path id="right-wallet-to-a" class="connector" data-connector="true"
          d="M860 478 L440 728" marker-end="url(#arrowhead)"/>
    <path id="right-wallet-to-b" class="connector" data-connector="true"
          d="M931 478 L798 714" marker-end="url(#arrowhead)"/>
    <path id="right-wallet-to-c" class="connector" data-connector="true"
          d="M1002 478 L1134 714" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Partition lookups: one curved route from the left worker and one horizontal route from the right. -->
  <g id="zookeeper-connectors">
    <path id="left-wallet-to-zookeeper" class="connector" data-connector="true"
          d="M661 359 C880 284 1120 258 1386 359" marker-end="url(#arrowhead)"/>
    <path id="right-wallet-to-zookeeper" class="connector" data-connector="true"
          d="M1115 415 H1386" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Two-row key/balance tables stay source-native and editable. -->
  <g id="database-tables">
    <g id="table-a">
      <rect class="outline" x="185.5" y="790.5" width="52.5" height="32.5"/>
      <rect class="outline" x="248.5" y="790.5" width="153" height="32.5"/>
      <rect class="outline" x="185.5" y="837.5" width="52.5" height="32.5"/>
      <rect class="outline" x="248.5" y="837.5" width="153" height="32.5"/>
    </g>
    <g id="table-b">
      <rect class="outline" x="632.5" y="790.5" width="52.5" height="32.5"/>
      <rect class="outline" x="695.5" y="790.5" width="153" height="32.5"/>
      <rect class="outline" x="632.5" y="837.5" width="52.5" height="32.5"/>
      <rect class="outline" x="695.5" y="837.5" width="153" height="32.5"/>
    </g>
    <g id="table-c">
      <rect class="outline" x="1079.5" y="790.5" width="52.5" height="32.5"/>
      <rect class="outline" x="1142.5" y="790.5" width="153" height="32.5"/>
      <rect class="outline" x="1079.5" y="837.5" width="52.5" height="32.5"/>
      <rect class="outline" x="1142.5" y="837.5" width="153" height="32.5"/>
    </g>
  </g>

  <!-- Text is painted last so crossed connector geometry never obscures a label. -->
  <g id="labels">
    <text class="command-label" x="514" y="74">Transfer Command</text>
    <text class="command-label" x="968" y="74">Transfer Command</text>

    <text class="service-label" x="514" y="407">Wallet</text>
    <text class="service-label" x="514" y="449">Service</text>
    <text class="service-label" x="968" y="407">Wallet</text>
    <text class="service-label" x="968" y="449">Service</text>

    <text class="service-label" x="1500" y="416">Partition</text>
    <text class="service-label" x="1500" y="458">Info</text>
    <text class="system-label" x="1500" y="543">Zookeeper</text>

    <text class="table-label" x="212" y="817">ID</text>
    <text class="table-label" x="325" y="817">Balance</text>
    <text class="table-label" x="212" y="864">A</text>
    <text class="table-label" x="325" y="864">1</text>

    <text class="table-label" x="659" y="817">ID</text>
    <text class="table-label" x="772" y="817">Balance</text>
    <text class="table-label" x="659" y="864">B</text>
    <text class="table-label" x="772" y="864">1</text>

    <text class="table-label" x="1106" y="817">ID</text>
    <text class="table-label" x="1219" y="817">Balance</text>
    <text class="table-label" x="1106" y="864">C</text>
    <text class="table-label" x="1219" y="864">1</text>

    <text class="system-label" x="293.5" y="962">Relational Database</text>
    <text class="system-label" x="740.5" y="962">Relational Database</text>
    <text class="system-label" x="1187.5" y="962">Relational Database</text>
  </g>
</svg>
