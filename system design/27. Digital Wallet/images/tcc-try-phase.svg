<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1384" height="626" viewBox="0 0 1384 626"
     role="img" aria-labelledby="title desc">
  <title id="title">Try phase of a distributed wallet transaction</title>
  <desc id="desc">The wallet coordinator debits one dollar from database A while database C performs no operation. Both databases complete successfully and return Done responses to the coordinator.</desc>

  <!-- Shared visual styles and explicit, auto-oriented arrowheads. -->
  <defs>
    <style>
      text{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#000;font-weight:400}
      .timeline{fill:none;stroke:#000;stroke-width:2.25}
      .phase-boundary{fill:none;stroke:#000;stroke-width:2.5;stroke-dasharray:11 8.63}
      .lock-span{fill:none;stroke:#ff2600;stroke-width:10;stroke-linecap:round}
      .event{fill:#fff;stroke:#000;stroke-width:2.25}
      .message-shaft{fill:none;stroke:#000;stroke-width:2.25}
      .annotation-shaft{fill:none;stroke:#000;stroke-width:1.5}
      .participant{font-size:40px;letter-spacing:.45px}
      .participant-note{font-size:31px;letter-spacing:.15px}
      .phase-title{font-size:40px;letter-spacing:.4px;text-anchor:middle}
      .action-label{font-size:30px}
      .operation-label{font-size:29.5px}
      .state-label{font-size:25px;text-anchor:middle}
      .sql-label{font-family:"Times New Roman",Times,serif;font-size:29.5px}
      .status-label{font-size:30px}
    </style>

    <!-- Three-unit projection covers the 2.25-unit message shaft inside the taper. -->
    <marker id="message-arrowhead" markerWidth="20" markerHeight="16"
            viewBox="0 0 20 16" refX="17" refY="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L20 8 L0 16 Z" fill="#000"/>
    </marker>
    <!-- The thinner annotation shaft uses a two-unit nose projection. -->
    <marker id="annotation-arrowhead" markerWidth="11" markerHeight="9"
            viewBox="0 0 11 9" refX="9" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#000"/>
    </marker>
    <path id="success-checkmark-shape"
          d="M0 14 L7 21 L20 0 H25 L10 30 L0 20 Z"/>
  </defs>

  <rect width="1384" height="626" fill="#fff"/>

  <!-- The dashed divider marks entry into the first phase. -->
  <path id="phase-start" class="phase-boundary" d="M334.5 47 V588"/>

  <!-- Participant timelines; database C is split around its inline NOP label. -->
  <g id="participant-timelines">
    <path class="timeline" d="M300 160.5 H1276"/>
    <path id="coordinator-time-head" d="M1299 160.5 L1276 151.5 L1276 169.5 Z" fill="#000"/>

    <path class="timeline" d="M300 333.5 H1276"/>
    <path id="database-a-step-head" d="M1004 333.5 L977 323.5 L977 343.5 Z" fill="#000"/>
    <path id="database-a-time-head" d="M1299 333.5 L1276 324.5 L1276 342.5 Z" fill="#000"/>

    <path class="timeline" d="M300 506.5 H710 M779 506.5 H1276"/>
    <path id="database-c-step-head" d="M1049 506.5 L1022 496.5 L1022 516.5 Z" fill="#000"/>
    <path id="database-c-time-head" d="M1299 506.5 L1276 497.5 L1276 515.5 Z" fill="#000"/>
  </g>

  <!-- Database A remains locked while the debit is applied. -->
  <g id="database-a-lock">
    <path id="lock-span" class="lock-span" d="M645 333.5 H929"/>
    <path class="timeline" d="M614.5 314 V359"/>
    <path class="timeline" d="M961.5 313 V358"/>
  </g>

  <!-- Requests are split around their labels but remain on one centerline. -->
  <g id="try-requests">
    <path id="try-a-source" class="message-shaft" data-connector="true"
          d="M367 162 L450.35 232"/>
    <path id="try-a-target" class="message-shaft" data-connector="true"
          d="M506.32 279 L559.97 324.07" marker-end="url(#message-arrowhead)"/>

    <path id="database-c-nop-source" class="message-shaft" data-connector="true"
          d="M367 162 L479.70 390"/>
    <path id="database-c-nop-target" class="message-shaft" data-connector="true"
          d="M503.42 438 L530.37 492.56" marker-end="url(#message-arrowhead)"/>
  </g>

  <!-- Successful responses return to distinct coordinator events. -->
  <g id="try-responses">
    <path id="database-a-done-source" class="message-shaft" data-connector="true"
          d="M1017 335 L1055.04 265"/>
    <path id="database-a-done-target" class="message-shaft" data-connector="true"
          d="M1081.12 217 L1103.13 176.50" marker-end="url(#message-arrowhead)"/>

    <path id="database-c-done-source" class="message-shaft" data-connector="true"
          d="M1061 508 L1083.50 452"/>
    <path id="database-c-done-target" class="message-shaft" data-connector="true"
          d="M1102.37 405 L1193.85 177.31" marker-end="url(#message-arrowhead)"/>
  </g>

  <!-- Event circles mask timeline and connector starts for clean joins. -->
  <g id="event-points">
    <circle class="event" cx="367" cy="162" r="13.5"/>
    <circle class="event" cx="1111" cy="162" r="13.5"/>
    <circle class="event" cx="1200" cy="162" r="13.5"/>
    <circle class="event" cx="573" cy="335" r="13.5"/>
    <circle class="event" cx="1017" cy="335" r="13.5"/>
    <circle class="event" cx="538" cy="508" r="13.5"/>
    <circle class="event" cx="1061" cy="508" r="13.5"/>
  </g>

  <!-- Small callouts identify the lock boundaries and SQL application point. -->
  <g id="annotations">
    <path id="lock-callout" class="annotation-shaft" data-connector="true"
          d="M626 393 L615.14 360.89" marker-end="url(#annotation-arrowhead)"/>
    <path id="unlock-callout" class="annotation-shaft" data-connector="true"
          d="M941 392 L960.47 359.71" marker-end="url(#annotation-arrowhead)"/>
    <path id="sql-callout" class="annotation-shaft" data-connector="true"
          d="M787.5 295 V327" marker-end="url(#annotation-arrowhead)"/>
  </g>

  <!-- Labels are painted last so no connector crosses readable text. -->
  <g id="labels">
    <text class="participant" x="65" y="175">Coordinator</text>
    <text class="participant-note" x="67" y="216.5">(Wallet Service)</text>
    <text class="participant" x="71" y="348">Database A</text>
    <text class="participant" x="68" y="521">Database C</text>

    <text class="phase-title" x="787.5" y="93">First Phase</text>

    <text class="action-label" x="431.5" y="267.5" style="font-size:30.5px">Try: A−$1</text>
    <text class="action-label" x="458" y="426">NOP</text>
    <text class="operation-label" x="714" y="519" style="font-size:30.5px">NOP</text>

    <text class="sql-label" x="632" y="207">
      <tspan x="632">UPDATE balance</tspan>
      <tspan x="632" dy="35">SET amount = amount - 1</tspan>
      <tspan x="632" dy="34">WHERE account = ‘A’</tspan>
    </text>

    <text class="operation-label" x="597" y="431">lock A</text>
    <text class="operation-label" x="865" y="430">unlock A</text>

    <text class="state-label" x="573" y="373">A=$1</text>
    <text class="state-label" x="1017" y="373">A=$0</text>
    <text class="state-label" x="538" y="546">C=$0</text>
    <text class="state-label" x="1060" y="544">C=$0</text>

    <use id="database-a-success-mark" href="#success-checkmark-shape"
         transform="translate(1017 229)" fill="#0096ff"/>
    <text class="status-label" x="1049" y="253">Done</text>
    <use id="database-c-success-mark" href="#success-checkmark-shape"
         transform="translate(1032 416)" fill="#0096ff"/>
    <text class="status-label" x="1064" y="440">Done</text>
  </g>
</svg>
