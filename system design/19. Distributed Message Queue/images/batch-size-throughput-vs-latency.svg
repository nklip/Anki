<svg xmlns="http://www.w3.org/2000/svg" width="1346" height="894" viewBox="0 0 1346 894" role="img" aria-labelledby="title desc">
  <title id="title">Batch size trade-off</title>
  <desc id="desc">Increasing batch size generally raises throughput while also increasing latency.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
    
  </defs>
  <rect id="background" width="1346" height="894" fill="#fff"/>
  <!-- Axes -->
  <path class="arrow" d="M159 803V106"/><path class="arrow" d="M159 803H1100"/>
  <text x="159" y="75" font-size="34" text-anchor="middle">Latency</text><text x="70" y="141" font-size="34">High</text><text x="129" y="841" font-size="34">Low</text>
  <text x="1124" y="813" font-size="34">Throughput</text><text x="1038" y="868" font-size="34">High</text>
  <!-- Batch-size trend -->
  <path class="arrow dash" d="M159 803 882 240"/><text x="896" y="263" font-size="34">Batch size</text>
</svg>
