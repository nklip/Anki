<svg xmlns="http://www.w3.org/2000/svg" width="1698" height="216" viewBox="0 0 1698 216" role="img" aria-labelledby="title desc">
  <title id="title">Exactly-once delivery</title>
  <desc id="desc">The producer, queue, and consumer coordinate so each message is processed exactly once.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
    
  </defs>
  <rect id="background" width="1698" height="216" fill="#fff"/>
  <!-- Guaranteed delivery chain -->
  <rect id="producer" class="box" x="25" y="29" width="341" height="160" rx="11"/><text x="196" y="121" font-size="35" text-anchor="middle">Producer</text>
  <rect id="queue" class="box" x="680" y="29" width="340" height="160" rx="11"/><text x="850" y="70" font-size="35" text-anchor="middle">Message queue</text><g id="queued-messages"><rect class="msg" x="733" y="97" width="25" height="70"/><rect class="msg" x="767" y="97" width="25" height="70"/><rect class="msg" x="801" y="97" width="25" height="70"/><rect class="msg" x="835" y="97" width="25" height="70"/><rect class="msg" x="869" y="97" width="25" height="70"/><rect class="msg" x="903" y="97" width="25" height="70"/><rect class="msg" x="937" y="97" width="25" height="70"/></g>
  <rect id="consumer" class="box" x="1334" y="29" width="340" height="160" rx="11"/><text x="1504" y="121" font-size="35" text-anchor="middle">Consumer</text>
  <!-- Guarantee labels stay clear of arrow shafts -->
  <path class="arrow" d="M366 109H678"/><rect x="422" y="72" width="200" height="75" fill="#fff"/><text x="522" y="101" font-size="34" text-anchor="middle"><tspan x="522">guaranteed</tspan><tspan x="522" dy="37">once</tspan></text>
  <path class="arrow" d="M1020 109H1332"/><rect x="1076" y="72" width="200" height="75" fill="#fff"/><text x="1176" y="101" font-size="34" text-anchor="middle"><tspan x="1176">guaranteed</tspan><tspan x="1176" dy="37">once</tspan></text>
</svg>
