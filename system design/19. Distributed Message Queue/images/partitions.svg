<svg xmlns="http://www.w3.org/2000/svg" width="1356" height="260" viewBox="0 0 1356 260" role="img" aria-labelledby="title desc">
  <title id="title">Topic partitioning</title>
  <desc id="desc">Messages from Topic A are split across two partitions.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
    
  </defs>
  <rect id="background" width="1356" height="260" fill="#fff"/>
  <!-- Unpartitioned topic -->
  <text x="32" y="141" font-size="36">Topic-A</text><rect class="box" x="181" y="83" width="275" height="95"/><g><rect class="msg" x="193" y="92" width="27" height="76"/><rect class="msg" x="230" y="92" width="27" height="76"/><rect class="msg" x="267" y="92" width="27" height="76"/><rect class="msg" x="304" y="92" width="27" height="76"/><rect class="msg" x="341" y="92" width="27" height="76"/><rect class="msg" x="378" y="92" width="27" height="76"/><rect class="msg" x="415" y="92" width="27" height="76"/></g>
  <!-- Transformation arrow -->
  <path d="M548 107h62V83l35 47-35 48v-25h-62z" fill="#fff" stroke="#888" stroke-width="2"/>
  <!-- Partitioned topic -->
  <text x="724" y="141" font-size="36">Topic-A</text><g id="partitioned-topic" class="box"><rect x="856" y="35" width="275" height="190"/></g>
  <path class="line" d="M856 130H1131"/><g><rect class="msg" x="905" y="45" width="27" height="76"/><rect class="msg" x="1017" y="45" width="27" height="76"/><rect class="msg" x="1054" y="45" width="27" height="76"/><rect class="msg" x="868" y="140" width="27" height="76"/><rect class="msg" x="942" y="140" width="27" height="76"/><rect class="msg" x="979" y="140" width="27" height="76"/><rect class="msg" x="1092" y="140" width="27" height="76"/></g>
  <text x="1144" y="94" font-size="36">Partition-1</text><text x="1144" y="188" font-size="36">Partition-2</text>
</svg>
