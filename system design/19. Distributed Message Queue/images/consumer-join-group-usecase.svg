<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1002" viewBox="0 0 1640 1002" role="img" aria-labelledby="title desc">
  <title id="title">Consumer joins a group</title><desc id="desc">Consumer B joins Consumer A’s group, causing a rebalance, leader selection, and new partition assignments.</desc>
  
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#808080;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#808080;stroke-width:2}.persist{fill:#cdfdc5;stroke:#808080;stroke-width:2}.new{fill:#fffec4;stroke:#808080;stroke-width:2}.note{fill:#fffec4;stroke:#808080;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect id="background" width="1640" height="1002" fill="#fff" />
  
  <rect class="box" x="54" y="41.5" width="266.8" height="86" /><text x="189" y="98" font-size="35.5" text-anchor="middle">Consumer A</text><path class="line dash" d="M188 122V884" /><rect class="box" x="54" y="890.5" width="266.8" height="86" /><text x="189" y="947" font-size="35.5" text-anchor="middle">Consumer A</text><rect class="box" x="693" y="41.5" width="266" height="86" /><text x="827" y="98" font-size="35.5" text-anchor="middle">Coordinator</text><path class="line dash" d="M827 122V884" /><rect class="box" x="693" y="890.5" width="266" height="86" /><text x="827" y="947" font-size="35.5" text-anchor="middle">Coordinator</text><rect class="box" x="1331.2" y="41.5" width="266.8" height="86" /><text x="1465" y="98" font-size="35.5" text-anchor="middle">Consumer B</text><path class="line dash" d="M1465 122V884" /><rect class="box" x="1331.2" y="890.5" width="266.8" height="86" /><text x="1465" y="947" font-size="35.5" text-anchor="middle">Consumer B</text>
  
  <path class="line" d="M187 170 H298" /><path class="arrow" d="M712 170 H823" /><rect x="303" y="152" width="405" height="39" fill="#fff" /><text x="506.5" y="179" font-size="26.5" text-anchor="middle">1a. Heartbeat (I’m A in the group)</text>
  <path class="line" d="M827 241 H640" /><path class="arrow" d="M376 240 H190" /><rect x="382" y="222" width="251" height="34" fill="#fff" /><text x="508.5" y="249" font-size="26.5" text-anchor="middle">1b. Heartbeat acked</text>
  <path class="line" d="M1465 306 H1358" /><path class="arrow" d="M934 305 H825" /><rect x="933" y="284" width="425" height="44" fill="#fffec4" /><text x="1151.5" y="316" font-size="27.5" text-anchor="middle">2. JoinGroup (I’m B. I want to join)</text>
  <path class="line" d="M187 356 H298" /><path class="arrow" d="M713 356 H822" /><rect x="303" y="339" width="406" height="39" fill="#fff" /><text x="506.5" y="366" font-size="26.5" text-anchor="middle">3a. Heartbeat (I’m A in the group)</text>
  <path class="line" d="M827 428 H737" /><path class="arrow" d="M280 427 H190" /><rect x="279" y="390.5" width="455" height="79" fill="#fffec4" /><text x="509.5" y="421" font-size="26.5" text-anchor="middle"><tspan x="509.5">3b. Heartbeat (Sorry A, group needs</tspan><tspan x="509.5" dy="31">to rebalance. Please rejoin)</tspan></text>
  
  <path class="line" d="M187 502 H247" /><path class="arrow" d="M761 503 H827" /><rect x="252" y="485" width="504" height="39" fill="#fff" /><text x="504.5" y="512" font-size="26.5" text-anchor="middle">4a. JoinGroup (I’m A. I want to join group)</text>
  <path class="line" d="M826 577 H767" /><path class="arrow" d="M249 576 H187" /><rect x="252" y="544" width="509" height="70" fill="#fff" /><text x="506.5" y="571" font-size="26.5" text-anchor="middle"><tspan x="506.5">4b. JoinGroup (A joins group successfully.</tspan><tspan x="506.5" dy="31">You are a follower)</tspan></text>
  <path class="line" d="M826 632 H859" /><path class="arrow" d="M1429 632 H1463" /><rect x="866" y="598" width="553" height="70" fill="#fff" /><text x="1142.5" y="625" font-size="26.5" text-anchor="middle"><tspan x="1142.5">4b. JoinGroup (B joins the group successfully.</tspan><tspan x="1142.5" dy="31">You are the leader. Group members: A, B)</tspan></text>
  
  <path class="line" d="M187 685 H322" /><path class="arrow" d="M682 685 H823" /><rect x="329" y="652" width="346" height="70" fill="#fff" /><text x="502.5" y="679" font-size="26.5" text-anchor="middle"><tspan x="502.5">5. SyncGroup (Wait for the</tspan><tspan x="502.5" dy="31">leader to dispatch partitions)</tspan></text>
  <path class="line" d="M1465 741 H1382" /><path class="arrow" d="M910 739 H827" /><rect x="916" y="721" width="459" height="39" fill="#fff" /><text x="1146.5" y="748" font-size="26.5" text-anchor="middle">5. SyncGroup (partition dispatch plan)</text>
  <path class="line" d="M827 795 H805" /><path class="arrow" d="M223 793 H189" /><rect x="228" y="775" width="572" height="39" fill="#fff" /><text x="514.5" y="802" font-size="26.5" text-anchor="middle">6. SyncGroup (A should consume partition 1, 3)</text>
  <path class="line" d="M693 890 H959" /><path class="arrow" d="M1432 846 H1463" /><rect x="853" y="827" width="572" height="39" fill="#fff" /><text x="1139.5" y="854" font-size="26.5" text-anchor="middle">6. SyncGroup (B should consume partition 2, 4)</text>
</svg>