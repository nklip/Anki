<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="190" viewBox="0 0 1526 190" role="img"
  aria-labelledby="title desc">
  <title id="title">At-least-once delivery</title>
  <desc id="desc">A producer and message queue may retry, so the consumer can receive duplicate messages.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth"
      orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" />
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #000
      }

      .box {
        fill: #fff;
        stroke: #808080;
        stroke-width: 2
      }

      .line {
        fill: none;
        stroke: #000;
        stroke-width: 2
      }

      .arrow {
        fill: none;
        stroke: #000;
        stroke-width: 2;
        marker-end: url(#arrow)
      }

      .dash {
        stroke-dasharray: 10 8
      }

      .msg {
        fill: #fff;
        stroke: #808080;
        stroke-width: 2
      }

      .persist {
        fill: #cdfdc5;
        stroke: #808080;
        stroke-width: 2
      }

      .new {
        fill: #fffec4;
        stroke: #808080;
        stroke-width: 2
      }
    </style>

  </defs>
  <rect id="background" width="1526" height="190" fill="#fff" />

  <rect id="producer" class="box" x="26" y="23" width="304" height="143" rx="10" />
  <text x="179" y="105" font-size="30"
    text-anchor="middle">Producer</text>
  <rect id="queue" class="box" x="610" y="23" width="304" height="143" rx="10" />
  <text x="763" y="60" font-size="29.5"
    text-anchor="middle">Message queue</text>
  <g id="queued-messages">
    <rect class="msg" x="657.2" y="83.5" width="22.2" height="63" />
    <rect class="msg" x="688.2" y="83.5" width="22.2" height="63" />
    <rect class="msg" x="719.2" y="83.5" width="22.2" height="63" />
    <rect class="msg" x="750.2" y="83.5" width="22.5" height="63" />
    <rect class="msg" x="781.5" y="83.5" width="22.2" height="63" />
    <rect class="msg" x="812.5" y="83.5" width="22.2" height="63" />
    <rect class="msg" x="843.5" y="83.5" width="22.2" height="63" />
  </g>
  <rect id="consumer" class="box" x="1194" y="23" width="304" height="143" rx="10" />
  <text x="1347" y="105"
    font-size="29.5" text-anchor="middle">Consumer</text>

  <path class="arrow" d="M329 47H607M329 94H607M329 47H607" />
  <path class="arrow" d="M329 47H607M329 94H607M329 94H607" />
  <path class="arrow" d="M329 47H607M329 94H607M329 141H607" />

  <path class="arrow" d="M913 47H1190M912 94H1190M912 47H1190" />
  <path class="arrow" d="M913 47H1190M912 94H1190M912 94H1190" />
  <path class="arrow" d="M913 47H1190M912 94H1190M912 141H1190" />

  <rect x="399" y="106" width="139" height="75" fill="#fff" />
  <text x="469" y="136" font-size="29.5"
    text-anchor="middle">
    <tspan x="469">may have</tspan>
    <tspan x="469" dy="32">duplicate</tspan>
  </text>
  <rect x="984" y="107" width="139" height="75" fill="#fff" />
  <text x="1054" y="137" font-size="29.5"
    text-anchor="middle">
    <tspan x="1054">may have</tspan>
    <tspan x="1054" dy="32">duplicate</tspan>
  </text>
</svg>