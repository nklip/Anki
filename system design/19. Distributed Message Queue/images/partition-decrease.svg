<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="594" viewBox="0 0 1160 594" role="img" aria-labelledby="title desc">
  <title id="title">Decreasing partitions</title><desc id="desc">Messages from a removed third partition are redistributed into the remaining two partitions.</desc>
  <!-- Shared diagram definitions -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style></defs>
  <rect id="background" width="1160" height="594" fill="#fff"/>
  <!-- Legend -->
  <rect x="230" y="35" width="710" height="122" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="10 8"/><rect class="persist" x="271" y="63" width="20" height="75"/><text x="313" y="111" font-size="33">Persisted messages</text><rect class="new" x="657" y="63" width="20" height="75"/><text x="698" y="111" font-size="33">New messages</text>
  <!-- Before partitions -->
  <text x="48" y="267" font-size="34">partition-1</text><rect class="box" x="219" y="208" width="191" height="95"/><rect class="persist" x="228" y="217" width="19" height="76"/><rect class="persist" x="254" y="217" width="19" height="76"/><rect class="persist" x="306" y="217" width="19" height="76"/>
  <text x="48" y="397" font-size="34">partition-2</text><rect class="box" x="219" y="338" width="191" height="95"/><rect class="persist" x="253" y="348" width="19" height="75"/><rect class="persist" x="279" y="348" width="19" height="75"/><rect class="persist" x="305" y="348" width="19" height="75"/>
  <text x="48" y="527" font-size="34">partition-3</text><rect class="box" x="219" y="468" width="191" height="95"/><rect class="persist" x="228" y="478" width="19" height="75"/><rect class="persist" x="279" y="478" width="19" height="75"/><rect class="persist" x="305" y="478" width="19" height="75"/>
  <!-- Redistribution -->
  <path d="M513 359h72v-34l42 71-42 72v-35h-72z" fill="#fff" stroke="#888" stroke-width="2"/>
  <!-- After partitions -->
  <text x="963" y="267" font-size="34">partition-1</text><rect class="box" x="761" y="208" width="191" height="95"/><rect class="persist" x="770" y="217" width="19" height="76"/><rect class="persist" x="796" y="217" width="19" height="76"/><rect class="persist" x="822" y="217" width="19" height="76"/><rect class="new" x="900" y="217" width="19" height="76"/><rect class="new" x="926" y="217" width="19" height="76"/>
  <text x="963" y="397" font-size="34">partition-2</text><rect class="box" x="761" y="338" width="191" height="95"/><rect class="persist" x="795" y="348" width="19" height="75"/><rect class="persist" x="821" y="348" width="19" height="75"/><rect class="persist" x="847" y="348" width="19" height="75"/><rect class="new" x="874" y="348" width="19" height="75"/><rect class="new" x="925" y="348" width="19" height="75"/>
  <text x="963" y="527" font-size="34" fill="#aaa">partition-3</text><rect x="761" y="468" width="191" height="95" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><rect class="persist" x="770" y="478" width="19" height="75"/><rect class="persist dash" x="821" y="478" width="19" height="75"/><rect class="persist dash" x="847" y="478" width="19" height="75"/>
</svg>
