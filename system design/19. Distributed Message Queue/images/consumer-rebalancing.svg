<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1716" height="634" viewBox="0 0 1716 634" role="img" aria-labelledby="title desc">
  <title id="title">Consumer group coordinators</title>
  <desc id="desc">Consumers in the same group connect to the same broker coordinator, while another group uses a different coordinator.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}.note{fill:#fffdb5;stroke:#888;stroke-width:2;stroke-dasharray:10 8}</style>
  </defs>
  <rect id="background" width="1716" height="634" fill="#fff"/>
  <!-- Consumers -->
  <rect class="box" x="41" y="35" width="284" height="122"/>
  <text x="183" y="89" font-size="34" text-anchor="middle">
    <tspan x="183">Consumer-1</tspan>
    <tspan x="183" dy="38">Group-1</tspan>
  </text>
  <rect class="box" x="496" y="35" width="284" height="122"/>
  <text x="638" y="89" font-size="34" text-anchor="middle">
    <tspan x="638">Consumer-2</tspan>
    <tspan x="638" dy="38">Group-1</tspan>
  </text>
  <rect class="box" x="950" y="35" width="284" height="122"/>
  <text x="1092" y="89" font-size="34" text-anchor="middle">
    <tspan x="1092">Consumer-3</tspan>
    <tspan x="1092" dy="38">Group-1</tspan>
  </text>
  <rect class="box" x="1405" y="35" width="284" height="122"/>
  <text x="1547" y="89" font-size="34" text-anchor="middle">
    <tspan x="1547">Consumer-4</tspan>
    <tspan x="1547" dy="38">Group-2</tspan>
  </text>
  <!-- Group coordinators -->
  <rect id="group-1-coordinator" class="box" x="326" y="415" width="396" height="188"/>
  <text x="524" y="503" font-size="33" text-anchor="middle">
    <tspan x="524">Broker-1</tspan>
    <tspan x="524" dy="39">(Coordinator of Group-1)</tspan>
  </text>
  <rect id="group-2-coordinator" class="box" x="1013" y="415" width="397" height="188"/>
  <text x="1211" y="503" font-size="33" text-anchor="middle">
    <tspan x="1211">Broker-2</tspan>
    <tspan x="1211" dy="39">(Coordinator of Group-2)</tspan>
  </text>
  <!-- Consumer-to-coordinator routes -->
  <!-- Arrow tips touch the coordinator-card borders without entering the boxes. -->
  <!-- Separate paths preserve an arrowhead on every consumer-to-coordinator route. -->
  <path class="arrow" d="M183 157 446 415"/>
  <path class="arrow" d="M638 157 551 415"/>
  <path class="arrow" d="M1092 157 655 415"/>
  <path class="arrow" d="M1547 157 1288 415"/>
</svg>
