  <!-- Group 1 offset -->
  <path class="line dash" marker-start="url(#arrow)" d="M48 168H145"/>
  <path class="line dash" marker-end="url(#arrow)" d="M455 168H598"/>
  <path class="line" d="M41 143V187M600 132V205"/>
  <text x="166" y="179" font-size="34">group-1 consumed</text>
  <text x="600" y="72" font-size="34" text-anchor="middle">
    <tspan x="600">consumer group-1:</tspan>
    <tspan x="600" dy="40">last consumed offset = 6</tspan>
  </text>
  <path class="arrow" d="M600 132V206"/>
  <!-- Group 2 offset -->
  <path class="line dash" marker-start="url(#arrow)" d="M48 412H440"/>
