    <text x="944" y="301" font-size="34" text-anchor="middle">10</text>
    <rect class="msg" x="987" y="208" width="86" height="162"/>
    <text x="1030" y="301" font-size="34" text-anchor="middle">11</text>
    <rect class="msg" x="1073" y="208" width="86" height="162"/>
    <text x="1116" y="301" font-size="34" text-anchor="middle">12</text>
    <rect class="msg" x="1159" y="208" width="86" height="162"/>
    <text x="1202" y="301" font-size="34" text-anchor="middle">13</text>
