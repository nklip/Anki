<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1502" height="576" viewBox="0 0 1502 576" role="img" aria-labelledby="title desc">
  <title id="title">Consumer group state storage</title>
  <desc id="desc">Two consumer groups store independent last-consumed offsets for the same topic partition.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
  </defs>
  <rect id="background" width="1502" height="576" fill="#fff"/>
  <!-- Partition records -->
  <text x="1106" y="186" font-size="34">Topic-A Partition-1</text>
  <g>
    <rect class="msg" x="41" y="208" width="86" height="162"/>
    <text x="84" y="301" font-size="34" text-anchor="middle">0</text>
    <rect class="msg" x="127" y="208" width="86" height="162"/>
    <text x="170" y="301" font-size="34" text-anchor="middle">1</text>
    <rect class="msg" x="213" y="208" width="86" height="162"/>
    <text x="256" y="301" font-size="34" text-anchor="middle">2</text>
    <rect class="msg" x="299" y="208" width="86" height="162"/>
    <text x="342" y="301" font-size="34" text-anchor="middle">3</text>
    <rect class="msg" x="385" y="208" width="86" height="162"/>
    <text x="428" y="301" font-size="34" text-anchor="middle">4</text>
    <rect class="msg" x="471" y="208" width="86" height="162"/>
    <text x="514" y="301" font-size="34" text-anchor="middle">5</text>
    <rect class="msg" x="557" y="208" width="86" height="162"/>
    <text x="600" y="301" font-size="34" text-anchor="middle">6</text>
    <rect class="msg" x="643" y="208" width="86" height="162"/>
    <text x="686" y="301" font-size="34" text-anchor="middle">7</text>
    <rect class="msg" x="729" y="208" width="86" height="162"/>
    <text x="772" y="301" font-size="34" text-anchor="middle">8</text>
    <rect class="msg" x="815" y="208" width="86" height="162"/>
    <text x="858" y="301" font-size="34" text-anchor="middle">9</text>
