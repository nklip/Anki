<svg xmlns="http://www.w3.org/2000/svg" width="1134" height="884" viewBox="0 0 1134 884" role="img" aria-labelledby="title desc">
  <title id="title">Message record structure</title>
  <desc id="desc">A two-column table lists the fields and data types stored in a message record.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
    
  </defs>
  <rect id="background" width="1134" height="884" fill="#fff"/>
  <!-- Alternating table rows -->
  <g id="table"><rect x="19" y="17" width="1099" height="850" fill="#fff" stroke="#e2e2e2" stroke-width="2"/>
  <path d="M19 17H1118V112H19ZM19 207H1118V301H19ZM19 396H1118V490H19ZM19 585H1118V679H19ZM19 773H1118V867H19Z" fill="#f5f5f5"/>
  <path d="M589 17V867M19 112H1118M19 207H1118M19 301H1118M19 396H1118M19 490H1118M19 585H1118M19 679H1118M19 773H1118" fill="none" stroke="#e2e2e2" stroke-width="2"/></g>
  <!-- Header and values -->
  <text x="42" y="76" font-size="32" font-weight="700">Field Name</text><text x="613" y="76" font-size="32" font-weight="700">Data Type</text>
  <g font-size="32"><text x="42" y="170" font-weight="700">key</text><text x="613" y="170">byte[]</text><text x="42" y="264" font-weight="700">value</text><text x="613" y="264">byte[]</text><text x="42" y="359">topic</text><text x="613" y="359">string</text><text x="42" y="453">partition</text><text x="613" y="453">integer</text><text x="42" y="548">offset</text><text x="613" y="548">long</text><text x="42" y="642">timestamp</text><text x="613" y="642">long</text><text x="42" y="736">size</text><text x="613" y="736">integer</text><text x="42" y="831">crc [5]</text><text x="613" y="831">integer</text></g>
</svg>
