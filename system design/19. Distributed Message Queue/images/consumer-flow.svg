<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="692" viewBox="0 0 1206 692" role="img" aria-labelledby="title desc">
  <title id="title">Consumer group message flow</title>
  <desc id="desc">A consumer joins a group, receives a partition assignment, fetches messages, processes them, and commits its offset.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" />
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#808080;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#808080;stroke-width:2}.persist{fill:#cdfdc5;stroke:#808080;stroke-width:2}.new{fill:#fffec4;stroke:#808080;stroke-width:2}.note{fill:#fffec4;stroke:#808080;stroke-width:2;stroke-dasharray:10 8}</style>
  </defs>
  <rect id="background" width="1206" height="692" fill="#fff" />

  <!-- Workflow participants and broker state -->
  <rect id="consumer" class="box" x="718" y="17.5" width="338.6" height="144.5" />
  <text x="888" y="104" font-size="37.5" text-anchor="middle">Consumer</text>
  <rect id="coordinator" x="67.4" y="437" width="473.6" height="224.5" fill="#fffec4" stroke="#808080" stroke-width="2" />
  <text x="303" y="561" font-size="37" text-anchor="middle">Coordinator of group-1</text>
  <text x="306" y="643" font-size="37" text-anchor="middle">Broker-1</text>
  <rect id="partition-broker" class="box" x="650" y="437" width="474" height="224.5" />
  <text x="875" y="514" font-size="38" text-anchor="end">
    <tspan x="875">Topic-A</tspan>
    <tspan x="875" dy="41">Partition-2</tspan>
  </text>
  <rect x="886.2" y="471" width="201.8" height="98.5" fill="#cdfdc5" stroke="#808080" stroke-width="2" />
  <rect class="msg" x="894" y="481.5" width="21" height="78" />
  <rect class="msg" x="922" y="481.5" width="20" height="78" />
  <rect class="msg" x="949" y="481.5" width="21" height="78" />
  <rect class="msg" x="976.5" y="481.5" width="20.5" height="78" />
  <rect class="msg" x="1004" y="481.5" width="21" height="78" />
  <rect class="msg" x="1031.5" y="481.5" width="20.5" height="78" />
  <rect class="msg" x="1059" y="481.5" width="20.8" height="78" />
  <text x="888" y="643" font-size="37.5" text-anchor="middle">Broker-2</text>

  <!-- Numbered workflow connectors. Guide lines stop at component borders or
       before labels; arrow tips meet their destination borders without entering. -->
  <path class="line" d="M718 91C600 97 520 117 481 127" />
  <text x="359" y="174" font-size="37" text-anchor="middle">
    <tspan x="359">1. join consumer group-1</tspan>
    <tspan x="359" dy="42">&amp; subscribe topic-A</tspan>
  </text>
  <path class="arrow" d="M301 236C264 301 253 369 260 433" />
  <path class="line" d="M382 437C429 380 466 340 490 322" />
  <text x="525" y="299" font-size="38" text-anchor="middle">2. partition-2 dispatched</text>
  <path class="arrow" d="M569 252C620 220 670 186 715 160" />
  <path class="line" d="M924 472C900 446 875 419 856 395" />
  <text x="840" y="372" font-size="37" text-anchor="middle">3. fetch messages</text>
  <path class="arrow" d="M825 326C811 271 813 214 837 167" />
  <path class="line" d="M962 162C975 181 988 200 999 216" />
  <text x="1022" y="264" font-size="37" text-anchor="middle">
    <tspan x="1022">4. process data</tspan>
    <tspan x="1022" dy="42">&amp; commit offset</tspan>
  </text>
  <path class="arrow" d="M1032 326C1044 378 1034 429 1012 468" />
</svg>
