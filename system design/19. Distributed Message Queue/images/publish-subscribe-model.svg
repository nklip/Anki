<svg xmlns="http://www.w3.org/2000/svg" width="1628" height="578" viewBox="0 0 1628 578" role="img" aria-labelledby="title desc">
  <title id="title">Publish-subscribe messaging model</title>
  <desc id="desc">Each subscribed consumer receives its own copy of the published message.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
    
  </defs>
  <rect id="background" width="1628" height="578" fill="#fff"/>
  <!-- Producer and topic queue -->
  <rect id="producer" class="box" x="39" y="245" width="311" height="104"/><text x="194" y="310" font-size="35" text-anchor="middle">Producer</text>
  <path class="arrow" d="M350 297H631"/><text x="485" y="197" font-size="35" text-anchor="middle">Message A</text><rect class="msg" x="477" y="207" width="17" height="76"/>
  <rect id="queue" class="box" x="633" y="222" width="338" height="150"/><text x="802" y="258" font-size="35" text-anchor="middle">Message Queue</text><g><rect class="msg" x="670" y="280" width="17" height="77"/><rect class="msg" x="697" y="280" width="17" height="77"/><rect class="msg" x="724" y="280" width="17" height="77"/><rect class="msg" x="751" y="280" width="17" height="77"/><rect class="msg" x="778" y="280" width="17" height="77"/><rect class="msg" x="805" y="280" width="17" height="77"/><rect class="msg" x="832" y="280" width="17" height="77"/><rect class="msg" x="859" y="280" width="17" height="77"/><rect class="msg" x="886" y="280" width="17" height="77"/><rect class="msg" x="913" y="280" width="17" height="77"/></g>
  <!-- Broadcast copies -->
  <path class="arrow" d="M971 273 1289 132"/><path class="arrow" d="M971 318 1289 449"/>
  <text x="1120" y="103" font-size="35" text-anchor="middle">Message A</text><rect class="msg" x="1112" y="113" width="17" height="76"/>
  <text x="1120" y="510" font-size="35" text-anchor="middle">Message A</text><rect class="msg" x="1112" y="398" width="17" height="76"/>
  <rect id="consumer-1" class="box" x="1291" y="28" width="311" height="104"/><text x="1446" y="94" font-size="35" text-anchor="middle">Consumer 1</text>
  <rect id="consumer-2" class="box" x="1291" y="450" width="311" height="104"/><text x="1446" y="516" font-size="35" text-anchor="middle">Consumer 2</text>
</svg>
