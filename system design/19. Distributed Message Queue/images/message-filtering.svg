<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="338" viewBox="0 0 1584 338" role="img" aria-labelledby="title desc">
  <title id="title">Message filtering by tags</title><desc id="desc">A consumer subscribes with tags; the broker’s tag filter returns only matching messages.</desc>
  <!-- Shared diagram definitions -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}.note{fill:#fffdb5;stroke:#888;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect id="background" width="1584" height="338" fill="#fff"/>
  <!-- Broker with tagged messages -->
  <rect id="broker" class="box" x="23" y="39" width="718" height="276"/><rect class="box" x="62" y="89" width="474" height="146"/>
  <rect class="box" x="70" y="100" width="38" height="124"/><text x="82" y="129" font-size="27" text-anchor="middle">1</text><rect class="box" x="129" y="100" width="38" height="124"/><text x="141" y="129" font-size="27" text-anchor="middle">2</text><rect class="box" x="188" y="100" width="38" height="124"/><text x="200" y="129" font-size="27" text-anchor="middle">3</text><rect class="box" x="247" y="100" width="38" height="124"/><text x="259" y="129" font-size="27" text-anchor="middle">4</text><rect class="box" x="306" y="100" width="38" height="124"/><text x="318" y="129" font-size="27" text-anchor="middle">5</text><rect class="box" x="365" y="100" width="38" height="124"/><text x="377" y="129" font-size="27" text-anchor="middle">6</text><rect class="box" x="424" y="100" width="38" height="124"/><text x="436" y="129" font-size="27" text-anchor="middle">7</text><rect class="box" x="483" y="100" width="38" height="124"/><text x="495" y="129" font-size="27" text-anchor="middle">8</text>
  <g id="tags"><path d="M94 192h20v20h-20l-10-10z" fill="#ffb3b3" stroke="#888" stroke-width="2"/><path d="M153 167h20v20h-20l-10-10z" fill="#bdf7bd" stroke="#888" stroke-width="2"/><path d="M212 192h20v20h-20l-10-10z" fill="#fffdb5" stroke="#888" stroke-width="2"/><path d="M271 141h20v20h-20l-10-10z" fill="#ffb3b3" stroke="#888" stroke-width="2"/><path d="M271 166h20v20h-20l-10-10z" fill="#fffdb5" stroke="#888" stroke-width="2"/><path d="M271 191h20v20h-20l-10-10z" fill="#bdf7bd" stroke="#888" stroke-width="2"/><path d="M330 167h20v20h-20l-10-10z" fill="#fffdb5" stroke="#888" stroke-width="2"/><path d="M330 191h20v20h-20l-10-10z" fill="#bdf7bd" stroke="#888" stroke-width="2"/><path d="M389 167h20v20h-20l-10-10z" fill="#ffb3b3" stroke="#888" stroke-width="2"/><path d="M389 191h20v20h-20l-10-10z" fill="#fffdb5" stroke="#888" stroke-width="2"/><path d="M448 191h20v20h-20l-10-10z" fill="#bdf7bd" stroke="#888" stroke-width="2"/><path d="M507 167h20v20h-20l-10-10z" fill="#ffb3b3" stroke="#888" stroke-width="2"/><path d="M507 191h20v20h-20l-10-10z" fill="#fffdb5" stroke="#888" stroke-width="2"/></g>
  <rect x="595" y="89" width="116" height="146" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="653" y="153" font-size="35" text-anchor="middle"><tspan x="653">Tag</tspan><tspan x="653" dy="40">filter</tspan></text><path class="arrow" d="M536 162H593"/><text x="382" y="296" font-size="35" text-anchor="middle">Broker</text>
  <!-- Consumer subscription and fetch paths -->
  <rect id="consumer" class="box" x="1252" y="104" width="300" height="146"/><text x="1402" y="190" font-size="35" text-anchor="middle">Consumer</text>
  <path class="arrow" d="M1252 126C1050 90 905 94 742 119"/><path class="arrow" d="M711 193C920 267 1070 257 1250 218"/>
  <rect x="825" y="76" width="380" height="61" fill="#fff"/><text x="1015" y="114" font-size="35" text-anchor="middle">subscribe with tags</text><rect x="850" y="218" width="330" height="58" fill="#fff"/><text x="1015" y="256" font-size="35" text-anchor="middle">fetch messages</text>
