<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="730" viewBox="0 0 1740 730" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper-supported queue architecture</title><desc id="desc">ZooKeeper provides metadata, state, and coordination services for brokers; producers and consumer groups exchange data through the broker cluster.</desc>
  <!-- Shared diagram definitions -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}.note{fill:#fffdb5;stroke:#888;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect id="background" width="1740" height="730" fill="#fff"/>
  <!-- ZooKeeper services -->
  <rect id="zookeeper" class="box" x="390" y="36" width="956" height="243" rx="10"/><text x="868" y="75" font-size="34" text-anchor="middle">ZooKeeper</text>
  <rect x="412" y="105" width="286" height="151" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="555" y="145" font-size="34" text-anchor="middle">Metadata Storage</text><g class="box"><path d="M476 173v43c0 9 35 16 79 16s79-7 79-16v-43"/><ellipse cx="555" cy="173" rx="79" ry="13"/></g>
  <rect x="724" y="105" width="286" height="151" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="867" y="145" font-size="34" text-anchor="middle">State Storage</text><path d="M788 166h96l32 16v49H788z" fill="#fff" stroke="#888" stroke-width="2"/>
  <rect x="1037" y="105" width="286" height="151" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="1180" y="173" font-size="34" text-anchor="middle"><tspan x="1180">Coordination</tspan><tspan x="1180" dy="38">service</tspan></text>
  <!-- Broker cluster -->
  <g id="brokers"><rect class="box" x="684" y="441" width="394" height="264" rx="10"/><rect class="box" x="671" y="433" width="394" height="264" rx="10"/><rect class="box" x="658" y="425" width="394" height="264" rx="10"/><text x="676" y="468" font-size="34">Brokers</text><rect x="715" y="497" width="286" height="151" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="858" y="535" font-size="34" text-anchor="middle">Data Storage</text><rect class="box" x="738" y="552" width="240" height="82"/><rect class="msg" x="748" y="560" width="24" height="66"/><rect class="msg" x="781" y="560" width="24" height="66"/><rect class="msg" x="814" y="560" width="24" height="66"/><rect class="msg" x="847" y="560" width="24" height="66"/><rect class="msg" x="880" y="560" width="24" height="66"/><rect class="msg" x="913" y="560" width="24" height="66"/><rect class="msg" x="946" y="560" width="24" height="66"/></g>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M868 279V423"/>
  <!-- Producers and consumers -->
  <g><rect class="box" x="45" y="491" width="352" height="138" rx="10"/><rect class="box" x="57" y="499" width="352" height="138" rx="10"/><rect class="box" x="69" y="507" width="352" height="138" rx="10"/><text x="233" y="581" font-size="35" text-anchor="middle">Producers</text></g>
  <g><rect class="box" x="1317" y="491" width="352" height="138" rx="10"/><rect class="box" x="1329" y="499" width="352" height="138" rx="10"/><rect class="box" x="1341" y="507" width="352" height="138" rx="10"/><text x="1505" y="560" font-size="35" text-anchor="middle"><tspan x="1505">Consumers</tspan><tspan x="1505" dy="39">(Consumer Groups)</tspan></text></g>
  <path class="arrow" d="M421 565H656"/><path class="arrow" d="M1079 565H1315"/>
</svg>
