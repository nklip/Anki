<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1724" height="408" viewBox="0 0 1724 408" role="img" aria-labelledby="title desc">
  <title id="title">Write-ahead log segments</title>
  <desc id="desc">Records are appended to a partition log; records zero through nine form segment one and records ten onward form segment two.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
  </defs>
  <rect id="background" width="1724" height="408" fill="#fff"/>
  <!-- Partition log -->
  <text x="40" y="250" font-size="34">Topic-A Partition-1</text>
  <g id="records">
    <rect class="msg" x="343" y="168" width="76" height="144"/>
    <text x="381" y="251" font-size="34" text-anchor="middle">0</text>
    <rect class="msg" x="419" y="168" width="76" height="144"/>
    <text x="457" y="251" font-size="34" text-anchor="middle">1</text>
    <rect class="msg" x="495" y="168" width="76" height="144"/>
    <text x="533" y="251" font-size="34" text-anchor="middle">2</text>
    <rect class="msg" x="571" y="168" width="76" height="144"/>
    <text x="609" y="251" font-size="34" text-anchor="middle">3</text>
    <rect class="msg" x="647" y="168" width="76" height="144"/>
    <text x="685" y="251" font-size="34" text-anchor="middle">4</text>
    <rect class="msg" x="723" y="168" width="76" height="144"/>
    <text x="761" y="251" font-size="34" text-anchor="middle">5</text>
    <rect class="msg" x="799" y="168" width="76" height="144"/>
    <text x="837" y="251" font-size="34" text-anchor="middle">6</text>
    <rect class="msg" x="875" y="168" width="76" height="144"/>
    <text x="913" y="251" font-size="34" text-anchor="middle">7</text>
    <rect class="msg" x="951" y="168" width="76" height="144"/>
    <text x="989" y="251" font-size="34" text-anchor="middle">8</text>
    <rect class="msg" x="1027" y="168" width="76" height="144"/>
    <text x="1065" y="251" font-size="34" text-anchor="middle">9</text>
    <rect class="msg" x="1103" y="168" width="76" height="144"/>
    <text x="1141" y="251" font-size="34" text-anchor="middle">10</text>
    <rect class="msg" x="1179" y="168" width="76" height="144"/>
    <text x="1217" y="251" font-size="34" text-anchor="middle">11</text>
    <rect class="msg" x="1255" y="168" width="76" height="144"/>
    <text x="1293" y="251" font-size="34" text-anchor="middle">12</text>
    <rect class="msg" x="1331" y="168" width="76" height="144"/>
    <text x="1369" y="251" font-size="34" text-anchor="middle">13</text>
    <rect class="msg" x="1407" y="168" width="76" height="144"/>
    <text x="1445" y="251" font-size="34" text-anchor="middle">14</text>
    <rect class="msg dash" x="1483" y="168" width="76" height="144"/>
    <text x="1521" y="251" font-size="34" text-anchor="middle">15</text>
  </g>
  <!-- Append annotations -->
  <text x="383" y="77" font-size="34" text-anchor="middle">1st record</text>
  <path class="arrow" d="M383 94V166"/>
  <text x="1521" y="77" font-size="34" text-anchor="middle">Next record written</text>
  <path class="arrow" d="M1521 94V166"/>
  <!-- Segment ranges -->
  <path class="line" d="M343 329V369M1103 329V369M1677 329V369"/>
  <path class="line dash" marker-start="url(#arrow)" d="M350 349H625"/>
  <path class="line dash" marker-end="url(#arrow)" d="M825 349H1096"/>
  <path class="line dash" marker-start="url(#arrow)" d="M1110 349H1305"/>
  <path class="line dash" marker-end="url(#arrow)" d="M1505 349H1670"/>
  <rect x="640" y="327" width="169" height="44" fill="#fff"/>
  <text x="724" y="360" font-size="34" text-anchor="middle">segment-1</text>
  <rect x="1320" y="327" width="169" height="44" fill="#fff"/>
  <text x="1404" y="360" font-size="34" text-anchor="middle">segment-2</text>
</svg>
