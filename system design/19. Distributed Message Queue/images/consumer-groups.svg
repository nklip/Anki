<svg xmlns="http://www.w3.org/2000/svg" width="1308" height="612" viewBox="0 0 1308 612" role="img" aria-labelledby="title desc">
  <title id="title">Consumer groups and partitions</title><desc id="desc">Topic partitions are assigned independently to consumers in two consumer groups.</desc>
  <!-- Shared diagram definitions -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#808080;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#808080;stroke-width:2}.persist{fill:#cdfdc5;stroke:#808080;stroke-width:2}.new{fill:#fffec4;stroke:#808080;stroke-width:2}</style></defs>
  <rect id="background" width="1308" height="612" fill="#fff" />

  <!-- Source topics and partition message cells -->
  <text x="41" y="213" font-size="35">Topic-A</text><text x="184" y="165" font-size="35.5">Partition-1</text><text x="184" y="260" font-size="35.5">Partition-2</text><rect class="box" x="360" y="106.5" width="275" height="189" /><path class="line" d="M360 200 H635" /><rect class="msg" x="409" y="116.5" width="27.8" height="75" /><rect class="msg" x="521" y="116.5" width="27.8" height="75" /><rect class="msg" x="558.5" y="116.5" width="27.5" height="75" /><rect class="msg" x="371.3" y="211" width="27.5" height="74.5" /><rect class="msg" x="446.2" y="211" width="27.7" height="74.5" /><rect class="msg" x="484" y="211" width="27" height="74.5" /><rect class="msg" x="596" y="211" width="27.6" height="74.5" />
  <text x="39" y="437" font-size="35">Topic-B</text><text x="184" y="437" font-size="35.5">Partition-1</text><rect class="box" x="360.2" y="378" width="274.7" height="94.5" /><rect class="msg" x="371.7" y="388" width="27" height="75" /><rect class="msg" x="409.2" y="388" width="27.3" height="75" /><rect class="msg" x="446.5" y="388" width="27.2" height="75" /><rect class="msg" x="484.2" y="388" width="26.7" height="75" /><rect class="msg" x="521.3" y="388" width="27.3" height="75" /><rect class="msg" x="558.7" y="388" width="27" height="75" /><rect class="msg" x="596.2" y="388" width="27.2" height="75" />

  <!-- Consumer groups and member cards -->
  <rect x="918" y="33" width="357" height="264" rx="10" fill="#fff" stroke="#808080" stroke-width="2" stroke-dasharray="10 8" /><text x="1096" y="78" font-size="35.5" text-anchor="middle">Consumer group-1</text><rect class="box" x="962" y="108" width="269" height="78" rx="10" /><rect class="box" x="962" y="199" width="269" height="78" rx="10" /><text x="1097" y="159" font-size="35.5" text-anchor="middle">Consumer-1</text><text x="1097" y="251" font-size="35" text-anchor="middle">Consumer-2</text>
  <rect x="918" y="321" width="357" height="264" rx="10" fill="#fff" stroke="#808080" stroke-width="2" stroke-dasharray="10 8" /><text x="1095" y="366" font-size="35.5" text-anchor="middle">Consumer group-2</text><rect class="box" x="962" y="396" width="269" height="78" rx="10" /><rect class="box" x="962" y="487" width="269" height="78" rx="10" /><text x="1097" y="448" font-size="35" text-anchor="middle">Consumer-3</text><text x="1098" y="539" font-size="35" text-anchor="middle">Consumer-4</text>
  
  <!-- Partition assignments start at queue borders. Arrow tips stop immediately
       before the consumer-card borders, matching the PNG etalon. -->
  <path class="arrow" d="M635 150C760 149 835 134 958 139" />
  <path class="arrow" d="M635 243C760 245 835 225 958 231" />
  <path class="arrow" d="M635 166C770 179 818 373 958 439" />
