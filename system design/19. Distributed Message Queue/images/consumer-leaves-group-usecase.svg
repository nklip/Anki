<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="998" viewBox="0 0 1624 998" role="img" aria-labelledby="title desc">
  <title id="title">Consumer leaves a group</title><desc id="desc">Consumer A leaves, so Consumer B rejoins, becomes leader, and receives all four partitions.</desc>
  
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#808080;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#808080;stroke-width:2}.persist{fill:#cdfdc5;stroke:#808080;stroke-width:2}.new{fill:#fffec4;stroke:#808080;stroke-width:2}.note{fill:#fffec4;stroke:#808080;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect id="background" width="1624" height="998" fill="#fff" />
  
  <rect class="box" x="40" y="34.5" width="266.8" height="86" /><text x="175" y="91" font-size="35.5" text-anchor="middle">Consumer A</text><path class="line dash" d="M174 129V887" /><rect class="box" x="40" y="883.5" width="266.8" height="86" /><text x="175" y="940" font-size="35.5" text-anchor="middle">Consumer A</text><rect class="box" x="679" y="34.5" width="266" height="86" /><text x="813" y="91" font-size="35.5" text-anchor="middle">Coordinator</text><path class="line dash" d="M813 128V886" /><rect class="box" x="679" y="883.5" width="266" height="86" /><text x="813" y="940" font-size="35.5" text-anchor="middle">Coordinator</text><rect class="box" x="1317.2" y="34.5" width="266.8" height="86" /><text x="1451" y="91" font-size="35.5" text-anchor="middle">Consumer B</text><path class="line dash" d="M1451 128V886" /><rect class="box" x="1317.2" y="883.5" width="266.8" height="86" /><text x="1451" y="940" font-size="35.5" text-anchor="middle">Consumer B</text>
  
  <path class="line" d="M173 163 H284" /><path class="arrow" d="M698 163 H809" /><rect x="288" y="145" width="406" height="39" fill="#fff" /><text x="492" y="172" font-size="26.5" text-anchor="middle">1a. Heartbeat (I’m A in the group)</text>
  <path class="line" d="M813 214 H626" /><path class="arrow" d="M361 213 H173" /><rect x="369" y="195" width="250" height="34" fill="#fff" /><text x="495" y="222" font-size="26.5" text-anchor="middle">1b. Heartbeat acked</text>
  <path class="line" d="M1450 259 H1340" /><path class="arrow" d="M925 258 H814" /><rect x="930" y="241" width="406" height="39" fill="#fff" /><text x="1134" y="268" font-size="26.5" text-anchor="middle">1a. Heartbeat (I’m B in the group)</text>
  <path class="line" d="M811 309 H997" /><path class="arrow" d="M1262 310 H1447" /><rect x="1004" y="291" width="250" height="34" fill="#fff" /><text x="1130" y="318" font-size="26.5" text-anchor="middle">1b. Heartbeat acked</text>
  
  <path class="line" d="M173 350 H234" /><path class="arrow" d="M749 351 H808" /><rect x="233" y="329" width="520" height="44" fill="#fffec4" /><text x="490" y="360" font-size="26.5" text-anchor="middle">2a. LeaveGroup (I’m A in the group. I quit)</text>
  <path class="line" d="M813 411 H677" /><path class="arrow" d="M313 411 H173" /><rect x="317" y="393" width="357" height="39" fill="#fff" /><text x="496" y="420" font-size="26.5" text-anchor="middle">2b. LeaveGroup (goodbye A)</text>
  <path class="line" d="M1451 453 H1341" /><path class="arrow" d="M926 452 H815" /><rect x="930" y="435" width="406" height="39" fill="#fff" /><text x="1134" y="462" font-size="26.5" text-anchor="middle">3a. Heartbeat (I’m B in the group)</text>
  <path class="line" d="M814 521 H902" /><path class="arrow" d="M1360 523 H1450" /><rect x="904.5" y="483.5" width="455" height="79" fill="#fffec4" /><text x="1133" y="516" font-size="26.5" text-anchor="middle"><tspan x="1133">3b. Heartbeat (Sorry B, group needs</tspan><tspan x="1133" dy="31">to rebalance. Please rejoin)</tspan></text>
  
  <path class="line" d="M1452 608 H1354" /><path class="arrow" d="M915 607 H816" /><rect x="920" y="590" width="427" height="39" fill="#fff" /><text x="1134" y="617" font-size="26.5" text-anchor="middle">4a. JoinGroup (I’m B. I want to join)</text>
  <path class="line" d="M811 668 H846" /><path class="arrow" d="M1417 669 H1448" /><rect x="855" y="635" width="552" height="70" fill="#fff" /><text x="1131" y="662" font-size="26.5" text-anchor="middle"><tspan x="1131">4b. JoinGroup (B joins the group successfully.</tspan><tspan x="1131" dy="31">You are the leader. Group members: B)</tspan></text>
  <path class="line" d="M1451 766 H1368" /><path class="arrow" d="M896 764 H814" /><rect x="902" y="747" width="459" height="39" fill="#fff" /><text x="1132" y="774" font-size="26.5" text-anchor="middle">5. SyncGroup (partition dispatch plan)</text>
  <path class="line" d="M812 824 H953" /><path class="arrow" d="M1306 825 H1448" /><rect x="959" y="791" width="340" height="70" fill="#fff" /><text x="1130" y="818" font-size="26.5" text-anchor="middle"><tspan x="1130">6. SyncGroup (B should</tspan><tspan x="1130" dy="31">consume partition 1, 2, 3, 4)</tspan></text>
</svg>