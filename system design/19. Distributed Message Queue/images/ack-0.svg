<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="792" viewBox="0 0 1430 792" role="img" aria-labelledby="title desc">
  <title id="title">Producer acknowledgement mode zero</title>
  <desc id="desc">The producer acknowledgement mode is shown with a leader, an in-sync follower, and a follower that is not caught up.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" />
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#808080;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#808080;stroke-width:2}.persist{fill:#cdfdc5;stroke:#808080;stroke-width:2}.new{fill:#fffec4;stroke:#808080;stroke-width:2}</style>
  </defs>
  <rect id="background" width="1430" height="792" fill="#fff" />

  <!-- Producer sends without waiting for an acknowledgement. -->
  <rect id="producer" class="box" x="570.2" y="26.5" width="285.2" height="138" />
  <text x="714" y="107" font-size="31.5" text-anchor="middle">Producer</text>
  <path class="line" d="M703 163C699 212 697 234 698 239" />
  <text x="697" y="279" font-size="32" text-anchor="middle">
    <tspan x="697">1. produce</tspan>
    <tspan x="697" dy="35">without ack</tspan>
  </text>

  <!-- Replicas and their current log contents -->
  <g id="broker-1">
    <rect class="box" x="34" y="473" width="405.8" height="192.5" />
    <text x="227" y="538" font-size="32" text-anchor="end">
      <tspan x="227">replica-1</tspan>
      <tspan x="227" dy="37">follower</tspan>
    </text>
    <rect class="box" x="236" y="502.5" width="173.8" height="84.5" />
    <rect class="msg" x="243.2" y="511.5" width="17.8" height="67" />
    <rect class="msg" x="267.2" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="290.5" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="314.2" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="338" y="511.5" width="17" height="67" />
    <text x="238" y="650" font-size="31.5" text-anchor="middle">Broker-1</text>
  </g>
  <g id="broker-2">
    <rect class="box" x="510" y="473" width="405.8" height="192.5" />
    <text x="688" y="538" font-size="32" text-anchor="end">
      <tspan x="688">replica-2</tspan>
      <tspan x="688" dy="37">leader</tspan>
    </text>
    <rect x="697.2" y="502.5" width="173.7" height="84.5" fill="#cdfdc5" stroke="#808080" stroke-width="2" />
    <rect class="msg" x="704.5" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="728.2" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="752" y="511.5" width="17" height="67" />
    <rect class="msg" x="775.2" y="511.5" width="17.8" height="67" />
    <rect class="msg" x="799.2" y="511.5" width="17.5" height="67" />
    <rect class="msg dash" x="823" y="511" width="18" height="67" />
    <rect class="msg dash" x="847" y="511" width="18" height="67" />
    <text x="714" y="650" font-size="31.5" text-anchor="middle">Broker-2</text>
  </g>
  <g id="broker-3">
    <rect class="box" x="986" y="473.5" width="406" height="192" />
    <text x="1164" y="538" font-size="32" text-anchor="end">
      <tspan x="1164">replica-3</tspan>
      <tspan x="1164" dy="37">follower</tspan>
    </text>
    <rect class="box" x="1173.2" y="502.5" width="173.7" height="84.5" />
    <rect class="msg" x="1180.5" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="1204.2" y="511.5" width="17.5" height="67" />
    <rect class="msg" x="1228" y="511.5" width="17" height="67" />
    <text x="1190" y="650" font-size="31.5" text-anchor="middle">Broker-3</text>
    <text x="1284" y="454" font-size="32" text-anchor="middle">not caught up</text>
  </g>
  <!-- Connectors are painted above the broker panels so their full routes remain visible. -->
  <path class="arrow" d="M700 331C704 394 720 452 749 501" />
  <path class="line" d="M732 502.5C699.7 476.7 657.8 455 611 444.5" />
  <path class="arrow" d="M493 444.3C453.4 453.4 413 472.3 374 504" />
  <path class="line dash" d="M385 584C434 612 468 622 482 623" />
  <path class="arrow dash" d="M600 627C636 620 677 606 713 588" />
  <text x="541" y="447" font-size="31.5" text-anchor="middle">fetch</text>
  <text x="539" y="639" font-size="31.5" text-anchor="middle">synced</text>

  <!-- In-sync replica set and acknowledgement mode summary -->
  <text x="41" y="747" font-size="31.5">ISR: {replica-1, replica-2}, ack=0</text>
</svg>
