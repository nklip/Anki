<svg xmlns="http://www.w3.org/2000/svg" width="1716" height="794" viewBox="0 0 1716 794" role="img" aria-labelledby="title desc">
  <title id="title">Distributed message queue architecture</title><desc id="desc">Producers send messages to brokers, consumers read from brokers, and metadata plus coordination services manage the broker cluster.</desc>
  <!-- Shared diagram definitions -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}.note{fill:#fffdb5;stroke:#888;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect id="background" width="1716" height="794" fill="#fff"/>
  <!-- Producers and consumers -->
  <g id="producers"><rect class="box" x="35" y="463" width="352" height="138" rx="10"/><rect class="box" x="47" y="471" width="352" height="138" rx="10"/><rect class="box" x="59" y="479" width="352" height="138" rx="10"/><text x="223" y="551" font-size="35" text-anchor="middle">Producers</text></g>
  <g id="consumers"><rect class="box" x="1308" y="463" width="352" height="138" rx="10"/><rect class="box" x="1320" y="471" width="352" height="138" rx="10"/><rect class="box" x="1332" y="479" width="352" height="138" rx="10"/><text x="1496" y="532" font-size="35" text-anchor="middle"><tspan x="1496">Consumers</tspan><tspan x="1496" dy="39">(Consumer groups)</tspan></text></g>
  <!-- Broker cluster -->
  <g id="brokers"><rect class="box" x="675" y="330" width="394" height="444" rx="10"/><rect class="box" x="662" y="316" width="394" height="444" rx="10"/><rect class="box" x="648" y="301" width="394" height="444" rx="10"/><text x="667" y="350" font-size="34">Brokers</text><rect x="705" y="372" width="286" height="152" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="848" y="410" font-size="34" text-anchor="middle">Data storage</text><rect class="box" x="728" y="427" width="240" height="82"/><rect class="msg" x="738" y="435" width="24" height="66"/><rect class="msg" x="771" y="435" width="24" height="66"/><rect class="msg" x="804" y="435" width="24" height="66"/><rect class="msg" x="837" y="435" width="24" height="66"/><rect class="msg" x="870" y="435" width="24" height="66"/><rect class="msg" x="903" y="435" width="24" height="66"/><rect class="msg" x="936" y="435" width="24" height="66"/>
  <rect x="705" y="560" width="286" height="152" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="848" y="598" font-size="34" text-anchor="middle">State storage</text><path d="M768 622h96l32 16v50H768z" fill="#fff" stroke="#888" stroke-width="2"/></g>
  <path class="arrow" d="M411 537H646"/><path class="arrow" d="M1070 537H1306"/>
  <!-- Metadata and coordination services -->
  <rect x="716" y="37" width="286" height="151" rx="10" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="10 8"/><text x="859" y="76" font-size="34" text-anchor="middle">Metadata storage</text><g class="box"><path d="M780 108v43c0 9 35 16 79 16s79-7 79-16v-43"/><ellipse cx="859" cy="108" rx="79" ry="13"/></g>
  <rect class="box" x="1094" y="37" width="287" height="151" rx="10"/><text x="1237" y="106" font-size="34" text-anchor="middle"><tspan x="1237">Coordination</tspan><tspan x="1237" dy="39">service</tspan></text>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M859 188V299"/><path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M967 299 1092 169"/>
</svg>
