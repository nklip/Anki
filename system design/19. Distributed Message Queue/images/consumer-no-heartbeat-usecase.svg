<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="992" viewBox="0 0 1618 992" role="img" aria-labelledby="title desc">
  <title id="title">Consumer heartbeat timeout</title><desc id="desc">When Consumer A stops sending heartbeats, the coordinator removes it and rebalances all partitions to Consumer B.</desc>
  
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#808080;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#808080;stroke-width:2}.persist{fill:#cdfdc5;stroke:#808080;stroke-width:2}.new{fill:#fffec4;stroke:#808080;stroke-width:2}.note{fill:#fffec4;stroke:#808080;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect id="background" width="1618" height="992" fill="#fff" />
  
  <rect class="box" x="42" y="30.5" width="266.8" height="86" /><text x="177" y="87" font-size="35.5" text-anchor="middle">Consumer A</text><path class="line dash" d="M176 128V880" /><rect class="box" x="42" y="879.5" width="266.8" height="86" /><text x="177" y="936" font-size="35.5" text-anchor="middle">Consumer A</text><rect class="box" x="681" y="30.5" width="266" height="86" /><text x="815" y="87" font-size="35.5" text-anchor="middle">Coordinator</text><path class="line dash" d="M815 127V879" /><rect class="box" x="681" y="879.5" width="266" height="86" /><text x="815" y="936" font-size="35.5" text-anchor="middle">Coordinator</text><rect class="box" x="1319.2" y="30.5" width="266.8" height="86" /><text x="1453" y="87" font-size="35.5" text-anchor="middle">Consumer B</text><path class="line dash" d="M1453 128V880" /><rect class="box" x="1319.2" y="879.5" width="266.8" height="86" /><text x="1453" y="936" font-size="35.5" text-anchor="middle">Consumer B</text>
  
  <path class="line" d="M175 159 H286" /><path class="arrow" d="M700 159 H811" /><rect x="290" y="141" width="406" height="39" fill="#fff" /><text x="494" y="168" font-size="26.5" text-anchor="middle">1a. Heartbeat (I’m A in the group)</text>
  <path class="line" d="M815 210 H628" /><path class="arrow" d="M363 209 H175" /><rect x="371" y="192" width="250" height="34" fill="#fff" /><text x="497" y="219" font-size="26.5" text-anchor="middle">1b. Heartbeat acked</text>
  <path class="line" d="M1452 256 H1342" /><path class="arrow" d="M927 255 H816" /><rect x="932" y="238" width="406" height="39" fill="#fff" /><text x="1136" y="265" font-size="26.5" text-anchor="middle">1a. Heartbeat (I’m B in the group)</text>
  <path class="line" d="M813 314 H999" /><path class="arrow" d="M1264 315 H1447" /><rect x="1006" y="297" width="250" height="34" fill="#fff" /><text x="1132" y="324" font-size="26.5" text-anchor="middle">1b. Heartbeat acked</text>
  
  <rect class="note" x="212" y="251" width="570" height="170" rx="10" /><text x="496" y="310" font-size="31" text-anchor="middle"><tspan x="496">2. No heartbeat from consumer A.</tspan><tspan x="496" dy="37">Consumer A seems</tspan><tspan x="496" dy="37">to be lost. Need to rebalance</tspan></text>
  
  <path class="line" d="M1454 447 H1343" /><path class="arrow" d="M928 446 H816" /><rect x="932" y="429" width="406" height="39" fill="#fff" /><text x="1136" y="456" font-size="26.5" text-anchor="middle">3a. Heartbeat (I’m B in the group)</text>
  <path class="line" d="M816 517 H904" /><path class="arrow" d="M1362 519 H1452" /><rect x="906.5" y="479.5" width="455" height="79" fill="#fffec4" /><text x="1135" y="512" font-size="26.5" text-anchor="middle"><tspan x="1135">3b. Heartbeat (Sorry B, group needs</tspan><tspan x="1135" dy="31">to rebalance. Please rejoin)</tspan></text>
  <path class="line" d="M1454 604 H1394" /><path class="arrow" d="M879 603 H818" /><rect x="884" y="586" width="503" height="39" fill="#fff" /><text x="1136" y="613" font-size="26.5" text-anchor="middle">4a. JoinGroup (I’m B. I want to join group)</text>
  <path class="line" d="M813 664 H848" /><path class="arrow" d="M1419 665 H1450" /><rect x="857" y="631" width="552" height="70" fill="#fff" /><text x="1133" y="658" font-size="26.5" text-anchor="middle"><tspan x="1133">4b. JoinGroup (B joins the group successfully.</tspan><tspan x="1133" dy="31">You are the leader. Group members: B)</tspan></text>
  <path class="line" d="M1453 762 H1370" /><path class="arrow" d="M898 760 H816" /><rect x="904" y="743" width="459" height="39" fill="#fff" /><text x="1134" y="770" font-size="26.5" text-anchor="middle">5. SyncGroup (partition dispatch plan)</text>
  <path class="line" d="M814 820 H955" /><path class="arrow" d="M1308 821 H1450" /><rect x="961" y="787" width="340" height="70" fill="#fff" /><text x="1132" y="814" font-size="26.5" text-anchor="middle"><tspan x="1132">6. SyncGroup (B should</tspan><tspan x="1132" dy="31">consume partition 1, 2, 3, 4)</tspan></text>
</svg>