<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1718" height="488" viewBox="0 0 1718 488" role="img" aria-labelledby="title desc">
  <title id="title">Consumer offsets example</title>
  <desc id="desc">Two consumers have independently consumed offsets through 6 and 13 in the same partition.</desc>
  <!-- Shared diagram definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#000}.box{fill:#fff;stroke:#888;stroke-width:2}.line{fill:none;stroke:#000;stroke-width:2}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}.msg{fill:#fff;stroke:#888;stroke-width:2}.persist{fill:#bdf7bd;stroke:#888;stroke-width:2}.new{fill:#fffdb5;stroke:#888;stroke-width:2}</style>
  </defs>
  <rect id="background" width="1718" height="488" fill="#fff"/>
  <!-- Shared partition log -->
  <g>
    <rect class="msg" x="39" y="179" width="71" height="134"/>
    <text x="74" y="259" font-size="32" text-anchor="middle">0</text>
    <rect class="msg" x="110" y="179" width="71" height="134"/>
    <text x="145" y="259" font-size="32" text-anchor="middle">1</text>
    <rect class="msg" x="181" y="179" width="71" height="134"/>
    <text x="216" y="259" font-size="32" text-anchor="middle">2</text>
    <rect class="msg" x="252" y="179" width="71" height="134"/>
    <text x="287" y="259" font-size="32" text-anchor="middle">3</text>
    <rect class="msg" x="323" y="179" width="71" height="134"/>
    <text x="358" y="259" font-size="32" text-anchor="middle">4</text>
    <rect class="msg" x="394" y="179" width="71" height="134"/>
    <text x="429" y="259" font-size="32" text-anchor="middle">5</text>
    <rect class="msg" x="465" y="179" width="71" height="134"/>
    <text x="500" y="259" font-size="32" text-anchor="middle">6</text>
    <rect class="msg" x="536" y="179" width="71" height="134"/>
    <text x="571" y="259" font-size="32" text-anchor="middle">7</text>
    <rect class="msg" x="607" y="179" width="71" height="134"/>
    <text x="642" y="259" font-size="32" text-anchor="middle">8</text>
    <rect class="msg" x="678" y="179" width="71" height="134"/>
    <text x="713" y="259" font-size="32" text-anchor="middle">9</text>
    <rect class="msg" x="749" y="179" width="71" height="134"/>
    <text x="784" y="259" font-size="32" text-anchor="middle">10</text>
    <rect class="msg" x="820" y="179" width="71" height="134"/>
    <text x="855" y="259" font-size="32" text-anchor="middle">11</text>
    <rect class="msg" x="891" y="179" width="71" height="134"/>
    <text x="926" y="259" font-size="32" text-anchor="middle">12</text>
    <rect class="msg" x="962" y="179" width="71" height="134"/>
    <text x="997" y="259" font-size="32" text-anchor="middle">13</text>
    <rect class="msg" x="1033" y="179" width="71" height="134"/>
    <text x="1068" y="259" font-size="32" text-anchor="middle">14</text>
    <rect class="msg dash" x="1104" y="179" width="71" height="134"/>
    <text x="1139" y="259" font-size="32" text-anchor="middle">15</text>
  </g>
  <!-- Consumer 1 range and connection -->
  <path class="line dash" marker-start="url(#arrow)" d="M45 147H100"/>
  <path class="line dash" marker-end="url(#arrow)" d="M450 147H499"/>
  <text x="114" y="158" font-size="31">Consumer 1 consumed</text>
  <path class="arrow" d="M1447 105H500V177"/>
  <text x="1195" y="48" font-size="31" text-anchor="middle">
    <tspan x="1195">consumer 1:</tspan>
    <tspan x="1195" dy="35">last consumed offset = 6</tspan>
  </text>
  <rect id="consumer-1" class="box" x="1447" y="50" width="236" height="111" rx="9"/>
  <text x="1565" y="118" font-size="31" text-anchor="middle">Consumer 1</text>
  <!-- Consumer 2 range and connection -->
  <path class="line dash" marker-start="url(#arrow)" d="M45 348H330"/>
  <path class="line dash" marker-end="url(#arrow)" d="M735 348H995"/>
  <text x="356" y="359" font-size="31">Consumer 2 consumed</text>
  <path class="arrow" d="M1447 376H995V315"/>
  <text x="1195" y="421" font-size="31" text-anchor="middle">
    <tspan x="1195">consumer 2:</tspan>
    <tspan x="1195" dy="35">last consumed offset = 13</tspan>
  </text>
  <rect id="consumer-2" class="box" x="1447" y="320" width="236" height="111" rx="9"/>
  <text x="1565" y="388" font-size="31" text-anchor="middle">Consumer 2</text>
</svg>
