<svg xmlns="http://www.w3.org/2000/svg" width="528" height="658" viewBox="0 0 528 658" role="img" aria-labelledby="title desc">
  <title id="title">Video streaming flow</title>
  <desc id="desc">A client streams video from a content delivery network.</desc>
  <!-- Shared client-device and CDN symbols. -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13Z" fill="#287ead"/></marker>
    <symbol id="devices" viewBox="0 0 330 95">
      <g fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round">
        <path d="M8 17Q8 8 17 8H92Q101 8 101 17V68H8Z"/><path d="M2 72H107L99 82H10Z" fill="#111"/><path d="M42 74H67" stroke="#fff" stroke-width="3"/>
        <rect x="135" y="3" width="52" height="82" rx="6"/><path d="M135 17H187M135 72H187"/><circle cx="161" cy="78" r="2" fill="#111" stroke="none"/>
        <path d="M232 10Q239 3 250 3H293Q304 3 311 10L316 63Q316 78 301 85H242Q227 78 227 63Z"/><path d="M232 62Q272 70 312 62"/>
      </g><text x="271" y="48" font-family="Arial,Helvetica,sans-serif" font-size="34" text-anchor="middle">TV</text>
    </symbol>
    <symbol id="cdn" viewBox="0 0 230 155"><path d="M45 132C18 132 4 113 7 93C9 75 23 63 42 62C45 38 63 26 84 30C97 9 121 7 137 22C153 9 178 17 184 38C205 39 222 56 222 78C222 108 201 132 173 132Z" fill="#75d6ef"/><path d="M113 22L88 78H119L101 130L157 63H129L148 22Z" fill="#fff"/></symbol>
    <style>.label{font:36px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}</style>
  </defs>
  <rect width="528" height="658" fill="#fff"/>
  <!-- Client and its devices. -->
  <rect x="36" y="16" width="447" height="157" rx="28" fill="#fff" stroke="#42bbd2" stroke-width="5"/>
  <text x="50" y="69" font-family="Arial,Helvetica,sans-serif" font-size="38">Client</text>
  <use href="#devices" x="112" y="70" width="310" height="89"/>
  <!-- Downstream video request; text is offset to the right of the line. -->
  <path d="M259 174V430" fill="none" stroke="#287ead" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="266" y="314" font-family="Arial,Helvetica,sans-serif" font-size="34">streaming video</text>
  <!-- Content delivery network. -->
  <rect x="138" y="429" width="244" height="205" rx="35" fill="#fff" stroke="#42bbd2" stroke-width="5" stroke-dasharray="17 13"/>
  <use href="#cdn" x="151" y="442" width="218" height="147"/>
  <text class="label" x="260" y="620">CDN</text>
</svg>
