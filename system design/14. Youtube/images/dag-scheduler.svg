<svg xmlns="http://www.w3.org/2000/svg" width="1356" height="802" viewBox="0 0 1356 802" role="img" aria-labelledby="title desc">
  <title id="title">DAG scheduler stages</title>
  <desc id="desc">The original video is split into video, audio, and metadata in stage one; video and audio jobs continue into stage-two encoding and thumbnail tasks.</desc>
  <!-- Staged task boxes and straight blue DAG connectors. -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#2e7ca8"/></marker>
    <style>.task{fill:#fff;stroke:#42bbd2;stroke-width:4}.flow{fill:none;stroke:#2e7ca8;stroke-width:2;marker-end:url(#arrow)}.t{font:27px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}</style>
  </defs>
  <rect width="1356" height="802" fill="#fff"/>
  <!-- Scheduler boundary and stage separators. -->
  <rect x="14" y="7" width="1331" height="786" rx="111" fill="#fff" stroke="#42bbd2" stroke-width="4"/>
  <text x="53" y="93" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700">DAG scheduler</text>
  <text class="t" x="731" y="73" font-size="30">Stage 1</text><text class="t" x="1161" y="73" font-size="30">Stage 2</text>
  <path d="M525 108V757M941 108V757M1294 108V757" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Stage-one tasks. -->
  <rect class="task" x="50" y="500" width="136" height="77" rx="13"/><text class="t" x="118" y="533">Original</text><text class="t" x="118" y="566">video</text>
  <rect class="task" x="663" y="320" width="136" height="79" rx="13"/><text class="t" x="731" y="369">Video</text>
  <rect class="task" x="663" y="498" width="136" height="78" rx="13"/><text class="t" x="731" y="546">Audio</text>
  <rect class="task" x="663" y="673" width="136" height="79" rx="13"/><text class="t" x="731" y="722">Metadata</text>
  <!-- Stage-two tasks. -->
  <rect class="task" x="1076" y="140" width="169" height="82" rx="13"/><text class="t" x="1160.5" y="173">Video</text><text class="t" x="1160.5" y="206">encoding</text>
  <rect class="task" x="1078" y="315" width="171" height="83" rx="13"/><text class="t" x="1163.5" y="365">Thumbnail</text>
  <rect class="task" x="1076" y="497" width="169" height="81" rx="13"/><text class="t" x="1160.5" y="530">Audio</text><text class="t" x="1160.5" y="563">encoding</text>
  <!-- Original-video fan-out and stage-two dependencies. -->
  <path class="flow" d="M186 538H663"/>
  <path class="flow" d="M380 538V359H663"/>
  <path class="flow" d="M380 538V712H663"/>
  <path class="flow" d="M799 359L1076 181"/>
  <path class="flow" d="M799 359L1078 356"/>
  <path class="flow" d="M799 537H1076"/>
</svg>
