<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="1113.063" viewBox="0 0 662 602" role="img" aria-labelledby="title desc">
  <title id="title">Video encodings at different resolutions</title>
  <desc id="desc">Video encodings branch into five MP4 files: 360p.mp4, 480p.mp4, 720p.mp4, 1080p.mp4, and 4k.mp4.</desc>
  <!-- Retain the original layout coordinates; the viewport uniformly enlarges the artwork
       to the same 1224 px native width as message-queue1.svg. -->
  <defs>
    <!-- Every symmetric head is 14 x 14; the tip projects 2 units beyond its shaft.
         Endpoints are inset so the visible tips meet the outside of the box strokes. -->
    <marker id="encoding-arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L14 7L0 14Z" fill="#2c68a0"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#35b1d5;stroke-width:3}
      .label{font:22px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}
      .connector,.branch{fill:none;stroke:#2c68a0;stroke-width:1.5}
      .branch{marker-end:url(#encoding-arrow)}
    </style>
  </defs>
  <rect width="662" height="602" fill="#fff"/>
  <!-- Source and resolution boxes retain the reference's positions and rounded corners. -->
  <rect id="encoding-source" class="box" x="21.5" y="272.5" width="161" height="75" rx="11"/>
  <rect id="encoding-360p" class="box" x="420" y="11.5" width="218.5" height="75" rx="11"/>
  <rect id="encoding-480p" class="box" x="417" y="142" width="218.5" height="75" rx="11"/>
  <rect id="encoding-720p" class="box" x="418.5" y="272.5" width="218.5" height="75" rx="11"/>
  <rect id="encoding-1080p" class="box" x="420" y="403" width="218.5" height="75" rx="11"/>
  <rect id="encoding-4k" class="box" x="420" y="519" width="218.5" height="75" rx="11"/>
  <!-- A single vertical trunk intentionally joins all five horizontal branches. -->
  <path id="encoding-trunk" class="connector" d="M267.5 49V556.5"/>
  <path id="source-connector" class="connector" d="M184 310.5H267.5"/>
  <path id="flow-360p" class="branch" d="M267.5 49H416.5"/>
  <path id="flow-480p" class="branch" d="M267.5 184.5H413.5"/>
  <path id="flow-720p" class="branch" d="M267.5 310.5H415"/>
  <path id="flow-1080p" class="branch" d="M267.5 439.5H416.5"/>
  <path id="flow-4k" class="branch" d="M267.5 556.5H416.5"/>
  <!-- Real, editable text stays above connector geometry. -->
  <text class="label" x="102" y="304">Video<tspan x="102" dy="26">encodings</tspan></text>
  <text class="label" x="528.5" y="58.5">360p.mp4</text>
  <text class="label" x="526.5" y="189">480p.mp4</text>
  <text class="label" x="527.5" y="319.5">720p.mp4</text>
  <text class="label" x="528.5" y="450">1080p.mp4</text>
  <text class="label" x="528.5" y="566">4k.mp4</text>
</svg>
