<svg xmlns="http://www.w3.org/2000/svg" width="960" height="326" viewBox="0 0 960 326" role="img" aria-labelledby="title desc">
  <title id="title">Encoded-video delivery queue</title>
  <desc id="desc">An upload module sends work through a message queue to encoded storage, which uploads encoded videos to the CDN.</desc>
  <!-- Reusable infrastructure symbols. -->
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" viewBox="0 0 11 11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2e7ca8"/></marker>
    <symbol id="queue" viewBox="0 0 200 65"><path d="M3 3H181L197 32.5L181 62H3Z" fill="#fff" stroke="#3183b5" stroke-width="5" stroke-linejoin="round"/><g fill="none" stroke="#3183b5" stroke-width="5"><rect x="13" y="14" width="48" height="35"/><path d="M14 15L37 35L60 15"/><rect x="69" y="14" width="48" height="35"/><path d="M70 15L93 35L116 15"/><rect x="125" y="14" width="48" height="35"/><path d="M126 15L149 35L172 15"/></g></symbol>
    <symbol id="servers" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#d87300"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#d87300"/><g fill="#d87300"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="bucket" viewBox="0 0 120 95"><path d="M25 19Q60 5 95 19L88 74Q60 91 32 74Z" fill="#fff" stroke="#2f8a24" stroke-width="4"/><ellipse cx="60" cy="19" rx="35" ry="12" fill="#fff" stroke="#2f8a24" stroke-width="4"/><path d="M42 40L33 57H51ZM60 45A8 8 0 1 0 60 61A8 8 0 1 0 60 45ZM44 63V78H58V63ZM73 35L99 48M78 30L92 44" fill="none" stroke="#2f8a24" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="cdn" viewBox="0 0 160 110"><path d="M31 92C12 92 3 79 5 65C6 52 16 44 29 43C31 27 44 18 59 21C68 6 85 5 96 15C107 6 124 12 128 27C143 27 155 39 155 55C155 76 140 92 121 92Z" fill="#75d6ef"/><path d="M79 15L62 54H83L70 91L109 45H90L103 15Z" fill="#fff"/></symbol>
    <style>.flow{fill:none;stroke:#2e7ca8;stroke-width:1.8;marker-end:url(#arrow)}.group{fill:#fff;stroke:#42bbd2;stroke-width:3.5;stroke-dasharray:11 8}.t{font:22px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}</style>
  </defs>
  <rect width="960" height="326" fill="#fff"/>
  <!-- Upload module, queue, and encoded storage. -->
  <rect class="group" x="4" y="151" width="165" height="162" rx="25"/><use href="#servers" x="21" y="164" width="130" height="90"/><text class="t" x="86" y="275">Upload</text><text class="t" x="86" y="300">module</text>
  <use href="#queue" x="214" y="0" width="197" height="64"/><text class="t" x="312" y="85">Message queue</text>
  <rect x="393" y="144" width="178" height="167" rx="25" fill="#fff" stroke="#42bbd2" stroke-width="3.5"/><use href="#bucket" x="422" y="151" width="120" height="95"/><text class="t" x="482" y="267">Encoded</text><text class="t" x="482" y="292">storage</text>
  <!-- Queue path and final CDN upload. -->
  <path class="flow" d="M86 151V20H214"/><path class="flow" d="M296 96V220H393"/>
  <path class="flow" d="M571 230H792"/><text class="t" x="683" y="189">upload</text><text class="t" x="683" y="214">encoded videos</text>
  <rect class="group" x="792" y="166" width="153" height="129" rx="22"/><use href="#cdn" x="803" y="174" width="132" height="91"/><text class="t" x="868" y="286">CDN</text>
</svg>
