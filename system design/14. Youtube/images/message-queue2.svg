<svg xmlns="http://www.w3.org/2000/svg" width="1136.667" height="366.667" viewBox="0 0 620 200" role="img" aria-labelledby="title desc">
  <title id="title">Encoded-video delivery queue</title>
  <desc id="desc">Incoming encoded videos reach an upload module. The module passes work through a message queue to encoded storage, which uploads encoded videos to a content delivery network.</desc>
  <!-- Retain the original layout coordinates; the viewport enlarges all artwork by 11/6
       so 12-unit labels render at 22 px, matching message-queue1.svg's native scale. -->
  <defs>
    <!-- Four equal symmetric heads project 1.5 units beyond their shaft endpoints.
         The endpoints compensate for that projection and the target's border thickness. -->
    <marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#2e6d9f"/>
    </marker>
    <symbol id="queue" viewBox="0 0 110 36">
      <g fill="#fff" stroke="#2e78ac" stroke-width="2.2" stroke-linejoin="round">
        <path d="M2 2H98L107 18L98 34H2Z"/>
        <rect x="7" y="8" width="25" height="19"/>
        <rect x="38" y="8" width="25" height="19"/>
        <rect x="69" y="8" width="25" height="19"/>
        <path d="M7 8L19.5 20L32 8M38 8L50.5 20L63 8M69 8L81.5 20L94 8" fill="none"/>
      </g>
    </symbol>
    <symbol id="server-racks" viewBox="0 0 78 56">
      <g fill="currentColor">
        <rect x="14" y="1" width="24" height="13" rx="1"/>
        <rect x="40" y="1" width="24" height="13" rx="1"/>
        <rect x="1" y="16" width="24" height="38" rx="1"/>
        <rect x="27" y="16" width="24" height="38" rx="1"/>
        <rect x="53" y="16" width="24" height="38" rx="1"/>
      </g>
      <path d="M18 6H34M44 6H60M5 22H21M31 22H47M57 22H73M5 44H21M5 49H21M31 44H47M31 49H47M57 44H73M57 49H73" fill="none" stroke="#fff" stroke-width="1.5"/>
    </symbol>
    <symbol id="storage-bucket" viewBox="0 0 56 58">
      <g fill="#fff" stroke="#287316" stroke-width="2" stroke-linejoin="round">
        <path d="M3 9L8.5 48Q26 56 44 48L50 9Z"/>
        <ellipse cx="26.5" cy="9" rx="23.5" ry="7.5"/>
        <path d="M12 32L17 22L23 32Z"/>
        <rect x="15" y="38" width="9" height="9"/>
        <circle cx="35" cy="37" r="5.5"/>
        <path d="M26 22Q45 31 52 31Q56 30 46 25" fill="none"/>
        <circle cx="25" cy="21" r="1.7"/>
      </g>
    </symbol>
    <symbol id="cdn-cloud" viewBox="0 0 90 58">
      <path d="M16 55C5 55 0 48 1 39C2 30 8 23 16 22C9 5 29 0 39 10C43 4 48 1 53 1C70 -1 78 12 77 23C88 26 94 40 87 49C83 56 76 55 69 55Z" fill="#7eddfd"/>
      <path d="M53 0L43 29H55L44 48L73 14H62L70 0Z" fill="#fff"/>
    </symbol>
    <style>
      .group,.box{fill:#fff;stroke:#35b2d7;stroke-width:1.6}
      .group{stroke-dasharray:5 5}
      .flow{fill:none;stroke:#2e6d9f;stroke-width:1;marker-end:url(#arrow)}
      .label,.caption{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#171717;text-anchor:middle}
      .queue-label{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#171717;text-anchor:middle}
    </style>
  </defs>
  <rect width="620" height="200" fill="#fff"/>
  <!-- Upload workers, message queue, encoded storage, and CDN retain the PNG layout. -->
  <rect id="upload-module" class="group" x="82.3" y="101.5" width="89" height="89" rx="13.5"/>
  <use href="#server-racks" x="93.8" y="106.8" width="62.2" height="44.65" style="color:#cc6502"/>
  <use id="message-queue" href="#queue" x="197.5" y="11.5" width="110" height="36"/>
  <rect id="encoded-storage" class="box" x="296" y="97.5" width="98.2" height="90.8" rx="13"/>
  <use href="#storage-bucket" x="321.8" y="103.7" width="44.8" height="46.4"/>
  <rect id="cdn" class="group" x="517.8" y="109" width="83.2" height="70.5" rx="11"/>
  <use href="#cdn-cloud" x="522.5" y="117.2" width="72" height="46.4"/>
  <!-- The left input is part of the reference; all turns stay orthogonal. -->
  <path id="incoming-upload-flow" class="flow" d="M19.8 61.5V138.2H80"/>
  <path id="upload-to-queue-flow" class="flow" d="M126.8 100.7V28H196.9"/>
  <!-- Start below the queue caption so the shaft cannot cross its descenders. -->
  <path id="queue-to-storage-flow" class="flow" d="M242.5 70V138.2H293.7"/>
  <path id="storage-to-cdn-flow" class="flow" d="M395 144H515.5"/>
  <!-- Editable labels; transfer text has visible clearance above the arrow. -->
  <text class="label" x="124.5" y="167.5">Upload<tspan x="124.5" dy="14.5">module</tspan></text>
  <text class="queue-label" x="247" y="63">Message queue</text>
  <text class="label" x="345" y="164.5">Encoded<tspan x="345" dy="14.5">storage</tspan></text>
  <text class="label" x="559" y="175">CDN</text>
  <text class="caption" x="454" y="124">upload<tspan x="454" dy="14">encoded videos</tspan></text>
</svg>
