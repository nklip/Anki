<svg xmlns="http://www.w3.org/2000/svg" width="622" height="640" viewBox="0 0 622 640" role="img" aria-labelledby="title desc">
  <title id="title">Task worker pool</title>
  <desc id="desc">A task worker group contains workers for watermarking, encoding, thumbnail generation, and merging.</desc>
  <!-- Reusable server rack and consistent text styles. -->
  <defs>
    <symbol id="servers" viewBox="0 0 130 90">
      <rect x="33" y="3" width="34" height="19" rx="2" fill="#80c342"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#80c342"/>
      <g fill="#80c342"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g>
      <path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/>
    </symbol>
    <style>.worker{fill:#fff;stroke:#42bbd2;stroke-width:3}.label{font:35px Arial,Helvetica,sans-serif;fill:#111;text-anchor:middle}.heading{font:bold 44px Arial,Helvetica,sans-serif;fill:#050505;text-anchor:middle}</style>
  </defs>
  <rect width="622" height="640" fill="#fff"/>
  <!-- Dashed task-worker boundary. -->
  <rect x="27" y="20" width="568" height="600" rx="70" fill="#fff" stroke="#42bbd2" stroke-width="6" stroke-dasharray="19 14"/>
  <text class="heading" x="311" y="67">Task workers</text>
  <!-- Four specialized worker pools. -->
  <rect class="worker" x="50" y="121" width="198" height="188" rx="26"/><use href="#servers" x="84" y="133" width="130" height="90"/><text class="label" x="149" y="290">Watermark</text>
  <rect class="worker" x="374" y="121" width="198" height="188" rx="26"/><use href="#servers" x="408" y="133" width="130" height="90"/><text class="label" x="473" y="290">Encoder</text>
  <text x="311" y="356" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" text-anchor="middle">…</text>
  <rect class="worker" x="50" y="367" width="198" height="187" rx="26"/><use href="#servers" x="84" y="379" width="130" height="90"/><text class="label" x="149" y="535">Thumbnail</text>
  <rect class="worker" x="374" y="367" width="198" height="187" rx="26"/><use href="#servers" x="408" y="379" width="130" height="90"/><text class="label" x="473" y="535">Merger</text>
</svg>
