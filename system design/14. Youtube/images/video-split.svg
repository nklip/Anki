<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="148" viewBox="0 0 1320 148" role="img" aria-labelledby="title desc">
  <title id="title">Split video by GOP alignment</title>
  <desc id="desc">An original video is split into GOP 1, GOP 2, continuing groups, and GOP N.</desc>
  <!-- Blue flow arrow and compact video-camera icon. -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#2780ae"/></marker>
    <style>.text{font:28px Arial,Helvetica,sans-serif;fill:#222;text-anchor:middle}</style>
  </defs>
  <rect width="1320" height="148" fill="#fff"/>
  <!-- Source video. -->
  <rect x="11" y="37" width="464" height="97" fill="#fff" stroke="#111" stroke-width="2"/>
  <g fill="none" stroke="#039ce0" stroke-width="4" stroke-linejoin="round"><rect x="69" y="70" width="40" height="31" rx="2"/><path d="M109 79L127 72V99L109 92Z"/></g>
  <text class="text" x="258" y="97">Original video</text>
  <!-- GOP split flow; label stays entirely above the connector. -->
  <path d="M475 85H841" fill="none" stroke="#2780ae" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="text" x="660" y="29">Split by GOP</text><text class="text" x="660" y="59">alignment</text>
  <g fill="#fff" stroke="#111" stroke-width="2"><rect x="842" y="37" width="116" height="97"/><rect x="958" y="37" width="116" height="97"/><rect x="1074" y="37" width="116" height="97"/><rect x="1190" y="37" width="116" height="97"/></g>
  <text class="text" x="900" y="97">GOP 1</text><text class="text" x="1016" y="97">GOP 2</text><text class="text" x="1132" y="97">…</text><text class="text" x="1248" y="97">GOP N</text>
</svg>
