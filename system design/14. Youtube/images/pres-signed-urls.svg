<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Video upload with a pre-signed URL</title>
  <desc id="desc">The user requests an upload, API servers return a pre-signed URL, and the user uploads the video directly to original storage.</desc>
  <!-- Device, storage, and server symbols. -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13Z" fill="#2e7ca8"/></marker>
    <symbol id="devices" viewBox="0 0 300 90"><g fill="#fff" stroke="#111" stroke-width="4"><path d="M8 12Q13 5 22 5H70Q79 5 84 12L88 62Q88 75 75 82H17Q4 75 4 62Z"/><path d="M8 60Q46 67 84 60"/><path d="M113 19Q113 12 120 12H187Q194 12 194 19V68H113Z"/><path d="M107 72H200L193 80H114Z" fill="#111"/><rect x="234" y="4" width="43" height="79" rx="5"/><path d="M234 17H277M234 70H277"/></g><text x="46" y="49" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle">TV</text></symbol>
    <symbol id="servers" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#80c342"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#80c342"/><g fill="#80c342"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="bucket" viewBox="0 0 120 95"><path d="M25 19Q60 5 95 19L88 74Q60 91 32 74Z" fill="#fff" stroke="#2f8a24" stroke-width="4"/><ellipse cx="60" cy="19" rx="35" ry="12" fill="#fff" stroke="#2f8a24" stroke-width="4"/><path d="M42 40L33 57H51ZM60 45A8 8 0 1 0 60 61A8 8 0 1 0 60 45ZM44 63V78H58V63ZM73 35L99 48M78 30L92 44" fill="none" stroke="#2f8a24" stroke-width="3" stroke-linejoin="round"/></symbol>
    <style>.box{fill:#fff;stroke:#42bbd2;stroke-width:4}.flow{fill:none;stroke:#2e7ca8;stroke-width:2.2;marker-end:url(#arrow)}.t{font:31px Arial,Helvetica,sans-serif;fill:#111}</style>
  </defs>
  <rect width="1200" height="710" fill="#fff"/>
  <!-- Direct-upload storage. -->
  <rect class="box" x="24" y="54" width="245" height="226" rx="36"/><use href="#bucket" x="85" y="69" width="120" height="95"/><text x="146" y="240" class="t" text-anchor="middle">Original storage</text>
  <!-- User devices and API server tier. -->
  <rect class="box" x="602" y="88" width="416" height="157" rx="27"/><text x="632" y="132" class="t">User</text><use href="#devices" x="673" y="132" width="300" height="90"/>
  <rect x="725" y="507" width="209" height="177" rx="26" fill="#fff" stroke="#42bbd2" stroke-width="4" stroke-dasharray="12 9"/><use href="#servers" x="764" y="522" width="130" height="90"/><text x="829" y="669" class="t" text-anchor="middle">API servers</text>
  <!-- Numbered upload exchange with ample label clearance. -->
  <path class="flow" d="M777 245V507"/><text x="539" y="387" class="t">1. POST /upload</text>
  <path class="flow" d="M881 507V245"/><text x="899" y="387" class="t">2. &lt;pre-signed URL&gt;</text>
  <path class="flow" d="M602 166H269"/><text x="434" y="143" class="t" text-anchor="middle">3. upload video</text>
</svg>
