<svg xmlns="http://www.w3.org/2000/svg" width="1916" height="652" viewBox="0 0 1916 652" role="img" aria-labelledby="title desc">
  <title id="title">Five-minute rolling snapshot</title>
  <desc id="desc">A message queue feeds a data aggregation service. The service keeps five one-minute counts for the three most-clicked ads inside a rolling snapshot.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}
    .box{fill:#fff;stroke:#111;stroke-width:2.7}
    .line{fill:none;stroke:#111;stroke-width:2.7}
    .dash{fill:none;stroke:#111;stroke-width:2.7;stroke-dasharray:10 8}
  </style>
  <rect width="1916" height="652" fill="#fff"/>
  <!-- Queue and aggregation service. -->
  <path class="box" d="M62 236H312V349H62C45 349 30 324 30 292C30 261 45 236 62 236Z"/>
  <ellipse class="box" cx="312" cy="292.5" rx="34" ry="56.5"/>
  <text x="162" y="287" font-size="40" text-anchor="middle"><tspan x="162">Message</tspan><tspan x="162" dy="45">Queue</tspan></text>
  <!-- Every head is 20 × 20; each shaft ends 1 unit inside its head base. -->
  <path class="line" data-connector="true" d="M346 292H462.65"/>
  <polygon points="481.65,292 461.65,282 461.65,302" fill="#111"/>
  <rect class="box" x="483" y="217" width="267" height="154"/>
  <text x="616.5" y="265" font-size="39" text-anchor="middle"><tspan x="616.5">Data</tspan><tspan x="616.5" dy="44">Aggregation</tspan><tspan x="616.5" dy="44">Service</tspan></text>
  <path class="line" data-connector="true" d="M750 292H868.65"/>
  <polygon points="887.65,292 867.65,282 867.65,302" fill="#111"/>
  <!-- The dashed region is the persisted rolling snapshot. -->
  <text x="1318" y="70" font-size="38" text-anchor="middle">Snapshot for the top 3 most clicked ads from the last 5 minutes</text>
  <rect class="dash" x="889" y="84" width="858" height="416"/>
  <rect class="box" x="923" y="114" width="213" height="356"/>
  <!-- Per-ad totals point to their five one-minute buckets; head tips stay 12 units before the labels. -->
  <g font-size="36">
    <text x="1026" y="200" text-anchor="middle">ad1: 12</text>
    <text x="1026" y="316" text-anchor="middle">ad3: 5</text>
    <text x="1026" y="432" text-anchor="middle">ad2: 3</text>
  </g>
  <g class="line">
    <path data-connector="true" d="M1136 178H1267"/><path data-connector="true" d="M1136 292H1267"/><path data-connector="true" d="M1136 408H1267"/>
  </g>
  <g fill="#111">
    <polygon points="1286,178 1266,168 1266,188"/>
    <polygon points="1286,292 1266,282 1266,302"/>
    <polygon points="1286,408 1266,398 1266,418"/>
  </g>
  <g font-size="36">
    <text x="1298" y="199">ad1:</text><text x="1298" y="315">ad3:</text><text x="1298" y="431">ad2:</text>
  </g>
  <!-- Five fixed-width minute cells in each row. -->
  <g class="box">
    <rect x="1398" y="146" width="310" height="62"/>
    <rect x="1398" y="262" width="310" height="62"/>
    <rect x="1398" y="377" width="310" height="62"/>
  </g>
  <g class="line">
    <path d="M1460 146V208M1522 146V208M1584 146V208M1646 146V208"/>
    <path d="M1460 262V324M1522 262V324M1584 262V324M1646 262V324"/>
    <path d="M1460 377V439M1522 377V439M1584 377V439M1646 377V439"/>
  </g>
  <g font-size="34" text-anchor="middle">
    <text x="1429" y="189">1</text><text x="1491" y="189">3</text><text x="1553" y="189">2</text><text x="1615" y="189">3</text><text x="1677" y="189">3</text>
    <text x="1429" y="305">1</text><text x="1491" y="305">1</text><text x="1553" y="305">3</text><text x="1615" y="305">0</text><text x="1677" y="305">0</text>
    <text x="1429" y="420">0</text><text x="1491" y="420">2</text><text x="1553" y="420">0</text><text x="1615" y="420">1</text><text x="1677" y="420">0</text>
  </g>
  <!-- Minute scale for the five snapshot buckets. -->
  <path class="line" data-connector="true" d="M1362 558H1777"/>
  <polygon points="1796,558 1776,548 1776,568" fill="#111"/>
  <g class="line">
    <path d="M1428 532V573"/><path d="M1489 532V573"/><path d="M1551 532V573"/><path d="M1613 532V573"/><path d="M1674 532V573"/>
  </g>
  <g font-size="34" text-anchor="middle">
    <text x="1428" y="610">1</text><text x="1489" y="610">2</text><text x="1551" y="610">3</text><text x="1613" y="610">4</text><text x="1674" y="610">5</text>
  </g>
  <text x="1764" y="604" font-size="38">Minute</text>
</svg>
