<svg xmlns="http://www.w3.org/2000/svg" width="1778" height="1024" viewBox="0 0 1778 1024" role="img" aria-labelledby="title desc">
  <title id="title">Scalable ad-click aggregation design</title>
  <desc id="desc">A log watcher writes to an input queue consumed by the aggregation service and raw-data writer. Aggregates enter a second queue, are persisted, and are queried by a dashboard service.</desc>
  <!-- Every head is the same symmetric 20-by-20 triangle, rotated without scaling.
       Shafts finish two units inside the bases; tips meet outer target strokes. -->
  <defs>
    <path id="arrowhead" d="M0 0L-20 -10L-20 10Z" fill="#111"/>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}
    .box{fill:#fff;stroke:#111;stroke-width:2.7}
    .line{fill:none;stroke:#111;stroke-width:2.7}
  </style>
  <rect width="1778" height="1024" fill="#fff"/>
  <!-- Ingestion path: log watcher to queue to aggregation service. -->
  <rect class="box" x="33" y="85" width="217" height="90"/>
  <text x="141.5" y="147" font-size="34" text-anchor="middle">Log Watcher</text>
  <path id="flow-1-shaft" data-connector="true" class="line" d="M250 130L353.65 130"/>
  <use id="flow-1-arrowhead" href="#arrowhead" transform="translate(371.65 130) rotate(0)"/>
  <path class="box" d="M408 85H599V175H408C389 175 373 155 373 130C373 105 389 85 408 85Z"/>
  <ellipse class="box" cx="599" cy="130" rx="29" ry="45"/>
  <text x="486" y="120" font-size="35" text-anchor="middle"><tspan x="486">Message</tspan><tspan x="486" dy="43">Queue</tspan></text>
  <path id="flow-2-shaft" data-connector="true" class="line" d="M628 130L714.65 130"/>
  <use id="flow-2-arrowhead" href="#arrowhead" transform="translate(732.65 130) rotate(0)"/>
  <rect class="box" x="734" y="68" width="219" height="125"/>
  <text x="843.5" y="108" font-size="34" text-anchor="middle"><tspan x="843.5">Data</tspan><tspan x="843.5" dy="38">Aggregation</tspan><tspan x="843.5" dy="38">Service</tspan></text>
  <!-- The input queue is also persisted as raw data. -->
  <path id="flow-3-shaft" data-connector="true" class="line" d="M500 175L500 355.65"/>
  <use id="flow-3-arrowhead" href="#arrowhead" transform="translate(500 373.65) rotate(90)"/>
  <rect class="box" x="406" y="375" width="188" height="94"/>
  <text x="500" y="414" font-size="35" text-anchor="middle"><tspan x="500">Database</tspan><tspan x="500" dy="40">Writer</tspan></text>
  <path id="flow-4-shaft" data-connector="true" class="line" d="M500 469L500 586.65"/>
  <use id="flow-4-arrowhead" href="#arrowhead" transform="translate(500 604.65) rotate(90)"/>
  <path class="box" d="M429 621V719C429 736 461 746 500 746C539 746 571 736 571 719V621Z"/>
  <ellipse class="box" cx="500" cy="621" rx="71" ry="15"/>
  <text x="338" y="673" font-size="33" text-anchor="middle"><tspan x="338">Raw data</tspan><tspan x="338" dy="40">database</tspan></text>
  <!-- Two aggregate streams enter the output queue. -->
  <path class="line" d="M953 95C970 90 985 86 995 84"/>
  <text x="1146" y="58" font-size="29" text-anchor="middle"><tspan x="1146">Ad count</tspan><tspan x="1146" dy="34">(Aggregate every min)</tspan></text>
  <path id="flow-5-shaft" data-connector="true" class="line" d="M1310 85.5C1320 87 1337.599559 93.636163 1348.523957 98.601798"/>
  <use id="flow-5-arrowhead" href="#arrowhead" transform="translate(1364.910553 106.050251) rotate(24.443955)"/>
  <path class="line" d="M953 160C962 164 970 167 980 170"/>
  <text x="1147" y="184" font-size="28" text-anchor="middle"><tspan x="1147">Top 100 most clicked Ads</tspan><tspan x="1147" dy="34">(Aggregate every min)</tspan></text>
  <path id="flow-6-shaft" data-connector="true" class="line" d="M1320 170C1330 168 1340.025492 164.24044 1348.452455 161.08033"/>
  <use id="flow-6-arrowhead" href="#arrowhead" transform="translate(1365.30638 154.760108) rotate(-20.556045)"/>
  <path class="box" d="M1396 85H1585V175H1396C1377 175 1361 155 1361 130C1361 105 1377 85 1396 85Z"/>
  <ellipse class="box" cx="1585" cy="130" rx="30" ry="45"/>
  <text x="1487" y="120" font-size="35" text-anchor="middle"><tspan x="1487">Message</tspan><tspan x="1487" dy="43">Queue</tspan></text>
  <!-- Aggregation writer pulls from the output queue. -->
  <path class="line" d="M1488 175V234"/>
  <text x="1488" y="279" font-size="33" text-anchor="middle">Pull aggregation results</text>
  <path id="flow-7-shaft" data-connector="true" class="line" d="M1488 312L1488 355.65"/>
  <use id="flow-7-arrowhead" href="#arrowhead" transform="translate(1488 373.65) rotate(90)"/>
  <rect class="box" x="1393" y="375" width="189" height="94"/>
  <text x="1487.5" y="414" font-size="35" text-anchor="middle"><tspan x="1487.5">Database</tspan><tspan x="1487.5" dy="40">Writer</tspan></text>
  <path id="flow-8-shaft" data-connector="true" class="line" d="M1488 469L1488 586.65"/>
  <use id="flow-8-arrowhead" href="#arrowhead" transform="translate(1488 604.65) rotate(90)"/>
  <path class="box" d="M1417 621V719C1417 736 1449 746 1488 746C1527 746 1559 736 1559 719V621Z"/>
  <ellipse class="box" cx="1488" cy="621" rx="71" ry="15"/>
  <text x="1661" y="673" font-size="33" text-anchor="middle"><tspan x="1661">Aggregation</tspan><tspan x="1661" dy="40">database</tspan></text>
  <!-- Dashboard queries the aggregation database. -->
  <rect class="box" x="1378" y="868" width="218" height="127"/>
  <text x="1487" y="909" font-size="34" text-anchor="middle"><tspan x="1487">Query</tspan><tspan x="1487" dy="39">Service</tspan><tspan x="1487" dy="39">(Dashboard)</tspan></text>
  <path class="line" d="M1488 868V850"/>
  <text x="1488" y="834" font-size="33" text-anchor="middle">Query aggregation results</text>
  <path id="flow-9-shaft" data-connector="true" class="line" d="M1488 793L1488 765.35"/>
  <use id="flow-9-arrowhead" href="#arrowhead" transform="translate(1488 747.35) rotate(-90)"/>
</svg>
