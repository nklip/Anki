<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="540" viewBox="0 0 1860 540" role="img" aria-labelledby="title desc">
  <title id="title">Kappa architecture</title>
  <desc id="desc">Events enter a log, pass through a real-time streaming engine to a serving backend, and are queried from the serving side while raw data and results remain in data storage.</desc>
  <!-- Every head is the same symmetric 19-by-20 triangle, rotated without scaling.
       Shafts finish two units inside the bases; tips meet outer target strokes. -->
  <defs>
    <path id="arrowhead" d="M0 0L-19 -10L-19 10Z" fill="#111"/>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}
    .line{fill:none;stroke:#111;stroke-width:2.5}
    .box{fill:#fff;stroke:#111;stroke-width:2.5}
    .dash{fill:none;stroke:#111;stroke-width:2.5;stroke-dasharray:9 7}
  </style>
  <rect width="1860" height="540" fill="#fff"/>
  <text x="48" y="68" font-size="34">Kappa Architecture</text>
  <!-- Input document and append-only stream. -->
  <path class="box" d="M57 199H101L111 209V255H57Z"/>
  <path class="line" d="M101 199V209H111"/>
  <path id="flow-1-shaft" data-connector="true" class="line" d="M111 227L258.75 227"/>
  <use id="flow-1-arrowhead" href="#arrowhead" transform="translate(275.75 227) rotate(0)"/>
  <path class="box" d="M302 181H499V273H302C288 273 277 252 277 227C277 202 288 181 302 181Z"/>
  <ellipse class="box" cx="499" cy="227" rx="25" ry="46"/>
  <!-- Streaming and serving layers. -->
  <rect class="dash" x="690" y="94" width="338" height="190"/>
  <text x="859" y="151" font-size="36" text-anchor="middle">Streaming Layer</text>
  <rect class="box" x="716" y="196" width="292" height="66"/>
  <text x="862" y="238" font-size="34" text-anchor="middle">Real-time Engine</text>
  <path id="flow-2-shaft" data-connector="true" class="line" d="M524 227L697.75 227"/>
  <use id="flow-2-arrowhead" href="#arrowhead" transform="translate(714.75 227) rotate(0)"/>
  <rect class="dash" x="1187" y="94" width="348" height="190"/>
  <text x="1361" y="151" font-size="36" text-anchor="middle">Serving Layer</text>
  <rect class="box" x="1215" y="196" width="292" height="66"/>
  <text x="1361" y="238" font-size="34" text-anchor="middle">Serving Backend</text>
  <path id="flow-3-shaft" data-connector="true" class="line" d="M1008 227L1196.75 227"/>
  <use id="flow-3-arrowhead" href="#arrowhead" transform="translate(1213.75 227) rotate(0)"/>
  <!-- Queries point into the serving backend. -->
  <rect class="box" x="1647" y="196" width="136" height="66"/>
  <text x="1715" y="238" font-size="34" text-anchor="middle">Query</text>
  <path id="flow-4-shaft" data-connector="true" class="line" d="M1647 227L1525.25 227"/>
  <use id="flow-4-arrowhead" href="#arrowhead" transform="translate(1508.25 227) rotate(180)"/>
  <!-- Shared data storage. -->
  <rect class="dash" x="293" y="320" width="1183" height="211"/>
  <text x="884.5" y="440" font-size="35" text-anchor="middle">Data Storage</text>
  <path class="box" d="M335 372V449C335 463 365 472 403 472C441 472 471 463 471 449V372Z"/>
  <ellipse class="box" cx="403" cy="372" rx="68" ry="12"/>
  <text x="403" y="507" font-size="34" text-anchor="middle">Raw Data</text>
  <path class="box" d="M1295 372V449C1295 463 1325 472 1363 472C1401 472 1431 463 1431 449V372Z"/>
  <ellipse class="box" cx="1363" cy="372" rx="68" ry="12"/>
  <text x="1363" y="507" font-size="34" text-anchor="middle">Results</text>
</svg>
