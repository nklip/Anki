<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="1234" viewBox="0 0 1352 1234" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Cassandra token ownership with and without virtual nodes</title>
  <desc id="diagram-desc">Two comparisons. Above the divider, a ring without virtual nodes is cut into six large token ranges A to F, so each of the six nodes holds only three ranges and rebalancing moves large blocks. Below the divider, the same ring is cut into sixteen smaller virtual-node ranges A to P, so each node holds eight scattered ranges and load spreads evenly across the cluster.</desc>
