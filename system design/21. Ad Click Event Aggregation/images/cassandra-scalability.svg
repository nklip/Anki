    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#000}
      .head{font-size:37px}
      .title{font-size:36px}
      .tag{font-size:28px;text-anchor:middle}
      .band{fill:#c3d7ec;stroke:#000;stroke-width:3.1}
      .hub{fill:#fff;stroke:#000;stroke-width:3.1}
      .spoke{stroke:#000;stroke-width:3.1}
      .pill{fill:#d8d8d8;stroke:#000;stroke-width:3}
      .group{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:2.2 7.36}
    </style>
  </defs>
  <rect width="1352" height="1234" fill="#fff"/>
