<svg xmlns="http://www.w3.org/2000/svg" width="1616" height="764" viewBox="0 0 1616 764" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">A reduce node merges three partial top-3 lists into one</title>
  <desc id="diagram-desc">The task is to get the top 3 most clicked ads. Three aggregate nodes each hand a reduce node their own top 3 with click counts: ad1 12, ad3 5, ad2 3; ad7 9, ad10 4, ad8 3; and ad13 8, ad11 4, ad15 3. The reduce node keeps the three highest counts across all nine entries, giving ad1 12, ad7 9 and ad13 8, and outputs that the top 3 most clicked ads from the last minute are ad1, ad7 and ad13.</desc>
  <!-- One arrowhead marker and one style block drive every connector; restyle from here. -->
  <defs>
    <marker id="head" viewBox="0 0 24.9 18.6" refX="1" refY="9.3" markerWidth="24.9" markerHeight="18.6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L24.9 9.3L0 18.6Z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:40.5px;fill:#000}
      .num{text-anchor:end}
      .box{fill:#fff;stroke:#000;stroke-width:2.5}
      .flow{fill:none;stroke:#000;stroke-width:2.5;marker-end:url(#head)}
    </style>
  </defs>
  <rect width="1616" height="764" fill="#fff"/>
  <!-- Column headers name the three stages read left to right. -->
  <g id="headers">
    <text x="409" y="67">Aggregate</text>
    <text x="801" y="67">Reduce</text>
    <text x="1320" y="66">Output</text>
  </g>
  <text id="task" x="62" y="446">Task: get top 3</text>
  <!-- Aggregate nodes: ad ids left-aligned, counts right-aligned in their own column. -->
  <g id="aggregate-nodes">
    <rect class="box" x="404.5" y="121" width="191.5" height="178"/>
    <text x="427" y="174">ad1:</text><text class="num" x="577" y="174">12</text>
    <text x="427" y="225">ad3:</text><text class="num" x="577" y="225">5</text>
    <text x="427" y="276">ad2:</text><text class="num" x="577" y="276">3</text>
    <rect class="box" x="404.5" y="342" width="191.5" height="178"/>
    <text x="427" y="395">ad7:</text><text class="num" x="577" y="395">9</text>
    <text x="427" y="446">ad10:</text><text class="num" x="577" y="446">4</text>
    <text x="427" y="497">ad8:</text><text class="num" x="577" y="497">3</text>
    <rect class="box" x="404.5" y="547" width="191.5" height="178"/>
    <text x="427" y="600">ad13:</text><text class="num" x="577" y="600">8</text>
    <text x="427" y="651">ad11:</text><text class="num" x="577" y="651">4</text>
    <text x="427" y="700">ad15:</text><text class="num" x="577" y="700">3</text>
  </g>
  <!-- Reduce node keeps the three highest counts across all nine entries. -->
  <g id="reduce-node">
    <rect class="box" x="773.5" y="342" width="191.5" height="178"/>
    <text x="792" y="395">ad1:</text><text class="num" x="942.5" y="395">12</text>
    <text x="792" y="446">ad7:</text><text class="num" x="942.5" y="446">9</text>
    <text x="792" y="497">ad13:</text><text class="num" x="942.5" y="497">8</text>
  </g>
  <!-- Each aggregate node feeds the reduce node; the reduce node feeds the output. -->
  <g id="connectors">
    <path class="flow" d="M596 267.94L753 361.95"/>
    <path class="flow" d="M596 431.61L749.6 431.61"/>
    <path class="flow" d="M596 583.38L752.6 496.44"/>
    <path class="flow" d="M965 431.61L1148 431.61"/>
  </g>
  <g id="output">
    <text x="1215" y="377">Top 3 most clicked</text>
    <text x="1232.5" y="423">ads from the last</text>
    <text x="1202" y="469">minute are ad1, ad7</text>
    <text x="1298" y="515">and ad13</text>
  </g>
</svg>
