<svg xmlns="http://www.w3.org/2000/svg" width="1796" height="1322" viewBox="0 0 1796 1322" role="img" aria-labelledby="title desc">
  <title id="title">Handling a hot aggregation key</title>
  <desc id="desc">A resource manager detects a hot ad identifier, allocates three temporary aggregate workers, splits the events between them, and reduces their partial results before the normal reduce stage.</desc>
  <!-- Shared heads follow the final shaft tangent. Their noses project four units
       beyond the path endpoint, which is pulled back from each target's outer stroke. -->
  <defs>
    <marker id="arrowhead" markerWidth="20" markerHeight="14" viewBox="0 0 20 14"
            refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L20 7L0 14Z" fill="#111"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .node{fill:#fff;stroke:#111;stroke-width:2.7}
      .line{fill:none;stroke:#111;stroke-width:2.7}
      .dash{fill:none;stroke:#111;stroke-width:2.7;stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1796" height="1322" fill="#fff"/>
  <!-- Normal map, aggregate, and reduce data path. -->
  <circle class="node" cx="357" cy="1003" r="96"/>
  <text x="357" y="1018" font-size="36" text-anchor="middle">Map</text>
  <path class="line" d="M67 1002H108"/>
  <text x="158" y="994" font-size="32" text-anchor="middle"><tspan x="158">Data</tspan><tspan x="158" dy="40">Input</tspan></text>
  <path id="input-arrow" class="line" d="M203 1002H255.66" marker-end="url(#arrowhead)"/>

  <circle class="node" cx="877" cy="806" r="96"/>
  <text x="877" y="817" font-size="32" text-anchor="middle">Aggregate</text>
  <circle class="node" cx="886" cy="1208" r="96"/>
  <text x="886" y="1219" font-size="32" text-anchor="middle">Aggregate</text>
  <!-- Both visible pieces share the same center-to-center line; the gap clears the label. -->
  <path id="hot-events-shaft" class="line" d="M446.77 968.99L553 928.75"/>
  <path id="hot-events-arrow" class="line" d="M704 871.54L782.22 841.91" marker-end="url(#arrowhead)"/>
  <path id="normal-events-arrow" class="line" d="M446.51 1037.69L791.50 1171.38" marker-end="url(#arrowhead)"/>
  <text x="630" y="911" font-size="32" text-anchor="middle">ad1, 300 events</text>

  <circle class="node" cx="1387" cy="1010" r="96"/>
  <text x="1387" y="1027" font-size="36" text-anchor="middle">Reduce</text>
  <path id="hot-result-arrow" class="line" d="M966.13 841.65L1292.90 972.36" marker-end="url(#arrowhead)"/>
  <path id="normal-result-arrow" class="line" d="M975.28 1172.72L1292.74 1047.25" marker-end="url(#arrowhead)"/>
  <path class="line" d="M1483 1010H1493"/>
  <text x="1590" y="1003" font-size="32" text-anchor="middle"><tspan x="1590">Aggregated</tspan><tspan x="1590" dy="40">Output</tspan></text>
  <path id="output-arrow" class="line" d="M1690 1010H1711" marker-end="url(#arrowhead)"/>

  <!-- Resource manager and temporary hotspot workers. -->
  <rect class="node" x="438" y="265" width="188" height="91"/>
  <text x="532" y="300" font-size="35" text-anchor="middle"><tspan x="532">Resource</tspan><tspan x="532" dy="40">Manager</tspan></text>
  <rect class="dash" x="1082" y="54" width="612" height="512"/>
  <circle class="node" cx="1186" cy="159" r="69"/>
  <circle class="node" cx="1186" cy="310" r="69"/>
  <circle class="node" cx="1186" cy="461" r="69"/>
  <g font-size="26" text-anchor="middle">
    <text x="1186" y="168">Aggregate</text><text x="1186" y="319">Aggregate</text><text x="1186" y="470">Aggregate</text>
  </g>
  <circle class="node" cx="1580" cy="310" r="70"/>
  <text x="1580" y="320" font-size="30" text-anchor="middle">Reduce</text>
  <!-- Three hundred events are split into three one-hundred-event partials. -->
  <path id="top-partial-shaft" class="line" d="M1250.43 183.69L1310 206.52"/>
  <path id="top-partial-arrow" class="line" d="M1420 248.68L1509.64 283.03" marker-end="url(#arrowhead)"/>
  <text x="1364" y="237" font-size="28" text-anchor="middle">100 events</text>
  <path id="middle-partial-shaft" class="line" d="M1255 310H1288"/>
  <path id="middle-partial-arrow" class="line" d="M1440 310H1504.65" marker-end="url(#arrowhead)"/>
  <text x="1364" y="320" font-size="28" text-anchor="middle">100 events</text>
  <path id="bottom-partial-shaft" class="line" d="M1250.43 436.31L1298 418.08"/>
  <path id="bottom-partial-arrow" class="line" d="M1420 371.32L1509.64 336.97" marker-end="url(#arrowhead)"/>
  <text x="1364" y="403" font-size="28" text-anchor="middle">100 events</text>

  <!-- 1. The hot worker requests additional resources. -->
  <!-- Collinear request segments leave clearance below the last line of text.
       Final dash phases keep a painted shaft beneath each control arrowhead's base. -->
  <path id="resource-request-shaft" class="dash" d="M822.30 727.09L746.68 618"/>
  <path id="resource-request-arrow" class="dash" d="M655.18 486L568.28 360.64" stroke-dashoffset="15.4656" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="605" cy="552" r="23"/>
  <text x="605" y="562" font-size="28" text-anchor="middle">1</text>
  <text x="704" y="529" font-size="34" text-anchor="middle"><tspan x="704">Apply for</tspan><tspan x="704" dy="39">extra</tspan><tspan x="704" dy="39">resources</tspan></text>

  <!-- 2. The manager allocates the extra worker group. -->
  <path id="allocation-shaft" class="dash" d="M626 311H748"/>
  <path id="allocation-arrow" class="dash" d="M962 311H1076.65" stroke-dashoffset="17.35" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="779" cy="309" r="23"/>
  <text x="779" y="319" font-size="28" text-anchor="middle">2</text>
  <text x="882" y="289" font-size="34" text-anchor="middle"><tspan x="882">Extra</tspan><tspan x="882" dy="39">resource</tspan><tspan x="882" dy="39">allocated</tspan></text>

  <!-- 3. The hot event stream is split between the temporary workers. -->
  <!-- Smooth reference routing; the label and step badge occupy deliberate gaps. -->
  <path id="split-events-shaft" class="dash" d="M875 710C885 657 900 631 917 602"/>
  <path id="split-events-arrow" class="dash" d="M998 509Q1035 477 1077.43 446.34" stroke-dashoffset="12.7977" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="972" cy="528" r="23"/>
  <text x="972" y="538" font-size="28" text-anchor="middle">3</text>
  <text x="938" y="591" font-size="34" text-anchor="middle">Split events</text>

  <!-- 4. The reduced partial result returns to the normal aggregate worker. -->
  <!-- Return curve meets the aggregate's outer boundary with its tangent-aligned nose. -->
  <path id="reduced-result-shaft" class="dash" d="M1228 566Q1203 602 1176 630"/>
  <path id="reduced-result-arrow" class="dash" d="M1097 720C1054 757 1010 783 977.795 799.202" stroke-dashoffset="6.7023" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="1157" cy="650" r="23"/>
  <text x="1157" y="660" font-size="28" text-anchor="middle">4</text>
  <text x="1126" y="705" font-size="34" text-anchor="middle">Reduced result</text>
</svg>
