<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="822" viewBox="0 0 1570 822" role="img" aria-labelledby="title desc">
  <title id="title">Top 100 map-reduce aggregation</title>
  <desc id="desc">A map worker fans input into two aggregate workers, whose partial results are reduced into the top 100 ads.</desc>
  <!-- Compact symmetric heads and shared line styles preserve the original routing. -->
  <defs>
    <!-- Equal symmetric heads: noses project 3 units beyond the shaft, whose endpoint is compensated to meet the outer target stroke. -->
    <marker id="arrow" viewBox="0 0 17.5 17.5" refX="14.5" refY="8.75" markerWidth="17.5" markerHeight="17.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L17.5 8.75L0 17.5Z" fill="#111"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .node{fill:#fff;stroke:#111;stroke-width:2.5}
      .boundary{fill:none;stroke:#777;stroke-width:2.5;stroke-dasharray:9 7}
      .flow{fill:none;stroke:#111;stroke-width:2.5;marker-end:url(#arrow)}
      .line{fill:none;stroke:#111;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1570" height="822" fill="#fff"/>

  <!-- Top-100 aggregation service boundary. -->
  <rect class="boundary" x="221" y="100" width="1038" height="643"/>
  <text x="740" y="82" font-size="36" text-anchor="middle">Top 100 aggregation</text>
  <text x="740" y="789" font-size="36" text-anchor="middle">Aggregation Service</text>

  <!-- Input and two-way aggregation fan-out. -->
  <path class="line" d="M29 422H50"/>
  <path id="flow-1" class="flow" d="M149 422L255.75 422"/>
  <text x="99" y="414" font-size="35" text-anchor="middle"><tspan x="99" dy="0">Data</tspan><tspan x="99" dy="39">Input</tspan></text>
  <circle class="node" cx="360" cy="422" r="100"/>
  <text x="360" y="434" font-size="36" text-anchor="middle">Map</text>

  <circle class="node" cx="733" cy="236" r="100"/>
  <text x="733" y="248" font-size="35" text-anchor="middle">Aggregate</text>
  <circle class="node" cx="733" cy="615" r="100"/>
  <text x="733" y="627" font-size="35" text-anchor="middle">Aggregate</text>
  <path id="flow-2" class="flow" d="M449 376L638.9701 281.0149"/>
  <path id="flow-3" class="flow" d="M449 468L639.7896 568.3121"/>

  <circle class="node" cx="1121" cy="422" r="100"/>
  <text x="1121" y="434" font-size="36" text-anchor="middle">Reduce</text>
  <path id="flow-4" class="flow" d="M823 279L1028.1217 374.6577"/>
  <path id="flow-5" class="flow" d="M823 570L1028.1486 469.3983"/>
  <path id="flow-6" class="flow" d="M1221 422L1330.75 422"/>
  <text x="1338" y="434" font-size="36">Top 100 Ads</text>
</svg>
