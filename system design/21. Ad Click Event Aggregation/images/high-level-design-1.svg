<svg xmlns="http://www.w3.org/2000/svg" width="1972" height="400" viewBox="0 0 1972 400" role="img" aria-labelledby="title desc">
  <title id="title">High-level ad click aggregation design</title>
  <desc id="desc">A log watcher pushes data to an aggregation service, which stores per-ad and top-ad aggregates in a database queried by a query service.</desc>
  <!-- Shared styles; every head uses the same 20-by-14 geometry along its shaft. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .line{fill:none;stroke:#111;stroke-width:2.5}
      .dash{fill:none;stroke:#111;stroke-width:2.5;stroke-dasharray:10 8}
      .box{fill:#fff;stroke:#111;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1972" height="400" fill="#fff"/>
  <!-- Four processing stages. -->
  <g font-size="31" text-anchor="middle">
    <text x="131" y="82">Input</text><text x="662" y="82">Process</text><text x="1318" y="82">Output</text><text x="1829.5" y="82">Display</text>
  </g>
  <g class="dash">
    <!-- Stage dividers are interrupted wherever a label crosses the boundary. -->
    <path d="M395 48V175M395 235V359"/>
    <path d="M1008 48V95M1008 175V225M1008 305V359"/>
    <path d="M1557 48V175M1557 235V359"/>
  </g>
  <!-- Input and aggregation service. -->
  <rect class="box" x="28" y="161" width="206" height="87"/>
  <text x="131" y="216" font-size="32" text-anchor="middle">Log Watcher</text>
  <path id="push-data-source-shaft" class="line" d="M234 205H300"/>
  <text x="405" y="215" font-size="32" text-anchor="middle">Push data</text>
  <!-- Shafts end two units inside their head bases; tips meet the target's outer stroke. -->
  <path id="push-data-target-shaft" class="line" d="M500 205H539.75"/>
  <polygon id="push-data-arrowhead" points="557.75,205 537.75,198 537.75,212" fill="#111"/>
  <rect class="box" x="559" y="139" width="206" height="131"/>
  <text x="662" y="183" font-size="32" text-anchor="middle"><tspan x="662">Data</tspan><tspan x="662" dy="36">Aggregation</tspan><tspan x="662" dy="36">Service</tspan></text>
  <!-- Preserve the original angled fragments around each label. The wider corridor
       leaves room for visible shafts and tangent-aligned heads on both streams. -->
  <path id="ad-count-source-shaft" class="line" d="M765 159L850 142"/>
  <path id="ad-count-target-shaft" class="line" d="M1166 142.25L1232.099 155.470"/>
  <polygon id="ad-count-arrowhead" points="1249.75,159 1228.766,161.942 1231.511,148.214" fill="#111"/>
  <text x="1008" y="128" font-size="24" text-anchor="middle"><tspan x="1008">Ad count</tspan><tspan x="1008" dy="29">(Aggregate every min)</tspan></text>
  <path id="top-ads-source-shaft" class="line" d="M765 244L850 261"/>
  <path id="top-ads-target-shaft" class="line" d="M1166 257.75L1232.099 244.530"/>
  <polygon id="top-ads-arrowhead" points="1249.75,241 1231.511,251.786 1228.766,238.058" fill="#111"/>
  <text x="1008" y="260" font-size="24" text-anchor="middle"><tspan x="1008">Top 100 most clicked Ads</tspan><tspan x="1008" dy="31">(Aggregate every min)</tspan></text>
  <!-- Aggregate database. -->
  <path class="box" d="M1251 155V246C1251 260 1280 267 1317 267C1354 267 1385 260 1385 246V155Z"/>
  <ellipse class="box" cx="1318" cy="155" rx="67" ry="13"/>
  <text x="1318" y="214" font-size="25" text-anchor="middle">Database</text>
  <!-- Query service reads the aggregates. -->
  <rect class="box" x="1710" y="161" width="239" height="87"/>
  <text x="1829.5" y="216" font-size="32" text-anchor="middle">Query Service</text>
  <path id="query-source-shaft" class="line" d="M1710 205H1630"/>
  <text x="1556" y="215" font-size="32" text-anchor="middle">Query</text>
  <path id="query-target-shaft" class="line" d="M1480 205H1404.25"/>
  <polygon id="query-arrowhead" points="1386.25,205 1406.25,198 1406.25,212" fill="#111"/>
</svg>
