<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="692" viewBox="0 0 1940 692" role="img" aria-labelledby="title desc">
  <title id="title">Recalculation from raw events</title>
  <desc id="desc">The normal aggregation pipeline stores raw and aggregated data. A recalculation service reads raw events, runs an isolated aggregation worker, and republishes corrected results to the message queue.</desc>
  <!-- One isosceles 20-by-20 head (area 200) is rotated without scaling for every arrow.
       Its tip is the origin; shafts end two units inside the base to hide the join. -->
  <defs>
    <path id="arrowhead" d="M0 0L-20 -10L-20 10Z" fill="#111"/>
    <!-- Shared monochrome styles and the highlighted recalculation service. -->
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .shape{fill:#fff;stroke:#111;stroke-width:2.2}
      .dash{fill:none;stroke:#111;stroke-width:2.2;stroke-dasharray:9 7}
      .connector{fill:none;stroke:#111;stroke-width:2.2}
      .recalculation{fill:rgb(247,197,253);stroke:#111;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1940" height="692" fill="#fff"/>

  <!-- Normal ingestion path: watcher, queue, aggregation, and raw-data persistence. -->
  <rect class="shape" x="35" y="178" width="185" height="76"/>
  <text x="127.5" y="232" font-size="28" text-anchor="middle">Log Watcher</text>
  <path id="watcher-queue-shaft" class="connector" data-connector="true" d="M220 216L303.901 216"/>
  <use id="watcher-queue-arrowhead" href="#arrowhead" transform="translate(321.901 216) rotate(0)"/>

  <path class="shape" d="M338 177H522C544 177 544 254 522 254H338C318 254 318 177 338 177Z"/>
  <path class="shape" d="M522 177C486 177 486 254 522 254"/>
  <text x="426" y="211" font-size="28" text-anchor="middle"><tspan x="426">Message</tspan><tspan x="426" dy="30">Queue</tspan></text>

  <rect class="shape" x="626" y="58" width="185" height="106"/>
  <text x="718.5" y="91" font-size="28" text-anchor="middle"><tspan x="718.5">Data</tspan><tspan x="718.5" dy="30">Aggregation</tspan><tspan x="718.5" dy="30">Service</tspan></text>
  <path id="queue-aggregation-shaft" class="connector" data-connector="true" d="M523 178L607.88544 148.694312"/>
  <use id="queue-aggregation-arrowhead" href="#arrowhead" transform="translate(624.9 142.820238) rotate(-19.046624)"/>

  <rect class="shape" x="638" y="283" width="160" height="77"/>
  <text x="718" y="317" font-size="28" text-anchor="middle"><tspan x="718">Database</tspan><tspan x="718" dy="30">Writer</tspan></text>
  <path id="queue-raw-writer-shaft" class="connector" data-connector="true" d="M523 253L619.877641 286.301689"/>
  <use id="queue-raw-writer-arrowhead" href="#arrowhead" transform="translate(636.9 292.153125) rotate(18.970408)"/>
  <path id="raw-writer-database-shaft" class="connector" data-connector="true" d="M718 360L718 462.9"/>
  <use id="raw-writer-database-arrowhead" href="#arrowhead" transform="translate(718 480.9) rotate(90)"/>

  <path class="shape" d="M658 492V589C658 604 779 604 779 589V492"/>
  <ellipse class="shape" cx="718.5" cy="492" rx="60.5" ry="10"/>
  <text x="582" y="536" font-size="28" text-anchor="middle"><tspan x="582">Raw data</tspan><tspan x="582" dy="30">database</tspan></text>

  <!-- Both label gaps share x=840/1116 and are centered on x=978.
       Each pair of angled fragments ends at the same height across its gap. -->
  <path id="ad-count-source-shaft" class="connector" data-connector="true" d="M811 79L840 72"/>
  <path id="ad-count-target-shaft" class="connector" data-connector="true" d="M1116 72L1140.060398 78.245507"/>
  <use id="ad-count-target-arrowhead" href="#arrowhead" transform="translate(1157.483 82.768) rotate(14.551470)"/>
  <text x="978" y="54" font-size="23" text-anchor="middle"><tspan x="978">Ad count</tspan><tspan x="978" dy="26">(Aggregate every min)</tspan></text>

  <path id="top-ads-source-shaft" class="connector" data-connector="true" d="M811 140L840 148"/>
  <path id="top-ads-target-shaft" class="connector" data-connector="true" d="M1116 148L1140.634697 142.720178"/>
  <use id="top-ads-target-arrowhead" href="#arrowhead" transform="translate(1158.235 138.948) rotate(-12.096888)"/>
  <text x="978" y="160" font-size="23" text-anchor="middle"><tspan x="978">Top 100 most clicked Ads</tspan><tspan x="978" dy="26">(Aggregate every min)</tspan></text>

  <!-- Aggregated-result queue, polling writer, and aggregation database. -->
  <path class="shape" d="M1172 71H1352C1376 71 1376 149 1352 149H1172C1148 149 1148 71 1172 71Z"/>
  <path class="shape" d="M1352 71C1319 71 1319 149 1352 149"/>
  <text x="1260" y="105" font-size="28" text-anchor="middle"><tspan x="1260">Message</tspan><tspan x="1260" dy="30">Queue</tspan></text>

  <!-- Equal left/right clearance around the centered polling label. -->
  <path id="poll-result-source-shaft" class="connector" data-connector="true" d="M1370 110H1397"/>
  <path id="poll-result-target-shaft" class="connector" data-connector="true" d="M1569 110L1591.9 110"/>
  <use id="poll-result-target-arrowhead" href="#arrowhead" transform="translate(1609.9 110) rotate(0)"/>
  <text x="1483" y="89" font-size="28" text-anchor="middle"><tspan x="1483">Poll</tspan><tspan x="1483" dy="31">aggregation</tspan><tspan x="1483" dy="31">result</tspan></text>
  <rect class="shape" x="1611" y="71" width="160" height="78"/>
  <text x="1691" y="104" font-size="28" text-anchor="middle"><tspan x="1691">Database</tspan><tspan x="1691" dy="30">Writer</tspan></text>
  <path id="aggregation-writer-shaft" class="connector" data-connector="true" d="M1691 149L1691 245.9"/>
  <use id="aggregation-writer-arrowhead" href="#arrowhead" transform="translate(1691 263.9) rotate(90)"/>

  <path class="shape" d="M1631 278V372C1631 389 1751 389 1751 372V278"/>
  <ellipse class="shape" cx="1691" cy="278" rx="60" ry="13"/>
  <text x="1770" y="320" font-size="28"><tspan x="1770">Aggregation</tspan><tspan x="1770" dy="31">database</tspan></text>

  <!-- The query gap leaves eight units above and below the rendered label. -->
  <path id="query-result-source-shaft" class="connector" data-connector="true" d="M1691 551V504"/>
  <path id="query-result-target-shaft" class="connector" data-connector="true" d="M1691 461L1691 403.85"/>
  <use id="query-result-target-arrowhead" href="#arrowhead" transform="translate(1691 385.85) rotate(-90)"/>
  <text x="1691" y="490" font-size="28" text-anchor="middle">Query aggregation result</text>
  <rect class="shape" x="1598" y="551" width="185" height="107"/>
  <text x="1690.5" y="583" font-size="28" text-anchor="middle"><tspan x="1690.5">Query</tspan><tspan x="1690.5" dy="31">Service</tspan><tspan x="1690.5" dy="31">(Dashboard)</tspan></text>

  <!-- Numbered recalculation path from raw data back to the result queue. -->
  <rect class="recalculation" x="1169" y="502" width="185" height="77"/>
  <text x="1261.5" y="536" font-size="28" text-anchor="middle"><tspan x="1261.5">Recalculation</tspan><tspan x="1261.5" dy="30">Service</tspan></text>
  <path id="recalculation-step-1-source-shaft" class="connector" data-connector="true" d="M1158 540H993"/>
  <path id="recalculation-step-1-target-shaft" class="connector" data-connector="true" d="M955 540L798.1 540"/>
  <use id="recalculation-step-1-target-arrowhead" href="#arrowhead" transform="translate(780.1 540) rotate(180)"/>
  <circle class="shape" cx="974" cy="540" r="19"/>
  <text x="974" y="548" font-size="22" text-anchor="middle">1</text>

  <rect class="dash" x="1120" y="273" width="284" height="106"/>
  <text x="1262" y="304" font-size="28" text-anchor="middle"><tspan x="1262">Data Aggregation</tspan><tspan x="1262" dy="31">Service</tspan><tspan x="1262" dy="31">(Recalculation only)</tspan></text>
  <path id="recalculation-step-2-source-shaft" class="connector" data-connector="true" d="M1262 502V466"/>
  <path id="recalculation-step-2-target-shaft" class="connector" data-connector="true" d="M1262 428L1262 398.1"/>
  <use id="recalculation-step-2-target-arrowhead" href="#arrowhead" transform="translate(1262 380.1) rotate(-90)"/>
  <circle class="shape" cx="1262" cy="447" r="19"/>
  <text x="1262" y="455" font-size="22" text-anchor="middle">2</text>

  <path id="recalculation-step-3-source-shaft" class="connector" data-connector="true" d="M1262 273V234"/>
  <path id="recalculation-step-3-target-shaft" class="connector" data-connector="true" d="M1262 196L1262 168.1"/>
  <use id="recalculation-step-3-target-arrowhead" href="#arrowhead" transform="translate(1262 150.1) rotate(-90)"/>
  <circle class="shape" cx="1262" cy="215" r="19"/>
  <text x="1262" y="223" font-size="22" text-anchor="middle">3</text>
</svg>
