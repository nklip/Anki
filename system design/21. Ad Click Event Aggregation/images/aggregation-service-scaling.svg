<svg xmlns="http://www.w3.org/2000/svg" width="1966" height="1250" viewBox="0 0 1966 1250" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Scaling the aggregation service with map and reduce nodes</title>
  <desc id="diagram-desc">Three Kafka partitions each feed a map aggregation server. Every map server splits its work into three map-output partitions, and those partitions are shuffled across three reduce aggregation servers. Each reduce server takes the partitions it owns as reduce input, merges them in a reduce process, and writes one reduce output.</desc>
  <!-- One arrowhead definition and one style block feed every connector; edit them here to restyle the whole diagram. -->
  <defs>
    <!-- Equal symmetric heads: noses project 4.5 units beyond the shaft, whose endpoint is compensated to meet the outer target stroke. -->
    <marker id="arrowhead" viewBox="0 0 23 16" refX="18.5" refY="8" markerWidth="23" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L23 8L0 16Z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:38.5px;fill:#000}
      .box{fill:#fff;stroke:#000;stroke-width:2.5}
      .flow{fill:none;stroke:#000;stroke-width:2.5;marker-end:url(#arrowhead)}
    </style>
  </defs>
  <rect width="1966" height="1250" fill="#fff"/>
  <!-- Column headers name the five stages read left to right; they sit above the panels and touch no connector. -->
  <g id="column-headers">
    <text x="514.5" y="95">Map Calculation</text>
    <text x="895.5" y="73">Map</text><text x="874.5" y="117">Output</text>
    <text x="1188.5" y="73">Reduce</text><text x="1211" y="117">Input</text>
    <text x="1485.5" y="73">Reduce</text><text x="1456" y="117">Calculation</text>
    <text x="1784" y="73">Reduce</text><text x="1791.5" y="117">Output</text>
  </g>
  <!-- Map side: each Kafka partition feeds one aggregation server whose map process fans out to three map-output partitions. -->
  <g id="map-server-1">
    <!-- Kafka cylinder: left cap and right ellipse share rx=29.85, ry=54 about cy=313.84. -->
    <path class="box" d="M74.15 259.84L313.15 259.84A29.85 54 0 0 1 313.15 367.84L74.15 367.84A29.85 54 0 0 1 74.15 259.84Z"/>
    <path class="box" fill="none" d="M313.15 259.84A29.85 54 0 0 0 313.15 367.84"/>
    <text x="124" y="328">Kafka</text>
    <path id="flow-1" class="flow" d="M343 313.84L469.95 313.84"/>
    <rect class="box" x="475.7" y="145.84" width="518.8" height="336"/>
    <text x="486.5" y="199">Aggregation Server 1</text>
    <rect class="box" x="517.51" y="276.3" width="266.65" height="75.21"/>
    <text x="540.5" y="328">Map process</text>
    <rect class="box" x="900" y="202" width="63.38" height="63.39"/>
    <rect class="box" x="900" y="282.3" width="63.38" height="63.39"/>
    <rect class="box" x="900" y="362.39" width="63.38" height="63.39"/>
    <!-- Fan-out leaves the map process box at its two right corners and at mid-height; each head stops on the square border. -->
    <path id="flow-2" class="flow" d="M784.16 276.3L894.4267 244.453"/>
    <path id="flow-3" class="flow" d="M784.16 313.84L894.25 313.84"/>
    <path id="flow-4" class="flow" d="M784.16 351.51L894.4266 383.3451"/>
  </g>
  <g id="map-server-2">
    <!-- Kafka cylinder: left cap and right ellipse share rx=29.85, ry=54 about cy=682. -->
    <path class="box" d="M74.15 628L313.15 628A29.85 54 0 0 1 313.15 736L74.15 736A29.85 54 0 0 1 74.15 628Z"/>
    <path class="box" fill="none" d="M313.15 628A29.85 54 0 0 0 313.15 736"/>
    <text x="124" y="696.16">Kafka</text>
    <path id="flow-5" class="flow" d="M343 682L469.95 682"/>
    <rect class="box" x="475.7" y="514" width="518.8" height="336"/>
    <text x="486.5" y="567.16">Aggregation Server 2</text>
    <rect class="box" x="517.51" y="644.47" width="266.65" height="75.21"/>
    <text x="540.5" y="696.16">Map process</text>
    <rect class="box" x="900" y="570.16" width="63.38" height="63.39"/>
    <rect class="box" x="900" y="650.47" width="63.38" height="63.39"/>
    <rect class="box" x="900" y="730.56" width="63.38" height="63.39"/>
    <!-- Fan-out leaves the map process box at its two right corners and at mid-height; each head stops on the square border. -->
    <path id="flow-6" class="flow" d="M784.16 644.47L894.4267 612.623"/>
    <path id="flow-7" class="flow" d="M784.16 682L894.25 682"/>
    <path id="flow-8" class="flow" d="M784.16 719.67L894.4266 751.5051"/>
  </g>
  <g id="map-server-3">
    <!-- Kafka cylinder: left cap and right ellipse share rx=29.85, ry=54 about cy=1050.17. -->
    <path class="box" d="M74.15 996.17L313.15 996.17A29.85 54 0 0 1 313.15 1104.17L74.15 1104.17A29.85 54 0 0 1 74.15 996.17Z"/>
    <path class="box" fill="none" d="M313.15 996.17A29.85 54 0 0 0 313.15 1104.17"/>
    <text x="124" y="1064.33">Kafka</text>
    <path id="flow-9" class="flow" d="M343 1050.17L469.95 1050.17"/>
    <rect class="box" x="475.7" y="882.17" width="518.8" height="336"/>
    <text x="486.5" y="935.33">Aggregation Server 3</text>
    <rect class="box" x="517.51" y="1012.63" width="266.65" height="75.21"/>
    <text x="540.5" y="1064.33">Map process</text>
    <rect class="box" x="900" y="938.33" width="63.38" height="63.39"/>
    <rect class="box" x="900" y="1018.63" width="63.38" height="63.39"/>
    <rect class="box" x="900" y="1098.72" width="63.38" height="63.39"/>
    <!-- Fan-out leaves the map process box at its two right corners and at mid-height; each head stops on the square border. -->
    <path id="flow-10" class="flow" d="M784.16 1012.63L894.4267 980.783"/>
    <path id="flow-11" class="flow" d="M784.16 1050.17L894.25 1050.17"/>
    <path id="flow-12" class="flow" d="M784.16 1087.84L894.4266 1119.6751"/>
  </g>
  <!-- Reduce side: the partitions a server owns arrive as reduce input, merge in the reduce process, and leave as one reduce output. -->
  <g id="reduce-server-1">
    <rect class="box" x="1191.7" y="145.84" width="719.6" height="336"/>
    <text x="1369.5" y="199">Aggregation Server 1</text>
    <rect class="box" x="1222.71" y="160.3" width="63.46" height="63.3"/>
    <rect class="box" x="1222.71" y="240.38" width="63.46" height="63.3"/>
    <rect class="box" x="1222.71" y="320.5" width="63.46" height="63.3"/>
    <rect class="box" x="1222.71" y="400.6" width="63.46" height="63.3"/>
    <rect class="box" x="1393.71" y="276.3" width="316.78" height="75.2"/>
    <text x="1413" y="328">Reduce process</text>
    <rect class="box" x="1818.01" y="219.99" width="63.39" height="187.7"/>
    <!-- Fan-in: one shaft per owned partition, each head stopping on the reduce process left border. -->
    <path id="flow-13" class="flow" d="M1286.17 210.84L1389.1344 272.7317"/>
    <path id="flow-14" class="flow" d="M1286.17 277.61L1388.0403 297.1227"/>
    <path id="flow-15" class="flow" d="M1286.17 346L1388.0292 327.9342"/>
    <path id="flow-16" class="flow" d="M1286.17 413.03L1388.5705 353.446"/>
    <path id="flow-17" class="flow" d="M1710.49 313.84L1812.26 313.84"/>
  </g>
  <g id="reduce-server-2">
    <rect class="box" x="1191.7" y="514" width="719.6" height="336"/>
    <text x="1369.5" y="567.16">Aggregation Server 2</text>
    <rect class="box" x="1222.71" y="570" width="63.46" height="63.3"/>
    <rect class="box" x="1222.71" y="650" width="63.46" height="63.3"/>
    <rect class="box" x="1222.71" y="730.5" width="63.46" height="63.3"/>
    <rect class="box" x="1393.71" y="644.47" width="316.78" height="75.2"/>
    <text x="1413" y="696.16">Reduce process</text>
    <rect class="box" x="1818.01" y="588.15" width="63.39" height="187.7"/>
    <!-- Fan-in: one shaft per owned partition, each head stopping on the reduce process left border. -->
    <path id="flow-18" class="flow" d="M1286.17 613.46L1388.2505 652.0365"/>
    <path id="flow-19" class="flow" d="M1286.17 679.52L1387.9683 673.3153"/>
    <path id="flow-20" class="flow" d="M1286.17 748.48L1388.298 706.4951"/>
    <path id="flow-21" class="flow" d="M1710.49 682L1812.26 682"/>
  </g>
  <g id="reduce-server-3">
    <rect class="box" x="1191.7" y="882.17" width="719.6" height="336"/>
    <text x="1369.5" y="935.33">Aggregation Server 3</text>
    <rect class="box" x="1222.71" y="938" width="63.46" height="63.3"/>
    <rect class="box" x="1222.71" y="1098" width="63.46" height="63.3"/>
    <rect class="box" x="1393.71" y="1012.63" width="316.78" height="75.2"/>
    <text x="1413" y="1064.33">Reduce process</text>
    <rect class="box" x="1818.01" y="956.32" width="63.39" height="187.7"/>
    <!-- Fan-in: one shaft per owned partition, each head stopping on the reduce process left border. -->
    <path id="flow-22" class="flow" d="M1286.17 981.81L1388.258 1020.9308"/>
    <path id="flow-23" class="flow" d="M1286.17 1117.2L1388.2685 1077.3126"/>
    <path id="flow-24" class="flow" d="M1710.49 1050.17L1812.26 1050.17"/>
  </g>
  <!-- Shuffle: nine shafts carry the map-output partitions across the gap. Straight shafts keep a server's own partition; -->
  <!-- the six diagonals cross each other on purpose to show that partitions are redistributed between servers. -->
  <g id="shuffle">
    <path id="flow-25" class="flow" d="M994.5 313.84L1185.95 313.84"/>
    <path id="flow-26" class="flow" d="M994.5 682L1185.95 682"/>
    <path id="flow-27" class="flow" d="M994.5 1050.17L1185.95 1050.17"/>
    <path id="flow-28" class="flow" d="M994.5 394.6L1187.2126 580.6578"/>
    <path id="flow-29" class="flow" d="M989.16 481.84L1192.8054 876.9201"/>
    <path id="flow-30" class="flow" d="M994.5 594.66L1187.2582 403.0882"/>
    <path id="flow-31" class="flow" d="M994.5 757.32L1187.3961 966.083"/>
    <path id="flow-32" class="flow" d="M993.09 882.17L1188.4575 486.5437"/>
    <path id="flow-33" class="flow" d="M994.5 944.03L1187.0197 780.5634"/>
  </g>
</svg>
