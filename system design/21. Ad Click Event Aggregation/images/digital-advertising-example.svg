<svg xmlns="http://www.w3.org/2000/svg" width="1930" height="244" viewBox="0 0 1930 244" role="img" aria-labelledby="title desc">
  <title id="title">Digital advertising marketplace</title>
  <desc id="desc">Advertiser demand flows through a demand-side platform and ad exchange, while publisher supply flows through a supply-side platform toward the exchange.</desc>
  <!-- Reusable arrowhead and diagram styles match the PNG etalon. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#111"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .box{fill:#fff;stroke:#777;stroke-width:2.5}
      .group{fill:none;stroke:#777;stroke-width:2.5;stroke-dasharray:9 7}
      .flow{fill:none;stroke:#111;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1930" height="244" fill="#fff"/>

  <!-- Demand and supply boundaries. -->
  <rect class="group" x="30" y="32" width="730" height="188"/>
  <text x="395" y="65" font-size="34" text-anchor="middle">Demand Side</text>
  <rect class="group" x="1157" y="32" width="748" height="188"/>
  <text x="1531" y="65" font-size="34" text-anchor="middle">Supply Side</text>

  <!-- Demand flows right; supply flows left toward the exchange. -->
  <rect class="box" x="58" y="109" width="204" height="83"/>
  <text x="160" y="160" font-size="31" text-anchor="middle">Advertiser</text>
  <path class="flow" d="M262 151H363"/>
  <rect class="box" x="365" y="109" width="370" height="83"/>
  <text x="550" y="145" font-size="31" text-anchor="middle"><tspan x="550" dy="0">DSP</tspan><tspan x="550" dy="34">(Demand Side Platform)</tspan></text>
  <path class="flow" d="M735 151H823"/>
  <rect class="box" x="825" y="109" width="257" height="83"/>
  <text x="954" y="160" font-size="31" text-anchor="middle">Ad Exchange</text>

  <path class="flow" d="M1202 151H1084"/>
  <rect class="box" x="1202" y="109" width="349" height="83"/>
  <text x="1377" y="145" font-size="31" text-anchor="middle"><tspan x="1377" dy="0">SSP</tspan><tspan x="1377" dy="34">(Supply Side Platform)</tspan></text>
  <path class="flow" d="M1673 151H1553"/>
  <rect class="box" x="1673" y="109" width="204" height="83"/>
  <text x="1775" y="160" font-size="31" text-anchor="middle">Publisher</text>
</svg>
