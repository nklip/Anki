<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="1018" viewBox="0 0 1328 1018" role="img" aria-labelledby="title desc">
  <title id="title">Data duplication failure mode</title>
  <desc id="desc">The aggregator consumes offsets one hundred through one hundred ten and sends the aggregate downstream. Failure before acknowledging offset one hundred ten makes the data run again.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}
    .box{fill:#fff;stroke:#111;stroke-width:2.7}
    .line{fill:none;stroke:#111;stroke-width:2.7}
    .dash{fill:none;stroke:#111;stroke-width:2.7;stroke-dasharray:10 9}
  </style>
  <rect width="1328" height="1018" fill="#fff"/>
  <!-- Sequence participants. -->
  <rect class="box" x="45" y="36" width="291" height="116" rx="18"/>
  <text x="190.5" y="83" font-size="39" text-anchor="middle"><tspan x="190.5">Upstream</tspan><tspan x="190.5" dy="46">(Kafka)</tspan></text>
  <rect class="box" x="528" y="36" width="289" height="116" rx="18"/>
  <text x="672.5" y="106" font-size="39" text-anchor="middle">Aggregator</text>
  <rect class="box" x="1004" y="36" width="290" height="116" rx="18"/>
  <text x="1149" y="83" font-size="39" text-anchor="middle"><tspan x="1149">Downstream</tspan><tspan x="1149" dy="46">(Kafka)</tspan></text>
  <!-- Dashed lifelines and activation bars. -->
  <path class="dash" d="M189 152V272M189 852V1000"/>
  <path class="dash" d="M673 152V329"/>
  <path class="dash" d="M1147 152V704M1147 817V1000"/>
  <rect class="box" x="175" y="272" width="30" height="580"/>
  <rect class="box" x="658" y="329" width="29" height="523"/>
  <rect class="box" x="1132" y="704" width="30" height="113"/>
  <!-- All six heads are symmetric 21-by-22 triangles. Noses meet the outside
       of the 2.7-unit activation strokes; shaft ends sit inside the triangle bases. -->
  <!-- 1. Poll events: the arrow points from the aggregator to upstream. -->
  <path class="line" data-connector="true" d="M656.65 331H226.6"/>
  <polygon points="206.35,331 227.35,320 227.35,342" fill="#111"/>
  <text x="438" y="318" font-size="40" text-anchor="middle">1. Poll events</text>
  <!-- 2. Consume events beginning at offset 100. -->
  <path class="line" data-connector="true" d="M206.35 444H636.4"/>
  <polygon points="656.65,444 635.65,433 635.65,455" fill="#111"/>
  <text x="429" y="381" font-size="40" text-anchor="middle"><tspan x="429">2. Consume from</tspan><tspan x="429" dy="48">offset 100</tspan></text>
  <!-- 3. Local aggregation loop for offsets 100 through 110. -->
  <path class="line" data-connector="true" d="M688.35 495C810 495 890 510 890 539C890 575 800 585 708.6 585"/>
  <polygon points="688.35,585 709.35,574 709.35,596" fill="#111"/>
  <text x="891" y="433" font-size="40" text-anchor="middle"><tspan x="891">3. Aggregate events</tspan><tspan x="891" dy="48">from 100 to 110</tspan></text>
  <!-- 4. Send the aggregate downstream. -->
  <path class="line" data-connector="true" d="M688.35 704H1110.4"/>
  <polygon points="1130.65,704 1109.65,693 1109.65,715" fill="#111"/>
  <text x="912" y="641" font-size="40" text-anchor="middle"><tspan x="912">4. Send aggregated</tspan><tspan x="912" dy="48">result</tspan></text>
  <!-- 5. Downstream acknowledgement. -->
  <path class="line" data-connector="true" d="M1130.65 817H708.6"/>
  <polygon points="688.35,817 709.35,806 709.35,828" fill="#111"/>
  <text x="914" y="802" font-size="40" text-anchor="middle">5. Ack back</text>
  <!-- 6. Upstream acknowledgement; the X marks the failure point. -->
  <path class="line" data-connector="true" d="M656.65 852H630M574 852H226.6"/>
  <polygon points="206.35,852 227.35,841 227.35,863" fill="#111"/>
  <text x="432" y="790" font-size="40" text-anchor="middle"><tspan x="432">6. Ack upstream</tspan><tspan x="432" dy="48">with offset 110</tspan></text>
  <text x="602" y="860" font-size="46" text-anchor="middle">X</text>
  <text x="601" y="910" font-size="39" text-anchor="middle"><tspan x="601">Data duplication</tspan><tspan x="601" dy="43">if the system fails at step 6</tspan><tspan x="601" dy="43">and consumes again from offset 100</tspan></text>
</svg>
