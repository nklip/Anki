<svg xmlns="http://www.w3.org/2000/svg" width="1508" height="986" viewBox="0 0 1508 986" role="img" aria-labelledby="double-booking-single-user-title double-booking-single-user-desc">
  <title id="double-booking-single-user-title">One user double-books by clicking twice</title>
  <desc id="double-booking-single-user-desc">A single user clicks the reserve button twice. Each click issues the same INSERT INTO RESERVATION statement with identical values: hotel 121, room type 2, 3 rooms, 2021-06-01 to 2021-06-04, status pending_pay, guest1. Nothing distinguishes the two requests, so both inserts succeed and the reservation table ends up with two identical rows, row 1 and row 2, for the same stay. The reservation schema on the right lists reservation_id as the primary key, followed by hotel_id, room_type_id, start_date, end_date, status and guest_id.</desc>
  <defs>
    <marker id="head-flow" viewBox="0 0 17.2 14.4" refX="17.2" refY="7.2" markerWidth="17.2" markerHeight="14.4" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 17.2 7.2 0 14.4Z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:30.5px;fill:#000}
      .node{fill:none;stroke:#000;stroke-width:2}
      .line{fill:none;stroke:#000;stroke-width:1.88}
      .flow{fill:none;stroke:#000;stroke-width:1.88;marker-end:url(#head-flow)}
      .rows{fill:none;stroke:#000;stroke-width:1.75;stroke-dasharray:10 5.05}
      .actor{fill:#000}
      .schema{fill:none;stroke:#b9c0c1;stroke-width:3.2}
      .field{font-size:24.5px}
      .key{font-size:24.5px;font-weight:bold}
    </style>
  </defs>
  <rect id="background" width="1508" height="986" fill="#fff"/>

  <!-- The same user clicks twice; each column is one click, and the two are indistinguishable. -->
  <g id="click-first">
    <text id="label-click-first" x="163" y="50">User’s first click</text>
    <g id="actor-first" class="actor">
      <circle cx="268" cy="72.5" r="14.5"/>
      <path d="M238 118.5V111.8A30 16.16 0 0 1 298 111.8V118.5Z"/>
    </g>
    <!-- The click reaches the statement; no arrowhead here in the source. -->
    <path id="click-first-to-stmt" class="line" d="M267.83 118.5V299.59"/>
    <rect id="stmt-first-box" class="node" x="41" y="299.59" width="438" height="335.22"/>
    <text id="stmt-first">
      <tspan x="54" y="339" font-size="29">INSERT INTO RESERVATION (</tspan>
      <tspan x="54" y="373">121,</tspan>
      <tspan x="55" y="408">2,</tspan>
      <tspan x="55" y="443">3,</tspan>
      <tspan x="55" y="477">2021-06-01,</tspan>
      <tspan x="55" y="512">2021-06-04,</tspan>
      <tspan x="55" y="547">pending_pay,</tspan>
      <tspan x="55" y="581">guest1</tspan>
      <tspan x="53" y="616">)</tspan>
    </text>
    <path id="stmt-first-to-rows" class="flow" d="M267.83 634.81V813.2"/>
  </g>
  <g id="click-second">
    <text id="label-click-second" x="774" y="50">User’s second click</text>
    <g id="actor-second" class="actor">
      <circle cx="904.5" cy="72.5" r="14.5"/>
      <path d="M874.5 118.5V111.8A30 16.16 0 0 1 934.5 111.8V118.5Z"/>
    </g>
    <!-- The click reaches the statement; no arrowhead here in the source. -->
    <path id="click-second-to-stmt" class="line" d="M905.56 118.5V299.59"/>
    <rect id="stmt-second-box" class="node" x="676.5" y="299.59" width="438" height="335.22"/>
    <text id="stmt-second">
      <tspan x="689.5" y="339" font-size="29">INSERT INTO RESERVATION (</tspan>
      <tspan x="689.5" y="373">121,</tspan>
      <tspan x="690.5" y="408">2,</tspan>
      <tspan x="690.5" y="443">3,</tspan>
      <tspan x="690.5" y="477">2021-06-01,</tspan>
      <tspan x="690.5" y="512">2021-06-04,</tspan>
      <tspan x="690.5" y="547">pending_pay,</tspan>
      <tspan x="690.5" y="581">guest1</tspan>
      <tspan x="688.5" y="616">)</tspan>
    </text>
    <path id="stmt-second-to-rows" class="flow" d="M905.56 634.81V813.2"/>
  </g>

  <!-- Both inserts land, so the table ends up holding two identical rows for the same stay. -->
  <rect id="inserted-rows" class="rows" x="116.07" y="815.93" width="925.18" height="144.56" stroke-dashoffset="1.07"/>
  <text id="inserted-rows-text"><tspan x="151.5" y="873">row 1: 121, 2, 3, 2021-06-01, 2021-06-04, pending_pay, guest1</tspan><tspan x="151.5" y="926">row 2: 121, 2, 3, 2021-06-01, 2021-06-04, pending_pay, guest1</tspan></text>

  <!-- reservation schema for reference; reservation_id is the key, separated by its own rule. -->
  <g id="schema-reservation">
    <rect class="schema" x="1233.1" y="19.9" width="235" height="360"/>
    <path class="schema" d="M1233.1 62.97H1468.1"/>
    <path class="schema" d="M1233.1 112.35H1468.1"/>
    <text class="key" x="1284.5" y="50">reservation</text>
    <text class="key" x="1243" y="99">reservation_id</text>
    <text class="field" x="1244" y="146">hotel_id</text>
    <text class="field" x="1244" y="182">room_type_id</text>
    <text class="field" x="1244" y="218">start_date</text>
    <text class="field" x="1244" y="253">end_date</text>
    <text class="field" x="1244" y="289">status</text>
    <text class="field" x="1244" y="325">guest_id</text>
  </g>
</svg>
