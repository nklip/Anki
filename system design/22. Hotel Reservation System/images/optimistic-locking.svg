<svg xmlns="http://www.w3.org/2000/svg" width="1938" height="1142" viewBox="0 0 1938 1142" role="img" aria-labelledby="optimistic-title optimistic-desc">
  <title id="optimistic-title">Optimistic locking with and without a version conflict</title>
  <desc id="optimistic-desc">The left panel shows sequential optimistic-locking updates: user 1 reads version 1 and writes version 2, then user 2 reads version 2 and writes version 3, so there is no conflict. The right panel shows both users reading version 1; after user 1 writes version 2, user 2 attempts another version 2 write and receives a conflict.</desc>
  <defs>
    <marker id="head-flow" viewBox="0 0 22 17" refX="22" refY="8.5" markerWidth="22" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 22 8.5 0 17Z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:40px;fill:#000}
      .panel{fill:none;stroke:#000;stroke-width:2.3;stroke-dasharray:12 8}
      .version{fill:#fff;stroke:#000;stroke-width:2.3}
      .shaft{fill:none;stroke:#000;stroke-width:2.3}
      .flow{fill:none;stroke:#000;stroke-width:2.3;marker-end:url(#head-flow)}
      .conflict-flow{fill:none;stroke:#000;stroke-width:2.3;stroke-dasharray:10 8;marker-end:url(#head-flow)}
      .user-label{font-size:39px}
      .outcome{font-size:40px}
      .success-mark{fill:#3897fa}
      .error-mark{fill:#ee451d}
    </style>
  </defs>
  <rect id="background" width="1938" height="1142" fill="#fff"/>

  <!-- Dashed panels separate the successful sequence from the conflicting one. -->
  <rect id="no-conflict-panel" class="panel" x="33.5" y="29" width="873" height="1087"/>
  <rect id="conflict-panel" class="panel" x="979.5" y="29" width="927" height="1087"/>

  <!-- Reusable-looking user silhouettes are kept as explicit groups for easy repositioning. -->
  <g id="left-user-1">
    <circle cx="107" cy="332.5" r="18.5" fill="#000"/>
    <path d="M69 389V380.5A38 18.5 0 0 1 145 380.5V389Z" fill="#000"/>
    <text class="user-label" x="53" y="427">User 1</text>
  </g>
  <g id="left-user-2">
    <circle cx="837" cy="676.5" r="18.5" fill="#000"/>
    <path d="M799 733V724.5A38 18.5 0 0 1 875 724.5V733Z" fill="#000"/>
    <text class="user-label" x="783" y="771">User 2</text>
  </g>
  <g id="right-user-1">
    <circle cx="1053" cy="332.5" r="18.5" fill="#000"/>
    <path d="M1015 389V380.5A38 18.5 0 0 1 1091 380.5V389Z" fill="#000"/>
    <text class="user-label" x="999" y="427">User 1</text>
  </g>
  <g id="right-user-2">
    <circle cx="1827" cy="309" r="18.5" fill="#000"/>
    <path d="M1789 365.5V357A38 18.5 0 0 1 1865 357V365.5Z" fill="#000"/>
    <text class="user-label" x="1771" y="403">User 2</text>
  </g>

  <!-- Left version chain: v1 to v2 to v3, then a successful outcome. -->
  <g id="left-version-chain">
    <path class="shaft" d="M476.5 70V142"/>
    <path class="shaft" d="M476.5 218V484"/>
    <path class="shaft" d="M476.5 560V826"/>
    <path id="leftVersionOutcomeArrow" class="flow" d="M476.5 902V1018"/>
    <circle class="version" cx="477" cy="180" r="38"/>
    <circle class="version" cx="477" cy="522" r="38"/>
    <circle class="version" cx="477" cy="864" r="38"/>
    <text x="457" y="195">v1</text>
    <text x="457" y="537">v2</text>
    <text x="457" y="879">v3</text>
  </g>

  <!-- User 1 reads v1 and writes v2. Labels sit in deliberate connector gaps. -->
  <g id="left-user-1-operations">
    <path class="shaft" d="M442 196 362 236"/>
    <text x="226" y="282">Read v1</text>
    <path id="leftUser1ReadArrow" class="flow" d="M230 302 146 342"/>
    <path class="shaft" d="M145 368 226 406"/>
    <text x="227" y="451"><tspan x="227">Write</tspan><tspan x="342">v2</tspan></text>
    <path id="leftUser1WriteArrow" class="flow" d="M397 474 441 505"/>
  </g>

  <!-- User 2 starts from v2, so the next write can advance safely to v3. -->
  <g id="left-user-2-operations">
    <path class="shaft" d="M513 540 582 573"/>
    <text x="578" y="621"><tspan x="578">Read</tspan><tspan x="680">v2</tspan></text>
    <path id="leftUser2ReadArrow" class="flow" d="M735 640 800 682"/>
    <path class="shaft" d="M800 722 708 751"/>
    <text x="570" y="800">Write v3</text>
    <path id="leftUser2WriteArrow" class="flow" d="M575 817 513 848"/>
  </g>

  <!-- Blue check and text reproduce the successful result callout. -->
  <g id="no-conflict-outcome">
    <text class="success-mark" x="329" y="1080" font-size="58" font-weight="bold">✓</text>
    <text class="outcome" x="386" y="1070">No conflict</text>
  </g>

  <!-- Right version chain stays at v2 after the stale write is rejected. -->
  <g id="right-version-chain">
    <path class="shaft" d="M1421.5 70V142"/>
    <path class="shaft" d="M1421.5 218V484"/>
    <path class="shaft" d="M1421.5 560V826"/>
    <path id="rightVersionOutcomeArrow" class="flow" d="M1421.5 902V1018"/>
    <circle class="version" cx="1422" cy="180" r="38"/>
    <circle class="version" cx="1422" cy="522" r="38"/>
    <circle class="version" cx="1422" cy="864" r="38"/>
    <text x="1402" y="195">v1</text>
    <text x="1402" y="537">v2</text>
    <text x="1402" y="879">v2</text>
  </g>

  <!-- User 1 performs the winning v1-to-v2 update. -->
  <g id="right-user-1-operations">
    <path class="shaft" d="M1387 196 1308 236"/>
    <text x="1172" y="282">Read v1</text>
    <path id="rightUser1ReadArrow" class="flow" d="M1176 302 1092 342"/>
    <path class="shaft" d="M1091 368 1172 406"/>
    <text x="1173" y="451"><tspan x="1173">Write</tspan><tspan x="1288">v2</tspan></text>
    <path id="rightUser1WriteArrow" class="flow" d="M1343 474 1387 505"/>
  </g>

  <!-- User 2 also reads v1, but its later write is based on a stale version. -->
  <g id="right-user-2-operations">
    <path class="shaft" d="M1458 195 1533 220"/>
    <text x="1545" y="262">Read v1</text>
    <path id="rightUser2ReadArrow" class="flow" d="M1696 277 1787 312"/>
    <path class="shaft" d="M1807 420 1647 601"/>
    <text x="1550" y="647">Write v2</text>
    <path id="rightUser2WriteArrow" class="flow" d="M1592 668 1450 837"/>
  </g>

  <!-- The dashed return loop makes the rejected stale-version write explicit. -->
  <g id="version-conflict-loop">
    <path class="shaft" stroke-dasharray="10 8" d="M1388 846C1334 818 1290 772 1274 724"/>
    <text x="1204" y="705">Conflict</text>
    <path id="versionConflictArrow" class="conflict-flow" d="M1275 654C1292 600 1330 565 1389 540"/>
  </g>

  <!-- Red X and text identify the rejected update. -->
  <g id="conflict-outcome">
    <text class="error-mark" x="1312" y="1084" font-size="58" font-weight="bold">X</text>
    <text class="outcome" x="1359" y="1083">Conflict</text>
  </g>
</svg>
