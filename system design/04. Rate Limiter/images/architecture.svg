<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1106" viewBox="0 0 1470 1106" role="img" aria-labelledby="title desc">
  <title id="title">Rate limiter system architecture</title>
  <desc id="desc">A client sends requests through rate limiter middleware. Successful requests reach API servers. Workers refresh cached rules, and the middleware exchanges data with Redis. Limited requests receive HTTP 429 and may be dropped or queued.</desc>

  <!-- Shared symbols and reference colors. Arrow noses project four units beyond shaft endpoints. -->
  <defs>
    <marker id="blue-arrow" markerWidth="23" markerHeight="22" viewBox="0 0 23 22" refX="19" refY="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L23 11L0 22L6 11Z" fill="#246f99"/>
    </marker>
    <marker id="red-arrow" markerWidth="23" markerHeight="22" viewBox="0 0 23 22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L23 11L0 22L6 11Z" fill="#f82438"/>
    </marker>
    <symbol id="laptop" viewBox="0 0 60 43">
      <path d="M5 33V7Q5 3 9 3H51Q55 3 55 7V33" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <rect x="0.5" y="37" width="59" height="5" rx="2.5" fill="#111"/>
      <rect x="24" y="38" width="13" height="2" rx="1" fill="#fefefe"/>
    </symbol>
    <symbol id="phone" viewBox="0 0 39 57">
      <rect x="2" y="2" width="35" height="53" rx="3.5" fill="none" stroke="#444" stroke-width="3"/>
      <path d="M3 10H36M3 47H36M16 6H23M18 51H21" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="server-cluster" viewBox="0 0 94 78">
      <g fill="#6abd25">
        <rect x="16" width="29" height="18" rx="1"/><rect x="48" width="29" height="18" rx="1"/>
        <rect y="21" width="29" height="55" rx="1"/><rect x="32" y="21" width="29" height="55" rx="1"/><rect x="64" y="21" width="29" height="55" rx="1"/>
      </g>
      <path d="M20 8H41M52 8H73M4 29H25M36 29H57M68 29H89M4 62H25M36 62H57M68 62H89M4 70H25M36 70H57M68 70H89" fill="none" stroke="#fefefe" stroke-width="2.5"/>
    </symbol>
    <symbol id="envelope" viewBox="0 0 56 46">
      <rect x="2.5" y="2.5" width="51" height="41" rx="1.5" fill="none" stroke="#0874a6" stroke-width="5"/>
      <path d="M4 4L28 26L52 4" fill="none" stroke="#0874a6" stroke-width="4.5" stroke-linejoin="round"/>
    </symbol>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .node-outline { fill: none; stroke: #00b2cd; stroke-width: 3.5; }
      .blue-flow { fill: none; stroke: #246f99; stroke-width: 3.5; }
      .red-flow { fill: none; stroke: #f82438; stroke-width: 3.5; }
      .limited-label { fill: #f82438; font-size: 25px; }
    </style>
    <!-- Official Redis mark, reused verbatim from 25. Real-time Gaming Leaderboard/images/hash-partition.svg. -->
    <symbol id="redis-cube" viewBox="17 0 95 81" preserveAspectRatio="xMidYMid meet">
      <path fill="#A41E11" d="M106.9 62.7c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.4-2.1-31.7-13.1-36.7-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c.1.9-1 1.9-3.5 3.2z"/>
      <path fill="#D82C20" d="M106.9 53.3c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8C53.5 68 26.2 57 21.2 54.6c-4.9-2.4-5-4-.2-5.9 4.8-1.9 32.1-12.6 37.8-14.6 5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 30.5 12 35.3 13.7 5 1.8 5.2 3.2.2 5.8z"/>
      <path fill="#A41E11" d="M106.9 47.4c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.4-2.1-31.7-13.2-36.7-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c.1.9-1 1.9-3.5 3.2z"/>
      <path fill="#D82C20" d="M106.9 38c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5-4.9-2.4-5-4-.2-5.9 4.8-1.9 32.1-12.6 37.8-14.6 5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 30.5 12 35.3 13.7 4.9 1.7 5.1 3.2.1 5.8z"/>
      <path fill="#A41E11" d="M106.9 31.5c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5-2.5-1.2-3.8-2.2-3.8-3.1v-9.4s35.6-7.8 41.4-9.8c5.8-2.1 7.8-2.1 12.6-.3 4.9 1.8 34.2 7.1 39 8.8v9.3c0 .8-1.1 1.9-3.6 3.2z"/>
      <path fill="#D82C20" d="M106.9 22.1c-5 2.6-30.7 13.2-36.2 16-5.5 2.9-8.5 2.8-12.8.8-4.3-2.1-31.7-13.1-36.6-15.5s-5-4-.2-5.9c4.8-1.9 32.1-12.6 37.8-14.6C64.7.8 66.7.8 71.5 2.6c4.9 1.8 30.5 12 35.3 13.7 4.9 1.7 5.1 3.2.1 5.8z"/>
      <path fill="#fff" d="M76.2 13l-8.1.8-1.8 4.4-2.9-4.9-9.3-.8L61 10l-2-3.8 6.5 2.5 6.1-2-1.7 4zM65.8 34.1l-15-6.3 21.6-3.3z"/>
      <ellipse fill="#fff" cx="45" cy="19.9" rx="11.5" ry="4.5"/>
      <path fill="#7A0C00" d="M85.7 14.2l12.8 5-12.8 5.1z"/>
      <path fill="#AD2115" d="M71.6 19.8l14.1-5.6v10.1l-1.3.5z"/>
    </symbol>
  </defs>
  <rect width="1470" height="1106" fill="#fefefe"/>

  <!-- Client and middleware; the incoming arrow meets the left vertex of the hexagon. -->
  <rect id="client" class="node-outline" x="34" y="442" width="233" height="115" rx="18"/>
  <text x="41" y="478" font-size="29">Client</text>
  <use href="#laptop" x="120" y="477" width="60" height="43"/>
  <use href="#phone" x="201" y="468" width="39" height="57"/>
  <path id="client-request" class="blue-flow" d="M267 499H491" marker-end="url(#blue-arrow)"/>
  <path id="middleware" class="node-outline" d="M551 426H658L713 498L658 570H551L497 498Z"/>
  <text x="604" y="491" text-anchor="middle" font-size="28">Rate limiter</text>
  <text x="604" y="524" text-anchor="middle" font-size="28">middleware</text>

  <!-- Three blue routes share the middleware vertex. Redis has a head at both ends, as in the PNG. -->
  <path id="cache-branch" class="blue-flow" d="M713 498L1005.8 284.4" marker-end="url(#blue-arrow)"/>
  <path id="api-branch" class="blue-flow" d="M713 497.5H976.25" marker-end="url(#blue-arrow)"/>
  <path id="redis-branch" class="blue-flow" d="M716.3 500.2L1002.7 689.8" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text x="856" y="487" text-anchor="middle" font-size="24" style="fill: #008d00">success</text>

  <!-- Cached-rules tile: the darker lower lip sits behind the blue face. -->
  <rect id="cache-shadow" x="1009" y="230" width="107" height="108" rx="19" fill="#00547d"/>
  <rect id="cache" x="1009" y="226" width="107" height="107" rx="18" fill="#0074bc"/>
  <text x="0" y="0" transform="translate(1062.5 261) scale(0.88 1)" text-anchor="middle" font-size="32" stroke="#fefefe" stroke-width="0.6" stroke-linejoin="round" paint-order="stroke fill" style="fill: #fefefe; font-family: Arial Narrow, Arial, sans-serif">CACHE</text>
  <text x="1062.5" y="378" text-anchor="middle" font-size="27">Cached rules</text>

  <!-- Workers fetch rules above and refresh the cache to the left. -->
  <rect id="workers" class="node-outline" x="1250" y="211" width="128" height="144" rx="21" stroke-dasharray="10 11"/>
  <use href="#server-cluster" x="1266.5" y="222.5" width="94" height="78"/>
  <text x="1312" y="336" text-anchor="middle" font-size="23">Workers</text>
  <path id="workers-to-cache" class="blue-flow" d="M1250 282.5H1120" marker-end="url(#blue-arrow)"/>
  <rect id="rules" class="node-outline" x="1222" y="14.5" width="184" height="90" rx="14"/>
  <text x="1313" y="69" text-anchor="middle" font-size="28">Rules</text>
  <path id="workers-to-rules" class="blue-flow" d="M1313.5 211V110.25" marker-end="url(#blue-arrow)"/>

  <!-- Successful requests reach the API server cluster. -->
  <rect id="api-servers" class="node-outline" x="982" y="426" width="161" height="144" rx="21" stroke-dasharray="10 11"/>
  <use href="#server-cluster" x="1003.5" y="437" width="94" height="78"/>
  <text x="1063" y="553" text-anchor="middle" font-size="26">API Servers</text>

  <!-- Redis is intentionally exempt from PNG artwork matching: preserve the existing official mark and footprint. -->
  <g aria-label="Redis">
    <use href="#redis-cube" x="1011" y="632" width="104" height="89"/>
  </g>
  <text x="1062" y="758" text-anchor="middle" font-size="26">Redis</text>

  <!-- Limited requests return HTTP 429 along a continuous route with a rounded lower corner. -->
  <path id="rate-limited-down" class="red-flow" d="M605 570V837.5"/>
  <text x="615" y="704" class="limited-label">rate limited</text>
  <path id="response-429" class="red-flow" d="M605 837.5H155Q137.5 837.5 137.5 820V562.75" marker-end="url(#red-arrow)"/>
  <text x="222" y="883" class="limited-label">429: too many requests</text>

  <!-- Dashed fallback options branch at the same point; labels remain clear of both routes. -->
  <path id="drop-option" class="red-flow" d="M605 837.5H1022" stroke-dasharray="11 10" stroke-dashoffset="-5" marker-end="url(#red-arrow)"/>
  <text x="841" y="824" text-anchor="middle" font-size="25">option 1</text>
  <path id="dropped-request" d="M1062.5 784L1037 810C1015 833 1030 870 1062.5 871C1095 870 1110 833 1088 810Z" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="1063" y="914" text-anchor="middle" font-size="26">Request dropped</text>

  <path id="queue-option" class="red-flow" d="M605 837.5L961.5 1031.1" stroke-dasharray="11 10" marker-end="url(#red-arrow)"/>
  <!-- A short terminal shaft joins the last dash to the concave queue arrowhead. -->
  <path id="queue-head-join" class="red-flow" d="M946 1022.68L956 1028.11"/>
  <text x="793" y="918" font-size="25" transform="rotate(28.5 793 918)">option 2</text>
  <!-- Queue outline and large envelope symbols match the reference's three-message queue. -->
  <path id="message-queue" d="M973 1000.5H1161L1179 1033.5L1161 1066H973Q966.5 1066 966.5 1059.5V1007Q966.5 1000.5 973 1000.5Z" fill="none" stroke="#0874a6" stroke-width="4"/>
  <use href="#envelope" x="976" y="1011" width="56" height="46"/>
  <use href="#envelope" x="1037" y="1011" width="56" height="46"/>
  <use href="#envelope" x="1099" y="1011" width="56" height="46"/>
  <text x="1072" y="1094" text-anchor="middle" font-size="25">Message queue</text>
</svg>
