<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1112" viewBox="0 0 1344 1112" role="img" aria-labelledby="title desc">
  <title id="title">Token bucket rate-limiting algorithm</title>
  <desc id="desc">A refiller adds tokens to a bucket. Each incoming request consumes a token; requests are forwarded when tokens remain and dropped when the bucket is empty.</desc>

  <!-- Shared palette and editable coin relief, matching the PNG's gold tokens. -->
  <defs>
    <linearGradient id="coin-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d88d"/><stop offset="0.5" stop-color="#dfad4b"/><stop offset="1" stop-color="#c59035"/>
    </linearGradient>
    <linearGradient id="coin-face" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#f2cb6b"/><stop offset="1" stop-color="#f8c65f"/>
    </linearGradient>
    <symbol id="token" viewBox="0 0 48 40">
      <ellipse cx="24" cy="25" rx="22" ry="16" fill="#ddddcf" opacity="0.35"/>
      <ellipse cx="24" cy="23" rx="21.5" ry="15.5" fill="#cbbb94" opacity="0.4"/>
      <ellipse cx="24" cy="21" rx="21" ry="15.5" fill="url(#coin-edge)"/>
      <ellipse cx="24" cy="18" rx="20" ry="14" fill="url(#coin-face)" stroke="#dcb567" stroke-width="1.5"/>
      <ellipse cx="24" cy="18" rx="17.5" ry="11.5" fill="none" stroke="#ffe09a" stroke-width="1.7"/>
      <path d="M20 9Q27 6 29 11L28 15Q27 17 29 18L30 23Q25 25 16 23L16 20Q20 16 19 14Z" fill="#f2c45f" stroke="#e2b754" stroke-width="1.2"/>
      <path d="M20 9Q18 11 20 14L19 17L16 20V23Q22 25 29 23" fill="none" stroke="#fadd8b" stroke-width="1.5"/>
    </symbol>
    <symbol id="request" viewBox="0 0 58 39"><rect width="58" height="39" fill="#a0c4ec"/></symbol>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-size: 30px; fill: #000; }
      .group-outline { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 6 6; }
      .flow-shaft { fill: none; stroke: #000; stroke-width: 4; }
    </style>
  </defs>

  <!-- Preserve the reference canvas and its almost-white artwork area. -->
  <rect width="1344" height="1112" fill="#fff"/>
  <rect x="48" y="70" width="1178" height="1042" fill="#fefefe"/>

  <!-- Refiller; the outlined arrow nose meets the bucket enclosure's top edge. -->
  <path id="refiller-arrow" d="M607.5 71.5H667V260.5H688L637 299.5L586 260.5H607.5Z" fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#token" x="613" y="101" width="48" height="40"/>
  <use href="#token" x="615" y="158" width="48" height="40"/>
  <use href="#token" x="615" y="210" width="48" height="40"/>
  <text x="671" y="195">refiller</text>

  <!-- Bucket body first, then the full rim and the handle crossing its right wall. -->
  <rect id="bucket-enclosure" class="group-outline" x="474" y="301" width="308" height="520" rx="48"/>
  <g id="bucket" fill="none" stroke="#007500" stroke-width="9" stroke-linejoin="round">
    <path id="bucket-body" d="M535.5 356L558 525C563 553 704 553 713 525L736 356"/>
    <ellipse id="bucket-rim" cx="635.5" cy="355.5" rx="100" ry="30.5"/>
    <path id="bucket-handle" d="M641 418C682 438 735 460 748 453C756 448 737 437 726 431" stroke-width="8" stroke-linecap="round"/>
    <circle id="handle-rivet" cx="636" cy="415.5" r="6.5" stroke-width="7"/>
  </g>

  <!-- Admission decision within the dashed bucket enclosure. -->
  <path id="admission-decision" d="M630 590L762 696L630 802L498 696Z" fill="none" stroke="#000" stroke-width="2"/>
  <text x="630" y="705" text-anchor="middle">enough tokens?</text>

  <!-- Incoming request burst. -->
  <rect id="incoming-requests" class="group-outline" x="49" y="596" width="232" height="193" rx="30"/>
  <use href="#request" x="87.5" y="653.5" width="58" height="39"/>
  <use href="#request" x="165" y="615" width="58" height="39"/>
  <use href="#request" x="165" y="673" width="58" height="39"/>
  <use href="#request" x="87.5" y="711.5" width="58" height="39"/>
  <use href="#request" x="165" y="730.5" width="58" height="39"/>
  <text x="164" y="843" text-anchor="middle">requests</text>
  <!-- Each shaft ends beneath the broad part of its head, before the tapered nose. -->
  <path id="incoming-flow" class="flow-shaft" d="M281 692H466"/>
  <path id="incoming-arrowhead" d="M449 680L474 692L449 704L455 692Z" fill="#000"/>

  <!-- Admitted requests are paired with consumed tokens. -->
  <path id="forward-flow" class="flow-shaft" d="M782 696L1121 694"/>
  <path id="forward-arrowhead" d="M1105 682L1129 694L1105 706L1111 694Z" fill="#000"/>
  <text x="954" y="645" text-anchor="middle">yes,</text>
  <text x="954" y="679" text-anchor="middle">forward requests</text>
  <rect id="forwarded-requests" class="group-outline" x="1129" y="553" width="96" height="308" rx="18"/>
  <use href="#token" x="1152" y="578" width="48" height="40"/>
  <use href="#request" x="1148" y="617" width="58" height="39"/>
  <use href="#token" x="1152" y="668" width="48" height="40"/>
  <use href="#request" x="1148" y="707" width="58" height="39"/>
  <use href="#token" x="1152" y="758" width="48" height="40"/>
  <use href="#request" x="1148" y="796" width="58" height="39"/>

  <!-- Empty-bucket rejection; the vertical arrow ends at the dropped-request group. -->
  <path id="drop-flow" class="flow-shaft" d="M624 821V1008"/>
  <path id="drop-arrowhead" d="M612 992L624 1016L636 992L624 998Z" fill="#000"/>
  <text x="733" y="910" text-anchor="middle">no,</text>
  <text x="733" y="945" text-anchor="middle">drop requests</text>
  <rect id="dropped-requests" class="group-outline" x="537" y="1016" width="174" height="67" rx="13"/>
  <rect x="551" y="1029.5" width="58" height="38.5" fill="#cecece"/>
  <rect x="637.5" y="1029.5" width="58" height="38.5" fill="#cecece"/>
</svg>
