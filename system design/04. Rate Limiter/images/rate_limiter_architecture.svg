<svg xmlns="http://www.w3.org/2000/svg" width="1274" height="494" viewBox="0 0 1274 494" role="img" aria-labelledby="title desc">
  <title id="title">Rate limiter between clients and API servers</title>
  <desc id="desc">Client requests pass through a rate limiter. Allowed requests reach the API servers, while excess requests receive an HTTP 429 response.</desc>

  <!-- Reusable arrowheads and compact infrastructure icons. -->
  <defs>
    <marker id="blue-arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="0" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L12 6.5L0 12Z" fill="#2e80b7"/></marker>
    <marker id="red-arrow" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="0" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L12 6.5L0 12Z" fill="#ff2b2b"/></marker>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
    <symbol id="phone" viewBox="0 0 54 96"><rect x="5" y="2" width="44" height="90" rx="7" fill="white" stroke="#333" stroke-width="5"/><path d="M19 11H35M23 82H31" stroke="#333" stroke-width="3"/></symbol>
    <symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#5dcc11"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>

  <rect width="1274" height="494" fill="white"/>

  <!-- Client devices. -->
  <rect x="12" y="157" width="300" height="151" rx="24" fill="white" stroke="#08b7d1" stroke-width="4"/>
  <text x="30" y="210" font-family="Arial, sans-serif" font-size="34">Client</text>
  <use href="#laptop" x="111" y="207" width="92" height="59"/>
  <use href="#phone" x="226" y="194" width="46" height="82"/>

  <!-- Allowed requests stop at the arrowhead bases before entering the gate and server pool. -->
  <path id="request-1" d="M312 184H655" fill="none" stroke="#2e80b7" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path id="request-2" d="M312 218H655" fill="none" stroke="#2e80b7" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path id="request-3" d="M312 252H655" fill="none" stroke="#2e80b7" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <rect x="668" y="56" width="24" height="350" rx="4" fill="white" stroke="#111" stroke-width="3"/>
  <text x="680" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="34">Rate limiter</text>

  <!-- Rejected traffic returns to the client in a separate red corridor. -->
  <path id="rate-limited-response" d="M655 292H325" fill="none" stroke="#ff2b2b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#red-arrow)"/>
  <path d="M527 243L555 271M555 243L527 271" stroke="#ff2b2b" stroke-width="11"/>
  <text x="487" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#ff2b2b">429: Too many requests</text>

  <!-- API server pool receives only admitted requests. -->
  <path id="admitted-1" d="M692 184H990" fill="none" stroke="#2e80b7" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path id="admitted-2" d="M692 218H990" fill="none" stroke="#2e80b7" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <rect x="1003" y="137" width="228" height="190" rx="31" fill="#fbfbfb" stroke="#08b7d1" stroke-width="4" stroke-dasharray="11 9"/>
  <use href="#server" x="1034" y="169" width="58" height="101"/><use href="#server" x="1087" y="151" width="58" height="101"/><use href="#server" x="1140" y="169" width="58" height="101"/>
  <text x="1117" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">API Servers</text>
</svg>
