<svg xmlns="http://www.w3.org/2000/svg" width="1436" height="730" viewBox="0 0 1436 730" role="img" aria-labelledby="title desc">
  <title id="title">Sliding-window counter</title>
  <desc id="desc">The rolling minute contains seventy percent of the previous minute and thirty percent of the current minute, with a limit of five requests per minute.</desc>

  <defs>
    <marker id="black-arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#111"/></marker>
    <symbol id="request" viewBox="0 0 64 46"><rect x="1" y="1" width="62" height="44" fill="#99bee8"/></symbol>
  </defs>
  <rect width="1436" height="730" fill="white"/>

  <!-- Axes and rate-limit annotation. -->
  <path id="y-axis" d="M95 703V52" fill="none" stroke="#111" stroke-width="3" marker-end="url(#black-arrow)"/>
  <path id="x-axis" d="M95 703H1322" fill="none" stroke="#111" stroke-width="3" marker-end="url(#black-arrow)"/>
  <text x="56" y="475" text-anchor="middle" transform="rotate(-90 56 475)" font-family="Arial, sans-serif" font-size="30">Number of requests</text>
  <text x="945" y="123" font-family="Arial, sans-serif" font-size="31">Rate limit: 5 requests/min</text>

  <!-- The green rolling minute is painted first so fixed-window borders remain on top. -->
  <rect x="234" y="177" width="421" height="400" fill="#66dfb5" fill-opacity="0.78" stroke="#00df8d" stroke-width="5"/>

  <!-- Transparent fixed windows sit above green; their 5px strokes touch at x=510 without overlapping. -->
  <rect x="168" y="303" width="339.5" height="274" fill="none" stroke="#111" stroke-width="5"/>
  <rect x="512.5" y="303" width="337.5" height="274" fill="none" stroke="#0b9fe8" stroke-width="5"/>
  <text x="445" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="31">Rolling minute</text>
  <path id="current-time" d="M655 72V158" fill="none" stroke="#111" stroke-width="3" marker-end="url(#black-arrow)"/>
  <text x="655" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="31">Current time</text>

  <!-- Percentage guides are split around white-backed labels to preserve arrow readability. -->
  <path d="M251 262H337M411 262H492" stroke="#111" stroke-width="3"/><path d="M251 253L233 262L251 271Z" fill="#111"/><path d="M492 253L510 262L492 271Z" fill="#111"/>
  <rect x="341" y="241" width="66" height="43" fill="white"/><text x="374" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="29">70%</text>
  <path d="M528 262H551M624 262H637" stroke="#111" stroke-width="3"/><path d="M528 253L510 262L528 271Z" fill="#111"/><path d="M637 253L655 262L637 271Z" fill="#111"/>
  <rect x="555" y="241" width="65" height="43" fill="white"/><text x="588" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="29">30%</text>

  <!-- Request counts reproduce the PNG: five in the previous section and three in the current. -->
  <g aria-label="five previous-window requests">
    <use href="#request" x="253" y="512" width="64" height="46"/><use href="#request" x="336" y="512" width="64" height="46"/><use href="#request" x="419" y="512" width="64" height="46"/>
    <use href="#request" x="336" y="455" width="64" height="46"/><use href="#request" x="419" y="455" width="64" height="46"/>
  </g>
  <g aria-label="three current-window requests">
    <use href="#request" x="536" y="512" width="64" height="46"/><use href="#request" x="536" y="455" width="64" height="46"/><use href="#request" x="536" y="387" width="64" height="46"/>
  </g>

  <!-- Window labels sit below their span arrows rather than on top of the shafts. -->
  <path d="M186 641H492" stroke="#111" stroke-width="3"/><path d="M186 632L168 641L186 650Z" fill="#111"/><path d="M492 632L510 641L492 650Z" fill="#111"/>
  <text x="339" y="682" text-anchor="middle" font-family="Arial, sans-serif" font-size="29">previous minute</text>
  <path d="M528 641H832" stroke="#111" stroke-width="3"/><path d="M528 632L510 641L528 650Z" fill="#111"/><path d="M832 632L850 641L832 650Z" fill="#111"/>
  <text x="680" y="682" text-anchor="middle" font-family="Arial, sans-serif" font-size="29">current minute</text>
</svg>
