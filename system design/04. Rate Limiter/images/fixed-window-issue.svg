<svg xmlns="http://www.w3.org/2000/svg" width="1372" height="622" viewBox="0 0 1372 622" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-window boundary issue</title>
  <desc id="desc">Ten requests cluster around the boundary of two fixed windows while also fitting inside the dashed rolling interval.</desc>

  <!-- Timeline arrow and request tile use the same geometry and colors as the PNG. -->
  <defs>
    <marker id="axis-arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L13 7L0 13Z" fill="#111"/></marker>
    <symbol id="request" viewBox="0 0 86 60"><rect width="86" height="60" fill="#99bee8"/></symbol>
  </defs>
  <rect width="1372" height="622" fill="white"/>

  <!-- The top double arrow is split around its label so no shaft crosses the text. -->
  <path d="M408 40H535M809 40H936" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M408 31L390 40L408 49Z" fill="#111"/><path d="M936 31L954 40L936 49Z" fill="#111"/>
  <text x="672" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34">10 requests</text>

  <!-- Dashed rolling interval crosses the fixed-window boundary at 2:01:00. -->
  <rect x="394" y="87" width="556" height="504" fill="none" stroke="#b7b7b7" stroke-width="8" stroke-dasharray="24 18"/>
  <g aria-label="ten requests">
    <use href="#request" x="421" y="199" width="86" height="60"/><use href="#request" x="421" y="284" width="86" height="60"/><use href="#request" x="421" y="368" width="86" height="60"/>
    <use href="#request" x="548" y="284" width="86" height="60"/><use href="#request" x="548" y="368" width="86" height="60"/>
    <use href="#request" x="700" y="368" width="86" height="60"/>
    <use href="#request" x="809" y="116" width="86" height="60"/><use href="#request" x="809" y="200" width="86" height="60"/><use href="#request" x="809" y="284" width="86" height="60"/><use href="#request" x="809" y="368" width="86" height="60"/>
  </g>

  <!-- Fixed-window timeline; only full-minute timestamps are labelled, as in the PNG. -->
  <path id="timeline" d="M7 451H1322" fill="none" stroke="#111" stroke-width="4" marker-end="url(#axis-arrow)"/>
  <g stroke="#111" stroke-width="5">
    <path d="M116 408V494"/><path d="M394 408V494"/><path d="M672 408V494"/><path d="M950 408V494"/><path d="M1227 408V494"/>
  </g>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-size="31">
    <text x="116" y="550">2:00:00</text><text x="672" y="550">2:01:00</text><text x="1227" y="550">2:02:00</text>
  </g>
</svg>
