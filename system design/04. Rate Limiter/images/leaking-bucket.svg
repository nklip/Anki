<svg xmlns="http://www.w3.org/2000/svg" width="1458" height="458" viewBox="0 0 1458 458" role="img" aria-labelledby="title desc">
  <title id="title">Leaking bucket rate-limiting algorithm</title>
  <desc id="desc">Incoming requests enter a bounded FIFO queue. A full queue drops new requests, while queued requests leave at a fixed processing rate. The queue has six slots, with three occupied.</desc>

  <!-- Shared colors and typography match the same-stem PNG reference. -->
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 26px; fill: #111; }
      .request { fill: #a0c4ec; }
      .group { fill: none; stroke: #111; stroke-width: 1.7; stroke-dasharray: 5 5; }
      .shaft { fill: none; stroke: #111; stroke-width: 3.2; }
      .arrowhead { fill: #111; }
    </style>
  </defs>
  <rect width="1458" height="458" fill="#fefefe"/>

  <!-- Incoming burst: square request tiles inside the dashed group. -->
  <rect id="incoming-requests" class="group" x="42.5" y="15.5" width="208" height="173" rx="27"/>
  <g class="request">
    <rect x="77" y="68" width="52" height="34.5"/>
    <rect x="146" y="33" width="52" height="34.5"/>
    <rect x="146" y="85" width="52" height="34.5"/>
    <rect x="77" y="119.5" width="52" height="34.5"/>
    <rect x="146" y="137" width="52" height="34.5"/>
  </g>
  <text font-family="Arial, sans-serif" fill="#111" x="145" y="238" font-size="28" text-anchor="middle">requests</text>

  <!-- Shafts stop inside concave heads; visible noses meet their target boundaries. -->
  <path id="incoming-shaft" class="shaft" d="M250.5 100.5H380"/>
  <path id="incoming-arrowhead" class="arrowhead" d="M370 89.5L392 100.5L370 111.5L376 100.5Z"/>

  <!-- Capacity decision, centered on the incoming horizontal route. -->
  <path id="capacity-decision" d="M512 5.5L630 100.5L514 196L392 100.5Z" fill="none" stroke="#111" stroke-width="1.8"/>
  <text font-family="Arial, sans-serif" font-size="27" fill="#111" x="511" y="110" text-anchor="middle">bucket full?</text>
  <path id="queue-branch-shaft" class="shaft" d="M630 100.5H742"/>
  <path id="queue-arrowhead" class="arrowhead" d="M732 89.5L754 100.5L732 111.5L738 100.5Z"/>
  <text class="label" x="684.5" y="84.5" text-anchor="middle">no</text>

  <!-- Six equal FIFO slots: the rightmost three contain requests. Draw borders above fills. -->
  <g id="queue">
    <rect class="request" x="857.5" y="40" width="104" height="121"/>
    <rect x="754.5" y="40" width="207" height="121" fill="none" stroke="#111" stroke-width="1.8"/>
    <path d="M789 40V161M823.5 40V161M858 40V161M892.5 40V161M927 40V161" fill="none" stroke="#111" stroke-width="1.8"/>
  </g>
  <text class="label" x="853.5" y="189" text-anchor="middle">queue</text>

  <!-- Fixed-rate outflow uses the same head geometry as the other horizontal arrows. -->
  <path id="fixed-rate-shaft" class="shaft" d="M961.5 100.5H1257"/>
  <path id="fixed-rate-arrowhead" class="arrowhead" d="M1247 89.5L1269 100.5L1247 111.5L1253 100.5Z"/>
  <text class="label" x="1112" y="78" text-anchor="middle">processed at fixed rate</text>
  <rect id="processed-requests" class="group" x="1269" y="5.5" width="86.5" height="190" rx="13"/>
  <g class="request">
    <rect x="1287" y="23" width="52" height="34.5"/>
    <rect x="1287" y="76.5" width="52" height="34.5"/>
    <rect x="1287" y="137" width="52" height="34.5"/>
  </g>
  <text class="label" x="1312" y="242" text-anchor="middle">requests go</text>
  <text class="label" x="1312" y="272.5" text-anchor="middle">through</text>

  <!-- A full queue rejects incoming requests; the drop head meets the dashed group. -->
  <path id="drop-shaft" class="shaft" d="M514 196V357"/>
  <path id="drop-arrowhead" class="arrowhead" d="M503 347L514 369L525 347L514 353Z"/>
  <text class="label" x="612" y="276" text-anchor="middle">yes,</text>
  <text class="label" x="612" y="307" text-anchor="middle">drop requests</text>
  <rect id="dropped-requests" class="group" x="436.5" y="369.5" width="155" height="60.5" rx="10"/>
  <g fill="#cecece">
    <rect x="449" y="382" width="51.5" height="34"/>
    <rect x="526.5" y="382" width="51.5" height="34"/>
  </g>
</svg>
