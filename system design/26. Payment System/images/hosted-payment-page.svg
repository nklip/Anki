<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1394" height="1470" viewBox="0 0 1394 1470"
     role="img" aria-labelledby="title desc">
  <title id="title">Hosted PayPal payment page</title>
  <desc id="desc">A PayPal-hosted login and payment page with email and password fields, a stay-logged-in option, login and card-payment buttons, and account-help links.</desc>

  <!-- Shared UI typography and the sampled PayPal page colors. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif;font-weight:400}
      .page-title{font-size:64px;fill:#2c2e2f;text-anchor:middle}
      .subtitle{font-size:37px;fill:#6c7378;text-anchor:middle}
      .placeholder{font-size:40px;fill:#6c7378}
      .body-copy{font-size:40px;fill:#2c2e2f}
      .button-label{font-size:40px;font-weight:700;text-anchor:middle}
      .link{font-size:40px;fill:#3678ba;text-anchor:middle}
      .field{fill:#fff;stroke:#a7a9ac;stroke-width:2.5}
    </style>
  </defs>

  <rect width="1394" height="1470" fill="#fff"/>

  <!-- PayPal brand mark, retained as editable vector geometry and text. -->
  <g id="paypal-brand" aria-label="PayPal">
    <g id="paypal-double-p-mark">
      <path fill="#009cde"
            d="M555 55 H578 C596 55 603 67 598 82 C593 97 581 102 566 102 H562 L558 110 H548 Z
               M565 67 L562 89 H570 C578 89 584 86 586 78 C588 71 584 67 576 67 Z"/>
      <path fill="#003087"
            d="M546 37 H573 C591 37 600 49 596 65 C592 82 580 89 561 89 H556 L552 109 H535 Z
               M559 51 L555 76 H565 C576 76 581 72 583 64 C585 56 580 51 571 51 Z"/>
      <path fill="#001c64" opacity="0.72"
            d="M558 55 H578 C589 55 596 61 597 70 C591 82 579 89 561 89 H556 L561 59 C561 57 560 56 558 55 Z"/>
    </g>
    <text x="621" y="96" font-size="64px" font-weight="700" font-style="italic"
          letter-spacing="1.5" fill="#003087" stroke="#003087" stroke-width="0.7" paint-order="stroke fill">Pay</text>
    <text x="728" y="96" font-size="64px" font-weight="700" font-style="italic"
          letter-spacing="1.5" fill="#009cde" stroke="#009cde" stroke-width="0.7" paint-order="stroke fill">Pal</text>
  </g>

  <!-- Introductory payment copy. -->
  <g id="payment-introduction">
    <text class="page-title" x="697" y="232">Pay with PayPal</text>
    <text class="subtitle" x="697" y="306"><tspan x="697">With a PayPal account, you're eligible for free return shipping,</tspan><tspan x="697" dy="43">Purchase Protection, and more.</tspan></text>
  </g>

  <!-- Account credentials. -->
  <g id="credentials-form">
    <rect class="field" x="135.5" y="437.5" width="1102" height="114" rx="10"/>
    <text class="placeholder" x="165" y="508">Email or mobile number</text>

    <rect class="field" x="135.5" y="606.5" width="1102" height="114" rx="10"/>
    <text class="placeholder" x="165" y="677">Password</text>
  </g>

  <!-- Persistent-login option and inline help. -->
  <g id="stay-logged-in-option">
    <rect class="field" x="135.5" y="813.5" width="65" height="64" rx="11"/>
    <text class="body-copy" x="228" y="858">Stay logged in for faster purchases</text>
    <circle cx="894" cy="843" r="26" fill="#fff" stroke="#367fbd" stroke-width="2.5"/>
    <path d="M886 835 C886 828 890 824 896 824 C902 824 906 828 906 834 C906 839 903 842 899 845 C896 848 895 850 895 854"
          fill="none" stroke="#367fbd" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="895" cy="861" r="2.2" fill="#367fbd"/>
  </g>

  <!-- Primary login action. -->
  <g id="login-action">
    <rect x="135" y="941" width="1103" height="115" rx="11" fill="#3873ba"/>
    <text class="button-label" x="686.5" y="1011" fill="#fff">Log In</text>
  </g>

  <!-- Recovery link and alternative-payment divider. -->
  <g id="account-help-and-divider">
    <text class="link" x="686.5" y="1144">Having trouble logging in?</text>
    <path d="M135 1221 H649 M724 1221 H1238" fill="none" stroke="#d2d3d3" stroke-width="2.5"/>
    <text x="686.5" y="1230" font-size="36px" fill="#2c2e2f" text-anchor="middle">or</text>
  </g>

  <!-- Guest card-payment alternative. -->
  <g id="card-payment-action">
    <rect x="135" y="1295" width="1103" height="115" rx="11" fill="#e4e7eb"/>
    <text class="button-label" x="686.5" y="1365" fill="#2c2e2f">Pay with Debit or Credit Card</text>
  </g>
</svg>
