<svg xmlns="http://www.w3.org/2000/svg" width="1444" height="784" viewBox="0 0 1444 784" role="img" aria-labelledby="title desc">
  <title id="title">Powers of two and approximate storage values</title>
  <desc id="desc">A table mapping powers 10 through 50 to approximate decimal values and storage unit names from kilobytes through petabytes.</desc>

  <!-- White canvas and crisp table grid preserve the source image proportions. -->
  <rect width="1444" height="784" fill="white"/>
  <g id="table-grid" fill="none" stroke="#111" stroke-width="2">
    <rect x="16" y="14" width="1399" height="750"/>
    <path d="M367 14V764M716 14V764M1064 14V764"/>
    <path d="M16 138H1415M16 263H1415M16 389H1415M16 514H1415M16 639H1415"/>
  </g>

  <!-- Column headings. -->
  <g id="headings" font-family="Arial, sans-serif" font-size="38" fill="#111">
    <text x="34" y="74">Power</text>
    <text x="382" y="74">Approximate value</text>
    <text x="732" y="74">Full name</text>
    <text x="1082" y="74">Short name</text>
  </g>

  <!-- Data rows use a shared baseline rhythm and left padding. -->
  <g id="data" font-family="Arial, sans-serif" font-size="38" fill="#111">
    <text x="34" y="199">10</text>
    <text x="382" y="199">1 Thousand</text>
    <text x="732" y="199">1 Kilobyte</text>
    <text x="1082" y="199">1 KB</text>

    <text x="34" y="325">20</text>
    <text x="382" y="325">1 Million</text>
    <text x="732" y="325">1 Megabyte</text>
    <text x="1082" y="325">1 MB</text>

    <text x="34" y="450">30</text>
    <text x="382" y="450">1 Billion</text>
    <text x="732" y="450">1 Gigabyte</text>
    <text x="1082" y="450">1 GB</text>

    <text x="34" y="575">40</text>
    <text x="382" y="575">1 Trillion</text>
    <text x="732" y="575">1 Terabyte</text>
    <text x="1082" y="575">1 TB</text>

    <text x="34" y="700">50</text>
    <text x="382" y="700">1 Quadrillion</text>
    <text x="732" y="700">1 Petabyte</text>
    <text x="1082" y="700">1 PB</text>
  </g>
</svg>
