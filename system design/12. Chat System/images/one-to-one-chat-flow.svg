<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1038" viewBox="0 0 1110 1038" role="img" aria-labelledby="title desc">
  <title id="title">One-to-one chat message flow</title>
  <desc id="desc">User A sends through chat server 1, which requests an identifier, publishes to a synchronization queue, stores the message, and delivers to User B through chat server 2 when online or push notification servers when offline.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker>
    <symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol>
    <symbol id="purple-server" viewBox="0 0 50 100"><rect x="3" y="2" width="44" height="96" rx="3" fill="#7100d8"/><path d="M12 18 H38 M12 76 H38 M12 86 H38" stroke="#fff" stroke-width="4"/></symbol>
    <symbol id="green-cluster" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#65c515"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#65c515"/><g fill="#65c515"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34 H38 M12 71 H38 M52 34 H78 M52 71 H78 M92 34 H118 M92 71 H118 M39 11 H61 M78 11 H100" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="queue" viewBox="0 0 306 86"><path d="M2 2 H278 L304 43 L278 84 H2 Z" fill="#fff" stroke="#08b4cf" stroke-width="6"/><g fill="none" stroke="#08b4cf" stroke-width="6"><rect x="14" y="14" width="75" height="57"/><path d="M14 15 L51.5 47 L89 15"/><rect x="101" y="14" width="75" height="57"/><path d="M101 15 L138.5 47 L176 15"/><rect x="188" y="14" width="75" height="57"/><path d="M188 15 L225.5 47 L263 15"/></g></symbol>
    <symbol id="db" viewBox="0 0 120 100"><g fill="#1677b8" stroke="#fff" stroke-width="1.5"><path d="M8 18 A25 8 0 0 1 58 18 V68 A25 8 0 0 1 8 68 Z"/><ellipse cx="33" cy="18" rx="25" ry="8"/><path d="M35 29 A25 8 0 0 1 85 29 V79 A25 8 0 0 1 35 79 Z"/><ellipse cx="60" cy="29" rx="25" ry="8"/><path d="M62 40 A25 8 0 0 1 112 40 V90 A25 8 0 0 1 62 90 Z"/><ellipse cx="87" cy="40" rx="25" ry="8"/></g></symbol>
    <style>.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.flow{fill:none;stroke:#1677b8;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow-blue)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:24px;text-anchor:middle}.step{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:22px}</style>
  </defs>
  <rect width="1110" height="1038" fill="#fff"/>
  <!-- Participants and chat servers. -->
  <rect class="box" x="356" y="10" width="130" height="122" rx="18"/><use href="#phone" x="391" y="20" width="60" height="72"/><text class="t" x="421" y="116">User A</text><rect class="box" x="868" y="10" width="130" height="122" rx="18"/><use href="#phone" x="903" y="20" width="60" height="72"/><text class="t" x="933" y="116">User B</text>
  <rect class="box" x="340" y="272" width="162" height="157" rx="21"/><use href="#purple-server" x="394" y="289" width="54" height="89"/><text class="t" x="421" y="403">Chat server 1</text><rect class="box" x="850" y="253" width="164" height="157" rx="21"/><use href="#purple-server" x="905" y="271" width="54" height="89"/><text class="t" x="932" y="385">Chat server 2</text>
  <rect class="box" x="72" y="279" width="140" height="140" rx="20"/><use href="#green-cluster" x="83" y="294" width="118" height="82"/><text class="t" x="142" y="401">ID generator</text>
  <!-- Numbered delivery path. -->
  <path class="flow" d="M421 132 V272"/><text class="step" x="430" y="211">1</text><path class="flow" d="M340 350 H212"/><text class="step" x="272" y="333">2</text><path class="flow" d="M421 429 V698 H532"/><text class="step" x="430" y="560">3</text>
  <text class="t" x="685" y="640">Message sync queue</text><use href="#queue" x="532" y="655" width="306" height="86"/>
  <path class="flow" d="M685 741 V880"/><text class="step" x="705" y="838">4</text><rect class="box" x="607" y="880" width="159" height="139" rx="20"/><use href="#db" x="627" y="891" width="120" height="90"/><text class="t" x="686.5" y="1004">KV store</text>
  <!-- Online and offline branches share the queue exit but have separate targets. -->
  <path class="flow" d="M838 698 H932 V410"/><text class="step" x="886" y="559">5.a</text><text class="step" x="946" y="559">online</text><path class="flow" d="M932 253 V132"/><text class="step" x="897" y="211">6</text>
  <path class="flow" d="M838 698 H932 V880"/><text class="step" x="886" y="786">5.b</text><text class="step" x="946" y="786">offline</text><rect class="box" x="861" y="880" width="141" height="139" rx="20"/><use href="#green-cluster" x="874" y="893" width="115" height="80"/><text class="t" x="931.5" y="1004">PN servers</text>
</svg>
