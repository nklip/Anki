<svg xmlns="http://www.w3.org/2000/svg" width="798" height="692" viewBox="0 0 798 692" role="img" aria-labelledby="title desc">
  <title id="title">Group message schema</title>
  <desc id="desc">The group message table contains channel identifier, message identifier, user identifier, content, and creation timestamp fields.</desc>
  <defs><style>.txt{font-family:Arial,Helvetica,sans-serif}.field{font-size:42px;fill:#777}.type{font-size:42px;fill:#999;text-anchor:end}.strong{font-weight:700}.field.strong{fill:#111}</style></defs>
  <!-- Blue header names the stored entity. -->
  <rect width="798" height="692" fill="#fff"/><rect x="14" y="17" width="762" height="659" fill="#fafafa"/><rect x="14" y="17" width="762" height="120" fill="#2f6f9f"/>
  <text class="txt" x="62" y="92" font-size="49" font-weight="700" fill="#fff">group_message</text>
  <!-- Field names align with their database types. -->
  <g class="txt"><text class="field strong" x="62" y="207">channel_id</text><text class="type strong" x="730" y="207">bigint</text><text class="field strong" x="62" y="316">message_id</text><text class="type strong" x="730" y="316">bigint</text><text class="field" x="62" y="425">user_id</text><text class="type" x="730" y="425">bigint</text><text class="field" x="62" y="534">content</text><text class="type" x="730" y="534">text</text><text class="field" x="62" y="643">created_at</text><text class="type" x="730" y="643">timestamp</text></g>
</svg>
