<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="606" viewBox="0 0 1136 606" role="img" aria-labelledby="title desc">
  <title id="title">Stateful chat architecture</title>
  <desc id="desc">Users maintain WebSocket connections with the stateful chat service, while push notification delivery is handled by a separate third-party system.</desc>
  <defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker><symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol><symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="none" stroke="#111" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#111"/></symbol><style>.group{fill:#fff;stroke:#08b4cf;stroke-width:3;stroke-dasharray:10 9}.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.both{fill:none;stroke:#1677b8;stroke-width:2.2;marker-start:url(#arrow-blue);marker-end:url(#arrow-blue)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:29px;text-anchor:middle}</style></defs>
  <rect width="1136" height="606" fill="#fff"/>
  <!-- Stateful users keep persistent WebSocket sessions. -->
  <rect class="group" x="16" y="35" width="735" height="551" rx="73"/><text x="55" y="110" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#111">Stateful</text>
  <rect class="box" x="59" y="186" width="207" height="144" rx="23"/><text x="78" y="241" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#111">User 1</text><use href="#laptop" x="158" y="231" width="90" height="70"/><rect class="box" x="59" y="422" width="207" height="144" rx="23"/><text x="78" y="477" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#111">User 2</text><use href="#phone" x="157" y="460" width="60" height="90"/>
  <rect class="box" x="519" y="319" width="204" height="104" rx="18"/><text class="t" x="621" y="382">Chat service</text><path class="both" d="M266 258 L519 350"/><path class="both" d="M266 494 L519 392"/><rect x="365" y="248" width="56" height="35" fill="#fff"/><text class="t" x="393" y="277">ws</text><rect x="365" y="470" width="56" height="35" fill="#fff"/><text class="t" x="393" y="499">ws</text>
  <!-- Push notification delivery remains outside the stateful tier. -->
  <rect class="group" x="774" y="176" width="309" height="266" rx="44"/><text x="837" y="251" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#111">Third party</text><rect class="box" x="835" y="299" width="206" height="103" rx="17"/><text class="t" x="938" y="347">Push</text><text class="t" x="938" y="378">notification</text>
</svg>
