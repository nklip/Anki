<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="266" viewBox="0 0 1434 266" role="img" aria-labelledby="title desc">
  <title id="title">Basic chat service design</title>
  <desc id="desc">A sender sends a message to a chat service, which stores and relays the message to a receiver.</desc>
  <!-- Device symbols and blue delivery arrows. -->
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#1677b8"/></marker>
    <symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="none" stroke="#111" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#111"/><path d="M38 60 H52" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol>
    <style>.box{fill:#fff;stroke:#08b4cf;stroke-width:5}.shaft{fill:none;stroke:#1677b8;stroke-width:2.5}.flow{fill:none;stroke:#1677b8;stroke-width:2.5;marker-end:url(#arrow-blue)}.text{font-family:Arial,Helvetica,sans-serif;fill:#111}.label{font-size:37px;text-anchor:middle}</style>
  </defs>
  <rect width="1434" height="266" fill="#fff"/>
  <!-- Sender, chat service, and receiver. -->
  <g id="participants">
    <rect class="box" x="27" y="42" width="180" height="169" rx="27"/><use href="#laptop" x="67" y="67" width="100" height="78"/><text class="text label" x="117" y="185">sender</text>
    <rect class="box" x="501" y="24" width="396" height="210" rx="31"/>
    <text class="text" x="548" y="100" font-size="39" font-weight="700">Chat service:</text><text class="text" x="548" y="146" font-size="38">1. store message</text><text class="text" x="548" y="190" font-size="38">2. relay message</text>
    <rect class="box" x="1171" y="30" width="209" height="197" rx="29"/><use href="#phone" x="1235" y="50" width="78" height="100"/><text class="text label" x="1275.5" y="199">receiver</text>
  </g>
  <!-- Inline labels occupy deliberate gaps in the arrow shafts. -->
  <g id="message-flow">
    <path class="shaft" d="M207 127 H279"/><path class="flow" d="M430 127 H501"/><text class="text" x="354.5" y="138" font-size="37" text-anchor="middle">message</text>
    <path class="shaft" d="M897 127 H962"/><path class="flow" d="M1120 127 H1171"/><text class="text" x="1036" y="138" font-size="37" text-anchor="middle">message</text>
  </g>
</svg>
