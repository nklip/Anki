<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="838" viewBox="0 0 1098 838" role="img" aria-labelledby="title desc">
  <title id="title">Stateless chat architecture</title>
  <desc id="desc">HTTP requests pass from the user through a load balancer to stateless service discovery, authentication, group management, and user profile services.</desc>
  <defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker><symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol><symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="none" stroke="#111" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#111"/></symbol><symbol id="lb" viewBox="0 0 100 100"><path d="M12 4 H88 L98 96 H2 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="5"><path d="M50 18 V78 M50 35 L32 54 V72 M50 35 L68 54 V72"/><path d="M43 25 L50 18 L57 25 M25 65 L32 72 L39 65 M61 65 L68 72 L75 65 M43 71 L50 78 L57 71"/></g><circle cx="50" cy="15" r="6" fill="#fff"/></symbol><style>.group{fill:#fff;stroke:#08b4cf;stroke-width:3;stroke-dasharray:10 9}.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.flow{fill:none;stroke:#1677b8;stroke-width:2.2;marker-end:url(#arrow-blue)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:29px;text-anchor:middle}</style></defs>
  <!-- User requests enter the stateless service boundary. -->
  <rect width="1098" height="838" fill="#fff"/><rect class="group" x="26" y="20" width="1040" height="795" rx="85"/><text x="91" y="112" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#111">Stateless</text>
  <rect class="box" x="432" y="59" width="255" height="145" rx="23"/><text x="451" y="115" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#111">User</text><use href="#laptop" x="502" y="103" width="85" height="66"/><use href="#phone" x="595" y="91" width="55" height="88"/><path class="flow" d="M559 204 V367"/><text x="571" y="296" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#111">http</text><use href="#lb" x="509" y="367" width="100" height="100"/><text x="630" y="429" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#111">Load balancer</text>
  <!-- Load balancer fans out to independent stateless services. -->
  <path class="flow" d="M559 467 L193 630"/><path class="flow" d="M559 467 L437 630"/><path class="flow" d="M559 467 L682 630"/><path class="flow" d="M559 467 L926 630"/>
  <rect class="box" x="89" y="630" width="208" height="103" rx="16"/><text class="t" x="193" y="676">Service</text><text class="t" x="193" y="710">discovery</text><rect class="box" x="334" y="630" width="207" height="103" rx="16"/><text class="t" x="437.5" y="676">Authentication</text><text class="t" x="437.5" y="710">service</text><rect class="box" x="579" y="630" width="207" height="103" rx="16"/><text class="t" x="682.5" y="676">Group</text><text class="t" x="682.5" y="710">management</text><rect class="box" x="823" y="630" width="207" height="103" rx="16"/><text class="t" x="926.5" y="693">User profile</text>
</svg>
