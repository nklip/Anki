<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="1012" viewBox="0 0 1062 1012" role="img" aria-labelledby="title desc">
  <title id="title">Chat server discovery with ZooKeeper</title>
  <desc id="desc">User A logs in through a load balancer and API servers. ZooKeeper returns the selected chat server, after which the user opens a WebSocket connection to chat server 2.</desc>
  <defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker><symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol><symbol id="lb" viewBox="0 0 100 100"><path d="M12 4 H88 L98 96 H2 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="5"><path d="M50 18 V78 M50 35 L32 54 V72 M50 35 L68 54 V72"/><path d="M43 25 L50 18 L57 25 M25 65 L32 72 L39 65 M61 65 L68 72 L75 65 M43 71 L50 78 L57 71"/></g><circle cx="50" cy="15" r="6" fill="#fff"/></symbol><symbol id="purple-server" viewBox="0 0 50 100"><rect x="3" y="2" width="44" height="96" rx="3" fill="#7100d8"/><path d="M12 18 H38 M12 76 H38 M12 86 H38" stroke="#fff" stroke-width="4"/></symbol><symbol id="green-cluster" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#65c515"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#65c515"/><g fill="#65c515"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34 H38 M12 71 H38 M52 34 H78 M52 71 H78 M92 34 H118 M92 71 H118 M39 11 H61 M78 11 H100" stroke="#fff" stroke-width="3"/></symbol><style>.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.flow{fill:none;stroke:#1677b8;stroke-width:2.2;marker-end:url(#arrow-blue)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:25px;text-anchor:middle}</style></defs>
  <rect width="1062" height="1012" fill="#fff"/>
  <rect class="box" x="545" y="15" width="132" height="124" rx="19"/><use href="#phone" x="581" y="27" width="60" height="75"/><text class="t" x="611" y="123">User A</text>
  <!-- Login request enters through the load balancer. -->
  <path class="flow" d="M611 139 L333 280"/><g transform="rotate(-27 452 180)"><rect x="402" y="162" width="100" height="35" fill="#fff"/><text class="t" x="452" y="189">1. login</text></g><use href="#lb" x="282" y="280" width="101" height="91"/><text x="113" y="337" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#111">Load balancer</text>
  <path class="flow" d="M333 371 V474"/><text x="344" y="432" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#111">2</text><rect class="box" x="248" y="474" width="168" height="177" rx="22"/><use href="#green-cluster" x="267" y="492" width="130" height="90"/><text class="t" x="332" y="626">API servers</text>
  <path class="flow" d="M332 651 V757"/><text x="344" y="716" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#111">3</text>
  <rect class="box" x="31" y="757" width="603" height="231" rx="35"/><text class="t" x="332.5" y="805" font-size="28">Service discovery (Zookeeper)</text><use href="#purple-server" x="103" y="846" width="50" height="90"/><use href="#purple-server" x="279" y="846" width="50" height="90"/><text class="t" x="419" y="907" font-size="34">...</text><use href="#purple-server" x="510" y="846" width="50" height="90"/><text class="t" x="128" y="968">Chat server 1</text><text class="t" x="304" y="968">Chat server 2</text><text class="t" x="535" y="968">Chat server N</text>
  <!-- The selected server receives the WebSocket connection. -->
  <path class="flow" d="M611 139 L947 280"/><g transform="rotate(23 791 178)"><rect x="746" y="160" width="90" height="35" fill="#fff"/><text class="t" x="791" y="187">4. ws</text></g><rect class="box" x="863" y="280" width="168" height="160" rx="22"/><use href="#purple-server" x="921" y="297" width="54" height="90"/><text class="t" x="947" y="416">Chat server 2</text>
</svg>
