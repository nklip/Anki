<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="918" viewBox="0 0 1180 918" role="img" aria-labelledby="title desc">
  <title id="title">Message synchronization across devices</title>
  <desc id="desc">User A's phone and laptop hold separate chat sessions with different current maximum message identifiers. Chat server 1 synchronizes both sessions with a shared key-value store.</desc>
  <defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker><symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol><symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="none" stroke="#111" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#111"/></symbol><symbol id="purple-server" viewBox="0 0 50 100"><rect x="3" y="2" width="44" height="96" rx="3" fill="#7100d8"/><path d="M12 18 H38 M12 76 H38 M12 86 H38" stroke="#fff" stroke-width="4"/></symbol><symbol id="db" viewBox="0 0 120 100"><g fill="#1677b8" stroke="#fff" stroke-width="1.5"><path d="M8 18 A25 8 0 0 1 58 18 V68 A25 8 0 0 1 8 68 Z"/><ellipse cx="33" cy="18" rx="25" ry="8"/><path d="M35 29 A25 8 0 0 1 85 29 V79 A25 8 0 0 1 35 79 Z"/><ellipse cx="60" cy="29" rx="25" ry="8"/><path d="M62 40 A25 8 0 0 1 112 40 V90 A25 8 0 0 1 62 90 Z"/><ellipse cx="87" cy="40" rx="25" ry="8"/></g></symbol><style>.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.both{fill:none;stroke:#1677b8;stroke-width:2.2;marker-start:url(#arrow-blue);marker-end:url(#arrow-blue)}.flow{fill:none;stroke:#1677b8;stroke-width:2.2;marker-end:url(#arrow-blue)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:27px;text-anchor:middle}</style></defs>
  <rect width="1180" height="918" fill="#fff"/>
  <!-- Each device tracks its own current maximum message identifier. -->
  <text x="7" y="146" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111">cur_max_message_id = 653</text><text x="821" y="146" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111">cur_max_message_id = 842</text>
  <rect class="box" x="357" y="54" width="160" height="156" rx="22"/><use href="#phone" x="404" y="65" width="66" height="83"/><text class="t" x="437" y="166">User A's</text><text class="t" x="437" y="196">phone</text><rect class="box" x="653" y="54" width="160" height="156" rx="22"/><use href="#laptop" x="692" y="77" width="82" height="64"/><text class="t" x="733" y="166">User A's</text><text class="t" x="733" y="196">laptop</text>
  <path class="both" d="M437 210 V368"/><path class="both" d="M733 210 V368"/>
  <rect class="box" x="292" y="368" width="586" height="195" rx="25"/><use href="#purple-server" x="349" y="386" width="66" height="102"/><text x="310" y="535" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#111">Chat server 1</text><text x="474" y="427" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#111">Session for User A's laptop</text><text x="474" y="506" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#111">Session for User A's phone</text>
  <!-- Both device sessions synchronize through shared storage. -->
  <path class="flow" d="M437 563 V738"/><path class="flow" d="M733 563 V738"/><rect class="box" x="289" y="738" width="610" height="157" rx="25"/><use href="#db" x="520" y="752" width="120" height="90"/><text class="t" x="594" y="876">KV store</text>
</svg>
