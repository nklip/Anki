<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="936" viewBox="0 0 1110 936" role="img" aria-labelledby="title desc">
  <title id="title">Group chat message flow</title>
  <desc id="desc">User A sends a group message to chat server 1. The server fans the message into one synchronization queue for User B and another for User C.</desc>
  <defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1677b8"/></marker><symbol id="phone" viewBox="0 0 60 100"><rect x="10" y="3" width="40" height="94" rx="5" fill="none" stroke="#333" stroke-width="4"/><path d="M10 17 H50 M10 82 H50 M25 10 H35 M27 90 H33" fill="none" stroke="#333" stroke-width="3"/></symbol><symbol id="purple-server" viewBox="0 0 50 100"><rect x="3" y="2" width="44" height="96" rx="3" fill="#7100d8"/><path d="M12 18 H38 M12 76 H38 M12 86 H38" stroke="#fff" stroke-width="4"/></symbol><symbol id="queue" viewBox="0 0 276 84"><path d="M2 2 H251 L274 42 L251 82 H2 Z" fill="#fff" stroke="#08b4cf" stroke-width="5"/><g fill="none" stroke="#08b4cf" stroke-width="5"><rect x="13" y="14" width="67" height="55"/><path d="M13 15 L46.5 45 L80 15"/><rect x="90" y="14" width="67" height="55"/><path d="M90 15 L123.5 45 L157 15"/><rect x="167" y="14" width="67" height="55"/><path d="M167 15 L200.5 45 L234 15"/></g></symbol><style>.box{fill:#fff;stroke:#08b4cf;stroke-width:3}.flow{fill:none;stroke:#1677b8;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow-blue)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:28px;text-anchor:middle}</style></defs>
  <rect width="1110" height="936" fill="#fff"/>
  <!-- Sender and receiving group members. -->
  <rect class="box" x="31" y="24" width="160" height="151" rx="22"/><use href="#phone" x="78" y="38" width="66" height="83"/><text class="t" x="111" y="154">User A</text><path class="flow" d="M111 175 V342"/>
  <rect class="box" x="12" y="342" width="199" height="191" rx="24"/><use href="#purple-server" x="79" y="363" width="66" height="108"/><text class="t" x="111.5" y="502">Chat server 1</text>
  <!-- One fanout branch per recipient queue. -->
  <path class="flow" d="M111 533 V606 H495"/><use href="#queue" x="495" y="565" width="276" height="84"/><text class="t" x="633" y="692">Message sync queue</text><path class="flow" d="M771 607 H891"/>
  <path class="flow" d="M111 533 V838 H504"/><use href="#queue" x="504" y="797" width="276" height="84"/><text class="t" x="642" y="924">Message sync queue</text><path class="flow" d="M780 839 H897"/>
  <rect class="box" x="891" y="533" width="158" height="148" rx="21"/><use href="#phone" x="937" y="546" width="66" height="83"/><text class="t" x="970" y="660">User B</text><rect class="box" x="897" y="764" width="158" height="148" rx="21"/><use href="#phone" x="943" y="777" width="66" height="83"/><text class="t" x="976" y="891">User C</text>
</svg>
