<svg xmlns="http://www.w3.org/2000/svg" width="892" height="772" viewBox="0 0 892 772" role="img" aria-labelledby="title desc">
  <title id="title">One-to-one message schema</title>
  <desc id="desc">The message table contains message identifier, sender, receiver, content, and creation timestamp fields.</desc>
  <defs><style>.txt{font-family:Arial,Helvetica,sans-serif}.field{font-size:48px;fill:#777}.type{font-size:48px;fill:#999;text-anchor:end}.strong{font-weight:700}.field.strong{fill:#111}</style></defs>
  <!-- Blue header names the stored entity. -->
  <rect width="892" height="772" fill="#fff"/><rect x="21" y="14" width="842" height="729" fill="#fafafa"/><rect x="21" y="14" width="842" height="132" fill="#2f6f9f"/>
  <text class="txt" x="76" y="99" font-size="54" font-weight="700" fill="#fff">message</text>
  <!-- Field names align with their database types. -->
  <g class="txt"><text class="field strong" x="76" y="223">message_id</text><text class="type strong" x="816" y="223">bigint</text><text class="field" x="76" y="343">message_from</text><text class="type" x="816" y="343">bigint</text><text class="field" x="76" y="463">message_to</text><text class="type" x="816" y="463">bitint</text><text class="field" x="76" y="583">content</text><text class="type" x="816" y="583">text</text><text class="field" x="76" y="703">created_at</text><text class="type" x="816" y="703">timestamp</text></g>
</svg>
