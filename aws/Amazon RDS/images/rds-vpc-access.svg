<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="678" viewBox="0 0 1200 678" role="img" aria-labelledby="title desc">
<title id="title">A subnet group chooses placement; security groups allow access</title>
<desc id="desc">Single-AZ RDS networking example. A VPC contains an EC2 application and two private database subnets in different Availability Zones. RDS uses subnet A for the database. Subnet B remains a placement option. An inbound database security group rule allows TCP port 5432 from the application security group.</desc>
