<!-- Canvas and introduction. -->
<rect width="1200" height="678" rx="14" fill="#ffffff"/>
<text x="32" y="48" class="title">RDS networking: placement and access are separate</text>
<text x="32" y="80" class="body">Single-AZ example · AZ = Availability Zone · DB = database</text>
<!-- The VPC contains the application subnet and both database placement options. -->
<rect x="32" y="108" width="1136" height="538" rx="10" fill="#fbf9ff" stroke="#8c4fff" stroke-width="1.5"/>
<use href="#aws-vpc" x="50" y="124" width="40" height="40"/>
<text x="108" y="151" class="heading">VPC — virtual private cloud</text>
<!-- Application security group is associated with EC2; it is not a routing hop. -->
<rect x="56" y="210" width="270" height="238" rx="10" fill="#fffaf4" stroke="#ed7100" stroke-width="1.5"/>
<text x="76" y="241" class="heading">Application subnet</text>
<use href="#aws-ec2" x="162" y="262" width="56" height="56"/>
<text x="191" y="348" class="heading" text-anchor="middle">EC2 application</text>
<text x="191" y="381" class="small" text-anchor="middle">Security group: app-sg</text>
<text x="191" y="414" class="small" text-anchor="middle">Outbound permits DB port</text>
<!-- Dashed grouping is a logical collection, not a traffic boundary. -->
<rect x="536" y="186" width="608" height="370" rx="10" fill="#f6f8fc" stroke="#697d94" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="556" y="218" class="heading">DB subnet group</text>
<text x="556" y="248" class="small">Both private subnets are eligible placement choices.</text>
<rect x="556" y="278" width="272" height="246" rx="10" fill="#ffffff" stroke="#a2b7c9" stroke-width="1.5"/>
<text x="576" y="310" class="heading">Availability Zone A</text>
