<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="sqs-dead-letter-redrive-title sqs-dead-letter-redrive-desc">
<title id="sqs-dead-letter-redrive-title">A dead-letter queue isolates messages that keep failing</title>
<desc id="sqs-dead-letter-redrive-desc">The source queue supplies work to a consumer. If the message is not deleted, it becomes available again after its visibility timeout. SQS moves repeatedly received messages to the configured dead-letter queue. After a fix, a redrive task can return them to the source queue. Both queues must have the same type.</desc>
<!-- Teaching sources: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html ; https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-dead-letter-queue-redrive.html
     Official icon package: https://d1.awsstatic.com/onedam/marketing-channels/website/public/shared/architecture-icon-release/Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip
     From https://aws.amazon.com/architecture/icons/; retrieved 2026-09-18.
     Generic application artwork represents software roles, not an extra AWS service. -->
<!-- Shared styles and self-contained official AWS symbols. -->
<defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #162B42; }
.title { font-size: 29px; font-weight: 700; }
.heading { font-size: 23px; font-weight: 700; }
.body { font-size: 20px; }
.small { font-size: 18px; fill: #4B6074; }
.subtitle { font-size: 20px; fill: #4B6074; }
</style>
<!-- Official AWS artwork: Resource-Icons_07312026/Res_Application-Integration/Res_Amazon-Simple-Queue-Service_Queue_48.svg; geometry and colors unchanged. -->
<symbol id="aws-queue" viewBox="0 0 48 48"><g xmlns="http://www.w3.org/2000/svg" id="aws-queue-Icon-Resource-Application-Integration-Res_Amazon-Simple-Queue-Service_Queue_48" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <path d="M37.449,22.261 L37.449,26.221 L35.026,24.207 L37.449,22.261 Z M37.81,29.121 C37.993,29.273 38.22,29.352 38.449,29.352 C38.594,29.352 38.738,29.321 38.874,29.257 C39.224,29.092 39.449,28.74 39.449,28.352 L39.449,20.176 C39.449,19.791 39.228,19.441 38.882,19.275 C38.535,19.108 38.123,19.156 37.823,19.397 L32.819,23.414 C32.585,23.602 32.448,23.885 32.4449503,24.185 C32.442,24.486 32.575,24.771 32.806,24.963 L37.81,29.121 Z M10.527,22.307 L12.951,24.322 L10.527,26.267 L10.527,22.307 Z M9.095,29.253 C9.232,29.32 9.38,29.352 9.527,29.352 C9.751,29.352 9.972,29.277 10.153,29.132 L15.158,25.115 C15.392,24.927 15.529,24.644 15.5320497,24.344 C15.535,24.043 15.402,23.758 15.171,23.566 L10.166,19.407 C9.868,19.16 9.453,19.107 9.102,19.271 C8.752,19.436 8.527,19.788 8.527,20.176 L8.527,28.352 C8.527,28.737 8.748,29.087 9.095,29.253 L9.095,29.253 Z M28.368,34.027 L30.368,34.027 L30.368,14.747 L28.368,14.747 L28.368,34.027 Z M23.121,34.027 L25.121,34.027 L25.121,14.747 L23.121,14.747 L23.121,34.027 Z M17.711,34.027 L19.711,34.027 L19.711,14.747 L17.711,14.747 L17.711,34.027 Z M3.999,35.773 L43.977,35.773 L43.977,13.001 L3.999,13.001 L3.999,35.773 Z M44.977,11 L3,11 C2.447,11 2,11.448 2,12 L2,36.773 C2,37.325 2.447,37.773 3,37.773 L44.977,37.773 C45.53,37.773 45.977,37.325 45.977,36.773 L45.977,12 C45.977,11.448 45.53,11 44.977,11 L44.977,11 Z" id="aws-queue-Amazon-Simple-Notification-Service_Queue" fill="#E7157B" />
    </g>
</symbol>
<!-- Official AWS artwork: Resource-Icons_07312026/Res_General-Icons/Res_48_Light/Res_Generic-Application_48_Light.svg; geometry and colors unchanged. -->
<symbol id="aws-app" viewBox="0 0 48 48"><g xmlns="http://www.w3.org/2000/svg" id="aws-app-Icon-Resource-General-Resource-Res_Generic-Application_48" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <path d="M37,35 L46,35 L46,37 L37,37 L37,46 L35,46 L35,37 L26,37 L26,35 L35,35 L35,26 L37,26 L37,35 Z M4,44 L20,44 L20,28 L4,28 L4,44 Z M21,26 L3,26 C2.447,26 2,26.448 2,27 L2,45 C2,45.552 2.447,46 3,46 L21,46 C21.553,46 22,45.552 22,45 L22,27 C22,26.448 21.553,26 21,26 L21,26 Z M28,20 L44,20 L44,4 L28,4 L28,20 Z M45,2 L27,2 C26.447,2 26,2.448 26,3 L26,21 C26,21.552 26.447,22 27,22 L45,22 C45.553,22 46,21.552 46,21 L46,3 C46,2.448 45.553,2 45,2 L45,2 Z M4,20 L20,20 L20,4 L4,4 L4,20 Z M21,2 L3,2 C2.447,2 2,2.448 2,3 L2,21 C2,21.552 2.447,22 3,22 L21,22 C21.553,22 22,21.552 22,21 L22,3 C22,2.448 21.553,2 21,2 L21,2 Z" id="aws-app-Fill-1" fill="#232F3D" />
    </g>
</symbol>
</defs>
<!-- Canvas and lesson title. -->
<rect width="1200" height="548" fill="#FFFFFF"/>
<text class="title" x="32" y="46" text-anchor="start">A dead-letter queue isolates messages that keep failing</text>
<text class="subtitle" x="32" y="79" text-anchor="start">Source and dead-letter queues must have the same type: Standard or FIFO.</text>
<!-- Source queue and consumer; horizontal lanes show delivery and retry separately. -->
<rect x="32" y="122" width="286" height="170" rx="12" fill="#F5F8FB" stroke="#ACBDCB" stroke-width="1.5"/>
<use href="#aws-queue" x="52" y="143" width="64" height="64"/>
<text class="heading" x="134" y="171" text-anchor="start">Source queue</text>
<text class="small" x="134" y="202" text-anchor="start">Normal work</text>
<text class="small" x="52" y="262" text-anchor="start">Buffers pending work</text>
<rect x="864" y="122" width="304" height="170" rx="12" fill="#F5F8FB" stroke="#ACBDCB" stroke-width="1.5"/>
<use href="#aws-app" x="884" y="143" width="64" height="64"/>
<text class="heading" x="966" y="171" text-anchor="start">Consumer</text>
<text class="small" x="966" y="202" text-anchor="start">Processes work</text>
<text class="small" x="884" y="262" text-anchor="start">Success: delete the message</text>
<!-- Retry arrow represents reavailability in the queue, not a consumer send operation. -->
<path id="receive-work-connector" data-connector="true" d="M318 163 H852" fill="none" stroke="#496880" stroke-width="2.5"/><path id="receive-work-head" d="M850 156 L864 163 L850 170 Z" fill="#496880"/>
<text class="body" x="591" y="142" text-anchor="middle">Receive a message</text>
<path id="retry-connector" data-connector="true" d="M864 241 H330" fill="none" stroke="#496880" stroke-width="2.5"/><path id="retry-head" d="M332 234 L318 241 L332 248 Z" fill="#496880"/>
<text class="small" x="591" y="219" text-anchor="middle">No delete: SQS restores visibility after timeout</text>
<!-- DLQ shares the source x-coordinate; its downward movement lane stays clear of text. -->
<rect x="32" y="372" width="286" height="140" rx="12" fill="#FFF1F5" stroke="#DCAEC1" stroke-width="1.5"/>
<use href="#aws-queue" x="52" y="392" width="64" height="64"/>
<text class="heading" x="134" y="420" text-anchor="start">Dead-letter</text>
<text class="heading" x="134" y="450" text-anchor="start">queue (DLQ)</text>
<text class="small" x="52" y="489" text-anchor="start">Inspect and fix failures</text>
<path id="dlq-move-connector" data-connector="true" d="M175 292 V360" fill="none" stroke="#A23769" stroke-width="2.5"/><path id="dlq-move-head" d="M168 358 L175 372 L182 358 Z" fill="#A23769"/>
<text class="small" x="200" y="325" text-anchor="start">Repeated receives exceed</text>
<text class="small" x="200" y="350" text-anchor="start">the maxReceiveCount setting</text>
<!-- Redrive is a separate operation after repair. The dashed route returns to the source panel. -->
<path id="redrive-connector" data-connector="true" d="M318 443 H602 V278 H330" fill="none" stroke="#496880" stroke-width="2.5" stroke-dasharray="7 5"/>
<!-- A solid terminal segment bridges the final dash to the arrowhead base. -->
<path id="redrive-terminal-connector" data-connector="true" d="M350 278 H330" fill="none" stroke="#496880" stroke-width="2.5"/>
<path id="redrive-head" d="M332 271 L318 278 L332 285 Z" fill="#496880"/>
<text class="heading" x="636" y="403" text-anchor="start">After the fix: start DLQ redrive</text>
<text class="body" x="636" y="437" text-anchor="start">Move messages back at a controlled rate.</text>
<text class="small" x="636" y="477" text-anchor="start">Redrive is separate from automatic retries.</text>
<text class="small" x="636" y="506" text-anchor="start">With FIFO, moving messages aside can break order.</text>
</svg>
