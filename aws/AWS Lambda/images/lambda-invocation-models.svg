<title id="lambda-invocation-models-title">How work reaches a Lambda function</title>
<desc id="lambda-invocation-models-desc">API Gateway waits for a function response. S3 sends an event to Lambda’s internal queue. For SQS, a Lambda event source mapping polls records and invokes the function synchronously.</desc>
