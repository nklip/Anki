<!-- White canvas; hand-drawn arrow shafts end inside their triangular heads. -->
<rect width="1200" height="746" fill="#FFFFFF"/>
<text x="32" y="43" class="title" text-anchor="start">How work reaches a Lambda function</text>
<text x="32" y="74" class="body" text-anchor="start">Two invocation types, plus a polling integration for queues and streams.</text>
<!-- Synchronous lane: forward request and separate return path. -->
<rect x="24" y="98" width="1152" height="180" rx="12" fill="#F4F7FB" stroke="#CBD7E2"/>
<text x="48" y="132" class="heading" text-anchor="start">Synchronous: the caller waits</text>
<rect x="60" y="155" width="244" height="86" rx="12" fill="#FFFFFF" stroke="#CBD7E2"/>
<use href="#aws-api" x="72" y="166" width="64" height="64"/>
<text x="151" y="194" class="heading" text-anchor="start">API Gateway</text>
<text x="151" y="219" class="small" text-anchor="start">HTTP request</text>
<rect x="884" y="155" width="244" height="86" rx="12" fill="#FFFFFF" stroke="#CBD7E2"/>
<use href="#aws-lambda" x="896" y="166" width="64" height="64"/>
<text x="975" y="194" class="heading" text-anchor="start">Lambda</text>
<text x="975" y="219" class="small" text-anchor="start">Function</text>
<path data-connector="true" d="M322 184 L855.0 184.0" fill="none" stroke="#496880" stroke-width="2.5"/><path d="M866 184 L854.0 189.0 L854.0 179.0 Z" fill="#496880"/>
<text x="594" y="170" class="small" text-anchor="middle">invoke with event</text>
<path data-connector="true" d="M866 221 L333.0 221.0" fill="none" stroke="#496880" stroke-width="2.5"/><path d="M322 221 L334.0 216.0 L334.0 226.0 Z" fill="#496880"/>
<text x="594" y="253" class="small" text-anchor="middle">result or function error</text>
<!-- Asynchronous lane: internal queue is conceptual, not an SQS queue. -->
<rect x="24" y="294" width="1152" height="182" rx="12" fill="#F4F7FB" stroke="#CBD7E2"/>
<text x="48" y="328" class="heading" text-anchor="start">Asynchronous: acceptance comes before completion</text>
<rect x="60" y="350" width="244" height="86" rx="12" fill="#FFFFFF" stroke="#CBD7E2"/>
<use href="#aws-s3" x="72" y="361" width="64" height="64"/>
<text x="151" y="389" class="heading" text-anchor="start">Amazon S3</text>
<text x="151" y="414" class="small" text-anchor="start">Object event</text>
<rect x="450" y="350" width="270" height="86" rx="12" fill="#FFF4E8" stroke="#E7BB84"/>
<text x="585" y="387" class="heading" text-anchor="middle">Lambda internal</text>
<text x="585" y="417" class="body" text-anchor="middle">event queue</text>
<rect x="884" y="350" width="244" height="86" rx="12" fill="#FFFFFF" stroke="#CBD7E2"/>
<use href="#aws-lambda" x="896" y="361" width="64" height="64"/>
<text x="975" y="389" class="heading" text-anchor="start">Lambda</text>
<text x="975" y="414" class="small" text-anchor="start">Function</text>
<path data-connector="true" d="M322 393 L423.0 393.0" fill="none" stroke="#496880" stroke-width="2.5"/><path d="M434 393 L422.0 398.0 L422.0 388.0 Z" fill="#496880"/>
<text x="378" y="377" class="small" text-anchor="middle">event</text>
<path data-connector="true" d="M738 393 L855.0 393.0" fill="none" stroke="#496880" stroke-width="2.5"/><path d="M866 393 L854.0 398.0 L854.0 388.0 Z" fill="#496880"/>
<text x="802" y="377" class="small" text-anchor="middle">invoke</text>
<text x="48" y="459" class="small" text-anchor="start">Lambda queues work, then executes it; retries are managed by Lambda.</text>
<!-- Polling lane: records travel right, poll requests and results travel left. -->
<rect x="24" y="492" width="1152" height="230" rx="12" fill="#F4F7FB" stroke="#CBD7E2"/>
<text x="48" y="526" class="heading" text-anchor="start">Event source mapping: Lambda polls a source</text>
<rect x="60" y="558" width="244" height="86" rx="12" fill="#FFFFFF" stroke="#CBD7E2"/>
<use href="#aws-sqs" x="72" y="569" width="64" height="64"/>
<text x="151" y="597" class="heading" text-anchor="start">Amazon SQS</text>
<text x="151" y="622" class="small" text-anchor="start">Source queue</text>
<rect x="450" y="558" width="270" height="86" rx="12" fill="#FFF4E8" stroke="#E7BB84"/>
<text x="585" y="592" class="heading" text-anchor="middle">Lambda poller</text>
<text x="585" y="621" class="small" text-anchor="middle">Event source mapping</text>
<rect x="884" y="558" width="244" height="86" rx="12" fill="#FFFFFF" stroke="#CBD7E2"/>
<use href="#aws-lambda" x="896" y="569" width="64" height="64"/>
<text x="975" y="597" class="heading" text-anchor="start">Lambda</text>
<text x="975" y="622" class="small" text-anchor="start">Function</text>
<path data-connector="true" d="M322 581 L423.0 581.0" fill="none" stroke="#496880" stroke-width="2.5"/><path d="M434 581 L422.0 586.0 L422.0 576.0 Z" fill="#496880"/>
<text x="378" y="565" class="small" text-anchor="middle">records</text>
<path data-connector="true" d="M434 627 L333.0 627.0" fill="none" stroke="#496880" stroke-width="2.5"/><path d="M322 627 L334.0 622.0 L334.0 632.0 Z" fill="#496880"/>
<text x="378" y="660" class="small" text-anchor="middle">poll</text>
