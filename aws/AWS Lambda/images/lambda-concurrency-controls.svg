<!-- White canvas; hand-drawn arrow shafts end inside their triangular heads. -->
<rect width="1200" height="570" fill="#FFFFFF"/>
<text x="32" y="43" class="title" text-anchor="start">Reserved capacity and prepared environments are different</text>
<text x="32" y="75" class="body" text-anchor="start">Example: reserved concurrency = 100; provisioned concurrency = 40.</text>
<!-- The outer boundary is a concurrency cap, not a pool of prewarmed servers. -->
<rect x="24" y="99" width="1152" height="340" rx="12" fill="#F4F7FB" stroke="#CBD7E2"/>
<use href="#aws-lambda" x="48" y="120" width="56" height="56"/>
<text x="122" y="144" class="heading" text-anchor="start">One Lambda function</text>
<text x="122" y="174" class="body" text-anchor="start">Maximum: 100 concurrent invocations across its versions</text>
<rect x="48" y="208" width="432" height="112" rx="12" fill="#E9F5EC" stroke="#72AA80"/>
<text x="72" y="255" class="number" text-anchor="start">40</text>
<text x="155" y="244" class="heading" text-anchor="start">Provisioned</text>
<text x="155" y="274" class="small" text-anchor="start">Prepared before requests arrive</text>
<rect x="494" y="208" width="658" height="112" rx="12" fill="#FFF4E8" stroke="#E7BB84"/>
<text x="518" y="255" class="number" text-anchor="start">60</text>
<text x="605" y="244" class="heading" text-anchor="start">Remaining capacity</text>
<text x="605" y="274" class="small" text-anchor="start">Can use on-demand environments; cold starts are possible</text>
<text x="48" y="356" class="body" text-anchor="start">100 reserved units are unavailable to other functions, even when idle.</text>
<text x="48" y="391" class="small" text-anchor="start">Requests beyond the function’s limit are throttled; retry behavior depends on the source.</text>
<!-- Comparison notes explain what each setting buys. -->
<text x="32" y="480" class="heading" text-anchor="start">Reserved concurrency</text>
<text x="32" y="510" class="body" text-anchor="start">Protects capacity and sets a cap.</text>
<text x="32" y="540" class="small" text-anchor="start">No extra reservation charge; no pre-initialization.</text>
<text x="624" y="480" class="heading" text-anchor="start">Provisioned concurrency</text>
<text x="624" y="510" class="body" text-anchor="start">Prepares a version or alias to reduce startup delay.</text>
<text x="624" y="540" class="small" text-anchor="start">Extra charges apply, including while prepared capacity is idle.</text>
</svg>