<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="lambda-concurrency-controls-title lambda-concurrency-controls-desc">
<title id="lambda-concurrency-controls-title">Reserved capacity and prepared environments are different</title>
<desc id="lambda-concurrency-controls-desc">A Lambda function reserves 100 concurrency units. Forty are provisioned environments initialized in advance; up to sixty more can run on demand. The reserve caps concurrency and is not itself pre-initialization.</desc>
