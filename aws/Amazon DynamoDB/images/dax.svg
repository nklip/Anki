<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Application access to DynamoDB through a DAX cluster</title>
  <desc id="diagram-desc">Within an Amazon Virtual Private Cloud, an application on an EC2 instance uses a DAX client to access the DynamoDB Accelerator cache cluster. The DAX cluster communicates with Amazon DynamoDB outside the VPC boundary. Both connections show requests and responses.</desc>
  <!-- Shared typography and service symbols. All source icon paths and fills remain unchanged. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-size: 28px; fill: #000; }
      .title { font-size: 38px; font-weight: 700; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact-heading { font-size: 26px; font-weight: 700; }
      .connection-label { font-size: 25px; }
      .frame { fill: #fff; stroke: #000; stroke-width: 2; }
      .connector { fill: none; stroke: #000; stroke-width: 3; }
      .cache-label { font-family: 'Arial Narrow', Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #fff; }
      .application-label { fill: #fff; }
    </style>
    <!-- DynamoDB artwork: aws-dynamodb-svgrepo-com.svg, distributed by SVG Repo (www.svgrepo.com).
         Preserve its eight paths, fills, native viewBox, and uniform scaling. -->
    <symbol id="aws-dynamodb-service-icon" viewBox="-16.5 0 289 289">
      <path d="M165.258,288.501 L168.766,288.501 L226.027,259.867 L226.98,258.52 L226.98,29.964 L226.027,28.61 L168.766,0 L165.215,0 L165.258,288.501" fill="#5294CF"/>
      <path d="M90.741,288.501 L87.184,288.501 L29.972,259.867 L28.811,257.87 L28.222,31.128 L29.972,28.61 L87.184,0 L90.785,0 L90.741,288.501" fill="#1F5B98"/>
      <path d="M87.285,0 L168.711,0 L168.711,288.501 L87.285,288.501 L87.285,0 Z" fill="#2D72B8"/>
      <path d="M256,137.769 L254.065,137.34 L226.437,134.764 L226.027,134.968 L168.715,132.676 L87.285,132.676 L29.972,134.968 L29.972,91.264 L29.912,91.296 L29.972,91.168 L87.285,77.888 L168.715,77.888 L226.027,91.168 L247.096,102.367 L247.096,95.167 L256,94.193 L255.078,92.395 L226.886,72.236 L226.027,72.515 L168.715,54.756 L87.285,54.756 L29.972,72.515 L29.972,28.61 L0,63.723 L0,94.389 L0.232,94.221 L8.904,95.167 L8.904,102.515 L0,107.28 L0,137.793 L0.232,137.769 L8.904,137.897 L8.904,150.704 L1.422,150.816 L0,150.68 L0,181.205 L8.904,185.993 L8.904,193.426 L0.373,194.368 L0,194.088 L0,224.749 L29.972,259.867 L29.972,215.966 L87.285,233.725 L168.715,233.725 L226.196,215.914 L226.96,216.249 L254.781,196.387 L256,194.408 L247.096,193.426 L247.096,186.142 L245.929,185.676 L226.886,195.941 L226.196,197.381 L168.715,210.584 L168.715,210.6 L87.285,210.6 L87.285,210.584 L29.972,197.325 L29.972,153.461 L87.285,155.745 L87.285,155.801 L168.715,155.801 L226.027,153.461 L227.332,154.061 L254.111,151.755 L256,150.832 L247.096,150.704 L247.096,137.897 L256,137.769" fill="#1A476F"/>
      <path d="M226.027,215.966 L226.027,259.867 L256,224.749 L256,194.288 L226.2,215.914 L226.027,215.966" fill="#2D72B8"/>
      <path d="M226.027,197.421 L226.2,197.381 L256,181.353 L256,150.704 L226.027,153.461 L226.027,197.421" fill="#2D72B8"/>
      <path d="M226.2,91.208 L226.027,91.168 L226.027,134.968 L256,137.769 L256,107.135 L226.2,91.208" fill="#2D72B8"/>
      <path d="M226.2,72.687 L256,94.193 L256,63.731 L226.027,28.61 L226.027,72.515 L226.2,72.575 L226.2,72.687" fill="#2D72B8"/>
    </symbol>
    <!-- VPC artwork: icon-vpc.svg. Preserve its nine original paths and fills. -->
    <symbol id="aws-vpc-service-icon" viewBox="0 0 2073 2474.6">
      <path d="m1038.7 1239v-1235.7l1031 511.6 3.3 724h-135.3l3.3-478.6-595.3-170.5v644.8z" fill="#f58536"/>
      <path d="m1038.7 0v1237.9h-548v-960.6zm-1035.4 1236.8v-726.3l294.9-140.8v867.1h-298.2" fill="#9d5024"/>
      <path d="m298.2 369.7v867.1l192.6 1.1v-818.7z" fill="#f58536"/>
      <path d="m1563.6 813.1v426.9h376.3l1.1-479.7z" fill="#9d5024"/>
      <path d="m1345.7 589.8 595.3 170.5-376.3 52.8-219-47.3z" fill="#6b3918"/>
      <path d="m8.8 1453.5 289.4 50.6v605.2l-294.9-149.6zm478.6 78.1v671.2l548 271.8v-861.5z" fill="#9d5024"/>
      <path d="m2064.2 1453.5v511.6l-1028.8 509.4v-861.5z" fill="#f58536"/>
      <path d="m1360 1416.1v49.5l-872.6 67.1v528.2l-189.3 48.4-1.1-616.2z" fill="#f58536"/>
      <path d="m8.8 1453.5 1116.8-60.5 233.3 22-1064 92.4zm478.6 78.1 1042-104.5 529.3 27.5-1023.3 158.4z" fill="#fabe92"/>
    </symbol>
  </defs>
  <!-- Canvas and title introduce the three-part relationship. -->
  <rect width="1200" height="1000" fill="#fff"/>
  <text class="title" x="50" y="64">Application access through DAX</text>
  <text x="50" y="108">DAX = DynamoDB Accelerator</text>
  <!-- VPC groups the application and cache. The icon interrupts only the top border. -->
  <rect id="vpc-boundary" class="frame" x="50" y="165" width="1100" height="510"/>
  <g id="vpc-icon">
    <rect x="72" y="128" width="94" height="108" fill="#fff"/>
    <use href="#aws-vpc-service-icon" x="79" y="132" width="78" height="94"/>
  </g>
  <text class="heading" x="185" y="218">Amazon VPC <tspan font-size="28" font-weight="400">(Virtual Private Cloud)</tspan></text>
  <!-- Application panel retains the EC2 frame and the application/client relationship. -->
  <rect id="ec2-instance-frame" class="frame" x="115" y="260" width="310" height="345"/>
  <text class="compact-heading" text-anchor="middle" x="270" y="306">Amazon EC2 Instance</text>
  <g id="application-panel">
    <rect x="145" y="341" width="250" height="235" rx="28" fill="#a65021"/>
    <rect x="145" y="335" width="250" height="235" rx="28" fill="#ed7d35"/>
    <rect x="165" y="356" width="210" height="103" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="165" y="490" width="210" height="58" fill="none" stroke="#fff" stroke-width="2"/>
    <text class="application-label" text-anchor="middle" x="270" y="397">Your<tspan x="270" dy="36">Application</tspan></text>
    <text class="application-label" text-anchor="middle" x="270" y="529">DAX Client</text>
  </g>
  <!-- Cache nodes overlap rear-to-front; labels stay in their exposed upper bands. -->
  <rect id="dax-cluster-frame" class="frame" x="775" y="260" width="310" height="345"/>
  <text class="heading" text-anchor="middle" x="930" y="306">DAX Cluster</text>
  <g id="dax-cache-cluster">
    <rect x="805" y="345" width="138" height="137" rx="17" fill="#254c76"/>
    <rect x="805" y="341" width="138" height="137" rx="17" fill="#356aa5"/>
    <text class="cache-label" text-anchor="middle" x="874" y="374">CACHE</text>
    <rect x="847" y="389" width="138" height="137" rx="17" fill="#254c76"/>
    <rect x="847" y="385" width="138" height="137" rx="17" fill="#356aa5"/>
    <text class="cache-label" text-anchor="middle" x="916" y="418">CACHE</text>
    <rect x="889" y="433" width="138" height="137" rx="17" fill="#254c76"/>
    <rect x="889" y="429" width="138" height="137" rx="17" fill="#356aa5"/>
    <text class="cache-label" text-anchor="middle" x="958" y="462">CACHE</text>
  </g>
  <!-- Opposed heads show both directions; shafts end within the broad part of each head. -->
  <g id="application-dax-connection">
    <text class="connection-label" text-anchor="middle" x="600" y="402">Requests + responses</text>
    <path class="connector" d="M445 440H755"/>
    <path d="M426 440L448 429V451Z M774 440L752 429V451Z" fill="#000"/>
  </g>
  <!-- The second connection crosses the VPC boundary intentionally. Its elbows keep the
       two-way flow away from node labels; heads remain outside both destination panels. -->
  <g id="dax-dynamodb-connection">
    <path class="connector" d="M930 625V730H625V778"/>
    <path d="M930 606L919 628H941Z M625 797L614 775H636Z" fill="#000"/>
    <text class="connection-label" text-anchor="middle" x="768" y="711">Requests + responses</text>
  </g>
  <!-- DynamoDB remains outside the VPC. Both native service symbols use uniform scaling. -->
  <g id="dynamodb-service">
    <rect class="frame" x="350" y="798" width="550" height="168"/>
    <use href="#aws-dynamodb-service-icon" x="375" y="812" width="140" height="140"/>
    <text class="heading" x="560" y="860">Amazon<tspan x="560" dy="43">DynamoDB</tspan></text>
  </g>
</svg>
