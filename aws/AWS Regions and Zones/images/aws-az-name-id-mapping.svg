<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="az-ids-title az-ids-desc">
  <title id="az-ids-title">AZ names can differ; AZ IDs identify the same location</title>
  <desc id="az-ids-desc">Illustrative mappings for two accounts created before November 2025 in US East North Virginia. In Account A, names a, b, and c identify use1-az1, use1-az2, and use1-az3 respectively. In Account B, names c, a, and b identify the same three IDs respectively. Arrows mean identifies, not network traffic. AZ IDs are consistent across accounts. Official AWS Account and Region icons label the columns.</desc>
  <!-- Teaching sources: https://docs.aws.amazon.com/global-infrastructure/latest/regions/az-ids.html
       https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-availability-zones.html
       Official icon source: https://aws.amazon.com/architecture/icons/
       Download: https://d1.awsstatic.com/onedam/marketing-channels/website/public/shared/architecture-icon-release/Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip
       Retrieved 2026-09-18. AWS vector artwork is embedded for self-contained rendering.
       The composition and editable teaching labels are original, not an AWS-published diagram. -->
  <!-- Shared typography and official artwork; each symbol use has explicit dimensions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #162B42; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #4B6074; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #4B6074; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 22px; }
      .connector { fill: none; stroke: #496880; stroke-width: 2.5; }
    </style>
    <!-- Official AWS artwork: Architecture-Group-Icons_07312026/Region_32.svg; original paths and colors preserved. -->
    <symbol id="aws-region" viewBox="0 0 40 40"><g xmlns="http://www.w3.org/2000/svg" id="aws-region-Icon-Architecture-Group-32-Region_32" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="aws-region-Rectangle" fill="#00A4A6" x="0" y="0" width="40" height="40" />
        <path d="M14,20.026 L14,11.026 L29.293,11.026 L25.146,15.172 C24.951,15.368 24.951,15.684 25.146,15.88 L29.293,20.026 L14,20.026 Z M26.207,15.526 L30.854,10.88 C30.996,10.736 31.039,10.522 30.962,10.335 C30.885,10.148 30.702,10.026 30.5,10.026 L14,10.026 L14,8.97 C14.596,8.76 15.026,8.198 15.026,7.531 C15.026,6.687 14.34,6 13.495,6 C12.65,6 11.963,6.687 11.963,7.531 C11.963,8.201 12.398,8.766 13,8.973 L13,33.026 L10,33.026 L10,34.026 L17,34.026 L17,33.026 L14,33.026 L14,21.026 L30.5,21.026 C30.702,21.026 30.885,20.904 30.962,20.717 C31.039,20.53 30.996,20.316 30.854,20.172 L26.207,15.526 Z" id="aws-region-Fill-1" fill="#FFFFFF" />
    </g>
</symbol>
    <!-- Official AWS artwork: Architecture-Group-Icons_07312026/AWS-Account_32.svg; original paths and colors preserved. -->
    <symbol id="aws-account" viewBox="0 0 40 40"><g xmlns="http://www.w3.org/2000/svg" id="aws-account-Icon-Architecture-Group-32-AWS-Account_32" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="aws-account-Rectangle" fill="#E7157B" x="0" y="0" width="40" height="40" />
        <path d="M24.5,22 C26.43,22 28,23.57 28,25.5 C28,27.43 26.43,29 24.5,29 C22.57,29 21,27.43 21,25.5 C21,23.57 22.57,22 24.5,22 L24.5,22 Z M24.5,30 C26.981,30 29,27.981 29,25.5 C29,23.019 26.981,21 24.5,21 C22.019,21 20,23.019 20,25.5 C20,27.981 22.019,30 24.5,30 L24.5,30 Z M26.023,10.88 L29.084,17 L22.963,17 L26.023,10.88 Z M22.154,18 L29.893,18 C30.065,18 30.227,17.91 30.318,17.763 C30.409,17.615 30.417,17.432 30.34,17.276 L26.471,9.538 C26.301,9.2 25.746,9.2 25.576,9.538 L21.707,17.276 C21.63,17.432 21.638,17.615 21.729,17.763 C21.82,17.91 21.981,18 22.154,18 L22.154,18 Z M11,23 L18,23 L18,16 L11,16 L11,23 Z M10.5,24 L18.5,24 C18.776,24 19,23.776 19,23.5 L19,15.5 C19,15.224 18.776,15 18.5,15 L10.5,15 C10.224,15 10,15.224 10,15.5 L10,23.5 C10,23.776 10.224,24 10.5,24 L10.5,24 Z M8,32 L32,32 L32,8 L8,8 L8,32 Z M32.5,7 L7.5,7 C7.224,7 7,7.224 7,7.5 L7,32.5 C7,32.776 7.224,33 7.5,33 L32.5,33 C32.776,33 33,32.776 33,32.5 L33,7.5 C33,7.224 32.776,7 32.5,7 L32.5,7 Z" id="aws-account-Fill-1" fill="#FFFFFF" />
    </g>
</symbol>
  </defs>
  <!-- Canvas and lesson title. -->
  <rect width="1200" height="672" rx="14" fill="#FFFFFF"/>
  <text class="title" x="32" y="48">AZ names can differ; AZ IDs identify the same location</text>
  <text class="subtitle" x="32" y="82">Illustrative older-account mappings in us-east-1. Each arrow means “identifies.”</text>
  <!-- Central column is the physical Region. Account columns show names for its locations. -->
  <rect id="physical-region" x="408" y="112" width="384" height="414" rx="10" fill="#F1FAFA" stroke="#00A4A6" stroke-width="2"/>
  <use href="#aws-region" x="432" y="131" width="40" height="40"/>
  <text class="heading" x="488" y="156">Region us-east-1</text>
  <text class="small" x="600" y="193" text-anchor="middle">Consistent AZ ID</text>
  <use href="#aws-account" x="40" y="132" width="40" height="40"/>
  <text class="heading" x="96" y="158">Account A</text>
  <text class="small" x="40" y="193">AZ name in this account</text>
  <use href="#aws-account" x="870" y="132" width="40" height="40"/>
  <text class="heading" x="926" y="158">Account B</text>
  <text class="small" x="870" y="193">AZ name in this account</text>
  <!-- Rows deliberately align by AZ ID so no mapping arrows cross.
       Mapping shafts intentionally cross the Region outline to identify its AZs; they are not traffic.
       Shafts end beneath triangle bases; tips meet the center boxes without entering them. -->
  <g id="mapping-row-1">
    <rect x="40" y="222" width="290" height="68" rx="8" fill="#FFF5FA" stroke="#D899B8" stroke-width="1.5"/>
    <text class="code" x="185" y="264" text-anchor="middle">us-east-1a</text>
    <rect x="870" y="222" width="290" height="68" rx="8" fill="#FFF5FA" stroke="#D899B8" stroke-width="1.5"/>
    <text class="code" x="1015" y="264" text-anchor="middle">us-east-1c</text>
    <rect id="physical-az-1" x="436" y="222" width="328" height="68" rx="8" fill="#FFFFFF" stroke="#00A4A6" stroke-width="1.5"/>
    <text class="code" x="600" y="264" text-anchor="middle">use1-az1</text>
    <path id="account-a-connector-1" class="connector" data-connector="true" d="M330 256 H423"/>
    <path id="account-a-arrowhead-1" d="M421 248 L436 256 L421 264 Z" fill="#496880"/>
    <path id="account-b-connector-1" class="connector" data-connector="true" d="M870 256 H777"/>
    <path id="account-b-arrowhead-1" d="M779 248 L764 256 L779 264 Z" fill="#496880"/>
  </g>
  <g id="mapping-row-2">
    <rect x="40" y="322" width="290" height="68" rx="8" fill="#FFF5FA" stroke="#D899B8" stroke-width="1.5"/>
    <text class="code" x="185" y="364" text-anchor="middle">us-east-1b</text>
    <rect x="870" y="322" width="290" height="68" rx="8" fill="#FFF5FA" stroke="#D899B8" stroke-width="1.5"/>
    <text class="code" x="1015" y="364" text-anchor="middle">us-east-1a</text>
    <rect id="physical-az-2" x="436" y="322" width="328" height="68" rx="8" fill="#FFFFFF" stroke="#00A4A6" stroke-width="1.5"/>
    <text class="code" x="600" y="364" text-anchor="middle">use1-az2</text>
    <path id="account-a-connector-2" class="connector" data-connector="true" d="M330 356 H423"/>
    <path id="account-a-arrowhead-2" d="M421 348 L436 356 L421 364 Z" fill="#496880"/>
    <path id="account-b-connector-2" class="connector" data-connector="true" d="M870 356 H777"/>
    <path id="account-b-arrowhead-2" d="M779 348 L764 356 L779 364 Z" fill="#496880"/>
  </g>
  <g id="mapping-row-3">
    <rect x="40" y="422" width="290" height="68" rx="8" fill="#FFF5FA" stroke="#D899B8" stroke-width="1.5"/>
    <text class="code" x="185" y="464" text-anchor="middle">us-east-1c</text>
    <rect x="870" y="422" width="290" height="68" rx="8" fill="#FFF5FA" stroke="#D899B8" stroke-width="1.5"/>
    <text class="code" x="1015" y="464" text-anchor="middle">us-east-1b</text>
    <rect id="physical-az-3" x="436" y="422" width="328" height="68" rx="8" fill="#FFFFFF" stroke="#00A4A6" stroke-width="1.5"/>
    <text class="code" x="600" y="464" text-anchor="middle">use1-az3</text>
    <path id="account-a-connector-3" class="connector" data-connector="true" d="M330 456 H423"/>
    <path id="account-a-arrowhead-3" d="M421 448 L436 456 L421 464 Z" fill="#496880"/>
    <path id="account-b-connector-3" class="connector" data-connector="true" d="M870 456 H777"/>
    <path id="account-b-arrowhead-3" d="M779 448 L764 456 L779 464 Z" fill="#496880"/>
  </g>
  <!-- Cross-account rule and scope of the historical mapping example. -->
  <rect x="32" y="546" width="1136" height="48" rx="8" fill="#EDF5FC"/>
  <text class="heading" x="600" y="577" text-anchor="middle">Across accounts, compare AZ IDs to identify the same physical AZ.</text>
  <text class="small" x="32" y="625">Different names apply to accounts created before November 2025 in certain older Regions.</text>
  <text class="small" x="32" y="652">Accounts created from November 2025 use consistent mappings; other Regions also use uniform mappings.</text>
</svg>
