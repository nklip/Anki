  <!-- Canvas and lesson title. -->
  <rect width="1200" height="664" rx="14" fill="#FFFFFF"/>
  <text class="title" x="32" y="48">A Region contains isolated Availability Zones</text>
  <text class="subtitle" x="32" y="82">A VPC can span AZs; each subnet stays in one AZ.</text>
  <!-- Region is the geographic boundary; VPC is a logical network within that Region. -->
  <rect id="region-boundary" x="32" y="112" width="1136" height="488" rx="10" fill="#FFFFFF" stroke="#00A4A6" stroke-width="2"/>
  <use href="#aws-region" x="48" y="128" width="40" height="40"/>
  <text class="heading" x="104" y="155">AWS Region: us-east-2 (US East, Ohio)</text>
  <rect id="vpc-boundary" x="56" y="188" width="1088" height="388" rx="8" fill="#FAF8FF" stroke="#8C4FFF" stroke-width="2"/>
  <use href="#aws-vpc" x="72" y="204" width="40" height="40"/>
  <text class="heading" x="128" y="231">VPC — virtual private cloud</text>
  <text class="small" x="750" y="231">One virtual network across the zones</text>
  <!-- AZ outlines are location boundaries, not separate networks. The VPC spans all three.
       Each neutral subnet box is fully contained by one AZ. No routing type is implied. -->
  <g id="zone-a">
    <rect x="80" y="266" width="320" height="286" rx="6" fill="#FFFFFF" stroke="#00A4A6" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text class="heading" x="240" y="302" text-anchor="middle">Availability Zone</text>
    <text class="code" x="240" y="333" text-anchor="middle">us-east-2a</text>
    <rect x="96" y="356" width="288" height="172" rx="8" fill="#F5F8FB" stroke="#9AAEC1" stroke-width="1.5"/>
    <text class="body" x="116" y="388">Subnet A</text>
    <use href="#aws-instance" x="212" y="407" width="56" height="56"/>
    <text class="body" x="240" y="489" text-anchor="middle">EC2 instance</text>
    <text class="small" x="240" y="513" text-anchor="middle">Virtual server</text>
  </g>
  <g id="zone-b">
    <rect x="440" y="266" width="320" height="286" rx="6" fill="#FFFFFF" stroke="#00A4A6" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text class="heading" x="600" y="302" text-anchor="middle">Availability Zone</text>
    <text class="code" x="600" y="333" text-anchor="middle">us-east-2b</text>
    <rect x="456" y="356" width="288" height="172" rx="8" fill="#F5F8FB" stroke="#9AAEC1" stroke-width="1.5"/>
    <text class="body" x="476" y="388">Subnet B</text>
    <use href="#aws-instance" x="572" y="407" width="56" height="56"/>
    <text class="body" x="600" y="489" text-anchor="middle">EC2 instance</text>
    <text class="small" x="600" y="513" text-anchor="middle">Virtual server</text>
  </g>
  <g id="zone-c">
    <rect x="800" y="266" width="320" height="286" rx="6" fill="#FFFFFF" stroke="#00A4A6" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text class="heading" x="960" y="302" text-anchor="middle">Availability Zone</text>
    <text class="code" x="960" y="333" text-anchor="middle">us-east-2c</text>
    <rect x="816" y="356" width="288" height="172" rx="8" fill="#F5F8FB" stroke="#9AAEC1" stroke-width="1.5"/>
    <text class="body" x="836" y="388">Subnet C</text>
    <use href="#aws-instance" x="932" y="407" width="56" height="56"/>
    <text class="body" x="960" y="489" text-anchor="middle">EC2 instance</text>
    <text class="small" x="960" y="513" text-anchor="middle">Virtual server</text>
  </g>
  <!-- Takeaway explains the physical model beyond the network example. -->
  <text class="body" x="32" y="638">Each AZ has one or more data centers. AZs are linked by low-latency, redundant networks.</text>
</svg>
