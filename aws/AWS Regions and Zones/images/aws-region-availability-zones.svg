<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="region-title region-desc">
  <title id="region-title">A Region contains isolated Availability Zones</title>
  <desc id="region-desc">One AWS Region, US East Ohio, contains three Availability Zones. An example VPC spans the three zones. Each subnet and its EC2 instance remain in a single zone. Official AWS Region, VPC, and EC2 instance icons identify the relevant elements. AZ boundaries are dashed teal outlines; subnets are neutral because routing is not specified.</desc>
  <!-- Teaching sources: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
       https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
       https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
       Official icon source: https://aws.amazon.com/architecture/icons/
       Download: https://d1.awsstatic.com/onedam/marketing-channels/website/public/shared/architecture-icon-release/Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip
       Retrieved 2026-09-18. AWS vector artwork is embedded for self-contained rendering.
       The composition and editable teaching labels are original, not an AWS-published diagram. -->
