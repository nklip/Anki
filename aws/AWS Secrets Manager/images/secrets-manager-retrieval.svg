<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="retrieval-title retrieval-desc">
  <title id="retrieval-title">An application retrieves a secret, then connects to its database</title>
  <desc id="retrieval-desc">The orders application uses an IAM role with temporary AWS credentials to request the named secret prod/orders/database from AWS Secrets Manager. If permissions allow the request, Secrets Manager returns the default AWSCURRENT version over an encrypted TLS connection. Secrets Manager stores the value encrypted, using AWS Key Management Service. The application receives a readable username and password and uses them to connect directly to the database. It must protect the value in its memory and avoid logging it.</desc>
  <!-- Conceptual reference: the application, encrypted secrets, and database relationships in
       the source Anki secrets_manager.png. Current retrieval and encryption details:
       https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
       https://docs.aws.amazon.com/secretsmanager/latest/userguide/security-encryption.html
       The request and response have separate arrows; database traffic bypasses Secrets Manager. -->
  <!-- Blue is the application; purple is secret management; green is the database connection. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172d46; }
      .title { font-size: 29px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #4c647e; }
      .code { font-family: monospace; font-size: 18px; }
      .connector { fill: none; stroke: #52677c; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="824" fill="#ffffff"/>
  <!-- The three numbered exchanges establish an unambiguous start and reading order. -->
  <text x="32" y="47" class="title">Retrieve the secret, then use it to connect</text>
  <text x="32" y="82" class="body">The app uses temporary AWS credentials to retrieve a separate database login.</text>

  <!-- Application credentials are visibly separated from the returned database credentials. -->
  <rect id="orders-application" x="32" y="130" width="360" height="400" rx="12" fill="#edf4ff" stroke="#9ebde0" stroke-width="2"/>
  <text x="52" y="168" class="heading">Orders application</text>
  <rect id="application-role" x="52" y="192" width="320" height="124" rx="10" fill="#ffffff" stroke="#9ebde0" stroke-width="2"/>
  <text x="72" y="224" class="heading">IAM role</text>
  <text x="72" y="257" class="body">Temporary AWS credentials</text>
  <text x="72" y="289" class="small">Allow only needed secrets</text>
  <rect id="retrieved-credentials" x="52" y="370" width="320" height="132" rx="10" fill="#ffffff" stroke="#9ebde0" stroke-width="2"/>
  <text x="72" y="403" class="heading">Username + password</text>
  <text x="72" y="437" class="body">Readable in app memory</text>
  <text x="72" y="471" class="small">Protect it; never log the value</text>

  <!-- The service performs envelope decryption; no application-to-KMS request is implied. -->
  <rect id="secrets-manager" x="760" y="130" width="408" height="400" rx="12" fill="#f7f3fb" stroke="#baa6cf" stroke-width="2"/>
  <text x="780" y="168" class="heading">AWS Secrets Manager</text>
  <text x="780" y="218" class="body">Stored value: encrypted</text>
  <text x="780" y="253" class="code">prod/orders/database</text>
  <text x="780" y="289" class="small">Default version: AWSCURRENT</text>
  <rect id="key-management" x="780" y="328" width="368" height="174" rx="10" fill="#ffffff" stroke="#baa6cf" stroke-width="2"/>
  <text x="800" y="359" class="body">AWS Key Management Service</text>
  <text x="800" y="391" class="small">KMS protects the encryption keys.</text>
  <text x="800" y="424" class="small">Secrets Manager handles decryption</text>
  <text x="800" y="451" class="small">on the caller's behalf.</text>
  <text x="800" y="480" class="small">Key permissions still apply.</text>

  <!-- Arrows end two units inside their triangle bases; tips meet the outside of the target stroke. -->
  <text x="576" y="179" class="heading" text-anchor="middle">1. GetSecretValue</text>
  <text x="576" y="208" class="small" text-anchor="middle">Request the named secret</text>
  <path id="secret-request-arrow" class="connector" data-connector="true" d="M393 238 H747"/>
  <polygon points="745,231 759,238 745,245" fill="#52677c"/>
  <text x="576" y="366" class="heading" text-anchor="middle">2. Return AWSCURRENT</text>
  <text x="576" y="396" class="small" text-anchor="middle">Decrypted secret over TLS</text>
  <path id="secret-response-arrow" class="connector" data-connector="true" d="M759 432 H405"/>
  <polygon points="407,425 393,432 407,439" fill="#52677c"/>

  <!-- This direct application-to-database route is separate from both Secrets Manager exchanges. -->
  <rect id="database" x="760" y="568" width="408" height="146" rx="12" fill="#eaf6ef" stroke="#8dbca0" stroke-width="2"/>
  <text x="780" y="605" class="heading">Database</text>
  <text x="780" y="646" class="body">Checks its username and password</text>
  <text x="780" y="681" class="small">Runs the application's queries</text>
  <text x="250" y="591" class="heading">3. Connect to the database</text>
  <text x="250" y="621" class="small">Use the retrieved username and password</text>
  <path id="database-login-arrow" class="connector" data-connector="true" d="M212 531 V652 H747"/>
  <polygon points="745,645 759,652 745,659" fill="#52677c"/>
  <text x="32" y="752" class="body">Database queries travel directly from the application to the database.</text>
  <!-- The abbreviation legend makes the image understandable without its accompanying article. -->
  <text x="32" y="791" class="small">IAM = Identity and Access Management. TLS = Transport Layer Security, which encrypts the network connection.</text>
</svg>
