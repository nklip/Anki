<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="rotation-title rotation-desc">
  <title id="rotation-title">Secret rotation must update the stored value and the database password</title>
  <desc id="rotation-desc">A single-user Lambda rotation changes a database password from A to B. Before rotation, version 1 is AWSCURRENT and the database accepts A. During rotation, after the database password has changed and B has been tested, version 2 is still AWSPENDING while version 1 is current. After successful completion, version 2 becomes AWSCURRENT and version 1 becomes AWSPREVIOUS. New connections can briefly fail during the mismatch. Keeping the old secret version does not mean the database still accepts its password.</desc>
  <!-- Conceptual adaptation of version labels from
       https://docs.aws.amazon.com/images/secretsmanager/latest/userguide/images/SecretVersions.png
       with behavior from https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda-functions.html
       and https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotation-strategy.html.
       A and B identify example passwords; they are not real credentials. -->
  <!-- Shared typography, colors, and manual arrow convention match the retrieval illustration. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172d46; }
      .title { font-size: 29px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #4c647e; }
      .label { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; }
      .connector { fill: none; stroke: #52677c; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="840" fill="#ffffff"/>
  <!-- The middle panel is a specific moment after successful testing and before label promotion. -->
  <text x="32" y="48" class="title">Rotation changes a password in two places</text>
  <text x="32" y="84" class="body">Single-user Lambda rotation example: one database user's password changes from A to B.</text>

  <!-- Before: the only stored version and the database agree. -->
  <g id="before-rotation">
    <rect x="32" y="126" width="340" height="500" rx="12" fill="#f8fafc" stroke="#b8c7d8" stroke-width="2"/>
    <text x="52" y="164" class="heading">Before rotation</text>
    <text x="52" y="198" class="small">One user, one password</text>
    <text x="52" y="243" class="body">Secret versions</text>
    <rect x="52" y="260" width="300" height="90" rx="10" fill="#eaf6ef" stroke="#8dbca0" stroke-width="2"/>
    <text x="72" y="292" class="body">Version 1 · password A</text>
    <text x="72" y="326" class="label">AWSCURRENT</text>
    <text x="52" y="390" class="small">Only version 1 exists.</text>
    <text x="52" y="441" class="body">Default retrieval returns A.</text>
    <rect x="52" y="476" width="300" height="114" rx="10" fill="#edf4ff" stroke="#9dbce3" stroke-width="2"/>
    <text x="72" y="513" class="body">Database accepts A</text>
    <text x="72" y="550" class="small">Stored value and login agree.</text>
  </g>

  <!-- During: the new password is valid in the database but has not yet become the default secret value. -->
  <g id="during-rotation">
    <rect x="430" y="126" width="340" height="500" rx="12" fill="#fffaf2" stroke="#dcb77e" stroke-width="2"/>
    <text x="450" y="164" class="heading">During rotation</text>
    <text x="450" y="198" class="small">After B is set and tested</text>
    <text x="450" y="243" class="body">Secret versions</text>
    <rect x="450" y="260" width="300" height="72" rx="10" fill="#eaf6ef" stroke="#8dbca0" stroke-width="2"/>
    <text x="470" y="289" class="body">Version 1 · password A</text>
    <text x="470" y="318" class="label">AWSCURRENT</text>
    <rect x="450" y="345" width="300" height="72" rx="10" fill="#fff0d8" stroke="#dcb77e" stroke-width="2"/>
    <text x="470" y="374" class="body">Version 2 · password B</text>
    <text x="470" y="403" class="label">AWSPENDING</text>
    <text x="450" y="451" class="body">Default reads still return A.</text>
    <rect x="450" y="476" width="300" height="114" rx="10" fill="#edf4ff" stroke="#9dbce3" stroke-width="2"/>
    <text x="470" y="513" class="body">Database now accepts B</text>
    <text x="470" y="550" class="small">The new password was tested.</text>
  </g>

  <!-- After: promotion changes the default secret version; the saved previous value is not a valid-login guarantee. -->
  <g id="after-rotation">
    <rect x="828" y="126" width="340" height="500" rx="12" fill="#f8fafc" stroke="#b8c7d8" stroke-width="2"/>
    <text x="848" y="164" class="heading">After success</text>
    <text x="848" y="198" class="small">The current label has moved</text>
    <text x="848" y="243" class="body">Secret versions</text>
    <rect x="848" y="260" width="300" height="72" rx="10" fill="#eaf6ef" stroke="#8dbca0" stroke-width="2"/>
    <text x="868" y="289" class="body">Version 2 · password B</text>
    <text x="868" y="318" class="label">AWSCURRENT</text>
    <rect x="848" y="345" width="300" height="72" rx="10" fill="#f0f3f7" stroke="#bac5d0" stroke-width="2"/>
    <text x="868" y="374" class="body">Version 1 · password A</text>
    <text x="868" y="403" class="label">AWSPREVIOUS</text>
    <text x="848" y="451" class="body">Default retrieval returns B.</text>
    <rect x="848" y="476" width="300" height="114" rx="10" fill="#edf4ff" stroke="#9dbce3" stroke-width="2"/>
    <text x="868" y="513" class="body">Database accepts B</text>
    <text x="868" y="550" class="small">New reads and login agree.</text>
  </g>
  <!-- Connect whole states. Heads touch the panels' outer stroke boundaries, with shafts under their bases. -->
  <path id="before-to-during-arrow" class="connector" data-connector="true" d="M373 440 H417"/>
  <polygon points="415,433 429,440 415,447" fill="#52677c"/>
  <path id="during-to-after-arrow" class="connector" data-connector="true" d="M771 440 H815"/>
  <polygon points="813,433 827,440 813,447" fill="#52677c"/>

  <!-- The mismatch is the central operational consequence, not a promise of uninterrupted authentication. -->
  <rect x="32" y="654" width="1136" height="110" rx="12" fill="#fff5e5" stroke="#dcb77e" stroke-width="2"/>
  <text x="52" y="688" class="heading">A brief mismatch can affect new connections</text>
  <text x="52" y="720" class="body">The application may retrieve A after the database has switched to B. Plan refresh and retry behavior.</text>
  <text x="52" y="750" class="small">Keeping AWSPREVIOUS does not make password A valid again. Changing a label alone does not undo a database change.</text>
  <text x="32" y="810" class="small">A and B stand for example passwords. AWS Lambda runs the rotation code; this is not the flow for every rotation mechanism.</text>
</svg>
