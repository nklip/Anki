<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="624" viewBox="0 0 1240 624" role="img" aria-labelledby="receiving-title receiving-desc">
  <title id="receiving-title">Receiving: SES stores mail, then invokes Lambda</title>
  <desc id="receiving-desc">For support@example.com, the SES receipt rule performs two ordered actions. Action one writes the full email to an S3 input bucket. Action two invokes Lambda directly from SES with metadata and headers. The function then uses GetObject to read the saved email. No S3 event notification invokes this function in the shown design, so writing to the bucket does not create a second trigger. Reading an object does not create an object.</desc>
  <!-- Teaching sources: https://docs.aws.amazon.com/ses/latest/dg/receiving-email-concepts.html
       https://docs.aws.amazon.com/ses/latest/dg/receiving-email-action-lambda.html
       https://docs.aws.amazon.com/ses/latest/dg/receiving-email-action-s3.html
       https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
       Official icon source: https://aws.amazon.com/architecture/icons/
       Download: https://d1.awsstatic.com/onedam/marketing-channels/website/public/shared/architecture-icon-release/Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip
       Retrieved 2026-09-17. AWS artwork is embedded as native vectors, with original colors.
       AWS general icons represent an application, mail server, or message, not extra services. -->
  <!-- Shared typography and reusable official artwork. All symbol uses specify dimensions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #162B42; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #4B6074; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #4B6074; }
      .connector { fill: none; stroke: #496880; stroke-width: 2.5; }
      .read-connector { fill: none; stroke: #267B80; stroke-width: 2.5; }
    </style>
