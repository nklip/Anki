  </defs>
  <!-- Canvas and explicit trigger selection. The arrows originate at the service that calls. -->
  <rect width="1240" height="624" fill="#FFFFFF"/>
  <text class="title" x="36" y="48">Receiving: SES stores mail, then invokes Lambda</text>
  <text class="subtitle" x="36" y="80">This design uses the SES receipt rule as the function's trigger.</text>
  <!-- Message source; the SMTP connector enters SES without touching either label. -->
  <rect id="incoming-node" x="36" y="270" width="210" height="182" rx="12" fill="#F5F8FB" stroke="#ADBFCF" stroke-width="1.5"/>
  <use href="#aws-email" x="109" y="292" width="64" height="64"/>
  <text class="heading" x="141" y="392" text-anchor="middle">Incoming email</text>
  <text class="small" x="141" y="425" text-anchor="middle">Sent to your domain</text>
  <path id="incoming-connector" class="connector" data-connector="true" d="M246 360 H313"/>
  <path id="incoming-arrowhead" d="M311 352 L326 360 L311 368 Z" fill="#496880"/>
  <text x="286" y="336" font-size="16" text-anchor="middle">SMTP</text>
  <!-- SES owns both ordered actions; no line from S3 invokes Lambda. -->
  <rect id="ses-receiving-node" x="326" y="204" width="300" height="282" rx="12" fill="#FFF4F5" stroke="#DD344C" stroke-width="1.5"/>
  <use href="#aws-ses" x="444" y="236" width="64" height="64"/>
  <text class="heading" x="476" y="340" text-anchor="middle">Amazon SES</text>
  <text class="body" x="476" y="378" text-anchor="middle">Receipt rule for</text>
  <text class="body" x="476" y="407" text-anchor="middle">support@example.com</text>
  <text class="small" x="476" y="451" text-anchor="middle">Runs actions in order</text>
  <!-- S3 stores incoming mail and has no notification configured to call this function. -->
  <rect id="s3-node" x="866" y="128" width="338" height="208" rx="12" fill="#F5FAEC" stroke="#7AA116" stroke-width="1.5"/>
  <use href="#aws-s3" x="888" y="150" width="56" height="56"/>
  <text class="heading" x="960" y="184">S3 input bucket</text>
  <text class="body" x="888" y="240">incoming/{messageId}</text>
  <text class="small" x="888" y="270">Full email + attachments</text>
  <text class="small" x="888" y="309">No notification to this Lambda</text>
  <!-- The direct SES Lambda action provides metadata and headers. -->
  <rect id="lambda-node" x="866" y="404" width="338" height="178" rx="12" fill="#FFF7EB" stroke="#ED8B23" stroke-width="1.5"/>
  <use href="#aws-lambda" x="888" y="426" width="56" height="56"/>
  <text class="heading" x="960" y="460">Lambda function</text>
  <text class="small" x="888" y="516">SES event: metadata + headers</text>
  <text class="body" x="888" y="553">GetObject reads the email</text>
  <!-- Separate arrows prevent confusing action order with an S3 event notification. -->
  <path id="store-connector" class="connector" data-connector="true" d="M626 250 H853"/>
  <path id="store-arrowhead" d="M851 242 L866 250 L851 258 Z" fill="#496880"/>
  <text class="body" x="746" y="224" text-anchor="middle">1. Store full message</text>
  <path id="invoke-connector" class="connector" data-connector="true" d="M626 448 H853"/>
  <path id="invoke-arrowhead" d="M851 440 L866 448 L851 456 Z" fill="#496880"/>
  <text class="body" x="746" y="422" text-anchor="middle">2. Invoke directly</text>
  <!-- GetObject is a read request from Lambda to S3, not a new write or invocation. -->
  <path id="read-connector" class="read-connector" data-connector="true" d="M1035 404 V349"/>
  <path id="read-arrowhead" d="M1027 351 L1035 336 L1043 351 Z" fill="#267B80"/>
  <text class="small" x="1055" y="377">3. Read body</text>
  <!-- The note states the configured behavior, not a global promise about S3 events. -->
  <rect id="trigger-note" x="36" y="510" width="764" height="72" rx="10" fill="#F5F8FB"/>
  <text x="56" y="540" font-size="20" font-weight="700">No S3-triggered invocation in this design.</text>
  <text class="small" x="56" y="566">Reading an object does not create another object.</text>
  <text class="small" x="36" y="609">S3 = Simple Storage Service · SMTP = Simple Mail Transfer Protocol · Numbers show execution order.</text>
</svg>
