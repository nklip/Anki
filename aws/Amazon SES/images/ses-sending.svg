  <!-- Canvas and lesson heading. -->
  <rect width="1120" height="432" fill="#FFFFFF"/>
  <text class="title" x="36" y="48">Sending: your application submits, SES delivers</text>
  <text class="subtitle" x="36" y="80">Use the same sending service for transactional, marketing, and notification emails.</text>
  <!-- Application: message composition stays with the caller. -->
  <rect id="application-node" x="36" y="116" width="252" height="212" rx="12" fill="#F5F8FB" stroke="#ADBFCF" stroke-width="1.5"/>
  <use href="#aws-application" x="130" y="140" width="64" height="64"/>
  <text class="heading" x="162" y="240" text-anchor="middle">Your application</text>
  <text class="body" x="162" y="276" text-anchor="middle">Content + recipients</text>
  <text class="small" x="162" y="302" text-anchor="middle">For example, an order email</text>
  <!-- SES: preserve the official service icon's colors and aspect ratio. -->
  <rect id="ses-node" x="434" y="116" width="252" height="212" rx="12" fill="#FFF4F5" stroke="#DD344C" stroke-width="1.5"/>
  <use href="#aws-ses" x="528" y="140" width="64" height="64"/>
  <text class="heading" x="560" y="240" text-anchor="middle">Amazon SES</text>
  <text class="body" x="560" y="276" text-anchor="middle">Managed email sending</text>
  <text class="small" x="560" y="302" text-anchor="middle">Attempts delivery</text>
  <!-- Destination is a mail server; delivery does not assert inbox placement. -->
  <rect id="recipient-node" x="832" y="116" width="252" height="212" rx="12" fill="#F5F8FB" stroke="#ADBFCF" stroke-width="1.5"/>
  <use href="#aws-server" x="926" y="140" width="64" height="64"/>
  <text x="958" y="240" text-anchor="middle" font-size="21" font-weight="700">Recipient's mail server</text>
  <text class="body" x="958" y="276" text-anchor="middle">Accepts or rejects mail</text>
  <text class="small" x="958" y="302" text-anchor="middle">Applies its own filtering</text>
  <!-- Each shaft ends under its own triangular base; tips meet node boundaries. -->
  <path id="submit-connector" class="connector" data-connector="true" d="M288 218 H421"/>
  <path id="submit-arrowhead" d="M419 210 L434 218 L419 226 Z" fill="#496880"/>
  <text class="small" x="361" y="194" text-anchor="middle">API or SMTP</text>
  <path id="delivery-connector" class="connector" data-connector="true" d="M686 218 H819"/>
  <path id="delivery-arrowhead" d="M817 210 L832 218 L817 226 Z" fill="#496880"/>
  <text class="small" x="759" y="194" text-anchor="middle">SMTP</text>
  <!-- The footer distinguishes server acceptance from inbox placement. -->
  <text class="body" x="36" y="367">A delivery event means the recipient's mail server accepted the message.</text>
  <text class="small" x="36" y="398">API = application programming interface · SMTP = Simple Mail Transfer Protocol</text>
</svg>
