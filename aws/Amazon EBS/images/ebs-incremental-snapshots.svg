<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" role="img" aria-labelledby="ebs-snapshots-title ebs-snapshots-desc">
  <title id="ebs-snapshots-title">EBS snapshots store changes and restore the full state</title>
  <desc id="ebs-snapshots-desc">One 15 gibibyte volume is captured at three times. Snapshot A stores its first 10 gibibytes of written data and restores all 10. After 4 gibibytes are overwritten, snapshot B stores 4 additional gibibytes and restores all 10. After 2 gibibytes are added, snapshot C stores 2 additional gibibytes and restores all 12. The three snapshots together use 16 gibibytes in the standard tier, without archiving. AWS automatically resolves unchanged-block references when restoring the chosen snapshot.</desc>
  <!-- Conceptual source: https://docs.aws.amazon.com/ebs/latest/userguide/how_snapshots_work.html -->
  <!-- Shared typography and semantic colors; each tile represents one GiB of the volume. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #162b42; }
      .title { font-size: 29px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #4b6074; }
      .existing { fill: #b8d5f4; stroke: #719dc7; stroke-width: 1.5; }
      .changed { fill: #ffdf9c; stroke: #c99536; stroke-width: 1.5; }
      .added { fill: #bce3c9; stroke: #65a17a; stroke-width: 1.5; }
      .unwritten { fill: #f3f6f8; stroke: #bdc9d3; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Canvas, lesson, and unit definition. The numbered panels read left to right. -->
  <rect width="1200" height="812" fill="#fff"/>
  <text x="32" y="47" class="title" text-anchor="start">EBS snapshots store changes and restore the full state</text>
  <text x="32" y="81" class="body" text-anchor="start">One 15 GiB volume; each tile represents 1 GiB (gibibyte).</text>

  <!-- Color key describes the volume contents at the current snapshot. -->
  <g id="volume-block-key">
    <rect x="32" y="110" width="22" height="22" rx="3" class="existing"/>
    <text x="64" y="127" class="small" text-anchor="start">Existing data</text>
    <rect x="276" y="110" width="22" height="22" rx="3" class="changed"/>
    <text x="308" y="127" class="small" text-anchor="start">Overwritten</text>
    <rect x="520" y="110" width="22" height="22" rx="3" class="added"/>
    <text x="552" y="127" class="small" text-anchor="start">Newly added</text>
    <rect x="764" y="110" width="22" height="22" rx="3" class="unwritten"/>
    <text x="796" y="127" class="small" text-anchor="start">Never written</text>
  </g>

  <!-- Snapshot A: keep the added storage and the complete restore amount visually distinct. -->
  <g id="snapshot-a-panel">
    <rect x="32" y="156" width="360" height="496" rx="12" fill="#fff" stroke="#c2cfda" stroke-width="2"/>
    <text x="212" y="194" class="heading" text-anchor="middle">1. Snapshot A</text>
    <text x="212" y="230" class="body" text-anchor="middle">First 10 GiB written</text>
    <g id="snapshot-a-volume-blocks">
      <rect x="66" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="126" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="186" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="246" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="306" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="66" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="126" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="186" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="246" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="306" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="66" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="126" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="186" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="246" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="306" y="330" width="52" height="30" rx="3" class="unwritten"/>
    </g>
    <text x="212" y="394" class="body" text-anchor="middle">10 GiB written</text>
    <text x="212" y="423" class="small" text-anchor="middle">5 GiB never written</text>
    <path d="M54 448 H370" fill="none" stroke="#d9e2e9" stroke-width="1.5"/>
    <text x="212" y="480" class="small" text-anchor="middle">Extra snapshot storage</text>
    <text x="212" y="517" class="title" text-anchor="middle">+10 GiB</text>
    <text x="212" y="562" class="small" text-anchor="middle">Restore from A</text>
    <text x="212" y="597" class="heading" text-anchor="middle">All 10 GiB of data</text>
    <text x="212" y="626" class="small" text-anchor="middle">in a 15 GiB volume</text>
  </g>

  <!-- Snapshot B: keep the added storage and the complete restore amount visually distinct. -->
  <g id="snapshot-b-panel">
    <rect x="420" y="156" width="360" height="496" rx="12" fill="#fff" stroke="#c2cfda" stroke-width="2"/>
    <text x="600" y="194" class="heading" text-anchor="middle">2. Snapshot B</text>
    <text x="600" y="230" class="body" text-anchor="middle">4 GiB overwritten</text>
    <g id="snapshot-b-volume-blocks">
      <rect x="454" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="514" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="574" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="634" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="694" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="454" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="514" y="292" width="52" height="30" rx="3" class="changed"/>
      <rect x="574" y="292" width="52" height="30" rx="3" class="changed"/>
      <rect x="634" y="292" width="52" height="30" rx="3" class="changed"/>
      <rect x="694" y="292" width="52" height="30" rx="3" class="changed"/>
      <rect x="454" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="514" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="574" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="634" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="694" y="330" width="52" height="30" rx="3" class="unwritten"/>
    </g>
    <text x="600" y="394" class="body" text-anchor="middle">10 GiB written</text>
    <text x="600" y="423" class="small" text-anchor="middle">5 GiB never written</text>
    <path d="M442 448 H758" fill="none" stroke="#d9e2e9" stroke-width="1.5"/>
    <text x="600" y="480" class="small" text-anchor="middle">Extra snapshot storage</text>
    <text x="600" y="517" class="title" text-anchor="middle">+4 GiB</text>
    <text x="600" y="562" class="small" text-anchor="middle">Restore from B</text>
    <text x="600" y="597" class="heading" text-anchor="middle">All 10 GiB of data</text>
    <text x="600" y="626" class="small" text-anchor="middle">in a 15 GiB volume</text>
  </g>

  <!-- Snapshot C: keep the added storage and the complete restore amount visually distinct. -->
  <g id="snapshot-c-panel">
    <rect x="808" y="156" width="360" height="496" rx="12" fill="#fff" stroke="#c2cfda" stroke-width="2"/>
    <text x="988" y="194" class="heading" text-anchor="middle">3. Snapshot C</text>
    <text x="988" y="230" class="body" text-anchor="middle">2 GiB newly written</text>
    <g id="snapshot-c-volume-blocks">
      <rect x="842" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="902" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="962" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="1022" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="1082" y="254" width="52" height="30" rx="3" class="existing"/>
      <rect x="842" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="902" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="962" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="1022" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="1082" y="292" width="52" height="30" rx="3" class="existing"/>
      <rect x="842" y="330" width="52" height="30" rx="3" class="added"/>
      <rect x="902" y="330" width="52" height="30" rx="3" class="added"/>
      <rect x="962" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="1022" y="330" width="52" height="30" rx="3" class="unwritten"/>
      <rect x="1082" y="330" width="52" height="30" rx="3" class="unwritten"/>
    </g>
    <text x="988" y="394" class="body" text-anchor="middle">12 GiB written</text>
    <text x="988" y="423" class="small" text-anchor="middle">3 GiB never written</text>
    <path d="M830 448 H1146" fill="none" stroke="#d9e2e9" stroke-width="1.5"/>
    <text x="988" y="480" class="small" text-anchor="middle">Extra snapshot storage</text>
    <text x="988" y="517" class="title" text-anchor="middle">+2 GiB</text>
    <text x="988" y="562" class="small" text-anchor="middle">Restore from C</text>
    <text x="988" y="597" class="heading" text-anchor="middle">All 12 GiB of data</text>
    <text x="988" y="626" class="small" text-anchor="middle">in a 15 GiB volume</text>
  </g>

  <!-- Storage total applies while all three snapshots are retained in the standard tier. -->
  <rect id="storage-total" x="32" y="678" width="1136" height="56" rx="10" fill="#edf4ff"/>
  <text x="600" y="713" class="heading" text-anchor="middle">Three snapshots, not archived: 10 + 4 + 2 = 16 GiB stored</text>

  <!-- Restore behavior: the service resolves block references for the selected snapshot. -->
  <text x="32" y="770" class="body" text-anchor="start">Select one snapshot to restore its complete state. AWS resolves unchanged blocks automatically.</text>
</svg>
