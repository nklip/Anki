<!-- Canvas and lesson heading. -->
<rect width="1200" height="430" rx="14" fill="#FFFFFF"/>
<text class="title" x="32" y="46" text-anchor="start">Mobile push: deliver a notification to an app</text>
<text class="subtitle" x="32" y="80" text-anchor="start">SNS uses the app’s push provider to reach a registered app/device endpoint.</text>
<!-- Delivery after platform application credentials and endpoint registration are configured. -->
