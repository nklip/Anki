<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="sns-mobile-push-delivery-title sns-mobile-push-delivery-desc">
<title id="sns-mobile-push-delivery-title">Mobile push: deliver a notification to an app</title>
<desc id="sns-mobile-push-delivery-desc">After a platform application is configured with provider credentials, a device token creates an SNS platform endpoint. The publisher sends to this endpoint directly or through a topic. SNS forwards the notification through the push provider to the app on the device.</desc>
