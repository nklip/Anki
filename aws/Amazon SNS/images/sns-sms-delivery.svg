<rect width="1200" height="430" rx="14" fill="#FFFFFF"/>
<text class="title" x="32" y="46" text-anchor="start">SMS: deliver text to a phone number</text>
<text class="subtitle" x="32" y="80" text-anchor="start">SNS accepts the message; AWS End User Messaging SMS handles SMS delivery.</text>
<!-- SMS targets a phone number directly or through a topic subscription. -->
