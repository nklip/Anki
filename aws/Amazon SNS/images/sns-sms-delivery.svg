<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="sns-sms-delivery-title sns-sms-delivery-desc">
<title id="sns-sms-delivery-title">SMS: deliver text to a phone number</title>
<desc id="sns-sms-delivery-desc">An application publishes a text to SNS using a phone number directly or an SNS topic with phone-number subscriptions. SNS uses AWS End User Messaging SMS to route the text to the recipient phone number.</desc>
