<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="482" viewBox="0 0 1100 482" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Volume snapshots give you two recovery destinations</title>
<desc id="diagram-desc">An EBS snapshot made from a Volume Gateway volume can restore to a Storage Gateway volume, or for snapshots up to 16 TiB create an EBS volume attached to EC2. Cached volume snapshots above 16 TiB can restore only to Storage Gateway volumes.</desc>
