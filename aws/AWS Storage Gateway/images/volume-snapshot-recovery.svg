<rect width="1100" height="482" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="39" font-size="27" font-weight="700" fill="#142638" text-anchor="start">Volume snapshots give you two recovery destinations</text>
<text x="28" y="69" font-size="17" font-weight="400" fill="#334155" text-anchor="start">A snapshot is a point-in-time backup; recovery creates a usable volume from it.</text>
<!-- Snapshot source and two distinct restore routes. --><rect x="28" y="173" width="262" height="159" rx="12" fill="#f7faef" stroke="#cbd5e1"/><use href="#aws-snapshot" x="48" y="194" width="56" height="56"/><text x="123" y="218" font-size="20" font-weight="700" fill="#334155" text-anchor="start">EBS snapshot</text><text x="48" y="279" font-size="17" font-weight="400" fill="#334155" text-anchor="start">From a stored or cached</text><text x="48" y="306" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Volume Gateway volume</text><rect x="478" y="115" width="594" height="127" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><use href="#aws-volume" x="498" y="135" width="56" height="56"/><text x="575" y="151" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Restore to a Storage Gateway volume</text><text x="575" y="184" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Recover data through a gateway</text><text x="575" y="216" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Cached or stored volume</text><rect x="478" y="282" width="273" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><use href="#aws-ebs" x="496" y="300" width="56" height="56"/><text x="566" y="320" font-size="19" font-weight="700" fill="#334155" text-anchor="start">EBS volume</text><text x="496" y="372" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Snapshot up to 16 TiB</text><text x="496" y="402" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Restored application data</text><rect x="882" y="282" width="190" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><use href="#aws-ec2" x="900" y="300" width="56" height="56"/><text x="973" y="323" font-size="21" font-weight="700" fill="#334155" text-anchor="start">EC2</text><text x="900" y="374" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Recovery server</text><text x="900" y="403" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Runs your app</text><!-- Branch connector joins intentionally; arrow tips end before the target panels. --><path data-connector="true" d="M298 252 H367 V178 H458 M367 252 V353 H458" fill="none" stroke="#526275" stroke-width="2"/><path d="M456 172 L468 178 L456 184 Z M456 347 L468 353 L456 359 Z" fill="#526275"/><path data-connector="true" d="M759 345 H864" fill="none" stroke="#526275" stroke-width="2"/><path d="M862 339 L874 345 L862 351 Z" fill="#526275"/><text x="816.5" y="328" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">Attach</text><text x="28" y="457" font-size="16" font-weight="500" fill="#334155" text-anchor="start">Cached-volume snapshots larger than 16 TiB must be restored to Storage Gateway volumes.</text></g>
</svg>
