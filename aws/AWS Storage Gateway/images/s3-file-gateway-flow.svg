<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">S3 File Gateway: the cache lives on gateway disks</title>
<desc id="diagram-desc">On-premises deployment: an application uses NFS or SMB to reach the S3 File Gateway virtual machine. Cache disks are allocated to that gateway and hold recently accessed data and pending writes. The cache also buffers uploads; there is no separate upload-buffer disk allocation. S3 holds the objects. If the gateway runs on EC2, its cache disks are attached to the EC2 instance.</desc>

