<!-- Canvas and reading-order header. -->

<rect width="1200" height="540" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="39" font-size="27" font-weight="700" fill="#142638" text-anchor="start">S3 File Gateway: the cache lives on gateway disks</text>
<text x="28" y="69" font-size="17" font-weight="400" fill="#334155" text-anchor="start">The gateway caches file data locally and uploads changed files to your S3 bucket.</text>

<!-- Deployment boundaries. The left panel contains the client and gateway host; the right panel is managed cloud storage. -->
<g id="on-premises"><rect x="28" y="112" width="790" height="336" rx="12" fill="#f8fafc" stroke="#cbd5e1"/></g><text x="48" y="142" font-size="14" font-weight="700" fill="#334155" text-anchor="start">ON PREMISES — deployment shown</text><g id="aws-storage"><rect x="948" y="112" width="224" height="336" rx="12" fill="#f8fafc" stroke="#cbd5e1"/></g><text x="968" y="142" font-size="14" font-weight="700" fill="#334155" text-anchor="start">AWS STORAGE</text>
<!-- Gateway host owns the VM and its separately allocated cache disks. -->
<g id="file-gateway-host"><rect x="356" y="160" width="438" height="264" rx="12" fill="#f7faef" stroke="#cbd5e1"/></g><use href="#aws-file" x="376" y="178" width="48" height="48"/><text x="438" y="196" font-size="21" font-weight="700" fill="#334155" text-anchor="start">S3 File Gateway</text><text x="438" y="223" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Virtual machine (VM)</text><text x="376" y="258" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DISKS ALLOCATED TO THIS GATEWAY VM</text><g id="file-cache-disks"><rect x="376" y="272" width="398" height="130" rx="12" fill="#eaf4fb" stroke="#77a9c9"/></g><text x="394" y="300" font-size="20" font-weight="700" fill="#1e526e" text-anchor="start">CACHE — local disk storage</text><text x="394" y="331" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Recently accessed files + pending writes</text><text x="394" y="360" font-size="17" font-weight="400" fill="#334155" text-anchor="start">This cache also buffers uploads.</text><text x="394" y="387" font-size="16" font-weight="400" fill="#334155" text-anchor="start">No separate upload-buffer disks.</text>
<!-- Client-to-gateway protocol path stays above the disk panel. -->
<g id="file-client"><rect x="48" y="186" width="196" height="132" rx="12" fill="#fff" stroke="#cbd5e1"/></g><text x="66" y="220" font-size="20" font-weight="700" fill="#334155" text-anchor="start">Your application</text><text x="66" y="253" font-size="17" font-weight="400" fill="#334155" text-anchor="start">File share</text><text x="66" y="288" font-size="16" font-weight="400" fill="#334155" text-anchor="start">reports/june.csv</text><path data-connector="true" d="M252 233 H338" fill="none" stroke="#526275" stroke-width="2"/><path d="M336 227 L348 233 L336 239 Z" fill="#526275"/><text x="300.0" y="216" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">NFS / SMB</text>
<!-- The managed S3 bucket holds objects, while the cache remains with the gateway host. -->
<use href="#aws-s3" x="970" y="165" width="56" height="56"/><text x="1038" y="187" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Amazon S3</text><text x="1038" y="213" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Your bucket</text><text x="968" y="257" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Object key:</text><text x="968" y="284" font-size="16" font-weight="500" fill="#334155" text-anchor="start">reports/june.csv</text><text x="968" y="383" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Files persist as objects</text>
<!-- Separate upload and cache-miss fetch paths connect the gateway host to S3. -->
<path data-connector="true" d="M802 310 H930" fill="none" stroke="#526275" stroke-width="2"/><path d="M928 304 L940 310 L928 316 Z" fill="#526275"/><text x="871.0" y="293" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">Upload writes</text><path data-connector="true" d="M940 357 H812" fill="none" stroke="#526275" stroke-width="2"/><path d="M814 351 L802 357 L814 363 Z" fill="#526275"/><text x="871.0" y="340" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">Fetch on miss</text><text x="28" y="480" font-size="17" font-weight="500" fill="#334155" text-anchor="start">Location on EC2: the cache is on storage attached to the EC2 instance hosting the gateway.</text><text x="28" y="512" font-size="16" font-weight="400" fill="#334155" text-anchor="start">NFS = Network File System; SMB = Server Message Block. Gateway-to-S3 transfers use HTTPS.</text></g>
</svg>
