<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Volume Gateway: cache, primary data, and upload buffer</title>
<desc id="diagram-desc">Stored mode: on-premises gateway disks hold the entire primary dataset and a separate upload buffer; no gateway cache storage is allocated. Cached mode: disks allocated to the gateway VM provide cache storage and a separate upload buffer; primary data is in S3. Cache stores recent reads and pending writes. For a cached gateway hosted on EC2, cache storage is attached to the EC2 instance.</desc>

