<!-- Canvas and reading-order header. -->

<rect width="1200" height="768" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="39" font-size="27" font-weight="700" fill="#142638" text-anchor="start">Volume Gateway: cache, primary data, and upload buffer</text>
<text x="28" y="69" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Both modes expose disks over iSCSI. Read each row from the gateway’s local disks to AWS storage.</text>
<text x="28" y="116" font-size="14" font-weight="700" fill="#334155" text-anchor="start">MODE</text><text x="218" y="116" font-size="14" font-weight="700" fill="#334155" text-anchor="start">ON PREMISES — gateway host and its allocated disks</text><text x="958" y="116" font-size="14" font-weight="700" fill="#334155" text-anchor="start">AWS STORAGE</text>
<!-- Stored mode uses full primary storage plus upload-buffer disks; neither is a gateway cache. -->
<g id="stored-mode"><rect x="28" y="140" width="166" height="232" rx="12" fill="#eef2f6" stroke="#cbd5e1"/></g><text x="48" y="178" font-size="23" font-weight="700" fill="#334155" text-anchor="start">Stored</text><text x="48" y="210" font-size="21" font-weight="700" fill="#334155" text-anchor="start">volumes</text><text x="48" y="271" font-size="17" font-weight="700" fill="#334155" text-anchor="start">Cache: none</text><text x="48" y="303" font-size="16" font-weight="400" fill="#334155" text-anchor="start">All data local</text><g id="stored-gateway-host"><rect x="218" y="140" width="584" height="232" rx="12" fill="#f7faef" stroke="#cbd5e1"/></g><use href="#aws-volume" x="240" y="158" width="48" height="48"/><text x="306" y="180" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Volume Gateway — stored mode</text><text x="306" y="210" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Local disks hold the complete primary dataset</text><g id="stored-primary-disks"><rect x="240" y="234" width="278" height="114" rx="12" fill="#edf2e2" stroke="#afc487"/></g><text x="258" y="263" font-size="17" font-weight="700" fill="#334155" text-anchor="start">PRIMARY DATA DISKS</text><text x="258" y="293" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Entire dataset</text><text x="258" y="323" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Application reads and writes</text><g id="stored-upload-buffer"><rect x="536" y="234" width="244" height="114" rx="12" fill="#fff4df" stroke="#d7b46b"/></g><text x="554" y="263" font-size="17" font-weight="700" fill="#334155" text-anchor="start">UPLOAD BUFFER</text><text x="554" y="293" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Separate local disks</text><text x="554" y="323" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Stages backup data</text><g id="stored-aws-backups"><rect x="958" y="140" width="214" height="232" rx="12" fill="#f8fafc" stroke="#cbd5e1"/></g><use href="#aws-snapshot" x="978" y="160" width="56" height="56"/><text x="1046" y="185" font-size="21" font-weight="700" fill="#334155" text-anchor="start">EBS</text><text x="1046" y="213" font-size="18" font-weight="700" fill="#334155" text-anchor="start">snapshots</text><text x="978" y="270" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Point-in-time backups</text><text x="978" y="303" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Stored in AWS</text><path data-connector="true" d="M810 293 H940" fill="none" stroke="#526275" stroke-width="2"/><path d="M938 287 L950 293 L938 299 Z" fill="#526275"/><text x="880.0" y="276" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">Async backup</text>
<!-- Cached mode separates read/write cache from upload staging; S3 holds the primary dataset. -->
<g id="cached-mode"><rect x="28" y="404" width="166" height="260" rx="12" fill="#eef2f6" stroke="#cbd5e1"/></g><text x="48" y="442" font-size="23" font-weight="700" fill="#334155" text-anchor="start">Cached</text><text x="48" y="474" font-size="21" font-weight="700" fill="#334155" text-anchor="start">volumes</text><text x="48" y="537" font-size="17" font-weight="700" fill="#1e526e" text-anchor="start">Cache: yes</text><text x="48" y="569" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Gateway disks</text><g id="cached-gateway-host"><rect x="218" y="404" width="584" height="260" rx="12" fill="#f7faef" stroke="#cbd5e1"/></g><use href="#aws-volume" x="240" y="423" width="48" height="48"/><text x="306" y="446" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Volume Gateway — cached mode</text><text x="306" y="476" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Disks allocated to this gateway VM</text><g id="cached-cache-disks"><rect x="240" y="500" width="540" height="72" rx="12" fill="#eaf4fb" stroke="#77a9c9"/></g><text x="258" y="529" font-size="19" font-weight="700" fill="#1e526e" text-anchor="start">CACHE — local disks</text><text x="258" y="557" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Recently accessed data + writes awaiting upload</text><g id="cached-upload-buffer"><rect x="240" y="586" width="540" height="60" rx="12" fill="#fff4df" stroke="#d7b46b"/></g><text x="258" y="611" font-size="17" font-weight="700" fill="#334155" text-anchor="start">UPLOAD BUFFER — separate local disks</text><text x="258" y="634" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Stages data for upload</text><g id="cached-aws-storage"><rect x="958" y="404" width="214" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1"/></g><use href="#aws-s3" x="978" y="426" width="56" height="56"/><text x="1046" y="449" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Amazon S3</text><text x="978" y="526" font-size="16" font-weight="700" fill="#334155" text-anchor="start">PRIMARY DATASET</text><text x="978" y="558" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Cloud-backed volume</text><text x="978" y="625" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Snapshots supported</text><path data-connector="true" d="M950 543 H820" fill="none" stroke="#526275" stroke-width="2"/><path d="M822 537 L810 543 L822 549 Z" fill="#526275"/><text x="880.0" y="526" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">Fetch on miss</text><path data-connector="true" d="M810 621 H940" fill="none" stroke="#526275" stroke-width="2"/><path d="M938 615 L950 621 L938 627 Z" fill="#526275"/><text x="880.0" y="604" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">Async upload</text><text x="28" y="700" font-size="17" font-weight="500" fill="#334155" text-anchor="start">An upload buffer stages transfers. Cache storage also serves recently accessed data.</text><text x="28" y="727" font-size="16" font-weight="400" fill="#334155" text-anchor="start">For a cached gateway on EC2, cache disks are attached to that EC2 instance. Stored mode runs on premises.</text><text x="28" y="753" font-size="16" font-weight="400" fill="#334155" text-anchor="start">iSCSI = Internet Small Computer System Interface: a protocol for accessing network storage as disks.</text></g>
</svg>
