<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="860" viewBox="0 0 1260 860" role="img" aria-labelledby="title desc">
  <title id="title">WSGI, MCP and API gateways have different roles</title>
  <desc id="desc">WSGI is a Python call interface, MCP is a message protocol, and an API gateway is a running traffic-handling component. One possible request path goes from an AI application containing an MCP client, through MCP messages to an MCP server exposing an order tool. The tool calls a backend over HTTP through an API gateway to a WSGI server. That server uses the WSGI Python call contract to invoke a Python orders application. This composition is optional; the arrows show request direction and the boxes show running software. The WSGI contract is grouped around the server and application rather than drawn as another server.</desc>

  <!-- Shared CS diagram palette and typography; arrow labels distinguish communication from software. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.3px; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .role-title { font-size: 21px; font-weight: 700; }
      .copy { font-size: 18px; fill: #334155; }
      .node-title { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .node-copy { font-size: 17px; fill: #334155; text-anchor: middle; }
      .edge-label { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .edge-note { font-size: 16px; fill: #475569; text-anchor: middle; }
      .arrow-shaft { stroke: #475569; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1260" height="860" fill="#f8fafc"/>

  <!-- First state the category distinction, before showing how the parts can be composed. -->
  <g id="heading-and-roles">
    <text class="eyebrow" x="50" y="33">INTERFACE · PROTOCOL · RUNNING COMPONENT</text>
    <text class="title" x="50" y="77">WSGI, MCP and API gateways have different roles</text>
    <text class="subtitle" x="50" y="107">An AI tool can reach a Python web application through all three.</text>

    <rect x="50" y="134" width="356" height="72" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text class="role-title" x="74" y="163" style="fill:#6d28d9">WSGI</text>
    <text class="copy" x="74" y="189">Python call interface</text>

    <rect x="452" y="134" width="356" height="72" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="role-title" x="476" y="163" style="fill:#1d4ed8">MCP</text>
    <text class="copy" x="476" y="189">Message protocol</text>

    <rect x="854" y="134" width="356" height="72" rx="15" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text class="role-title" x="878" y="163" style="fill:#92400e">API gateway</text>
    <text class="copy" x="878" y="189">Running traffic-handling component</text>
  </g>

  <!-- Request path crosses the top row left to right, then turns down and left. -->
  <g id="mcp-and-gateway-stages">
    <text class="eyebrow" x="50" y="246">ONE POSSIBLE REQUEST PATH · FOLLOW THE ARROWS</text>

    <rect id="ai-client" x="50" y="276" width="260" height="148" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-title" x="180" y="313">AI application</text>
    <text class="node-copy" x="180" y="347">Contains an MCP client</text>
    <text class="node-copy" x="180" y="381">Requests an order tool</text>

    <rect id="mcp-server" x="500" y="276" width="260" height="148" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="node-title" x="630" y="313">MCP server</text>
    <text class="node-copy" x="630" y="347">Offers tools and context</text>
    <text class="node-copy" x="630" y="381">Order tool calls an API</text>

    <rect id="api-gateway" x="950" y="276" width="260" height="148" rx="15" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text class="node-title" x="1080" y="313">API gateway</text>
    <text class="node-copy" x="1080" y="347">Routing, access control,</text>
    <text class="node-copy" x="1080" y="381">rate limits (typical)</text>

    <!-- Each shaft ends just inside its head's base; tips meet destination borders. -->
    <text class="edge-label" x="405" y="327" style="fill:#1d4ed8">MCP messages</text>
    <line class="arrow-shaft" data-connector="true" x1="312" y1="350" x2="483" y2="350"/>
    <polygon points="499,350 482,341 482,359" fill="#475569"/>
    <text class="edge-note" x="405" y="385">Tool call</text>

    <text class="edge-label" x="855" y="327">HTTP request</text>
    <line class="arrow-shaft" data-connector="true" x1="762" y1="350" x2="933" y2="350"/>
    <polygon points="949,350 932,341 932,359" fill="#475569"/>
    <text class="edge-note" x="855" y="385">Backend API call</text>
  </g>

  <!-- WSGI encloses only the server/application contract, without adding a software stage. -->
  <g id="wsgi-contract">
    <rect x="480" y="492" width="750" height="214" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text class="eyebrow" x="504" y="521" style="fill:#6d28d9">WSGI CONTRACT: SERVER + APPLICATION</text>

    <rect id="wsgi-server" x="950" y="538" width="260" height="148" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text class="node-title" x="1080" y="575">WSGI server</text>
    <text class="node-copy" x="1080" y="609">Handles HTTP traffic</text>
    <text class="node-copy" x="1080" y="643">Calls the Python app</text>

    <rect id="python-orders-app" x="500" y="538" width="260" height="148" rx="15" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="node-title" x="630" y="575">Python orders app</text>
    <text class="node-copy" x="630" y="609">Processes the request</text>
    <text class="node-copy" x="630" y="643">Produces response bytes</text>

    <text class="edge-label" x="855" y="589" style="fill:#6d28d9">WSGI calls</text>
    <line class="arrow-shaft" data-connector="true" x1="948" y1="612" x2="777" y2="612"/>
    <polygon points="761,612 778,603 778,621" fill="#475569"/>
    <text class="edge-note" x="855" y="647">Python interface</text>
  </g>

  <!-- HTTP routing enters the contract region intentionally; the arrow ends at the server. -->
  <g id="gateway-to-server">
    <line class="arrow-shaft" data-connector="true" x1="1080" y1="426" x2="1080" y2="521"/>
    <polygon points="1080,537 1071,520 1089,520" fill="#475569"/>
    <text class="edge-label" x="1140" y="469">HTTP</text>
  </g>

  <!-- Reading key uses the lower-left space to explain nodes, arrows, and optional composition. -->
  <g id="reading-key">
    <text class="eyebrow" x="50" y="512">HOW TO READ THIS PATH</text>
    <text class="copy" x="50" y="549">Boxes = running software.</text>
    <text class="copy" x="50" y="582">Arrows = calls or messages.</text>
    <text class="copy" x="50" y="615">Only request direction is shown.</text>
    <text class="copy" x="50" y="663">These stages are not all mandatory.</text>
  </g>

  <!-- Expand each abbreviation locally so the diagram stands on its own. -->
  <g id="abbreviation-key">
    <rect x="50" y="732" width="1160" height="88" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="copy" x="76" y="766">WSGI = Web Server Gateway Interface</text>
    <text class="copy" x="76" y="797">API = Application Programming Interface</text>
    <text class="copy" x="680" y="766">MCP = Model Context Protocol</text>
    <text class="copy" x="680" y="797">HTTP = Hypertext Transfer Protocol</text>
  </g>
</svg>
