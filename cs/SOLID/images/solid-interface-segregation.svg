<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="751" viewBox="0 0 1200 751" role="img" aria-labelledby="title desc">
  <title id="title">ISP: depend on what the client needs</title>
  <desc id="desc">In the problem design, a PrintJob depends on a broad OfficeDevice interface containing print, scan, and fax. BasicPrinter cannot provide meaningful scan and fax behavior. In the repaired design, PrintJob uses only Printer and BasicPrinter implements Printer. Scanner and Fax are separate client-focused interfaces; an AllInOne device can implement Printer, Scanner, and Fax. Interface size follows client needs, not a rule of one method per interface.</desc>

  <!-- Reuse the folder's light panels and blue contracts; explicit labels explain color. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .heading { font-size: 23px; font-weight: 700; }
      .copy { font-size: 20px; fill: #334155; }
      .node { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 19px; fill: #334155; text-anchor: middle; }
      .relation { font-size: 19px; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="751" fill="#f8fafc"/>

  <!-- Reading order is problem above, repair below; blue nodes are interface contracts. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="35">I · INTERFACE SEGREGATION PRINCIPLE</text>
    <text class="title" x="50" y="80">ISP: depend on what the client needs</text>
    <text class="subtitle" x="50" y="112">Give each client a suitable contract without forcing unrelated operations on it.</text>
  </g>
  <g id="broad-contract-problem" transform="translate(0 26)">
    <rect x="50" y="112" width="1100" height="220" rx="15" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text class="heading" x="75" y="148" style="fill:#b91c1c">Problem: one broad OfficeDevice contract</text>
    <rect x="75" y="179" width="185" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="445" y="169" width="300" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="925" y="169" width="200" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text class="node" x="167" y="215">PrintJob</text>
    <text class="detail" x="167" y="244">Only prints</text>
    <text class="node" x="595" y="208" style="fill:#1d4ed8">OfficeDevice</text>
    <text class="detail" x="595" y="244">print · scan · fax</text>
    <text class="node" x="1025" y="204">BasicPrinter</text>
    <text class="detail" x="1025" y="234">print works;</text>
    <text class="detail" x="1025" y="259" style="fill:#b91c1c">scan / fax do not</text>
    <!-- Labeled arrows point toward the dependency or implemented contract. -->
    <line id="broad-client-uses-shaft" data-connector="true" x1="260" y1="236" x2="429" y2="236" stroke="#64748b" stroke-width="2"/>
    <polygon points="445,236 427,228 427,244" fill="#64748b"/>
    <text class="relation" x="353" y="211">uses</text>
    <line id="broad-printer-implements-shaft" data-connector="true" x1="925" y1="236" x2="761" y2="236" stroke="#64748b" stroke-width="2"/>
    <polygon points="745,236 763,228 763,244" fill="#64748b"/>
    <text class="relation" x="835" y="211">implements</text>
    <text class="copy" x="75" y="309">BasicPrinter must pretend to support operations it cannot provide.</text>
  </g>

  <!-- Repair keeps the print-only client independent of scanning and faxing. -->
  <g id="client-focused-repair" transform="translate(0 26)">
    <rect x="50" y="354" width="1100" height="313" rx="15" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text class="heading" x="75" y="390" style="fill:#166534">Repair: separate contracts around client needs</text>
    <rect x="75" y="419" width="185" height="73" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="445" y="419" width="230" height="73" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="925" y="419" width="200" height="73" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="node" x="167" y="449">PrintJob</text>
    <text class="detail" x="167" y="477">Only prints</text>
    <text class="node" x="560" y="449" style="fill:#1d4ed8">Printer</text>
    <text class="detail" x="560" y="477">print</text>
    <text class="node" x="1025" y="449">BasicPrinter</text>
    <text class="detail" x="1025" y="477">print supported</text>
    <line id="focused-client-uses-shaft" data-connector="true" x1="260" y1="466" x2="429" y2="466" stroke="#64748b" stroke-width="2"/>
    <polygon points="445,466 427,458 427,474" fill="#64748b"/>
    <text class="relation" x="353" y="442">uses only</text>
    <line id="focused-printer-implements-shaft" data-connector="true" x1="925" y1="466" x2="691" y2="466" stroke="#64748b" stroke-width="2"/>
    <polygon points="675,466 693,458 693,474" fill="#64748b"/>
    <text class="relation" x="800" y="442">implements</text>

    <!-- A grouped set of three separate contracts avoids suggesting one combined interface. -->
    <rect x="75" y="537" width="470" height="78" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="925" y="537" width="200" height="78" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="detail" x="310" y="565">Three separate interfaces</text>
    <text class="node" x="310" y="597" style="fill:#1d4ed8">Printer · Scanner · Fax</text>
    <text class="node" x="1025" y="585">AllInOne</text>
    <line id="all-in-one-implements-shaft" data-connector="true" x1="925" y1="589" x2="561" y2="589" stroke="#64748b" stroke-width="2"/>
    <polygon points="545,589 563,581 563,597" fill="#64748b"/>
    <text class="relation" x="735" y="565">implements all three</text>
    <!-- Caption baseline leaves 34 units below the boxes for visible text clearance. -->
    <text class="copy" x="75" y="649">A device can provide several capabilities without making every client depend on them.</text>
  </g>
  <text class="copy" x="50" y="727">Choose interface size from client needs; this is not a universal “one method per interface” rule.</text>
</svg>
