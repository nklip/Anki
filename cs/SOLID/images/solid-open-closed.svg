<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">OCP: add a new policy without rewriting Checkout</title>
  <desc id="desc">The Open–Closed Principle allows a chosen behavior to be extended through a stable contract. A problem example adds more conditional branches to Checkout for every new discount. In the improved structure, Checkout depends on the DiscountPolicy interface with the operation discountFor(total). StandardDiscount and MemberDiscount already implement it. A new SeasonalDiscount also implements the contract, extending the behavior without changing Checkout's calculation logic. Arrows explicitly distinguish depends on from implements. Configuration or object creation may still change.</desc>

  <!-- Light CS style; blue denotes the contract, red the problem, green the new extension. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .node-title { font-size: 24px; font-weight: 700; text-anchor: middle; }
      .node-copy { font-size: 18px; fill: #475569; text-anchor: middle; }
      .contract-label { font-size: 18px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .code { font-family: "Courier New", Courier, monospace; font-size: 20px; text-anchor: middle; }
      .edge-label { font-size: 18px; font-weight: 700; fill: #475569; }
      .arrow-shaft { fill: none; stroke: #64748b; stroke-width: 3; }
      .copy { font-size: 19px; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="#f8fafc"/>

  <!-- Name the principle and limit the lesson to a deliberately chosen extension point. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="35">O · OPEN–CLOSED PRINCIPLE</text>
    <text class="title" x="50" y="80">OCP: add a new policy without rewriting Checkout</text>
    <text class="subtitle" x="50" y="112">Extend behavior through a stable interface at a chosen extension point.</text>
  </g>

  <!-- A concrete trigger makes clear which existing logic the interface protects. -->
  <g id="problem">
    <rect x="50" y="139" width="1100" height="65" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="76" y="179" font-size="22" font-weight="700" fill="#b91c1c">Problem:</text>
    <text class="copy" x="186" y="179">Every new discount type adds another conditional branch to Checkout.</text>
  </g>

  <!-- The consumer depends only on the explicitly labeled contract. -->
  <g id="stable-client-and-contract">
    <text class="eyebrow" x="50" y="240">IMPROVED STRUCTURE · EXTENSION POINT: DISCOUNT CALCULATION</text>
    <rect id="checkout" x="50" y="265" width="280" height="115" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-title" x="190" y="312">Checkout</text>
    <text class="node-copy" x="190" y="349">Keep calculation logic</text>

    <rect id="discount-policy-contract" x="500" y="265" width="300" height="115" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="contract-label" x="650" y="294">INTERFACE / CONTRACT</text>
    <text class="node-title" x="650" y="326">DiscountPolicy</text>
    <text class="code" x="650" y="358">discountFor(total)</text>

    <!-- Dependency arrow joins beneath the triangle and ends at the contract's outer border. -->
    <text class="edge-label" x="364" y="299">depends on</text>
    <line class="arrow-shaft" data-connector="true" x1="332" y1="322" x2="483" y2="322"/>
    <polygon points="499,322 482,313 482,331" fill="#64748b"/>

    <text x="846" y="304" font-size="21" font-weight="700" fill="#1d4ed8">Stable agreement</text>
    <text class="copy" x="846" y="338">Any policy supplies</text>
    <text class="copy" x="846" y="365">the same operation.</text>
  </g>

  <!-- Implementations point toward the contract. Orthogonal routes avoid crossing each other. -->
  <g id="implementation-arrows">
    <path class="arrow-shaft" data-connector="true" d="M220 480 V435 H560 V397"/>
    <polygon points="560,381 551,398 569,398" fill="#64748b"/>
    <text class="edge-label" x="281" y="423">implements</text>

    <line class="arrow-shaft" data-connector="true" x1="650" y1="480" x2="650" y2="397"/>
    <polygon points="650,381 641,398 659,398" fill="#64748b"/>
    <text class="edge-label" x="670" y="464">implements</text>

    <path class="arrow-shaft" data-connector="true" d="M980 480 V435 H740 V397" style="stroke:#15803d"/>
    <polygon points="740,381 731,398 749,398" fill="#15803d"/>
    <text class="edge-label" x="846" y="423" style="fill:#166534">implements</text>
  </g>

  <!-- Existing implementations remain in place; adding the green one supplies new behavior. -->
  <g id="policy-implementations">
    <rect id="standard-discount" x="70" y="482" width="300" height="85" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-title" x="220" y="516">StandardDiscount</text>
    <text class="node-copy" x="220" y="546">Existing implementation</text>

    <rect id="member-discount" x="500" y="482" width="300" height="85" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-title" x="650" y="516">MemberDiscount</text>
    <text class="node-copy" x="650" y="546">Existing implementation</text>

    <rect id="seasonal-discount" x="830" y="482" width="300" height="85" rx="15" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="node-title" x="980" y="516">SeasonalDiscount</text>
    <text class="node-copy" x="980" y="546" style="fill:#166534">New implementation</text>
  </g>

  <!-- Scope and wiring caveat prevent interpreting OCP as a ban on changing any existing code. -->
  <g id="takeaway">
    <rect x="50" y="603" width="1100" height="111" rx="15" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="76" y="638" font-size="23" font-weight="700">Add SeasonalDiscount; Checkout still uses the same contract.</text>
    <text class="copy" x="76" y="670">Checkout's calculation logic stays unchanged for this new discount policy.</text>
    <text class="copy" x="76" y="698">Object creation or configuration may change to select the new policy.</text>
  </g>
</svg>
