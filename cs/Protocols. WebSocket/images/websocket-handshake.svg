<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="784" viewBox="0 0 1268 784" role="img" aria-labelledby="title desc">
  <title id="title">The WebSocket opening handshake, request to 101 to open connection</title>
  <desc id="desc">Step one, marked with a laptop icon because the browser acts: the browser sends an HTTP/1.1 GET carrying Upgrade colon websocket, Connection colon Upgrade, a random Sec-WebSocket-Key, and Sec-WebSocket-Version 13. Step two, marked with a server icon: the server joins that key to a fixed GUID, takes the SHA-1 hash and base64-encodes it to produce Sec-WebSocket-Accept. Step three, also the server: it answers 101 Switching Protocols carrying that value. The band underneath shows a laptop at one end and a server at the other, with the same connection then carrying WebSocket frames in both directions until a Close frame.</desc>
  <!-- Icons copied from System Design/12. Chat System: high-level-statefull-arch.svg (laptop) and
       System Design/18. Google Maps: cdn-vs-no-cdn.svg (server). The icon at the head of each step
       box says who acts in that step: browser, then server, then server. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 22px; font-weight: 700; }
      .small { font-size: 18px; fill: #536174; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #17212f; }
      .codedim { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #6b7a8c; }
      .key { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #0b78b5; font-weight: 700; }
      .step { font-size: 18px; font-weight: 700; fill: #536174; }
    </style>
    <symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="#fff" stroke="#17212f" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#17212f"/></symbol>
    <symbol id="server" viewBox="0 0 76 100"><path d="M8 8h48l14 10v67L54 94H8z" fill="#8e9aa6"/><path d="M56 8 70 18v67L56 94z" fill="#b4bec8"/><rect x="17" y="18" width="31" height="14" rx="2" fill="#eee"/><rect x="17" y="38" width="31" height="14" rx="2" fill="#eee"/><circle cx="33" cy="72" r="6" fill="#eee"/></symbol>
  </defs>
  <rect width="1268" height="784" fill="#fff"/>
  <text x="28" y="44" class="title">The opening handshake: one HTTP request, then no more HTTP</text>
  <text x="28" y="78" class="sub">Read left to right. Nothing is re-dialled &#8212; steps 2 and 3 happen on the connection step 1 arrived on.</text>
  <!-- Step 1: an ordinary HTTP/1.1 GET whose header fields make the upgrade offer. -->
  <rect x="28" y="104" width="360" height="470" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="52" y="122" width="50" height="39"/>
  <text x="116" y="150" class="step">STEP 1</text>
  <text x="52" y="192" class="heading">Browser offers an upgrade</text>
  <text x="52" y="218" class="small">An ordinary HTTP/1.1 GET.</text>
  <text x="52" y="256" class="code">GET /chat HTTP/1.1</text>
  <text x="52" y="283" class="codedim">Host: chat.example.com</text>
  <text x="52" y="310" class="key">Upgrade: websocket</text>
  <text x="52" y="337" class="key">Connection: Upgrade</text>
  <text x="52" y="364" class="key">Sec-WebSocket-Key:</text>
  <text x="71" y="391" class="key">dGhlIHNhbXBsZSBub25jZQ==</text>
  <text x="52" y="418" class="key">Sec-WebSocket-Version: 13</text>
  <text x="52" y="445" class="codedim">Sec-WebSocket-Protocol: chat</text>
  <text x="52" y="472" class="codedim">Origin: https://example.com</text>
  <text x="52" y="520" class="small">Upgrade, Connection and the two</text>
  <text x="52" y="542" class="small">Sec- fields are the giveaway.</text>
  <!-- Connectors sit level with the icons and STEP labels: they order the steps, not the values. -->
  <path data-connector="true" d="M396 142 L424 142" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="436,142 422,148 422,136" fill="#17212f"/>
  <!-- Step 2: the fixed GUID is what stops a forged or replayed GET from being accepted. -->
  <rect x="444" y="104" width="340" height="470" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="468" y="120" width="33" height="44"/>
  <text x="516" y="150" class="step">STEP 2</text>
  <text x="468" y="192" class="heading">Server proves it read</text>
  <text x="468" y="218" class="heading">the key</text>
  <rect x="468" y="238" width="292" height="44" rx="8" fill="#fff" stroke="#0b78b5" stroke-width="2"/>
  <text x="614" y="267" class="code" text-anchor="middle">dGhlIHNhbXBsZSBub25jZQ==</text>
  <path data-connector="true" d="M614 286 L614 298" fill="none" stroke="#17212f" stroke-width="2"/>
  <polygon points="614,310 608,296 620,296" fill="#17212f"/>
  <text x="634" y="304" class="small">joined to</text>
  <rect x="468" y="316" width="292" height="66" rx="8" fill="#fff" stroke="#8fa2b5" stroke-width="2"/>
  <text x="614" y="344" class="code" text-anchor="middle">258EAFA5-E914-47DA-</text>
  <text x="614" y="368" class="code" text-anchor="middle">95CA-C5AB0DC85B11</text>
  <path data-connector="true" d="M614 386 L614 398" fill="none" stroke="#17212f" stroke-width="2"/>
  <polygon points="614,410 608,396 620,396" fill="#17212f"/>
  <text x="634" y="404" class="small">SHA-1</text>
  <rect x="504" y="416" width="220" height="40" rx="8" fill="#fff" stroke="#8fa2b5" stroke-width="2"/>
  <text x="614" y="443" class="codedim" text-anchor="middle">20 raw bytes</text>
  <path data-connector="true" d="M614 460 L614 472" fill="none" stroke="#17212f" stroke-width="2"/>
  <polygon points="614,484 608,470 620,470" fill="#17212f"/>
  <text x="634" y="478" class="small">base64</text>
  <rect x="468" y="490" width="292" height="44" rx="8" fill="#eaf4fb" stroke="#0b78b5" stroke-width="2"/>
  <text x="614" y="519" class="code" text-anchor="middle">s3pPLMBiTxaQ9kYGzzhZRbK+xOo=</text>
  <path data-connector="true" d="M792 142 L820 142" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="832,142 818,148 818,136" fill="#17212f"/>
  <!-- Step 3: 101 is the only status that opens a WebSocket. -->
  <rect x="840" y="104" width="400" height="470" rx="12" fill="#f2f8ee" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="864" y="120" width="33" height="44"/>
  <text x="912" y="150" class="step">STEP 3</text>
  <text x="864" y="192" class="heading">Server switches protocols</text>
  <text x="864" y="218" class="small">Status 101, never 200.</text>
  <text x="864" y="256" class="key">HTTP/1.1 101 Switching Protocols</text>
  <text x="864" y="283" class="key">Upgrade: websocket</text>
  <text x="864" y="310" class="key">Connection: Upgrade</text>
  <text x="864" y="337" class="key">Sec-WebSocket-Accept:</text>
  <text x="883" y="364" class="key">s3pPLMBiTxaQ9kYGzzhZRbK+xOo=</text>
  <text x="864" y="391" class="codedim">Sec-WebSocket-Protocol: chat</text>
  <text x="864" y="456" class="small">The browser recomputes the same hash</text>
  <text x="864" y="478" class="small">and compares. A mismatch, a missing</text>
  <text x="864" y="500" class="small">field, or any status other than 101</text>
  <text x="864" y="522" class="small">means no WebSocket: the reply stays an</text>
  <text x="864" y="544" class="small">ordinary HTTP response.</text>
  <!-- The band is the outcome: one connection, no further HTTP. The two icons name its ends. -->
  <rect x="28" y="604" width="1212" height="156" rx="12" fill="#fff" stroke="#3f7d20" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="56" y="642" class="heading">From here on: one connection, both directions</text>
  <use href="#laptop" x="56" y="666" width="52" height="40"/>
  <text x="118" y="698" class="small">browser</text>
  <text x="640" y="672" class="small" text-anchor="middle">text and binary frames sent by either side, with no request</text>
  <path data-connector="true" d="M212 688 L1068 688" fill="none" stroke="#3f7d20" stroke-width="2.5"/>
  <polygon points="1080,688 1066,694 1066,682" fill="#3f7d20"/>
  <polygon points="200,688 214,682 214,694" fill="#3f7d20"/>
  <text x="1092" y="698" class="small">server</text>
  <use href="#server" x="1160" y="664" width="33" height="44"/>
  <text x="56" y="738" class="small">It stays open until one side sends a Close frame or the transport drops.</text>
</svg>
