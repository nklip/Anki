<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="636" viewBox="0 0 1288 636" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a WebSocket frame: header fields, opcodes, fragmentation and masking</title>
  <desc id="desc">A strip shows one frame left to right: FIN one bit, RSV1 to RSV3 three bits, opcode four bits, MASK one bit, payload length seven bits, an extended length of zero, two or eight bytes, a masking key of zero or four bytes, and the payload. Three panels below expand it. The opcode panel lists 0x0 continuation, 0x1 text, 0x2 binary, 0x8 close, 0x9 ping and 0xA pong. The fragmentation panel shows one message sent as three frames, the first two with FIN 0. The masking panel shows two direction rows drawn as icons: a laptop with an arrow to a server, labelled browser to server, above MASK 1 with a fresh four-byte key; and a server with an arrow to a laptop, labelled server to browser, above MASK 0 with no key.</desc>
  <!-- Icons copied from System Design/12. Chat System: high-level-statefull-arch.svg (laptop) and
       System Design/18. Google Maps: cdn-vs-no-cdn.svg (server). They carry the asymmetry the MASK
       panel exists to teach: the rule depends on which end sent the frame. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 22px; font-weight: 700; }
      .small { font-size: 18px; fill: #536174; }
      .field { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .bits { font-size: 16px; fill: #536174; text-anchor: middle; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #17212f; }
    </style>
    <symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="#fff" stroke="#17212f" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#17212f"/></symbol>
    <symbol id="server" viewBox="0 0 76 100"><path d="M8 8h48l14 10v67L54 94H8z" fill="#8e9aa6"/><path d="M56 8 70 18v67L56 94z" fill="#b4bec8"/><rect x="17" y="18" width="31" height="14" rx="2" fill="#eee"/><rect x="17" y="38" width="31" height="14" rx="2" fill="#eee"/><circle cx="33" cy="72" r="6" fill="#eee"/></symbol>
  </defs>
  <rect width="1288" height="636" fill="#fff"/>
  <text x="28" y="44" class="title">What actually travels: the frame</text>
  <text x="28" y="78" class="sub">A message is carried in one or more frames. Every frame starts with the same small header.</text>
  <!-- Header strip. Blue = fields the three panels below expand; block widths are for legibility only. -->
  <rect x="56" y="128" width="76" height="76" fill="#cfe6f5" stroke="#8fa2b5" stroke-width="2"/>
  <text x="94" y="162" class="field">FIN</text>
  <text x="94" y="188" class="bits">1 bit</text>
  <rect x="132" y="128" width="96" height="76" fill="#f2f5f8" stroke="#8fa2b5" stroke-width="2"/>
  <text x="180" y="162" class="field">RSV1-3</text>
  <text x="180" y="188" class="bits">3 bits</text>
  <rect x="228" y="128" width="128" height="76" fill="#cfe6f5" stroke="#8fa2b5" stroke-width="2"/>
  <text x="292" y="162" class="field">opcode</text>
  <text x="292" y="188" class="bits">4 bits</text>
  <rect x="356" y="128" width="92" height="76" fill="#cfe6f5" stroke="#8fa2b5" stroke-width="2"/>
  <text x="402" y="162" class="field">MASK</text>
  <text x="402" y="188" class="bits">1 bit</text>
  <rect x="448" y="128" width="160" height="76" fill="#f2f5f8" stroke="#8fa2b5" stroke-width="2"/>
  <text x="528" y="162" class="field">payload len</text>
  <text x="528" y="188" class="bits">7 bits</text>
  <rect x="608" y="128" width="200" height="76" fill="#f2f5f8" stroke="#8fa2b5" stroke-width="2"/>
  <text x="708" y="162" class="field">extended len</text>
  <text x="708" y="188" class="bits">0, 2 or 8 bytes</text>
  <rect x="808" y="128" width="184" height="76" fill="#f2f5f8" stroke="#8fa2b5" stroke-width="2"/>
  <text x="900" y="162" class="field">masking key</text>
  <text x="900" y="188" class="bits">0 or 4 bytes</text>
  <rect x="992" y="128" width="240" height="76" fill="#f2f5f8" stroke="#8fa2b5" stroke-width="2"/>
  <text x="1112" y="162" class="field">payload</text>
  <text x="1112" y="188" class="bits">the data itself</text>
  <text x="56" y="232" class="small">Widths are drawn for legibility, not to scale. A payload length of 126 means &#8220;the real length is in the next two bytes&#8221;;</text>
  <text x="56" y="256" class="small">127 means &#8220;the next eight&#8221;. The three panels below expand FIN, opcode and MASK &#8212; the fields that decide how a frame is read.</text>
  <!-- opcode: which three are data and which three are control. -->
  <rect x="28" y="286" width="380" height="322" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="52" y="322" class="heading">opcode &#8212; what this frame is</text>
  <text x="52" y="358" class="code">0x0</text>
  <text x="112" y="358" class="code">continuation</text>
  <text x="290" y="358" class="small">data</text>
  <text x="52" y="388" class="code">0x1</text>
  <text x="112" y="388" class="code">text (UTF-8)</text>
  <text x="290" y="388" class="small">data</text>
  <text x="52" y="418" class="code">0x2</text>
  <text x="112" y="418" class="code">binary</text>
  <text x="290" y="418" class="small">data</text>
  <text x="52" y="448" class="code">0x8</text>
  <text x="112" y="448" class="code">close</text>
  <text x="290" y="448" class="small">control</text>
  <text x="52" y="478" class="code">0x9</text>
  <text x="112" y="478" class="code">ping</text>
  <text x="290" y="478" class="small">control</text>
  <text x="52" y="508" class="code">0xA</text>
  <text x="112" y="508" class="code">pong</text>
  <text x="290" y="508" class="small">control</text>
  <text x="52" y="548" class="small">A control frame carries at most 125 bytes</text>
  <text x="52" y="570" class="small">and is never split.</text>
  <!-- FIN: the bit that says whether the message continues. -->
  <rect x="432" y="286" width="440" height="322" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="456" y="322" class="heading">FIN &#8212; is the message finished?</text>
  <rect x="456" y="346" width="116" height="72" rx="8" fill="#fff" stroke="#0b78b5" stroke-width="2"/>
  <text x="514" y="376" class="field">FIN 0</text>
  <text x="514" y="402" class="bits">text</text>
  <rect x="594" y="346" width="116" height="72" rx="8" fill="#fff" stroke="#0b78b5" stroke-width="2"/>
  <text x="652" y="376" class="field">FIN 0</text>
  <text x="652" y="402" class="bits">cont.</text>
  <rect x="732" y="346" width="116" height="72" rx="8" fill="#fff" stroke="#0b78b5" stroke-width="2"/>
  <text x="790" y="376" class="field">FIN 1</text>
  <text x="790" y="402" class="bits">cont.</text>
  <!-- Span bar, not an arrow: it groups the three frames into one message. -->
  <path d="M457 436 V450 M457 450 H847 M847 450 V436" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
  <text x="652" y="484" class="small" text-anchor="middle">the receiver hands up one message, not three</text>
  <text x="456" y="524" class="small">Only the first frame names the type; the rest</text>
  <text x="456" y="546" class="small">say &#8220;continuation&#8221;. A ping or a close may be</text>
  <text x="456" y="568" class="small">slipped in between two fragments.</text>
  <!-- MASK: obligatory one way, forbidden the other. Each row leads with the sender's icon,
       because the rule is about which end sent the frame, not about what the frame contains. -->
  <rect x="896" y="286" width="364" height="322" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="920" y="322" class="heading">MASK &#8212; who scrambles</text>
  <use href="#laptop" x="920" y="334" width="36" height="28"/>
  <path data-connector="true" d="M966 348 L982 348" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="994,348 980,354 980,342" fill="#17212f"/>
  <use href="#server" x="1004" y="332" width="24" height="32"/>
  <text x="1044" y="357" class="small">browser to server</text>
  <rect x="920" y="372" width="316" height="40" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="1078" y="399" class="code" text-anchor="middle">MASK 1, fresh 4-byte key</text>
  <use href="#server" x="920" y="420" width="24" height="32"/>
  <path data-connector="true" d="M956 436 L972 436" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="984,436 970,442 970,430" fill="#17212f"/>
  <use href="#laptop" x="994" y="422" width="36" height="28"/>
  <text x="1044" y="445" class="small">server to browser</text>
  <rect x="920" y="460" width="316" height="40" rx="8" fill="#fff" stroke="#8fa2b5" stroke-width="2"/>
  <text x="1078" y="487" class="code" text-anchor="middle">MASK 0, no key</text>
  <text x="920" y="524" class="small">Not encryption. It stops a hostile</text>
  <text x="920" y="546" class="small">page from choosing the exact bytes</text>
  <text x="920" y="568" class="small">an old proxy sees. That trick once</text>
  <text x="920" y="590" class="small">poisoned caches in the wild.</text>
</svg>
