<svg xmlns="http://www.w3.org/2000/svg" width="1438" height="620" viewBox="0 0 1438 620" role="img" aria-labelledby="title desc">
  <title id="title">The hops a wss connection crosses, and what each one can do to it</title>
  <desc id="desc">Five hops in a row: browser, forward proxy, reverse proxy, load balancer, app server. Under each one, what it must do for the connection to survive. The browser picks port 443 for wss and 80 for ws. A forward proxy issues CONNECT host colon 443 and relays bytes. A reverse proxy ends TLS and must copy the Upgrade and Connection header fields upstream; NGINX closes the connection after 60 seconds with no data from upstream. A load balancer must keep the connection on one instance, and an AWS Application Load Balancer idles it out after 60 seconds. The app server holds one open socket per client. A band below explains ping and pong keepalives and the Extended CONNECT handshake used on HTTP/2 and HTTP/3.</desc>
  <!-- Icons copied from System Design/12. Chat System: high-level-statefull-arch.svg (laptop) and high-level-design.svg (load balancer), System Design/18. Google Maps: cdn-vs-no-cdn.svg (server), and System Design/15. Google Drive: high-level-design.svg (server rack). -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 20px; fill: #536174; }
      .heading { font-size: 22px; font-weight: 700; }
      .node { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .note { font-size: 15px; fill: #405062; }
      .band { font-size: 18px; fill: #536174; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 15px; fill: #17212f; }
    </style>
    <symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="#fff" stroke="#17212f" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#17212f"/></symbol>
    <symbol id="server" viewBox="0 0 76 100"><path d="M8 8h48l14 10v67L54 94H8z" fill="#8e9aa6"/><path d="M56 8 70 18v67L56 94z" fill="#b4bec8"/><rect x="17" y="18" width="31" height="14" rx="2" fill="#eee"/><rect x="17" y="38" width="31" height="14" rx="2" fill="#eee"/><circle cx="33" cy="72" r="6" fill="#eee"/></symbol>
    <symbol id="lb" viewBox="0 0 90 85"><path d="M12 3 H78 L87 81 H3 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M45 16 V66 M45 29 L30 46 V60 M45 29 L60 46 V60"/><path d="M39 22 L45 16 L51 22 M24 54 L30 60 L36 54 M54 54 L60 60 L66 54 M39 60 L45 66 L51 60"/></g><circle cx="45" cy="13" r="5" fill="#fff"/></symbol>
    <symbol id="servers" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#65c515"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#65c515"/><g fill="#65c515"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/></symbol>
  </defs>
  <rect width="1438" height="620" fill="#fff"/>
  <text x="28" y="44" class="title">Across the internet: five hops, and what each one can do to it</text>
  <text x="28" y="78" class="sub">Not every connection crosses every middle hop &#8212; and each one that does can silently end it. Read left to right.</text>
  <rect x="28" y="132" width="230" height="124" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="110" y="153" width="66" height="51"/>
  <text x="143" y="238" class="node">browser</text>
  <text x="28" y="296" class="note">wss:// means TLS on port 443;</text>
  <text x="28" y="318" class="note">ws:// means plain TCP on 80.</text>
  <text x="28" y="340" class="note">The browser API sets no request</text>
  <text x="28" y="362" class="note">headers: cookies, the subprotocol</text>
  <text x="28" y="384" class="note">list and the query string are all</text>
  <text x="28" y="406" class="note">the handshake carries.</text>
  <path data-connector="true" d="M268.0 188.0L294.00 188.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="306.0,188.0 292.00,194.00 292.00,182.00" fill="#17212f"/>
  <rect x="316" y="132" width="230" height="124" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="410" y="151" width="42" height="55"/>
  <text x="431" y="238" class="node">forward proxy</text>
  <text x="316" y="296" class="note">Only if the client is configured</text>
  <text x="316" y="318" class="note">for one. It sees CONNECT</text>
  <text x="316" y="340" class="note">host:443, opens the tunnel, and</text>
  <text x="316" y="362" class="note">relays bytes it cannot read.</text>
  <text x="316" y="384" class="note">On port 80 there is no tunnel: a</text>
  <text x="316" y="406" class="note">proxy may drop the Upgrade.</text>
  <path data-connector="true" d="M556.0 188.0L582.00 188.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="594.0,188.0 580.00,194.00 580.00,182.00" fill="#17212f"/>
  <rect x="604" y="132" width="230" height="124" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#server" x="698" y="151" width="42" height="55"/>
  <text x="719" y="238" class="node">reverse proxy</text>
  <text x="604" y="296" class="note">Ends TLS. It must copy Upgrade</text>
  <text x="604" y="318" class="note">and Connection upstream, or the</text>
  <text x="604" y="340" class="note">101 never arrives and the</text>
  <text x="604" y="362" class="note">browser sees a plain response.</text>
  <text x="604" y="384" class="note">NGINX closes the connection</text>
  <text x="604" y="406" class="note">after 60 s with no upstream data.</text>
  <path data-connector="true" d="M844.0 188.0L870.00 188.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="882.0,188.0 868.00,194.00 868.00,182.00" fill="#17212f"/>
  <rect x="892" y="132" width="230" height="124" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#lb" x="981" y="154" width="52" height="49"/>
  <text x="1007" y="238" class="node">load balancer</text>
  <text x="892" y="296" class="note">Must keep this connection on one</text>
  <text x="892" y="318" class="note">instance for its whole life: a</text>
  <text x="892" y="340" class="note">different instance has no memory</text>
  <text x="892" y="362" class="note">of it. An AWS Application Load</text>
  <text x="892" y="384" class="note">Balancer idles a quiet connection</text>
  <text x="892" y="406" class="note">out after 60 s by default.</text>
  <path data-connector="true" d="M1132.0 188.0L1158.00 188.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="1170.0,188.0 1156.00,194.00 1156.00,182.00" fill="#17212f"/>
  <rect x="1180" y="132" width="230" height="124" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#servers" x="1262" y="155" width="66" height="46"/>
  <text x="1295" y="238" class="node">app server</text>
  <text x="1180" y="296" class="note">Holds one open socket per</text>
  <text x="1180" y="318" class="note">client, for as long as the client</text>
  <text x="1180" y="340" class="note">stays. Whatever the session</text>
  <text x="1180" y="362" class="note">knows lives in this process, so a</text>
  <text x="1180" y="384" class="note">restart drops every one of its</text>
  <text x="1180" y="406" class="note">clients at the same moment.</text>
  <!-- Two cross-cutting facts that do not belong to any single hop. -->
  <rect x="28" y="452" width="1382" height="140" rx="12" fill="#f2f8ee" stroke="#b9c8d4" stroke-width="2"/>
  <text x="56" y="490" class="heading">What keeps it open</text>
  <text x="56" y="522" class="band">A ping frame obliges the other side to answer with a pong. Sent every</text>
  <text x="56" y="546" class="band">20&#8211;30 seconds it resets the idle timer on every hop above, and a ping</text>
  <text x="56" y="570" class="band">that goes unanswered is how a server notices a client that vanished.</text>
  <path d="M732 470 V574" fill="none" stroke="#b9c8d4" stroke-width="2"/>
  <text x="768" y="490" class="heading">What changes on HTTP/2 and HTTP/3</text>
  <text x="768" y="522" class="band">There is no Upgrade field and no 101. The client opens one stream with</text>
  <text x="768" y="546" class="band">an Extended CONNECT carrying :protocol = websocket, the server answers</text>
  <text x="768" y="570" class="band">:status 200, and the same frames flow inside that stream.</text>
</svg>
