<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">STAR Task: state your responsibility and target</title>
  <desc id="desc">Task is the second part of the STAR interview method: Situation, Task, Action, Result. A fictional software interview example compares the vague aim Make tests faster with the personal objective I owned reducing runtime below 15 minutes without removing tests. The stronger version specifies ownership, a measurable target, and a constraint. Task describes the responsibility and target; Action describes the steps taken to achieve them.</desc>

  <!-- Match the Situation diagram exactly so the paired stages remain easy to compare. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .example { font-size: 24px; }
      .copy { font-size: 19px; fill: #334155; }
      .arrow-label { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f8fafc"/>

  <!-- Name the stage and ask for the interviewee's own objective. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="34">STAR = SITUATION · TASK · ACTION · RESULT</text>
    <text class="title" x="50" y="79">T — Task: state your responsibility and target</text>
    <text class="subtitle" x="50" y="111">What did you personally need to achieve?</text>
    <text class="eyebrow" x="50" y="154">FICTIONAL SOFTWARE INTERVIEW EXAMPLE</text>
  </g>

  <!-- A broad team aim omits who owns it and what successful completion requires. -->
  <g id="vague-task">
    <rect x="50" y="179" width="470" height="214" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text class="panel-title" x="76" y="214" style="fill:#b91c1c">Vague team aim</text>
    <text class="example" x="76" y="268">“Make tests faster.”</text>
    <text class="copy" x="76" y="331">Missing: personal ownership,</text>
    <text class="copy" x="76" y="359">target and constraints.</text>
  </g>

  <!-- The stronger task explains the personal target without prematurely listing actions. -->
  <g id="personal-task">
    <rect x="630" y="179" width="520" height="214" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="panel-title" x="656" y="214" style="fill:#166534">Personal objective</text>
    <text class="example" x="656" y="264">“I owned reducing runtime below</text>
    <text class="example" x="656" y="296">15 minutes without removing tests.”</text>
    <text class="copy" x="656" y="359">Ownership + measurable target + constraint</text>
  </g>

  <!-- Reuse the same clean shaft/head geometry as the Situation comparison. -->
  <g id="clarify-task-arrow">
    <text class="arrow-label" x="575" y="259">Clarify</text>
    <line id="clarify-arrow-shaft" data-connector="true" x1="522" y1="284" x2="613" y2="284" stroke="#64748b" stroke-width="3"/>
    <polygon id="clarify-arrow-head" points="629,284 612,275 612,293" fill="#64748b"/>
  </g>

  <!-- Explicitly distinguish the Task stage from Action, a frequent source of confusion. -->
  <g id="takeaway">
    <rect x="50" y="418" width="1100" height="68" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="76" y="447" font-size="22" font-weight="700">Task = your responsibility and target.</text>
    <text class="subtitle" x="76" y="474">Action = the specific steps you took to achieve it.</text>
  </g>
</svg>
