<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">STAR Situation: give relevant context</title>
  <desc id="desc">Situation is the first part of the STAR interview method: Situation, Task, Action, Result. A fictional software interview example compares the vague statement Our tests were slow with the more specific context Before a release, the full test suite took 30 minutes, delaying feedback. The stronger version explains timing, the problem, and why it mattered. Keep context brief rather than giving a long project history.</desc>

  <!-- Shared CS light theme; red and green distinguish vague and clearer interview examples. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .example { font-size: 24px; }
      .copy { font-size: 19px; fill: #334155; }
      .arrow-label { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f8fafc"/>

  <!-- Define STAR locally and identify both the stage and the question it answers. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="34">STAR = SITUATION · TASK · ACTION · RESULT</text>
    <text class="title" x="50" y="79">S — Situation: give relevant context</text>
    <text class="subtitle" x="50" y="111">What was happening, and why did it matter?</text>
    <text class="eyebrow" x="50" y="154">FICTIONAL SOFTWARE INTERVIEW EXAMPLE</text>
  </g>

  <!-- The weak example leaves the listener unable to judge timing or consequences. -->
  <g id="vague-situation">
    <rect x="50" y="179" width="470" height="214" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text class="panel-title" x="76" y="214" style="fill:#b91c1c">Too vague</text>
    <text class="example" x="76" y="268">“Our tests were slow.”</text>
    <text class="copy" x="76" y="331">Missing: relevant context</text>
    <text class="copy" x="76" y="359">and why the delay mattered.</text>
  </g>

  <!-- The stronger example adds only the details needed to explain the stakes. -->
  <g id="specific-situation">
    <rect x="630" y="179" width="520" height="214" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="panel-title" x="656" y="214" style="fill:#166534">Specific, relevant context</text>
    <text class="example" x="656" y="264">“Before a release, the full test suite</text>
    <text class="example" x="656" y="296">took 30 minutes, delaying feedback.”</text>
    <text class="copy" x="656" y="359">Timing + problem + stakes</text>
  </g>

  <!-- Revision arrow: shaft stops under its triangle; tip meets the right panel's outer border. -->
  <g id="clarify-situation-arrow">
    <text class="arrow-label" x="575" y="259">Clarify</text>
    <line id="clarify-arrow-shaft" data-connector="true" x1="522" y1="284" x2="613" y2="284" stroke="#64748b" stroke-width="3"/>
    <polygon id="clarify-arrow-head" points="629,284 612,275 612,293" fill="#64748b"/>
  </g>

  <!-- Prevent context from expanding into an unrelated project history. -->
  <g id="takeaway">
    <rect x="50" y="418" width="1100" height="68" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="76" y="447" font-size="22" font-weight="700">Keep context brief and explain the stakes.</text>
    <text class="subtitle" x="76" y="474">Skip a long project history; include only what the listener needs to understand the example.</text>
  </g>
</svg>
