<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">STAR Result: show what changed, not just what you did</title>
  <desc id="desc">Result is the fourth part of the STAR interview method: Situation, Task, Action, Result. A fictional software interview example compares the vague statement I delivered the optimization, which reports an activity, with a specific outcome: runtime fell from 30 to 12 minutes on the same machine with the same tests, and all tests passed. A useful learning is to measure before choosing a fix. In a real answer, use numbers only when verified and describe outcomes honestly when no measurement exists.</desc>

  <!-- Shared STAR template; red and green distinguish vague and clearer interview examples. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .example { font-size: 24px; }
      .copy { font-size: 19px; fill: #334155; }
      .arrow-label { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>

  <!-- Define STAR locally and keep the fictional label visible above the invented measurements. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="34">STAR = SITUATION · TASK · ACTION · RESULT</text>
    <text class="title" x="50" y="79">R — Result: show what changed, not just what you did</text>
    <text class="subtitle" x="50" y="111">What happened because of your actions, and what did you learn?</text>
    <text class="eyebrow" x="50" y="154">FICTIONAL SOFTWARE INTERVIEW EXAMPLE</text>
  </g>

  <!-- Before/after answers contrast an activity with an outcome and its measurement context. -->
  <g id="weak-result">
    <rect x="50" y="179" width="470" height="214" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text class="panel-title" x="76" y="214" style="fill:#b91c1c">Weak answer</text>
    <text class="example" x="76" y="268">“I delivered the optimization.”</text>
    <text class="copy" x="76" y="331">This reports an activity.</text>
    <text class="copy" x="76" y="359">What changed because of it?</text>
  </g>

  <!-- Keep the measured outcome and its conditions together, with learning below the quote. -->
  <g id="specific-result">
    <rect x="630" y="179" width="520" height="214" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="panel-title" x="656" y="214" style="fill:#166534">Specific outcome</text>
    <text class="example" x="656" y="248">
      <tspan x="656" dy="0">“Runtime fell from 30 to 12 minutes</tspan>
      <tspan x="656" dy="32">on the same machine with the same tests;</tspan>
      <tspan x="656" dy="32">all tests passed.”</tspan>
    </text>
    <text class="copy" x="656" y="347">Learning: measure before choosing a fix.</text>
    <text class="copy" x="656" y="375">The comparison includes the test conditions.</text>
  </g>

  <!-- Shared revision arrow: shaft stops under its triangle; tip meets the right panel's outer border. -->
  <g id="make-result-specific">
    <text class="arrow-label" x="575" y="234">Show</text>
    <text class="arrow-label" x="575" y="259">the change</text>
    <line id="result-arrow-shaft" data-connector="true" x1="522" y1="284" x2="613" y2="284" stroke="#64748b" stroke-width="3"/>
    <polygon id="result-arrow-head" points="629,284 612,275 612,293" fill="#64748b"/>
  </g>

  <!-- Honest evidence matters more than inventing a numerical success for every story. -->
  <g id="takeaway">
    <rect x="50" y="418" width="1100" height="68" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="76" y="447" font-size="22" font-weight="700">Activity is not the same as outcome.</text>
    <text class="subtitle" x="76" y="474">Use numbers only when verified in your real example. Otherwise, state what you observed.</text>
  </g>
</svg>
