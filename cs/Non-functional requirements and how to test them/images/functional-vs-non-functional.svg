<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="542" viewBox="0 0 1000 542" role="img" aria-labelledby="title desc">
  <title id="title">Functional behavior and non-functional quality</title>
  <desc id="desc">The same customer request passes through a catalog service to a database. Functional testing checks the product returned; performance testing checks its duration under specified load.</desc>
  <!-- Self-contained icons reused from System Design Scaling and News Feed System. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
<symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="load-balancer" viewBox="0 0 90 85"><path d="M12 3 H78 L87 81 H3 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M45 16 V66 M45 29 L30 46 V60 M45 29 L60 46 V60"/><path d="M39 22 L45 16 L51 22 M24 54 L30 60 L36 54 M54 54 L60 60 L66 54 M39 60 L45 66 L51 60"/></g><circle cx="45" cy="13" r="5" fill="#fff"/></symbol>
    <!-- Database geometry normalized from System Design / 01. Scaling / database.svg. -->
    <symbol id="database" viewBox="0 0 104 140">
      <g transform="translate(-966 -459)">
        <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
        <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
      </g>
    </symbol>
  </defs>
  <!-- White canvas and common real-text typography. -->
  <rect width="1000" height="542" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif">
  <!-- Same request path; labels sit above connectors and below icons. -->
<text x="32" y="42" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">One feature, two kinds of requirement</text><text x="32" y="77" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">Example: look up a product in an online shop.</text><use href="#laptop" x="64" y="170" width="110" height="70"/><use href="#server" x="443" y="153" width="48" height="84"/><use href="#database" x="819" y="153" width="65" height="88"/><path data-connector="true" d="M195 200L405.0 200.0" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M415 200L403.0 205.0L403.0 195.0Z" fill="#0b78b5"/><path data-connector="true" d="M519 200L781.0 200.0" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M791 200L779.0 205.0L779.0 195.0Z" fill="#0b78b5"/><text x="305" y="172" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">lookup 42</text><text x="655" y="172" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">read product</text><text x="119" y="283" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">Customer</text><text x="467" y="283" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">Catalog service</text><text x="851" y="283" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">Database</text><!-- Parallel criteria refer to the same functional path. --><rect x="32" y="327" width="452" height="157" rx="14" fill="#f1f7fb" stroke="#c5d7e3" stroke-width="1.5"/><rect x="516" y="327" width="452" height="157" rx="14" fill="#f3f9eb" stroke="#bdd99f" stroke-width="1.5"/><text x="52" y="365" font-size="22" font-weight="700" fill="#172b3a" text-anchor="start">Functional: the required behavior</text><text x="52" y="407" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Return product 42 and its stored price.</text><text x="52" y="445" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Test: compare with the expected record.</text><text x="536" y="365" font-size="22" font-weight="700" fill="#172b3a" text-anchor="start">Non-functional: required quality</text><text x="536" y="407" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">At 500 lookups/s, p95 duration ≤ 300 ms.</text><text x="536" y="445" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Test: measure under that workload.</text><text x="32" y="518" font-size="18" font-weight="400" fill="#172b3a" text-anchor="start">p95 = the cutoff at or below which roughly 95% of measured durations fall.</text>
  </g>
</svg>
