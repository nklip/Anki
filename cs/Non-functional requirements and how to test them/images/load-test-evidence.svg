<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="573" viewBox="0 0 1080 573" role="img" aria-labelledby="title desc">
  <title id="title">Load-testing architecture and evidence</title>
  <desc id="desc">A generator sends 500 requests per second through a load balancer to application instances and a database. Client outcomes establish the result; service metrics help explain capacity limits.</desc>
  <!-- Self-contained icons reused from System Design Scaling and News Feed System. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
<symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="load-balancer" viewBox="0 0 90 85"><path d="M12 3 H78 L87 81 H3 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M45 16 V66 M45 29 L30 46 V60 M45 29 L60 46 V60"/><path d="M39 22 L45 16 L51 22 M24 54 L30 60 L36 54 M54 54 L60 60 L66 54 M39 60 L45 66 L51 60"/></g><circle cx="45" cy="13" r="5" fill="#fff"/></symbol>
    <!-- Database geometry normalized from System Design / 01. Scaling / database.svg. -->
    <symbol id="database" viewBox="0 0 104 140">
      <g transform="translate(-966 -459)">
        <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
        <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
      </g>
    </symbol>
  </defs>
  <!-- White canvas and common real-text typography. -->
  <rect width="1080" height="573" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif">
  <!-- Request flow and compact system-design infrastructure. -->
<text x="32" y="42" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start">A load test needs workload, outcomes, and context</text><text x="32" y="78" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">Generate requests from the left; keep correctness checks active throughout.</text><use href="#laptop" x="57" y="174" width="110" height="70"/><use href="#load-balancer" x="302" y="163" width="76" height="72"/><rect x="516" y="127" width="210" height="155" rx="14" fill="#f9fcf6" stroke="#8ac94a" stroke-width="1.5"/><use href="#server" x="554" y="153" width="42" height="74"/><use href="#server" x="645" y="153" width="42" height="74"/><text x="621" y="262" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">Application pool</text><use href="#database" x="917" y="153" width="68" height="92"/><path data-connector="true" d="M186 204L270.0 204.0" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M280 204L268.0 209.0L268.0 199.0Z" fill="#0b78b5"/><path data-connector="true" d="M397 204L502.0 204.0" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M512 204L500.0 209.0L500.0 199.0Z" fill="#0b78b5"/><path data-connector="true" d="M731 204L885.0 204.0" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M895 204L883.0 209.0L883.0 199.0Z" fill="#0b78b5"/><text x="232" y="174" font-size="19" font-weight="400" fill="#172b3a" text-anchor="middle">500/s</text><text x="813" y="173" font-size="19" font-weight="400" fill="#172b3a" text-anchor="middle">read</text><text x="112" y="310" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">Load generator</text><text x="340" y="310" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">Load balancer</text><text x="951" y="310" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">Database</text><!-- Evidence panels separate user outcomes from diagnostic measurements. --><rect x="32" y="352" width="493" height="157" rx="14" fill="#f1f7fb" stroke="#c5d7e3" stroke-width="1.5"/><rect x="549" y="352" width="499" height="157" rx="14" fill="#f1f7fb" stroke="#c5d7e3" stroke-width="1.5"/><text x="52" y="389" font-size="21" font-weight="700" fill="#172b3a" text-anchor="start">Client evidence: did it meet the target?</text><text x="52" y="426" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Correct results • duration • timeouts</text><text x="52" y="464" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Offered load • completed work • dropped starts</text><text x="569" y="389" font-size="21" font-weight="700" fill="#172b3a" text-anchor="start">Service evidence: what limited it?</text><text x="569" y="426" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Processor use • memory • connections</text><text x="569" y="464" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Queue growth • dependency latency</text><text x="32" y="548" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start">Example run: 30 minutes after warm-up; record data mix, cache state, and deployment size.</text>
  </g>
</svg>
