<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" role="img" aria-labelledby="title desc">
  <title id="title">Resilience test under continuing load</title>
  <desc id="desc">Traffic continues through a load balancer while instance A is stopped. The dashed red arrow shows attempts still directed to stopped instance A before failure detection; they may fail or time out. Solid blue arrows show instance B serving requests using the database. The test measures correctness, lost requests, duration, and recovery across the failure transition.</desc>
  <!-- Self-contained icons reused from System Design Scaling and News Feed System. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
<symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="load-balancer" viewBox="0 0 90 85"><path d="M12 3 H78 L87 81 H3 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M45 16 V66 M45 29 L30 46 V60 M45 29 L60 46 V60"/><path d="M39 22 L45 16 L51 22 M24 54 L30 60 L36 54 M54 54 L60 60 L66 54 M39 60 L45 66 L51 60"/></g><circle cx="45" cy="13" r="5" fill="#fff"/></symbol>
    <!-- Database geometry normalized from System Design / 01. Scaling / database.svg. -->
    <symbol id="database" viewBox="0 0 104 140">
      <g transform="translate(-966 -459)">
        <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
        <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
      </g>
    </symbol>
  </defs>
  <!-- White canvas and common real-text typography. -->
  <rect width="1000" height="572" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif">
  <!-- The red route is a transient request attempt, not a withdrawn route. Keep the legend above all branch geometry. -->
  <text id="failed-route-legend" x="32" y="112" font-size="18" fill="#a53930">Red dashed arrow: attempts to stopped A before detection; they may fail or time out.</text>
  <!-- Surviving and failed branches are labelled independently of color. -->
<text x="32" y="42" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">Keep measuring while one instance fails</text><text x="32" y="78" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">Hypothesis: surviving capacity preserves correct, timely product lookups.</text><use href="#laptop" x="47" y="238" width="110" height="70"/><use href="#load-balancer" x="267" y="233" width="76" height="72"/><use href="#server" x="567" y="139" width="43" height="75"/><use href="#server" x="567" y="327" width="43" height="75"/><use href="#database" x="858" y="238" width="63" height="85"/><path data-connector="true" d="M178 272L237.0 272.0" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M247 272L235.0 277.0L235.0 267.0Z" fill="#0b78b5"/><path data-connector="true" d="M364 263L530.9158794754671 186.18076001413158" fill="none" stroke="#b3483c" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M540 182L531.1894353776264 191.5589722792243L527.0086753634947 182.47485175469149Z" fill="#b3483c"/><path data-connector="true" d="M364 282L530.9751896221632 361.6927041378506" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M540 366L527.0165796155211 365.3436501543392L531.3238754776705 356.31883977650233Z" fill="#0b78b5"/><path data-connector="true" d="M630 367L829.6908618247384 288.65238914053333" fill="none" stroke="#0b78b5" stroke-width="2.5"/><path d="M839 285L829.6552287599527 294.0374360562708L826.0028396194193 284.72829788100915Z" fill="#0b78b5"/><text x="112" y="350" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">Traffic continues</text><text x="305" y="350" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">Load balancer</text><text x="667" y="145" font-size="21" font-weight="700" fill="#a53930" text-anchor="start">Injected failure</text><text x="667" y="176" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Instance A stopped</text><text x="643" y="413" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start">Instance B serves requests</text><text x="891" y="358" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">Database</text><!-- The cross intentionally overlays only the failed server icon. --><path d="M559 139L618 215M618 139L559 215" fill="none" stroke="#c34135" stroke-width="6"/><rect x="32" y="448" width="936" height="99" rx="14" fill="#f3f9eb" stroke="#bdd99f" stroke-width="1.5"/><text x="52" y="483" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start">Measure before, during, and after the failure.</text><text x="52" y="520" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">Count lost requests and timeouts; verify response contents and recovery.</text>
  </g>
</svg>
