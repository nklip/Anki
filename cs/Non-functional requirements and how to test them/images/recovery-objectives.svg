<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Recovery point and recovery time objectives</title>
  <desc id="desc">Data is recovered through 09:57; a site failure happens at 10:00; validated service returns at 10:12. The observed three-minute data-loss interval meets a five-minute RPO, and twelve-minute recovery meets a fifteen-minute RTO.</desc>
  <!-- Self-contained icons reused from System Design Scaling and News Feed System. -->
  <defs>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
<symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
<symbol id="load-balancer" viewBox="0 0 90 85"><path d="M12 3 H78 L87 81 H3 Z" fill="#1677b8"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M45 16 V66 M45 29 L30 46 V60 M45 29 L60 46 V60"/><path d="M39 22 L45 16 L51 22 M24 54 L30 60 L36 54 M54 54 L60 60 L66 54 M39 60 L45 66 L51 60"/></g><circle cx="45" cy="13" r="5" fill="#fff"/></symbol>
    <!-- Database geometry normalized from System Design / 01. Scaling / database.svg. -->
    <symbol id="database" viewBox="0 0 104 140">
      <g transform="translate(-966 -459)">
        <path d="M970 482C970 470 992 462 1018 462S1066 470 1066 482V575C1066 587 1044 595 1018 595S970 587 970 575Z" fill="#0b78b5"/>
        <ellipse cx="1018" cy="482" rx="48" ry="15" fill="white" stroke="#0b78b5" stroke-width="6"/>
      </g>
    </symbol>
  </defs>
  <!-- White canvas and common real-text typography. -->
  <rect width="1000" height="560" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif">
  <!-- Recovery chronology uses separate time and data-loss intervals. -->
<text x="32" y="42" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start">Recovery time and lost-data interval are different</text><text x="32" y="78" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">Illustrative site-loss drill. Objectives: RPO ≤ 5 min; RTO ≤ 15 min.</text><use href="#database" x="116" y="123" width="50" height="67"/><use href="#server" x="446" y="123" width="38" height="67"/><use href="#laptop" x="815" y="126" width="100" height="64"/><text x="141" y="225" font-size="24" font-weight="700" fill="#172b3a" text-anchor="middle">09:57</text><text x="465" y="225" font-size="24" font-weight="700" fill="#172b3a" text-anchor="middle">10:00</text><text x="865" y="225" font-size="24" font-weight="700" fill="#172b3a" text-anchor="middle">10:12</text><text x="141" y="259" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">Recovered data</text><text x="141" y="286" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">complete through here</text><text x="465" y="259" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">Failure occurs</text><text x="865" y="259" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">Service usable</text><text x="865" y="286" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle">and validated</text><path data-connector="true" d="M141 322L936.0 322.0" fill="none" stroke="#788996" stroke-width="2.5"/><path d="M946 322L934.0 327.0L934.0 317.0Z" fill="#788996"/><path d="M141 311V333M465 311V333M865 311V333" fill="none" stroke="#788996" stroke-width="2"/><rect x="52" y="364" width="368" height="130" rx="14" fill="#fff5e8" stroke="#e8be7b" stroke-width="1.5"/><rect x="447" y="364" width="521" height="130" rx="14" fill="#edf7fc" stroke="#9dcce4" stroke-width="1.5"/><text x="72" y="402" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start">Lost-data interval = 3 min</text><text x="72" y="439" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">09:57 → 10:00</text><text x="72" y="473" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Meets the 5-minute RPO</text><text x="467" y="402" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start">Recovery time = 12 min</text><text x="467" y="439" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">10:00 → 10:12</text><text x="467" y="473" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Meets the 15-minute RTO</text><text x="32" y="535" font-size="18" font-weight="400" fill="#172b3a" text-anchor="start">RPO = recovery point objective. RTO = recovery time objective. Timeline is not to scale.</text>
  </g>
</svg>
