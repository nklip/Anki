<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="624" viewBox="0 0 1000 624" role="img" aria-labelledby="evolution-title evolution-desc">
  <title id="evolution-title">One idea, several storage-engine designs</title>
  <desc id="evolution-desc">The original 1996 LSM-tree paper by Patrick O’Neil, Edward Cheng, Dieter Gawlick, and Elizabeth O’Neil used memory and disk components joined by rolling merges. Bigtable’s 2006 paper describes a memtable and SSTable architecture. LevelDB uses sorted files and leveled compaction. RocksDB offers configurable compaction styles. The 2016 WiscKey paper separates keys and value pointers in the LSM tree from values in a separate log. These are design examples, not release dates for individual features.</desc>
  <!-- Shared typography; neutral cards give each named design equal visual weight. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #15243b; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #526277; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 18px; fill: #526277; }
      .neutral { fill: #f7f9fc; stroke: #b6c4d4; stroke-width: 1.5; }
      .connector { fill: none; stroke: #526277; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1000" height="624" fill="#fff"/>
  <!-- The founding paper is separate from later examples: this is not a release-feature timeline. -->
  <text x="32" y="46" class="title" >One idea, several storage-engine designs</text>
  <text x="32" y="78" class="subtitle" >Buffer writes in memory, then reorganize persistent data in batches.</text>
  <rect id="original-paper" x="32" y="110" width="936" height="126" rx="12" class="neutral"/>
  <text x="52" y="145" class="label" >1996 · The original LSM-tree paper</text>
  <text x="52" y="180" class="body" >Patrick O’Neil, Edward Cheng, Dieter Gawlick, Elizabeth O’Neil</text>
  <text x="52" y="214" class="body" >Memory + disk components, connected by rolling merges.</text>
  <!-- Independent engine examples share the same panel size and reading order. -->
  <text x="32" y="275" class="label" >Later designs explore different tradeoffs</text>
  <rect id="bigtable" x="32" y="294" width="286" height="180" rx="12" class="neutral"/>
  <rect id="leveldb" x="357" y="294" width="286" height="180" rx="12" class="neutral"/>
  <rect id="rocksdb" x="682" y="294" width="286" height="180" rx="12" class="neutral"/>
  <text x="52" y="331" class="label" >Bigtable · 2006</text>
  <text x="52" y="374" class="body" >Memtable (RAM buffer)</text>
  <text x="52" y="406" class="body" >plus SSTables</text>
  <text x="52" y="438" class="body" >(immutable sorted files).</text>
  <text x="377" y="331" class="label" >LevelDB</text>
  <text x="377" y="374" class="body" >Leveled compaction:</text>
  <text x="377" y="406" class="body" >merge sorted files</text>
  <text x="377" y="438" class="body" >across disk levels.</text>
  <text x="702" y="331" class="label" >RocksDB</text>
  <text x="702" y="374" class="body" >Configurable compaction:</text>
  <text x="702" y="406" class="body" >choose how files are</text>
  <text x="702" y="438" class="body" >merged and reorganized.</text>
  <!-- Value separation is a distinct design choice, rather than a promised speedup. -->
  <rect id="wisckey" x="32" y="502" width="936" height="91" rx="12" class="neutral"/>
  <text x="52" y="536" class="label" >WiscKey · 2016</text>
  <text x="52" y="572" class="body" >Keys + value pointers stay in the LSM; values go to a separate log.</text>
</svg>
