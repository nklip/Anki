<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Memory-to-disk merge: include the resident memory tree</title><desc id="desc">A resident 64 MiB memory tree plus one 64 KiB disk input buffer and one 64 KiB output buffer totals 64.125 MiB before overhead.</desc>
<!-- Shared typography, semantic colors, and arrow join geometry. -->
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#15243b} .title {font-size:30px;font-weight:700} .subtitle {font-size:19px;fill:#526277} .body {font-size:20px} .label {font-size:22px;font-weight:700} .note {font-size:18px;fill:#526277} .key {font-size:25px;font-weight:700;text-anchor:middle} .formula {font-size:27px;font-weight:700;text-anchor:middle}
</style><marker id="arrowhead" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L18 8L0 16Z" fill="#526277"/></marker></defs>
<!-- Canvas and introduction. -->
<rect width="1000" height="400" fill="#fff"/>
<text class="title" x="32" y="46">Memory-to-disk merge: include the resident memory tree</text>
<text class="subtitle" x="32" y="78">Illustrative memory budget; 1 KiB = 1,024 bytes; 1 MiB = 1,024 KiB.</text>
<!-- The output buffer is counted; it is missing from the source formulas. -->
<rect x="32" y="113" width="276" height="139" rx="10" fill="#eaf2ff" stroke="#b6c4d4" stroke-width="1.5"/>
<text class="label" x="170" y="148" text-anchor="middle">C0 already in RAM</text>
<text class="body" x="170" y="184" text-anchor="middle">Sorted memory tree</text>
<text class="label" x="170" y="228" text-anchor="middle">64 MiB</text>
<text class="formula" x="336" y="197">+</text>
<rect x="362" y="113" width="276" height="139" rx="10" fill="#e9f7f3" stroke="#b6c4d4" stroke-width="1.5"/>
<text class="label" x="500" y="148" text-anchor="middle">C1 on disk</text>
<text class="body" x="500" y="184" text-anchor="middle">Input buffer</text>
<text class="label" x="500" y="228" text-anchor="middle">64 KiB</text>
<text class="formula" x="666" y="197">+</text>
<rect x="692" y="113" width="276" height="139" rx="10" fill="#fff4df" stroke="#b6c4d4" stroke-width="1.5"/>
<text class="label" x="830" y="148" text-anchor="middle">Merged output</text>
<text class="body" x="830" y="184" text-anchor="middle">Output buffer</text>
<text class="label" x="830" y="228" text-anchor="middle">64 KiB</text>
<!-- A basic working-memory estimate, explicitly excluding engine overhead. -->
<text class="formula" x="500" y="305">64 MiB + 64 KiB + 64 KiB = 64.125 MiB</text>
<text class="note" x="500" y="349" text-anchor="middle">Additional merge buffers: 128 KiB; the 64 MiB tree was already resident.</text>
<text class="note" x="500" y="379" text-anchor="middle">Indexes, decompression, caches, and concurrent merges require extra memory.</text>
</svg>
