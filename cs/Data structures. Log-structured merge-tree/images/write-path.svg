<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="468" viewBox="0 0 1000 468" role="img" aria-labelledby="write-path-title write-path-desc">
  <title id="write-path-title">A write first enters the log and memory</title>
  <desc id="write-path-desc">LevelDB foreground write order: first append a recovery record to the write-ahead log, optionally syncing that log to persistent storage; next update the active memtable, a sorted RAM table that accepts new writes; then return success after both steps succeed. With sync=true, log sync completes before the memtable update. With sync=false, the default, log data is handed to the operating system without waiting for persistent storage.</desc>
  <!-- Shared folder typography and semantic colors: blue memory and teal log/results. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #15243b; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #526277; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 18px; fill: #526277; }
      .blue { fill: #eaf2ff; stroke: #b6c4d4; stroke-width: 1.5; }
      .teal { fill: #e9f7f3; stroke: #b6c4d4; stroke-width: 1.5; }
      .neutral { fill: #f7f9fc; stroke: #b6c4d4; stroke-width: 1.5; }
      .connector { fill: none; stroke: #526277; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1000" height="468" fill="#fff"/>
  <!-- Foreground order: optional log sync is part of stage 1, before memory changes. -->
  <text x="32" y="46" class="title">A write first enters the log and memory</text>
  <text x="32" y="78" class="subtitle">LevelDB foreground path: finish these steps before returning success.</text>
  <rect id="wal" x="32" y="111" width="286" height="162" rx="12" class="teal"/>
  <rect id="memtable" x="357" y="111" width="286" height="162" rx="12" class="blue"/>
  <rect id="acknowledge" x="682" y="111" width="286" height="162" rx="12" class="teal"/>
  <!-- Shafts stop inside triangle bases; arrow tips meet only the next box boundary. -->
  <path id="wal-to-memory-shaft" d="M318 192 H345" class="connector" data-connector="true"/>
  <polygon id="wal-to-memory-head" points="343,185 357,192 343,199" fill="#526277"/>
  <path id="memory-to-ack-shaft" d="M643 192 H670" class="connector" data-connector="true"/>
  <polygon id="memory-to-ack-head" points="668,185 682,192 668,199" fill="#526277"/>
  <text x="52" y="145" class="label">1  Append to WAL</text>
  <text x="52" y="180" class="body">Write-ahead log:</text>
  <text x="52" y="207" class="body">append a recovery record</text>
  <text x="52" y="245" class="note">Then sync if sync=true</text>
  <text x="377" y="145" class="label">2  Update memtable</text>
  <text x="377" y="180" class="body">Sorted table in RAM</text>
  <text x="377" y="218" class="note"><tspan x="377">Active memtable = the one</tspan><tspan x="377" dy="26">accepting new writes</tspan></text>
  <text x="702" y="145" class="label">3  Acknowledge</text>
  <text x="702" y="180" class="body">Return success after</text>
  <text x="702" y="207" class="body">both steps succeed</text>
  <!-- Two log-durability choices; both precede the memtable update and acknowledgment. -->
  <rect id="durability-settings" x="32" y="294" width="936" height="143" rx="12" class="neutral"/>
  <text x="52" y="327" class="label">How stage 1 handles durability</text>
  <text x="52" y="362" class="body">sync=true: wait until the log reaches persistent storage.</text>
  <text x="52" y="394" class="body">sync=false (default): hand log data to the OS; do not wait for persistent storage.</text>
  <text x="52" y="423" class="note">OS = operating system. Sync completes before stage 2 when requested.</text>
</svg>
