<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Compaction merges overlapping key ranges</title><desc id="desc">Illustrative LevelDB-style compaction. Two L0 files cover B through F and D through H. Selected L1 files cover A through C and D through J. Compaction replaces these with non-overlapping L1 files A through E and F through J. The L1 file K through Z is untouched. The ranges and output split are examples.</desc>
<!-- Shared typography, blue inputs, teal storage, and amber transformations. -->
<defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#15243b} .title{font-size:30px;font-weight:700} .sub{font-size:20px;fill:#526277} .label{font-size:22px;font-weight:700} .body{font-size:20px} .blue{fill:#eaf2ff;stroke:#b6c4d4;stroke-width:1.5} .teal{fill:#e9f7f3;stroke:#b6c4d4;stroke-width:1.5} .amber{fill:#fff4df;stroke:#b6c4d4;stroke-width:1.5} .panel{fill:#f7f9fc;stroke:#b6c4d4;stroke-width:1.5} .shaft{fill:none;stroke:#526277;stroke-width:2}</style></defs>
<rect width="1000" height="610" fill="#fff"/>
<!-- The upper panel is the before-state; amber identifies selected inputs. -->
<text x="32" y="46" class="title" text-anchor="start">Compaction merges overlapping key ranges</text>
<text x="32" y="80" class="sub" text-anchor="start">A key range runs from a file’s smallest key to its largest key.</text>
<rect id="before" x="32" y="107" width="936" height="241" rx="12" class="panel"/>
<text x="52" y="143" class="label" text-anchor="start">Before: selected files overlap between levels</text>
<text x="52" y="198" class="label" text-anchor="start">L0</text>
<text x="52" y="286" class="label" text-anchor="start">L1</text>
<rect id="l0-bf" x="145" y="162" width="192" height="60" rx="12" class="amber"/>
<text x="241.0" y="200" class="label" text-anchor="middle">B … F</text>
<rect id="l0-dh" x="365" y="162" width="192" height="60" rx="12" class="amber"/>
<text x="461.0" y="200" class="label" text-anchor="middle">D … H</text>
<rect id="l1-ac" x="145" y="250" width="192" height="60" rx="12" class="amber"/>
<text x="241.0" y="288" class="label" text-anchor="middle">A … C</text>
<rect id="l1-dj" x="365" y="250" width="192" height="60" rx="12" class="amber"/>
<text x="461.0" y="288" class="label" text-anchor="middle">D … J</text>
<text x="592" y="188" class="body" text-anchor="start">L0 files may overlap.</text>
<text x="592" y="218" class="sub" text-anchor="start">L0 = first disk level.</text>
<rect id="l1-kz" x="700" y="250" width="228" height="60" rx="12" class="teal"/>
<text x="814" y="288" class="label" text-anchor="middle">K … Z  (keep)</text>

<!-- A vertical arrow connects before and after; its head meets the panel boundary. -->
<path id="merge-shaft" d="M485 348 V395" class="shaft" data-connector="true"/><polygon id="merge-head" points="478,393 485,407 492,393" fill="#526277"/>
<text x="515" y="383" class="body" text-anchor="start">Merge the four selected files</text>
<rect id="after" x="32" y="407" width="936" height="143" rx="12" class="panel"/>
<text x="52" y="443" class="label" text-anchor="start">After: replacement L1 files have non-overlapping ranges</text>
<text x="52" y="507" class="label" text-anchor="start">L1</text>
<rect id="out-ae" x="145" y="468" width="192" height="60" rx="12" class="teal"/>
<text x="241" y="506" class="label" text-anchor="middle">A … E</text>
<rect id="out-fj" x="365" y="468" width="192" height="60" rx="12" class="teal"/>
<text x="461" y="506" class="label" text-anchor="middle">F … J</text>
<rect id="kept-kz" x="700" y="468" width="228" height="60" rx="12" class="teal"/>
<text x="814" y="506" class="label" text-anchor="middle">K … Z  (kept)</text>
<text x="32" y="588" class="sub" text-anchor="start">Example ranges and split points. Only selected input files are replaced.</text>
</svg>
