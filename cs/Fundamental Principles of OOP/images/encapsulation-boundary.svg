<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Encapsulation: the object controls valid state changes</title>
  <desc id="desc">Read left to right. Client code calls the thermostat's public setTarget operation. The operation accepts values from 16 to 30 degrees Celsius and only then updates the private targetCelsius field. Other values throw IllegalArgumentException without changing the field. Starting at 20, a request for 22 stores 22; a later request for 40 leaves the target at 22, which the caller can read after catching the exception.</desc>

  <!-- Shared light palette: blue is the public operation; green is controlled private state. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #475569; }
      .label { font-size: 18px; font-weight: 700; fill: #475569; }
      .heading { font-size: 24px; font-weight: 700; }
      .copy { font-size: 20px; fill: #334155; }
      .code { font-family: "Courier New", Courier, monospace; font-size: 22px; }
      .center { text-anchor: middle; }
      .arrow-shaft { fill: none; stroke: #64748b; stroke-width: 3; }
    </style>
  </defs>

  <!-- Heading states the rule before the reader encounters the object boundary. -->
  <rect width="1200" height="600" fill="#f8fafc"/>
  <g id="heading">
    <text class="label" x="40" y="38">ENCAPSULATION · STATE AND BEHAVIOR TOGETHER</text>
    <text class="title" x="40" y="84">The object controls valid state changes</text>
    <text class="subtitle" x="40" y="119">Invariant: the target always stays between 16 and 30 degrees Celsius.</text>
  </g>

  <!-- The boundary groups the public operation and private field inside one object. -->
  <g id="thermostat-boundary">
    <rect x="410" y="157" width="750" height="285" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="heading" x="440" y="196">Thermostat object</text>
    <text class="copy" x="440" y="423">Client code uses the operation; it cannot assign to the private field.</text>
  </g>

  <!-- Client operations remain outside the object's boundary. -->
  <g id="client">
    <rect x="40" y="232" width="240" height="151" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="heading center" x="160" y="272">Client code</text>
    <text class="copy center" x="160" y="309">Requests a new</text>
    <text class="copy center" x="160" y="340">target temperature</text>
  </g>

  <!-- Validation happens before assignment; invalid inputs never reach the field. -->
  <g id="public-operation">
    <rect x="440" y="232" width="285" height="151" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label center" x="582.5" y="261" style="fill:#1d4ed8">PUBLIC OPERATION</text>
    <text class="code center" x="582.5" y="299">setTarget(value)</text>
    <text class="copy center" x="582.5" y="332">Check: 16 ≤ value ≤ 30</text>
    <text class="copy center" x="582.5" y="362">Else: throw an exception</text>
  </g>
  <g id="private-state">
    <rect x="860" y="252" width="270" height="111" rx="14" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="label center" x="995" y="282" style="fill:#166534">PRIVATE FIELD</text>
    <text class="code center" x="995" y="320">targetCelsius</text>
    <text class="copy center" x="995" y="349">Starts at 20</text>
  </g>

  <!-- Shafts stop beneath triangle bases; tips meet outer borders without entering nodes. -->
  <g id="request-and-assignment-arrows">
    <text class="label center" x="355" y="284">calls</text>
    <line class="arrow-shaft" data-connector="true" x1="282" y1="310" x2="424" y2="310"/>
    <polygon points="439,310 423,301 423,319" fill="#64748b"/>
    <text class="label center" x="793" y="284">valid value</text>
    <line class="arrow-shaft" data-connector="true" x1="727" y1="310" x2="844" y2="310"/>
    <polygon points="859,310 843,301 843,319" fill="#64748b"/>
  </g>

  <!-- This explicit sequence demonstrates both acceptance and preservation after rejection. -->
  <g id="example-sequence">
    <text class="label" x="40" y="484">EXAMPLE SEQUENCE · STARTING AT 20</text>
    <rect x="40" y="501" width="520" height="65" rx="12" fill="#ecfdf5"/>
    <text class="copy" x="62" y="541">First: setTarget(22) stores 22.</text>
    <rect x="580" y="501" width="580" height="65" rx="12" fill="#fff7ed"/>
    <text class="copy" x="602" y="541">Then: setTarget(40) throws; target stays 22.</text>
  </g>
</svg>
