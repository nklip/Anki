<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="580" viewBox="0 0 1320 580" role="img" aria-labelledby="title desc">
  <title id="title">Pattern 2, named events: one stream, several handlers</title>
  <desc id="desc">The server writes three events into one stream. The first carries event colon price with data AAPL 189.42 and reaches the handler registered with addEventListener for price. The second carries event colon alert with data level high and reaches the handler registered for alert. The third carries no event field, so it is named message and reaches onmessage. All three travel on the same connection.</desc>
  <!-- Icons copied from System Design/12. Chat System: high-level-statefull-arch.svg (laptop) and System Design/15. Google Drive: high-level-design.svg (server rack, queue). -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 25px; font-weight: 700; }
      .sub { font-size: 19px; fill: #536174; }
      .node { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .msg { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #17212f; text-anchor: middle; }
      .msgdim { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #8697a8; text-anchor: middle; }
      .note { font-size: 18px; fill: #536174; }
      .handler { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #17212f; }
      .tag { font-size: 17px; fill: #536174; }
      .clock { font-size: 17px; font-weight: 700; fill: #405062; }
      .life { stroke: #8fa2b5; stroke-width: 2.5; }
    </style>
    <symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="#fff" stroke="#17212f" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#17212f"/></symbol>
    <symbol id="servers" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#65c515"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#65c515"/><g fill="#65c515"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="queue" viewBox="0 0 190 72"><path d="M2 8H170L187 36L170 64H2Z" fill="#fff" stroke="#0c7eb8" stroke-width="4"/><g fill="none" stroke="#0c7eb8" stroke-width="4"><rect x="13" y="18" width="46" height="36"/><rect x="67" y="18" width="46" height="36"/><rect x="121" y="18" width="46" height="36"/><path d="M14 20L36 39L58 20M68 20L90 39L112 20M122 20L144 39L166 20"/></g></symbol>
  </defs>
  <rect width="1320" height="580" fill="#fff"/>
  <text x="28" y="40" class="title">Pattern 2 &#8212; Several kinds of update, one connection</text>
  <text x="28" y="70" class="sub">The event field names the event. Each name reaches its own listener, so one stream does not need one connection per topic.</text>
  <rect x="45" y="96" width="210" height="80" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#servers" x="66" y="114" width="58" height="40"/>
  <text x="196" y="142" class="node">server</text>
  <rect x="525" y="96" width="210" height="80" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="544" y="112" width="54" height="42"/>
  <text x="676" y="142" class="node">browser</text>
  <path class="life" d="M150 176 V500 M630 176 V500" fill="none"/>
  <text x="390" y="210" class="msg">event: price</text>
  <text x="390" y="232" class="msg">data: {"AAPL": 189.42}</text>
  <path data-connector="true" d="M162.0 250.0L606.00 250.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="618.0,250.0 604.00,256.00 604.00,244.00" fill="#c2410c"/>
  <!-- Short hop from the lifeline to the listener that receives this name. -->
  <path data-connector="true" d="M642.0 250.0L774.00 250.00" fill="none" stroke="#8697a8" stroke-width="2.5"/>
  <polygon points="786.0,250.0 772.00,256.00 772.00,244.00" fill="#8697a8"/>
  <rect x="800" y="214" width="492" height="72" rx="10" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="820" y="242" class="handler">es.addEventListener("price", ...)</text>
  <text x="820" y="268" class="tag">gets this event and no other</text>
  <text x="390" y="310" class="msg">event: alert</text>
  <text x="390" y="332" class="msg">data: {"level": "high"}</text>
  <path data-connector="true" d="M162.0 350.0L606.00 350.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="618.0,350.0 604.00,356.00 604.00,344.00" fill="#c2410c"/>
  <!-- Short hop from the lifeline to the listener that receives this name. -->
  <path data-connector="true" d="M642.0 350.0L774.00 350.00" fill="none" stroke="#8697a8" stroke-width="2.5"/>
  <polygon points="786.0,350.0 772.00,356.00 772.00,344.00" fill="#8697a8"/>
  <rect x="800" y="314" width="492" height="72" rx="10" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="820" y="342" class="handler">es.addEventListener("alert", ...)</text>
  <text x="820" y="368" class="tag">a different handler on the same one connection</text>
  <text x="390" y="410" class="msgdim">(no event field)</text>
  <text x="390" y="432" class="msg">data: {"note": "hello"}</text>
  <path data-connector="true" d="M162.0 450.0L606.00 450.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="618.0,450.0 604.00,456.00 604.00,444.00" fill="#c2410c"/>
  <!-- Short hop from the lifeline to the listener that receives this name. -->
  <path data-connector="true" d="M642.0 450.0L774.00 450.00" fill="none" stroke="#8697a8" stroke-width="2.5"/>
  <polygon points="786.0,450.0 772.00,456.00 772.00,444.00" fill="#8697a8"/>
  <rect x="800" y="414" width="492" height="72" rx="10" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <text x="820" y="442" class="handler">es.onmessage</text>
  <text x="820" y="468" class="tag">the default name is message when no event field is sent</text>
  <text x="28" y="536" class="note">One name per kind of update keeps the six-connection limit from being spent on topics, and keeps the</text>
  <text x="28" y="560" class="note">routing out of your own code: the browser does it from the event field before your handler runs.</text>
</svg>
