<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="790" viewBox="0 0 1260 790" role="img" aria-labelledby="title desc">
  <title id="title">Pattern 5, writing back with a POST and fanning out through a broker</title>
  <desc id="desc">Four browsers labelled A, B, C and D sit along the top. Instance 1 below holds the open event streams of browsers A and B, and instance 2 holds those of C and D, drawn as arrows pointing upward out of each instance into its browsers. Browser A also has an arrow pointing downward into instance 1, labelled POST /messages, an ordinary request on its own connection. Underneath both instances runs one pub/sub broker. Each instance has a pair of paths to it, one marked publish and one marked deliver, so a message that arrives on instance 1 also reaches the streams held by instance 2.</desc>
  <!-- Icons copied from System Design/12. Chat System: high-level-statefull-arch.svg (laptop) and System Design/15. Google Drive: high-level-design.svg (server rack, queue). -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 25px; font-weight: 700; }
      .sub { font-size: 19px; fill: #536174; }
      .node { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .msg { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #17212f; text-anchor: middle; }
      .msgdim { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #8697a8; text-anchor: middle; }
      .note { font-size: 18px; fill: #536174; }
      .tag { font-size: 17px; fill: #536174; }
      .label { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #17212f; }
      .clock { font-size: 17px; font-weight: 700; fill: #405062; }
      .life { stroke: #8fa2b5; stroke-width: 2.5; }
    </style>
    <symbol id="laptop" viewBox="0 0 90 70"><rect x="17" y="5" width="56" height="45" rx="4" fill="#fff" stroke="#17212f" stroke-width="4"/><path d="M9 58 H81 L87 65 H3 Z" fill="#17212f"/></symbol>
    <symbol id="servers" viewBox="0 0 130 90"><rect x="33" y="3" width="34" height="19" rx="2" fill="#65c515"/><rect x="72" y="3" width="34" height="19" rx="2" fill="#65c515"/><g fill="#65c515"><rect x="6" y="23" width="38" height="62"/><rect x="46" y="23" width="38" height="62"/><rect x="86" y="23" width="38" height="62"/></g><path d="M12 34H38M12 71H38M52 34H78M52 71H78M92 34H118M92 71H118M39 11H61M78 11H100" fill="none" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="queue" viewBox="0 0 190 72"><path d="M2 8H170L187 36L170 64H2Z" fill="#fff" stroke="#0c7eb8" stroke-width="4"/><g fill="none" stroke="#0c7eb8" stroke-width="4"><rect x="13" y="18" width="46" height="36"/><rect x="67" y="18" width="46" height="36"/><rect x="121" y="18" width="46" height="36"/><path d="M14 20L36 39L58 20M68 20L90 39L112 20M122 20L144 39L166 20"/></g></symbol>
  </defs>
  <rect width="1260" height="790" fill="#fff"/>
  <text x="28" y="40" class="title">Pattern 5 &#8212; Writing back, and reaching the clients you do not hold</text>
  <text x="28" y="70" class="sub">A stream runs one way, out of the one process that opened it. Both gaps are filled with ordinary pieces, not with SSE.</text>
  <!-- Browsers. Each holds exactly one open stream, from the instance below it. -->
  <rect x="300" y="106" width="150" height="84" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="350" y="118" width="50" height="39"/>
  <text x="375" y="180" class="node">browser A</text>
  <rect x="480" y="106" width="150" height="84" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="530" y="118" width="50" height="39"/>
  <text x="555" y="180" class="node">browser B</text>
  <rect x="850" y="106" width="150" height="84" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="900" y="118" width="50" height="39"/>
  <text x="925" y="180" class="node">browser C</text>
  <rect x="1030" y="106" width="150" height="84" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#laptop" x="1080" y="118" width="50" height="39"/>
  <text x="1105" y="180" class="node">browser D</text>
  <!-- Instances. Each can write only into the streams it owns. -->
  <rect x="350" y="348" width="240" height="96" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#servers" x="442" y="362" width="56" height="39"/>
  <text x="470" y="428" class="node">instance 1</text>
  <rect x="900" y="348" width="240" height="96" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#servers" x="992" y="362" width="56" height="39"/>
  <text x="1020" y="428" class="node">instance 2</text>
  <!-- Open event streams point upward: the server writes, the browser only reads. -->
  <path data-connector="true" d="M420.0 342.0L420.00 204.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="420.0,192.0 414.00,206.00 426.00,206.00" fill="#c2410c"/>
  <path data-connector="true" d="M570.0 342.0L570.00 204.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="570.0,192.0 564.00,206.00 576.00,206.00" fill="#c2410c"/>
  <path data-connector="true" d="M940.0 342.0L940.00 204.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="940.0,192.0 934.00,206.00 946.00,206.00" fill="#c2410c"/>
  <path data-connector="true" d="M1090.0 342.0L1090.00 204.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="1090.0,192.0 1084.00,206.00 1096.00,206.00" fill="#c2410c"/>
  <text x="432" y="250" class="tag">one open</text>
  <text x="432" y="272" class="tag">event stream</text>
  <!-- The upward half of the conversation is a plain request, not part of the stream. -->
  <path data-connector="true" d="M370.0 196.0L370.00 334.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="370.0,346.0 364.00,332.00 376.00,332.00" fill="#17212f"/>
  <text x="110" y="250" class="label">POST /messages</text>
  <text x="110" y="272" class="tag">an ordinary request</text>
  <!-- Publish out, deliver back: the pair every instance has. -->
  <path data-connector="true" d="M470 450 470 596 L583.00 596.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="595.0,596.0 581.00,602.00 581.00,590.00" fill="#17212f"/>
  <path data-connector="true" d="M595 642 400 642 L400.00 458.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="400.0,446.0 406.00,460.00 394.00,460.00" fill="#c2410c"/>
  <path data-connector="true" d="M1020 450 1020 596 L907.00 596.00" fill="none" stroke="#17212f" stroke-width="2.5"/>
  <polygon points="895.0,596.0 909.00,590.00 909.00,602.00" fill="#17212f"/>
  <path data-connector="true" d="M895 642 1080 642 L1080.00 458.00" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="1080.0,446.0 1086.00,460.00 1074.00,460.00" fill="#c2410c"/>
  <text x="488" y="530" class="tag">publish</text>
  <text x="313" y="530" class="tag">deliver</text>
  <text x="938" y="530" class="tag">publish</text>
  <text x="1094" y="530" class="tag">deliver</text>
  <rect x="595" y="540" width="300" height="140" rx="12" fill="#f7f9fc" stroke="#b9c8d4" stroke-width="2"/>
  <use href="#queue" x="660" y="556" width="170" height="64"/>
  <text x="745" y="662" class="node">pub/sub broker</text>
  <text x="28" y="716" class="note">The downward arrow is a second request on its own connection, and a load balancer (not drawn) may hand it to an instance holding none of</text>
  <text x="28" y="740" class="note">A&#8217;s streams. That is fine: nothing about it depends on the stream. What it must not do is try to answer down one. Only the</text>
  <text x="28" y="764" class="note">instance that holds a stream can write to it, which is why the broker underneath is not optional once there are two.</text>
</svg>
