<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Event callback: the event system calls you</title>
  <desc id="desc">Your application registers a listener with the Swing button. Later a user clicks Save. Swing invokes the registered actionPerformed callback in your code. The callback returns to Swing. Registration itself does not invoke the callback.</desc>
  <!-- Shared source-native sequence notation. Green messages identify the IoC operation. -->
  <defs>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 400 21px Arial, Helvetica, sans-serif; fill: #334155; }
      .name { font: 700 23px Arial, Helvetica, sans-serif; fill: #172033; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .message { font: 400 21px Arial, Helvetica, sans-serif; fill: #172033; }
      .hook { font: 700 21px Arial, Helvetica, sans-serif; fill: #166534; }
    </style>
  </defs>
  <!-- Overview and reading key; chronological messages begin below the participant row. -->
  <rect width="1000" height="570" fill="#f8fafc"/>

  <text class="title" x="32" y="44" text-anchor="start">Event callback: the event system calls you</text>
  <text class="body" x="32" y="78" text-anchor="start">Register behavior now; Swing invokes it when the event occurs.</text>
  <text class="small" x="32" y="108" text-anchor="start">Time ↓    Solid = call / construction    Dashed = return    Green = IoC operation</text>
  <!-- Participant lifelines. Message tips stop before them, keeping heads unobscured. -->
  <g id="participant-1">
    <rect x="80" y="130" width="280" height="68" rx="12" fill="#e8f0fe" stroke="#285ea8" stroke-width="2"/>
  <text class="name" x="220" y="158" text-anchor="middle">Your application</text>
  <text class="small" x="220" y="184" text-anchor="middle">setup + listener code</text>
    <line id="lifeline-1-199" x1="220" y1="199" x2="220" y2="494" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"/>
  </g>
  <g id="participant-2">
    <rect x="640" y="130" width="280" height="68" rx="12" fill="#e8f0fe" stroke="#285ea8" stroke-width="2"/>
  <text class="name" x="780" y="158" text-anchor="middle">Swing button</text>
  <text class="small" x="780" y="184" text-anchor="middle">event system</text>
    <line id="lifeline-2-199" x1="780" y1="199" x2="780" y2="282" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"/>
    <line id="lifeline-2-346" x1="780" y1="346" x2="780" y2="494" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"/>
  </g>
  <!-- Footer states the consequence of the sequence, outside the lifeline area. -->
  <rect x="24" y="511" width="952" height="42" rx="10" fill="#ecfdf5"/>
  <text class="body" x="500" y="539" text-anchor="middle">The click triggers execution; registration only supplies the handler.</text>
  <!-- register-handler: shaft ends inside the separate arrowhead base; crossing other lifelines is intentional. -->
  <text class="message" x="500.0" y="235" text-anchor="middle">1. addActionListener(handler)</text>
  <path id="register-handler-arrow" data-connector="true" d="M225 250 H762" fill="none" stroke="#285ea8" stroke-width="3"/>
  <polygon id="register-handler-head" points="760,243 775,250 760,257" fill="#285ea8"/>
  <!-- External event note replaces a short lifeline segment; no line crosses its text. -->
  <rect x="642" y="291" width="276" height="46" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="message" x="780" y="320" text-anchor="middle">User clicks Save</text>
  <!-- invoke-handler: shaft ends inside the separate arrowhead base; crossing other lifelines is intentional. -->
  <text class="hook" x="500.0" y="383" text-anchor="middle">2. actionPerformed(event)</text>
  <path id="invoke-handler-arrow" data-connector="true" d="M775 398 H238" fill="none" stroke="#15803d" stroke-width="3"/>
  <polygon id="invoke-handler-head" points="240,391 225,398 240,405" fill="#15803d"/>
  <!-- return-handler: shaft ends inside the separate arrowhead base; crossing other lifelines is intentional. -->
  <text class="message" x="500.0" y="460" text-anchor="middle">3. handler returns</text>
  <path id="return-handler-arrow" data-connector="true" d="M225 475 H762" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <!-- A short solid tail guarantees a clean shaft/head join regardless of dash phase. -->
  <path id="return-handler-join" data-connector="true" d="M752 475 H762" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon id="return-handler-head" points="760,468 775,475 760,482" fill="#64748b"/>
</svg>
