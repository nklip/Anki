<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img" aria-labelledby="title desc">
  <title id="title">SSH: secure commands on a remote computer</title>
  <desc id="desc">SSH means Secure Shell. The SSH client on your computer communicates with an SSH server on a remote computer, normally at TCP port 22. TCP means Transmission Control Protocol. After the client verifies the server's host key and establishes encryption, the user authenticates with a key or password inside the encrypted connection. One encrypted and integrity-protected SSH session carries the whoami command to the server and the example output alice back to the client over an untrusted network. Encryption keeps the contents private; integrity protection detects tampering.</desc>

  <!-- Reusable laptop and green server symbols are copied from
       cs/Protocols. FTP/images/ftp-connections.svg and
       cs/Protocols. SMTP/images/smtp-mail-flow.svg. Their original source is
       system design/01. Scaling/images/single-server.svg.
       Cyan participant frames and Arial typography follow the protocol diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #475569; }
      .node-label { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .small { font-size: 20px; fill: #475569; text-anchor: middle; }
      .session-label { font-size: 22px; fill: #0b78b5; text-anchor: middle; }
      .traffic-label { font-size: 23px; fill: #0b78b5; text-anchor: middle; }
      .frame { fill: #fff; stroke: #08b7d1; stroke-width: 3; }
      .session-shaft { fill: none; stroke: #0b78b5; stroke-width: 3; }
      .step-title { font-size: 23px; font-weight: 700; fill: #0b78b5; }
      .step-text { font-size: 20px; fill: #475569; }
    </style>
    <symbol id="laptop" viewBox="0 0 110 70">
      <rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/>
      <path d="M7 58H103L96 66H14Z" fill="#111"/>
      <rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/>
    </symbol>
    <symbol id="server" viewBox="0 0 64 112">
      <rect width="64" height="112" rx="7" fill="#63c51b"/>
      <path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/>
    </symbol>
  </defs>

  <!-- State the remote-command lesson and expand protocol abbreviations first. -->
  <rect id="background" width="1160" height="630" fill="#fff"/>
  <text class="title" x="30" y="48">SSH: secure commands on a remote computer</text>
  <text class="subtitle" x="30" y="85">SSH = Secure Shell · TCP = Transmission Control Protocol</text>

  <!-- The outer network region and inner session region are grouping backgrounds.
       Both traffic shafts intentionally cross these non-text backgrounds. -->
  <g id="network-and-session" transform="translate(0 169)">
    <rect id="network-region" x="252" y="130" width="656" height="292" rx="20" fill="#f1f5f9"/>
    <text class="small" x="580" y="163">Untrusted network (for example, the Internet)</text>
    <rect id="secure-session-region" x="269" y="183" width="622" height="222" rx="16" fill="#e4f4fb"/>
    <text class="session-label" x="580" y="218" font-weight="700">One encrypted, integrity-protected SSH session</text>
    <text class="small" x="580" y="387">Contents stay private · tampering is detected</text>
  </g>

  <!-- Both traffic directions connect the same two participant frames.
       The remote server's port is shown at the server, not the client. -->
  <g id="participants" transform="translate(0 169)">
    <rect id="client-frame" class="frame" x="30" y="130" width="205" height="292" rx="22"/>
    <text class="node-label" x="132.5" y="169">SSH client</text>
    <use href="#laptop" x="72.5" y="218" width="120" height="77"/>
    <text class="small" x="132.5" y="337">Your computer</text>
    <text class="small" x="132.5" y="387">Sends commands</text>

    <rect id="server-frame" class="frame" x="925" y="130" width="205" height="292" rx="22"/>
    <text class="node-label" x="1027.5" y="169">SSH server</text>
    <use href="#server" x="995.5" y="189" width="64" height="112"/>
    <text class="small" x="1027.5" y="337">Remote computer</text>
    <text class="small" x="1027.5" y="387">Default TCP port 22</text>
  </g>

  <!-- Command and output are traffic within ONE established SSH connection.
       Shafts stop inside their triangle bases; tips meet outer frame strokes.
       The vertical spacing leaves labels fully clear of each connector and head. -->
  <g id="command-and-output" transform="translate(0 169)">
    <text class="traffic-label" x="580" y="263">Command: whoami (show account name)</text>
    <path id="command-shaft" class="session-shaft" data-connector="true" d="M236.5 285H909.5"/>
    <polygon id="command-head" points="923.5,285 907.5,276 907.5,294" fill="#0b78b5"/>

    <text class="traffic-label" x="580" y="326">Example output: alice</text>
    <path id="output-shaft" class="session-shaft" data-connector="true" d="M923.5 349H250.5"/>
    <polygon id="output-head" points="236.5,349 252.5,340 252.5,358" fill="#0b78b5"/>
  </g>

  <!-- Read the conceptual sequence left to right. Server identity is distinct
       from user identity, and user authentication explicitly occurs encrypted. -->
  <g id="setup-and-use-sequence" transform="translate(0 -340)">
    <text class="subtitle" x="30" y="464" font-weight="700">How the session works</text>
    <rect id="verify-server-step" x="30" y="483" width="354" height="132" rx="16" fill="#eff8fc"/>
    <text class="step-title" x="48" y="517">1 · Verify the server</text>
    <text class="step-text" x="48" y="552">Check its host key, then</text>
    <text class="step-text" x="48" y="582">establish encryption.</text>

    <rect id="authenticate-user-step" x="403" y="483" width="354" height="132" rx="16" fill="#eff8fc"/>
    <text class="step-title" x="421" y="517">2 · Authenticate the user</text>
    <text class="step-text" x="421" y="552">Use your key or password</text>
    <text class="step-text" x="421" y="582">inside the encrypted connection.</text>

    <rect id="run-commands-step" x="776" y="483" width="354" height="132" rx="16" fill="#eff8fc"/>
    <text class="step-title" x="794" y="517">3 · Exchange commands</text>
    <text class="step-text" x="794" y="552">The server runs your command;</text>
    <text class="step-text" x="794" y="582">its output returns to your client.</text>
  </g>
</svg>
