<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1648 1332" role="img" aria-labelledby="title desc">
  <title id="title">gRPC Overall Flow</title>
  <desc id="desc">Follow steps 1 to 14. A web or mobile client can send Order Service a REST request for one keyboard at 100 cents. Order Service calls its local Charge stub, and gRPC encodes a ChargeRequest as Protocol Buffers. The example shows the corresponding JSON fields and binary bytes. HTTP/2 carries the request to Payment Service, where gRPC decodes the message and calls the handler. The encoded reply travels back over the same stream and the client stub returns the result.</desc>
  <!-- Shared colors and marker geometry. Each marker nose projects six units beyond its shaft endpoint. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .title { font-size: 40px; font-weight: bold; fill: #18886f; }
      .service { font-size: 34px; font-weight: bold; }
      .app { font-size: 33px; font-weight: bold; }
      .layer { font-size: 29px; }
      .caption { font-size: 20px; }
      .step { font-size: 25px; }
      .badge { fill: #ffffff; stroke: #151515; stroke-width: 1.8; }
      .count { font-size: 29px; text-anchor: middle; }
      .pink-title { fill: #a8334b; font-size: 30px; font-weight: bold; }
      .pink { fill: #a8334b; font-size: 25px; }
      .wire { fill: #a8334b; font-size: 23px; }
      .hex { fill: #a8334b; font-family: Menlo, Consolas, monospace; font-size: 20px; }
      .pink-small { fill: #a8334b; font-size: 18px; }
      .inset { fill: #fcfcfc; stroke: #dd7185; stroke-width: 3.2; stroke-dasharray: 11 9; }
      .level { fill: #ffd47b; }
      .arrow { stroke: #101010; stroke-width: 4.5; fill: none; }
      .callout { stroke: #dc6d80; stroke-width: 4.5; stroke-dasharray: 15 12; fill: none; }
    </style>
    <marker id="black-tip" viewBox="0 0 20 16" markerWidth="20" markerHeight="16" refX="14" refY="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L20 8 L0 16 Z" fill="#101010"/></marker>
    <marker id="pink-tip" viewBox="0 0 20 16" markerWidth="20" markerHeight="16" refX="14" refY="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L20 8 L0 16 Z" fill="#dc6d80"/></marker>
  </defs>

  <!-- Outer frame and title. The two stack colors identify service boundaries. -->
  <rect x="4" y="5" width="1641" height="1318" fill="#fcfcfc" stroke="#808080" stroke-width="3"/>
  <text x="824" y="55" text-anchor="middle" class="title">gRPC Overall Flow</text>

  <!-- The REST client is optional. The two icons represent a browser and a mobile app. -->
  <g id="optional-client">
    <rect x="74" y="156" width="338" height="198" fill="#ffffff" stroke="#2cd9b0" stroke-width="6" stroke-dasharray="7 7"/>
    <text x="243" y="198" text-anchor="middle" class="app">Client App</text>
    <text x="243" y="228" text-anchor="middle" class="caption">Optional web or mobile client</text>
    <g id="browser-icon" fill="none" stroke="#404446" stroke-width="3">
      <rect x="114" y="249" width="91" height="63"/>
      <path d="M114 262 H205"/>
      <circle cx="181" cy="255.5" r="2.3" fill="#404446" stroke="none"/>
      <circle cx="189" cy="255.5" r="2.3" fill="#404446" stroke="none"/>
      <circle cx="197" cy="255.5" r="2.3" fill="#404446" stroke="none"/>
      <path d="M152 274 L173 279 L166 283 L176 294 L171 299 L161 288 L157 295 Z" fill="#404446" stroke="none"/>
    </g>
    <g id="phone-icon" fill="none" stroke="#273340" stroke-width="4">
      <rect x="310" y="237" width="46" height="86" rx="6"/>
      <path d="M310 250 H356 M310 313 H356 M333 244 H343"/>
      <circle cx="324" cy="244" r="2.2" fill="#273340" stroke="none"/>
    </g>
  </g>

  <!-- JSON field names follow the default ProtoJSON mapping; the price is an integer in cents. -->
  <g id="json-example">
    <rect x="491" y="158" width="365" height="223" class="inset"/>
    <text x="500" y="201" text-anchor="start" class="pink-title">JSON</text>
    <text x="500" y="233" text-anchor="start" class="pink">{</text>
    <text x="514" y="266" text-anchor="start" class="pink">"productName": "keyboard",</text>
    <text x="514" y="298" text-anchor="start" class="pink">"quantity": 1,</text>
    <text x="514" y="330" text-anchor="start" class="pink">"priceCents": 100</text>
    <text x="500" y="362" text-anchor="start" class="pink">}</text>
  </g>

  <!-- The table separates the wire tag and optional length from the payload bytes. -->
  <g id="protobuf-example">
    <rect x="883" y="122" width="673" height="326" class="inset"/>
    <text x="894" y="161" text-anchor="start" class="pink-title">Binary Encoding · Protobuf</text>
    <text x="963" y="207" text-anchor="middle" class="wire">Field</text>
    <text x="1063" y="207" text-anchor="middle" class="wire">Tag</text>
    <text x="1155" y="207" text-anchor="middle" class="wire">Length</text>
    <text x="1367" y="207" text-anchor="middle" class="wire">Value (hex)</text>
    <rect x="906" y="218" width="619" height="197" fill="none" stroke="#232323" stroke-width="1.7"/>
    <path d="M1019 218 V415 M1106 218 V415 M1204 218 V415 M906 284 H1525 M906 349 H1525" fill="none" stroke="#232323" stroke-width="1.5"/>
    <text x="963" y="244" text-anchor="middle" class="wire">1</text>
    <text x="963" y="273" text-anchor="middle" class="wire">string</text>
    <text x="1063" y="260" text-anchor="middle" class="wire">0A</text>
    <text x="1155" y="260" text-anchor="middle" class="wire">08</text>
    <text x="1365" y="246" text-anchor="middle" class="hex">6B 65 79 62 6F 61 72 64</text>
    <text x="1365" y="274" text-anchor="middle" class="wire">keyboard</text>
    <text x="963" y="309" text-anchor="middle" class="wire">2</text>
    <text x="963" y="338" text-anchor="middle" class="wire">uint32</text>
    <text x="1063" y="325" text-anchor="middle" class="wire">10</text>
    <text x="1155" y="325" text-anchor="middle" class="wire">—</text>
    <text x="1365" y="325" text-anchor="middle" class="wire">01 (quantity 1)</text>
    <text x="963" y="375" text-anchor="middle" class="wire">3</text>
    <text x="963" y="403" text-anchor="middle" class="wire">uint32</text>
    <text x="1063" y="391" text-anchor="middle" class="wire">18</text>
    <text x="1155" y="391" text-anchor="middle" class="wire">—</text>
    <text x="1365" y="391" text-anchor="middle" class="wire">64 (100 cents)</text>
    <text x="894" y="438" text-anchor="start" class="pink-small">Tag, length and value bytes are hexadecimal. A dash means no length byte.</text>
  </g>

  <!-- The optional REST request enters the Order Service. The dashed curve identifies its JSON payload. -->
  <g id="incoming-rest">
    <path id="rest-request-shaft" class="arrow" d="M243 357 V382 M243 440 V476" marker-end="url(#black-tip)"/>
    <rect x="169" y="385" width="150" height="50" class="inset"/>
    <circle cx="142" cy="410" r="20" fill="#ffffff" stroke="#151515" stroke-width="1.8"/>
    <text x="142" y="420" text-anchor="middle" class="count">1</text>
    <text x="244" y="423" text-anchor="middle" class="layer">REST call</text>
    <path id="rest-to-json-callout" class="callout" d="M335 411 C401 410 446 369 486 305" marker-end="url(#pink-tip)"/>
  </g>


  <!-- The Order Service layers span both of its numbered columns. -->
  <g id="order-service">
    <rect x="54" y="485" width="530" height="755" rx="58" fill="#ffffff" stroke="#29deb4" stroke-width="6"/>
    <rect x="80" y="534" width="478" height="82" rx="12" class="level"/>
    <text x="319" y="586" text-anchor="middle" class="layer">Client Application</text>
    <rect x="80" y="715" width="478" height="82" rx="12" class="level"/>
    <text x="319" y="767" text-anchor="middle" class="layer">Encoding/Decoding</text>
    <rect x="80" y="895" width="478" height="82" rx="12" class="level"/>
    <text x="319" y="947" text-anchor="middle" class="layer">gRPC Runtime</text>
    <rect x="80" y="1076" width="478" height="82" rx="12" class="level"/>
    <text x="319" y="1128" text-anchor="middle" class="layer">Transport</text>
    <text x="319" y="1225" text-anchor="middle" class="service">Order Service</text>
  </g>

  <!-- The Payment Service layers span both of its numbered columns. -->
  <g id="payment-service">
    <rect x="1064" y="485" width="530" height="755" rx="58" fill="#ffffff" stroke="#51cefa" stroke-width="6"/>
    <rect x="1090" y="534" width="478" height="82" rx="12" class="level"/>
    <text x="1329" y="586" text-anchor="middle" class="layer">Server Application</text>
    <rect x="1090" y="715" width="478" height="82" rx="12" class="level"/>
    <text x="1329" y="767" text-anchor="middle" class="layer">Encoding/Decoding</text>
    <rect x="1090" y="895" width="478" height="82" rx="12" class="level"/>
    <text x="1329" y="947" text-anchor="middle" class="layer">gRPC Runtime</text>
    <rect x="1090" y="1076" width="478" height="82" rx="12" class="level"/>
    <text x="1329" y="1128" text-anchor="middle" class="layer">Transport</text>
    <text x="1329" y="1225" text-anchor="middle" class="service">Payment Service</text>
  </g>

  <!-- Each row sets one baseline across both services. Within it the four lanes share badge and label offsets. -->
  <g id="step-row-1" transform="translate(0 666)">
    <g id="step-14" transform="translate(100 0)">
      <path id="client-result-shaft" class="arrow" d="M0 49 V25 M0 -25 V-44" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">14</text>
      <text x="32" y="9" text-anchor="start" class="step">result</text>
    </g>
    <g id="step-2" transform="translate(350 0)">
      <path id="client-stub-call-shaft" class="arrow" d="M0 -50 V-25 M0 25 V43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">2</text>
      <text x="32" y="9" text-anchor="start" class="step">call stub</text>
    </g>
    <g id="step-8" transform="translate(1110 0)">
      <path id="invoke-handler-shaft" class="arrow" d="M0 49 V25 M0 -25 V-44" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">8</text>
      <text x="32" y="9" text-anchor="start" class="step">local call</text>
    </g>
    <g id="step-9" transform="translate(1360 0)">
      <path id="return-reply-shaft" class="arrow" d="M0 -50 V-25 M0 25 V43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">9</text>
      <text x="32" y="9" text-anchor="start" class="step">return</text>
    </g>
  </g>

  <g id="step-row-2" transform="translate(0 846)">
    <g id="step-13" transform="translate(100 0)">
      <path id="client-decode-shaft" class="arrow" d="M0 49 V25 M0 -25 V-43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">13</text>
      <text x="32" y="9" text-anchor="start" class="step">decode reply</text>
    </g>
    <g id="step-3" transform="translate(350 0)">
      <path id="client-encode-shaft" class="arrow" d="M0 -49 V-25 M0 25 V43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">3</text>
      <rect x="25" y="-25" width="198" height="50" class="inset"/>
      <text x="32" y="9" text-anchor="start" class="step">encode request</text>
    </g>
    <g id="step-7" transform="translate(1110 0)">
      <path id="server-decode-shaft" class="arrow" d="M0 49 V25 M0 -25 V-43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">7</text>
      <text x="32" y="9" text-anchor="start" class="step">decode request</text>
    </g>
    <g id="step-10" transform="translate(1360 0)">
      <path id="server-encode-shaft" class="arrow" d="M0 -49 V-25 M0 25 V43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">10</text>
      <text x="32" y="9" text-anchor="start" class="step">encode reply</text>
    </g>
  </g>

  <g id="step-row-3" transform="translate(0 1026)">
    <g id="step-12" transform="translate(100 0)">
      <path id="client-receive-shaft" class="arrow" d="M0 50 V25 M0 -25 V-43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">12</text>
      <text x="32" y="9" text-anchor="start" class="step">receive</text>
    </g>
    <g id="step-4" transform="translate(350 0)">
      <path id="client-send-shaft" class="arrow" d="M0 -49 V-25 M0 25 V44" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">4</text>
      <text x="32" y="9" text-anchor="start" class="step">send</text>
    </g>
    <g id="step-6" transform="translate(1110 0)">
      <path id="server-receive-shaft" class="arrow" d="M0 50 V25 M0 -25 V-43" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">6</text>
      <text x="32" y="9" text-anchor="start" class="step">receive</text>
    </g>
    <g id="step-11" transform="translate(1360 0)">
      <path id="server-send-shaft" class="arrow" d="M0 -49 V-25 M0 25 V44" marker-end="url(#black-tip)"/>
      <circle cx="0" cy="0" r="20" class="badge"/>
      <text x="0" y="9" class="count">11</text>
      <text x="32" y="9" text-anchor="start" class="step">send</text>
    </g>
  </g>

  <!-- Link the highlighted encoder label to its Protobuf bytes across the inter-service space. -->
  <path id="encoding-to-wire-callout" class="callout" d="M578 846 C743 782 910 637 1049 453" marker-end="url(#pink-tip)"/>

  <!-- Paint the opaque cloud after both transport shafts so their middle sections are hidden. -->
  <g id="network-exchange">
    <path id="outbound-transport-shaft" class="arrow" d="M558 1094 H1084" marker-end="url(#black-tip)"/>
    <path id="return-transport-shaft" class="arrow" d="M1090 1143 H564" marker-end="url(#black-tip)"/>
    <path id="http2-cloud" transform="translate(86 0)" d="M651 1117 C632 1103 651 1077 683 1079 C693 1053 732 1047 762 1070 C801 1057 840 1086 815 1114 C843 1128 837 1156 797 1157 C773 1180 721 1184 697 1156 C660 1167 640 1142 651 1117 Z" fill="#fdf6c3" stroke="#838383" stroke-width="3"/>
    <text x="824" y="1129" text-anchor="middle" class="layer">HTTP/2</text>
    <text x="976" y="1078" text-anchor="middle" class="caption">Request</text>
    <text x="976" y="1180" text-anchor="middle" class="caption">Reply and status</text>
    <circle cx="824" cy="1026" r="20" class="badge"/>
    <text x="824" y="1035" class="count">5</text>
  </g>
</svg>
