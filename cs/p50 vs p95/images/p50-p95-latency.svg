<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="426" viewBox="0 0 1100 426" role="img" aria-labelledby="title desc">
  <title id="title">p50 and p95 mark latency cutoffs</title>
  <desc id="desc">One illustrative set of 100 requests is sorted fastest to slowest. The first 50 percent are blue, the next 45 percent purple, and the slowest 5 percent orange. The midpoint cutoff is p50, 100 milliseconds. The cutoff after 95 percent is p95, 500 milliseconds. The slowest 5 percent can take much longer than 500 milliseconds. Width shows the share of requests, not elapsed time.</desc>

  <!-- Shared typography and palette follow nearby CS diagrams. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #475569; }
      .label { font-size: 22px; }
      .share { font-size: 25px; font-weight: 700; text-anchor: middle; fill: #fff; }
      .cutoff { font-size: 27px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 21px; text-anchor: middle; fill: #475569; }
      .note { font-size: 22px; fill: #475569; }
    </style>
  </defs>

  <!-- Title states the lesson; subtitle identifies the common sample. -->
  <rect id="background" width="1100" height="426" fill="#fff"/>
  <text class="title" x="40" y="49">p50 and p95 mark latency cutoffs</text>
  <text class="subtitle" x="40" y="86">Same 100 requests, sorted from fastest to slowest</text>

  <!-- The 1020-unit strip is divided at exactly 50% and 95%; it is a rank scale. -->
  <g id="sorted-requests">
    <text class="label" x="40" y="127">Fastest</text>
    <text class="label" x="1060" y="127" text-anchor="end">Slowest</text>
    <rect id="first-50-percent" x="40" y="144" width="510" height="60" fill="#0b78b5"/>
    <rect id="next-45-percent" x="550" y="144" width="459" height="60" fill="#7c3aed"/>
    <rect id="last-5-percent" x="1009" y="144" width="51" height="60" fill="#b45309"/>
    <text class="share" x="295" y="183">50%</text>
    <text class="share" x="779.5" y="183">45%</text>
    <text class="share" x="1034.5" y="182" style="font-size:20px">5%</text>
  </g>

  <!-- Upward arrows meet the strip at its percentile boundaries. Shafts end
       inside the triangle bases, keeping the noses free of protruding lines. -->
  <g id="percentile-pointers">
    <path id="p50-arrow-shaft" data-connector="true" d="M550 237V220" fill="none" stroke="#0b78b5" stroke-width="3"/>
    <polygon id="p50-arrowhead" points="550,204 541,222 559,222" fill="#0b78b5"/>
    <path id="p95-arrow-shaft" data-connector="true" d="M1009 237V220" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <polygon id="p95-arrowhead" points="1009,204 1000,222 1018,222" fill="#7c3aed"/>
  </g>

  <!-- Example labels stay below the pointers and inside generously padded boxes. -->
  <g id="cutoff-examples">
    <text class="label" x="40" y="274" style="font-weight:700">Example values</text>
    <text class="note" x="40" y="307">ms = milliseconds</text>
    <rect id="p50-panel" x="330" y="240" width="320" height="97" rx="14" fill="#eff8fc"/>
    <text class="cutoff" x="490" y="278" style="fill:#0b78b5">p50 = 100 ms</text>
    <text class="detail" x="490" y="313">50% finish within 100 ms</text>
    <rect id="p95-panel" x="715" y="240" width="345" height="97" rx="14" fill="#f5f1fc"/>
    <text class="cutoff" x="887.5" y="278" style="fill:#7c3aed">p95 = 500 ms</text>
    <text class="detail" x="887.5" y="313">95% finish within 500 ms</text>
  </g>

  <!-- Bound the interpretation so the orange group is not mistaken for a maximum. -->
  <g id="interpretation">
    <text class="label" x="40" y="377">The slowest 5% can take much longer than 500 ms.</text>
    <text class="note" x="40" y="409">Bar width shows the share of requests, not elapsed time.</text>
  </g>
</svg>
