<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
  <title id="title">Login establishes the bank session</title>
  <desc id="desc">Before login, Alice has no authenticated bank session. Her browser sends login credentials to bank.example. The bank validates them and returns a session cookie. After login, the browser holds session=s123 and the bank maps s123 to Alice. The identifier is illustrative. A matching cookie identifies a session; it does not prove approval of a later action.</desc>
  <!-- Reusable icons copied unchanged from system design/01. Scaling/images/single-server.svg.
       Explicit use dimensions preserve their proportions. Styles follow nearby CS protocol diagrams. -->
  <defs>
    <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #475569; }
    .actor { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .domain { font-size: 20px; fill: #475569; text-anchor: middle; }
    .label { font-size: 22px; font-weight: 700; }
    .body { font-size: 21px; }
    .note { font-size: 20px; fill: #475569; }
    .code { font-size: 20px; font-family: Menlo, Consolas, monospace; }
    .lifeline { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
    <symbol id="laptop" viewBox="0 0 110 70"><rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/><path d="M7 58H103L96 66H14Z" fill="#111"/><rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/></symbol>
<symbol id="server" viewBox="0 0 64 112"><rect width="64" height="112" rx="7" fill="#63c51b"/><path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/></symbol>
  </defs>
  <!-- White canvas and reading guide. -->
  <rect width="1040" height="670" fill="#fff"/>
  <text x="32" y="46" class="title">1 · Login establishes the bank session</text>
  <text x="32" y="80" class="subtitle">Read downward. Arrows carry messages; bottom boxes show stored state.</text>
  <!-- Two participants; dashed lifelines remain clear of message labels. -->
  <rect x="40.0" y="112" width="240" height="160" rx="16" fill="#fff" stroke="#08b7d1" stroke-width="2"/>
  <text x="160" y="143" class="actor">Alice’s browser</text>
  <use href="#laptop" x="105" y="159" width="110" height="70"/>
  <text x="160" y="257" class="domain">User device</text>
  <rect x="760.0" y="112" width="240" height="160" rx="16" fill="#fff" stroke="#08b7d1" stroke-width="2"/>
  <text x="880" y="143" class="actor">Bank server</text>
  <use href="#server" x="858" y="156" width="44" height="77"/>
  <text x="880" y="257" class="domain">bank.example</text>
  <path id="browser-lifeline" class="lifeline" d="M160 274V470"/>
  <path id="bank-lifeline" class="lifeline" d="M880 274V470"/>
  <text x="520" y="314" class="label" text-anchor="middle">Login request with Alice’s credentials</text>
  <!-- login-request: shaft ends 2 units inside its triangle base; tip stops before the lifeline or box. -->
  <path id="login-request-shaft" data-connector="true" d="M164 338H863" fill="none" stroke="#0b78b5" stroke-width="3"/>
  <polygon id="login-request-head" points="876,338 861,330 861,346" fill="#0b78b5"/>
  <text x="520" y="390" class="body" text-anchor="middle">Bank validates credentials and creates a session</text>
  <text x="520" y="421" class="code" text-anchor="middle">Response: Set-Cookie: session=s123; …</text>
  <!-- session-response: shaft ends 2 units inside its triangle base; tip stops before the lifeline or box. -->
  <path id="session-response-shaft" data-connector="true" d="M876 447H177" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon id="session-response-head" points="164,447 179,439 179,455" fill="#7c3aed"/>
  <!-- Storage snapshots after login. No credentials travel to another site. -->
  <rect x="32" y="490" width="475" height="110" rx="16" fill="#eff8fc"/>
  <rect x="531" y="490" width="477" height="110" rx="16" fill="#f1f8ec"/>
  <text x="55" y="525" class="label">Browser stores</text>
  <text x="55" y="561" class="code">bank.example → session=s123</text>
  <text x="554" y="525" class="label">Bank stores</text>
  <text x="554" y="561" class="body">s123 → Alice’s signed-in session</text>
  <text x="32" y="639" class="note">A session cookie identifies Alice’s session; it does not prove approval of each action.</text>
</svg>
