<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="766" viewBox="0 0 1080 766" role="img" aria-labelledby="lost-update-title lost-update-desc">
<title id="lost-update-title">Lost update: a stale value overwrites a sale</title>
<desc id="lost-update-desc">Lost update shown as four steps from top to bottom. Starting stock is 10. Transaction A reads 10 and plans to sell one item. Transaction B also reads 10 and plans to sell two. A writes the absolute value 9 and commits. B writes the absolute value 8, calculated from its stale read of 10, and commits. The final stock is 8, but after both sales it should be 7. This example is a stale absolute-value overwrite, not an atomic decrement.</desc>
<!-- Shared typography and semantic colors; each event is an explicit chronological step. -->
<defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 21px; fill: #475569; }
    .initial { font-size: 22px; font-weight: 700; }
    .lane { font-size: 25px; font-weight: 700; }
    .lane-note { font-size: 18px; fill: #475569; }
    .body { font-size: 23px; font-weight: 700; }
    .detail { font-size: 20px; }
    .step { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .outcome { font-size: 25px; font-weight: 700; fill: #b91c1c; }
    .explain { font-size: 21px; }
    .correct { font-size: 23px; font-weight: 700; fill: #0f766e; }
  </style>
</defs>
<!-- Canvas, lesson, and the state before either transaction acts. -->
<rect width="1080" height="766" fill="#ffffff"/>

<text x="32" y="48" class="title" >Lost update: a stale value overwrites a sale</text>
<text x="32" y="82" class="subtitle" >Each transaction calculates a new value from the stock it read.</text>
<rect x="32" y="105" width="1016" height="53" rx="10" fill="#f1f5f9"/>
<text x="52" y="139" class="initial" >Starting stock = 10</text>
<!-- Lane labels distinguish the two transactions; time advances down the numbered rail. -->
<text x="47" y="204" class="lane-note" text-anchor="middle">Time</text>
<text x="124" y="194" class="lane" style="fill: #1d4ed8">Transaction A</text>
<text x="124" y="218" class="lane-note" >One transaction</text>
<text x="600" y="194" class="lane" style="fill: #c2410c">Transaction B</text>
<text x="600" y="218" class="lane-note" >One transaction</text>
<!-- Shaft gaps preserve complete clearance around the numbered circles and their labels. -->
<path id="time-arrow-shaft" data-connector="true" d="M47 234 V253 M47 293 V353 M47 393 V453 M47 493 V553 M47 593 V608" stroke="#94a3b8" stroke-width="3" fill="none"/>
<path id="time-arrow-head" d="M40 604 L47 616 L54 604 Z" fill="#94a3b8"/>
<!-- Step 1: transaction A; all earlier numbered operations have already happened. -->
<circle cx="47" cy="273" r="18" fill="#475569"/>
<text x="47" y="280" class="step" >1</text>
<rect id="step-1-event" x="106" y="234" width="440" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="124" y="265" class="body" style="fill: #1d4ed8">Read stock = 10</text>
<text x="124" y="294" class="detail" >A plans to sell 1 item.</text>
<!-- Step 2: transaction B; all earlier numbered operations have already happened. -->
<circle cx="47" cy="373" r="18" fill="#475569"/>
<text x="47" y="380" class="step" >2</text>
<rect id="step-2-event" x="582" y="334" width="440" height="78" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="600" y="365" class="body" style="fill: #c2410c">Read stock = 10</text>
<text x="600" y="394" class="detail" >B plans to sell 2 items.</text>
<!-- Step 3: transaction A; all earlier numbered operations have already happened. -->
<circle cx="47" cy="473" r="18" fill="#475569"/>
<text x="47" y="480" class="step" >3</text>
<rect id="step-3-event" x="106" y="434" width="440" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="124" y="465" class="body" style="fill: #1d4ed8">Store stock = 9; COMMIT</text>
<text x="124" y="494" class="detail" >Absolute value calculated as 10 − 1.</text>
<!-- Step 4: transaction B; all earlier numbered operations have already happened. -->
<circle cx="47" cy="573" r="18" fill="#475569"/>
<text x="47" y="580" class="step" >4</text>
<rect id="step-4-event" x="582" y="534" width="440" height="78" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="600" y="565" class="body" style="fill: #c2410c">Store stock = 8; COMMIT</text>
<text x="600" y="594" class="detail" >Absolute value from stale 10 − 2.</text>
<!-- Outcome follows the final step; red names the anomaly, teal names a correct value where relevant. -->
<rect id="outcome-panel" x="32" y="642" width="1016" height="87" rx="10" fill="#fef2f2"/>
<text x="52" y="675" class="outcome" >Stored stock = 8</text>
<text x="52" y="707" class="explain" >B overwrites A’s result; A’s sale disappears from the stock count.</text>
<text x="585" y="675" class="correct" >Correct stock = 7</text>
<text x="32" y="751" class="lane-note" >Conceptual schedule · numbered steps run from top to bottom</text>
</svg>
