<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="636" viewBox="0 0 1160 636" role="img" aria-labelledby="title desc">
  <title id="title">HTTP: a request goes out, a response comes back</title>
  <desc id="desc">HTTP means Hypertext Transfer Protocol. A client, such as a browser or app, starts an exchange with a web server. The blue arrow points from client to server and carries a GET request for /books/42 with the Host header api.example.com and no request body. The purple arrow points from server to client and carries a 200 OK success response with the Content-Type header application/json and the body {"id":42}. Headers describe a message; its body carries data when present. The example uses simplified HTTP/1.1 notation.</desc>

  <!-- Laptop and green server symbols are copied without shape or palette changes
       from cs/Protocols. SOAP/images/soap-message-flow.svg and also appear in FTP
       and SSH diagrams. Their original source is
       system design/01. Scaling/images/single-server.svg.
       Arial, cyan frames, blue requests, and purple responses follow protocol SVGs. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #475569; }
      .node-label { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .small { font-size: 20px; fill: #475569; text-anchor: middle; }
      .message-title { font-size: 24px; font-weight: 700; }
      .part-label { font-size: 21px; font-weight: 700; }
      .example { font-family: Menlo, Consolas, monospace; font-size: 21px; }
      .note { font-size: 21px; fill: #475569; }
      .frame { fill: #fff; stroke: #08b7d1; stroke-width: 3; }
      .request-shaft { fill: none; stroke: #0b78b5; stroke-width: 3; }
      .response-shaft { fill: none; stroke: #7c3aed; stroke-width: 3; }
    </style>
    <symbol id="laptop" viewBox="0 0 110 70">
      <rect x="16" y="4" width="78" height="49" rx="5" fill="white" stroke="#111" stroke-width="5"/>
      <path d="M7 58H103L96 66H14Z" fill="#111"/>
      <rect x="48" y="59" width="18" height="3" rx="1.5" fill="white"/>
    </symbol>
    <symbol id="server" viewBox="0 0 64 112">
      <rect width="64" height="112" rx="7" fill="#63c51b"/>
      <path d="M13 18H51M13 82H51M13 96H51" stroke="white" stroke-width="6"/>
    </symbol>
  </defs>

  <!-- State the primary lesson and expand the protocol name before the exchange. -->
  <rect id="background" width="1160" height="636" fill="#fff"/>
  <text class="title" x="30" y="48">HTTP: a request goes out, a response comes back</text>
  <text class="subtitle" x="30" y="85">HTTP = Hypertext Transfer Protocol · The client starts the exchange</text>

  <!-- The same client and server participate in both directions of the exchange. -->
  <g id="participants">
    <rect id="client-frame" class="frame" x="30" y="130" width="205" height="414" rx="22"/>
    <text class="node-label" x="132.5" y="171">Client</text>
    <use href="#laptop" x="72.5" y="242" width="120" height="77"/>
    <text class="small" x="132.5" y="368">Browser or app</text>
    <text class="small" x="132.5" y="454">Sends request</text>
    <text class="small" x="132.5" y="486">Reads response</text>

    <rect id="server-frame" class="frame" x="925" y="130" width="205" height="414" rx="22"/>
    <text class="node-label" x="1027.5" y="171">Server</text>
    <use href="#server" x="995.5" y="215" width="64" height="112"/>
    <text class="small" x="1027.5" y="368">Web server</text>
    <text class="small" x="1027.5" y="454">Handles request</text>
    <text class="small" x="1027.5" y="486">Sends response</text>
  </g>

  <!-- Backgrounds group message fields. Both shafts intentionally cross these
       grouping backgrounds, below the fields and clear of all text. -->
  <g id="message-lanes">
    <rect id="request-lane" x="252" y="130" width="656" height="188" rx="18" fill="#eff8fc"/>
    <rect id="response-lane" x="252" y="336" width="656" height="208" rx="18" fill="#f5f1fc"/>
  </g>

  <!-- The request shows an actual method and target; this GET sends no body. -->
  <g id="request-message">
    <text class="message-title" x="277" y="169" style="fill:#0b78b5">1 · Request</text>
    <text class="part-label" x="277" y="207">Method + target:</text>
    <text class="example" x="480" y="207">GET /books/42</text>
    <text class="part-label" x="277" y="242">Headers:</text>
    <text class="example" x="390" y="242">Host: api.example.com</text>
    <text class="part-label" x="277" y="277">Body:</text>
    <text class="note" x="390" y="277">None in this request</text>
  </g>

  <!-- Rightward request: the shaft ends just inside its own triangular head's
       base, and the tip touches only the server frame's outer stroke. -->
  <g id="request-flow">
    <path id="request-shaft" class="request-shaft" data-connector="true" d="M236.5 303H909.5"/>
    <polygon id="request-head" points="923.5,303 907.5,294 907.5,312" fill="#0b78b5"/>
  </g>

  <!-- The response separates status, descriptive headers, and returned data. -->
  <g id="response-message">
    <text class="message-title" x="277" y="374" style="fill:#7c3aed">2 · Response</text>
    <text class="part-label" x="277" y="412">Status:</text>
    <text class="example" x="390" y="412">200 OK</text>
    <text class="part-label" x="277" y="447">Headers:</text>
    <text class="example" x="390" y="447">Content-Type: application/json</text>
    <text class="part-label" x="277" y="482">Body:</text>
    <text class="example" x="390" y="482">{"id":42}</text>
  </g>

  <!-- Leftward response uses the same shaft/head join as the request. The tip
       touches only the client frame's outer stroke and remains clear of labels. -->
  <g id="response-flow">
    <path id="response-shaft" class="response-shaft" data-connector="true" d="M923.5 518H250.5"/>
    <polygon id="response-head" points="236.5,518 252.5,509 252.5,527" fill="#7c3aed"/>
  </g>

  <!-- Define the message parts and bound this abbreviated notation to HTTP/1.1. -->
  <g id="message-notes">
    <text class="note" x="30" y="586">Headers describe the message; a body carries data when present.</text>
    <text class="note" x="30" y="618">Simplified HTTP/1.1 example · 200 means the request succeeded.</text>
  </g>
</svg>
