<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">Write Through: wait for both stores</title>
  <desc id="desc">Successful write, read downward. The application writes to the cache layer. Its writer saves to the database and waits for a commit, then updates the cache. Only then does it acknowledge success. This illustrates a database-first implementation; partial failures are not shown.</desc>
  <!-- Shared visual system: Arial text, blue requests, purple replies, and gray lifelines.
       Manual heads use one join convention for both horizontal directions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 30px; font-weight: 700; }
      .guide { font-size: 20px; fill: #475569; }
      .actor { font-size: 23px; font-weight: 700; }
      .message { font-size: 21px; }
      .action { font-size: 20px; }
      .footer { font-size: 20px; fill: #475569; }
      .lifeline { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 7; }
    </style>
  </defs>
  <!-- Heading and explicit sequence-reading guide. -->
  <rect id="background" width="1040" height="590" fill="#fff"/>
  <text x="32" y="47" class="title" text-anchor="start">Write Through: wait for both stores</text>
  <text x="32" y="81" class="guide" text-anchor="start">Successful write · top to bottom · solid: request; dashed: reply</text>
  <!-- Participant positions stay fixed across all five strategy diagrams. -->
  <g id="participants">
    <rect id="app-header" x="40" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="160" y="150" class="actor" text-anchor="middle">Application</text>
    <path id="app-lifeline" class="lifeline" d="M160 173V489"/>
    <rect id="cache-header" x="400" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="520" y="150" class="actor" text-anchor="middle">Cache + writer</text>
    <path id="cache-lifeline" class="lifeline" d="M520 173V489"/>
    <rect id="db-header" x="760" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="880" y="150" class="actor" text-anchor="middle">Database</text>
    <path id="db-lifeline" class="lifeline" d="M880 173V489"/>
  </g>
  <!-- Chronological messages and internal actions. -->
  <!-- put: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="put">
    <path id="put-shaft" data-connector="true" d="M165 220H503" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="put-head" points="515,220 501,213 501,227" fill="#0b78b5"/>
    <text x="340.0" y="203" class="message" text-anchor="middle">1 · Write value</text>
  </g>
  <!-- persist: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="persist">
    <path id="persist-shaft" data-connector="true" d="M525 285H863" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="persist-head" points="875,285 861,278 861,292" fill="#0b78b5"/>
    <text x="700.0" y="268" class="message" text-anchor="middle">2 · Save to database</text>
  </g>
  <!-- committed: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="committed">
    <path id="committed-shaft" data-connector="true" d="M875 350H537" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="committed-terminal-shaft" data-connector="true" d="M547 350H537" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="committed-head" points="525,350 539,343 539,357" fill="#7c3aed"/>
    <text x="700.0" y="333" class="message" text-anchor="middle">3 · Committed</text>
  </g>
  <!-- Local cache action; opaque fill keeps the lifeline away from the text. -->
  <g id="cache-update">
    <rect x="378" y="374" width="284" height="44" rx="10" fill="#eff8fc" stroke="#9ccbdc" stroke-width="1.5"/>
    <text x="520" y="403" class="action" text-anchor="middle">Update cached value</text>
  </g>
  <!-- success: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="success">
    <path id="success-shaft" data-connector="true" d="M515 460H177" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="success-terminal-shaft" data-connector="true" d="M187 460H177" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="success-head" points="165,460 179,453 179,467" fill="#7c3aed"/>
    <text x="340.0" y="443" class="message" text-anchor="middle">4 · Success</text>
  </g>
  <!-- Outcome and the omitted branch or tradeoff. -->
  <g id="outcome">
    <text x="32" y="532" class="footer" text-anchor="start">Success follows both updates; each write includes database latency.</text>
    <text x="32" y="562" class="footer" text-anchor="start">Database-first example. Partial failures require recovery.</text>
  </g>
</svg>
