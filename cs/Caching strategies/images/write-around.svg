<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
  <title id="title">Write Around: save without filling the cache</title>
  <desc id="desc">Successful write with invalidation, read downward. The application writes directly to the database and waits for commit. It then removes any old cached value; no new value is placed in the cache. A later read miss can load the value using cache-aside or read-through. Invalidation does not eliminate all concurrent read races.</desc>
  <!-- Shared visual system: Arial text, blue requests, purple replies, and gray lifelines.
       Manual heads use one join convention for both horizontal directions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 30px; font-weight: 700; }
      .guide { font-size: 20px; fill: #475569; }
      .actor { font-size: 23px; font-weight: 700; }
      .message { font-size: 21px; }
      .action { font-size: 20px; }
      .footer { font-size: 20px; fill: #475569; }
      .lifeline { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 7; }
    </style>
  </defs>
  <!-- Heading and explicit sequence-reading guide. -->
  <rect id="background" width="1040" height="610" fill="#fff"/>
  <text x="32" y="47" class="title" text-anchor="start">Write Around: save without filling the cache</text>
  <text x="32" y="81" class="guide" text-anchor="start">Successful write · top to bottom · solid: request; dashed: reply</text>
  <!-- Participant positions stay fixed across all five strategy diagrams. -->
  <g id="participants">
    <rect id="app-header" x="40" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="160" y="150" class="actor" text-anchor="middle">Application</text>
    <path id="app-lifeline" class="lifeline" d="M160 173V510"/>
    <rect id="cache-header" x="400" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="520" y="150" class="actor" text-anchor="middle">Cache</text>
    <path id="cache-lifeline" class="lifeline" d="M520 173V510"/>
    <rect id="db-header" x="760" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="880" y="150" class="actor" text-anchor="middle">Database</text>
    <path id="db-lifeline" class="lifeline" d="M880 173V510"/>
  </g>
  <!-- Chronological messages and internal actions. -->
  <!-- direct-write: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="direct-write">
    <path id="direct-write-shaft" data-connector="true" d="M165 220H863" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="direct-write-head" points="875,220 861,213 861,227" fill="#0b78b5"/>
    <text x="340" y="203" class="message" text-anchor="middle">1 · Write value</text>
  </g>
  <!-- committed: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="committed">
    <path id="committed-shaft" data-connector="true" d="M875 285H177" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="committed-terminal-shaft" data-connector="true" d="M187 285H177" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="committed-head" points="165,285 179,278 179,292" fill="#7c3aed"/>
    <text x="700" y="268" class="message" text-anchor="middle">2 · Committed</text>
  </g>
  <!-- invalidate: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="invalidate">
    <path id="invalidate-shaft" data-connector="true" d="M165 350H503" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="invalidate-head" points="515,350 501,343 501,357" fill="#0b78b5"/>
    <text x="340.0" y="333" class="message" text-anchor="middle">3 · Invalidate old copy</text>
  </g>
  <!-- invalidated: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="invalidated">
    <path id="invalidated-shaft" data-connector="true" d="M515 415H177" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="invalidated-terminal-shaft" data-connector="true" d="M187 415H177" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="invalidated-head" points="165,415 179,408 179,422" fill="#7c3aed"/>
    <text x="340.0" y="398" class="message" text-anchor="middle">4 · Removed / absent</text>
  </g>
  <!-- Local cache action; opaque fill keeps the lifeline away from the text. -->
  <g id="cache-empty">
    <rect x="378" y="442" width="284" height="44" rx="10" fill="#eff8fc" stroke="#9ccbdc" stroke-width="1.5"/>
    <text x="520" y="471" class="action" text-anchor="middle">No new value cached</text>
  </g>
  <!-- Outcome and the omitted branch or tradeoff. -->
  <g id="outcome">
    <text x="32" y="553" class="footer" text-anchor="start">A later read miss loads the value using Cache Aside or Read Through.</text>
    <text x="32" y="583" class="footer" text-anchor="start">This keeps rarely read writes out of the cache; the first read is slower.</text>
  </g>
</svg>
