<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="626" viewBox="0 0 1040 626" role="img" aria-labelledby="title desc">
  <title id="title">Write Back: reply now, persist later</title>
  <desc id="desc">Successful write, read downward. Also called write-behind. The application writes to the cache layer, which stores the value and queues the change. Success returns before database persistence. A background writer later sends the change to the database and receives a commit reply. The database lags until persistence completes.</desc>
  <!-- Shared visual system: Arial text, blue requests, purple replies, and gray lifelines.
       Manual heads use one join convention for both horizontal directions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 30px; font-weight: 700; }
      .guide { font-size: 20px; fill: #475569; }
      .actor { font-size: 23px; font-weight: 700; }
      .message { font-size: 21px; }
      .action { font-size: 20px; }
      .footer { font-size: 20px; fill: #475569; }
      .lifeline { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 7; }
    </style>
  </defs>
  <!-- Heading and explicit sequence-reading guide. -->
  <rect id="background" width="1040" height="626" fill="#fff"/>
  <text x="32" y="47" class="title" text-anchor="start">Write Back: reply now, persist later</text>
  <text x="32" y="81" class="guide" text-anchor="start">Successful write · top to bottom · solid: request; dashed: reply</text>
  <!-- Participant positions stay fixed across all five strategy diagrams. -->
  <g id="participants">
    <rect id="app-header" x="40" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="160" y="150" class="actor" text-anchor="middle">Application</text>
    <path id="app-lifeline" class="lifeline" d="M160 173V558"/>
    <rect id="cache-header" x="400" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="520" y="150" class="actor" text-anchor="middle">Cache + writer</text>
    <path id="cache-lifeline" class="lifeline" d="M520 173V558"/>
    <rect id="db-header" x="760" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="880" y="150" class="actor" text-anchor="middle">Database</text>
    <path id="db-lifeline" class="lifeline" d="M880 173V558"/>
  </g>
  <!-- Chronological messages and internal actions. -->
  <!-- put: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="put">
    <path id="put-shaft" data-connector="true" d="M165 220H503" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="put-head" points="515,220 501,213 501,227" fill="#0b78b5"/>
    <text x="340.0" y="203" class="message" text-anchor="middle">1 · Write value</text>
  </g>
  <!-- Local cache action; opaque fill keeps the lifeline away from the text. -->
  <g id="queue-change">
    <rect x="378" y="244" width="284" height="44" rx="10" fill="#eff8fc" stroke="#9ccbdc" stroke-width="1.5"/>
    <text x="520" y="273" class="action" text-anchor="middle">Store + queue change</text>
  </g>
  <!-- early-success: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="early-success">
    <path id="early-success-shaft" data-connector="true" d="M515 330H177" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="early-success-terminal-shaft" data-connector="true" d="M187 330H177" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="early-success-head" points="165,330 179,323 179,337" fill="#7c3aed"/>
    <text x="340.0" y="313" class="message" text-anchor="middle">2 · Success</text>
  </g>
  <!-- This temporal boundary separates acknowledgment from later database persistence. -->
  <g id="acknowledged-before-persistence">
    <rect x="32" y="354" width="976" height="58" rx="12" fill="#fff4d7"/>
    <text x="520" y="390" class="action" text-anchor="middle">Application can continue; the database still has the previous value.</text>
  </g>
  <!-- background-write: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="background-write">
    <path id="background-write-shaft" data-connector="true" d="M525 464H863" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="background-write-head" points="875,464 861,457 861,471" fill="#0b78b5"/>
    <text x="700.0" y="447" class="message" text-anchor="middle">3 · Later: save change</text>
  </g>
  <!-- committed: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="committed">
    <path id="committed-shaft" data-connector="true" d="M875 529H537" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="committed-terminal-shaft" data-connector="true" d="M547 529H537" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="committed-head" points="525,529 539,522 539,536" fill="#7c3aed"/>
    <text x="700.0" y="512" class="message" text-anchor="middle">4 · Committed</text>
  </g>
  <!-- Outcome and the omitted branch or tradeoff. -->
  <g id="outcome">
    <text x="32" y="599" class="footer" text-anchor="start">A background writer may batch changes. Unpersisted writes remain at risk.</text>
  </g>
</svg>
