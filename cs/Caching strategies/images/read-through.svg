<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="597" viewBox="0 0 1040 597" role="img" aria-labelledby="title desc">
  <title id="title">Read Through: the cache layer handles a miss</title>
  <desc id="desc">Read downward. The application asks the cache layer for an item. On a miss the configured loader reads the database. The layer stores the returned value in the cache and returns it to the application. On a hit the layer returns the cached value without loading the database.</desc>
  <!-- Shared visual system: Arial text, blue requests, purple replies, and gray lifelines.
       Manual heads use one join convention for both horizontal directions. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212f; }
      .title { font-size: 30px; font-weight: 700; }
      .guide { font-size: 20px; fill: #475569; }
      .actor { font-size: 23px; font-weight: 700; }
      .message { font-size: 21px; }
      .action { font-size: 20px; }
      .footer { font-size: 20px; fill: #475569; }
      .lifeline { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 7; }
    </style>
  </defs>
  <!-- Heading and explicit sequence-reading guide. -->
  <rect id="background" width="1040" height="597" fill="#fff"/>
  <text x="32" y="47" class="title" text-anchor="start">Read Through: the cache layer handles a miss</text>
  <text x="32" y="81" class="guide" text-anchor="start">Read miss shown · top to bottom · solid: request; dashed: reply</text>
  <!-- Participant positions stay fixed across all five strategy diagrams. -->
  <g id="participants">
    <rect id="app-header" x="40" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="160" y="150" class="actor" text-anchor="middle">Application</text>
    <path id="app-lifeline" class="lifeline" d="M160 173V530"/>
    <rect id="cache-header" x="400" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="520" y="150" class="actor" text-anchor="middle">Cache + loader</text>
    <path id="cache-lifeline" class="lifeline" d="M520 173V530"/>
    <rect id="db-header" x="760" y="112" width="240" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="880" y="150" class="actor" text-anchor="middle">Database</text>
    <path id="db-lifeline" class="lifeline" d="M880 173V530"/>
  </g>
  <!-- Chronological messages and internal actions. -->
  <!-- lookup: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="lookup">
    <path id="lookup-shaft" data-connector="true" d="M165 220H503" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="lookup-head" points="515,220 501,213 501,227" fill="#0b78b5"/>
    <text x="340.0" y="203" class="message" text-anchor="middle">1 · Read item</text>
  </g>
  <!-- Local cache action; opaque fill keeps the lifeline away from the text. -->
  <g id="cache-miss">
    <rect x="378" y="242" width="284" height="44" rx="10" fill="#eff8fc" stroke="#9ccbdc" stroke-width="1.5"/>
    <text x="520" y="271" class="action" text-anchor="middle">Miss: item absent</text>
  </g>
  <!-- loader-read: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="loader-read">
    <path id="loader-read-shaft" data-connector="true" d="M525 326H863" fill="none" stroke="#0b78b5" stroke-width="2.5"/>
    <polygon id="loader-read-head" points="875,326 861,319 861,333" fill="#0b78b5"/>
    <text x="700.0" y="309" class="message" text-anchor="middle">2 · Load from database</text>
  </g>
  <!-- loaded-value: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="loaded-value">
    <path id="loaded-value-shaft" data-connector="true" d="M875 391H537" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="loaded-value-terminal-shaft" data-connector="true" d="M547 391H537" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="loaded-value-head" points="525,391 539,384 539,398" fill="#7c3aed"/>
    <text x="700.0" y="374" class="message" text-anchor="middle">3 · Value</text>
  </g>
  <!-- Local cache action; opaque fill keeps the lifeline away from the text. -->
  <g id="cache-fill">
    <rect x="378" y="415" width="284" height="44" rx="10" fill="#eff8fc" stroke="#9ccbdc" stroke-width="1.5"/>
    <text x="520" y="444" class="action" text-anchor="middle">Store value in cache</text>
  </g>
  <!-- return-value: tip stops 5 units before the lifeline; shaft joins inside the triangle base.
       A long application/database shaft intentionally crosses the cache lifeline without stopping. -->
  <g id="return-value">
    <path id="return-value-shaft" data-connector="true" d="M515 501H177" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Solid terminal segment keeps the dashed reply joined to its arrowhead. -->
    <path id="return-value-terminal-shaft" data-connector="true" d="M187 501H177" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon id="return-value-head" points="165,501 179,494 179,508" fill="#7c3aed"/>
    <text x="340.0" y="484" class="message" text-anchor="middle">4 · Value</text>
  </g>
  <!-- Outcome and the omitted branch or tradeoff. -->
  <g id="outcome">
    <text x="32" y="570" class="footer" text-anchor="start">On a cache hit, return the cached value without loading the database.</text>
  </g>
</svg>
