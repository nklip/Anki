<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1048" viewBox="0 0 1160 1048" role="img" aria-labelledby="title desc">
  <title id="title">Encoding changes representation; encryption hides data; signing lets you check it</title>
  <desc id="desc">Read four rows from left to right. Base64 converts secret to c2VjcmV0, and anyone can decode it back without a key. Symmetric encryption uses the same secret key to encrypt and decrypt. Asymmetric encryption uses the recipient's public key to encrypt and their matching private key to decrypt. Both encryption rows produce ciphertext and recover the original secret. Signing a readable message uses the signer's private key. Verification uses the message, signature, and signer's trusted public key and returns valid or invalid. Signing alone leaves the message readable.</desc>
  <!-- Shared typography and icons. Icon geometry comes from
       system design/15. Google Drive/images/file-sync.svg (#document and #lock).
       The document viewBox includes its full outer stroke to prevent clipping. -->
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:22px;fill:#486171}
      .heading{font-size:26px;font-weight:700}
      .label{font-size:22px;text-anchor:middle}
      .note{font-size:21px;fill:#365366}
      .code{font-family:Menlo,Consolas,monospace;font-size:27px;text-anchor:middle}
      .operation{font-size:22px;font-weight:700;text-anchor:middle}
      .key{font-size:20px;text-anchor:middle}
      .flow{fill:none;stroke:#176c92;stroke-width:2.5;stroke-linecap:butt}
      .head{fill:#176c92}
    </style>
    <symbol id="document" viewBox="-4 -4 96 104">
      <path d="M7 2H65L84 21V88Q84 94 76 94H8Q2 94 2 86V10Q2 2 7 2Z" fill="#fff" stroke="#08b4d3" stroke-width="8" stroke-linejoin="round"/>
      <path d="M65 2V22H84" fill="none" stroke="#08b4d3" stroke-width="8"/>
      <path d="M22 37H66M22 53H66M22 69H66" stroke="#08b4d3" stroke-width="7"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 92 104">
      <rect x="2" y="2" width="88" height="100" fill="#fff" stroke="#111" stroke-width="4"/>
      <path d="M31 43V30A15 15 0 0 1 61 30V43" fill="none" stroke="#111" stroke-width="5"/>
      <rect x="24" y="42" width="44" height="39" rx="3" fill="#050505"/>
      <circle cx="46" cy="58" r="4" fill="#fff"/>
      <path d="M46 60V70" stroke="#fff" stroke-width="3"/>
    </symbol>
  </defs>
  <!-- Canvas and reading instruction. -->
  <rect id="background" width="1160" height="1048" fill="#fff"/>
  <text class="title" x="30" y="44">Encoded, encrypted, or signed?</text>
  <text class="subtitle" x="30" y="77">Three different jobs. Read each row from left to right.</text>

  <!-- Encoding: the public representation has no secret key. -->
  <g id="encoding-row">
    <rect x="30" y="102" width="1100" height="190" rx="16" fill="#eff9fc" stroke="#9ccfdf" stroke-width="1.5"/>
    <text class="heading" x="54" y="139">1. Encode — change the representation</text>
    <use href="#document" x="65" y="189" width="48" height="52"/>
    <text class="code" x="186" y="224">secret</text>
    <rect x="470" y="190" width="250" height="60" rx="10" fill="#fff" stroke="#9ccfdf" stroke-width="1.5"/>
    <text class="code" x="595" y="229">c2VjcmV0</text>
    <use href="#document" x="913" y="189" width="48" height="52"/>
    <text class="code" x="1030" y="224">secret</text>
    <!-- Shafts end 2 units inside each triangle base; tips remain clear of nodes. -->
    <path id="encode-shaft" class="flow" data-connector="true" d="M273 220H450"/>
    <polygon class="head" points="462,220 448,212 448,228"/>
    <path id="decode-shaft" class="flow" data-connector="true" d="M730 220H884"/>
    <polygon class="head" points="896,220 882,212 882,228"/>
    <text class="operation" x="367" y="181">Base64 encode</text>
    <text class="operation" x="811" y="181">Base64 decode</text>
    <text class="note" x="54" y="275">No secret key. Anyone with the encoded value can recover the original bytes.</text>
  </g>

  <!-- Encryption: one symmetric key is required in both directions. -->
  <g id="encryption-row">
    <rect x="30" y="310" width="1100" height="206" rx="16" fill="#f1f5fb" stroke="#b1c4df" stroke-width="1.5"/>
    <text class="heading" x="54" y="347">2a. Symmetric encryption — keep the contents private</text>
    <use href="#document" x="65" y="389" width="48" height="52"/>
    <text class="code" x="186" y="424">secret</text>
    <rect x="470" y="380" width="250" height="77" rx="10" fill="#fff" stroke="#b1c4df" stroke-width="1.5"/>
    <use href="#lock" x="483" y="391" width="48" height="54"/>
    <text class="label" x="623" y="411">Ciphertext</text>
    <text class="key" x="623" y="438">encrypted bytes</text>
    <use href="#document" x="913" y="389" width="48" height="52"/>
    <text class="code" x="1030" y="424">secret</text>
    <path id="encrypt-shaft" class="flow" data-connector="true" d="M273 420H450"/>
    <polygon class="head" points="462,420 448,412 448,428"/>
    <path id="decrypt-shaft" class="flow" data-connector="true" d="M730 420H884"/>
    <polygon class="head" points="896,420 882,412 882,428"/>
    <text class="operation" x="367" y="390">Encrypt</text>
    <text class="key" x="367" y="457">secret key</text>
    <text class="operation" x="811" y="390">Decrypt</text>
    <text class="key" x="811" y="457">same secret key</text>
    <text class="note" x="54" y="494">The same secret key encrypts and decrypts. Both sides must keep it secret.</text>
  </g>

  <!-- Asymmetric encryption: the key pair belongs to the recipient.
       Two-line key labels fit below the connectors without entering the nodes. -->
  <g id="asymmetric-encryption-row">
    <rect x="30" y="534" width="1100" height="224" rx="16" fill="#f1f5fb" stroke="#b1c4df" stroke-width="1.5"/>
    <text class="heading" x="54" y="571">2b. Asymmetric encryption — keep the contents private</text>
    <use href="#document" x="65" y="613" width="48" height="52"/>
    <text class="code" x="186" y="648">secret</text>
    <rect x="470" y="604" width="250" height="77" rx="10" fill="#fff" stroke="#b1c4df" stroke-width="1.5"/>
    <use href="#lock" x="483" y="615" width="48" height="54"/>
    <text class="label" x="623" y="635">Ciphertext</text>
    <text class="key" x="623" y="662">encrypted bytes</text>
    <use href="#document" x="913" y="613" width="48" height="52"/>
    <text class="code" x="1030" y="648">secret</text>
    <path id="asymmetric-encrypt-shaft" class="flow" data-connector="true" d="M273 644H450"/>
    <polygon class="head" points="462,644 448,636 448,652"/>
    <path id="asymmetric-decrypt-shaft" class="flow" data-connector="true" d="M730 644H884"/>
    <polygon class="head" points="896,644 882,636 882,652"/>
    <text class="operation" x="367" y="614">Encrypt</text>
    <text class="key" x="367" y="681">recipient's</text>
    <text class="key" x="367" y="705">public key</text>
    <text class="operation" x="811" y="614">Decrypt</text>
    <text class="key" x="811" y="681">recipient's</text>
    <text class="key" x="811" y="705">private key</text>
    <text class="note" x="54" y="741">Use the recipient's verified public key to encrypt; only their matching private key decrypts.</text>
  </g>

  <!-- Signing: the message stays readable; verification produces a decision.
       The signature is a separate value, represented by the labeled chip.
       Shift this complete row together to preserve its reviewed internal spacing. -->
  <g id="signature-row" transform="translate(0 242)">
    <rect x="30" y="534" width="1100" height="242" rx="16" fill="#f7f3fc" stroke="#c9b8e1" stroke-width="1.5"/>
    <text class="heading" x="54" y="571">3. Sign — check the source and detect changes</text>
    <use href="#document" x="65" y="618" width="48" height="52"/>
    <text class="label" x="185" y="637">Readable</text>
    <text class="label" x="185" y="665">message</text>
    <rect x="470" y="603" width="250" height="92" rx="10" fill="#fff" stroke="#c9b8e1" stroke-width="1.5"/>
    <use href="#document" x="487" y="617" width="48" height="52"/>
    <text class="label" x="623" y="632">Message</text>
    <rect x="550" y="648" width="145" height="31" rx="6" fill="#ebe2f7"/>
    <text class="key" x="623" y="671">+ signature</text>
    <rect x="910" y="619" width="194" height="60" rx="10" fill="#fff" stroke="#c9b8e1" stroke-width="1.5"/>
    <text class="label" x="1007" y="657">Valid / invalid</text>
    <path id="sign-shaft" class="flow" data-connector="true" d="M273 649H450"/>
    <polygon class="head" points="462,649 448,641 448,657"/>
    <path id="verify-shaft" class="flow" data-connector="true" d="M730 649H884"/>
    <polygon class="head" points="896,649 882,641 882,657"/>
    <text class="operation" x="367" y="619">Sign</text>
    <text class="key" x="367" y="692">signer's private key</text>
    <text class="operation" x="811" y="619">Verify</text>
    <text class="key" x="811" y="692">signer's public key</text>
    <text class="note" x="54" y="733">Signing alone leaves the message readable. A changed message fails the original signature check.</text>
    <text class="note" x="54" y="761">To identify the signer, also check that the public key really belongs to them.</text>
  </g>
</svg>
