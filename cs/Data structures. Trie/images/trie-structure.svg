<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="790" viewBox="0 0 1202 790" role="img" aria-labelledby="title desc">
  <title id="title">Before: tr is a prefix only</title>
  <desc id="desc">Read downward from the empty root, adding one character per step. Black outlines mark prefixes that are not stored words; solid teal outlines mark stored words. The tr node is unmarked, but tree, true, and try are stored words. Numbers are example search frequencies.</desc>
  <!-- Reusable nodes and reliable connector arrowheads. -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#111"/></marker>
    <!-- Border alignment hides the shaft inside the original triangular head.
         Adjusted endpoints include its 2.5-unit projection and half the target stroke. -->
    <marker id="border-arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="9.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#111"/></marker>
    <style>.node{fill:#fff;stroke:#111;stroke-width:1.7}.terminal{fill:#fff;stroke:#55afa4;stroke-width:4.5}.edge{fill:none;stroke:#111;stroke-width:1.7;marker-end:url(#arrow)}.t{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:23px;text-anchor:middle}</style>
  </defs>
  <rect width="1202" height="790" fill="#fff"/>
  <!-- Visible lesson title; the original tree remains in place below it. -->
  <text class="t" x="38" y="34" style="text-anchor:start;font-size:26px;font-weight:700">Before: tr is a prefix only</text>
  <text class="t" x="38" y="72" style="text-anchor:start;font-size:21px">Its node exists; its word-ending marker is off.</text>
  <!-- Root annotation and first character branches. -->
  <rect class="node" x="576" y="60" width="128" height="64" rx="10"/>
  <path class="edge" style="marker-end:url(#border-arrow)" d="M800 92 H707.35"/><text class="t" x="830" y="100" text-anchor="start">root</text>
  <path class="edge" d="M640 124 L418 202"/><path class="edge" d="M640 124 L878 202"/>
  <rect class="node" x="354" y="202" width="128" height="64" rx="10"/><text class="t" x="418" y="243">t</text>
  <rect class="node" x="814" y="202" width="128" height="64" rx="10"/><text class="t" x="878" y="243">w</text>
  <!-- Intermediate prefixes. -->
  <path class="edge" d="M418 266 L292 329"/><path class="edge" d="M418 266 L648 329"/><path class="edge" style="marker-end:url(#border-arrow)" d="M878 266 V325.65"/>
  <rect id="tr-node" class="node" x="228" y="329" width="128" height="64" rx="10"/><text class="t" x="292" y="370">tr</text>
  <rect class="node" x="584" y="329" width="128" height="64" rx="10"/><text class="t" x="648" y="370">to</text>
  <rect class="node" x="814" y="329" width="128" height="64" rx="10"/><text class="t" x="878" y="370">wi</text>
  <!-- Prefix expansion and terminal frequency nodes. -->
  <path class="edge" d="M292 393 L102 503"/><path class="edge" style="marker-end:url(#border-arrow)" d="M292 393 V499.65"/><path class="edge" d="M292 393 L465 503"/>
  <path class="edge" style="marker-end:url(#border-arrow)" d="M648 393 V498.25"/><path class="edge" style="marker-end:url(#border-arrow)" d="M878 393 V499.65"/><path class="edge" d="M878 393 L1049 503"/>
  <rect class="node" x="38" y="503" width="128" height="64" rx="10"/><text class="t" x="102" y="544">tre</text>
  <rect class="node" x="228" y="503" width="128" height="64" rx="10"/><text class="t" x="292" y="544">tru</text>
  <rect class="terminal" x="401" y="503" width="128" height="64" rx="10"/><text class="t" x="465" y="544">try: 29</text>
  <rect class="terminal" x="584" y="503" width="128" height="64" rx="10"/><text class="t" x="648" y="544">toy: 14</text>
  <rect class="node" x="814" y="503" width="128" height="64" rx="10"/><text class="t" x="878" y="544">wis</text>
  <rect class="terminal" x="985" y="503" width="128" height="64" rx="10"/><text class="t" x="1049" y="544">win: 50</text>
  <!-- Final words continue vertically from their prefixes. -->
  <path class="edge" style="marker-end:url(#border-arrow)" d="M102 567 V625.25"/><path class="edge" style="marker-end:url(#border-arrow)" d="M292 567 V625.25"/><path class="edge" style="marker-end:url(#border-arrow)" d="M878 567 V625.25"/>
  <rect class="terminal" x="38" y="630" width="128" height="64" rx="10"/><text class="t" x="102" y="671">tree: 10</text>
  <rect class="terminal" x="228" y="630" width="128" height="64" rx="10"/><text class="t" x="292" y="671">true: 35</text>
  <rect class="terminal" x="814" y="630" width="128" height="64" rx="10"/><text class="t" x="878" y="671">wish: 25</text>
  <!-- Legend distinguishes a prefix-only node from a stored word. -->
  <g id="legend">
    <rect class="node" x="40" y="738" width="42" height="28" rx="6"/>
    <text class="t" x="98" y="760" style="text-anchor:start;font-size:22px">Prefix only</text>
    <rect class="terminal" x="306" y="738" width="42" height="28" rx="6"/>
    <text class="t" x="364" y="760" style="text-anchor:start;font-size:22px">Stored word</text>
    <text class="t" x="588" y="760" style="text-anchor:start;font-size:22px">Number = example search frequency</text>
  </g>
</svg>
