<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">STAR Action: explain what you did and why</title>
  <desc id="desc">Action is the third part of the STAR interview method: Situation, Task, Action, Result. A fictional software interview example compares the vague statement We improved the tests with the speaker's own work: measuring slow tests, removing repeated setup of unchanged data, and rerunning the full suite. Measuring first targets the bottleneck, while retaining all tests. Explain your own contribution and reasoning, and credit teammates for their work.</desc>

  <!-- Shared STAR template; red and green distinguish vague and clearer interview examples. -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .example { font-size: 24px; }
      .copy { font-size: 19px; fill: #334155; }
      .arrow-label { font-size: 18px; font-weight: 700; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>

  <!-- Define STAR locally and identify the stage before labeling the example as fictional. -->
  <g id="heading">
    <text class="eyebrow" x="50" y="34">STAR = SITUATION · TASK · ACTION · RESULT</text>
    <text class="title" x="50" y="79">A — Action: explain what you did and why</text>
    <text class="subtitle" x="50" y="111">What did you personally do, and why did you choose that approach?</text>
    <text class="eyebrow" x="50" y="154">FICTIONAL SOFTWARE INTERVIEW EXAMPLE</text>
  </g>

  <!-- Read from the weak answer on the left to specific actions and reasoning on the right. -->
  <g id="weak-action">
    <rect x="50" y="179" width="470" height="214" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text class="panel-title" x="76" y="214" style="fill:#b91c1c">Weak answer</text>
    <text class="example" x="76" y="268">“We improved the tests.”</text>
    <text class="copy" x="76" y="331">Your contribution is unclear.</text>
    <text class="copy" x="76" y="359">No decisions or reasons.</text>
  </g>

  <!-- Three quote lines leave room for the reasoning within the shared panel dimensions. -->
  <g id="specific-action">
    <rect x="630" y="179" width="520" height="214" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text class="panel-title" x="656" y="214" style="fill:#166534">Specific answer</text>
    <text class="example" x="656" y="248">
      <tspan x="656" dy="0">“I measured the slow tests, removed</tspan>
      <tspan x="656" dy="32">repeated setup of unchanged data,</tspan>
      <tspan x="656" dy="32">and reran the full suite.”</tspan>
    </text>
    <text class="copy" x="656" y="347">Why: measure first to find the bottleneck.</text>
    <text class="copy" x="656" y="375">Keep every test while improving speed.</text>
  </g>

  <!-- Shared revision arrow: shaft stops under its triangle; tip meets the right panel's outer border. -->
  <g id="make-action-specific">
    <text class="arrow-label" x="575" y="234">Explain</text>
    <text class="arrow-label" x="575" y="259">your part</text>
    <line id="action-arrow-shaft" data-connector="true" x1="522" y1="284" x2="613" y2="284" stroke="#64748b" stroke-width="3"/>
    <polygon id="action-arrow-head" points="629,284 612,275 612,293" fill="#64748b"/>
  </g>

  <!-- The takeaway emphasizes ownership without claiming teammates' contributions. -->
  <g id="takeaway">
    <rect x="50" y="418" width="1100" height="68" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="76" y="447" font-size="22" font-weight="700">Show your contribution and reasoning.</text>
    <text class="subtitle" x="76" y="474">Avoid vague “we” statements or tool lists. Explain your part and credit teammates for theirs.</text>
  </g>
</svg>
